# Problem-Fixer Wave 1 — dispatch autonomous repair agents from GitHub.
# Uses the CURSOR_API_KEY repo secret, so the laptop does not need to stay on.
name: Problem-Fixer Wave 1

on:
  workflow_dispatch:
    inputs:
      fixes:
        description: "Fix selector (e.g. 1-12, or 3,8,10)"
        required: false
        default: "1-12"
        type: string
      force:
        description: "Re-dispatch fixes that already have a dispatch record"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Preview only, do not call the Cursor API"
        required: false
        default: false
        type: boolean
      model:
        description: "Optional Cursor model override"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  dispatch-problem-fixers:
    name: Dispatch Problem-Fixer Agents
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install cursor-sdk || true
      - name: Validate fixer queue and prompts
        run: |
          python3 morphoeval/problem_fixer.py self-test
          python3 morphoeval/problem_fixer.py dispatch --fixes "${{ inputs.fixes }}" --dry-run
      - name: Doctor (account gates)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: python3 morphoeval/cloud_orchestrator.py doctor --repo "${{ github.repository }}"
      - name: Dispatch fixers
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          ARGS=("dispatch" "--fixes" "${{ inputs.fixes }}" "--repo" "${{ github.repository }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=("--dry-run"); fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=("--force"); fi
          if [ -n "${{ inputs.model }}" ]; then ARGS+=("--model" "${{ inputs.model }}"); fi
          python3 morphoeval/problem_fixer.py "${ARGS[@]}"
      - name: Upload dispatch records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problem-fixer-dispatch-${{ github.run_id }}
          path: morphoeval/cloud/dispatches/problem-fixer-*.json
          if-no-files-found: ignore
      - name: Commit dispatch records
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphoeval/cloud/dispatches/problem-fixer-*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Problem-Fixer Wave 1: dispatch records for fixes ${{ inputs.fixes }}"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break || sleep 15; done
          else
            echo "No dispatch records to commit."
          fi
