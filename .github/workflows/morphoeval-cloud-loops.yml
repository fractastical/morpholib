# .github/workflows/morphoeval-cloud-loops.yml
# =============================================================================
# Autonomous Cloud Orchestrator — Dispatches Cursor Cloud Agents (`cursor-sdk`
# / `/v0/agents`) on a recurring cron schedule or manual workflow_dispatch
# while your laptop is offline.
#
# Each Cloud Agent executes all 12 steps (including Step 1 `scout_literature.py`)
# on its own isolated branch `morphoeval/loop-<NNN>-<slug>` and opens a PR
# touching ONLY unique per-loop files (zero conflicts across all 100 PRs).
# =============================================================================

name: MorphoEval 100-Loop Cloud Orchestrator

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of next pending slots to launch in this wave"
        required: false
        default: "5"
        type: string
      slots:
        description: "Optional explicit slot range (e.g. '1-10' or '1,5,12'); overrides count"
        required: false
        default: ""
        type: string
      model:
        description: "Optional model slug override for Cursor Cloud Agents"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry-run only (preview prompts & branches without calling Cursor API)"
        required: false
        default: false
        type: boolean

  # Runs every 2 hours to top up waves of Cloud Agents until all 100 slots are complete
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch-cloud-loops:
    name: Dispatch Cursor Cloud Agent Wave
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install orchestrator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install cursor-sdk || true

      - name: Inspect 100-Loop Campaign Status
        run: |
          python3 morphoeval/cloud_orchestrator.py status --limit 100

      - name: Dispatch Next Wave of Cursor Cloud Agents
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          ARGS=("dispatch" "--repo" "${{ github.repository }}")
          if [ -n "${{ inputs.slots }}" ]; then
            ARGS+=("--slots" "${{ inputs.slots }}")
          else
            COUNT="${{ inputs.count || '5' }}"
            ARGS+=("--count" "$COUNT")
          fi
          if [ -n "${{ inputs.model }}" ]; then
            ARGS+=("--model" "${{ inputs.model }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$CURSOR_API_KEY" ]; then
            echo "Running in --dry-run mode (set CURSOR_API_KEY repo secret for live dispatch)"
            ARGS+=("--dry-run")
          fi
          python3 morphoeval/cloud_orchestrator.py "${ARGS[@]}"

      - name: Upload dispatch manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-dispatch-records-${{ github.run_id }}
          path: morphoeval/cloud/dispatches/
          if-no-files-found: ignore
