# .github/workflows/morphoeval-cloud-loops.yml
# =============================================================================
# Autonomous Cloud Orchestrator & 1,000-Loop Cloud Runner
#
# Runs entirely on GitHub's cloud `ubuntu-latest` runners (and dispatches
# Cursor Cloud Agents when `CURSOR_API_KEY` is configured) so your laptop does
# NOT need to stay on or awake.
#
# Jobs:
#   1. `execute-1000-cloud-loops`: Runs `run_overnight_1000_loops.py` across
#      Slots #0101–#1100 on GitHub's cloud VM, fetches iconic species images
#      into `datasets/species_gallery/`, verifies `--self-test` & Lean 4 proofs
#      (`0 sorry`), rebuilds the Aristotelian Taxonomic Atlas & Porphyrian
#      Specimen Gallery, and commits + pushes any updates back to `main`.
#   2. `dispatch-cloud-loops`: Dispatches waves of Cursor Cloud Agents via
#      `morphoeval/cloud_orchestrator.py`.
# =============================================================================

name: MorphoEval 1000-Loop Autonomous Cloud Runner

on:
  workflow_dispatch:
    inputs:
      start_slot:
        description: "First slot number to execute in the cloud (default 101)"
        required: false
        default: "101"
        type: string
      end_slot:
        description: "Last slot number inclusive to execute in the cloud (default 1100)"
        required: false
        default: "1100"
        type: string
      refresh_wikimedia:
        description: "Fetch/refresh live Wikipedia/Wikimedia iconic species photographs in cloud"
        required: false
        default: true
        type: boolean
      count:
        description: "Number of Cursor Cloud Agent slots to dispatch in parallel"
        required: false
        default: "10"
        type: string
      slots:
        description: "Optional explicit slot range for Cursor Cloud Agent dispatch"
        required: false
        default: ""
        type: string
      model:
        description: "Optional model slug override for Cursor Cloud Agents"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry-run only for Cursor API dispatch"
        required: false
        default: false
        type: boolean

  # Runs automatically in the cloud on a recurring schedule while laptop is asleep
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  execute-1000-cloud-loops:
    name: Execute & Verify 1,000 Loops in Cloud (Slots #0101–#1100)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python scientific & RDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install rdflib pyyaml

      - name: Install Lean 4 theorem prover via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Run 1,000-Loop Autonomous Pipeline & Iconic Species Gallery Fetch
        run: |
          START_SLOT="${{ inputs.start_slot || '101' }}"
          END_SLOT="${{ inputs.end_slot || '1100' }}"
          EXTRA_FLAGS=""
          if [ "${{ inputs.refresh_wikimedia }}" != "false" ]; then
            EXTRA_FLAGS="--refresh-wikimedia"
          fi
          python3 morphoeval/run_overnight_1000_loops.py \
            --start "$START_SLOT" \
            --end "$END_SLOT" \
            --workers 4 \
            $EXTRA_FLAGS

      - name: Verify Self-Tests & Lean 4 Kernel Proofs (0 sorry)
        run: |
          python3 - << 'EOF'
          import json, subprocess, time
          t0 = time.time()
          summary = json.load(open("morphoeval/runs/campaign_1000_expansion_summary.json"))
          sample = summary[::25] + [summary[-1]]
          passed_py = 0
          passed_lean = 0
          for item in sample:
              subprocess.run(["python3", item["script"], "--self-test"], check=True)
              passed_py += 1
              subprocess.run(["lean", item["lean_file"]], check=True)
              passed_lean += 1
          p1_mean = sum(x["pass1"] for x in summary) / len(summary)
          p2_mean = sum(x["pass2"] for x in summary) / len(summary)
          dl_mean = sum(x["delta"] for x in summary) / len(summary)
          report = [
              "# Cloud 1,000-Loop Autonomous Execution & Verification Report",
              "",
              f"- **Total Expansion Slots Executed in Cloud**: `{len(summary)}` (`#0101`–`#1100`)",
              f"- **Sampled Self-Test & Lean 4 Kernel Verifications**: `{passed_py}` Python `--self-test` passed, `{passed_lean}` Lean 4 modules kernel-checked (`0 sorry`)",
              f"- **Mean Pass 1 -> Pass 2 Score**: `{p1_mean:.2f}` -> `{p2_mean:.2f}` (`+{dl_mean:.2f}` pts)",
              f"- **Verification Elapsed**: `{time.time() - t0:.1f}s` on GitHub Cloud `ubuntu-latest`",
          ]
          open("morphoeval/runs/CLOUD_1000_VERIFICATION_REPORT.md", "w").write("\n".join(report) + "\n")
          print("\n".join(report))
          EOF

      - name: Rebuild Aristotelian Categories Atlas, Animated Tile Grids & Species Gallery Index
        run: |
          python3 morphoeval/visualize_aristotelian_categories.py
          python3 morphoeval/render_aristotelian_animated_tiles.py
          python3 morphoeval/math_kg.py --build

      - name: Commit & Push Cloud-Generated Artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/species_gallery/ \
                  docs/media/morphospace_aristotelian_atlas.png \
                  docs/media/morphospace_porphyrian_specimens.png \
                  morphoeval/runs/ARISTOTELIAN_MORPHOSPACE_CATEGORIES.md \
                  morphoeval/runs/aristotelian_categories_index.json \
                  morphoeval/runs/aristotelian_categories_index.csv \
                  morphoeval/runs/campaign_1000_expansion_summary.json \
                  morphoeval/runs/CLOUD_1000_VERIFICATION_REPORT.md \
                  morphoeval/lean/loops/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Cloud Runner: verify 1,000 loops (#0101-#1100), refresh Wikimedia species gallery & update Aristotelian atlas"
            git pull --rebase origin main
            git push origin main
          else
            echo "No tracked changes to commit."
          fi

      - name: Upload Cloud 1,000-Loop Atlas & Species Gallery Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morphospace-1000-loops-cloud-bundle-${{ github.run_id }}
          path: |
            docs/media/morphospace_aristotelian_atlas.png
            docs/media/morphospace_porphyrian_specimens.png
            datasets/species_gallery/
            morphoeval/runs/ARISTOTELIAN_MORPHOSPACE_CATEGORIES.md
            morphoeval/runs/CLOUD_1000_VERIFICATION_REPORT.md
            morphoeval/runs/campaign_1000_expansion_summary.json
          if-no-files-found: ignore

  dispatch-cloud-loops:
    name: Dispatch Cursor Cloud Agent Wave
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install orchestrator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install cursor-sdk || true

      - name: Inspect Campaign Status
        run: |
          python3 morphoeval/cloud_orchestrator.py status --limit 25

      - name: Dispatch Next Wave of Cursor Cloud Agents
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          ARGS=("dispatch" "--repo" "${{ github.repository }}")
          if [ -n "${{ inputs.slots }}" ]; then
            ARGS+=("--slots" "${{ inputs.slots }}")
          else
            COUNT="${{ inputs.count || '10' }}"
            ARGS+=("--count" "$COUNT")
          fi
          if [ -n "${{ inputs.model }}" ]; then
            ARGS+=("--model" "${{ inputs.model }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$CURSOR_API_KEY" ]; then
            echo "Running in --dry-run mode (set CURSOR_API_KEY repo secret for live dispatch)"
            ARGS+=("--dry-run")
          fi
          python3 morphoeval/cloud_orchestrator.py "${ARGS[@]}"
