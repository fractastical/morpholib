          (1985) coupled cell conservation PDE (with biharmonic diffusion -D_2*nabla^4 n and
          passive ECM advection -div(n*v_ecm)) and viscoelastic Kelvin-Voigt ECM force balance
          with contact-inhibited cell traction tau*n^2/(1+lam*n^2) (L108-278), reproducing the
          exact critical traction bifurcation threshold tau_c = 1.2776 at k_c = 0.9602
          (lambda_c = 6.5435) and verified by 3 machine-checked Lean 4 theorems (0 sorrys) in
          `morphoeval/lean/loops/Loop_013_mechanochemical_chondrogenesis.lean`.
        evidence:
