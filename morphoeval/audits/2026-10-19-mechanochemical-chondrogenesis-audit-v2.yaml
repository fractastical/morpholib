          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [185, 278], note: "Coupled 1D spectral-pseudospectral cell-ECM PDE solver reproducing modes [0, 1, 2, 4, 5]", supports: true}
          - {file: morphoeval/lean/loops/Loop_013_mechanochemical_chondrogenesis.lean, lines: [22, 97], note: "3 machine-checked Lean 4 theorems (0 sorrys) for traction instability, contact-inhibited saturation, and 1->2->4->5 limb branching", supports: true}
