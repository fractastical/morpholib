# MorphoEval audit — Chirat, Moulton & Goriely (2013) PNAS & Erlich et al. (2016) Mollusc Shell Marginal Buckling, 2026-10-19 (v3)
#
# Pass 3 (remediation round) re-score of `2013-chirat-mollusc-shell-marginal-buckling.py` (v3, 2387 lines) after the
# instrumented loop `morphoeval/runs/2026-10-19-mollusc-shell-marginal-buckling-loop-pass3` closed both open v2
# remediation items, superseding `2026-10-19-mollusc-shell-marginal-buckling-audit-v2` (91.3).
#   - Primary assessor: Claude Fable 5.1 (Phase B audit subagent, reading the Phase A handoff, the diff and the
#     current file; line numbers verified against commit e651a8b8 working tree)
#   - Second assessor: rubric verification pass of the same agent family (no independent blinded run this pass)
#
# What Pass 3 changed (both v2 remediation items):
#   1. Hollow tubular Murex spine self-contact closure — closed with an explicitly REDUCED model, not the requested
#      3D finite-strain morphoelastic FEM: planar inextensible Euler-elastica cross-section of a growing spine fold
#      (arc length L = W(1+eps), clamped flank roots at W = 6 mm, end-position penalty, pairwise self-contact penalty
#      at wall thickness t = 0.35 mm, analytic gradients, L-BFGS-B, continuation in eps)
#      (`relax_spine_cross_section_elastica` L511-644, `evaluate_spine_closure_sweep` L647-729,
#      `build_hollow_spine_tube_surface` L732-743). Small-strain law A = (2/pi) sqrt(W dL): r = 0.99999;
#      eps_close = 4.81 at M = 96 (5.00 at M = 160/224); gap/t after contact 0.9997.
#   2. Predator-induced marginal damage + localized mantle repair — `relax_winkler_mantle_margin` (L221-359) gained a
#      heterogeneous foundation k(s) (spectral EI d4 + P d2 via FFT, real-space k(s) w) and a template-memory `w_init`;
#      `simulate_damage_repair_trajectory` (L748-889) runs 14 accretionary stations r in [28, 55] mm with a chipped
#      sector at station 4 and an exponentially decaying callus; `evaluate_damage_repair` (L892-979) and
#      `evaluate_repair_outcome_phase_diagram` (L982-1034) give adult N = 14 in register (registry error 0.000 lambda,
#      scar index 0.27 -> 0.030) and a 5 x 4 (chip x rho) rib-intercalation phase diagram.
#   3. 3 new Lean 4 theorems (7 total, 0 sorry): `chirat_repair_callus_raises_critical_load`,
#      `erlich_repair_in_register_rib_count`, `chirat_spine_self_contact_closure_monotone`.
#   4. New SHA-256-pinned reference table `pass3_spine_closure_damage_repair_reference.json` (5 verified files),
#      `pass3_citations.bib` (Vermeij 1987), README "Pass 3 Additions"; 3 x 3 synthesis PNG (panels G-I new),
#      new 3D PNG and 14-frame damage/repair GIF; self-test 8 -> 12 checks; measure_morphoeval 9 -> 16 measurements.
#
# Why the overall score goes DOWN (91.3 -> 87.0, weighted) even though both items were closed: this round looked one layer
# deeper and found defects the v2 audit did not penalise — the wild-type EI = 1.085 mN mm^2 is back-fitted to the
# rib count and contradicts the vendored JSON (0.18 / 1.79), the 12-species "collapse" regresses lambda_obs against
# parameters that were set from lambda_obs (a tautology), the Winkler solver never reaches its tolerance and exits at
# maxiter, the three new Pass 3 reference values are model-internal (mesh convergence, rounding heuristic,
# consistency check) rather than empirical, and the slot's dispatch/telemetry metadata still carry the wrong
# paper (Lenoci & Camp 2008 diatom biosilica). Scores are uncalibrated criterion-referenced scores on the rubric's
# 0-100 scale. Line numbers refer to the working-tree files at commit e651a8b8.

