simulations:
  - id: chirat-mollusc-shell-marginal-buckling
    name: "Chirat, Moulton & Goriely (2013) & Erlich et al. (2016) mollusc shell marginal buckling, hollow-spine closure and predator damage / mantle repair"
    organism: "Pecten jacobaeus (Mediterranean scallop / Bivalvia, Ammonitida & Brachiopoda); Murex hollow spines (Gastropoda)"
    script: 2013-chirat-mollusc-shell-marginal-buckling.py
    output: docs/media/mollusc_shell_marginal_buckling_comparison.png
    extra_outputs:
      - docs/media/mollusc_shell_marginal_buckling_growth.gif
      - docs/media/mollusc_shell_marginal_buckling_spine_closure_repair_3d.png
      - docs/media/mollusc_shell_marginal_buckling_damage_repair.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-mollusc-shell-marginal-buckling-audit-v2
    source_refs:
      - chirat2013
      - erlich2016
      - moulton2012
      - rudraraju2019
      - vermeij1987
    claim_boundary:
      reported_in_source:
        - "Chirat, Moulton & Goriely (2013): the mantle margin is an elastic beam on the Winkler foundation of the calcified shell edge; compressive growth thrust P above P_c = 2 sqrt(EI k) buckles it at lambda_c = 2 pi (EI/k)^(1/4), and hollow spines form where the buckled fold grows faster than its base"
        - "Erlich et al. (2016): isometric vs rib-intercalating antimarginal ornamentation follows from whether lambda_c scales with the margin length (constant N) or stays fixed (N grows)"
        - "Rudraraju et al. (2019): a 3D finite-strain morphoelastic shell FEM with surface and volume growth reproduces spine formation and closure"
        - "Vermeij (1987): durophagous predators chip shell margins; molluscs repair the break and leave repair scars"
      reconstructed_in_script:
        - "Spectral L-BFGS-B minimisation of the fourth-order nonlinear Winkler-beam energy on a periodic margin (Pass 2), now with heterogeneous foundation k(s) and template-memory warm start; pitchfork amplitude law and subcritical control; 3D accretionary valve synthesis across 4 regimes; 12-species quarter-power regression; Pecten specimen costae segmentation; (Pass 3) planar inextensible elastica cross-section of a hollow spine fold with self-contact penalty, continuation in growth excess eps, and stacking into a tube surface; (Pass 3) 14-station damage/repair accretionary trajectory, scar index, healing-length fit, registry error, 5 x 4 chip-size x callus-stiffness outcome phase diagram"
      transfer_boundary:
        - "The hollow-spine closure model is a 2D cross-section elastica with prescribed base width W = 6 mm and wall thickness t = 0.35 mm; there is no out-of-plane coupling between cross-sections, no shell stretching energy and no growth tensor, so eps_close = 4.81 is a reduced-model number and its reference value (5.00) is mesh convergence of the same model, not a Murex measurement"
        - "The repair callus stiffness ratio rho = 1.15 and decay length l_heal = 7 mm are prescribed, not measured; the critical chip arc 1.97 lambda is compared with a half-integer rounding heuristic (1.5 lambda), not a published repair-scar statistic"
        - "EI = 1.085 mN mm^2 for Pecten is the value that makes lambda_c = 8.7766 mm give exactly 14 ribs over L = 122.87 mm; the vendored JSON default_parameters.EI_mN_mm2 is 0.18 and the Adult_V ontogenetic stage is 1.79, so the wild-type calibration is self-referential"
      does_not_claim:
        - "A 3D finite-strain morphoelastic shell finite-element solution (Rudraraju et al. 2019), emergent spine base width or wall thickness, measured repair-callus mechanics, free-edge (non-periodic) margin boundary conditions, or an independent empirical closure strain for Murex spines"
    summary: >-
      Pass 3 (v3) remediated evaluation of `2013-chirat-mollusc-shell-marginal-buckling.py`
      (weighted 87.0/100, down from 91.3 in Pass 2 because this round penalises defects the v2
      audit did not). Both v2 remediation items are closed: hollow-spine self-contact closure by a
      reduced planar elastica with contact penalty (`relax_spine_cross_section_elastica` L511-644,
      `evaluate_spine_closure_sweep` L647-729; small-strain law r = 0.99999, eps_close = 4.81, gap/t
      after contact 0.9997), and predator chip + mantle repair by a heterogeneous-foundation
      Winkler trajectory with template memory (`simulate_damage_repair_trajectory` L748-889,
      `evaluate_damage_repair` L892-979, `evaluate_repair_outcome_phase_diagram` L982-1034; adult
      N = 14 in register, registry error 0.000 lambda, scar index 0.27 -> 0.030, defects from chips
      >= 1.97 lambda at rho = 1). 7 Lean theorems (3 new, 0 sorry), 12 self-test checks, 16
      measurements, 5 SHA-256-pinned dataset files. Newly exposed defects: back-fitted EI = 1.085
      vs JSON 0.18 / 1.79; tautological 12-species collapse; Winkler solver always exits at
      maxiter; Pass 3 reference values are model-internal; dispatch/telemetry metadata still name
      the wrong paper (Lenoci & Camp 2008 diatom biosilica); stale "8-check" CLI help.
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          The Pass 2 core is intact: exact fourth-order nonlinear Winkler-beam energy minimised by
          spectral L-BFGS-B (`relax_winkler_mantle_margin`, L221-359) with P_c = 2 sqrt(EI k),
          lambda_c = 2 pi (EI/k)^(1/4) and the supercritical pitchfork law (L164-202). Pass 3 adds a
          physically honest reduced model of spine closure — an inextensible planar elastica with
          clamped roots, end penalty and pairwise self-contact penalty, continuation in eps, and the
          small-strain amplitude law A = (2/pi) sqrt(W dL) recovered to r = 0.99999 (L511-729) — and
          a heterogeneous-foundation extension with template memory that keeps the default path
          bitwise identical (L244-252, L292-298). Deductions: the requested 3D finite-strain
          morphoelastic FEM was not built; the elastica has no out-of-plane coupling, stretching
          energy or growth tensor, and W, t are prescribed (-4); the solver never converges to its
          ftol = 1e-16 / gtol = 1e-13 tolerances and always exits at maxiter (L310, L357), so the
          "equilibria" are iteration-count-limited (-3); the periodic FFT margin on [0, L) is applied
          to an open valve fan, which makes an intercalated rib slide the whole pattern (L234, L263,
          L328) (-2); the `antimarginal_intercalating_multicostate` and `cancellate_spiny_episodic_varix`
          rib fields are prescribed cosines rather than solver output and `n_ribs_adult = 2 n_base - 0.5`
          is hard-coded (L364-459, L435) (-3); EI = 1.085 is back-fitted to the rib count rather than
          derived from mantle mechanics (L224, L473) (-2).
        evidence:
          - {file: 2013-chirat-mollusc-shell-marginal-buckling.py, lines: [164, 202], note: "Analytical P_c, lambda_c and pitchfork amplitude law", supports: true}
          - {file: 2013-chirat-mollusc-shell-marginal-buckling.py, lines: [221, 359], note: "Spectral L-BFGS-B Winkler-beam minimiser; Pass 3 k_profile (real-space k(s) w) and w_init template memory; ftol 1e-16 / gtol 1e-13 at L310 are never met, n_iterations == maxiter at L357", supports: true}
          - {file: 2013-chirat-mollusc-shell-marginal-buckling.py, lines: [511, 644], note: "Reduced planar inextensible elastica with clamped roots, end penalty mu_end = 400 and pairwise self-contact penalty; analytic gradients; W, t prescribed", supports: true}
