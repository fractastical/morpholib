simulations:
  - id: delphi10000-cavia-porcellus-turing-wavelength-s0
    name: "Cavia porcellus Holocene (0 Ma) Turing wavelength at 126.7 µm (tier-5 detail s0)"
    organism: "Cavia porcellus (Guinea pig), I. Enaima (Vertebrata) -> Mammalia (Zootoka) -> Cavia"
    script: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py
    output: docs/media/cavia_porcellus_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/cavia_porcellus_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-cavia-porcellus-turing-wavelength-s0-audit
    claim_boundary:
      reported_in_source:
        - "Turing (1952) finite-k instability and Murray (1981) coat-pattern wavelength selection."
        - "Schnakenberg (1979) activator-substrate kinetics and the Swift-Hohenberg (1977) amplitude equation as the normal form of a Turing bifurcation (Cross & Hohenberg 1993)."
        - "Sick et al. (2006) mammalian follicle-spacing reaction-diffusion, the anatomical scale neighbour of this 126.7 µm slot."
      reconstructed_in_script:
        - "Diffusivities scaled so lambda_c = 126.7 µm. sigma(k_c) = 0.3006 > 0 and sigma(0) = -0.3215 < 0."
        - "Charge sweep m = 1, 2, 3 and seeds 3141-3144 all fall in radial bin k = 0.9856 (lambda = 128.55 µm). The bin width, not a continuous estimator, sets the ensemble CV to 0."
        - "Substrate sweep at fixed D: lambda_c(0.20) = 176.95 µm and the homogeneous state restabilizes for b >= 2.5."
        - "Gallery segmentation: 110 px = 100 µm, dominant wavelength 78.18 µm, orientation KS 0.077 against the spiral, radial-spectrum cosine 0.987."
      transfer_boundary:
        - "126.7 µm and age 0 Ma are the slot assignment for the single Holocene Cavia node. Predecessor tier 1267 µm holds exactly 10 s0 waves; successor tier 12.67 µm fits 10 times inside one s0 wave."
        - "78.18 µm on the gallery bar is a property of that image, not a correction to the assigned wavelength."
      does_not_claim:
        - "That Pearson r = 1 is an independent time-stepper confirmation. It is the match between the quadratic formula and numpy.linalg.eigvals (RMSE = 0 at roundoff)."
        - "Sub-bin seed robustness. All four seeds share one radial bin."
        - "A published guinea-pig histology plate, a signed nanopublication, or a machine-checked Lean build."
    source_refs:
      - turing1952
      - murray1981
      - schnakenberg1979
      - swift1977
      - cross1993
      - sick2006
      - gierer1972
    summary: >-
      Pass 2 overall is the weighted rubric mean after crediting the charge sweep,
      the seed-bin ensemble, and an explicit eigensolver reading of the dispersion fit.
      lambda_c = 126.7 µm, simulated bin 128.55 µm, gallery field 78.18 µm,
      negative-control RMS ratio 0.00264, ablation peak shift 0.724.
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          Pass 2 keeps the Pass 1 equation set and states the limit more sharply.
          The chemical law is the Schnakenberg Jacobian wavenumber, scaled onto
          126.7 µm (D_u = 169.175, D_v = 6767.013, ratio 40, h_min = -5.411).
          The rendered dynamics are Swift-Hohenberg, which is the amplitude equation
          of that bifurcation, not a substitute chemical mechanism. Gierer & Meinhardt
          (1972) is cited as the activator-inhibitor precedent and is not the coded kinetics.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [94, 182], note: "Jacobian, 126.7 µm calibration, dispersion, and numerical eigenvalues", supports: true}
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [267, 312], note: "Semi-implicit Swift-Hohenberg spiral at k_hat = 1, eight waves on 1013.6 µm", supports: true}
          - {file: morphoeval/lean/loops/Loop_3141_cavia_porcellus_turing_wavelength_s0.lean, lines: [9, 40], note: "Integer 10x tier theorems and turingCross(1692, 67670, 8699, -15129) > 0. Not executed here.", supports: true}
      specimen-match:
        value: 86
        rationale: >-
          Direct computer-vision similarity of the 12-frame 640x480 GIF against the
          gallery field is 88.2. Radial-spectrum cosine between the field and the
          spiral is 0.987. The scale-bar wavelength of that same field is 78.18 µm
          (110 px = 100 µm, 0.909 µm/px), so the match is textural and orientational
          (KS = 0.077, segmented coherency 0.198) and is not a claim that the
          gallery peak sits at 126.7 µm.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [419, 489], note: "Scale-bar detection and foreground / coherency / radial-peak segmentation", supports: true}
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [205, 226], note: "24-bin log radial cosine against the gallery pigment field", supports: true}
          - {file: docs/media/cavia_porcellus_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "Animated spiral used as the fitness-test frame sequence", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          Three controls move the pattern as they should. Epsilon raises RMS
          monotonically (0.137, 0.287, 0.381, 0.524 for epsilon = 0.05, 0.15, 0.25, 0.45)
          and epsilon = -0.20 collapses the spiral (RMS ratio 0.00264). Removing
          finite-k selection moves k from 0.986 to 0.261 (wavelength 128.55 µm to
          484.5 µm). Raising b at fixed D moves lambda from 176.95 µm (b = 0.20)
          through 126.7 µm (b = 1.15) and restabilizes the homogeneous state at
          b = 2.5 and b = 4. Charges m = 1, 2, 3 and four seeds all select the same
          bin; that is reported as bin-stability, not as a continuous CV estimate.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [337, 388], note: "Epsilon sweep, negative control, ablation, charge sweep, and seed ensemble", supports: true}
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [184, 203], note: "b sweep at the s0 diffusivities, including loss of instability for b >= 2.5", supports: true}
      morphometric-validation:
        value: 90
        rationale: >-
          Paired comparison of the quadratic growth rate and numpy.linalg.eigvals
          on 28 wavenumbers gives Pearson r = 1 and RMSE = 0. This pass labels that
          pair as an eigensolver identity (the Pass 1 remediation), with a distributional
          KS of 0.036 between the two sigma samples. Independent of that identity,
          the simulated bin is 128.55 µm versus analytical 126.7 µm, the gallery
          wavelength is 78.18 µm, orientation KS is 0.077, and radial cosine is 0.987.
          None of those specimen or stripe values is copied from its reference.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [163, 249], note: "Eigensolver growth rates and the Pearson / RMSE / KS summary", supports: true}
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [598, 758], note: "measure_morphoeval list, including specimen wavelength, stripe wavelength, KS, ablation, charge, and seed CV", supports: true}
      source-traceability:
        value: 89
        rationale: >-
          Seven Crossref-checked DOIs, the scout manifest (including the empty
          OpenAlex morphogenesis result and the CC BY-SA whole-animal portraits that
          were rejected as the wrong spatial scale), and the SHA-256 pin of the
          gallery field. Age 0 Ma and length 0.0001267 m are written in the README
          and the reference JSON.
        evidence:
          - {file: datasets/cavia_porcellus_turing_wavelength_s0/README.md, lines: [1, 24], note: "States 126.7 µm, 0 Ma, and the 10x tier neighbours", supports: true}
          - {file: datasets/cavia_porcellus_turing_wavelength_s0/scout_manifest.json, lines: [1, 30], note: "Scout dossier with the empty OpenAlex list and Wikimedia portrait URLs", supports: true}
          - {file: datasets/cavia_porcellus_turing_wavelength_s0/paper_citations.bib, lines: [1, 70], note: "Bibliographic entries for the seven DOIs", supports: true}
      code-traceability:
        value: 85
        rationale: >-
          Each scored block is a named function whose docstring points at the
          formula it implements, and the math-KG YAML repeats those formulas with
          Lean declaration names. The Lean file has five theorems and zero sorry.
          Code traceability stops short of a machine check because lean is not
          installed in this image.
        evidence:
          - {file: morphoeval/math_kg_loops/delphi10000-cavia-porcellus-turing-wavelength-s0.yaml, lines: [1, 54], note: "Three laws with Lean theorem names and the model_spec block", supports: true}
          - {file: morphoeval/lean/loops/Loop_3141_cavia_porcellus_turing_wavelength_s0.lean, lines: [18, 39], note: "pred_holds_ten_s0_waves, s0_holds_ten_successor_waves, eight_waves_span_primordium, cross-term and trace theorems", supports: true}
      repro-package:
        value: 90
        rationale: >-
          --self-test passed on this checkpoint: stability signs, r > 0.98,
          ablation shift > 0.25, decay ratio < 0.5, substrate sweep, charge bin,
          seed CV < 0.08, GIF frames and resolution, and the specimen SHA-256.
          The invocation is deterministic given seed 3141.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [759, 812], note: "Self-test assertions that encode the Pass 2 gates", supports: true}
          - {file: docs/media/cavia_porcellus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Static comparison rendered by the same run", supports: true}
    remediation:
      - "Integrate the nonlinear Schnakenberg PDE, not only its amplitude equation, on the same 1.0136 mm window."
      - "Replace the radial-bin wavenumber with a continuous Fourier centroid so a seed ensemble can report a non-zero CV."
      - "Run the Lean file under a Lean 4 toolchain, and sign the nanopubs once a profile exists."
    needs:
      - id: nonlinear-schnakenberg
        need_type: model_equation
        target_dimension: model-fidelity
        description: "The rendered field is Swift-Hohenberg. A two-species nonlinear integration is still open."
        status: open
      - id: lean-toolchain
        need_type: provenance_lock
        target_dimension: code-traceability
        description: "Loop_3141 was not executed; this image has no lean binary."
        status: open
