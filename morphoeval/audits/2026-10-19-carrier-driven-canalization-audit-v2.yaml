          - {file: 2005-feugier-carrier-driven-canalization.py, lines: [230, 625], note: "2D hexagonal leaf lamina lattice solver comparing Model A open tree (Betti-1=0), Model B closed reticulate loops (Betti-1=16, 16 bipolar bridge cells), and k1=0 ablation control", supports: true}
