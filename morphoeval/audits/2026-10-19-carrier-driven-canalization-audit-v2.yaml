simulations:
  - id: feugier-carrier-driven-canalization
    name: "Feugier, Mochizuki & Iwasa (2005) & Scarpella et al. (2006) PIN1 efflux carrier allocation, intracellular pool conservation, and open dendritic trees vs closed reticulate venation loops"
    organism: "Arabidopsis thaliana (dicot leaf lamina and procambial venation network)"
    script: 2005-feugier-carrier-driven-canalization.py
    output: docs/media/carrier_driven_canalization_comparison.png
    extra_outputs:
      - docs/media/carrier_driven_canalization_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Feugier, Mochizuki & Iwasa (2005) J. Theor. Biol. 236:313-325 hexagonal leaf lamina auxin S_i and directional PIN1 carrier P_ij ODEs with conserved total cellular carrier pool P_total = P_{i,cyt} + sum_{j=1}^6 P_ij, proving that conserved superlinear allocation Phi(J)=J^p (p > 1) forces winner-take-all single-face polarization and strictly open hierarchical dendritic venation trees (Betti-1 = 0), whereas nonlinear saturating allocation Phi(J)=J^n/(K^n+J^n) allows multi-face co-polarization and closed venation loops (Betti-1 > 0)"
        - "Scarpella, Marcos, Friml & Berleth (2006) Genes & Development 20:1015-1027 ProPIN1:PIN1-GFP imaging showing epidermal PIN1 convergence points and transient bipolar (double-headed) PIN1 cells bridging secondary strands into closed areole loops"
      reconstructed_in_script:
        - "6-face hexagonal intracellular PIN1 pool conservation and regime bifurcation solver verifying exact pool conservation (error 0.0 < 1e-15), winner-take-all single-face polarization under Model A p=2.0 (dominant face share 0.9978 vs ref 0.9960), bipolar co-polarization under Model B saturating Hill exocytosis (dominant face share 0.5221 vs ref 0.5180), and 6-regime Pearson r = 0.9999 (p = 3.0e-8, RMSE = 0.0065)"
        - "2D hexagonal leaf lamina lattice solver (14x14 ovate blade, 6 faces/cell) verifying pairwise intercellular auxin flux antisymmetry |J_{i->j} + J_{j->i}| = 0.0 and demonstrating the topological transition from Model A open dendritic venation trees (Betti-1 = 0 loops, 10 free vein endings, 0 bipolar bridge cells) to Model B + Scarpella epidermal convergence closed reticulate venation networks (Betti-1 = 16 loops, 16 bipolar PIN1 bridge cells), plus a k_1 = 0 (`gnom`/`pin1` exocytosis block) negative control (0 loops, 0.0 vein fraction)"
        - "Automated ridge + chromatic warmth segmentation of the cleared dicot leaf tip venation skeleton specimen (`leaf_tip_venation_loops_specimen.jpg`, CC BY-SA 4.0, 539x351 px) extracting vein density (0.3585), Betti-1 = 205 closed polygonal areole loops, mean areole area (99.06 px^2), and mean areole compactness (0.7749 +- 0.0191 SE)"
      transfer_boundary:
        - "2D hexagonal cellular leaf lamina lattice PIN1 carrier-flux dynamics and graph cycle-rank topology mapped to cleared dicot leaf venation skeleton"
      does_not_claim:
        - "3D viscoelastic cell-wall mechanical expansion coupled to turgor-driven leaf blade growth"
    source_refs:
      - feugier2005
      - scarpella2006
      - rollandlagan2005
      - stoma2008
    summary: >-
      Pass 2 (v2) evaluation of `2005-feugier-carrier-driven-canalization.py` (overall
      weighted score: 93.1/100, up from 54.6/100 in v1). The remediated script integrates
      Feugier, Mochizuki & Iwasa (2005) hexagonal cell-level auxin S_i and 6-face PIN1
      efflux carrier P_ij dynamics with exact intracellular pool conservation
      (P_{i,cyt} + sum_{j=1}^6 P_{ij} = P_total, error 0.0) and pairwise flux antisymmetry
      (J_{i->j} + J_{j->i} = 0, error 0.0); sweeps 6 allocation regimes across p in
      [0.8, 2.0] and saturating Hill exocytosis (Pearson r = 0.9999, p = 3.0e-8);
      demonstrates the topological transition on a 2D hexagonal leaf lamina lattice
      between Model A open dendritic trees (Betti-1 = 0 loops) and Model B + Scarpella et al.
      (2006) closed reticulate venation networks (Betti-1 = 16 loops bridged by 16 bipolar
      PIN1 cells, vs 0 loops under k_1 = 0 `gnom`/`pin1` ablation); and segments the
      SHA-256-locked cleared dicot leaf tip venation skeleton (`leaf_tip_venation_loops_specimen.jpg`,
      Betti-1 = 205 closed areole loops, vein density 0.3585, mean areole compactness
      0.7749 +- 0.0191 SE).
