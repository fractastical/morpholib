          `_compute_venation_graph_topology`, `simulate_hexagonal_venation_models`, L230-625)
          comparing Feugier Model A open dendritic trees (Betti-1 = 0), Model B + Scarpella
          (2006) saturating Hill + epidermal convergence closed reticulate loops (Betti-1 = 16,
          16 bipolar bridge cells), and the k_1 = 0 (`gnom`/`pin1` exocytosis block) ablation
          control, backed by 3 machine-checked Lean 4 theorems in
          `morphoeval/lean/loops/Loop_035_carrier_driven_canalization.lean`.
        evidence:
