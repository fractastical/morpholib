# Pass 2 — Equus scotti follicular Turing wavelength, 164 µm, Irvingtonian 0.6 Ma.
# Supersedes the pass-1 audit. Closes the chronoseries sweep, the Du=Dv ablation,
# the Horsfall-plate segmentation, and the radial-spectrum KS comparison.

