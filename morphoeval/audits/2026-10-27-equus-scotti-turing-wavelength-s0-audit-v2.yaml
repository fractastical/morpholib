  id: 2026-10-27-equus-scotti-turing-wavelength-s0-audit-v2
  supersedes: 2026-10-27-equus-scotti-turing-wavelength-s0-audit
  supersedes_audit_id: 2026-10-27-equus-scotti-turing-wavelength-s0-audit
  rubric_version: 0.1.0
