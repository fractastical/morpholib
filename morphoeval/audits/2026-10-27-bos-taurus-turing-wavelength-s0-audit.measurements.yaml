    claim_boundary:
      reported_in_source:
      - Turing (1952) derived diffusion-driven instability and the dispersion relation whose fastest mode sets a
        wavelength.
      - Gierer & Meinhardt (1972) published short-range activation and long-range inhibition with the activator–inhibitor
        kinetics implemented here.
      - Wasmeier et al. (2008) review melanosomes as sub-micrometre organelles. Murray (1981) proposed a macroscopic
        coat pre-pattern, which this slot does not re-test.
      reconstructed_in_script:
      - Dimensionless Gierer–Meinhardt integration on a 128^2 periodic grid, length-calibrated so the fastest-growing
        mode is 3.137 µm at diffusion scale s = 1.
      - FFT wavelength versus k_star(s) over nine scales (Pearson r = 0.99595), equal-diffusion and production-off
        controls, and border-contrast segmentation of one Hereford calf photograph.
      transfer_boundary:
      - The 3.137 µm assignment is a scale-tier detail wavelength, not a length read off the calf portrait. The
        portrait does not resolve 3 µm.
      - Chronoseries length is 1. Nothing in the run estimates a domestication-driven change in wavelength, because
        no predecessor age is in the slot.
      does_not_claim:
      - Does not claim Holstein flank patches are a Turing pattern. That is a different script and a different scale.
      - Does not claim the last GIF frame is a micrograph. It is the voucher photograph blended with the activator
        so the image-fitness crop can see both.
      - Does not claim a second animal or a scale-barred skin section. Both are open remediation.
