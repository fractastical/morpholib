    claim_boundary:
      reported_in_source:
      - Turing (1952) selects a finite critical wavenumber from reaction and diffusion.
      - Schnakenberg (1979) supplies the kinetics a - u + u^2 v and b - u^2 v.
      - Hay and Tsiantis (2006), Vlad et al. (2014), and Kierzkowski et al. (2019) establish Cardamine hirsuta as
        the compound-leaf comparison and tie RCO to domain size rather than to a local wavenumber.
      reconstructed_in_script:
      - Neumann Schnakenberg integration, dispersion fit, D_v sweep, and equal-diffusion ablation, now scored from
        the measurement sidecar.
      - Specimen mask morphometrics and the orientation KS / radial-FFT comparison against the Commons photograph.
      transfer_boundary:
      - 154.1 µm is the classical wavelength of this parameter point, pinned to the slot scale. It is not a length
        reported by the cited Cardamine papers.
      does_not_claim:
      - That the herbarium photograph resolves individual 154 µm ocelli.
      - A predecessor or successor chronospecies. The series length is 1 and the age is 0 Ma.
      - That matching the plant's silhouette validates the wavenumber. The wavenumber is tested by the dispersion
        fit and the spacing measurement.
