simulations:
  - id: jonsson-auxin-pin1-meristem
    name: "Jönsson et al. (2006) & Smith et al. (2006) up-the-gradient PIN1 polarization and polar auxin transport model for shoot apical meristem phyllotaxis"
    organism: "Arabidopsis thaliana & Aeonium tabuliforme (shoot apical meristem L1 epidermis & spiral rosette phyllotaxis)"
    script: 2006-jonsson-auxin-pin1-meristem.py
    output: docs/media/auxin_pin1_phyllotaxis_comparison.png
    extra_outputs:
      - docs/media/auxin_pin1_phyllotaxis_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Jönsson et al. (2006) PNAS 103:1633-1638 & Smith et al. (2006) PNAS 103:1301-1306 up-the-gradient Boltzmann PIN1 membrane cycling P_ij = P_i exp(c_1 a_j) / sum_k exp(c_1 a_k) and intercellular active polar + diffusive auxin transport generating periodic convergence maxima separated by characteristic wavelength lambda_c"
        - "Transitions across spiral Fibonacci (137.5 deg), distichous alternate (180 deg), decussate opposite (90 deg), and tricussate whorled (120 deg) phyllotactic regimes as a function of meristem peripheral ring-to-spacing ratio Gamma, plus Reinhardt et al. (2003) Nature NPA/pin1 pin-formed block and exogenous IAA paste microapplication rescue"
      reconstructed_in_script:
        - "Linearized Turing-like up-the-gradient dispersion relation sigma(k) verifying critical feedback threshold c_1*a_0 = 1.75 (operating 3.70), characteristic spacing lambda_c = 5.196 cells (36.37 um), and complete mode stabilization under NPA/pin1 block (T = 0)"
        - "180-cell 2D L1 shoot apical meristem dome coupled Auxin-PIN1 ODE integrator verifying cellular PIN1 pool conservation (err < 1e-15), antisymmetric intercellular flux conservation (err < 2e-14), PIN1 convergence polarity index 0.8527 (ref 0.84), and golden divergence angle 137.39 ± 1.24 deg (ref 137.51 deg)"
        - "4-regime phyllotactic mode transitions across Gamma in {0.85, 1.45, 1.92, 2.75} reproducing Spiral (137.5 deg), Distichous (179.5 deg), Decussate (89.9 deg), and Tricussate (120.1 deg) divergence angles (Pearson r = 1.0000, p = 2.23e-5, RMSE = 0.24 deg)"
        - "NPA/pin1-1 polar transport block negative control (0 primordia, contrast 1.0000) and localized exogenous IAA paste rescue at phi = 60.0 deg (1 rescued primordium at 60.0 deg, contrast 2.73), plus ExG + DoG segmentation of 410 imbricated rosette leaves in Aeonium tabuliforme (`rosette_phyllotaxis_specimen.jpg`)"
      transfer_boundary:
        - "2D planar L1 epidermal dome lattice and peripheral ring reaction-transport ODEs mapped to top-down spiral rosette phyllotaxis"
      does_not_claim:
        - "Full 3D intracellular vesicle trafficking kinetics of PIN1 endosomal recycling or sub-cellular PIN1 phosphorylation cascades"
    source_refs:
      - jonsson2006
      - smith2006
      - reinhardt2003
      - heisler2005
    summary: >-
      Pass 2 (v2) evaluation of `2006-jonsson-auxin-pin1-meristem.py` (overall weighted
      score: 92.8/100, up from 53.8/100 in v1). The remediated script implements the
      linearized Turing-like up-the-gradient dispersion relation and Boltzmann PIN1
      allocation law (critical threshold c_1*a_0 = 1.75, characteristic spacing
      lambda_c = 5.196 cells / 36.37 um); integrates a 180-cell 2D SAM L1 Auxin-PIN1
      ODE model reproducing golden-angle phyllotaxis (137.39 ± 1.24 deg vs ref 137.51 deg)
      and PIN1 convergence polarity index 0.8527 (ref 0.84); reproduces transitions
      across all 4 phyllotactic regimes (Spiral 137.5 deg, Distichous 179.5 deg,
      Decussate 89.9 deg, Tricussate 120.1 deg; Pearson r = 1.0000, p = 2.23e-5);
      validates Reinhardt et al. (2003) NPA/pin1-1 polar transport block (contrast 1.0000,
      0 primordia) and localized IAA lanolin paste rescue at 60.0 deg (1 primordium,
      0.00 deg error); and segments 410 spiral rosette leaves on the SHA-256-locked
      Aeonium tabuliforme specimen (`rosette_phyllotaxis_specimen.jpg`, NN packing
      regularity 1 - CV = 0.7737 vs ref 0.75).
