          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [354, 531], note: "4 phyllotactic mode transitions (Spiral, Distichous, Decussate, Tricussate) and NPA/IAA perturbation experiments", supports: true}
          - {file: morphoeval/lean/loops/Loop_032_auxin_pin1_phyllotaxis.lean, lines: [14, 110], note: "3 machine-checked Lean 4 theorems for PIN1 allocation, antisymmetric flux conservation, and up-the-gradient instability / NPA collapse (0 sorrys)", supports: true}
