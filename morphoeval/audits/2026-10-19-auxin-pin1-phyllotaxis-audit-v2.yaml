        rationale: >-
          Implements Boltzmann up-the-gradient PIN1 membrane allocation and linearized
          Turing-like dispersion eigenvalues (`evaluate_up_gradient_dispersion_and_allocation`,
          L102-182), a 180-cell 2D L1 shoot apical meristem coupled Auxin-PIN1 ODE
          integrator (`simulate_2d_sam_auxin_pin1_phyllotaxis`, L188-348), 4-regime
          phyllotactic mode transitions across Gamma = R_PZ / lambda_0
          (`simulate_four_phyllotactic_modes`, L354-441), and NPA/pin1 block + exogenous
          IAA microdroplet rescue (`simulate_npa_and_iaa_rescue_experiments`, L447-531),
          backed by 3 machine-checked Lean 4 theorems in
          `morphoeval/lean/loops/Loop_032_auxin_pin1_phyllotaxis.lean`.
        evidence:
