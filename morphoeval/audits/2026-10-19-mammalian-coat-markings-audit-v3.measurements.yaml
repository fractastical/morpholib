    claim_boundary:
      reported_in_source:
      - 'Murray (1981): Thomas substrate-inhibition kinetics at a = 92, b = 64, alpha = 1.5, rho = 18.5, K = 0.1
        are diffusively unstable for d > d_c; the domain scale factor gamma selects between no pattern, stripes,
        spots and crowding; on a tapered cylinder spot modes (m >= 1) are excluded below a critical radius so a
        spotted animal can have a ringed tail but not vice versa'
      - 'Liu, Liaw & Maini (2006): leopard rosettes arise from a two-stage process in which a juvenile spot pre-pattern
        is re-run under changed parameters on the grown adult skin'
      - 'Dziuk (1988), Pinkall & Polthier (1993), Dziuk & Elliott (2013): P1 surface finite elements with cotangent
        weights converge to the Laplace-Beltrami operator on a triangulated surface'
      reconstructed_in_script:
      - Exact steady state, Jacobian, d_c, dispersion curve and Turing band; Neumann cylinder eigenmode counting
        including n = 0; r_crit (fastest-mode) and r_excl = 1/k_+ (full-exclusion) radii; fully implicit conical-tail
        PDE; planar DCT-II IMEX PDE run to saturation with a genuine two-stage protocol and growth-factor sweep;
        P1 surface FEM (stiffness/mass assembly, spectrum verification, two-stage run on the felid body) with annularity
        and spot-spacing diagnostics; DoG segmentation of the Kruger specimen
      transfer_boundary:
      - The 3D body is a parametric surface of revolution with hand-set knots (felid_body_profile.json), not a photogrammetric
        scan; its head-body length of 22 cub wavelengths and the growth factor G = 2 are ASSUMED, not fitted, which
        is why the FEM marking density (5.1 per torso depth) is 3.7x below the specimen estimate (18.9)
      - The tail ring onset comparison (0.82 measured vs 0.86 predicted) is on the surrogate taper, whose tip radius
        (0.004 HBL) was chosen to lie below r_excl; it is a consistency check of solver against linear theory, not
        a measurement on a real tail
      - 'The specimen is a 3/4-view photograph: the flank ROI is foreshortened and the v2 tail ROI covers hindquarters/background,
        so the Delaunay CV and polygonality are flank-only statistics'
      does_not_claim:
      - That Murray (1981) or Liu et al. (2006) reported any of the FEM, annularity, growth-sweep or marking-density
        numbers; all are v3 reconstructions
      - That the Thomas kinetics are the biological mechanism of felid pigmentation
