    claim_boundary:
      reported_in_source:
      - 'Young et al. (1992): coccolith shield elements nucleate as alternating V- and R-units with mutually orthogonal
        calcite c-axis orientations on an organic baseplate ring; morphology follows from crystallographic control
        of {10-14} growth'
      - 'Didymus et al. (1993): stage-specific E. huxleyi coccolith growth from proto-coccolith ring to T-shaped
        hammer elements of the distal shield'
      - 'Jaya et al. (2016): E. huxleyi coccospheres confer mechanical protection; under nanoindentation individual
        coccoliths slide relative to each other and cracks are arrested at coccolith boundaries'
      - 'Walker et al. (2018): the requirement for calcification differs between coccolithophore species; reduced
        calcification under acidification / CAP perturbation'
      - 'Reissner (1946): point-load stiffness of a thin shallow spherical shell k = 4 E h^2 / (R sqrt(3 (1 - nu^2)))'
      reconstructed_in_script:
      - 3D V/R c-axis ring with exact orthogonality, T-shaped hammer-element rosette across morphotypes A/B/C/R
        and an acidification / CAP ablation control, 12-taxon L_d(N_seg) scaling table, spherical coccosphere Voronoi
        / Euler packing with a prescribed 2.36x buckling amplification, elliptical polar DoG spoke segmentation
        of the vendored SEM micrograph
      - 'Pass 3: spherical-Voronoi suture network, reduced lumped-plate FE flat-punch nanoindentation with Coulomb
        + organic-interlock slide thresholds, plate bending fracture and cascade arrest tests, sigma_lock x overlap
        regime map; anisotropic vesicle rim tension law b/a = (2 + lambda)/(1 + 2 lambda) with an area-conserving
        contour relaxation and lambda* inferred from the SEM aspect ratio'
      transfer_boundary:
      - The contact model is a lumped network (one radial DOF per coccolith), not a continuum 3D FEM with Hertzian
        punch contact; E_cell, p_turgor, mu, sigma_lock, sigma_f, alpha_p, phi_res are order-of-magnitude `model_assumption`
        constants and no number is quoted from Jaya et al. (2016); the v2 2.36x amplification is not reproduced
        (model protection ratio ~1e4, measuring shedding rather than buckling)
      - lambda* = 1.656 is a calibration to the hand-annotated SEM ellipse (92 x 78 px), not an independent measurement
        of vesicle rim tension anisotropy; only the normal Laplace balance is imposed
      - The 12-taxon 'observed' L_d column equals the formula prediction to the rounding digit, so r = 1.0000 is
        a self-consistency check, not a validation against measured taxa
      does_not_claim:
      - Continuum fracture mechanics of calcite plates, measured interlock shear strength, independent vesicle rim
        tension data, detection of the SEM ellipse from pixels (centre, semi-axes and tilt are annotations), or
        verification of the Jaya 2016 / Walker 2018 venue-DOI pairs and the Reissner 1946 DOI (offline round)
