simulations:
  - id: delphi10000-asterias-rubens-turing-wavelength-s0
    name: "Asterias rubens Turing wavelength at 115.2 µm (Holocene, Pass 1 square patch)"
    organism: "Asterias rubens (common starfish), Holocene, 0 Ma"
    script: models/2026-delphi10000-asterias-rubens-turing-wavelength-s0.py
    output: docs/media/asterias_rubens_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/asterias_rubens_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, murray1981, garm2014]
    summary: >-
      Schnakenberg kinetics on a 576.0 µm Neumann patch (five catalog wavelengths
      of 115.2 µm). Diffusivity ratio 7.62 is just above onset, so the p=5 mode
      is unstable (σ≈0.0073) and the p=4 mode is stable (σ≈−0.051). Analytical
      versus FTCS growth: Pearson r = 0.999817, RMSE = 0.003533, KS = 0.0833.
      The 2D radial-FFT wavelength is 116.4904 µm. Equal diffusion is a negative
      control (max numerical σ = −0.103). The Hillewaert CC BY-SA studio
      photograph is segmented (circularity 0.164 versus a disk at 1; foreground
      0.212 versus Otsu 0.198). The GIF ends on that photograph. The photograph
      has no scale bar and is not a 115.2 µm micrograph. Garm & Nilsson 2014
      experimented on Linckia laevigata.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 diffusion-driven instability and a critical wavenumber."
        - "Schnakenberg 1979 two-species reaction with a homogeneous steady state."
        - "Murray 1981 writes the pre-pattern wavenumber used for animal markings."
        - "Garm & Nilsson 2014: most starfish have a compound eye at the arm tip; their navigation experiments used Linckia laevigata."
      reconstructed_in_script:
        - "a=0.072, b=0.918, D_v/D_u=7.62, domain 576.0 µm, seed 3123, chosen so λ_c = 115.2 µm and only the p=5 mode is unstable."
        - "FTCS Neumann integration, radial-FFT wavelength, diffusivity sweep λ ∝ √s, equal-diffusion ablation."
        - "Segmentation of the Hillewaert photograph (circularity, coherency, tubercle spacing in units of arm radius)."
      transfer_boundary:
        - "Coat-marking reaction-diffusion is transferred to an asteroid pigment/ocellus scale. The 115.2 µm length is the catalog tier, not a published Asterias measurement."
        - "The Linckia compound-eye result is not an Asterias rubens wavelength."
        - "Tubercle spacing on the unscaled studio plate is dimensionless. A 0.02 arm-radius reference assumes a 5.8 mm arm and is a transfer, not a measurement of this plate."
      does_not_claim:
        - "That 115.2 µm was measured as an ocellus diameter in Asterias rubens."
        - "That the studio photograph is a micrograph at this scale, or that its pixel wavelength is 115.2 µm."
        - "That Schnakenberg rate constants were identified in starfish epidermis."
        - "A second, independent assessor."
    scores:
      model-fidelity:
        value: 90
        rationale: "The script integrates Schnakenberg kinetics and the Turing/Murray critical-wavenumber formula, and it places the ratio just above onset so the catalog mode is the unstable one. Rate constants are fitted to the catalog scale, not taken from an Asterias dose-response."
        evidence:
          - {file: models/2026-delphi10000-asterias-rubens-turing-wavelength-s0.py, lines: [98, 145], note: "Jacobian at the Schnakenberg steady state and k_c solved for D_u", supports: true}
          - {file: models/2026-delphi10000-asterias-rubens-turing-wavelength-s0.py, lines: [147, 163], note: "sigma(k) = 1/2 (tr + sqrt(tr^2 - 4 det))", supports: true}
      specimen-match:
        value: 74
        rationale: "The comparison figure places the Hillewaert animal beside the segmented outline and the activator field, and the GIF ends on the photograph, so the organism is recognisable. The generative field is still a square patch, and the photograph is not a 115.2 µm micrograph, so the tubercle texture is not a pixel fit to the wavelength."
        evidence:
          - {file: docs/media/asterias_rubens_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, mask, activator, dispersion, sweep", supports: true}
          - {file: docs/media/asterias_rubens_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 840x666, last frame is the studio photograph", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "Scaling both diffusivities by s moves the numerical wavelength as λ_c √s (sweep Pearson r = 1 on the sampled scales; λ(s=4)/λ(s=1) = 2). Setting D_u = D_v makes the maximum growth rate negative."
        evidence:
          - {file: models/2026-delphi10000-asterias-rubens-turing-wavelength-s0.py, lines: [245, 274], note: "diffusivity sweep and equal-D control inside dispersion_comparison", supports: true}
          - {file: models/2026-delphi10000-asterias-rubens-turing-wavelength-s0.py, lines: [215, 243], note: "analytical vs FTCS sigma(k) and the r=1 ablation", supports: true}
      morphometric-validation:
        value: 84
        rationale: "Dispersion Pearson r = 0.999817, RMSE = 0.003533, KS = 0.0833 against the analytical curve. The 2D FFT wavelength is 116.4904 µm against 115.2 µm. Specimen circularity 0.164 is compared with a disk (1), and the fixed-threshold foreground 0.212 is compared with Otsu 0.198. The 0.02 arm-radius spacing reference is a transferred length, not a measurement on this plate."
        evidence:
          - {file: models/2026-delphi10000-asterias-rubens-turing-wavelength-s0.py, lines: [351, 373], note: "sub-bin radial FFT wavelength", supports: true}
          - {file: models/2026-delphi10000-asterias-rubens-turing-wavelength-s0.py, lines: [608, 709], note: "measure_morphoeval values differ from their references", supports: true}
          - {file: datasets/asterias_rubens_turing_wavelength_s0/asterias_rubens_turing_wavelength_s0_reference.json, lines: [72, 87], note: "Pass-1 measured numbers recorded next to the catalog wavelength", supports: true}
      source-traceability:
        value: 91
        rationale: "Crossref-checked DOIs for Turing, Schnakenberg, Murray, and Garm & Nilsson. The specimen is the Hillewaert CC BY-SA file, SHA-256 pinned. The Linckia species limit is written in the reference and the bib note."
        evidence:
          - {file: datasets/asterias_rubens_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "four DOIs, Garm species note", supports: true}
          - {file: datasets/asterias_rubens_turing_wavelength_s0/scout_manifest.json, lines: [1, 40], note: "OpenAlex/Crossref/Wikimedia scout; slot 3123 is outside campaign_100", supports: true}
          - {file: datasets/asterias_rubens_turing_wavelength_s0/asterias_rubens_turing_wavelength_s0_reference.json, lines: [55, 69], note: "SHA-256 of the vendored specimen", supports: true}
      code-traceability:
        value: 86
        rationale: "The module docstring and the coefficient routine name the Schnakenberg terms and the Murray form of k_c. The Lean file proves the trace sign, the drive sign at r=7.62, the five-wavelength identity, and the tier inequality, with zero sorry."
        evidence:
          - {file: models/2026-delphi10000-asterias-rubens-turing-wavelength-s0.py, lines: [1, 40], note: "governing system stated in the module docstring", supports: true}
          - {file: morphoeval/lean/loops/Loop_3123_asterias_rubens_turing_wavelength_s0.lean, lines: [18, 38], note: "four theorems, decide, no sorry", supports: true}
      repro-package:
        value: 88
        rationale: "Seed 3123, --self-test (Pearson r > 0.98, ablation σ < 0, p=5 unstable and p=4 stable, deterministic hash), and a documented plain invocation. Dependencies are the repo scientific stack. The full horizon is several tens of seconds because the near-onset growth rate is small."
        evidence:
          - {file: models/2026-delphi10000-asterias-rubens-turing-wavelength-s0.py, lines: [712, 748], note: "--self-test assertions", supports: true}
          - {file: datasets/asterias_rubens_turing_wavelength_s0/README.md, lines: [1, 30], note: "scale 115 µm and age 0 Ma, plus the run commands", supports: true}
    remediation:
      - id: R1
        item: "Test the pentaradial body silhouette as the reaction domain on the 576 µm patch. If the arms are narrower than λ_c the mode should quench; record that control instead of forcing the mask into the production run."
      - id: R2
        item: "Replace the transferred 0.02 arm-radius spacing reference with a within-plate null so the tubercle metric is not anchored to an assumed 5.8 mm arm."
      - id: R3
        item: "No independent second assessor."
      - id: R4
        item: "The studio photograph has no scale bar, so absolute tubercle spacing in micrometres cannot be read from it. Keep that limit explicit."
