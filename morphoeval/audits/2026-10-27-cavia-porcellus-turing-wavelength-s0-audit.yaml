simulations:
  - id: delphi10000-cavia-porcellus-turing-wavelength-s0
    name: "Cavia porcellus Holocene (0 Ma) Turing wavelength at 126.7 µm (tier-5 detail s0)"
    organism: "Cavia porcellus (Guinea pig), I. Enaima (Vertebrata) -> Mammalia (Zootoka) -> Cavia"
    script: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py
    output: docs/media/cavia_porcellus_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/cavia_porcellus_turing_wavelength_s0_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Turing (1952) dispersion: a homogeneous steady state stable to k = 0 can be unstable at a finite critical wavenumber when the inhibitor diffuses farther than the activator."
        - "Murray (1981) identified that selected wavelength with mammalian coat stripes and spots. Schnakenberg (1979) supplied the activator-substrate kinetics used here."
        - "Swift & Hohenberg (1977) and Cross & Hohenberg (1993) give the real amplitude equation whose linear spectrum peaks at a prescribed k_c."
        - "Sick et al. (2006) showed a WNT/DKK reaction-diffusion interaction sets mammalian hair-follicle spacing, the anatomical neighbour of a ~100 µm pigment wavelength."
      reconstructed_in_script:
        - "Schnakenberg Jacobian at a = 0.08, b = 1.15, gamma = 1, with D_v/D_u = 40 scaled so lambda_c = 126.7 µm exactly (D_u = 169.175 µm^2, D_v = 6767.013 µm^2)."
        - "Swift-Hohenberg spiral of charge 2 on a periodic 1.0136 mm window (eight critical wavelengths), plus an epsilon sweep, a below-onset decay, and a plain-diffusion ablation."
      transfer_boundary:
        - "126.7 µm is the slot-assigned tier-5 detail length (0.0001267 m, log10 = -3.897) for extant Cavia porcellus at 0 Ma, not a measurement quoted from a guinea-pig histology paper."
        - "The Cavia chronoseries has one node. The 1267 µm and 12.67 µm neighbours are adjacent size tiers at the same age, not other chronospecies."
      does_not_claim:
        - "That the gallery pigment field is a published micrograph, or that its measured dominant wavelength (78.18 µm on the printed 100 µm bar) equals 126.7 µm."
        - "A full nonlinear two-species Schnakenberg integration. The rendered field is the Swift-Hohenberg amplitude equation."
        - "Machine execution of the Lean file: this image has no lean binary."
    source_refs:
      - turing1952
      - murray1981
      - schnakenberg1979
      - swift1977
      - cross1993
      - sick2006
    summary: >-
      Pass 1 scores the dispersion law, the spiral render, the epsilon and substrate
      sweeps, the ablation, and the specimen scale-bar segmentation. It does not credit
      the charge sweep or the seed ensemble; those are remediation for the v2 audit.
      Analytical lambda_c = 126.7 µm, numerical eigenvalue Pearson r = 1 (roundoff RMSE = 0),
      simulated radial peak 128.55 µm, gallery-field wavelength 78.18 µm.
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          The script implements the Schnakenberg steady state and Jacobian (a = 0.08,
          b = 1.15), the Turing wavenumber k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v),
          and the Swift-Hohenberg amplitude equation at that k_c. Homogeneous trace is
          negative, h_min is negative, and sigma(k_c) = 0.301 while sigma(0) = -0.321.
          The picture is the amplitude equation, not a nonlinear two-species PDE, so this
          is not a line-by-line Murray simulation.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [94, 161], note: "Schnakenberg Jacobian, diffusivity scaling to 126.7 µm, and dispersion sigma(k)", supports: true}
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [251, 312], note: "Swift-Hohenberg spectral step and the plain-diffusion ablation operator", supports: true}
          - {file: morphoeval/lean/loops/Loop_3141_cavia_porcellus_turing_wavelength_s0.lean, lines: [18, 40], note: "Five sorry-free integer theorems for the 10x tier relation and the cross-term sign. Not executed: no lean binary.", supports: true}
      specimen-match:
        value: 80
        rationale: >-
          The GIF is a 12-frame 640x480 lavender spiral whose last frame scores
          cv_sim_similarity 88.2 against the gallery pigment field. The same field,
          calibrated by its 110 px / 100 µm bar, has a dominant wavelength of 78.18 µm,
          not 126.7 µm. Pass 1 therefore does not treat the visual match as a
          wavelength validation. The gallery image is not a DOI histology plate.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [397, 489], note: "Lavender render and scale-bar segmentation of the gallery field", supports: true}
          - {file: docs/media/cavia_porcellus_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 640x480 growth GIF", supports: true}
      parameter-expressivity:
        value: 68
        rationale: >-
          Epsilon from -0.20 to 0.45 raises saturated RMS from 0.0001 to 0.524.
          Holding D fixed, lambda_c(b) moves from 176.95 µm at b = 0.20 to 126.7 µm
          at b = 1.15, and the mode is no longer unstable at b = 2.5 and b = 4
          (h_min > 0). The plain-diffusion ablation shifts the radial peak from
          0.986 to 0.261. Charge and seed variation are not credited on this pass.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [184, 203], note: "Substrate-production sweep at fixed s0 diffusivities", supports: true}
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [337, 362], note: "Epsilon sweep, below-onset decay, and finite-k ablation", supports: true}
      morphometric-validation:
        value: 78
        rationale: >-
          Closed-form sigma(k) matches numpy.linalg.eigvals with Pearson r = 1 and
          RMSE = 0; that is an eigensolver identity, not an independent time-integration
          residual, and Pass 1 does not treat it as one. The gallery wavelength
          78.18 µm, coherency 0.198, orientation KS 0.077, and simulated peak
          128.55 µm are reported against references they do not copy.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [228, 249], note: "Paired closed-form and numerical eigenvalues, Pearson r, RMSE, KS", supports: true}
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [598, 700], note: "measure_morphoeval records wavelength, coherency, KS, ablation shift, and the decay ratio 0.00264", supports: true}
      source-traceability:
        value: 86
        rationale: >-
          Crossref-confirmed DOIs for Turing 1952, Murray 1981, Schnakenberg 1979,
          Swift & Hohenberg 1977, Cross & Hohenberg 1993, and Sick et al. 2006 are
          in paper_citations.bib and the reference JSON. The specimen SHA-256 is
          42014eaf5b445ec569739b4b14be9f65dea72da7126e6dc92702e66dbbbf2acd, the gallery
          file. OpenAlex returned no morphogenesis hits for the guinea-pig query;
          that empty result is kept in the scout manifest.
        evidence:
          - {file: datasets/cavia_porcellus_turing_wavelength_s0/cavia_porcellus_turing_wavelength_s0_reference.json, lines: [1, 40], note: "Scale 0.0001267 m, age 0 Ma, parameters, and specimen SHA-256", supports: true}
          - {file: datasets/cavia_porcellus_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "Turing 1952 and Murray 1981 bibliographic entries with DOIs", supports: true}
      code-traceability:
        value: 80
        rationale: >-
          The module docstring, the math-KG loop YAML, and Loop_3141 name the same
          k_c formula and the 10x tier relation (1267 µm = 10 x 126.7 µm,
          126.7 µm = 10 x 12.67 µm). The Lean theorems encode those integer relations
          and the sign of the cross term. They were not machine-checked in this image.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [1, 48], note: "Docstring states the 126.7 µm law, the age, and the tier neighbours", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-cavia-porcellus-turing-wavelength-s0.yaml, lines: [1, 40], note: "Math KG entries point at the Lean declarations and the script", supports: true}
      repro-package:
        value: 84
        rationale: >-
          --self-test checks the SHA-256 pin, the stability signs, Pearson r > 0.98,
          the ablation shift, the decay ratio, GIF frame count (>= 10) and minimum
          side (>= 480). Seed 3141 and the grid (128, dt = 0.10, 480 steps) are fixed.
          Signing keys are absent, and Lean was not run.
        evidence:
          - {file: models/2026-delphi10000-cavia-porcellus-turing-wavelength-s0.py, lines: [759, 812], note: "Deterministic self-test, including media geometry gates", supports: true}
          - {file: docs/media/cavia_porcellus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Comparison figure with dispersion and epsilon sweep", supports: true}
    remediation:
      - "Credit the topological-charge sweep (m = 1, 2, 3) only after reporting that all three charges fall in the same radial bin k = 0.9856 (lambda = 128.55 µm)."
      - "Report the four-seed wavenumber ensemble. At this bin width the CV is 0 because every seed shares that bin; do not describe it as a sub-bin robustness proof."
      - "State in the morphometric rationale that Pearson r = 1 and RMSE = 0 are the eigensolver identity of the quadratic formula, not an independent integrator residual."
    needs:
      - id: charge-and-seed
        need_type: parameter_sweep
        target_dimension: parameter-expressivity
        description: "Score the charge sweep and the seed-ensemble CV, including the bin-width caveat."
        status: open
      - id: eig-identity
        need_type: morphometric_validation
        target_dimension: morphometric-validation
        description: "Label the Pearson/RMSE pair as an eigensolver identity."
        status: open
