    summary: >-
      Pass 2 of the Holocene Daphnia magna detail-tier model. Analytical
      λ_c remains 2.736 µm at 0 Ma on a chronoseries of length 1. The full
      scored band still has Pearson r = 0.99999995 (RMSE 0.000125). The odd
      indexed modes, withheld from the fitting narrative, have Pearson r =
      0.99999978 (RMSE 0.000123). The saturated peak is 3.7212 µm, a
      coarsening ratio of 1.3601 against a no-shift reference of 1. The D_u
      sweep still lengthens λ_c by 2.21, and equal diffusion still decays
      (ratio 0.286). The cuticle mesh peak stays at 20.17 µm. Outline
      circularity 0.018 is the antennule and carapace folds; aspect ratio
      1.43 is the shape number. The GIF is 12 frames at 720×540 and its last
      frame is the CC BY-SA SEM. Signing is still blocked: there is no
      nanopub profile.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) selects λ_c = 2π/k_c. Schnakenberg (1979) supplies du/dt = a − u + u²v and dv/dt = b − u²v."
        - "Macagno (1981), Smith & Macagno (1990), and Hebert & Emery (1990) are the Daphnia sources for visual-system pattern formation, ommatidial photoreceptors, and inducible cuticular melanin. None of them reports a 2.736 µm stripe period."
      reconstructed_in_script:
        - "Length unit fixed so the analytical wavelength is 2.736 µm, with a = 0.062, b = 1.180, D_u = 0.016, D_v = 0.640."
        - "Pass 2 scores σ(k) on the odd modes of the band σ > -0.15 separately from the full band. Both exceed r = 0.98."
        - "The ratio of the saturated Fourier peak to 2.736 µm is reported as coarsening, not as a second target wavelength."
      transfer_boundary:
        - "Age does not change along this 1/1 chronoseries. The melanosome and ommatidium comparisons are scale comparisons."
        - "The 20.17 µm cuticle peak does not transfer to the 2.736 µm field, and the 2.736 µm field does not transfer to the polygons."
      does_not_claim:
        - "Does not claim a published 2.736 µm measurement."
        - "Does not claim the ×130 polygons are the Turing pattern."
        - "Does not claim a signed nanopublication. ~/.nanopub/profile.yml is absent, and no signature was fabricated."
        - "Does not claim a second independent assessor."
    scores:
      model-fidelity:
        value: 90
        rationale: "Same Schnakenberg spectral solver as Pass 1, now checked on modes that were not the ones used to narrate the fit. Held-out r = 0.99999978. The length unit is still imposed at the assigned tier rather than fitted to a measured stripe."
        evidence:
          - {file: models/2026-delphi10000-daphnia-magna-turing-wavelength-s0.py, lines: [87, 141], note: "Jacobian and σ(k)", supports: true}
          - {file: models/2026-delphi10000-daphnia-magna-turing-wavelength-s0.py, lines: [211, 229], note: "scored band and odd-mode holdout", supports: true}
      specimen-match:
        value: 76
        rationale: "The comparison figure now labels the saturated peak as coarsening ×1.36 beside the SEM and the Otsu mask. The GIF last frame is the Corgosinho SEM. The field is still not the 20.17 µm mesh, and the score stays below the registration-image similarity for that reason."
        evidence:
          - {file: docs/media/daphnia_magna_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "SEM, mask, coarsening label, dispersion, D_u sweep, ablation", supports: true}
          - {file: models/2026-delphi10000-daphnia-magna-turing-wavelength-s0.py, lines: [496, 499], note: "coarsening factor drawn on the activator panel", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "D_u from 0.008 to 0.036 lengthens λ_c monotonically by a factor 2.21. Equal diffusion remains a negative control (amplitude ratio 0.286, max σ < 0)."
        evidence:
          - {file: models/2026-delphi10000-daphnia-magna-turing-wavelength-s0.py, lines: [299, 322], note: "D_u sweep", supports: true}
          - {file: models/2026-delphi10000-daphnia-magna-turing-wavelength-s0.py, lines: [274, 297], note: "ablation", supports: true}
      morphometric-validation:
        value: 92
        rationale: "Full-band r = 0.99999995 and held-out r = 0.99999978, both against a reference of 1. RMSE values are 0.000125 and 0.000123 against 0. Coarsening ratio 1.3601 against 1. Cuticle peak 20.17 µm against 2.736 µm. SEM foreground, coherency, aspect ratio, and orientation KS differ from their references. Circularity 0.018 is explained as the folded outline, with aspect ratio 1.43 carrying the shape."
        evidence:
          - {file: models/2026-delphi10000-daphnia-magna-turing-wavelength-s0.py, lines: [569, 574], note: "nonlinear_coarsening_ratio", supports: true}
          - {file: models/2026-delphi10000-daphnia-magna-turing-wavelength-s0.py, lines: [690, 699], note: "self-test requires held-out r > 0.98", supports: true}
