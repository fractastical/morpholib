# MorphoEval Pass 2 (v2) Audit — Remediated Foundational Canonical Pillars
# (Thompson 1917, Raup 1966, Lobo–Malone–Levin 2013 PlanformDB, Cervera–Levin–Mafé 2021)
#
# Supersedes the pre-remediation Pass 1 scores in `2026-10-13-morphology-audit.yaml`
# after upgrading:
#   1. `thompson/1917-thompson.py` (`thompson-scarus-pomacanthus`): 600-point continuous fish
#      silhouettes of Scarus ghobban and Pomacanthus semicirculatus with 8-parameter oblique
#      coaxial-circle coordinate transformation and direct Area-of-Difference (|Omega_A Delta Omega_B|)
#      and IoU optimization (IoU = 0.662 -> 0.749, |Omega_A Delta Omega_B| = 47.0% -> 28.5%).
#   2. `models/create_raup_animations.py` (`raup-shell-coiling`): 6-species whole-shell empirical
#      specimen plate (Nautilus, Turritella, Dactylioceras, Conus, Cerithium, Helix) paired with
#      3D oblique-perspective logarithmic helicospiral coiling across Raup's (W, D, T, S) space.
#   3. `models/2013-lobo-planform-morphology.py` (`planform-morphology-animation`): 12 genuine
#      published open-access planarian regenerative phenotype micrographs from PlanformDB 2.5.0
#      aligned horizontally (head-left) and paired 1-to-1 with decoded PlanformDB region/organ graphs.
#   4. `models/2021-Cervera–Levin–Mafe.py` (`cervera-levin-mafe`): 2D spatial bioelectric V_mem +
#      reaction-diffusion wavefront simulation across horizontal Wild-Type (1H1T) and Gap-Junction-
#      Blocked Bipolar Double-Head (2H0T) Schmidtea mediterranea regenerants.

