  rubric_version: "0.1.0"
  date: "2026-10-27"
  supersedes: 2026-10-27-danio-albolineatus-turing-wavelength-s0-audit
  supersedes_audit_id: 2026-10-27-danio-albolineatus-turing-wavelength-s0-audit
