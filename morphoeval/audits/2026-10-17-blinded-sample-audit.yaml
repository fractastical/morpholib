          morphospace figure and three regimes in the growth GIF, producing
          clear, monotonic shifts in upstream centre-of-mass displacement
          (cx - mean_x), radius of gyration (r_gyr), symmetry magnitude
          (smmag), and mean resultant branch vector length (Rbar).
