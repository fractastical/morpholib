simulations:

  - id: thompson-scarus-pomacanthus
    name: "Thompson's Scarus -> Pomacanthus transformation fitted to real species"
    organism: "Scarus spp. -> Pomacanthus spp., plus three other teleost pairs across 791 species"
    script: thompson/1917-thompson-scarus-pomacanthus.py
    output: thompson_scarus_pomacanthus.png
    domain: morphogenesis
    status: evaluated
    source_refs: [thompson1917, bookstein1978, bookstein1989, friedman2019, friedman2019data, claverie2014]
    summary: >-
      Blinded second-assessor pass (gemini-4-argon).  Operationalises D'Arcy
      Thompson's freehand transformation grids (1917, Figs. 373-382) as a nested
      hierarchy of conformal and curvilinear coordinate families (similarity,
      affine, Moebius, coaxial circles via exact complex log-ratio and power-shear,
      and exact Bookstein 1989 thin-plate spline) fitted to 17 homologous landmarks
      across 791 Indo-Pacific fish species and tested on segmented museum/field
      specimen silhouettes.
    scores:
      model-fidelity:
        value: 94
        rationale: >-
          Operationalises Thompson's freehand coordinate transformations (1917,
          pp. 749-751, Figs. 375-376) into an explicit nested hierarchy of five
          analytical families (similarity, affine, projective/Moebius, oblique
          coaxial circles via complex log-ratio and power-shear, and Bookstein 1989
          exact thin-plate spline).  Fits all parametric models via multi-start
          non-linear least squares (fit_family) and verifies exact round-trip
          invertibility of the bipolar map (inv_coaxial) to machine precision in
          self_test().  Deducts 6 points only because Thompson's original grids
          were drawn freehand without algebraic formulas, so the 9-parameter
          bipolar power-shear equation is a modern formalisation rather than an
          equation printed in 1917, and Thompson's printed grid lines are not
          digitised as numerical coordinates.
        evidence:
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [256, 360], note: "procrustes_align(), fit_affine(), fit_moebius(), fit_coaxial(), inv_coaxial(), and fit_tps()"}
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [443, 463], note: "self_test() verifies TPS interpolation (< 1e-9), nested hierarchy bounds, and coaxial inversion (< 1e-9)"}
      specimen-match:
        value: 86
        rationale: >-
          Evaluates transformations directly against both Procrustes-aligned landmark
          means of 48 Scarus and 6 Pomacanthus species (plus 791 species across four
          Thompson fish pairs) and real biological specimen photographs (Scarus ghobban
          and Pomacanthus semicirculatus), overlayed alongside Thompson's 1917 original
          scan (Figs. 375-376) in Panel A.  Deducts 14 points because silhouette
          registration uses a 2-anchor similarity transform (snout tip to LM2 and
          caudal peduncle minimum width to midpoint(LM5, LM6)) rather than 17
          landmarks digitised directly on those two photographed individuals, and
          compares a preserved specimen with collapsed fins against a live swimming
          fish with extended dorsal/anal filaments.
        evidence:
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [524, 650], note: "segment_scarus_photo(), segment_pomacanthus_photo(), and register_outline_to_landmarks()"}
          - {file: thompson_scarus_pomacanthus.png, lines: [0, 0], note: "Panel A reproduces Thompson 1917 p. 749 scan; Panels B-F compare fitted families on consensus shapes"}
          - {file: thompson_scarus_pomacanthus_outlines.png, lines: [0, 0], note: "segmented photos of S. ghobban and P. semicirculatus warped across all five transformation families"}
      parameter-expressivity:
        value: 82
        rationale: >-
          Systematically explores the parameter/complexity hierarchy (k = 4, 6, 8,
          9, 34 degrees of freedom), fits every one of the 48 x 6 = 288 Scarus x
          Pomacanthus species pairs to generate an empirical distribution of residual
          errors, and tests generalisability across all four of Thompson's teleost
          pairs (Scarus -> Pomacanthus, Argyropelecus -> Sternoptyx, Pseudopriacanthus
          -> Scorpaena, Diodon -> Mola).  Deducts 18 points because the script fits
          discrete transformation families to empirical targets rather than exposing
          interactive CLI parameters to sweep continuous grid parameters (pole spacing
          a, power alpha, shear beta).
        evidence:
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [186, 200], note: "THOMPSON_PAIRS defines all four teleost transformations from Thompson (1917) Figs. 373-382"}
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [414, 439], note: "pairwise_residuals() evaluates affine and coaxial fits across all 288 Scarus x Pomacanthus species pairs"}
          - {file: thompson_scarus_pomacanthus.png, lines: [0, 0], note: "Panel H visualises all four fish transformations and Panel G shows the 288-pair histogram"}
      morphometric-validation:
        value: 96
        rationale: >-
          Computes per-landmark and RMS Procrustes residuals, leave-one-landmark-out
          cross-validation (LOO-CV), AIC-like parameter penalty, Bookstein's thin-plate
          spline bending energy (J = 0.258) and partial-warp spectrum (14 non-affine
          principal warps), plus rasterised silhouette Intersection-over-Union (IoU)
          and mean/95th-percentile symmetric boundary distances exported to
          thompson_outline_metrics.csv.  Demonstrates quantitatively that Thompson's
          coaxial-circle family fails LOO-CV (0.0970 vs 0.0568 for similarity) and
          leaves silhouette IoU (0.6182) below baseline similarity (0.6615).
        evidence:
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [389, 412], note: "leave_one_out_rms() implements 17-fold leave-one-landmark-out cross-validation"}
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [663, 718], note: "outline_metrics() and compute_outline_comparison() compute rasterised IoU and boundary distances"}
          - {file: thompson_outline_metrics.csv, lines: [1, 7], note: "exported quantitative table of landmark RMS, LOO-CV RMS, silhouette IoU, and boundary distances"}
      source-traceability:
        value: 97
        rationale: >-
          Module docstring and dataset README cite Thompson (1917) with Internet
          Archive leaf/page identifiers, Bookstein (1978, 1989) with DOIs, and
          Friedman et al. (2019) / Claverie & Wainwright (2014) with Dryad DOI
          (10.5061/dryad.fn457gr).  Every local and remote asset (landmark CSV,
          1917 page scan, and both Wikimedia Commons photographs) is pinned by exact
          byte size and SHA-256 digest and verified on every run.
        evidence:
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [1, 75], note: "header docstring citing Thompson (1917), Bookstein (1978, 1989), Friedman et al. (2019), and Claverie & Wainwright (2014) with DOIs"}
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [92, 134], note: "DATA_SHA256, SCAN_SHA256, and PHOTO_SPECS pin exact byte lengths and SHA-256 digests"}
          - {file: datasets/thompson/README.md, lines: [1, 61], note: "complete dataset provenance, CC0 license documentation, and anatomical landmark table"}
      code-traceability:
        value: 93
        rationale: >-
          Functions map cleanly to the mathematical formulations in Bookstein (1989)
          and Thompson (1917), with explicit docstrings specifying complex-plane equations,
          TPS kernel U(r) = r^2 log(r^2), partitioned system matrix L, and bending-energy
          eigen-decomposition, plus a 17-entry ANATOMICAL_LABELS dictionary mapping TPS
          indices to anatomical structures.
        evidence:
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [152, 184], note: "ANATOMICAL_LABELS and BODY_ORDER/DORSAL_FIN/ANAL_FIN/CAUDAL_FIN/PECTORAL_GIRDLE"}
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [288, 359], note: "fit_coaxial() and fit_tps() docstrings with explicit algebraic equations and variable definitions"}
      repro-package:
        value: 90
        rationale: >-
          Deterministic optimization seeds (np.random.default_rng(1917)), CLI flags
          (--no-scan, --no-photos, --out, --outline-out, --metrics-out), self_test()
          assertion gate, and pinned dependencies in requirements.txt /
          requirements.lock.txt.  Deducts 10 points because the outline comparison
          depends on runtime HTTP fetches to Wikimedia Commons when .thompson_cache/
          is cold.
        evidence:
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [305, 319], note: "deterministic RNG seeding np.random.default_rng(1917) in multi-start optimizer"}
          - {file: thompson/1917-thompson-scarus-pomacanthus.py, lines: [983, 1025], note: "CLI argument parser supporting --out, --outline-out, --metrics-out, --no-scan, and --no-photos"}
          - {file: requirements.lock.txt, lines: [1, 35], note: "exact environment lockfile pinning Python 3.14.7 and package versions"}

  - id: eshghi-odonata-wing-cells
    name: Odonata wing cells through deep time
    organism: "Odonata (fossil Late Jurassic-Eocene; extant Anisoptera and Zygoptera)"
    script: 2026-eshghi-odonata-wing-cells.py
    output: odonata_fossil_resegmentation.png
    domain: palaeobiology
    status: evaluated
    source_refs: [eshghi2026, hoffmann2018, pbdb]
    summary: >-
