      scikit-image: "0.26.0"
      matplotlib: "3.10.7"
      Pillow: "12.0.0"
    note: >-
      All ten active evaluated scripts are inspected at commit 5659d5e (HEAD).
      Eight of the ten target scripts at 5659d5e are byte-for-byte identical to
      their primary-audit commits (232e8f8 for thompson-scarus-pomacanthus,
      fbbcaf6 for eshghi-odonata-wing-cells, 747c57f for lobo-limbform-morphology,
      ba6fd20 for raup-shell-coiling, f3fe478 for turing-gray-scott,
      hoffmann-wing-venation, and chindapol-coral-flow, and 303a87e for
      santella-wormguides-celegans); 2013-lobo-planform-morphology.py includes
      the SHA-256 database pin added after 161f269, and 2021-Cervera–Levin–Mafe.py
      includes the commit 0154143 fix for the f2_for_shift() threshold inversion
      and dynamic Panel D legend after a0d6848.  Repository-wide dependency
      lockfiles (requirements.txt, requirements.lock.txt) added in commit
      9ca5457 are present.

