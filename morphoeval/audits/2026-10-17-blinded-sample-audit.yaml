# MorphoEval audit — Blinded second-assessor replication across all ten active evaluated implementations, 2026-10-17.
#
# Purpose: eliminate single-agent self-scoring across the MorphoEval corpus and
# test inter-assessor agreement, calibration offset, and independent defect
# discovery by running a blinded second-assessor pass (gemini-4-argon, Google)
# across all 10 active evaluated scripts previously scored by claude-fable-5-1
# (Anthropic, 9 scripts) or gpt-5.6-sol (OpenAI, 1 script):
#
#   1. thompson/1917-thompson-scarus-pomacanthus.py  (thompson-scarus-pomacanthus, test)
#   2. 2026-eshghi-odonata-wing-cells.py             (eshghi-odonata-wing-cells, test)
#   3. 2014-lobo-limbform-morphology.py              (lobo-limbform-morphology, decode)
#   4. create_raup_animations.py + 1966-raup.py      (raup-shell-coiling, reproduce)
#   5. 1952-turing-morpho.py                         (turing-gray-scott, reproduce)
#   6. 2018-hoffmann-wing-venation.py                (hoffmann-wing-venation, reproduce)
#   7. 2015-santella-wormguides-celegans.py          (santella-wormguides-celegans, decode)
#   8. 2013-lobo-planform-morphology.py              (planform-morphology-animation, decode)
#   9. 2021-Cervera–Levin–Mafe.py                    (cervera-levin-mafe, reproduce)
#  10. 2013-chindapol-coral-flow.py                  (chindapol-coral-flow, reproduce)
#
# Protocol: each implementation was audited against morphoeval/rubric.yaml using
# only the target script(s) at commit 5659d5e, its local dataset/output files,
# and requirements.txt / requirements.lock.txt, without consulting prior audit
# scores.  These assessments do NOT supersede the primary checkpoint chain; they
# are parallel pk:LLMClaimAssessments of the same
# pkr:hypothesis/morphoeval-<sim>-<dim> nodes by a second pk:Model, so every
# active evaluated script in the repository has independent dual-agent scoring
# from two distinct model providers (Anthropic + Google for 9 scripts; OpenAI +
# Google for Cervera–Levin–Mafe).
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100
# scale (not calibrated probabilities).  Line numbers refer to the files at
# the checkpoint commit recorded below.

audit:
  id: 2026-10-17-blinded-sample-audit
  rubric_version: 0.1.0
  date: "2026-10-17"
  role: second_assessor
  blinded: true
  assessor:
