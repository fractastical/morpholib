  - id: chindapol-coral-flow
    name: Chindapol flow-driven coral growth
    organism: "Scleractinian coral Pocillopora verrucosa"
    script: 2013-chindapol-coral-flow.py
    output: chindapol_coral_flow_morphospace.png
    domain: morphogenesis
    status: evaluated
    source_refs: [chindapol2013]
    summary: >-
      Blinded second-assessor pass (gemini-4-argon).  Replaces Chindapol et
      al.'s (2013) 3D COMSOL Navier-Stokes + advection-diffusion accretive
      growth model of Pocillopora verrucosa with a declared 2D lattice
      diffusion-limited aggregation (DLA) random walk with horizontal drift,
      reproducing qualitative upstream-bending and compactification trends
      across five drift values.
    scores:
      model-fidelity:
        value: 38
        rationale: >-
          Honestly declares in the module docstring and in Panel (f) that the
          paper's coupled 3D laminar Navier-Stokes flow solver, nutrient
          advection-diffusion boundary layer, and normal-flux surface extension
          law are replaced by a 2D square-lattice biased random walk (DLA with
          drift + basal nutrient-shadowing survival probability).  While the
          substitution is transparent, a stochastic particle-sticking walk on a
          2D grid is a fundamentally different physical mechanism from
          continuum hydrodynamic advection-diffusion around a 3D branching
          colony, and the Peclet number Pe = u_0*L/D is not computed.
        evidence:
          - {file: 2013-chindapol-coral-flow.py, lines: [11, 36], note: "docstring explicitly states 3D Navier-Stokes/COMSOL is replaced by 2D DLA-with-drift"}
          - {file: 2013-chindapol-coral-flow.py, lines: [65, 137], note: "simulate_coral() 2D lattice random walk with drift bias"}
      specimen-match:
        value: 42
        rationale: >-
          Renders five 2D dendritic lattice clusters (700 particles each) that
          transition from radially symmetric branching at drift=0.00 to
          upstream-skewed, compactified forms at drift=0.22.  However, the
          1-pixel-wide jagged 2D DLA trees lack the smooth, thick, club-shaped
          3D branches of Pocillopora verrucosa and no CT scans or figures from
          Chindapol et al. (2013) are overlaid.
        evidence:
          - {file: 2013-chindapol-coral-flow.py, lines: [186, 231], note: "five drift regimes rendered in panels (a)-(c)"}
          - {file: docs/media/chindapol_coral_flow_growth.gif, lines: [0, 0], note: "animated 2D DLA growth across three flow regimes"}
      parameter-expressivity:
