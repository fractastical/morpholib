  - id: turing-gray-scott
    name: Gray-Scott reaction-diffusion patterns
    organism: "Generic (Turing pattern formation)"
    script: 1952-turing-morpho.py
    output: turing_patterns.gif
    status: evaluated
    source_refs: [turing1952, pearson1993]
    summary: >-
      Blinded second-assessor pass (gemini-4-argon).  Minimal 76-line forward-Euler
      Gray-Scott reaction-diffusion demo on a 200x200 periodic grid at (f=0.055,
      k=0.062).  Independently identified that inline comments mislabel the
      depleted substrate U as an inhibitor, that RNG seeding and literature
      citations are absent, and that the script's output file
      (turing_patterns_black_neon.gif, custom black-neon palette without axes)
      does not match docs/media/turing_gray_scott.gif.
    scores:
      model-fidelity:
        value: 68
        rationale: >-
          Implements the discrete 2D Gray-Scott reaction-diffusion system
          dU/dt = Du*Laplacian(U) - U*V^2 + f*(1-U), dV/dt = Dv*Laplacian(V) + U*V^2 - (f+k)*V
          with periodic boundary conditions via np.roll and parameters Du=0.16,
          Dv=0.08, f=0.055, k=0.062, dt=1.0.  Deducts 32 points because (1) the
          5-point finite-difference Laplacian omits the -4*Z centre weight inside
          laplacian() and absorbs it into Du*(Lu - 4*U), which is algebraically
          equivalent only for unit grid spacing dx=1, (2) inline comments misstate
          the reaction mechanism by claiming '# U inhibits V's growth quadratically'
          when U is the consumed substrate in autocatalytic production +U*V^2, and
          (3) the script conflates Turing's (1952) linear morphogen model with the
          cubic Gray-Scott (1984) / Pearson (1993) system.
        evidence:
          - {file: 1952-turing-morpho.py, lines: [6, 13], note: "Du=0.16, Dv=0.08, f=0.055, k=0.062, dt=1.0, steps=10000"}
          - {file: 1952-turing-morpho.py, lines: [25, 40], note: "laplacian() and update() with inaccurate comment '# U inhibits V's growth quadratically'"}
      specimen-match:
        value: 50
        not_applicable: true
        rationale: >-
