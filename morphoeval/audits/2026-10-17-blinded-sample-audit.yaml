    source_refs: [raup1962, raup1965, raup1966, raup1967, noshita2014, okabe2017]
    summary: >-
      Blinded second-assessor pass (gemini-4-argon).  Implements Raup's (1962,
      1966) four-parameter logarithmic-spiral shell model (W, D, T, S) using the
      parametric surface formulation of Noshita (2014) and Okabe & Yoshimura
      (2017), with an automated self_test() that recovers (W, D, T, S) from the
      3D mesh to machine precision (~5e-15).
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          Implements the logarithmic spiral growth law a(theta) = r0 * W^(theta / 2pi),
          generating-curve centre distance rc(theta) = a(theta)*(1+D)/(1-D) (yielding
          inner/outer margin ratio (rc - a)/(rc + a) = D), axial translation
          zc(theta) = T * rc(theta) (so dzc/drc = T Scales with whorl radius), and
          aperture shape S in the meridional plane through the coiling axis, verified
          to ~5e-15 by recover_parameters() in self_test().  Deducts 10 points because
          the standalone companion script 1966-raup.py hardcodes S = 1.0 and uses an
          unnormalised offset rc = r*(1+D) without (1-D) scaling.
        evidence:
          - {file: create_raup_animations.py, lines: [85, 131], note: "raup_shell() parametric surface implementation"}
          - {file: create_raup_animations.py, lines: [134, 211], note: "recover_parameters() and self_test() verifying parameter recovery to < 1e-9"}
          - {file: 1966-raup.py, lines: [10, 29], note: "simplified companion script with r_c = r*(1+D) and fixed circular cross-section"}
      specimen-match:
        value: 76
        rationale: >-
          Renders six distinct shell archetypes (planispiral involute cf. Nautilus,
          high-spired turreted cf. Turritella, evolute planispiral cf. Dactylioceras,
          low-spired obconical cf. Conus, medium-spired cf. Cerithium, helicoid
          globose cf. Helix) whose 3D geometries and spire-height/width ratios
