      reported_in_source:
      - 'Azpeitia et al. (2021) Science 373:192-197: loss of AP1/CAL in ap1 cal and Brassica curd meristems abolishes
        floral commitment while transient LFY induction leaves a SOC1/AGL24/FUL ''floral memory'' (bract suppression)
        and high TFL1 shoot identity, so lateral primordia reiterate spiral phyllotaxis across several branching
        orders; Cauliflower meristems keep a constant plastochron and form a hemispherical curd, Romanesco meristems
        grow and initiate ever faster (decreasing plastochron), forming conical self-similar curds with higher Fibonacci
        parastichy numbers'
      - 'Jönsson et al. (2006) and Smith et al. (2006): up-the-gradient PIN1 allocation on a cellular shoot-apex
        template produces auxin maxima whose threshold-triggered initiation, sink behaviour and outward advection
        reproduce spiral phyllotaxis near 137.5 deg; Reinhardt et al. (2003): pin1 / NPA apices form no primordia;
        Douady & Couder (1992): initiation rate scales with the free perimeter of the initiation ring'
      reconstructed_in_script:
      - RK45 solver for a coupled 4-node continuous Hill ODE GRN (WT g_AP1 = 1, ap1 cal / curd g_AP1 = 0, lfy loss-of-function
        control) with HAND-TUNED coefficients that hit the vendored steady-state targets (the paper's network is
        logical, not these ODEs)
      - 3D 4-order recursive phyllotactic meristem tree with exact quadratic plastochron initiation times N(T) =
        r0 T + beta T^2/2, a PRESCRIBED linear envelope H/R(beta) = 0.56 + 10.8235 beta, raw area-weighted 3D box-counting
        D_f, and MEASURED nearest-neighbour contact parastichies on the generated lattice ((8,13) at beta = 0 and
        (13,21) for beta >= 0.04 on the curd-scale T = 80 lattice; (3,5) on the per-axis T = 20 lattice)
      - 'Reduced cell-based PIN1 polar auxin transport (Jönsson 2006 allocation, Smith 2006 sinks/threshold/advection)
        on a growing jittered k-NN epidermal mesh over cones of H/R 0.56 and 1.48 at three dome radii: emergent
        initiation rate r_p(R) = -0.16 + 0.36 R (r = 0.99), emergent divergence median 133.9 deg (MAD 25.6), PIN1
        polarity index 0.57, T = 0 ablation gives 0 initiations; coupling beta_emergent = (k / r_p(R0)) v_r = 0.289
        at the vendored v_r = 0.16 (reference 0.085, implied v_r* = 0.047)'
      - 'Excess-green curd segmentation and two fixed-scale LoG floret detections (86 order-2, 421 order-3 cones)
        on the SHA-256-locked Romanesco specimen photograph, reported RAW: bounding-box H/R 1.76, lambda 0.390,
        2.5D relief box slope 2.36'
      transfer_boundary:
      - The vendored `plastochron_beta_sweep_benchmark_series`, `genotype_morphometric_benchmarks`, `radial_expansion_rate_v_r`
