    claim_boundary:
      reported_in_source:
      - 'Uriz et al. (2003): silicatein axial filaments with crystallographic symmetry template the ray geometry
        of siliceous spicules (monaxon, triactine, tetractin, hexactin)'
      - 'Aizenberg et al. (2005): Euplectella spicules are concentric silica lamellae (thickness ~1.5 um at the
        centre to ~0.2 um at the periphery) separated by organic interlayers; the cylindrical cage carries alternating
        diagonal bracing and external helical/oblique ridges; basalia act as optical fibres'
      - 'Weaver et al. (2007): laminated spicules fail gracefully under three-point bending through crack deflection
        at the organic interlayers, unlike monolithic silica rods'
      - 'Sundar et al. (2003) / Aizenberg et al. (2004): basalia have a high-index core and lower-index lamellar
        cladding and guide light (values recalled offline)'
      reconstructed_in_script:
      - 'O_h / T_d / D_3h / D_inf_h silicatein ray vectors, a 3D silicic-acid reaction-diffusion accretion solver
        with k_cat ablation, the h_n = h_1 r_1 / r_n lamellar law, checkerboard diagonal shear stiffness, a 12-species
        symmetry/toughness table, DoG + gradient-tangent segmentation of the vendored Euplectella photograph; Pass
        3: a 48-element Hermite-beam FE three-point-bend of the laminate with a bilinear cohesive interlayer, He-Hutchinson
        deflection criterion and Griffith delamination, coupled to the 3D solver through the accreted cross-section;
        helical-ridge torsion / ovalization gain; step-index basalia waveguide with meridional ray tracing and LP-mode
        counting'
      transfer_boundary:
      - The FE bending model is 1D (single midspan crack, outermost-in strength criterion, no friction, bridging
        or shear-lag) on the Law-3 geometry (outer radius 5.83 um, span 233 um), not Weaver et al.'s 3D cohesive-zone
        specimen geometry (r = 22.5 um in the species table); it predicts W_lam / W_mono = 1.71, not the 8.95 of
        the table nor the 9.0 of the Pass 2 eta-law
      - 'Ridge count, pitch and area ratio, the cohesive constants (sigma_f, G_s, T_max, delta_c), span/diameter,
        and the optical-core lamella count are modelling choices tagged `provenance: model`; E = 36 GPa, the He-Hutchinson
        0.25 ratio, n_core / n_clad and the Aizenberg lamella thicknesses are `recalled` and unverified'
      - The 12-species theta_obs_deg / toughness_ratio_obs columns are Pass 1 recalled numbers, not digitised measurements;
        their r = 1.0000 agreement with the model laws is not independent validation
      does_not_claim:
      - A 3D cohesive-zone finite-element reproduction of Weaver et al. (2007) load-displacement curves, measured
        ridge geometry from the specimen, measured numerical aperture or mode images of real basalia, or independent
        verification of any Pass 3 DOI or recalled constant
