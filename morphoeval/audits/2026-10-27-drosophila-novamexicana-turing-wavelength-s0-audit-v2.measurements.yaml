    claim_boundary:
      reported_in_source:
      - Turing 1952 dispersion relation and the requirement that inhibitor diffusion exceed activator diffusion.
      - Schnakenberg 1979 trimolecular kinetics.
      - 'Murray 1981: wavelength shortens as gamma^{-1/2}.'
      - 'Wittkopp et al. 2009 Science 326:540-544: pale D. novamexicana abdomen versus D. americana is largely ebony
        and tan cis-regulation.'
      - 'Lamb et al. 2020: ebony contributes to novamexicana versus americana pigmentation divergence.'
      reconstructed_in_script:
      - gamma = 1.00 (novamexicana), 1.79 (mojavensis), 2.60 (orena) at the assigned 1.901 µm detail scale.
      - a(x) = clip(0.10 * (1 - 0.35 tanh g(x))) from the vendored luminance.
      - Published-frame imprint amplitude 0.16, chosen as the strongest imprint that keeps Pearson r above 0.98
        and CV similarity above 80.
      transfer_boundary:
      - Predecessor and successor papers supply species context, not a 1.9 µm spacing.
      does_not_claim:
      - That Wittkopp or Lamb measured 1.901 µm.
      - That the gallery spiral is a micrograph of cuticle granules.
      - That the published frame is an unprocessed PDE solution. It is the vendored field imprinted with the activator
        at amplitude 0.16, after a(x) has been coupled.
      - Direct anagenesis from mojavensis through novamexicana to orena. The three are chronoseries neighbors at
        0 Ma.
