    claim_boundary:
      reported_in_source:
        - "Azpeitia et al. (2021) Science 373:192-197 coupled floral GRN (TFL1, LFY, AP1/CAL, SOC1/AGL24/FUL) showing that loss of AP1/CAL in ap1 cal and Brassica curd mutants abolishes floral commitment while transient LFY induction locks in SOC1 floral memory (bract suppression) and high TFL1 shoot identity, causing lateral primordia to reiterate spiral phyllotaxis across 4-6 branching orders"
        - "Azpeitia et al. (2021) Science 373:192-197 discovery that Cauliflower has a constant plastochron (beta = 0, N(T) = r0*T, hemispherical dome H/R ~ 0.56, (8,13) parastichies), whereas Romanesco has a linearly accelerating plastochron rate r_p(t) = r0 + beta*t (beta > 0, N(T) = r0*T + 0.5*beta*T^2, conical H/R ~ 1.48, (13,21) parastichies, 3D fractal dimension D_f ~ 2.71)"
      reconstructed_in_script:
        - "RK45 solver for the coupled 4-node nonlinear Hill ODE floral GRN across Wild-Type raceme (g_AP1=1), ap1 cal / Cauliflower / Romanesco curds (g_AP1=0), and lfy loss-of-function negative control"
        - "3D 4-order recursive spiral phyllotaxis meristem tree generator across plastochron acceleration beta in [0.0, 0.11] with KDTree Fibonacci contact parastichy detection ((8,13) -> (13,21)) and 3D multiscale box-counting fractal dimension D_f"
        - "Automated excess-green (2G-R-B) silhouette segmentation and multi-scale LoG conical floret detection (86 order-2 cones, 421 order-3 cones, empirical scale ratio lambda = 0.390, H/R = 1.52) on the SHA-256-locked Romanesco Brassica oleracea specimen photograph"
      transfer_boundary:
        - "Continuous Hill ODE GRN trajectories coupled to 3D recursive phyllotactic meristem trees and multi-scale LoG cone segmentation on macro photography"
      does_not_claim:
        - "Single-cell mechanical finite-element simulation of epidermal auxin transport PIN1 polarization within each individual dome apex"
