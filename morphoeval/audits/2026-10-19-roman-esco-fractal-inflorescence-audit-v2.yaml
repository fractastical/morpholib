      3D 4-order recursive phyllotactic meristem trees across 6 plastochron acceleration
      regimes beta in [0.0, 0.11] reproducing conical aspect ratio amplification (H/R r = 1.0000,
      p = 2.45e-16), 3D box-counting fractal dimension scaling (D_f r = 0.9994, p = 5.12e-7),
      and the (8,13) -> (13,21) Fibonacci contact parastichy transition; and segments 86
      order-2 and 421 order-3 conical florets on the SHA-256-locked Romanesco specimen
      photograph (`romanesco_brassica_oleracea_specimen.jpg`, H/R = 1.52, lambda = 0.390).
