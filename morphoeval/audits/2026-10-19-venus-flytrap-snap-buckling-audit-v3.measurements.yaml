    claim_boundary:
      reported_in_source:
      - 'Forterre et al. (2005): the Dionaea lobe is a doubly-curved shallow shell whose stretching-bending coupling
        alpha = L^4 kappa^2/h^2 produces a bistable snap-through (cusp catastrophe) once alpha exceeds a threshold;
        closure takes ~100 ms, far faster than the poroelastic limit; curvature-relief strip cutting abolishes snapping'
      - 'Hedrich & Neher (2018), Böhm et al. (2016), Suda et al. (2020): two trigger-hair touches within ~30 s (two
        action potentials, a Ca2+ threshold) are required to close the trap; Hodick & Sievers (1988) / Volkov et
        al. (2008): the lobe AP propagates at cm/s speeds with ~1-2 s duration (values conflict between sources)'
      - 'Scherzer et al. (2019), Procko et al. (2021): trigger hairs are micronewton mechanosensors with the stretch-activated
        channel FLYC1'
      reconstructed_in_script:
      - 2D doubly-curved shallow shell energy U(kappa_x, kappa_y) with Gauss stretching penalty, L-BFGS-B equilibrium
        relaxation, cusp fold metrics and RK45 inertial + poroelastic snap dynamics across alpha in [0.2, 5.0] (Pass
        2)
      - Boltzmann trigger-hair open probability -> receptor potential clamp on hair-footprint nodes -> P1-FEM IMEX
        FitzHugh-Nagumo action potential on a flat Delaunay lobe planform (2057 nodes), validated against the exact
        Nagumo front speed; per-node Ca2+ integrator with two-touch counting; lumped activated-area fraction A(t)
        gating the active rest curvature of the shell solver (Pass 3)
      transfer_boundary:
      - The electrical problem is solved on a FLAT 2D planform mesh, not on the curved mid-surface, and the FEM
        does not see kappa(t); the motor response is a scalar gate A(t) on a two-mode shell, not a spatially resolved
        turgor field
      - AP_DIFFUSIVITY_CM2_S, AP_TAU_V_S, TRIGGER_HAIR_F_HALF_UN, CA_INCREMENT_PER_AP and CA_DECAY_TAU_S are model
        constants chosen so that the analytic speed, threshold and memory window land in the recalled literature
        ranges; agreement in measurements 14 and 17 is therefore parameter-driven, only the FEM-load elevation above
        the 0-D threshold (liminal ratio 1.55) is emergent
      - The `*_obs` columns of venus_flytrap_snap_buckling_reference.json are generated by the same model, so measurements
        3-6 (r = 1.0000) are self-consistency checks, not comparisons with Forterre et al. (2005) data
      does_not_claim:
      - Hodgkin-Huxley-type Ca2+/Cl-/K+ channel kinetics, a trigger-hair lever/podium FEM, mechanical feedback from
        shell curvature onto the electrics, digitised Forterre (2005) Fig. 2-3 time series, or online-verified DOIs
        for the 8 electrophysiology references added in Pass 3
