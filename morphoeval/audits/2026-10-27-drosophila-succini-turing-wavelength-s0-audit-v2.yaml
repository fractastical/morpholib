# Supersedes 2026-10-27-drosophila-succini-turing-wavelength-s0-audit.
# Image fitness is scored from the GIF with morphoeval/verify_image_fitness.py's CV function
# and written only to the per-loop JSON (shared indexes are not updated).
audit:
  id: 2026-10-27-drosophila-succini-turing-wavelength-s0-audit-v2
  rubric_version: 0.1.0
  date: "2026-10-27"
  supersedes: 2026-10-27-drosophila-succini-turing-wavelength-s0-audit
  supersedes_audit_id: 2026-10-27-drosophila-succini-turing-wavelength-s0-audit
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (loop 3172 builder-assessor, pass 2)"
    homepage: https://x.ai
  publisher_orcid: "https://orcid.org/0009-0007-4948-9192"
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 0c76d15d
    note: >-
      Same parent commit as pass 1. Slot files are new in the loop commit.
      Scale 2.8 µm (2.759e-06 m), Middle Eocene, 44 Ma. Signing profile
