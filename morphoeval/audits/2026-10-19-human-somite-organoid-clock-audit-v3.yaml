          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [949, 959], note: "Coupled vs coupling-ablated control sharing the same DAPT reset (delta R = 0.64)", supports: true}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [1298, 1306], note: "6-regime Pearson r measurement reports a calibration as validation (regimes encode observed periods)", supports: false}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [1318, 1326], note: "SEM spacing reference_value 47.14 is the script's own measurement", supports: false}
      source-traceability:
        value: 92
        rationale: >-
          Nine primary sources with DOIs in the docstring, dataset README, BibTeX and reference JSON; the five Pass 3
