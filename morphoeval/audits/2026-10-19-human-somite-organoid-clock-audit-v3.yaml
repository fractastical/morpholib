simulations:
  - id: diaza-human-somite-organoid-clock
    name: "Diaz-Cuadros et al. (2020, 2023) & Matsuda et al. (2020) human pluripotent stem-cell segmentation clock and metabolic tempo scaling model"
    organism: "Homo sapiens vs Mus musculus (hPSC-derived presomitic mesoderm / axioloid somite organoid)"
    script: 2019-diaza-human-somite-organoid-clock.py
    output: docs/media/human_somite_organoid_clock_comparison.png
    extra_outputs:
      - docs/media/human_somite_organoid_clock_notch_lattice.png
      - docs/media/human_somite_organoid_clock_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-human-somite-organoid-clock-audit-v2
    claim_boundary:
      reported_in_source:
        - "Diaz-Cuadros et al. (2020) Nature 580:113-118: ~5.0 h (300 +/- 18 min) HES7-Achilles oscillations in human pluripotent stem-cell-derived presomitic mesoderm vs ~2.0 h (122 min) in mouse PSM"
        - "Matsuda et al. (2020) Science 369:1450-1455: species-specific HES7 intron splicing delay and protein/mRNA half-lives, not the hHES7 locus sequence, govern the ~2.5x human slowdown; intronless Hes7 abolishes oscillations"
        - "Diaz-Cuadros et al. (2023) Nature 613:550-557: mitochondrial ETC activity and cytosolic NAD+/NADH modulate translation rate and clock period (LbNOX acceleration ~228 min, azide/rotenone slowdown ~402 min)"
        - "Matsuda et al. (2020) Nature 580:124-129: a DAPT pulse followed by washout synchronises HES7 oscillations across hPSC-derived PSM cultures; Riedel-Kruse et al. (2007) Science: Notch inhibition desynchronises segmentation clock cells; Herrgen et al. (2010) Curr. Biol.: delayed intercellular coupling sets the collective period"
        - "Yamanaka et al. (2023) Nature 614:509-520 and Sanaki-Matsumiya et al. (2022) Nat. Commun. 13:2325: epithelial somite rosettes form only in Matrigel-embedded human axioloids / somitoids (qualitative)"
      reconstructed_in_script:
        - "Delayed autoinhibitory HES7 TTFL RK2 DDE solver (mouse WT 122.00 min; rescaled 'human' cell 300.01 min), exact tempo-rescaling collapse across lambda in [1, 3] (max std 2.32e-13 nM), intronless-Hes7 subcritical collapse, and a 6-regime series whose per-regime tempo factors are hard-coded from the observed periods (Pearson r = 0.9999 is a calibration, not a prediction)"
        - "6-species vertebrate clock allometry (r = 0.9970) from a vendored species table of delays/half-lives, a kinematic (not DDE-derived) axioloid phase-wave kymograph, and bilateral DoG somite segmentation on a chick embryo SEM (47.14 px mean spacing, CV 0.2010)"
        - "Pass 3: DLL1-Notch delay-coupled HES7 lattice (12 x 12 hex, eps = 0.25, tau_c = 0.8 T, 5 % tempo CV) through the DAPT pulse-washout protocol: R_0 = 0.19 -> R_pre = 0.40 after 5 coupled cycles; DAPT amplitude ratio 0.17; washout reset R = 0.9995; R retained after 6 cycles = 0.85 (coupled) vs 0.21 (coupling-ablated, lost at 3.0 cycles); T_coll = 298.2 min; in-phase stable for tau_c/T in [0.625, 0.95]; T_coll(tau_c) spans 235-417 min; R_end(eps) 0.26 -> 0.96 (eps 0 -> 0.25), 0.88 at 0.35"
        - "Pass 3: reduced 2D cell-centre Matrigel rosette model: P_rad = -0.08 (0 %) -> 0.99 (10 %), epithelial fraction 0 -> 0.67, aggregate radius 85 -> 28 um, Matrigel sweep Spearman rho = 0.94"
      transfer_boundary:
        - "Single-cell / lattice HES7 DDE kinetics are compared with a chick (Gallus gallus) dorsal SEM, not with a human axioloid image; the 47.14 px 'reference' spacing is the script's own measurement recorded in the dataset JSON"
        - "tau_c = 0.8 T (240 min) is an assumption from delayed-coupling-theory stability, not a human measurement; the DAPT basal promoter fraction b = 0.1 and the competitive-promoter gate (synthesis and threshold both scaled by (1 - eps) + 2 eps S) are modelling reductions"
        - "Matrigel stiffness kappa = 0.01 min^-1 per % and the polarisation / constriction rate constants are phenomenological; the rosette reference values (P_rad = 1, contrast = 1) are geometric ideals, not measured organoid morphometrics"
      does_not_claim:
        - "Prediction of the LbNOX / azide / hHES7-swap periods from independently measured kinetics (they are encoded); 3D actomyosin apical-constriction FEM; Matrigel rheology; measured human Notch coupling delay; Floquet/stability analysis of the coupled DDE beyond the numerical lattice scan"
    source_refs:
      - diazcuadros2020
      - matsuda2020
      - diazcuadros2023
      - yamanaka2023
      - matsuda2020recapitulating
      - lewis2003
      - riedelkruse2007
      - herrgen2010
      - sanakimatsumiya2022
    summary: >-
      Pass 3 closes both v2 remediation items: Section 4b couples the delayed HES7 TTFL to DLL1-Notch delay signalling
      on a 12 x 12 hexagonal PSM lattice and reproduces the Matsuda (2020) Nature DAPT pulse-washout logic (slow
      partial synchronisation from random phases, R 0.19 -> 0.40; DAPT collapse; washout reset R ~ 1.00; Notch
      coupling retains R = 0.85 after 6 cycles vs 0.21 without coupling; collective period 298 min), with Herrgen
      (2010) coupling-delay and coupling-strength sweeps and an exact mean-field reduction proven in Lean; Section 4c
      adds a Matrigel elastic boundary force to a reduced 2D rosette model that epithelialises only when embedded
      (P_rad -0.08 -> 0.99 from 0 % to 10 % Matrigel, Spearman rho 0.94). The overall score nevertheless falls from
      91.7 to 80.0 because the re-audit exposed that the 6-regime perturbation series is calibrated to the observed
      periods it is scored against (r = 0.9999 is circular), the 'human' cell is a rescaled mouse cell rather than the
      vendored Matsuda (2020) human kinetics, the kymograph is kinematic, the specimen is a chick SEM with a
      self-referential reference value, and two CLI parameters are dead. Those defects are now carried explicitly as
      Pass 4 remediation items.
    scores:
      model-fidelity:
        value: 80
        rationale: >-
          Credit: the HES7 DDE (L189-294) is the Lewis/Matsuda delayed-autorepression form with separate tau_tx /
          tau_tl and half-life degradation rates; exact tempo-rescaling invariance is implemented and verified
          (L297-363); the new lattice (L734-947) couples cells through a delayed neighbour-mean DLL1 signal gating
          HES7 transcription (Lewis 2003 form, competitive-promoter threshold shift), reduces exactly to a single
          self-coupled DDE in the in-phase state (Lean theorem 4), and reproduces the delayed-coupling-theory result
          that in-phase synchrony depends on tau_c / T; DAPT is modelled as loss of NICD (basal promoter) and the
          washout reset follows. The Matrigel model (L1040-1151) implements an explicit elastic boundary force whose
          scaling is proven in Lean theorem 5. Deductions: the 6-regime series (L402-416) overrides its own generic
          formula with per-regime lam_eff values taken from the observed periods, so laws 2-3 are illustrated, not
          implemented as predictive kinetics (-8); the human regime does not use the vendored Matsuda (2020) human
          parameters (tau = 51, t_1/2,p = 40 min) but a 2.459x rescaled mouse cell (-4); the coupling gate scales
          both synthesis and repression threshold by the same factor, a reduction not derived from a promoter model,
          and tau_c = 0.8 T is chosen for stability rather than measured (-3); the rosette polarisation /
          epithelialisation rules are phenomenological (-3); the kymograph (L549-599) is a kinematic cosine wave
          unrelated to the DDE (-2).
        evidence:
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [189, 294], note: "RK2 midpoint delayed HES7 mRNA/protein DDE with ln2/t_half degradation and parabolic peak period", supports: true}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [734, 947], note: "DLL1-Notch delay-coupled lattice: heterogeneous delays (L784), competitive-promoter gate and K_eff (L836-837), neighbour mean W @ D (L865), uniform-rate phase and Kuramoto R (L868-869), post-transient collective period (L898)", supports: true}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [989, 1027], note: "Herrgen coupling-delay sweep on the exact mean-field reduction plus 8x8 lattice in-phase stability test", supports: true}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [1040, 1151], note: "Matrigel rosette: k_M = kappa*phi shell force (L1109), ECM-contact polarisation (L1098), apical constriction (L1105), f(phi) Hill cue (L1072)", supports: true}
          - {file: morphoeval/lean/loops/Loop_028_human_somite_organoid_clock.lean, lines: [121, 212], note: "Theorems 4 (mean-field reduction, 3N edges, DAPT gating) and 5 (Matrigel boundary-force scaling), 0 sorrys", supports: true}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [402, 416], note: "Per-regime lam_eff hard-coded from observed periods (human WT = 300/122; LbNOX/azide = (300/122)*(0.41/k_met)); the 6-regime fit is circular", supports: false}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [608, 623], note: "'Human' cell kinetics = mouse anchor dilated by 300/122 (tau_tx 30.5, tau_tl 13.1, t_1/2,p 38.1 min), not the vendored tau = 51 / t_1/2,p = 40 min", supports: false}
      specimen-match:
        value: 72
        rationale: >-
          Judged on the regenerated PNGs: Panel E overlays the detected bilateral somite rows on the SEM and the
          periodicity is visibly matched (Panel F waveform r = 0.48); the new lattice figure shows the expected
          phenomenology (incoherent -> partially clustered -> collapsed -> reset -> coupled lattice stays ordered
          while the ablated one scrambles), and Panel I shows a compact radially polarised rosette inside the
          Matrigel shell against a dispersed unpolarised 0 % aggregate. Deductions: the specimen is a chick embryo
          SEM (dataset JSON L60), not a human axioloid or any figure from the four source papers, so the human
          organoid morphology itself is never compared (-12); the rosette and lattice panels are compared with no
          side-by-side image from Yamanaka (2023) / Matsuda (2020) Nature (-8); the kymograph (Panel D) is a
          hand-drawn kinematic wave (-4); the rosette is a 24-cell 2D cross-section without a lumen or the
          multi-somite periodic array of the axioloid (-4).
        evidence:
          - {file: docs/media/human_somite_organoid_clock_comparison.png, lines: [0, 0], note: "3x3 figure: A-C clock traces/regimes/allometry, D kinematic kymograph, E-F SEM segmentation and waveform fit, G Kuramoto R through DAPT washout, H tau_c/eps sweeps, I 0 % vs 10 % Matrigel rosette with sweep inset", supports: true}
          - {file: docs/media/human_somite_organoid_clock_notch_lattice.png, lines: [0, 0], note: "2x4 hex-lattice phase maps, coupled vs coupling-ablated, at pre-DAPT / DAPT end / washout+1 / washout+6 cycles", supports: true}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [1211, 1251], note: "Bilateral DoG somite segmentation of the vendored SEM with bilateral spacing, CV and phase-gated waveform correlation", supports: true}
          - {file: datasets/human_somite_organoid_clock/human_somite_organoid_clock_reference.json, lines: [56, 89], note: "Specimen is Wikimedia 'Aves Neural tube and somites in chick embryo' (chick, not human organoid); empirical_somite_metrics are the script's own outputs", supports: false}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [549, 599], note: "Axioloid kymograph is a prescribed cos(omega t - phase_lag(x)) wave with hand-set somite boundaries, not DDE output", supports: false}
      parameter-expressivity:
        value: 84
        rationale: >-
          Four parameters now visibly control the form they should: lambda dilates the period exactly linearly
          (L297-363); Notch coupling strength eps raises retained synchrony 0.26 -> 0.96 over 0 -> 0.25 (L961-987);
          the coupling delay tau_c/T switches in-phase stability off below ~0.6 and on above it and modulates the
          collective period 235 -> 417 min (L989-1027); the Matrigel fraction raises rosette polarity monotonically
          (Spearman rho 0.94) and shrinks the aggregate 85 -> 28 um (L1153-1176). Deductions: `--tau-human` and
          `--thalf-human` are parsed but never used (L1931-1932) (-6); the 6 regimes and 6 species are not swept
          parameters but hard-coded tempo factors (L402-416, L498) (-6); R_end(eps) is non-monotone at eps = 0.35
          (0.88 < 0.96), so the stated monotone control holds only up to 0.25 (-2); pre-DAPT synchronisation from
          random phases reaches only R = 0.40 in 5 cycles, and the lattice size / heterogeneity are not swept (-2).
        evidence:
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [961, 987], note: "Coupling-strength sweep eps in {0, 0.05, 0.1, 0.15, 0.25, 0.35} with Spearman rho", supports: true}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [989, 1027], note: "Coupling-delay sweep: mean-field T_coll(tau_c) and lattice in-phase stability window", supports: true}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [1153, 1176], note: "Matrigel sweep 0-20 % with polarity, epithelial fraction, apical convergence, circularity and Spearman rho", supports: true}
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [1931, 1936], note: "--tau-human / --thalf-human are never read (dead parameters); --eps-notch / --tau-c-fraction / --matrigel-pct do drive an extra run", supports: false}
      morphometric-validation:
        value: 74
        rationale: >-
          Nine measurements with units and references are emitted by `measure_morphoeval()` (L1256-1368): period
