# MorphoEval audit — Diaz-Cuadros et al. (2020, 2023) & Matsuda et al. (2020) Human Segmentation Clock, 2026-10-19 (v3)
#
# Pass 3 remediation-round re-score of `2019-diaza-human-somite-organoid-clock.py` (Slot 028) in the instrumented
# loop `morphoeval/runs/2026-10-19-human-somite-organoid-clock-loop-pass3`, superseding
# `2026-10-19-human-somite-organoid-clock-audit-v2` (91.7).
#
# What Pass 3 changed (both open v2 remediation items):
#   1. Section 4b (L602-1027): the single-cell delayed HES7 TTFL is coupled to intercellular DLL1-Notch delay
#      signalling on a 12 x 12 odd-r hexagonal PSM lattice (144 cells, 100 interior 6-neighbour cells) with 5 %
#      cell-autonomous tempo heterogeneity, run through the Matsuda et al. (2020) Nature DAPT pulse-washout
#      protocol (random phases -> coupled -> DAPT collapse -> washout). Synchrony is the Kuramoto order parameter
#      of a uniform-rate limit-cycle phase; a coupling-ablated control, a coupling-strength sweep and a Herrgen
#      (2010) coupling-delay sweep (collective period + in-phase stability) are included.
#   2. Section 4c (L1030-1176): a reduced 2D overdamped cell-centre model of one axioloid somite cross-section with
#      an explicit Matrigel elastic boundary force k_M(phi) = kappa * phi, ECM-contact polarisation, epithelialisation
#      and apical constriction; Matrigel fraction swept 0 -> 20 %.
#   3. Two new Lean 4 theorems (mean-field reduction / 3N edges / DAPT gating; Matrigel boundary-force scaling),
#      registered as laws 4-5 in the math KG; 5 new Crossref-verified references; 9 measurements (was 5);
#      self-test 5 -> 8 blocks with bitwise-determinism checks for the lattice and the rosette.
#
# What Pass 3 exposed (reasons the score goes DOWN from 91.7): the 6-regime "validation" in
# `evaluate_perturbation_series` is circular — each regime's tempo factor lam_eff is hard-coded from the observed
# period (human WT lam_eff = 300/122; LbNOX and azide lam_eff = (300/122)*(0.41/k_met), where the JSON k_met values
# 0.54 and 0.31 are themselves 0.41*300/228 and 0.41*300/402), so Pearson r = 0.9999 and RMSE = 2.18 min measure
# the calibration, not a prediction. The "human" cell is a rescaled mouse cell (tau_tx = 30.5, tau_tl = 13.1 min,
# t_1/2,p = 38.1 min) rather than the Matsuda (2020) measured human kinetics vendored in the JSON (tau = 51 min,
# t_1/2,p = 40 min), and the v2 measurement text claiming "tau_total = 51 min" was wrong (now corrected). The
# specimen is a chick embryo SEM whose "reference" spacing (47.14 px) is the script's own output written back into
# the JSON. `--tau-human` / `--thalf-human` are dead CLI parameters. The v2 scores of 94/93/92 did not reflect these.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the files at commit d58a084 with the Pass 3 working-tree edits applied (script = 1960 lines).

