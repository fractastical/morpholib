        evidence:
          - {file: 2019-diaza-human-somite-organoid-clock.py, lines: [145, 176], note: "EXPECTED_SHA256 pins specimen + scout manifest; verify_dataset_integrity fails closed; reference JSON digest computed, not pinned", supports: true}
          - {file: datasets/human_somite_organoid_clock/human_somite_organoid_clock_reference.json, lines: [273, 375], note: "Pass 3 Notch-lattice / DAPT protocol and Matrigel mechanics tables with sources, anchors and caveats", supports: true}
          - {file: datasets/human_somite_organoid_clock/paper_citations.bib, lines: [45, 97], note: "Five Pass 3 BibTeX entries (Matsuda 2020 Nature, Lewis 2003, Riedel-Kruse 2007, Herrgen 2010, Sanaki-Matsumiya 2022), Crossref-verified", supports: true}
