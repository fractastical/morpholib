      reported_in_source:
      - 'Jönsson et al. (2006) PNAS 103:1633-1638 & Smith et al. (2006) PNAS 103:1301-1306: up-the-gradient PIN1
        membrane allocation P_ij = P_i exp(c_1 a_j) / sum_k exp(c_1 a_k) with explicit PIN1 membrane cycling kinetics
        whose quasi-steady state is that allocation, intercellular active polar + diffusive auxin transport, and
        periodic convergence maxima separated by a characteristic wavelength'
      - 'Geldner et al. (2001) Nature: brefeldin A blocks PIN1 exocytosis and internalises plasma-membrane PIN1
        within 1-2 h; Paciorek et al. (2005) Nature: auxin inhibits PIN endocytosis'
      - 'Bayer et al. (2009) Genes Dev: epidermal up-the-gradient patterning couples to subepidermal with-the-flux
        canalization (Mitchison 1980/1981; Feugier et al. 2005) producing a narrow provascular strand from the L1
        convergence point to the existing vasculature; Scarpella et al. (2006): PIN1-marked preprocambial strands
        are 1-2 cells wide'
      - 'Smith et al. (2006): transitions across spiral (137.5 deg), distichous (180 deg), decussate (90 deg) and
        tricussate (120 deg) phyllotaxis with meristem size; Reinhardt et al. (2003) Nature: NPA/pin1 pin-formed
        apex and localized IAA rescue'
      reconstructed_in_script:
      - Explicit per-cell cytosolic + per-wall membrane PIN1 pools cycling by first-order exocytosis (targeting
        f_ij = exp(c_1 (a_j - a_0))) and endocytosis, solved by an exact exponential integrator (membrane + cytosol
        conservation err 0.0, flux antisymmetry err 1.3e-14), with QSS ablation, BFA block (PM fraction 0.086 after
        2 h vs 0.091 first-order prediction; polarity 0.052 vs WT 0.584), auxin-inhibited-endocytosis variant (polarity
        0.21) and fast-cycling Boltzmann limit (max |P - Boltzmann| 0.013)
      - 'Quasi-3D 15 x 12 subepidermal slice beneath P1 with with-the-flux Hill feedback f_ij = f_0 + J^n/(K^n +
        J^n): single-file strand (width 1 cell at mid-depth, mean 1.0 over rows 1-8, flux concentration 0.63, 97
        % of source flux delivered to the sink); no-feedback ablation width 14 cells; Hill-exponent sweep widths
        {15, 6, 1, 1, 1} for n in {1, 1.5, 2, 2.5, 3} (Spearman rho -0.89, p 0.04)'
      - Linearized Turing-like dispersion relation with kappa_4 calibrated so that the peak sits at the 5.2-cell
        reference (threshold c_1 a_0 = 1.75; NPA collapse sigma(k) < 0); 1D ring NPA (contrast 1.000, 0 peaks) and
        IAA-paste rescue (1 peak at 60 deg)
      - ExG + DoG segmentation of 410 leaf tips on the SHA-256-locked Aeonium tabuliforme rosette (12/12 sectors,
        NN 1 - CV = 0.774)
      transfer_boundary:
      - 'The 180-cell dome does NOT generate its primordia: P1..P8 are seeded at golden-angle targets (L396-397)
        and the auxin field is relaxed toward a prescribed envelope (L508-513); only the PIN1 trafficking, polarity,
        conservation and BFA/QSS/fast-cycling results are emergent outputs of that function'
      - The four phyllotactic regimes are prescribed (nominal angle + seeded noise, L944-957; spiral placed at k*137.5
        deg, L923-931) and the WT ring profile is hand-built (L1025-1028); Gamma is a label, not a control parameter
      - The canalization model is one non-growing vertical slice with a uniform Dirichlet sink row, no lateral neighbours'
        strands, no growth and no 3D geometry; strand width is compared to a literature band (1-2 cells), not to
        a vendored PIN1::GFP image
      - The rosette specimen is Aeonium tabuliforme (top-down leaf rosette), not an Arabidopsis inflorescence meristem
      does_not_claim:
      - Full 3D meristem geometry, tissue growth or cell division, PIN1 phosphorylation (PINOID/PP2A) control of
