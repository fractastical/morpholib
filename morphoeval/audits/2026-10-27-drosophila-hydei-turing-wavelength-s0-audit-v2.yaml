# MorphoEval audit — Drosophila hydei detail-scale Turing wavelength, loop 3189, pass 2.
# Closes pass-1 items R1 (oscillatory-mode envelope), R2 (GIF CV measurement),
# and R3 (asymptotic KS). Same single assessor. Nanopub profile is absent.

audit:
  id: 2026-10-27-drosophila-hydei-turing-wavelength-s0-audit-v2
  supersedes_audit_id: 2026-10-27-drosophila-hydei-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, single agent; no second assessor)"
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
