      reported_in_source:
      - Douady & Couder (1992) Phys. Rev. Lett. 68:2098-2101 iterative magnetic-dipole repulsion energy E(phi) =
        sum_{k>=1} d_k(phi, phi_{n-k})^{-3} on a circular rim r = R_0 with linear dish advection r_k = R_0(1 + kG)
        controlled by the plastochron ratio G = V T / R_0; Figs. 1-2 dish regimes (1,1), (2,3), (3,5), (5,8), (8,13)
        and a metastable Lucas (4,7)
      - 'Douady & Couder (1992) Fig. 3 & (1996) J. Theor. Biol. 178:255-274 Secs. 3-4: supercritical (1,1)->(1,2)
        pitchfork of the iterated map, imperfect pitchfork cascade along the Fibonacci branch -> 137.508 deg, disconnected
        Lucas branch -> 99.502 deg, and nearest-neighbour contact parastichies on the van Iterson lattice'
      reconstructed_in_script:
      - Exact static Hessian fold (G_fold = 0.773484 exp / 2.514560 lin) AND dynamical pitchfork (G_c1 = 0.859019
        exp full chain / 3.631432 lin 2-drop) roots, the EMERGENT threshold of the unclamped iterated map (G_c1^emp
        = 0.8595 by bisection), the regular-spiral zero-force locus F(G, dphi) = 0, and adiabatic continuation along
        both Fibonacci (r = 0.99999, RMSE = 0.065 deg, contact pairs 9/10 table rows) and Lucas (RMSE = 0.141 deg)
        branches
      - Nearest-neighbour contact parastichy pairs on the true radii r_k = exp(kG) (Delaunay census kept as a secondary,
        biased extractor), memory-depth sweep N_mem in {1,2,3,5,8,13,21,45}, gamma in {1,3,5} universality, and
        simulated divergence / pair at the six tabulated dish regimes (RMSE 0.141 deg, 6/6 pairs)
      - Reciprocal-lattice inversion m*alpha + omega_m*G = 2*pi*j_m of the sub-bin (5, 8) log-polar FFT peaks of
        `conifer_cone_specimen.jpg` giving alpha_emp = 138.03 deg and G_emp = 0.0308, validated on a synthetic log-polar
        image of the simulated G = 0.06 lattice (0.014 deg / 0.06 % recovery error)
      transfer_boundary:
      - Exponential meristem advection r_k = R_0 exp(kG) is displayed in the log-radial projection rho = 1 + ln(r/R_0)
        = 1 + kG, which coincides with the PRL 1992 silicone-oil dish geometry; the mature cone's apparent radial
        law fits the linear dish law better (R^2 0.977) than the exponential law (R^2 0.899), and its lattice is
        not perfectly log-periodic (closure residual 2.2 bins), so G_emp = 0.031 is an effective, not a developmental,
        plastochron ratio
      - The 'observed' per-regime divergence means in the reference table are regime-level readings of Douady &
        Couder (1992) Figs. 1-2 and text, not digitised data with uncertainties; the dish-regime RMSE of 0.141 deg
        should be read against that provenance
      does_not_claim:
      - Subcellular PIN1 polar auxin efflux carrier trafficking or continuous reaction-diffusion PDE dynamics on
