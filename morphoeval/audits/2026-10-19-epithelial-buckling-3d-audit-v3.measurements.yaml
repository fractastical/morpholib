    claim_boundary:
      reported_in_source:
      - 'Hannezo, Prost & Joanny (2014): single-cell energy E_cell(A) = (Gamma_a + Gamma_b) A + c Gamma_l V_0 /
        (2 sqrt A) gives h_0/d_0 = c Gamma_l / [4 (Gamma_a + Gamma_b)] spanning squamous/cuboidal/columnar; an elastic
        foundation selects lambda_c = 2 pi (kappa_eff / K_sub)^(1/4); apico-basal tension asymmetry sets a spontaneous
        curvature whose sign follows Gamma_a - Gamma_b'
      - 'Krajnc & Ziherl (2015): convexity of the cell energy at equilibrium and the continuum elastic limit of
        the 3D vertex monolayer'
      - 'Gómez-Gálvez et al. (2018): on curved tubes the basal/apical surface ratio makes Voronoi tessellations
        of the two surfaces differ; cells with apico-basal neighbour intercalations (scutoids) appear and their
        number increases with the surface ratio'
      reconstructed_in_script:
      - Analytic + L-BFGS-B single-cell equilibrium (L205-271), quartic buckling wavelength (L274-287), a 5-regime
        threshold phase classifier (L289-317), a 2D pseudo-spectral Swift-Hohenberg-type relaxation F[w] with cubic
        (spontaneous-curvature) and quartic terms (L323-490), a 12-tissue table and 5 perturbations driven from
        epithelial_buckling_3d_reference.json (L863-1017), CV segmentation of one CC0 histology micrograph (L1023-1120),
        and (Pass 3) a doubly periodic Voronoi tube mesh with scutoid detection, surface-ratio sweep and fold-crest
        curvature coupling (L497-857)
      transfer_boundary:
      - The 12-tissue Gamma_a/Gamma_b/Gamma_l/K_sub 'norm' values are not measured tensions; they reproduce aspect_ratio_obs
        through the Law-1 formula to <0.5 % per row and carry no per-row source, so the r = 1.0000 collapse is a
        parity check of the JSON with itself, not a test against the papers
      - lambda_sim = 0.85 lambda_c + 0.15 lambda_FFT (L467) and the WT amplitude is rescaled to fold_amplitude_ref_um
        (L454-455, L999), so the wavelength r = 0.9993 and the WT amplitude 'match' are dominated by construction
      - The scutoid mesh is a Voronoi projection (seeds fixed, lateral faces evaluated geometrically); it is not
        a relaxed 3D vertex model and no Gómez-Gálvez figure value is digitised - the scutoid reference values are
        geometric identities (f_s(1) = 0, mean neighbours 6, Spearman 1) plus a crest ratio derived from the already-pinned
        WT fold geometry
      does_not_claim:
      - A relaxed 3D vertex/scutoid energy (apical, basal and lateral tensions minimised with free vertices), T1
        or apico-basal intercalation dynamics, quantitative agreement with the Gómez-Gálvez scutoid counts in salivary
        gland / egg chamber tubes, measured per-tissue surface tensions, or more than one histological specimen
