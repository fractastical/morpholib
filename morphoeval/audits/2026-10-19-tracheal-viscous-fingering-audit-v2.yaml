simulations:
  - id: sugimura-tracheal-viscous-fingering
    name: "Nelson et al. (2017) Development & Kim et al. (2015) Dev. Cell microfluidic transmural pressure, Laplace epithelial wall stress, and ASM peristalsis driving embryonic lung branching"
    organism: "Mus musculus & Gallus gallus (Embryonic lung airway tree under microfluidic transmural pressure control)"
    script: 2015-sugimura-tracheal-viscous-fingering.py
    output: docs/media/tracheal_viscous_fingering_comparison.png
    extra_outputs:
      - docs/media/tracheal_viscous_fingering_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Nelson, Gleghorn, Myers, Radisky & Stone (2017) Development 144:4328-4335 microfluidic chest cavity experiments proving that embryonic lung branching rate dN_tips/dt and synchronized airway smooth muscle (ASM) peristaltic wave frequency f_ASM depend strictly on the transmural pressure difference Delta P = P_lumen - P_pleura and are invariant under common-mode hydrostatic pressure shifts (P_lumen + P_0, P_pleura + P_0)"
        - "Laplace-Young circumferential epithelial wall stress sigma_theta = Delta P * R / h driving mechanosensitive FGF10/ERK1/2/Etv4 distal tip proliferation and bifurcation above critical threshold Delta P_c approx 50 Pa (Unbekandt et al. 2008 Mech. Dev. 125:314-324; Nelson et al. 2017)"
        - "Kim et al. (2015) Dev. Cell 34:668-681 & Nelson et al. (2017) nifedipine L-type Ca2+ channel blockade of ASM peristaltic contractions or tracheal intubation drainage (Delta P <= 0 Pa) collapsing terminal bud bifurcation"
      reconstructed_in_script:
        - "Coupled 2D spatial microfluidic bronchial tree and Laplace wall stress solver (`simulate_2d_microfluidic_lung_tree`) plus 8-point Delta P in [0, 400] Pa sweep (`evaluate_transmural_pressure_sweep`), reproducing 48h terminal bud counts (Pearson r = 0.99993, RMSE = 0.3046 buds, p = 7.42e-13), branching rate Gamma_branch (Pearson r = 0.99986, RMSE = 0.0085 day^-1, p = 6.81e-12), and ASM contraction frequency f_ASM (Pearson r = 0.99850, RMSE = 0.0110 min^-1, p = 8.44e-9)"
        - "Exact common-mode gauge invariance verification across (P_lumen, P_pleura) = (200, 0), (0, -200), and (500, 300) Pa (max deviation = 0.0000), alongside nifedipine Ca2+ channel blockade (fold-change = 1.1636 vs 4.7065 intact, 4.045x suppression) and tracheal drainage (0 Pa fold-change = 1.0000, 4.707x suppression)"
        - "Computer-vision segmentation (`segment_embryonic_lung_specimen`) of the vendored Mus musculus pseudoglandular E11-E16.5 embryonic lung specimen (`embryonic_lung_branching_specimen.jpg`, CC BY 3.0) extracting 17 distal terminal buds, effective bifurcation generation depth log2(17) = 4.0875, distal-to-total airway area fraction = 0.6885, and mean distal tip radius = 3.8470 +- 1.3152 px"
      transfer_boundary:
        - "2D projected bronchial tree and continuum Laplace hoop stress field mapped to whole-mount E11.5-E16.5 pseudoglandular mouse lung explants in microfluidic chest chambers"
      does_not_claim:
        - "Full 3D Navier-Stokes Stokesian fluid-structure interaction of individual ciliated epithelial cells or single-channel CaV1.2 gating kinetics"
    source_refs:
      - nelson2017
      - kim2015
      - unbekandt2008
      - jaslove2018
      - morrisey2010
    summary: >-
      Pass 2 (v2) evaluation of `2015-sugimura-tracheal-viscous-fingering.py` (overall
      weighted score: 94.0/100, up from 54.0/100 in v1). The remediated script implements
      a coupled 2D spatial microfluidic bronchial tree and Laplace wall stress solver
      across Delta P in [0, 400] Pa, matching Nelson et al. (2017) Development empirical
      48h terminal bud counts (Pearson r = 0.99993, RMSE = 0.3046 buds, p = 7.42e-13),
      FGF10/Etv4 bifurcation rate (Pearson r = 0.99986, RMSE = 0.0085 day^-1), and
      synchronized ASM Ca2+ peristaltic wave frequency (Pearson r = 0.99850, RMSE = 0.0110 min^-1);
      proves exact common-mode gauge invariance across (P_lumen, P_pleura) pairs (spread = 0.0000)
      and reproduces nifedipine Ca2+ channel blockade (4.045x suppression) and tracheal
      drainage (4.707x suppression) negative controls; and segments the vendored Mus musculus
      pseudoglandular lung specimen (`embryonic_lung_branching_specimen.jpg`, 17 terminal buds,
      distal area fraction = 0.6885, tip radius = 3.8470 +- 1.3152 px).
