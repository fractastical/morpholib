simulations:
  - id: delphi10000-drosophila-mauritiana-turing-wavelength-s0
    name: "Drosophila mauritiana Turing wavelength at 1.6 µm (Pass 1, free branch)"
    organism: "Drosophila mauritiana"
    script: models/2026-delphi10000-drosophila-mauritiana-turing-wavelength-s0.py
    output: datasets/drosophila_mauritiana_turing_wavelength_s0/pass1_free_field.gif
    status: evaluated
    source_refs: [turing1952, murray1981, kondo2010, glassford2015, gompel2005]
    model_spec:
      model: Schnakenberg
      target_wavelength_m: 1.637e-06
      geological_age_ma: 0.0
      seed: 3191
      inputs:
        - datasets/drosophila_mauritiana_turing_wavelength_s0/drosophila_mauritiana_turing_wavelength_s0_reference.json
        - datasets/drosophila_mauritiana_turing_wavelength_s0/Drosophila_mauritiana.jpg
    summary: >-
      Pass 1 judges the free (κ = 0) Schnakenberg branch at the assigned detail
      scale of 1.637 µm (log10 = -5.786), age 0 Ma. Analytical fastest-mode
      wavelength is 1.629 µm; the grid FFT peak is 1.562 µm. The pass-1 GIF is
      that spot field (official CV similarity 87.5 against the gallery ocellus).
      Side by side, spots are not the spiral illustration. The Dv/Du sweep is
      monotonic, and equal diffusion decays, but the animated endpoint does not
      yet show the assimilated ocellus. Weighted overall on rubric.yaml is 78.9.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: two morphogens can be stable at k = 0 and unstable at a finite wavenumber."
        - "Murray 1981: that wavenumber is the intrinsic pre-pattern wavelength and it moves with the diffusivity ratio."
        - "Glassford et al. 2015: the posterior lobe is a recent novelty in the melanogaster subgroup, elaborated in mauritiana."
      reconstructed_in_script:
        - "Schnakenberg a = 0.10, b = 0.90, D_v/D_u = 9.875, γ chosen so k_max sits on 1.637 µm."
        - "Predecessor comparison uses the recorded kikkawai cellular wavelength 93.41 µm, not that slot's parameters."
      transfer_boundary:
        - "The 1.637 µm target is this slot's assigned detail scale. Gompel 2005 and Glassford 2015 do not report that number."
      does_not_claim:
        - "That the free spot field is a photograph of the genital arch."
        - "That the gallery sepia spiral is a SEM."
    scores:
      model-fidelity:
        value: 86
        rationale: "Jacobian, dispersion σ(k), and the explicit Schnakenberg update implement Turing's diffusion-driven instability. γ is solved so the fastest mode, not only the marginal mode, lies on 1.637 µm. Pass 1 does not yet treat the nudge term as part of the scored claim."
        evidence:
          - {file: models/2026-delphi10000-drosophila-mauritiana-turing-wavelength-s0.py, lines: [59, 153], note: "jacobian, growth_rate, calibrate", supports: true}
          - {file: models/2026-delphi10000-drosophila-mauritiana-turing-wavelength-s0.py, lines: [174, 195], note: "periodic explicit Euler for the free branch", supports: true}
      specimen-match:
        value: 66
        rationale: "The pass-1 GIF is the free spot field. Official CV similarity against the gallery ocellus is 87.5, so orientation and radial spectra overlap, but a reader comparing the panels sees spots rather than the spiral. That pictorial gap is the main pass-1 miss."
        evidence:
          - {file: datasets/drosophila_mauritiana_turing_wavelength_s0/pass1_free_field.gif, lines: [0, 0], note: "free-branch animation, CV 87.5", supports: true}
          - {file: docs/media/drosophila_mauritiana_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "spots beside the ocellus illustration", supports: false}
      parameter-expressivity:
        value: 84
        rationale: "Selected wavelength increases monotonically with D_v/D_u across 7.5–13.5. The pass-1 figure already plots that sweep; the GIF itself still uses only the calibrated ratio."
        evidence:
          - {file: models/2026-delphi10000-drosophila-mauritiana-turing-wavelength-s0.py, lines: [212, 225], note: "parameter_sweep", supports: true}
      morphometric-validation:
        value: 72
        rationale: "Grid FFT wavelength is 1.562 µm against the 1.637 µm target (about 4.6% short). That comparison is non-circular. Pearson, KS, and mask segmentation are computed in the script but are not yet the pass-1 endpoint claim."
        evidence:
          - {file: models/2026-delphi10000-drosophila-mauritiana-turing-wavelength-s0.py, lines: [197, 210], note: "measure_wavelength", supports: true}
          - {file: datasets/drosophila_mauritiana_turing_wavelength_s0/drosophila_mauritiana_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "lambda_measured_um 1.562", supports: true}
      source-traceability:
        value: 90
        rationale: "Turing, Murray, Kondo & Miura, Glassford, and Gompel were checked on Crossref. The specimen SHA-256 is pinned. Commons had no species-specific photograph; the gallery fallback is labeled as an illustration."
        evidence:
          - {file: datasets/drosophila_mauritiana_turing_wavelength_s0/paper_citations.bib, lines: [1, 53], note: "five Crossref-checked DOIs", supports: true}
          - {file: datasets/drosophila_mauritiana_turing_wavelength_s0/drosophila_mauritiana_turing_wavelength_s0_reference.json, lines: [1, 40], note: "1.637e-6 m, age 0 Ma, specimen sha256", supports: true}
      code-traceability:
        value: 84
        rationale: "The module docstring and calibrate() name the PDE, the periodic boundary, and the predecessor/successor comparison. Lean theorems encode the integer consequences (50× wavenumber, 23 ridges, diffusion contrast)."
        evidence:
          - {file: models/2026-delphi10000-drosophila-mauritiana-turing-wavelength-s0.py, lines: [1, 28], note: "equation header", supports: true}
          - {file: morphoeval/lean/loops/Loop_3191_drosophila_mauritiana_turing_wavelength_s0.lean, lines: [23, 43], note: "four theorems, zero sorry", supports: true}
      repro-package:
        value: 86
        rationale: "--self-test checks age 0 Ma, log10 = -5.786, the unstable band, monotonic sweep, decaying equal-diffusion control, and Pearson r > 0.98. Seed 3191. Pass 1 still leaves the GIF endpoint on the free branch."
        evidence:
          - {file: models/2026-delphi10000-drosophila-mauritiana-turing-wavelength-s0.py, lines: [642, 676], note: "assert_study gates", supports: true}
    remediation:
      - "Lock the growth GIF's final frames onto the assimilated ocellus (the nudged activator, not a paste of the photograph) and re-score CV similarity."
      - "Report specimen-versus-simulation segmentation (foreground fraction and structure-tensor coherency) with values that differ from the specimen reference."
      - "Score Pearson r, RMSE, and the KS statistic on the assimilated field in the measurement sidecar, and keep Pearson r above 0.98."
      - "Treat the equal-diffusion ablation and the monotonic D_v/D_u sweep as scored evidence on the pass-2 figure, not only as internal asserts."
