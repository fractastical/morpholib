    claim_boundary:
      reported_in_source:
      - 'Gierer & Meinhardt (1972) Eqs. (15a)-(15b): short-range autocatalytic activator a^2/h with long-range inhibitor;
        a shallow source gradient yields a single apical peak (Fig. 2); removing the apical half lets the basal
        fragment regenerate a peak at its cut end (Fig. 3)'
      - 'Meinhardt (1993): hypostome, tentacles and foot are generated by separate activator-inhibitor systems coupled
        through a slowly adapting source density; tentacle activation requires a high source density and is locally
        suppressed by the head activator (so tentacles form at the border of the hypostome); the foot forms where
        the source density is lowest; fragments regenerate a hypostome and a new tentacle ring'
      - 'Meinhardt (2012): review of the same three-system scheme including size-dependent and regeneration behaviour'
      reconstructed_in_script:
      - Exact homogeneous steady state, Jacobian, d_c = (sqrt(2)+1)^2 and dispersion relation; 1D polar column (N
        = 40) with apical dominance; surgical bisection with 87.4 % head recovery; periodic 64-cell tentacle ring
        (6 peaks) with equal-diffusion control, diffusivity-ratio and domain-length sweeps; computer-vision segmentation
        of the vendored specimen (6 tentacles)
      - 'Pass 3: the specimen''s body-column radius profile, tentacle-attachment ring and inter-tentacle spacing;
        a finite-difference Laplace-Beltrami shell (90 x 64) on that surface of revolution; reduced head / tentacle
        / foot Gierer-Meinhardt loops with basal inhibitor production (analytic firing threshold w_c = 0.1633) and
        a head-raised source density; kappa_a sweep with kappa_a = 0 ablation, body-length sweep, amputation at
        L/2 with head/ring regeneration timeline; 14 quantitative measurements'
      transfer_boundary:
      - The three-system couplings (Hill gating sigma^8/(0.6^8 + sigma^8), suppression 1/(1 + kappa_a a), foot drive
        1/(1 + (sigma/0.03)^2), sigma dynamics c_sigma a - mu_sigma (sigma - sigma_0)) and all coefficients are
        this script's reduced choices calibrated to reproduce the qualitative Meinhardt (1993) layout; they are
        not digitised from the paper's appendix equations
      - The shell body length L = 90 cells is a declared scale calibration (model tentacle spacing ~8.1 cells vs
        specimen spacing 0.084 of body length), so the tentacle COUNT (7 vs specimen 6) is a geometric consequence,
        not an independent prediction; the ring axial offset (0.111 vs 0.070 +- 0.081), uniform hypostome cap, basal
        foot and head-before-ring regeneration order are uncalibrated predictions
      - The 1D ring (N_ring = 64, lambda ~10.7 cells, 6 peaks) and the shell ring (lambda ~8.1 cells) use the same
        D_b, D_c but select different wavelengths; the 1D '6 tentacles' therefore also rests on an (undeclared in
        v2) circumference calibration
      - Specimen references are measured on a 2D projection of a tilted, contracted polyp and used as bands, not
        exact targets; there is one specimen and one seed
      does_not_claim:
      - A finite-element mesh, wound closure or tissue remodelling (the regenerated head on the wide cut surface
        is a localised spot, CV_theta = 0.95, not a cap), Meinhardt's tentacle-before-hypostome regeneration order
        (the model gives t_head < t_ring), the foot -> source-density negative feedback, budding, or a quantitative
        size series for tentacle number
