    claim_boundary:
      reported_in_source:
      - 'Armon et al. (2011): orthogonal +-45 deg sclerenchyma layers prescribe a saddle target curvature b_0 =
        diag(kappa_0, -kappa_0) with det(b_0) < 0; narrow strips (w_tilde below a critical FvK width) adopt pure-twist
        helicoids, wide strips cylindrical helical ribbons; cutting angle controls chirality and pitch'
      - 'Efrati et al. (2009): incompatible non-Euclidean plate energy E = E_stretch + E_bend with bending content
        proportional to Y h^3 [nu Tr(M)^2 + (1 - nu) Tr(M^2)], M = b - b_0'
      - 'Freund (1990): mode-I dynamic energy release rate G_dyn(v) ~ (1 - v/c_R) G, so a crack runs at v = c_R
        (1 - Gamma_c/G) and arrests when Gamma_c >= G'
      - 'Hofhuis et al. (2016) / Swaine & Beer (1977) / Vogel (2005): explosive seed launch speeds of order 10 m/s
        (Cardamine) and 70 m/s (Hura), elastic-catapult energy budgets and drag-limited ranges of small projectiles'
      reconstructed_in_script:
      - Reduced L-BFGS-B non-Euclidean energy functional U(H, D, phi; w_tilde) over the dimensionless width, pitchfork
        sweep, cutting-angle sweep, 4-system table, 3-D ribbon mesh and specimen segmentation (Pass 2); Pass 3 adds
        B_eff Delta_e -> suture G, a 1-D Freund crack equation of motion over a seeded heterogeneous toughness field,
        drying-coupled Griffith initiation and stick-slip propagation, an elastic-catapult launch-speed estimate
        and an RK4 quadratic-drag trajectory, and a 7-point Gamma_c/G ablation sweep
      transfer_boundary:
      - The `*_obs` columns of the width and cutting-angle sweep tables in chiral_seed_pod_opening_reference.json
        are analytical values of the same reduced model (H_obs = (1 - nu)/2 sqrt(1 - (w_tilde_c/w_tilde)^4), tau_obs
        = D sin 2theta), not digitised Armon 2011 figure points; the r = 1.0000 correlations are self-consistency,
        not validation
      - The launch-speed benchmark (10 m/s) is Cardamine hirsuta and the upper bound (70 m/s) is Hura crepitans;
        no Bauhinia variegata launch-speed, suture-toughness or dispersal datum was verifiable offline, and the
        predicted 2.8-3.8 m/s is ~3.6x below the Cardamine value
      - 'All 12 fracture/ballistic constants (rho, Gamma_c, CV_Gamma, a_0, tau_dry, n_seeds, m_seed, r_seed, C_d,
        eta, launch angle, launch height) are `provenance: model` in suture_fracture_ballistic_reference.json'
      does_not_claim:
      - 3-D elastodynamic shell or FEM simulation of valve coiling (inertia enters only via eta and a first-mode
        cantilever coil time), plate-wave corrections to c_R, a measured Bauhinia fracture toughness or seed mass,
        or digitised comparison against Armon 2011 Figs. 3-4
