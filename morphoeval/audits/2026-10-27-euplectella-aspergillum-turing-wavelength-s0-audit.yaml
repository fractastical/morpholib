    title: "Hierarchical assembly of the siliceous skeletal lattice of the hexactinellid sponge Euplectella aspergillum"
    authors: "Weaver JC, Aizenberg J, et al."
    venue: "Journal of Structural Biology 158:93-106 (2007)"
    doi: 10.1016/j.jsb.2006.10.027
  monn2015:
    title: "New functional insights into the internal architecture of the laminated anchor spicules of Euplectella aspergillum"
    authors: "Monn MA, Weaver JC, Zhang T, Aizenberg J, Kesari H"
    venue: "PNAS 112:4976-4981 (2015)"
    doi: 10.1073/pnas.1415502112
  sundar2003:
