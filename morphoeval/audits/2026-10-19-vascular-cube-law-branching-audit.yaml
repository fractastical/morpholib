simulations:
  - id: murray-vascular-cube-law-branching
    name: "Murray (1926a, 1926b), Zamir (1976) & Sherman (1981) minimum-work vascular cube law & arterial branching angles"
    organism: "Homo sapiens (human retinal arterial and microvascular bifurcation network)"
    script: 1959-murray-vascular-cube-law-branching.py
    output: docs/media/vascular_cube_law_branching_comparison.png
    extra_outputs:
      - docs/media/vascular_cube_law_branching_growth.gif
    status: evaluated
    source_refs:
      - murray1926a
      - murray1926b
      - zamir1976
      - sherman1981
    summary: >-
      Pass 1 (v1 baseline) evaluation of `1959-murray-vascular-cube-law-branching.py`
      (51.4/100). The v1 script implements Murray's (1926a) Poiseuille viscous power +
      metabolic blood-volume cost functional P(r) = 8*eta*L*Q^2/(pi*r^4) + b*pi*r^2*L,
      stationarity radius r*, symmetric cube law r_0^3 = 2*r_1^3 (r_1/r_0 = 2^(-1/3)),
      and symmetric optimal branching angle (theta_1 + theta_2 = 74.93 deg), but omits
      asymmetric daughter bifurcations (alpha = r_2/r_1 < 1), omits alternative optimality
      ablations (Da Vinci area-preserving gamma=2, Zamir 90 deg surface-area minimization,
      Steiner 120 deg length minimization), neither loads nor verifies
      `datasets/vascular_cube_law_branching/vascular_cube_law_branching_reference.json`,
      and performs zero biological specimen segmentation on
      `datasets/vascular_cube_law_branching/retinal_vasculature_specimen.jpg`.
    scores:
      model-fidelity:
        value: 62
        rationale: >-
          Evaluates Murray's (1926a) Poiseuille + metabolic power functional P(r) and
          stationarity radius r* (L35-50) and computes the symmetric bifurcation angle
          theta_1 + theta_2 = 74.9346 deg (L53-68). However, asymmetric daughter branching
          (r_1 != r_2, cos(theta_2) for side branches) from Murray (1926b) Eqs. 3-6, wall
          shear stress invariance tau_w = 4*eta*Q/(pi*r^3) = sqrt(eta*b) across vessel
          generations, and Zamir's (1976) competing optimality regimes (surface-area drag
          90 deg, Steiner minimum length 120 deg, Da Vinci gamma=2 area conservation) are
          not implemented in v1.
        evidence:
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [35, 68], note: "Poiseuille + metabolic power functional and symmetric-only bifurcation helper", supports: true}
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [71, 96], note: "Symmetric-only binary tree builder without asymmetric alpha = r_2/r_1 or wall shear stress verification", supports: false}
      specimen-match:
        value: 22
        rationale: >-
          Although `datasets/vascular_cube_law_branching/retinal_vasculature_specimen.jpg`
          is present in the dataset folder, the v1 script never loads, segments, or
          displays the human retinal fundus vasculature specimen or extracts vessel
          skeleton bifurcations and caliber ratios from the photograph.
        evidence:
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [99, 160], note: "3-panel synthetic figure with zero biological specimen image or retinal vessel segmentation", supports: false}
          - {file: docs/media/vascular_cube_law_branching_comparison.png, lines: [0, 0], note: "Pass 1 3-panel plot lacking human retinal fundus specimen comparison", supports: false}
      parameter-expressivity:
        value: 42
        rationale: >-
          Hardcodes a single symmetric ratio 2^(-1/3) and root radius r_0 = 82 um (L29-31)
          without sweeping daughter asymmetry alpha = r_2/r_1 in (0, 1], vascular scaling
          exponent gamma in [1.5, 4.0], or blood viscosity / metabolic cost parameters,
          and exposes only `--self-test` and `--skip-gif` on the CLI (L253-257).
        evidence:
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [29, 32], note: "Hardcoded scalar constants without parameter sweeps over alpha or gamma", supports: false}
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [253, 263], note: "Minimal CLI lacking --alpha, --gamma, --eta, --b, --generations, --seed overrides", supports: false}
      morphometric-validation:
        value: 48
        rationale: >-
          `measure_morphoeval()` reports 3 exact algebraic scalars (r_1/r_0, symmetric
          angle 74.9346 deg, P_met/P_visc = 2.0, L199-236), but lacks statistical
          dispersion metrics (RMSE, Pearson r, CV), lacks comparison to Zamir (1979) /
          Sherman (1981) empirical human retinal bifurcation measurements (J01-J08), and
          lacks negative-control ablation deltas against Da Vinci (gamma=2) or Steiner
          (120 deg) branching.
        evidence:
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [199, 236], note: "3 scalar algebraic checks without empirical retinal junction RMSE/r or ablation controls", supports: false}
      source-traceability:
        value: 58
        rationale: >-
          Cites Murray (1926a, 1926b) in the docstring (L5-7), but v1 does not load
          `datasets/vascular_cube_law_branching/vascular_cube_law_branching_reference.json`
          at runtime or verify SHA-256 cryptographic digests of the reference JSON and
          retinal fundus specimen image.
        evidence:
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [4, 15], note: "Docstring cites Murray (1926a, 1926b) but omits runtime dataset loading and SHA-256 verification", supports: false}
      code-traceability:
        value: 62
        rationale: >-
          Functions have brief one-line docstrings (L35-75), but do not map code blocks to
          specific equations in Murray (1926a) Eqs. 1-8, Murray (1926b) Eqs. 1-6, Zamir
          (1976) Table 1, Sherman (1981) Table 1, or the 3 Lean 4 theorems in
          `morphoeval/lean/loops/Loop_052_vascular_cube_law_branching.lean`.
        evidence:
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [35, 96], note: "Minimal docstrings without equation-level or Lean 4 theorem cross-references", supports: false}
      repro-package:
        value: 68
        rationale: >-
          Includes `--self-test` and `--skip-gif` flags and renders deterministic PNG/GIF
          outputs (L239-263), but `--self-test` checks only 4 scalar assertions without
          verifying JSON dataset parity, specimen segmentation, or two-run bitwise
          determinism.
        evidence:
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [239, 250], note: "4-assertion baseline self_test() without dataset parity or two-run determinism check", supports: true}
    remediation:
      - "Implement full asymmetric arterial bifurcation laws cos(theta_1), cos(theta_2), and cos(theta_1 + theta_2) across alpha = r_2/r_1 in [0.1, 1.0] (Murray 1926b Eqs. 3-6) and verify scale-invariant wall shear stress tau_w = 4*eta*Q/(pi*r^3) = sqrt(eta*b) across all 7 Sherman (1981) arteriole generations."
      - "Implement competing optimality negative controls and ablations: Da Vinci area-preserving branching (gamma = 2.0, r_0^2 = r_1^2 + r_2^2), Zamir (1976) lumen-surface-minimizing branching (theta_1 + theta_2 = 90 deg), and Steiner length-minimizing branching (theta_1 + theta_2 = 120 deg), quantifying total hydraulic + metabolic power penalty (% excess work) relative to Murray's gamma = 3.0 optimum."
      - "Load and SHA-256-verify `datasets/vascular_cube_law_branching/vascular_cube_law_branching_reference.json` and `retinal_vasculature_specimen.jpg` at runtime, segment the human retinal vasculature fundus panels (Frangi/multi-scale matched-filter vessel enhancement, medial-axis skeletonization, distance-transform vessel caliber estimation, and Y-junction angle/radius ratio extraction), and compare against empirical human retinal junctions J01-J08 (RMSE, Pearson r, CV)."
      - "Expand `--self-test`, CLI parameter flags (`--alpha`, `--gamma`, `--eta`, `--b`, `--generations`, `--seed`), and `measure_morphoeval()` to report >= 8 quantitative metrics with reference values, dispersion (RMSE, CV, std), and negative-control deltas."
