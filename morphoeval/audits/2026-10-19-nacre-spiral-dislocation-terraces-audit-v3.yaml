          - {file: 2007-cartwright-nacre-spiral-dislocation-terraces.py, lines: [526, 558], note: "Single-domain and {110} cyclic-twin step-speed factor with e_2 from the De Villiers lattice ratio; analytic f_m twin suppression", supports: true}
          - {file: 2007-cartwright-nacre-spiral-dislocation-terraces.py, lines: [647, 814], note: "Stacked-sheet driven Allen-Cahn perforation: footprint = terrace tier (L736), explicit stability (L712), spinodal S_crit (L713), double-well and drive (L765-766), argmax-early-phi bridge site (L776)", supports: true}
