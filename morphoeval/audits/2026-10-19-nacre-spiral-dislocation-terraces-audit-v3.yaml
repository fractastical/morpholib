simulations:
  - id: cartwright-nacre-spiral-dislocation-terraces
    name: "Cartwright & Checa (2007) & Cartwright et al. (2009) nacre screw-dislocation spirals, Frank-Read target terraces, defect pair annihilation, chitin-membrane perforation bridges and aragonite twin polygonization"
    organism: "Pteria hirundo & Pinctada margaritifera (Bivalvia sheet nacre) / Haliotis rufescens & Gibbula umbilicalis (Gastropoda tower nacre)"
    script: 2007-cartwright-nacre-spiral-dislocation-terraces.py
    output: docs/media/nacre_spiral_dislocation_terraces_comparison.png
    extra_outputs:
      - docs/media/nacre_spiral_dislocation_terraces_growth.gif
      - docs/media/nacre_spiral_dislocation_terraces_membrane_perforation.gif
    status: evaluated
    source_refs:
      - cartwright2007
      - cartwright2009
      - burton1951
      - cartwright2012
      - devilliers1971
      - schaffer1997
      - checa2011
    supersedes_audit_id: 2026-10-19-nacre-spiral-dislocation-terraces-audit-v2
    claim_boundary:
      reported_in_source:
        - "Cartwright & Checa (2007): nacre grows by Burton-Cabrera-Frank screw-dislocation spiral and target terraces on the mineral surface, with a periodic stack of beta-chitin inter-lamellar membranes (h_0 ~ 0.5 um) whose pores admit mineral bridges that nucleate the next tablet (Sec. 4); columnar (gastropod) nacre stacks tablets vertically, sheet (bivalve) nacre staggers them like bricks"
        - "Cartwright et al. (2009): spiral and target patterns in bivalve nacre arise from screw dislocations and Frank-Read-type dislocation pairs; opposite-chirality pairs separated by more than 2 r_c emit closed target terraces"
        - "Burton, Cabrera & Frank (1951): Gibbs-Thomson curved-step velocity v(r) = v_inf (1 - r_c / r) and the rotating Archimedean spiral with pitch lambda_0 = (2 pi / omega_0) r_c ~ 19 r_c"
        - "Checa, Cartwright & Willinger (2011) and Schäffer et al. (1997): mineral bridges (tens of nm) pass through pores of the inter-lamellar membrane and connect vertically stacked tablets"
        - "De Villiers (1971): orthorhombic aragonite lattice constants a = 4.9611, b = 7.9672, c = 5.7407 A"
      reconstructed_in_script:
        - "Closed-form Cabrera-Levine phase fields for single screw, supercritical/subcritical Frank-Read dipoles and same-chirality pairs on a 2D grid with contour winding integrals, an optional direction-dependent step speed A(theta) with single-domain or {110} cyclic-twin averaging, a closed-terrace-ring Fourier polygonization measurement, a stacked-sheet driven Allen-Cahn perforation model whose per-sheet footprint is slaved to the terrace tier and whose bridge site is the early-phi argmax, a sigma / D_tab bridge-localisation sweep, a 12-species BCF pitch/omega regression, a DoG lamellar-seam segmentation of one SEM micrograph, and 7 Lean 4 theorems on the integer/rational skeleton of these laws"
      transfer_boundary:
        - "The 'eikonal solver' is kinematic: terrace phases are closed-form Cabrera-Levine travel functions divided by A(theta), not a time-stepped front-propagation PDE, and the subcritical vs supercritical dipole regime is selected by an `if` on d <= 2 r_c rather than emerging from the dynamics"
        - "The membrane model is a stack of 2D sheets (no through-thickness phi(z)) at dx = 0.1875 um, so a perforation patch stands for a cluster of 40-60 nm bridges; the bridge site is the argmax of early phi, not a resolved growth-through-pore process; S_0, beta, eps, pore amplitude/width/density are model parameters tuned so that both regimes perforate on the grid"
        - "The 12-species lambda_obs / omega_obs table is within ~1 % of the BCF law for every species and is not traceable to a measured table in the cited papers; r = 0.9999 therefore tests the table's construction, not the biology"
        - "The SEM um/px calibration (0.019867 um/px) was anchored to h_0 = 0.50 um because the Wikimedia micrograph has no scale bar; only the dimensionless CV and aspect ratio are calibration-independent"
        - "e_6 = 0.15 is a free kinetic anisotropy amplitude; twin averaging is a mean-field superposition of A(theta) with no explicit twin boundaries in the spiral core"
      does_not_claim:
        - "A volumetric 3D phase-field of the chitin membrane, resolution of individual mineral bridges, a derived (not templated) gastropod tower lattice, a time-dependent eikonal or BCF step-flow simulation, literature-digitised species pitch/omega observations, an independently calibrated SEM scale, or validated values of e_6, S_0, beta or the pore statistics"
    summary: >-
      Pass 3 (v3) remediated evaluation of `2007-cartwright-nacre-spiral-dislocation-terraces.py` (85.2/100,
      down from the v2 consensus 91.4/100 because the remediation exposed unverified v2 credit; see header).
      Both v2 remediation items are closed as reduced models: a stacked-sheet driven Allen-Cahn chitin-membrane
      perforation model coupled to the 2D terrace tier (`simulate_membrane_perforation_phase_field_3d`, L647-814)
      makes the mineral-bridge stacking offset emergent (columnar 0.000 D_tab vs ref 0; sheet 0.215 D_tab vs
      nominal 0.5; sweep transition at sigma = 0.125 D_tab vs analytic 0.121), and aragonite [100]/[010]
      step-velocity anisotropy with {110} cyclic twinning (`aragonite_step_velocity_anisotropy`, L526-552) is
      wired into the spiral solver and measured on closed terrace rings (f_2 = 0.0738, f_6 = 0.9474 vs analytic).
      The v2 self-referential pitch blend was removed (raw pitch 7.8007 vs 7.9736 um), terrace counts are now
      measured, `--seed` is live, and 3 more Lean 4 theorems (7 total, 0 sorry) are verified. The remaining
      defects are structural: the 12-species observation table is circular, the SEM calibration is anchored to
      the value it reports, the tower lattice in panels A/C is templated, and the terrace solver is kinematic
      with a prescribed regime switch.
    scores:
      model-fidelity:
        value: 88
        rationale: >-
          Gibbs-Thomson v(r) = v_inf (1 - r_c / r) and the BCF/Cabrera-Levine spiral kinematics are the source's
          (`compute_bcf_spiral_kinematics`, L189-222; `gibbs_thomson_step_velocity`, L224-236), and the Pass 3
          additions are genuine model components: a driven Allen-Cahn perforation field with the correct
          double-well derivative and spinodal threshold S_crit = S_0 + 1/(3 beta) (L713, L765-767), a footprint
          slaved to the eikonal terrace tier (L736), and a direction-dependent step speed with crystallographic
          e_2 and a three-domain twin average (L545-552) entering every regime's travel function (L319-321,
          L338-340, L354-356). Deductions: the terrace fields are closed-form Cabrera-Levine phases and the
          subcritical/supercritical switch is an `if` on d <= 2 r_c (L308), with `activity` only gating the height
          field (L337, L344) — the docstring's 'eikonal solver' is kinematic, not a propagated front (-5); the
          gastropod tower lattice in `simulate_nacre_architecture_3d` is a hard-coded template (pitch_tower =
          3.6071, tower_spacing = 11.5, hex_mod = 1 + 0.06 cos 6 theta, L497-510), not an output of the eikonal or
          membrane model (-4); the membrane model is 2D-per-sheet with the bridge site taken as argmax of early
          phi (L776-777) and tuning choices n_pores >= 1 (L742), eroded-interior seeding (L745) and a fixed A_g
          ~ 1/sigma^2 bridge budget (L727-728) (-3).
