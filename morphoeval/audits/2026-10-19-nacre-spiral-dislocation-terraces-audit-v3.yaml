# MorphoEval audit — Cartwright & Checa (2007) J. R. Soc. Interface & Cartwright et al. (2009) PNAS Nacre Spiral Dislocation Terraces, 2026-10-19 (v3)
#
# Pass 3 re-score of `2007-cartwright-nacre-spiral-dislocation-terraces.py` (v3, 1992 lines) after the remediation of
# both open v2 items in the instrumented loop `morphoeval/runs/2026-10-19-nacre-spiral-dislocation-terraces-loop-pass3`,
# superseding `2026-10-19-nacre-spiral-dislocation-terraces-audit-v2` (dual-agent consensus 91.4).
#   - Primary assessor: Claude Fable 5.1 (Phase B subagent; Phase A remediation by the same model family, see
#     `/tmp/pass3/handoff/slot-073.md` and the git diff against commit e651a8b8)
#   - Second assessor (rubric verification of the Phase A handoff evidence): Gemini 4 Argon, as in v2
#
# What Pass 3 changed (both v2 remediation items closed, as reduced models):
#   1. Stacked-sheet driven Allen-Cahn chitin-membrane perforation model coupled to the 2D eikonal terrace tier
#      (`simulate_membrane_perforation_phase_field_3d`, L647-814; `evaluate_membrane_bridge_alignment`, L816-885):
#      tablet-k footprint = terrace level >= k within D_tab/2 of the bridge below (L736); per-sheet phi_k with
#      W = phi^2(1-phi)^2, drive beta (S_k - S_0) g'(phi), spinodal S_crit = S_0 + 1/(3 beta) = 0.683 (L713, L766).
#      Mineral-bridge stacking offset is emergent: columnar 0.000 D_tab (ref 0), sheet 0.215 +/- 0.106 D_tab (nominal
#      0.5; uniform-disc random limit 1/3); sigma/D_tab sweep (L864-883) locates the columnar -> staggered transition
#      at 0.10-0.125 D_tab, matching the analytic threshold sigma > 0.121 D_tab. Panel G, new membrane-perforation GIF.
#   2. Aragonite [100]/[010] step-velocity anisotropy and {110} cyclic twinning (`aragonite_step_velocity_anisotropy`,
#      L526-552; e_2 from v_100/v_010 = a sqrt3 / b = 1.0785, De Villiers 1971 lattice constants L117-122; twin angle
#      2 atan(a/b) = 63.82 deg L121), wired into the 2D solver through `step_anisotropy` (L299-304, L319-321, L338-340,
#      L354-356); closed-ring Fourier polygonization (`measure_terrace_contour_polygonization`, L561-601) measures
#      f_2 = 0.0738 / f_6 = 0.9474 vs the analytic twin suppression factors (L555-558). Panels H and I.
#   3. Honesty fixes: the v2 self-referential pitch blend (0.15 raw + 0.85 theory) removed (`_measure_radial_terrace_pitch`,
#      L399-420; raw pitch 7.8007 vs lambda_0 7.9736 um), `active_terraces` now counted from the field (L423-429),
#      `--seed` made live and `--e6` added (L1961-1962), SEM calibration caveat written into measurement 7 (L1748).
#   4. 3 new Lean 4 theorems (7 total, 0 `sorry`s): `aragonite_cyclic_twin_angular_misfit`,
#      `anisotropic_terrace_pitch_linear_in_step_speed`, `chitin_membrane_perforation_bistability`.
#
# Why the overall score goes DOWN (91.4 -> 85.2) despite the remediation: the Pass 3 work exposed defects that the v2
# dual-agent assessment credited without verification — the 12-species "observed" pitch/omega table is within ~1 % of
# the BCF law for every species and is not traceable to any measured table (circular validation, r = 0.9999), the SEM
# um/px calibration was chosen to make h_0 = 0.50 um (so measurement 7 is a consistency check, not a test), the
# gastropod tower geometry of panel A/C is a hard-coded presentation template, and the "eikonal solver" is a
# closed-form Cabrera-Levine phase construction with an `if`-prescribed regime switch. These are scored here as
# found, per the rubric's "score only what the evidence supports".
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the working-tree files at commit e651a8b8 (Pass 3 Phase A edits uncommitted at audit time;
# the script SHA-256 is recorded in the pass3 telemetry run, step 5 artifacts).

