    claim_boundary:
      reported_in_source:
      - 'Campas et al. (2010): upper-beak profiles of the 14 Darwin''s finch species collapse onto one master curve
        under a 3-parameter affine scaling-and-shear group M(s_L, s_D, gamma); Geospiza (Group A) collapse under
        pure scaling, Camarhynchus/Platyspiza/Cactospiza (Group B) and Certhidea/Pinaroloxias (Group C) need the
        shear'
      - 'Abzhanov et al. (2004, 2006): Bmp4 scales beak depth/width and calmodulin scales length; RCAS::Bmp4, RCAS::Noggin
        and RCAS::CaM in chick change beak proportions accordingly'
      - 'Soons et al. (2010, 2012, 2015): micro-CT finite-element models of Geospiza upper beaks show peak von Mises
        stress under in vivo bite force far less variable than bite force itself, a stress-reducing role for the
        keratin rhamphotheca, and lower stresses for base biting than tip biting'
      - 'Herrel et al. (2005): in vivo bite forces of Darwin''s finches scale with head width'
      reconstructed_in_script:
      - Affine matrix and analytic inverse, canonical culmen curve, 2D/3D conical-parabolic beak surface, 14-species
        collapse with a pure-scaling negative control, 2D Bmp4/CaM Gaussian mesenchymal field, cantilever bending
        index W D^3/(12 L), four RCAS conditions, connected-component culmen contour extraction on the Gould (1845)
        plate, and (Pass 3) a two-material plane-stress Q4 FEM of the sagittal upper-beak section with Gibson-Ashby
        trabecular core, keratin shell, tip/base/oblique seed loads, beam-theory verification, mesh convergence,
        14-species fracture-risk indices, keratin-modulus and BV/TV ablations
      transfer_boundary:
      - The 14-species 'empirical' profiles are generated by the script's own forward transform plus Gaussian noise
        (sigma = 0.24 % of s_D), so the collapse RMS 0.0021 / r = 0.9999 and the 45x negative-control ratio validate
        the inverse of the same transform, not digitised Campas Fig. 2/3 profiles
      - The FEM is a 2D sagittal plane-stress idealisation (out-of-plane thickness = W_mm everywhere) of a Law-1
        sheared culmen profile with a 0.7 mm solid-keratin tip clamp, not a voxel-resolved micro-CT mesh; all moduli,
        strengths, thicknesses and the three Soons predictions were transcribed offline from memory and are order-of-magnitude
        anchors
      - The 'observed' RCAS D/L values and several reference values equal Law-2 formula outputs or the script's
        own earlier output, so those comparisons are self-referential
      does_not_claim:
      - Reproduction of any digitised Campas, Abzhanov or Soons figure value; a 3D micro-CT finite-element model;
        crack initiation or propagation; keratin-bone interface failure; mediolateral load asymmetry; per-species
        provenance of the species table (s_L, s_D, s_W, gamma, bite force)
