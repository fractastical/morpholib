    claim_boundary:
      reported_in_source:
      - 'Thompson (1917) p. 297: three similar liquid surfaces always meet at 120 degrees; p. 303 Fig. 113 cases
        (1)-(3): 90 / >90 / 120 degrees as the partition tension t rises to T; p. 309-310: Lamarle''s least-area
        partition meets in threes at 120 degrees, and ''in any ordinary section of a vegetable parenchyma ... cell-walls
        everywhere meeting, by threes, at angles of 120 degrees, irrespective of the size of the individual cells''.'
      - 'Thompson (1917) pp. 314, 321-322: epidermal outer walls and growth/traction anisotropy (Fig. 124 Girardia)
        are stated exceptions where the angles depart from 120 degrees.'
      reconstructed_in_script:
      - Lami/Neumann triangle of forces (E1) with Fig. 113 cases, Steiner-vs-cross film lengths (E2), angle-sum
        identity statistics (E3), and a periodic Poisson-Voronoi vertex network relaxed by gradient descent on a
        Farhadifar-type energy (E5) at one parameter point.
      transfer_boundary:
      - 2D plane section / en-face projection of a 3D cell aggregate; Thompson's 109 deg 28' tetrahedral edge law
        is not simulated.
      does_not_claim:
      - 'v1 makes no claim about any real epithelium: no specimen is loaded or segmented, so no verdict on T1917-018
        can be drawn from v1.'
