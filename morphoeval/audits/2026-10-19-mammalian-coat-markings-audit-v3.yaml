# MorphoEval audit — Murray (1981) Thomas Substrate-Inhibition Reaction-Diffusion & Mammalian Coat Markings, Pass 3 (v3)
#
# Pass 3 post-remediation evaluation of `1981-murray-mammalian-coat-markings.py` (v3, 1,809 lines; v2 was 973)
# after the Pass 3 remediation round `2026-10-19-mammalian-coat-markings-loop-pass3`, superseding
# `2026-10-19-mammalian-coat-markings-audit-v2`.
#
# What Pass 3 changed (the single open v2 remediation item + defects found while closing it):
#   1. v2 item "extend the two-stage rosette solver to full 3D finite-element surface meshes reconstructed from
#      photogrammetric felid body scans" -> CLOSED IN REDUCED FORM: a P1 (linear) surface finite-element
#      Laplace-Beltrami solver (cotangent stiffness + lumped mass, IMEX) on a triangulated 3D felid body surface
#      (47,520 vertices / 94,776 triangles), eigenvalues verified against the exact Neumann cylinder spectrum
#      (m = 1 relative error 3.1e-14), Liu-Liaw-Maini two-stage growth run as a genuine PDE on that body.
#      The body is a PARAMETRIC SURFACE OF REVOLUTION (`datasets/mammalian_coat_markings/felid_body_profile.json`,
#      hand-set knots informed by Stein et al. 2013 proportions), NOT a photogrammetric scan; the scan is carried
#      as a Pass 4 remediation item.
#   2. v2 defects uncovered and disclosed in code and here (the reason several scores go DOWN relative to v2):
#      - the v2 conical-tail solver treated axial diffusion explicitly with dt = 0.015 > dx^2/(2d/gamma) = 0.0043,
#        i.e. it was numerically unstable; its headline "865x proximal-to-distal spot suppression ratio" (v2
#        measurement #5, v2 morphometric-validation rationale) was a clipping artifact. The stable implicit
#        solver on the SAME v2 geometry gives a ratio of 0.90 (no ring zone). Retracted and carried as a
#        disclosure measurement.
#      - v2 counted unstable tail eigenmodes from n = 1, silently omitting the Neumann n = 0 longitudinal-stripe
#        modes; the fastest-mode radius r_crit does not exclude m >= 1 modes -- only r_excl = 1/k_+ does
#        (new Lean Theorem 5). The v2 tail tip (r = 0.35) never reaches r_excl = 0.36.
#      - v2 planar runs stopped at t = 13 (std(u) = 0.05, linear regime); the v2 "two-stage rosette" step was
#        a Gaussian image filter on that linear field, not a second PDE stage.
#      - the v2 tail ROI on the specimen covers mostly hindquarters and background grass (3/4-view photograph).
#      - the CLI flags --a/--b/--alpha/--rho/--K/--d/--gamma/--seed were (and still are) parsed but never
#        passed to the solvers; v2 parameter-expressivity credited them as "full CLI flags".
#   3. Lean 4 Theorems 4 and 5 added (5 theorems, 0 sorrys); Math KG laws 4 and 5 registered.

