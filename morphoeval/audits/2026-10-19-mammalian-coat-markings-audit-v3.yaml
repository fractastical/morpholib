simulations:
  - id: murray-mammalian-coat-markings
    name: "Murray (1981) Thomas substrate-inhibition reaction-diffusion pre-pattern, conical tail spot-to-ring transition & P1 surface-FEM felid body"
    organism: "African leopard (Panthera pardus) coat rosettes and tapered tail markings"
    script: 1981-murray-mammalian-coat-markings.py
    output: docs/media/mammalian_coat_markings_comparison.png
    extra_outputs:
      - docs/media/mammalian_coat_markings_growth.gif
      - docs/media/mammalian_coat_markings_fem_surface.png
    status: evaluated
    source_refs:
      - murray1981
      - thomas1975
      - murray1988
      - liu2006
      - dziuk1988
      - pinkall1993
      - dziuk2013
      - stein2013
    summary: >-
      Pass 3 (v3) post-remediation evaluation of `1981-murray-mammalian-coat-markings.py`
      (overall weighted score: 84.2 / 100, DOWN 7.4 points from 91.6 / 100 in Pass 2, up from
      49.4 / 100 in Pass 1). The v3 script keeps the exact Thomas (1975) / Murray (1981)
      steady state, Jacobian, d_c and dispersion analysis; replaces the numerically unstable v2
      conical-tail solver with a fully implicit surface-of-revolution Laplace-Beltrami solver
      (metric factor 1/(1+r'^2) included) and shows that the v2 geometry has no ring zone;
      adds a P1 cotangent surface finite-element solver on a triangulated 3D felid body of
      revolution (47,520 vertices) verified against the exact cylinder spectrum, on which the
      Liu, Liaw & Maini (2006) two-stage protocol is run as a genuine PDE (cub body -> adult
      body, growth factor G = 2) yielding torso annularity 0.84 and a tail ring onset at
      x/L_tail = 0.82 vs the Lean-backed prediction 0.86; sweeps G in {1, 1.5, 2, 3} on the
      planar flank; and backs five mathematical laws with machine-checked Lean 4 theorems
      (0 sorrys). The score falls because v3 retracts the v2 865x suppression ratio (clipping
      artifact), shows the v2 "two-stage" step to have been an image filter on a linear-regime
      field, finds the specimen tail ROI mis-placed, reports a 3.7x marking-density shortfall
      against the specimen (5.1 vs 18.9 markings per torso depth), and finds the kinetic CLI
      flags unwired -- none of which v2 had penalised.
    claim_boundary:
      reported_in_source:
        - "Murray (1981): Thomas substrate-inhibition kinetics at a = 92, b = 64, alpha = 1.5, rho = 18.5, K = 0.1 are diffusively unstable for d > d_c; the domain scale factor gamma selects between no pattern, stripes, spots and crowding; on a tapered cylinder spot modes (m >= 1) are excluded below a critical radius so a spotted animal can have a ringed tail but not vice versa"
        - "Liu, Liaw & Maini (2006): leopard rosettes arise from a two-stage process in which a juvenile spot pre-pattern is re-run under changed parameters on the grown adult skin"
        - "Dziuk (1988), Pinkall & Polthier (1993), Dziuk & Elliott (2013): P1 surface finite elements with cotangent weights converge to the Laplace-Beltrami operator on a triangulated surface"
      reconstructed_in_script:
        - "Exact steady state, Jacobian, d_c, dispersion curve and Turing band; Neumann cylinder eigenmode counting including n = 0; r_crit (fastest-mode) and r_excl = 1/k_+ (full-exclusion) radii; fully implicit conical-tail PDE; planar DCT-II IMEX PDE run to saturation with a genuine two-stage protocol and growth-factor sweep; P1 surface FEM (stiffness/mass assembly, spectrum verification, two-stage run on the felid body) with annularity and spot-spacing diagnostics; DoG segmentation of the Kruger specimen"
      transfer_boundary:
        - "The 3D body is a parametric surface of revolution with hand-set knots (felid_body_profile.json), not a photogrammetric scan; its head-body length of 22 cub wavelengths and the growth factor G = 2 are ASSUMED, not fitted, which is why the FEM marking density (5.1 per torso depth) is 3.7x below the specimen estimate (18.9)"
        - "The tail ring onset comparison (0.82 measured vs 0.86 predicted) is on the surrogate taper, whose tip radius (0.004 HBL) was chosen to lie below r_excl; it is a consistency check of solver against linear theory, not a measurement on a real tail"
        - "The specimen is a 3/4-view photograph: the flank ROI is foreshortened and the v2 tail ROI covers hindquarters/background, so the Delaunay CV and polygonality are flank-only statistics"
      does_not_claim:
        - "That Murray (1981) or Liu et al. (2006) reported any of the FEM, annularity, growth-sweep or marking-density numbers; all are v3 reconstructions"
        - "That the Thomas kinetics are the biological mechanism of felid pigmentation"
    scores:
      model-fidelity:
        value: 91
        rationale: >-
          Solves the exact Thomas (1975) / Murray (1981) steady state (u0, v0) = (9.9338, 9.2892),
          Jacobian, d_c = 9.6292 and dispersion curve (L169-259); counts Neumann cylinder
          eigenmodes from n = 0 and distinguishes r_crit = 0.7527 (fastest mode) from the
          full-exclusion radius r_excl = 1/k_+ = 0.36 (L264-338, Lean Theorem 5); integrates
          the tapered tail with a fully implicit per-Fourier-mode surface Laplace-Beltrami
          operator including the arc-length metric factor (L340-470), replacing the v2
          explicit-axial scheme that violated its own stability limit; runs the planar PDE to
          saturation with a genuine two-stage protocol (L475-563); and assembles a P1 cotangent
          surface FEM (L697-789) whose m = 1 cylinder eigenvalue matches the analytic value to
          3.1e-14 and whose stiffness rows sum to zero (Lean Theorem 4), on which the two-stage
          run is executed on the felid body (L955-1056). Not 94 as in v2: the body is a
          surface of revolution rather than a scanned mesh, the FEM reaction step is explicit
          (dt = 0.1 is only safe because |eig J0| <= 7.1 at Table 1; the K = 0 control needs
          dt = 0.02), and the demonstration tail had to be thinned to r_tip = 0.15 for the ring
          zone to exist -- the v2 geometry does not produce rings.
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [169, 259], note: "Exact Thomas steady state via brentq, Jacobian J0, d_c, unstable band, dispersion", supports: true}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [264, 338], note: "Conical tail eigenmode census from n = 0, r_crit (fastest mode) vs r_excl = 1/k_+ (all m >= 1 excluded), slant length and metric factor", supports: true}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [340, 470], note: "Fully implicit conical-tail solver (per-mode dense inverses, dt = 0.1); exclusion-zone diagnostics; v2 geometry shown to have no ring zone", supports: true}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [697, 789], note: "Surface-of-revolution triangulation, P1 cotangent stiffness + lumped mass assembly, eigenvalue check against (n*pi/L)^2 + (m/r)^2 with m >= 1 double multiplicity", supports: true}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [836, 892], note: "IMEX surface FEM time-stepper (M + dt/gamma K) u = M (u + dt f) via splu; explicit reaction", supports: true}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [955, 1056], note: "Two-stage FEM run: Stage 1 on cub body (mass scaled 1/G^2), Stage 2 reseeded on adult body; r_crit/r_excl transition positions; annularity and spot statistics", supports: true}
          - {file: morphoeval/lean/loops/Loop_003_mammalian_coat_markings.lean, lines: [110, 157], note: "Theorem 4 (cotangent rows annihilate constants and sum to zero) and Theorem 5 (r_excl = 1/k_+ required to exclude n = 0 longitudinal modes); 5 theorems total, 0 sorrys", supports: true}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [20, 34], note: "Disclosure that the v2 conical solver was numerically unstable (dt = 0.015 > 0.0043) and that its 865x ratio was a clipping artifact", supports: false}
      specimen-match:
        value: 72
        rationale: >-
          The SHA-256-locked Kruger *Panthera pardus pardus* photograph is loaded and
          segmented into N = 164 flank markings (DoG + opening, L1082-1155) with Delaunay
          NN spacing 7.44 px (CV 0.30) and interior Voronoi polygonality compared against the
          planar PDE lattice (Panels E, F, H); the FEM body now yields a marking density that
          can be compared with the specimen. But that comparison FAILS by 3.7x (FEM Stage 2:
          5.1 markings per torso depth vs specimen estimate 18.9, `felid_body_profile.json`
          L63) because HBL = 22 lambda_c and G = 2 are assumed, not fitted; the v2 tail ROI
          [410, 115, 560, 225] covers mostly hindquarters and background grass on this 3/4-view
          image (caveat recorded at `felid_body_profile.json` L64) so no tail statistic is
          actually measured on the animal; and the FEM "rosettes" are compared to the specimen
          only through a self-defined annularity index, not through segmented rosette
          morphology (ring/core ratios, rosette diameters). v2's 89 credited a tail ROI that
          does not contain the tail.
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [1082, 1155], note: "SHA-verified specimen load, DoG segmentation, Delaunay NN spacing, Voronoi polygonality, flank and tail ROIs", supports: true}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [1025, 1053], note: "FEM markings-per-torso-depth computed and compared with the specimen estimate (5.09 vs 18.9) -- the comparison is made but the model is 3.7x too coarse", supports: false}
          - {file: datasets/mammalian_coat_markings/felid_body_profile.json, lines: [57, 65], note: "Specimen torso-depth scale estimate (18.9 markings per torso depth) and the tail-ROI caveat: the v2 tail ROI is on the hindquarters/background", supports: false}
          - {file: docs/media/mammalian_coat_markings_comparison.png, lines: [0, 0], note: "12-panel figure: specimen (E), flank segmentation (F), polygonality (H) and FEM body (I, J, L) side by side with the theory panels", supports: true}
      parameter-expressivity:
        value: 80
        rationale: >-
          Sweeps Murray's five gamma regimes {0.4, 3.5, 8, 25, 120} to saturation
          (`run_scale_morphospace_sweep`, L620-668), runs dual negative controls at d = 1 and
          K = 0 with the stability-appropriate time step (L671-692), adds a Liu-Liaw-Maini
          growth-factor sweep G in {1, 1.5, 2, 3} with an annularity read-out (L594-618,
          Panel K; non-monotonic: G = 3 yields central-spot jaguar-like rosettes, annularity
          0.25), and exposes `--growth-factor`, which IS wired through to both the planar and
          FEM two-stage runs (L1792, L1800). However the kinetic/scale flags `--a`, `--b`,
          `--alpha`, `--rho`, `--K`, `--d`, `--gamma`, `--seed` and `--steps` are parsed
          (L1783-1791) and never passed to any solver: `render_outputs` is called with
          `growth_factor` only (L1800). v2 scored this dimension 90 on the strength of "full CLI
          flags" that were already inert in v2.
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [594, 692], note: "Growth-factor sweep, 5-regime gamma sweep and dual negative controls (K = 0 run at dt = 0.02 because f_u = -48.6)", supports: true}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [1783, 1800], note: "CLI parses a, b, alpha, rho, K, d, gamma, steps, seed but only growth_factor reaches render_outputs()", supports: false}
      morphometric-validation:
        value: 84
        rationale: >-
          `measure_morphoeval()` (L1513-1676) now emits 14 measurements: the four exact
          analytic quantities (u0, d_c, gamma*k_c^2, r_crit; error 0), the gamma-vs-mode-count
          Pearson r = 0.9996, both negative controls (std_u 8.6e-15 and 4.1e-16), the specimen
          Delaunay CV (0.296 vs 0.24), the FEM m = 1 eigenvalue error (3.1e-14), the FEM tail
          ring onset (0.817 measured vs 0.858 predicted from r_excl), the FEM torso annularity
          (0.84 vs planar 0.80), the G = 1 null (0.0) and the FEM marking density (5.09 vs
          18.9). It also RETRACTS the v2 headline: the conical suppression ratio on the v2
          geometry is 0.90, not 865.5, and this is carried as an explicit disclosure measurement
          (L1636-1647); the new ratio (9.86 vs reference 5.0) is on a thinner tail chosen so
          that r_excl is reached. Weaknesses: the annularity reference (0.8) is the script's own
          planar run, not a literature value; the ring-onset reference is linear theory on a
          surrogate taper; the marking-density measurement fails by 3.7x; and no measurement
          uses segmented rosette morphology from the specimen.
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [1513, 1676], note: "14 reference-backed measurements incl. FEM eigenvalue error, FEM tail onset, FEM annularity, G = 1 null and marking density", supports: true}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [1636, 1647], note: "v2 865x suppression ratio retracted: stable solver on the v2 geometry gives 0.90 (no exclusion zone)", supports: false}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [565, 592], note: "Annularity index (rim-vs-core of Stage-1 cores in the Stage-2 field) -- a self-defined statistic, not a literature morphometric", supports: false}
