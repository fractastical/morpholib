    remediation:
      - "Replace the parametric surface of revolution with a triangulated photogrammetric or CT-derived felid body mesh (`build_felid_body_surface_mesh`, L791-834; profile knots at `datasets/mammalian_coat_markings/felid_body_profile.json` L44-48): the FEM assembly (`assemble_p1_fem_laplace_beltrami`, L721-753) is already mesh-agnostic, so this is a data item, not a solver item. Carried over from v2 in reduced form."
      - "Fit the body scale and growth factor to the specimen instead of assuming them: HBL = 22 lambda_c and G = 2 give 5.09 markings per torso depth vs 18.9 observed (`run_two_stage_fem_body`, L1025-1053; measurement 'FEM Stage-2 torso markings per torso depth', L1573-1581). Sweep HBL/lambda_c in [22, 90] and G in [1.5, 3] and report the (HBL, G) that matches the specimen density and polygonality jointly."
      - "Wire the kinetic and scale CLI flags into the solvers: `--a`, `--b`, `--alpha`, `--rho`, `--K`, `--d`, `--gamma`, `--steps`, `--seed` are parsed at L1783-1791 but `render_outputs()` is called with `growth_factor` only (L1800); thread a parameter dict through `compute_thomas_steady_state`, `integrate_thomas_pde_2d`, `integrate_thomas_conical_tail_pde` and `run_two_stage_fem_body`, and add a self-test check that `--K 0` reproduces the negative control."
      - "Relocate the specimen tail ROI onto the curled tail (approximately x = 470-530, y = 200-240 per `felid_body_profile.json` L64) or replace the 3/4-view specimen with a lateral-view, SHA-pinned photograph in which the tail is resolved, then add a measured tail spot-to-ring onset to compare with `tail_exclusion_fraction` (currently only the surrogate-mesh value is compared, L1543-1551)."
      - "Make the initial noise field mesh-resolution independent (`integrate_thomas_fem_surface_pde` L870-876 draws per-vertex noise; planar reseed at L544), e.g. by projecting a fixed low-pass random field onto the mesh, so that the FEM spot layout is reproducible across `nx`/`ntheta` and the coarse self-test body (nx = 200) and the default render (nx = 360) seed the same pattern."
      - "Add the surface-FEM and body-proportion references (Dziuk 1988, Pinkall & Polthier 1993, Dziuk & Elliott 2013, Stein & Hayssen 2013) to `datasets/mammalian_coat_markings/paper_citations.bib` and re-pin its SHA-256 in `EXPECTED_SHA256` (L128-130)."
