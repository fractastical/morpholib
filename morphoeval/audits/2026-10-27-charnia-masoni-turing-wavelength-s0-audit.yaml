# Pass 1 of loop 3145. Scores the first render, before the portrait chevron
# retarget and the like-with-like wavelength sweep. The committed script and
# the measurement sidecar are the post-fix versions; this file keeps the
# pre-fix judgement. See the superseding audit for the committed artifacts.
audit:
  id: 2026-10-27-charnia-masoni-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (Cursor cloud agent, primary assessor, pass 1)"
    homepage: https://x.ai
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 96a891cfffcbf7fb81617c1df76c424d1d7359a5
    environment:
      python: "3.12.3"
      numpy: "2.5.4"
      matplotlib: "3.11.2"
      Pillow: "13.0.0"
      scipy: "1.18.1"
    note: >-
      Pass-1 pixels were a 720×540 disk of near-horizontal stripes at a
      chevron angle pegged at 85°, CV 83.9, with a wavelength sweep that
      compared the determinant-critical λ to the σ-peak (RMSE 34.5 µm).
      Those three defects are fixed in the committed tree; this record
      does not rescore them.

