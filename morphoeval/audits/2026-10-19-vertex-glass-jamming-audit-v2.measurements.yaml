    claim_boundary:
      reported_in_source:
      - 'Bi, Lopez, Schwarz & Manning (2015) Nature Physics Eqs. 1-2 & Figs. 1-4: dimensionless vertex energy e
        = (1/2) sum [(a_i - 1)^2 + r(p_i - p_0)^2] exhibits a density-independent rigidity transition at critical
        target shape index p_0^* approx 3.813 (> p_5 approx 3.8119 > p_hex approx 3.7224), where T1 energy barrier
        Delta e_T1(p_0) and static shear modulus G(p_0) vanish identically for p_0 >= p_0^*.'
      - 'Park et al. (2015) Nature Materials Figs. 1-4 & Atia et al. (2018) Nature Physics Figs. 1-2: primary human
        bronchial epithelial cells (HBECs) from non-asthmatic donors jam into a solid monolayer by Day 14 (q = 3.792
        < 3.813), whereas asthmatic donor HBECs (q = 3.955 > 3.813) and mechanically compressed HBECs (30 cm H2O,
        q = 3.945 > 3.813) remain unjammed, with standardized cell shapes obeying a universal k-Gamma distribution.'
      reconstructed_in_script:
      - 2D periodic confluent monolayer vertex-Voronoi simulation across 4 regimes (Non-Asthmatic Solid p_0=3.70,
        Critical Point p_0^*=3.813, Asthmatic Fluid p_0=3.955, and Zero-Perimeter-Modulus Ablation r=0.0), 8-point
        p_0 phase sweep in [3.55, 4.00], and Park et al. (2015) Days 3-18 bronchial maturation trajectories.
      - Junction-guided Voronoi segmentation of the human in situ monolayer micrograph (`human_epithelial_monolayer_specimen.jpg`,
        N=101 interior cells, <q>=3.7961, k-Gamma correlation r = 0.9334).
      transfer_boundary:
      - 2D apical polygonal projection of pseudostratified bronchial and simple monolayer epithelia.
      does_not_claim:
      - Does not model 3D mucociliary beating hydrodynamics or sub-epithelial airway smooth muscle contraction.
