          (`compute_t1_barrier_and_shear_modulus`, L131-183), Atia et al. (2018) `k`-Gamma
          probability density (`k_gamma_pdf`, L186-194), and 2D periodic vertex-Voronoi
          relaxation across solid, critical, asthmatic fluid, and `r=0` ablation regimes
          (`simulate_vertex_unjamming_regime`, L245-380). Backed by 4 machine-checked Lean 4
          theorems (0 sorrys).
        evidence:
