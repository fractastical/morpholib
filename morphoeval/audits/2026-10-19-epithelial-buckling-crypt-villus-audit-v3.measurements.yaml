    claim_boundary:
      reported_in_source:
      - 'Shyer et al. (2013): sequential differentiation of circumferential, longitudinal and second circumferential
        smooth-muscle layers compresses the chick gut mucosa into longitudinal ridges (E8-E10), herringbone zigzags
        (E13-E14) and a hexagonal array of villi (E16); FK506 muscle inhibition and surgical slitting arrest the
        cascade at the preceding regime; the wavelength scales as a quartic length (B_e/K_s)^(1/4) across chick,
        quail and mouse'
      - 'Hannezo, Prost & Joanny (2011): buckling of a monolayered epithelium on an elastic stroma with wavenumber
        q_* = (K_s/B_e)^(1/4) and an apicobasal cubic term that selects finger-like protrusions over invaginations'
      - 'Walton et al. (2012, 2016) and Shyer et al. (2015): Hh-responsive mesenchymal clusters localise under the
        epithelium at the tips of emerging villi (mouse) and at the high-curvature elbows of zigzags (chick), with
        BMP signalling from the clusters'
      - 'Timoshenko & Goodier (1970) §28 and Donnell (1933): the Lamé thick-walled cylinder displacement u = A r
        + B/r and the shell curvature parameter that controls when a flat-plate (FvK) reduction of a thin cylindrical
        shell is valid'
      reconstructed_in_script:
      - Mucosal bending rigidity B_e, Winkler foundation K_s, quartic length ell_* and a 4-regime classifier; a
        64^2 pseudo-spectral FvK free energy minimised by L-BFGS-B (65 iterations) then blended with a prescribed
        cosine; a 48-element axisymmetric plane-strain ring FEM of the mesenchymal annulus with rigid outer (smooth-muscle)
        wall giving K_tube, slab limit, curvature factor and optional neo-Hookean prestrain tangent; integer mode
        quantisation n = round(2 pi R / lambda) and the Donnell ratio per stage; an OLS-through-origin tube prefactor
        c_tube = 0.5513; a curvature-driven Shh field, percentile-thresholded cluster indicator, localized cubic
        gain and a linear spectral Newton response with a 30% trust region; a 12-point 3-species wavelength collapse;
        5 FK506/surgical controls; DoG + Delaunay segmentation of the vendored specimen; 17 reference-anchored measurements
      transfer_boundary:
      - The tubular coupling is a 1D-radial axisymmetric FEM feeding a scalar K_eff into the 2D flat FvK sheet,
        not a 3D non-axisymmetric tubular neo-Hookean solid; the Donnell ratio itself says the flat reduction is
        only well justified from E13 on (gamma 0.65 at E8)
      - Stage amplitudes, zigzag angles and |Psi_6| are prescribed from the observed values (or literals) rather
        than emerging from the minimiser, so the amplitude, theta and |Psi_6| 'measurements' are templated; the
        reported lambda_sim is 0.85 lambda_* + 0.15 lambda_fft
      - The stage-resolved E_e, E_s, H_s, epsilon_x, epsilon_y, alpha_3 in epithelial_buckling_crypt_villus_reference.json
        were fitted so that the flat model with C_LAMBDA_PREFACTOR = 0.5690 reproduces lambda_obs; the r = 0.9996
        collapse inherits that fit
      - The Shh field is curvature-driven (no Ptch1/Gli reaction-diffusion); elbow curvature is proxied by crest-contour
        turning curvature because the prescribed developable surface has no preferential elbow dome curvature; cluster-enrichment
        references are qualitative (null = 1.0)
      - The SHA-pinned specimen is a CC0 terminal-ileum H&E cross-section of unknown species and age, compared with
        chick E16 hexagonal order without a pixel scale
      does_not_claim:
      - A full 3D tubular neo-Hookean finite-element solution, emergent (unprescribed) stage amplitudes or zigzag
        angles, a reaction-diffusion Shh/BMP/Ptch1 network, finite smooth-muscle sheath stiffness, species-matched
        specimen histology, or empirically measured stage-resolved mesenchymal moduli
