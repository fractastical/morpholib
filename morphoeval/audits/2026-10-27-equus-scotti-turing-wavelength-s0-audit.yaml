  id: 2026-10-27-equus-scotti-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (primary pass-1 assessor)"
    homepage: https://x.ai
  publisher_orcid: "https://orcid.org/0009-0007-4948-9192"
