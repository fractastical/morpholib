# Pass 1 — Equus scotti follicular Turing wavelength, 164 µm, Irvingtonian 0.6 Ma.
# Slot 3220. Scores describe the script as committed, including the gaps listed
# under remediation. They are uncalibrated rubric ratings, not probabilities.

