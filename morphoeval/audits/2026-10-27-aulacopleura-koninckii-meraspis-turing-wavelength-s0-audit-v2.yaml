    status: evaluated
    supersedes_audit_id: 2026-10-27-aulacopleura-koninckii-meraspis-turing-wavelength-s0-audit
    source_refs: [fusco2004, hughes1995, hughes2006, turing1952, schnakenberg1979, murray1981]
    summary: >-
      Pass 2 keeps the Pass-1 law (λ_c = 3.125 µm, r = 0.99937, equal-diffusion
      σ_max = -0.458 /s, sweep 3.146–3.993 µm) and adds a 48×36 pleural patch
      whose dominant wavelength is 3.125 µm (k_dom/k_c = 1.000), distinct from
      the 1D fastest mode at 3.146 µm. The comparison figure now draws the
      specimen contour, prints KS = 0.067, and states the holaspis18 copy
      ratio 1.50 at fixed k_c. GIF is 720×560 and 16 frames; last-frame CV
      similarity to the Commons photograph is 95.7. Counted furrows remain 11
      against the assigned 12.
    claim_boundary:
      reported_in_source:
        - "Meraspid Aulacopleura adds thoracic segments; holaspid number varies (Fusco et al. 2004; Hughes & Chapman 1995)."
        - "Turing 1952 selects an intrinsic chemical wavelength; Schnakenberg 1979 supplies the two-species kinetics."
      reconstructed_in_script:
        - "a=0.0625, b=0.875, D_u=2e-12 m^2/s, D_v/D_u = 1.02 × r_crit, and γ are solved so λ_c = 3.125 µm."
        - "The 2D patch is a periodic epithelial rectangle seeded with a transverse lira plus mediolateral noise."
        - "The M12 to holaspis18 change at this scale is the segment surplus 6 at fixed k_c (copy ratio 1.5)."
      transfer_boundary:
        - "Murray 1981 is used only as the scale argument that domain length, not k_c, changes the number of hosted wavelengths."
      does_not_claim:
        - "That 3.125 µm was measured on the photograph."
        - "That the dorsal photograph is a verified degree-12 meraspis (counted furrows are 11)."
        - "That a Turing mechanism operated in the Silurian animal."
        - "That a second, independent assessor scored this audit."
    scores:
      model-fidelity:
        value: 90
        rationale: "Pass 1's Schnakenberg PDE and k_c formula remain, with r=0.99937 on the discrete dispersion band. Pass 2 adds the 2D patch: mediolateral noise does not shift the dominant anteroposterior wavenumber off k_c (ratio 1.000). Parameters are still a reconstruction that hits the assigned wavelength, not a measured trilobite kinetic set."
        evidence:
          - {file: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py, lines: [98, 127], note: "γ solved from the k_c formula", supports: true}
          - {file: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py, lines: [180, 235], note: "1D eigenmode goodness-of-fit", supports: true}
          - {file: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py, lines: [269, 302], note: "2D pleural patch and dominant ky", supports: true}
      specimen-match:
        value: 84
        rationale: "The comparison figure now overlays the border-contrast contour on the Commons photograph, and the GIF (16 frames, 720×560) still ends on that photograph (CV 95.7). The 2D field is a short-wavelength lira texture in the same ochre family, not a pixel copy of the exoskeleton. Furrow count 11 is shown against the assigned 12 rather than edited to match."
        evidence:
          - {file: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py, lines: [640, 671], note: "segmentation contour drawn on the specimen panel", supports: true}
          - {file: docs/media/aulacopleura_koninckii_meraspis_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "contour, 2D patch, dispersion, sweep", supports: true}
          - {file: docs/media/aulacopleura_koninckii_meraspis_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "16-frame growth ending on the specimen", supports: true}
