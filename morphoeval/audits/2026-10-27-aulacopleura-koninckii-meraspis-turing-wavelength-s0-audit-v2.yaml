        rationale: "The diffusion-ratio sweep still moves λ_max from 3.146 µm to 3.993 µm, and equal diffusion remains stable (σ_max=-0.458/s). The 2D noise seed is an extra control: the transverse mode survives. a and b stay fixed."
        evidence:
