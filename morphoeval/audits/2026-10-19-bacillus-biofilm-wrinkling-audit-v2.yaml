    summary: >-
      Pass 2 (v2) evaluation of `2013-asally-bacillus-biofilm-wrinkling.py` (overall
      weighted score: 93.6/100, up from 56.2/100 in v1). The remediated script relaxes a
      2D circular colony Föppl–von Kármán + localized cell-death delamination free-energy
      functional via pseudo-spectral L-BFGS-B minimization, reproducing the wild-type
      central concentric ring and N_spokes = 13 outer radial spokes; validates the 7-point
      agar stiffness sweep E_s in [0.5, 10.0] kPa (r = 1.0000, RMSE = 1.94 um, log-log
      exponent -0.3338 ± 0.0008 vs -1/3) and 6-point biofilm thickness sweep h in [40, 140] um
      (r = 1.0000, slope = 0.9999 ± 0.0017); verifies all 5 genetic and artificial
      mechanical-score controls (WT, Delta eps/tasA flat mutant, FeCl3 cell-death
      suppression, guided m=6 and m=8 spoke templates); and segments the SHA-256-locked
      CC BY-SA 3.0 specimen (`bacillus_biofilm_specimen.jpg`, n = 11 colonies, focal
      N_spokes = 12, mean spoke angle = 30.0 deg, spacing CV = 0.3156).
    scores:
      model-fidelity:
        value: 95
        rationale: >-
          Implements plane-strain Föppl–von Kármán bilayer buckling mechanics
          (`compute_fvk_wavelength_and_strain`, L91-147), spatiotemporal basal cell-death
          patterning (`build_cell_death_template`, L153-175), and a 2D pseudo-spectral +
          L-BFGS-B energy minimizer (`relax_fvk_biofilm_colony`, L178-297) with genetic and
          artificial score controls (`evaluate_genetic_and_mechanical_controls`, L393-425),
          backed by 3 machine-checked Lean 4 theorems in
          `morphoeval/lean/loops/Loop_094_bacillus_biofilm_wrinkling.lean`.
        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [91, 147], note: "Exact Föppl-von Kármán bilayer wavelength lambda_c, critical strain epsilon_c, cell-death delamination threshold, and spoke count N_spokes", supports: true}
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [178, 297], note: "2D circular colony pseudo-spectral + L-BFGS-B Föppl-von Kármán + cell-death delamination energy minimizer", supports: true}
          - {file: morphoeval/lean/loops/Loop_094_bacillus_biofilm_wrinkling.lean, lines: [14, 108], note: "3 standalone Lean 4 theorems proving FvK cubed wavelength stationarity, cell-death delamination focusing, and radial spoke scaling (0 sorrys)", supports: true}
      specimen-match:
        value: 92
        rationale: >-
          Vendors and SHA-256-verifies the CC BY-SA 3.0 Bacillus subtilis macrocolony
          biofilm photograph `datasets/bacillus_biofilm_wrinkling/bacillus_biofilm_specimen.jpg`,
          segments n = 11 isolated circular macrocolonies across the agar plate, and extracts
          N_spokes = 12 radial wrinkle ridges (mean angular spacing = 30.0 deg, CV = 0.3156)
          on the focal colony (`segment_bacillus_biofilm_specimen`, L431-505).
        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [431, 505], note: "Macrocolony segmentation and DoG circumferential radial spoke ridge detection on bacillus_biofilm_specimen.jpg", supports: true}
          - {file: docs/media/bacillus_biofilm_wrinkling_comparison.png, lines: [0, 0], note: "6-panel synthesis figure comparing 2D FvK buckling, agar & thickness scaling, mutant/score controls, and specimen spoke segmentation", supports: true}
      parameter-expressivity:
        value: 93
        rationale: >-
          Spans the 7-point agar stiffness sweep E_s in [0.5, 10.0] kPa (L303-355), the
          6-point biofilm thickness sweep h in [40, 140] um (L358-390), 5 genetic and
          mechanical-score controls (WT, Delta eps/tasA, FeCl3 cell-death suppression,
          guided m=6 and m=8 templates, L393-425), and exposes `--E-s-kPa`, `--h-um`,
          `--epsilon-g`, `--artificial-spokes`, and `--seed` CLI overrides (L652-676).
        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [303, 425], note: "7-point agar stiffness sweep, 6-point thickness sweep, and 5 genetic/mechanical-score controls", supports: true}
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [652, 676], note: "CLI overrides for E_s, h, epsilon_g, artificial spokes, and seed", supports: true}
      morphometric-validation:
        value: 94
        rationale: >-
          `measure_morphoeval()` (L511-606) computes 9 reference-anchored morphometric
          measurements with uncertainty and statistical tests: agar stiffness wavelength
          Pearson r = 1.0000 (p = 3.74e-12, RMSE = 1.94 um), log-log agar stiffness
          exponent |alpha_E| = 0.3338 ± 0.0008 (ref 0.3333), thickness wavelength Pearson
          r = 1.0000 (p = 4.57e-11, slope = 0.9999 ± 0.0017), relaxed FvK standard-agar
          wavelength 773.32 um (ref 750.0 um), WT spoke count 13 (ref 13), Delta eps/tasA
          mutant amplitude 0.0 um (ref 0.0 um), guided m=6 score spoke count 6 (ref 6),
          specimen focal spoke count 12 (ref 13), and specimen mean spoke angle 30.0 deg
          (ref 27.69 deg).
        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [511, 606], note: "9 quantitative morphometrics with p-values, RMSE, log-log slopes, mutant negative controls, and specimen spoke metrics", supports: true}
      source-traceability:
        value: 95
        rationale: >-
          Vendors `datasets/bacillus_biofilm_wrinkling/` with 4 primary DOIs in
          `paper_citations.bib` (`10.1073/pnas.1212429109`, `10.1038/s41567-018-0392-9`,
