        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [612, 649], note: "8-check self_test() verifying SHA-256 digests, scaling laws, mutant controls, CV specimen, and bitwise determinism", supports: true}
    remediation:
      - "Couple the 2D circular Föppl–von Kármán delamination solver to a 3D poroelastic osmotic water-transport PDE resolving radial fluid influx from the agar into the expanding biofilm channel network."
