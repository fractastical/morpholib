        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [1, 35], note: "Explicit equation-to-paper and Lean 4 theorem traceability in module header", supports: true}
      repro-package:
        value: 94
        rationale: >-
          8-point `self_test()` suite (`L612-649`) verifying SHA-256 dataset integrity,
          agar stiffness cube-root scaling slope (-1/3), biofilm thickness linear scaling,
