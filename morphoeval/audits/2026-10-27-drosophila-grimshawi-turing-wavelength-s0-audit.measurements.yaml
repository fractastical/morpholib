    claim_boundary:
      reported_in_source:
      - Turing (1952) and Schnakenberg (1979) supply the instability and the activator-inhibitor kinetics.
      - Edwards et al. (2007) document Hawaiian picture-wing diversity including D. grimshawi. Werner et al. (2010)
        show D. guttifera spots are Wingless-driven. Neither paper reports a 2.765 µm wavenumber.
      reconstructed_in_script:
      - δ-dependent fastest mode, numerical growth-rate fit, and the chronoseries order ficusphila < guttifera <
        grimshawi at fixed D_u.
      - Spiral-wave render calibrated to the gallery asset's radial luminance envelope and melanin colour regression.
      transfer_boundary:
      - The gallery frame is a project spiral asset, not a 2.8 µm micrograph. Wikimedia hits were envelope labels
        and were not used as the target.
      does_not_claim:
      - Does not claim Edwards or Werner measured this wavelength.
      - Does not claim the saturated nonlinear Schnakenberg spot field stays at 2.765 µm; the reported law is the
        linear fastest mode.
      - Does not claim the 199 µm grimshawi primordium slot.
