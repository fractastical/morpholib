    claim_boundary:
      reported_in_source:
      - 'Hannezo et al. (2017): ductal trees of mammary gland, kidney and pancreas are self-organised by a branching-and-annihilating
        random walk of active tips (A -> 2A at rate k_b, A -> A + I trail deposition, A + I -> I annihilation within
        R_a), giving N_term = N_branch + 1, q_branch -> 1/2, a critical Galton-Watson subtree law P(S) ~ S^(-3/2),
        a universal generational q(g) relaxation and a travelling-wave mean-field with homeostatic duct density
        i_inf = k_b/k_a'
      - 'Scheele et al. (2017): mammary TEB stem cells follow neutral drift (equipotent, Moran-type) so clone fates
        are set by TEB bifurcation/termination; clone-size distributions inherit the tree statistics'
      - 'Bordeu et al. (2023): salivary-gland BARW in an inflating 3D domain; domain growth and local geometry,
        not tip-intrinsic rules, set branch density'
      - 'Moran (1958), Klein & Simons (2011): neutral birth-death drift is a martingale in the labelled fraction
        with variance 2k(N-k)/N^2 per step'
      reconstructed_in_script:
      - 2D off-lattice BARW tree, 1D Fisher-KPP mean-field wave, exact Catalan critical GW pmf, 3-organ universality
        collapse, R_a perturbation/ablation suite, specimen bud/junction segmentation (all Pass 2)
      - 'Pass 3: 3D off-lattice BARW in a cylindrical fat pad and a spherical (optionally inflating) capsule with
        a nematic ECM alignment torque, a length-weighted nematic order parameter S, a paired-seed lambda sweep
        with a true-isotropic control, an inflation sweep, a birth-vertex annihilation-exemption rule, a Moran neutral-drift
        clonal model inside TEBs with hypergeometric splits at bifurcations and label inheritance by ducts, 64 mosaic
        replicates and 600 single-cell clones, 6 additional measurements with reference values, 2 new self-test
        suites and 3 new Lean theorems'
      transfer_boundary:
      - The 3D fat pad is a cylinder, not Bordeu's flattened slab; only the spherical capsule inflates and already-deposited
        ducts are NOT advected with the domain; no Bordeu figure or table value is reproduced numerically — only
        the qualitative monotonic S(lambda) and inflation ordering of L_total; S reference values are the theoretical
        0 / 1 extremes
      - N_TEB = 64 and the Moran rate rho = 1 per unit duct length are free parameters (real TEBs have O(10^2) cells);
        no Scheele clone-size histogram is reproduced numerically — only the exact martingale f_bar = f_0 and the
        S^(-3/2) tail inherited from the tree
      - The 1D PDE carries uncited calibration constants (1.82 k_a, 0.55 v_0, v_drift = 0.35 v_0) tuned so the wake
        plateau matches k_b/k_a; the i_inf agreement is therefore a self-calibration, not an independent test
      - The SHA-pinned specimen is a Wikimedia whole-mount of an embryonic branched gland, not a pubertal mammary
        TEB network; its reference values (N_term = 34, r/R_max = 0.783) are the segmentation's own outputs
      does_not_claim:
      - Quantitative reproduction of any Hannezo/Scheele/Bordeu figure or table beyond the reference JSON tables;
        advected-duct inflation; a slab fat-pad geometry; multi-seed statistics for the 3D lambda sweep; Scheele
        clone-size histograms; a mammary-specific specimen
