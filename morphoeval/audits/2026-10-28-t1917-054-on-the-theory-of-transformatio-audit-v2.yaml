simulations:
  - id: thompson1917-t1917-054
    name: "Thompson (1917) Figs. 388-393: Archaeopteryx -> Apatornis pelvis by equidistant coordinate-grid interpolation"
    organism: "Archaeopteryx lithographica and Apatornis celer (pelvis, left lateral; Heilmann restorations after Marsh 1880)"
    script: thompson/claims/t1917-054_on-the-theory-of-transformations.py
    output: docs/media/t1917_054_on_the_theory_of_transformatio_comparison.png
    extra_outputs:
      - docs/media/t1917_054_on_the_theory_of_transformatio_growth.gif
      - datasets/thompson_1917/t1917-054/result.json
    status: evaluated
    supersedes_audit_id: 2026-10-28-t1917-054-on-the-theory-of-transformatio-audit
    source_refs: [thompson1917, bookstein1989, gower1975, deeming2018, clarke2004]
    summary: >-
      Pass 2 (v2), overall 83.1/100 (up from 68.8 in Pass 1).  The five Fig. 393 silhouettes are
      segmented and landmarked from the SHA-256-pinned IA scan; GPA; Thompson's equidistant
      interpolation phi_t = (1-t) id + t phi (E2/E6) is run with phi as (i) a dense semilandmark
      TPS, (ii) a 9-anchor coarse TPS grid and (iii) an affine map (E5), and scored against
      Heilmann's drawn intermediates with the nearest-endpoint null.  Heilmann's stages sit at
      t* = 0.263 / 0.529 / 0.824 (nominal 0.25 / 0.5 / 0.75; max residual 0.074; sweep SD <= 0.003
      over 24 settings).  Dense interpolation: Procrustes 0.134 / 0.121 / 0.093 vs endpoint 0.214 /
      0.312 / 0.145 and affine 0.162 / 0.199 / 0.293; IoU 0.572 / 0.599 / 0.683 vs endpoint 0.538 /
      0.436 / 0.629; r = 0.991-0.996; KS p <= 5.5e-6; correspondence-shift null exact p = 0.0104
      (z = -4.4).  The dense TPS folds as a grid (min det -10.4 inside the form) whereas the 9-anchor
      coarse grid is fold-free (min det 0.23) and beats the endpoint on stages 1-2 only.  Part B
      ("biologically real") remains untestable; Dryad k1v34cf is a labelled variable mismatch.
      Verdict in result.json: mixed (A supported, approximately equidistant; B untestable).
    claim_boundary:
      reported_in_source:
        - "Fig. 388 Archaeopteryx pelvis in Cartesian coordinates; Fig. 389 Apatornis pelvis in a transformed grid (p. 757)"
        - "three intermediate and equidistant coordinate systems interpolated between them (p. 759, Fig. 390)"
        - "a pelvis outline inscribed in each interpolated system (Figs. 391-392) and the five-form series (Fig. 393)"
        - "the intermediates are 'hypothetical types' / 'transitional stages' (pp. 757, 759)"
      reconstructed_in_script:
        - "the grid phi as a thin-plate spline on automatically detected landmarks + arc-length semilandmarks (dense) or on 9 anatomical anchors (coarse); Fig. 389's grid lines are not digitised"
        - "the stage parameter t and all statistics (t*, Procrustes, IoU, boundary RMSE, r, KS, permutation and correspondence nulls, Jacobian check)"
        - "segmentation of the wash drawings (Otsu, opening/closing) and the tip classification rule"
      transfer_boundary:
        - "the registered claim's 'biologically real intermediate forms' goes beyond Thompson's 'hypothetical types'; tested only against Heilmann's own drawn intermediates"
        - "the Berlin specimen bone/matrix segmentation is descriptive and enters no statistic of the verdict"
      does_not_claim:
        - "that the interpolated pelves match any real intermediate Mesozoic bird (part B untestable here)"
        - "any phylogenetic position for Apatornis beyond Clarke (2004)"
        - "that Heilmann's Fig. 393 series is drawn to one scale (centroid size is non-monotone)"
        - "that the dense semilandmark TPS is a valid coordinate grid (it folds; the coarse grid is)"
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          E2/E6, E4, E5 and E7 are implemented as stated and mirrored by 11 Lean theorems; Pass 2
          adds the numerical E1 check (min det D phi_t over the 9 x 8 grid and inside the form at
          21 stages) that Lean states in 1-D, plus the coarse 9-anchor grid that realises
          Thompson's actual construction (few anchors, smooth grid, fold-free) beside the dense
          semilandmark spline.  Remaining deduction: Fig. 389's drawn grid is still not digitised
          line by line, so phi is reconstructed from the silhouettes rather than read off the plate.
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [322, 376], note: "tps_fit/tps_apply (E4), affine_fit/affine_interp_matrix (E5), interp_stage (E2/E6), best_fit_t (E7)", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [483, 514], note: "jacobian_min_det / check_no_fold (E1 at every stage) and sparse_anchor_rows (9-anchor Thompson-like grid)", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_054.lean, lines: [24, 180], note: "interp4, interpDet; 11 theorems incl. interp_no_fold, best_fit_stage_sound; Lean 4.35.0, 0 sorry", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [582, 600], note: "phi fitted on silhouette configurations, not on Thompson's drawn grid lines", supports: false}
      specimen-match:
        value: 78
        rationale: >-
          Predicted stages are overlaid on Heilmann's drawn stages at form scale (15-panel figure:
          Figs. 388/389, segmented Fig. 393, three overlays with the fold-free grid, controls), and
          the correspondence-free IoU quantifies the visual match (0.57-0.68 vs 0.44-0.63 for the
          endpoint null).  The real Berlin Archaeopteryx photograph is now analysed (bone/matrix
          mask) but, as the audit must say, it contributes nothing to the pelvis comparison because
          the pelvis is disarticulated; Apatornis is still a synsacrum plate.  The dense prediction
          shows fold wiggles on the thin pubis, visible in the overlays.
        evidence:
          - {file: docs/media/t1917_054_on_the_theory_of_transformatio_comparison.png, lines: [0, 0], note: "15 panels: source figures, segmented Fig. 393, three predicted-vs-drawn overlays, t*/Procrustes/IoU, null histogram, no-fold curves, descriptors, specimen mask", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [814, 836], note: "stage overlays: dense prediction, coarse-grid prediction and drawn stage superimposed by similarity, axes at form scale", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [554, 579], note: "segment_specimen_bone: Berlin specimen mask is descriptive only; no pelvis outline obtainable", supports: false}
      parameter-expressivity:
        value: 80
        rationale: >-
          t moves the form monotonically (GIF; pubis angle 131 -> 162 deg; t* strictly increasing);
          the sweep over 6 semilandmark densities x 4 lambdas is run and reported (t* SD <= 0.003;
          prediction/endpoint ratio 0.51 -> 0.91 as lambda grows, i.e. lambda visibly trades
          endpoint fidelity for smoothness); three transformation families (dense TPS, coarse
          9-anchor TPS, affine) are compared at every stage.  Deduction: the anchor set of the
          coarse grid (9) is fixed, not swept.
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [717, 755], note: "parameter_sweep: 24 settings, t* mean/SD/CV, pred/endpoint range, all_monotone, all_beat_endpoint", supports: true}
          - {file: datasets/thompson_1917/t1917-054/result.json, lines: [0, 0], note: "parameter_sweep rows and summary written to the verdict file", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [511, 514], note: "coarse-grid anchor count fixed at 9", supports: false}
      morphometric-validation:
        value: 86
        rationale: >-
          Quantitative morphometrics on the output are compared against the source's claim with
          explicit nulls and uncertainty: t* vs nominal with sweep SD; Procrustes, IoU, boundary
          RMSE, Pearson r and RMSE vs three controls; KS test of residual distributions (p <= 5.5e-6);
          3! pairing permutation (nominal best, p = 1/6 floor); exact correspondence-shift null
          (95 shifts, p = 0.0104, z = -4.4).  measure_morphoeval() exposes 11 measurements, 8 with
          reference values.  Deductions: the permutation test has only 6 arrangements; no
          literature morphometrics of real intermediate taxa exist in the pinned data (part B).
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [461, 481], note: "compare_outlines: Procrustes, Pearson r, RMSE/cs, IoU, symmetric boundary RMSE", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [517, 552], note: "pairing_permutation_test, correspondence_shift_null (exact p), ks_residuals", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [1038, 1098], note: "measure_morphoeval: 11 measurements with reference values, sweep SD and null p-values in notes", supports: true}
          - {file: datasets/thompson_1917/t1917-054/result.json, lines: [0, 0], note: "part B recorded as untestable; Dryad k1v34cf DATASET_MISMATCH block", supports: false}
      source-traceability:
        value: 88
        rationale: >-
          Unchanged from Pass 1 and still strong: seven inputs SHA-256 pinned and re-verified at
          runtime (fail closed); IA item, leaf-to-page rule, Commons file pages with authors and
          licences, DOIs for all modern references, and the pre-scouted Dryad record with its
          mismatch reason.  Deduction: Thompson 1917 has no DOI (IA URL only); the Dryad file
          itself could not be fetched (browser challenge), only its API metadata.
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [138, 151], note: "verify_inputs: SHA-256 of every pinned input, raises on mismatch", supports: true}
          - {file: datasets/thompson_1917/t1917-054/scout_manifest.json, lines: [0, 0], note: "IA pins, Commons pins with licences, Dryad mismatch record, OpenAlex hits", supports: true}
          - {file: datasets/thompson_1917/t1917-054/paper_citations.bib, lines: [1, 95], note: "9 references with DOIs where they exist", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          Module docstring maps E1-E7 to functions, quotes the source passages, lists the Pass 2
          controls and names the Lean mirror; function docstrings cite their equation or
          remediation item (R2-R6); the KG YAML pins lean_locus and line-range code_locus per law.
          Deduction: the Pass 2 statistics (IoU, KS, nulls) have no equation number in the
          reference JSON beyond E7.
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [1, 90], note: "docstring: claim, source quotes, E1-E7 -> function map, Pass 2 controls, claim boundary", supports: true}
          - {file: morphoeval/math_kg_loops/thompson1917-t1917-054.yaml, lines: [1, 125], note: "5 laws with lean_theorem, lean_locus and line-range code_locus; sweep and controls in model_spec", supports: true}
      repro-package:
        value: 82
        rationale: >-
          Deterministic (two-run equality asserted), fail-closed input hashes, 16-check self-test in
          2.7 s covering the equations, the numerical Jacobian on known shear/scaling maps, IoU/RMSE
          sanity, segmentation areas, t* ordering, all three controls, both nulls, the no-fold check
          and the specimen pass; full run 28 s; CLI flags for n_semi, lambda, sweep, specimen, GIF.
          Deductions: dependency versions pinned only via requirements.txt lower bounds; the
          comparison PNG is git-ignored by repo policy so a reviewer must re-render it.
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [1101, 1175], note: "self_test: 16 checks incl. Jacobian on shear/scaling, IoU sanity, nulls, no-fold, determinism, specimen", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [1178, 1200], note: "CLI: --self-test, --n-semi, --lam, --no-sweep, --no-specimen, --no-gif", supports: true}
    needs:
      - id: N1
        need_type: parameter_sweep
        target_dimension: parameter-expressivity
        description: "Sweep semilandmark density (8..48) and TPS lambda; report stability of t* and of the prediction/endpoint ratio"
        status: resolved
      - id: N2
        need_type: morphometric_validation
        target_dimension: morphometric-validation
        description: "Correspondence-free IoU and boundary RMSE, Pearson r, shuffled-stage permutation null, KS test"
        status: resolved
      - id: N3
        need_type: specimen_comparison
        target_dimension: specimen-match
        description: "CV segmentation of the Berlin Archaeopteryx photograph and a larger predicted-vs-drawn figure"
        status: resolved
      - id: N4
        need_type: model_equation
        target_dimension: model-fidelity
        description: "Numerical no-fold (Jacobian determinant) check of phi_t at every stage"
        status: resolved
      - id: N5
        need_type: independent_assessor
        target_dimension: model-fidelity
        description: "Independent second assessor from a different provider"
        status: open
      - id: N6
        need_type: specimen_comparison
        target_dimension: morphometric-validation
        description: "Part B: 2-D pelvis landmarks of phylogenetically intermediate taxa (Jeholornis, Sapeornis, Confuciusornis, Enantiornithes, Hesperornis, Ichthyornis) to test whether the interpolated stages are biologically real"
        status: open
    remediation:
      - "R1 (open): independent second assessor from a different provider — this round is builder-scored"
      - "R7: digitise the grid lines of Figs. 388-390 directly and compare Thompson's drawn intermediate grids with the fitted coarse TPS grid"
      - "R8: part B — assemble 2-D pelvis landmarks of real intermediate Mesozoic birds from open literature plates (e.g. Marsh 1880 Ichthyornis/Hesperornis, PD) and test the interpolated stages against them"
      - "R9: sweep the coarse-grid anchor count (5, 9, 13, 17) to locate where a fold-free grid starts to reproduce the drawn stages as well as the dense correspondence"
