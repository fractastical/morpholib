# MorphoEval audit — Thompson (1917) Ch. XVII Figs. 388-393, Archaeopteryx -> Apatornis pelvis
# by equidistant grid interpolation (T1917-054, slot 243), 2026-10-28 — Pass 2 (v2)
#
# Supersedes 2026-10-28-t1917-054-on-the-theory-of-transformatio-audit (Pass 1, 68.8/100) after the
# Step 12 closed-loop remediation of `thompson/claims/t1917-054_on-the-theory-of-transformations.py`
# (781 -> 1193 lines).  LIMITATION unchanged: builder and assessor are the same agent (Claude Fable
# 5.1); no independent second assessor (R1 stays open).
#
# What Pass 2 added and what it found
#   R2 sweep: 6 semilandmark densities x 4 TPS lambdas (24 settings). t* = 0.260 / 0.527 / 0.824
#      with SD 0.003 / 0.002 / 0.002 (CV <= 0.01): the stage estimates do not depend on the
#      digitisation choices. The prediction/endpoint error ratio ranges 0.51 (interpolating spline)
#      to 0.91 (lambda = 0.1 smoothing spline, which no longer reaches the Apatornis endpoint).
#   R3 nulls: the nominal pairing of predicted and drawn stages is the best of all 3! pairings
#      (p = 1/6, the floor of that test); destroying the anatomical correspondence by every one of
#      the 95 cyclic shifts of the Apatornis boundary semilandmarks gives mean Procrustes error
#      0.656 (min 0.177) against 0.116 observed: exact p = 0.0104, z = -4.4.
#   R4 goodness of fit: IoU of filled outlines 0.572 / 0.599 / 0.683 (endpoint control 0.538 /
#      0.436 / 0.629; affine 0.585 / 0.553 / 0.501); Pearson r 0.991 / 0.993 / 0.996 (endpoint
#      0.972 mean); RMSE/centroid size 0.0136 / 0.0123 / 0.0094; KS (prediction residuals smaller
#      than endpoint residuals) p = 5.5e-6 / 1.1e-22 / 3.0e-9.
#   R5 no-fold: the dense semilandmark TPS FOLDS (min det D phi_t = -10.4 inside the form,
#      -41.9 on the padded grid, negative from t ~ 0.2); a 9-anchor coarse grid (acetabulum, 4 tips,
#      4 midpoints — a Thompson-like grid) is fold-free at all 21 stages (min det 0.23) and beats the
#      nearest endpoint on stages 1-2 (0.154 vs 0.214; 0.184 vs 0.312) but not stage 3 (0.244 vs
#      0.145).  So: the drawn intermediates are best reproduced by point-wise linear interpolation
#      of corresponding boundary points (Heilmann's inscribing procedure), while the smooth grid
#      that is a genuine diffeomorphism reproduces them less closely.
#   R6 specimen: bone-vs-matrix segmentation of the Berlin Archaeopteryx photograph runs (36.6%
#      bone, 996 components) and is reported as descriptive only; the pelvis is disarticulated on
#      the slab so no outline can be taken from it.  Figure enlarged to 15 panels.
# Verdict (result.json): mixed — part A (interpolation yields approximately equidistant,
# reproducible intermediates) supported; part B ("biologically real") untestable with pinned data;
# the pre-scouted Dryad dataset is a variable mismatch and is labelled, not fitted.

