    short: 'Prize #1: Center-Column Aperiodicity'
    prize_usd: 10000
    statement: 'For the single-cell seed a_{0,i} = delta_{i,0}, the center column
      c_t = a_{t,0} never becomes eventually periodic (forall t_0 >= 0, forall Pi
      >= 1, exists t >= t_0 : c_{t+Pi} != c_t).'
    resolvability: 0.85
    conjecture_assessments:
      claude-fable-5-1:
        p0: 0.97
        woe_db: 10.5
        bf: 11.220184543019636
        posterior: 0.9972511309093467
        confidence: 0.85
      gpt-5.6-sol:
        p0: 0.97
        woe_db: 38.0
        bf: 6309.57344480193
        posterior: 0.9999950982925038
        confidence: 0.9
      gemini-4-argon:
        p0: 0.97
        woe_db: 16.0
        bf: 39.810717055349734
        posterior: 0.9992237309695263
        confidence: 0.88
