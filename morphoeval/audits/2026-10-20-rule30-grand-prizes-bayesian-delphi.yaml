          - 1.5
        evidence_against:
        - - Depth-1 Right Cylinder has positive topological entropy (~0.32 bits/step)
            on short runs 1 <= a_i <= 7
          - -4.5
        - - 'Transparent-gate absorption loophole: when c_t=0, r_1(t) can absorb D_1(t)=1
            without immediate local contradiction'
          - -4.0
        - - Pure Left-Cone Opaque Mirror survival window grows linearly (~7*Pi steps,
            <=13 pulses) on sparse pulses
          - -2.0
        - - Even-weight barriers beyond k_4=400 branch on transient history of c_t
          - -1.0
