        confidence: 0.68
        verdict: PROMISING_REDUCTION_BUT_MAJOR_GLOBAL_INVARIANT_MISSING
        evidence_for:
        - - Exact cone, seam, transducer, and joint-seam (c_t, l_1(t)) impossibility
            reductions
          - 5.0
        - - Unconditional infinite family eliminations (all t_0 >= 0) + 74.25M necklace
            / 249,500-pair exhaustion
          - 4.0
        - - Universal 9-row horizon sandwich and unconditional 4-line inward defect
            wavefront to m=1
          - 4.0
        - - Depth-1 Right Cylinder (Opaque Mirror + Monotone Latch + Fibonacci Reset)
            collapses survival windows to <=19 steps
          - 2.0
        evidence_against:
        - - Positive Depth-1 Right Cylinder entropy (~0.32 bits/step) prevents bounded-depth
            local closure
          - -5.0
        - - No theorem preventing D_1(t)=1 defects from aligning exclusively with
            transparent gates {c_t=0}
          - -4.0
        - - Finite-domain & boundary-onset (t_0=Pi-1) exhaustion does not control
            astronomical t_0 >> Pi > 30
          - -2.0
      gemini-4-argon:
        p0: 0.07
        for_db: 14.0
        against_db: -11.5
        net_woe_db: 2.5
        bf: 1.7782794100389228
        posterior: 0.11804833737684385
        confidence: 0.7
        verdict: SHARP_REDUCTION_TO_PHASE_ALIGNMENT_OBSTRUCTION
        evidence_for:
        - - Pure Left-Cone causal functional B_t(m) & Pascal-Lucas Green's function
            (Thm 44)
          - 3.5
        - - Unconditional joint-seam (c_t, l_1(t)) impossibility for all t_0, Pi >=
            1 (Thm 36(1))
          - 3.5
        - - Unconditional 4-line inward wavefront (D_1(t)=1 infinitely often) & D_2(t)=D_1(t+1)^D_1(t)
            (Thms 45, 47)
          - 3.0
        - - All-t_0 gate-lock infinite families via 3-bit right-wall trap W_3 (Thms
            32, 37, 38, 40, 42)
          - 2.5
        - - Depth-1 Right Cylinder kills sparse pulses (0^{Pi-1} 1)^infty in 1st period
