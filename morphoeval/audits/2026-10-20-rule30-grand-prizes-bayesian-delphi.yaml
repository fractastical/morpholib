        gemini-4-argon: 52.0
    bridge_assessments:
      claude-fable-5-1:
        p0: 0.05
        for_db: 13.5
        against_db: -13.0
        net_woe_db: 0.5
        bf: 1.1220184543019633
        posterior: 0.05576073080591392
        confidence: 0.6
        verdict: PARTIAL_PROGRESS_REDUCED_TO_ONE_OPEN_GLOBAL_LEMMA
        evidence_for:
        - - Pure Left-Cone autonomy & Opaque Mirror reduction to 1D boundary automaton
            (Thms 9, 44)
          - 3.0
        - - Unconditional joint-seam (c_t, l_1(t)) aperiodicity for all t_0, Pi >=
            1 (Thm 36(1))
          - 3.0
        - - Unconditional 4-Line Inward Wavefront Lemma forcing D_1(t)=1 infinitely
            often (Thm 47(1))
          - 2.5
        - - Finite-depth spatial cylinder transducer eliminates infinite multi-run
