      name: Finite & Boundary-Onset Domain Exhaustion (74.25M necklaces Pi<=30 at
        t_0=Pi-1; 249,500 pairs (t_0,Pi)<(500,500))
      weight: 15
      tier: Tier B (Verified)
      scores:
        claude-fable-5-1: 80.0
        gpt-5.6-sol: 100.0
        gemini-4-argon: 90.0
    - id: P1.3
      name: All-t_0, All-Pi Infinite Word Families (Pi=1; 1^a 0^b for a>=8; (1^7 0)^r;
        (1^8 0^2)^r; 2r/4r-run gate-lock words)
      weight: 20
      tier: Tier A (Restricted Classes)
      scores:
        claude-fable-5-1: 40.0
        gpt-5.6-sol: 75.0
        gemini-4-argon: 58.0
