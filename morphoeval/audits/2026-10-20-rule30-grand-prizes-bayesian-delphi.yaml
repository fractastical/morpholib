          - 1.5
        - - Unconditional diagonal period-doubling lim P_k = infty & 9-row horizon
            sandwich (Thms 4, 46)
          - 1.5
        evidence_against:
        - - Depth-1 Right Cylinder has positive topological entropy (~0.32 bits/step);
