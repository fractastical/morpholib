    claim_boundary:
      reported_in_source:
      - 'Schnakenberg (1979): the tri-molecular cubic autocatalytic scheme has a unique positive steady state (a+b,
        b/(a+b)^2), a Hopf curve b - a = (a+b)^3 and, beyond it, a Poincaré–Bendixson limit cycle'
      - 'Turing (1952): differential diffusion destabilizes a stable reaction equilibrium in a finite wavenumber
        band; on a sphere the unstable modes are spherical harmonics'
      - 'Martiel & Goldbeter (1987): a 3-variable receptor-desensitization model (rho_T, beta, gamma) with extracellular
        PDE rate k_e produces autonomous cAMP oscillations and relay'
      - 'Gerisch & Hess (1974): suspended D. discoideum cells show spontaneous cAMP-controlled oscillations with
        a period of several minutes (~5-10 min)'
      - 'Crampin, Gaffney & Maini (1999): on uniformly growing domains reaction-diffusion patterns undergo frequency-doubling
        with a dilution term -(L''/L) u'
      reconstructed_in_script:
      - Exact equilibrium, Jacobian, Hopf curve, d_c(a,b), planar dispersion sigma(k^2) and its Turing band (q_-,
        q_+); RK4 limit-cycle ODE; 2D pseudo-spectral RD solver with 5 regimes and a 7-point d sweep; SHA-256-locked
        specimen segmentation (Pass 2)
      - Hemispherical-mound RD solver with exact Laplace–Beltrami propagators, spherical-harmonic (Legendre) power
        spectrum, mound-radius sweep against l*(R) and hexagonal packing, critical mound radius R_min; elongating-stalk
        solver with ring-count kymograph (Pass 3 R1)
      - First-order and Michaelis–Menten PDE sinks with closed-form equilibria, analytical + numerical Hopf thresholds,
        Martiel–Goldbeter relay integration and k_e sweep, dimensionless pulse-shape comparison (Pass 3 R2)
      - Five Lean 4 theorems (Laws 1-5) mirrored by integer checks in --self-test
      transfer_boundary:
      - Mound radius R, stalk radius 0.08 and lengths 1->4 are in the dimensionless planar domain units (L = 6);
        they are NOT calibrated to the specimen's 32.9 px sorus diameter or stalk length, so the curved-geometry
        results are predictions of the model's own scaling, not specimen measurements
      - The Martiel–Goldbeter parameter set is the widely used Table I set; with it this implementation gives a
        10.68 min period at k_e = 5.4 min^-1, above the ~7 min (5-10 min) Gerisch & Hess anchor; the discrepancy
        is reported, not tuned away
      - Schnakenberg u is identified with extracellular cAMP for the PDE sink; the 2-species model has no receptor
        variable, so the pulse-shape comparison with Martiel–Goldbeter is dimensionless (duty cycle, fold change,
        waveform r = 0.78), not a time-scale match
      does_not_claim:
      - A volumetric 3D solver of the culminant, tip-growth (non-uniform) stalk elongation, chemotactic cell movement,
        or that Turing rings on a stalk are an observed Dictyostelium phenotype; a digitized comparison with Martiel
        & Goldbeter's own time-series figures; spatial (Turing) analysis of the PDE-extended model
