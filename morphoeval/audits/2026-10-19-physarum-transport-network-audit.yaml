simulations:
  - id: tero-physarum-transport-network
    name: "Tero et al. (2010) Science & Tero, Kobayashi & Nakagaki (2007) J. Theor. Biol. adaptive Physarum tube conductivity network, shortest-path phase transition, Murray's cube law, and Tokyo rail Pareto trade-off"
    organism: "Physarum polycephalum (acellular plasmodial slime mold)"
    script: 2010-tero-physarum-transport-network.py
    output: docs/media/physarum_transport_network_comparison.png
    extra_outputs:
      - docs/media/physarum_transport_network_growth.gif
    status: evaluated
    source_refs:
      - tero2010
      - tero2007
      - nakagaki2000
      - murray1926
    summary: >-
      Pass 1 (v1) baseline evaluation of `2010-tero-physarum-transport-network.py`
      (weighted score: 53.6/100). The Pass 1 baseline integrates only a 2-edge parallel
      ODE at gamma=0.6 and gamma=1.8 without solving the multi-node Kirchhoff linear
      system sum_j (D_ij/L_ij)*(p_i - p_j) = S_i across stochastic multi-food-source
      pairs, omits the Tero et al. (2010) Fig. 3/4 phase transition sweep across
      gamma in [0.6, 2.4] measuring normalized Total Length (TL_MST), Transport
      Efficiency (MD_MST), and Fault Tolerance (FT), omits Murray's cube law
      (r_0^3 = r_1^3 + r_2^3) verification at gamma = 4/3, and does not segment the
      vendored Physarum polycephalum plasmodial specimen photograph.
    scores:
      model-fidelity:
        value: 55
        rationale: >-
          Integrates a 2-path parallel ODE at gamma=0.6 and gamma=1.8 (L25-64), but omits
          the full graph Laplacian Kirchhoff pressure solver across multi-node food sources,
          Tero et al. (2010) Fig. 3/4 TL_MST / MD_MST / FT Pareto trade-off curves, and
          Murray's cube law verification at gamma = 4/3.
        evidence:
          - {file: 2010-tero-physarum-transport-network.py, lines: [25, 64], note: "2-edge parallel ODE without multi-node Kirchhoff Laplacian solver or multi-source switching", supports: true}
      specimen-match:
        value: 45
        rationale: >-
          Vendors `datasets/physarum_transport_network/physarum_polycephalum_specimen.jpg`
          on disk, but Pass 1 does not load, segment, skeletonize, or measure vein-width
          hierarchy, enclosed anastomosing loops, or Y-junction Murray cubic radius ratios.
        evidence:
          - {file: 2010-tero-physarum-transport-network.py, lines: [91, 134], note: "Renders 2-panel time-series plot without specimen segmentation", supports: false}
      parameter-expressivity:
        value: 50
        rationale: >-
          Evaluates only two gamma values (0.6 and 1.8) in a 2-edge toy circuit without
          sweeping gamma across [0.6, 2.4], testing Murray's exponent gamma = 4/3, or
          exposing CLI parameter overrides.
        evidence:
          - {file: 2010-tero-physarum-transport-network.py, lines: [67, 88], note: "Only two gamma points evaluated without full phase transition sweep", supports: false}
      morphometric-validation:
        value: 52
        rationale: >-
          Exposes only 2 scalar measurements in `measure_morphoeval()` without TL_MST,
          MD_MST, Fault Tolerance FT, Pearson correlation p-values, Murray cubic ratios,
          or specimen CV morphometrics.
        evidence:
          - {file: 2010-tero-physarum-transport-network.py, lines: [67, 88], note: "Only 2 scalar metrics without dispersion or statistical tests", supports: false}
      source-traceability:
        value: 68
        rationale: >-
          Vendors `paper_citations.bib` and `physarum_transport_network_reference.json`
          with verified DOIs, but Pass 1 does not load or SHA-256-verify the dataset at
          runtime.
        evidence:
          - {file: datasets/physarum_transport_network/physarum_transport_network_reference.json, lines: [1, 165], note: "Reference JSON present on disk but not verified at runtime in Pass 1", supports: true}
      code-traceability:
        value: 56
        rationale: >-
          Module docstring cites Tero et al. (2010) and Tero et al. (2007), but lacks
          explicit equation-to-code and Lean 4 theorem mappings.
        evidence:
          - {file: 2010-tero-physarum-transport-network.py, lines: [1, 10], note: "Minimal docstring without Lean 4 theorem loci", supports: false}
      repro-package:
        value: 54
        rationale: >-
          Includes a minimal 2-assertion `--self-test` flag, but lacks SHA-256 dataset
          integrity checks, multi-source Kirchhoff conservation checks, and negative
          ablation controls.
        evidence:
          - {file: 2010-tero-physarum-transport-network.py, lines: [137, 143], note: "Minimal 2-line self-test without SHA-256 or graph-level invariant checks", supports: false}
    remediation:
      - "Implement the full graph Laplacian Kirchhoff pressure solver sum_j (D_ij/L_ij)*(p_i - p_j) = S_i coupled to adaptive tube conductivity ODEs across a 2D multi-node Kanto/Physarum food-source network with stochastic source-sink pair switching."
      - "Sweep gamma across [0.6, 2.4] to compute normalized Total Length (TL_MST), Transport Efficiency (MD_MST), and Fault Tolerance (FT), reproducing Tero et al. (2010) Science Fig. 3/4 and Tokyo rail Pareto optimality at gamma = 1.8."
      - "Verify Murray's cube law (r_0^3 = r_1^3 + r_2^3) at gamma = 4/3 on Y-junction bifurcations and verify two-path shortest-path selection across gamma < 1, gamma = 1, and gamma > 1."
      - "Segment and skeletonize the vendored Physarum polycephalum specimen photograph (`physarum_polycephalum_specimen.jpg`) to extract the vein-width hierarchy, closed anastomosing loop count (Betti-1), and empirical Y-junction Murray cubic radius ratio, backed by SHA-256 integrity checks and a comprehensive `--self-test` suite."
