    claim_boundary:
      reported_in_source:
      - Turing (1952) finite-k instability and Murray (1981) coat-pattern wavelength selection.
      - Schnakenberg (1979) activator-substrate kinetics and the Swift-Hohenberg (1977) amplitude equation as the
        normal form of a Turing bifurcation (Cross & Hohenberg 1993).
      - Sick et al. (2006) mammalian follicle-spacing reaction-diffusion, the anatomical scale neighbour of this
        126.7 µm slot.
      reconstructed_in_script:
      - Diffusivities scaled so lambda_c = 126.7 µm. sigma(k_c) = 0.3006 > 0 and sigma(0) = -0.3215 < 0.
      - Charge sweep m = 1, 2, 3 and seeds 3141-3144 all fall in radial bin k = 0.9856 (lambda = 128.55 µm). The
        bin width, not a continuous estimator, sets the ensemble CV to 0.
      - 'Substrate sweep at fixed D: lambda_c(0.20) = 176.95 µm and the homogeneous state restabilizes for b >=
        2.5.'
      - 'Gallery segmentation: 110 px = 100 µm, dominant wavelength 78.18 µm, orientation KS 0.077 against the spiral,
        radial-spectrum cosine 0.987.'
      transfer_boundary:
      - 126.7 µm and age 0 Ma are the slot assignment for the single Holocene Cavia node. Predecessor tier 1267
        µm holds exactly 10 s0 waves; successor tier 12.67 µm fits 10 times inside one s0 wave.
      - 78.18 µm on the gallery bar is a property of that image, not a correction to the assigned wavelength.
      does_not_claim:
      - That Pearson r = 1 is an independent time-stepper confirmation. It is the match between the quadratic formula
        and numpy.linalg.eigvals (RMSE = 0 at roundoff).
      - Sub-bin seed robustness. All four seeds share one radial bin.
      - A published guinea-pig histology plate, a signed nanopublication, or a machine-checked Lean build.
