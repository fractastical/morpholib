simulations:
  - id: coccolith-emiliania-calcite-rosette
    name: "Young et al. (1992) & Jaya et al. (2016) Emiliania huxleyi V/R calcite crystal coccolith rosette shield & interlocking spherical coccosphere mechanics"
    organism: "Emiliania huxleyi (Morphotypes A, B, B/C, C, R, O) & Gephyrocapsa / Calcidiscus / Coccolithus (Haptophyta)"
    script: models/2022-coccolith-emiliania-calcite-rosette.py
    output: docs/media/emiliania_calcite_rosette_comparison.png
    extra_outputs:
      - docs/media/emiliania_calcite_rosette_growth.gif
      - docs/media/emiliania_calcite_rosette_contact_indentation.gif
    domain: morphogenesis
    status: evaluated
    source_refs: [young1992, didymus1993, jaya2016, walker2018, reissner1946]
    supersedes_audit_id: 2026-10-19-emiliania-calcite-rosette-audit-v2
    claim_boundary:
      reported_in_source:
        - "Young et al. (1992): coccolith shield elements nucleate as alternating V- and R-units with mutually orthogonal calcite c-axis orientations on an organic baseplate ring; morphology follows from crystallographic control of {10-14} growth"
        - "Didymus et al. (1993): stage-specific E. huxleyi coccolith growth from proto-coccolith ring to T-shaped hammer elements of the distal shield"
        - "Jaya et al. (2016): E. huxleyi coccospheres confer mechanical protection; under nanoindentation individual coccoliths slide relative to each other and cracks are arrested at coccolith boundaries"
        - "Walker et al. (2018): the requirement for calcification differs between coccolithophore species; reduced calcification under acidification / CAP perturbation"
        - "Reissner (1946): point-load stiffness of a thin shallow spherical shell k = 4 E h^2 / (R sqrt(3 (1 - nu^2)))"
      reconstructed_in_script:
        - "3D V/R c-axis ring with exact orthogonality, T-shaped hammer-element rosette across morphotypes A/B/C/R and an acidification / CAP ablation control, 12-taxon L_d(N_seg) scaling table, spherical coccosphere Voronoi / Euler packing with a prescribed 2.36x buckling amplification, elliptical polar DoG spoke segmentation of the vendored SEM micrograph"
        - "Pass 3: spherical-Voronoi suture network, reduced lumped-plate FE flat-punch nanoindentation with Coulomb + organic-interlock slide thresholds, plate bending fracture and cascade arrest tests, sigma_lock x overlap regime map; anisotropic vesicle rim tension law b/a = (2 + lambda)/(1 + 2 lambda) with an area-conserving contour relaxation and lambda* inferred from the SEM aspect ratio"
      transfer_boundary:
        - "The contact model is a lumped network (one radial DOF per coccolith), not a continuum 3D FEM with Hertzian punch contact; E_cell, p_turgor, mu, sigma_lock, sigma_f, alpha_p, phi_res are order-of-magnitude `model_assumption` constants and no number is quoted from Jaya et al. (2016); the v2 2.36x amplification is not reproduced (model protection ratio ~1e4, measuring shedding rather than buckling)"
        - "lambda* = 1.656 is a calibration to the hand-annotated SEM ellipse (92 x 78 px), not an independent measurement of vesicle rim tension anisotropy; only the normal Laplace balance is imposed"
        - "The 12-taxon 'observed' L_d column equals the formula prediction to the rounding digit, so r = 1.0000 is a self-consistency check, not a validation against measured taxa"
      does_not_claim:
        - "Continuum fracture mechanics of calcite plates, measured interlock shear strength, independent vesicle rim tension data, detection of the SEM ellipse from pixels (centre, semi-axes and tilt are annotations), or verification of the Jaya 2016 / Walker 2018 venue-DOI pairs and the Reissner 1946 DOI (offline round)"
    summary: >-
      Pass 3 closes both v2 remediation items with honest reduced models: a Voronoi suture-network
      nanoindentation contact model that reproduces the Jaya et al. (2016) qualitative sequence (suture sliding
      first, apex fracture arrested at the neighbours, punch-through exposure later) and a tension-anisotropy
      law for the Golgi vesicle rim that yields the SEM baseplate aspect ratio at an inferred lambda*, both
      with provenance-tagged constants, two new Lean theorems, seven new measurements and four new self-test
      checks. The re-read, however, finds that several v2 strengths were over-credited: the 12-taxon scaling
      validation is circular, the specimen aspect ratio and distal length are transcriptions of hand annotations
      (only the spoke count is detected), the buckling amplification and T-head slope are prescribed or tuned,
      the vendored governing equation (tanh) disagrees with the code (linear), the new JSON is not SHA-pinned,
      the regime map ignores `--n-cocc`, and two venue/DOI pairs are inconsistent. Overall 79.3 (down from 91.8).
    scores:
      model-fidelity:
        value: 80
        rationale: >-
          The V/R ring, T-head rosette and Euler packing are implemented as before, and the two Pass 3
          mechanisms are mechanically coherent: the contact model couples a Reissner shell stiffness, a
          protoplast foundation and lap-joint suture springs on the actual spherical Voronoi edges, resolves
          slide / fracture / arrest / exposure cascades, and reproduces the Jaya et al. (2016) qualitative order
          (sliding at 13.2 uN before apex fracture at 55.1 uN = sigma_f h^2 / alpha_p, arrested with
          sigma_neigh/sigma_f = 0.28); the vesicle law b/a = (2 + lambda)/(1 + 2 lambda) is the exact
          support-function solution of tau(psi) kappa(psi) = p and the relaxation reproduces it to 0.0034 over
          lambda in [1, 2.5]. Deductions: the coccosphere buckling load 0.042 E h^2 (1 + 0.012 (N - 12)) and the
          2.36x amplification remain prescribed, unsourced constants that the new contact model does not
          reproduce (-6); the T-head slope 0.225 is tuned so that Omega = 4.2 gives the JSON's 1.72 and is linear
          whereas the vendored governing equation uses tanh(max(Omega - 1, 0)) (-4); the contact model is lumped
          (one radial DOF per plate, no Hertzian contact, no plate bending field) with all seven constants
          `model_assumption` (-4); the vesicle model imposes only the normal Laplace balance, with tangential
          equilibrium assumed to be supplied by anchored cytoskeleton, and lambda* is a fit (-3); the 44.61 deg
          rhombohedral angle is stated but unused and the 22.5 / 1.05 volume ratios are hard-coded (-3).
        evidence:
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [529, 575], note: "build_coccosphere_voronoi_tiling: scipy SphericalVoronoi on Fibonacci generators, tile areas, 42 great-circle suture edges = 3(F-2), apex tile", supports: true}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [578, 806], note: "evaluate_coccosphere_nanoindentation_contact: lumped-plate FE (K = diag(k_cell + phi_lock k_Reissner A_i/A_tot) + Laplacian(k_ij)), Coulomb + sigma_lock slide threshold, alpha_p P/h^2 fracture, arrest and exposure tests, cascade-resolved event list", supports: true}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [860, 989], note: "Vesicle rim: exact law b/a = (2+lambda)/(1+2lambda), area-conserving semi-implicit contour relaxation, lambda* inferred from SEM b/a and sweep lambda in [1, 2.5]", supports: true}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [470, 478], note: "Prescribed 0.042 E h^2 (1 + 0.012 (N-12)) buckling load and interlock_amplification = 2.36 with no source; not reproduced by the contact model", supports: false}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [264, 264], note: "t_head_ratio = 1 + 0.225 c_CAP max(Omega-1, 0): linear slope tuned to give 1.72 at Omega = 4.2; JSON governing equation (line 75) uses tanh", supports: false}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [200, 202], note: "Rhombohedral {10-14} angle 44.61 deg stated but unused; R/V volume ratios 22.5 / 1.05 hard-coded without source", supports: false}
          - {file: morphoeval/lean/loops/Loop_080_emiliania_calcite_rosette.lean, lines: [218, 314], note: "Pass 3 theorems: suture_capacity_ratio_selects_sliding_vs_fracture (zero capacity at d_ov = 0, monotone in d_ov, Pi-selector) and vesicle_rim_tension_anisotropy_sets_baseplate_aspect (circle at lambda = 1, b < a for lambda > 1, strictly decreasing, b/a > 1/2, 0.847 < b/a(1.656) < 0.848); lean exits 0, 0 sorry", supports: true}
      specimen-match:
        value: 72
        rationale: >-
          The 3x3 figure shows the SEM overlay (Panel F) and the new Panel I places the relaxed vesicle rim
          over the SEM ellipse and the isotropic circle; the relaxed contour deviates from the best-fit ellipse
          by 0.20 % of a, below the 1.09 % one-pixel precision of the 92 x 78 px annotation, and the contact GIF
          renders the indentation cascade on the Voronoi sphere. Deductions: the ellipse centre, semi-axes, tilt
          and the pixel calibration are hand-annotated in the reference JSON and read by the segmentation
          function rather than detected, so the specimen b/a = 0.8478, e = 0.5303 and L_d = 3.50 um are
          transcriptions, and the Pass 3 lambda* is calibrated to the same annotation — only the N_seg = 32 DoG
          spoke count is measured from pixels (-14); the coccosphere panels compare with no micrograph of an
          indented or fractured coccosphere, so the slide-then-arrest sequence is matched to Jaya et al. (2016)
          only qualitatively (-8); the comparison PNG is gitignored (`*.png`) so the figure judged here is the
          regenerated one, not a committed artifact (-3); the growth GIF is unchanged from Pass 2 (-3).
        evidence:
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [994, 1078], note: "segment_emiliania_coccolith_specimen: ellipse centre / semi-axes (L1013) / tilt / calibration come from JSON annotations; only the angular DoG spoke peaks are detected", supports: false}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [956, 989], note: "evaluate_vesicle_rim_tension_eccentricity: lambda* inferred from reference_b_over_a (the annotation), relaxed b/a = 0.8461 vs 0.8478, ellipse RMS residual 0.20 % of a vs 1.09 % pixel precision", supports: true}
          - {file: docs/media/emiliania_calcite_rosette_comparison.png, lines: [0, 0], note: "3x3 synthesis: Panels A-F as Pass 2 (SEM overlay in F), G contact F-u curves and events, H sigma_lock x overlap regime map, I relaxed rim vs SEM ellipse vs isotropic circle with b/a(lambda) inset", supports: true}
          - {file: docs/media/emiliania_calcite_rosette_contact_indentation.gif, lines: [0, 0], note: "11-frame indentation cascade on the Voronoi coccosphere (interlocked vs truncated T-heads)", supports: true}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [1476, 1539], note: "render_growth_gif unchanged from Pass 2; no Pass 3 content in the growth GIF", supports: false}
          - {file: docs/media/emiliania_calcite_rosette_growth.gif, lines: [0, 0], note: "2-panel rosette growth GIF regenerated by the v3 script; content identical in design to Pass 2 (no vesicle / contact frames)", supports: false}
      parameter-expressivity:
        value: 84
        rationale: >-
          Pass 3 adds genuine sweeps whose outcomes change qualitatively: the sigma_lock in {5..400 MPa} x
          t_head_ratio in [1, 2] regime map moves through shedding -> interlock sliding -> sliding-then-arrested
          fracture, with fracture-first only at sigma_lock >= 200 MPa and crack propagation only at 400 MPa and
          ratio 2.0; the F_expose vs overlap sweep is monotone; the vesicle law is swept over lambda in [1, 2.5]
          and inverted on the 12-taxon b/a column (lambda 1.08-1.69). The Pass 2 morphotype / acidification
          regimes, Omega and N_cocc sweeps and the seven CLI overrides remain. Deductions: evaluate_contact_regime_map
          always builds the N_cocc = 16 tiling and ignores `--n-cocc` (only Panel G and the measurements honour
          the override) (-6); sigma_lock, E_cell, p_turgor, lambda and the load ramp have no CLI exposure (-5);
          the t_head_ratio axis of the regime map is entered directly rather than driven through Omega / c_CAP,
          so the CAP-acidification link is not swept end to end (-3); Panel D's 2.36x N_cocc sweep still reports
          a prescribed constant (-2).
        evidence:
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [809, 855], note: "evaluate_contact_regime_map: 7 x 11 sigma_lock x t_head_ratio regime codes and F_expose; uses build_coccosphere_voronoi_tiling() with default N_cocc = 16 regardless of --n-cocc", supports: true}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [1917, 1924], note: "CLI: --self-test, --skip-gif, --n-seg, --w0, --l-spoke, --omega, --n-cocc, --seed; no sigma_lock / lambda / E_cell overrides", supports: true}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [347, 372], note: "Five morphotype / acidification regimes retained from Pass 2", supports: true}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [818, 818], note: "til = build_coccosphere_voronoi_tiling() — regime map not wired to the n_cocc override", supports: false}
      morphometric-validation:
        value: 74
        rationale: >-
          measure_morphoeval() now returns 16 measurements with reference values, including seven new ones:
          Voronoi edge count 42 vs 3(F-2), arrest ratio 0.28 (< 1), capacity ratio Pi = 0.286 (< 1, sliding
          first), relaxed b/a 0.8461 vs 0.8478, lambda* 1.6562 vs the naive (a/b)^3 estimate 1.6411, ellipse RMS
          residual 0.198 % vs 1.087 % pixel precision, and the protection ratio ~1.04e4 vs 2.36 reported as a
          negative control. Deductions: the headline 12-taxon correlation r = 1.0000 / RMSE 0.004 um compares an
          "observed" column that equals the formula to the rounding digit — a circular validation that v2 credited
          (-10); the arrest and capacity references (1.0) are decision thresholds and the 2.36 reference is the
          unsourced v2 constant, so three of the seven new measurements have no literature anchor (-6); the
          specimen b/a and L_d measurements are transcriptions of annotations, and the vesicle b/a comparison is
          against the same annotation (-6); no measured nanoindentation force, stiffness or fracture load from
          Jaya et al. (2016) is compared because the paper could not be re-read offline (-4).
        evidence:
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [1613, 1795], note: "measure_morphoeval: 16 reference-anchored measurements (7 new Pass 3 entries at L1630-1701)", supports: true}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [1661, 1669], note: "Protection-ratio measurement anchored to the unsourced v2 2.36 constant; explicitly reported as not reproduced (~1e4, dominated by assumed E_cell)", supports: false}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [374, 426], note: "evaluate_cross_taxa_scaling: r = 1.0000 against l_d_obs_um values that equal l_d_pred_um to the rounding digit for all 12 taxa (circular)", supports: false}
          - {file: datasets/emiliania_calcite_rosette/emiliania_calcite_rosette_reference.json, lines: [96, 107], note: "cross_taxa_coccolithophore_table: l_d_obs_um = round(l_d_pred_um, 2) for every row", supports: false}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [1641, 1659], note: "Arrest ratio and Pi measurements: reference_value 1.0 is a threshold, stated as such in reference_source", supports: true}
      source-traceability:
        value: 82
        rationale: >-
          The dataset folder vendors the SHA-256-pinned specimen, reference JSON, scout manifest and bib verified
          fail-closed at runtime; the new `coccosphere_contact_vesicle_tension_reference.json` tags every constant
          `classical_formula` or `model_assumption` and states that no value is quoted from Jaya et al. (2016);
          `pass3_citations.bib` adds Reissner (1946) and the dataset README documents both Pass 3 extensions and
          their limits. Deductions: the new JSON is not SHA-256 pinned in EXPECTED_SHA256 / verify_dataset_integrity,
          so Pass 3 constants are not integrity-checked (-5); Jaya et al. (2016) is given the venue "Nat. Commun. /
          J. Struct. Biol." and Walker et al. (2018) "Nat. Commun. / New Phytol." with a Nat. Commun. DOI although
          the title is a New Phytologist paper — both pairs are internally inconsistent and could not be resolved
          offline (-6); the seed-paper DOI differs between the campaign record (10.1038/356145a0) and the script /
          bib (10.1038/356516a0, consistent with pp. 516-518) — unresolved offline (-3); the Reissner 1946 DOI is
          unverified (-2); the 12-taxon table carries no per-row citation for N_seg, w_0 or L_d (-2).
        evidence:
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [120, 146], note: "verify_dataset_integrity: SHA-256 of specimen JPG, scout manifest and paper_citations.bib checked against the reference JSON; the Pass 3 JSON is not in the pinned set", supports: false}
          - {file: datasets/emiliania_calcite_rosette/coccosphere_contact_vesicle_tension_reference.json, lines: [32, 60], note: "Contact-model parameters with per-constant provenance tags (all model_assumption) and the statement that nothing is quoted from Jaya et al. 2016", supports: true}
          - {file: datasets/emiliania_calcite_rosette/README.md, lines: [12, 17], note: "Pass 3 additions documented with provenance caveats and the lambda* = 1.656 inference stated as not independently measured", supports: true}
          - {file: datasets/emiliania_calcite_rosette/pass3_citations.bib, lines: [1, 14], note: "Reissner (1946) entry; DOI not verified offline", supports: true}
          - {file: models/2022-coccolith-emiliania-calcite-rosette.py, lines: [31, 46], note: "Header citations: Jaya 2016 venue 'Nat. Commun. / J. Struct. Biol.', Walker 2018 'Nat. Commun. / New Phytol.' with DOI 10.1038/s41467-018-04168-9 — inconsistent venue/DOI pairs", supports: false}
      code-traceability:
        value: 85
        rationale: >-
          The module header lists the Pass 3 sections and their limits, the contact-model docstring maps every
          stiffness and threshold to its formula (k_cell, k_mem via Reissner 1946, k_ij lap joint, N_ij hoop
          force, alpha_p P/h^2 fracture), the vesicle functions cite the support-function derivation, the Panel E
          title now says "prescribed", and the new Lean theorems are named in the measurement sources. Deductions:
          the vendored JSON governing equation for the T-head uses tanh while the code is linear in
          max(Omega - 1, 0) — a formula mismatch between the stated source and the implementation (-5); the
          shaft-width factor 0.62 w_0, the morphotype-R factors 1.28 / 1.45, the 0.28 angular-pitch factor, the
