# MorphoEval audit — Young et al. (1992) Nature & Jaya et al. (2016) Emiliania huxleyi V/R Calcite Coccolith Rosette & Interlocking Coccosphere, 2026-10-19 (v3)
#
# Pass 3 re-score of `models/2022-coccolith-emiliania-calcite-rosette.py` (v3, 1954 lines) after the remediation
# loop `morphoeval/runs/2026-10-19-emiliania-calcite-rosette-loop-pass3`, superseding
# `2026-10-19-emiliania-calcite-rosette-audit-v2` (consensus 91.8).
#   - Primary assessor: Claude Fable 5.1 (Phase B audit of the Phase A remediation; same working tree, commit 9987db7d)
#   - Second assessor: Gemini 4 Argon (Phase A builder, rubric cross-check of the handoff evidence)
#
# What Pass 3 changed (both open v2 remediation items):
#   1. Coccosphere Voronoi tiling -> nanoindentation contact: `build_coccosphere_voronoi_tiling` (scipy
#      SphericalVoronoi, 42 suture edges = 3(F-2)), `evaluate_coccosphere_nanoindentation_contact` (reduced
#      lumped-plate FE: one radial DOF per coccolith, Reissner shell + protoplast foundation + lap-joint suture
#      shear springs, quasi-static load ramp 10 pN -> 400 uN with cascade-resolved SLIDE / FRACTURE / ARREST /
#      EXPOSURE events) and `evaluate_contact_regime_map` (sigma_lock x t_head_ratio regime map). Interlocked
#      Morph A: slide 13.2 uN -> apex fracture 55.1 uN -> arrested (sigma_neigh/sigma_f = 0.28) -> exposure 68.7 uN;
#      truncated T-heads -> shedding at 6.6e-3 uN. Panels G/H and a new contact GIF.
#   2. Golgi vesicle rim tension -> baseplate eccentricity: `baseplate_aspect_from_tension_anisotropy` (exact
#      support-function law b/a = (2 + lambda)/(1 + 2 lambda)), `relax_vesicle_rim_contour` (area-conserving
#      semi-implicit relaxation, 160 nodes) and `evaluate_vesicle_rim_tension_eccentricity` (lambda* = 1.6562
#      inferred from the SEM b/a = 0.8478; relaxed b/a = 0.8461, ellipse RMS residual 0.20 % of a). Panel I.
#   3. Lean: 2 new theorems (6 total, 0 sorry); 7 new measurements (16 total); self-test 8 -> 12 checks;
#      `coccosphere_contact_vesicle_tension_reference.json` with per-constant provenance tags; `pass3_citations.bib`.
#
# Why the overall score goes DOWN from 91.8: this round was told to find the next layer of defects, and the
# re-read against the current file exposes problems the v2 audit credited as strengths: the 12-taxon
# "observed" distal lengths equal the formula to the rounding digit (circular, r = 1.0000), the SEM ellipse
# semi-axes / centre / tilt are hand-annotated in the JSON rather than detected (so b/a, L_d and the new
# lambda* all rest on one annotation), the 2.36x / 0.042 buckling constants and the 0.225 T-head slope are
# prescribed or tuned, the vendored JSON governing equation (tanh) does not match the code (linear), and two
# venue / DOI pairs are internally inconsistent. The Pass 3 mechanisms themselves are honest reduced models
# whose constants are all tagged `model_assumption` and whose limits are stated in the code, README and
# figure titles. Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale.
# Line numbers refer to the files in the working tree at commit 9987db7d.

