      - Same calibrated Gierer–Meinhardt integration as pass 1, plus the scale-neighbour annotation, a second segmented
        Bos taurus voucher, and activator-only growth frames.
      - Pearson r = 0.99595, RMSE = 0.104 µm, KS = 0.414, two foreground fractions that are not equal to each other
        or to the simulated occupancy.
      transfer_boundary:
      - Neither photograph resolves 3.137 µm. The wavelength is the calibrated k_star, not a ruler on the image.
      - No predecessor chronospecies is in the slot. The age offset along the series is zero.
      does_not_claim:
