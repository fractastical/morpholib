simulations:
  - id: liang-chiral-seed-pod-opening
    name: "Armon et al. (2011) Science / Efrati et al. (2009) JMPS Incompatible Shell Elasticity & Chiral Seed Pod Opening"
    organism: "Bauhinia variegata (Orchid tree chiral seed pod valves) & Erythrina corallodendron"
    script: 2007-liang-chiral-seed-pod-opening.py
    output: docs/media/chiral_seed_pod_opening_comparison.png
    extra_outputs:
      - docs/media/chiral_seed_pod_opening_growth.gif
    status: evaluated
    source_refs:
      - armon2011
      - efrati2009
      - armon2014
      - forterre2005
    summary: >-
      Pass 1 (v1) baseline evaluation of `2007-liang-chiral-seed-pod-opening.py`
      (overall weighted score: 55.8/100). The baseline evaluates the analytical Föppl-von
      Kármán critical width w_tilde_c and renders a kinematic helical surface, but lacks
      variational L-BFGS-B minimization of the non-Euclidean incompatible plate energy
      E = E_stretch + E_bend across w_tilde in [0.5, 10], omits the cutting-angle chirality
      sweep theta in [0 deg, 90 deg] (including the theta = 0 deg achiral circular ring
      negative control), omits the multi-specimen comparison, and does not segment the
      vendored Bauhinia variegata specimen image.
    scores:
      model-fidelity:
        value: 57
        rationale: >-
          Evaluates analytical critical width w_tilde_c and mean curvature H(w_tilde)
          (`critical_fvk_width`, `analytical_mean_curvature`, L29-39), but does not minimize
          the non-Euclidean incompatible shell energy functional E_stretch + E_bend via
          variational relaxation or verify Gauss incompatibility det(b_0) = -kappa_0^2 < 0.
        evidence:
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [29, 77], note: "Closed-form kinematic surface without non-Euclidean energy minimization", supports: true}
      specimen-match:
        value: 45
        rationale: >-
          Does not load or segment the vendored Bauhinia variegata specimen photograph
          `datasets/chiral_seed_pod_opening/bauhinia_chiral_seed_pod_specimen.jpg` and
          renders only a 2-panel baseline plot.
        evidence:
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [80, 104], note: "2-panel baseline figure without specimen image segmentation", supports: false}
      parameter-expressivity:
        value: 51
        rationale: >-
          Evaluates only a single default parameter tuple without sweeping dimensionless
          width w_tilde in [0.5, 10], cutting angle theta in [0 deg, 90 deg] (including
          theta = 0 deg achiral ring control), or CLI parameter overrides.
        evidence:
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [42, 55], note: "Fixed default parameter tuple without theta or species sweeps", supports: false}
      morphometric-validation:
        value: 54
        rationale: >-
          `measure_morphoeval()` (L124-147) returns only 2 basic analytical checks without
          pitch P(w_tilde) and radius R(w_tilde) transition correlations, cutting-angle
          chirality validation, or specimen image segmentation metrics.
        evidence:
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [124, 147], note: "Only 2 baseline analytical measurements returned", supports: false}
      source-traceability:
        value: 68
        rationale: >-
          Vendors `datasets/chiral_seed_pod_opening/` with 4 DOIs in `paper_citations.bib`,
          `scout_manifest.json`, reference JSON, and Bauhinia variegata specimen JPEG, but
          the baseline script does not enforce runtime SHA-256 verification.
        evidence:
          - {file: datasets/chiral_seed_pod_opening/paper_citations.bib, lines: [1, 39], note: "4 primary DOIs vendored", supports: true}
      code-traceability:
        value: 60
        rationale: >-
          Cites Armon et al. (2011) Science and Efrati et al. (2009) JMPS in module docstring,
          but lacks function-level equation mappings to the 3 Lean 4 theorems in
          `Loop_065_chiral_seed_pod_opening.lean`.
        evidence:
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [1, 13], note: "Brief baseline header without Lean 4 theorem mappings", supports: true}
      repro-package:
        value: 62
        rationale: >-
          Provides `--self-test` (`L150-155`), but checks only two analytical values without
          SHA-256 dataset verification, negative controls, or bitwise solver determinism checks.
        evidence:
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [150, 155], note: "Minimal 2-assertion baseline self_test()", supports: true}
    remediation:
      - "Implement a variational L-BFGS-B energy minimizer for the non-Euclidean incompatible plate energy functional E[H, D, phi] = E_stretch + E_bend across dimensionless width w_tilde in [0.5, 10], reproducing both the narrow Pure-Twist Helicoid regime (w_tilde <= w_tilde_c, H = 0, R = 0) and the wide Cylindrical Helical Ribbon regime (w_tilde > w_tilde_c, H -> (1-nu)*kappa_0/2)."
      - "Implement the cutting-angle chirality sweep across theta in [0 deg, 90 deg], verifying that theta = 45 deg maximizes helical twist tau = D*sin(2*theta) while theta = 0 deg and theta = 90 deg serve as achiral circular ring controls (tau = 0, pitch P = 0), plus zero-shrinkage (kappa_0 = 0) flat pod control."
      - "Implement computer-vision segmentation of `datasets/chiral_seed_pod_opening/bauhinia_chiral_seed_pod_specimen.jpg` (*Bauhinia variegata* MHNT.BOT.2011.3.22), isolating the dehisced twisted valves, intact pre-dehisced flat pod, and helical twist crossings/lobes."
      - "Enforce runtime SHA-256 verification of all 4 dataset files, expand `measure_morphoeval()` to 9 quantitative reference-anchored metrics, and upgrade the figure to a 6-panel synthesis layout."
