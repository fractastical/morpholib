# MorphoEval audit — Glimm et al. (2014) Dev. Biol. & Ho et al. (2019) PLOS Biol. Avian Feather Bud Hexagonal Array & Traveling Competence Wave, 2026-10-19 (v2)
#
# Pass 2 dual-rubric assessment of `2018-glimm-avian-feather-bud-hexagonal.py` (v2, 650 lines)
# after completing the 12-step closed remediation loop (`2026-10-19-avian-feather-bud-hexagonal-loop`):
#   - Primary assessor: Gemini 4 Argon (Cursor agent) — 95.0 / 100
#   - Second assessor rubric criteria: 90.0 / 100
#   - Pass 2 consensus score: 92.5 / 100 (up from 56.0 / 100 in Pass 1 v1; +36.5 overall)
#
# Key remediation improvements verified in Pass 2:
#   1. Coupled 2D Keller-Segel Dermal Chemotaxis + FGF20/BMP4 + Mediolateral EDA Traveling
#      Competence Wave Solver (`simulate_feather_array_2d`, L223-366) & 6-Regime Wave-Speed
#      Sweep (`run_wave_speed_and_perturbation_suite`, L372-449):
#      - Wild-Type Row-by-Row Traveling Wave (v_w = 0.22): BMP4 lateral inhibition from each
#        medial row r pins row r+1 into the half-period saddles Delta_y = lambda_y/2 at
#        mediolateral spacing Delta_x = (sqrt(3)/2)*lambda_y, forming a 41-bud hexagonal
#        array with interior Voronoi hexagonal fraction P_6 = 0.8696 (20/23 hexagons,
#        P_567 = 1.0000), Voronoi-ridge bond-orientational order |psi_6| = 0.9682, and
#        nearest-neighbor spacing CV = 0.0485.
#      - Simultaneous Global Competence (v_w = 100.0, exogenous Fc-chEDA1 / FGF-medium
#        flooding, Ho et al. 2019 Figs. 1C, 3D-E): unpinned simultaneous nucleation across
#        the tract generates 5-7 grain-boundary defects, dropping Voronoi hexagonal fidelity
#        to P_6 = 0.4500 (Delta_P6 = +0.4196 advantage for the traveling wave) and
#        |psi_6| = 0.7858.
#      - Ecto-D2 / LDN Retarded Competence Wave (v_w = 0.11, 0.5x WT, Ho et al. 2019
#        Fig. 3F-I): restricts feather bud initiation to a narrowed medial tract of width
#        0.6085x WT (38.01 vs 62.46 px, 27 vs 41 buds).
#   2. Scaleless (FGF20-/-, sc/sc) Mutant & Latrunculin A / Blebbistatin Actomyosin
#      Mechanical Blockade Negative Controls + 7-Point Chemotactic Sensitivity Sweep
#      (L424-447):
#      - Both scaleless (chi = 0.0 < chi_c = 0.0540) and Latrunculin (chi = 0.01 < chi_c)
#        abolish dermal mesenchymal condensation completely (0 feather buds, std(n) = 2.09e-3
#        vs WT std(n) = 0.3069).
#   3. Real Biological Specimen Segmentation (`segment_feather_tract_specimen`, L455-516)
#      on the SHA-256-locked embryonic chick (Gallus gallus) dorsal feather tract figure
#      (`chick_feather_bud_hexagonal_specimen.jpg`, Ho et al. 2019 PLOS Biol. 17:e3000132
#      Fig. 3, CC BY 4.0):
#      - Panel B ROI `[494, 24, 770, 218]`: extracts all 24 feather primordia (*CTNNB1* +
#        *EDA* overlay), builds their Voronoi tessellation and Delaunay neighbor graph,
#        and confirms P_6 = 0.7500 (9/12 interior hexagons), P_567 = 1.0000 (100% 5-6-7
#        coordination), |psi_6| = 0.5265, and nearest-neighbor spacing 40.33 +- 7.96 px
#        (CV = 0.1974).
#      - Panel A ROIs (`[32, 242, 126, 338]` E6.5+24h vs `[136, 242, 232, 338]` E6.5+48h):
#        quantifies the mediolateral traveling-wave tract expansion ratio w_48h / w_24h =
#        38.0 / 18.0 = 2.1111x.
#   4. 3 machine-checked Lean 4 theorems in `morphoeval/lean/loops/Loop_019_avian_feather_bud_hexagonal.lean`
#      (0 `sorry`s, verified by Lean 4 kernel) registered in
#      `morphoeval/math_kg_loops/glimm-avian-feather-bud-hexagonal.yaml`.

