        evidence:
          - {file: datasets/drosophila_suzukii_turing_wavelength_s0/paper_citations.bib, lines: [1, 80], note: "DOI bib entries", supports: true}
          - {file: datasets/drosophila_suzukii_turing_wavelength_s0/README.md, lines: [1, 25], note: "scale 2.0 µm and age 0 Ma stated", supports: true}
          - {file: datasets/drosophila_suzukii_turing_wavelength_s0/scout_manifest.json, lines: [1, 40], note: "OpenAlex and Wikimedia scout", supports: true}
      code-traceability:
        value: 88
        rationale: >-
          onset_kc2, growth_rate, the eigenvector initializer, and the chronoseries
          constants are the same objects the Lean file proves as sign facts
          (trace < 0, det > 0, 12 vs 10 ocelli, f_u numerator -17). The math-kg
          yaml points at those declarations. Comments name Turing 1952 and
          Schnakenberg 1979 at the formula, not only in the module docstring.
        evidence:
          - {file: models/2026-delphi10000-drosophila-suzukii-turing-wavelength-s0.py, lines: [88, 104], note: "onset formula comment cites Turing 1952 and Murray 1981", supports: true}
          - {file: morphoeval/lean/loops/Loop_3207_drosophila_suzukii_turing_wavelength_s0.lean, lines: [1, 62], note: "namespace MathOfBiology.Loop_3207, eight theorems, zero sorry", supports: true}
      repro-package:
        value: 90
        rationale: >-
          python3 models/2026-delphi10000-drosophila-suzukii-turing-wavelength-s0.py --self-test
          checks lambda_c, both null controls, Pearson r > 0.98, and the monotonic
