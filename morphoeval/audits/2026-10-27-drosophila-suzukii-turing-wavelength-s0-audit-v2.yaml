simulations:
  - id: delphi10000-drosophila-suzukii-turing-wavelength-s0
    name: "Drosophila suzukii Turing onset wavelength at 2.046 µm (0 Ma, detail scale)"
    organism: "Drosophila suzukii"
    script: models/2026-delphi10000-drosophila-suzukii-turing-wavelength-s0.py
    output: docs/media/drosophila_suzukii_turing_wavelength_s0_comparison.png
    supersedes_audit_id: 2026-10-27-drosophila-suzukii-turing-wavelength-s0-audit
