simulations:
  - id: delphi10000-archaeopteryx-lithographica-turing-wavelength-s0
    name: "Schnakenberg Turing wavelength on Archaeopteryx lithographica at 75 µm (Tithonian, 150.0 Ma)"
    organism: "Archaeopteryx lithographica"
    script: models/2026-delphi10000-archaeopteryx-lithographica-turing-wavelength-s0.py
    output: docs/media/archaeopteryx_lithographica_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, prum2002, carney2012, manning2013, foth2014, li2010, li2012]
    summary: >-
      Periodic Schnakenberg system with a=0.112, b=0.836, Du=0.052, Dv=1.48, gamma=0.039,
      anisotropy 1.22, seed 3120. Analytical lambda_c = 11.991 cells, scaled so the physical
      wavelength is 7.478e-05 m (75 µm) at 150.0 Ma. Grid FFT wavelength is 12.00 cells
      (relative error 0.00072). Wing-transect Pearson r = 0.9803, nRMSE = 0.198, KS = 0.053.
      Equal-diffusion ablation std ratio = 0.00081. Gamma sweep is strictly decreasing.
      Predicted neighbor wavelengths at the same dx: Anchiornis 95.33 µm (160.8 Ma),
      Microraptor 57.05 µm (120 Ma). The Berlin-slab scan does not resolve 75 µm.
    provenance:
      spec_fingerprint: "6913098e47054812a2f1cf896b7e10fbf923735b2080ce927a3087eecb641c84"
