    claim_boundary:
      reported_in_source:
      - Saadaoui, Rocancourt, Roussel, Corson & Gros (2020) Science 367:453-458 viscous epiblast Stokes model eta*nabla^2
        v + eta_b*nabla(nabla.v) = -nabla.(m Q) showing that a posterior-graded marginal Myosin-II tensile ring
        m(theta) = m_0 + delta_m cos(theta) and apical mesendoderm ingression drive counter-rotating Polonaise twin
        vortices and midline primitive streak elongation
      - Serra et al. (2023) mechanochemical active nematic feedback (Dm/Dt and DQ_{ij}/Dt) and Finite-Time Lyapunov
        Exponent (FTLE) Dynamic Morphogenetic Skeleton demonstrating transition from a wild-type linear streak to
        a circular ring under FGF receptor inhibition (SU5402) or twin streaks under ectopic Vg1/Wnt induction
      - Yu et al. (2009) Fgf8 source-sink gradient with D = 53 um^2/s; Muller et al. (2012) Nodal D = 3.2 um^2/s,
        t1/2 = 95 min; Nakaya et al. (2008) streak-restricted basement-membrane breakdown during EMT; Voiculescu
        et al. (2014) SB431542 Nodal/ALK block abolishes ingression
      reconstructed_in_script:
      - 64x64 coupled 2D spectral viscous epiblast Stokes solver (Green's function L2 error = 5.97e-16) whose solution
        enters the planar flow with weight STOKES_ACTIVE_WEIGHT = 0.18 on top of a prescribed dipole + quadrupole
        Polonaise streamfunction and isotropic ring contraction, plus an irrotational sink driven by the EMT column
        ingression rate; active nematic Myosin-II cable advection-alignment PDE; Cauchy-Green FTLE ridge integration;
        semi-Lagrangian transport in physical units
      - Explicit Wnt8c (posterior marginal source) -> committed streak-cell density -> Nodal (autoactivating) ->
        FGF8 reaction-diffusion cascade with implicit spectral diffusion-decay and Hill-type pMLC activation P =
        rho_ROCK H(a_ALK N)(0.35 + 0.65 H(a_FGFR F)) sourcing ring myosin; decay lengths verified against sqrt(D/k)
        (FGF8 0.8 %, Nodal 1.4 %); receptor-level SU5402 (a_FGFR = 0), SB431542 (a_ALK = 0), Y-27632 (rho_ROCK),
        ectopic Vg1/Wnt (anterior source) regimes
      - 'Reduced 2.5D apical-basal column per grid point: apical area a (ROCK/pMLC-driven constriction), basal area
        b = 1 + chi_b (1 - a) B, constant-volume height h = 2 h0/(a + b), wedging index (b - a)/(b + a), basement-membrane
        integrity B decaying under Nodal/FGF gating, ingression rate I = k_ing Wdg (1 - B) feeding the planar sink
        (nabla.v = -I); field-derived readouts: streak thickening 1.26x, BM-broken area fraction 0.17, ingressed
        fraction 0.20, EMT-zone AP/ML 0.59, emergent ring asymmetry 0.63, peak speed 2.14 um/min (WT)'
      - 15x15 (delta_m x beta_m) morphospace from 225 coupled 40x40 simulations; automated CV segmentation of HH1
        Koller's sickle, HH2 condensation, HH3+ streak, area pellucida/opaca ratio (0.6250) and PIV bilateral symmetry
        (0.9705) on chick_primitive_streak_specimen.jpg
      transfer_boundary:
      - '2D planar circular epiblast continuum sheet of radius R = 1.15 mm with a single global velocity calibration
        constant U_CAL_MM_PER_H = 0.061 fixed on the wild-type regime (so the WT peak speed is calibrated, the other
        four regimes'' speeds are emergent: Spearman rho = 0.90, Pearson r = 0.927 vs the Saadaoui/Serra table)'
      - 'The coupled model forms a thickened, ingressing posterior crescent and does NOT elongate it into a midline
        streak within 8 h (WT EMT-zone AP/ML 0.59 vs reference 4.25; 5-regime aspect Spearman rho = -0.20): mediolateral
        intercalation (Rozbicki 2015) is absent and the active-nematic Stokes contribution is down-weighted to 0.18
        to keep speeds physical'
      - The four Pass 2 readouts streak_ap_ml_aspect_ratio / streak_length_mm / peak_polonaise_speed_um_min / ftle_ridge_anisotropy
        are retained as prescribed piecewise-analytic lookups of the regime parameters and reproduce the reference
        table by construction (r = 1); they are flagged in the code and are NOT evidence of model performance
      - Ligand kinetics for Wnt8c (D, half-life), FGF8 half-life, the column parameters (k_con, m_c, k_rel, chi_b,
        k_bm, k_ing, a_min, h0 = 25 um), source amplitudes and Hill constants are ASSUMED or DERIVED (marked as
        such in ligand_emt_reference.json); reference values 1.33 (thickening) and 0.08 (BM-broken fraction) are
        derived, not measured
      does_not_claim:
      - 3D finite-element epithelial mechanics, out-of-plane bending, bottle-cell mechanics or individual mesenchymal
        migration after ingression (the column model is a per-point 2.5D reduction)
      - Mediolateral cell intercalation or any mechanism that converts the posterior crescent into a 4:1 midline
        streak
      - Independent verification of the Serra et al. (2023) venue/DOI or of the four new ligand/EMT DOIs (all recorded
        as unverified offline)
