simulations:
- id: delphi10000-aulacopleura-koninckii-holaspis22-turing-wavelength-s0
  name: Holaspis22 cuticle Turing wavelength at 15 µm (Wenlock, 428.1 Ma)
  organism: Aulacopleura koninckii holaspis22 (22 thoracic segments)
  script: models/2026-delphi10000-aulacopleura-koninckii-holaspis22-turing-wavelength-s0.py
  output: docs/media/aulacopleura_koninckii_holaspis22_turing_wavelength_s0_growth.gif
  status: evaluated
  source_refs:
  - turing1952
  - fusco2004
  - hughes1995
  - hughes2006
  - fusco2016
  - hughes2017
  summary: 'Pass 2 keeps the Schnakenberg patch whose analytical wavelength is 15.14 µm (dispersion Pearson
    r = 0.99963, RMSE 0.03185). At fixed D_u, raising r = D_v/D_u from 8 to 60 shortens lambda_c monotonically
    from 15.94 µm to 14.82 µm and raises the peak growth rate; the pass-1 guess that lambda would lengthen
    was wrong for g_v < 0. Dropping the u^2 v coupling drops the amplitude ratio to 0.0033, against 0.0361
    for equal diffusivities. The GIF last frame versus the pinned fossil: Sobel-orientation KS = 0.022
    (L1 = 0.011), 24-bin radial FFT cosine = 0.9999, cv_sim_similarity = 96.0. Post-cephalic rib count
    on the photograph is 23.89 against the literature thoracic count of 22. Versus holaspis18, 1.115^4
    = 1.546 entry-size ratio and 1.265 wavelengths per tergite at 15 µm.'
  claim_boundary:
    reported_in_source:
    - Five holaspid morphs with 18–22 thoracic segments; hemianamorphosis; precocious specification of
      the adult count (Fusco et al. 2004).
    - Meraspid per-stage growth 1.115 and holaspid per-stage growth 1.103; thoracic release ends at s18
      for t18 and s22 for t22 (Hughes et al. 2017).
    - A shape transition near glabellar length 1.7 mm is not strictly tied to segment number (Hughes &
      Chapman 1995).
    reconstructed_in_script:
    - Schnakenberg Jacobian and k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v), with the length unit set so
      lambda_c = 1.514e-5 m.
    - Entry-size ratio 1.115^4 and the per-tergite wavelength-count ratio against the 18-segment predecessor.
    - Segment-accretion reveal on the pinned dorsal photograph, with the simulated activator painted into
      the two eye regions.
    transfer_boundary:
    - The catalog ages 428.3 Ma (holaspis18) and 428.1 Ma (holaspis22) are series bookkeeping. Fusco et
      al. 2004 describe contemporaneous intraspecific morphs from one narrow Wenlock interval near 429
      Ma.
    - 15 µm is the assigned cellular detail scale for this slot. It is not a lens diameter measured on
      Aulacopleura.
    does_not_claim:
    - That the fossil photograph resolves 15 µm ocelli.
    - That 18- and 22-segment animals are successive chronospecies separated by 0.2 Myr.
    - That Schnakenberg kinetics were written down by Fusco, Hughes, or Turing; Turing 1952 supplies the
      dispersion relation, Schnakenberg supplies a two-species carrier that realizes it.
