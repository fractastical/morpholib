    claim_boundary:
      reported_in_source:
      - Thompson (1917) pp. 139-145 reproduces Durbin's Exp. II and Exp. IV regenerated-length tables and asserts
        V falls 'inversely as the square of the time' with log V approximately linear (Fig. 37) and an inflection
        'about the seventh day' in Exp. IV
      - Thompson (1917) p. 148 reproduces Ellis's series O/P/R/S (12-57 % of tail removed) and constructs Fig. 40
        isochrones that 'approximate in form to a cubic parabola' and 'converge towards infinity' at 75 % removed
        (Ellis's lethal fifth series)
      - 'Thompson (1917) p. 148: tail length ''very near to 26 mm., or 65 per cent. of the whole body-length'''
      reconstructed_in_script:
      - Least-squares fits of exponential-approach, hyperbolic, generalised power-decay (free n), logistic and Gompertz
        laws; OLS decay exponents; sweeps over n and over amputation level R through t_q = a R^(1/3) (75/(75-R))^gamma;
        exact 4! permutation tests; constant-velocity and R-independent nulls; KS tests on standardised residuals
      - Computer-vision tail fraction on one CC-BY lateral photograph (threshold, principal axis, width profile,
        terminal monotone-taper criterion)
      transfer_boundary:
      - 'No transfer to a modern regeneration time series: Dryad doi:10.5061/dryad.n6n6495 (skink telomeres, single
        endpoint, YES/NO amputation) is a DATASET_MISMATCH, vendored for provenance only and excluded from the verdict'
      does_not_claim:
      - A mechanistic model of tail regeneration; that the exponential/Gompertz laws are the generative process
        rather than descriptive fits to 7-10 printed points per series; or that one photograph establishes the population
        tail proportion
