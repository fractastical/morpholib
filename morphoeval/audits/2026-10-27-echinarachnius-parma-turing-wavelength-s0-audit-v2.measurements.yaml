    claim_boundary:
      reported_in_source:
      - Turing (1952) diffusion-driven instability at a finite wavenumber when the inhibitor diffuses faster than
        the activator
      - Schnakenberg (1979) kinetics a - u + u^2 v and b - u^2 v
      - Gierer and Meinhardt (1972) short-range activation with long-range inhibition; Kondo and Miura (2010) reaction-diffusion
        as a patterning framework
      - Seilacher (1979) constructional morphology of the sand-dollar test at centimetre scale
      reconstructed_in_script:
      - Periodic Fourier IMEX Schnakenberg integration on a 480 µm patch. Equilibrated FFT wavelength 60.336 µm;
        linear peak 61.343 µm; Pearson r 0.9965 across seven diffusivity scales; RMSE 2.575 µm
      - Equal-diffusion ablation amplitude 5.69e-3, marked on the figure. 10 µm predecessor patch amplitude 0, marked
        quenched
      - 'USNM E39365 split into 3 discs after a 15 px closing: mean circularity 0.730 versus union circularity 0.066;
        mean aspect 0.994 versus union aspect 1.413'
      - 71 ocellus peaks picked with a one-period window. Mean spacing 49.21 µm, CV 0.330, KS 0.415 against Normal(λ_FFT,
        s)
      transfer_boundary:
      - Du and Dv place the lattice on the assigned 60 µm scale. They are not measured sand-dollar diffusivities.
      - Seilacher (1979) does not report a 60 µm pigment spacing. The chronoseries is 1/1 at 0 Ma; the predecessor
        and successor are the 10 µm and 600 µm scale tiers.
      - Nearest-neighbour distance is not the FFT period. The radial spectrum carries the wavelength law; the spacing
        distribution is broader (CV 0.33).
      does_not_claim:
      - A measured echinochrome diffusion constant, a pigment gene network, or a fit to the centimetre-scale petaloid
      - That the 49 µm nearest-neighbour mean equals the 60 µm Turing wavelength
      - Sibling slot 160 parameters (α = 1.71, β = 0.43)
