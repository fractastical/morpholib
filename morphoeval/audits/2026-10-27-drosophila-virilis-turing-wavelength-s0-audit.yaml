simulations:
  - id: delphi10000-drosophila-virilis-turing-wavelength-s0
    name: "Drosophila virilis Schnakenberg onset wavelength at 3.1 µm (Holocene, 0 Ma)"
    organism: "Drosophila virilis"
    script: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py
    output: docs/media/drosophila_virilis_turing_wavelength_s0_comparison.png
    also:
      - docs/media/drosophila_virilis_turing_wavelength_s0_growth.gif
      - morphoeval/lean/loops/Loop_3210_drosophila_virilis_turing_wavelength_s0.lean
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, gierer1972, kondo2010, gompel2005, murray1981, hanson2019]
    phenomenon_size_m: 3.101e-06
    geological_age_ma: 0.0
    summary: >-
      Pass 1. Shared Du and Dv/Du = 10, species-specific basal activator a.
      Onset wavelength is 3.101 µm for D. virilis (a = 0.10), 2.924 µm for
      predecessor D. teissieri (a = 0.058, still unstable), and no selected
      wavenumber for successor D. willistoni (a = 0.360, discriminant negative).
      All three are Holocene (0 Ma). Linearized dispersion Pearson r = 0.998
      against continuum σ(k) (RMSE 0.032). Equal-diffusion ablation quenches
      activator std from 0.043 to 0. Saturated midline spacing is 3.625 µm,
      not the onset value. The Hanson 2019 habitus has a Nyquist length of
      7.76 µm and does not resolve 3.1 µm.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 critical-wavenumber selection from the dispersion relation of a two-species reaction-diffusion system."
        - "Schnakenberg 1979 kinetics and the steady state u0 = a + b, v0 = b/(a+b)^2."
        - "Gompel et al. 2005: abdominal pigment differences among Drosophila species are cis-regulatory, including posterior bands in the melanogaster subgroup."
        - "Hanson 2019 CC BY-SA 4.0 lateral habitus of Drosophila virilis (Wikimedia File:Dvir 1-2.jpg)."
      reconstructed_in_script:
        - "Du solved so virilis onset λ_c = 3.101 µm at Dv/Du = 10 and b = 0.90."
        - "Teissieri a = 0.058 and willistoni a = 0.360 as the chronoseries step at fixed age and fixed diffusivities."
        - "Tergite mode counts from project atlas adult lengths divided by seven."
        - "Adult GIF endpoint is the habitus photograph modulated by the normalized PDE field."
      transfer_boundary:
        - "The 3.101 µm target is the slot scale. It is not a published ocellus measurement for D. virilis."
        - "Atlas body lengths are used only to turn a wavelength into a mode count."
      does_not_claim:
        - "That the habitus photograph resolves a 3.1 µm pigment wavelength (measured Nyquist is 7.76 µm)."
        - "That willistoni lost a Turing pattern through geological time (successor is extant, 0 Ma)."
        - "That chorion-filament number enters the wavenumber law."
        - "That the PDE generated the wing veins or the body outline."
    needs:
      - id: N1
        need_type: model_equation
        target_dimension: model-fidelity
        description: "Fixed 48 by 32 µm patch. No growing ocellar disc, so mode insertion with domain length is not demonstrated."
        status: open
        novelty_n: 2
        contradiction_c: 0
        depth_d: 2
        age_days_a: 0
      - id: N2
        need_type: specimen_comparison
        target_dimension: morphometric-validation
        description: "One lateral habitus. Pixel scale cannot confirm the 3.101 µm mode."
        status: open
        novelty_n: 1
        contradiction_c: 0
        depth_d: 2
        age_days_a: 0
    scores:
      model-fidelity:
        value: 86
        rationale: "Schnakenberg steady state, Jacobian, onset k_c, and the four Turing inequalities are the published relations, and Du is solved from that onset law so virilis sits at 3.101 µm. The 2D field is explicit Euler on a fixed periodic patch. The chronospecies split is a change in a at fixed Du, which is a reconstruction, not a measured diffusivity. Deduction for the fixed domain and for using the habitus only as a modulated photograph rather than as the PDE domain."
        evidence:
          - {file: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py, lines: [80, 125], note: "steady state, onset k_c^2, Turing inequalities, sigma(k)", supports: true}
          - {file: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py, lines: [171, 210], note: "periodic explicit Euler of Schnakenberg kinetics", supports: true}
          - {file: morphoeval/lean/loops/Loop_3210_drosophila_virilis_turing_wavelength_s0.lean, lines: [14, 48], note: "five sorry-free theorems on wavelength order, quench, activator order, mode count, and the 136 µm separator", supports: true}
      specimen-match:
        value: 84
        rationale: "The comparison figure places the Hanson habitus, its foreground mask, the saturated activator field, the three-species dispersion curves, and the adult endpoint side by side. The endpoint resembles the fly because it is the photograph with a bounded modulation, which is the right macro appearance and a weak display of the 3.1 µm texture. The mask follows the body, wings, and legs. Willistoni's dispersion curve stays negative while virilis and teissieri cross above zero."
        evidence:
          - {file: docs/media/drosophila_virilis_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "six-panel comparison", supports: true}
          - {file: docs/media/drosophila_virilis_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640x480, habitus modulated by the growing field", supports: true}
          - {file: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py, lines: [334, 394], note: "habitus segmentation and frame composition", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "Onset wavelength increases monotonically with basal activator a on [0.06, 0.12]. Equal diffusion (Dv = Du) drops activator standard deviation from 0.043 to 0. Teissieri, virilis, and willistoni are the same Du and Dv at three values of a, and only the first two are unstable. The diffusion ratio itself is not swept."
        evidence:
          - {file: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py, lines: [127, 162], note: "species bundle at shared Du", supports: true}
          - {file: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py, lines: [323, 331], note: "activator sweep", supports: true}
          - {file: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py, lines: [478, 479], note: "equal-diffusion ablation at the same seed and duration", supports: true}
      morphometric-validation:
        value: 86
        rationale: "Linearized growth rates on  the real-eigenvalue band correlate with continuum σ(k) at Pearson r = 0.998 (RMSE 0.032), above the 0.98 threshold and not equal to it. Emergent midline spacing is 3.625 µm against the 3.101 µm onset reference. Habitus Nyquist is 7.76 µm. Orientation KS and pixel Pearson are computed against the photograph and are not copied from the reference anchors. Single specimen; a is not an independent empirical series."
        evidence:
          - {file: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py, lines: [224, 292], note: "dispersion goodness of fit", supports: true}
          - {file: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py, lines: [514, 631], note: "measurement table with reference anchors that differ from the measured values except the calibrated onset wavelength", supports: true}
      source-traceability:
        value: 90
        rationale: "Turing, Schnakenberg, Gierer–Meinhardt, Kondo–Miura, Gompel, and Murray are cited with DOIs. The habitus file is SHA-256 pinned to the Hanson 2019 Wikimedia original, CC BY-SA 4.0. The slot scale and 0 Ma age are stated in the dataset README."
        evidence:
          - {file: datasets/drosophila_virilis_turing_wavelength_s0/paper_citations.bib, lines: [1, 68], note: "DOI bibliography including the habitus credit", supports: true}
          - {file: datasets/drosophila_virilis_turing_wavelength_s0/drosophila_virilis_turing_wavelength_s0_reference.json, lines: [1, 40], note: "3.101e-06 m and geological_age_ma 0.0", supports: true}
          - {file: datasets/drosophila_virilis_turing_wavelength_s0/drosophila_virilis_habitus.jpg, lines: [0, 0], note: "SHA-256 b82bab27947e6e61ffdc4effb81d9ccd69a1141161b5195f4078975284fd1fa3", supports: true}
      code-traceability:
        value: 86
        rationale: "Module docstring states the scale, the age, and which species changes a. steady_state, onset_k2, and sigma_of_k are the textbook objects. Lean theorems restate the ordering the script checks by rounding nanometres. The render composite is labeled as a modulation, not as a derivation of the veins."
        evidence:
          - {file: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py, lines: [1, 24], note: "scale, age, chronoseries, and the claim about a", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-drosophila-virilis-turing-wavelength-s0.yaml, lines: [1, 55], note: "law records pointing at the Lean declarations", supports: true}
      repro-package:
        value: 88
        rationale: "Deterministic seed 3210, --self-test covers the wavelength ordering, the quench, Pearson r > 0.98, ablation, monotonicity, Nyquist, and the pinned SHA-256. One command renders the PNG and the 12-frame GIF. No dependency lock beyond the repository requirements file. Single-assessor scores."
        evidence:
          - {file: models/2026-delphi10000-drosophila-virilis-turing-wavelength-s0.py, lines: [658, 696], note: "self-test checks", supports: true}
          - {file: datasets/drosophila_virilis_turing_wavelength_s0/README.md, lines: [1, 40], note: "invocation and the 3.1 µm / 0 Ma statement", supports: true}
    remediation:
      - "R1. The PDE lives on a fixed 48 by 32 µm patch. Add a domain-length series and show that the number of activator peaks increases with patch length (mode count), which this pass does not measure."
      - "R2. The Hanson habitus Nyquist length is 7.76 µm. Keep that as an explicit negative result: the photograph is not evidence for the 3.101 µm wavelength."
      - "R3. Basal activator levels are reconstructed from pigmentation class. They are not a fit to a measured virilis concentration series."
      - "R4. Scores are from one assessor."
