    status: evaluated
    source_refs:
      - honda1971
      - honda1978
      - fisher1979
      - shinozaki1964
      - eloy2011
    summary: >-
      Pass 1 (v1) baseline evaluation of `1976-honda-dichotomous-tree-branching.py`
      (weighted score: 53.6/100). The Pass 1 baseline implements only a 2D planar
      branching sketch at two angle pairs without Honda's (1971) full 3D local rotation-matrix
      recursion in the (v, v x z_hat) frame, omits the Honda & Fisher (1978) 2D (theta_1, theta_2)
      effective leaf area A_eff / A_total optimization landscape across 5-branch whorls,
      omits Leonardo da Vinci / Shinozaki pipe-model cross-sectional area conservation
      (d_0^2 = d_1^2 + d_2^2), omits the 4-archetype 3D crown morphospace and collinear
      theta_1 = theta_2 = 0 self-shaded ablation control, and does not segment or analyze
      the vendored Cornus controversa tiered crown specimen (`cornus_controversa_tiered_crown_specimen.jpg`).
    scores:
      model-fidelity:
        value: 55
        rationale: >-
          Implements only a 2D planar branching recursion at two angle pairs (L24-48),
          omitting Honda's (1971) 3D rotation-matrix recursion with phyllotactic roll
          alpha = 137.5 deg, Honda & Fisher's (1978) 5-whorl effective leaf area disk-union
          functional A_eff / A_total, and Leonardo da Vinci / Shinozaki pipe-model diameter tapering.
        evidence:
          - {file: 1976-honda-dichotomous-tree-branching.py, lines: [24, 48], note: "2D planar recursion only without 3D rotation matrix, effective leaf area integral, or Leonardo pipe-model tapering", supports: true}
      specimen-match:
        value: 42
        rationale: >-
          Vendors `datasets/dichotomous_tree_branching/cornus_controversa_tiered_crown_specimen.jpg`
          on disk, but Pass 1 does not load, segment, or extract pagoda crown tiers,
          woody branch skeletons, bifurcation angles (theta_1, theta_2), or Leonardo area
          ratios from the Cornus controversa specimen.
        evidence:
          - {file: 1976-honda-dichotomous-tree-branching.py, lines: [64, 102], note: "Renders only 2 synthetic 2D trees without loading or segmenting the Cornus controversa specimen", supports: false}
      parameter-expressivity:
        value: 50
        rationale: >-
          Evaluates only two fixed (theta_1, theta_2) pairs without sweeping the 2D
          (theta_1, theta_2) effective leaf area surface, comparing the 4 Honda (1971)
          3D crown archetypes, or exposing CLI parameter overrides.
        evidence:
          - {file: 1976-honda-dichotomous-tree-branching.py, lines: [51, 61], note: "Only two hard-coded angle pairs evaluated", supports: false}
      morphometric-validation:
        value: 52
        rationale: >-
          Returns only tip count and horizontal span without A_eff / A_total Pearson
          correlation, p-values, RMSE, Leonardo pipe-model conservation residuals,
          collinear zero-angle ablation control, or empirical specimen morphometrics.
        evidence:
          - {file: 1976-honda-dichotomous-tree-branching.py, lines: [51, 61], note: "Minimal scalar output without statistical validation or ablation control", supports: false}
      source-traceability:
        value: 68
        rationale: >-
          Vendors `paper_citations.bib` and `dichotomous_tree_branching_reference.json`
