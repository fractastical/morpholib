    name: "Honda (1971) J. Theor. Biol. & Honda & Fisher (1978) Science 3D recursive dichotomous tree branching, effective leaf area optimization, and Leonardo da Vinci pipe-model cross-sectional area conservation"
    organism: "Cornus controversa (Pagoda dogwood / wedding cake tree) & Terminalia catappa (Tropical almond pagoda tree)"
