simulations:
  - id: serra-gastrulation-streak-attractor
    name: "Saadaoui et al. (2020), Serra et al. (2023) & Rozbicki et al. (2015) avian gastrulation tensile ring, Polonaise twin-vortex flow & primitive streak attractor"
    organism: "Gallus gallus (chick epiblast disc Stage EGK XII to HH3+ primitive streak formation)"
    script: 2022-serra-gastrulation-streak-attractor.py
    output: docs/media/gastrulation_streak_attractor_comparison.png
    extra_outputs:
      - docs/media/gastrulation_streak_attractor_growth.gif
    status: evaluated
    source_refs:
      - saadaoui2020
      - serra2023
      - rozbicki2015
      - vasiev2010
    summary: >-
      Pass 1 baseline assessment of `2022-serra-gastrulation-streak-attractor.py` (58.3/100).
      The initial script verifies the dipolar Polonaise streamfunction circulation
      conservation identity `Gamma_L + Gamma_R = 0` and compares basic wild-type vs
      FGF-inhibited circular ring flow speeds, but uses an analytic streamfunction
      surrogate rather than a coupled 2D viscous epiblast Stokes PDE solver
      `eta*nabla^2 v + eta_b*nabla(nabla.v) = -nabla.(m Q)` paired with active nematic
      myosin cable advection-alignment (`Dm/Dt` and `DQ_{ij}/Dt`) and Finite-Time
      Lyapunov Exponent (FTLE) Lagrangian attractor skeleton computation, lacks all 5
      experimental regimes (missing ectopic Vg1/Wnt twin streaks and SB431542 ingression
      block) and a 2D parameter morphospace, and does not perform automated computer-vision
      segmentation of the area pellucida, area opaca, HH1 Koller's sickle, and HH3
      primitive streak on `chick_primitive_streak_specimen.jpg`.
    scores:
      model-fidelity:
        value: 59
        rationale: >-
          Evaluates an analytic Polonaise streamfunction `psi = V_dip * Y * (1 - r^2/R^2)^2`
          with conserved zero net circulation (L73-122), but Pass 1 lacks an explicit 2D
          viscous Stokes PDE solver coupled to dynamic active nematic Myosin-II tensor
          `Q_{ij}(x, t)` advection-alignment and Lagrangian FTLE ridge extraction.
        evidence:
          - {file: 2022-serra-gastrulation-streak-attractor.py, lines: [73, 122], note: "Analytic Polonaise streamfunction surrogate requiring coupled 2D Stokes + active nematic Q(x,t) PDE solver", supports: false}
      specimen-match:
        value: 52
        rationale: >-
          Vendors `datasets/gastrulation_streak_attractor/chick_primitive_streak_specimen.jpg`
          (CC BY 4.0 Gallus gallus gastrulation micrographs across HH1-HH3+), but Pass 1
          only displays the raw image without automated CV segmentation of area pellucida,
          area opaca, HH1 Koller's sickle crescent, or HH3 midline primitive streak geometry.
        evidence:
          - {file: 2022-serra-gastrulation-streak-attractor.py, lines: [53, 66], note: "SHA-256 verification of chick_primitive_streak_specimen.jpg without CV segmentation", supports: false}
      parameter-expressivity:
        value: 56
        rationale: >-
          Evaluates 3 baseline regimes in Pass 1, requiring expansion to all 5 Saadaoui
          et al. (2020) / Serra et al. (2023) perturbation regimes (`wildtype_hh1_to_hh3_polonaise_streak`,
          `fgf_inhibited_su5402_circular_ring`, `ectopic_vg1_wnt_twin_streaks`,
          `ingression_blocked_nodal_sb431542`, and `rock_inhibited_y27632_flow_arrest`) plus
          a 2D `(delta_m x beta_m)` parameter morphospace.
        evidence:
          - {file: 2022-serra-gastrulation-streak-attractor.py, lines: [125, 148], note: "3-regime baseline lacking ectopic Vg1 twin streaks, SB431542 ingression block, and 2D morphospace", supports: false}
      morphometric-validation:
        value: 55
        rationale: >-
          Provides 2 baseline measurements in `measure_morphoeval()`, requiring expansion
          to 7 quantitative morphometric benchmarks spanning 5-regime streak elongation,
          Polonaise speed, FTLE ridge anisotropy, and specimen HH1->HH3 CV morphometrics.
        evidence:
          - {file: 2022-serra-gastrulation-streak-attractor.py, lines: [151, 166], note: "Baseline measure_morphoeval() with 2 script metrics", supports: false}
      source-traceability:
        value: 66
        rationale: >-
          Vendors `scout_manifest.json`, `gastrulation_streak_attractor_reference.json`,
          `paper_citations.bib`, and `chick_primitive_streak_specimen.jpg` with SHA-256
          verification linking Saadaoui et al. (2020), Serra et al. (2023), Rozbicki
          et al. (2015), and Vasiev et al. (2010).
        evidence:
          - {file: 2022-serra-gastrulation-streak-attractor.py, lines: [39, 66], note: "SHA-256 verification of vendored chick gastrulation dataset files", supports: true}
      code-traceability:
        value: 60
        rationale: >-
          Links module docstring to `Loop_050_gastrulation_streak_attractor.lean`,
          requiring complete function-level mappings to Saadaoui et al. (2020) Figs. 1-4
          and Serra et al. (2023) Figs. 1-5.
        evidence:
          - {file: 2022-serra-gastrulation-streak-attractor.py, lines: [1, 30], note: "Module docstring mapping governing laws to Lean 4 theorems", supports: true}
      repro-package:
        value: 60
        rationale: >-
          Provides `--self-test` and deterministic execution, requiring expansion to
          verify coupled 2D Stokes + active nematic PDE integration, FTLE Lagrangian
          attractor ridges, all 5 regimes, bitwise determinism, and specimen CV segmentation.
        evidence:
          - {file: 2022-serra-gastrulation-streak-attractor.py, lines: [215, 227], note: "Baseline --self-test suite", supports: true}
    remediation:
      - "Implement a coupled 2D viscous epiblast Stokes PDE solver `eta*nabla^2 v + eta_b*nabla(nabla.v) = -nabla.(m Q)` + active nematic Myosin-II cable advection-alignment (`Dm/Dt` and `DQ_{ij}/Dt`) + Finite-Time Lyapunov Exponent (FTLE) Lagrangian attractor skeleton computation on the circular chick blastoderm disc."
      - "Evaluate all 5 Saadaoui et al. (2020) / Serra et al. (2023) experimental regimes (`wildtype_hh1_to_hh3_polonaise_streak`, `fgf_inhibited_su5402_circular_ring`, `ectopic_vg1_wnt_twin_streaks`, `ingression_blocked_nodal_sb431542`, `rock_inhibited_y27632_flow_arrest`) and a 15x15 2D `(delta_m x beta_m)` parameter morphospace."
      - "Add automated CV segmentation of the area pellucida, area opaca, HH1 posterior Koller's sickle crescent, HH2 Polonaise PIV bilateral vortex symmetry, and HH3+ midline primitive streak on `datasets/gastrulation_streak_attractor/chick_primitive_streak_specimen.jpg`."
