    claim_boundary:
      reported_in_source:
        - "Turing 1952 critical wavenumber from linear stability of a two-species reaction-diffusion system"
        - "Schnakenberg 1979 kinetics f = a - u + u^2 v, g = b - u^2 v"
        - "Kües 2000 developmental account of the gilled Coprinus cinereus fruiting body"
        - "Stajich et al. 2010 Coprinopsis cinerea genome"
      reconstructed_in_script:
        - "γ calibrated so λ_c = 7.744e-05 m on a 96² grid with 12 px per wave"
        - "Explicit Euler and a periodic 5-point Laplacian"
      transfer_boundary:
        - "77 µm is the assigned atlas scale, not a spacing measured on the photograph"
        - "The photograph has no scale bar; mature gills are not the cellular wavelength"
      does_not_claim:
        - "That Schnakenberg parameters were fitted to Coprinopsis biochemistry"
        - "A predecessor or successor chronospecies (this series is 1/1 at 0 Ma)"
        - "That the growth GIF is a photograph of the fruiting body"
    remediation:
      - id: R1
        item: "Accept a parameter-regime sweep showing k_c moves monotonically with γ (k_c scales as sqrt(γ))."
      - id: R2
        item: "Accept the negative controls: equal diffusion must decay, and an off-band stripe (mode 2) must decay while mode 8 grows."
      - id: R3
        item: "Accept real specimen CV segmentation of the gill disc (mask, circularity, structure-tensor coherency) with references that are not copies of the measured values."
      - id: R4
        item: "Accept goodness-of-fit of analytic versus Euler dispersion: Pearson r, RMSE, and KS."
    scores:
      model-fidelity:
        value: 82
        rationale: "The script implements Schnakenberg kinetics, the steady state, the Jacobian, and k_c² = γ sqrt(det J / (D_u D_v)) with γ solved for 7.744e-05 m. Pass 1 does not yet treat the sweep and ablations as part of the accepted model claim. The kinetics are a standard Turing substrate, not a Coprinopsis circuit."
