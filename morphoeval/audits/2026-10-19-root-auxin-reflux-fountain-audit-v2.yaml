    claim_boundary:
      reported_in_source:
        - "Grieneisen, Xu, Marée, Hogeweg & Scheres (2007) Nature 449:1008-1013 2D multi-file root apex reverse-fountain auxin reflux loop (downward PIN1 stele transport +v_s, lateral PIN3/PIN4/PIN7 columella/QC redistribution, upward PIN2 epidermal/LRC transport -v_e, and inward lateral PIN1/PIN2/PIN3 reflux k_lat across cortex/endodermis), generating an exponential Quiescent Center (QC) auxin capacitor (>100-fold peak) that remains self-sustaining after shoot decapitation (J_in = 0) and regenerates a shifted proximal QC peak after distal laser ablation"
        - "Mähönen et al. (2014) Nature 515:125-129 slow auxin-induced PLETHORA (PLT1/PLT2) transcription factor synthesis, cell-to-cell movement, and growth dilution creating a smooth axial PLT dosage gradient that positions Meristematic Zone (P >= Theta_MZ), Elongation Zone (Theta_EZ <= P < Theta_MZ), and Differentiation Zone (P < Theta_EZ) boundaries"
      reconstructed_in_script:
        - "2D 5-tissue root tip cellular lattice solver (32 axial rows x 9 radial files: epidermis/LRC, cortex, endodermis/pericycle, stele, and distal columella/QC) verifying counter-current vascular-epidermal flux conservation (error 2e-15 <= 1e-12) and reproducing all 6 experimental regimes: Wild-Type (132.05x QC amplification at z=37.5 um), shoot decapitation J_in=0 autonomy (115.56x, retaining 87.5% of WT peak), pin2/eir1 mutant (54.1x, z_MZ=210 um), lateral-PIN ablation k_lat=0 (10.38x, z_MZ=90 um), NPA blockade (1.31x, z_MZ=0 um), and QC laser ablation regenerating a proximal QC peak at z=97.5 um (+60 um shift)"
        - "Coupled PLETHORA (PLT1/2) reaction-diffusion-dilution solver achieving Pearson r = 0.9929 (p = 7.47e-5) against published Meristematic Zone boundaries across all 6 perturbation regimes and r = 0.9851 along the WT axial profile"
        - "Empirical CV segmentation of the 3-panel Arabidopsis thaliana primary root meristem confocal micrograph (`arabidopsis_root_meristem_specimen.jpg`, CC BY-SA 4.0, 1527x513 px) extracting root meristem area fraction (0.2561), N = 113 DAPI-stained nuclei (intercellular spacing 18.3394 +- 0.5790 px SE), N = 125 Alexa Fluor 488 mitotic phragmoplast/spindle divisions, and apical-to-proximal nuclear density ratio (1.1182)"
      transfer_boundary:
        - "2D radial-axial 5-tissue cellular root apex reflux capacitor and PLETHORA dosage thresholds mapped to confocal Arabidopsis root meristem nuclear and mitotic architecture"
      does_not_claim:
        - "Subcellular cell-wall mechanical viscoplasticity or 3D gravitropic root bending curvature"
