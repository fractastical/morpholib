        evidence:
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [1716, 1898], note: "measure_morphoeval(): 7 Pass 3 entries (L1734-L1804) + 9 Pass 2 entries; 16 total", supports: true}
