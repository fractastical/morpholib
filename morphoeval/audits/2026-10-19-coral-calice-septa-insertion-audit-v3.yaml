          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [1858, 1867], note: "Pe-sweep Pearson r vs sqrt(Pe) with hand-set reference 0.9990; correlates a closed form with itself; note reports 13.73 vs JSON 14.375", supports: false}
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [1888, 1897], note: "Specimen reach ratio reference 1.4368 equals the measured value", supports: false}
          - {file: datasets/coral_calice_septa_insertion/coral_calice_septa_insertion_reference.json, lines: [95, 109], note: "cross_taxa_corallite_septa_table recalled values and Pe=36 up/down ratio 14.375 (script gives 13.73)", supports: false}
