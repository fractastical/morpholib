# MorphoEval Pass 3 (v3) Audit — Milne-Edwards & Haime (1848), Kunth (1869) & Chindapol et al. (2013) Scleractinian Coral Calice Septal Insertion, 2026-10-20 (v3)
#
# Pass 3 re-score of `2013-thomas-coral-calice-septa-insertion.py` (now 2056 lines; 12 self-test checks) and
# `datasets/coral_calice_septa_insertion/` after the remediation of both open v2 items in the instrumented loop
# `morphoeval/runs/2026-10-19-coral-calice-septa-insertion-loop-pass3`, superseding
# `2026-10-19-coral-calice-septa-insertion-audit-v2` (91.6 dual-agent consensus).
#   - Primary assessor: Claude Fable 5.1 (Phase B audit subagent, scoring from the Phase A handoff, the
#     `git diff` of the script and the Lean module, a fresh `--self-test` run and a fresh `lean` check at e651a8b8)
#   - Second assessor: Claude Fable 5.1 Phase A remediation agent's defect list (handoff note section (b)),
#     taken as the independent defect enumeration the primary assessor verified line by line.
#
# SLOT METADATA MISMATCH (flagged, not fixed): the campaign dispatch `morphoeval/cloud/dispatches/slot-074.json`
# carries `slug: foraminifera-apertural-growth` and the Pass 3 prompt names *Ammonia beccarii* / Topa & Tyszka
# (2002) Paleobiology (10.1666/0094-8373(2002)028<0450:LMOFS>2.0.CO;2). The script, dataset, Lean module and
# both prior audits are about Scleractinian coral calice septal insertion (*Caryophyllia quadragenaria*). This
# audit scores the code that exists (coral), keeps the coral references, and records the mismatch here and in the
# dispatch record. The telemetry `init` of the pass3 run used the prompt's paper string as instructed.
#
# What Pass 3 changed (both v2 remediation items, closed as honest reduced models):
#   1. Reduced 3D accreting corallum: conical profile R(z) = R_ped + z tan(phi/2) with Wells (1956) apical-angle
#      classes (ceratoid 20 / trochoid 40 / turbinate 70 / patellate 120 deg), a cylindrical label volume
#      (z, r/R(z), theta) carrying theca, columella, pali, septa of cycle k wherever R(z) >= R_k (so the N = 6 ->
#      12 -> 24 -> 48 insertion fronts stack along the growth axis), and two endothecal architectures —
#      vesicular dissepiments (outer loculi, 0.60 mm spacing, tilted, alternating phase) and synapticulae (rings
#      at r in {0.45, 0.65, 0.85} R bridging adjacent septa) — ablated at identical outer geometry
#      (`simulate_turbinate_corallum_3d`, `evaluate_corallum_architectures`, L642-L870). The apical angle is now
#      MEASURED from the side-profile panel of the SHA-256-pinned specimen (36.66 deg, cone fit r = 0.993 ->
#      Wells trochoid) and the septal thickness from the 0.80 R septal duty cycle (0.277 mm)
#      (`segment_caryophyllia_corallum_profile` L873-L930; Otsu area fraction 0.532, L963-L1087).
#   2. Keulegan-Carpenter oscillatory surge: U(t) = U_max sin(omega t), Pe(t) = Pe_max |sin omega t|, the dipole
#      term carries sgn(U); 64 mirror-symmetric phases give an exactly cancelling period-mean dipole <A_1> = 3e-16
#      while the quadrupole (bilateral elongation) survives, scaled by a renewal law eta(KC) = 1 - exp(-KC/2pi)
#      with half-saturation KC_50 = 2 pi ln 2 = 4.355 (numeric 4.350) (`compute_oscillatory_surge_flux`,
#      `evaluate_keulegan_carpenter_sweep`, L504-L627); compared against the unidirectional case at equal Pe_max
#      (A_1 = 0.647 at Pe = 16).
#   3. Two new figures and one GIF (`docs/media/coral_calice_septa_insertion_corallum3d.png`,
#      `_surge_kc.png`, `_surge_phase.gif`), 7 new `measure_morphoeval()` entries (16 total), 4 new self-test
#      checks (12 total), CLI flags `--skip-pass3`, `--apical-angle-deg`, `--septum-thickness-mm`, the new
#      reference table `corallum3d_surge_reference.json` (every row provenance-tagged) and `pass3_citations.bib`.
#   4. Lean: 3 new theorems (`turbinate_corallum_septal_cycles_monotone`, `oscillatory_surge_dipole_cancellation`,
#      `surge_mean_of_mirror_phases_zero`) + 3 lemmas, 0 `sorry`s, registered as Law 4 / Law 5 in
#      `morphoeval/math_kg_loops/thomas-coral-calice-septa-insertion.yaml`.
#
# Why the overall score moves only slightly despite closing both items: the remediation exposed defects the v2
# audit did not penalise — several `reference_value`s equal the measured value (self-referential), the Pe-sweep
# "Pearson r vs sqrt(Pe)" correlates a monotone closed form with itself, the Law 3 flux law is a phenomenological
# ansatz rather than Chindapol's equations with unsourced hard-coded flow constants, the cross-taxa table is
# recalled rather than digitised, and every Pass 3 literature value is recalled offline with unverified DOIs.
# morphometric-validation and source-traceability therefore go DOWN; parameter-expressivity and repro-package go up.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# working tree at commit e651a8b8 (uncommitted Pass 3 edits included) and were verified with grep.

