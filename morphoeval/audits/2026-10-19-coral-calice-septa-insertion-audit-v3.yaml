simulations:
  - id: thomas-coral-calice-septa-insertion
    name: "Milne-Edwards & Haime (1848), Kunth (1869) & Chindapol et al. (2013) Scleractinian coral calice septal insertion, reduced 3D corallum & Keulegan-Carpenter surge morphogenesis"
    organism: "Caryophyllia (Caryophyllia) quadragenaria & Pocillopora verrucosa (Scleractinia stony corals)"
    script: 2013-thomas-coral-calice-septa-insertion.py
    output: docs/media/coral_calice_septa_insertion_comparison.png
    extra_outputs:
      - docs/media/coral_calice_septa_insertion_growth.gif
      - docs/media/coral_calice_septa_insertion_corallum3d.png
      - docs/media/coral_calice_septa_insertion_surge_kc.png
      - docs/media/coral_calice_septa_insertion_surge_phase.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-coral-calice-septa-insertion-audit-v2
    source_refs:
      - milneedwards1848
      - kaandorp2001
      - chindapol2013
      - kunth1869
      - cairns2012
      - keulegan1958
      - falter2005
      - reidenbach2006
      - wells1956
      - otsu1979
    claim_boundary:
      reported_in_source:
        - "Milne-Edwards & Haime (1848): hexameral cyclic septal insertion N_hex(k) = 6 * 2^(k-1) with decreasing radial reach of successive cycles"
        - "Kunth (1869): Paleozoic Rugosa serial insertion in four fossular loci, N_rugosa(m) = 6 + 4m"
        - "Chindapol et al. (2013): advection-diffusion limited accretive growth of Pocillopora verrucosa with upstream-polarised growth under unidirectional flow and symmetric, compact growth under bidirectional (surge) flow"
        - "Wells (1956) Treatise Part F: solitary corallum shape classes by apical angle (ceratoid, trochoid, turbinate, patellate) and the endothecal elements dissepiments and synapticulae"
        - "Keulegan & Carpenter (1958): the ratio U_max T / L governing oscillatory-flow forces on bodies; Falter et al. (2005) and Reidenbach et al. (2006): oscillatory flow enhances mass transfer to reef corals relative to unidirectional flow at the same speed"
      reconstructed_in_script:
        - "2D calice insertion with perimeter-threshold triggering 2 pi R_k = N_hex(k) lambda_s, Kunth Rugosa comparison, a phenomenological boundary-layer flux law j(theta) = j0 (1 + beta sqrt(Pe) cos theta + gamma Pe/(1+Pe) cos 2theta) with Pe = 0 symmetry control, a reduced kinematic 3D conical corallum (cylindrical label volume) with stacked insertion fronts, pali, dissepiments and synapticulae ablated at fixed outer geometry, specimen-measured apical angle (side-profile cone fit) and septal thickness (0.80 R duty cycle), Otsu calice area fraction, an oscillatory surge quasi-steady closure with sgn(U) dipole and a renewal law eta(KC) = 1 - exp(-KC/2pi), KC sweep and reef KC estimates"
      transfer_boundary:
        - "The 3D corallum is kinematic (labels assigned from the cone profile), not accretive growth or mechanics; dissepiment/synapticula spacings and thicknesses are modelling choices tagged `provenance: model`"
        - "The quasi-steady surge closure gives <sqrt(Pe(t))>/sqrt(Pe_max) = 0.763 < 1, i.e. it cannot reproduce the oscillatory mass-transfer ENHANCEMENT of Falter 2005 / Reidenbach 2006; only the symmetry (dipole cancellation) claim of Chindapol 2013 is reproduced"
        - "The Law 3 flux law and the ellipticity formula are this script's ansatz, not equations from Chindapol et al. (2013); the JSON 'Eqs. (1)-(8)' pointer is unverified"
      does_not_claim:
        - "Finite-element or accretive growth of the corallum, validated dissepiment/synapticula geometry, a digitised cross-taxa septa table, verified Pass 3 DOIs, or that the 48 model rim septa match the specimen's 40"
    summary: >-
      Pass 3 (v3) remediated evaluation of `2013-thomas-coral-calice-septa-insertion.py`. Both v2 remediation
      items are closed as honest reduced models: a kinematic 3D conical corallum (Wells 1956 apical-angle
      classes; septal insertion fronts N = 6 -> 12 -> 24 -> 48 stacked along z; dissepiments and synapticulae
      ablated at fixed outer geometry; apical angle 36.66 deg and septal thickness 0.277 mm measured from the
      pinned specimen), and a Keulegan-Carpenter oscillatory surge coupling of the Péclet boundary-layer flux
      (period-mean dipole <A_1> = 3e-16 vs unidirectional 0.647; quadrupole survives; KC_50 = 4.350 vs
      2 pi ln 2 = 4.355). The Pass 2 content (hexameral doubling, Kunth Rugosa, Pe sweep, 7-species scaling,
      40-septa specimen segmentation) is unchanged. 7 new Lean declarations (3 theorems + 3 lemmas, 0 sorrys),
      12/12 self-test checks, 16 morphometrics, 5 rendered outputs. The score moves 91.6 -> ~90 because the
      re-audit penalises defects v2 passed: self-referential reference values, a closed-form-vs-itself Pe
      correlation, a phenomenological flux law with unsourced constants, a recalled cross-taxa table, and
      offline-recalled Pass 3 literature values with unverified DOIs.
    scores:
      model-fidelity:
        value: 89
        rationale: >-
          Laws 1 and 2 (Milne-Edwards hexameral doubling, Kunth 4-fossula serial insertion) are implemented
          exactly and machine-checked; the Pass 3 3D corallum correctly stacks the insertion fronts along the
          growth axis (cycle k present wherever R(z) >= R_k, proven monotone in Lean) and the surge closure
          correctly reproduces the Chindapol (2013) symmetry statement (dipole cancels under bidirectional flow,
          bilateral quadrupole survives; proven for mirror phases in Lean). Deductions, two of them new in this
          round: the Law 3 flux law j0(1 + beta sqrt(Pe) cos theta + gamma Pe/(1+Pe) cos 2theta), the 0.16 j0
          wake floor and the ellipticity formula are a phenomenological ansatz, not Chindapol's advection-
          diffusion equations, and the rim modulation constants 0.035 / 0.025 / 0.42 / 0.35 / 0.06 are unsourced
          (-5); the 3D corallum is kinematic, not accretive or mechanical, so dissepiments/synapticulae are
          placed, not grown (-3); the renewal law eta(KC) = 1 - exp(-KC/2pi) is a modelling choice and the
          quasi-steady closure gives a mean transfer BELOW the unidirectional case (0.763), opposite to the
          Falter/Reidenbach enhancement (-3). v2's 93 did not price the Law 3 ansatz; v3 does.
        evidence:
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [199, 365], note: "Milne-Edwards new/cumulative septa, cycle threshold radius, and the 2D Scleractinian calice solver; rim modulation constants 0.035 (L274) etc. are unsourced", supports: true}
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [435, 501], note: "Phenomenological boundary-layer flux law with 0.16 j0 floor clamp (L454) and ellipticity formula (L462): not Chindapol's equations", supports: false}
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [504, 627], note: "Pass 3 surge: eta(KC) renewal law, sgn(U) dipole over 64 mirror phases, KC sweep and reef KC estimates; <sqrt Pe(t)>/sqrt Pe_max = 0.763 (no enhancement)", supports: true}
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [642, 870], note: "Pass 3 reduced 3D corallum: cone profile, label volume with theca/columella/pali/septa/dissepiments/synapticulae, sections and architecture ablation (kinematic, not accretive)", supports: true}
          - {file: morphoeval/lean/loops/Loop_074_coral_calice_septa_insertion.lean, lines: [157, 248], note: "New Lean theorems: cone_radius/active_cycle/cumulative septa monotone, turbinate_corallum_septal_cycles_monotone (6/12/24/48 fronts), oscillatory_surge_dipole_cancellation, surge_mean_of_mirror_phases_zero", supports: true}
      specimen-match:
        value: 91
        rationale: >-
          The Pass 2 polar ridge segmentation (40 septa, 9.00 deg spacing, major/minor reach 1.4368) is
          retained and Pass 3 adds two genuinely new specimen measurements: the apical angle fitted on the
          side-profile panel (36.66 deg, r = 0.993, Wells trochoid; the README had already called the corallum
          'costate trochoid'), and an Otsu calice skeletal area fraction (0.532) compared with the 3D rim
          (0.493). Deductions: the septal thickness used in the 3D model is calibrated from the same specimen it
          is then compared to, so the rim-area check is only partly independent (-3); the costae count (15 vs
          ~20 expected) is an under-counting detector on an oblique view and is reported as a lower bound (-2);
          the model's 48 rim septa vs the specimen's 40 (incomplete S4) remains unresolved from Pass 2 (-3);
          the side view has no pixel scale, so only angles and counts are usable (-1).
        evidence:
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [873, 930], note: "segment_caryophyllia_corallum_profile: per-row half-width cone fit on side-view rows 400-660 -> apical angle 36.66 deg, Wells class, visible costae count", supports: true}
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [963, 1087], note: "otsu_threshold + segment_caryophyllia_specimen: 40 septa, 9.00 deg, reach 1.4368, Otsu area fraction 0.532 and 0.80 R septal duty cycle (sets t_s = 0.277 mm; circular w.r.t. the rim-area check)", supports: true}
          - {file: datasets/coral_calice_septa_insertion/corallum3d_surge_reference.json, lines: [52, 61], note: "side_view_rows_px, cone-fit method, expected trochoid class and the caveat that costae are undercounted on the oblique view", supports: true}
          - {file: docs/media/coral_calice_septa_insertion_corallum3d.png, lines: [0, 0], note: "8-panel figure: 3D cutaway, tangential sections, transverse sections at the 6/12/24/48 fronts, specimen side-profile fit, septa-vs-z with Wells classes, volume budget vs specimen area fraction", supports: true}
          - {file: docs/media/coral_calice_septa_insertion_comparison.png, lines: [0, 0], note: "Panel E specimen segmentation overlay retained (v3 title); panel titles overlap at fontsize 9.6", supports: true}
      parameter-expressivity:
        value: 93
        rationale: >-
          Pass 3 adds three independent control axes with visible morphological consequences: the apical angle
          across the four Wells classes (changes corallum height and the z-positions of the insertion fronts),
          the endothecal architecture ablation (caryophylliid / dissepimented / synapticulate at identical outer
