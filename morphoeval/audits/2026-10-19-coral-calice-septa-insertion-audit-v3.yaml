        evidence:
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [136, 146], note: "Wells (1956) apical-angle classes, CORALLUM_ARCHITECTURES and KC renewal constants", supports: true}
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [583, 623], note: "evaluate_keulegan_carpenter_sweep over KC in {0.5..200} + dense scan, KC_50 numeric vs analytic; reef_keulegan_carpenter_number", supports: true}
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [859, 870], note: "evaluate_corallum_architectures: three-architecture ablation at identical outer geometry", supports: true}
          - {file: 2013-thomas-coral-calice-septa-insertion.py, lines: [2011, 2052], note: "CLI: --self-test, --skip-gif, --skip-pass3, --R-mm, --lambda-s-mm, --Pe, --apical-angle-deg, --septum-thickness-mm; --seed accepted but unused (L2021)", supports: true}
      morphometric-validation:
        value: 86
        rationale: >-
          16 reference-anchored measurements now: the 9 Pass 2 entries plus 7 Pass 3 entries, of which four are
          real external or specimen comparisons (apical angle 36.66 vs Wells trochoid 40 deg; costae 15 vs 20;
          3D rim area fraction 0.493 vs specimen Otsu 0.532; KC_50 numeric 4.350 vs analytic 4.355) and two are
          exact-symmetry checks (3 insertion fronts; <A_1> = 1e-16 vs 0). Deductions, most of them defects v2
          did not price: the 7-species r reference 0.9985, the Pe-sweep r reference 0.9990 and the specimen
          reach-ratio reference 1.4368 are self-referential or hand-set (the reach ratio reference equals the
          measured value and was copied into the reference JSON), and the new dissepiment volume increment
