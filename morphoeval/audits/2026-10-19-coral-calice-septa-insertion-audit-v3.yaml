        rationale: >-
          The four SHA-256-pinned files are untouched and still verified fail-closed at runtime; Pass 3 adds
          `corallum3d_surge_reference.json` in which EVERY row carries a provenance tag (`specimen`, `model`, or
          `recalled offline: ...`) and `pass3_citations.bib` with the five new sources, and the dataset README
