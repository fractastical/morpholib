          (quadrupole saturates, dipole stays zero), alongside the retained R, lambda_s and Pe sweeps and the
          7-species table. New CLI flags `--apical-angle-deg`, `--septum-thickness-mm`, `--skip-pass3`, and
          `--Pe` now also drives the surge figure. Deductions: `--seed` is a documented no-op (-2); the
          dissepiment/synapticula spacings and thicknesses are not CLI-exposed and are fixed model constants
