    summary: >-
      Pass 2 sets r = Dv/Du = 10 so the saturated FFT wavelength is 106.93 µm
      against analytic k_c = 104.9 µm (relative error 0.019). Dispersion
      Pearson r = 0.9999 and RMSE = 0.0050 on probe modes 10–20. Equal
      diffusion (r = 1) has max growth -0.0989. Tiktaalik (375 Ma) cross-ray
      growth is -0.621 (pattern off); its along-ray wavelength is 100.11 µm.
      Ichthyostega (363 Ma, Dv × 0.92) sits at 105.54 µm. Brussels skull
      foreground 0.557, coherency 0.527, circularity 0.330, orientation KS
      against the RD field 0.137. GIF 640×480, 12 frames; last frame is the
      fossil so the fitness crop has a real specimen target.
    claim_boundary:
      reported_in_source:
        - "Acanthostega has eight digits and Ichthyostega seven (Coates & Clack 1990)."
        - "Tiktaalik has lepidotrichia and no digits (Daeschler, Shubin & Jenkins 2006)."
        - "Turing 1952 critical wavenumber; Schnakenberg 1979 kinetics; Murray 1981 wavelength selection."
        - "Dermal ornament is present on the Acanthostega skull (Porro, Rayfield & Clack 2015) at a coarser scale than 105 µm."
      reconstructed_in_script:
        - "Du = 110.73 µm²/time so analytic lambda_c = 104.9 µm at r = 10, a = 0.05, b = 1."
        - "Fin-ray anisotropy alpha = 3.4 and Ichthyostega Dv factor 0.92."
        - "One digit corridor reconstructed as 4200 µm (40 wavelengths)."
      transfer_boundary:
        - "The 105 µm target is the campaign primordium tier for this slot, applied with the Turing law, not a published melanosome measurement on MGUH or NHMD material."
      does_not_claim:
        - "That fossil melanosomes of Acanthostega were measured at 105 µm."
        - "That the Schnakenberg field is a pixel-wise reconstruction of the Brussels skull. The GIF terminus is the photograph; the ocellus panel is the model."
        - "That alpha = 3.4 or the 0.92 factor is a caliper measurement."
    scores:
      model-fidelity:
        value: 88
        rationale: "The code integrates the Schnakenberg PDE, the Jacobian at u0 = a+b, and k_c^2 = (Dv fu + Du gv)/(2 Du Dv). Analytic lambda is 104.9000 µm. 1D Euler growth rates match analytic sigma with Pearson r = 0.9999. Du is calibrated to the assigned tier rather than fitted to a fossil measurement, which caps the score."
        evidence:
          - {file: models/2026-delphi10000-acanthostega-gunnari-turing-wavelength-s0.py, lines: [98, 144], note: "kinetics, critical_k2, sigma_analytic", supports: true}
