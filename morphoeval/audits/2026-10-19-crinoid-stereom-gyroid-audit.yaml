simulations:
  - id: gorzelak-crinoid-stereom-gyroid
    name: "Yang et al. (2022) & Donnay & Pawson (1969) biogenic single-crystal calcite TPMS echinoderm stereom (Diamond D, Gyroid G, Primitive P) & Gibson-Ashby cellular mechanics"
    organism: "Protoreaster nodosus (Asteroidea) & Metacrinus rotundus / Nesometra integra (Crinoidea) / Cidaris rugosa (Echinoidea)"
    script: 2020-gorzelak-crinoid-stereom-gyroid.py
    output: docs/media/crinoid_stereom_gyroid_comparison.png
    extra_outputs:
      - docs/media/crinoid_stereom_gyroid_growth.gif
    status: evaluated
    source_refs:
      - yang2022
      - donnay1969
      - schoen1970
      - gibson1997
    summary: >-
      Pass 1 (v1) baseline evaluation of `2020-gorzelak-crinoid-stereom-gyroid.py`
      (consensus score 52.4/100). The v1 script evaluates only a 2D slice of the Schoen
      Gyroid level set and a 1D Gibson–Ashby stiffness curve, omitting 3D voxel and
      implicit-surface mean/Gaussian curvature computation across Schwarz Diamond (D),
      Schoen Gyroid (G), Schwarz Primitive (P), and disordered Cahn–Hilliard spinodal
      stereom, omitting level-set threshold c in [-0.8, 0.8] solid fraction & Euler
      characteristic chi topological analysis, omitting [111] vs [100] crystallographic
      projection bands and edge dislocations, omitting 12-species cross-taxa Echinodermata
      validation, and failing to load or segment the vendored crinoid ossicle stereom SEM
      specimen image.
    scores:
      model-fidelity:
        value: 54
        rationale: >-
          Evaluates a 2D slice of Schoen Gyroid F_G(x,y,z) and a 1D Gibson–Ashby scaling
          curve (L29-55), but lacks 3D TPMS voxel and implicit-surface differential geometry
          (mean curvature H = 0 and Gaussian curvature K = -kappa_1^2 <= 0) across Diamond D,
          Gyroid G, Primitive P, and stochastic spinodal stereom, omits super-threshold
          pinch-off ablation (c = 1.35), and omits crystallographic [111] vs [100] projections.
        evidence:
          - {file: 2020-gorzelak-crinoid-stereom-gyroid.py, lines: [29, 55], note: "2D Gyroid slice and 1D Gibson-Ashby curve without 3D TPMS curvature, topology, or Diamond/Primitive families", supports: false}
      specimen-match:
        value: 24
        rationale: >-
          Renders a 2-panel synthetic plot (L58-82) without loading, SHA-256-verifying,
          or segmenting the vendored crinoid ossicle stereom SEM micrograph plate
          (`datasets/crinoid_stereom_gyroid/crinoid_stereom_ossicle_specimen.jpg`).
        evidence:
          - {file: 2020-gorzelak-crinoid-stereom-gyroid.py, lines: [58, 82], note: "2-panel synthetic plot with zero biological stereom SEM segmentation", supports: false}
          - {file: docs/media/crinoid_stereom_gyroid_comparison.png, lines: [0, 0], note: "Pass 1 2-panel synthetic plot lacking crinoid stereom SEM overlay", supports: false}
      parameter-expressivity:
        value: 44
        rationale: >-
          Hardcodes fixed grid size and slice position (L29-55) with no CLI parameter
          overrides, no sweep across level-set threshold c in [-0.8, 0.8], and no comparison
          across the 5 stereom TPMS and ablation regimes.
        evidence:
          - {file: 2020-gorzelak-crinoid-stereom-gyroid.py, lines: [29, 55], note: "Hardcoded parameters without CLI overrides or level-set threshold c sweep", supports: false}
      morphometric-validation:
        value: 50
        rationale: >-
          Reports only 3 analytical scalars in `measure_morphoeval()` (L103-135) without
          validating 3D mean/Gaussian curvature, Euler characteristic chi, 12-species
          cross-taxa Echinodermata stereom stiffness and lattice period, or empirical SEM
          pore/trabecular period segmentation.
        evidence:
          - {file: 2020-gorzelak-crinoid-stereom-gyroid.py, lines: [103, 135], note: "Only 3 analytical metrics without 3D curvature, 12-species cross-taxa, or SEM specimen validation", supports: false}
      source-traceability:
        value: 64
        rationale: >-
          Reference dataset `datasets/crinoid_stereom_gyroid/crinoid_stereom_gyroid_reference.json`
          and crinoid stereom SEM specimen exist on disk, but v1 does not load or verify
          their SHA-256 digests at runtime.
        evidence:
          - {file: 2020-gorzelak-crinoid-stereom-gyroid.py, lines: [1, 28], note: "No runtime loading or SHA-256 verification of datasets/crinoid_stereom_gyroid/", supports: false}
      code-traceability:
        value: 62
        rationale: >-
          Module docstring cites Yang et al. (2022) and Donnay & Pawson (1969), but functions
          lack explicit mappings to published equations and to the 4 Lean 4 theorems in
          `morphoeval/lean/loops/Loop_079_crinoid_stereom_gyroid.lean`.
        evidence:
          - {file: 2020-gorzelak-crinoid-stereom-gyroid.py, lines: [29, 55], note: "Functions lack explicit paper equation and Lean 4 theorem cross-references", supports: false}
      repro-package:
        value: 70
        rationale: >-
          Includes `--self-test` (L138-146), but checks only 3 basic assertions without
          testing SHA-256 dataset provenance, JSON parity, 3D minimal-surface curvature
          H = 0, pinch-off ablation, or bitwise two-run determinism.
        evidence:
          - {file: 2020-gorzelak-crinoid-stereom-gyroid.py, lines: [138, 146], note: "Minimal 3-check self_test() without SHA-256 provenance or 3D determinism checks", supports: false}
    remediation:
      - "Implement full 3D voxel and implicit-surface differential geometry (`evaluate_tpms_3d_unit_cell`) across all 5 stereom regimes: (1) Schwarz Diamond D (Z=4 tetrahedral nodes at 109.4712 deg), (2) Schoen Gyroid G (Z=3 chiral trigonal nodes at 120 deg), (3) Schwarz Primitive P (Z=6 orthogonal cubic nodes at 90 deg), (4) stochastic Cahn–Hilliard spinodal labyrinthic stereom control, and (5) super-threshold pinch-off ablation control (c = 1.35 -> loss of bicontinuity)."
      - "Compute 3D implicit-surface mean curvature H and Gaussian curvature K = kappa_1*kappa_2 <= 0 on the zero level set, sweep level-set threshold c in [-0.8, 0.8] to verify odd inversion symmetry phi(0) = 0.5000 and topological genus / Euler characteristic chi = -4, model crystallographic [111] vs [100] projection bands and edge dislocations, and validate Gibson–Ashby stretching (phi^1) vs bending (phi^2) stiffness across all 12 Echinodermata species in `crinoid_stereom_gyroid_reference.json`."
      - "Load and SHA-256-verify `datasets/crinoid_stereom_gyroid/` at runtime and perform Difference-of-Gaussians pore and trabecular lattice segmentation (`segment_crinoid_stereom_specimen`) on `crinoid_stereom_ossicle_specimen.jpg`, measuring Panel K solid fraction (0.5187 vs 0.5000), nearest-neighbor pore distance (14.25 px), and trabecular lattice period a_0 (14.80 um = 19.67 px)."
      - "Expose full CLI parameter overrides (`--a0`, `--c-thresh`, `--e-calcite`, `--n-grid`, `--seed`, `--skip-gif`), upgrade `self_test()` to an 8-point verification suite with bitwise two-run determinism, and render a 6-panel publication-grade synthesis figure and co-evolving 2-panel 3D TPMS level-set & curvature GIF."
