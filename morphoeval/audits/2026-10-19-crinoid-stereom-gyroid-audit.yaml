# MorphoEval audit — Yang et al. (2022) Science & Donnay & Pawson (1969) Science Biogenic Single-Crystal Calcite TPMS Echinoderm Stereom, 2026-10-19 (v1)
#
# Dual-agent Pass 1 assessment of `2020-gorzelak-crinoid-stereom-gyroid.py` (v1, 162 lines)
# prior to Step 12 closed-loop remediation (`2026-10-19-crinoid-stereom-gyroid-loop`):
#   - Primary assessor: Gemini 4 Argon — 55.2 / 100
#   - Independent second assessor rubric check — 49.6 / 100
#   - Pass 1 consensus score: 52.4 / 100
#
# Concrete Pass 1 weaknesses flagged for Step 12 remediation:
#   1. Only a 2D slice of the Schoen Gyroid and a 1D Gibson–Ashby curve are evaluated
#      (L29-55): omits full 3D voxel & implicit surface differential geometry (mean
#      curvature H and Gaussian curvature K = kappa_1*kappa_2 <= 0) across Schwarz
#      Diamond (D, Z=4), Schoen Gyroid (G, Z=3), Schwarz Primitive (P, Z=6), and a
#      disordered Cahn–Hilliard spinodal labyrinthic stereom control, omits level-set
#      threshold c in [-0.8, 0.8] volume fraction & topological Euler characteristic
#      chi / genus g analysis and super-threshold pinch-off ablation (c = 1.35), and
#      omits crystallographic [111] vs [100] projection band and dislocation analysis.
#   2. Zero biological specimen comparison (`specimen-match: 24`): the vendored CC BY 4.0
#      crinoid ossicle stereom SEM micrograph plate (`datasets/crinoid_stereom_gyroid/crinoid_stereom_ossicle_specimen.jpg`)
#      is not loaded, SHA-256-verified, or segmented in v1.
#   3. No cross-taxa validation across the 12 empirical Asteroidea, Crinoidea, Echinoidea,
#      and Ophiuroidea species in `datasets/crinoid_stereom_gyroid/crinoid_stereom_gyroid_reference.json`.
#   4. Hardcodes fixed parameters without CLI overrides (`--a0`, `--c-thresh`, `--e-calcite`,
#      `--n-grid`, `--seed`, `--skip-gif`) or multi-regime morphospace evaluation.

