simulations:
  - id: thompson1917-t1917-054
    name: "Thompson (1917) Figs. 388-393: Archaeopteryx -> Apatornis pelvis by equidistant coordinate-grid interpolation"
    organism: "Archaeopteryx lithographica and Apatornis celer (pelvis, left lateral; Heilmann restorations after Marsh 1880)"
    script: thompson/claims/t1917-054_on-the-theory-of-transformations.py
    output: docs/media/t1917_054_on_the_theory_of_transformatio_comparison.png
    extra_outputs:
      - docs/media/t1917_054_on_the_theory_of_transformatio_growth.gif
      - datasets/thompson_1917/t1917-054/result.json
    status: evaluated
    source_refs: [thompson1917, bookstein1989, gower1975, deeming2018, clarke2004]
    summary: >-
      Pass 1 (v1).  Segments the five wash silhouettes of Fig. 393 from the SHA-256-pinned
      Internet Archive page scan (Otsu 139, opening, five components of 63-80 kpx), finds the
      acetabulum and the four process tips automatically, places 4 x 24 arc-length semilandmarks,
      runs GPA, fits the Archaeopteryx -> Apatornis grid as a thin-plate spline (E4) with an
      affine-only control (E5), and generates Thompson's equidistant stages phi_t (E2/E6).
      Heilmann's drawn intermediates sit at t* = 0.263 / 0.529 / 0.824 (nominal 0.25 / 0.5 / 0.75;
      max residual 0.074); the interpolated prediction is closer to each drawn stage (Procrustes
      0.134 / 0.121 / 0.093) than the nearest endpoint (0.214 / 0.312 / 0.145) and than the affine
      interpolation (0.162 / 0.199 / 0.293).  Centroid sizes 2190 / 2171 / 2158 / 2309 / 2325 px are
      not monotone (the series is not drawn to the grid's scale).  Part B ("biologically real") is
      untestable: no landmark data for intermediate taxa; Dryad k1v34cf is a variable mismatch.
      Verdict in result.json: mixed (A supported, B untestable).  Overall 68.8/100.
    claim_boundary:
      reported_in_source:
        - "Fig. 388 Archaeopteryx pelvis in Cartesian coordinates; Fig. 389 Apatornis pelvis in a transformed grid (p. 757)"
        - "three intermediate and equidistant coordinate systems interpolated between them (p. 759, Fig. 390)"
        - "a pelvis outline inscribed in each interpolated system (Figs. 391-392) and the five-form series (Fig. 393)"
        - "the intermediates are 'hypothetical types' / 'transitional stages' (pp. 757, 759)"
      reconstructed_in_script:
        - "the grid phi as a thin-plate spline on automatically detected landmarks + arc-length semilandmarks (Fig. 389's grid lines are not digitised)"
        - "the stage parameter t and the statistics t*, Procrustes distances, descriptors"
        - "segmentation of the wash drawings (Otsu, opening/closing) and the tip classification rule"
      transfer_boundary:
        - "the registered claim's 'biologically real intermediate forms' goes beyond Thompson's 'hypothetical types'; tested only against Heilmann's own drawn intermediates"
      does_not_claim:
        - "that the interpolated pelves match any real intermediate Mesozoic bird (part B untestable here)"
        - "any phylogenetic position for Apatornis beyond Clarke (2004)"
        - "that Heilmann's Fig. 393 series is drawn to one scale (it is not: centroid size is non-monotone)"
    scores:
      model-fidelity:
        value: 74
        rationale: >-
          E2/E6 (equidistant interpolation), E4 (TPS), E5 (affine interpolation M_t) and E7 (t*)
          are implemented exactly as stated in the reference JSON and mirrored by 11 Lean theorems
          (endpoints/equidistance, similarity equivariance, no-fold, t* soundness, affine
          determinants).  Deduction: Thompson's actual Fig. 389 grid is not digitised; phi is
          reconstructed from silhouette correspondences, and the no-fold condition (E1, det > 0)
          is proved in Lean but not checked numerically on the fitted TPS.
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [307, 366], note: "tps_fit/tps_apply (E4), affine_fit/affine_interp_matrix (E5), interp_stage (E2/E6), best_fit_t (E7)", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_054.lean, lines: [24, 180], note: "interp4, interpDet; 11 theorems compile under Lean 4.35.0 with 0 sorry", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [409, 425], note: "phi fitted on consensus-frame configurations, not on Thompson's drawn grid lines; no Jacobian check", supports: false}
      specimen-match:
        value: 66
        rationale: >-
          The output is compared side by side with the source author's own figures: Figs. 388/389
          crops, the segmented Fig. 393 with landmarks, and each predicted stage overlaid on
          Heilmann's drawn stage.  The predicted outlines are visibly intermediate and distinct per
          stage.  Deductions: the stage panels are cramped (grid padding dwarfs the form); the real
          Archaeopteryx fossil photograph is vendored but not analysed; Apatornis is represented by
          a synsacrum plate only.
        evidence:
          - {file: docs/media/t1917_054_on_the_theory_of_transformatio_comparison.png, lines: [0, 0], note: "Figs. 388/389 crops, segmented Fig. 393, three predicted-vs-drawn overlays, t*/distance panel", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [498, 577], note: "render_comparison: predicted stage with interpolated grid vs Procrustes-aligned drawn stage", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [498, 577], note: "no analysis of archaeopteryx_lithographica_berlin_specimen_mfn.jpg; panels small", supports: false}
      parameter-expressivity:
        value: 46
        rationale: >-
          t visibly and monotonically moves the form from Archaeopteryx to Apatornis (GIF, 33
          frames) and the pubis angle rises 131 -> 162 deg along the drawn series.  --n-semi and
          --lam exist on the CLI but no sweep is run or reported, and the TPS-vs-affine family
          switch is exercised only at the default setting.
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [580, 613], note: "render_growth_gif sweeps t over 33 frames with the deforming grid", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [762, 777], note: "--n-semi / --lam exposed but not swept; single default run only", supports: false}
      morphometric-validation:
        value: 56
        rationale: >-
          Quantitative morphometrics are computed on the output and compared with the source's
          claim: t* vs nominal stages, Procrustes distance of the prediction vs two controls
          (nearest endpoint, affine interpolation), descriptors (pubis/ischium angles, pre/post
          acetabular ratio, centroid size).  Missing: correspondence-free statistics (IoU, boundary
          RMSE), Pearson r between predicted and drawn coordinates, any null distribution or
          permutation p-value, and uncertainty from the digitisation (semilandmark density).
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [427, 470], note: "per-stage Procrustes distances vs endpoints and affine control; t* and equidistance residual; descriptors", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [665, 708], note: "measure_morphoeval returns 8 measurements, 5 with reference values", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [427, 470], note: "no IoU / RMSE / r / KS, no permutation null", supports: false}
      source-traceability:
        value: 88
        rationale: >-
          All seven inputs are SHA-256 pinned in the reference JSON and re-verified at runtime
          (fail closed); the IA item, leaf-to-page rule, Commons file pages, authors and licences
          are recorded; DOIs for Bookstein, Gower, Deeming & Mayr, Clarke are in the .bib; the
          pre-scouted Dryad dataset is recorded with its mismatch reason.  Deduction: Thompson 1917
          itself has no DOI (IA URL only) and the Dryad file could not be fetched.
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [128, 141], note: "verify_inputs: SHA-256 of every pinned input, raises on mismatch", supports: true}
          - {file: datasets/thompson_1917/t1917-054/scout_manifest.json, lines: [0, 0], note: "IA pins, Commons pins with licences, Dryad mismatch record, OpenAlex hits", supports: true}
          - {file: datasets/thompson_1917/t1917-054/paper_citations.bib, lines: [1, 95], note: "9 references with DOIs where they exist", supports: true}
      code-traceability:
        value: 82
        rationale: >-
          The module docstring maps E1-E7 to named functions, quotes the source passages, and
          names the Lean mirror; each function docstring cites its equation; the KG YAML pins
          lean_locus and code_locus per law.  Deduction: code_locus entries in the KG YAML name
          functions rather than line ranges.
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [1, 80], note: "docstring: claim, source quotes, E1-E7 -> function map, claim boundary", supports: true}
          - {file: morphoeval/math_kg_loops/thompson1917-t1917-054.yaml, lines: [1, 120], note: "5 laws with lean_theorem, lean_locus, code_locus", supports: true}
      repro-package:
        value: 76
        rationale: >-
          Deterministic (no stochastic step; two-run equality asserted), seed constant declared,
          fail-closed input hashes, 10-check self-test in 1.4 s, full run 3.8 s, documented
          invocation, outputs to declared paths.  Deductions: dependency versions pinned only via
          requirements.txt lower bounds; the comparison PNG is git-ignored by repo policy so a
          reviewer must re-render it.
        evidence:
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [711, 759], note: "self_test: hashes, E2/E4/E5/E7 unit checks, segmentation areas, t* ordering, control comparison, determinism", supports: true}
          - {file: thompson/claims/t1917-054_on-the-theory-of-transformations.py, lines: [762, 781], note: "CLI: --self-test, --n-semi, --lam, --no-gif", supports: true}
    needs:
      - id: N1
        need_type: parameter_sweep
        target_dimension: parameter-expressivity
        description: "Sweep semilandmark density (8..48) and TPS lambda; report stability of t* and of the prediction/endpoint ratio"
        status: open
      - id: N2
        need_type: morphometric_validation
        target_dimension: morphometric-validation
        description: "Correspondence-free IoU and boundary RMSE, Pearson r of predicted vs drawn coordinates, shuffled-stage permutation null, KS test of residual distributions"
        status: open
      - id: N3
        need_type: specimen_comparison
        target_dimension: specimen-match
        description: "CV segmentation of the Berlin Archaeopteryx photograph (bone vs matrix) and a larger predicted-vs-drawn figure"
        status: open
      - id: N4
        need_type: model_equation
        target_dimension: model-fidelity
        description: "Numerical no-fold (Jacobian determinant) check of phi_t on the 9 x 8 grid at every stage, mirroring Lean interp_no_fold"
        status: open
      - id: N5
        need_type: independent_assessor
        target_dimension: model-fidelity
        description: "Independent second assessor from a different provider"
        status: open
    remediation:
      - id: R1
        item: "Independent second assessor (different provider) — this round is builder-scored"
      - id: R2
        item: "Parameter-regime sweep over n_semi in {8, 12, 16, 24, 32, 48} and lambda in {0, 1e-3, 1e-2, 1e-1}; report t* and distance ratios per setting"
      - id: R3
        item: "Negative/null controls: shuffled-stage permutation (all 3! pairings) and a random-correspondence null; report p-values"
      - id: R4
        item: "Correspondence-free goodness of fit: IoU of superimposed filled outlines and symmetric boundary RMSE; Pearson r and RMSE of predicted vs drawn coordinates; KS test of per-landmark residuals vs endpoint-control residuals"
      - id: R5
        item: "Jacobian no-fold check of the TPS grid at t = 0..1 (min det over the 9 x 8 grid)"
      - id: R6
        item: "Bone-vs-matrix colour segmentation of the Berlin Archaeopteryx specimen as a labelled, non-verdict CV pass; enlarge the predicted-vs-drawn panels"
