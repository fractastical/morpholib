# MorphoEval audit — Thompson (1917) Ch. XVII Figs. 388-393, Archaeopteryx -> Apatornis pelvis
# by equidistant grid interpolation (T1917-054, slot 243), 2026-10-28 — Pass 1 (v1)
#
# Single-assessor Pass 1 of `thompson/claims/t1917-054_on-the-theory-of-transformations.py` (781 lines).
# LIMITATION: builder and assessor are the same agent (Claude Fable 5.1); no independent second
# assessor.  This audit should not be quoted as dual-agent consensus (remediation R1).
#
# Headline (Pass 1): the five Fig. 393 silhouettes are segmented and landmarked automatically; the
# equidistant interpolation phi_t = (1-t) id + t phi (TPS on acetabulum + 96 semilandmarks) places
# Heilmann's three drawn intermediates at t* = 0.263 / 0.529 / 0.824 (nominal 0.25 / 0.50 / 0.75,
# max residual 0.074 on a path of Procrustes length 0.583), and the interpolated prediction is closer
# to each drawn stage (0.134 / 0.121 / 0.093) than the nearest endpoint (0.214 / 0.312 / 0.145) and
# than an affine-only interpolation (0.162 / 0.199 / 0.293).  Part B of the registered claim
# ("biologically real") is untestable with the pinned data and the pre-scouted Dryad dataset is a
# variable mismatch; the script says so rather than fitting an analogue.
# Weaknesses to remediate in Pass 2: no parameter-regime sweep, no permutation/shuffled-stage null,
# no correspondence-free fit statistic (IoU / boundary RMSE), no Pearson r / KS statistics, no
# Jacobian (no-fold) check of the interpolated grids, no CV pass on the real specimen photograph,
# cramped comparison figure.

