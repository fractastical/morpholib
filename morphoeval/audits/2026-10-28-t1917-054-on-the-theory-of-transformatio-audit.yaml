    note: >-
      Pass 1 of the 12-step loop 2026-10-28-t1917-054-on-the-theory-of-transformatio-loop
      (branch cursor/t1917-054-archaeopteryx-pelvis-01ab).  Self-test 10/10 in 1.4 s; full run
      3.8 s.  The comparison PNG is regenerated by the script and is git-ignored by repo policy
      (docs/media/*.png); the GIF is tracked.

