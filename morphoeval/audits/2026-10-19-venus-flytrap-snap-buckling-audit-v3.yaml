# MorphoEval audit — Forterre, Skotheim, Dumais & Mahadevan (2005) Nature Venus Flytrap Snap-Buckling, 2026-10-19 (v3)
#
# Pass 3 re-score of `2005-forterre-venus-flytrap-snap-buckling.py` (2028 lines) and
# `datasets/venus_flytrap_snap_buckling/` after the remediation of the single open v2 item in the
# instrumented loop `morphoeval/runs/2026-10-19-venus-flytrap-snap-buckling-loop-pass3`, superseding
# `2026-10-19-venus-flytrap-snap-buckling-audit-v2` (94.0, Gemini 4 Argon).
#   - Primary assessor: Claude Fable 5.1 (Phase B subagent; scored from the Phase A handoff
#     evidence, `git diff` of the script / Lean file, and line-pinned reads of the current files).
#
# What Pass 3 changed (the one v2 remediation item — closed as an honest REDUCED model, Section 3b):
#   1. Trigger-hair FLYC1/MscS-like Boltzmann mechanotransduction (0-D): `trigger_hair_open_probability`
#      L703-710, `trigger_hair_receptor_potential` L712-716, `analytic_point_threshold_force_uN` L718-722.
#   2. P1 finite-element FitzHugh-Nagumo action potential on the lobe planform: `build_lobe_fem_mesh`
#      L737-761 (2057 nodes / 3949 elements), `assemble_p1_fem` L778-796, IMEX solver
#      `simulate_fem_action_potential` L798-873; validated against the exact Nagumo front speed
#      sqrt(2D/tau_v)(1/2-a) (strip 9.55 vs 9.80 cm/s, 2.5 % error; v ~ D^0.496; monotone h-convergence).
#   3. Two-touch Ca2+ counting memory and lumped-area gate A(t) on the Pass 2 shell solver:
#      `simulate_touch_protocol_coupled_snap` L993-1067, `evaluate_touch_counting_protocols` L1074-1100
#      (one touch -> no snap; Delta = 10 s -> snap, latency 354 ms; memory window bracket (20, 25) s vs
#      analytic 24.8 s).
#   4. Figure 3x3 (Panels G/H/I), new GIF `venus_flytrap_snap_buckling_ap_wave.gif`, 8 new measurements
#      (17 total), self-test 8 -> 12 suites, 2 new Lean theorems (5 laws, 0 sorrys), new SHA-pinned
#      `trigger_hair_ap_reference.json`, 8 new bib entries (DOIs recalled offline, unverified).
#
# Why the overall score goes DOWN (94.0 -> 80.4) despite closing the item: the v2 scores credited
# Pearson r = 1.0000 / RMSE = 0.0000 agreements that are circular (the `*_obs` columns of
# `venus_flytrap_snap_buckling_reference.json` are outputs of the same analytic/ODE model), credited
# specimen "reference values" that are the script's own recorded outputs, and did not penalise the
# inconsistent energy functionals between `relax_shell_equilibrium_2d` and the dynamics, the dead CLI
# flags, or the unsourced motor constants. Pass 3 adds a genuinely verified FEM component but the new
# literature anchors are `literature-approx` recalled offline, so the honest re-score is lower.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to
# the working-tree files at checkpoint de27b685 (uncommitted Pass 3 remediation diff on top of it).

