simulations:
  - id: forterre-venus-flytrap-snap-buckling
    name: "Forterre et al. (2005) Nature Doubly-Curved Shallow Shell Elastic Energy & Saddle-Node Cusp Catastrophe in Dionaea muscipula, coupled to a P1-FEM trigger-hair action potential and Ca2+ counting gate"
    organism: "Dionaea muscipula (Venus flytrap bilobed leaf trap)"
    script: 2005-forterre-venus-flytrap-snap-buckling.py
    output: docs/media/venus_flytrap_snap_buckling_comparison.png
    extra_outputs:
      - docs/media/venus_flytrap_snap_buckling_growth.gif
      - docs/media/venus_flytrap_snap_buckling_ap_wave.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-venus-flytrap-snap-buckling-audit-v2
    source_refs:
      - forterre2005
      - skotheim2005
      - forterre2013
      - sachse2020
      - hedrich2018
      - bohm2016
      - suda2020
      - scherzer2019
      - procko2021
      - volkov2008
      - hodick1988
      - mckean1970
    claim_boundary:
      reported_in_source:
        - "Forterre et al. (2005): the Dionaea lobe is a doubly-curved shallow shell whose stretching-bending coupling alpha = L^4 kappa^2/h^2 produces a bistable snap-through (cusp catastrophe) once alpha exceeds a threshold; closure takes ~100 ms, far faster than the poroelastic limit; curvature-relief strip cutting abolishes snapping"
        - "Hedrich & Neher (2018), Böhm et al. (2016), Suda et al. (2020): two trigger-hair touches within ~30 s (two action potentials, a Ca2+ threshold) are required to close the trap; Hodick & Sievers (1988) / Volkov et al. (2008): the lobe AP propagates at cm/s speeds with ~1-2 s duration (values conflict between sources)"
        - "Scherzer et al. (2019), Procko et al. (2021): trigger hairs are micronewton mechanosensors with the stretch-activated channel FLYC1"
      reconstructed_in_script:
        - "2D doubly-curved shallow shell energy U(kappa_x, kappa_y) with Gauss stretching penalty, L-BFGS-B equilibrium relaxation, cusp fold metrics and RK45 inertial + poroelastic snap dynamics across alpha in [0.2, 5.0] (Pass 2)"
        - "Boltzmann trigger-hair open probability -> receptor potential clamp on hair-footprint nodes -> P1-FEM IMEX FitzHugh-Nagumo action potential on a flat Delaunay lobe planform (2057 nodes), validated against the exact Nagumo front speed; per-node Ca2+ integrator with two-touch counting; lumped activated-area fraction A(t) gating the active rest curvature of the shell solver (Pass 3)"
      transfer_boundary:
        - "The electrical problem is solved on a FLAT 2D planform mesh, not on the curved mid-surface, and the FEM does not see kappa(t); the motor response is a scalar gate A(t) on a two-mode shell, not a spatially resolved turgor field"
        - "AP_DIFFUSIVITY_CM2_S, AP_TAU_V_S, TRIGGER_HAIR_F_HALF_UN, CA_INCREMENT_PER_AP and CA_DECAY_TAU_S are model constants chosen so that the analytic speed, threshold and memory window land in the recalled literature ranges; agreement in measurements 14 and 17 is therefore parameter-driven, only the FEM-load elevation above the 0-D threshold (liminal ratio 1.55) is emergent"
        - "The `*_obs` columns of venus_flytrap_snap_buckling_reference.json are generated by the same model, so measurements 3-6 (r = 1.0000) are self-consistency checks, not comparisons with Forterre et al. (2005) data"
      does_not_claim:
        - "Hodgkin-Huxley-type Ca2+/Cl-/K+ channel kinetics, a trigger-hair lever/podium FEM, mechanical feedback from shell curvature onto the electrics, digitised Forterre (2005) Fig. 2-3 time series, or online-verified DOIs for the 8 electrophysiology references added in Pass 3"
    summary: >-
      Pass 3 (v3) evaluation of `2005-forterre-venus-flytrap-snap-buckling.py` (overall weighted
      score 80.4/100, down from 94.0 in v2). The Pass 2 remediation item is closed as an honest
      reduced model: a Boltzmann trigger-hair mechanotransducer initiates a P1 finite-element
      FitzHugh-Nagumo action potential on the lobe planform (planar front 9.55 vs exact Nagumo
      9.80 cm/s, v ~ D^0.496, monotone h-convergence), a per-node Ca2+ counter implements the
      two-touch memory (analytic window 24.8 s bracketed by the sweep in (20, 25) s) and the
      activated-area fraction gates the Pass 2 shell solver (one touch -> no snap, two touches
      at 10 s -> snap with 354 ms latency). The score falls because the v2 credit for r = 1.0000
      agreements was for model-vs-model comparisons (`*_obs` columns generated by the same
      analytics), the specimen "reference values" are self-recorded, the L-BFGS-B relaxation
      minimises a different functional from the dynamics, `--L`, `--h`, `--seed` are dead flags,
      the motor constants have no provenance, and the 8 new DOIs/literature values were recalled
      offline and are flagged `literature-approx` rather than digitised.
    scores:
      model-fidelity:
        value: 82
        rationale: >-
          The Pass 2 shell model is intact: shallow-shell energy with Gauss stretching penalty
          (`gauss_stretching_energy` L231-244, `doubly_curved_shell_energy` L246-263), cusp fold
          metrics (L334-370) and RK45 coupled snap dynamics (`simulate_coupled_snap_dynamics`
          L373-451). Pass 3 adds a genuine, verified reduced electrophysiology layer: P1 FEM
          assembly (grad-grad stiffness + lumped mass, L778-796), IMEX FitzHugh-Nagumo solver with
          implicit diffusion via `splu` (L798-873), planar front speed within 2.5 % of the exact
          Nagumo formula (L725-731) and the two-touch Ca2+ gate on the rest curvature (L993-1067),
          backed by 5 Lean 4 theorems (0 sorrys). Deductions: `relax_shell_equilibrium_2d`
          minimises `((kx+ky)/2)^2 - k_init^2)^2` (L300, L307) while the energy/gradient/dynamics
          use the Gauss product `(kx*ky - k_init^2)^2` — two different functionals, and its
          `barrier_energy` (L330) is the closed-form cusp expression, not derived from the
          minimisation (-6); the electrics are solved on a flat planform with no curvature feedback
          and FitzHugh-Nagumo stands in for the multi-channel Ca2+/Cl-/K+ AP (-5); the motor
          response is a scalar gate A(t) on a two-mode shell, not a turgor/curvature field (-4);
          the 0-D hair mechanics has no lever/podium geometry (-3).
        evidence:
          - {file: 2005-forterre-venus-flytrap-snap-buckling.py, lines: [231, 281], note: "Gauss stretching penalty, shell energy and analytic gradient use (kx*ky - k_init^2)^2", supports: true}
          - {file: 2005-forterre-venus-flytrap-snap-buckling.py, lines: [282, 333], note: "relax_shell_equilibrium_2d minimises a mean-curvature functional ((kx+ky)/2)^2 at L300/L307 — inconsistent with the dynamics; barrier_energy at L330 is closed-form", supports: false}
          - {file: 2005-forterre-venus-flytrap-snap-buckling.py, lines: [373, 451], note: "Coupled 2D (kappa_x(t), kappa_y(t)) poroelastic + inertial RK45 snap solver (Pass 2, unchanged)", supports: true}
          - {file: 2005-forterre-venus-flytrap-snap-buckling.py, lines: [703, 731], note: "Boltzmann trigger-hair open probability, receptor potential, 0-D point threshold and exact Nagumo front speed sqrt(2D/tau_v)(1/2 - a)", supports: true}
          - {file: 2005-forterre-venus-flytrap-snap-buckling.py, lines: [737, 873], note: "Delaunay lobe/strip meshes, P1 stiffness + lumped mass assembly, IMEX FitzHugh-Nagumo FEM action potential with receptor-potential clamp on hair-footprint nodes; flat planform, no kappa(t) feedback", supports: true}
          - {file: 2005-forterre-venus-flytrap-snap-buckling.py, lines: [993, 1067], note: "Per-node Ca2+ counter and lumped activated-area fraction A(t) gating kappa_x0 in the Pass 2 shell solver", supports: true}
          - {file: morphoeval/lean/loops/Loop_066_venus_flytrap_snap_buckling.lean, lines: [130, 184], note: "Laws 4-5: forterre_two_touch_calcium_counting (L133-150) and forterre_calcium_gated_rest_curvature (L169-184); file verifies with 0 sorrys", supports: true}
      specimen-match:
        value: 80
        rationale: >-
          The SHA-256-pinned CC BY-SA 2.5 Dionaea specimen is segmented into anthocyanin inner
          lobes, midrib hinge (x = 453 px) and 15 marginal cilia teeth (`segment_dionaea_trap_specimen`
          L1104-1185) and shown in Panel F; the new Panel G renders the FEM arrival-time map on the
          same ellipse planform as the bilobed mesh with the three hair positions, and the lobe
          conduction velocity 8.35 cm/s falls inside the recalled 6-20 cm/s range. Deductions: the
          3D trap geometry of Panel A (`build_bilobed_trap_mesh` L1187-1214) is an illustrative
          parametrisation (0.42*kx+0.12, 0.22, 0.28, 0.18) not derived from the shell energy (-6);
