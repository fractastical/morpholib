    remediation:
    - >-
      2005-forterre-venus-flytrap-snap-buckling.py:737-761, 798-873, 993-1067 — the electrics are solved on a flat
      Delaunay planform with FitzHugh-Nagumo kinetics and the motor response is a scalar activated-area gate A(t)
      on the two-mode shell. Solve the AP on the curved mid-surface (Laplace-Beltrami on the bilobed mesh of
      L1187-1214), replace FHN with a Hodgkin-Huxley-type Ca2+/Cl-/K+ channel model (Hedrich & Neher 2018), and let
      Ca2+ drive a spatially resolved turgor/rest-curvature field rather than a scalar gate.
    - >-
      2005-forterre-venus-flytrap-snap-buckling.py:282-333 vs 246-281 — `relax_shell_equilibrium_2d` minimises
      ((kx+ky)/2)^2 - k_init^2)^2 (L300, L307) while `doubly_curved_shell_energy`/`_gradient` and the dynamics use
      the Gauss product (kx*ky - k_init^2)^2; its `barrier_energy` (L330) is the closed-form cusp formula. Make the
      relaxation minimise the same functional as the dynamics and derive the barrier from the saddle of that
      minimisation.
    - >-
      datasets/venus_flytrap_snap_buckling/venus_flytrap_snap_buckling_reference.json `*_obs` columns and
      2005-forterre-venus-flytrap-snap-buckling.py:1316, 1722-1791 — the alpha sweep, three-stage time series and
      developmental table are outputs of the same model (r = 1.0000 by construction) yet Panel C labels them
      "Forterre et al. (2005) ref", and specimen measurements 8-9 use self-recorded reference values 0.9745 / 0.3905.
      Replace with digitised Forterre (2005) Fig. 2-3 values (with provenance) and drop or relabel the
      self-referential specimen reference values.
    - >-
      datasets/venus_flytrap_snap_buckling/paper_citations.bib:48-141 and trigger_hair_ap_reference.json — all 8 new
      DOIs and every numeric literature value were recalled offline (`DOI unverified offline (Pass 3)`,
