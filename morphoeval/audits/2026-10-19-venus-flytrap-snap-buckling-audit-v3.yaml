          - {file: 2005-forterre-venus-flytrap-snap-buckling.py, lines: [1187, 1214], note: "build_bilobed_trap_mesh uses illustrative shape factors (0.42*kx+0.12, 0.22, 0.28, 0.18) not derived from the energy", supports: false}
          - {file: 2005-forterre-venus-flytrap-snap-buckling.py, lines: [1425, 1455], note: "Panel G: FEM arrival-time map + mesh + hair footprints on the lobe planform", supports: true}
          - {file: 2005-forterre-venus-flytrap-snap-buckling.py, lines: [1772, 1790], note: "Specimen measurements 8-9 use reference_value 0.9745 / 0.3905 = the script's own earlier outputs", supports: false}
          - {file: docs/media/venus_flytrap_snap_buckling_comparison.png, lines: [0, 0], note: "9-panel figure: shell meshes, pitchfork, 3-stage kinematics, cusp diagram, scaling/ablation, specimen segmentation, FEM arrival map, one- vs two-touch traces, memory sweep", supports: true}
          - {file: docs/media/venus_flytrap_snap_buckling_ap_wave.gif, lines: [0, 0], note: "23-frame AP front crossing the lobe followed by the Ca2+-gated snap", supports: true}
