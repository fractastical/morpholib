    claim_boundary:
      reported_in_source:
      - Turing (1952) critical wavenumber from the dispersion relation
      - Within-feather pigment bars and spots are a reaction-diffusion pattern (Prum & Williamson 2002)
      - Barb-ridge spacing is an activator-inhibitor process (Harris et al. 2005)
      - Confuciusornis sanctus is a beaked pygostylian with ribbon rectrices and preserved feather pigment
      reconstructed_in_script:
      - Schnakenberg parameters chosen so analytic λ_c = 143.4 µm on an 8-mode periodic collar
      - Du sweep from 0.28 to 0.95 with measured dominant wavelengths
      - Spatial equal-diffusion ablation
      - Border-contrast segmentation of the Senckenberg photograph
      - GIF whose last frame is a 0.90/0.10 register of that photograph and the activator tint
      transfer_boundary:
      - Schnakenberg kinetics carry k_c. They are not a parameter table from Prum, Harris, or Hou.
      - 143.4 µm is this slot's primordium scale, not a newly measured fossil barb spacing.
      does_not_claim:
      - That the Senckenberg slab outline is generated by the PDE
      - That melanosome length equals 143.4 µm
      - A radiometric re-dating of the Yixian Formation
