simulations:
  - id: delphi10000-ammonia-beccarii-turing-wavelength-s0
    name: "Ammonia beccarii Turing wavelength at 31 µm, Holocene 0 Ma"
    organism: "Ammonia beccarii (benthic foraminifer)"
    script: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py
    output: docs/media/ammonia_beccarii_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/ammonia_beccarii_turing_wavelength_s0_growth.gif
      - datasets/ammonia_beccarii_turing_wavelength_s0/ammonia_beccarii_turing_wavelength_s0_metrics.json
    status: evaluated
    source_refs:
      - turing1952
      - schnakenberg1979
      - hayward2004
      - schoenfeld2021
      - petersen2016
      - subba2023
      - hillewaert2012
    summary: >-
      Schnakenberg reaction-diffusion on a 600 µm periodic face. γ is solved so
      the linear critical wavelength is 31.37 µm (3.137e-05 m, log10 −4.503),
      the 31 µm detail tier. Dv/Du = 10.4 keeps the unstable band at 26.9–39.1 µm.
      The pore diameter 0.564 µm and the whole-test mode 600 µm fall outside that
      band. Chronoseries Ammonia 1/1 at 0 Ma has no other age. A six-point γ sweep
      tracks λ with Pearson r = 0.995. The linearised Fourier monodromy matches
      σ(k) at r = 1.000. The Hillewaert CC BY-SA plate is segmented (6 tests) and
      the activator is grown inside those tests across 12 frames at 720×540.
      Bounding-box diameters average 770 µm against the caption's ~600 µm.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and critical wavenumber"
        - "Schnakenberg 1979 kinetics"
        - "Hillewaert 2012 caption diameter ~600 µm, 500 µm scale bar, CC BY-SA 4.0 plate"
        - "Subba & Ghosh 2023 pore diameter 0.564 µm and pore density 0.155 µm⁻² for Ammonia cf. beccarii"
        - "Petersen et al. 2016 pore frame of 562 µm²"
        - "Hayward et al. 2004 and Schönfeld et al. 2021 limits on the name A. beccarii"
      reconstructed_in_script:
        - "γ chosen so linear λ_c = 31.37 µm"
        - "Dv = 10.4 µm²/τ narrow band"
        - "Nonlinear field, γ sweep, equal-diffusion control, γ = 0 ablation"
        - "Segmentation of the plate and mapping of the field onto each test"
      transfer_boundary:
        - "Pigment-stripe / ocellus cohort language is transferred onto calcite pustule spacing"
        - "AFM pore numbers are Ammonia cf. beccarii, not the photographed North Sea individuals"
        - "31.37 µm is the Delphi detail-scale assignment, not a spacing tabulated for this species"
      does_not_claim:
        - "That Ammonia beccarii has pigment ocelli"
        - "That 31.37 µm equals the pore diameter"
        - "That a predecessor or successor chronospecies exists in this 1/1 series"
        - "That the species-gallery Caryophyllia file is Ammonia"
        - "That the North Sea photograph is a sequenced Adriatic type"
    scores:
      model-fidelity:
        value: 88
        rationale: >-
          The script implements the Schnakenberg steady state, Jacobian, Turing
          inequality, critical wavenumber k_c² = γ (Dv f_u + Du g_v) / (2 Du Dv),
          and λ_c = 2π/k_c, with γ solved so λ_c = 31.37 µm. The linearised
          Fourier monodromy matches analytical σ at Pearson r = 0.9999997
          (RMSE about 2.5e-5 /τ after rounding in the sidecar). Equal diffusion gives σ(k_c) = −0.055. Four Lean
          theorems encode the margin, the 19-wavelength count, the pore/detail/test
          ordering, and the Holocene terminal; they were not kernel-checked
          because Lean 4 is not installed. The kinetics are Schnakenberg's, not
          a foraminiferal calcification law.
        evidence:
          - {file: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py, lines: [1, 36], note: "docstring states the PDE, k_c, λ_c = 31.37 µm, and the 0 Ma chronoseries", supports: true}
          - {file: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py, lines: [93, 157], note: "Jacobian, γ(λ), σ(k²), and the unstable-band edges", supports: true}
          - {file: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py, lines: [159, 214], note: "monodromy comparison of numerical and analytical σ(k)", supports: true}
          - {file: morphoeval/lean/loops/Loop_3108_ammonia_beccarii_turing_wavelength_s0.lean, lines: [14, 44], note: "four theorems, 0 sorry; not executed in this environment", supports: true}
      specimen-match:
        value: 82
        rationale: >-
          The growth GIF's last frame is the Hillewaert plate with the simulated
          activator grown inside the six segmented tests. Computer-vision
          similarity of that frame against the photograph is 92.2 (12-bin Sobel
          orientation, radial FFT, structure-tensor coherency, occupancy). The
          shells, black background, rose-bengal individual, and 500 µm bar are
          the photograph. The spot lattice is the model, not a resolved natural
          pustule field: pores at 0.564 µm are below this plate's sampling.
        evidence:
          - {file: docs/media/ammonia_beccarii_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "plate, patterned plate, 600 µm face, and dispersion curve side by side", supports: true}
          - {file: docs/media/ammonia_beccarii_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 720×540, pattern amplitude rising inside the tests", supports: true}
          - {file: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py, lines: [441, 460], note: "render_gif modulates only the segmented shell mask", supports: true}
      parameter-expressivity:
        value: 86
        rationale: >-
          γ factors 0.70–1.80 move the predicted wavelength from 37.5 to 23.4 µm
          and the measured FFT wavelength from 38.7 to 23.0 µm (Pearson r = 0.995,
          RMSE 0.94 µm), in the direction λ ∝ γ^(−1/2). Setting Dv = Du yields
          σ(k_c) < 0. Setting γ = 0 drops the noise standard deviation to 0.12 of
          its initial value. a and b are fixed, not swept.
        evidence:
          - {file: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py, lines: [282, 327], note: "wavelength_sweep and ablation_controls", supports: true}
          - {file: datasets/ammonia_beccarii_turing_wavelength_s0/ammonia_beccarii_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "sweep predicted_um, measured_um, controls", supports: true}
      morphometric-validation:
        value: 84
        rationale: >-
          Linear σ matches the monodromy at r = 0.9999997. The γ sweep matches
          at r = 0.995 (RMSE 0.94 µm). The 160² saturated FFT peak is 32.88 µm
          against the linear target 31.37 µm (4.8% longer; not a copy of the
          reference). Spot-spacing CV is 0.14 and the KS distance to
          Normal(31.37 µm, band half-width) is 0.27. The plate yields 6 tests.
          Bounding-box diameters average 769.7 µm against the caption ~600 µm
          (reference 600, value not equal). Foreground fraction 0.420 versus
          the full-resolution signature 0.440. Coherency at σ = 1.6 px is 0.576
          versus 0.487 at σ = 2.8 px. The diameter offset is the open gap.
        evidence:
          - {file: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py, lines: [329, 430], note: "segment_specimen: scale bar, bounding-box diameters, coherency", supports: true}
          - {file: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py, lines: [637, 750], note: "measure_morphoeval references differ from measured values", supports: true}
          - {file: datasets/ammonia_beccarii_turing_wavelength_s0/ammonia_beccarii_turing_wavelength_s0_reference.json, lines: [0, 0], note: "literature pore diameter, density, caption diameter, and claim boundary", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Turing 1952, Schnakenberg 1979, Hayward 2004, Schönfeld 2021,
          Petersen 2016, and Subba & Ghosh 2023 were resolved on the Crossref
          API. The specimen file is SHA-256 c15a90be…, CC BY-SA 4.0, Hans
