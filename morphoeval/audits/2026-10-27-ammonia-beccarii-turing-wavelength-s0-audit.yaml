        evidence:
          - {file: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py, lines: [600, 635], note: "self-test assertions", supports: true}
          - {file: datasets/ammonia_beccarii_turing_wavelength_s0/README.md, lines: [1, 38], note: "scale 31 µm and age 0 Ma, and the two invocation lines", supports: true}
