          Deduction: AFM pores are Ammonia cf. beccarii, not these six tests.
        evidence:
          - {file: datasets/ammonia_beccarii_turing_wavelength_s0/paper_citations.bib, lines: [1, 84], note: "seven bibliographic records with DOIs or the Commons URL", supports: true}
          - {file: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py, lines: [53, 91], note: "EXPECTED_SHA256 and verify_sha256", supports: true}
          - {file: datasets/ammonia_beccarii_turing_wavelength_s0/scout_manifest.json, lines: [0, 0], note: "slot 3108 fallback after campaign KeyError, chosen specimen, collision false", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          jacobian, sigma_of_k2, gamma_for_wavelength, linear_mode_check,
          simulate_field, wavelength_sweep, and ablation_controls each implement
          one stated equation. The Lean module cites the same integer encodings
