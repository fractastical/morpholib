        evidence:
          - {file: models/2026-delphi10000-ammonia-beccarii-turing-wavelength-s0.py, lines: [100, 157], note: "γ solver and σ(k²) sit under the equation names", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-ammonia-beccarii-turing-wavelength-s0.yaml, lines: [1, 71], note: "four laws with Lean and code loci", supports: true}
      repro-package:
        value: 86
        rationale: >-
          Seed 3108, pinned SHA-256 inputs, --self-test (dispersion r > 0.98,
          sweep r > 0.98, band membership, age 0, chronoseries 1/1, GIF
          ≥ 10 frames and ≥ 480 px). The pass-1 run printed PASS with
