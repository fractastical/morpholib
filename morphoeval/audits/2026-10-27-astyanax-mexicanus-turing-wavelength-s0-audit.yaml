simulations:
  - id: delphi10000-astyanax-mexicanus-turing-wavelength-s0
    name: "Turing wavenumber at 666 nm in the Astyanax cave morph"
    organism: "Astyanax mexicanus (Holocene cave morph, 0 Ma)"
    script: models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py
    output: docs/media/astyanax_mexicanus_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/astyanax_mexicanus_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, murray1981, jeffery2009, yamamoto2004, protas2006, gross2009, mccauley2004, yoshizawa2010]
    summary: >-
      Pass 1. Schnakenberg reaction-diffusion on a periodic 72 by 112 patch,
      with Du:Dv = 2:20 and gamma = 1, calibrated so the fastest linear mode
      has wavelength 6.656e-7 m (666 nm nominal, Holocene cave morph, 0 Ma).
      Forward-Euler integration of the linear Fourier-mode ODE matches the
      closed-form growth rate at Pearson r = 0.99997 (RMSE 0.00455, 11 modes).
      The nonlinear patch selects 660.7 nm. The cave-morph voucher
      (CC BY-SA 4.0, Seb Morič) is masked and used as a visualization carrier;
      the photograph cannot resolve 666 nm. sigma(k=0) = -0.1, so the
      homogeneous state is stable. No diffusion-ratio sweep, no Du = Dv
      ablation in the reported metrics, and no flank KS comparison yet.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) derived diffusion-driven instability and a critical wavenumber. Schnakenberg (1979) gave the two-species kinetics. Murray (1981) applied the wavelength idea to animal coat markings."
        - "Cavefish pigment loss is genetic: oca2 albinism (Protas et al. 2006) and mc1r depigmentation (Gross et al. 2009). Pigment-cell regression is a late melanogenesis step (McCauley, Hixon and Jeffery 2004)."
        - "Eye degeneration is Hedgehog-dependent lens apoptosis (Yamamoto, Stock and Jeffery 2004). Neuromast expansion is a lateral-line phenotype tied to feeding behavior (Yoshizawa et al. 2010). Jeffery (2009) reviews both."
      reconstructed_in_script:
        - "The 6.656e-7 m wavelength is the loop-card scale, not a length reported by those papers. The script places the fastest linear mode on that length by the metres-per-pixel calibration."
        - "Pass-1 numbers: dispersion Pearson r = 0.99997, RMSE = 0.00455, nonlinear wavelength 660.7 nm, body melanin-dark fraction 0.002 on the voucher, scale ratio 36.33 against the 24 µm sibling."
      transfer_boundary:
        - "The composite GIF paints the subcellular patch onto a whole-body photograph. That is a visualization, not evidence that the voucher resolves 666 nm, and it does not transfer to surface-fish stripe spacing."
      does_not_claim:
        - "Does not claim that optic-cup degeneration or neuromast expansion are outputs of k_c."
        - "Does not claim a cavefish morphogen pair has been identified. Schnakenberg kinetics are a minimal carrier."
        - "Does not claim the chronoseries has a fossil predecessor. The series is the single Holocene cave morph at 0 Ma."
    scores:
      model-fidelity:
        value: 82
        rationale: "The script integrates Schnakenberg kinetics with a Fourier pseudo-spectral step and compares growth rates to the eigenvalue of gamma*J - k^2 D. Parameters are chosen so the fastest mode sits on the card wavelength; they are not fitted to a cavefish time series. Eye and neuromast pathways are excluded from the state vector, which matches the claim boundary."
        evidence:
          - {file: models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py, lines: [85, 96], note: "dispersion_eigenvalue implements sigma(k)", supports: true}
          - {file: models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py, lines: [164, 188], note: "periodic pseudo-spectral Schnakenberg step", supports: true}
      specimen-match:
        value: 74
        rationale: "The GIF is a 12-frame, 960x522 animation on the real cave-morph photograph. At overlay beta 0.42 the patch reads as flank mottling, and the fish silhouette is the voucher. The match is carried by that silhouette. A 666 nm mode is below the optical resolution of the photograph, so the panel cannot be a literal specimen of the wavelength."
        evidence:
          - {file: docs/media/astyanax_mexicanus_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame growth GIF, min side 522 px", supports: true}
          - {file: models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py, lines: [258, 310], note: "specimen mask and beta-ramped composite", supports: true}
      parameter-expressivity:
        value: 58
        rationale: "Du, Dv, gamma and beta are single values. The fastest-mode calibration shows that the spatial unit controls the reported wavelength, but pass 1 does not sweep the diffusion ratio or show that lambda moves monotonically. Expressivity is stated, not exercised."
        evidence:
          - {file: models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py, lines: [49, 73], note: "single Du, Dv, gamma, beta and the 6.656e-7 m constant", supports: true}
      morphometric-validation:
        value: 76
        rationale: "Eleven Fourier modes give Pearson r = 0.99997 and RMSE = 0.00455 against the analytical growth rate. The nonlinear radial peak is 660.7 nm against the 665.6 nm linear calibration (about 0.7 percent low). sigma(0) = -0.1. The voucher melanin-dark fraction is 0.002, against an Oca2-null reference of 0. No KS test and no ablation metric are in the pass-1 table."
        evidence:
          - {file: models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py, lines: [111, 162], note: "forward-Euler dispersion goodness of fit", supports: true}
          - {file: models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py, lines: [353, 410], note: "measure_morphoeval metrics, references differ from values", supports: true}
      source-traceability:
        value: 88
        rationale: "Crossref-checked DOIs for Turing, Schnakenberg, Murray, Jeffery, Yamamoto, Protas, Gross, McCauley and Yoshizawa. The voucher is Seb Morič's CC BY-SA 4.0 Commons photograph, SHA-256 pinned. OpenAlex supplied Bilandžija et al. 2013 as an additional oca2 paper. The 666 nm length itself has no paper measurement."
        evidence:
          - {file: datasets/astyanax_mexicanus_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "Turing, Schnakenberg, Murray, Kondo DOIs", supports: true}
          - {file: datasets/astyanax_mexicanus_turing_wavelength_s0/README.md, lines: [1, 48], note: "scale 6.656e-7 m, age 0 Ma, specimen credit", supports: true}
      code-traceability:
        value: 80
        rationale: "dispersion_eigenvalue, the pseudo-spectral step, and the Lean theorems (trace, determinant, drive, discriminant, equal-diffusivity failure, wavenumber bracket, 36-37x sibling ratio) point at the same integer Jacobian. The composite helper still contains an unused resampled buffer."
        evidence:
          - {file: morphoeval/lean/loops/Loop_3125_astyanax_mexicanus_turing_wavelength_s0.lean, lines: [21, 41], note: "five decidable Turing inequalities, zero sorry", supports: true}
          - {file: models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py, lines: [105, 108], note: "metres per pixel set from k_max and 6.656e-7 m", supports: true}
      repro-package:
        value: 84
        rationale: "python3 models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py --self-test passes. Seed 3125, specimen SHA-256 checked before integration, outputs written to fixed paths. Dependencies are the repo scientific stack (numpy, scipy, Pillow, matplotlib). No second machine was used."
        evidence:
          - {file: models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py, lines: [77, 82], note: "specimen SHA-256 gate", supports: true}
          - {file: models/2026-delphi10000-astyanax-mexicanus-turing-wavelength-s0.py, lines: [451, 461], note: "self-test asserts r>0.98, wavelength, frames, size, age, lambda", supports: true}
    remediation:
      - id: R1
        item: "Sweep the diffusion ratio Dv/Du and show that the selected wavelength moves monotonically. Pass 1 renders a single (Du, Dv, gamma)."
      - id: R2
        item: "Add the Du = Dv ablation and report that the maximum growth rate is negative, matching the Lean equal-diffusivity theorem."
      - id: R3
        item: "Segment the voucher flank and compare its orientation histogram to the simulated patch with a KS statistic. The pass-1 melanin fraction is a threshold count, not a distributional test."
      - id: R4
        item: "Drop the unused resampled buffer in compose_frame and keep the signed-field composite as the only render path."
