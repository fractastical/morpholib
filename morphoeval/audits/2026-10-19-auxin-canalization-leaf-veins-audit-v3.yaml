# MorphoEval Pass 3 (v3) Audit — Mitchison (1980, 1981) Proc. R. Soc. B / Phil. Trans. R. Soc. B & Feugier et al. (2005)
# With-the-Flux Auxin Canalization, Vein Concentration Drainage, Wound Bypass & Leaf Venation, 2026-10-20 (v3)
#
# Pass 3 remediation-round re-score of `1997-mitchison-canalization-auxin-flux.py` (Slot 034) in the instrumented
# loop `morphoeval/runs/2026-10-19-auxin-canalization-leaf-veins-loop-pass3`, superseding
# `2026-10-19-auxin-canalization-leaf-veins-audit-v2` (92.8).
#
# What Pass 3 changed (the single v2 remediation item, closed in a reduced, honestly-labelled form):
#   1. "Couple the 2D PIN1 carrier-allocated venation solver to a growing finite-element leaf blade mesh to
#      simulate the spatiotemporal order of higher-order areole subdivision" -> a genuinely SOLVED Mitchison (1980)
#      facilitated-diffusion canalization model (`HexCanalizationLattice`, L736-879) on a hexagonal cell lattice
#      that divides 12x11 -> 24x22 -> 48x44 over three growth stages with wall-conductance inheritance
#      (`refine_hex_lattice`, L881-913; `simulate_growing_lamina_venation`, L950-1034). It records vein order
#      (stage of first canalization), the nesting of new strands inside pre-existing panels (0.81, 0.77), vein
#      density per stage, strand orientation, the emergent S_vein/S_par (0.67) and the sink mass balance (0.98).
#      NOT a finite-element mesh; NOT polar PIN1 allocation (the polar prototype produced circulating vortices
#      under growth and was not shipped); and NO loop closure: beta_1 = 0 at every stage for both the reversible
#      solver and the irreversible-differentiation ablation, so quaternary areole subdivision is NOT reproduced.
#   2. The same engine now SOLVES the Sachs (1981) incision bypass (`simulate_sachs_wound_bypass_dynamic`,
#      L1037-1139): sink intake 0.991 (incised) vs 0.609 (alpha = 0, NPA) vs 0.988 (intact); 6-cell lateral
#      deflection past the incision tip. Pass 2 had hard-coded 0.9852 / 0.0804 (still at L408-409).
#   3. measure_morphoeval 9 -> 16 measurements; self-test 8 -> 12 checks; 3 new Lean 4 theorems (0 sorrys);
#      2 new SHA-256-pinned dataset files; 5 new DOI references.
#
# Why the overall score goes DOWN (92.8 -> 70.1): building a real solver exposed that most of what v2 scored as
# "simulated" is prescribed or hand-drawn and that v2's references were often the script's own constants:
#   - `simulate_2d_lamina_canalization` (L243-335) writes analytic Gaussian D/S fields with a hard-coded dip
#     ratio 0.6895 (L295) chosen so that S_vein/S_par = 0.3131 matches the JSON "reference" 0.31; the solved
#     lamina gives 0.67, i.e. the v2 "Law 2 validation" was circular.
#   - `simulate_mitchison_exponent_sweep` special-cases p = 1.4 with eff_beta = 0.1766 (L158) to land on the
#     reference winner share 0.892, and the 12-column D/S profiles (L170-198) are formulas, not solutions.
#   - `simulate_sachs_wound_bypass` (L338-414) is a Gaussian centreline plus constants 0.9852 / 0.0804.
#   - `simulate_feugier_venation_topologies` (L446-548) draws two graphs by hand (V=16/E=15, V=28/E=41); no
#     Feugier et al. (2005) carrier dynamics are solved anywhere, so beta_1 = 14 is a drawing.
#   - The v2 CLI flags --alpha/--beta/--gamma/--exponent-p (L1868-1871) are parsed but never used.
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# working-tree files at commit d58a084 after the Pass 3 edits (the script is 1897 lines).

