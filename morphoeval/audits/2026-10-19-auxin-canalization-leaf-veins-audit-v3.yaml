simulations:
  - id: mitchison-canalization-auxin-flux
    name: "Mitchison (1980, 1981) & Feugier, Mochizuki & Iwasa (2005) with-the-flux auxin canalization: exponent bifurcation, growing hex-lamina canalization (solved), Sachs wound bypass (solved + prescribed), hand-drawn Feugier venation templates, and cleared-leaf specimen segmentation"
    organism: "Pisum sativum & Arabidopsis thaliana (dicot leaf lamina & stem vascular strands)"
    script: 1997-mitchison-canalization-auxin-flux.py
    output: docs/media/auxin_canalization_leaf_veins_comparison.png
    extra_outputs:
      - docs/media/auxin_canalization_leaf_veins_growing_lamina.png
      - docs/media/auxin_canalization_leaf_veins_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-auxin-canalization-leaf-veins-audit-v2
    claim_boundary:
      reported_in_source:
        - "Mitchison (1980) Proc. R. Soc. B 207:79-109: facilitated-diffusion canalization dD_ij/dt = alpha |phi_ij|^p + beta - gamma D_ij with phi_ij = D_ij (S_i - S_j); linear feedback gives diffuse flow, quadratic feedback gives winner-take-all 1-cell strands whose auxin concentration drops below the parenchyma (S_vein < S_par)"
        - "Mitchison (1981) Phil. Trans. R. Soc. B 295:461-471 & Sachs (1981) Adv. Bot. Res. 9:151-262: polar auxin transport canalization and C-shaped vascular bypass regeneration around a transverse stem incision"
        - "Feugier, Mochizuki & Iwasa (2005) J. Theor. Biol. 236:366-375: PIN1 carrier-allocation dynamics, open trees vs closed areoles; Feugier & Iwasa (2006) 243:235-244: canalization alone does not close loops"
        - "Scarpella et al. (2006) Genes Dev. 20:1015-1027 & Kang & Dengler (2004) Int. J. Plant Sci. 165:231-242: higher-order veins form progressively inside areoles bounded by lower-order veins"
      reconstructed_in_script:
        - "SOLVED (Pass 3): Mitchison (1980) facilitated-diffusion canalization with soft-saturating feedback alpha |phi|^2/(1+phi^2/phi_s^2) on a hexagonal cell lattice that divides 12x11 -> 24x22 -> 48x44 (75 -> 312 -> 1281 cells) with conductance inheritance; vein cells 7 -> 29 -> 155, nesting of new strands inside pre-existing panels 0.81 / 0.77, S_vein/S_par = 0.67 (emergent), sink intake / production 0.98, beta_1 = 0 at every stage (also 0 with the irreversible-differentiation ablation)"
        - "SOLVED (Pass 3): Sachs (1981) transverse incision on a 20x16 hex stem with a pre-established strand: sink intake 0.991 (incised, canalizing) vs 0.609 (alpha = 0 NPA control) vs 0.988 (intact), 6-cell lateral deflection; hop-count path ratio L_wounded/L_intact = 1.00 (metric insensitive to lateral deflection)"
        - "PRESCRIBED (Pass 2, retained and now labelled): 2-pathway exponent sweep p in {0.5, 1.0, 1.4, 2.0, 2.5} (the p = 1.4 point uses a special-cased eff_beta = 0.1766), analytic 12-column and 18x14 D/S profiles with hard-coded dip ratios (0.3105 / 0.6895), a Gaussian Sachs bypass centreline with constants 0.9852 / 0.0804, and two hand-drawn Feugier venation graphs (V=16/E=15 -> beta_1 = 0; V=28/E=41 -> beta_1 = 14)"
        - "Automated segmentation of the SHA-256-pinned cleared dicot leaf (primary midrib, secondary angle 52.93 +- 2.53 deg, 1843 closed areoles, vein areal coverage 0.416)"
      transfer_boundary:
        - "Hexagonal cellular lattice with isotropic 2x refinement stands in for a growing leaf blade; strand orientations are quantised to ~30/60/90 deg so the branch-angle comparison with the specimen (52.9 deg) is lattice-limited"
        - "Facilitated diffusion (Mitchison 1980) is solved; polar PIN1 carrier allocation (Mitchison 1981 / Feugier 2005) is only verified algebraically (Law 3) and the hand-drawn graphs are not its output"
        - "Reference values 1.38 / 0.985 / 0.08 (Sachs) and the exponent-regime table in the pinned reference JSON are not digitised from any figure; they are carried as qualitative benchmarks"
      does_not_claim:
        - "Loop closure / areole formation or quaternary areole subdivision (beta_1 = 0 in every solved configuration; the specimen has 1843 areoles)"
        - "A finite-element or measured growth field; 3D mechanical blade expansion; polar PIN1 dynamics on a growing domain"
    source_refs:
      - mitchison1980
      - mitchison1981
      - feugier2005
      - sachs1981
      - rollandlagan2005
      - feugier2006
      - scarpella2006
      - kang2004
      - runions2005
      - sack2013
    summary: >-
      Pass 3 (v3) evaluation of `1997-mitchison-canalization-auxin-flux.py` (overall 70.1/100, down from 92.8 in
      v2). The remediation added a genuinely solved Mitchison (1980) canalization model on a growing hexagonal
      cell lattice (three cell-division stages, conductance inheritance, 16 measurements, 12 self-test checks,
      3 new Lean 4 theorems) and a solved Sachs incision bypass with an alpha = 0 control. It reproduces the
      spatiotemporal order of vein formation in the weak sense that 77-81 % of newly canalized cells lie inside
      pre-existing intercostal panels and that vein order is stage-ordered, but it does NOT close loops
      (beta_1 = 0, specimen 1843 areoles), its solved network is a basal fan of lattice-aligned strands rather
      than a pinnate midrib with secondaries, its emergent S_vein/S_par (0.67) disagrees with the value v2
      prescribed (0.31), and its strand angles (26.8 +- 14.2 deg) miss the specimen (52.9 deg). Building the
      solver exposed that the Pass 2 "simulations" of lamina drainage, wound bypass and Feugier topologies are
      analytic profiles, constants and hand-drawn graphs tuned to the script's own reference JSON; these are now
      labelled PRESCRIBED / GRAPH TEMPLATE in `measure_morphoeval()` but remain in the figure and the measurement
      set, and the v2 CLI flags are parsed but unused. Rendering is deterministic and SHA-pinned.
    scores:
      model-fidelity:
        value: 72
        rationale: >-
          Credited: `HexCanalizationLattice.step` (L808-828) integrates the seed paper's Eq. 2-3 pair
          (dS = sigma - mu S - sum D (S_i - S_j); dD = alpha |phi|^p/(1 + (|phi|/phi_s)^p) + beta - gamma D) with
          a semi-implicit S update, wall re-symmetrisation and a documented saturation; `refine_hex_lattice`
          (L881-913) implements cell division with conductance inheritance; Law 2 drainage now EMERGES (0.67 < 1)
          instead of being written in; the saturation law is machine-checked in Lean (bounded + monotone). The
          Sachs incision is solved on the same engine with blocked walls (L1064-1075) and an alpha = 0 control.
          Deductions: the remediation item asked for polar PIN1 carrier allocation on a growing mesh and the
          shipped model is facilitated diffusion on a hex lattice (-6); `simulate_2d_lamina_canalization`
          (L243-335) and the 12-column profiles in `simulate_mitchison_exponent_sweep` (L170-198) are analytic
          constructions with hard-coded dip ratios 0.3105 / 0.6895 (L195, L295), and the p = 1.4 point uses a
          special-cased eff_beta = 0.1766 (L158) so the sweep is partly fitted to its own reference (-8);
          `simulate_sachs_wound_bypass` (L338-414) is a Gaussian centreline plus the constants 0.9852 / 0.0804
          (L408-409), still returned and plotted (-4); `simulate_feugier_venation_topologies` (L446-548) solves
          nothing - V/E/C are typed in (L493, L523) - so Law 3 has no dynamical realisation (-6); the solved
          growing lamina yields a basal fan of lattice-aligned strands (two stage-1 strands plus parallel
          secondaries, Panel C of the growing-lamina PNG) rather than a pinnate midrib, and no parameter study
          shows that the hexagonal anisotropy is not driving it (-4).
        evidence:
          - {file: 1997-mitchison-canalization-auxin-flux.py, lines: [736, 879], note: "HexCanalizationLattice: Mitchison (1980) Eqs. 2-3 solved on a hex lattice; semi-implicit S (L816), saturating feedback (L820), optional irreversibility (L824), enclosed-region (Betti-1) counter (L854-878)", supports: true}
          - {file: 1997-mitchison-canalization-auxin-flux.py, lines: [881, 1034], note: "refine_hex_lattice cell-division inheritance (same-parent walls take max of the parent's two wall conductances, L902-905) and simulate_growing_lamina_venation 3-stage driver with nesting / Betti-1 / angle / mass-balance records (L990-1020)", supports: true}
          - {file: 1997-mitchison-canalization-auxin-flux.py, lines: [243, 335], note: "simulate_2d_lamina_canalization writes D and S as Gaussian formulas; drainage fraction 0.6895 (L295) is a constant chosen to hit the 0.31 reference - not a solution of the model", supports: false}
          - {file: 1997-mitchison-canalization-auxin-flux.py, lines: [446, 548], note: "simulate_feugier_venation_topologies hand-draws two graphs; V_open/E_open (L493) and V_closed/E_closed (L523) are literals, no carrier dynamics are integrated", supports: false}
          - {file: morphoeval/lean/loops/Loop_034_auxin_canalization_leaf_veins.lean, lines: [120, 178], note: "Pass 3 theorems saturating_canalization_feedback_bounded (L131-146), saturating_canalization_feedback_monotone (L148-167), irreversible_differentiation_monotone (L176-178); lean exits 0, 0 sorrys", supports: true}
      specimen-match:
        value: 58
        rationale: >-
          Judged on the regenerated comparison PNG and the new growing-lamina PNG. Panels E/F still show the
          pinned cleared leaf with the tracked midrib, secondary-angle rays and 1843 segmented areoles, and the
          solved growing lamina (Panel D of the comparison PNG; A1-A3 and C of the growing-lamina PNG) is now an
