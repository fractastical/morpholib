    method: 1D periodic Schnakenberg, modes 2–12, log-amplitude slope versus σ(k_disc)
    note: RMSE = 0.00539; p = 4.694e-19; σ(k_c) = 0.0566
  - name: equal-diffusion ablation max growth rate versus operating Turing gap
    value: -0.56518
    unit: 1/time
