    claim_boundary:
      reported_in_source:
      - Turing (1952) gives the diffusion-driven instability and the critical wavenumber.
      - Schnakenberg (1979), Gierer & Meinhardt (1972), and Murray (1981) supply the kinetics and the pigment-prepattern
        reading.
      - Nogi et al. (2009) published the CC BY 2.5 regenerated Dugesia japonica plate. Kalininsky's iNaturalist
        photo 226612281 is CC BY 4.0.
      reconstructed_in_script:
      - κ = 0.15, R = 48, D_u solved for λ_c = 6.912 µm, spectral integrator, seed 3213.
      - Nonlinear radial-FFT wavelength, KS interior comparison, diffusion-ratio sweep, and equal-diffusion ablation.
      - Pale-body segmentation of the wild-type voucher.
      transfer_boundary:
      - Kondo (2009) is a fish pigment wave. Lapan & Reddien (2012) is Schmidtea eye regeneration. Herath & Lobo
        (2020) is planarian fission, not this wavelength.
      - Neither specimen plate is a calibrated 6.912 µm micrograph.
      does_not_claim:
      - Does not claim 6.912 µm was measured on this species. It is the slot's detail-scale operating point (6.912e-6
        m, log10 = -5.160), age 0 Ma.
      - Does not claim a fossil predecessor. Chronoseries 1/1.
      - Does not claim the brightness mask separates every worm on the Nogi plate.
