      - Equal-diffusion ablation ratio 45.76. Unstable diffusion ratios d = 12 to 40 give a strictly lengthening
        wavelength. D_u(117 µm)/D_u(5.13 µm) = 520.16 and D_u(114 µm)/D_u(5.13 µm) = 493.83 at age delta 0 Ma.
      - Specimen scale bar 111 px = 100 µm. Spiral-band ridge 67.57 µm, Otsu circularity 0.662, radial-spectrum
