      reported_in_source:
      - Turing (1952) dispersion relation and Schnakenberg (1979) kinetics a - u + u^2 v, b - u^2 v.
      - Edwards et al. (2007) document Hawaiian picture-wing patterns. Kambysellis et al. (1995) Current Biology
        5:1129 place the picture-wing radiation phylogenetically. Carson (1982) describes the newer-volcano radiation
        that includes Maui D. planitibia.
