    claim_boundary:
      reported_in_source:
      - 'Wolpert (1969): positional information read from a monotone morphogen gradient against thresholds gives
        size-invariant French-Flag proportions under linear source-sink diffusion; Crick (1970): synthesis-diffusion-degradation
        gives lambda = sqrt(D/k) and the positional-error law sigma_x = sigma_c / |dc/dx|'
      - 'Tickle, Summerbell & Wolpert (1975) and Tickle (1981): a posterior ZPA specifies wing digits 2-3-4; an
        anterior graft gives the mirror duplication 4-3-2-2-3-4, and the digit specified next to a weaker graft
        advances 2 -> 3 -> 4 with polarizing-cell number; Riddle et al. (1993): Shh mediates ZPA activity'
      - 'Saunders (1948) and Summerbell (1974): AER removal arrests outgrowth and truncates the limb at a level
        that is progressively more distal the later the excision; Summerbell, Lewis & Wolpert (1973): proximo-distal
        values are laid down by time spent in the distal progress zone'
      - 'Laufer et al. (1994) and Niswander et al. (1994): Shh in the ZPA and Fgf4 in the posterior AER maintain
        each other (Shh lost after AER removal, rescued by FGF4 bead; ectopic anterior Fgf4 after a ZPA graft);
        Crossley et al. (1996): Fgf8 is expressed along the whole ridge'
      - 'Ben-Zvi & Barkai (2010): an expander produced where morphogen is low scales the decay length with domain
        size'
      reconstructed_in_script:
      - 1D linear source-sink and SDD solvers (analytic + explicit PDE, RMSE 7.6e-6), 6-stage growth-scaling sweep
        with expansion-repression, 5-regime 1D ZPA suite (wild type, full / attenuated / weak anterior graft, ablation)
        read by a morphogen-valley digit rule, 400-trial Monte Carlo positional-error test, radial segmentation
        of the vendored 72 h embryo photograph
      - 'Pass 3: explicit 2D finite-difference solver for FGF and Shh on a growing paddle mask (dx = 12.5 um) with
        zero-flux boundaries, Michaelis-form Shh<->FGF feedback, AER-driven distal apposition growth, graft dose
        series, AER excision at five stages, ZPA ablation, a rectangle verification against the 1D cosh steady state,
        8 new reference-anchored measurements and 7 new Lean 4 theorems'
      transfer_boundary:
      - 'The 2D model is a reduced phenomenological coupling: the production rates s_F, s_S, feedback gain g_S and
        half-saturations K_S, K_FS, K_g are tuned so that wild-type FGF ~ 1 and L_final ~ 660 um, not taken from
        any paper; the developmental clock is compressed (12 h of model time spans HH18 -> HH28, ~5x faster than
        in ovo) while keeping tau_relax << tau_growth'
      - The paddle geometry is prescribed (fixed AP width 500 um, elliptical 150 um cap); the AER is the distal-facing
        rim row and the ZPA is the posterior-margin mesenchyme within 120 um of the rim by construction, so their
        positions are inputs, not emergent; new lattice rows appear with zero concentration (no proliferation field)
      - Digit identity is read from the instantaneous distal Shh concentration against the Pass 2 thresholds normalised
        to the wild-type peak; the proximo-distal segment is read from the truncation fraction of the wild-type
        length via a 1/3-2/3 trisection, and the Saunders / Summerbell comparison is to an ordinal stage -> segment
        summary (+/- 1 stage between studies), not to digitised truncation data
      - The specimen is a whole-egg 72 h embryo photograph whose radial area-vasculosa profile is used as a proxy
        gradient; no limb bud image or Shh / Fgf in situ is compared with the 2D output
      does_not_claim:
      - Digit condensation or Turing-type periodicity, temporal integration of Shh exposure (Harfe 2004), a dorsoventral
        axis or 3D geometry, measured growth curves of the chick wing bud, quantitative Fgf4 / Shh expression levels,
        or a mechanistic derivation of AER and ZPA position
