simulations:
  - id: painter-chemotactic-stripe-splitting
    name: "Painter, Maini & Othmer (1999) chemotactic stripe splitting & stripe-spot selection"
    organism: "Myxococcus xanthus & Dictyostelium discoideum chemotactic cell populations"
    script: 1999-painter-chemotactic-stripe-splitting.py
    output: docs/media/chemotactic_stripe_splitting_comparison.png
    extra_outputs:
      - docs/media/chemotactic_stripe_splitting_growth.gif
    status: evaluated
    source_refs:
      - painter1999
      - keller1970
      - myerscough1992
      - painter2011
    summary: >-
      Pass 1 baseline assessment of `1999-painter-chemotactic-stripe-splitting.py` (54.4/100).
      The initial script computes the analytical equal-diffusivity chemotactic bifurcation
      threshold chi_c = 4.5 and critical wavelength lambda_c = 4.4429, but uses a kinematic
      mode approximation rather than integrating the full nonlinear Keller-Segel-Painter PDE
      dn/dt = D_n Lap(n) - div(n chi(c) grad(c)) + r n (1 - n/n_0) and dc/dt = D_c Lap(c) +
      alpha n / (1 + beta n) - gamma c on a growing domain, lacks 2D stripe-vs-spot selection
      simulation, and lacks automated computer-vision segmentation of the vendored Myxococcus
      xanthus specimen (`chemotactic_pattern_specimen.jpg`).
    scores:
      model-fidelity:
        value: 56
        rationale: >-
          Computes the exact equal-diffusivity linear stability threshold chi_c = 4.5 and
          critical wavelength lambda_c = 4.4429 (L35-65), but Pass 1 approximates the 1D
          kymograph kinematically rather than solving the nonlinear coupled chemotactic-RD
          PDE system with conservative flux divergence div(n chi(c) grad(c)) and 2D
          stripe-vs-spot pattern selection.
        evidence:
          - {file: 1999-painter-chemotactic-stripe-splitting.py, lines: [35, 65], note: "Analytical equal-diffusivity chemotactic threshold chi_c and wavelength lambda_c", supports: true}
          - {file: 1999-painter-chemotactic-stripe-splitting.py, lines: [68, 86], note: "Kinematic 1D stripe approximation requiring replacement with full Keller-Segel PDE solver", supports: false}
      specimen-match:
        value: 48
        rationale: >-
          Displays `datasets/chemotactic_stripe_splitting/chemotactic_pattern_specimen.jpg`
          (CC BY-SA 4.0 Myxococcus xanthus rippling stripes and fruiting bodies), but Pass 1
          lacks automated computer-vision ridge wavelength extraction and fruiting-body spot
          segmentation on the specimen.
        evidence:
          - {file: 1999-painter-chemotactic-stripe-splitting.py, lines: [110, 125], note: "Raw specimen panel without CV ridge/spot segmentation", supports: false}
      parameter-expressivity:
        value: 52
        rationale: >-
          Evaluates chi = 6.0 vs chi_c = 4.5, but needs a full 5-regime domain-growth and
          subcritical-chemotaxis ablation table (s = 1, 2, 4, 8 and chi = 3.0 < chi_c), a 2D
          dispersion surface lambda(k^2, chi), and 2D stripe vs spot simulations.
        evidence:
          - {file: 1999-painter-chemotactic-stripe-splitting.py, lines: [68, 86], note: "Single-regime 1D run without 5-regime sweep or 2D stripe/spot comparison", supports: false}
      morphometric-validation:
        value: 52
        rationale: >-
          Reports 2 analytical measurements in `measure_morphoeval()`, but lacks simulated
          PDE stripe-splitting wavelength accuracy, 5-regime peak count RMSE, 2D stripe vs
          spot structural metrics, and empirical specimen ridge spacing in micrometers.
        evidence:
          - {file: 1999-painter-chemotactic-stripe-splitting.py, lines: [89, 108], note: "Minimal 2-metric measure_morphoeval() hook", supports: false}
      source-traceability:
        value: 64
        rationale: >-
          Vendors `scout_manifest.json`, `chemotactic_stripe_splitting_reference.json`,
          `paper_citations.bib`, and `chemotactic_pattern_specimen.jpg`, but runtime SHA-256
          verification (`verify_dataset_integrity`) is not yet enforced in the script.
        evidence:
          - {file: datasets/chemotactic_stripe_splitting/chemotactic_stripe_splitting_reference.json, lines: [1, 145], note: "Reference JSON with Painter, Maini & Othmer (1999) equations and specimen metadata", supports: true}
      code-traceability:
        value: 58
        rationale: >-
          Maps critical chemotactic threshold to Painter, Maini & Othmer (1999), but needs
          explicit section/equation docstrings linking every function to the 3 Lean 4 theorems
          in `Loop_005_chemotactic_stripe_splitting.lean`.
        evidence:
          - {file: 1999-painter-chemotactic-stripe-splitting.py, lines: [1, 15], note: "Baseline module docstring", supports: true}
      repro-package:
        value: 56
        rationale: >-
          Provides `--self-test` and deterministic seed=1999, but self-test only checks
          analytical chi_c = 4.5 and lacks SHA-256 dataset verification, bitwise PDE solver
          determinism, subcritical negative control assertion, and specimen segmentation checks.
        evidence:
          - {file: 1999-painter-chemotactic-stripe-splitting.py, lines: [137, 149], note: "Minimal Pass 1 self-test", supports: false}
    remediation:
      - "Replace the kinematic 1D approximation with a full conservative finite-difference/spectral Keller-Segel-Painter PDE solver integrating dn/dt = D_n Lap(n) - div(n chi(c) grad(c)) + r n (1 - n/n_0) and dc/dt = D_c Lap(c) + alpha n / (1 + beta n) - gamma c across growing domain stages L / lambda_c in {1, 2, 4, 8} plus a subcritical negative control (chi = 3.0 < chi_c = 4.5 -> 0 peaks)."
      - "Implement 2D Keller-Segel-Painter chemotactic pattern selection comparing labyrinthine chemotactic stripes vs hexagonal fruiting-body spot aggregates."
      - "Add computer-vision segmentation of `datasets/chemotactic_stripe_splitting/chemotactic_pattern_specimen.jpg` to extract both the right-hand chemotactic rippling ridge wavelength (in px and um via the 500 um scale bar) and the left-hand yellow fruiting-body spot aggregates, plus runtime SHA-256 dataset verification."
