simulations:
  - id: sharon-ripping-leaf-edge-waves
    name: "Sharon et al. (2002) Nature / Audoly & Boudaoud (2003) PRL Non-Euclidean Edge Buckling Cascades in Ruffled Leaf Margins"
    organism: "Lactuca sativa cv. 'Lollo Bionda' (Ruffled garden lettuce) & Brassica oleracea (Curly kale)"
    script: 2002-sharon-ripping-leaf-edge-waves.py
    output: docs/media/ripping_leaf_edge_waves_comparison.png
    extra_outputs:
      - docs/media/ripping_leaf_edge_waves_growth.gif
      - docs/media/ripping_leaf_edge_waves_tcp_auxin_development.png
      - docs/media/ripping_leaf_edge_waves_tcp_auxin_development.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-ripping-leaf-edge-waves-audit-v2
    source_refs:
      - sharon2002
      - audoly2003
      - liang2009
      - sharon2004
      - nath2003
      - palatnik2003
      - bilsborough2011
      - smith2006
      - jonsson2006
      - koyama2007
      - nikovics2006
      - efroni2008
      - hay2006
    claim_boundary:
      reported_in_source:
        - "Sharon et al. (2002): a free sheet with excess marginal arc length (torn plastic, lettuce, kale) buckles into a self-similar sub-harmonic cascade of edge waves whose wavelength grows linearly with distance from the edge"
        - "Audoly & Boudaoud (2003): self-similar cascade scaling lambda_{m+1} = lambda_m / r near a strained boundary"
        - "Liang & Mahadevan (2009): saddle-to-ripple transition of a long leaf controlled by the dimensionless metric strain parameter"
        - "Nath et al. (2003), Palatnik et al. (2003), Efroni et al. (2008): CIN/TCP transcription factors arrest marginal proliferation basipetally; cin / jaw-D leaves grow excess marginal area and become negatively curved, miR319-resistant TCP flattens"
        - "Bilsborough et al. (2011), Nikovics et al. (2006), Koyama et al. (2007), Hay et al. (2006): CUC2-gated PIN1 auxin convergence points position serrations on the growing margin; cuc2 and pin1 margins are smooth"
        - "Smith et al. (2006), Jönsson et al. (2006): up-the-gradient PIN1 polarisation generates auxin maxima"
      reconstructed_in_script:
        - "Exponential marginal metric g_yy(x) = 1 + g_0 exp(-x/ell), exact Brioschi K(x) < 0, linear lambda_loc(x), a surrogate L-BFGS-B FvK multi-generation cascade relaxation with flat-metric negative control, 3D mesh reconstruction, 9-station inward profile, 4-system taxon sweep and ExG specimen segmentation (Pass 2)"
        - "Pass 3: 1D forward-Euler PDEs on a growing Lagrangian margin lattice for auxin (diffusion + PIN1 up-the-gradient transport + production - decay - growth dilution), CUC2 (repressed by auxin and TCP, gating PIN1) and a basipetal TCP maturation front; interior and marginal growth strains whose ratio gives g_0(y,t); the FvK cascade re-solved on <g_0>; serration tips, primary/secondary hierarchy and emergence time from the kinematic outgrowth field; 5 genotype presets vs a 6-check ordinal phenotype table"
      transfer_boundary:
        - "The gene network parameters (TCP front speed, auxin diffusion/transport/decay, CUC2 kinetics) are Arabidopsis-literature-motivated magnitudes applied to a Lactuca sativa margin; the wild-type calibration target g_0 = 0.64 is the Pass 2 Lactuca mechanical value, so WT agreement is a cross-module self-consistency check, not a measurement"
        - "cin/WT = 1.5 and TCP-OE/WT = 0.6 in the reference table are placeholder magnitudes for the ordinal statements '> 1' and '< 1'; the serration-count range [5, 40] is a broad plausibility bound, not a digitised count"
        - "The Pass 2 cascade relaxation minimises a surrogate energy whose target slope, aspect constant, penetration targets and activation cutoff are chosen so the output reproduces the reference table; wavelength / penetration r = 1.0000 are by construction"
      does_not_claim:
        - "A 2D growing-sheet FvK or FEM solution with spatially resolved K(x,y) feedback, mechanical feedback on PIN1 polarity, cell division on the stretching lattice, an elastic in-plane solution for serration outgrowth, digitised serration/lobe counts from Bilsborough 2011 or Nath 2003, or online verification of the 9 new DOIs"
    summary: >-
      Pass 3 (v3) evaluation of `2002-sharon-ripping-leaf-edge-waves.py` (overall weighted score 92.1/100, down
      from 93.6 in v2). The single v2 remediation item is closed: the quasi-static non-Euclidean FvK solver is now
      fed by a spatio-temporal CIN/TCP maturation front, PIN1 up-the-gradient auxin transport and CUC2 PDEs on a
      growing Lagrangian margin lattice (`simulate_tcp_auxin_margin_development`, L805-L1012); the cascade is
      re-solved on the developmental <g_0> = 0.6059 (K(0) = -0.001063 mm^-2, M = 4 generations), 27 serrations
      emerge (12 primary lobes / 15 secondary, hierarchy ratio 3.99, spacing 2.19 mm), and 5 genotype ablations
      satisfy 6/6 ordinal literature checks (cin <g_0> 2.10x WT and more negative K; TCP-OE 0.44x; cuc2 = pin1 =
      0 serrations). Three new Lean 4 theorems (TCP-arrested growth increment, developmental excess metric
      non-negativity, pairwise PIN1 mass conservation) verify with 0 sorrys. The score falls because this pass
      surfaces the next layer of defects rather than hiding it: the WT developmental target is self-referential,
      4 of 6 new measurements use placeholder / cross-module references, the serration wavelength is a parameter
      choice, 9 new DOIs are unverified, and the Pass 2 FvK relaxation reproduces its reference table by
      construction.
    scores:
      model-fidelity:
        value: 93
        rationale: >-
          The Pass 2 metric / curvature / wavelength laws (`compute_target_metric_and_curvature`, L151-L195;
          `compute_local_wavelength_profile`, L197-L211) are faithful to Sharon 2002 / Audoly & Boudaoud 2003 and
          the new developmental module is a recognisable, honestly-labelled reduction of Nath 2003 / Bilsborough
          2011 / Smith-Jönsson 2006: basipetal TCP front (L766-L774), exactly mass-conserving up-the-gradient
          PIN1 exchange with no-flux ends (L776-L797), CUC2 gating, growth dilution and a growing Lagrangian
          lattice whose strain ratio gives g_0(y,t) (L805-L1012), with the FvK cascade genuinely re-solved on the
          developmental <g_0> (L962-L964) and 6 Lean 4 theorems (0 sorrys) covering Laws 1-5. Deductions: the
          Pass 2 `relax_foppl_von_karman_cascade` (L230-L367) is a surrogate energy whose target slope
          s_target (L307), aspect constant 1/sqrt(3) (L283), penetration targets 1.5/r_cascade * lambda_m (L253),
          cutoff 4.65 t (L280) and hard Gamma < 120 gate (L302) are tuned so the output matches the reference
          table — wavelength and penetration r = 1.0000 are inputs, not predictions (-4); the gene network is 1D
          along the margin with no 2D sheet mechanics, no stress feedback on PIN1 polarity and no cell division,
          and serration outgrowth ds/dt = k_s a (1-m) is kinematic bookkeeping rather than an elastic in-plane
          growth solution (-2); the Hosta saddle fallback `lmin_s = 39.70` (L592) equals the reference value (-1).
        evidence:
