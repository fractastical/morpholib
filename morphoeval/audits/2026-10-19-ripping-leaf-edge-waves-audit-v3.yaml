          - {file: 2002-sharon-ripping-leaf-edge-waves.py, lines: [805, 1012], note: "Coupled auxin / CUC2 / TCP / growth PDEs on a growing Lagrangian lattice; excess metric g_0(y,t) = ((1+Gamma_mar)/(1+Gamma_int))^2 - 1; FvK cascade re-solved on <g_0> at L962 and K(0) recomputed at L963", supports: true}
