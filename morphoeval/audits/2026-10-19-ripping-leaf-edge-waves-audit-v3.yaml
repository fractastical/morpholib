# MorphoEval audit — Sharon, Roman, Marder & Swinney (2002) Nature Ripping Leaf Edge Waves, 2026-10-19 (v3)
#
# Pass 3 re-score of `2002-sharon-ripping-leaf-edge-waves.py` and `datasets/ripping_leaf_edge_waves/` after the
# remediation of the single open v2 finding in the instrumented loop
# `morphoeval/runs/2026-10-19-ripping-leaf-edge-waves-loop-pass3`, superseding
# `2026-10-19-ripping-leaf-edge-waves-audit-v2` (93.6).
#   - Primary assessor: Gemini 4 Argon (MorphoEval Autonomous Loop Slot 067 Pass 3 Assessor), scoring from the
#     Phase A handoff evidence, the `git diff` of the three remediated files and the current file contents
#     at commit 327729c8.
#
# What Pass 3 changed (the one v2 remediation item, closed as an honest *reduced* model):
#   1. New script section 5b (L709-L1095): a 1D spatio-temporal gene/hormone module on a growing Lagrangian
#      margin lattice (180 cells, L_0 = 36 mm, 240 h, dt = 0.1 h) — basipetal CIN/TCP maturation front
#      m(y,t) (`tcp_maturation_field`, L766-L774), PIN1 up-the-gradient auxin transport with no-flux ends
#      (`pin1_up_the_gradient_transport`, L776-L797; exactly mass-conserving), CUC2 repressed by auxin and TCP
#      and gating PIN1, interior / marginal growth strains Gamma_int, Gamma_mar and the developmental excess
#      metric g_0(y,t) = ((1+Gamma_mar)/(1+Gamma_int))^2 - 1 (`simulate_tcp_auxin_margin_development`,
#      L805-L1012). The non-Euclidean FvK cascade is RE-SOLVED on the developmental <g_0> (L962) and the
#      Brioschi K(0) recomputed on it (L963); serration tips, the primary-lobe / secondary-serration
#      hierarchy and emergence time are read off the outgrowth field s(y,t) (L924-L945).
#   2. Five genotype presets (`GENOTYPE_PRESETS`, L743-L750: wild type, cin/jaw-D TCP loss-of-function,
#      miR319-resistant TCP over-expression, cuc2, pin1) swept against a 6-check literature ORDINAL phenotype
#      table (`evaluate_developmental_genotype_sweep`, L1037-L1095; 6/6 true), a new SHA-256-pinned reference
#      table `tcp_auxin_developmental_reference.json` (L741, L753-L763), 9 new citations, a new 6-panel
#      figure + 12-frame GIF (`render_developmental_figure` L1409-L1564, `render_developmental_gif`
#      L1567-L1594), 6 new measurements (15 total, L1616-L1785), 3 new self-test checks (11 total,
#      L1787-L1888) and CLI `--genotype` / `--skip-developmental` (L1899-L1905).
#   3. Three new Lean 4 theorems (6 total, 0 sorrys; `lean` exit 0): `tcp_arrested_marginal_growth_increment`
#      (L133-L150), `developmental_excess_metric_nonneg` (L160-L174), `pin_pairwise_transport_mass_conservation`
#      (L184-L194), registered as equations 4-5 in `morphoeval/math_kg_loops/sharon-ripping-leaf-edge-waves.yaml`.
#
# Scores below: overall 92.1 (down from 93.6). The v2 remediation item is closed, but this pass deliberately
# looks for the next layer of defects and finds it: the wild-type developmental calibration target (g_0 = 0.64)
# is the Pass 2 module's own value, 4 of the 6 new measurements compare against placeholder or cross-module
# references rather than digitised data, the serration wavelength is a parameter choice, the 9 new DOIs could
# not be verified online (network tools disallowed), and the Pass 2 FvK "minimizer" is a surrogate energy
# whose target slopes / penetration depths / cutoffs are chosen so that the output reproduces the reference
# table (r = 1.0000 by construction) — a legacy defect the v2 audit under-weighted. Scores are uncalibrated
# criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the files at commit 327729c8.

