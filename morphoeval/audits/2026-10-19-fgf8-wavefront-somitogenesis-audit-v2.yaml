      - docs/media/fgf8_wavefront_somitogenesis_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Dubrulle & Pourquie (2004) Nature 427:419-422 cell-autonomous fgf8 mRNA decay gradient m(x) = m_0 exp(-k_d x / v_g) generated by tailbud-restricted transcription and axis elongation"
        - "Dubrulle, McGrew & Pourquie (2001) Cell 106:219-232 determination front threshold positioning x* = (v_g/k_d) ln(m_0/m_crit) and ectopic FGF8 bead / SU5402 somite size perturbations"
      reconstructed_in_script:
        - "Characteristic-upwind 1D advection-decay PDE solver dm/dt + v_g dm/dx = -k_d m (L2 relative error 0.00086 vs analytical exponential)"
        - "Lab-frame FGF8 wavefront-gated somite boundary simulator across wild-type, ectopic FGF8 bead (S_ant=97.5 um, S_post=202.5 um), SU5402 (S=215.0 um), and k_d=0 ablation control (N=0 somites)"
        - "Bilateral dorsal somite row DoG peak and inter-somitic cleft segmentation on chick_somite_psm_specimen.jpg (48.47 px mean spacing, symmetry ratio 0.9605)"
      transfer_boundary:
        - "1D anteroposterior chick presomitic mesoderm axis mapped to dorsal vertebrate SEM somite rows"
      does_not_claim:
        - "Full mutual CYP26/RALDH2 retinoic acid vs FGF8 Goldbeter-Koshland bistable switch ODEs or 3D somite epithelialization mechanics"
    source_refs:
      - dubrulle2001
      - dubrulle2004
      - baker2006
      - goldbeter2007
    summary: >-
      Pass 2 post-remediation evaluation of `2003-dubrulle-fgf8-wavefront-somitogenesis.py` (90.9/100,
      up from 59.3/100 in Pass 1; +31.6 overall). The remediated script integrates the cell-autonomous
      fgf8 mRNA advection-decay PDE dm/dt + v_g dm/dx = -k_d m (achieving 0.086% L2 error against
      m_0 exp(-k_d x / v_g) with characteristic length lambda_m = 360.67 um and determination front
      x* = 696.47 um), reproduces all 5 Dubrulle et al. (2001, 2004) experimental regimes (wild-type
      S_0 = 150.0 um, ectopic FGF8 bead compressed anterior somite S_ant = 97.5 um and catch-up
      posterior somite S_post = 202.5 um satisfying S_ant + S_post = 300.0 um = 2*S_0, SU5402 FGFR1
      inhibition S = 215.0 um, and pCAGGS-FGF8 electroporation S = 82.5 um; Pearson r = 0.9998,
      RMSE = 1.13 um), includes a k_d = 0 no-decay negative control (0 somites), and segments the
      vendored chick/vertebrate SEM specimen (`chick_somite_psm_specimen.jpg`, 8 upper and 9 lower
      somites, mean spacing 48.47 px), backed by 3 machine-checked Lean 4 theorems in
      `Loop_024_fgf8_wavefront_somitogenesis.lean`.
