    claim_boundary:
      reported_in_source:
      - 'Turing 1952: a homogeneous reaction-diffusion state can be unstable at a finite critical wavenumber k_c,
        selecting a stationary wavelength.'
      - Gehling & Narbonne 2007 name Fractofusus misrai from Mistaken Point and place it in the mid-Ediacaran, ca.
        575–560 Ma, as a fusiform rangeomorph below the photic zone.
      - 'Hoyal Cuthill & Conway Morris 2014: rangeomorph fronds are a fractal, self-similar, axial-apical-alternate
        body plan consistent with osmotrophy.'
      - 'Mitchell et al. 2015: Fractofusus spatial clusters record multigenerational stolon-like reproduction plus
        waterborne propagules.'
      reconstructed_in_script:
      - Schnakenberg parameters a=0.09, b=0.85, D_u=0.12, D_v=2.40, with the grid spacing chosen so analytical λ_c
        = 6.33e-05 m. These constants are not taken from slot 1251.
      - A siltstone-coloured spindle render whose interior contrast is the growing activator. Chevron ridges are
        a display of the selected wavelength, not a measured branch angle.
      transfer_boundary:
      - The wavenumber law is evaluated at 63 µm on one Mistaken Point bedding-plane photograph. It does not transfer
        to Fractofusus andersoni, to the 3.275 mm organ-scale module, or to Cambrian bilaterian segmentation.
      does_not_claim:
      - Does not claim a measured 63 µm pigment ocellus or cellular reaction-diffusion stripe on Fractofusus. Mistaken
        Point preserves external moulds.
      - Does not claim the saturated 73.7 µm Fourier peak equals the linear wavelength. The shift is reported.
      - Does not claim a second chronospecies. The series is 1/1 at 565 Ma.
