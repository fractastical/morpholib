# MorphoEval audit — D'Arcy Thompson's Scarus -> Pomacanthus transformation
# fitted to real species, 2026-10-16.
#
# First audit of thompson/1917-thompson-scarus-pomacanthus.py.  Thompson's
# method of transformations (On Growth and Form 1917, ch. XVII) was published
# as hand-drawn grids with no equations and no fitting procedure (Bookstein
# 1978); the toy thompson/1917-thompson.py animates the families of grids and
# is not audited because it has no specimen.  This script turns the one claim
# that can be tested with open data - "Fig. 375 is an outline diagram of a
# typical Scaroid fish. Let us deform its rectilinear co-ordinates into a
# system of (approximately) coaxial circles, as in Fig. 376, and then filling
# into the new system ... our former diagram of Scarus, we obtain a very good
# outline of ... Pomacanthus" (p. 749) - into a parametric statement: a
# Cartesian grid whose lines become coaxial circles is the image of the plane
# under a Moebius map (6 real constants, conformal, the two pencils of circles
# orthogonal) or, if the two pencils may meet obliquely as they do in Thompson's
# Fig. 376, an affine map followed by a Moebius map (8 constants).  Both are
# fitted by least squares from the Procrustes mean of the 22 Scarus species to
# the mean of the 9 Pomacanthus species in Claverie & Wainwright's 17-landmark
# table (791 species; CC0 via Friedman et al. 2019), and compared with the
# similarity, affine and thin-plate-spline fits, with the spread of the
# Pomacanthus species about their own mean as the noise floor, with a
# leave-one-landmark-out prediction, and with the same fits for all 3782
# ordered pairs of genus means.
#
# The finding is negative and is the output being judged: the conformal family
# explains 0.8 % of the Procrustes distance (it cannot change depth/length,
# which goes 0.38 -> 0.59), the oblique family 32 % against 31 % for a plain
# affine map; the residual (0.0256) is twice the within-Pomacanthus spread
# (0.0132); held-out landmarks are predicted worse than by no deformation at
# all; and the pair is at the 31st percentile of genus pairs, so coaxial
# circles do not describe this pair unusually well.  What is left after the
# affine part is local: the anal-fin end and origin, the upper-jaw tip and the
# dorsal-fin end.  So "a very good outline" holds at the resolution of
# Thompson's drawing, not of the species.
#
# This is a data analysis, not a simulation, so the rubric is read as for the
# Odonata and C. elegans audits: "model" is Thompson's family of grids,
# "rendered output" is the fish that family carries, "specimens" are the 791
# digitised species.  Parameter expressivity is applicable in a limited sense
# (the family has constants whose effect on the grid is shown) and is scored
# on that basis rather than neutral.
#
# Scores are on the rubric's 0-100 scale.  Line numbers refer to the files at
# the checkpoint commit recorded below.

