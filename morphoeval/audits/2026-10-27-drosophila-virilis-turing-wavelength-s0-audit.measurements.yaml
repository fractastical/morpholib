    input_dataset_sha256: {}
    claim_boundary:
      reported_in_source:
      - Turing 1952 critical-wavenumber selection from the dispersion relation of a two-species reaction-diffusion
        system.
      - Schnakenberg 1979 kinetics and the steady state u0 = a + b, v0 = b/(a+b)^2.
      - 'Gompel et al. 2005: abdominal pigment differences among Drosophila species are cis-regulatory, including
        posterior bands in the melanogaster subgroup.'
      - Hanson 2019 CC BY-SA 4.0 lateral habitus of Drosophila virilis (Wikimedia File:Dvir 1-2.jpg).
      reconstructed_in_script:
      - Du solved so virilis onset λ_c = 3.101 µm at Dv/Du = 10 and b = 0.90.
      - Teissieri a = 0.058 and willistoni a = 0.360 as the chronoseries step at fixed age and fixed diffusivities.
      - Tergite mode counts from project atlas adult lengths divided by seven.
      - Adult GIF endpoint is the habitus photograph modulated by the normalized PDE field.
      transfer_boundary:
      - The 3.101 µm target is the slot scale. It is not a published ocellus measurement for D. virilis.
      - Atlas body lengths are used only to turn a wavelength into a mode count.
      does_not_claim:
      - That the habitus photograph resolves a 3.1 µm pigment wavelength (measured Nyquist is 7.76 µm).
      - That willistoni lost a Turing pattern through geological time (successor is extant, 0 Ma).
      - That chorion-filament number enters the wavenumber law.
      - That the PDE generated the wing veins or the body outline.
