# MorphoEval BLINDED SECOND-ASSESSOR audit — Murray (1981) Turing pre-pattern vs Holstein cow flank
#
# Blinding statement.  This assessment was produced by claude-fable-5-1 acting as an independent
# second assessor.  The assessor did NOT read: morphoeval/audits/*bos-taurus* (v1, v2, v3 or their
# .measurements.yaml), morphoeval/runs/*bos-taurus*, the scoring tables in morphoeval/README.md, or
# the git history/log of any of these files.  No prior score for this script was seen or inferred.
# What WAS read: morphoeval/rubric.yaml, morphoeval/schema.yaml, the validation code paths of
# morphoeval/build_morphoeval_kg.py, the target script in full, every file in
# datasets/bos_taurus_turing_wavelength/ (the generated metrics JSON was treated as the builder's
# claim under test, not as evidence), and two unrelated audits for file shape only.
#
# Independent verification performed (2026-10-26, macOS, ./venv python 3.14.7 / numpy 2.5.4 /
# matplotlib 3.10.7 / Pillow 12.0.0):
#   * `--self-test` passes in 1.6 s; `--no-show --animate` completes in 26 s and reproduces the
#     committed-in-working-tree metrics JSON byte-for-byte and the PNG/GIF with identical SHA-256
#     (PNG 5b4fc499..., GIF 05203b24...).
#   * Steady state (u0,v0)=(1.0,0.9), Jacobian [[0.8,1],[-1.8,-1]], tr=-0.2, det=1, cross-term 15,
#     225 > 80, k_c^2 = 0.375, lambda_c = 10.26, band k in [0.272, 0.822], k* = 0.4866 (eigenvalue
#     scan) and lambda ~ gamma^-1/2 all recomputed independently and match the script.
#   * Equal-diffusion control: max sigma = Re(eig J) = -0.1 at k=0; correct.
#   * Explicit-Euler bound dt < 1/(4 D_v) = 0.0125 > DT = 0.01; correct.
#   * All three DOIs resolved via the Crossref API to the claimed works (see findings for the
#     author-attribution error on the MITF paper).
#   * Re-ran the Pass-2/3 grid search, a 5-seed sensitivity test of the winning configuration,
#     FFT wavelengths of static vs grown fields, and a row/column dark-fraction profile of the
#     flank ROI mask (see rationales).

