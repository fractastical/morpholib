measurements:
  thompson-scarus-pomacanthus:
  - name: species in the landmark table
    value: 791
    unit: count
    method: rows of trimmed_tps_Claverie2014.csv (sha256 checked)
    derived_from: script
    reference_value: 791
    reference_source: 'Friedman et al. 2019, Dryad 10.5061/dryad.fn457gr (Claverie & Wainwright 2014 landmarks),
      CC0: ''nearly 800 species'''
  - name: Scarus species
    value: 22
    unit: count
    method: rows whose genus is Scarus
    derived_from: script
  - name: Pomacanthus species
    value: 9
    unit: count
    method: rows whose genus is Pomacanthus
    derived_from: script
  - name: Procrustes distance, Scarus mean to Pomacanthus mean
    value: 0.0312
    unit: Procrustes units (RMS per landmark)
    method: RMS landmark distance after optimal similarity superimposition of the genus means (unit centroid size)
    derived_from: script
  - name: affine residual
    value: 0.0259
    unit: Procrustes units
    method: RMS after a least-squares affine map (6 parameters)
    derived_from: script
    note: explains 30.9 % of the Procrustes distance
  - name: Moebius residual (isogonal coaxial circles)
    value: 0.0311
    unit: Procrustes units
    method: RMS after a least-squares Moebius map z -> (az+b)/(cz+1), the conformal map that turns the Cartesian
      grid into two orthogonal pencils of coaxial circles
    derived_from: script
    reference_source: 'Thompson 1917, On Growth and Form, p. 749, Figs. 375-376: ''a system of (approximately) coaxial
      circles'''
    note: 'explains 0.8 %: a conformal map cannot change the depth/length ratio'
  - name: oblique coaxial-circle residual
    value: 0.0256
    unit: Procrustes units
    method: 'RMS after an affine map followed by z -> z/(cz+1) (8 parameters): coaxial circles whose two pencils
      need not be orthogonal, the family Thompson''s Fig. 376 belongs to as drawn'
    derived_from: script
    reference_source: Thompson 1917, On Growth and Form, p. 749, Figs. 375-376
    note: explains 32.4 %
  - name: thin-plate spline bending energy
    value: 0.6778
    unit: dimensionless
    method: bending energy of the exact TPS from the Scarus mean to the Pomacanthus mean (Bookstein 1989)
    derived_from: script
  - name: within-Pomacanthus RMS (noise floor)
    value: 0.0132
    unit: Procrustes units
    method: RMS of the Pomacanthus species about their own Procrustes mean
    derived_from: script
    note: species range 0.0090-0.0180; within-Scarus 0.0099
  - name: leave-one-landmark-out RMS of the oblique coaxial family
    value: 0.0371
    unit: Procrustes units
    method: each landmark predicted by the 8-parameter map fitted to the other 16
    derived_from: script
    note: 'compare with the Procrustes distance: the family has no predictive value for held-out landmarks if it
      is not smaller'
  - name: depth/length, Scarus mean
    value: 0.3772
    unit: ratio
    method: landmark extent in y over extent in x
    derived_from: script
  - name: depth/length, Pomacanthus mean
    value: 0.5873
    unit: ratio
    method: landmark extent in y over extent in x
    derived_from: script
  - name: percentile of Scarus -> Pomacanthus among all genus pairs (oblique coaxial, explained share)
    value: 31.1475
    unit: percent
    method: share of the 3782 ordered pairs of genus means (genera with >= 3 spp.) explained less well
    derived_from: script
    note: median pair 43 %
  - name: Scarus -> Chaetodon spp., median explained by oblique coaxial circles
    value: 35.12
    unit: percent
    method: median over the 54 Chaetodon species
    derived_from: script
    reference_source: 'Thompson 1917, On Growth and Form, p. 749, Figs. 375-376: ''other fishes of the same family
      of Chaetodonts ... small variations in the values of the constants'''
    note: range 12-61 %
  - name: silhouette area, Scarus ghobban
    value: 214862
    unit: pixels
    method: segmented mask at 0.25 scale; photograph SHA-256 732f1e68da7e... checked by the script
    derived_from: script
    reference_source: Jérôme Huet, IFREMER (image.ifremer.fr 00762-87435), via Wikimedia Commons, CC BY 4.0
  - name: caudal-peduncle anchor, Scarus ghobban
    value: 0.7919
    unit: fraction of silhouette length
    method: x of the peduncle anchor between the anterior-most and posterior-most mask columns (fish facing left)
    derived_from: script
    note: plausible range for a perciform fish ~0.75-0.90; the anchor fixes the registration of the landmarks to
      the photograph
  - name: silhouette area, Pomacanthus semicirculatus
    value: 92699
    unit: pixels
    method: segmented mask at 0.25 scale; photograph SHA-256 5622e415149a... checked by the script
    derived_from: script
    reference_source: Elias Levy (Flickr 6851425758), via Wikimedia Commons, CC BY 2.0
  - name: caudal-peduncle anchor, Pomacanthus semicirculatus
    value: 0.8395
    unit: fraction of silhouette length
    method: x of the peduncle anchor between the anterior-most and posterior-most mask columns (fish facing left)
    derived_from: script
    note: plausible range for a perciform fish ~0.75-0.90; the anchor fixes the registration of the landmarks to
      the photograph
  - name: silhouette IoU, similarity
    value: 0.662
    unit: ratio
    method: Scarus ghobban silhouette carried by the map fitted to the 17 landmarks of S. ghobban -> P. semicirculatus,
      against the P. semicirculatus silhouette; point-in-polygon on a 900 x 900 grid (independent of the script's
      rasteriser)
    derived_from: script
    reference_value: 0.6619
    reference_source: the script's own IoU (skimage.draw.polygon, 1000-px grid)
    note: boundary distance 0.0404 = 5.6 % of body length; landmark RMS 0.0388; the no-deformation baseline
  - name: silhouette IoU, affine
    value: 0.6515
    unit: ratio
    method: Scarus ghobban silhouette carried by the map fitted to the 17 landmarks of S. ghobban -> P. semicirculatus,
      against the P. semicirculatus silhouette; point-in-polygon on a 900 x 900 grid (independent of the script's
      rasteriser)
    derived_from: script
    reference_value: 0.6515
    reference_source: the script's own IoU (skimage.draw.polygon, 1000-px grid)
    note: boundary distance 0.0466 = 6.5 % of body length; landmark RMS 0.0322
  - name: silhouette IoU, moebius
    value: 0.6449
    unit: ratio
    method: Scarus ghobban silhouette carried by the map fitted to the 17 landmarks of S. ghobban -> P. semicirculatus,
      against the P. semicirculatus silhouette; point-in-polygon on a 900 x 900 grid (independent of the script's
      rasteriser)
    derived_from: script
    reference_value: 0.6448
    reference_source: the script's own IoU (skimage.draw.polygon, 1000-px grid)
    note: boundary distance 0.0427 = 5.9 % of body length; landmark RMS 0.0381
  - name: silhouette IoU, coaxial
    value: 0.6185
    unit: ratio
    method: Scarus ghobban silhouette carried by the map fitted to the 17 landmarks of S. ghobban -> P. semicirculatus,
      against the P. semicirculatus silhouette; point-in-polygon on a 900 x 900 grid (independent of the script's
      rasteriser)
    derived_from: script
    reference_value: 0.6184
    reference_source: the script's own IoU (skimage.draw.polygon, 1000-px grid)
    note: boundary distance 0.0509 = 7.0 % of body length; landmark RMS 0.0303
  - name: silhouette IoU, tps
    value: 0.6287
    unit: ratio
    method: Scarus ghobban silhouette carried by the map fitted to the 17 landmarks of S. ghobban -> P. semicirculatus,
      against the P. semicirculatus silhouette; point-in-polygon on a 900 x 900 grid (independent of the script's
      rasteriser)
    derived_from: script
    reference_value: 0.6287
    reference_source: the script's own IoU (skimage.draw.polygon, 1000-px grid)
    note: boundary distance 0.0477 = 6.6 % of body length; landmark RMS 0.0000
  thompson-transformations: []
  turing-gray-scott:
  - name: dominant wavelength (last frame)
    value: 16.6667
    unit: grid cells
    method: peak of the radial power spectrum of the axes-box image, scaled to the N=200 grid
    derived_from: output
    note: Gray–Scott f=0.055,k=0.062 labyrinth; no specimen or literature wavelength recorded
  - name: pattern coverage (last frame)
    value: 0.0002
    unit: fraction
    method: fraction of axes box in the high-V (yellow) band
    derived_from: output
  - name: connected high-V components (last frame)
    value: 3
    unit: count
    method: scipy.ndimage.label on the yellow mask
    derived_from: output
  - name: fraction of pattern pixels changed, first→last frame
    value: 0.0059
    unit: fraction
    method: XOR of yellow masks of frame 0 and the last frame
    derived_from: output
    reference_value: '>0 for an evolving simulation'
    note: ≈0 means the GIF shows a frozen pattern
  - name: Pearson coral labyrinth (F=0.054, k=0.0616) spectral ring wavenumber k*
    value: 11.487
    unit: cycles / domain
    method: sub-bin parabolic peak of 2D radial PSD P(k) on N=160x160 grid
    derived_from: script
    reference_value: '>0 (Turing band-pass ring)'
    reference_source: Pearson 1993 Science 261:189 Pattern κ (inside Saddle-Node)
    note: λ* = 13.93 grid cells (analytical λ_c = 11.92), ring sharpness = 968.1
  - name: Pearson mitosis spots (F=0.028, k=0.062) connected components vs coral labyrinth
    value: 52
    unit: count
    method: connected high-activator components in self-replicating spot regime
    derived_from: script
    reference_value: 1
    reference_source: Pearson 1993 Science 261:189 Pattern λ vs Pattern κ
    note: spots remain disconnected whereas coral labyrinth percolates
  - name: steady-state equal-diffusion negative control (Du=Dv=0.20) spectral wavenumber k*
    value: 0.0
    unit: cycles / domain
    method: dominant wavenumber when differential diffusivity is removed around nontrivial steady state (U_*, V_*)
    derived_from: script
    reference_value: 0.0
    reference_source: Turing 1952 Phil. Trans. R. Soc. B 237:37 (diffusion-driven instability requires Du != Dv)
    note: spatial σ_V = 4.70e-07, ring sharpness = 0.0
  - name: Turing (1952) Sec. 8-9 analytical critical wavelength λ_c = 2π/k_c
    value: 5.62
    unit: cells
    method: 2*pi / sqrt((d*D_X + a*D_Y) / (2*D_X*D_Y)) on 2-morphogen activator-inhibitor system
    derived_from: script
    reference_value: 5.62
    reference_source: Turing 1952 Phil. Trans. R. Soc. B 237:37 Sec. 8-9
    note: d = 4.00 > d_c = 3.927, N=20 ring dominant mode s* = 4
  - name: Pomacanthus imperator segmented skin stripe wavelength
    value: 9.55
    unit: px
    method: mean dorsoventral inter-stripe peak spacing on SHA-256-locked specimen ROI
    derived_from: script
    reference_value: 8–16 px (CV < 0.35)
    reference_source: Kondo & Asai 1995 Nature 376:765-768
    note: CV = 0.149, topological Y-branch junctions = 22, ontogenetic r = 0.9981
  - name: Ostracion meleagris segmented Turing spots (DoG + Delaunay)
    value: 121
    unit: spots
    method: Difference-of-Gaussians segmented spots on SHA-256-locked boxfish specimen ROI
    derived_from: script
    reference_value: '>=15 hexagonal spots'
    reference_source: Turing 1952 / Pearson 1993 spot lattice
    note: mean Delaunay nearest-neighbor spacing = 10.71 px (CV = 0.394)
