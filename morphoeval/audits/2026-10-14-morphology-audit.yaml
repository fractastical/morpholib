# MorphoEval audit — morphology simulations, 2026-10-14 (re-score).
#
# Re-scores ONE simulation, the PlanformDB planarian morphology animation,
# after it was rewritten from scratch (1900-planformDB_parser.py ->
# 2013-lobo-planform-morphology.py) in response to the 2026-10-13 audit.
# The simulation keeps its id so that the nine nanopubs built from this file
# supersede (npx:supersedes) the nine published on 2026-10-13.
#
# The other simulations are unchanged since commit f3fe478 and were not
# re-inspected; they are listed with status: unevaluated and their
# 2026-10-13 nanopubs stand.  The rubric nanopub is byte-identical to the
# published one and is therefore not re-emitted.
#
# Scores are on the rubric's 0-100 scale.  Line numbers refer to the files at
# the checkpoint commit recorded below.

