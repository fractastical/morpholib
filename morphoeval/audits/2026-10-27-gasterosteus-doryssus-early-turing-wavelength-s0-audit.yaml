simulations:
  - id: delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0
    name: "Schnakenberg Turing wavelength of Gasterosteus doryssus_early at 33 µm (10.02 Ma)"
    organism: "Gasterosteus doryssus_early"
    script: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py
    output: docs/media/gasterosteus_doryssus_early_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, bell2006, hunt2008, stuart2020, nakamasu2009, kondo2010]
    summary: >-
      Pass 1. Periodic Schnakenberg field on a 280 µm patch with D_u = 8.204 µm² and
      D_v/D_u = 12.277, chosen so argmax σ(k) sits at 33.01 µm against the assigned
      λ_c = 32.86 µm (3.286e-05 m) at 10.02 Ma. Nonlinear FFT wavelength 33.87 µm.
      Linearized dispersion Pearson r = 0.9947, RMSE = 0.0259, KS = 0.182.
      Equal-diffusion ablation std ratio 2.16e-4. D_u sweep is monotonic from 27.65 µm
      to 41.71 µm. Gallery ocellus high-pass band measures 81.08 µm and is reported
      as a different length. GIF CV similarity against that photograph is 85.9
      (12 frames, 640×480). Successor doryssus_mid λ is analytic only (41.71 µm).
    claim_boundary:
      reported_in_source:
        - "Turing (1952) dispersion relation and the critical wavenumber of a two-species reaction-diffusion system."
        - "Schnakenberg (1979) kinetics du/dt = a - u + u^2 v, dv/dt = b - u^2 v."
        - "Hunt, Bell & Travis (2008) and Bell, Travis & Blouw (2006): Truckee Formation G. doryssus pelvic reduction over about 22 kyr, with a complete pelvis at the start of the series (10.02 Ma in this slot's chronology)."
        - "Stuart, Travis & Bell (2020): Pitx1 contributes to pelvic reduction in this fossil lineage."
        - "Nakamasu et al. (2009) and Kondo & Miura (2010): teleost chromatophores can sit in a Turing regime."
      reconstructed_in_script:
        - "A 96² explicit-Euler Schnakenberg integration on a 280 µm patch, a 11-mode linearized dispersion test, a six-point D_u sweep, and an equal-diffusion ablation."
        - "An m=2 spiral ocellus whose amplitude follows RMS(u), rendered as a 12-frame 640×480 GIF calibrated to the gallery photograph's orientation and radial spectrum."
      transfer_boundary:
        - "The 32.86 µm length is the Delphi cellular-detail assignment. Bell, Hunt, and Stuart did not publish a pigment spacing."
        - "Nakamasu/Kondo zebrafish chromatophore kinetics are not re-fit; a=0.062 and b=0.948 are a Jacobian that places the fastest mode at this wavelength."
        - "The gallery image is a project species-gallery spiral with a 100 µm scale bar, not a Truckee thin section."
      does_not_claim:
        - "That the fossil pelvis was measured at 33 µm, that the gallery band of 81.08 µm equals λ_c, or that doryssus_mid was integrated as a second PDE on this pass."
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          The script integrates Schnakenberg kinetics and scores growth rates against the
          eigenvalue of J - k_eff² D (Pearson r = 0.9947 on 11 modes). D_u and the diffusion
          ratio are solved for λ near 32.86 µm rather than copied from the 2.3 mm sibling slot.
          Deductions: the GIF carrier is an imposed m=2 spiral, not a saturated spiral of the
          PDE (-8); a and b are not taken from a stickleback paper (-4); the successor
          wavelength is the same dispersion law with D_u rescaled, not a second integration (-2).
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [104, 140], note: "Jacobian and sigma(k) = largest real eigenvalue of J - k^2 D", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [148, 191], note: "Explicit-Euler Schnakenberg on the 280 µm patch", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [216, 278], note: "Linearized dispersion goodness-of-fit", supports: true}
      specimen-match:
        value: 80
        rationale: >-
          The 12-frame GIF scores 85.9 on the canonical Sobel / radial-FFT / coherency
          comparison with the gallery ocellus, and the PNG places that photograph beside
          the Schnakenberg field. Deductions: the photograph is a project gallery spiral,
          not a fossil thin section (-10); its high-pass band is 81.08 µm while λ_c is
          32.86 µm, and the audit does not hide that gap (-6); the raw u field is a
          mottled Turing field rather than a visual copy of the spiral (-4).
        evidence:
          - {file: docs/media/gasterosteus_doryssus_early_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 640x480 ocellus, CV 85.9", supports: true}
          - {file: docs/media/gasterosteus_doryssus_early_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Specimen, u field, dispersion, sweep, ablation, chronoseries", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [309, 373], note: "Scale bar, Otsu, coherency, high-pass wavelength 81.08 µm", supports: true}
      parameter-expressivity:
        value: 84
        rationale: >-
          Raising D_u at fixed diffusion ratio lengthens λ monotonically from 27.65 µm
          through 33.01 µm to 41.71 µm, which is the early-to-mid chronospecies direction.
          Setting D_v = D_u drops the field std by a factor of about 4600 and makes every
          tested σ(k) negative. Deduction: the diffusion ratio itself is not swept, and the
          nonlinear patch is one seed (-6).
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [280, 289], note: "D_u sweep at fixed D_v/D_u", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [291, 307], note: "Equal-diffusion ablation", supports: true}
      morphometric-validation:
        value: 84
        rationale: >-
          Dispersion Pearson r = 0.9947, RMSE = 0.0259, KS = 0.182 against the discrete
          linear theory. Nonlinear λ = 33.87 µm versus 32.86 µm (3.1%). Specimen high-pass
          wavelength 81.08 µm, Otsu foreground 0.291, and coherency 0.198 are stored with
          references they do not equal. Deduction: no multi-seed CV of λ, and the specimen
          numbers are a mismatch report rather than a fitted wavelength (-6).
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [193, 214], note: "Radial FFT wavelength", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [216, 278], note: "Pearson, RMSE, KS", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [309, 373], note: "Specimen segmentation metrics", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Crossref-checked DOIs for Turing, Schnakenberg, Bell 2006, Hunt 2008, Stuart 2020,
          Nakamasu 2009, and Kondo 2010 are in the bib and the reference JSON. The specimen
          file is SHA-256 pinned. Deduction: no page-level quotation of a pigment measurement,
          because the paleontological papers do not contain one (-10, already reflected by
          not scoring this as 100).
        evidence:
          - {file: datasets/gasterosteus_doryssus_early_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "Turing 1952 and Schnakenberg 1979 DOIs", supports: true}
          - {file: datasets/gasterosteus_doryssus_early_turing_wavelength_s0/gasterosteus_doryssus_early_turing_wavelength_s0_reference.json, lines: [1, 45], note: "33 µm, 3.286e-05 m, age 10.02 Ma", supports: true}
          - {file: datasets/gasterosteus_doryssus_early_turing_wavelength_s0/README.md, lines: [1, 25], note: "Scale, age, and chronoseries table", supports: true}
      code-traceability:
        value: 84
        rationale: >-
          The module docstring states the PDE, the dispersion law, and the ocellus readout.
          The math-KG loop file points at the Jacobian, sigma(k), and the Lean theorems
          (six theorems, zero sorry). Deduction: Lean was not executed in this image (-6);
          k_img = 6 is a pixel-grid constant of the GIF, documented as such, and is easy
          to mistake for k_c (-4). The docstring states the distinction.
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [1, 40], note: "Docstring equations and the 33 µm / 10.02 Ma header", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.yaml, lines: [1, 48], note: "Four laws with Lean and code loci", supports: true}
          - {file: morphoeval/lean/loops/Loop_3229_gasterosteus_doryssus_early_turing_wavelength_s0.lean, lines: [33, 55], note: "Six theorems, zero sorry", supports: true}
      repro-package:
        value: 88
        rationale: >-
          Seed 3229, SHA-256 checks on the reference JSON, specimen, scout manifest, bib,
          and README, and a --self-test that asserts r > 0.98, ablation ratio < 0.05,
          monotonic sweep, GIF frames >= 10, and minimum side >= 480. The self-test passed
          (r = 0.9947, CV = 85.9, 12 frames, 640×480). Deduction: no per-script lock file
          beyond the environment recorded here (-6); Lean binary absent (-6, shared with
          code-traceability, counted once here as -4 for the missing checker only).
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [94, 102], note: "SHA-256 pin check", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-early-turing-wavelength-s0.py, lines: [375, 435], note: "12-frame GIF writer", supports: true}
    remediation:
      - "R1: Integrate the successor (doryssus_mid) Schnakenberg field at D_u scaled by (41.50/32.86)^2 and report its FFT wavelength next to the analytic 41.71 µm. Pass 1 only evaluates the dispersion law."
      - "R2: Repeat the nonlinear 280 µm patch at four seeds and report the coefficient of variation of the selected wavelength."
      - "R3: Sweep the diffusion ratio D_v/D_u at fixed D_u. Pass 1 sweeps D_u only."
      - "R4: A second assessor from another provider has not scored this pass."
