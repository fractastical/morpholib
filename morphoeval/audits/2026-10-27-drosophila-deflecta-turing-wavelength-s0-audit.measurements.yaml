    claim_boundary:
      reported_in_source:
      - Turing (1952) derived the diffusion-driven instability and the critical wavenumber. Schnakenberg (1979)
        gave the two-species kinetics.
      - Werner et al. (2010) showed Wingless at vein intersections paints spots in D. guttifera. Prud'homme et al.
        (2006) showed the D. elegans apical spot is a yellow cis-regulatory novelty.
      reconstructed_in_script:
      - Nondimensional parameters (a, b, D_u, D_v) = (0.132, 0.780, 0.061, 3.050) are chosen for this 2.633 µm slot.
        They are not measurements from those papers.
      - Detail-tier wavelengths of D. cyrtoloma and D. elegans are the primordium-tier catalog lengths rescaled
        by 207.6/108.8 and 101.1/108.8 onto 2.633 µm.
      transfer_boundary:
      - Wingless vein spots were shown in D. guttifera, not as a 2.633 µm wavelength in D. deflecta. The chronoseries
        radiation label is the assigned bucket; D. deflecta is a quinaria-group fly.
      does_not_claim:
      - Does not claim a wet-lab measurement of a 2.633 µm pigment wavelength on D. deflecta.
      - Does not claim the pass-1 unforced GIF is a pixel fit to the gallery spiral.
