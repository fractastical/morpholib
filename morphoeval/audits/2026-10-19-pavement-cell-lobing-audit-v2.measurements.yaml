      reported_in_source:
      - Sapala et al. (2018) eLife 7:e32794 outer periclinal cell wall tensile stress scaling with Largest Empty
        Circle radius (sigma_max ~ P * R_LEC / h), demonstrating that interdigitated puzzle lobing pins R_LEC near
        ~11.4 um as cell area expands to 4500 um^2 whereas isotropic polygonal/mutant cells grow as sqrt(A/pi)
      - Fu et al. (2005) Cell 120:687-700 & Lin et al. (2013) Curr Biol 23:290-297 antagonistic cortical ROP2-RIC4
        (actin lobe outgrowth) and ROP6-RIC1-KTN1 (katanin-mediated microtubule neck bundling) polarization in antiphase
        across shared anticlinal cell walls, and lobeyness collapse in rop2 rop4 RNAi and ktn1/ric1 mutants
      reconstructed_in_script:
      - Exact 2D Euclidean Distance Transform Largest Empty Circle (R_LEC) and ConvexHull solidity/lobeyness solver
        across cell area growth A in [250, 4500] um^2 for wild-type Col-0 puzzle cells, unlobed isotropic cells,
        ktn1/ric1 and rop2 rop4 mutants, and parallel-file monocot epidermis
      - 196-node periodic anticlinal boundary coupled ROP2-RIC4 / ROP6-RIC1-KTN1 reaction-diffusion PDE integrator
        reproducing intracortical mutual exclusion (r = -0.9899), trans-wall lobe-neck complementarity (r = 0.9998),
        24.5 um lobe wavelength, and exact intercellular area conservation
      - Automated DoG + zero-compactness watershed segmentation of 10 interlocking puzzle-shaped pavement cells
        from the SHA-256-locked Arabidopsis thaliana leaf epidermis SEM micrograph (`arabidopsis_pavement_cell_specimen.jpg`,
        mean S = 0.720, min S = 0.626, mean L = 1.506)
      transfer_boundary:
      - 2D anticlinal boundary PDE and spring-remodeled polygonal contours with Euclidean Distance Transform R_LEC
        mapped to 2D epidermal SEM projections
      does_not_claim:
      - Full 3D finite-element shell modeling of dome deflection z(x,y) coupled to discrete microtubule filament
