    claim_boundary:
      reported_in_source:
        - "Painter, Maini & Othmer (1999) PNAS 96(10):5549-5554 Keller-Segel chemotactic-reaction-diffusion equations, equal-diffusivity instability threshold chi > chi_c at D_n = D_c, domain-growth stripe-splitting cascade, and 2D stripe vs spot selection"
        - "Keller & Segel (1970) J. Theor. Biol. 26:399-415 chemotactic flux cross-diffusion -div(n chi(c) grad(c))"
      reconstructed_in_script:
        - "1D and 2D IMEX pseudospectral Keller-Segel-Painter PDE solvers across stationary domain scales s in {1, 2, 4, 8}, subcritical chemotaxis control chi = 3.0 < chi_c = 4.5, exponentially growing domain kymograph (1 -> 2 -> 4 stripes), and 2D cubic labyrinthine stripes vs quadratic spot droplets"
        - "Computer-vision segmentation of Myxococcus xanthus specimen (`chemotactic_pattern_specimen.jpg`, CC BY-SA 4.0) extracting 4 fruiting-body spot aggregates and 362 chemotactic rippling stripe spacings (74.10 um mean wavelength calibrated via 500 um = 125 px scale bar)"
      transfer_boundary:
        - "1D growing domain and 2D planar chemotactic PDE mapped to Myxococcus xanthus rippling stripe ridges and fruiting-body spot aggregates"
      does_not_claim:
        - "Individual-cell C-signal contact-reversal mechanics or 3D viscoelastic fruiting-body stalk elevation"
    source_refs:
      - painter1999
      - keller1970
      - myerscough1992
      - painter2011
    summary: >-
      Pass 2 post-remediation evaluation of `1999-painter-chemotactic-stripe-splitting.py`
      (91.4/100, up from 54.4/100 in Pass 1; +37.0 overall). The remediated script integrates
      the nonlinear 1D and 2D Keller-Segel-Painter chemotactic-reaction-diffusion PDE system
      dn/dt = D_n Lap(n) - div(n chi(c) grad(c)) + r n (1 - n/n_0), dc/dt = D_c Lap(c) +
      alpha n / (1 + beta n) - gamma c at equal diffusivity D_n = D_c = 1.0, verifying the
      analytical chemotactic threshold chi_c = 4.5 (chi_eff_c = 9.0) and critical wavelength
      lambda_c = pi * sqrt(2) = 4.4429 with 0.000% simulated wavelength error across the
      5-regime domain-growth cascade (N = 1, 2, 4, 8 stripes for s = 1, 2, 4, 8 and N = 0 for
      subcritical control chi = 3.0 < chi_c, RMSE = 0.0000), continuous growing-domain stripe
      splitting (1 -> 2 -> 4 stripes), 2D cubic labyrinthine stripe vs quadratic spot selection,
      and automated CV segmentation of the CC BY-SA 4.0 Myxococcus xanthus specimen
      (`chemotactic_pattern_specimen.jpg`, 4 fruiting bodies, rippling stripe wavelength
      74.10 um = 18.52 px, CV = 0.3459), backed by 3 machine-checked Lean 4 theorems in
      `Loop_005_chemotactic_stripe_splitting.lean`.
