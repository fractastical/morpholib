    claim_boundary:
      reported_in_source:
      - Turing (1952) dispersion relation and diffusion-driven instability.
      - Schnakenberg (1979) kinetics f = a - u + u^2 v, g = b - u^2 v.
      - Meinhardt and Klingler (1987) interpret molluscan shell pigment as an activator-inhibitor pattern.
      - Boyajian and Lutz (1992) treat ammonoid suture complexity with a fractal descriptor. Campaign D_f values
        are 1.18, 1.34, and 1.55.
      reconstructed_in_script:
      - a = 0.062, b = 1.140, gamma = 1.15 times onset, Du and Dv solved for lambda = 2.56e-05 m.
      - 96 by 96 periodic explicit Euler integration and a radial-FFT wavelength.
      - Shell counts N = L / lambda at the campaign shell sizes.
      transfer_boundary:
      - The 26 µm field is a mantle-epithelial scale. Mapping its chroma onto the shell photograph is a visualisation,
        not a to-scale pigment restoration.
      does_not_claim:
      - That this photograph, or any published SEM of Ceratites nodosus, resolved a 26 µm pigment wavelength.
      - That the Schnakenberg rates were measured in a Ceratites mantle.
      - That Boyajian and Lutz reported D_f = 1.34 for this specimen.
      - That the 1.088 mm sibling slot's diffusivities were reused.
