simulations:
  - id: meinhardt-echinoderm-pentaradial-symmetry
    name: "Morris (2012), Mooi & David (1998) & Meinhardt (2008) echinoderm bilateral-to-pentaradial hydrocoel ring symmetry breaking & Lovén's Law"
    organism: "Strongylocentrotus purpuratus & Tripneustes gratilla (Echinoidea crown-group echinoderms)"
    script: 2005-meinhardt-echinoderm-pentaradial-symmetry.py
    output: docs/media/echinoderm_pentaradial_symmetry_comparison.png
    extra_outputs:
