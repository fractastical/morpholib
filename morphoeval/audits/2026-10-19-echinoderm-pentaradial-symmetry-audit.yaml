      - mooidavid1998
      - loven1874
      - duboc2005
      - meinhardt2008
    summary: >-
      Pass 1 (v1) baseline evaluation of `2005-meinhardt-echinoderm-pentaradial-symmetry.py`
      (consensus score 52.7/100). Evaluates an algebraic dispersion curve on a static circle
      to pick m* = 5 (72 deg), but omits a genuine Gierer-Meinhardt reaction-diffusion PDE
      simulation on a closing hydrocoel crescent-to-ring domain, omits Lovén's Law (1874)
      asymmetric initiation sequence (II, IV, I, III, V) and biserial peristomial plate
      enlargement (ba-ab-ba-ab-ab), omits Duboc et al. (2005) right-sided Nodal knockdown
      twin-rudiment (2x5 = 10 podia) perturbation, lacks polar Fourier C_5 harmonic
      segmentation of the vendored Tripneustes gratilla echinoid test specimen, and lacks
      runtime SHA-256 dataset verification.
    scores:
      model-fidelity:
        value: 54
        rationale: >-
          Evaluates a static algebraic dispersion curve sigma(m) and analytic cosine ring
          envelope to illustrate m* = 5, but omits time-stepping the Gierer-Meinhardt
          activator-inhibitor PDE during hydrocoel crescent-to-ring closure, omits Lovén's
          Law (II, IV, I, III, V) sequential initiation, and omits Duboc et al. (2005)
          Nodal left-right twin-rudiment (2x5) symmetry breaking.
        evidence:
          - {file: 2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [33, 82], note: "Algebraic dispersion and static cosine ring envelope without PDE integration, Lovén's Law, or Nodal L-R perturbations", supports: true}
      specimen-match:
        value: 46
        rationale: >-
          Displays the vendored Tripneustes gratilla regular echinoid test specimen in
          Panel D without performing polar Fourier C_5 harmonic analysis or detecting
          the 5 ambulacral ray angles and 72.0 deg inter-ray spacings.
        evidence:
          - {file: 2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [106, 108], note: "Raw imshow of Tripneustes gratilla test without polar Fourier C_5 segmentation", supports: false}
      parameter-expressivity:
        value: 49
        rationale: >-
          Evaluates 4 ring radii in the GIF loop, but lacks a full mode-selection staircase
          across 2*pi*R_ring/lambda_c spanning m in {3, 4, 5, 6, 7}, lacks Nodal LOF/GOF
          perturbation sweeps, and provides no CLI parameter flags.
        evidence:
          - {file: 2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [118, 134], note: "Basic 4-radius loop without full mode staircase or CLI parameter overrides", supports: false}
      morphometric-validation:
        value: 50
        rationale: >-
          Exposes only 2 scalar metrics in `measure_morphoeval()` without testing the
          hydrocoel ring mode staircase, Lovén's Law ray initiation rank correlation,
          Duboc Nodal LOF 2x5 twin-rudiment podia count, or specimen C_5 Fourier power.
        evidence:
          - {file: 2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [137, 159], note: "Only 2 baseline metrics in measure_morphoeval()", supports: false}
      source-traceability:
        value: 62
        rationale: >-
          Vendors `datasets/echinoderm_pentaradial_symmetry/` with 5 BibTeX references
          and the CC BY-SA 4.0 Tripneustes gratilla test micrograph, but does not verify
