simulations:
  - id: delphi10000-acropora-millepora-turing-wavelength-s0
    name: "Acropora millepora Holocene Turing wavenumber at 385.2 µm (pass 2)"
    organism: "Acropora millepora"
    domain: morphogenesis
    script: models/2026-delphi10000-acropora-millepora-turing-wavelength-s0.py
    output: docs/media/acropora_millepora_turing_wavelength_s0_comparison.png
    also:
      - docs/media/acropora_millepora_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-acropora-millepora-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, murray1981, gierer1972, dove2001, dangelo2008, lundgren2013, wallace2006]
    summary: >-
      Pass 2 keeps the same Schnakenberg law (a=0.12, b=0.78, D_v/D_u=15.75,
      D_u solved so argmax σ(k) = 2π/385.2 µm) and gauge-fixes the periodic field
      to dihedral 6, the copy whose 12-bin Sobel orientation is closest to the
      Lundgren colony photograph. Orientation KS is 0.054. The comparison figure
      adds the nonlinear ablation inset: std(u) grows under ρ=15.75 and decays
      under ρ=1 (std ratio 0.048). Nonlinear FFT wavelength is 383.6 µm against
      the 385.2 µm target; the diffusivity sweep has Pearson r = 0.999986 and
      RMSE 4.06 µm. The 12-frame 720×540 GIF scores cv_sim_similarity 85.9.
      Murray band center remains 319.4 µm and is not claimed as the selected mode.
      Age is 0 Ma; the chronoseries has no other node.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation for a two-species reaction-diffusion system."
        - "Schnakenberg 1979 kinetics and Gierer & Meinhardt 1972 long-range inhibition."
        - "Murray 1981 band-center wavenumber, reported here as a contrast, not as k_c."
        - "Dove et al. 2001 and D'Angelo et al. 2008: Acropora host GFP-like pigment is light-regulated."
        - "Lundgren et al. 2013 CC BY 4.0 colony photograph (SHA-256 pinned)."
        - "Wallace & Rosen 2006 Eocene Acropora, outside this one-node Holocene series."
      reconstructed_in_script:
        - "D_u = 881.13 µm²/s so the fastest linear mode is 384.7 µm, FFT mode 383.6 µm."
        - "Dihedral code 6 selected by L1 distance of 12-bin Sobel histograms."
        - "KS = 0.054 between specimen and render orientation histograms."
        - "Equal-diffusion ablation: σ_max = -0.038 and std ratio 0.048."
      transfer_boundary:
        - "385.2 µm (3.852e-4 m, log10 = -3.414) is the assigned tier-5 detail scale."
        - "Computer-vision similarity is scored against a centimetre-scale colony photograph."
      does_not_claim:
        - "That 385.2 µm is a published measurement of A. millepora stripe spacing."
        - "That the spot lattice segments the colony branches in the photograph."
        - "A predecessor or successor chronospecies. Series length is 1 at 0 Ma."
        - "That gauge-fixing raised cv_sim_similarity. Pass 1 scored 86.1 and pass 2 scored 85.9."
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          The PDE, Jacobian, dispersion, and D_u bisection are unchanged and
          match Turing 1952 / Schnakenberg 1979 as stated in the docstring.
          k_c is argmax σ, and murray_center_um is a separate, shorter wavelength
          (319.4 µm). The remaining gap is that 385.2 µm is assigned by the
          slot rather than read from a pigment-spacing table.
        evidence:
          - {file: models/2026-delphi10000-acropora-millepora-turing-wavelength-s0.py, lines: [74, 144], note: "Jacobian, σ(h), solve_du, murray_center_um", supports: true}
          - {file: models/2026-delphi10000-acropora-millepora-turing-wavelength-s0.py, lines: [150, 194], note: "Periodic Schnakenberg integrator", supports: true}
      specimen-match:
        value: 80
        rationale: >-
          Pass 2 renders dihedral 6 beside the real CC BY colony photograph.
          The GIF is 12 frames at 720×540 and scores cv_sim_similarity 85.9
          (Sobel orientation, radial FFT, coherency, occupancy). The field is
          still a spot lattice, not a tracing of the branches, and the
          photograph does not resolve 385 µm, so the score stays at 80.
        evidence:
          - {file: docs/media/acropora_millepora_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Colony photo, gauge-fixed field, dispersion, sweep, ablation inset", supports: true}
          - {file: docs/media/acropora_millepora_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, min side 540 px, CV 85.9", supports: true}
          - {file: models/2026-delphi10000-acropora-millepora-turing-wavelength-s0.py, lines: [260, 277], note: "choose_dihedral over the eight copies", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          The diffusivity scale factor moves wavelength monotonically
          (289 µm to 508 µm) with Pearson r = 0.999986 against linear theory.
          Setting ρ = 1 removes the instability on both the dispersion curve
          and the std(u) inset. Dihedral choice is a discrete, measured control
          (code 6, KS 0.054) and does not retune D_u.
        evidence:
          - {file: models/2026-delphi10000-acropora-millepora-turing-wavelength-s0.py, lines: [300, 336], note: "Sweep plus equal-diffusion integrate", supports: true}
          - {file: models/2026-delphi10000-acropora-millepora-turing-wavelength-s0.py, lines: [580, 610], note: "Ablation std inset and sweep scatter", supports: true}
      morphometric-validation:
        value: 88
        rationale: >-
          FFT wavelength 383.573 µm versus reference 385.2 µm. Sweep RMSE
          4.06 µm and Pearson r 0.999986 versus an ideal r of 1. Specimen
          coherency 0.427 versus render coherency 0.722, foreground 0.550
          versus 0.558, orientation KS 0.054 versus 0. These are not
          self-referential copies. Nominal D_u is still tuned, which is why
          the score is 88 rather than the high 90s.
        evidence:
          - {file: models/2026-delphi10000-acropora-millepora-turing-wavelength-s0.py, lines: [280, 282], note: "orientation_ks", supports: true}
          - {file: models/2026-delphi10000-acropora-millepora-turing-wavelength-s0.py, lines: [377, 464], note: "Non-circular specimen and sweep rows", supports: true}
          - {file: datasets/acropora_millepora_turing_wavelength_s0/acropora_millepora_turing_wavelength_s0_metrics.json, lines: [1, 55], note: "Pass-2 numeric results", supports: true}
