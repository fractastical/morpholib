simulations:
  - id: delphi10000-dictyostelium-discoideum-turing-wavelength-s0
    name: "Dictyostelium discoideum Schnakenberg Turing wavelength at 2.304 µm (Holocene, 0 Ma)"
    organism: "Dictyostelium discoideum"
    script: models/2026-delphi10000-dictyostelium-discoideum-turing-wavelength-s0.py
    output: docs/media/dictyostelium_discoideum_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: 2026-10-27-dictyostelium-discoideum-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, taniguchi2013, bretschneider2009, hofer1995, sawai2005]
    phenomenon_size_m: 2.304e-06
    scale_tier: 3_subcellular_um
    geological_age_ma: 0.0
    geological_period: "Holocene (Extant)"
    summary: >-
      Pass 2 keeps the same Schnakenberg integrator. The discrete-Laplacian peak is
      2.303721 µm against the catalog coordinate 2.304 µm. On 23 unstable Fourier
      modes, measured growth versus linear theory has Pearson r = 0.9999999973,
      RMSE = 3.668e-05 /s, and KS = 0.0870. Raising δ = Dv/Du from 14 to 64, with
      Du fixed, moves λ from 2.053 µm to 2.847 µm and is monotonic; δ <= 12 has
      σ_max < 0. Equal diffusion drops var(u) by about 3.8e-05 of its initial value
      while δ=24 raises var(u) by about 247×. The sorocarp mask has foreground
      fraction 0.181, circularity 0.096, coherency 0.580, none equal to the
      reference placeholders. GIF CV similarity against that photograph is 83.2
      (12 frames, 960×720). The photograph remains a fruiting body, not a 2.3 µm
      cortical frame.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: diffusion-driven instability at a finite critical wavenumber."
        - "Schnakenberg 1979: trimolecular kinetics used as the carrier of k_c."
        - "Taniguchi 2013 and Bretschneider 2009: Dictyostelium cortical actin/PIP3 waves are a few-micrometre excitable pattern."
        - "Höfer 1995 and Sawai 2005: extracellular cAMP organizes millimetre-scale aggregation."
      reconstructed_in_script:
        - "Periodic Schnakenberg PDE, discrete-Laplacian dispersion, δ sweep, equal-diffusion ablation, and border-contrast segmentation of the vendored sorocarp."
      transfer_boundary:
        - "2.304 µm (2.304e-06 m, log10=-5.638, tier 3_subcellular_um, detail) is the slot coordinate. Age is 0 Ma, chronoseries 1/1."
        - "A 200 nm predecessor regime admits N=0. A 1 mm aggregation successor is a longer wavelength of the same extant species."
      does_not_claim:
        - "That a paper measured λ = 2.304 µm."
        - "That the sorocarp silhouette is the cortical Turing field."
        - "That Taniguchi phase singularities or mass-conserving Brauns–Frey kinetics were integrated."
        - "That the Lean file was checked by the Lean kernel; lean was not installed."
    scores:
      model-fidelity:
        value: 90
        rationale: "Schnakenberg kinetics, periodic five-point Laplacian, and the unstable-eigenvector initial condition reproduce σ(k) with Pearson r = 0.9999999973 on 23 modes (RMSE 3.67e-05 /s). Ten points are withheld because the biological cortical waves are excitable (Taniguchi 2013), and Schnakenberg is the reconstructed carrier of k_c rather than that phase model."
        evidence:
          - {file: models/2026-delphi10000-dictyostelium-discoideum-turing-wavelength-s0.py, lines: [84, 123], note: "discrete dispersion and eigenvector", supports: true}
          - {file: models/2026-delphi10000-dictyostelium-discoideum-turing-wavelength-s0.py, lines: [166, 233], note: "mode_growth_table and gof_summary", supports: true}
          - {file: datasets/dictyostelium_discoideum_turing_wavelength_s0/dictyostelium_discoideum_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "dispersion_gof pearson_r, rmse, ks_statistic", supports: true}
      specimen-match:
        value: 76
        rationale: "Side by side, the public-domain sorocarp and the cortical spot field are different objects, and the border-contrast mask is a coarse 160×120 segmentation (circularity 0.096), not a hand trace of two stalks. The GIF last frame still shares Sobel, radial-FFT, and coherency structure with the photograph at cv_sim_similarity 83.2, which is a texture match rather than anatomical identity. The score credits that measured resemblance and the labeled scale gap."
        evidence:
          - {file: docs/media/dictyostelium_discoideum_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "sorocarp, mask, activator, dispersion, sweep, ablation", supports: true}
          - {file: docs/media/dictyostelium_discoideum_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 960x720, CV 83.2 against the specimen", supports: true}
          - {file: models/2026-delphi10000-dictyostelium-discoideum-turing-wavelength-s0.py, lines: [259, 316], note: "specimen_segmentation and specimen_mask_image", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "With Du fixed, δ from 14 to 64 raises λ_peak monotonically from 2.053 µm to 2.847 µm and raises σ_max from 0.029 to 0.374 /s. δ = 1, 8, and 12 stay stable (σ_max < 0). The reference δ=24 sits on that curve at 2.304 µm. Domain length is not swept visually; the integer mode count (5 on the cell, 0 at 0.20 µm) is analytic."
        evidence:
          - {file: models/2026-delphi10000-dictyostelium-discoideum-turing-wavelength-s0.py, lines: [235, 257], note: "diffusion_ratio_sweep", supports: true}
          - {file: docs/media/dictyostelium_discoideum_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "δ sweep panel", supports: true}
      morphometric-validation:
        value: 92
        rationale: "Dispersion Pearson r = 0.9999999973 against a reference of 1 (not equal), RMSE = 3.668e-05 /s against a 0.05 screening tolerance, KS = 0.087. Specimen foreground 0.181, circularity 0.096, and coherency 0.580 are measured on the photograph and stored against different reference placeholders. Spot count 32 is not the lattice expectation 25. Orientation KS between photograph and GIF is 0.059. Pixel identity of the sorocarp with the spot field is not claimed."
        evidence:
          - {file: models/2026-delphi10000-dictyostelium-discoideum-turing-wavelength-s0.py, lines: [548, 653], note: "measure_morphoeval non-circular references", supports: true}
          - {file: datasets/dictyostelium_discoideum_turing_wavelength_s0/dictyostelium_discoideum_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "gof, segmentation, ablation ratio, orientation KS", supports: true}
      source-traceability:
