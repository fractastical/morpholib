        rationale: "Primary DOIs were resolved on Crossref or OpenAlex, including Bretschneider 2009 and Sawai 2005 added for the cortical-wave and aggregation-scale boundaries. Specimen SHA-256 e2d2b739211bda975bc175167debf554af4991ce21bc8b1106d1053e6bc95a0b, public domain, Bruno in Columbus, 2008."
