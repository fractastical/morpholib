simulations:
  - id: delphi10000-gekko-gecko-turing-wavelength-s0
    name: "Gekko gecko Turing wavenumber at 242 µm (Holocene, Pass 2)"
    organism: "Gekko gecko (Tokay gecko)"
    script: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py
    output: docs/media/gekko_gecko_turing_wavelength_s0_growth.gif
    also:
      - docs/media/gekko_gecko_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: 2026-10-27-gekko-gecko-turing-wavelength-s0-audit
    source_refs: [turing1952, murray1981, manukyan2017, fofonjka2021, saenko2013, dupont2005]
    summary: >-
      Pass 2 scores the executed sidecar. Linear k_c is calibrated to 242 µm;
      the saturated ring centroid is 232.994 µm (not forced equal). Across six
      diffusivity scales, Pearson r of analytic versus measured wavelength is
      0.9999999999999989 and RMSE is 10.079 µm. Equal-diffusivity ablation std
      is 0.05082 against a patterned std of 1.082. The Dupont dorsum crop has
      nearest-neighbour spacing fraction 0.046 versus 0.0939 on the render,
      coherency 0.4594 versus 0.734, and grayscale KS D 0.4307. Computer-vision
      similarity of the 12-frame 720×540 GIF to that crop is 88.5.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation for a two-species reaction-diffusion system."
        - "Murray 1981 use of that wavelength as a coat pre-pattern."
        - "Manukyan 2017 and Fofonjka 2021: reptile skin can carry a mesoscopic reaction-diffusion pattern (Timon, not Gekko)."
        - "Saenko 2013: gekkotan color colocalizes structural and pigment cells (Phelsuma, not Gekko)."
      reconstructed_in_script:
        - "Schnakenberg field with (a, b) = (0.137, 0.863) and diffusion ratio 1.35 times critical, calibrated so k_c = argmax sigma(k) gives 242 µm."
        - "Diffusivity sweep, equal-diffusivity ablation, reaction-off control, and orange-ocellus segmentation of the Dupont dorsum crop."
      transfer_boundary:
        - "242 µm is the slot's primordium detail scale. The photograph has no scale bar, so it is not a micrometre measurement."
        - "Adult spot spacing is reported only as a fraction of frame width."
      does_not_claim:
        - "That adult Tokay ocelli are 242 µm apart."
        - "That the nonlinear ring centroid equals the linear k_c (measured 232.994 µm)."
        - "That Tokay chromatophores implement the Timon scale automaton."
        - "That granular scale texture is produced by this two-species field."
    scores:
      model-fidelity:
        value: 90
        rationale: "sigma(k) is the larger eigenvalue of J - k^2 D, and k_c is its maximizer, calibrated to 242.000 µm. The onset shortcut is reported separately and is not equal to k_c above threshold. Kinetics remain a Schnakenberg skeleton."
        evidence:
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [119, 195], note: "dispersion, argmax k_c, onset shortcut, calibration", supports: true}
      specimen-match:
        value: 82
        rationale: "The GIF and the comparison figure show orange spots on a pale ground beside Dupont's dorsum. Granular scales and the thin turquoise margin are in the photograph only. CV similarity against the crop is 88.5 on a 12-frame 720×540 animation."
        evidence:
          - {file: docs/media/gekko_gecko_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, field, dispersion, sweep", supports: true}
          - {file: docs/media/gekko_gecko_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 720×540", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "Scaling both diffusivities by s moves analytic lambda as 242*sqrt(s), monotonically, and the measured ring centroid tracks it (Pearson r = 0.9999999999999989, RMSE 10.079 µm). Setting D_v = D_u removes the pattern."
        evidence:
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [261, 340], note: "diffusivity_sweep and ablation_amplitude", supports: true}
      morphometric-validation:
        value: 84
        rationale: "Ring centroid 232.994 µm versus linear target 242 µm. Specimen spacing fraction 0.046 versus render 0.0939. Coherency 0.4594 versus 0.734. KS D 0.4307 versus a same-distribution reference of 0. None of the specimen comparisons copy the reference into the value."
        evidence:
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [587, 714], note: "measure_morphoeval specimen and sweep metrics", supports: true}
      source-traceability:
        value: 92
        rationale: "Crossref-checked DOIs, CC BY-SA 2.0 attribution to Bernard Dupont, and SHA-256 pins for the full frame and the dorsum crop."
        evidence:
          - {file: datasets/gekko_gecko_turing_wavelength_s0/paper_citations.bib, lines: [1, 63], note: "verified citations including the Commons photograph", supports: true}
          - {file: datasets/gekko_gecko_turing_wavelength_s0/gekko_gecko_turing_wavelength_s0_reference.json, lines: [48, 82], note: "SHA-256 pins and crop box", supports: true}
      code-traceability:
        value: 86
        rationale: "Docstring equations, growth_rates, and the onset helper are separate and named. Murray 1981 is cited for the pre-pattern claim without a page-level pin."
        evidence:
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [13, 32], note: "governing equations in the module docstring", supports: true}
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [119, 133], note: "dispersion docstring cites Turing 1952 and Murray 1981", supports: true}
      repro-package:
        value: 90
        rationale: "Seed 3235, --self-test (10/10), and deterministic spectral integration. Signing was not performed: no nanopub profile on this machine."
        evidence:
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [717, 761], note: "self_test including Pearson, ablation ratio, and mode-count check", supports: true}
    remediation:
      - "R5: Independent second assessor was not run."
      - "R7: One photograph. A population of Tokay dorsa would test whether 0.046 spacing fraction is typical."
