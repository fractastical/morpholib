    summary: >-
      Pass 2 (v2). Every v1 remediation item is closed. Thompson's own plates are now measured:
      the isolated Harting calcospherite of Fig. 196 is round to 0.4 % (outer-radius CV 0.0036)
      with a radially striated border (radial-line index +0.57, 82 striae) around an isotropic
      nucleus; the Fig. 195 spherites carry radial lines about their nuclei (z = 7.1 against a
      random-centre null); the crowded spherites of Fig. 197 form a 6.00-neighbour mosaic that is
      statistically indistinguishable from an equal-rate Voronoi mosaic measured by the same
      pipeline (KS p = 0.64) and whose low area CV (0.28 vs Poisson 0.56) shows the nuclei were
      hard-core spaced spherites before impingement; the Fig. 208 spherocrystal has near-constant
      lamella gaps (E1), while the silver-chromate Liesegang specimen follows Thompson's
      'logarithmic ratio' (P = 1.070, geometric fit RMSE 2.4 px vs arithmetic 4.7 px, gaps grow with
      Spearman 0.91). The model side shows that isotropic deposition rounds any nucleus
      (A ∝ R^-0.97) whereas the anisotropic control does not, that bands require a nucleation gap,
      and that scanty supply (eta ≥ 1) produces the spinous forms Thompson describes on p. 424.
      Verdict written to result.json: SUPPORTED (7/7 tests). Residual limits: the E5 P value is not
      tuned to the specimen, Fig. 195/208 centres are manual landmarks, and the ooid rounds faster
      than uniform offset predicts.
    scores:
      model-fidelity:
        value: 88
        rationale: >-
          E1-E5 implemented as in the reference JSON and the Lean module (`radial_growth_laws`
          L158-170, `simulate_front_rounding` L174-207 with isotropic and chessboard metrics,
          `simulate_voronoi_impingement` L211-253 with Poisson and hard-core centres,
          `simulate_liesegang_radial` L257-305 d-dimensional Ostwald supersaturation with
          nucleation/growth thresholds and a threshold-free control, `simulate_dbm_cluster`
          L332-384). Remaining gap: the Mullins-Sekerka boundary is represented by the DBM
          surrogate rather than a sharp-interface diffusion solver, and the E5 model is not
          calibrated to CaCO3/albumen kinetics.
        evidence:
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [158, 207], note: "E1/E2 growth-law tables; E3 isotropic vs chessboard-metric front rounding (exponents -0.97 vs 0.00)", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [211, 253], note: "E4 equal-rate Voronoi with hard-core / Poisson centres and rendered wall image", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [257, 328], note: "E5 radial supersaturation precipitation with nucleation gap, threshold-free control, geometric vs arithmetic spacing fits", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [332, 384], note: "E6 dielectric-breakdown supply sweep and cluster morphometrics", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_023.lean, lines: [32, 195], note: "11 machine-checked theorems for laws 1-5 (Lean 4.35.0, 0 sorry)", supports: true}
