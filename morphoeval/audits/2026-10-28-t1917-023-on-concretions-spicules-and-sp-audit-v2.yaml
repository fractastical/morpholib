        evidence:
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [414, 474], note: "Fig. 196 disc + border segmentation and Fig. 195 landmark-centred radial-line index with null", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [477, 545], note: "same-pipeline mosaic segmentation (Fig. 197 vs rendered Voronoi) and Fig. 208 ring detection", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [548, 633], note: "Liesegang specimen ring radii and ooid nucleus/outer polar boundaries", supports: true}
          - {file: docs/media/t1917_023_on_concretions_spicules_and_sp_comparison.png, lines: [0, 0], note: "12-panel figure: 4 plates with overlays, 4 model panels incl. controls and sweeps, 4 analogue/fit panels", supports: true}
