      - "Calibrate the E5 Liesegang solver (a0, b0, K_ss/K_sp, D) to the silver-chromate specimen so the simulated and measured spacing-ratio distributions pass a KS test, and add a CaCO3/albumen parameter set from Mercedes-Martin et al. (2016)."
      - "Replace the two manual landmarks with an automatic detector (e.g. radial-symmetry transform) for the Fig. 195 nuclei and the Fig. 208 nucleus, and fit the ooid outer boundary with a robust ellipse that excludes touching grains."
      - "Add a sharp-interface diffusion solver to locate the Mullins-Sekerka critical radius directly, and a curvature-dependent accretion term to explain why the ooid rounds faster than uniform offset."
