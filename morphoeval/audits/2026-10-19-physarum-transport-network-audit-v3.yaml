# MorphoEval Pass 3 (v3) Audit — Tero et al. (2010) Science 327:439-442 & Tero, Kobayashi & Nakagaki (2007) J. Theor. Biol. 244:553-564
# Adaptive Physarum Tube Conductivity Network + Peristaltic Shuttle-Streaming Coupling, 2026-10-20 (v3)
#
# Pass 3 re-score of `2010-tero-physarum-transport-network.py` (Slot 057) after the remediation of the single open
# v2 item (couple the Kirchhoff-Poiseuille network to a traveling actomyosin contraction wave) in the instrumented
# loop `morphoeval/runs/2026-10-19-physarum-transport-network-loop-pass3`, superseding
# `2026-10-19-physarum-transport-network-audit-v2` (93.4).
#   - Primary assessor: Claude Fable 5.1 (Phase B subagent; scored from the Phase A handoff, the git diff and the
#     current file at commit 171769b9 — every line pin below was re-verified against that file).
#
# What Pass 3 changed:
#   1. Section 2b: `peristaltic_wave_geometry` / `peristaltic_kirchhoff_cycle` impose a plane contraction wave
#      rho_e(t) = 1 - eps cos(omega t - psi_e) on every tube, modulate D_e rho_e^4 and inject the zero-sum nodal
#      volume source S_i = -(1/2) sum dV_e/dt; Kirchhoff is re-solved at 48 phases (quasi-static). Signed fluxes
#      reverse twice per cycle (shuttle streaming); cycle-averaged <|Q_e|> feeds the slow Tero adaptation.
#   2. `evaluate_peristaltic_shuttle_streaming`: reversal statistics + eps = 0 ablation, pure-peristalsis wavelength
#      sweep (net transport second order in eps, Lean Theorem 5), eps sweep of the coupled pruning (Panels G/H/I,
#      new shuttle-streaming GIF, measurements 10-14, self-test suites 8-11, Lean Theorems 4-5).
#   3. HONESTY FIX that lowers several v2 numbers: the v2 `evaluate_tero_phase_transition_sweep` evaluated
#      closed-form TL/MD/FT sigmoids fitted to the reference table (prescribed output). Pass 3 computes TL_MST,
#      MD_MST, FT and Betti-1 from the pruned graph (`compute_network_morphometrics`, fixed PRUNING_THRESHOLD).
#      The v2 Pearson r = 0.9989/0.9975 and the "Tokyo match" TL = 1.731 / FT = 0.809 were self-referential; the
#      honest values are TL r = 0.987 (RMSE 1.61), FT r = 0.848 (RMSE 0.178), gamma = 1.8: TL 1.703 / FT 0.745 /
#      MD 0.796 / Betti-1 8.
#   4. Dead `--gamma` flag fixed (Panel A / GIF now honour --gamma, --i0, --mu).
#
# Scores below: overall DOWN from 93.4 — not because the script regressed but because v2 was scored on prescribed
# curves and because the new mechanism exposes a calibration (eps default lands TL_MST in the Physarum band) and
# several unsourced / circular references. Scores are uncalibrated criterion-referenced scores on the rubric's
# 0-100 scale. Line numbers refer to the files at commit 171769b9.

