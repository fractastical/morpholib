      - >-
        2010-tero-physarum-transport-network.py:333-338 and 343 — eps = 0.0025 is a calibration that lands
        TL_MST(gamma = 1.8) in the Physarum band (eps = 0 gives 1.149) and ADAPTATION_TIME_S = 1800 s is unsourced;
        together they set the osc/steady flux ratio. Fix eps from a measured relative radius amplitude (Alim et al.
        2013 report tube-radius oscillation amplitudes) and 1/mu from a sourced adaptation timescale, vendor both
        with DOI-level provenance, and re-report TL_MST without a target-landing choice.
      - >-
        2010-tero-physarum-transport-network.py:550-562 and 731-750 — feeding <|Q|> into f(.) suppresses pruning
        for eps >~ 0.005 (FT -> 1, Betti-1 71), so the regime where shuttle flow >> net flow AND the network still
        selects short paths is not reproduced. Implement an alternative shear read-out (rectified net component
        <Q>, or amplitude-relative |Q| - <|Q|>_network) and show which read-out keeps Tero pruning under strong
        peristalsis.
      - >-
        2010-tero-physarum-transport-network.py:349-368 and 371-447 — the contraction wave is imposed (fixed 20 deg
        plane wave, prescribed sinusoid). Replace or supplement with a generated wave (e.g. a phase-oscillator
        field on the nodes with nearest-neighbour coupling, or the Alim et al. hydrodynamic feedback) so that
        wave direction and wavelength are outputs; expose direction / lambda / T_c on the CLI.
      - >-
        2010-tero-physarum-transport-network.py:488-497 and 482-486 — FT is conditioned on currently connected
        food-source pairs (non-monotone tail: FT(2.4) = 0.60 > FT(2.1) = 0.53 while the network is fragmented) and
        MD_MST is normalised by a metric-closure MST so MD_MST < 1 everywhere. Use Tero's definitions (FT counts
        disconnection of any food source; MST built on the same lattice) or report FT only for connected networks.
      - >-
        datasets/physarum_transport_network/physarum_transport_network_reference.json (gamma_phase_transition_sweep
        table and Tokyo/Physarum benchmarks) — not traceable to a digitisation; Tero 2010 Fig. 3 plots statistics
        against I0 for several gamma. Re-digitise the actual figure (with I0 axis) or relabel the table as a
        reconstruction and drop the Pearson-r framing in measurements 3-4.
      - >-
        2010-tero-physarum-transport-network.py:1619-1638 — specimen reference values 33 (Betti-1) and 0.8926
        (Murray ratio) are the script's own earlier outputs. Replace with an independent anchor (e.g. a manual
        count on the specimen recorded in the dataset README, or a published Physarum junction-ratio range) or
        set reference_value to null and say so.
      - >-
        2010-tero-physarum-transport-network.py:853 and 1549-1558 — measurement 1 compares the sigmoid-kernel
