simulations:
  - id: tero-physarum-transport-network
    name: "Tero et al. (2010) Science & Tero, Kobayashi & Nakagaki (2007) J. Theor. Biol. adaptive Physarum tube conductivity network, shortest-path phase transition, Murray's cube law, Tokyo rail Pareto trade-off, and (Pass 3) peristaltic shuttle-streaming coupling"
    organism: "Physarum polycephalum (acellular plasmodial slime mold)"
    script: 2010-tero-physarum-transport-network.py
    output: docs/media/physarum_transport_network_comparison.png
    extra_outputs:
      - docs/media/physarum_transport_network_growth.gif
      - docs/media/physarum_transport_network_shuttle_streaming.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-physarum-transport-network-audit-v2
    claim_boundary:
      reported_in_source:
        - "Tero et al. (2010) Science 327:439-442 & Tero, Kobayashi & Nakagaki (2007) J. Theor. Biol. 244:553-564 Hagen-Poiseuille Kirchhoff flow sum_j (D_ij/L_ij)*(p_i - p_j) = S_i coupled to nonlinear shear-stress tube adaptation dD_ij/dt = f(|Q_ij|) - mu*D_ij"
        - "Two-path parallel competition (L_1 < L_2) exhibiting parallel loop coexistence for gamma < 1, critical shortest-path selection at gamma_c = 1, and winner-takes-all Steiner minimum tree convergence for gamma > 1"
        - "Multi-source Kanto / Tokyo rail Pareto trade-off across gamma optimizing normalized Total Length (TL_MST ~ 1.75), Transport Efficiency (MD_MST ~ 0.85), and Fault Tolerance (FT ~ 0.84) at gamma = 1.8, plus Murray's cube law (r_0^3 = r_1^3 + r_2^3) at gamma = 4/3"
        - "Alim et al. (2013) PNAS 110:13306-13311: actomyosin peristaltic contraction waves with period ~100 s and wavelength of order the organism size drive shuttle streaming (flow reversing twice per cycle) and a second-order net transport; Kamiya (1981): sinusoidal shuttle streaming reverses twice per contraction period"
      reconstructed_in_script:
        - "Full graph Laplacian Kirchhoff pressure solver (`solve_kirchhoff_potentials`, with a zero-sum `extra_sources` vector) across N_f = 36 food sources on a jittered 8x8 lattice; nodal conservation error < 1e-11 and flux antisymmetry < 1e-14"
        - "8-point gamma sweep in [0.8, 2.4] with TL_MST / MD_MST / FT / Betti-1 computed from the pruned graph (`compute_network_morphometrics`, fixed threshold D >= 0.10 max D) against the vendored reference table: TL r = 0.987 (RMSE 1.61), FT r = 0.848 (RMSE 0.178); gamma = 1.8: TL_MST 1.703, FT 0.745, MD_MST 0.796, Betti-1 8"
        - "Reduced two-timescale peristalsis: imposed plane wave rho_e(t) = 1 - eps cos(omega t - 2 pi x_e.n / lambda), instantaneous conductivity D_e rho_e^4, mean-corrected nodal volume source, Kirchhoff re-solved at 48 phases with D frozen; 1.70 reversals/cycle over active tubes (85.1 % reverse; eps = 0 ablation 0 / 0 %), osc/steady flux rms 0.697; pure-peristalsis wavelength sweep argmax lambda*/L = 1.5 (shallow, non-unique); eps sweep of the coupled pruning Betti-1 = [4, 5, 8, 27, 34, 71], Spearman rho = 1.0"
        - "Two-path competition sweep (gamma = 0.6: Q1/I0 = 0.7322; gamma = 1.0, 1.8: 1.0000; gamma = 0 ablation 0.6667) and Murray's cube law (r_1^3 + r_2^3)/r_0^3 = 1.0000 at gamma = 4/3"
        - "Computer-vision segmentation of `physarum_polycephalum_specimen.jpg` (Betti-1 = 33 loops, 3-tier vein-width hierarchy, Y-junction Murray cubic ratio 0.8926 +- 0.2774, N = 17)"
      transfer_boundary:
        - "2D planar multi-source Kirchhoff Poiseuille network on a jittered 8x8 lattice (not Kanto geography) and EDT medial-axis skeletonization mapped to macroscopic Physarum polycephalum plasmodial veins"
        - "The contraction wave is imposed (prescribed sinusoid along a fixed 20 deg direction, single wavelength), not generated by cortex mechanics or hydrodynamic feedback; T_c = 100 s is an input and 1/mu = 1800 s is an unsourced model-scale anchor, so only the 2-per-cycle phase locking, the second-order net transport and the eps-pruning coupling are model results"
        - "eps = 0.0025 is a disclosed calibration chosen so that the gamma = 1.8 network lands in the Physarum TL_MST band; with eps = 0 the same model gives TL_MST = 1.149"
      does_not_claim:
        - "3D actomyosin cortex viscoelastic mechanics, calcium oscillator or Alim et al. (2013) hydrodynamic-feedback generation of the contraction wave, random-network-peristalsis phase statistics, or a compliance model for volume closure"
    source_refs:
      - tero2010
      - tero2007
      - nakagaki2000
      - murray1926
      - bonifaci2012
      - alim2013
      - kamiya1981
    summary: >-
      Pass 3 (v3) evaluation of `2010-tero-physarum-transport-network.py`. The one open v2 item is closed as a
      reduced, honestly-labelled two-timescale model: an imposed actomyosin plane wave modulates every tube's
      conductivity (D_e rho_e^4) and injects a zero-sum nodal volume source into the Kirchhoff Laplacian; the
      quasi-static cycle reproduces shuttle streaming (1.70 reversals/cycle over active tubes, 85 % of tubes
      reverse, 0 in the eps = 0 ablation), a second-order net peristaltic transport that vanishes for frozen
      conductance (Lean Theorem 5), and a monotone feedback of contraction amplitude on long-timescale pruning
      (Betti-1 4 -> 71 across eps 0 -> 0.01, Spearman rho = 1.0). Pass 3 also removed the v2 prescribed TL/MD/FT
      sigmoids; the Fig. 3 statistics are now graph-computed and the honest agreement is weaker (TL r = 0.987 but
      RMSE 1.61 because the dense lattice saturates at low gamma; FT r = 0.848). The overall score falls from 93.4
      because the v2 score rested on prescribed curves and because the new layer exposes: an eps default
      calibrated to the Physarum TL band, an unsourced 1800 s adaptation time, a Fig. 3 reference table of
      unverified digitisation, circular specimen references (0.8926, 33), definitional/recalled peristalsis
      references, two unverified DOIs, a jittered lattice labelled as Kanto, deterministic source-sink pairing,
      and MD_MST / FT definitions that differ from Tero's.
    scores:
      model-fidelity:
        value: 78
        rationale: >-
          The core Tero model is implemented faithfully: graph-Laplacian Kirchhoff solve with grounded sink
          (`solve_kirchhoff_potentials`, L238-L295), sigmoidal reinforcement dD/dt = f(<|Q|>) - mu D on a
          multi-source network (L501-L583), two-path competition (L786-L836) and Murray's law at gamma = 4/3
          (L866-L911), and the Pass 3 peristalsis layer is a coherent reduced model (wave geometry L349-L368,
          cycle solve with mean-corrected volume closure L371-L447, slow coupling through <|Q|> L550-L562) with
          Lean Theorems 4-5. Deductions: the prescribed closed-form TL/MD/FT curves that the v2 score of 95 relied
          on have been removed, and the genuine model does not reproduce the reference TL curve (RMSE 1.61, lattice
          saturates at TL ~ 6.8 for gamma = 0.8 vs 3.42) (-6); the contraction wave is imposed, not generated —
          no cortex / calcium oscillator or hydrodynamic feedback, fixed 20 deg plane wave (-4); feeding <|Q|>
          into f(.) swamps pruning for eps >~ 0.005 (FT -> 1, no shortest-path selection), so the biological regime
          where shuttle flow >> net flow AND pruning still happens is not reproduced (-4); source-sink pairs cycle
          by deterministic arithmetic (L541-L549) rather than Tero's random pair switching (-2); the "Kanto" graph
          is a jittered 8x8 lattice with a sinusoidal food-source selector (L163-L185), not geography (-2); MD_MST
          is normalised by a metric-closure MST (L221-L223) so MD_MST < 1 everywhere (0.43-0.80 vs ref 0.84-0.98),
          a definition mismatch with Tero (-2); volume closure is a uniform mean correction, not a compliance model
          (L416) (-1); Pass 3 credits (graph-computed statistics, honest ablations) prevent a larger fall.
        evidence:
          - {file: 2010-tero-physarum-transport-network.py, lines: [238, 295], note: "Kirchhoff Laplacian solver with grounded sink, Pass 3 zero-sum extra_sources, conservation and antisymmetry checks", supports: true}
          - {file: 2010-tero-physarum-transport-network.py, lines: [371, 447], note: "peristaltic_kirchhoff_cycle: rho_e = 1 - eps cos(omega t - psi_e), D rho^4, nodal volume source -(1/2) dV/dt mean-corrected to zero sum, 48-phase quasi-static solve, reversal count", supports: true}
          - {file: 2010-tero-physarum-transport-network.py, lines: [501, 583], note: "Slow Tero adaptation; when eps > 0 the reinforcement uses the cycle-averaged <|Q|> (L550-L556); eps = 0 reproduces the steady Pass 2 path; deterministic pairing schedule L541-L549", supports: true}
          - {file: 2010-tero-physarum-transport-network.py, lines: [450, 498], note: "Graph-computed TL_MST / MD_MST / FT / Betti-1 replacing the v2 prescribed sigmoids; MD normalised by the metric-closure MST base; FT conditioned on currently connected pairs", supports: true}
          - {file: 2010-tero-physarum-transport-network.py, lines: [158, 235], note: "'Kanto' graph is a jittered 8x8 lattice; food sources chosen by distance to (3.5, 3.5) plus 0.15 sin(1.7x + 1.3y); no geographic data", supports: false}
          - {file: morphoeval/lean/loops/Loop_057_physarum_transport_network.lean, lines: [163, 227], note: "Theorems 4 (zero-sum closed source, half-period reversal, |Q| blind to reversal) and 5 (two-sample net flux = 2 d dp; zero for frozen conductance); file has 5 theorems, 0 sorrys, lean exits 0", supports: true}
      specimen-match:
        value: 80
        rationale: >-
          The SHA-256-pinned specimen photograph is still segmented into 33 loops with a 3-tier vein hierarchy and
          Y-junction Murray ratios (`segment_physarum_specimen`, L919-L1025), and the figure now adds the
          shuttle-streaming time series with ablation (Panel G), net transport vs lambda/L with the Alim line (H),
