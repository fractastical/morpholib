# MorphoEval Pass 1 — Drosophila elegans 1.8 µm Turing wavelength, slot 3182.
# Single builder-assessor. Scores follow the measured run, including the broken
# leaf mask (foreground fraction 1.0) and the untuned nonlinear wavelength (1.669 µm).
audit:
  id: 2026-10-27-drosophila-elegans-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, single agent; no second assessor in this pass)"
    homepage: https://x.ai
  publisher_orcid: "https://orcid.org/0009-0007-4948-9192"
  license: https://creativecommons.org/licenses/by/4.0/
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    note: >-
      Pass 1 working tree for slot 3182. New paths are not on origin/main, so this
      audit does not cite a commit SHA (a SHA that predates the files would 404).
    environment:
      python: "3.12.3"
      numpy: "2.5.4"
      scipy: "1.18.1"
      matplotlib: "3.11.2"
      Pillow: "13.0.0"
references:
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing AM"
    doi: 10.1098/rstb.1952.0012
    year: 1952
    venue: "Phil. Trans. R. Soc. B 237:37-72 (1952)"
  schnakenberg1979:
    title: "Simple chemical reaction systems with limit cycle behaviour"
    authors: "Schnakenberg J"
    doi: 10.1016/0022-5193(79)90042-0
    year: 1979
    venue: "J. Theor. Biol. 81:389-400 (1979)"
  yeh2006:
    title: "Genetics of divergence in male wing pigmentation and courtship behavior between Drosophila elegans and D. gunungcola"
    authors: "Yeh S-D, Liou S-R, True JR"
    doi: 10.1038/sj.hdy.6800814
    year: 2006
    venue: "Heredity 96:383-395 (2006)"
  prudhomme2006:
    title: "Repeated morphological evolution through cis-regulatory changes in a pleiotropic gene"
    authors: "Prud'homme B, Gompel N, Rokas A, Kassner VA, Williams TM, Yeh S-D, True JR, Carroll SB"
    doi: 10.1038/nature04597
    year: 2006
    venue: "Nature 440:1050-1053 (2006)"
  gompel2005:
    title: "Chance caught on the wing: cis-regulatory evolution and the origin of pigment patterns in Drosophila"
    authors: "Gompel N, Prud'homme B, Wittkopp PJ, Kassner VA, Carroll SB"
    doi: 10.1038/nature03235
    year: 2005
    venue: "Nature 433:481-487 (2005)"
simulations:
  - id: delphi10000-drosophila-elegans-turing-wavelength-s0
    name: "Drosophila elegans Schnakenberg Turing wavelength at 1.8 µm (Holocene, 0 Ma)"
    organism: "Drosophila elegans"
    script: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
    output: docs/media/drosophila_elegans_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, yeh2006, prudhomme2006, gompel2005]
    phenomenon_size_m: 1.803e-06
    scale_tier: 3_subcellular_um
    geological_age_ma: 0.0
    geological_period: "Holocene (Extant)"
    fossil_lineage_group: "Sophophora suzukii–biarmipes Wing-Spot Clade"
    summary: >-
      Pass 1. Schnakenberg (a, b) = (0.12, 0.88) on a periodic 22-wavelength
      patch. Du is solved so the linear fastest wavelength is 1.803 µm at
      r/r_c = 1.06. At that fixed Du, predecessor D. deflecta (r/r_c = 2.65)
      selects 2.196 µm and successor D. erecta (r/r_c = 1.48) selects 1.940 µm.
      Continuous-versus-stencil dispersion Pearson r = 0.991, RMSE = 0.0249.
      The nonlinear FFT wavelength is 1.669 µm and was not retuned. The
      green-leaf test G > R+18 returns a foreground fraction of 1.0 because
      the leaf is yellow (R ≈ G). Age 0 Ma, scale 1.8 µm.
    claim_boundary:
      reported_in_source:
        - "Yeh, Liou & True 2006: male D. elegans carries an apical wing melanin patch used in courtship, divergent from D. gunungcola."
        - "Turing 1952: diffusion can destabilize a stable homogeneous state at a finite wavenumber. Schnakenberg 1979: the two-species kinetics used here."
      reconstructed_in_script:
        - "Du is solved so argmax sigma(k) equals 2π/1.803 µm at r/r_c = 1.06. Deflecta and erecta wavelengths are the same law at r/r_c = 2.65 and 1.48."
      transfer_boundary:
        - "Deflecta and erecta are chronoseries neighbors (11/41), not the sister species in the Yeh and Massey papers."
      does_not_claim:
        - "The macro photograph does not resolve 1.8 µm granules."
        - "No published granule-spacing measurement for D. deflecta or D. erecta is being reproduced."
    model_spec:
      model: "Schnakenberg 1979 kinetics with Turing 1952 dispersion; Du solved for lambda = 1.803 µm"
      a: 0.12
      b: 0.88
      elegans_r_over_rc: 1.06
      deflecta_r_over_rc: 2.65
      erecta_r_over_rc: 1.48
      grid_resolution: [220, 160]
      dt: 0.2
      steps: 1100
      seed: 3182
      inputs:
        - datasets/drosophila_elegans_turing_wavelength_s0/drosophila_elegans_turing_wavelength_s0_reference.json
        - datasets/drosophila_elegans_turing_wavelength_s0/drosophila_elegans_specimen.jpg
        - datasets/drosophila_elegans_turing_wavelength_s0/paper_citations.bib
        - datasets/drosophila_elegans_turing_wavelength_s0/scout_manifest.json
        - datasets/drosophila_elegans_turing_wavelength_s0/README.md
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          The script integrates the Schnakenberg PDE with a spectral Laplacian,
          builds the Jacobian at (a, b) = (0.12, 0.88), and solves Du so the
          linear fastest mode is 1.803 µm. The nonlinear lattice that actually
          emerges has FFT wavelength 1.669 µm, so the operating pattern is not
          yet the assigned scale.
        evidence:
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [87, 148]
            note: "Jacobian, onset ratio, sigma(k), and the Du solver"
            supports: true
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [205, 241]
            note: "Spectral Schnakenberg step used for the rendered field"
            supports: true
      specimen-match:
        value: 76
        rationale: >-
          The comparison figure places the real lateral adult next to a hexagonal
          activator lattice, and the growth GIF ends on that photograph with a
          magnified 1.8 µm inset. The lattice reads as ocelli, which is the
          right pattern class, but the photograph cannot confirm granule spacing
          and the wing mask is an ellipse placed from the body centroid.
        evidence:
          - file: docs/media/drosophila_elegans_turing_wavelength_s0_comparison.png
            lines: [0, 0]
            note: "Specimen beside the Pass 1 activator field and the chronoseries bars"
            supports: true
          - file: docs/media/drosophila_elegans_turing_wavelength_s0_growth.gif
            lines: [0, 0]
            note: "12-frame 960x640 growth animation"
            supports: true
      parameter-expressivity:
        value: 62
        rationale: >-
          Three chronospecies ratios at fixed Du move the linear wavelength from
          1.803 µm (elegans) to 1.940 µm (erecta) to 2.196 µm (deflecta), and
          that ordering is plotted. There is no sweep across the ratio range and
          no simulated equal-diffusion control, so expressivity is only shown at
          three hand-chosen points.
        evidence:
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [182, 203]
            note: "chronospecies_table at r/r_c = 2.65, 1.06, 1.48"
            supports: true
          - file: docs/media/drosophila_elegans_turing_wavelength_s0_comparison.png
            lines: [0, 0]
            note: "Bar chart states the missing sweep and ablation in the Pass 1 panel"
            supports: true
      morphometric-validation:
        value: 70
        rationale: >-
          Dispersion goodness-of-fit is real: Pearson r = 0.991 and RMSE = 0.0249
          between the continuous growth rate and the 3-point stencil at dx = 0.180 µm,
          and the nonlinear FFT wavelength (1.669 µm) is reported against 1.803 µm
          rather than overwritten. The specimen foreground fraction is 1.0, which
          is a failed leaf test (the leaf has R ≈ G), so the image morphometric
          in this pass is not usable. No KS statistic and no seed coefficient of variation.
        evidence:
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [150, 180]
            note: "dispersion_goodness_of_fit Pearson r and RMSE"
            supports: true
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [260, 268]
            note: "leaf test G > R+18, which classifies this yellow leaf as foreground"
            supports: false
          - file: datasets/drosophila_elegans_turing_wavelength_s0/loop_3182_metrics.json
            lines: [0, 0]
            note: "nonlinear_wavelength_um 1.669, pearson_r 0.991, foreground_fraction 1.0"
            supports: true
      source-traceability:
        value: 90
        rationale: >-
          Seed paper Yeh, Liou & True 2006 (doi:10.1038/sj.hdy.6800814) plus
          Turing 1952, Schnakenberg 1979, Gompel 2005 and Prud'homme 2006
          (doi:10.1038/nature04597, Crossref-checked) are in the bibliography.
          Dataset SHA-256 pins match the vendored specimen, which is the gallery
          JPEG after Wikimedia Commons returned HTTP 403.
        evidence:
          - file: datasets/drosophila_elegans_turing_wavelength_s0/paper_citations.bib
            lines: [1, 40]
            note: "Yeh 2006, Turing 1952, Schnakenberg 1979, Prud'homme 2006 DOIs"
            supports: true
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [51, 59]
            note: "SHA-256 pins checked before the run"
            supports: true
      code-traceability:
        value: 82
        rationale: >-
          The module docstring names the PDE, the chronoseries contrast, and the
          Pass 1 limit. sigma_of_k is the Turing growth rate and
          solve_activator_diffusivity is the wavelength constraint. Line comments
          do not cite Turing section numbers beyond the Jacobian docstring.
        evidence:
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [1, 40]
            note: "Docstring maps the PDE and the 1.8 µm / 0 Ma assignment"
            supports: true
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [113, 130]
            note: "sigma_of_k and fastest_wavenumber"
            supports: true
      repro-package:
        value: 86
        rationale: >-
          --self-test checks onset signs, wavelength order, dispersion r > 0.98,
          dataset hashes, and the Lean file (7 theorems, no unfinished proofs).
          The render uses seed 3182. The full script reruns in a few seconds.
        evidence:
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [531, 586]
            note: "run_pass1 guards and self_test"
            supports: true
    remediation:
      - "R1: Set NONLINEAR_K_CORRECTION from the measured k_nonlinear/k_linear and re-solve Du so the FFT wavelength is within 2.5% of 1.803 µm."
      - "R2: Replace the G>R+18 leaf test, which scored foreground fraction 1.0 on this yellow leaf, with a low-B leaf mask, the largest red-eye component circularity, and a scale-bar calibration in mm."
      - "R3: Sweep r/r_c at fixed Du and show that the linear wavelength changes monotonically."
      - "R4: Simulate the equal-diffusion ablation and report pattern-std/ablation-std together with a two-sample KS statistic."
      - "R5: Report the coefficient of variation of the nonlinear wavelength across seeds."
