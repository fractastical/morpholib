# MorphoEval audit — Goriely & Tabor (1998) PRL / Gerbode et al. (2012) Science Tendril Perversion, 2026-10-19 (v3)
#
# Pass 3 re-score of `1998-goriely-tendril-perversion-intrinsic-curvature.py` (now 2127 lines; 740 at v2 header,
# ~1230 at the v2 commit) and `datasets/tendril_perversion_intrinsic_curvature/` after the remediation of the single
# open v2 item in the instrumented loop `morphoeval/runs/2026-10-19-tendril-perversion-intrinsic-curvature-loop-pass3`,
# superseding `2026-10-19-tendril-perversion-intrinsic-curvature-audit-v2` (93.1).
#   - Primary assessor: Claude Fable 5.1 (Phase B subagent of slot-064; no second assessor this round)
#
# What Pass 3 changed (the one v2 remediation item, closed in REDUCED form and labelled as such in the script header
# L70-L77 and the section 3b comment L414-L445):
#   1. Section 3b: inertia-free discrete elastic rod advanced by an implicit backward-Euler incremental potential
#      minimised with L-BFGS-B (analytic gradients) each macro step (`simulate_thigmotropic_contact_coiling`,
#      L596-L909). Bending about a contact-gated intrinsic curvature kappa0_i(t) = kappa_contact (1 - exp(-(t -
#      t_arrive_i)/tau)) with the touch signal propagating at v_signal (`kappa0_field`, L629-L632), rigid-cylinder
#      penalty contact, |i-j| >= 3 penalty self-contact, and lagged-normal-force Coulomb dissipation potentials for
#      support and self-contact friction (L741-L761). Quasi-static grip (pull) test L836-L875 compared with
#      Amontons-Coulomb mu*sum(N_i) and the Euler (1762) capstan gain.
#   2. `evaluate_thigmotropic_contact_coiling` (L911-L976): default run, no-support control, frictionless control,
#      mu in {0, 0.3, 0.6, 0.9} friction sweep, R_s in {0.5, 1, 1.5, 2} mm support-radius sweep, stacked-turns
#      self-contact scenario, Darwin (1865) Ch. IV qualitative timings read from the new provenance-tagged JSON.
#   3. Figures: panels G/H added to the comparison PNG (now 8 panels, L1582-L1621); new 4-panel
#      `render_thigmotropic_figure` (L1635-L1691) and GIF `render_thigmotropic_gif` (L1694-L1738).
#   4. 6 new measurements in `measure_morphoeval()` (pass3 block L1830-L1891; 15 total), self-test checks 9-12
#      (L2031-L2056; 12 total), 6 new CLI flags (L2075-L2080), and `--kappa0/--B/--Gamma/--L` now reach
#      `render_growth_gif` (L2119).
#   5. Dataset: `thigmotropic_contact_coiling_reference.json` (SHA-256 pinned, 5th file in `EXPECTED_SHA256`
#      L110-L127), +3 bib entries (Jaffe & Galston 1968, Isnard & Silk 2009, Euler 1762), README section 5.
#   6. Lean: Laws 4-5 (`thigmotropic_contact_gating` L113-L121, `coulomb_grip_capacity` L138-L146), 5 theorems,
#      0 sorrys, `lean` exit 0; registered as equations 4-5 in the math KG YAML with single-range code loci.
#
# Scores below: overall ~91.7, DOWN from 93.1. Two reasons, both found while re-verifying the v2 evidence against the
# current `measure_morphoeval()` output: (i) the v2 morphometric-validation rationale quoted Gerbode soft peak
# overwinding "+0.5873 turns" and kappa_0 "0.6545 mm^-1", but the script (then and now) reports 0.7171 turns (ref
# 0.58, +24 %) and 0.4976 mm^-1 (ref 0.65, -23 %); v2 `.measurements.yaml` entries 4 and 7 confirm this, so the v2
# score was inflated; (ii) the new contact-coiling measurements are internal-control or self-referential (the
# time-to-wrap clock is set by assumed tau_thigmo/v_signal; N_wrap is compared with the no-support control;
# F_hold/mu*sum(N) = 0.67 is a scheme-consistency check with lagged normal forces). Model-fidelity and specimen-match
# also move slightly because the contact solver is a separate bending-only rod (no material-frame twist), so the
# Pass 2 perversion physics and the contact coiling are not solved in one model.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the files in the working tree at commit 8a7928d7 plus this slot's uncommitted Pass 3 edits.
# Campaign-metadata note: dispatch `slug` = "human-brain-folding-3d", the pass3 run yaml `paper` = Tallinen et al.
# (2016) and the prompt organism "Homo sapiens" do not match this tendril script; those fields are outside this
# slot's allowed files and are flagged here rather than edited.

