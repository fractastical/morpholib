simulations:
  - id: goriely-tendril-perversion-intrinsic-curvature
    name: "Goriely & Tabor (1998) PRL / Gerbode et al. (2012) Science Kirchhoff elastic rod tendril perversion, G-fiber overwinding & Pass 3 thigmotropic contact coiling"
    organism: "Climbing plant tendrils (Cucumis sativus, Passiflora caerulea, Bryonia dioica, Echinocystis lobata)"
    script: 1998-goriely-tendril-perversion-intrinsic-curvature.py
    output: docs/media/tendril_perversion_intrinsic_curvature_comparison.png
    extra_outputs:
      - docs/media/tendril_perversion_intrinsic_curvature_growth.gif
      - docs/media/tendril_perversion_intrinsic_curvature_thigmotropic_coiling.png
      - docs/media/tendril_perversion_intrinsic_curvature_thigmotropic_coiling.gif
    also:
      - docs/media/tendril_perversion_intrinsic_curvature_growth.gif
      - docs/media/tendril_perversion_intrinsic_curvature_thigmotropic_coiling.png
      - docs/media/tendril_perversion_intrinsic_curvature_thigmotropic_coiling.gif
    domain: morphogenesis
    status: evaluated
    source_refs: [goriely1998, mcmillen2002, gerbode2012, darwin1865, jaffe1968, isnard2009, euler1762]
    supersedes_audit_id: 2026-10-19-tendril-perversion-intrinsic-curvature-audit-v2
    claim_boundary:
      reported_in_source:
        - "Goriely & Tabor (1998) / McMillen & Goriely (2002): an intrinsically curved Kirchhoff rod with both ends held undergoes a supercritical pitchfork bifurcation below T_c = B kappa_0^2 / (1 + Gamma) into two opposite-handed helices joined by a perversion, with zero net link"
        - "Gerbode et al. (2012): the cucumber tendril's G-fiber ribbon sets the intrinsic curvature; soft tendrils (Gamma < 1) overwind under axial stretch while lignified ones unwind; coil radius and pitch scale across species"
        - "Darwin (1865) Ch. IV: tendrils curve toward a touched side within tens of seconds, complete a wrap around a thin stick within minutes to about an hour, and grasp thin supports more readily than thick ones (qualitative)"
        - "Jaffe & Galston (1968): thigmotropic coiling is a contact-triggered, propagating growth response; Euler (1762): the capstan law exp(mu Theta) for a flexible line on a cylinder"
      reconstructed_in_script:
        - "Timoshenko bilayer kappa_0, exact T_c, 161-node L-BFGS-B Kirchhoff perversion solver with zero-link enforcement and negative controls; 10-point pitchfork sweep; soft vs lignified overwinding; 4-species scaling; DoG segmentation of the SHA-256-locked Passiflora caerulea specimen (Pass 2)"
        - "Pass 3: 61-node inertia-free discrete rod with contact-gated intrinsic curvature pointing toward the support axis, implicit backward-Euler incremental potential (L-BFGS-B), rigid-cylinder penalty contact, penalty self-contact, lagged-normal Coulomb friction on support and self-contact, quasi-static grip test vs mu*sum(N) and exp(mu Theta); no-support, frictionless, friction-sweep, support-radius-sweep and stacked-turns scenarios"
      transfer_boundary:
        - "The contact solver is a separate bending-only rod: it has no material-frame twist, so Gamma = C/B plays no role in contact coiling and the perversion (zero-link) physics of section 3 is not coupled to it"
        - "mu_support, mu_self, kappa_contact, tau_thigmo, v_signal, the 55 deg approach angle and the initial placement touching the support at 25 % of L are provenance-tagged assumptions; the only empirical anchors for Pass 3 are Darwin's qualitative timings and support-size statements"
        - "Friction uses normal forces lagged one macro step; F_hold / mu*sum(N) = 0.67 is a consistency check of the scheme, not an experiment; N_wrap counts loose loops that enclose but do not touch the support (contact fraction 33 % of nodes)"
      does_not_claim:
        - "Circumnutation or support-search before first touch, a measured tendril-on-wood friction coefficient, compliant or rough or finite-length supports, G-fiber lignification time course, or a validated time-to-wrap (tau_thigmo and v_signal were chosen inside Darwin's 5-60 min window and the model's 4.75 min falls slightly below it)"
    summary: >-
      Pass 3 (v3) evaluation of `1998-goriely-tendril-perversion-intrinsic-curvature.py` (overall weighted score
      ~91.7/100, down from 93.1 in v2). The single v2 remediation item is closed in reduced form: a new implicit
      overdamped discrete-rod section 3b simulates contact-gated thigmotropic coiling around a rigid cylindrical
      support with Coulomb support friction and self-contact friction, producing N_wrap = 2.86 turns after 30 min
      (no-support control 0.31, kappa0 stays 0), first full wrap at 4.75 min, max support penetration < 0.025 mm,
      max axial strain < 2 %, F_hold(mu) = {0.0005, 0.108, 0.212, 0.27} mN monotone in mu with the frictionless
      coil slipping at the first load increment, 11 active self-contact pairs with min non-adjacent distance / 2a =
      0.989 in the stacked-turns scenario, and wraps(R_s = 2) / wraps(R_s = 1) = 0.64. The Pass 2 results are
      unchanged (pitchfork r = 0.9974, |Delta_Lk| = 0, soft overwinding r = 0.9806, 4-species r = 0.9999, specimen
      CV = 0.298). The score goes down because re-verification shows the v2 audit misquoted two measurements
      (Gerbode peak overwinding 0.7171 vs ref 0.58 and kappa_0 0.4976 vs ref 0.65 mm^-1, not 0.5873 and 0.6545),
      and because the six new measurements are internal controls or scheme-consistency checks rather than
      comparisons with measured contact-coiling data.
    scores:
      model-fidelity:
        value: 92
        rationale: >-
          Pass 2 core intact: Timoshenko G-fiber bilayer kappa_0, exact T_c = B kappa_0^2/(1+Gamma) and helix
          equilibrium (L164-L246), 161-node L-BFGS-B Kirchhoff perversion solver with zero-link enforcement and
          kappa_0 = 0 / T >= T_c controls (L249-L411). Pass 3 adds a physically reasoned reduced contact model:
          contact-gated intrinsic curvature with signal propagation (`kappa0_field` L629-L632; Lean Law 4), implicit
          backward-Euler incremental potential with penalty cylinder contact and |i-j| >= 3 self-contact, and
          Coulomb dissipation potentials for support and self-contact friction (L741-L761; Lean Law 5), with a grip
          test against mu*sum(N) and the capstan gain (L836-L875). Deductions: the contact rod is bending-only with
          no material-frame twist, so Gamma never enters contact coiling and the two solvers are not one model
          (-4); the preferred-curvature direction is an "axis-seeking" proxy (unit vector toward the support axis,
          frozen per macro step, L642-L654) rather than curvature toward the actual touched flank, which makes
          wrapping partly a construction of the model (-2); friction normal forces are lagged one step and the
          stick/slip law is Huber-regularised, so stick is approximate (-1); the rod is placed already touching the
          support at 25 % of L with a fixed 55 deg approach (`_initial_rod` L516-L530), so there is no first-touch
          event to model (-1).
        evidence:
          - {file: 1998-goriely-tendril-perversion-intrinsic-curvature.py, lines: [164, 246], note: "G-fiber bilayer intrinsic curvature kappa_0, critical tension T_c and equilibrium helix equations (unchanged from Pass 2)", supports: true}
          - {file: 1998-goriely-tendril-perversion-intrinsic-curvature.py, lines: [249, 411], note: "L-BFGS-B Kirchhoff elastic rod perversion solver with zero-link enforcement and negative controls; carries the material-frame twist that the Pass 3 contact rod lacks", supports: true}
          - {file: 1998-goriely-tendril-perversion-intrinsic-curvature.py, lines: [414, 445], note: "Section 3b scope comment: reduced model, energy terms, lagged-normal incremental-potential friction, and the explicit NOT-implemented list (no twist, no circumnutation)", supports: true}
          - {file: 1998-goriely-tendril-perversion-intrinsic-curvature.py, lines: [596, 909], note: "simulate_thigmotropic_contact_coiling: kappa0_field gating (L629-L632), macro_step implicit L-BFGS-B incremental potential (L642-L785), coiling phase (L787-L834), grip test (L836-L875)", supports: true}
          - {file: 1998-goriely-tendril-perversion-intrinsic-curvature.py, lines: [741, 761], note: "Coulomb friction on the support and between self-contacting pairs uses normal forces from the previous macro step (lagged) with a Huber stick threshold", supports: true}
          - {file: morphoeval/lean/loops/Loop_064_tendril_perversion_intrinsic_curvature.lean, lines: [100, 146], note: "Laws 4-5: thigmotropic_contact_gating (untouched -> 0, bounded by saturation) and coulomb_grip_capacity (mu = 0 -> 0, N = 0 -> 0, monotone in mu); 5 theorems total, 0 sorrys, lean exit 0", supports: true}
      specimen-match:
        value: 90
        rationale: >-
          Unchanged specimen pipeline: the SHA-256-locked CC BY-SA Passiflora caerulea tendril JPG is segmented into
          backbone, 50 helical turn apices and the perversion zone (`segment_tendril_perversion_specimen`
          L1144-L1220) and shown in panel E; 4-species coil radius/pitch match (r = 0.9999). Pass 3 adds panels G/H
          and a 4-panel thigmotropic figure + GIF whose 3D rod wraps a grey cylinder in a visually plausible helix.
          Deductions: there is no empirical specimen of a tendril wrapped on a support, so the new coiling output is
