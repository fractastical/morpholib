    remediation:
    - >-
      1998-goriely-tendril-perversion-intrinsic-curvature.py:596-909 vs 249-411 — the contact-coiling rod is a
      separate bending-only discrete rod with no material-frame twist, so Gamma = C/B (the quantity that drives
      Laws 2-3) plays no role in contact coiling and the zero-link perversion physics is never solved together with
      support contact. Pass 4: add a twist degree of freedom (Cosserat / Bishop-frame twist angle per edge) to the
      section 3b rod, or drive section 3 `relax_kirchhoff_perversion_rod` with the contact-gated kappa0 and a
      cylinder constraint, and show that a tethered tendril wrapping a support still forms a perversion.
    - >-
      1998-goriely-tendril-perversion-intrinsic-curvature.py:1841-1850 and 1831-1840 — the time-to-first-wrap
      measurement (4.75 min vs reference 32.5 min) is set by the assumed tau_thigmo = 5 min and v_signal = 5
      mm/min and falls below Darwin's 5-60 min window, and N_wrap uses the no-support control as its reference.
      Pass 4: either digitise a quantitative time course (e.g. Jaffe & Galston 1968 Fig. or Isnard & Silk 2009
      Table) into the JSON and fit tau_thigmo/v_signal to it, or move both entries out of `measure_morphoeval()`
      into a 'predictions' list so the quick gate does not count them as reference-anchored.
    - >-
      1998-goriely-tendril-perversion-intrinsic-curvature.py:483-514 and 1588-1591 — `_wrap_statistics` counts
      winding of every distal node about the support axis, so N_wrap = 2.86 with only 33 % of nodes in contact
      includes loose loops (mean loop radius > R_s + a), yet panel G's title reports "N = 2.9" without the
      qualifier. Pass 4: report tight wraps (nodes with rho < R_s + a + tol) separately from enclosing loops, add
      a contact-feedback growth law so kappa0 keeps rising until contact (the JSON `residual_remediation` already
      proposes this), and label panel G accordingly.
    - >-
      1998-goriely-tendril-perversion-intrinsic-curvature.py:741-761 and 1851-1860 — Coulomb friction uses normal
      forces lagged one macro step, so F_hold / mu*sum(N) = 0.67 is partly a numerical artefact of the lag plus
      partial contact; the self-test accepts any value in (0.1, 1.5) (L2044). Pass 4: iterate the normal force to
      self-consistency within each macro step (or use a semi-smooth Newton / augmented-Lagrangian contact step),
      then tighten the acceptance band and report the capstan-law comparison exp(mu Theta) as a measurement.
    - >-
      1998-goriely-tendril-perversion-intrinsic-curvature.py:1925-1933 and 1955-1963 — the Gerbode soft peak
      overwinding (0.7171 vs 0.58 turns, +24 %) and the G-fiber bilayer kappa_0 (0.4976 vs 0.65 mm^-1, -23 %) miss
      their references by about a quarter; v2 misquoted both. Pass 4: revisit `compute_g_fiber_intrinsic_curvature`
      (L164-L181) bilayer thickness/modulus ratio against Gerbode et al. (2012) Fig. 2 and the overwinding
