# Pass 2. Supersedes the pass-1 Cooksonia pertoni 1.3 µm audit.
# R1 and R2 from pass 1 are closed in the script. R3 and R4 stay open on purpose:
# there is no second assessor and no nanopub profile. Scores are not inflated to hide that.

audit:
  id: 2026-10-27-cooksonia-pertoni-turing-wavelength-s0-audit-v2
  rubric_version: "0.1.0"
  date: "2026-10-27"
  supersedes: 2026-10-27-cooksonia-pertoni-turing-wavelength-s0-audit
  supersedes_audit_id: 2026-10-27-cooksonia-pertoni-turing-wavelength-s0-audit
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, pass 2 after band imprint and angle refinement)"
  publisher_orcid: "https://orcid.org/0009-0007-4948-9192"
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: d80cc9da2650b08c89dee19e5506350ec29b0f2e
    note: >-
      Pass 2 of slot 3153. Wall bands are imprinted after the shell-power match.
      Branch angles use a quadratic peak on a 0.5 degree grid. Unsigned: no
      ~/.nanopub/profile.yml.

references:
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing AM"
    year: 1952
    venue: "Philosophical Transactions of the Royal Society of London B 237:37-72 (1952)"
    doi: 10.1098/rstb.1952.0012
  schnakenberg1979:
    title: "Simple chemical reaction systems with limit cycle behaviour"
    authors: "Schnakenberg J"
    year: 1979
    venue: "Journal of Theoretical Biology 81:389-400 (1979)"
    doi: 10.1016/0022-5193(79)90042-0
  edwards1992:
    title: "A vascular conducting strand in the early land plant Cooksonia"
    authors: "Edwards D, Davies KL, Axe L"
    year: 1992
    venue: "Nature 357:683-685 (1992)"
    doi: 10.1038/357683a0
  edwards2003:
    title: "Xylem in early tracheophytes"
    authors: "Edwards D"
    year: 2003
    venue: "Plant, Cell & Environment 26:57-72 (2003)"
    doi: 10.1046/j.1365-3040.2003.00878.x
  kenrick1997:
    title: "The origin and early evolution of plants on land"
    authors: "Kenrick P, Crane PR"
    year: 1997
    venue: "Nature 389:33-39 (1997)"
    doi: 10.1038/37918

simulations:
  - id: delphi10000-cooksonia-pertoni-turing-wavelength-s0
    name: "Cooksonia pertoni Turing wavelength at 1.3 µm (425 Ma)"
    organism: "Cooksonia pertoni"
    script: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py
    output: docs/media/cooksonia_pertoni_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/cooksonia_pertoni_turing_wavelength_s0_growth.gif
      - datasets/cooksonia_pertoni_turing_wavelength_s0/cooksonia_pertoni_turing_wavelength_s0_metrics.json
    status: evaluated
    supersedes_audit_id: 2026-10-27-cooksonia-pertoni-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, edwards1992, edwards2003, kenrick1997]
    summary: >-
      Same Schnakenberg system as pass 1 (k_c=2.356, lambda_c=1.339 µm at 425 Ma,
      predecessor sigma_max=-0.086, Rhynia successor lambda_c=1.695 µm). Pass 2
      imprints the axial Turing cut on the axis after spectral matching, and
      replaces the 2.5 degree angle grid with a quadratic peak. Specimen radial
      Pearson r is 0.988. GIF computer-vision similarity to the Amgueddfa
      compression is 95.8 at 720x540 and 12 frames. Dispersion Pearson r remains
      1.000. Still one assessor, and still unsigned.
    claim_boundary:
      reported_in_source:
        - "Edwards, Davies & Axe 1992: C. pertoni has a vascular strand with annular to spiral tracheids."
        - "Turing 1952 dispersion relation and Schnakenberg 1979 kinetics."
        - "Edwards 2003: early tracheophyte walls are annular, spiral or scalariform-like."
      reconstructed_in_script:
        - "Parameters chosen so the fastest mode is 1.339 µm."
        - "Successor D_u raised from 0.055 to 0.088 at fixed ratio."
        - "Isotomous axis on a spectrum-matched matrix, with the axial Turing cut darkened on top."
      transfer_boundary:
        - "1.3 µm is the assigned detail scale, not an Edwards measurement."
        - "The museum slab is a centimetre-scale compression; the bands on the GIF are a magnified display of the selected mode."
      does_not_claim:
        - "That Cooksonia had animal-style ocelli."
        - "That the photograph resolves 1.3 µm wall bands."
        - "That the 73 µm sibling parameters apply at this scale."
        - "That this pass was scored by a second model, or that the nanopubs are signed."
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          Unchanged from pass 1. Jacobian trace -0.172 and det 0.922, dispersion
          Pearson r = 1.000 (RMSE 1.4e-4) on modes 3-8 against the discrete
          Laplacian, equal-diffusion predecessor stable. The new imprint uses the
          axial cut of the same activator field; it does not add a second law.
          The 1.339 µm scale is still imposed by the length unit.
        evidence:
          - {file: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py, lines: [95, 144], note: "Jacobian and sigma_+(k)", supports: true}
          - {file: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py, lines: [187, 240], note: "finite-difference growth rates on the discrete Laplacian", supports: true}
          - {file: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py, lines: [457, 475], note: "axial cut of u darkened onto the axis after spectral matching", supports: true}
          - {file: morphoeval/lean/loops/Loop_3153_cooksonia_pertoni_turing_wavelength_s0.lean, lines: [5, 33], note: "trace, det, ratio 10 above threshold, ratio 8 below, 1339 nm < 72720 nm", supports: true}
      specimen-match:
        value: 84
        rationale: >-
          Pass 1 CV similarity was 95.4 with a smooth axis. Pass 2 CV similarity
          is 95.8 after the wall-band imprint, at 12 frames and 720x540. The bands
          are low contrast: they read as a periodic darkening along the branches,
          not as a resolved micrograph of 1.3 µm thickenings. Amgueddfa template
          angle is now 69.97 degrees against the drawn 64.37 degrees. The matrix
          is still a spectral match, not a pixel registration, so the score stays
          in the mid-80s.
        evidence:
          - {file: docs/media/cooksonia_pertoni_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 720x540 GIF with low-contrast axial bands", supports: true}
          - {file: docs/media/cooksonia_pertoni_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, activator, dispersion, sweep", supports: true}
          - {file: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py, lines: [508, 516], note: "imprint_wall_bands called after match_shell_power", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          Unchanged sweep. D_v/D_u in {8, 9, 10, 12, 16, 24} moves sigma_max
          monotonically from -0.037 to +0.282 and lambda_c from 1.271 to 1.617 µm.
          Ratio 8 is stable; ratio 10 is the 425 Ma operating point. a and b are
          still fixed.
        evidence:
          - {file: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py, lines: [622, 631], note: "diffusion-ratio sweep", supports: true}
          - {file: docs/media/cooksonia_pertoni_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "sweep panel", supports: true}
      morphometric-validation:
        value: 89
        rationale: >-
          Dispersion Pearson r = 1.000, RMSE 1.4e-4. Specimen radial Pearson r
          rose from 0.9865 to 0.9882. Gray KS remains about 0.028. Branch angles
          are no longer snapped to a 2.5 degree grid: Amgueddfa 69.97 degrees,
          NMNH 68.03 degrees, drawn axis 64.37 degrees, so value is not equal to
          reference. Successor wavelength 1.695 µm. Stripe-spacing CV of the pure
          mode is 0, reported against a 0.05 tracing tolerance rather than copied
          onto the value. Still one photograph pair and no published tracheid
          spacing to hit.
        evidence:
          - {file: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py, lines: [381, 433], note: "0.5 degree template plus quadratic peak", supports: true}
          - {file: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py, lines: [755, 884], note: "measure_morphoeval with non-equal references", supports: true}
          - {file: datasets/cooksonia_pertoni_turing_wavelength_s0/cooksonia_pertoni_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "pass-2 r, angles, wavelengths", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Same five DOIs and the same CC BY-SA Amgueddfa file, SHA-256
          aa48bf1c9b50b41dc7f1ef6c6fc8b73b112b59e09f2a8d6ebb4d2aa8f97a0d57.
          Nature 1992 is not open access, so no tracheid diameter was read from a figure.
        evidence:
          - {file: datasets/cooksonia_pertoni_turing_wavelength_s0/paper_citations.bib, lines: [1, 62], note: "five DOIs", supports: true}
          - {file: datasets/cooksonia_pertoni_turing_wavelength_s0/cooksonia_pertoni_turing_wavelength_s0_reference.json, lines: [1, 40], note: "1.3 µm, 425 Ma, specimen digest", supports: true}
      code-traceability:
        value: 87
        rationale: >-
          Docstring, Lean inequalities, and the new imprint function are each
          tied to a stated step. The imprint is labelled as a display of the
          axial cut, not as a second PDE. Shell-power matching remains a
          rendering calibration outside Turing 1952, which is why this is not higher.
        evidence:
          - {file: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py, lines: [1, 70], note: "PDE, Jacobian, claim boundary", supports: true}
          - {file: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py, lines: [457, 475], note: "imprint_wall_bands docstring and formula", supports: true}
      repro-package:
        value: 86
        rationale: >-
          --self-test passes on the pass-2 tree: 1.339 µm, dispersion r > 0.98,
          predecessor stable, successor longer, GIF >= 10 frames and >= 480 px.
          Seed 3153. Lean is still not executed in this image, and dependencies
          are the repo requirements file.
        evidence:
          - {file: models/2026-delphi10000-cooksonia-pertoni-turing-wavelength-s0.py, lines: [887, 916], note: "self_test assertions", supports: true}
          - {file: datasets/cooksonia_pertoni_turing_wavelength_s0/README.md, lines: [1, 40], note: "how to run; scale and age stated", supports: true}
    remediation:
      - id: R1
        item: "Closed in pass 2. imprint_wall_bands runs after match_shell_power. CV similarity 95.8. Bands are low contrast."
        status: closed
      - id: R2
        item: "Closed in pass 2. Template is 141 angles and a quadratic peak: Amgueddfa 69.97 degrees, NMNH 68.03 degrees."
        status: closed
      - id: R3
        item: "Open. No independent second assessor. This pass is still builder-scored."
        status: open
      - id: R4
        item: "Open. ~/.nanopub/profile.yml is absent. Nanopubs were built for conformance and were not signed."
        status: open
