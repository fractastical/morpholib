    claim_boundary:
      reported_in_source:
      - Vickaryous and Hall (2006) describe the banded shield and hexagonal osteoderm rosettes of Dasypus novemcinctus.
      - Turing (1952) gives k_c from the dispersion relation; Schnakenberg (1979) gives the two-species kinetics.
      reconstructed_in_script:
      - a=0.10, b=0.90, D_v/D_u=20, D_u solved so linear λ_c=4.108 µm. Sweep scales both diffusivities by 0.64 to
        1.69.
      - Pearson r=0.999999 between measured and analytic wavelengths, RMSE=0.524 µm, replicate CV=0.029, ablation
        amplitude ratio about 5.1e4.
      - 'Photograph segmentation: foreground fraction 0.350, circularity 0.144, coherency 0.411, Sobel band count
        12 against the nominal 9, shoulder spacing 72 px.'
      transfer_boundary:
      - 4.108 µm is the assigned detail rung at 0 Ma, not a length reported by Chen or Vickaryous. The photograph
        is the whole animal.
      - The GIF reuses the photograph's mid-frequency edges so the computer-vision comparison is not an independent
        drawing.
      does_not_claim:
      - That osteoderm rosettes are generated by a 4.1 µm Turing instability.
      - That the Sobel peak count of 12 is a manual census of the nine movable bands.
      - That RMSE of 0.52 µm has been removed; the correlation is high because the error is a nearly constant factor
        of 1.12.
