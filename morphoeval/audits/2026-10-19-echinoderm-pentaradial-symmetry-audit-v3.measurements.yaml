    claim_boundary:
      reported_in_source:
      - 'Morris (2012): the pentaradial adult body plan arises from the left hydrocoel crescent closing into a ring,
        with the five primary podia initiated in the sequence II, IV, I, III, V (Carpenter C, A, D, B, E)'
      - 'Lovén (1874): in each ambulacrum one of the two primary peristomial plates is enlarged, in the asymmetric
        pattern Ib, IIb, IIIa, IVa, Va, and ambulacral/interambulacral plates form alternating biserial columns'
      - 'Mooi & David (1998, 2008): the Ocular Plate Rule — every new coronal plate is added at the ocular (apical)
        end of its column, so plate age increases toward the peristome and plate count increases with test size'
      - 'Duboc et al. (2005): right-sided Nodal signalling represses the right hydrocoel; Nodal morpholino gives
        bilateral twin rudiments (2 x 5 podia) and bilateral Nodal overexpression gives none'
      - 'Luo & Su (2012): BMP2/4 signalling on the left is required for rudiment formation and opposes Nodal'
      - 'Raup (1968), Zachos (2009): echinoid test growth can be modelled as plate addition plus plate growth on
        a domed surface'
      - 'Meinhardt (2008): activator-inhibitor dynamics on a closed domain select a wavenumber set by domain circumference
        / critical wavelength'
      reconstructed_in_script:
      - A circular-ring mode-selection solver with a prescribed dispersion curve, crescent-to-ring closure gates
        at the Lovén ray angles, an m in {3..7} circumference staircase and an equal-diffusion negative control;
        a 2D rudiment field with a binary Nodal switch; a reduced Ocular Plate Rule plate-addition solver on a spherical-cap
        test seeded from the ring lobes, with logistic plate accretion, ocular-end nucleation, Lovén-enlarged primordials
        and an aboral projection measured with the specimen's polar Fourier pipeline; a 1D steady-state screened-Poisson
        Nodal/BMP2-4 gradient model with Hill competence, a dose sweep and a 2D dose map; automated specimen segmentation
        of a Tripneustes gratilla test; 16 reference-anchored measurements; 5 Lean 4 theorems
      transfer_boundary:
      - 'The Section 2 ring solver is NOT an integrated Gierer-Meinhardt PDE: the growth rate sigma(m) = 0.0480
        (1 - 5.2 det^2) is hard-coded (L218, L283), the target mode is seeded in the initial condition (L289), the
        inhibitor is algebraic h = 1 + 0.65 (a - 1) (L318) and the Lovén initiation order is prescribed through
        delay_frac gates (L264-270). m* = 5, the staircase r = 1.0000 and the Lovén order r = 1.0000 therefore hold
        by construction; the DEFAULT_DA/DH/RHO constants (L120-123) do not enter the dynamics'
      - 'The OPR solver is 1D meridional plate heights in rectangular azimuth bands on a sphere: no plate-plate
        mechanics, Voronoi packing, FEM or ambitus flattening; growth factor 40, colatitudes 22/150 deg and h_nuc/h_max
        are labelled assumptions in the reference JSON; the Amb/IA plate ratio target 3.0 is approximate and the
        emergent value 2.06 misses it'
      - The Nodal/BMP2-4 gradient parameters were tuned only so that WT / MO / GOF give 5 / 10 / 0 podia; EC50 =
        0.175 x WT is a model prediction with no empirical anchor; no Lefty/Pitx2 and no explicit Nodal-BMP antagonism
        term
      - The specimen is Tripneustes gratilla while the header organism is S. purpuratus; specimen references (C_5
        = 0.9255, ray angles) are the script's own segmentation outputs, not independent measurements
      does_not_claim:
      - Quantitative reproduction of Duboc (2005) penetrance percentages or in-situ intensity profiles, mechanical
        plate packing, measured plate counts for any named species, or an integrated activator-inhibitor PDE in
        Section 2
