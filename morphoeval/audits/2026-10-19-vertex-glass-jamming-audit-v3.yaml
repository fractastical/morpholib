          2016 prefactor convention (`energy_prefactor=2`, L642), exact dE/dr_i via dA/dh = perp(h_next - h_prev)/2,
          dP/dh and the closed-form circumcenter Jacobian (L590-606, L635-724), overdamped Euler with polarity
          noise sqrt(2 D_r dt) (L795-905), FIRE quench (L731-782), D_eff = D_s/D_0 as defined by Bi (L865-872);
          the energy-minimised <q>(p_0) reproduces Bi (2015) Fig. 2 pinning from the energy alone (L1049-1086);
          Bi (2015) Eq. 2, the regular-polygon bounds and the k-Gamma PDF are exact (L143-178, L235-247).
          Deductions: `simulate_vertex_unjamming_regime` (L304-458) sets initial disorder, pure-shear stretch,
          drift noise and migration speed from phase-indexed tables (L336-352, L403-428) instead of minimising
          the energy, so Panels A1-A4, the GIF and the p_0 sweep (L460-504) are phenomenological (-5);
          Delta e_T1 and G are the hard-coded linear law 0.40 r dp and 1.00 r dp (L180-233), not computed from
          the landscape (-3); the SPV boundary uses a script-defined per-free-path T1 threshold 0.02 (L103, L873)
          rather than Bi's long-time D_eff < 1e-3 because the T = 150 window leaves a ~5e-3 D_eff floor (-2);
          the Park trajectories q(t) are closed-form fits (L532-536), not model outputs (-1).
