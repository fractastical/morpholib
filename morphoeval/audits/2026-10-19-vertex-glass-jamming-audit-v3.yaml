# MorphoEval audit — Bi, Lopez, Schwarz & Manning (2015) Nature Physics, Park et al. (2015) Nature Materials
# & Bi, Yang, Marchetti & Manning (2016) Physical Review X — Vertex Glass Unjamming + SPV Motility, 2026-10-20 (v3)
#
# Pass 3 re-score of `2015-bi-vertex-glass-jamming.py` (2099 lines; 13 self-test checks) after the remediation
# loop `morphoeval/runs/2026-10-19-vertex-glass-jamming-loop-pass3`, superseding
# `2026-10-19-vertex-glass-jamming-audit-v2` (91.0).
#
# What Pass 3 changed (the single open v2 remediation item):
#   1. Coupled the vertex energy to self-propelled active-Brownian motility (Bi et al. 2016 PRX Eqs. 1-3):
#      exact analytic Voronoi forces via circumcenter Jacobians (`spv_voronoi_forces`, FD-verified to 9e-9),
#      overdamped Euler integrator with polarity noise (`simulate_spv_active_monolayer`), FIRE inherent-structure
#      quench, time-origin-averaged MSD -> D_s, D_eff = D_s/D_0, per-cell T1 rate; a (p_0, v_0) glass map at
#      D_r = 1 (24 runs), a D_r sweep at v_0 = 0.30 (3 values), and an energy-minimised (v_0 = 0) <q>(p_0) sweep
#      overlaid on Panel B2.  Figure grew 2x5 -> 3x5 (Panels C1-C5); GIF gained an SPV motile panel.
#   2. New vendored reference `datasets/vertex_glass_jamming/bi_2016_spv_motility_reference.json` (claims,
#      conventions, finite-time estimators; one figure-derived number explicitly flagged approximate).
#   3. Lean 4: Theorems 5-6 (`spv_motility_lowers_critical_shape_index`,
#      `spv_free_active_diffusivity_monotone_in_motility`), 6 theorems total, 0 sorrys; registered in
#      `morphoeval/math_kg_loops/bi-vertex-glass-jamming.yaml`.
#   4. `measure_morphoeval()` 8 -> 15 measurements (7 SPV); `self_test()` 8 -> 13 checks; CLI gained
#      `--spv-time/--spv-cells/--spv-seed/--spv-point`.
#
# Scores below: overall 90.1, DOWN from 91.0.  The remediation exposed that the Pass 2 "vertex-Voronoi
# simulation" behind Panels A1-A4, the GIF, the p_0 sweep and 3 of the 8 original measurements is a
# phenomenological relaxation whose stretch/noise/speed amplitudes are tabulated by phase rather than derived
# from the energy, and that the T1-barrier / shear-modulus "scaling" is a hard-coded linear law.  The new SPV
# module is the first force-based model in the script; its glass boundary is a finite-time (T = 150, N = 100,
# one seed) estimate using a script-defined per-free-path T1 criterion rather than Bi's long-time D_eff < 1e-3.
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale.  Line numbers refer to the
# working-tree files at commit 7e4f207 (uncommitted Pass 3 edits; verified against the current file).

