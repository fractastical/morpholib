simulations:
  - id: bi-vertex-glass-jamming
    name: "Bi et al. (2015), Park et al. (2015) & Bi et al. (2016) zero-temperature shape-index unjamming, asthmatic bronchial epithelial rigidity transition and self-propelled Voronoi motility-driven glass transition"
    organism: "Human (Homo sapiens) bronchial epithelial monolayer & Drosophila epithelial sheet"
    script: 2015-bi-vertex-glass-jamming.py
    output: docs/media/vertex_glass_jamming_comparison.png
    extra_outputs:
      - docs/media/vertex_glass_jamming_growth.gif
    status: evaluated
    source_refs:
      - bi2015
      - park2015
      - bi2016
      - atia2018
      - staple2010
      - bitzek2006
    claim_boundary:
      reported_in_source:
        - "Bi, Lopez, Schwarz & Manning (2015) Nature Physics Eqs. 1-2 & Figs. 1-4: dimensionless vertex energy e = (1/2) sum [(a_i - 1)^2 + r(p_i - p_0)^2] exhibits a density-independent rigidity transition at critical target shape index p_0^* approx 3.813 (> p_5 approx 3.8119 > p_hex approx 3.7224), where T1 energy barrier Delta e_T1(p_0) and static shear modulus G(p_0) vanish identically for p_0 >= p_0^*."
        - "Park et al. (2015) Nature Materials Figs. 1-4 & Atia et al. (2018) Nature Physics Figs. 1-2: primary human bronchial epithelial cells (HBECs) from non-asthmatic donors jam into a solid monolayer by Day 14 (q = 3.792 < 3.813), whereas asthmatic donor HBECs (q = 3.955 > 3.813) and mechanically compressed HBECs (30 cm H2O, q = 3.945 > 3.813) remain unjammed, with standardized cell shapes obeying a universal k-Gamma distribution."
        - "Bi, Yang, Marchetti & Manning (2016) Physical Review X Eqs. 1-3 & Figs. 1, 3-4: in the Self-Propelled Voronoi model dr_i/dt = mu F_i + v_0 n_i with rotational diffusion D_r, the glass transition line p_0^c(v_0, D_r) meets p_0 = 3.81 at v_0 -> 0, is lowered by motility v_0, rises toward 3.81 as persistence shortens (larger D_r), and the observed shape index at the boundary is q_c approx 3.81 for all (v_0, D_r); solids have D_eff = D_s/D_0 < 1e-3 at long times."
      reconstructed_in_script:
        - "2D periodic confluent monolayer phenomenological vertex-Voronoi relaxation across 4 regimes (Non-Asthmatic Solid p_0=3.70, Critical Point p_0^*=3.813, Asthmatic Fluid p_0=3.955, and Zero-Perimeter-Modulus Ablation r=0.0), 8-point p_0 phase sweep in [3.55, 4.00], and Park et al. (2015) Days 3-18 bronchial maturation trajectories (curve fits to the vendored Park values)."
        - "Junction-guided Voronoi segmentation of the human in situ monolayer micrograph (`human_epithelial_monolayer_specimen.jpg`, N=101 interior cells, <q>=3.7961, k-Gamma correlation r = 0.9334)."
        - "Pass 3: Bi et al. (2016) SPV model with exact analytic Voronoi forces (circumcenter Jacobians, FD-verified), FIRE inherent-structure quench, overdamped active-Brownian integration (dt = min(0.1, 0.2/D_r)), time-origin-averaged MSD -> D_s and D_eff = D_s/D_0, per-cell T1 rate; a 6x4 (p_0, v_0) glass map at D_r = 1 (boundary p_0^c(v_0) = 3.828, 3.755, 3.678, 3.594 for v_0 = 0.05, 0.15, 0.30, 0.45; linear intercept p_0^c(0) = 3.850, slope alpha = 0.575; q_c = 3.818 +/- 0.013), a D_r sweep at v_0 = 0.30 (p_0^c = 3.677, 3.678, 3.748 for D_r = 0.25, 1, 4; D_s at p_0 = 3.70 decreasing in D_r), and an energy-minimised v_0 = 0 <q>(p_0) sweep (Pearson r = 0.9966 vs the Bi 2015 reference, solid-branch <q> = 3.829)."
      transfer_boundary:
        - "2D apical polygonal projection of pseudostratified bronchial and simple monolayer epithelia; the vendored specimen is a human corneal endothelium micrograph used as a generic human polygonal monolayer, not an HBEC culture."
        - "The SPV glass boundary is a finite-time (T = 150 in units of 1/(mu K_A A_0)), finite-size (N = 100), single-seed estimate classified by a script-defined per-free-path T1 criterion (Gamma_T1 / v_0 > 0.02); Bi (2016)'s long-time D_eff < 1e-3 criterion is not resolvable in this window (solid floor ~5e-3) and D_eff is reported alongside only."
      does_not_claim:
        - "Does not model 3D mucociliary beating hydrodynamics or sub-epithelial airway smooth muscle contraction."
        - "Does not compute the T1 energy barrier or shear modulus from the energy landscape (Panel B1 uses the hard-coded linear law Delta e_T1 = 0.40 r (p_0^* - p_0), G = 1.00 r (p_0^* - p_0)); does not reproduce the full curved Bi (2016) Fig. 1(a) boundary or a (v_0, D_r) surface beyond two orthogonal slices; does not include cell division, apoptosis or alignment interactions."
    summary: >-
      Pass 3 (v3) evaluation of `2015-bi-vertex-glass-jamming.py` (90.1/100, down from 91.0 in Pass 2).
      The single open v2 item is closed: the script now implements the Bi et al. (2016) Self-Propelled
      Voronoi model with exact analytic forces on Voronoi centres (verified against finite differences to a
      relative error of 9e-9, momentum-conserving, margin-tiling identical to the full 3x3 tiling), an active
      Brownian integrator, FIRE quench, and finite-time dynamical (D_eff, T1 rate) and structural (<q>)
      order parameters.  It maps the (p_0, v_0) glass boundary at D_r = 1, which is monotonically lowered by
      motility (alpha = 0.575) and extrapolates to p_0^c(0) = 3.850 against Bi's 3.81; the boundary shape
      index is q_c = 3.818 +/- 0.013 against the Bi (2016) Fig. 4 value 3.81; the D_r slice shows the solid
      region growing with D_r (p_0^c 3.677 -> 3.748) and D_s falling; and the energy-minimised v_0 = 0 <q>(p_0)
      reproduces the Bi (2015) pinning curve with r = 0.9966.  The overall score nonetheless falls because the
      force-based module exposes that the original regime simulator, p_0 sweep and bronchial trajectories are
      phenomenological (phase-tabulated stretch, noise, migration speed; curve-fit q(t)), the T1-barrier/shear
      law is hard-coded, the boundary criterion is script-defined and finite-time with one seed, and one new
      reference number is an unverified figure reading.  Backed by 6 machine-checked Lean 4 theorems (0 sorrys)
      and 13 self-test checks.
