simulations:
  - id: przemyslaw-allometric-compound-leaf
    name: "Bilsborough et al. (2011), Barkoulas et al. (2008), Vlad et al. (2014) & Kierzkowski et al. (2019) growing leaf margin PIN1-Auxin-CUC2-RCO feedback loop: emergent integrated-contour dissection, growing cellular spring-lattice lamina with Mitchison-canalized veins and microtubule-anisotropic growth, and Cardamine hirsuta specimen segmentation"
    organism: "Arabidopsis thaliana / Cardamine hirsuta (growing leaf margin epidermis, serration teeth, and compound leaflets)"
    script: 2011-przemyslaw-allometric-compound-leaf.py
    output: docs/media/allometric_compound_leaf_comparison.png
    extra_outputs:
      - docs/media/allometric_compound_leaf_growth.gif
      - docs/media/allometric_compound_leaf_vertex_mesh.png
      - docs/media/allometric_compound_leaf_mesh_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-allometric-compound-leaf-audit-v2
    claim_boundary:
      reported_in_source:
        - "Bilsborough et al. (2011) PNAS 108:3424-3429 interconnected leaf margin feedback loops: Loop 1 (CUC2 promotes PIN1 up-the-gradient polarization rho_{ij} propto (1 + gamma_CUC2 C_i) exp(beta A_j)), Loop 2 (Auxin represses CUC2 transcription C_i = C_max / (1 + (A_i/K_A)^n)), Loop 3 (differential normal margin outgrowth v_n(s) = v_0 [A(s)^m/(K_g^m+A(s)^m)] (1 - eta_sinus C(s)) with intercalary tooth insertion)"
        - "Vlad et al. (2014) Science 343:780-783 and Kierzkowski et al. (2019) Cell 177:1405-1418: local sinus growth repression by RCO in Cardamine hirsuta converts shallow serrations into deeply incised compound leaflets; growth-based framework with polarity-aligned anisotropic growth"
        - "Mitchison (1980) Proc. R. Soc. B 207:79-109 flux-feedback canalization; Scarpella et al. (2006) Genes Dev 20:1015-1027 marginal convergence points initiate vein strands; Hamant et al. (2008) Science 322:1650-1655 / Sampathkumar et al. (2014) eLife 3:e01967 microtubule-aligned anisotropic wall reinforcement"
      reconstructed_in_script:
        - "Prescribed-template margin Auxin/CUC2 profile (convergence peaks are Gaussian inputs, L198-216) with Loop 1 / Loop 2 / Loop 3 algebraic identities verified exactly (Law 1 residual 5.7e-14, Law 2 residual 0.0, Law 3 identity 0.0) and strong Auxin-CUC2 antiphase (r = -0.991)"
        - "EMERGENT integrated margin contour (`integrate_margin_outgrowth`, radial proximodistal growth + outward normal term) with emergent radial dissection index: cuc2-1 0.000 (ref 0.012), cuc2-1D 0.000 (ref 0.025), At WT 0.230 (calibration datum 0.228), Ch rco 0.219 (ref 0.312), mir164a-4 0.233 (ref 0.445), Ch WT 0.254 (ref 0.785); 6-genotype Pearson r = 0.807 (p = 0.052, RMSE 0.237); stages P3-P6 I_D 0.000 / 0.168 / 0.219 / 0.256 with 1/3/5/7 peaks; eta x growth-duration sweep ceiling 0.427"
        - "Growing 2D cellular spring-lattice lamina (441 vertices, 804 triangles, bilaterally symmetric) with screened-Poisson growth field, procambial midvein, Mitchison-canalized lateral veins (4/4 At WT, 6/6 Ch WT, 0 cuc2-1 drained to the midvein), vein-axis microtubule anisotropy a_vein = 0.20 (ablation run a = 0): mesh I_D 0.117 (At), 0.131 (Ch), 0.000 (cuc2-1), 0.102 (Ch, MT off); 0 inverted elements; max residual force 1e-3; realised vein-axial stretch ratio 1.04"
        - "Automated excess-green chromatic + Euclidean distance-transform segmentation of the SHA-256-locked Cardamine hirsuta botanical specimen (32 compound leaflet lobes, perimeter dissection ratio 4.0939, radial tip-to-sinus dissection index 0.5202 +- 0.0128 SE) — unchanged from v2"
      transfer_boundary:
        - "1D prescribed-template epidermal margin signal -> 2D integrated margin contour and 2D growing cellular spring-lattice lamina (reduced-dimensional stand-in for the requested 3D FE vertex mesh); 2D botanical specimen contour morphometrics on a whole rosette canopy, not a single leaf"
      does_not_claim:
        - "3D finite-element adaxial-abaxial lamina thickness mechanics, cell division, or vascular bundle differentiation inside the rachis"
        - "Emergent auxin convergence-point patterning (PIN1 up-the-gradient transport is not solved; tooth number and spacing are inputs)"
        - "Reproduction of Cardamine hirsuta leaflet-level dissection (I_D 0.785) or of the mir164a-4 / rco benchmark ordering"
        - "Realised cell-scale growth anisotropy from microtubule stress feedback (a_lamina = 0.0 by default; the vein-axis channel yields a 1.04 axial stretch ratio)"
    source_refs:
      - bilsborough2011
      - barkoulas2008
      - vlad2014
      - kierzkowski2019
      - mitchison1980
      - scarpella2006
      - hamant2008
      - sampathkumar2014
    summary: >-
      Pass 3 (v3) evaluation of `2011-przemyslaw-allometric-compound-leaf.py` (overall 68.2/100, down from 93.1
      in v2). The remediation replaced the Pass 2 closed-form dissection targets with an emergent radial-growth
      margin integrator and added a growing 2D cellular spring-lattice lamina with Mitchison-canalized lateral
      veins (every convergence point drains to the midvein in WT, none in cuc2-1) and Hamant-type vein-axis
      microtubule anisotropy, backed by 2 new machine-checked Lean 4 theorems (5 total, 0 sorrys), 20 reference-
      anchored measurements and a 12-check self-test. Doing so exposed that v2's 6-genotype r = 0.998 was
      circular: with one gain calibrated on Arabidopsis WT (0.230 vs 0.228) the mutants emerge smooth (I_D = 0)
      but Cardamine WT reaches only 0.254 (ref 0.785; sweep ceiling 0.427), mir164a-4 and rco are mis-ordered,
      and the emergent r is 0.807 (p = 0.052). The margin auxin peaks remain a prescribed template, the benchmark
      I_D references carry no figure provenance, the specimen "references" are the script's own outputs, the mesh
      teeth sit at the cell-scale resolution limit and the lamina stress-feedback anisotropy is disabled. The
      specimen segmentation (32 lobes, I_D 0.5202) is unchanged.
    scores:
      model-fidelity:
        value: 72
        rationale: >-
          Loops 1-3 of Bilsborough et al. (2011) are implemented as exact algebraic laws on a 1D margin profile
          (L154-317), the margin contour is now genuinely integrated from the Loop 3 outgrowth velocity
          (`integrate_margin_outgrowth`, L417-475; emergent I_D L476-523) and the new `GrowingLaminaSpringMesh`
          (L654-1137) is a real overdamped elastic solver (Hookean springs + area penalty, L999-1025) with
          rest-length growth from an anisotropic tensor (L1027-1065), a screened-Poisson growth field (L872-887),
          Mitchison canalization on sparse linear solves (L905-927) and a flux-connected vein topology check
          (L929-947); 5 Lean 4 theorems (3 v2 + Hamant partition L164-192 + Mitchison feedback L206-224) mirror
          the code. Deductions: the auxin convergence peaks are a prescribed Gaussian template (L198-216; disclosed
          L187-194), so Loop 1 is verified only as an identity and tooth number/spacing are inputs (-10); the
          remediation asked for a 3D FE vertex mesh and the delivered lamina is 2D, without thickness, division or
          adaxial/abaxial layers (-8); the stress-feedback lamina anisotropy is implemented (L985-990) but disabled
          by default (a_lamina = 0.0, L706) because it destabilised the explicit relaxation (-5); the equal-duration
          growth law cannot produce leaflet-level dissection (sweep ceiling 0.427, L1186-1215) (-5).
        evidence:
          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [417, 523], note: "integrate_margin_outgrowth: material-polyline radial-growth integrator (rate k_allometric + kappa_n * (v_n - <v_n>), outward normal term, arclength resampling) and dissection_index_radial (find_peaks on log R, I_D = 0 when no lateral tooth)", supports: true}
          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [654, 1137], note: "GrowingLaminaSpringMesh: symmetric half-mesh Delaunay + mirror (L738-863), screened-Poisson growth field, Mitchison canalization (L905-927), vein topology (L929-947), anisotropic growth tensors (L949-997), relaxation (L999-1025), run/summary", supports: true}
          - {file: morphoeval/lean/loops/Loop_037_allometric_compound_leaf.lean, lines: [164, 224], note: "hamant_2008_microtubule_anisotropic_growth_partition (gamma_par + gamma_perp = 2gS, gamma_par - gamma_perp = 2gaS > 0) and mitchison_1980_canalization_conductance_feedback (D' > D above threshold, D' < D at zero flux); file verifies with 0 sorrys", supports: true}
          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [187, 216], note: "HONESTY NOTE and convergence_drive: auxin peaks are prescribed Gaussians at u = +-0.22 k; PIN1 up-the-gradient transport is not solved", supports: false}
          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [705, 706], note: "a_vein = 0.20 but a_lamina = 0.0: the Sampathkumar (2014) stress-feedback channel is switched off by default", supports: false}
      specimen-match:
        value: 58
        rationale: >-
          The SHA-256-pinned Cardamine hirsuta specimen is segmented as in v2 (`segment_cardamine_compound_leaf_specimen`,
          L1250-1338: 32 leaflet lobes, perimeter ratio 4.0939, I_D 0.5202 +- 0.0128) and the comparison figure
