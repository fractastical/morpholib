          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [1138, 1177], note: "simulate_lamina_mesh_morphospace: At WT, Ch WT, cuc2-1 and Ch WT with anisotropy_on=False (MT ablation)", supports: true}
          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [2021, 2046], note: "CLI: --beta/--gamma-cuc2/--k-a forwarded to render_outputs; --mesh-steps, --no-mesh, --print-measurements", supports: true}
