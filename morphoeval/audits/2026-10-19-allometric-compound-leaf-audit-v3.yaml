          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [426, 427], note: "kappa_n = 0.50 calibrated on the At WT datum: the At WT measurement is a fit", supports: false}
      source-traceability:
        value: 72
        rationale: >-
          `datasets/allometric_compound_leaf/` now carries 8 BibTeX entries whose DOIs were all resolved against
