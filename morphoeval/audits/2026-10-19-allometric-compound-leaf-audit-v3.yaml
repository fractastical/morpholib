          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [1076, 1080], note: "Mesh I_D uses prominence 0.03 with a 2-sample moving average; detected teeth are single-vertex features (At 0.117, Ch 0.131, Ch MT-off 0.102)", supports: false}
