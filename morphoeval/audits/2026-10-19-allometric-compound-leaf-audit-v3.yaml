# MorphoEval Pass 3 (v3) Audit — Bilsborough et al. (2011) PNAS, Barkoulas et al. (2008) Nat. Genet., Vlad et al. (2014) Science & Kierzkowski et al. (2019) Cell
# PIN1–Auxin–CUC2–RCO Feedback Loop & Leaf Margin Serration vs Compound Leaflet Dissection, 2026-10-20 (v3)
#
# Pass 3 remediation-round re-score of `2011-przemyslaw-allometric-compound-leaf.py` (Slot 037) in the instrumented
# loop `morphoeval/runs/2026-10-19-allometric-compound-leaf-loop-pass3`, superseding
# `2026-10-19-allometric-compound-leaf-audit-v2` (93.1).
#
# What Pass 3 changed (the single v2 remediation item, closed in a reduced, honestly-labelled form):
#   1. "Couple the 2D epidermal margin contour PDE to a 3D finite-element cellular vertex mesh with explicit
#      procambial midvein/lateral vein differentiation and anisotropic cell-wall microtubule reinforcement" ->
#      `GrowingLaminaSpringMesh` (L654-1137): a growing 2D triangulated cellular spring-lattice lamina (441
#      vertices / 804 linear-triangle elements, exactly bilaterally symmetric by construction, L738-863), driven by
#      the margin PDE through a screened-Poisson growth field (L872-887), with a procambial midvein, lateral veins
#      DIFFERENTIATED by Mitchison (1980) flux canalization from every marginal auxin convergence peak to the
#      midvein (L895-947; 4/4 At WT, 6/6 Ch WT, 0 in cuc2-1), and Hamant (2008)-type microtubule-reinforced
#      anisotropic rest-length growth along vein axes (L949-997, L1027-1065). NOT 3D, NOT finite elements, no
#      cell division, and the lamina stress-feedback channel is implemented but DISABLED (a_lamina = 0.0, L706).
#   2. The margin contour is now INTEGRATED (`integrate_margin_outgrowth`, L417-475) and I_D is an emergent radial
#      morphometric (`dissection_index_radial`, L476-523). Pass 2 hard-coded the mutant I_D values and fitted every
#      other genotype with a closed-form target, so its "6-genotype Pearson r = 0.998" was circular and is withdrawn.
#   3. measure_morphoeval 9 -> 20 measurements; self-test 8 -> 12 checks; 2 new Lean 4 theorems (5 total, 0
#      sorrys); 4 new DOI references (all 8 resolved against Crossref; the Mitchison DOI initially drafted was wrong
#      and was corrected to 10.1098/rspb.1980.0015); eta x growth-duration sweep; 2 new figure/GIF artifacts.
#
# Why the overall score goes DOWN (93.1 -> 68.2): building an emergent integrator and a real elastic lamina exposed
# that v2's agreement with the benchmark was manufactured and that the benchmark itself is weakly sourced:
#   - With ONE gain calibrated on At WT (emergent I_D 0.230 vs 0.228), the two mutants emerge smooth (I_D = 0) but
#     C. hirsuta WT reaches only I_D = 0.254 (ref 0.785), mir164a-4 0.233 (ref 0.445), and Ch rco 0.219 ends up
#     BELOW At WT (ref 0.312 > 0.228). Emergent 6-genotype Pearson r = 0.807, p = 0.052, RMSE = 0.237. The
#     eta x duration sweep ceiling is 0.427: linear (1 - eta C) sinus repression with equal tip/sinus growth
#     duration cannot produce leaflet-level dissection.
#   - The auxin convergence peaks of the "margin PDE" are a PRESCRIBED Gaussian template (`convergence_drive`,
#     L198-216): Loop 1 PIN1 up-the-gradient transport is checked only as an algebraic identity, not solved, so the
#     number and spacing of teeth are inputs (`n_lateral_pairs`), not predictions (disclosed at L187-194).
#   - The `dissection_index_ID_ref` values in the reference JSON (L54-104) carry no figure/table/page provenance,
#     and the specimen "references" (JSON L149-154) are the script's own segmentation outputs written back, so
#     the specimen-match measurements are self-referential.
#   - The mesh teeth are at the cell-scale resolution limit (one lateral tooth detected per side; I_D 0.117 At,
#     0.131 Ch, 0.102 Ch without MT anisotropy) and the realised vein-axial stretch ratio is only 1.04 (the
#     prescribed 20 % anisotropy is mostly suppressed by tissue compatibility), so the "anisotropic MT
#     reinforcement" has a measurable but small effect.
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# working-tree files at commit d58a084 after the Pass 3 edits (the script is 2046 lines).

