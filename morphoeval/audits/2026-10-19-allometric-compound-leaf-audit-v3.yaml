          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [1216, 1249], note: "anisotropic_growth_rate / hamant_partition_identity_error and canalization_conductance_update / mitchison_feedback_identity_error numerically mirror the two new Lean theorems (dyadic defaults, exact 0.0)", supports: true}
