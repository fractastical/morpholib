          - {file: docs/media/allometric_compound_leaf_comparison.png, lines: [0, 0], note: "6-panel figure: antiphase, EMERGENT genotype contours with ref vs emergent I_D in the legend, P3-P6 stages, honest 6-genotype bar chart (r = 0.807; 'Pass 2 r=0.998 was circular'), specimen ROI and segmentation", supports: true}
