simulations:
  - id: ibrahim-vascular-angiogenesis-notch
    name: "Bentley, Gerhardt & Bates (2008) PLoS Comput. Biol., Hellström et al. (2007) Nature & Jakobsson et al. (2010) Nat. Cell Biol. VEGF-VEGFR2-Dll4-Notch1 tip/stalk salt-and-pepper lateral inhibition and angiogenic sprouting"
    organism: "Homo sapiens / Mus musculus (Retinal & embryonic sprouting vascular endothelium)"
    script: 2021-ibrahim-vascular-angiogenesis-notch.py
    output: docs/media/vascular_angiogenesis_notch_comparison.png
    extra_outputs:
      - docs/media/vascular_angiogenesis_notch_growth.gif
    status: evaluated
    source_refs:
      - bentley2008
      - hellstrom2007
      - jakobsson2010
      - chappell2009
      - collier1996
    summary: >-
      Pass 1 (v1) baseline evaluation of `2021-ibrahim-vascular-angiogenesis-notch.py`
      (weighted score: 53.0/100). The Pass 1 baseline integrates only an isolated
      two-cell Dll4-Notch1 ODE at two trans-Notch gains (k_t = 1.0 and 0.0) without
      solving the multicellular M=16 endothelial vessel wall coupled VEGFR2-Dll4-Notch1
      + 2D filopodial angiogenic sprout elongation network across the 5 canonical
      biological regimes (Physiological VEGF gradient salt-and-pepper, High uniform
      VEGF synchronous oscillations, DAPT Notch blockade all-tip hypersprouting,
      Dll4+/- haploinsufficiency, and Vegfr2+/- mosaic chimeric tip competition
      Jakobsson et al. 2010), omits VEGFR1/sFlt1 decoy sequestration and the 8-point
      Notch trans-gain sweep, and does not segment the vendored Homo sapiens HUVEC
      angiogenic sprouting vascular plexus micrograph.
    scores:
      model-fidelity:
        value: 54
        rationale: >-
          Integrates a minimal two-cell Dll4-Notch1 ODE (L26-66), but omits the M=16
          multicellular endothelial vessel wall network, 2D filopodial angiogenic sprout
          elongation and anastomosis/syncytial fusion, VEGFR1 (sFlt1) decoy sequestration,
          and Brillouin k=pi Fourier mode decomposition.
        evidence:
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [26, 66], note: "Two-cell ODE without multicellular M=16 vessel wall or 2D sprout outgrowth", supports: true}
      specimen-match:
        value: 44
        rationale: >-
          Vendors `datasets/vascular_angiogenesis_notch/huvec_angiogenic_sprouting_plexus_specimen.jpg`
          on disk, but Pass 1 does not load, segment, or extract vascular plexus area
          density, branch junctions, or sprouting filopodial tip counts.
        evidence:
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [94, 138], note: "Renders 2-panel time-series figure without specimen CV segmentation", supports: false}
      parameter-expressivity:
        value: 49
        rationale: >-
          Evaluates only two scalar k_t values (1.0 and 0.0) in a 2-cell ODE without
          simulating the 5 canonical angiogenic regimes (High VEGF oscillations, Dll4+/-
          haploinsufficiency, Vegfr2+/- mosaic competition) or an 8-point Notch gain sweep.
        evidence:
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [69, 91], note: "Only two scalar k_t values evaluated without 5-regime or 8-point sweep", supports: false}
      morphometric-validation:
        value: 51
        rationale: >-
          Exposes only 2 scalar measurements in `measure_morphoeval()` without Brillouin
          k=pi period-2 alternation index, temporal oscillation CV, chimeric WT tip
          occupancy, Pearson correlation p-values, or specimen CV morphometrics.
        evidence:
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [69, 91], note: "Only 2 scalar metrics without spatial wave-number or statistical validation", supports: false}
      source-traceability:
        value: 68
        rationale: >-
          Vendors `paper_citations.bib` and `vascular_angiogenesis_notch_reference.json`
          with verified DOIs, but Pass 1 does not load or SHA-256-verify the dataset at
          runtime.
        evidence:
          - {file: datasets/vascular_angiogenesis_notch/vascular_angiogenesis_notch_reference.json, lines: [1, 145], note: "Reference JSON present on disk but not verified at runtime in Pass 1", supports: true}
      code-traceability:
        value: 55
        rationale: >-
          Module docstring cites Bentley et al. (2008) and Hellström et al. (2007), but
          lacks explicit equation-to-code and Lean 4 theorem mappings.
        evidence:
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [1, 9], note: "Minimal docstring without Lean 4 theorem loci", supports: false}
      repro-package:
        value: 53
        rationale: >-
          Includes a minimal 2-assertion `--self-test` flag, but lacks SHA-256 dataset
          integrity checks, Brillouin mode eigenvalue checks, Flt1 rescue checks, and
          specimen segmentation verification.
        evidence:
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [141, 146], note: "Minimal self-test without SHA-256 or multicellular invariant checks", supports: false}
    remediation:
      - "Implement the coupled multicellular M=16 Bentley-Gerhardt-Bates VEGFR2-Dll4-Notch1 lateral-inhibition ODE network + 2D filopodial angiogenic sprout elongation solver with soluble VEGFR1 (sFlt1) decoy sequestration."
      - "Simulate all 5 canonical angiogenic regimes (Physiological VEGF gradient salt-and-pepper, High uniform VEGF synchronous oscillations, DAPT Notch blockade hypersprouting, Dll4+/- haploinsufficiency, and Vegfr2+/- mosaic chimeric tip competition Jakobsson et al. 2010) plus an 8-point Notch trans-activation gain sweep."
      - "Segment the vendored Homo sapiens HUVEC angiogenic sprouting vascular network micrograph (`huvec_angiogenic_sprouting_plexus_specimen.jpg`, CC BY 4.0) to extract vascular plexus area density, branch junctions, and sprouting tip count, backed by runtime SHA-256 verification and an 8-suite `--self-test`."
