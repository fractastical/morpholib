# MorphoEval audit — Economou et al. (2012) Nature Genetics Mammalian Palate Rugae Growth-Zone Turing Morphogenesis, 2026-10-19 (v3)
#
# Pass 3 re-score of `2012-economou-palate-ruguga-turing.py` (v3, 1743 lines) after the remediation round
# `morphoeval/runs/2026-10-19-palate-ruguga-turing-loop-pass3`, superseding `2026-10-19-palate-ruguga-turing-audit-v2`
# (92.4 / 100). Assessor: Claude Fable 5.1 (Cursor agent), scoring against commit d58a084 with line numbers
# verified on the current file.
#
# What Pass 3 changed (the single open v2 remediation item, closed as a reduced honest version):
#   1. Chemo-mechanical ridge elevation (Law 4): the 2D FGF/SHH sheet now drives a quasi-static Kirchhoff
#      epithelial plate on a Winkler mesenchymal foundation, kappa Lap^2 h - T Lap h + k_f h = beta max(A - A_th, 0),
#      solved EXACTLY on the finite-difference grid by a DCT-II eigen-solver (residual 5.8e-14, self-test check 9;
#      `solve_quasi_static_plate` L405-429, `plate_operator_residual` L440-454). Optional two-way feedback
#      dA/dt += chi_m (h - <h>) re-equilibrated every 25 RD steps (L645-647, L684-688). This is a 2.5D plate model, not the
#      3D finite-element invagination the v2 item literally asked for; the residual is carried below.
#   2. Ridge morphometrics (`measure_ridge_morphometrics` L468-513): 9 mechanical ridges on the 9 Shh stripes,
#      crest/stripe phase offset 0.0226 lambda, crest duty cycle 0.423 (FWHM/spacing) vs 0.493 / 0.444 measured
#      with the same `peak_widths` estimator on the segmented left / right shelves of the vendored specimen
#      (L887-890), equal-diffusion control -> flat epithelium (0 ridges), coronal cut -> 8 fragmented ridges.
#   3. Parameter sweeps (`evaluate_ridge_mechanics_sweeps` L740-810): ridge amplitude vs kappa (6 values) and k_f
#      (4 values) both Spearman rho = -1.00 with the ridge count locked at 9 for kappa <= 0.1 (merging to 7 at
#      kappa >= 0.2, disclosed); chi_m sweep (0..0.3) keeps 9 rugae with non-decreasing amplitude. CLI flags
#      --kappa, --k-found, --chi-mech, --skip-mechanics-figure (L1697-1700).
#   4. New SHA-256-pinned `datasets/palate_ruguga_turing/palate_ridge_mechanics_reference.json` (equation,
#      dimensionless parameters with an explicit "modelling assumption, not measurement" provenance note, sweep
#      grids, empirical targets), README section, and 2 new Lean 4 theorems (`economou_ridge_plate_stiffness_monotone`,
#      `economou_ridge_elevation_in_phase`; `lean` exit 0, 0 sorrys) registered in the Math KG.
#   5. New figure `docs/media/palate_ruguga_turing_ridge_mechanics.png` (3D elevation surface, transect, transfer
#      gain + sweeps, duty-cycle comparison, WT/coronal elevation map, flat control); ridge crests overlaid on
#      Panel A of the comparison PNG; GIF gains an elevation panel. Self-test 8 -> 11 checks, measurements 9 -> 14.
#
# Why the overall score goes DOWN slightly (92.4 -> 91.2) despite the added mechanism: the remediation exposed two
# pre-existing defects that v2 had not penalised. (a) The coronal-cut, FGF10-bead and cyclopamine phenotypes are
# largely written into condition-specific initial conditions (mediolateral cos modulation, q_gz, q_high, q_cyc at
# L606-633) rather than emerging from the incision barrier or the changed reaction rates; (b) the RD solver rescales
# its x spacing (`dx_eff = dx * (q / 1.24)`, L338, L600, L619, L631) so the grid wavelength realised by the PDE
# (lambda_ap = 3.37, q_ap = 1.87) is not the dispersion-relation lambda_c = 3.22 that Panels B/D are built on, and
# the new plate solver (which uses the physical dx) now makes the mismatch measurable. Both are itemised for Pass 4.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the working-tree files at commit d58a084 (Pass 3 edits uncommitted).

