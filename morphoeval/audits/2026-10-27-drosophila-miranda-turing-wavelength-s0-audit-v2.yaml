      Pass 2 keeps the 1.864 µm field and adds the dispersion comparison
      (Pearson r = 0.999999996, RMSE = 1.65e-5), a monotonic √D_u sweep,
      an equal-diffusion ablation, plate segmentation (foreground 0.370, coherency 0.806,
      circularity 0.054), and an orientation-histogram KS of 0.333 against the pure field.
      The GIF is 12 frames at 640×480. CV similarity of the last frame to the plate is 86.7.
    remediation:
      - "A second assessor has not scored this script. The single-agent limit is recorded, not treated as a pass."
