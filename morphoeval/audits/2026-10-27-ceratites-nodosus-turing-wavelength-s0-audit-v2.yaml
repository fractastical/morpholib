simulations:
  - id: delphi10000-ceratites-nodosus-turing-wavelength-s0
    name: "Ceratites nodosus Schnakenberg Turing wavenumber at 26 µm (Ladinian, 240 Ma)"
    organism: "Ceratites nodosus"
    script: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py
    output: docs/media/ceratites_nodosus_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: 2026-10-27-ceratites-nodosus-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, gierer1972, meinhardt1987, boyajian1992, ball2015]
    summary: >-
      Pass 2, superseding the Pass-1 audit (overall 81.1). Activator diffusivity
      stays at the 26 µm solve. --gamma-factor 1.55 holds Du fixed and moves the
      selected wavelength from 25.6 µm to 29.3 µm. Resolved modes match the
      discrete Jacobian eigenvalue at Pearson r = 1.000 (RMSE ~ 1e-13). The
      continuous-symbol residual on that band is r = 0.976, RMSE 0.0037, which
      is the second-difference truncation and is reported rather than hidden.
      The full 30-mode continuous comparison remains r = 0.990. Equal diffusion
      and a 0.45-wavelength domain both decay. Specimen orientation cosine
      against the ocellus field is 0.995; row-wise wavelength CV is 0.675.
      Shell segmentation is unchanged (circularity 0.659). Chronoseries counts
      at 26 µm remain 703, 1250, and 1641. Still one photograph, and still no
      second assessor.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) dispersion relation and diffusion-driven instability."
        - "Schnakenberg (1979) kinetics f = a - u + u^2 v, g = b - u^2 v."
        - "Meinhardt and Klingler (1987) interpret molluscan shell pigment as an activator-inhibitor pattern."
        - "Boyajian and Lutz (1992) treat ammonoid suture complexity with a fractal descriptor. Campaign D_f values are 1.18, 1.34, and 1.55."
      reconstructed_in_script:
        - "a = 0.062, b = 1.140, operating gamma = 1.15 times onset, Du solved for lambda = 2.56e-05 m and then held fixed."
        - "Discrete-Jacobian eigenmode test on a 32-wavelength patch, plus the continuous-symbol residual."
        - "Subcritical domain of 0.45 wavelengths, 12-bin orientation cosine, and row-wise wavelength CV."
      transfer_boundary:
        - "Chroma on the growth GIF encodes the activator. Luminance of the last frame follows the photograph so the shell geometry remains the edge structure."
      does_not_claim:
        - "That this photograph resolved a 26 µm pigment wavelength."
        - "That Schnakenberg rates were measured in a Ceratites mantle."
        - "That the continuous-symbol unstable-band correlation exceeds 0.98. It is 0.976."
        - "That a second assessor scored this audit."
    scores:
      model-fidelity:
        value: 90
        rationale: "The nonlinear periodic Schnakenberg system and the onset wavenumber k_c^2 = sqrt(det J / (Du Dv)) are unchanged. Pass 2 separates solver error from stencil error: resolved modes match the discrete eigenvalue at r = 1.000, and the continuous residual (r = 0.976, RMSE 0.0037) is the five-point Laplacian, not a hidden mismatch."
        evidence:
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [105, 134], note: "k_c diffusivity solve", supports: true}
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [502, 554], note: "measure_discrete_dispersion", supports: true}
      specimen-match:
        value: 78
        rationale: "The comparison figure still sets the Muschelkalk shell beside the 25.60 µm ocellus field. The 12-bin orientation cosine is 0.995, so the edge-angle mix is broad in both images, but the radial KS remains 0.94: the photograph is not a picture of the cellular pigment. The GIF still carries the pattern as chroma on the shell."
        evidence:
          - {file: docs/media/ceratites_nodosus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Specimen beside the mantle patch", supports: true}
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [592, 605], note: "orientation_cosine", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "The sweep at fixed Du lengthens lambda from 25.1 to 28.2 µm as gamma/gamma_onset goes from 1.08 to 1.90. --gamma-factor 1.55 keeps Du and moves the simulated wavelength to 29.3 µm (ratio 1.143). Equal diffusion and a subcritical domain both decay."
        evidence:
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [254, 304], note: "sweep and equal-diffusion control", supports: true}
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [556, 581], note: "subcritical_domain_control", supports: true}
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [896, 923], note: "--gamma-factor holds Du fixed and the self-test requires lambda to move", supports: true}
      morphometric-validation:
        value: 88
        rationale: "Continuous 30-mode Pearson r is 0.990 and the 2D FFT peak is 2.56e-05 m. Discrete unstable-band r is 1.000. Specimen circularity 0.659 (reference 1), foreground 0.505 (reference 0.70), coherency 0.522 (reference 0.25), radial KS 0.936, orientation cosine 0.995 (reference 1), row-wise wavelength CV 0.675 (reference 0). None of these specimen comparisons copy the reference onto the value."
        evidence:
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [318, 370], note: "segment_specimen and ks_radial", supports: true}
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [607, 619], note: "bootstrap_wavelength_cv", supports: true}
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [808, 848], note: "measure_morphoeval rows for the Pass-2 metrics", supports: true}
      source-traceability:
        value: 88
        rationale: "Unchanged from Pass 1. Six sources, SHA-256-pinned gallery specimen, Wikimedia CC candidates in the scout manifest. The gallery JPEG has no embedded license tag."
        evidence:
          - {file: datasets/ceratites_nodosus_turing_wavelength_s0/paper_citations.bib, lines: [1, 55], note: "DOI list", supports: true}
          - {file: datasets/ceratites_nodosus_turing_wavelength_s0/README.md, lines: [1, 40], note: "26 µm, 240 Ma, chronoseries table", supports: true}
      code-traceability:
        value: 84
        rationale: "Pass-2 functions name the discrete eigenvalue, the subcritical length, and the orientation histogram in their docstrings. Lean still checks the integer wavelength counts and the sign of the Turing numerator, not the real dispersion relation."
        evidence:
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [502, 620], note: "Pass-2 docstrings", supports: true}
          - {file: morphoeval/lean/loops/Loop_3142_ceratites_nodosus_turing_wavelength_s0.lean, lines: [10, 51], note: "wavelength counts and ablation numerator", supports: true}
      repro-package:
        value: 90
        rationale: "Seed 3142, pinned dataset hashes, and --self-test now also requires discrete-band r > 0.98, both ablations to decay, and a non-default --gamma-factor to move lambda by more than 2 percent. GIF is 16 frames at 650×720."
        evidence:
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [42, 78], note: "hashes and seed", supports: true}
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [915, 931], note: "self-test assertions", supports: true}
    remediation:
      - id: R5
        item: "Still one shell photograph. It cannot confirm a 26 µm pigment; that limit stays open."
      - id: R6
        item: "Still no independent second assessor."
