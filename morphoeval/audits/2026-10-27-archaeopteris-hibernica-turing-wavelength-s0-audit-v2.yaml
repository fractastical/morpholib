simulations:
  - id: delphi10000-archaeopteris-hibernica-turing-wavelength-s0
    name: "Archaeopteris hibernica Famennian epidermal Turing wavelength (31 µm, 370 Ma)"
    organism: "Archaeopteris hibernica"
    script: models/2026-delphi10000-archaeopteris-hibernica-turing-wavelength-s0.py
    output: docs/media/archaeopteris_hibernica_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: 2026-10-27-archaeopteris-hibernica-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, meyer1999, boyce2002, beck1957, rothwell1989]
    summary: >-
      Pass 2 closes the three Pass 1 gaps. Equal-diffusion amplitude ratio is
      0.246 after t=140 (was 0.669 at t=24). The seeded pattern is 31.0 µm and
      the unseeded pattern at the same gamma is 26.57 µm, a finite-amplitude
      shift of 4.43 µm, now printed on the comparison figure and stored in
      metrics.json. Dispersion Pearson r = 0.9865, RMSE = 0.0375. Specimen
      orientation KS = 0.25, radial-spectrum Pearson r = 0.994, radial RMSE =
      0.257. GIF CV similarity remains 96.0 at 630x720, 12 frames. gamma sweep
      stays monotone from 62 µm down to 15.5 µm analytical.
    claim_boundary:
      reported_in_source:
        - "Meyer-Berthaud, Scheckler and Wendt (1999) establish a planated megaphyll and modern tree habit for Archaeopteris by the Famennian."
        - "Turing (1952) gives a diffusion-driven instability at a critical wavenumber."
        - "Schnakenberg (1979) supplies the two-species kinetics used here."
        - "Boyce and Knoll (2002) treat planation as the step that makes a laminate leaf."
      reconstructed_in_script:
        - "gamma = 0.6636 so that argmax sigma(k) = 2*pi/31 per micrometre on this Jacobian."
        - "Thickness scaling lambda(h) = 31*(h/12.4)^0.62 gives 66 µm (Tetraxylopteris, 385 Ma) and 21 µm (Elkinsia, 365 Ma)."
        - "The GIF multiplies the museum frond by a resized activator veil. The photograph does not resolve 31 µm cells."
        - "The 4.43 µm seeded-versus-unseeded shift is a finite-amplitude effect on the 186 µm grid, not a second biological wavelength."
      transfer_boundary:
        - "An animal pigment Turing pattern is being used as the kinetics for a fossil epidermis whose original chemistry is not preserved."
      does_not_claim:
        - "That 31 µm was measured on the Smithsonian slab or in the 1999 Nature paper."
        - "That the predecessor and successor wavelengths are direct fossil measurements."
        - "That nanopublications were signed. No ~/.nanopub/profile.yml is present, so sign_morphoeval.py cannot run."
    scores:
      model-fidelity:
        value: 90
        rationale: "Schnakenberg kinetics, pseudospectral diffusion, and k_c = argmax sigma(k) are implemented and distinguished from the textbook band center. The equal-diffusion control is now integrated long enough for the slowest stable mode to fall to an amplitude ratio of 0.246, and it does not satisfy the Turing inequalities."
        evidence:
          - {file: models/2026-delphi10000-archaeopteris-hibernica-turing-wavelength-s0.py, lines: [87, 122], note: "turing_margin defines k_c as argmax sigma and k_band as the textbook center", supports: true}
          - {file: models/2026-delphi10000-archaeopteris-hibernica-turing-wavelength-s0.py, lines: [291, 307], note: "ablation_equal_diffusion to t=140", supports: true}
      specimen-match:
        value: 86
        rationale: "The NMNH frond and the 31 µm ocellus field are shown together. The 12-frame GIF scores CV similarity 96 against that photograph. Orientation KS is 0.25 and the radial spectra correlate at 0.994. The cellular panel is not a copy of the slab, and the slab does not resolve epidermal cells."
        evidence:
          - {file: docs/media/archaeopteris_hibernica_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "frond, activator, dispersion, chronoseries, gamma sweep, shift", supports: true}
          - {file: docs/media/archaeopteris_hibernica_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 630x720, activator veil on the real frond", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "gamma from 0.25x to 4x shortens analytical wavelength 62 to 15.5 µm and noise-selected wavelength 62 to 13.3 µm, both monotone. The Famennian operating point is reported twice: seeded 31.0 µm and unseeded 26.57 µm, so the seed dependence is measured rather than hidden."
        evidence:
          - {file: models/2026-delphi10000-archaeopteris-hibernica-turing-wavelength-s0.py, lines: [310, 352], note: "parameter_sweep", supports: true}
          - {file: datasets/archaeopteris_hibernica_turing_wavelength_s0/metrics.json, lines: [0, 0], note: "sweep rows plus finite_amplitude_shift_um 4.43", supports: true}
      morphometric-validation:
        value: 90
        rationale: "Dispersion Pearson r = 0.9865 and RMSE = 0.0375 on Fourier modes 3-13. Specimen segmentation gives coherency 0.671 versus a 0.5 baseline, foreground fraction 0.621 versus 0.4, orientation KS 0.25 versus a 0.05 threshold, and radial RMSE 0.257 versus 0. Radial Pearson of the frond crops is 0.994. None of these value/reference pairs are copies of each other."
        evidence:
          - {file: models/2026-delphi10000-archaeopteris-hibernica-turing-wavelength-s0.py, lines: [232, 289], note: "linear_dispersion_fit", supports: true}
          - {file: models/2026-delphi10000-archaeopteris-hibernica-turing-wavelength-s0.py, lines: [444, 468], note: "specimen_goodness_of_fit KS, radial Pearson, radial RMSE", supports: true}
          - {file: models/2026-delphi10000-archaeopteris-hibernica-turing-wavelength-s0.py, lines: [618, 670], note: "measure_morphoeval rows with references that are not the measured values", supports: true}
      source-traceability:
        value: 90
        rationale: "Crossref-checked DOIs for Turing, Schnakenberg, Meyer-Berthaud, Boyce and Knoll, Beck, and Rothwell. The specimen is the public-domain NMNH photograph, SHA-256 pinned in the reference JSON."
        evidence:
          - {file: datasets/archaeopteris_hibernica_turing_wavelength_s0/paper_citations.bib, lines: [1, 63], note: "six citations", supports: true}
          - {file: datasets/archaeopteris_hibernica_turing_wavelength_s0/archaeopteris_hibernica_turing_wavelength_s0_reference.json, lines: [1, 40], note: "31 µm, 370 Ma, specimen hash", supports: true}
      code-traceability:
        value: 86
        rationale: "Each modelling step is its own function, and the Lean module proves 6*31 = 186, 21 < 31 < 66, and Dv/Du = 24 with no sorry. The module states that gamma was solved for argmax sigma, not for the band-center formula."
        evidence:
          - {file: morphoeval/lean/loops/Loop_3119_archaeopteris_hibernica_turing_wavelength_s0.lean, lines: [14, 42], note: "domain, chronoseries, diffusion ratio, cross proxy", supports: true}
          - {file: models/2026-delphi10000-archaeopteris-hibernica-turing-wavelength-s0.py, lines: [87, 112], note: "k_band versus k_c comment and computation", supports: true}
      repro-package:
        value: 90
        rationale: "Seed 3119. --self-test now also requires the ablation ratio below 0.35 and a nonzero finite-amplitude shift. Specimen SHA-256 is checked before any run. Invocation is in the dataset README."
        evidence:
          - {file: models/2026-delphi10000-archaeopteris-hibernica-turing-wavelength-s0.py, lines: [728, 761], note: "self_test", supports: true}
          - {file: datasets/archaeopteris_hibernica_turing_wavelength_s0/README.md, lines: [1, 40], note: "scale, age, run commands", supports: true}
    remediation: []
