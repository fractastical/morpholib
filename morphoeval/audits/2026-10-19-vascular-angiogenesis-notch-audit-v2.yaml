    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Bentley, Gerhardt & Bates (2008) PLoS Comput. Biol. 4:e1000052 & Collier et al. (1996) J. Theor. Biol. 183:429-446 coupled endothelial VEGFR2-Dll4-Notch1 lateral-inhibition ODE network destabilizing via the Brillouin-zone k = pi antisymmetric mode into period-2 Tip-Stalk-Tip-Stalk salt-and-pepper alternation under physiological VEGF and synchronous oscillations under high uniform VEGF"
        - "Hellström et al. (2007) Nature 445:776-780 pharmacological gamma-secretase Notch blockade (DAPT, k_t -> 0 => N_i = 0 => V_i = V_max) producing 100% all-tip hypersprouting syncytial sheets and Dll4+/- haploinsufficiency producing ~75% tip hyperbranching"
        - "Jakobsson et al. (2010) Nat. Cell Biol. 12:943-953 chimeric WT : Vegfr2+/- mosaic tip competition (~87.5% WT tip occupancy) and Chappell et al. (2009) Dev. Cell 17:377-386 soluble VEGFR1 (sFlt1) decoy sequestration rescuing salt-and-pepper patterning under VEGF overload"
      reconstructed_in_script:
        - "Coupled M = 16 endothelial cell VEGFR2-Dll4-Notch1 + 2D filopodial angiogenic sprout elongation solver (`simulate_vessel_notch_sprouting`) and Brillouin k = pi linear stability & sFlt1 decoy verifier (`verify_brillouin_instability_and_flt1_rescue`)"
        - "5 canonical angiogenic regimes + sFlt1 rescue control (`evaluate_angiogenic_regimes`): Physiological salt-and-pepper (tip fraction = 0.5000, I_pi = 0.9472), High uniform VEGF oscillations (temporal CV = 0.3808, rescued by sFlt1 to CV = 0.0134 and I_pi = 0.9480), DAPT Notch blockade (tip fraction = 1.0000, 0 stalk cells, I_pi = 0.0000), Dll4+/- haploinsufficiency (tip fraction = 0.7500), and WT : Vegfr2+/- mosaic competition (WT tip share = 0.8571)"
        - "8-point Notch trans-activation gain sweep across k_t in [0.00, 1.25] reproducing the Hellström et al. (2007) / Bentley et al. (2008) tip-cell fraction continuum (Pearson r = 0.99781, RMSE = 0.0136, p = 2.61e-8) and Brillouin k = pi alternation index (Pearson r = 0.99809, RMSE = 0.0227, p = 1.66e-8)"
        - "Computer-vision medial-axis skeleton segmentation of `huvec_angiogenic_sprouting_plexus_specimen.jpg` (CC BY 4.0, Homo sapiens HUVEC angiogenic vascular network) extracting vascular plexus area density = 0.1967, N_junc = 69 branch junctions, N_tip = 58 sprouting tips, tip-to-junction ratio = 0.8406, and inter-tip NND CV = 0.7003 (31.11 +- 21.79 px)"
      transfer_boundary:
        - "1D periodic M=16 endothelial vessel wall coupled to 2D filopodial sprout outgrowth and medial-axis topological skeletonization of calcein-stained HUVEC vascular networks"
      does_not_claim:
        - "3D Navier-Stokes blood hemodynamics, pericyte PDGFRB recruitment, or shear-induced arteriovenous remodeling after lumen perfusion"
    source_refs:
