      reproduces the 8-point Notch gain sweep (Pearson r = 0.99781, RMSE = 0.0136,
      p = 2.61e-8); and segments the SHA-256-locked Homo sapiens HUVEC angiogenic
      sprouting vascular network micrograph (plexus density = 0.1967, 69 branch
      junctions, 58 sprouting tips, tip/junction ratio = 0.8406, inter-tip NND CV = 0.7003).
