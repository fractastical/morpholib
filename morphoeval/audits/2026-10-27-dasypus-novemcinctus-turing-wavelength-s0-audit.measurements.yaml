    claim_boundary:
      reported_in_source:
      - Vickaryous and Hall (2006) describe five osteoderm shields and hexagonal rosettes on the Dasypus novemcinctus
        carapace, developed intramembranously in the dermis.
      - Chen et al. (2011) report mechanical tests and microstructure of mineralized armadillo osteoderm.
      - Turing (1952) and Schnakenberg (1979) give the two-species reaction-diffusion dispersion relation.
      reconstructed_in_script:
      - Schnakenberg parameters a=0.10, b=0.90, D_v/D_u=20, with D_u solved so the linear wavelength is 4.108 µm
        on a periodic 12-wavelength patch.
      - Saturated activator wavelength 4.56 µm against the linear target 4.108 µm, and σ(k_c)=0.219 > 0 while σ(0)<0.
      transfer_boundary:
      - The 4.108 µm figure is this loop's subcellular detail rung, not a wavelength measured by Chen or Vickaryous.
        The photograph is an organism-scale carapace, not a 4.1 µm micrograph.
      does_not_claim:
      - That nine-banded armadillo osteoderm rosettes are caused by a 4.1 µm Turing instability.
      - A parameter sweep, an equal-diffusion ablation, or a Pearson/RMSE/KS fit (those are Pass 1 gaps).
