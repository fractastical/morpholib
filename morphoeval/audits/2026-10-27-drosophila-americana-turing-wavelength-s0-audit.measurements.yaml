    claim_boundary:
      reported_in_source:
      - 'Turing 1952 and Murray 1981: critical wavenumber k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v) for a two-species
        reaction-diffusion system.'
      - 'Wittkopp et al. 2009: abdominal pigmentation divergence between D. americana and D. novamexicana is genetic
        and largely cis-regulatory, at body-color scale.'
      - 'Clark et al. 2007 and O''Grady & DeSalle 2018: D. ananassae is in the sequenced Sophophora genomes; D.
        americana sits in the virilis radiation.'
      reconstructed_in_script:
      - Schnakenberg kinetics f = a - u + u^2 v, g = b - u^2 v with a = 0.1, b = 0.9, r = 10, integrated by a Fourier
        semi-implicit step.
      - Detail-scale wavelengths lambda_i = 2.117e-6 * (L_i / L_americana)^0.35 for affinis, americana, and ananassae.
      - Physical ruler that sets lambda(k_sigma) = 2.117 µm on the americana anchor.
      transfer_boundary:
      - The 2.117 µm figure is the assigned detail-scale slot, identified here with the expressed ocellar-pigment
        wavelength. Wittkopp 2009 does not report that length.
      - Predecessor and successor are campaign chronoseries neighbors at 0 Ma, not a fossil ancestor-descendant
        series.
      does_not_claim:
      - Does not claim the repository species card is a micrograph of the ocellus. It is a brown pigment card with
        a 100 µm scale bar.
      - Does not claim the X–4 fusion or red/brown puparium is a term in the reaction-diffusion equations.
      - Does not claim the catalog DOI 10.1016/j.cell.2009.09.044, which Crossref returns as 404.
