    claim_boundary:
      reported_in_source:
      - 'Yang et al. (2022): the ossicles of Protoreaster nodosus are single-crystal calcite shaped as a diamond-type
        TPMS lattice with [111] along the c-axis; under nanoindentation, twin bands and dislocations are arrested
        at the strut-pore free surfaces, confining damage to indent-adjacent struts (3D crystal-plasticity FEM in
        the paper)'
      - 'Donnay & Pawson (1969): every echinoderm skeletal element diffracts as a single calcite crystal'
      - 'Beniash et al. (1997), Politi et al. (2008), Vidavsky et al. (2014), Wilt (2002): sea urchin larval spicules
        are deposited as ACC delivered in ~1 um vesicles into a syncytial membrane cavity and transform to calcite
        by secondary nucleation propagating from a single seed granule'
      - 'Eshelby, Frank & Nabarro (1951): a pile-up of n = pi(1-nu) L tau/(mu b) dislocations against an obstacle
        over a glide length L concentrates a head stress n tau'
      reconstructed_in_script:
      - 3D nodal TPMS level sets and implicit-surface curvature for Diamond D, Gyroid G, Primitive P, a Cahn-Hilliard
        spinodal control and a pinch-off ablation (Pass 2); level-set threshold sweep; Gibson-Ashby stretching vs
        bending scaling; DoG segmentation of the vendored crinoid ossicle SEM plate (Pass 2)
      - 'Pass 3: a reduced 2D plane-strain Q4 crystal-plasticity FEM of flat-punch nanoindentation on the [111]-projected
        Diamond skeletal honeycomb section vs a monolith at equal depth with two e-twin variants, lamella run lengths
        by ray marching, pore-adjacent arrest fraction, r90 damage radius and P/P_elastic; an Eshelby-Frank-Nabarro
        pile-up scaling in strut / ossicle / monolith glide lengths; a stochastic 2D syncytial-templating model
        of ACC vesicle delivery with secondary vs primary nucleation and templating / nucleation ablations'
      transfer_boundary:
      - The FEM is a 2D plane-strain honeycomb section (bending-dominated; the 3D Diamond TPMS is stretching-dominated),
        with a single twin family (no r/f slip, both twin senses allowed via |tau|), isotropic elasticity for trigonal
        calcite, a flat punch rather than a Berkovich tip, no fracture coupling, and tau_twin = 500 MPa as a scale
        parameter (depth-normalised outputs are tau-invariant, absolute depths are not)
      - The templating model's kinetics (k_1, k_2, p_out, vesicle flux, front reach) are modelling choices not fitted
        to the Politi 2008 / Beniash 1997 ACC-fraction time courses; the template is the adult stereom honeycomb,
        not a larval triradiate spicule; no membrane mechanics or Mg/protein ACC stabilisation
      - The specimen plate is an adult Nesometra integra calyx ossicle; the slot organism is Metacrinus rotundus
        and the seed paper's organism is the starfish Protoreaster nodosus. The specimen reference values in the
        JSON (phi = 0.5187, a_0 = 14.80 um) are the script's own Pass 2 outputs, not independent literature values
      does_not_claim:
      - Reproduction of Yang et al. (2022) load-depth curves or twin-band micrographs; a physically faithful [111]
        projection (the Pass 2 projection integrates over a partial period and is flagged below); literature-digitised
        validation of the 12-species table (synthetic, flagged below); online-verified DOIs for the seven Pass 3
        references
