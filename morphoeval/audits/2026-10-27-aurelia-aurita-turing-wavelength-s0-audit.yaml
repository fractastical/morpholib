# MorphoEval audit — Aurelia aurita 201 µm Turing ocellus wavelength, pass 1
#
# Single assessor (grok-4.7). Builder and assessor are the same agent.
# Weighted mean of the seven scores below is 82.2.
# Pass-1 figure is preserved at
# datasets/aurelia_aurita_turing_wavelength_s0/pass1_comparison.png
# because pass 2 overwrites docs/media.

audit:
  id: 2026-10-27-aurelia-aurita-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, single-agent pass 1)"
  publisher_github: https://github.com/fractastical
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
  license: https://creativecommons.org/licenses/by/4.0/
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 0c76d15d14afcec6c366e1b9274a6586a0de48fc
    note: >-
      Pass 1 files are new on this branch and are not in commit 0c76d15d.
      Line pins refer to the working tree. Locus verification against that
      commit fails closed until the loop commit exists.

references:
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing AM"
    venue: "Philosophical Transactions of the Royal Society of London B 237:37-72 (1952)"
    doi: 10.1098/rstb.1952.0012
  schnakenberg1979:
    title: "Simple chemical reaction systems with limit cycle behaviour"
    authors: "Schnakenberg J"
    venue: "Journal of Theoretical Biology 81:389-400 (1979)"
    doi: 10.1016/0022-5193(79)90042-0
  nakanishi2009:
    title: "Development of the rhopalial nervous system in Aurelia sp.1 (Cnidaria, Scyphozoa)"
    authors: "Nakanishi N, Hartenstein V, Jacobs DK"
    venue: "Development Genes and Evolution 219:301-317 (2009)"
    doi: 10.1007/s00427-009-0291-y
  helm2018:
    title: "Evolution and development of scyphozoan jellyfish"
    authors: "Helm RR"
    venue: "Biological Reviews 93:1228-1250 (2018)"
    doi: 10.1111/brv.12393
  thoma2015:
    title: "Aurelia aurita in a museum in Karlsruhe"
    authors: "Thoma M"
    venue: "Wikimedia Commons File:Aurelia-aurita-3.jpg (2015), CC0"
    url: https://commons.wikimedia.org/wiki/File:Aurelia-aurita-3.jpg

simulations:
  - id: delphi10000-aurelia-aurita-turing-wavelength-s0
    name: "Schnakenberg Turing wavelength at the Aurelia aurita 201 µm ocellus scale"
    organism: "Aurelia aurita (moon jellyfish), Holocene, 0 Ma"
    script: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py
    output: docs/media/aurelia_aurita_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/aurelia_aurita_turing_wavelength_s0_growth.gif
      - datasets/aurelia_aurita_turing_wavelength_s0/aurelia_aurita_turing_wavelength_s0_metrics.json
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, nakanishi2009, helm2018, thoma2015]
    claim_boundary:
      reported_in_source:
        - "Turing 1952: a reaction-diffusion system can select a finite wavelength."
        - "Schnakenberg 1979: the two-species kinetics implemented here."
        - "Nakanishi, Hartenstein & Jacobs 2009: Aurelia rhopalia develop a pigment-cup ocellus."
        - "Helm 2018: a scyphozoan medusa has eight rhopalia."
        - "Thoma 2015 CC0 photograph of living Aurelia aurita."
      reconstructed_in_script:
        - "a=0.10, b=0.90, Du=1, Dv=20, gamma=1, chosen so lambda_c equals 0.0002006 m."
        - "Spectral integration, dispersion fit, Dv sweep, and equal-diffusion ablation."
      transfer_boundary:
        - "201 µm is the assigned detail scale, not a length measured on the photograph or in the cited papers."
      does_not_claim:
        - "That eight rhopalia equal the bell circumference divided by 201 µm."
        - "That the Karlsruhe photograph resolves the ocellus wavelength."
    summary: >-
      Pass 1 implements the Schnakenberg system at the Holocene 201 µm node
      (chronoseries 1/1, age 0 Ma). Dispersion Pearson r = 0.9999, RMSE = 0.017,
      KS = 0.167. FFT wavelength on the patch is 202.7 µm against the assigned
      200.6 µm. Equal diffusion gives sigma_max = -0.102 and final std = 3e-5,
      but the comparison panel autoscales that residual into a visible gradient.
      The upper-right bell mask has circularity 0.33, which does not describe
      the round medusa in the photograph. Gonad-lobe counter returned 5.
      Overall 82.2.
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          The script uses Schnakenberg's kinetics, the steady state, the
          Jacobian, and sigma(k) as the larger eigenvalue of J - k^2 D.
          k_c = (det/(Du Dv))^1/4 is the band-center formula; the measured
          argmax of sigma sits at 0.485 against k_c = 0.473, and that shift
          is reported. Parameters are a calibration to 0.0002006 m, not
          numbers from a Schnakenberg table for Aurelia. Five Lean theorems
          check the scaled discriminant, the equal-diffusion failure, and
          the 201 µm label identity, with no sorry.
        evidence:
          - {file: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py, lines: [69, 111], note: "Jacobian, Turing discriminant, and sigma(k)", supports: true}
          - {file: morphoeval/lean/loops/Loop_3129_aurelia_aurita_turing_wavelength_s0.lean, lines: [22, 41], note: "trace, det, Turing instability, equal-diffusion suppression", supports: true}
          - {file: datasets/aurelia_aurita_turing_wavelength_s0/aurelia_aurita_turing_wavelength_s0_reference.json, lines: [0, 0], note: "states that 201 µm is an assigned scale", supports: true}
      specimen-match:
        value: 70
        rationale: >-
          The Karlsruhe photograph is a real Aurelia (four-gonad oral bells,
          marginal tentacles). The activator panel is a spot field on a
          602 µm patch, which is the right motif for an ocellus pigment
          pattern and the wrong magnification for the photograph. The
          equal-diffusion panel looks patterned because imshow autoscales a
          field whose standard deviation is 3e-5. The GIF's last frame is
          90 percent the photograph, so computer-vision similarity is high
          for a reason that is not a pixel fit of the PDE to the bell.
        evidence:
          - {file: datasets/aurelia_aurita_turing_wavelength_s0/pass1_comparison.png, lines: [0, 0], note: "Pass 1 control panel shows a gradient while the title records std 0.0000", supports: false}
          - {file: docs/media/aurelia_aurita_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Pass 2 overwrote this path; the pass-1 pixels are in pass1_comparison.png", supports: true}
      parameter-expressivity:
        value: 84
        rationale: >-
          Dv from 12 to 48 moves predicted wavelength from 177 µm to 250 µm
          and the FFT peak follows it (sweep Pearson r = 0.9978). Spot count
          rises from 9 to 14 as the field saturates. Du = Dv = 1 kills the
          mode (sigma_max = -0.102, std = 3e-5). gamma and a, b are not swept.
          The control is numerically real and visually misleading.
        evidence:
          - {file: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py, lines: [284, 319], note: "Dv sweep and equal-diffusion control", supports: true}
          - {file: datasets/aurelia_aurita_turing_wavelength_s0/pass1_metrics.json, lines: [0, 0], note: "sweep rows and control std", supports: true}
      morphometric-validation:
        value: 82
        rationale: >-
          Dispersion fit: Pearson r = 0.9999, RMSE = 0.017, KS = 0.167
          against a zero-discrepancy reference. Patch FFT wavelength
          0.0002027 m versus assigned 0.0002006 m. Specimen foreground
          fraction 0.437, coherency 0.345 versus 0.849 on the spot field,
          bell circularity 0.328 versus a circle at 1. Those specimen
          numbers are measured, and the bell mask is a poor description of
          the round oral view (circularity 0.33). The lobe counter returned
          5. Its reference was set to 8 rather than to the four gonads, which
          avoids a self-comparison but compares the wrong integer.
        evidence:
          - {file: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py, lines: [128, 149], note: "eigenvalue growth versus analytical sigma(k)", supports: true}
          - {file: datasets/aurelia_aurita_turing_wavelength_s0/pass1_metrics.json, lines: [0, 0], note: "pass 1 r=0.9999, circularity=0.3282, lobes=5", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          DOIs for Turing 1952, Schnakenberg 1979, Nakanishi 2009, and Helm
          2018 are in the bib file. The specimen is CC0, artist Martin Thoma,
          24 Jan 2015, SHA-256 pinned and checked at runtime. OpenAlex did
          not yield a paper that measures 201 µm, and the reference JSON says so.
        evidence:
          - {file: datasets/aurelia_aurita_turing_wavelength_s0/paper_citations.bib, lines: [1, 70], note: "Turing, Schnakenberg, Nakanishi, Helm, Thoma", supports: true}
          - {file: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py, lines: [712, 716], note: "runtime SHA-256 check of the specimen", supports: true}
      code-traceability:
        value: 84
        rationale: >-
          The module docstring states the PDE, the steady state, the Jacobian
          numbers, k_c, and the 0.0002006 m calibration. Lean declarations
          name the same discriminant. There is no equation number from
          Schnakenberg 1979 attached to a line.
        evidence:
          - {file: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py, lines: [1, 28], note: "docstring equations and the claim about eight rhopalia", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-aurelia-aurita-turing-wavelength-s0.yaml, lines: [1, 40], note: "laws point at the Lean theorems and the script", supports: true}
      repro-package:
        value: 86
        rationale: >-
          Seed 3129, --self-test passes (r = 0.9999), and the full run writes
          the PNG, a 12-frame 720×540 GIF, and the metrics JSON. Dependencies
          are the repo's numpy, scipy, matplotlib, and Pillow, not a
          per-script lock. Pass 1 and the audit were produced by one agent.
        evidence:
          - {file: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py, lines: [712, 752], note: "self_test and main", supports: true}
          - {file: datasets/aurelia_aurita_turing_wavelength_s0/README.md, lines: [1, 40], note: "invocation and the 201 µm / 0 Ma statement", supports: true}
    remediation:
      - id: R1
        item: "Draw the equal-diffusion field on the same color scale as the patterned activator so a std of 3e-5 cannot look like a stripe."
      - id: R2
        item: "Replace the ragged upper-right mask (circularity 0.33) with a segmentation that follows the round oral bell."
      - id: R3
        item: "Compare the lobe count to four gonads, not to eight rhopalia."
      - id: R4
        item: "Second assessor from another provider has not scored this pass."
      - id: R5
        item: "201 µm remains an assigned scale. No histological measurement was found; do not invent one."
