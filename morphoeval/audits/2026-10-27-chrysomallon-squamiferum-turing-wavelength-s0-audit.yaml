        - "Activator painted on the MNHN-IM-2000-30072 sclerite mask"
      transfer_boundary:
        - "No source measures a 2.0 nm pigment stripe on this snail. 2.0 nm is the assigned detail-scale wavelength, about two greigite cells."
      does_not_claim:
        - "Does not claim Yao et al. 2010 stated a reaction-diffusion equation"
        - "Does not claim the Pass 1 PDE peak equals 2.0 nm"
        - "Does not claim a successor chronospecies after the Holocene animal"
