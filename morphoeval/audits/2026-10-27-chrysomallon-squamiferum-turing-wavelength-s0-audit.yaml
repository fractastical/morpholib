    summary: >-
      Pass 1 integrates one Schnakenberg field (a=0.062, b=1.084, D_v/D_u=36, seed 3147)
      with diffusivities chosen so the onset wavenumber is 2π/2.0 nm. Closed-form σ(k)
      matches numpy eigenvalues at r=1.0. The PDE radial peak is 2.52 nm, not 2.0 nm.
      The paratype photograph is the anatomical canvas. No parameter sweep, no
      equal-diffusion ablation, and no KS comparison against the specimen were run.
    claim_boundary:
