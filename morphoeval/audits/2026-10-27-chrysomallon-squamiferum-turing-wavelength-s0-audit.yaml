# Pass 1 — Chrysomallon squamiferum Turing wavelength, 2.0 nm detail scale, slot 3147.
# Holocene extant, 0 Ma, chronoseries 1/1.
# The onset formula k_c^2 = (D_v f_u + D_u g_v)/(2 D_u D_v) was solved so that
# expression equals 2π/2.0 nm. The PDE radial peak was 2.52 nm, because above
# onset the maximum of σ(k) is not that onset wavenumber. Eigenvalue-vs-closed-form
# Pearson r was 1.0 (the same matrix, two evaluations). No sweep, no ablation, no KS.
