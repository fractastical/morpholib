        - "Turing 1952 gives k_c from the linearized reaction-diffusion Jacobian."
        - "Jeong et al. 2008 show loss of abdominal tan expression in D. santomea."
        - "Lachaise et al. 2000 described the species; Llopart et al. 2002 mapped the yakuba pigmentation difference."
