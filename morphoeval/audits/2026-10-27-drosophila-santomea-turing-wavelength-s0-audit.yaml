        - "Spatial unit ξ is chosen so γ = 1 yields λ_c = 2.326 µm."
        - "Pass 1 integrates eigenvector-initialized modes and compares growth rates to σ(k)."
      transfer_boundary:
        - "Chronoseries neighbors are scored at this 2.3 µm tier only. Their primordium-slot parameters are not reused."
      does_not_claim:
        - "That the source papers measured a 2.3 µm wavelength."
        - "That the gallery spiral is a 2.3 µm micrograph."
        - "That pass 1 already contains the γ sweep, ablation, scale bar, or KS test."
    summary: >-
      Pass 1 locks Schnakenberg parameters (a=0.130, b=0.870, Du=1, Dv=40) so the
      continuous critical wavelength is 2.326 µm at γ=1, age 0 Ma. Numeric growth
      rates match the analytic dispersion (Pearson r rounds to 1.0 at six decimals,
      RMSE 4.9e-5). The 12-frame 800×600 GIF and the comparison figure were written.
      The γ sweep, equal-diffusion ablation, scale-bar segmentation, and KS distances
      are listed as remediation_pending in pass1_metrics.json.
