        evidence:
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [1319, 1364], note: "Five Pass 3 R1 measurements: sub-threshold mound, l_dom vs l*, spots vs hexagonal packing, stalk ring count, ring wavelength vs band", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [1365, 1401], note: "Four Pass 3 R2 measurements: Lean-instance trace, numerical vs analytical Hopf onset, Martiel–Goldbeter period vs 7 min, pulse-shape duty cycle vs relay", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [917, 941], note: "hemisphere_legendre_power: orthonormal Y_l^m projection via lpmv on the even-reflected cap (l <= 24)", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [176, 176], note: "CAMP_PERIOD_REFERENCE_MIN = 7.0 is an approximate reading (~5-10 min) of Gerisch & Hess 1974, not a digitised figure value; the Martiel–Goldbeter run gives 10.68 min", supports: false}
      source-traceability:
        value: 93
        rationale: >-
          All seven sources carry DOIs in the module header (L28-52), `paper_citations.bib` (7 entries) and the
          new `pass3_curved_geometry_pde_reference.json`, whose three new DOIs were resolved through the
