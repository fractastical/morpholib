simulations:
  - id: schnakenberg-limit-cycle-turing
    name: "Schnakenberg (1979) tri-molecular limit-cycle & Turing reaction-diffusion morphogenesis"
    organism: "Dictyostelium discoideum (cellular slime mold cAMP oscillations & fruiting body aggregation)"
    script: 1979-schnakenberg-limit-cycle-turing.py
    output: docs/media/limit_cycle_turing_comparison.png
    extra_outputs:
      - docs/media/limit_cycle_turing_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-limit-cycle-turing-audit-v2
    source_refs:
      - schnakenberg1979
      - turing1952
      - goldbeter1975
      - grace2015
      - martiel1987
      - gerisch1974
      - crampin1999
    claim_boundary:
      reported_in_source:
        - "Schnakenberg (1979): the tri-molecular cubic autocatalytic scheme has a unique positive steady state (a+b, b/(a+b)^2), a Hopf curve b - a = (a+b)^3 and, beyond it, a Poincaré–Bendixson limit cycle"
        - "Turing (1952): differential diffusion destabilizes a stable reaction equilibrium in a finite wavenumber band; on a sphere the unstable modes are spherical harmonics"
        - "Martiel & Goldbeter (1987): a 3-variable receptor-desensitization model (rho_T, beta, gamma) with extracellular PDE rate k_e produces autonomous cAMP oscillations and relay"
        - "Gerisch & Hess (1974): suspended D. discoideum cells show spontaneous cAMP-controlled oscillations with a period of several minutes (~5-10 min)"
        - "Crampin, Gaffney & Maini (1999): on uniformly growing domains reaction-diffusion patterns undergo frequency-doubling with a dilution term -(L'/L) u"
      reconstructed_in_script:
        - "Exact equilibrium, Jacobian, Hopf curve, d_c(a,b), planar dispersion sigma(k^2) and its Turing band (q_-, q_+); RK4 limit-cycle ODE; 2D pseudo-spectral RD solver with 5 regimes and a 7-point d sweep; SHA-256-locked specimen segmentation (Pass 2)"
        - "Hemispherical-mound RD solver with exact Laplace–Beltrami propagators, spherical-harmonic (Legendre) power spectrum, mound-radius sweep against l*(R) and hexagonal packing, critical mound radius R_min; elongating-stalk solver with ring-count kymograph (Pass 3 R1)"
        - "First-order and Michaelis–Menten PDE sinks with closed-form equilibria, analytical + numerical Hopf thresholds, Martiel–Goldbeter relay integration and k_e sweep, dimensionless pulse-shape comparison (Pass 3 R2)"
        - "Five Lean 4 theorems (Laws 1-5) mirrored by integer checks in --self-test"
      transfer_boundary:
        - "Mound radius R, stalk radius 0.08 and lengths 1->4 are in the dimensionless planar domain units (L = 6); they are NOT calibrated to the specimen's 32.9 px sorus diameter or stalk length, so the curved-geometry results are predictions of the model's own scaling, not specimen measurements"
        - "The Martiel–Goldbeter parameter set is the widely used Table I set; with it this implementation gives a 10.68 min period at k_e = 5.4 min^-1, above the ~7 min (5-10 min) Gerisch & Hess anchor; the discrepancy is reported, not tuned away"
        - "Schnakenberg u is identified with extracellular cAMP for the PDE sink; the 2-species model has no receptor variable, so the pulse-shape comparison with Martiel–Goldbeter is dimensionless (duty cycle, fold change, waveform r = 0.78), not a time-scale match"
      does_not_claim:
        - "A volumetric 3D solver of the culminant, tip-growth (non-uniform) stalk elongation, chemotactic cell movement, or that Turing rings on a stalk are an observed Dictyostelium phenotype; a digitized comparison with Martiel & Goldbeter's own time-series figures; spatial (Turing) analysis of the PDE-extended model"
    summary: >-
      Pass 3 (v3) evaluation of `1979-schnakenberg-limit-cycle-turing.py` (overall 89.8/100 vs 90.2 in
      Pass 2; supersedes audit 2026-10-19-limit-cycle-turing-audit-v2). Both Pass 2 remediation items are closed in the model rather than the presentation: the
      Schnakenberg PDE now runs on a hemispherical mound and an elongating stalk with the spherical-harmonic
      ladder, critical mound radius R_min = 0.1297 and hexagonal-packing spot counts verified against the
      solver (l_dom = l* at 5/6 radii, +-1 at the sixth; 18 vs 18.4 spots at R = 1.5; 0 pattern at R < R_min),
      and extracellular phosphodiesterase kinetics are modelled three ways (first-order with a Lean-proved
      generalized Hopf curve, Michaelis–Menten with analytical/numerical Hopf onset agreeing to 0.006 %, and
      the Martiel–Goldbeter relay with a k_e sweep spanning its oscillatory window 2-7 min^-1). Five Lean 4
      theorems (0 sorrys), 18 reference-anchored measurements, a 16-check self-test and a byte-identical PNG
      back the claims. The score does not rise because the new work exposes the next layer: the curved
      geometries are not calibrated to the specimen, the Martiel–Goldbeter period (10.68 min) misses the
      literature anchor (~7 min), the stalk ring count (3) lags L/lambda_c (4.25) and only the ODE form of
      the PDE-extended model is analysed.
    scores:
      model-fidelity:
        value: 93
        rationale: >-
          Pass 2 core unchanged (exact equilibrium, Jacobian, Hopf curve, d_c, dispersion; L202-340). Pass 3
          adds (i) the Laplace–Beltrami operator on the hemisphere discretised as a conservative sin(theta)
          finite-volume ladder per azimuthal Fourier mode with the no-flux equator and the pole flux
          vanishing identically, advanced by exact exp(dt D L_m) propagators from the symmetrised
          eigenproblem (L833-914; constant annihilation < 1e-9 checked at L1859-1861); (ii) the uniform-growth
          Lagrangian form with dilution (L1007-1076); (iii) the first-order and Michaelis–Menten PDE sinks
          with closed-form equilibria and Jacobian traces (L427-492) whose generalized Hopf curve is proved in
          Lean Law 5; (iv) the Martiel–Goldbeter f1/f2/Phi kinetics (L587-609). Deductions: the geometry is a
          surface reduction, not the 3D culminant, and stalk growth is uniform rather than apical (-3); the
          Martiel–Goldbeter reproduction gives T = 10.68 min at k_e = 5.4 whereas the model is usually quoted
          near 7-9 min, so either a parameter or the published figure value is unverified here (-3); the
          implicit identification of Schnakenberg u with extracellular cAMP is an assumption (-1).
        evidence:
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [833, 914], note: "simulate_schnakenberg_hemisphere: Laplace–Beltrami ladder with sin(theta) face weights, no-flux equator, exact exp(dt D L_m) propagators", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [1007, 1076], note: "simulate_growing_stalk: Lagrangian xi = z/L(t), exponential growth, dilution -(L'/L) u, mirrored-FFT Neumann ends", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [427, 492], note: "First-order and Michaelis–Menten PDE sinks: scaled trace (1+kappa)^3(b-a)-(a+b)^3, quadratic equilibrium, Jacobian trace, brentq Hopf threshold", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [587, 609], note: "martiel_goldbeter_rhs: 3-variable receptor-desensitization relay (f1, f2, Y, Phi) with extracellular PDE rate k_e", supports: true}
          - {file: morphoeval/lean/loops/Loop_002_limit_cycle_turing.lean, lines: [84, 140], note: "Law 4 schnakenberg_sphere_turing_band (ladder gap 2(l+1), finite band l in {1,2}) and Law 5 schnakenberg_pde_hopf_shift (generalized Hopf locus, (1,9) instance); lean exit 0, 0 sorrys", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [1007, 1012], note: "Stalk growth is uniform exponential in a Lagrangian frame; real culmination is apical/tip growth — a reduced model, stated in the docstring", supports: false}
      specimen-match:
        value: 85
        rationale: >-
          Panel C4 still shows the SHA-256-locked Dictyostelium sorocarp photograph with the two segmented
          sori, DoG mounds and the inter-sorus line beside the simulated regimes (L1531-1559), and the new
          row D is visually distinct from rows A-C: D1 a spotted hemispherical cap seen from above, D3 a
          ring ladder on the stalk, D4 relay spikes (L1573-1684; GIF frame 2 shows spots emerging on the
          cap). Deductions carried from v2 remain (the specimen is a static macro photograph with two
          sorocarps; no digitised figure of Schnakenberg 1979 is overlaid). New deduction: the mound and
          stalk are not drawn at the specimen's own proportions — R, R_stalk and L are model units with no
          px calibration, so the side-by-side is qualitative only (-1 vs v2); credit is given for the
          mound-top view being compared against the hexagonal-packing count rather than left to the eye.
        evidence:
          - {file: docs/media/limit_cycle_turing_comparison.png, lines: [0, 0], note: "4x5 figure: rows A-C as in v2 (C4 = specimen segmentation), row D = hemispherical mound top view, radius sweep, stalk kymograph, Martiel–Goldbeter relay, PDE Hopf onset; all visually distinct", supports: true}
          - {file: docs/media/limit_cycle_turing_growth.gif, lines: [0, 0], note: "12 frames, 945x306: planar spots | hemispherical mound spots emerging | limit-cycle orbit", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [1583, 1595], note: "D1 orthographic projection x = R sin(theta) cos(phi), y = R sin(theta) sin(phi) of the cap field with spot / l_dom / R_min annotations", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [153, 153], note: "MOUND_RADII are dimensionless model units; no mapping to the specimen's 32.9 px sorus diameter or stalk length", supports: false}
      parameter-expressivity:
        value: 91
        rationale: >-
          In addition to the Pass 2 sweeps (5 regimes, 7-point d sweep, CLI overrides), Pass 3 adds three
          swept parameters whose effect is monotone and visible: mound radius R (predicted l* 0,1,2,3,5,6,10
          and measured l_dom 0,1,2,3,5,6,9 across 7 radii; spot count 0->18 tracking 2 pi R^2/((sqrt3/2)
