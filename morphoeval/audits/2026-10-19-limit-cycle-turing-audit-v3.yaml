          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [641, 647], note: "run_mg_pde_rate_sweep over 8 k_e values (1-12 min^-1) recording period/amplitude/oscillatory flag", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [494, 528], note: "run_schnakenberg_pde_sweep: 7 k_e values spanning 0 to 8 k_e^Hopf plus growth-rate bisection for the onset", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [1946, 1948], note: "New CLI flags --R-mound, --ke-mg, --Km-pde forwarded to render_outputs", supports: true}
      morphometric-validation:
        value: 88
        rationale: >-
          `measure_morphoeval()` (L1188-1402) now returns 18 reference-anchored measurements: the 9 Pass 2
          metrics plus sub-threshold mound std_u = 0.000 (ref 0), l_dom = 6 vs l* = 6 at R = 1.0 (6/6 radii
