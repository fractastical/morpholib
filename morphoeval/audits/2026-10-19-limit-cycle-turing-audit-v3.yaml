# MorphoEval audit — Schnakenberg (1979) Tri-Molecular Limit-Cycle & Turing Reaction-Diffusion, 2026-10-19 (v3)
#
# Pass 3 remediation re-score of `1979-schnakenberg-limit-cycle-turing.py` (v3, 1980 lines) after the
# instrumented loop `morphoeval/runs/2026-10-19-limit-cycle-turing-loop-pass3`, superseding
# `2026-10-19-limit-cycle-turing-audit-v2` (90.2 / 100). Both Pass 2 remediation items were closed:
#   R1. Curved geometry: Schnakenberg RD solved on a hemispherical mound (Laplace–Beltrami on S^2 with a
#       no-flux equator; Fourier in azimuth x exact exp(dt D L_m) finite-volume ladder in colatitude) and on
#       an exponentially elongating cylindrical stalk (Crampin–Gaffney–Maini uniform growth with dilution).
#       Linear theory on the spherical-harmonic ladder q_l = l(l+1)/R^2 predicts a critical mound radius
#       R_min = sqrt(2/q_+) = 0.1297 and a fastest-growing degree l*(R); the solver reproduces l* within
#       +-1 for 6/6 patterned radii (exact at R = 0.2, 0.35, 0.5, 0.75, 1.0), stays homogeneous at
#       R = 0.10 < R_min, and gives 18 spots at R = 1.5 vs 18.4 from hexagonal packing. Machine-checked by
#       the new Lean Law 4 `schnakenberg_sphere_turing_band`. This is an honest surface (2-manifold)
#       reduction of the 3D culminant, not a volumetric solver; the residual is carried below.
#   R2. Extracellular phosphodiesterase (PDE) kinetics: first-order sink -kappa u with the generalized Hopf
#       curve (1+kappa)^3 (b-a) = (a+b)^3 (new Lean Law 5 `schnakenberg_pde_hopf_shift`), a saturable
#       Michaelis–Menten sink -k_e u/(K_m+u) with closed-form equilibrium and a brentq Hopf threshold
#       k_e^Hopf(0.1, 0.9, K_m=1) = 0.12486 reproduced by an independent numerical growth-rate bisection to
#       0.12487 (0.006 %), and the 3-variable Martiel–Goldbeter (1987) receptor-desensitization relay with its
#       own PDE rate k_e swept across the oscillatory window (2.0–7.0 min^-1) and compared with the minimal
#       2-species Schnakenberg limit cycle by dimensionless pulse-shape metrics.
#
# Assessor: Claude Fable 5.1 (same agent that performed the remediation; no independent second assessor
# was run in this pass — the `second_assessor` block is carried from v2 for schema parity and should be
# read as "not re-run"). Scores below are uncalibrated criterion-referenced scores on the rubric's 0-100
# scale. Line numbers refer to the files at commit 3aaa03d (working tree; the slot's files are uncommitted
# under the campaign's zero-conflict isolation rule).
#
# Overall 89.8 (v2 90.2): model-fidelity 94->93, specimen-match 86->85, parameter-expressivity 88->91,
# morphometric-validation 89->88, source-traceability 93->93, code-traceability 91->92, repro-package 91->92.
# The two dips are deliberate: the new work exposed that (i) the curved geometries are dimensionless and
# not calibrated to the specimen's own sorus/stalk dimensions, and (ii) the one new literature anchor
# (cAMP period ~7 min) is missed by the Martiel–Goldbeter reproduction (10.68 min), which cannot be
# resolved without the paper's own figure values.

