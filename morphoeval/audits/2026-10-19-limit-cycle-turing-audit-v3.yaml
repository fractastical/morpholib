        evidence:
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [28, 52], note: "Seven primary DOIs in the module docstring including Martiel & Goldbeter 1987, Gerisch & Hess 1974, Crampin et al. 1999", supports: true}
          - {file: datasets/limit_cycle_turing/pass3_curved_geometry_pde_reference.json, lines: [1, 103], note: "Pass 3 reference tables with Crossref-resolved DOIs, Lean Law 4/5 integer tables, R_min, band edges, Martiel–Goldbeter parameters and period anchor", supports: true}
          - {file: datasets/limit_cycle_turing/paper_citations.bib, lines: [45, 78], note: "Three new BibTeX entries with DOIs", supports: true}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [1908, 1924], note: "Self-test check 16: parity of the script's constants with the Pass 3 reference JSON", supports: true}
