simulations:
  - id: thompson1917-t1917-027
    name: "Thompson (1917) T1917-027 — logarithmic spiral claim validation"
    organism: "Mollusc shell (Nautilus pompilius; Conus textile secondary)"
    script: thompson/claims/t1917-027_the-logarithmic-spiral.py
    output: docs/media/t1917_027_the_logarithmic_spiral_comparison.png
    also:
      - docs/media/t1917_027_the_logarithmic_spiral_growth.gif
      - datasets/thompson_1917/t1917-027/result.json
    domain: morphogenesis
    status: evaluated
    source_refs: [thompson1917, raup1966, nautilus_commons]
    claim_boundary:
      reported_in_source:
        - "Thompson (1917) Ch. XI: gnomonic shell growth preserves form; spire centreline is an equiangular (logarithmic) spiral r ∝ exp(kθ)"
      reconstructed_in_script:
        - "Polar edge sampling, ln r vs θ regression, Archimedean and power-spiral comparators, W = exp(2πk)"
      transfer_boundary:
        - "2D photograph projection ≠ perfect apical section; Raup (1966) adds D, T and generating-curve shape beyond Thompson's single k"
      does_not_claim:
        - "Exact match to Thompson's own 1917 figure digitisation or 3D CT centreline; refutation of Raup's qualified counterclaim"
    summary: >-
      Pass 1 baseline implements Thompson's log-spiral law and fits a CC Nautilus photograph, but lacks
      parameter-regime sweep, shuffle ablation, KS/residual reporting in the figure, and Thompson figure overlay.
    scores:
      model-fidelity:
        value: 78
        rationale: >-
          Core equations r=r₀exp(kθ) and W=exp(2πk) match Thompson (1917) and are implemented directly.
          Log vs Archimedean discrimination uses ln r linearity. Missing Raup generating-curve geometry.
        evidence:
          - {file: thompson/claims/t1917-027_the-logarithmic-spiral.py, lines: [48, 55], note: "log_spiral_r implements r=r0*exp(k*theta)", supports: true}
          - {file: thompson/claims/t1917-027_the-logarithmic-spiral.py, lines: [68, 76], note: "fit_log_spiral linearizes ln r vs theta", supports: true}
      specimen-match:
        value: 62
        rationale: >-
          Comparison panel overlays segmented edge on the Commons Nautilus photo and growth GIF animates
          gnomonic whorl expansion, but no side-by-side with Thompson 1917 Fig. 237-303 digitisation.
        evidence:
          - {file: thompson/claims/t1917-027_the-logarithmic-spiral.py, lines: [218, 235], note: "render_comparison overlays polar samples on specimen", supports: true}
          - {file: docs/media/t1917_027_the_logarithmic_spiral_comparison.png, lines: [0, 0], note: "no Thompson 1917 figure panel", supports: false}
      parameter-expressivity:
        value: 48
        rationale: >-
          Pass 1 does not sweep k or W across the documented regimes in reference JSON; GIF shows one fitted k only.
        evidence:
          - {file: datasets/thompson_1917/t1917-027/t1917_027_the_logarithmic_spiral_reference.json, lines: [28, 38], note: "parameter_regimes table unused in Pass 1", supports: false}
      morphometric-validation:
        value: 55
        rationale: >-
          measure_morphoeval returns pearson r, W, and RMSE with literature anchors, but Pass 1 omits AICc/KS
          in exported measurements and Conus discrimination is weak.
        evidence:
          - {file: thompson/claims/t1917-027_the-logarithmic-spiral.py, lines: [318, 373], note: "measure_morphoeval hook with reference values", supports: true}
          - {file: thompson/claims/t1917-027_the-logarithmic-spiral.py, lines: [134, 175], note: "compare_models computes AICc/KS but not exported in Pass 1 CSV", supports: false}
      source-traceability:
        value: 82
        rationale: >-
          SHA-256 pinned specimens, scout manifest, reference JSON and paper_citations.bib; Thompson IA scan noted.
        evidence:
          - {file: thompson/claims/t1917-027_the-logarithmic-spiral.py, lines: [38, 46], note: "verify_datasets fail-closed SHA-256", supports: true}
          - {file: datasets/thompson_1917/t1917-027/scout_manifest.json, lines: [1, 40], note: "IN_REPO verification dossier", supports: true}
      code-traceability:
        value: 74
        rationale: >-
          Functions map to Thompson equations in docstring; Lean module linked via math_kg_loops yaml.
        evidence:
          - {file: morphoeval/math_kg_loops/thompson1917-t1917-027.yaml, lines: [1, 35], note: "equations linked to Lean theorems", supports: true}
      repro-package:
        value: 80
        rationale: >-
          --self-test passes; deterministic RNG seed; outputs written to docs/media. scipy not in cloud base image by default.
        evidence:
          - {file: thompson/claims/t1917-027_the-logarithmic-spiral.py, lines: [376, 395], note: "run_self_test deterministic checks", supports: true}
    remediation:
      - "Add parameter-regime sweep over k and W with recovery error bounds (Pass 2)."
      - "Add shuffle ablation control on segmented radii to prove fit is not spurious."
      - "Export AICc, KS p-value, and log-vs-Archimedean ΔAICc to measure_morphoeval and comparison figure."
      - "Improve conus segmentation or document mixed verdict when gastropod aspect ratio breaks planar log-spiral assumption."
      - "Add telemetry-friendly metrics CSV and Thompson 1917 figure citation overlay panel."
