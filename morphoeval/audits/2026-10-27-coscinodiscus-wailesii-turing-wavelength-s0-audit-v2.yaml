simulations:
  - id: delphi10000-coscinodiscus-wailesii-turing-wavelength-s0
    name: "Coscinodiscus wailesii Turing wavelength at 4.3 mm (Holocene, chronoseries 1/1)"
    organism: "Coscinodiscus wailesii"
    script: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py
    output: docs/media/coscinodiscus_wailesii_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/coscinodiscus_wailesii_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-coscinodiscus-wailesii-turing-wavelength-s0-audit
    source_refs:
      - turing1952
      - schnakenberg1979
      - schmid1983
      - edwards2001
      - kondo2010
    summary: >-
      Pass 2 keeps k_c = argmax sigma_+(k) calibrated to 4.3 mm at 0 Ma and replaces the
      headline residual. Two-time Fourier growth rates match lambda_sigma with Pearson
      r = 0.9997 and RMSE = 0.739 length units, against the pass-1 power-spectrum residual
      of r = 0.9899 and RMSE = 1.453. A --dv 48 probe returns lambda_sigma = 17.78 and
      lambda_growth = 18.56. The disc-clamped interior standard deviation is 0.719 against
      an ablation final standard deviation near 0.002. Upper-left SEM pitch is 10.15 px
      (n = 718, CV = 0.268) versus simulated pitch 14.06 px (CV = 0.086); KS = 0.317.
      The GIF remains 12 frames at 640×480 with cv_sim_similarity 84.8.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: wavelength selection by a linear instability of a homogeneous equilibrium."
        - "Schnakenberg 1979: the trimolecular rate law. Spatial diffusion is a transfer into the Turing setting."
        - "Schmid and Volcani 1983: centrifugal proximal-to-distal morphogenesis of the C. wailesii valve, distal cribrum."
        - "Edwards et al. 2001: Holocene persistence in the north-east Atlantic from 1977."
      reconstructed_in_script:
        - "sigma_+(q), k_c, the D_v sweep, the growth-rate estimator, and the 4.3 mm calibration."
        - "Equal-diffusivity ablation and the disc clamp to (u0, v0)."
        - "Otsu segmentation of the six SEM panels and the KS distance on median-normalised diameters."
      transfer_boundary:
        - "4.3 mm is the assigned detail-scale wavelength. Retrieved abstracts do not state a valve diameter."
        - "Areolar spots stand in for the cohort form class. Pigment stripes are not claimed for this diatom."
      does_not_claim:
        - "A 4.3 mm frustule diameter."
        - "That the determinant minimizer selects the wavelength (it anti-correlates, r = -0.919)."
        - "Nanometre readings of the SEM scale bars."
        - "A predecessor or successor chronospecies. The series is 1/1."
        - "That the GIF copies micrograph pixels. cv_sim_similarity 84.8 is a feature-space score."
    scores:
      model-fidelity:
        value: 92
        rationale: >-
          sigma_plus and sigma_max_wavenumber implement the reported law k_c = argmax sigma_+.
          empirical_growth_wavelength estimates the same peak from exp(2 σ t) growth of Fourier
          power between two linear-regime snapshots. The det-proxy remains a negative control
          (r = -0.919). Integer band conditions are in Loop_3156. The spatial PDE is a transfer
          of Schnakenberg's well-mixed kinetics, which caps the score below a line-by-line
          transcription of a spatial paper.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [143, 165], note: "sigma_+ and the reported argmax wavenumber", supports: true}
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [266, 318], note: "Two-time Fourier growth-rate wavelength, the pass-2 headline fit", supports: true}
          - {file: morphoeval/lean/loops/Loop_3156_coscinodiscus_wailesii_turing_wavelength_s0.lean, lines: [37, 66], note: "Nominal band, ablation, and the ordering lambda(Dv=16) < lambda(Dv=32) < lambda(Dv=64)", supports: true}
      specimen-match:
        value: 88
        rationale: >-
          The vendored CC BY-SA plate is segmented (718 pores on the upper-left panel) and shown
          beside the periodic spots and the disc-clamped valve. The growth GIF is 12 frames at
          640×480. Canonical cv_sim_similarity against that plate is 84.8 (Sobel orientation,
          radial FFT, structure-tensor coherency, occupancy). The montage still contains panel
          labels and scale bars the spot field does not draw, so the score stays below the mid-90s.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [451, 466], note: "Six-panel Otsu segmentation of the pinned SEM", supports: true}
          - {file: docs/media/coscinodiscus_wailesii_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 640×480 GIF, cv_sim_similarity 84.8", supports: true}
          - {file: docs/media/coscinodiscus_wailesii_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Side-by-side SEM, spots, disc, dispersion, and sweep", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          lambda_sigma increases across D_v in {16, 20, 24, 28, 32, 40, 48, 64}. The equal-diffusivity
          ablation decays (ratio 0.038) while the nominal branch grows. --dv 48 --probe-only returns
          lambda_sigma = 17.781 and lambda_growth = 18.563, longer than the D_v = 32 nominal, which
          is the monotonic control the parameter is supposed to have. Disc interior std is 0.719
          against the near-zero ablation amplitude.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [321, 364], note: "Sweep records lambda_sigma, lambda_empirical, lambda_sim, and the det proxy", supports: true}
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [919, 931], note: "--dv/--seed/--probe-only expressivity probe", supports: true}
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [367, 390], note: "Ablation versus nominal amplitude", supports: true}
      morphometric-validation:
        value: 93
        rationale: >-
          Growth-rate Pearson r = 0.9997 and RMSE = 0.739 length units, improving on the
          power-spectrum residual r = 0.9899, RMSE = 1.453. Specimen pitch 10.150 px (CV 0.268)
          is not equal to simulated pitch 14.060 px (CV 0.086). KS distance on median-normalised
          diameters is 0.317. Contour circularity of the plate montage is 0.166 against a circular
          reference of 1. The early-time simulated wavelength converts to 4.66 mm beside the
          calibrated 4.3 mm.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [266, 364], note: "Growth-rate wavelength, sweep correlations, and both RMSEs", supports: true}
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [696, 830], note: "measure_morphoeval: r, RMSE, KS, pitch CV, disc std, each with a distinct reference", supports: true}
      source-traceability:
        value: 93
        rationale: >-
          Reference JSON states 4.3 mm and age 0 Ma, pins the specimen SHA-256, and names the
          Wikimedia CC BY-SA 4.0 source. BibTeX holds the five DOIs. Scout manifest records the
          OpenAlex/Wikimedia query after slot 3156 missed campaign_100_slots.yaml. No slug collision
          with the existing Sumper Cahn-Hilliard diatom model.
        evidence:
          - {file: datasets/coscinodiscus_wailesii_turing_wavelength_s0/paper_citations.bib, lines: [1, 54], note: "Turing, Schnakenberg, Schmid and Volcani, Edwards, Kondo and Miura", supports: true}
          - {file: datasets/coscinodiscus_wailesii_turing_wavelength_s0/coscinodiscus_wailesii_turing_wavelength_s0_reference.json, lines: [1, 80], note: "Scale, chronoseries 1/1, parameters, and specimen digest", supports: true}
      code-traceability:
        value: 91
        rationale: >-
          Docstrings name the dispersion branch, the rejected proxy, and the growth-rate window.
          Lean theorems homogeneous_mode_stable, nominal_holocene_turing_band,
          equal_diffusivity_ablation_suppresses_pattern, and
          inhibitor_diffusion_lengthens_selected_wavelength match the integer checks in self_test.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [1, 33], note: "Equation header with scale 4.3 mm and age 0 Ma", supports: true}
          - {file: morphoeval/lean/loops/Loop_3156_coscinodiscus_wailesii_turing_wavelength_s0.lean, lines: [1, 78], note: "Namespace MathOfBiology.Loop_3156, six theorems, zero sorry", supports: true}
      repro-package:
        value: 92
        rationale: >-
          --self-test checks the band inequalities, Lean milli-wavelengths 14086/16328/18895,
          ablation ratio < 0.2, bitwise reruns, both Pearson thresholds, RMSE improvement, and
          left-column pitch order. Seed 3156. Canonical invocation is the script with no arguments.
          Signing could not be run: no nanopub profile.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [858, 916], note: "self_test including growth-rate r > 0.98 and RMSE improvement", supports: true}
    remediation:
      - "The Lean 4 kernel was not executed here (no lean binary on the image). The proofs are decidable integer statements and remain to be checked by `lean` when a toolchain is present."
      - "SEM scale-bar labels were not transcribed to nanometres; panel pitches stay in pixels."
      - "Growth-rate RMSE is 0.739 length units, a remaining systematic offset between the continuous argmax and the discrete ring estimator."
