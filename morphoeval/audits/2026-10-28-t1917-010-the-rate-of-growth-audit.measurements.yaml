    claim_boundary:
      reported_in_source:
      - Thompson (1917) pp. 139-145 reproduces Durbin's Exp. II and Exp. IV regenerated-length tables and asserts
        V falls 'inversely as the square of the time' with log V approximately linear (Fig. 37) and an inflection
        'about the seventh day' in Exp. IV
      - Thompson (1917) p. 148 reproduces Ellis's series O/P/R/S (12-57 % of tail removed) and constructs Fig. 40
        isochrones that 'approximate in form to a cubic parabola' and diverge at 75 % removed
      reconstructed_in_script:
      - Least-squares fits of exponential-approach, hyperbolic (L_inf - c/t), logistic and Gompertz laws to the
        printed tables; OLS decay exponents on Thompson's interpolated increments; Ellis absolute-regenerate scaling
        and linearly interpolated isochrones with log-log slopes
      transfer_boundary:
      - 'No transfer to a modern dataset: the pre-scouted Dryad lizard dataset is a DATASET_MISMATCH and is excluded
        from the verdict'
      does_not_claim:
      - A mechanistic model of tail regeneration, or that the exponential/Gompertz laws are the true generative
        process rather than descriptive fits to 7-10 points per series
