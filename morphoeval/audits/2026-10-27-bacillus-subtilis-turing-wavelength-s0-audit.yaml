simulations:
  - id: delphi10000-bacillus-subtilis-turing-wavelength-s0
    name: "Bacillus subtilis Turing wavenumber at 16 µm (Holocene detail scale)"
    organism: "Bacillus subtilis"
    script: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
    output: docs/media/bacillus_subtilis_turing_wavelength_s0_growth.gif
    also:
      - docs/media/bacillus_subtilis_turing_wavelength_s0_comparison.png
    domain: protista-monera
    status: evaluated
    source_refs:
      - turing1952
      - kawasaki1997
      - golding1998
      - benjacob2000
      - kondo2010
      - specimen2019
    claim_boundary:
      reported_in_source:
        - "Turing 1952 selects a finite critical wavenumber from a two-species reaction-diffusion system."
        - "Kawasaki 1997, Golding 1998, and Ben-Jacob 2000 model Bacillus subtilis colony branches with reaction-diffusion at colony scale."
        - "The Korinna 2019 micrograph is an eye-shaped B. subtilis colony and carries no scale bar."
      reconstructed_in_script:
        - "Schnakenberg kinetics a=0.084, b=0.916, diffusion ratio 9.20, calibrated so argmax sigma_plus is 16.02 µm."
        - "A kinematic circular front with m=round(2 pi R / 16 µm)=72 at R=183.3 µm, which is a reconstruction, not a measured radius."
      transfer_boundary:
        - "Colony-scale branching papers are used as the organism's reaction-diffusion context. They are not a measurement of a 16 µm wavelength."
      does_not_claim:
        - "Does not claim that any cited paper measured a 16 µm pigment stripe in B. subtilis."
        - "Does not claim the faint bulk field in pass 1 has reached a nonlinear Turing pattern."
    summary: >
      Pass 1 implements the Schnakenberg dispersion and calibrates the linear
      wavenumber to 16.02 µm (target 16 µm) at age 0 Ma. Pearson r of early-time
      mode slopes against the discrete Laplacian dispersion is 0.985. The bulk
      field is still near the noise floor (std 0.017) and its radial peak is
      17.45 µm. The ocellus GIF matches the specimen at CV 91.9 but the branches
      are faint regular rays, and the specimen angular detector peaks at harmonic
      20 rather than the model count 72. Equal-diffusion ablation suppresses
      growth. Signing was not available (no ~/.nanopub/profile.yml).
    remediation:
      - "Integrate the bulk Schnakenberg field into the nonlinear regime so the dominant radial wavelength locks to the linearly most unstable mode near 16 µm (pass 1 std(u)=0.017, lambda_meas=17.45 µm)."
      - "Restrict the dispersion goodness-of-fit to modes with a real eigenvalue. Mode n=6 (deeply stable) inflates RMSE to 0.108 while the Turing band itself agrees to about 1 percent."
      - "Replace the specimen angular-FFT harmonic (peak 20, an envelope mode) with a band-passed ridge count in the branch annulus, and darken the reconstructed rays so they read as colony branches rather than faint pinstripes."
    scores:
      model-fidelity:
        value: 84
        rationale: >
          The script implements the Schnakenberg PDE, the Jacobian at (u0, v0)=(1, 0.916),
          and sigma_plus(k), and it places the linear peak at 16.02 µm with diffusion
          ratio 9.20 above the threshold 8.00. The bulk integration (1800 steps) never
          leaves the linear noise floor, so the nonlinear pattern the dispersion is
          supposed to select is not yet visible.
        evidence:
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [109, 142]
            note: "sigma_plus and calibrate_diffusivity target 2 pi / 16 µm"
            supports: true
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [286, 330]
            note: "simulate_bulk stops at amplitude 0.017; radial mode 11 gives 17.45 µm"
            supports: false
      specimen-match:
        value: 86
        rationale: >
          The comparison figure places the Korinna 2019 ocellus beside the
          reconstruction, and the 12-frame 520 px GIF scores cv_sim_similarity 91.9
          against that photograph. The rays are much fainter and more regular than
          the dendritic branches in the micrograph, so the match is textural rather
          than anatomical.
        evidence:
          - file: docs/media/bacillus_subtilis_turing_wavelength_s0_comparison.png
            lines: [1, 1]
            note: "Side-by-side specimen, bulk field, front reconstruction, and dispersion"
            supports: true
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [383, 423]
            note: "render_ocellus contrast 0.48 and blur 2.8 produce faint rays"
            supports: false
      parameter-expressivity:
        value: 86
        rationale: >
          A five-point sweep of D_u at fixed ratio 9.20 increases wavelength
          monotonically, which is the control the wavenumber law claims. The
          equal-diffusion ablation drives sigma_max to -0.085 and the field variance
          down by about 100-fold. The sweep is of the linear dispersion, not of the
          rendered ocellus.
        evidence:
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [234, 257]
            note: "parameter_sweep records lambda increasing with D_u"
            supports: true
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [259, 284]
            note: "ablation_equal_diffusion is the negative control"
            supports: true
      morphometric-validation:
        value: 74
        rationale: >
          Early-time Fourier slopes correlate with the discrete-Laplacian dispersion
          at Pearson r = 0.9847, above 0.98. RMSE is 0.108 because mode n=6 is a poor
          fit; modes 11 through 20 agree to about 1 percent. The bulk wavelength
          17.45 µm is not the 16 µm target. The specimen angular harmonic is 20
          against a model branch count of 72, so that comparison does not yet
          validate the front.
        evidence:
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [204, 232]
            note: "goodness_of_fit reports Pearson r, RMSE, and KS"
            supports: true
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [332, 377]
            note: "segment_specimen angular peak is 20, not the model count 72"
            supports: false
      source-traceability:
        value: 90
        rationale: >
          Primary DOIs resolve on OpenAlex (Turing 1952, Kawasaki 1997, Golding 1998,
          Ben-Jacob 2000, Kondo 2010, Duran-Nebreda 2021, Sharpe 1998, Dion 2019).
          The specimen file is SHA-256 pinned and attributed to Korinna, CC BY 4.0.
          The 16 µm radius is explicitly a reconstruction because the micrograph has
          no scale bar.
        evidence:
          - file: datasets/bacillus_subtilis_turing_wavelength_s0/paper_citations.bib
            lines: [1, 40]
            note: "BibTeX entries with DOIs for Turing 1952 and Kawasaki 1997"
            supports: true
          - file: datasets/bacillus_subtilis_turing_wavelength_s0/bacillus_subtilis_turing_wavelength_s0_reference.json
            lines: [68, 80]
            note: "Specimen SHA-256, CC BY 4.0, and Wikimedia URL"
            supports: true
      code-traceability:
        value: 86
        rationale: >
          calibrate_diffusivity, sigma_plus, and the module docstring name the
          dispersion relation and the 16 µm target. The Lean file states the same
          integer threshold and the 16/10 scale identities. Lean was not executed
          in this environment.
        evidence:
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [1, 45]
            note: "Module docstring states the PDE, dispersion, scale, and age"
            supports: true
          - file: morphoeval/lean/loops/Loop_3130_bacillus_subtilis_turing_wavelength_s0.lean
            lines: [24, 32]
            note: "ratio 9.2 exceeds the Turing threshold; ratio 1 does not"
            supports: true
      repro-package:
        value: 88
        rationale: >
          Seed 3130, --self-test, and a deterministic renderer. Self-test checks
          the trace, the diffusion threshold, Pearson r > 0.98, monotonic sweep,
          and the ablation. Pass 1 metrics are written to pass_metrics.json.
        evidence:
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [655, 690]
            note: "self_test gates on lambda, Pearson r, sweep, and ablation"
            supports: true
