          Delta_r_section = +0.224 is closer to the specimen's +0.279 than the 2D model's +0.367, and the
          3D shells, section, 2D and specimen core profiles are drawn on one axis (L1317-1332). Deductions:
          the 3D-section profile correlation with the specimen (r = 0.758, RMSE 0.256, L1536-1538) is
          weaker than the 2D one, so the better-matched comparator in Delta_r is the worse-matched one in
          profile shape and the script does not reconcile the two (-4); the specimen is a Wikimedia
          Commons embryoid body of unspecified species, not a Steinberg/Foty chick aggregate, and panel
          crops, thresholds and the ROI radius are hard-coded pixel constants (L923-926, L936-937, L957)
          tuned to this one image (-5); the 3D section shows a visibly rougher core than the 2D panel
