# MorphoEval audit — Steinberg (1963, 1970) / Graner & Glazier (1992) Differential Adhesion Cell Sorting, 2026-10-19 (v3)
#
# Pass 3 re-score of `1964-steinberg-differential-adhesion-sorting.py` (v3, 1,705 lines; 13 self-test checks;
# 15 measurements) after the remediation loop `morphoeval/runs/2026-10-19-differential-adhesion-sorting-loop-pass3`,
# superseding `2026-10-19-differential-adhesion-sorting-audit-v2` (90.5).
#
# What Pass 3 changed (the single open v2 remediation item):
#   1. `simulate_potts_regime_3d()` (L646-854): Graner-Glazier Hamiltonian on a 64^3 cubic lattice holding a
#      spherical aggregate of 840 cubic 4^3 cells, 26-neighbour adhesion, quadratic volume constraint, 8-colour
#      parity sublattice-parallel Metropolis (adhesion dH exact — Lean theorem
#      `parity_sublattice_sites_not_moore_adjacent`; volume dH at sub-sweep start).
#   2. `fit_sorting_kinetics()` (L486-525): logarithmic (Graner & Glazier 1992 Fig. 3) vs power-law fits of
#      L_AB(t)/L(t) with the Lifshitz-Slyozov-Wagner alpha = 1/3 as reference exponent.
#   3. `compare_2d_vs_3d_sorting_kinetics()` (L857-904): 2D native vs 3D full boundary vs 3D equatorial z-section
#      vs Kawasaki-swap ablation vs 3D equal-adhesion control (alpha = 0.189 / 0.215 / 0.207 / 0.228 / 0.001).
#   4. Row C of the figure (L1255-1357), 4th GIF panel (L1369-1410), 7 new measurements (L1496-1545), 5 new
#      self-test checks (L1600-1634), 5 new CLI flags (L1656-1660), 3 new Lean theorems (7 total, 0 sorry),
#      `sorting_kinetics_2d_vs_3d` block in the reference JSON (L236-264), 3 new citations (DOIs unverified offline).
#
# Why the overall score does NOT rise despite the remediation: the deeper read required to audit the 3D solver
# exposed two defects that v2 scored past — (a) an ad hoc external field `dE += 1.8 * (...)` (L390-394) that
# imposes the partial-engulfment doublet lens of Panel A3 rather than letting the Hamiltonian select it, and
# (b) the "Kawasaki" accelerator (L361-397, L747-771) exchanges the *types* of two randomly chosen, generally
# non-adjacent cells at an uncited temperature 2.5 T — a non-local move with no counterpart in Graner & Glazier
# (1992). Pass 3 also surfaced (c) a 3D volume constraint that is not maintained (<v>/V_0 = 0.771) and (d) a
# like-for-like optical-section comparison that is weaker (r = 0.758) than the native-2D one scored in v2
# (r = 0.925). These are listed under `remediation` for Pass 4.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files at commit 654cd6fc (working tree of the Pass 3 loop).

