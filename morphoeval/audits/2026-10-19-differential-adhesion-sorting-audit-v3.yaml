simulations:
  - id: steinberg-differential-adhesion-sorting
    name: "Steinberg (1963, 1970) & Graner-Glazier (1992) differential adhesion cell sorting"
    organism: "Chick embryo (Gallus gallus) dissociated tissue aggregates & multicellular embryoid body spheroids"
    script: 1964-steinberg-differential-adhesion-sorting.py
    output: docs/media/differential_adhesion_sorting_comparison.png
    extra_outputs:
      - docs/media/differential_adhesion_sorting_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-differential-adhesion-sorting-audit-v2
    source_refs:
      - steinberg1963
      - steinberg1970
      - graner1992
      - glazier1993
      - foty1996
      - mombach1995
      - nakajima2011
      - chen2007
    claim_boundary:
      reported_in_source:
        - "Steinberg (1963, 1970) Differential Adhesion Hypothesis (DAH): dissociated binary embryonic tissues spontaneously sort into concentric core-shell or lens configurations governed by interfacial free energy minimization."
        - "Graner & Glazier (1992) PRL Eqs. 1-3: extended Cellular Potts Hamiltonian with interfacial tensions gamma_AB = J_AB - (J_AA + J_BB)/2 and gamma_tauM = J_tauM - J_tautau/2 partitioning parameter space into checkerboard (gamma_AB < 0), complete engulfment (0 < gamma_AB < gamma_BM - gamma_AM), partial engulfment (gamma_AB > gamma_BM - gamma_AM > 0), and dissociation (gamma_AM < 0); Fig. 3 reports logarithmically slow decay of the heterotypic boundary length."
        - "Foty, Pfleger, Forgacs & Steinberg (1996) Development Table 1: empirical Gallus gallus tissue surface tensions (20.1 > 12.6 > 8.5 > 4.6 > 1.6 dyn/cm) strictly predict transitive mutual envelopment."
      reconstructed_in_script:
        - "2D extended Cellular Potts Model (60^2, 68 cells) across all 5 thermodynamic regimes plus a 7-point continuous J_AB sweep, with a cell-level type-swap accelerator and, in the partial-engulfment regime only, an ad hoc symmetry-breaking field."
        - "Pass 3: 3D extended Cellular Potts spheroid on a 64^3 lattice (840 cells, 26-neighbour adhesion, volume constraint, 8-colour sublattice-parallel Metropolis) with its 2D equatorial z-section, a Kawasaki-swap ablation and a 3D equal-adhesion control; logarithmic vs power-law fits of L_AB(t)/L(t) with exponents compared to the LSW alpha = 1/3 bound."
        - "Computer-vision segmentation of a confocal fluorescence embryoid body spheroid (`cell_sorting_specimen.jpg`) comparing empirical GFP/RFP radial occupancy against the 2D Potts core-shell profile (r = 0.925) and the 3D equatorial-section profile (r = 0.758)."
      transfer_boundary:
        - "64^3 x 200 MCS is far from the asymptotic coarsening regime; exponents are fitted over ~2.3 decades of MCS including the initial transient, and the power-law vs logarithmic R^2 (0.9965 vs 0.9845 in 3D; 0.737 vs 0.769 in 2D) do not discriminate the two laws."
        - "The LSW alpha = 1/3 reference is a conserved-order-parameter coarsening bound, not an exponent measured for the Cellular Potts model; the Nakajima & Ishihara (2011) exponent is deliberately left null in the reference JSON because the paper could not be consulted offline."
        - "The vendored specimen is a Wikimedia Commons embryoid body, not a chick-tissue aggregate from Steinberg or Foty; the radial-profile comparison is a morphological analogy, not a reproduction of a paper figure."
      does_not_claim:
        - "Does not model active chemotaxis, subcellular cadherin trafficking kinetics, or the fluctuation-dependence of sorting studied by Mombach et al. (1995)."
        - "Does not claim the cell-level type-swap accelerator or the partial-engulfment bias field are part of the Graner & Glazier (1992) Hamiltonian."
    summary: >-
      Pass 3 (v3) evaluation of `1964-steinberg-differential-adhesion-sorting.py` after closing the
      single v2 remediation item: `simulate_potts_regime_3d()` (L646-854) runs the Graner & Glazier
      Hamiltonian on a 64^3 lattice holding 840 cubic cells with an 8-colour parity sublattice-parallel
      Metropolis sweep whose adhesion dH is exact by Lean theorem `parity_sublattice_sites_not_moore_adjacent`,
      and `compare_2d_vs_3d_sorting_kinetics()` (L857-904) tabulates power-law exponents for the native 2D
      model (alpha = 0.189, R^2 0.74, log law preferred), the full 3D boundary (alpha = 0.215, R^2 0.997,
      power law preferred), the 3D equatorial z-section (0.207), the swap ablation (0.228, delta = -0.013)
      and the 3D equal-adhesion control (0.001). The 3D spheroid sorts (Delta_r = +0.198 full, +0.224
      section vs control +0.004) and both the 2D and 3D solvers are bitwise deterministic. The re-score
      is held near v2 (89.9 vs 90.5) rather than raised because the audit of the new solver exposed defects
      that v2 did not price: an ad hoc external field at L390-394 imposes the partial-engulfment lens of
      Panel A3; the "Kawasaki" accelerator (L361-397, L747-771) swaps the types of random non-adjacent
      cells at an uncited 2.5 T; the 3D volume constraint is not maintained (<v>/V_0 = 0.771 with
      lambda_V = 2, T = 30); the like-for-like 3D-section vs specimen correlation (r = 0.758) is weaker
      than the 2D one (0.925); and the three Pass 3 citations carry DOIs that could not be verified offline.
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          Interfacial tensions and the 5-regime classifier (`compute_interfacial_tensions`, L137-181)
          match Graner & Glazier (1992) Eqs. 2-3 exactly and are mirrored by Lean theorems 1-2; the 2D
          Metropolis copy attempts (L399-457) and the new 3D solver (L646-854) implement Eq. 1 with the
          correct adhesion and quadratic area/volume terms, the single-voxel volume increment is proved
          (`potts_volume_energy_single_voxel_increment`), and the 3D sublattice-parallel update is exact for
          the adhesion term (theorem 5) with the volume-term approximation disclosed (L676). The 3D run
          reproduces complete engulfment (Delta_r = +0.198, control +0.004) and the Pass 3 item is genuinely
          closed (+2 vs v2 for the 3D Hamiltonian). Deductions: the partial-engulfment regime adds an
          external position-dependent field `dE += 1.8 * (x1 ... x2)` (L390-394) that is not in the
          Hamiltonian, so Panel A3's doublet lens is imposed rather than selected (-3); the "Kawasaki" moves
          at L361-397 and L747-771 exchange the types of two randomly drawn, generally non-adjacent cells
          at an uncited temperature 2.5 T — a non-local accelerator with no counterpart in the 1992/1993
          papers, and the 2D kinetics are reported without the ablation that the 3D run has (-2); the 3D
          volume constraint is too weak against the 26-neighbour adhesion scale, leaving <v>/V_0 = 0.771
          (L652-654, measurement `potts_3d_mean_cell_volume_fraction`), i.e. the cells are not at the
          target volume the Hamiltonian prescribes (-2); the 2D MCS is 1.5 attempts per boundary site
          (L409) rather than one attempt per lattice site, an uncited convention (-1).
