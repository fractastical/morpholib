          - {file: 1964-steinberg-differential-adhesion-sorting.py, lines: [646, 854], note: "Pass 3 3D Cellular Potts spheroid: 64^3 lattice, 840 cells, 26-neighbour adhesion, volume constraint, 8-colour sublattice-parallel Metropolis with exact adhesion dH", supports: true}
          - {file: 1964-steinberg-differential-adhesion-sorting.py, lines: [390, 394], note: "Ad hoc symmetry-breaking field added to dE only in the partial-engulfment regime; not part of the Graner-Glazier Hamiltonian, imposes the Panel A3 lens", supports: false}
          - {file: 1964-steinberg-differential-adhesion-sorting.py, lines: [361, 397], note: "2D 'Kawasaki' type-swap accelerator between random (non-adjacent) cell pairs at temperature 2.5 T; no 2D ablation reported", supports: false}
          - {file: 1964-steinberg-differential-adhesion-sorting.py, lines: [747, 771], note: "3D type-swap accelerator via face-contact matrix (exact dE) with the same 2.5 T acceptance; ablated in compare_2d_vs_3d_sorting_kinetics (delta alpha = -0.013)", supports: true}
          - {file: morphoeval/lean/loops/Loop_041_differential_adhesion_sorting.lean, lines: [110, 156], note: "Theorems 5-7: parity sublattice non-adjacency, single-voxel volume increment identity and its sign; 7 theorems total, 0 sorry, verified with lean", supports: true}
      specimen-match:
        value: 87
        rationale: >-
          The SHA-256-verified confocal embryoid body specimen is segmented (L911-1010) into a GFP core
          (r_B/R = 0.49) and an RFP shell (r_A/R = 0.77, Delta_r = +0.28) and overlaid against the 2D
