# MorphoEval audit — Karsai & Pénzes (1993) J. Theor. Biol., Theraulaz & Bonabeau (1995) Science & Smith et al. (2021) PNAS Social Wasp Stigmergic Hexagonal Comb Architecture, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `1998-bonabeau-social-wasp-comb-hexagons.py` (226 lines)
# prior to Step 12 remediation in `2026-10-19-social-wasp-comb-hexagons-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.2 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `generate_deterministic_hex_rings` (L56-68) places axial coordinates (q, r) in
#      hardcoded concentric rings rather than simulating the stochastic Boltzmann stigmergic
#      cell-initiation process P_init(j) = exp(beta * k_j) / sum_m exp(beta * k_m) over
#      candidate perimeter pockets with k in {1, 2, 3} shared walls.
#   2. `evaluate_ring_economy_table` (L71-86) evaluates only the analytic 8-ring centered
#      hexagonal table R in [0, 7] and omits the 7-point stigmergic selectivity sweep
#      beta in [0.0, 5.5], the beta = 0.0 Eden random perimeter growth negative control,
#      and the Smith et al. (2021) worker-to-reproductive cell size transition (lambda in
#      [1.00, 1.40]) inducing paired pentagon-heptagon (5-7) topological disclinations.
#   3. The vendored CC BY 2.0 Polistes paper wasp comb photograph
#      `datasets/social_wasp_comb_hexagons/polistes_wasp_comb_specimen.jpg` is never loaded,
#      segmented, or analyzed via Voronoi/Delaunay neighbor-count topology in
#      `social_wasp_comb_hexagons_comparison.png`.
#   4. Runtime SHA-256 verification of dataset assets and CLI parameter overrides
#      (`--beta`, `--n-cells`, `--size-ratio-lambda`, `--seed`) are missing.

