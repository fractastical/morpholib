simulations:
  - id: delphi10000-fractofusus-misrai-turing-wavelength-s0
    name: "Schnakenberg–Turing wavelength for Fractofusus misrai at 63 µm (565 Ma)"
    organism: "Fractofusus misrai (Ediacaran spindle rangeomorph)"
    script: models/2026-delphi10000-fractofusus-misrai-turing-wavelength-s0.py
    output: docs/media/fractofusus_misrai_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, gehling2007, hoyalcuthill2014, mitchell2015]
    summary: >-
      Detail-scale (tier 4_cellular_10um) Schnakenberg field whose analytical
      critical wavelength is fixed at 6.33e-05 m (63 µm, log10 = -4.199) for
      the 565 Ma Mistaken Point chronospecies, series index 1/1. Spectral
      growth rates match the Turing dispersion relation (Pearson r = 0.999999999,
      RMSE = 0.00375) for integer k = 1..8. The saturated field's dominant
      wavelength is 73.7 µm, a disclosed nonlinear shift away from the linear
      63.3 µm. D_u from 0.05 to 0.25 lengthens analytical λ_c monotonically.
      Equal diffusion and a 2×2 subcritical domain both decay. The CC BY 2.0
      Mistaken Point photograph is segmented (spindle aspect 1.70) and compared
      with the rendered spindle (aspect 1.11); gradient-angle KS D = 0.093.
      Fifty-one of these wavelengths fit in the 3.275 mm organ-scale module
      and fifty-two do not. The 63 µm length is the evaluation scale, not a
      published thin-section measurement.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: a homogeneous reaction-diffusion state can be unstable at a finite critical wavenumber k_c, selecting a stationary wavelength."
        - "Gehling & Narbonne 2007 name Fractofusus misrai from Mistaken Point and place it in the mid-Ediacaran, ca. 575–560 Ma, as a fusiform rangeomorph below the photic zone."
        - "Hoyal Cuthill & Conway Morris 2014: rangeomorph fronds are a fractal, self-similar, axial-apical-alternate body plan consistent with osmotrophy."
        - "Mitchell et al. 2015: Fractofusus spatial clusters record multigenerational stolon-like reproduction plus waterborne propagules."
      reconstructed_in_script:
        - "Schnakenberg parameters a=0.09, b=0.85, D_u=0.12, D_v=2.40, with the grid spacing chosen so analytical λ_c = 6.33e-05 m. These constants are not taken from slot 1251."
        - "A siltstone-coloured spindle render whose interior contrast is the growing activator. Chevron ridges are a display of the selected wavelength, not a measured branch angle."
      transfer_boundary:
        - "The wavenumber law is evaluated at 63 µm on one Mistaken Point bedding-plane photograph. It does not transfer to Fractofusus andersoni, to the 3.275 mm organ-scale module, or to Cambrian bilaterian segmentation."
      does_not_claim:
        - "Does not claim a measured 63 µm pigment ocellus or cellular reaction-diffusion stripe on Fractofusus. Mistaken Point preserves external moulds."
        - "Does not claim the saturated 73.7 µm Fourier peak equals the linear wavelength. The shift is reported."
        - "Does not claim a second chronospecies. The series is 1/1 at 565 Ma."
    scores:
      model-fidelity:
        value: 88
        rationale: "The script integrates Schnakenberg kinetics with spectral diffusion and evaluates the Turing 1952 dispersion relation, including trace, determinant, and the diffusion-weighted trace. The kinetics are Schnakenberg's, not the specific reaction network in Turing's 1952 examples."
        evidence:
          - {file: models/2026-delphi10000-fractofusus-misrai-turing-wavelength-s0.py, lines: [92, 124], note: "jacobian and turing_conditions", supports: true}
          - {file: models/2026-delphi10000-fractofusus-misrai-turing-wavelength-s0.py, lines: [126, 174], note: "analytical and spectral growth rates", supports: true}
      specimen-match:
        value: 80
        rationale: "The comparison figure places the CC BY Mistaken Point mould beside a siltstone spindle. Bedding colour and an elongate central body are shared. The model's interior is a spot lattice with a weak chevron, while the fossil's vanes are oblique and continuous, so this is not a registered overlay. Computer-vision similarity of the 12-frame GIF against the photograph is 79.4."
        evidence:
          - {file: docs/media/fractofusus_misrai_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen photograph beside the grown field", supports: true}
          - {file: docs/media/fractofusus_misrai_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 720x540, pattern emerges on the bedding", supports: true}
      parameter-expressivity:
        value: 84
        rationale: "Raising D_u from 0.05 to 0.25 lengthens analytical λ_c monotonically from about 40 µm to about 93 µm, and the sweep is plotted. Equal diffusion and a domain shorter than λ_c both lose the pattern. The sweep is still analytical: the saturated field's own Fourier wavelength has been measured only at the nominal D_u."
        evidence:
          - {file: models/2026-delphi10000-fractofusus-misrai-turing-wavelength-s0.py, lines: [245, 283], note: "wavelength_sweep and ablation_controls", supports: true}
          - {file: docs/media/fractofusus_misrai_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "D_u sweep panel and control flags", supports: true}
      morphometric-validation:
        value: 86
        rationale: "Dispersion Pearson r = 0.999999999 and RMSE = 0.00375 against the analytical curve. The saturated wavelength, 73.7 µm, is not set equal to the 63.3 µm linear reference. Specimen spindle aspect 1.70 is compared with the render's 1.11, and the gradient-angle KS statistic is 0.093 (p = 2e-15) on one photograph. That is a real comparison on n = 1, not a population."
        evidence:
          - {file: models/2026-delphi10000-fractofusus-misrai-turing-wavelength-s0.py, lines: [176, 190], note: "dispersion_fit Pearson r and RMSE", supports: true}
          - {file: models/2026-delphi10000-fractofusus-misrai-turing-wavelength-s0.py, lines: [326, 368], note: "Otsu spindle metrics and KS on gradient angles", supports: true}
      source-traceability:
        value: 90
        rationale: "Crossref-checked DOIs for Turing 1952, Schnakenberg 1979, Gehling & Narbonne 2007, Hoyal Cuthill & Conway Morris 2014, and Mitchell et al. 2015. The specimen file is the CC BY 2.0 Commons photograph by djpmapleferryman, SHA-256 pinned."
        evidence:
          - {file: datasets/fractofusus_misrai_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "Turing, Schnakenberg, Gehling & Narbonne entries", supports: true}
          - {file: datasets/fractofusus_misrai_turing_wavelength_s0/scout_manifest.json, lines: [1, 40], note: "OpenAlex candidates and Commons license record", supports: true}
      code-traceability:
        value: 84
        rationale: "The module docstring states the PDEs, the expression for k_c, the periodic boundary, the 565 Ma age, and the 51-versus-52 scale separation. Each measured quantity is produced by a named function. The chevron in the renderer is a display wavelength, and that distinction is easier to miss than the dispersion code."
        evidence:
          - {file: models/2026-delphi10000-fractofusus-misrai-turing-wavelength-s0.py, lines: [1, 36], note: "governing equations, scale, and claim limit", supports: true}
          - {file: models/2026-delphi10000-fractofusus-misrai-turing-wavelength-s0.py, lines: [517, 560], note: "run_pipeline wires reference JSON parameters to the field", supports: true}
      repro-package:
        value: 86
        rationale: "Seed 3227, --self-test, SHA-256 locks on the five vendored inputs, and the Agg backend. A fresh run regenerates the PNG, the 12-frame GIF at 720×540, and the metrics JSON. Dependencies are the repo scientific stack (numpy, scipy, Pillow, matplotlib)."
        evidence:
          - {file: models/2026-delphi10000-fractofusus-misrai-turing-wavelength-s0.py, lines: [75, 85], note: "verify_sha256 against EXPECTED_SHA256", supports: true}
          - {file: models/2026-delphi10000-fractofusus-misrai-turing-wavelength-s0.py, lines: [685, 723], note: "self-test gates on r, controls, frames, and resolution", supports: true}
    remediation:
      - id: R1
        item: "Measure the saturated-field Fourier wavelength at each D_u in the sweep, not only the analytical λ_c."
      - id: R2
        item: "The render's interior reads as a spot lattice. Weight oblique rangeomorph vanes more strongly than the raw spots and re-score the GIF against the specimen."
      - id: R3
        item: "Single assessor. A second provider has not scored this pass."
