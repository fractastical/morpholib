simulations:
  - id: delphi10000-drosophila-planitibia-turing-wavelength-s0
    name: "Drosophila planitibia detail-tier Turing wavelength (5.13 µm, Holocene 0 Ma)"
    organism: "Drosophila planitibia"
    script: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py
    output: docs/media/drosophila_planitibia_turing_wavelength_s0_comparison.png
    supersedes_audit_id: 2026-10-27-drosophila-planitibia-turing-wavelength-s0-audit
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Turing (1952) dispersion relation and Schnakenberg (1979) kinetics a - u + u^2 v, b - u^2 v."
        - "Edwards et al. (2007) document Hawaiian picture-wing patterns. Kambysellis et al. (1995) Current Biology 5:1129 place the picture-wing radiation phylogenetically. Carson (1982) describes the newer-volcano radiation that includes Maui D. planitibia."
        - "Assigned phenomenon scale for this detail variant: 5.13e-06 m (5.1 µm, log10 = -5.290) at geological age 0 Ma."
      reconstructed_in_script:
        - "Linearized Fourier probe on the real Turing band: Pearson r = 0.99999993 (p = 6.39e-39, RMSE = 7.20e-05) against the discrete dispersion symbol. Interpolated wavelength 5.097 µm versus the 5.13 µm calibration."
        - "Equal-diffusion ablation ratio 45.76. Unstable diffusion ratios d = 12 to 40 give a strictly lengthening wavelength. D_u(117 µm)/D_u(5.13 µm) = 520.16 and D_u(114 µm)/D_u(5.13 µm) = 493.83 at age delta 0 Ma."
        - "Specimen scale bar 111 px = 100 µm. Spiral-band ridge 67.57 µm, Otsu circularity 0.662, radial-spectrum KS = 0.719 versus the rendered field. CV similarity of the 12-frame GIF is 87.6."
      transfer_boundary:
        - "Schnakenberg kinetics are a generic activator-inhibitor model placed at the assigned 5.13 µm tier. They are not a fitted yellow/ebony circuit for D. planitibia."
      does_not_claim:
        - "That Edwards, Kambysellis, or Carson measured 5.13 µm, or that the 67.57 µm spiral carrier is that wavelength."
        - "That DOI 10.1073/pnas.92.17.7819 is the Hawaiian Drosophila phylogeny."
        - "A counted foretarsal-cilium spacing, or a signed nanopublication (no local nanopub profile)."
    source_refs:
      - turing1952
      - schnakenberg1979
      - edwards2007
      - kambysellis1995
      - carson1982
      - kondo2010
    summary: >-
      Pass 2 closes the three Pass 1 failures. Eigenvector seeding on the real
      Turing band lifts the dispersion correlation from r = -0.125 to
      r = 0.99999993 (RMSE 7.20e-05). The sweep is now restricted to ratios with
      sigma_max > 0, where lambda lengthens from about 4.7 µm to 6.0 µm as d
      goes from 12 to 40, and the equal-diffusion control decays (amplitude
      ratio 45.76, probe sigma negative). The specimen radial ridge, calibrated
      by the 111 px / 100 µm bar, is 67.57 µm and is reported as a different
      scale from lambda_c. GIF fitness CV similarity is 87.6 at 800×600 and
      12 frames. Weighted overall is 89.6. Signing was skipped honestly because
      ~/.nanopub/profile.yml is absent.
    scores:
      model-fidelity:
        value: 92
        rationale: >-
          Pass 2 seeds modes 4–16, where the leading eigenvalue is real, on that
          eigenvector and fits the log-slope of the cosine projection. Pearson
          r = 0.99999993 against eig(J(k)) of the same 5-point Laplacian
          (RMSE 7.20e-05, 13 modes). Homogeneous state has trace < 0 and
          det > 0; nominal d = 18.6 is unstable and d = 1 is stable, matching
          the Lean trace-diffusion theorems. The score stays below 95 because
          the kinetics are generic Schnakenberg parameters placed at an assigned
          length, not a species-published parameter table.
        evidence:
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [123, 149], note: "Discrete and continuous dispersion symbols", supports: true}
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [155, 226], note: "Eigenvector-seeded linear PDE probe and Pearson fit", supports: true}
          - {file: morphoeval/lean/loops/Loop_3199_drosophila_planitibia_turing_wavelength_s0.lean, lines: [22, 52], note: "Seven Lean theorems, 0 sorry: wavelength ordering, wavenumber ratios, Turing threshold, ablation, age delta 0", supports: true}
      specimen-match:
        value: 86
        rationale: >-
          The animated GIF (12 frames, 800×600) is colored with a LUT sampled
          from the vendored micrograph and scores cv_sim_similarity 87.6 by the
          canonical Sobel-orientation, radial-FFT, and coherency comparison.
          The comparison figure shows the micrograph beside the spot field.
          Specimen-match is 86 rather than higher because the nonlinear pattern
          is a spot lattice, while the micrograph's coarse structure is a spiral
          whose ridge is 67.57 µm, deliberately not identified with 5.13 µm.
        evidence:
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [449, 482], note: "Pigment LUT and 12-frame full-bleed GIF", supports: true}
          - {file: docs/media/drosophila_planitibia_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "800×600, 12 frames, CV similarity 87.6", supports: true}
          - {file: docs/media/drosophila_planitibia_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Specimen, field, dispersion, chronoseries, sweep, ablation", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          Above onset, lambda(d) is strictly increasing on d in {12, 15, 18.6, 24, 32, 40}.
          Ratios with sigma_max <= 0 are stored and excluded from the test.
          The equal-diffusion ablation (d = 1) on the same noise family decays
          while d = 18.6 grows: final-std ratio 45.76, and the equal-diffusion
          probe eigenvalue is negative. Nominal d = 18.6 is marked on the sweep.
        evidence:
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [268, 298], note: "Unstable-branch diffusion-ratio sweep", supports: true}
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [229, 265], note: "Equal-diffusion negative control", supports: true}
      morphometric-validation:
        value: 90
        rationale: >-
          measure_morphoeval reports seven comparisons whose values are not
          copies of their references: dispersion r = 0.99999993 versus 1,
          linear-regime wavelength 5.0972 µm versus 5.13 µm, specimen spiral
          ridge 67.5676 µm versus 5.13 µm, Otsu circularity 0.6619 versus 1,
          radial KS 0.7190 versus 0, ablation ratio 45.7569 versus 1, and
          D_u ratio versus D. persimilis 520.1600 versus 1. Continuous-symbol
          wavelength on the same dx is 5.177 µm.
        evidence:
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [638, 717], note: "Seven non-circular morphometrics with references, RMSE, KS, and CV notes", supports: true}
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [383, 447], note: "Scale-bar calibration, Otsu contour, spiral-ridge FFT, KS against the render", supports: true}
      source-traceability:
        value: 92
        rationale: >-
          Citations resolve on OpenAlex or Crossref. The Kambysellis phylogeny
          is Current Biology 10.1016/s0960-9822(95)00229-6; the script and the
          reference JSON both refuse the unrelated PNAS DOI used by an older
          sibling slot. Specimen SHA-256 is 4e1280925b1e63afbca87b977aa9621a93f248ec4d3cce3f876b0e1d4c831cca.
          Scout records that campaign slot 3199 does not exist and that Commons
          returned no image.
        evidence:
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [83, 92], note: "SHA-256 pin of reference JSON, specimen, scout, bib, and README", supports: true}
          - {file: datasets/drosophila_planitibia_turing_wavelength_s0/scout_manifest.json, lines: [1, 80], note: "OpenAlex candidates, empty Commons result, no s0 collision", supports: true}
          - {file: datasets/drosophila_planitibia_turing_wavelength_s0/paper_citations.bib, lines: [1, 87], note: "Primary BibTeX", supports: true}
      code-traceability:
        value: 88
        rationale: >-
          Each math-kg equation names a Lean declaration and a code range:
          Jacobian and threshold (L95–149, Lean traceDiffusion), fastest-mode
          wavelength (L155–226, lambdaDetailNm), and the ablation (L229–265).
          The docstring states the 5.13 µm scale and the 0 Ma age delta before
          any numerical result.
        evidence:
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [1, 42], note: "Scale, age, predecessor, successor, and the governing law", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-drosophila-planitibia-turing-wavelength-s0.yaml, lines: [36, 75], note: "Equation records with Lean and code loci", supports: true}
      repro-package:
        value: 91
        rationale: >-
          python3 models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py
          --self-test passes: r > 0.98, unstable sweep strictly increasing,
          ablation ratio > 5, equal-diffusion sigma < 0, numerical wavelength
          within 12% of 5.13 µm, GIF at least 10 frames and 480 px, age delta 0.
          Seed 3199. Dependencies are the repo scientific stack (numpy, scipy,
          matplotlib, Pillow, PyYAML).
        evidence:
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [720, 800], note: "Self-test gates and CLI entry point", supports: true}
          - {file: datasets/drosophila_planitibia_turing_wavelength_s0/README.md, lines: [1, 24], note: "Invocation and explicit scale and age", supports: true}
