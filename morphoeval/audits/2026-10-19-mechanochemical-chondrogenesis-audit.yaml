simulations:
  - id: oster-mechanochemical-chondrogenesis
    name: "Oster, Murray & Harris (1983) / Oster, Murray & Maini (1985) mechanochemical limb chondrogenesis"
    organism: "Ambystoma mexicanum & Oedipina ecuatoriana urodele salamander limb cartilage"
    script: 1983-oster-mechanochemical-chondrogenesis.py
    output: docs/media/mechanochemical_chondrogenesis_comparison.png
    extra_outputs:
      - docs/media/mechanochemical_chondrogenesis_growth.gif
    status: evaluated
    source_refs:
      - oster1983
      - oster1985
      - murray1984
      - shubin1986
    summary: >-
      Pass 1 baseline assessment of `1983-oster-mechanochemical-chondrogenesis.py` (57.8/100).
      The initial implementation formulates the Oster, Murray & Harris (1983) and Oster, Murray &
      Maini (1985) coupled cell-density and viscoelastic ECM equations, but requires exact
      consistency between the analytical marginal stability curve tau_eff(k^2) and the PDE
      diffusive-mitotic damping parameters so that subcritical traction (tau = 0.85 < tau_c)
      is strictly stable across all wavenumbers, alongside full morphological cross-section
      segmentation of both the 4-digit forelimb and 5-digit hindlimb urodele specimen
      (`salamander_limb_cartilage_specimen.jpg`).
    scores:
      model-fidelity:
        value: 60
        rationale: >-
          Implements the Oster-Murray-Maini (1985) coupled cell density n(x,t) and viscoelastic
          ECM displacement u(x,t) PDE system with biharmonic cell diffusion and contact-inhibited
          traction tau*n^2/(1+lam*n^2), but the initial low-diffusion parameter set (D_1=0.08,
          D_2=0.0025) leaves tau=0.85 weakly unstable unless calibrated to the exact marginal
          stability curve tau_c = 1.2776.
        evidence:
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [108, 178], note: "Linearized mechanochemical dispersion relation and critical traction threshold tau_c", supports: false}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [185, 272], note: "Coupled 1D spectral-pseudospectral cell-ECM PDE solver", supports: true}
      specimen-match:
        value: 54
        rationale: >-
          Vendors `datasets/mechanochemical_chondrogenesis/salamander_limb_cartilage_specimen.jpg`
          (CC BY 4.0 urodele salamander forelimb and hindlimb skeletal reconstruction), but Pass 1
          requires morphological opening to suppress thin text annotations and extract clean
          [1, 2, 4] forelimb and [1, 2, 5] hindlimb branching hierarchies.
        evidence:
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [345, 425], note: "Specimen cross-sectional segmentation on salamander_limb_cartilage_specimen.jpg", supports: false}
      parameter-expressivity:
        value: 58
        rationale: >-
          Evaluates transverse limb width modes, but needs a complete 5-zone proximo-distal
          sweep (subcritical m=0, stylopod m=1, zeugopod m=2, forelimb autopod m=4, and hindlimb
          autopod m=5) plus a 2D (W/lambda_c, tau) phase diagram.
        evidence:
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [275, 340], note: "2D limb paddle branching and ECM displacement field", supports: true}
      morphometric-validation:
        value: 54
        rationale: >-
          Includes `measure_morphoeval()`, but Pass 1 needs full 5-regime mode count RMSE,
          forelimb and hindlimb autopod inter-digital spacing CV, and cross-sectional waveform
          Pearson correlation r.
        evidence:
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [430, 505], note: "MorphoEval measurement hook measure_morphoeval()", supports: false}
      source-traceability:
        value: 66
        rationale: >-
          Vendors `scout_manifest.json`, `mechanochemical_chondrogenesis_reference.json`,
          `paper_citations.bib`, and `salamander_limb_cartilage_specimen.jpg` with SHA-256
          cryptographic verification.
        evidence:
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [72, 102], note: "SHA-256 verification of vendored dataset files", supports: true}
      code-traceability:
        value: 60
        rationale: >-
          Maps equations to Oster, Murray & Harris (1983), Oster, Murray & Maini (1985), and
          3 Lean 4 theorems in `Loop_013_mechanochemical_chondrogenesis.lean`.
        evidence:
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [1, 52], note: "Module docstring linking equations and Lean 4 theorems", supports: true}
      repro-package:
        value: 60
        rationale: >-
          Provides `--self-test` and deterministic seed=1983; Pass 1 self-test caught the
          subcritical dispersion threshold calibration needed before Pass 2.
        evidence:
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [690, 745], note: "Deterministic self-test suite", supports: true}
    remediation:
      - "Calibrate the canonical mechanochemical parameters (D_1=0.28, D_2=0.015, E_eff=1.0, s=0.85, r=0.32) to the exact marginal stability curve tau_eff(k^2) so tau_c = 1.2776 and subcritical tau=0.85 < tau_c is strictly stable (sigma(k) < 0 for all k > 0, 0 condensations)."
      - "Apply morphological binary opening/closing on `salamander_limb_cartilage_specimen.jpg` to reject thin pointer lines and segment both the [1, 2, 4] forelimb (humerus -> ulna+radius -> digits I-IV) and [1, 2, 5] hindlimb (femur -> tibia+fibula -> digits I-V) branching hierarchies."
      - "Verify all 5 proximo-distal regimes (m = 0, 1, 2, 4, 5) in the coupled 1D cell-ECM PDE solver and render the 6-panel synthesis figure and 24-frame growth animation."
