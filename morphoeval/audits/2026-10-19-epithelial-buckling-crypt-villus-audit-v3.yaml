          - {file: 2013-shyer-intestinal-villi-buckling.py, lines: [422, 514], note: "compute_shh_bmp_cluster_field (Gaussian-smoothed positive Laplacian amplified by crest-contour turning curvature, 82nd-percentile soft threshold, connected-component count) and summarize_cluster_localization (elbow index, crest/tip fraction)", supports: true}
