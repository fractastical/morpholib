    remediation:
    - >-
      2013-shyer-intestinal-villi-buckling.py:779-782 and 877, 1075 — the stage amplitude is rescaled to
      target_amplitude_um = the observed amplitude_obs_um, so Panel D, the GIF amplitude curves and the FK506
      amplitude comparisons are circular; the non-target fallback 155*sqrt(dex+0.8 dey) is unsourced. Let the
      amplitude emerge from the minimiser (or from the weakly nonlinear amplitude equation A^2 ~ (mu - mu_c)/g) and
      compare the prediction with amplitude_obs_um as a genuine measurement.
    - >-
      2013-shyer-intestinal-villi-buckling.py:666-669, 677 and 732 — theta_zz is taken from target_theta_zz_deg
      (observed, unsourced 0.92 fallback), the hexagonal angle is the literal 58.5, and the relaxed surface is
      blended 0.85 prescribed cosine + 0.15 relaxed, so the 'E14 theta_zz = 38.5 vs 38.5' measurement is templated.
      Remove the blend and the target, and measure theta_zz from the crest contours of the relaxed surface.
    - >-
      2013-shyer-intestinal-villi-buckling.py:802 and 811-815 — lambda_sim = 0.85 lambda_* + 0.15 lambda_fft and
      psi6_sim is a per-regime literal (0.09 / 0.28 + 0.10 dey/dex / 0.78), so the E16 |Psi_6| = 0.78 vs 0.78
      measurement is self-referential. Report lambda_fft as the simulated wavelength and compute |Psi_6| from
      the Delaunay neighbourhood of the detected villus maxima, as is already done for the specimen (L1101-1188).
    - >-
      2013-shyer-intestinal-villi-buckling.py:722 and 748-770 — L-BFGS-B stops on its 65-iteration limit because
      L_op^2 has condition number ~1e7 on the 64^2 grid, which is why Pass 3 uses a linear Newton response instead
      of re-minimising. Replace the minimiser by a semi-implicit (exponential-integrator) spectral gradient flow
      on the FvK energy so the cluster-coupled surface is a true energy minimum.
    - >-
      2013-shyer-intestinal-villi-buckling.py:290-365 (rigid outer wall u(R_out)=0) and 261-271 — the ring FEM is
      axisymmetric and 1D-radial, and the smooth-muscle sheath is infinitely stiff; the v2 item asked for a 3D
      tubular neo-Hookean mesh. Add a finite muscle-spring boundary (E_m h_m/R^2) and extend the foundation to a
      non-axisymmetric (r, theta) mesh so the curvature factor depends on the circumferential mode n.
    - >-
      2013-shyer-intestinal-villi-buckling.py:422-484 and 136-142 — the Shh field is curvature-driven with five
      tunables (SHH_BMP_CUBIC_GAIN 0.60, ELBOW_DOME_GAIN 1.0, SHH_CLUSTER_QUANTILE 0.82, SHH_TRUST_FRACTION 0.30,
      diffusion_length_frac 0.16) that have no empirical anchor, and the docstring admits a direct Shyer-2015
      exp(-d/ell) test gives elbow index < 1 on the developable surface. Replace the curvature proxy by a
      Shh/Ptch1/BMP reaction-diffusion model on the deformed surface and anchor the cluster spacing to Walton 2012
      / Shyer 2015 measured cluster counts.
    - >-
      datasets/epithelial_buckling_crypt_villus/epithelial_buckling_crypt_villus_reference.json and
      2013-shyer-intestinal-villi-buckling.py:127, 965-983 — the stage-resolved E_e, E_s, H_s, epsilon_x,
      epsilon_y, alpha_3 were fitted so that the flat model with C_LAMBDA_PREFACTOR = 0.5690 reproduces
      lambda_obs, and c_tube is an OLS fit to the same data, so the flat and tube RMSE and the 12-point collapse are
      in-sample. Source stage moduli and thicknesses from Shyer 2013 SM measurements (or state them as fitted) and
      hold out at least one species for the collapse.
    - >-
      2013-shyer-intestinal-villi-buckling.py:1101-1188 — the SHA-pinned specimen is a terminal-ileum H&E section
      of unknown species/age compared with chick E16 hexagonal order via a hard-coded ROI [60:660, 80:880], DoG
      sigmas 18/45, percentiles 28/55 and Delaunay edge bounds 40-185 px with no pixel scale. Vendor a chick E16
      (or quail/mouse) villus-field micrograph with a scale bar and derive the detection scales from the expected
      villus spacing.
