          - {file: 2013-shyer-intestinal-villi-buckling.py, lines: [261, 365], note: "neo_hookean_tangent_modulus, lame_thick_cylinder_stiffness and the 48-element axisymmetric plane-strain ring FEM tubular_neo_hookean_foundation (rigid outer wall u=0, unit inward epithelial displacement) returning K_tube, K_slab, curvature_factor, prestrain_factor, K_eff", supports: true}
          - {file: 2013-shyer-intestinal-villi-buckling.py, lines: [368, 419], note: "donnell_curvature_ratio and compute_tubular_length_and_wavelength: ell_tube, lambda_tube, integer mode quantisation n = round(2 pi R / lambda) (Lean Law 4), Donnell gamma", supports: true}
