simulations:
  - id: shyer-intestinal-villi-buckling
    name: "Hannezo et al. (2011) PRL & Shyer et al. (2013) Science sequential smooth-muscle mucosal buckling into ridges, zigzags, and hexagonal villi"
    organism: "Vertebrate embryonic gut mucosa (Gallus gallus, Coturnix japonica, Mus musculus)"
    script: 2013-shyer-intestinal-villi-buckling.py
    output: docs/media/epithelial_buckling_crypt_villus_comparison.png
    extra_outputs:
      - docs/media/epithelial_buckling_crypt_villus_growth.gif
      - docs/media/epithelial_buckling_crypt_villus_tubular_shh_bmp.png
    also:
      - docs/media/epithelial_buckling_crypt_villus_growth.gif
      - docs/media/epithelial_buckling_crypt_villus_tubular_shh_bmp.png
      - datasets/epithelial_buckling_crypt_villus/tubular_shh_bmp_reference.json
      - datasets/epithelial_buckling_crypt_villus/pass3_citations.bib
    domain: morphogenesis
    status: evaluated
    source_refs: [shyer2013, hannezo2011, tallinen2013, walton2012, shyer2015, walton2016, donnell1933, timoshenko1970]
    supersedes_audit_id: 2026-10-19-epithelial-buckling-crypt-villus-audit-v2
    claim_boundary:
      reported_in_source:
        - "Shyer et al. (2013): sequential differentiation of circumferential, longitudinal and second circumferential smooth-muscle layers compresses the chick gut mucosa into longitudinal ridges (E8-E10), herringbone zigzags (E13-E14) and a hexagonal array of villi (E16); FK506 muscle inhibition and surgical slitting arrest the cascade at the preceding regime; the wavelength scales as a quartic length (B_e/K_s)^(1/4) across chick, quail and mouse"
        - "Hannezo, Prost & Joanny (2011): buckling of a monolayered epithelium on an elastic stroma with wavenumber q_* = (K_s/B_e)^(1/4) and an apicobasal cubic term that selects finger-like protrusions over invaginations"
        - "Walton et al. (2012, 2016) and Shyer et al. (2015): Hh-responsive mesenchymal clusters localise under the epithelium at the tips of emerging villi (mouse) and at the high-curvature elbows of zigzags (chick), with BMP signalling from the clusters"
        - "Timoshenko & Goodier (1970) §28 and Donnell (1933): the Lamé thick-walled cylinder displacement u = A r + B/r and the shell curvature parameter that controls when a flat-plate (FvK) reduction of a thin cylindrical shell is valid"
      reconstructed_in_script:
        - "Mucosal bending rigidity B_e, Winkler foundation K_s, quartic length ell_* and a 4-regime classifier; a 64^2 pseudo-spectral FvK free energy minimised by L-BFGS-B (65 iterations) then blended with a prescribed cosine; a 48-element axisymmetric plane-strain ring FEM of the mesenchymal annulus with rigid outer (smooth-muscle) wall giving K_tube, slab limit, curvature factor and optional neo-Hookean prestrain tangent; integer mode quantisation n = round(2 pi R / lambda) and the Donnell ratio per stage; an OLS-through-origin tube prefactor c_tube = 0.5513; a curvature-driven Shh field, percentile-thresholded cluster indicator, localized cubic gain and a linear spectral Newton response with a 30% trust region; a 12-point 3-species wavelength collapse; 5 FK506/surgical controls; DoG + Delaunay segmentation of the vendored specimen; 17 reference-anchored measurements"
      transfer_boundary:
        - "The tubular coupling is a 1D-radial axisymmetric FEM feeding a scalar K_eff into the 2D flat FvK sheet, not a 3D non-axisymmetric tubular neo-Hookean solid; the Donnell ratio itself says the flat reduction is only well justified from E13 on (gamma 0.65 at E8)"
        - "Stage amplitudes, zigzag angles and |Psi_6| are prescribed from the observed values (or literals) rather than emerging from the minimiser, so the amplitude, theta and |Psi_6| 'measurements' are templated; the reported lambda_sim is 0.85 lambda_* + 0.15 lambda_fft"
        - "The stage-resolved E_e, E_s, H_s, epsilon_x, epsilon_y, alpha_3 in epithelial_buckling_crypt_villus_reference.json were fitted so that the flat model with C_LAMBDA_PREFACTOR = 0.5690 reproduces lambda_obs; the r = 0.9996 collapse inherits that fit"
        - "The Shh field is curvature-driven (no Ptch1/Gli reaction-diffusion); elbow curvature is proxied by crest-contour turning curvature because the prescribed developable surface has no preferential elbow dome curvature; cluster-enrichment references are qualitative (null = 1.0)"
        - "The SHA-pinned specimen is a CC0 terminal-ileum H&E cross-section of unknown species and age, compared with chick E16 hexagonal order without a pixel scale"
      does_not_claim:
        - "A full 3D tubular neo-Hookean finite-element solution, emergent (unprescribed) stage amplitudes or zigzag angles, a reaction-diffusion Shh/BMP/Ptch1 network, finite smooth-muscle sheath stiffness, species-matched specimen histology, or empirically measured stage-resolved mesenchymal moduli"
    summary: >-
      Pass 3 (v3) re-score of `2013-shyer-intestinal-villi-buckling.py` (overall 87.8/100, down from 93.1 in
      v2). The single v2 remediation item is closed in a reduced, clearly labelled form: the flat Winkler bed is
      replaced by a Lamé-verified axisymmetric neo-Hookean ring FEM of the mesenchymal annulus (K_eff, curvature
      factor 0.88-0.93, integer mode quantisation reproducing 10/12/16/19/26 vs 10/12/16/19/25 observed ridges,
      Donnell gamma per stage), and a curvature-driven Shh/BMP mesenchymal-cluster field localises the apicobasal
      cubic gain at zigzag elbows (E14 elbow index 1.42) and villus tips (E16 1.19 clusters per villus) with a 5.9 um
      elbow bulge absent in the `--no-shh-bmp` ablation; three new Lean theorems (6 total, 0 sorrys), 8 new
      measurements (17 total), 4 new self-test checks (12 total), 2 new SHA-pinned dataset files and a new 4-panel
      figure accompany it. The score falls because the current code shows that stage amplitude and zigzag angle are
      prescribed from the observed values (L666-669, L779-782), the surface is blended 85/15 with a prescribed cosine
      (L732), lambda_sim is 85% analytic (L802), |Psi_6| is a literal per regime (L811-815), the reference moduli were
      fitted to lambda_obs, and the specimen is a species-unmatched ileum section — defects v2 did not penalise.
    scores:
      model-fidelity:
        value: 88
        rationale: >-
          The Hannezo-Shyer quartic length, bending rigidity and Winkler stiffness (L202-237), the 4-regime
          classifier (L239-254) and the FvK energy are implemented, and Pass 3 adds a genuinely new mechanical
          layer: a Lamé-verified axisymmetric neo-Hookean ring FEM of the mesenchymal annulus with slab limit,
          curvature factor and prestrain tangent (L261-365), integer circumferential mode quantisation and the
          Donnell validity ratio (L368-419), and a curvature-driven Shh/BMP cluster field with a localized cubic
          gain and linear spectral Newton response (L422-514, L734-793), all with 6 machine-checked Lean theorems.
          Deductions: the v2 item asked for a 3D tubular FEM and the delivered foundation is 1D-radial axisymmetric
          feeding a scalar K_eff into a flat sheet, while the script's own Donnell ratio (gamma = 0.65 at E8) says
          the flat reduction is poorly justified at the ridge stages (-4); the zigzag angle is taken from the
          observed target with an unsourced 0.92 fallback (L666-669) and the relaxed surface is blended 0.85
          prescribed cosine + 0.15 relaxed (L732), so the zigzag geometry is imposed rather than selected (-4);
          the L-BFGS-B minimiser stops on its 65-iteration limit on an ill-conditioned L_op^2 (L722) and the Pass 3
          coupling therefore uses a linearised response rather than re-minimising (-2); the Shh field has no
          reaction-diffusion kinetics and its elbow curvature is a contour-turning proxy, as the docstring admits
          (-2); the ring-FEM outer wall is rigid (infinitely stiff smooth muscle) (-1); credit (+1 net) for the
          ablation flags and the honest statement of every reduction in docstrings.
