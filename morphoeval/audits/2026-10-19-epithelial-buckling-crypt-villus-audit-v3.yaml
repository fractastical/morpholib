# MorphoEval audit — Hannezo, Prost & Joanny (2011) PRL & Shyer et al. (2013) Science Sequential Smooth-Muscle Mucosal Buckling, 2026-10-19 (v3)
#
# Pass 3 re-score of `2013-shyer-intestinal-villi-buckling.py` (1985 lines) and `datasets/epithelial_buckling_crypt_villus/`
# after the remediation of the single open v2 item in the instrumented loop
# `morphoeval/runs/2026-10-19-epithelial-buckling-crypt-villus-loop-pass3`, superseding
# `2026-10-19-epithelial-buckling-crypt-villus-audit-v2` (93.1).
#   - Primary assessor: Claude Fable 5.1 (Phase B audit subagent, slot-063 Pass 3), scoring from the Phase A
#     handoff note, `git diff` of the script and Lean module, and the CURRENT files at commit 45670cb8.
#
# What Pass 3 changed (the one v2 remediation item, closed as a reduced honest version):
#   1. Tubular neo-Hookean foundation: a 48-element axisymmetric plane-strain ring FEM of the mesenchymal annulus
#      R_lumen..R_lumen+H_s (`tubular_neo_hookean_foundation`, L290-365) verified against the Lamé thick-cylinder
#      closed form (rel. err 2.7e-6), its slab limit (2.6e-6) and h-convergence (<1e-4); K_eff = (E_s/H_s) f_curv f_pre
#      rescales ell_*, lambda_*, N_c inside `relax_fvk_mucosal_surface` (L565-586); integer circumferential mode
#      quantisation n = round(2 pi R / lambda) and the Donnell curvature ratio gamma (0.65 at E8 -> 0.07 at E16).
#      Results: 5-stage tube lambda RMSE 1.72 um (flat 1.47 um), quantised ridge counts 10/12/16/19/26 vs obs
#      10/12/16/19/25, curvature factor 0.88-0.93.
#   2. Spatially localized Shh/BMP mesenchymal clusters: Shh = G_sigma * [(-lap w)_+ (1 + zeta lambda |kappa_c|)],
#      soft threshold above the 82nd percentile -> cluster indicator C; localized cubic gain alpha_3(x,y) = alpha_3 +
#      0.60 C; linear (Newton) FvK response solved spectrally (L734-793). Results: E14 elbow-localization index 1.42,
#      E16 1.19 clusters per villus (83% of cluster mass on tips), E14 elbow bulge 5.9 um vs 0 in the ablation.
#   3. Lean module extended from 3 to 6 theorems (0 sorrys): `tubular_mode_quantization`,
#      `shh_bmp_elbow_localization`, `shh_bmp_elbow_villus_nucleation`; math-KG Laws 4 and 5 registered.
#   4. `measure_morphoeval()` 9 -> 17 measurements; `self_test()` 8 -> 12 checks (2.1 s); CLI `--no-tubular`,
#      `--no-shh-bmp`, `--neo-hookean-prestrain`; two SHA-256-pinned dataset files added (6 pinned in total);
#      new figure `docs/media/epithelial_buckling_crypt_villus_tubular_shh_bmp.png`.
#
# Why the overall score goes DOWN from 93.1: re-reading the current file against the v2 claims exposed a layer of
# defects that v2 did not penalise and that Pass 3 did not remove: the stage amplitude and zigzag angle are
# prescribed from the observed values (L666-669, L779-782), the relaxed surface is blended 85/15 with a prescribed
# cosine (L732), the reported wavelength is 85% analytic (L802), |Psi_6| for every regime is a literal (L811-815),
# the stage moduli in the reference JSON were fitted so the flat model reproduces lambda_obs, and the SHA-pinned
# specimen is a terminal-ileum section of unknown species. The "E14 theta = 38.5 vs 38.5" and "E16 |Psi_6| = 0.78
# vs 0.78" measurements are therefore templated, not predicted. Pass 3's own additions are honestly reduced
# (axisymmetric, curvature-driven Shh), and are credited as such.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the files at commit 45670cb8 (uncommitted working tree, verified by grep at audit time).

