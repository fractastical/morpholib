    summary: >-
      Pass 1. Schnakenberg kinetics a=0.37, b=0.71, γ=4, R=Dv/Du=80.
      Diffusivities are scaled so argmax σ(k) is 2.380 µm (catalog 2.4 µm = 2.38e-06 m).
      PDE-measured σ(k) vs analytic σ(k): Pearson r=0.99323, RMSE=0.02405 (n=9).
      Saturated radial-FFT wavelength 2.414 µm. Equal-diffusion ablation std ratio 2.5e-6.
      Analytic λ★(s) is monotone on s in {0.67, 0.85, 1, 1.40, 1.85}.
      Chronoseries at 0 Ma, λ ∝ √D: D. miranda 3.236 µm, D. mojavensis 2.380 µm,
      D. novamexicana 1.948 µm. GIF 14 frames, 640×480, CV similarity 87.1
      against the canonical gallery plate. Pattern weight 0.18 chosen from {0.06, 0.10, 0.14, 0.18}.
