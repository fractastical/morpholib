          The script integrates Schnakenberg kinetics and the Turing linearisation,
          and it separates the Murray leading-order k_c from the true argmax of σ(k).
          Absolute Du, Dv are calibrated to the catalog length 2.38e-06 m rather than
          taken from a measured epicuticular diffusivity. Periodic boundaries only.
        evidence:
