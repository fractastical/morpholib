        ASM peristaltic contractions or tracheal intubation drainage (Delta P <= 0 Pa) collapsing terminal bud bifurcation
      - Olver & Strang (1974) chloride-driven fetal lung-liquid secretion with distal > proximal secretory activity;
        Harding et al. (1986) and Harding & Hooper (1996) fetal-sheep upper-airway resistance dominating lung-liquid
        efflux, a closed-glottis tracheal pressure plateau of 1-2 mmHg, and a laryngeal resistance drop during fetal
        breathing-movement episodes; Metzger et al. (2008) orthogonal bifurcation mode of the mouse bronchial tree
      reconstructed_in_script:
      - Coupled 2D spatial microfluidic bronchial tree and Laplace wall stress solver (`simulate_2d_microfluidic_lung_tree`)
        plus 8-point Delta P in [0, 400] Pa sweep (`evaluate_transmural_pressure_sweep`), reproducing the vendored
        48h terminal bud counts (Pearson r = 0.99997), branching rate Gamma_branch and ASM contraction frequency
        f_ASM columns
      - Exact common-mode gauge invariance verification across (P_lumen, P_pleura) = (200, 0), (0, -200), and (500,
        300) Pa (max deviation = 0.0000) for the 2D, 3D and valve solvers, alongside nifedipine Ca2+ channel blockade
        and tracheal drainage negative controls
      - '(Pass 3) 3D bifurcating tree grown inside an analytic ellipsoidal pleural cavity with 90-degree rotating
        bifurcation planes and pleura-contact tip arrest (`simulate_3d_pleural_cavity_lung_tree`), with a cavity-scale
        ablation 0.7-2.0 at 300 Pa (`evaluate_pleural_cavity_ablation`: contact fractions 0.50/0.50/0.25/0.00/0.00)'
      - (Pass 3) Spatially resolved CFTR/NKCC1 chloride secretion j_Cl(g) (geometric proximal-to-distal gradient,
        6x) integrated over segment epithelial area and a Hagen-Poiseuille resistor-network luminal pressure solve
        P_node = P_amn + R_larynx Q_tot + sum_path R_i Q_i (`solve_tree_luminal_pressure`); intra-tree drop 6.0e-6
        of the 200 Pa tracheal Delta P
      - (Pass 3) Laryngeal valve opening/closing cycles C dP/dt = Q - (P - P_amn)/R_larynx(t) integrated exactly
        per step over 48 h with an 11-point open-duty sweep (Spearman rho = -1.0, occlusion/open fold ratio 6.844
        vs 6.728 reference) and the Jensen gap of the Hill branching rate (-0.0226 day^-1 at duty 0.40) (`simulate_laryngeal_valve_cycles`,
        `evaluate_laryngeal_duty_cycle_sweep`)
      - Computer-vision segmentation (`segment_embryonic_lung_specimen`) of the vendored Mus musculus pseudoglandular
        E11-E16.5 embryonic lung specimen (`embryonic_lung_branching_specimen.jpg`, CC BY 3.0) extracting 17 distal
        terminal buds, distal-to-total airway area fraction = 0.6885, and mean distal tip radius = 3.8470 +- 1.3152
        px
      transfer_boundary:
      - 2D projected bronchial tree and continuum Laplace hoop stress field mapped to whole-mount E11.5-E16.5 pseudoglandular
        mouse lung explants in microfluidic chest chambers
      - The pleural cavity is an analytic ellipsoid (CAVITY_SEMI_AXES, CHEST_LENGTH_SCALE_UM = 1.6 mm) and not a
        stereolithographic STL chest mesh; no lobation or left-right asymmetry; generation depth of the 3D tree
        is inherited from the same 0-D Hill N(t) as the 2D solver, so the 3D tip count is a consistency check and
        not an emergent prediction
      - 'The laryngeal valve / fetal-breathing-movement model transfers fetal-sheep in-utero physiology (Harding
        1986/1996) to the explant setting of Nelson et al. (2017), whose cannulated explants have no larynx; the
        closed-glottis plateau (250 Pa), R_open/R_closed (0.25), duty (0.40), period (40 min) and tau_closed (6
        min) are model choices flagged `provenance: model` in `pleural_cavity_valve_reference.json`'
      - CFTR secretion is a prescribed functional form (geometric gradient), not a transcript-map-derived field;
        the laryngeal resistance in the 3D solver is back-solved so that the tracheal inlet pressure equals p_lumen_pa,
        so the tracheal Delta P is a boundary condition and only the intra-tree distribution is emergent
      - The `*_obs` sweep columns of `tracheal_viscous_fingering_reference.json` are not literal digitisations of
        Nelson 2017 figures (no figure/table coordinates or digitisation provenance) and the Hill constants were
        fitted to them, so the Pearson r ~ 0.9999 correlations are largely self-referential
      does_not_claim:
      - Saffman-Taylor viscous fingering or any Hele-Shaw interfacial instability (despite the file name and campaign
        slug, no viscous-fingering mathematics exists in the script); Gallus gallus data (the vendored specimen
        and all vendored references are Mus musculus and fetal sheep)
      - Full 3D Navier-Stokes Stokesian fluid-structure interaction of individual ciliated epithelial cells, single-channel
        CaV1.2 gating kinetics, lobar branching programme sequences, or in-utero FBM pressure traces measured in
        the mouse
