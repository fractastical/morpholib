    claim_boundary:
      reported_in_source:
      - Nelson, Gleghorn, Myers, Radisky & Stone (2017) Development 144:4328-4335 microfluidic chest cavity experiments
        proving that embryonic lung branching rate dN_tips/dt and synchronized airway smooth muscle (ASM) peristaltic
        wave frequency f_ASM depend strictly on the transmural pressure difference Delta P = P_lumen - P_pleura
        and are invariant under common-mode hydrostatic pressure shifts (P_lumen + P_0, P_pleura + P_0)
      - Laplace-Young circumferential epithelial wall stress sigma_theta = Delta P * R / h driving mechanosensitive
        FGF10/ERK1/2/Etv4 distal tip proliferation and bifurcation above critical threshold Delta P_c approx 50
        Pa (Unbekandt et al. 2008 Mech. Dev. 125:314-324; Nelson et al. 2017)
