    claim_boundary:
      reported_in_source:
      - 'Thompson 1917 p. 652: eggs are simple solids of revolution; forms range from spherical (owl, penguin, tortoise)
        through ellipsoidal (grebe, cormorant, pelican) and ovoid (hen) to blunt-pointed conical (guillemot, puffin,
        sandpiper, plover, curlew); prolate never oblate.'
      - 'Thompson 1917 p. 654 footnote: Steiner''s Cartesian oval r + m r'' = c ''fails in such a case as the guillemot''.'
      - 'Thompson 1917 p. 655 (5): the most unsymmetrical / tapered eggs are large relative to the parent bird (apteryx
        the exception, p. 656).'
      - 'Thompson 1917 pp. 657-659: cone-ended-cylinder balance p cos^2(theta) = p'' cos^2(theta''); envelope equation
        p_n + T(1/r + 1/r'') = P; spherical egg <=> uniform p_n.'
      reconstructed_in_script:
      - Preston (1953) four-parameter meridian family with Biggins et al. (2018) indices, closed-form polar asymmetry
        R_pole = p(+/-1)^2 and exact volume functional (Lean Laws 1-2).
      - 'Thompson closure: pole / equator curvature constraints + equator position determine the Preston coefficients;
        mean-curvature (excess pressure) profile of every egg; pressure-asymmetry path sphere -> ellipsoid -> conical.'
      - Computer-vision segmentation and Preston weighted least squares (Biggins Analysis.R estimator) on 12 eggs
        in 5 photographs; axisymmetry residual; Cartesian-oval and ellipsoid controls.
      - eta^2 / Kruskal-Wallis across 30 species and 15 orders, KS test, RMSE / breadth, Spearman asymmetry vs relative
        egg mass.
      transfer_boundary:
      - The Preston family is a 1953 descriptor adopted as the quantitative reading of Thompson's 'definite family';
        Thompson gave no algebraic family.
      - Biggins et al. (2018) eggs are auks and penguins (plus a 10-egg range set); order-level breadth comes only
        from Deeming's outline PCs; museum photographs are oblique-lit and bound the axisymmetry test from above.
      - The Thompson closure is a kinematic reading of his equilibrium equation (curvature <-> excess pressure),
        not a dynamic oviduct simulation; friction and tangential forces he mentions are not modelled.
      does_not_claim:
      - That oviduct pressure is demonstrated to be the cause of the family; only the geometric claim and the internal
        consistency of Thompson's equation are tested.
      - Anything about eggshell microstructure, colour, or non-avian hard-shelled eggs beyond Thompson's mention.
