    claim_boundary:
      reported_in_source:
      - 'Thompson (1917, pp. 443-449) argues, after Dreyer (1892) and Plateau (1873), that calcareous spicule rays
        follow the junction lines of 3 or 4 contiguous cells: 120 deg when tensions are equal, ''two equal angles
        and one unequal'' when not, tetrahedral ~109 deg for four cells; the spicule is ''a crystal under restraint''.'
      - Thompson gives drawings (Fig. 214, after Haeckel) and no measured angle table.
      reconstructed_in_script:
      - Neumann law of cosines in integer-exact form (E3), sagittal one-parameter family (E5) and its inverse, tetrahedral/orthogonal
        constants, radial-arc ray-angle extraction on one CC BY SEM plate of Grantia aff. indica (8 three-ray spicules,
        3 monaxons), per-spicule rho fit, side-by-side renders, layered growth animation.
      transfer_boundary:
      - One plate, one individual, one genus; 2D projection of trihedral spicules; tetractine apical ray not measurable
        (P3 untestable here); no alcyonarian spicules at all although the claim text names them.
      does_not_claim:
      - 'Does NOT claim the mechanism (passive deposition between arbitrary neighbouring cells) is correct: Ledger
        & Jones (1977) and Voigt et al. (2017) show a dedicated sclerocyte sextet; only the geometric content (ray
        axes obey a tension-triangle force balance of the secreting cell group) is tested.'
      - 'Does NOT claim a verdict in Pass 1: the paired-difference statistic has no null distribution yet (R2).'
      - 'Does NOT use the pre-assigned Dryad dataset (hexactine fossil tomograms, 5.8 GB): recorded as DATASET_MISMATCH,
        metadata pinned.'
