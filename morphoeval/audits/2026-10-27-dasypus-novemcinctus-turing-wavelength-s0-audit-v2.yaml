# MorphoEval audit — Pass 2 — Dasypus novemcinctus Turing wavelength, 4.108 µm, slot 3166.
# Closes the Pass 1 gaps for sweep, ablation, specimen segmentation, and goodness-of-fit.
# Single assessor. Scores are not inflated to hide the 0.52 µm wavelength offset or the band-count miss.
audit:
  id: 2026-10-27-dasypus-novemcinctus-turing-wavelength-s0-audit-v2
  supersedes_audit_id: 2026-10-27-dasypus-novemcinctus-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (single builder-assessor; second provider still open as R5)"
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 0c76d15d
    environment:
      python: "3.12.3"
      numpy: "2.5.4"
      scipy: "1.18.1"
      matplotlib: "3.11.2"
      Pillow: "13.0.0"
    note: "Pass 2. Diffusion-scale sweep, equal-diffusion ablation, specimen segmentation, Pearson/RMSE/KS/CV."
references:
  chen2011:
    title: "Armadillo armor: Mechanical testing and micro-structural evaluation"
    authors: "Chen IH, Kiang JH, Correa V, Lopez MI, Chen P-Y, McKittrick J, Meyers MA"
    venue: "Journal of the Mechanical Behavior of Biomedical Materials 4(5):713-722 (2011)"
    doi: 10.1016/j.jmbbm.2010.12.013
  vickaryous2006:
    title: "Osteoderm morphology and development in the nine-banded armadillo, Dasypus novemcinctus"
    authors: "Vickaryous MK, Hall BK"
    venue: "Journal of Morphology 267(11):1273-1286 (2006)"
    doi: 10.1002/jmor.10475
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing AM"
    venue: "Phil. Trans. R. Soc. B 237:37-72 (1952)"
    doi: 10.1098/rstb.1952.0012
  schnakenberg1979:
    title: "Simple chemical reaction systems with limit cycle behaviour"
    authors: "Schnakenberg J"
    venue: "Journal of Theoretical Biology 81:389-400 (1979)"
    doi: 10.1016/0022-5193(79)90042-0
  murray1981:
    title: "A pre-pattern formation mechanism for animal coat markings"
    authors: "Murray JD"
    venue: "Journal of Theoretical Biology 88:161-199 (1981)"
    doi: 10.1016/0022-5193(81)90334-9
simulations:
  - id: delphi10000-dasypus-novemcinctus-turing-wavelength-s0
    name: "Schnakenberg Turing wavelength at 4.108 µm on Holocene Dasypus novemcinctus dermis (Pass 2)"
    organism: "Dasypus novemcinctus (nine-banded armadillo)"
    script: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py
    output: docs/media/dasypus_novemcinctus_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/dasypus_novemcinctus_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs: [chen2011, vickaryous2006, turing1952, schnakenberg1979, murray1981]
    claim_boundary:
      reported_in_source:
        - "Vickaryous and Hall (2006) describe the banded shield and hexagonal osteoderm rosettes of Dasypus novemcinctus."
        - "Turing (1952) gives k_c from the dispersion relation; Schnakenberg (1979) gives the two-species kinetics."
      reconstructed_in_script:
        - "a=0.10, b=0.90, D_v/D_u=20, D_u solved so linear λ_c=4.108 µm. Sweep scales both diffusivities by 0.64 to 1.69."
        - "Pearson r=0.999999 between measured and analytic wavelengths, RMSE=0.524 µm, replicate CV=0.029, ablation amplitude ratio about 5.1e4."
        - "Photograph segmentation: foreground fraction 0.350, circularity 0.144, coherency 0.411, Sobel band count 12 against the nominal 9, shoulder spacing 72 px."
      transfer_boundary:
        - "4.108 µm is the assigned detail rung at 0 Ma, not a length reported by Chen or Vickaryous. The photograph is the whole animal."
        - "The GIF reuses the photograph's mid-frequency edges so the computer-vision comparison is not an independent drawing."
      does_not_claim:
        - "That osteoderm rosettes are generated by a 4.1 µm Turing instability."
        - "That the Sobel peak count of 12 is a manual census of the nine movable bands."
        - "That RMSE of 0.52 µm has been removed; the correlation is high because the error is a nearly constant factor of 1.12."
    summary: >-
      Pass 2 overall 86.8/100, superseding the Pass 1 audit at 77.2. The diffusion-scale
      sweep tracks the analytic wavelength with Pearson r = 0.999999 and RMSE = 0.524 µm.
      Equal diffusivities collapse the activator. The specimen mask is non-circular
      (circularity 0.144 versus 1) and the dorsal Sobel counter returns 12 peaks versus
      the nominal nine bands. Chronoseries length is 1 at 0 Ma; 66 detail wavelengths
      fit in the 273 µm primordium interval. No second assessor.
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          The script integrates Schnakenberg kinetics with the Turing wavenumber identity
          and an equal-diffusion ablation that removes the pattern. Parameters are still
          reconstructed for the 4.108 µm rung rather than fitted to a Dasypus reaction-diffusion experiment.
        evidence:
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [79, 126], note: "Jacobian, diffusivities, and growth rate", supports: true}
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [128, 167], note: "Periodic Fourier-split integrator", supports: true}
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [342, 348], note: "Equal-diffusion negative control", supports: true}
          - {file: morphoeval/lean/loops/Loop_3166_dasypus_novemcinctus_turing_wavelength_s0.lean, lines: [20, 54], note: "Seven decide theorems, zero sorry", supports: true}
      specimen-match:
        value: 80
        rationale: >-
          The comparison figure shows the La Fortuna photograph, the activator, an overlay,
          and the sweep. The animation is 12 frames at 640×480. The render keeps the
          photograph's mid-frequency edges, and the photo is not a 4.1 µm micrograph, so
          this is not a pixel-level histological match.
        evidence:
          - {file: docs/media/dasypus_novemcinctus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Specimen, activator, overlay, and sweep scatter", supports: true}
          - {file: docs/media/dasypus_novemcinctus_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640x480", supports: true}
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [386, 448], note: "Warm-tone foreground, circularity, coherency, band peaks, tile spacing", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          Six diffusion scales from 0.64 to 1.69 move the measured wavelength monotonically
          with the analytic square-root law. The equal-diffusion control is the off state.
        evidence:
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [312, 340], note: "Scale both diffusivities; record predicted and measured wavelength", supports: true}
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [265, 310], note: "Comparison figure includes the sweep scatter against the 1:1 line", supports: true}
      morphometric-validation:
        value: 86
        rationale: >-
          Pearson r = 0.999999 and RMSE = 0.524 µm on the sweep. Replicate CV = 0.029.
          KS statistic between measured and analytic samples is 0.333 with p = 0.93 at n = 6,
          so the offset is visible but not a significant two-sample rejection. Specimen
          circularity 0.144 versus 1, band count 12 versus 9, spacing 72 px versus 0.
          The band counter is a Sobel heuristic, not a histological count.
        evidence:
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [360, 384], note: "Pearson, RMSE, KS, and replicate CV", supports: true}
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [494, 605], note: "measure_morphoeval returns values that differ from their references", supports: true}
      source-traceability:
        value: 92
        rationale: >-
          Real DOIs for Chen, Vickaryous, Turing, Schnakenberg, and Murray. Specimen
          SHA-256, creator Rhododendrites, CC BY-SA 4.0, La Fortuna, 2024-12-11.
        evidence:
          - {file: datasets/dasypus_novemcinctus_turing_wavelength_s0/paper_citations.bib, lines: [1, 75], note: "BibTeX with verified DOIs", supports: true}
          - {file: datasets/dasypus_novemcinctus_turing_wavelength_s0/dasypus_novemcinctus_turing_wavelength_s0_reference.json, lines: [1, 71], note: "4.108e-06 m, 0 Ma, specimen digest", supports: true}
          - {file: datasets/dasypus_novemcinctus_turing_wavelength_s0/scout_manifest.json, lines: [1, 40], note: "Slot 3166 scout, collision flag false, Wikimedia candidates", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          Equations 1-3 are commented on the coefficient function. The sweep, ablation,
          and fit functions name the Pass 1 remediation they close. Lean checks the
          integer packing of 66 and the discriminant.
        evidence:
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [79, 116], note: "Eqs. 1-3", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-dasypus-novemcinctus-turing-wavelength-s0.yaml, lines: [12, 55], note: "Three laws and model_spec inputs", supports: true}
      repro-package:
        value: 90
        rationale: >-
          Seed 3166, four replicate seeds, pinned specimen digest, and --self-test
          requiring Pearson r > 0.98, a collapsed ablation, packing 66, and a 12-frame
          GIF of at least 480 px. Dependencies are the repo scientific stack.
        evidence:
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [607, 651], note: "--self-test gates on dispersion identity, Pearson r, ablation ratio, and GIF size", supports: true}
    remediation:
      - id: R5
        item: "Independent second assessor. Both passes are single-assessor (Grok 4.7)."
        status: open
      - id: R7
        item: "Dorsal Sobel band count is 12 against the nominal nine movable bands. The counter is not a manual shield census."
        status: open
      - id: R8
        item: "Saturated wavelength remains about 1.12 times the linear 4.108 µm (RMSE 0.524 µm) even though the sweep correlation is above 0.98."
        status: open
      - id: R9
        item: "No 4.1 µm histological micrograph of Dasypus dermis is in the dataset. The specimen is an organism-scale photograph."
        status: open
