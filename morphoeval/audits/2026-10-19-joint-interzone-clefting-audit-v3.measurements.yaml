    claim_boundary:
      reported_in_source:
      - 'Kavanagh et al. (2013): phalanx lengths of triphalangeal digits across tetrapods fall on the inhibitory-cascade
        line P2/P1 = 1/2 + 1/2 (P3/P1), i.e. P2 is 1/3 of the phalangeal total'
      - 'Hiscock et al. (2017), Hartmann & Tabin (2001): periodic Gdf5+/Wnt9a+ interzones segment a chondrogenic
        digit ray; Brunet et al. (1998): Nog-/- embryos form no joints; Storm et al. (1994): Gdf5 bp/bp fuses interphalangeal
        joints'
      - 'Drachman & Sokoloff (1966), Kahn et al. (2009): paralysed or muscle-less embryos specify interzones but
        fail to cavitate and the interzone re-chondrifies; Roddy et al. (2011): immobilised rudiments lose articular
        curvature'
      - 'Edwards et al. (1994), Dowthwaite et al. (1998): cavitation coincides with mechanosensitive hyaluronan
        accumulation and loss of interzone cohesion; Mow et al. (1980), Maroudas (1976): cartilage is a biphasic
        poroelastic solid whose Donnan swelling pressure is ~0.1-0.25 MPa'
      reconstructed_in_script:
      - GDF5-Noggin 2x2 Turing dispersion with D=0 control; 1D growing-domain RD PDE with a distal PFR mask; 2D
        digit-ray view; Kavanagh 12-taxon morphospace regression; six genetic/signalling perturbations; radiograph
        segmentation of Digits II-IV
      - 'Pass 3: reduced 2D Biot storage-equation cavitation solver (HA synthesis -> osmotic pore pressure with
        free drainage -> cohesion threshold -> irreversible cavity phase field), three literature cavitation conditions,
        muscle-loading and permeability sweeps, Carter-Wong articular arch, Kahn Sox9 reversion, and the radiograph
        joint-line sagitta/chord comparison'
      transfer_boundary:
      - 'The 1D RD PDE does not self-organise its joint positions: `joint_targets` are pre-computed from the arithmetic
        progression and injected as a Gaussian source behind the PFR, and the bp/bp PIP fusion is hard-coded (L334-349,
        L364-373); the Turing dispersion is verified analytically, not as the pattern-selecting mechanism of the
        PDE'
      - The poroelastic solver has a rigid solid skeleton (no u-p Biot displacement, effective stress, capsule or
        ligament), is 2D, one-way coupled (RD -> poroelastic), and its articular arch is a parametric Carter-Wong
        rule a(y) = A_arc phi(m)(1 - (y/W)^2), not a computed growth response; all constants are dimensionless and
        scaled only to adult cartilage
      - The vendored specimen is a juvenile hand radiograph with open physes, not an embryonic interzone section;
        the joint-line arch statistic rests on 4 valid joints with sd > mean
      does_not_claim:
      - A full Biot u-p or triphasic solution, 3D geometry, synovial fluid flow, capsule/ligament mechanics, convex-head
        emergence from growth (the model's head contour is flat because the lens cancels the arch), or any dimensional
        embryonic poroelastic constant
