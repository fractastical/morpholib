simulations:
  - id: delphi10000-gekko-gecko-turing-wavelength-s0
    name: "Gekko gecko Turing wavenumber at 242 µm (Holocene, Pass 1)"
    organism: "Gekko gecko (Tokay gecko)"
    script: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py
    output: docs/media/gekko_gecko_turing_wavelength_s0_growth.gif
    also:
      - docs/media/gekko_gecko_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, murray1981, manukyan2017, fofonjka2021, saenko2013, dupont2005]
    summary: >-
      Pass 1 implements Schnakenberg kinetics whose fastest linear mode is calibrated
      to 242 µm on an 8×6-wavelength primordium (Holocene, 0 Ma). The dorsum crop of
      Dupont's CC BY-SA photograph is the pattern-class specimen. The sweep, ablation,
      and specimen segmentation exist in the script but are not yet the scored
      measurement sidecar; that closure is the Pass 2 remediation.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation for a two-species reaction-diffusion system."
        - "Murray 1981 use of that wavelength as a coat pre-pattern."
        - "Manukyan 2017 and Fofonjka 2021: reptile skin can carry a mesoscopic reaction-diffusion pattern (Timon, not Gekko)."
        - "Saenko 2013: gekkotan color colocalizes structural and pigment cells (Phelsuma, not Gekko)."
      reconstructed_in_script:
        - "Schnakenberg field with (a, b) = (0.137, 0.863) and diffusion ratio 1.35 times critical, calibrated so k_c = argmax sigma(k) gives 242 µm."
        - "Periodic 1936 µm × 1452 µm patch, seed 3235, 12-frame growth GIF."
      transfer_boundary:
        - "242 µm is the slot's primordium detail scale, not a published caliper measurement on Gekko gecko."
        - "The Dupont photograph has no scale bar; it constrains pattern class only."
      does_not_claim:
        - "That adult Tokay ocelli are 242 µm apart."
        - "That Tokay chromatophores implement the Timon scale automaton."
        - "That setal adhesion spacing is this pigment wavelength."
    scores:
      model-fidelity:
        value: 86
        rationale: "The dispersion relation and argmax definition of k_c are implemented and calibrated to 242.000 µm. Kinetics are a Schnakenberg skeleton, not a chromatophore cell model."
        evidence:
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [119, 185], note: "growth_rates, k_selected, diffusion-ratio threshold, diffusivity calibration", supports: true}
      specimen-match:
        value: 78
        rationale: "Side-by-side, both are fields of orange spots on a pale ground. The photograph also shows granular scales and a turquoise edge the reaction-diffusion field does not."
        evidence:
          - {file: docs/media/gekko_gecko_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Pass 1 four-panel comparison", supports: true}
          - {file: datasets/gekko_gecko_turing_wavelength_s0/Gekko_gecko_dorsum_cc-by-sa.jpg, lines: [0, 0], note: "Dupont dorsum crop", supports: true}
      parameter-expressivity:
        value: 70
        rationale: "Diffusivity scale is coded to move lambda as sqrt(s), but Pass 1 does not yet close that sweep as a measured Pearson/RMSE sidecar."
        evidence:
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [261, 297], note: "diffusivity_sweep present, not yet the scored sidecar", supports: true}
      morphometric-validation:
        value: 68
        rationale: "Self-test locks the linear wavelength at 242 µm. Specimen blob spacing, coherency, KS, and the nonlinear ring centroid are not yet in the measurement sidecar."
        evidence:
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [242, 259], note: "ring-centroid wavelength in micrometres", supports: true}
      source-traceability:
        value: 90
        rationale: "Crossref-checked DOIs for Turing, Murray, Manukyan, Fofonjka, and Saenko. Specimen is SHA-256 pinned with author, license, and Commons URL."
        evidence:
          - {file: datasets/gekko_gecko_turing_wavelength_s0/paper_citations.bib, lines: [1, 48], note: "DOI entries", supports: true}
          - {file: datasets/gekko_gecko_turing_wavelength_s0/gekko_gecko_turing_wavelength_s0_reference.json, lines: [1, 40], note: "scale 242 µm and age 0 Ma", supports: true}
      code-traceability:
        value: 84
        rationale: "Module docstring and growth_rates map onto the Turing dispersion. Murray's section numbers are not pinned; the onset shortcut is a separate function."
        evidence:
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [1, 40], note: "equation block and claim boundary in the docstring", supports: true}
      repro-package:
        value: 86
        rationale: "Seed 3235, --self-test, and pinned (a, b, ratio margin). Pass 1 self-test passes. Nanopub signing is unavailable on this VM."
        evidence:
          - {file: models/2026-delphi10000-gekko-gecko-turing-wavelength-s0.py, lines: [717, 760], note: "self_test checks", supports: true}
    remediation:
      - "R1: Put the six-point diffusivity sweep (Pearson r, RMSE) into the measurement sidecar."
      - "R2: Record the equal-diffusivity ablation and the reaction-off control against the patterned amplitude."
      - "R3: Segment the real dorsum crop (ocellus spacing, structure-tensor coherency) and compare to the render with values that are not copies of each other."
      - "R4: Report a two-sample KS statistic between specimen and simulation luminance."
      - "R5: Independent second assessor was not run."
      - "R6: Do not treat 242 µm as a length measured on the unscaled photograph."
