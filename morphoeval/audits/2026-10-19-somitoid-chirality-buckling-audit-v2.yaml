        rationale: >-
          Faithfully implements the 2D apico-basal differential interfacial tension vertex energy
          functional E = sum_i [0.5*K_A*(A_i - A_0)^2 + gamma_ap*L_{ap,i} + gamma_lat*L_{lat,i} + gamma_bas*L_{bas,i}]
          alongside the exact analytical polygon and continuum equilibrium laws, EphA4/ephrinB2
          inter-somitic cleft sorting energy barrier, and Y-27632 / Minus-Matrigel negative controls
          (L118-375), verified by 3 machine-checked Lean 4 theorems (0 sorrys) in
