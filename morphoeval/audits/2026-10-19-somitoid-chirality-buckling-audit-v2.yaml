simulations:
  - id: yaman-somitoid-chirality-buckling
    name: "Yamanaka et al. (2023), Miao et al. (2023) & Adhyapok et al. (2021) epithelial somite rosette vertex mechanics and mesenchymal-to-epithelial transition (MET) model"
    organism: "Homo sapiens / Mus musculus (in vitro axioloid / somitoid epithelial somite rosettes)"
    script: 2021-yaman-somitoid-chirality-buckling.py
    output: docs/media/somitoid_chirality_buckling_comparison.png
    extra_outputs:
      - docs/media/somitoid_chirality_buckling_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Yamanaka et al. (2023) Nature 614:509-520 & Miao et al. (2023) Nature 614:500-508 discovery that Matrigel ECM embedding and RhoA/ROCK-dependent apical actomyosin constriction drive epithelial somite rosette polarization and central somitecoel lumen formation in human axioloids and somitoids"
        - "Adhyapok et al. (2021) Dev. Cell 56:1312-1324 mechanical vertex/cellular-Potts model demonstrating that combined apical constriction (gamma_ap > gamma_bas) and EphA4/ephrinB2 heterotypic boundary repulsion (gamma_het > gamma_hom) govern somite rounding and inter-somitic cleft separation"
        - "Y-27632 ROCK inhibition or absence of Matrigel ECM abolishes the apico-basal tension differential (gamma_ap -> gamma_bas) and prevents polarized epithelial somite rosette morphogenesis"
      reconstructed_in_script:
        - "2D 32-vertex apico-basal differential interfacial tension relaxation solver for an N=16 wedge-cell somite rosette matching the exact analytical polygon equilibrium ratio (WT L_ap/L_bas = 0.3030 vs 0.3030 analytical and 0.305 empirical)"
        - "6-regime experimental perturbation series (WT +10% Matrigel, Calpeptin hyper-constriction, Low 2.5% Matrigel, EphA4/ephrinB2 knockdown, Y-27632 ROCK inhibition, and Minus-Matrigel control; Pearson r = 0.9989, RMSE = 0.0086)"
        - "EphA4/ephrinB2 inter-somitic cleft sorting energy barrier (Delta_E_cleft = 75.60 pN, S_cleft = 0.8189 in WT vs 0.0930 in Eph/ephrin KD), 2D phase diagram over (gamma_ap/gamma_lat, Matrigel %), and bilateral somite rosette segmentation on somitoid_rosette_specimen.jpg (45.38 px mean spacing, CV = 0.2010)"
      transfer_boundary:
        - "2D cross-sectional vertex mechanics of an N-cell epithelial somite rosette and Young-Dupre inter-somitic cleft balance compared with dorsal vertebrate somite SEM metameric periodicity"
      does_not_claim:
        - "Full 3D sclerotome/dermomyotome lineage regionalization following late somite maturation"
    source_refs:
      - yamanaka2023
      - miao2023
      - adhyapok2021
      - sanaki2022
    summary: >-
      Pass 2 post-remediation evaluation of `2021-yaman-somitoid-chirality-buckling.py` (91.9/100,
      up from 60.1/100 in Pass 1; +31.8 overall). The remediated script implements a 2D 32-vertex
      apico-basal differential interfacial tension L-BFGS-B relaxation solver for an N=16 wedge-cell
      somite rosette, reproducing exact agreement with the analytical polygon equilibrium ratio
      (WT L_ap/L_bas = 0.3030 vs 0.3030 analytical and 0.305 empirical), Y-27632 ROCK-inhibited
      lumen dilation (L_ap/L_bas = 0.7013, R_in* = 19.65 um vs 7.72 um in WT), and Minus-Matrigel
      depolarization (0.5562), evaluating all 6 experimental regimes from Yamanaka et al. (2023),
      Miao et al. (2023), and Adhyapok et al. (2021) (Pearson r = 0.9989, RMSE = 0.0086),
      quantifying EphA4/ephrinB2 inter-somitic cleft separation (S_cleft = 0.8189 vs 0.0930 in
      Eph/ephrin KD), mapping the 2D phase diagram over apical tension and Matrigel concentration,
      and segmenting bilateral somite rosettes on `somitoid_rosette_specimen.jpg` (45.38 px spacing,
      CV = 0.2010, dome/cleft contrast = 1.189x), backed by 3 machine-checked Lean 4 theorems in
      `Loop_029_somitoid_chirality_buckling.lean`.
