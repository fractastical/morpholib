    claim_boundary:
      reported_in_source:
      - 'Thompson 1917 p. 652: eggs are simple solids of revolution; forms range from spherical (owl, penguin, tortoise)
        through ellipsoidal (grebe, cormorant, pelican) and ovoid (hen) to blunt-pointed conical (guillemot, puffin,
        sandpiper, plover, curlew); prolate never oblate.'
      - 'Thompson 1917 p. 655 (5): the most unsymmetrical / tapered eggs are large relative to the parent bird.'
      - 'Thompson 1917 p. 658: envelope equation p_n + T(1/r + 1/r'') = P.'
      reconstructed_in_script:
      - Preston (1953) four-parameter meridian family y = (c0 + c1 x + c2 x^2 + c3 x^3) sqrt(1 - x^2) with Biggins
        et al. (2018) indices and a closed-form polar asymmetry R_pole = p(+/-1)^2.
      - Closed-form volume of the solid of revolution 315 V / (4 pi (L/2)^3) = 105 c0^2 + 21 (c1^2 + 2 c0 c2) +
        9 (c2^2 + 2 c1 c3) + 5 c3^2.
      - Species-mean elongation table (30 species), 1389-egg morphospace, Deeming PC2 vs relative egg mass Spearman
        test.
      transfer_boundary:
      - The Preston family is a 1953 descriptor adopted as the quantitative reading of Thompson's 'definite family';
        Thompson himself gave no algebraic family (he rejected Steiner's Cartesian oval).
      - Biggins et al. (2018) eggs are auks and penguins (plus a 10-egg range set); order-level breadth comes only
        from Deeming's PCs.
      does_not_claim:
      - That the oviduct pressure mechanism (Thompson pp. 654-660) is the cause of the family; only the geometric
        claim is tested.
      - Anything about eggshell microstructure, colour, or non-avian hard-shelled eggs beyond Thompson's mention.
