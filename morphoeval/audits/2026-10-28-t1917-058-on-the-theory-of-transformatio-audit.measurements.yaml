    claim_boundary:
      reported_in_source:
      - 'Thompson (1917) pp. 770-773: the human skull drawn in a 5x4 Cartesian net (Fig. 404) and the chimpanzee,
        baboon and dog skulls drawn in deformed nets (Figs. 405-408); prose statements that the deformation is one
        ''harmonious and congruent transformation'', that cell areas increase ''in approximately logarithmic order''
        from above downwards and behind forwards, that the baboon differs ''only in an increased intensity'', that
        the chimpanzee is ''much nearer the human type than the baboon'', and that the dog''s net ''tapers away
        in front'' on ''different lines''.'
      reconstructed_in_script:
      - The Fig. 405 net digitised (skeleton junctions + 4 manual corners), reconstructed as a thin-plate spline
        T in human grid units (E1-E3); cell-area log-linear regression (E4); 11 homologous landmarks digitised by
        the loop agent on Fig. 404, Fig. 406 and four Commons specimens; full-Procrustes explained fraction of T(H)
        toward the real chimpanzee (E6); displacement-field cosines and intensity ratios between real specimens;
        facial index and Camper-type facial angle (E7).
      transfer_boundary:
      - One specimen per taxon (museum photographs for chimpanzee, baboon, dog; a rendered anatomical model for
        the human); the baboon and dog nets of Figs. 407-408 were not digitised, so sub-claims C2/C5 are tested
        on real specimens only, not on Thompson's drawings of them.
      does_not_claim:
      - Nothing about growth, ontogeny or phylogeny; no claim that Thompson's particular curves are the optimal
        smooth map; the 'supported' verdict of v1 carries no confidence interval (remediation R1).
