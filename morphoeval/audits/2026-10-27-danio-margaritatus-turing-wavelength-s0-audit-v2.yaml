    source_refs: [turing1952, nakamasu2009, patterson2014, volkening2018, conway2008, quigley2004, spiewak2018, huang2021]
    summary: >-
      Pass 2. lambda_c = 13.39 µm (1.339e-05 m, log10 = -4.873) at geological
      age 0 Ma. Diffusion-ratio sweep is monotone and equals 13.39 µm at
      delta = 40. Albolineatus sigma_max = -0.0805 /s (stable). Nigrofasciatus
      lambda_c = 17.80 µm (unstable). Dispersion Pearson r = 0.99999995,
      RMSE = 5.53e-4 /s. Flank segmentation: 73 pearls, polygon circularity
      0.708, aspect 1.78, median NN 510.1 µm (bootstrap 95% CI 471–536 µm).
      Nonlinear FFT peak of the cellular field is 17.22 µm and is plotted as
      a separate number. PCA-chord CDF Pearson is 0.977; odd-bin Pearson is
      0.770 and is not claimed to clear 0.98. KS D on median-scaled nearest
      neighbours is 0.207. Reaction-knockout amplitude
      ratio is ~0. GIF is 720×540, 12 frames. CV similarity to the specimen
      is 93.3.
    scores:
      model-fidelity:
        value: 88
        rationale: "The script integrates Schnakenberg kinetics with zero-flux boundaries, solves D_u so the linear law is exactly 1.339e-05 m, and checks that law with a periodic 1D growth series (r = 0.99999995). The nonlinear spot field's FFT peak is 17.22 µm; that shift is reported rather than overwritten. gamma = 1/s remains a chosen time unit, and the three-cell Nakamasu system is not the integrator."
        evidence:
          - {file: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py, lines: [85, 110], note: "D_u solved from k_c; analytic sigma(k)", supports: true}
          - {file: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py, lines: [168, 211], note: "Neumann Schnakenberg integrator and reaction knockout", supports: true}
          - {file: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py, lines: [231, 291], note: "1D PDE versus eigenvalue", supports: true}
      specimen-match:
        value: 84
        rationale: "The CC BY-SA photograph, the blue-flank pearl hull (73 centroids, wood excluded), and the cellular spot field are on one figure. The animation paints the Schnakenberg field inside that hull on a low-pass of the photograph. The hull is a polygon, so fins and the snout outline are not reproduced. CV similarity of the last GIF frame to the photograph is 93.3."
        evidence:
          - {file: docs/media/danio_margaritatus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Specimen, hull with CI, cellular field", supports: true}
          - {file: docs/media/danio_margaritatus_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 720x540 growth GIF", supports: true}
          - {file: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py, lines: [335, 396], note: "Blue-window pearl segmentation and polygon circularity", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "With D_u fixed, lambda_c falls from 14.25 µm at delta = 8 to 13.30 µm at delta = 75 and is 13.39 µm at delta = 40. Albolineatus (delta 1.35) has no unstable band. Nigrofasciatus is a longer unstable wave. Reaction knockout and equal diffusion both collapse the pattern. The self-test refuses a non-monotone sweep."
        evidence:
          - {file: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py, lines: [302, 318], note: "Monotone delta sweep; anchor identity", supports: true}
          - {file: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py, lines: [599, 620], note: "Focal, knockout, and equal-diffusion integrations", supports: true}
      morphometric-validation:
        value: 81
        rationale: "Specimen NN median is 510.1 µm against the elementary reference 13.39 µm (they are not equal). Bootstrap 95% CI is 471–536 µm and a ±10% body-length sweep is stored. Polygon circularity is 0.708, not 1. KS D on median-scaled NN distances is 0.207. Dispersion RMSE is 5.53e-4 /s. The PCA-chord CDF Pearson is 0.977 and the odd-bin holdout is 0.770; the holdout is not rounded up to the dispersion correlation."
        evidence:
          - {file: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py, lines: [406, 463], note: "PCA-chord holdout, bootstrap CI, body-length sensitivity", supports: true}
          - {file: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py, lines: [688, 782], note: "Eight measurements, each value distinct from its reference", supports: true}
          - {file: docs/media/danio_margaritatus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "CI and nonlinear peak are on the figure", supports: true}
