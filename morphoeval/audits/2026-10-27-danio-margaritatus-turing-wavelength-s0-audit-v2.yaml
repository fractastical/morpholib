simulations:
  - id: delphi10000-danio-margaritatus-turing-wavelength-s0
    name: "Schnakenberg Turing wavelength at 13.39 µm in Danio margaritatus (Holocene, 0 Ma)"
    organism: "Danio margaritatus (Celestial Pearl Danio)"
    script: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py
