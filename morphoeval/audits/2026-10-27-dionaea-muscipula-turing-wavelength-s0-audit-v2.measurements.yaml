    claim_boundary:
      reported_in_source:
      - Turing 1952 selects a finite k_c from the dispersion relation of a two-species reaction-diffusion system.
      - Schnakenberg 1979 supplies the kinetics a − u + u²v and b − u²v.
      - 'Murray 1981: the number of wavelengths that fit changes when the domain grows and the intrinsic wavelength
        does not.'
      - Forterre 2005 and Hedrich & Neher 2018 describe the trap lobe. They do not measure a 24 µm pigment wavelength.
      reconstructed_in_script:
      - Du and Dv at ratio 18 so that λ_c = 24 µm exactly.
      - Fourier PDE, pure-mode growth rates, diffusivity sweep, and Dv = Du ablation.
      - Otsu redness segmentation of the Wikimedia specimen and of the GIF last frame.
      transfer_boundary:
      - Marginal cilia and the lobe outline in the GIF are taken from the photograph. The PDE grows the activator
        on a flat patch; it does not grow the cilia.
      - The saturated wavelength is 1.25 times the linear k_c, not equal to it. RMSE of that sweep is 7.47 µm.
      - 24 µm is the assigned cellular-detail scale. Age is 0 Ma. Chronoseries length is 1.
      does_not_claim:
      - A published wet-lab spacing of 24.00 µm for Dionaea digestive glands.
      - That the redness KS of 0.008 validates the PDE against gland positions. It only says the last frame is close
        to the photograph.
      - A second independent assessor.
