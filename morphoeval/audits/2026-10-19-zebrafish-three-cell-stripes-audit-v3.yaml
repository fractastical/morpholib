          - {file: 2009-nakamasu-zebrafish-three-cell-stripes.py, lines: [1472, 1553], note: "8 Pass 2 measurements retained (theory, PDE, ablation, controls, specimen pixels)", supports: true}
          - {file: datasets/zebrafish_three_cell_stripes/iridophore_ontogeny_reference.json, lines: [60, 72], note: "Stage-anchored stripe-count normal table with confidence_note declaring +/- 1 approximate readings", supports: false}
      source-traceability:
        value: 94
        rationale: >-
          All 11 sources carry DOIs in the module docstring, the audit and `paper_citations.bib`
