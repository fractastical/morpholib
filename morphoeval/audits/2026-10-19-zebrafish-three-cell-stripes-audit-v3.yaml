simulations:
  - id: nakamasu-zebrafish-three-cell-stripes
    name: "Nakamasu et al. (2009) 3-variable zebrafish pigment-cell reaction-diffusion network + Volkening-Sandstede iridophore S/L agents on a growing flank, laser-ablation polarity & leopard (cx41.8) spot-to-stripe morphospace"
    organism: "Zebrafish (Danio rerio) melanophore-xanthophore-iridophore flank stripes, juvenile (stage PB) to adult"
    script: 2009-nakamasu-zebrafish-three-cell-stripes.py
    output: docs/media/zebrafish_three_cell_stripes_comparison.png
    extra_outputs:
      - docs/media/zebrafish_three_cell_stripes_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-zebrafish-three-cell-stripes-audit-v2
    source_refs:
      - nakamasu2009
      - yamaguchi2007
      - watanabe2006
      - inaba2012
      - volkening2015
      - volkening2018
      - singh2014
      - frohnhofer2013
      - patterson2013
      - parichy2009
      - crampin1999
    claim_boundary:
      reported_in_source:
        - "Nakamasu et al. (2009): short-range mutual melanophore-xanthophore repulsion plus long-range xanthophore-to-melanophore survival support form a Turing network; xanthophore interstripe ablation kills >45% of flanked melanophores (Fig. 2); regeneration orientation follows intact boundaries (Fig. 3)"
        - "Volkening & Sandstede (2015, 2018): agent-based melanophores/xanthophores on a growing domain add stripes sequentially; iridophores in dense (interstripe) and loose (stripe) forms switch shape according to the local melanophore/xanthophore environment and make stripe formation robust"
        - "Singh et al. (2014), Frohnhöfer et al. (2013), Patterson & Parichy (2013): iridophores appear on the horizontal myoseptum (X0), proliferate as a dense sheet, disperse as loose cells over stripes and re-aggregate at the next interstripes; dense iridophores promote xanthophores and exclude melanophores; iridophore-less shady mutants lack organized stripes"
        - "Parichy et al. (2009): post-embryonic stage anchors PB 7.2, PR 8.6, SP 9.6, J 10.4, J+ 11.0, J++ 13.0 mm SL"
      reconstructed_in_script:
        - "Exact 3x3 Nakamasu Jacobian, Routh-Hurwitz invariants, dispersion curve and a DCT-II IMEX 2D 3-species PDE with saturating synthesis (Sections 2-3); in silico Fig. 2 / Fig. 3 ablations (Section 4); leopard sweep and dual negative controls (Section 5); specimen segmentation (Section 6)"
        - "Section 5b hybrid model: Lagrangian growing-flank PDE with dilution and D/g^2 diffusion, point iridophore agents with S/L state, density-limited proliferation, state-dependent random walk, sigmoidal S<->L switching on u - v, anisotropic (x-coherent) density kernel feeding back on the continuum; ontogeny record of stripe count vs standard length; controls and sweeps"
        - "Lean 4 Theorems 1-6 for the integer kernels of the laws above"
      transfer_boundary:
        - "The hybrid model is a REDUCED version of Volkening & Sandstede: melanophores and xanthophores remain continuum fields (no birth/death agent rules), only iridophores are discrete, and the switching rule is a sigmoid of the continuum difference u - v rather than counts of neighbouring cells"
        - "Growth is isometric and uniform; the standard-length axis is a linear map SL = 7.2 g / 0.4 with no allometry; stripe insertion happens by splitting of stretched stripes rather than by marginal addition, and symmetrically (X1D and X1V together) rather than ventral-first"
        - "The normal-table stripe counts in iridophore_ontogeny_reference.json are approximate readings (+/- 1 stripe) of published descriptions, not digitized data"
        - "Panel B and the Fig. 3 regeneration experiment still use the cos(k_c y) whole-flank template cue"
      does_not_claim:
        - "A reproduction of the Volkening & Sandstede (2015/2018) simulations or their parameter values; quantitative iridophore density, sheet correlation length or S/L switching rates measured in vivo; fin (as opposed to trunk flank) patterning; the 3V stripe of large adults; the Danio species variability of Volkening & Sandstede (2018)"
    summary: >-
      Pass 3 (v3) post-remediation evaluation of `2009-nakamasu-zebrafish-three-cell-stripes.py`
      (overall weighted score: 90.6 / 100, down 1.5 points from 92.1 in Pass 2 because the round
      exposed two defects that the Pass 2 scores had credited). The single Pass 2 remediation item is
      closed: Section 5b couples the Nakamasu (u, v, w) continuum PDE to discrete dense/loose iridophore
      agents (reduced Volkening & Sandstede 2018 rules) on an isometrically growing flank (stage PB,
      SL 7.2 mm -> SL 18 mm) with the Crampin-Gaffney-Maini dilution term; the X0 cue now emerges from
      agents seeded on the myoseptum instead of a whole-flank cos(k_c y) template, stripes are inserted
      sequentially 2 -> 4 (parallel, anisotropy 30.2; 3/3 seeds aligned) with dense iridophores
      colonizing the new X1D/X1V interstripes (100% of S agents in interstripes, 68% of L agents in
      stripes), the iridophore-less control is isotropic (anisotropy 1.01, shady-like) and the static
      adult-size control is less aligned (8.4) than the growing flank; six new reference-backed
      measurements, five new self-test checks and Lean Theorems 4-6 (+2 lemmas, 0 sorrys) back the
      new mathematics. Exposed defects: the v2 wild-type panel and the Fig. 3 regeneration experiment
      are template-cued over the whole flank (their stripe count/orientation is imposed), the v2 CLI
      flags were never wired to the computation, the hybrid insertion is symmetric and late (SL 13.5
      vs ~10.4-11.0 mm) and depends on a calibrated x-coherent iridophore kernel.
    scores:
      model-fidelity:
        value: 89
        rationale: >-
          The Nakamasu core (exact J0, Routh-Hurwitz, dispersion, saturating 3-species PDE, L153-388)
          and the laser-ablation reproductions (L394-492) are unchanged and remain faithful. The
          remediation adds the requested mechanism in recognisable Volkening & Sandstede form: discrete
          iridophores with S/L state, environment-dependent switching, proliferation, dispersal and
          feedback, on a growing domain whose Lagrangian PDE carries the correct -2 (g'/g) u dilution
          and D/g^2 scaling (L778-786). Deductions: the whole-flank cos(k_c y) template that drives
          Panel B and the Fig. 3 regeneration run (L308-309, L468) imposes the 5-stripe count and
          orientation that v2 credited as emergent (-3); the iridophore rules are reduced (sigmoid of
          the continuum u - v instead of neighbour counts; no melanophore/xanthophore agents, no
          long-range iridophore -> melanophore term) (-3); gamma_u/gamma_v/gamma_L, rho_ref, step and
          division rates and the x-coherent kernel are calibration choices without source values, and
          the parallel-insertion outcome depends on that kernel (-3); insertion is by splitting of
          stretched stripes and symmetric, unlike the ventral-first marginal addition in vivo (-2).
        evidence:
          - {file: 2009-nakamasu-zebrafish-three-cell-stripes.py, lines: [153, 388], note: "Exact 3-species Jacobian, Routh-Hurwitz invariants, dispersion curve, DCT-II IMEX 3-cell PDE (unchanged from v2)", supports: true}
          - {file: 2009-nakamasu-zebrafish-three-cell-stripes.py, lines: [636, 898], note: "simulate_hybrid_iridophore_growth: Lagrangian growing-flank PDE with dilution (L780-783), S<->L switching (L802-812), state-dependent motility and density-limited proliferation (L814-832), feedback terms (L785-786)", supports: true}
          - {file: 2009-nakamasu-zebrafish-three-cell-stripes.py, lines: [308, 309], note: "Whole-flank cue_profile = myoseptum_cue * cos(k_c (y - L_y/2)) still templates Panel B; L468 repeats it for the Fig. 3 regeneration run — stripe count/orientation imposed, not emergent", supports: false}
          - {file: morphoeval/lean/loops/Loop_007_zebrafish_three_cell_stripes.lean, lines: [131, 232], note: "Theorems 4-6 (+ mode_in_turing_band_scales, dilution_raises_p1), 0 sorrys, verified with lean 4.35.0", supports: true}
      specimen-match:
        value: 90
        rationale: >-
          Panel I shows an emergent (not templated) adult flank with 4 dark stripes separated by
          3 interstripes whose dense iridophores sit in the light bands — the same 4-stripe count the
          specimen segmentation finds (Panel F, L954-1030) and a plausible rendering of the X0/X1D/X1V
          sheets of Frohnhöfer 2013 / Singh 2014; Panels E-G keep the SHA-256-locked Danio rerio
          photograph, its segmented stripes and the standardized profile comparison. Deductions: no
          juvenile-stage specimen images are vendored, so the 2 -> 4 ontogeny is compared with a
          qualitative normal table rather than with pictures (-5); dense iridophore coverage of X1D/X1V
          is sparse compared with the contiguous sheets seen in vivo, and loose iridophores are few
          (loose fraction 0.02) (-3); the GIF is the model alone with no specimen frame (-2).
        evidence:
          - {file: docs/media/zebrafish_three_cell_stripes_comparison.png, lines: [0, 0], note: "12-panel figure: E specimen with ROIs, F segmented stripes, G profiles vs specimen, I emergent hybrid flank with S/L agents (4 stripes, matching the 4 segmented stripes)", supports: true}
          - {file: 2009-nakamasu-zebrafish-three-cell-stripes.py, lines: [954, 1030], note: "Specimen segmentation: 4 dark stripes, 23.67 px spacing, CV 0.111 (unchanged)", supports: true}
          - {file: 2009-nakamasu-zebrafish-three-cell-stripes.py, lines: [1255, 1271], note: "Panel I draws the final hybrid state with dense/loose agents over the (u, v) colour render", supports: true}
          - {file: docs/media/zebrafish_three_cell_stripes_growth.gif, lines: [0, 0], note: "8-frame growing-flank GIF (SL 7.2 -> 18 mm) with agents and dorsoventral profiles; no juvenile specimen frames", supports: false}
      parameter-expressivity:
        value: 90
        rationale: >-
          The leopard sweep and dual negative controls (L499-562) are retained; Pass 3 adds a
          growth-rate sweep (3 schedules), the iridophore-less, static-domain and no-switch controls
          and a 3-seed robustness check (L901-942), and the CLI is now actually wired: `--variant` runs
          the template PDE and the hybrid model with every kinetic and hybrid flag and prints a JSON
          summary (L1660-1726). Deductions: the v2 CLI parsed its flags but `main()` ignored them, so
          the v2 "exposes full CLI flags" credit was unearned (-3); the growth sweep behaves monotonically
          (faster growth delays the first insertion: SL 16.9 / 13.5 / 13.4 mm for fast / default / slow)
          but is shown only as stripe count vs SL with no rendered flanks along the sweep, and the
          kernel-anisotropy and feedback-strength calibrations are not swept at all (-4); `--variant`
          does not render a figure, so non-default parameter sets cannot be inspected visually (-3).
        evidence:
          - {file: 2009-nakamasu-zebrafish-three-cell-stripes.py, lines: [901, 942], note: "run_hybrid_growth_experiments: WT, no-iridophore, no-switch, static adult, growth sweep (0.4/0.8/1.0), 3-seed alignment fraction", supports: true}
          - {file: 2009-nakamasu-zebrafish-three-cell-stripes.py, lines: [1660, 1726], note: "CLI with kinetic + hybrid flags and --variant JSON summary; flags are now consumed", supports: true}
