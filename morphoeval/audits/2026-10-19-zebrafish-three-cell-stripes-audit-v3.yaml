# MorphoEval audit — Nakamasu et al. (2009) Zebrafish Three-Variable Pigment-Cell Reaction-Diffusion & Stripe Morphogenesis, 2026-10-19 (v3)
#
# Pass 3 post-remediation re-score of `2009-nakamasu-zebrafish-three-cell-stripes.py` (v3, 1726 lines; 13 self-test
# checks) after closing the single open Pass 2 remediation item in the instrumented loop
# `morphoeval/runs/2026-10-19-zebrafish-three-cell-stripes-loop-pass3`, superseding
# `2026-10-19-zebrafish-three-cell-stripes-audit-v2` (92.1).
#
# What Pass 3 changed (the v2 remediation item: "couple the 3-species continuum PDE to discrete agent-based
# iridophore S-to-L shape transitions (Volkening & Sandstede 2015) across growing juvenile-to-adult zebrafish fins"):
#   1. New Section 5b `simulate_hybrid_iridophore_growth()` (L566-898): the continuum (u, v, w) Nakamasu PDE is
#      integrated in Lagrangian coordinates on an isometrically growing flank g(t): 0.40 -> 1 (stage PB, SL 7.2 mm ->
#      SL 18 mm; Parichy et al. 2009) with the Crampin-Gaffney-Maini (1999) dilution term -2 (g'/g) u and D / g^2
#      diffusion, coupled to discrete iridophore agents in dense (S) / loose (L) states seeded on the horizontal
#      myoseptum (Singh et al. 2014) that proliferate, random-walk, switch S -> L in melanophore-dominated and
#      L -> S in xanthophore-dominated tissue (reduced Volkening & Sandstede 2018 rule) and feed back on the
#      continuum (dense: -gamma_u on melanophores, +gamma_v on xanthophores; loose: +gamma_L on melanophores).
#      The emergent agent-derived X0 cue replaces the hand-coded cos(k_c y) template for the headline wild type.
#   2. Validation (L901-942, L1255-1340, L1409-1470): stripe-count ontogeny vs the stage-anchored normal table in
#      the new `datasets/zebrafish_three_cell_stripes/iridophore_ontogeny_reference.json` (2 stripes at SL 9 mm ->
#      4 at SL 18 mm), S/L occupancy of interstripes/stripes, iridophore-less (shady-like) control, static adult-size
#      control, S<->L switching ablation, growth-rate sweep (3 schedules), 3-seed alignment robustness.
#   3. Lean 4 Theorems 4-6 (+2 lemmas) in `Loop_007_zebrafish_three_cell_stripes.lean` (0 sorrys, verified):
#      Turing-band Neumann mode insertion under growth, Routh-Hurwitz persistence under dilution, exclusivity and
#      conservation of the S<->L switching rule; registered in the math KG spec with code loci.
#   4. Dataset v2: +7 BibTeX entries, corrected two garbled paper titles in scout_manifest.json, all pins updated;
#      self-test 8 -> 13 checks; CLI wired (`--variant`, hybrid flags) — the v2 CLI flags were parsed but never used.
#
# Deeper defects exposed by this round (they lower two dimensions relative to v2):
#   * the v2 "wild-type 5 stripes" (Panel B) and the Fig. 3 regeneration experiment (Panel D) are driven by a
#     cos(k_c y) template applied over the WHOLE flank (L308-309, L468), which pre-determines the stripe count and
#     orientation; v3 labels the panel "template-cued" but still uses the template in Sections 3-4;
#   * the hybrid insertion is dorsoventrally symmetric and occurs by splitting of stretched stripes at SL 13.5 mm,
#     later than the in vivo ventral-first addition at ~10.4-11.0 mm, and the parallel-insertion result depends on an
#     x-coherent iridophore kernel (kernel_sigma_x = 1.2) that is biologically motivated but not quantified.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the files in the working tree at commit 3aaa03d (uncommitted Pass 3 edits included).

