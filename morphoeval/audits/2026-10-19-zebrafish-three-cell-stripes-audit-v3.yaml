          - {file: 2009-nakamasu-zebrafish-three-cell-stripes.py, lines: [1273, 1296], note: "Panel J plots only stripe count vs SL per growth schedule; no rendered flanks along the sweep", supports: false}
      morphometric-validation:
        value: 90
        rationale: >-
          `measure_morphoeval()` (L1396-1553) now returns 14 measurements: the 8 Pass 2 ones plus the
          hybrid adult stripe count vs the normal table (4 vs 4-5), SL at first insertion (13.5 mm vs
