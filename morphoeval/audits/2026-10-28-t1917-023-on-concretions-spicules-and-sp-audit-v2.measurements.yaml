    claim_boundary:
      reported_in_source:
      - 'Thompson (1917) pp. 421-422: Harting''s CaCO3 precipitated in albumen forms ''large rounded concretions,
        with a more or less distinct central nucleus, and with a surrounding structure at once radiate and concentric'''
      - 'p. 422: crowded calcospherites ''assume polyhedral, or often regularly hexagonal, outlines''; p. 426: pairs
        look like ''contiguous soap-bubbles'''
      - 'p. 424: with scanty albumin / scanty supply the globules become rough ''by an outgrowth of spinous or digitiform
        projections'''
      - 'p. 427: Liesegang zones ''stand farther and farther apart, in logarithmic ratio, as they recede from the
        centre'', offered as the cause of the concentric striation'
      reconstructed_in_script:
      - 'E3 isotropic distance-transform front from a square nucleus: asphericity ∝ R^-0.97 (control: chessboard
        metric, exponent 0.00, square stays square)'
      - 'E4 equal-rate Voronoi mosaic from hard-core (min separation 0.6 x mean spacing) centres, rendered with
        8-px walls and measured by the same wall-segmentation pipeline as the plate: 6.10 neighbours, area CV 0.30
        (Poisson centres: exact 5.78, area CV 0.56)'
      - 'E5 radial Ostwald-supersaturation precipitation: 2-D b0 sweep 0.05/0.1/0.2/0.4 -> P = 1.290/1.220/1.170/1.130
        (Matalon-Packter sign), 3-D a0 = 100: 7 bands; control without nucleation gap: 1 continuous deposit'
      - 'E6 dielectric-breakdown sweep eta = 0, 0.5, 1, 1.5, 2: solidity 0.79 -> 0.17 (Pearson r = -0.92), mass-radius
        exponent 1.92 -> 1.18'
      - 'Plates: Fig. 196 outer-radius CV 0.0036, border radial-line index +0.57, 82 striae; Fig. 195 radial-line
        index +0.17 around 6 landmarked nuclei vs null +0.01 ± 0.06 (z = 7.1); Fig. 197 72 cells, 6.00 neighbours,
        area CV 0.28, KS p = 0.64 vs same-pipeline Voronoi; Fig. 208 lamella gaps ~24 px with within-ray CV 0.21,
        constant-gap fit beats geometric on 9/9 rays'
      - 'Analogues: Carmel ooid asphericity 0.61 (nucleus) -> 0.29 (outer), 9 lamellae; Ag2CrO4 Liesegang rings
        P = 1.070 (CV 0.016), geometric r = 0.9972 / RMSE 2.37 px vs arithmetic r = 0.9880 / RMSE 4.66 px, gaps
        increase (Spearman 0.91, p = 7e-4)'
      transfer_boundary:
      - 2-D plate sections and 2-D lattice models stand for 3-D spherites; the synthetic spherite texture in the
        GIF is a drawing driven by the 3-D E5 band radii and the Fig. 196 striae count
      - ooids and silver-chromate rings are modern analogues (labelled as such), not Harting's albumen spherites
      does_not_claim:
      - 'a quantitative match between the E5 simulation''s P (1.22) and the specimen''s P (1.07): chemistry and
        geometry differ, KS p < 0.01, reported as such'
      - 'that uniform normal deposition alone explains the ooid: it rounds off faster than E3 predicts (minor-axis
        cortex 88 px vs major-axis 63 px)'
      - crystallographic (calcite / vaterite / aragonite) control of fibre texture
