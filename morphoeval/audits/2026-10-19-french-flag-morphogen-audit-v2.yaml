    summary: >-
      Pass 2 (v2) evaluation of `1969-wolpert-french-flag-morphogen.py` (91.1/100, up
      from 41.2/100 in Pass 1). The remediated implementation integrates the 1D
      Synthesis-Diffusion-Degradation (SDD) PDE `dc/dt = D d^2c/dx^2 - k c` (steady-state
      RMSE = 7.6e-6 vs analytical cosh solution, lambda = 63.2456 um); contrasts Wolpert's
      (1969) linear source-sink diffusion against unscaled SDD (CV = 0.4567) and Ben-Zvi
      & Barkai's (2010) Expansion-Repression dynamic scaling (CV = 0.0000, preserving
      exact 1/3 : 1/3 : 1/3 French-Flag proportions across HH18-HH28 limb growth from
      180 to 660 um); reproduces Tickle, Summerbell & Wolpert's (1975) chick wing ZPA
      graft experiments across 4 regimes (`4-3-2` wild-type, `4-3-2-2-3-4` mirror-image
      duplication, `4-3-2-3` attenuated graft, and `0`-digit ZPA ablation negative
      control); validates boundary positional error `sigma_x = (lambda/T_i)*sigma_c` via
      Monte Carlo ensemble (`r = 0.9990`); and segments the SHA-256-locked 72h HH18-20
      `Gallus gallus` embryo photograph (`r = 0.9963`, RMSE = 0.0219).
