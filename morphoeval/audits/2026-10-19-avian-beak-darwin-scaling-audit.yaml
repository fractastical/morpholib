# MorphoEval audit — Campàs et al. (2010) PNAS & Abzhanov et al. (2004, 2006) Darwin's Finch Beak Scaling & Shear, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2021-alberti-avian-beak-darwin-scaling.py` (226 lines)
# prior to Step 12 remediation in `2026-10-19-avian-beak-darwin-scaling-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.6 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `generate_pure_scaled_beak_profile` (L39-53) models only 2D diagonal scaling (s_L, s_D)
#      for the 6 Group A Geospiza species and omits the full 3-parameter Campàs-Brenner
#      affine scaling-and-shear transformation M(s_L, s_D, gamma) = [[1, gamma], [0, 1]] @ [[s_L, 0], [0, s_D]]
#      required to collapse all 14 Darwin's finch species across Group B (Platyspiza,
#      Camarhynchus, Cactospiza) and Group C (Certhidea, Pinaroloxias), as well as the
#      pure-scaling negative control showing why gamma = 0 fails on Groups B & C.
#   2. `evaluate_geospiza_group_a` (L56-97) omits the coupled Bmp4/Calmodulin mesenchymal
#      growth field and Abzhanov et al.'s (2004, 2006) retroviral perturbation experiments
#      (RCAS::Bmp4 gain-of-function, RCAS::Noggin inhibition, RCAS::CaM elongation) and
#      cantilever beam bending resistance I_beam = W*D^3 / (12*L).
#   3. The vendored biological specimen `datasets/avian_beak_darwin_scaling/darwin_finches_specimen.jpg`
#      (Gould's 1845 Darwin's finches plate) is not loaded, segmented, or displayed.
#   4. Runtime SHA-256 verification of dataset assets and CLI physical parameter overrides
#      (`--bmp4-scale`, `--cam-scale`, `--gamma-shear`, `--seed`) are missing.

