          `--d`, `--gamma`, `--epsilon`, `--u-th`, `--alpha-bc`, and `--seed` CLI overrides (L691-715).
        evidence:
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [355, 524], note: "4 mimetic morphs, 6-point threshold sweep, 5-point anisotropy sweep, and 2 negative controls", supports: true}
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [691, 715], note: "CLI overrides for a, b, d, gamma, epsilon, u_th, alpha_bc, and seed", supports: true}
      morphometric-validation:
