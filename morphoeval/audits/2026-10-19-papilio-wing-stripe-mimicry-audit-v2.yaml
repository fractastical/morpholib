    summary: >-
      Pass 2 (v2) evaluation of `2016-sekimura-papilio-wing-stripe-mimicry.py` (overall
      weighted score: 94.3/100, up from 56.4/100 in v1). The remediated script solves
      the 2D anisotropic Gierer–Meinhardt reaction–diffusion PDE on a curved Papilio
      dardanus forewing mesh with vein-aligned diffusivity tensor D = diag(1, epsilon)
      and boundary margin source gradients alpha_bc; reproduces all 4 Sekimura et al.
      (2000) female Batesian mimetic morphs (hippocoonides f_blk = 0.4722 vs ref 0.48,
      trophonius f_blk = 0.5446 vs ref 0.56, cenea f_blk = 0.7001 vs ref 0.72,
      planemoides f_blk = 0.6274 vs ref 0.63); validates the 6-point threshold u_th
      melanic expansion sweep (Pearson r = 0.9832, p = 4.21e-4, RMSE = 0.0446) and
      5-point vein anisotropy epsilon orientation sweep (Pearson r = 0.9672, p = 7.09e-3);
      verifies the equal-diffusion negative control (d = 1.0 < d_c = 8.2384); and segments
      the SHA-256-locked CC BY-SA 4.0 Papilio dardanus specimen (`papilio_dardanus_cenea_specimen.jpg`,
      wing area 167,800 px, dorsal melanic fraction 0.7034 vs ref 0.72).
