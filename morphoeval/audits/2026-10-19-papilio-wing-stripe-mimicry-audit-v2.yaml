      model-fidelity:
        value: 95
        rationale: >-
          Implements the Gierer–Meinhardt homogeneous steady state, Jacobian, and Turing
          dispersion analysis (`compute_gm_steady_state`, L114-179), the curvilinear
          *Papilio dardanus* forewing coordinate mesh (`build_forewing_curvilinear_mesh`,
          L184-223), and the 2D anisotropic Gierer–Meinhardt PDE solver with vein-aligned
          diffusivity tensor D = diag(1, epsilon) and boundary margin source gradients
          (`integrate_anisotropic_gm_wing_pde`, L226-349), backed by 3 machine-checked
          Lean 4 theorems in `morphoeval/lean/loops/Loop_099_papilio_wing_stripe_mimicry.lean`.
        evidence:
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [114, 223], note: "Gierer-Meinhardt steady state (u0=1.1, v0=1.21, d_c=8.2384) and curvilinear Papilio dardanus forewing mesh", supports: true}
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [226, 374], note: "2D anisotropic Gierer-Meinhardt PDE solver reproducing all 4 Batesian mimetic morphs (hippocoonides, trophonius, cenea, planemoides)", supports: true}
          - {file: morphoeval/lean/loops/Loop_099_papilio_wing_stripe_mimicry.lean, lines: [27, 114], note: "3 standalone Lean 4 theorems proving GM steady state & Turing instability, anisotropic vein mode switching, and monotonic melanic expansion (0 sorrys)", supports: true}
      specimen-match:
        value: 93
        rationale: >-
          Vendors and SHA-256-verifies the CC BY-SA 4.0 female *Papilio dardanus* mimetic
          butterfly photograph `datasets/papilio_wing_stripe_mimicry/papilio_dardanus_cenea_specimen.jpg`,
          segments the dorsal wing contour (167,800 px) via green-excess background
          suppression, and quantifies the empirical melanic scale area fraction
          f_black = 0.7034 (forewing 0.7644 vs Sekimura ref 0.72), 11 major light patches,
          and dominant patch orientation 60.9 deg (`segment_papilio_dardanus_specimen`, L530-600).
        evidence:
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [530, 600], note: "Chromatic green-excess & luminance segmentation of papilio_dardanus_cenea_specimen.jpg (167,800 px wing contour, f_blk=0.7034)", supports: true}
          - {file: docs/media/papilio_wing_stripe_mimicry_comparison.png, lines: [0, 0], note: "8-panel Pass 2 synthesis figure comparing all 4 curved-wing morphs, threshold & anisotropy sweeps, and specimen segmentation", supports: true}
      parameter-expressivity:
        value: 94
        rationale: >-
          Spans all 4 female Batesian mimetic morphs across (u_th, alpha_bc, epsilon)
          parameter space (L355-374), the 6-point threshold u_th in [0.85, 1.22] melanic
          area sweep (L377-409), the 5-point vein anisotropy epsilon in [0.25, 1.65]
          orientation sweep (L412-479), 2 negative/ablation controls (equal diffusion
