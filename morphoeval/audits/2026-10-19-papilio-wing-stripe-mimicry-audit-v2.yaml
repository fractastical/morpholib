# MorphoEval audit — Sekimura, Madzvamuse, Wathen & Maini (2000) Proc. R. Soc. B, Madzvamuse et al. (2002) J. Math. Biol. & Timmermans/Thompson et al. (2014) Nature Papilio dardanus Wing Mimicry Patterning, 2026-10-19 (v2)
#
# Pass 2 (v2) evaluation of `2016-sekimura-papilio-wing-stripe-mimicry.py` (716 lines)
# after completing the 12-step closed remediation loop (`2026-10-19-papilio-wing-stripe-mimicry-loop`):
#   - Primary assessor: Gemini 4 Argon — 94.3 / 100 (up from 56.4 / 100 in v1; +37.9 overall)
#
# Key remediation improvements verified in Pass 2:
#   1. Implemented the curvilinear *Papilio dardanus* forewing coordinate mesh
#      (`build_forewing_curvilinear_mesh`, L184-223) and the 2D anisotropic Gierer–Meinhardt
#      reaction–diffusion PDE solver (`integrate_anisotropic_gm_wing_pde`, L226-349) with
#      vein-aligned diffusivity tensor D = diag(1, epsilon) and boundary-induced margin
#      source profiles alpha_bc, reproducing all 4 Sekimura et al. (2000) female Batesian
#      mimetic morphs (*hippocoonides* f_blk = 0.472 vs ref 0.48; *trophonius* f_blk = 0.545
#      vs ref 0.56; *cenea* f_blk = 0.700 vs ref 0.72 with 5 spots; *planemoides*
#      transverse band f_blk = 0.627 vs ref 0.63).
#   2. Implemented the 6-point *engrailed* pigmentation threshold u_th in [0.85, 1.22]
#      melanic expansion sweep (`evaluate_threshold_melanic_sweep`, L377-409; Pearson
#      r = 0.9832, p = 4.21e-4, RMSE = 0.0446) and the 5-point anisotropic diffusivity
#      ratio epsilon = D_perp / D_par in [0.25, 1.65] stripe-to-band orientation sweep
#      (`evaluate_anisotropy_orientation_sweep`, L412-479; Pearson r = 0.9672, p = 7.09e-3,
#      switching from 15.68 deg longitudinal vein-aligned stripes to 68.04 deg transverse
#      anteroposterior bands).
#   3. Implemented dual negative/ablation controls (`run_negative_controls`, L482-524),
#      verifying that equal diffusion (d = 1.0 < d_c = 8.2384) suppresses Turing pattern
#      amplitude to std(u) = 0.000018 (suppression ratio 9.4e3 vs wild-type d = 40.0).
#   4. Implemented chromatic green-excess background suppression and luminance segmentation
#      (`segment_papilio_dardanus_specimen`, L530-600) on the SHA-256-locked CC BY-SA 4.0
#      *Papilio dardanus cenea* female specimen (`papilio_dardanus_cenea_specimen.jpg`,
#      wing area 167,800 px, dorsal melanic fraction f_blk = 0.7034 vs ref 0.72, forewing
#      melanic fraction 0.7644, 11 major light patches, dominant orientation 60.9 deg),
#      plus runtime SHA-256 verification of all 4 dataset assets (`verify_dataset_integrity`,
#      L91-103).

