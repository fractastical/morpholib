# MorphoEval audit — Richman et al. (1975) Science & Tallinen et al. (2014, 2016) Cortical Gyrification Folding, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `1975-richman-cortical-gyrification-buckling.py` (212 lines)
# prior to Step 12 remediation in `2026-10-19-cortical-gyrification-folding-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.2 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `generate_parametric_coronal_contour` (L46-66) prescribes a synthetic harmonic
#      ansatz for the coronal pial contour rather than minimizing the coupled 2D
#      neo-Hookean cortical shell (F = F_e G, tangential expansion g, bending stiffness
#      B_c ~ mu_c h^3, sulcal self-contact barrier) + soft subcortical white-matter
#      foundation (mu_s) elastic energy functional via L-BFGS-B relaxation.
#   2. `evaluate_fetal_stages` (L69-94) evaluates only the 5 human fetal gestational
#      stages (GW22-GW38) and omits the 11-species mammalian comparative gyrification
#      and sulcal wavelength collapse (Mouse, Rat, Ferret, Marmoset, Cat, Bottlenose
#      dolphin, Capuchin, Rhesus macaque, Sheep, Chimpanzee, Human; Tallinen et al.
#      2014 Fig. 4 & Mota & Herculano-Houzel 2015 Science), as well as Richman et al.'s
#      (1975) polymicrogyria (thin cortex h=0.85 mm), lissencephaly (thick cortex h=6.50 mm),
#      and zero-growth (g=1.00) negative ablation controls.
#   3. The vendored coronal human brain specimen `datasets/cortical_gyrification_folding/cerebral_cortex_gyri_specimen.jpg`
#      is not loaded, segmented into cortical gray matter / white matter / convex hull,
#      or displayed in `cortical_gyrification_folding_comparison.png`.
#   4. Runtime SHA-256 verification of dataset assets and CLI parameter overrides
#      (`--growth-g`, `--h-cortex`, `--mu-ratio`, `--R-brain`, `--seed`) are missing.

