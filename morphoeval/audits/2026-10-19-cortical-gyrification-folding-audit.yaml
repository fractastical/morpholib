simulations:
  - id: richman-cortical-gyrification-buckling
    name: "Richman et al. (1975) & Tallinen et al. (2014, 2016) neo-Hookean constrained cortical expansion and sulcal creasing instability"
    organism: "Mammalian cerebral cortex & subcortical white matter (Homo sapiens, Pan troglodytes, Macaca mulatta, Tursiops truncatus, Felis catus, Mus musculus)"
    script: 1975-richman-cortical-gyrification-buckling.py
    output: docs/media/cortical_gyrification_folding_comparison.png
    extra_outputs:
      - docs/media/cortical_gyrification_folding_growth.gif
    status: evaluated
    source_refs:
      - richman1975
      - tallinen2014
      - tallinen2016
      - mota2015
    summary: >-
      Pass 1 (v1) baseline evaluation of `1975-richman-cortical-gyrification-buckling.py`
      (overall weighted score: 56.2/100). The v1 script implements Richman et al.'s (1975)
      and Tallinen et al.'s (2014) cube-root sulcal wavelength law
      lambda = 2*pi*h*(mu_c/(3*mu_s))^(1/3) and evaluates human fetal stages GW22-GW38,
      but prescribes a synthetic harmonic contour rather than minimizing a coupled
      neo-Hookean cortical shell + subcortical white-matter elastic energy functional,
      omits the 11-species mammalian scaling collapse and pathological polymicrogyria /
      lissencephaly / zero-growth controls, and does not segment the vendored coronal
      human cerebral cortex specimen image.
    scores:
      model-fidelity:
        value: 57
        rationale: >-
          Computes the exact Richman-Tallinen sulcal wavelength scaling
          lambda = 2*pi*h*(mu_c/(3*mu_s))^(1/3) and enforces the critical threshold
          g_c = 1.18 (L34-44), backed by 3 Lean 4 theorems in
          `Loop_061_cortical_gyrification_folding.lean`. However,
          `generate_parametric_coronal_contour` (L46-66) uses a synthetic rectified-sine
          ansatz rather than relaxing a coupled 2D neo-Hookean cortical shell + soft
          white-matter core energy functional with sulcal self-contact, and omits
          polymicrogyric, lissencephalic, and zero-growth (g=1.0) controls.
        evidence:
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [34, 44], note: "Exact Richman-Tallinen cube-root sulcal wavelength scaling law", supports: true}
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [46, 66], note: "Parametric rectified-sine coronal contour instead of neo-Hookean elastic energy minimization", supports: false}
      specimen-match:
        value: 35
        rationale: >-
          Although `datasets/cortical_gyrification_folding/cerebral_cortex_gyri_specimen.jpg`
          is vendored on disk, the v1 script never loads, segments, or displays the
          coronal brain specimen image, and compares only against human fetal GW22-GW38
          tabular numbers without the 11-species mammalian dataset.
        evidence:
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [69, 94], note: "Evaluates only human fetal GW22-GW38 stages without loading cerebral_cortex_gyri_specimen.jpg", supports: false}
          - {file: docs/media/cortical_gyrification_folding_comparison.png, lines: [0, 0], note: "4-panel v1 plot lacks coronal brain specimen segmentation and 11-species mammalian collapse", supports: false}
      parameter-expressivity:
        value: 48
        rationale: >-
          Evaluates 5 human fetal stages (GW22-GW38, g in [1.12, 2.15], L69-94), but
          omits the 11-species mammalian morphospace sweep, lacks Richman et al.'s (1975)
          polymicrogyria (h=0.85 mm) vs lissencephaly (h=6.50 mm) vs normogyria (h=2.60 mm)
          comparison, and exposes no CLI overrides for g, h, mu_c/mu_s, R_brain, or seed
          (L198-206).
        evidence:
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [198, 206], note: "CLI exposes only --self-test and --skip-gif without physical parameter overrides", supports: false}
      morphometric-validation:
        value: 56
        rationale: >-
          `measure_morphoeval()` (L156-188) reports 3 analytical human fetal metrics,
          but does not compute true contour arc-length perimeter P_pial / P_hull from a
          relaxed elastic cortical shell, does not evaluate 11-species mammalian wavelength
          or GI correlations, and extracts zero computer-vision metrics from the coronal
          brain slice specimen.
        evidence:
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [156, 188], note: "Only 3 analytical fetal metrics returned without relaxed contour perimeter or specimen CV metrics", supports: false}
      source-traceability:
        value: 74
        rationale: >-
          Reads `datasets/cortical_gyrification_folding/cortical_gyrification_folding_reference.json`
          and cites Richman et al. (1975) and Tallinen et al. (2014, 2016) (L4-11), but
          does not perform runtime SHA-256 verification of the 4 dataset files.
        evidence:
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [37, 38], note: "Loads REF_JSON without runtime SHA-256 verification", supports: false}
      code-traceability:
        value: 68
        rationale: >-
          Documents the sulcal wavelength formula (L40-44), but lacks explicit mappings
          to Richman et al. (1975) Table 1, Tallinen et al. (2014) Eq. 1 & Fig. 1-4,
          Tallinen et al. (2016) Fig. 2-4, and the 3 Lean 4 theorems in
          `Loop_061_cortical_gyrification_folding.lean`.
        evidence:
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [40, 66], note: "Brief docstrings without explicit paper figure/table or Lean 4 theorem cross-references", supports: false}
      repro-package:
        value: 68
        rationale: >-
          Includes `--self-test` and `--skip-gif` flags (L190-209), but `self_test()`
          runs only 3 basic assertions without checking SHA-256 dataset integrity,
          lissencephalic/ablation invariants, 11-species mammalian collapse, or two-run
          bitwise determinism.
        evidence:
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [190, 196], note: "Minimal 3-check self_test() without determinism or ablation verification", supports: false}
    remediation:
      - "Replace the parametric coronal curve with a genuine 2D neo-Hookean multiplicative-growth (F = F_e G) cortical shell + soft subcortical white-matter core elastic energy minimizer (L-BFGS-B relaxation of tangential compression, bending stiffness B_c ~ mu_c h^3, white-matter radial/shear foundation stiffness, and sulcal self-contact) and measure emergent GI = P_pial / P_hull and sulcal wavelength directly from the relaxed contour."
      - "Evaluate the full 11-species mammalian comparative scaling collapse (Mouse, Rat, Ferret, Marmoset, Cat, Bottlenose dolphin, Capuchin, Rhesus macaque, Sheep, Chimpanzee, Human) alongside Richman et al. (1975) polymicrogyria (h = 0.85 mm), lissencephaly (h = 6.50 mm, g < g_c), and zero-growth (g = 1.00) negative controls."
      - "Implement computer-vision segmentation of `datasets/cortical_gyrification_folding/cerebral_cortex_gyri_specimen.jpg` to isolate the cortical gray-matter ribbon, white-matter core, outer convex hull perimeter P_hull, pial perimeter P_pial, empirical specimen Gyrification Index GI, and inter-sulcal wavelength CV."
      - "Add runtime SHA-256 verification of all 4 files in `datasets/cortical_gyrification_folding/`, expose full CLI parameters (`--growth-g`, `--h-cortex`, `--mu-ratio`, `--R-brain`, `--seed`), and expand `self_test()` and `measure_morphoeval()` to 9 quantitative reference-anchored metrics."
