    summary: >-
      Pass 1 solves the Schnakenberg critical wavenumber so lambda_c is
      24.19 µm (2.419e-05 m) at diffusion ratio 7.2, just above onset
      (6.724). Sigma at k_c is +0.0297. The stage-1 animation is a synthetic
      44-rib coil, 12 frames at 640 px, computer-vision similarity 79.5
      against the Whitby photograph. Pearson r of the dispersion curve,
      the equal-diffusion ablation, the diffusivity sweep, and the rib
      measurement on the real shell were not run.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: diffusion-driven instability at a finite critical wavenumber."
        - "Schnakenberg 1979: activator-inhibitor kinetics a - u + u^2 v, b - u^2 v."
        - "Catalogue slot: 24 µm detail scale, SI size 2.419e-05 m, Toarcian 181 Ma, D_f = 1.55."
        - "James St. John, CC BY 2.0: Whitby Formation Dactylioceras commune, stated width 57 mm."
      reconstructed_in_script:
        - "Du and Dv solved so k_c^2 = (Dv f_u + Du g_v) / (2 Du Dv) returns 2.419e-05 m."
        - "Stage-1 synthetic fibulate coil used only as a first visual check."
      transfer_boundary:
        - "Molluscan aperture pigment models are the transfer path onto an ammonite periostracum. Pass 1 does not test that transfer against the photograph."
      does_not_claim:
        - "Pass 1 does not claim a dispersion-curve Pearson r, an ablation, a parameter sweep, or a rib measurement."
        - "Pass 1 does not claim that 24 µm stripes are visible on the 57 mm shell."
        - "D_f = 1.55 is a catalogue input, not a measurement on this photograph."
    scores:
      model-fidelity:
        value: 86
        rationale: "Stage 1 implements the Schnakenberg Jacobian and the textbook k_c formula and solves Du, Dv so lambda_c is 24.19 µm with sigma(k_c) = +0.0297, above the onset ratio 6.724. The numerical growth-rate comparison to sigma(k) is not in this pass."
        evidence:
          - {file: models/2026-delphi10000-dactylioceras-commune-turing-wavelength-s0.py, lines: [101, 119], note: "k_c^2 and sigma(k) from the Schnakenberg Jacobian", supports: true}
          - {file: datasets/dactylioceras_commune_turing_wavelength_s0/pass1_metrics.json, lines: [1, 19], note: "lambda_c_um 24.19, sigma_at_kc 0.0297, age 181", supports: true}
      specimen-match:
        value: 74
        rationale: "The stage-1 GIF is a radial fibulate coil at 640 px and 12 frames. CV similarity to the Whitby photograph is 79.5. The coil has the right rib family and the wrong outline, matrix, and pyrite."
        evidence:
          - {file: models/2026-delphi10000-dactylioceras-commune-turing-wavelength-s0.py, lines: [410, 431], note: "render_pass1_gif synthetic coil", supports: true}
          - {file: datasets/dactylioceras_commune_turing_wavelength_s0/pass1_growth.gif, lines: [0, 0], note: "12-frame 640 px synthetic growth, CV 79.5", supports: true}
      parameter-expressivity:
        value: 54
        rationale: "The diffusion ratio and the wavelength are fixed constants in stage 1. No diffusivity scale was varied, so monotonic control of lambda_c was not shown."
        evidence:
          - {file: models/2026-delphi10000-dactylioceras-commune-turing-wavelength-s0.py, lines: [56, 68], note: "A, B, ratio, and lambda are module constants; stage 1 does not sweep them", supports: true}
          - {file: models/2026-delphi10000-dactylioceras-commune-turing-wavelength-s0.py, lines: [585, 592], note: "stage < 2 returns before parameter_sweep", supports: true}
      morphometric-validation:
        value: 58
        rationale: "Stage 1 reports lambda_c and one growth rate. It does not measure ribs on the photograph, does not report Pearson r or RMSE, and does not run a KS test."
        evidence:
          - {file: datasets/dactylioceras_commune_turing_wavelength_s0/pass1_metrics.json, lines: [3, 14], note: "only lambda, sigma, and CV; no rib spacing or dispersion r", supports: true}
      source-traceability:
        value: 90
        rationale: "Crossref-checked DOIs for Turing, Schnakenberg, Meinhardt and Klingler, Fowler, García-Ruiz, and Lutz and Boyajian. The Whitby photograph is CC BY 2.0 with artist, URL, 57 mm width, and a SHA-256 pin."
        evidence:
          - {file: datasets/dactylioceras_commune_turing_wavelength_s0/paper_citations.bib, lines: [1, 74], note: "seven source records", supports: true}
          - {file: datasets/dactylioceras_commune_turing_wavelength_s0/dactylioceras_commune_turing_wavelength_s0_reference.json, lines: [1, 40], note: "24 µm, 2.419e-05 m, 181 Ma, specimen SHA-256", supports: true}
      code-traceability:
        value: 80
        rationale: "The module docstring and kc_sq map onto Schnakenberg and the k_c formula. Stage 1 does not yet call the dispersion, ablation, or segmentation functions those comments describe."
        evidence:
          - {file: models/2026-delphi10000-dactylioceras-commune-turing-wavelength-s0.py, lines: [1, 48], note: "docstring states equations, scale, age, and chronoseries neighbors", supports: true}
      repro-package:
        value: 82
        rationale: "Stage 1 checks the specimen SHA-256, uses seed 3159, and writes pass1_metrics.json. The --self-test gates (Pearson r, ablation, sweep, rib bounds) belong to stage 2 and were not the pass-1 command."
        evidence:
          - {file: models/2026-delphi10000-dactylioceras-commune-turing-wavelength-s0.py, lines: [241, 248], note: "SHA-256 check against the reference JSON", supports: true}
          - {file: models/2026-delphi10000-dactylioceras-commune-turing-wavelength-s0.py, lines: [560, 592], note: "stage-1 return path", supports: true}
    remediation:
      - "R1 parameter-regime sweep: scale both diffusivities and show lambda_c moves monotonically."
      - "R2 negative control: equal-diffusion ablation must be stable at k_c while the Turing ratio is unstable."
      - "R3 real specimen CV segmentation: measure outer-whorl rib harmonic, rib spacing, coherency, and foreground on the Whitby photograph."
      - "R4 goodness-of-fit: Pearson r and RMSE of numerical versus analytical sigma(k), plus a KS test of orientations."
