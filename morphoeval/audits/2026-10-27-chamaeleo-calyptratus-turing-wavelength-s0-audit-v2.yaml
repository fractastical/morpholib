simulations:
  - id: delphi10000-chamaeleo-calyptratus-turing-wavelength-s0
    name: "Holocene Chamaeleo calyptratus Turing wavelength at 260.4 µm (Pass 2)"
    organism: "Chamaeleo calyptratus (veiled chameleon)"
    script: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py
    output: docs/media/chamaeleo_calyptratus_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: 2026-10-27-chamaeleo-calyptratus-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, murray1981, ligon2013, teyssier2015]
    summary: >-
      Pass 2 keeps the Schnakenberg carrier (analytical λ = 260.55 µm, saturated
      flank λ = 254.3 µm, sweep r = 0.999, dispersion r = 0.998, ablation ratio
      1.9e-4) and closes three Pass-1 gaps. The animation now lays the saturated
      bars onto the skin and leaves the enclosure as the photograph. Orientation
      and coherency are measured on a flank ROI that drops the rock above the
      dorsum and the sand under the belly (flank gradient 88.6 deg versus field
      79.7 deg). The GIF caption no longer uses a glyph the bitmap font cannot draw.
      Weighted score moves from 81.4 to 86.3. A second assessor is still absent.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and Murray 1981 wavenumber for a two-species reaction-diffusion system."
        - "Schnakenberg 1979 kinetics du/dt = Du lap u + A - u + u^2 v, dv/dt = Dv lap v + B - u^2 v."
        - "Ligon & McGraw 2013: male Chamaeleo calyptratus change lateral stripe brightness during contests."
        - "Teyssier et al. 2015: chameleon skin has a tunable guanine-nanocrystal iridophore lattice, measured on Furcifer pardalis at a spacing of order 100 nm."
      reconstructed_in_script:
        - "A = 0.062, B = 1.150, supercritical factor 1.45, Dv_y/Dv_x = 0.42, so the most-unstable wavelength is the 260.4 µm slot scale and the pattern is a vertical bar."
        - "Flank ROI: saturation mask, then the central band of the animal bounding box. The 80 µm and 2.604 mm cutoffs are scale-separation definitions at 0 Ma, not caliper readings."
      transfer_boundary:
        - "Dermal chromatophore anatomy is transferred from the panther chameleon to C. calyptratus. The 260.4 µm carrier is the slot scale."
      does_not_claim:
        - "Does not claim a calibrated micrometre period read off the Wikimedia photograph."
        - "Does not claim the guanine lattice spacing is 260.4 µm."
        - "Does not claim a second independent assessor."
    scores:
      model-fidelity:
        value: 88
        rationale: "The integrator is unchanged from Pass 1 and still implements the Schnakenberg system and the Turing eigenvalue. Pass 2 only changes the readout (flank composite) and the ROI used for the orientation statistic."
        evidence:
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [94, 163], note: "steady state, critical ratio, sigma(k), diffusivities for k_peak = 2π", supports: true}
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [166, 243], note: "spectral IMEX step and the equal-diffusion ablation", supports: true}
      specimen-match:
        value: 80
        rationale: "The comparison figure shows the H. Zell animal, the flank ROI, and the raw vertical-bar field (λ = 254.3 µm). GIF frame 12 keeps the enclosure and paints a visible carrier onto the skin. The field is still a periodic patch, not a body-shaped PDE, and the overlay is lighter than the animal's own broad bars."
        evidence:
          - {file: docs/media/chamaeleo_calyptratus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, flank ROI, saturated activator, dispersion and sweep", supports: true}
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [630, 642], note: "skin composite versus enclosure composite", supports: true}
          - {file: docs/media/chamaeleo_calyptratus_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames at 720x540", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "Six diffusivity scales move the measured wavenumber with the predicted 1/sqrt(s) schedule (Pearson r = 0.999, RMSE of k = 0.048). Setting Dv = Du removes the pattern. The anisotropy ratio is what makes the bars vertical (gx/gy = 17.3)."
        evidence:
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [287, 307], note: "parameter_sweep", supports: true}
      morphometric-validation:
        value: 90
        rationale: "Dispersion r = 0.998, sweep r = 0.999, KS distance 0.452 on flank-versus-field orientations, ablation ratio 1.9e-4. The flank ROI replaces the Pass-1 mask that included rock and sand. None of these values is copied onto its reference. The 260.4 µm target is still not a measurement on the photograph."
        evidence:
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [333, 348], note: "flank_roi trims the animal bounding box", supports: true}
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [245, 285], note: "dispersion sample", supports: true}
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [483, 560], note: "measure_morphoeval, value distinct from reference_value", supports: true}
      source-traceability:
        value: 90
        rationale: "Same five Crossref-checked DOIs and the SHA-256-pinned CC BY-SA 3.0 photograph. Pass 2 does not add a source, and it does not start treating the slot scale as a published measurement."
        evidence:
          - {file: datasets/chamaeleo_calyptratus_turing_wavelength_s0/paper_citations.bib, lines: [1, 45], note: "bibliographic records", supports: true}
          - {file: datasets/chamaeleo_calyptratus_turing_wavelength_s0/chamaeleo_calyptratus_turing_wavelength_s0_reference.json, lines: [1, 80], note: "scale 260.4 µm, age 0 Ma, specimen digest, claim boundary", supports: true}
      code-traceability:
        value: 86
        rationale: "Docstring equations (1)-(4) still head the file. Pass 2 adds flank_roi and _compose_frame, each with a docstring that says what it is for."
        evidence:
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [1, 55], note: "scale, age, equations, transfer boundary", supports: true}
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [644, 654], note: "ASCII caption; the lambda glyph is gone", supports: true}
      repro-package:
        value: 88
        rationale: "Seed 3144 and --self-test still gate the dispersion, the sweep, the ablation, the mask, and the KS distance. One command rewrites the PNG, the GIF, and the metrics JSON."
        evidence:
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [724, 750], note: "self_test", supports: true}
          - {file: datasets/chamaeleo_calyptratus_turing_wavelength_s0/README.md, lines: [20, 38], note: "invocation", supports: true}
