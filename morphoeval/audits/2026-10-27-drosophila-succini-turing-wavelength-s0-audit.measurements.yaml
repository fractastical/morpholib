      reported_in_source:
      - 'Turing 1952: a reaction-diffusion system selects a critical wavenumber.'
      - 'Schnakenberg 1979: du/dt = a - u + u^2 v and dv/dt = b - u^2 v, plus diffusion.'
      - 'Hennig 1965: Drosophila succini is a Baltic amber acalyptrate, volume 145.'
      - 'Grimaldi 1987: Dominican amber drosophilids, the chronoseries context for the 19 Ma successor.'
      reconstructed_in_script:
      - Jacobian, sigma(k), k_c = argmax sigma, D_u solved so lambda = 2.759e-06 m at r = 18.72.
      - Stem r = 8.40 below onset and equal-diffusivity ablation have sigma_max < 0.
      - Berryi wavelength 2.382 µm by transferring the registry ratio 98.43/114 onto this detail scale.
      transfer_boundary:
      - No published measurement of a 2.8 µm pigment wavelength in the Hennig holotype.
      - Kondo & Miura 2010 is a framework paper, not a datum for this fossil.
      - The gallery card is a synthetic spiral, not an amber photomicrograph.
      does_not_claim:
      - That the GIF's spot field is a photograph of Drosophila succini.
      - That the full Fourier spectrum of the nonlinear PDE matches linear theory (it does not, outside the Turing
