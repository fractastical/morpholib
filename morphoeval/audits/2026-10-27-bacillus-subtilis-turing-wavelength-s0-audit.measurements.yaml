    claim_boundary:
      reported_in_source:
      - Turing 1952 selects a finite critical wavenumber from a two-species reaction-diffusion system.
      - Kawasaki 1997, Golding 1998, and Ben-Jacob 2000 model Bacillus subtilis colony branches with reaction-diffusion
        at colony scale.
      - The Korinna 2019 micrograph is an eye-shaped B. subtilis colony and carries no scale bar.
      reconstructed_in_script:
      - Schnakenberg kinetics a=0.084, b=0.916, diffusion ratio 9.20, calibrated so argmax sigma_plus is 16.02 µm.
      - A kinematic circular front with m=round(2 pi R / 16 µm)=72 at R=183.3 µm, which is a reconstruction, not
        a measured radius.
      transfer_boundary:
      - Colony-scale branching papers are used as the organism's reaction-diffusion context. They are not a measurement
        of a 16 µm wavelength.
      does_not_claim:
      - Does not claim that any cited paper measured a 16 µm pigment stripe in B. subtilis.
      - Does not claim the faint bulk field in pass 1 has reached a nonlinear Turing pattern.
