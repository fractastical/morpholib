    claim_boundary:
      reported_in_source:
      - 'Thompson (1917) p. 297: three similar liquid surfaces always meet at 120 degrees; p. 303 Fig. 113 cases
        (1)-(3): 90 / >90 / 120 degrees as the partition tension t rises to T; pp. 309-310: Lamarle''s least-area
        partition meets in threes at 120 degrees and ''in any ordinary section of a vegetable parenchyma ... cell-walls
        everywhere meeting, by threes, at angles of 120 degrees, irrespective of the size of the individual cells''.'
      - 'Thompson (1917) pp. 314, 321-322: epidermal outer walls and growth/traction anisotropy (Fig. 124 Girardia)
        are stated exceptions where the angles depart from 120 degrees while three-fold meeting persists.'
      reconstructed_in_script:
      - Lami/Neumann triangle of forces (E1) with the Fig. 113 cases and the inverse map from measured angles to
        tension ratios; Steiner-vs-cross film lengths (E2); angle-sum identity statistics with vertex-level bootstrap
        (E3); periodic Poisson-Voronoi vertex network relaxed by analytic-gradient descent with T1 exchanges under
        E = sum K/2 (A - A0)^2 + Gamma/2 P^2 + sum Lambda(phi) l, Lambda(phi) = Lambda0 (1 + eps cos 2 phi) (E5),
        in the equal-tension Plateau limit (Gamma = eps = 0), the Farhadifar Case I comparator, and a 7-point eps
        sweep.
      - Segmentation of two CC BY-SA micrographs (nucleus-seeded watershed on a Sato ridge image for the corneal
        endothelium; Sato wall mask -> connected components for the onion epidermis) and skeleton-graph extraction
        of Thompson's Figs. 103 and 124; tri-cellular junction angles by a chord estimator (straight edges to the
        neighbouring vertices, primary) and a branch estimator (mean wall offset within R = L_e/3).
      - 'Verdict by pre-registered criteria (three-fold fraction >= 0.90 in both micrographs; chord median |theta
        - 120| <= 15 degrees in the isotropic specimen; dispersion below the Poisson-Voronoi null): SUPPORTED, with
        the branch-estimator sensitivity (15.9 degrees) reported.'
      transfer_boundary:
      - 2D en-face projection / plane section of 3D cells; Thompson's 109 deg 28' tetrahedral edge law is not simulated.
        The vertex model has straight edges, so unlike a real soap froth it cannot realise 120 degrees at every
        vertex of a disordered tessellation (a straight-sided pentagon's angles sum to 540 degrees); its irreducible
        chord-angle SD (~10 degrees) is the appropriate null for straight-walled tissue, not an exact 120.
      - The Commons micrographs are modern specimens not figured by Thompson; because the claim names no species
        they are specimens of the claim rather than analogues of a named species, and are labelled as modern throughout.
      does_not_claim:
      - Does not claim that junction angles are exactly 120 degrees in any tissue, that cortical tensions are measured
        (they are inferred by inverse Lami only), or anything about the pre-scouted Dryad set doi:10.5061/dryad.mn8cs,
        which is a DATASET_MISMATCH (Ca2+ ratio imaging with no junction label) and is not used.
      - Does not model cell division, active junction remodelling, or 3D apico-basal geometry.
