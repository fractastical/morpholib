measurements:
  delphi10000-drosophila-sechellia-turing-wavelength-s0:
  - name: analytical Turing wavelength lambda_c
    value: 1.5
    unit: µm
    method: lambda_c = 2π / k_c with k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v)
    reference_value: 1.548
    reference_source: Slot scale 1.548e-06 m is the metre expression of the 1.5 µm tier, not the nondimensional
      λ_c
    note: trace=-5.6000, det=0.9450, hmin=-0.0350
    derived_from: script
  - name: brightest Fourier bin wavelength
    value: 1.479591
    unit: µm
    method: argmax bin of the 2D Fourier power; an oblique neighbour of the critical ring on the rectangular grid
    reference_value: 1.5
    reference_source: Turing 1952; the single brightest bin need not sit on k_c when several ring modes are tied
    note: relative error of the brightest bin=0.01361
    derived_from: script
  - name: critical-shell power-weighted wavelength
    value: 1.500439
    unit: µm
    method: power-weighted |k| inside |k − k_c| < 0.55 rad/µm, converted by λ = 2π/|k|
    reference_value: 1.548
    reference_source: Slot scale 1.548 µm-equivalent metre tier is not this nondimensional shell wavelength
    note: shell k=4.1876; broadband weighted λ=1.5004 µm
    derived_from: script
  - name: activator-gain sweep Pearson r
    value: 0.999647
    unit: correlation
    method: Pearson r between analytical λ_c(f_u) and power-weighted wavelength over 7 co-adapted Jacobians
    reference_value: 1.0
    reference_source: Turing 1952 k_c formula; perfect correlation would be 1
    note: RMSE after affine calibration=0.00399 µm; monotonic=True
    derived_from: script
  - name: activator-gain sweep RMSE
    value: 0.003991
    unit: µm
    method: RMSE of calibrated power-weighted wavelength against analytical λ_c(f_u)
    reference_value: 0.0
    reference_source: Zero residual is the ideal of a noise-free linear mode
    note: calibration removes the stable-side-mode bias of the spectral mean; r is uncalibrated
    derived_from: script
  - name: radial-spectrum KS distance vs analytical ring
    value: 0.22864
    unit: KS
    method: Kolmogorov-Smirnov distance between the 24-bin radial power of u and a Gaussian ring at k_c
    reference_value: 0.05
    reference_source: A pure single-mode cosine has a narrower ring than the near-onset packet
    note: lower is closer; the packet has a finite unstable bandwidth
    derived_from: script
  - name: multi-seed stripe wavelength CV
    value: 0.003662
    unit: CV
    method: sample CV of the Fourier peak wavelength across four RNG seeds
    reference_value: 0.15
    reference_source: A disordered pigment field would have spacing CV near 0.15; onset selection is tighter
    note: peaks=[1.502939332385388, 1.5067426724493405, 1.494423521532098, 1.5052395268828347]
    derived_from: script
  - name: equal-diffusion negative control sigma_max
