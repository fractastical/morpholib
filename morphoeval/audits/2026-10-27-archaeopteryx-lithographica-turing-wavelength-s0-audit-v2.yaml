    summary: >-
      Pass 2 keeps the same Schnakenberg system (a=0.112, b=0.836, Du=0.052, Dv=1.48,
      gamma=0.039, anisotropy 1.22, seed 3120) and the same 7.478e-05 m wavelength at 150.0 Ma.
      The wing window is now a full soft mask (fraction 0.080) and the critical mode is mixed
      onto that window at alpha 0.78, so vertical activator bars are readable on the vane.
      Grid FFT wavelength remains 12.00 cells versus 11.991 analytical (relative error 0.00072).
      Wing-transect 3-harmonic Pearson r = 0.9803, fundamental-only r = 0.807, nRMSE = 0.198,
      KS = 0.053. Equal-diffusion ablation std ratio = 0.00081. Neighbor predictions at the
      same dx: Anchiornis 95.33 µm (160.8 Ma), Microraptor 57.05 µm (120 Ma).
