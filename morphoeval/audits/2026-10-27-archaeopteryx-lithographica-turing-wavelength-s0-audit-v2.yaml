      reported_in_source:
        - "Turing 1952: finite critical wavenumber when the inhibitor diffuses faster than the activator."
        - "Schnakenberg 1979: kinetics a - u + u^2 v and b - u^2 v."
        - "Prum and Williamson 2002: within-feather bars and spots are a reaction-diffusion class."
        - "Carney 2012: Archaeopteryx feather melanosomes at roughly micrometre length."
        - "Manning 2013 and Foth 2014: plumage pattern and pennaceous feathers at 150 Ma."
        - "Li 2010 and Li 2012: Anchiornis colour and Microraptor iridescence."
      reconstructed_in_script:
        - "Parameter tuple (a, b, Du, Dv, gamma, anisotropy) chosen so lambda_c = 7.478e-05 m."
        - "Gamma shifts 0.024 and 0.067 for the Anchiornis and Microraptor predictions."
        - "Quartic plus three harmonics fitted to the wing optical-density transect of the slab scan."
        - "Pass-2 wing mix: alpha 0.78 of the critical mode inside the soft wing window."
      transfer_boundary:
        - "The public-domain slab JPEG does not resolve 75 µm. The Pearson r is a scan-resolution transect fit, not a measured barbule spacing."
      does_not_claim:
        - "That 74.78 µm was measured on this photograph."
        - "That Anchiornis or Microraptor wavelengths were measured; they are gamma-transfer predictions."
        - "A molecular identity for u and v."
