    claim_boundary:
      reported_in_source:
      - 'Steinberg (1963, 1970) Differential Adhesion Hypothesis (DAH): dissociated binary embryonic tissues spontaneously
        sort into concentric core-shell or lens configurations governed by interfacial free energy minimization.'
      - 'Graner & Glazier (1992) PRL Eqs. 1-3: extended Cellular Potts Hamiltonian with interfacial tensions gamma_AB
        = J_AB - (J_AA + J_BB)/2 and gamma_tauM = J_tauM - J_tautau/2 partitioning parameter space into checkerboard
        (gamma_AB < 0), complete engulfment (0 < gamma_AB < gamma_BM - gamma_AM), partial engulfment (gamma_AB >
        gamma_BM - gamma_AM > 0), and dissociation (gamma_AM < 0).'
      - 'Foty, Pfleger, Forgacs & Steinberg (1996) Development Table 1: empirical Gallus gallus tissue surface tensions
        (20.1 > 12.6 > 8.5 > 4.6 > 1.6 dyn/cm) strictly predict transitive mutual envelopment.'
      reconstructed_in_script:
      - 2D extended Cellular Potts Model coupled with Detailed-Balance Kawasaki cell exchanges across all 5 thermodynamic
        regimes plus a 7-point continuous J_AB sweep.
      - Computer-vision segmentation of confocal fluorescence embryoid body spheroid (`cell_sorting_specimen.jpg`)
        comparing empirical GFP/RFP radial occupancy against Potts core-shell profiles (r = 0.9252, RMSE = 0.210).
      transfer_boundary:
      - 2D lattice Cellular Potts representation of 3D multicellular spheroid cross-sections.
      does_not_claim:
      - Does not model active chemotaxis or subcellular cadherin trafficking kinetics.
