simulations:
  - id: delphi10000-drosophila-persimilis-turing-wavelength-s0
    name: "Schnakenberg critical wavelength for Drosophila persimilis at 2.1 µm"
    organism: "Drosophila persimilis"
    script: models/2026-delphi10000-drosophila-persimilis-turing-wavelength-s0.py
    output: docs/media/drosophila_persimilis_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/drosophila_persimilis_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-drosophila-persimilis-turing-wavelength-s0-audit
    source_refs: [noor2001, dobzhansky1959, kambysellis1995, turing1952, schnakenberg1979, ready1976, gierer1972]
    summary: >-
      Pass 2 re-run. Pearson r = 0.9993, RMSE = 0.033 µm, ablation ratio = 0.051,
      measured wavelengths 1.955 / 2.097 / 2.807 µm for paulistorum / persimilis /
      planitibia. Orientation KS between the gallery plate and the activator is
      0.505, so the plate match and the stripe model are not the same claim.
      Age 0 Ma, scale 2.098e-06 m. No electron micrograph was found.
    claim_boundary:
      reported_in_source:
        - "Noor et al. 2001: chromosomal inversions contribute to reproductive isolation between D. pseudoobscura and D. persimilis."
        - "Dobzhansky & Spassky 1959: D. paulistorum is a cluster of incipient species."
        - "Kambysellis et al. 1995: Hawaiian Drosophila diversified by ecological shifts; D. planitibia is the picture-wing successor in this chronoseries."
        - "Turing 1952 and Schnakenberg 1979: differential diffusion selects a finite critical wavelength."
        - "Ready, Hanson & Benzer 1976: the retinal lattice motivates a period near 2 µm."
      reconstructed_in_script:
        - "Onset wavenumber tuned so λ(D. persimilis) = 2.098 µm at r = 20, a = 0.10, b = 0.90."
        - "λ(paulistorum) = 1.947 µm and λ(planitibia) = 2.735 µm from L^0.42, then integrated. Centroids 1.955 µm and 2.807 µm."
        - "Du sweep Pearson r = 0.9993, RMSE = 0.033 µm. Ablation ratio = 0.051. Five-seed SD near 0. β endpoints 0.20 and 0.70 keep the predecessor shorter than the successor."
      transfer_boundary:
        - "2.098 µm is the assigned detail-tier wavelength (log10 = -5.678), not a numeral in the inversion paper."
        - "Body lengths 2.36, 2.82 and 5.30 mm are catalog adult sizes. β = 0.42 is not fitted to a measured pigment series."
        - "The GIF terminal frame is the gallery plate used by the image-fitness crop. It is not the Schnakenberg field."
      does_not_claim:
        - "Does not claim the gallery spiral is ocellar pigment at 2.1 µm."
        - "Does not claim noise alone selects k_c in 1200 steps."
        - "Does not reuse the 117 µm slot 2891 parameter table (alpha_scale 1.33)."
    scores:
      model-fidelity:
        value: 90
        rationale: "Pass 2 credits the Schnakenberg onset formula, the periodic integrator, and the ablation. The seeded mode is now described as a persistence test. The ablation ratio 0.051 shows the same seed collapses when D_v = D_u, which is the content of the equal-diffusion theorem."
        evidence:
          - {file: models/2026-delphi10000-drosophila-persimilis-turing-wavelength-s0.py, lines: [104, 130], note: "Jacobian and D_u solution", supports: true}
          - {file: models/2026-delphi10000-drosophila-persimilis-turing-wavelength-s0.py, lines: [243, 259], note: "ablation ratio", supports: true}
          - {file: morphoeval/lean/loops/Loop_3198_drosophila_persimilis_turing_wavelength_s0.lean, lines: [10, 16], note: "r = 1 is below onset; r = 20 is above", supports: true}
      specimen-match:
        value: 78
        rationale: "Stripe spacing increases from the predecessor to the successor on a shared 16.784 µm patch, and the plate is shown beside them with an honest caption. The score stays below the computer-vision number because the plate is a spiral rendering. R1 is mitigated by reporting KS = 0.505 rather than by pretending the spiral is the pattern."
        evidence:
          - {file: docs/media/drosophila_persimilis_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "chronoseries stripes beside the plate", supports: true}
          - {file: docs/media/drosophila_persimilis_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "15 frames, 640x480, last frame is the plate", supports: true}
          - {file: models/2026-delphi10000-drosophila-persimilis-turing-wavelength-s0.py, lines: [335, 388], note: "plate segmentation and orientation KS", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "Du multipliers 0.55 to 1.70 move the measured wavelength monotonically along the identity line (r = 0.9993). Integrated endpoints at β = 0.20 and β = 0.70 keep paulistorum shorter than planitibia, which is the pass-2 credit for R2. The focal 2.098 µm value is not a free fit."
        evidence:
          - {file: models/2026-delphi10000-drosophila-persimilis-turing-wavelength-s0.py, lines: [210, 241], note: "Du sweep", supports: true}
          - {file: models/2026-delphi10000-drosophila-persimilis-turing-wavelength-s0.py, lines: [274, 292], note: "β endpoint integrations", supports: true}
      morphometric-validation:
        value: 90
        rationale: "Centroids are not equal to their references (2.0967 vs 2.098 µm; 1.955 vs 1.947 µm; 2.807 vs 2.735 µm). Pearson r = 0.9993 against a 0.98 gate, RMSE = 0.033 µm against a 0.05 µm band, ablation ratio 0.051 against a null of 1, KS = 0.505 against a null of 0. Five-seed SD and N=64/N=96 relative error are reported."
        evidence:
          - {file: models/2026-delphi10000-drosophila-persimilis-turing-wavelength-s0.py, lines: [531, 662], note: "non-circular measurement records", supports: true}
          - {file: models/2026-delphi10000-drosophila-persimilis-turing-wavelength-s0.py, lines: [294, 324], note: "multi-seed SD and grid convergence", supports: true}
      source-traceability:
        value: 92
        rationale: "Crossref-checked DOIs for the focal inversion paper, the predecessor, the Hawaiian successor, Turing, Schnakenberg, Gierer–Meinhardt, and the retinal lattice. The scout note records the two catalog DOIs that do not resolve. SHA-256 covers the reference, plate, bibliography, README, and scout manifest."
        evidence:
          - {file: datasets/drosophila_persimilis_turing_wavelength_s0/paper_citations.bib, lines: [1, 55], note: "verified bibliography", supports: true}
          - {file: datasets/drosophila_persimilis_turing_wavelength_s0/scout_manifest.json, lines: [1, 30], note: "no collision with slot 2891", supports: true}
      code-traceability:
        value: 88
        rationale: "dispersion_for_wavelength, lambda_of_species, ablation_control, and the Lean theorems are the same statements. The docstring and claim boundary separate the assigned tier from the papers."
        evidence:
          - {file: morphoeval/lean/loops/Loop_3198_drosophila_persimilis_turing_wavelength_s0.lean, lines: [24, 44], note: "order, Hawaiian step, k·λ identity", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-drosophila-persimilis-turing-wavelength-s0.yaml, lines: [1, 40], note: "model_spec pins Du, grid, seed, age", supports: true}
      repro-package:
        value: 90
        rationale: "Re-running --self-test on the pass-2 tree passed every assertion, including Pearson r > 0.98, ablation, β order, and convergence. The renderer writes a 640×480, 15-frame GIF. Dependencies are the repo scientific stack. No nanopub profile was present, so nothing was signed."
        evidence:
          - {file: models/2026-delphi10000-drosophila-persimilis-turing-wavelength-s0.py, lines: [664, 720], note: "self-test and CLI", supports: true}
          - {file: models/2026-delphi10000-drosophila-persimilis-turing-wavelength-s0.py, lines: [82, 102], note: "dataset hash gate", supports: true}
    remediation:
      - id: R1
        item: "Mitigated, not closed. KS = 0.505 separates the gallery plate from the activator. An electron or light micrograph of D. persimilis pigment at 2.1 µm is still missing; Commons had no CC bitmap."
      - id: R2
        item: "Addressed as a sensitivity, not as an empirical fit. Integrated β endpoints keep the predecessor shorter than the successor. β = 0.42 is still a transfer from catalog body lengths."
      - id: R3
        item: "Addressed for the imposed-seed concern. Ablation ratio 0.051 is in the measurement set. A long noise-seeded run that selects k_c without a cosine initial condition is still not shown."
