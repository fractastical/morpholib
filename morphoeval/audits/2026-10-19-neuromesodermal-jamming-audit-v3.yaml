        evidence:
          - {file: 2022-tailbud-neuromesodermal-jamming.py, lines: [808, 878], note: "3 Dray fibronectin regimes and 12-point fn_scale sweep with monotonicity flags", supports: true}
          - {file: 2022-tailbud-neuromesodermal-jamming.py, lines: [920, 973], note: "5-regime Mongera/Lawton perturbation evaluator (unchanged semantics; channeling now included)", supports: true}
          - {file: 2022-tailbud-neuromesodermal-jamming.py, lines: [1980, 1995], note: "CLI: --phi-ecs-mpz, --phi-ecs-apsm, --sigma-a-mpz, --fn-scale, --clock-period, --steps, --seed, --self-test", supports: true}
