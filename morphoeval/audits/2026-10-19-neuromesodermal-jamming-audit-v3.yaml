simulations:
  - id: tailbud-neuromesodermal-jamming
    name: "Mongera et al. (2018) & Kim et al. (2021) zebrafish tailbud active fluid-to-solid jamming transition & yield-stress axis elongation"
    organism: "Danio rerio (zebrafish tailbud mesodermal progenitor zone MPZ & presomitic mesoderm PSM)"
    script: 2022-tailbud-neuromesodermal-jamming.py
    output: docs/media/neuromesodermal_jamming_comparison.png
    extra_outputs:
      - docs/media/neuromesodermal_jamming_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-neuromesodermal-jamming-audit-v2
    source_refs:
      - mongera2018
      - kim2021
      - lawton2013
      - serwane2017
      - dray2013
      - soroldoni2014
      - herrgen2010
      - hubaud2017
      - lewis2003
    claim_boundary:
      reported_in_source:
        - "Mongera et al. (2018) Nature 561:401-405 Figs. 1-4: along the posterior-to-anterior axis of the zebrafish tailbud, extracellular space fraction phi_ECS(x) decreases from ~14.5% in the posterior Mesodermal Progenitor Zone (MPZ) to ~4.9% in the Anterior Presomitic Mesoderm (A-PSM), driving cell packing phi_pack = 1 - phi_ECS across the rigidity-percolation threshold phi_c approx 0.860 and elevating ferrofluid-measured yield stress sigma_y(x) from ~11 Pa to ~118 Pa while active Myosin-II tension fluctuations sigma_A(x) decline from ~50 Pa to ~13 Pa."
        - "Kim et al. (2021) Nature Physics 17:859-866 & Mongera et al. (2018) Fig. 4: active tension fluctuations fluidize the MPZ (sigma_A > sigma_y) via frequent T1 neighbor exchanges, whereas the jammed solid A-PSM (sigma_y >> sigma_A) serves as an internal mechanical backstop that rectifies MPZ progenitor addition into unidirectional posterior elongation and preserves left-right symmetry; N-cadherin (cdh2) knockdown expands phi_ECS > 14%, unjamming the PSM, slowing elongation, and inducing bilateral body-axis asymmetry."
        - "Dray et al. (2013) Current Biology 23:1335-1341 Figs. 1-4: a fibronectin matrix wraps the tailbud and PSM; fn1a;fn1b double morphants and itga5 morphants lose this boundary, elongate the trunk more slowly and show altered posterior tissue shape and mechanics (the script vendors these as APPROXIMATE ratios, v/v_WT ~0.70 / ~0.82, width ~1.20 / ~1.08, +/-25%)."
        - "Herrgen et al. (2010) / Soroldoni et al. (2014): the zebrafish her1/her7 clock period is ~23.5 min at 28 C and clock waves slow and compress toward the anterior PSM before arresting into somite stripes (Cooke-Zeeman S = v_front T)."
      reconstructed_in_script:
        - "Continuous posterior-to-anterior active-foam & Bingham viscoplastic solver across x in [0, 300] um (`solve_ap_jamming_profile`, r_sigma_y = 0.9989, r_kT1 = 0.9922, jamming crossover x* = 81.0 um) and 2D U-shaped tailbud cellular flow simulator across 5 experimental regimes (WT Control, cdh2 Morphant, Blebbistatin, SU5402, Zero-Backstop Ablation; v_elong r = 0.9748, L-R asymmetry r = 0.9851)."
        - "(Pass 3) Quasi-3D fibronectin sheath: f_FN(x) profile, hoop equilibrium eps_r = max(0, sigma_A - sigma_y)/(K_FN f_FN + K_t), equilibrium radius R_eq(x), influx-weighted channeling chi (0.951 WT, 0.907 itga5 MO, 0.736 fn1a;fn1b MO) multiplying the elongation speed, tailbud width ratio (1.04 / 1.08 / 1.24), 12-point fn_scale sweep (monotonic), and a diagnostic wall-friction force F_drag."
        - "(Pass 3) Her1/Her7 clock phase advection in the tip frame with a mechanical arrest gate sigma_y/sigma_A >= 4 (x_arrest = 161.1 um > x_jam = 81.0 um), Cooke-Zeeman somite length S = (v_elong + 0.45) * 23.5 min = 46.2 um, frozen her1 stripe wavelength 46.2 um measured on the kymograph, per-regime arrest fronts (cdh2 and ablation: none), and somite-border fibronectin feedback into the sheath profile."
        - "Nuclear-seeded Voronoi tessellation and regional interstitial space segmentation of the Danio rerio posterior tailbud lightsheet micrograph (`zebrafish_tailbud_psm_specimen.jpg`, IDR0051, N = 391 nuclei, <z> = 5.88, AP compaction r = 0.9915)."
      transfer_boundary:
        - "2D dorsal-ventral optical-plane projection of the 3D U-shaped zebrafish posterior tailbud and paraxial presomitic mesoderm; the fibronectin sheath is a thin-rod axisymmetric reduction (one radius per AP position), not a 3D boundary mesh."
        - "The sheath channeling argument (influx stored in radial dilation is lost to elongation) is a transient-window argument, not a steady-state Stokes balance; K_FN and K_t are calibrated to the approximate Dray et al. (2013) ratios; the dynamic ECM friction F_drag does not feed back on v_elong."
        - "The clock is a phase oscillator with a prescribed frequency profile and a mechanical arrest gate (Lambda_arrest = 4, a modelling choice standing in for the FGF/Wnt determination front and Yap mechanosensitivity), not the Lewis (2003) her1/her7 delay-differential oscillator; v_PSM-shortening = 0.45 um/min and the ~47 um somite length are approximate anchors."
      does_not_claim:
        - "Does not model 3D notochord vacuolation turgor mechanics, anterior somite epithelialization clefting, an FGF8/Wnt morphogen determination front, Delta-Notch phase coupling, or a full axisymmetric/3D Stokes-Bingham solve with fibronectin traction boundary conditions."
    summary: >-
      Pass 3 (v3) evaluation of `2022-tailbud-neuromesodermal-jamming.py` (90.0/100, down 1.4 from
      91.4 in Pass 2). The one open v2 item is closed in a reduced, explicitly labelled form: a
      quasi-3D fibronectin sheath (`compute_sheath_channeling`, L452-499) couples Dray et al. (2013)
      cell-fibronectin loss to tailbud widening and slower elongation through a hoop-equilibrium
      channeling factor (fn1a;fn1b MO v/v_WT = 0.79 vs ~0.70, width 1.24 vs ~1.20), and a Her1/Her7
      clock advection solver (`solve_segmentation_clock_arrest`, L546-640) arrests the clock at a
      jamming-ratio gate strictly anterior to the fluid-to-solid crossover (161 vs 81 um) and yields
      Cooke-Zeeman somites of 46.2 um (ref ~47 um; frozen stripe wavelength 46.2 um), with somite
      fibronectin feeding back into the sheath. Six Lean 4 theorems (2 new), 14 measurements (6 new),
      13 self-test checks and 9 DOIs back the script. The score drops slightly because the new modules
      multiply a still-phenomenological elongation law (prefactor, tanh fluidity, hard-coded asymmetry
      overrides at L716-728), the new reference values are approximate digitisations, the arrest gate
      and several clock constants are uncited modelling choices, and row C carries no specimen.
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          The Mongera/Kim laws of Pass 2 are unchanged and remain faithful: cell packing, Maxwell
          coordination, rigidity-percolation yield stress, Kramers T1 rate, Bingham strain rate and the
          continuous AP crossover solver (L194-390). Pass 3 adds the requested fibronectin and clock
          couplings as reduced models that are honest about their status: a hoop-equilibrium sheath
          with an explicit calibration note (L398-514; reference JSON L269-286) and a phase-advection
          clock with a mechanical arrest gate (L521-640), both wired bidirectionally into the jamming
          gradient (arrest front -> somite fibronectin -> channeling -> v_elong -> somite length) and
          backed by Lean Theorems 5-6. Deductions: the remediation asked for ECM boundary FRICTION, and
          the implemented coupling is confinement — the computed wall-friction force (L485-486) is
          reported but never feeds back (-3); the channeling factor is a transient stored-volume
          argument rather than a steady-state force balance, and it multiplies an elongation law that is
          still a calibrated product (J prefactor 2.034, tanh(sigma_A/29) fluidity, blebbistatin/SU5402
          asymmetry overrides at L716-728) (-4); Lambda_arrest = 4, the u(x) floor 0.15 and c_slow = 0.6
          (L576-583) are modelling choices without a cited measurement, and the clock is a phase model,
          not the Lewis (2003) DDE (-3). Down 3 from v2 because the new modules make the phenomenological
          core more visible, not less.
        evidence:
          - {file: 2022-tailbud-neuromesodermal-jamming.py, lines: [194, 390], note: "Unchanged Pass 2 active-foam laws: packing, isostatic z, rigidity-percolation sigma_y, Kramers k_T1, Bingham rate, AP crossover solver with NaN-safe Pearson r", supports: true}
          - {file: 2022-tailbud-neuromesodermal-jamming.py, lines: [398, 514], note: "Quasi-3D fibronectin sheath: R_0(x), f_FN(x) with somite feedback, hoop strain, influx-weighted channeling chi, diagnostic wall friction F_drag", supports: true}
          - {file: 2022-tailbud-neuromesodermal-jamming.py, lines: [521, 640], note: "Her1/Her7 clock: mechanical arrest gate, tip-frame upwind advection with pacemaker, steady-state initial phase, frozen-stripe wavelength measurement", supports: true}
          - {file: 2022-tailbud-neuromesodermal-jamming.py, lines: [683, 728], note: "2D simulator: sheath channeling multiplies the elongation law; J prefactor, tanh fluidity and hard-coded blebbistatin/SU5402 asymmetry overrides remain phenomenological", supports: false}
          - {file: morphoeval/lean/loops/Loop_030_neuromesodermal_jamming.lean, lines: [150, 247], note: "Theorems 5-6: sheath stiffness ordering => larger morphant hoop strain and lower channeling; arrest front strictly anterior to x_jam and somite length monotone in wavefront speed (lean verified, 0 sorry)", supports: true}
      specimen-match:
        value: 88
        rationale: >-
          Panels A5, B1 and B5 still carry the SHA-256-verified IDR0051 *Danio rerio* tailbud lightsheet
          micrograph with N = 391 segmented nuclei, Voronoi coordination <z> = 5.88 and AP interstitial
          compaction matching Mongera et al. (2018) with r = 0.9915 (`segment_zebrafish_tailbud_specimen`,
          L980-1092), and the four 2D regimes in A1-A4 remain visually distinct (jammed anterior plasma
          colouring vs uniformly fluid cdh2/ablation fields, widened cdh2 envelope). Deductions: the new
          row C (L1478-1601) compares the sheath envelope, kymograph and frozen stripes only with model
          references and approximate literature ratios — no fibronectin immunostain or her1 in situ
          specimen is vendored, so the specimen does not test either new mechanism (-6); the fn1a;fn1b
          2D regime is simulated (L1142-1153) but not rendered as a spatial panel, so the predicted
          wider tailbud is shown only as an envelope curve (-3); the kymograph's posterior synchronous
          band and anterior frozen stripes are qualitatively right but no comparison image from
          Soroldoni et al. (2014) is placed beside it (-3).
        evidence:
          - {file: 2022-tailbud-neuromesodermal-jamming.py, lines: [980, 1092], note: "CV nuclear & Voronoi segmentation of IDR0051 zebrafish tailbud lightsheet micrograph (N=391 nuclei, r=0.9915)", supports: true}
          - {file: docs/media/neuromesodermal_jamming_comparison.png, lines: [0, 0], note: "15-panel figure: specimen overlay (A5), specimen compaction vs model (B1), Voronoi P(z) (B5); row C sheath envelope, her1 kymograph, frozen stripes, Dray regimes, fn_scale sweep", supports: true}
          - {file: docs/media/neuromesodermal_jamming_growth.gif, lines: [0, 0], note: "4-panel animation: WT and cdh2 2D foams, AP crossover profile, and the Her1/Her7 kymograph filling in with the arrest front and x_jam marked", supports: true}
          - {file: 2022-tailbud-neuromesodermal-jamming.py, lines: [1478, 1601], note: "Row C has no vendored specimen (no FN immunostain, no her1 in situ); comparisons are to approximate literature ratios and to the model's own Cooke-Zeeman S", supports: false}
      parameter-expressivity:
