# MorphoEval audit — Mongera et al. (2018) Nature & Kim et al. (2021) Nature Physics Zebrafish Tailbud Fluid-to-Solid Jamming Transition, 2026-10-19 (v3)
#
# Pass 3 re-score of `2022-tailbud-neuromesodermal-jamming.py` (v3, 2019 lines) after the remediation of the single
# open v2 item in the instrumented loop `morphoeval/runs/2026-10-19-neuromesodermal-jamming-loop-pass3`, superseding
# `2026-10-19-neuromesodermal-jamming-audit-v2` (91.4). Same protocol as Passes 1-2 (primary assessor + second
# assessor rubric protocol); line numbers refer to the files at commit d58a084 plus the uncommitted Pass 3 edits
# recorded in the loop ledger.
#
# What Pass 3 changed (the one v2 remediation item, closed in a REDUCED and explicitly labelled form):
#   1. Quasi-3D fibronectin ECM sheath (Dray et al. 2013): thin-rod axisymmetric reduction of the 3D paraxial column.
#      f_FN(x) wraps the tailbud/PSM; hoop equilibrium eps_r = max(0, sigma_A - sigma_y)/(K_FN f_FN + K_t) sets the
#      equilibrium radius R_eq(x); the influx fraction stored in radial dilation lowers the axial channeling chi that
#      multiplies the Bingham-backstop elongation speed (v/v_WT = 0.79 for fn1a;fn1b MO vs ~0.70 reported, width 1.24
#      vs ~1.20). Dynamic cell-ECM wall friction F_drag is computed but only reported (diagnostic).
#   2. Her1/Her7 clock phase advected in the tip frame with a posterior pacemaker, Soroldoni-type slowing and arrest
#      anterior to a mechanical gate sigma_y/sigma_A >= 4 (x_arrest = 161 um, strictly anterior to x_jam = 81 um);
#      Cooke-Zeeman somite length S = (v_elong + v_short) T = 46.2 um (ref ~47 um); frozen stripe wavelength on the
#      kymograph 46.2 um; cdh2 morphant never reaches the gate (no arrest front). Arrested somites add fibronectin
#      that feeds back into the sheath profile, so the coupling is bidirectional.
#   3. 3 Dray-2013 fibronectin regimes, 12-point fn_scale sweep (monotonic), CLI --fn-scale / --clock-period,
#      6 new measurements (14 total), self-test 8 -> 13 checks, 2 new Lean 4 theorems (6 total, 0 sorry),
#      4 new DOIs in the bib/reference JSON (SHA re-pinned), row C (5 panels) in the PNG and a 4th GIF panel.
#
# Scores below: overall 90.0 (down 1.4 from 91.4). The remediation is credited, but writing the reduced sheath and
# clock modules exposed that (a) the elongation law remains a calibrated phenomenological product (prefactor,
# tanh fluidity, hard-coded blebbistatin/SU5402 asymmetry overrides) that the new modules multiply rather than
# replace, (b) the fibronectin reference ratios are approximate digitisations, (c) the arrest gate Lambda = 4 and
# several clock constants are modelling choices without a cited measurement, and (d) row C has no specimen.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).

