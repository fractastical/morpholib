          - {file: 2021-pringle-roman-esco-fractal-inflorescence.py, lines: [340, 356], note: "generate_3d_meristem_tree docstring discloses the prescribed envelope and the emergent-angle coupling", supports: true}
          - {file: 2021-pringle-roman-esco-fractal-inflorescence.py, lines: [429, 441], note: "Uncited geometric heuristics (radial exponents, tilt, child scale/time factors)", supports: false}
          - {file: morphoeval/math_kg_loops/pringle-roman-esco-fractal-inflorescence.yaml, lines: [81, 121], note: "Laws 4-5 registered with formulas, Lean declarations, loci and roles", supports: true}
