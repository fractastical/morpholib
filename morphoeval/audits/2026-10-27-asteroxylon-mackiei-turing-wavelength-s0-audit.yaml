simulations:
  - id: delphi10000-asteroxylon-mackiei-turing-wavelength-s0
    name: "Asteroxylon mackiei Schnakenberg critical wavelength at 5.2 µm (Pass 1)"
    organism: "Asteroxylon mackiei (Early Devonian Rhynie Chert lycopsid)"
    script: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py
    output: docs/media/asteroxylon_mackiei_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [kidston1920, turing1952, schnakenberg1979, hetherington2021, edwards2017]
    summary: >-
      Pass 1 implements Schnakenberg kinetics with the critical wavelength fixed
      at 5.2 µm (k_c = 2π/5.2e-6 m⁻¹), δ = D_v/D_u = 160, and a periodic
      156 µm × 117 µm tracheid-file window (30 critical wavelengths). The
      homogeneous state has trace -0.16 and determinant 1. σ(k_c) = 0.396 and
      the equal-diffusion control has σ_max = -0.080. A δ sweep at fixed D_u
      shortens the wavelength monotonically. The basic look composites the
      activator onto a CC BY-SA compression fossil (Kenraiz); full-frame
      grayscale Pearson r = 0.98950 and RMSE = 7.425 gray levels. The plate's
      spectral centroid of the activator is 7.646 µm, not 5.2 µm. Age is 407 Ma.
      Not yet scored at Pass 1: a row hold-out, a gray-level KS, and a measured
      axis-envelope wavelength. The measurement sidecar is regenerated from the
      final module, so it also lists those three Pass 2 numbers; this audit's
      morphometric score does not credit them.
    claim_boundary:
      reported_in_source:
        - "Kidston & Lang 1920: Asteroxylon mackiei has an actinostele and leaf traces into microphylls (DOI 10.1017/s0080456800004506)."
        - "Edwards, Kenrick & Dolan 2017: the Rhynie Chert is an Early Devonian (Pragian) terrestrial deposit, taken here as 407 Ma."
        - "Turing 1952: a finite critical wavenumber k_c when inhibitor and activator diffuse at different rates."
        - "Schnakenberg 1979: the two-species kinetics used for the calibration."
        - "Hetherington et al. 2021: evidence-based whole-plant habit of Asteroxylon mackiei."
      reconstructed_in_script:
        - "D_u is solved so that λ_c = 5.2 µm at δ = 160; the domain is 30 wavelengths long (156 µm)."
        - "Fourier pseudospectral integration of the periodic Schnakenberg system, seed 3124."
        - "δ sweep at fixed D_u and an equal-diffusion ablation (σ_max < 0)."
        - "Basic-look composite of the activator onto the Kenraiz plate at fixed α = 0.32."
      transfer_boundary:
        - "The vendored photograph is a centimetre-scale compression. Metres per pixel are the model scale bar, not a thin-section calibration."
        - "5.2 µm is this slot's detail-tier wavelength. It is not a published histological period for Asteroxylon pigment."
      does_not_claim:
        - "Does not claim the PDE reconstructs microphyll phyllotaxis from a homogeneous shoot."
        - "Does not claim the 283 µm enation-sibling parameters; that wavelength is only the scale ratio 54.5."
        - "Does not claim Cooksonia or a Baragwanathia-grade successor was simulated."
        - "Does not claim a signed nanopublication; no local nanopub profile was present."
    scores:
      model-fidelity:
        value: 88
        rationale: >-
          The steady state, Jacobian, quadratic growth rate, and the k_c formula
          are the Schnakenberg–Turing system, with D_u set by λ_c = 5.2 µm.
          Diffusion is integrated in Fourier space. The basic-look composite is
          a visualization on the fossil plate, not a claim that the PDE grows
          the compression from noise.
        evidence:
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [93, 127], note: "Jacobian at steady state and quadratic growth rate σ(k)", supports: true}
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [163, 199], note: "periodic pseudospectral Schnakenberg step", supports: true}
      specimen-match:
        value: 80
        rationale: >-
          The last GIF frame is the Kenraiz plate with the activator darkening
          the leafy axis, so the side-by-side basic look is the same fossil.
          Pass 1 fixed α = 0.32 on the whole frame (r = 0.98950). That is a
          conditioned render, and the centimetre-scale plate does not show a
          5.2 µm stripe. Score stays at 80 until a hold-out row test exists.
        evidence:
          - {file: docs/media/asteroxylon_mackiei_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen plate beside the composite", supports: true}
          - {file: docs/media/asteroxylon_mackiei_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame growth GIF, 640×480", supports: true}
      parameter-expressivity:
        value: 86
        rationale: >-
          At fixed D_u, raising δ from 8 to 320 shortens λ_c monotonically and
          the sweep is plotted. The equal-diffusion control is on the dispersion
          panel. α was not yet chosen by a contrast rule.
        evidence:
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [129, 161], note: "λ(δ) at fixed D_u and equal-diffusion σ_max", supports: true}
          - {file: docs/media/asteroxylon_mackiei_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "dispersion panel and δ sweep", supports: true}
      morphometric-validation:
        value: 82
        rationale: >-
          Pass 1 reports full-frame Pearson r = 0.98950, RMSE = 7.425 gray
          levels, activator spectral centroid 7.646 µm against the 5.2 µm law,
          plate foreground / circularity / coherency, and σ_max of the
          equal-diffusion control. It does not yet report a hold-out r, a KS
          distance, or the plate envelope in micrometres. Those three are
          remediation, so this dimension does not receive Pass 2 credit.
        evidence:
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [201, 282], note: "plate segmentation, centroid, and full-frame Pearson/RMSE", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Kidston & Lang, Turing, Schnakenberg, Hetherington, and Edwards DOIs
          are in the bibliography. The plate is CC BY-SA 4.0, Kenraiz, SHA-256
          pinned, with the Wikimedia file page in the reference JSON.
        evidence:
          - {file: datasets/asteroxylon_mackiei_turing_wavelength_s0/paper_citations.bib, lines: [1, 80], note: "Crossref-checked DOIs", supports: true}
          - {file: datasets/asteroxylon_mackiei_turing_wavelength_s0/asteroxylon_mackiei_turing_wavelength_s0_reference.json, lines: [1, 40], note: "5.2 µm, 407 Ma, specimen SHA-256 and license", supports: true}
      code-traceability:
        value: 84
        rationale: >-
          Module docstring names the kinetics and k_c. Lean 4 Loop_3124 proves
          the diffusion-ratio threshold, the 30-mode count, the >50× separation
          from the 283.4 µm sibling, and the negative trace, with no sorry.
        evidence:
          - {file: morphoeval/lean/loops/Loop_3124_asteroxylon_mackiei_turing_wavelength_s0.lean, lines: [15, 51], note: "four theorems, zero sorry", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-asteroxylon-mackiei-turing-wavelength-s0.yaml, lines: [1, 40], note: "laws pinned to the Lean declarations", supports: true}
      repro-package:
        value: 86
        rationale: >-
          Seed 3124, SHA-256 pins on the five dataset files, and --self-test
          asserts trace, determinant, σ(k_c) > 0, control σ_max < 0, monotonic
          sweep, r > 0.98, 5.2 µm, and 407 Ma. Pass 1 self-test passed at
          r = 0.98950.
        evidence:
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [66, 90], note: "pinned SHA-256 of the dataset", supports: true}
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [573, 609], note: "self-test gates", supports: true}
    remediation:
      - id: R1
        item: "Choose activator contrast on the top 75% of rows only and report Pearson r on the held-out bottom 25%."
      - id: R2
        item: "Add a two-sample KS distance between the plate and the last-frame gray histograms, with reference 0."
      - id: R3
        item: "Measure the leafy-axis envelope wavelength in micrometres under the model scale bar and set it beside 5.2 µm."
