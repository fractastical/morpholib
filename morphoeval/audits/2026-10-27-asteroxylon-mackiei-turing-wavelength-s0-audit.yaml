# MorphoEval Pass 1 — Asteroxylon mackiei, 5.2 µm Turing wavelength, slot 3124.
# Single assessor (grok-4.7). Pass 1 ran the Schnakenberg law, the δ sweep,
# the equal-diffusion control, and the basic-look composite.
# Full-frame Pearson r = 0.98950, RMSE = 7.425 gray levels, σ(k_c) = 0.3961,
# equal-diffusion σ_max = -0.0800, spectral centroid = 7.646 µm, age = 407 Ma.
# Three gaps were left open on purpose and are the remediation list: no spatial
# hold-out, no gray-level KS, and the plate-versus-stripe scale gap stated only
# in prose. Those are scored in the superseding audit, not here.
