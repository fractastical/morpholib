    claim_boundary:
      reported_in_source:
      - Turing (1952) gives the diffusion-driven instability and a critical wavenumber. Schnakenberg (1979) gives
        the two-species kinetics used here.
      - Carson & Bryant (1979) report a mean of 20-30 extra tibial cilia in northeast Hawaiian D. silvestris males,
        absent in D. heteroneura. They do not report a 3 µm wavelength.
      - Gompel et al. (2005) attribute macroscopic Drosophila wing spots to cis-regulatory evolution.
      reconstructed_in_script:
      - Detail-tier wavelength 2.995e-6 m (log10 = -5.524), diffusivity ratio 20, and the chronoseries contrast
        with D. serrata (9.226e-5 m) and D. simulans (8.256e-5 m) are assigned for this slot and reconstructed from
        the dispersion relation.
      - Pass-1 readout is the single loudest Fourier mode of the linearised PDE. Pass-1 mask is every dark foreground
        pixel.
      transfer_boundary:
      - The wavenumber comparison is a scale contrast inside one chronoseries. It does not say that D. serrata or
        D. simulans evolved into D. silvestris, and it does not transfer to embryonic pair-rule stripes.
      does_not_claim:
      - Does not claim the Kilohana wing spots, or the 20-30 extra tibial cilia, are produced by a 2.995 µm Schnakenberg
        pattern.
      - Does not claim a second assessor scored this pass. Signing keys were not present.
