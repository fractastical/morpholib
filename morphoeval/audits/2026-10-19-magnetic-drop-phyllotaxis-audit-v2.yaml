        - "Exact 2-drop and full-chain Hessian fold (G_fold = 0.773484 exp / 2.514560 lin) and dynamical pitchfork (G_c1 = 0.860537 exp / 3.631432 lin) roots, regular-spiral zero-force equilibrium locus F(G, dphi) = 0, and adiabatic continuation along both Fibonacci (r = 0.99999, RMSE = 0.065 deg) and Lucas (RMSE = 0.141 deg) branches"
        - "Difference-of-Gaussians (DoG) scale-umbo segmentation (N = 123 scales) and log-polar (u = ln r, theta) 2D FFT spiral spectrum extraction confirming opposing (m_CW, m_CCW) = (5, 8) Fibonacci parastichies on `conifer_cone_specimen.jpg`"
