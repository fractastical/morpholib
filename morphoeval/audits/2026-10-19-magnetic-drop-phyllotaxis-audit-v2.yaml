        - "Douady & Couder (1992) Phys. Rev. Lett. 68:2098-2101 iterative magnetic-dipole repulsion energy E(phi) = sum_{k>=1} d_k(phi, phi_{n-k})^{-3} on a circular rim r = R_0 controlled by dimensionless plastochron ratio G = V * T / R_0"
        - "Douady & Couder (1992) Fig. 3 & (1996) J. Theor. Biol. 178:255-274 supercritical (1,1)->(1,2) pitchfork bifurcation and imperfect pitchfork cascade along the Fibonacci branch (1,2,3,5,8,13) -> 137.508 deg and disconnected Lucas branch (1,3,4,7,11) -> 99.502 deg"
