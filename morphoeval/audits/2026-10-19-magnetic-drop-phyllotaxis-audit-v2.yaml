      regular-spiral equilibrium locus F(G, dphi) = 0 across both the Fibonacci cascade
      (r = 0.99999, RMSE = 0.065 deg across 10 benchmark G points; Delaunay pair (5, 8) at G=0.06)
      and the disconnected Lucas branch (1,3)->(3,4)->(4,7)->(7,11) (RMSE = 0.141 deg; Delaunay
      pair (4, 7) at G=0.11), runs repulsive power-law universality sweeps (gamma in {1, 3, 5}),
      single-drop memory ablation (N_mem = 1 -> 180.0 deg), and Voronoi packing regularity KS
      tests (CV = 0.132 vs random CV = 0.612, p < 1e-8), and segments N = 123 woody scale umbos
      on `conifer_cone_specimen.jpg` with log-polar 2D FFT extraction confirming opposing (5, 8)
      Fibonacci parastichies.
