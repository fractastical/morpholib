    summary: >-
      Pass 2 post-remediation evaluation of `1992-douady-magnetic-drop-phyllotaxis.py` (91.2/100,
      up from 55.6/100 in Pass 1; +35.6 overall). The remediated v2 script implements both
      linear silicone-oil dish advection r_k = R_0*(1 + k*G) and exponential shoot apical
