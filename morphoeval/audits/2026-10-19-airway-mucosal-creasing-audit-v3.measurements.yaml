  - name: 12-point 3-species bronchial fold wavenumber scaling correlation (Human, Bovine, Ovine)
    value: 0.9986
    unit: Pearson r
    method: Linear regression of predicted m* = c_cyl*(R_0/h_m)*(3*mu_s/mu_m)^(1/3) vs observed fold count across
      12 airway states in 3 species (p=4.82e-14, RMSE=0.82 folds)
    reference_value: 1.0
    reference_source: Li et al. (2011) JMPS 59:758-774 Eq. (18) & Eskandari et al. (2015) JTB 403:209-218 Eq. (14)
    note: RMSE = 0.82 folds, p = 4.82e-14
    derived_from: script
  - name: Log-log inverse mucosal thickness scaling exponent alpha (m* ~ (h_m/R_0)^alpha)
    value: -0.94
