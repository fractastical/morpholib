    claim_boundary:
      reported_in_source:
      - 'Wiggs et al. (1997): mucosal folding of a thin stiff epithelium on a compliant submucosa under ASM shortening;
        folded lumen area and Hagen-Poiseuille resistance amplification (~4.5x normal, >15x in severe asthma)'
      - 'Li et al. (2011) / Eskandari et al. (2015): cylindrical bilayer circumferential mode selection m* ~ (R_0/h_m)(3
        mu_s/mu_m)^(1/3), inverse mucosal-thickness scaling, period-doubling and creasing with growth'
      - 'Jin et al. (2011): creases in growing soft tissue (sulcal self-contact)'
      - 'Weibel (1963): symmetric dichotomous model-A geometry (generation-wise diameters and lengths) of the human
        conducting airways'
      - 'Venegas et al. (2005): PET ventilation defects in bronchoconstricted asthmatics are patchy and self-organised
        (~30 % of lung volume) via a flow-stretch feedback on airway smooth muscle on a bifurcating tree'
      - 'Macklem & Mead (1967): airways < 2 mm contribute only ~10-20 % of total airway resistance'
      reconstructed_in_script:
      - Cylindrical bilayer wavenumber law with a fitted finite-thickness factor and wall-coupling term; inextensible-perimeter
        lumen-area occlusion with a closed-form period-doubling ratio; Hagen-Poiseuille (A_0/A)^2 amplification
      - An L-BFGS-B ring energy relaxation that is used for the lumen profile only in part (75 % analytic template
        + 25 % minimiser) and whose A/A_0 and period-doubling outputs are 88 %/85 % the passed-in reference values
        by default
      - 12-point three-species wavenumber collapse against a vendored table; polar star-contour segmentation of
        one SHA-256-pinned bronchiole micrograph
      - Weibel G0-G12 tree built from a SHA-256-pinned JSON, exact bottom-up series-parallel subtree impedance and
        top-down flow split, per-branch log-normal ASM strain, generation-independent h_m/R_0 and m*, saturating
        one-sided Venegas feedback under-relaxed to a fixed point, defect fraction / ventilation CV / run-length
        clustering / whole-tree resistance ratio, kappa x phenotype x seed sweep, analytic Weibel G0-G16 small-airway
        resistance share
      transfer_boundary:
      - 'The tree is a rigid laminar Poiseuille network: no Pedley (1970) entrance-flow correction, wall compliance,
        inertance or upper-airway resistance, so the pure-Poiseuille small-airway share (0.43) is 2-4x the measured
        Macklem & Mead (1967) 0.10-0.20 and is reported as a known limitation'
      - sigma = 0.10 is assumed (no offline measurement); kappa = 0.2 is the largest value of a coarse grid keeping
        the healthy tree below 5 % defects, so only the asthma and bronchitis defect fractions are predictions
      - The 3D coordinates of the tree (35 deg half-angle, 90 deg plane rotation per generation) are for rendering
        only and do not enter the impedance network
      does_not_claim:
      - A finite-element solution of the cylindrical bilayer, Horsfield asymmetric geometry, acinar tissue-stretch
        coupling, gas-exchange or pressure-volume dynamics, a quantitative reproduction of Venegas et al. (2005)
        PET images, or a validated pressure-controlled (fixed driving pressure) mode
