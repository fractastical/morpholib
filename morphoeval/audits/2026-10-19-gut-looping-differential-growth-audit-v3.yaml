      2011-savin-gut-looping-differential-growth.py:312-339 and 403-414 — the mesentery is a pure SVK membrane
      with no bending stiffness and no left-right rest curvature, so looping handedness is not selected (the
      Section 3 header L242-247 says so). Add a discrete Kirchhoff-Love bending term (dihedral-angle hinge
      energy across each interior edge, stiffness E_m h_m^3 / 12(1 - nu^2)) and a Pitx2-driven leftward rest
      tilt of the fan (Davis 2008 / Kurpios 2008) so that the writhe sign is reproducible across seeds; assert
      it in self_test.
    - >-
      2011-savin-gut-looping-differential-growth.py:1566-1574 with 565-634 — the emergent R exponent across
      E8-E16 is 0.61 (cube law 1.0) and R is 21 % low / N 19 % high. Diagnose whether this is discretisation
      (ds_t = 0.72 mm at E12 vs R ~ 1 mm, ~9 rod nodes per loop) or the compression-resisting SVK sheet:
      re-run E8-E16 at n_s = 192 / n_w = 7 and with a tension-field (compression-free) membrane variant, and
