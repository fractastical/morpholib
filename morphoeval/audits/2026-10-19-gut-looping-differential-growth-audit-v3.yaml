      and a 96x7 prototype gave N ~ 11.0; the self-test tolerates 20 %. Add a 3-level refinement study
      (Richardson extrapolation of N and R) and tighten the tolerance to the extrapolated error; include the
      refined-mesh E12 N and R as measurements with the coarse/fine spread as uncertainty.
    - >-
      2011-savin-gut-looping-differential-growth.py:443-450 and 504 — E8 and E16 reach maxiter 12000 with
