# MorphoEval audit — Savin et al. (2011) Nature Vertebrate Gut Looping via Differential Growth, 2026-10-19 (v3)
#
# Pass 3 re-score of `2011-savin-gut-looping-differential-growth.py` (1791 lines) and
# `datasets/gut_looping_differential_growth/` after the Phase A remediation of the single open v2 item in the
# instrumented loop `morphoeval/runs/2026-10-19-gut-looping-differential-growth-loop-pass3`, superseding
# `2026-10-19-gut-looping-differential-growth-audit-v2` (92.6).
#   - Primary assessor: Claude Fable 5.1 (Phase B subagent, slot-062-B), scoring from the current file at
#     commit 327729c8 plus the Phase A handoff evidence and `git diff`; no second assessor this round.
#
# What Pass 3 changed (closes the one v2 remediation item):
#   1. The gut tube is now a discrete elastic rod whose nodes are SHARED with the free edge of a 2D
#      constant-strain-triangle St.Venant-Kirchhoff membrane mesh of the fan-shaped dorsal mesentery
#      (96 x 5 nodes, 760 triangles, Euler characteristic 1) carrying an apicobasal Pitx2 stiffness field
#      E_m(eta) = E_m [1 + a (2 eta - 1)] (`build_fan_mesentery_mesh` L251-300, `pitx2_stiffness_field`
#      L303-309, `cst_membrane_energy_grad` L312-339, `relax_rod_fe_mesentery` L342-507). Loop number
#      (turning number), loop radius 1/<kappa> and tortuosity now EMERGE from L-BFGS-B minimisation of
#      E_membrane + E_axial + E_bend; the Pass 2 prescribed-shape target `r_eq`, the (1 + 0.194 eps) loop-count
#      fudge, the 0.946 / 0.8 calibration divisors and the circular lambda_sim = lambda_pred(1 + 0.002 ...)
#      were deleted (`relax_kirchhoff_gut_rod` is now only an alias, L511).
#   2. New evaluations: Pitx2 gradient sweep a in {0, 0.2, 0.4, 0.6, 0.8} (L637-675), mesh-refinement check
#      96x5 -> 128x6 (L678-703), analytic-vs-finite-difference membrane gradient check (L514-546, 8.2e-11);
#      `measure_morphoeval()` 9 -> 13 entries (L1493-1645); `self_test()` 8 -> 13 checks (L1648-1744).
#   3. New SHA-256-pinned `fe_mesentery_mesh_reference.json` (assumptions flagged as such), Davis et al. 2008
#      added to the bib, two new Lean theorems (5 total, 0 sorrys), new figure
#      `gut_looping_differential_growth_pitx2_fe_sweep.png`.
#
# Why the score goes DOWN (92.6 -> ~80): the v2 scores of 94 / 90 / 93 for model-fidelity, specimen-match and
# morphometric-validation were earned by a solver that prescribed its own answer (lambda_sim = 3.1132 vs 3.12 mm,
# R_sim = 1.1499 vs 1.15 mm, N = 8.51 vs 8.5). With the calibration removed, the honest reduced model gives
# N = 9.81 (obs 8.5), R = 0.952 mm (obs 1.15), E8-E16 MAPE 19 % (N) / 21 % (R) and a log-log R_sim vs ell_*
# slope of 0.61 instead of the cube law's 1.0. The re-check of source provenance also found that the 14-point
# cross-species table reproduces lambda = 4.55 ell_* and R = 1.68 ell_* to within ~1 % with identical log-log
# slopes (0.9909 +/- 0.0027 for BOTH lambda and R), which is the signature of a table generated from the scaling
# law rather than digitised from Savin Fig. 4e-f; the v2 source-traceability score of 95 did not catch this.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files at commit 327729c8.

