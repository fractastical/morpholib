    claim_boundary:
      reported_in_source:
      - Turing 1952 dispersion relation and Murray 1981 wavenumber for a two-species reaction-diffusion system.
      - Schnakenberg 1979 kinetics du/dt = Du lap u + A - u + u^2 v, dv/dt = Dv lap v + B - u^2 v.
      - 'Ligon & McGraw 2013: male Chamaeleo calyptratus change lateral stripe brightness during contests.'
      - 'Teyssier et al. 2015: chameleon skin has a tunable guanine-nanocrystal iridophore lattice. The animals
        in that study are panther chameleons (Furcifer pardalis); the reported spacing is of order 100 nm.'
      reconstructed_in_script:
      - A = 0.062, B = 1.150, supercritical factor 1.45, and Dv_y/Dv_x = 0.42, chosen so λ_c sits on the 260.4 µm
        slot scale and the pattern is a vertical bar.
      - The 80 µm predecessor cutoff and the 10-wavelength (2.604 mm) successor envelope. The chronoseries has one
        Holocene point at 0 Ma.
      transfer_boundary:
      - Dermal chromatophore anatomy is transferred from the panther-chameleon study to C. calyptratus. The 260.4
        µm carrier is the slot scale, not a number reported by Ligon or Teyssier.
      does_not_claim:
      - Does not claim a calibrated micrometre measurement from the Wikimedia photograph, which has no scale bar.
      - Does not claim the guanine lattice spacing is 260.4 µm.
      - Does not claim a second independent assessor.
