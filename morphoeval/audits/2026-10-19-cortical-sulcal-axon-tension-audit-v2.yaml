# MorphoEval audit — Van Essen (1997) Nature, Hilgetag & Barbas (2006) PLoS Comput. Biol. & Mota & Herculano-Houzel (2015) Science Cortical Sulcal Axon Tension, 2026-10-19 (v2)
#
# Pass 2 (v2) evaluation of `2020-karbowski-cortical-sulcal-axon-tension.py` (1356 lines)
# after completing the 12-step closed remediation loop (`2026-10-19-cortical-sulcal-axon-tension-loop`):
#   - Primary assessor: Gemini 4 Argon — 93.4 / 100 (up from 55.8 / 100 in v1; +37.6 overall)
#
# Key remediation improvements verified in Pass 2:
#   1. Implemented a coupled 2D coronal elastoplastic cortical ribbon + viscoelastic
#      cortico-cortical white-matter axonal tension solver (`relax_cortical_axonal_tension_ribbon`,
#      L233-481) with connectivity matrix C_ij (`build_corticocortical_connectivity_matrix`,
#      L181-230) and towed-axon rest-length adaptation dL_{0,ij}/dt = gamma_a * max(0, T_ij - tau_0),
#      reproducing outward gyral crowns across strongly connected areas, inward sulcal fundi
#      at weakly connected boundaries, emergent coronal GI = 2.5506 (ref 2.48), and trans-gyral
#      chord-to-arc wiring economy ratio 0.4324 (V1-V2).
#   2. Implemented Hilgetag & Barbas (2006) isometric cortical column volume conservation
#      (`evaluate_hilgetag_barbas_laminar_profiles`, L519-560), reproducing gyral crown
#      radial thickening (h_gyrus = 3.141 mm), sulcal wall baseline (2.450 mm), and sulcal
#      fundus tangential stretching / thinning (h_fundus = 1.944 mm, h_gyrus/h_fundus = 1.6154
#      vs ref 1.6186, RMSE = 0.0024 mm).
#   3. Implemented the full 12-species Mota & Herculano-Houzel (2015) Science universal
#      cortical folding power-law collapse (`evaluate_mota_herculano_houzel_scaling`,
#      L563-632), achieving log-log OLS slope alpha = 1.2567 ± 0.0038 (theoretical 5/4 = 1.25),
#      Pearson r = 0.9999 (p = 1.8e-20), and 3D GI Pearson r = 0.9990 (p = 7.4e-15), plus
#      axonal tension ablation / callosotomy (k_a = 0), hyper-tension (k_a = 2.40), and
#      lissencephalic (k_a = 0, g = 1.00 -> GI = 1.0000) controls (L635-668).
#   4. Implemented computer-vision segmentation (`segment_coronal_brain_specimen`, L671-757)
#      of the SHA-256-locked coronal human cerebral hemisphere specimen
#      `datasets/cortical_sulcal_axon_tension/coronal_cortex_axon_tracts_specimen.jpg`,
#      extracting the white-matter axonal core, cortical gray-matter ribbon, convex hull
#      perimeter P_hull, 52 sulcal fundi (GI_specimen = 2.8115), and empirical gyral-to-sulcal
#      cortical thickness ratio h_gyrus / h_fundus = 1.5793 (ref 1.6186).

