# MorphoEval audit — Tozluoglu et al. (2019) Dev. Cell & Sui et al. (2018) Nat. Commun. Drosophila Wing Disc Dome & Hinge Folding, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2020-tozluoglu-wing-disc-dome-folding.py` (255 lines)
# prior to Step 12 remediation in `2026-10-19-wing-disc-dome-folding-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.8 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `generate_analytic_wing_disc_profile` (L66-92) uses a closed-form 1D Gaussian-cleft
#      + parabolic-dome ansatz rather than numerically minimizing the 2D sagittal apico-basal
#      bilayer morphoelastic energy functional (multiplicative decomposition F = F_e * F_g
#      coupled to stiff basal basement membrane mu_BM >> mu_cell and local fold remodeling)
#      via L-BFGS-B from 64 h to 96 h AEL.
#   2. `evaluate_baseline_timecourse` (L95-124) evaluates only wild-type timepoints and
#      omits the 5 crucial mechanical/genetic perturbation controls: uniform-growth
#      unpinned buckling control (g(s) = g_bar, showing phase-random buckling),
#      Collagenase / vkg-RNAi basal ECM digestion (mu_BM -> 0, showing dome flattening
#      and fold abolition), JAK/STAT (Upd) hinge overgrowth hyper-folding, and
#      dysfusion / omb loss of local tension/ECM remodeling.
#   3. The vendored CC BY-SA 2.5 Drosophila melanogaster third-instar wing imaginal disc
#      micrograph (`datasets/wing_disc_dome_folding/drosophila_wing_disc_specimen.jpg`)
#      is not loaded, segmented, or analyzed for wing disc contour, pouch/hinge/notum
#      zones, or H/N, H/H, and H/P fold transition coordinates.
#   4. Runtime SHA-256 verification of dataset assets and CLI parameter overrides
#      (`--mu-bm`, `--g-pouch`, `--jak-stat-boost`, `--remodeling`, `--seed`) are missing.

