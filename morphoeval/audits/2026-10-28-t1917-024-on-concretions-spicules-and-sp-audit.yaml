# MorphoEval audit — Thompson (1917) T1917-024, spicule rays as Plateau borders — Pass 1, 2026-10-28
#
# Single-assessor Pass 1 for `thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py`
# (v1).  LIMITATION: builder and assessor are the same agent (claude-fable-5-1); no
# independent second assessor has scored this script (remediation R1).
#
# Headline: the Neumann tension-triangle model (Thompson pp. 443-449, Dreyer/Plateau) is
# implemented exactly and its algebra is kernel-checked in Lean; the SEM plate of Grantia
# aff. indica (same genus as Thompson's Fig. 214) yields 8 three-ray spicules whose two
# closest angles differ by a median 4.2 deg while the unpaired angle deviates by 27 deg
# (ratio 4.7), i.e. Thompson's "two equal angles and one unequal" holds on this plate.
# But Pass 1 has no null control for that ratio, no parameter sweep, a single specimen
# image (n = 8, one individual, one plate), the (pair, unpaired) scatter is tautological,
# and the pre-assigned Dryad dataset was a DATASET_MISMATCH (recorded, not fitted).
# Scores below rate the simulation PACKAGE, not the truth of the claim.

