    commit: 0643f406e28a6ba3f9600caef4642142fc8be064
    note: >-
      Pass-1 commit on branch cursor/t1917-024-sponge-spicules-ab2b: dataset dir, Lean module,
      KG law yaml, v1 script and rendered outputs; plus one hotfix committed with this audit
