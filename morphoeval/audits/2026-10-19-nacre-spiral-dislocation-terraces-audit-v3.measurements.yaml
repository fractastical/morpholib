    claim_boundary:
      reported_in_source:
      - 'Cartwright & Checa (2007): nacre grows by Burton-Cabrera-Frank screw-dislocation spiral and target terraces
        on the mineral surface, with a periodic stack of beta-chitin inter-lamellar membranes (h_0 ~ 0.5 um) whose
        pores admit mineral bridges that nucleate the next tablet (Sec. 4); columnar (gastropod) nacre stacks tablets
        vertically, sheet (bivalve) nacre staggers them like bricks'
      - 'Cartwright et al. (2009): spiral and target patterns in bivalve nacre arise from screw dislocations and
        Frank-Read-type dislocation pairs; opposite-chirality pairs separated by more than 2 r_c emit closed target
        terraces'
      - 'Burton, Cabrera & Frank (1951): Gibbs-Thomson curved-step velocity v(r) = v_inf (1 - r_c / r) and the rotating
        Archimedean spiral with pitch lambda_0 = (2 pi / omega_0) r_c ~ 19 r_c'
      - 'Checa, Cartwright & Willinger (2011) and Schäffer et al. (1997): mineral bridges (tens of nm) pass through
        pores of the inter-lamellar membrane and connect vertically stacked tablets'
      - 'De Villiers (1971): orthorhombic aragonite lattice constants a = 4.9611, b = 7.9672, c = 5.7407 A'
      reconstructed_in_script:
      - Closed-form Cabrera-Levine phase fields for single screw, supercritical/subcritical Frank-Read dipoles and
        same-chirality pairs on a 2D grid with contour winding integrals, an optional direction-dependent step speed
        A(theta) with single-domain or {110} cyclic-twin averaging, a closed-terrace-ring Fourier polygonization
        measurement, a stacked-sheet driven Allen-Cahn perforation model whose per-sheet footprint is slaved to
        the terrace tier and whose bridge site is the early-phi argmax, a sigma / D_tab bridge-localisation sweep,
        a 12-species BCF pitch/omega regression, a DoG lamellar-seam segmentation of one SEM micrograph, and 7 Lean
        4 theorems on the integer/rational skeleton of these laws
      transfer_boundary:
      - 'The ''eikonal solver'' is kinematic: terrace phases are closed-form Cabrera-Levine travel functions divided
        by A(theta), not a time-stepped front-propagation PDE, and the subcritical vs supercritical dipole regime
        is selected by an `if` on d <= 2 r_c rather than emerging from the dynamics'
      - The membrane model is a stack of 2D sheets (no through-thickness phi(z)) at dx = 0.1875 um, so a perforation
        patch stands for a cluster of 40-60 nm bridges; the bridge site is the argmax of early phi, not a resolved
        growth-through-pore process; S_0, beta, eps, pore amplitude/width/density are model parameters tuned so
        that both regimes perforate on the grid
      - The 12-species lambda_obs / omega_obs table is within ~1 % of the BCF law for every species and is not traceable
        to a measured table in the cited papers; r = 0.9999 therefore tests the table's construction, not the biology
      - The SEM um/px calibration (0.019867 um/px) was anchored to h_0 = 0.50 um because the Wikimedia micrograph
        has no scale bar; only the dimensionless CV and aspect ratio are calibration-independent
      - e_6 = 0.15 is a free kinetic anisotropy amplitude; twin averaging is a mean-field superposition of A(theta)
        with no explicit twin boundaries in the spiral core
      does_not_claim:
      - A volumetric 3D phase-field of the chitin membrane, resolution of individual mineral bridges, a derived
        (not templated) gastropod tower lattice, a time-dependent eikonal or BCF step-flow simulation, literature-digitised
        species pitch/omega observations, an independently calibrated SEM scale, or validated values of e_6, S_0,
        beta or the pore statistics
