    claim_boundary:
      reported_in_source:
      - Turing 1952 and Schnakenberg 1979 select a finite critical wavenumber when the inhibitor out-diffuses the
        activator.
      - Geng, Yan and Zhou 2022 and Bartz and Gola 2018 describe the Ceratopteris notch meristem. They do not publish
        a 256 µm wavelength.
      reconstructed_in_script:
      - gamma is solved so k_c = 2*pi/256 µm. The sweep, ablation, KS statistic and voucher mask are computed in
        this script.
      - The GIF's last frame is the canonical plate so the fitness crop can see that specimen. Earlier frames are
        the stripe field.
      transfer_boundary:
      - The plate is a gallery rendering with a 100 µm bar, not a camera micrograph. The CC BY-SA file is the anatomical
        voucher.
      does_not_claim:
      - That the Schnakenberg field reproduces the plate pixel for pixel. Their radial spectra differ (KS 0.935).
      - That a 512 µm predecessor was measured. The chronoseries has one scored node, Holocene 0 Ma.
      - A signed nanopublication. No nanopub profile is present on this runner.
