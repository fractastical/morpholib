    claim_boundary:
      reported_in_source:
      - 'Thompson (1917) p. 256: Lagena shells are ''flask-shaped ... whose surface is simply that of an unduloid,
        or more frequently ... an unduloid combined with a portion of a sphere''; p. 218: the CMC surfaces of revolution
        are the plane, sphere, cylinder, catenoid, unduloid and nodoid'
      reconstructed_in_script:
      - Kenmotsu (1980) parametrisation of the Delaunay family; C1 sphere-unduloid-cylinder flask and unduloid bead
        composites fitted by bounded least squares to the meridional radius profile of 13 Fig. 84 silhouettes and
        7 photographed tests, compared against an ellipsoid null, a sphere+cylinder ablation and a free-form polynomial
        with nRMSE, Pearson r, KS statistic and 2-fold CV
      transfer_boundary:
      - The drawings are Brady's as redrawn in 1917; the photographs are 2-D side views of 3-D tests, so axisymmetry
        is tested only by bilateral symmetry of the outline; the outline test has limited specificity for egg-shaped
        shells (1/2 polythalamous controls pass)
      does_not_claim:
      - No claim about the surface-tension mechanism (hanging drop); no claim about Nodosaria chains, Orbulina or
        non-foram protists; no claim that passing tests are uniquely Delaunay rather than merely consistent; n =
        2 controls and n = 5 photographed unilocular tests are small samples
