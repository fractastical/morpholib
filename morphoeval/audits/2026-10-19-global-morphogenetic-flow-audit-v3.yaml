simulations:
  - id: streichan-global-morphogenetic-flow
    name: "Streichan et al. (2018), Mayer et al. (2010), Lefebvre et al. (2023) & Brauns et al. (2024) Drosophila global morphogenetic flow, curved-surface active nematic myosin mechanics & cell intercalation"
    organism: "Drosophila melanogaster (whole-embryo cellular blastoderm & germband extension stages 6-8)"
    script: 2018-streichan-global-morphogenetic-flow.py
    output: docs/media/global_morphogenetic_flow_comparison.png
    extra_outputs:
      - docs/media/global_morphogenetic_flow_surface_intercalation.png
      - docs/media/global_morphogenetic_flow_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-global-morphogenetic-flow-audit-v2
    claim_boundary:
      reported_in_source:
        - "Streichan, Lefebvre, Noppe, Hufnagel & Shraiman (2018) eLife 7:e27454 compressible viscous Stokes-Brinkman PDE eta*nabla^2 v + eta_b*nabla(nabla.v) - (eta/ell_H^2)*v = -nabla.sigma^a demonstrating that DV-polarized junctional Myosin-II cables plus isotropic posterior midgut invagination predict >90% (r = 0.924) of global embryonic tissue velocity"
        - "Mayer et al. (2010) Nature 467:617-621 hydrodynamic screening length ell_H = sqrt(eta/xi); Lefebvre et al. (2023) eLife 12:e78787 geometric/mechanical control of Myosin-II orientation and recruitment on the ellipsoidal embryo; Brauns et al. (2024) eLife 13:RP95521 tension-isogonal decomposition of convergent extension into cell rearrangement (T1/rosette) and cell-shape parts; Bertet et al. (2004) / Blankenship et al. (2006) junction shrinkage and 5-11-cell rosettes"
      reconstructed_in_script:
        - "64x48 2D spectral Helmholtz compressible Stokes-Brinkman solver on the 500x420 um cartographic domain (Green's function L2 error 3.6e-16), 6-regime wild-type/mutant benchmark and 30 min Lagrangian marker advection (unchanged from Pass 2)"
        - "Pass 3: 56x48 (s, phi) finite-difference solver of the same force balance ON the prolate spheroid a = 250, b = 105 um using the exact embedded covariant strain, metric and Gaussian curvature K = a^2/g_ss^2 (sphere-limit analytic residual 5.8e-3, order 2.04; curved-vs-cartographic WT vector correlation r = 0.833; 31% of nodes carry intrinsic pole-return flow), strain-rate positive-feedback myosin recruitment to its fixed point (g = 0.358, m*/m_0 = 1.70), and a 240-junction T1/rosette ledger with tension-isogonal split (125 collapses, 24 rosettes up to 10 cells, median shrink 7.75 min, intercalation share 0.64)"
        - "Automated computer-vision contour, pair-rule stripe, DV cable gradient anisotropy, and posterior midgut invagination fold segmentation on drosophila_germband_extension_specimen.jpg (IDR0151, AP/DV = 2.3853 vs 2.3810 biological, 8 stripes, spacing = 75.86 px, solidity = 0.9383)"
      transfer_boundary:
        - "Reduced curved-surface continuum: finite differences (not FEM) on a truncated (s, phi) grid with 20 um pole caps held at v = 0, single velocity-scale calibration to the 6.40 um/min WT peak, one-way myosin -> flow -> junction coupling; ledger rate constants calibrated to the Bertet (5-10 min) and Brauns (0.5-0.8) windows"
      does_not_claim:
        - "A predictive (uncalibrated) flow-correlation against measured PIV fields, two-way vertex-continuum coupling, 3D yolk/vitelline fluid-structure interaction, or digitised values for the Bertet/Blankenship/Brauns anchors (verified_offline = false)"
    source_refs:
      - streichan2018
      - mayer2010
      - lefebvre2023
      - brauns2024
      - bertet2004
      - blankenship2006
    summary: >-
      Pass 3 re-score of `2018-streichan-global-morphogenetic-flow.py` (91.0/100, down from
      92.3 in Pass 2). Both v2 remediation items were implemented in honest reduced form:
      (1) the compressible Stokes-Brinkman force balance is now also solved on the prolate
      spheroid $x^2/a^2 + (y^2+z^2)/b^2 = 1$ ($a = 250$, $b = 105\ \mu$m) by minimising the
      covariant dissipation functional assembled from the exact embedded strain
      $e_{ab} = \tfrac12(\mathbf{e}_a\cdot\partial_b\mathbf{v} + \mathbf{e}_b\cdot\partial_a\mathbf{v})$,
      so the Gaussian-curvature term $-\eta K \mathbf{v}$ ($K = a^2/g_{ss}^2$) emerges without
      hand-derived Christoffel symbols; the sphere-limit gradient mode $\nabla P_2$ reproduces
      the analytic eigenvalue $(\eta+\eta_b)\,l(l+1)/R^2 - 2\eta/R^2 + \xi$ with residual
      $5.8\times10^{-3}$ at $56\times48$ and observed order 2.04; the closed surface generates the
      pole-return circulation intrinsically (curved-vs-cartographic WT $r = 0.833$); a
      Lefebvre-2023-type strain-rate positive feedback $m_{n+1} = m_0[1 + \beta\max(0,-e_{\phi\phi})/e_{\rm ref}]$
      converges to $m^*/m_0 = 1.70$ at loop gain $g = 0.358$ (bounded iff $g < 1$, Theorem 5);
      (2) a 240-junction T1/rosette ledger on a $10\times24$ trunk lattice driven by the
      continuum cable myosin and DV contraction yields 125 collapses (72 simple T1 + 24 rosettes,
      largest 10 cells), median shrink time 7.75 min, and a tension-isogonal split
      $\lambda_{\rm total} = \lambda_{\rm int}\lambda_{\rm shape} = 1.52\times1.26 = 1.92$
      (intercalation share 0.64). Three new Lean 4 theorems (6 total, 0 sorrys) and 4 new
      measurements (11 total) were added. The score nevertheless decreases because the
      remediation exposed that the Pass 2 headline flow correlation is synthesised from the
      empirical $r$ (L1046-L1055), the morphospace map is an analytic surrogate (L1105-L1112),
      and the curved solver is not yet used for the 6-regime benchmark.
    scores:
      model-fidelity:
        value: 92
        rationale: >-
          Gains: the Pass 3 curved-surface solver implements the actual covariant force balance
          on the prolate spheroid with exact metric and curvature (L523-L697), passes a
          second-order sphere-limit analytic check (L699-L739; residual 5.8e-3, order 2.04,
          energy ratio 0.9957), and shows the closed surface producing the return flow that the
          Pass 2 model injected by hand; strain-rate positive feedback (L757-L838) and the T1
          ledger (L883-L995) add the Lefebvre-2023 and Brauns-2024 mechanisms, all backed by 6
          machine-checked Lean theorems. Losses: the 6-regime benchmark still runs on the flat
          pipeline with the ad hoc pole-return term (L404-L416) and a phenomenological
          target-velocity formula (L422-L431) that the curved solver only reproduces at r = 0.833;
          the surface solver uses one-sided finite differences at 20 um pole caps held at v = 0
          rather than a closed-surface FEM. Net -1.
        evidence:
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [523, 697], note: "Prolate-spheroid metric, Gaussian curvature, embedded covariant strain operator B, SPD assembly 2 B^T W Q B + xi M, Dirichlet pole caps, sparse solve", supports: true}
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [699, 739], note: "Sphere-limit analytic check against (eta+eta_b) l(l+1)/R^2 - 2 eta/R^2 + xi (residual 5.8e-3, order 2.04)", supports: true}
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [757, 838], note: "Curved-surface WT solve with DV director Q_pp=+1/2 and iterated strain-rate positive-feedback myosin recruitment (g = 0.358, m*/m0 = 1.70)", supports: true}
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [404, 431], note: "Flat 6-regime pipeline still adds an ad hoc pole-return circulation and rescales to a phenomenological target v_AP; curved solver not used for the regimes", supports: false}
          - {file: morphoeval/lean/loops/Loop_048_global_morphogenetic_flow.lean, lines: [180, 254], note: "Theorems 4-6 (surface gradient-mode eigenvalue >= xi, feedback fixed point iff g < 1, rosette junction balance), 0 sorrys, verified with lean", supports: true}
      specimen-match:
        value: 91
        rationale: >-
          Unchanged from v2: the CC BY 4.0 IDR0151 confocal micrograph is SHA-256-pinned and
          segmented automatically (L1125-L1190; AP/DV = 2.3853 vs 2.3810, solidity 0.9383, 8
          pair-rule stripes at 75.86 px, PMG indentation 122 px) and shown in Panel F of the main
          figure. Pass 3 adds no new specimen comparison; the prolate geometry a/b = 2.381 used by
          the curved solver is the biological value, not fitted to the specimen's 2.3853.
        evidence:
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [1125, 1190], note: "Automated confocal blastoderm contour, 8 pair-rule stripe, and PMG invagination CV segmentation", supports: true}
          - {file: docs/media/global_morphogenetic_flow_comparison.png, lines: [0, 0], note: "Panel F shows the segmented IDR0151 specimen with stripe peaks and PMG sink; Panel D shows empirical vs simulated v_AP bars", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          The 6 Streichan regimes, the curved-surface solver parameters (a, b, cap radius, grid,
          eta_b/eta, ell_H, feedback beta/e_ref/iterations) and the ledger constants (k_shrink,
          m_half, Hill n, k_grow, tau_rosette) are all exposed as function arguments and read from
          `intercalation_reference.json` (L1196-L1232). Down 2 because the remediation exposed that
          the 15x15 (ell_H x eta_b/eta) morphospace shown in Panel E is an analytic Gaussian
          surrogate (L1105-L1112) that never calls the solver, and because no CLI sweep exists for
          the new parameters (they are only varied inside the self-test).
        evidence:
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [1196, 1232], note: "Pass 3 evaluator wiring feedback and ledger parameters from intercalation_reference.json", supports: true}
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [883, 909], note: "Ledger exposes lattice, threshold, Hill, growth, rosette window and feedback parameters", supports: true}
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [1105, 1112], note: "Morphospace correlation/velocity maps are closed-form Gaussians in (ell_H, eta_b/eta), not solver output", supports: false}
      morphometric-validation:
        value: 86
        rationale: >-
          11 reference-anchored measurements (L1234-L1423) now include the sphere-limit residual
          (5.8e-3 vs 0), feedback amplification (1.70 vs local fixed point 1.56), intercalation
          share (0.64 vs Brauns ~0.65) and median shrink time (7.75 vs 7.5 min). Down 7 because
          (i) the wild-type "flow correlation r = 0.924" and the 6-regime r = 1.000 are
          constructed by projecting the WT field onto a synthetic observed direction built from
          the empirical r itself (L1046-L1055), so they validate nothing; (ii) the ledger's
          k_shrink/m_half/Hill-n were tuned to land inside the Bertet and Brauns windows (stated in
          the JSON note), so those two measurements are calibrations; (iii) the tension-isogonal
          split shows lambda_shape < 1 during the first ~10 min (Panel F), an inconsistency of the
          one-way coupling; (iv) the Bertet/Blankenship/Brauns anchors are flagged verified_offline = false.
        evidence:
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [1248, 1315], note: "4 new Pass 3 measurements with reference values, units and sources", supports: true}
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [1046, 1055], note: "flow_correlation_r is synthesised from the empirical r (obs_unit built from emp_r), not computed against observed PIV data", supports: false}
          - {file: datasets/global_morphogenetic_flow/intercalation_reference.json, lines: [89, 107], note: "Ledger parameters note states k_shrink/m_half/n were calibrated to the Bertet and Brauns windows", supports: false}
          - {file: docs/media/global_morphogenetic_flow_surface_intercalation.png, lines: [0, 0], note: "Panels C-F display the sphere-limit convergence, feedback fixed point, junction ledger and tension-isogonal split", supports: true}
      source-traceability:
        value: 92
        rationale: >-
          Four dataset files are now SHA-256-pinned at runtime (L86-L119, including the new
          `intercalation_reference.json`), `paper_citations.bib` and `README.md` were extended with
          Bertet et al. (2004) and Blankenship et al. (2006) DOIs, and every new constant is sourced
          in the JSON. Down 1 because the new DOIs and the numeric anchors (5-11 cell rosettes,
          5-10 min shrinkage, 0.5-0.8 intercalation share) were entered offline from recollection
          and are explicitly flagged `verified_offline: false`.
        evidence:
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [86, 119], note: "Runtime SHA-256 verification of 4 vendored dataset files", supports: true}
          - {file: datasets/global_morphogenetic_flow/intercalation_reference.json, lines: [1, 108], note: "Pass 3 geometry, surface operator, feedback and intercalation reference table with per-entry sources and verified_offline flags", supports: true}
          - {file: datasets/global_morphogenetic_flow/paper_citations.bib, lines: [42, 62], note: "Bertet 2004 and Blankenship 2006 BibTeX entries added", supports: true}
      code-traceability:
        value: 93
        rationale: >-
          The module docstring (L1-L60) now lists laws 4-6 with their Lean names; Sections 3b/3c
          carry block comments stating the exact functional, its reduction and its honest scope;
          `morphoeval/math_kg_loops/streichan-global-morphogenetic-flow.yaml` registers all 6
          theorems with Lean loci and code loci. Up 1.
        evidence:
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [1, 60], note: "Module docstring linking laws 1-6 to sources and Lean theorems, with explicit HONEST SCOPE statement", supports: true}
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [491, 515], note: "Section 3b header states the covariant functional, the derivation-free strain assembly and the pole-cap reduction", supports: true}
          - {file: morphoeval/math_kg_loops/streichan-global-morphogenetic-flow.yaml, lines: [86, 134], note: "Three new equations registered with lean_theorem, lean_locus and code_locus", supports: true}
      repro-package:
        value: 94
        rationale: >-
          `--self-test` (L1847-L1959) now has 7 check groups: SHA-256 locks (4 files), spectral
          Green's function, nematic tensor, 6-regime hierarchy, specimen CV, and the Pass 3
          checks (operator symmetry and positive-definiteness, sphere-limit residual < 0.02 with
          order > 1.4, curvature bounds, feedback gain in (0, 1) with monotone converged trace,
          ledger junction balance r = k + 3, determinism, bcd nos tsl null producing zero T1s);
          runs in ~2.3 s; the default render (~6 s) produces the main PNG, the new Pass 3 PNG and the GIF.
        evidence:
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [1847, 1959], note: "Deterministic self-test covering theorems 1-6, 4 SHA-256 locks and 11 measurements", supports: true}
          - {file: 2018-streichan-global-morphogenetic-flow.py, lines: [1961, 1985], note: "main() renders comparison PNG, Pass 3 surface/intercalation PNG and GIF", supports: true}
          - {file: docs/media/global_morphogenetic_flow_growth.gif, lines: [0, 0], note: "24-frame GIF regenerated", supports: true}
    remediation:
      - "Replace the synthetic flow-correlation construction in `evaluate_all_regimes` (L1046-L1055: `obs_unit` is built from `emp_r`, so r = 0.924 is reproduced by construction) with a correlation against a vendored/digitised observed velocity field (Streichan 2018 Fig. 2 PIV or the IDR0151 time series), and compute the 6-regime r from it."
      - "Run the 6-regime benchmark and the (ell_H x eta_b/eta) morphospace on the curved-surface solver instead of the flat pipeline: delete the ad hoc pole-return term (L404-L416) and the phenomenological `target_v_ap` rescaling (L422-L431), and replace the closed-form Gaussian morphospace (L1105-L1112) with solver output."
      - "Close the loop between the intercalation ledger and the continuum: feed the T1-driven lambda_int back into the Lagrangian extension (currently lambda_shape = lambda_total/lambda_int < 1 during the first ~10 min, Panel F) and let junction collapse modify the local active stress (two-way coupling; L883-L995 is one-way)."
      - "Replace the Dirichlet pole caps of the surface solver (L523-L527, L650-L654) with a closed-surface discretisation (e.g. a pole-regular grid or a triangulated FEM) and add a Killing-field test (rigid rotation must have zero viscous dissipation) to the self-test."
      - "Verify the Bertet 2004 / Blankenship 2006 / Brauns 2024 anchors and DOIs online, replace the recollected windows in `intercalation_reference.json` (verified_offline = false) with digitised values, and stop calibrating k_shrink/m_half to them."
