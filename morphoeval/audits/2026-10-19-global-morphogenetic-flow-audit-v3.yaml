# MorphoEval audit — Streichan et al. (2018), Mayer et al. (2010), Lefebvre et al. (2023) & Brauns et al. (2024)
# Drosophila Global Morphogenetic Flow, Curved-Surface Active Nematic Mechanics & Cell Intercalation, 2026-10-20 (v3)
#
# Pass 3 remediation re-score of `2018-streichan-global-morphogenetic-flow.py` (Slot 048) in the instrumented loop
# `morphoeval/runs/2026-10-19-global-morphogenetic-flow-loop-pass3`, superseding
# `2026-10-19-global-morphogenetic-flow-audit-v2` (92.3). Both v2 remediation items were addressed with honest
# reduced implementations (see `remediation` for the residuals carried to Pass 4):
#   1. Curved-surface Stokes-Brinkman solver on the prolate spheroid (a = 250, b = 105 um): covariant strain
#      e_ab = 1/2 (e_a . d_b v + e_b . d_a v) from the embedded tangent basis, exact metric g_ss, g_phiphi, Gaussian
#      curvature K = a^2/g_ss^2, sparse SPD minimisation of the dissipation functional; sphere-limit analytic check
#      against (eta+eta_b) l(l+1)/R^2 - 2 eta/R^2 + xi (residual 5.8e-3 at 56x48, observed order 2.04); plus
#      Lefebvre-2023-type strain-rate positive-feedback Myosin-II recruitment iterated to its fixed point
#      (loop gain g = 0.358, m*/m_0 = 1.70, v_AP 6.40 -> 7.61 um/min).
#   2. Cell-level T1 / rosette intercalation ledger (240 DV junctions on a 10x24 trunk lattice) driven by the
#      continuum cable myosin and DV contraction strain rate, rosette grouping (r = k + 3 cells), and the
#      Brauns-2024 tension-isogonal split lambda_total = lambda_int * lambda_shape (share 0.64).
#   Three new Lean 4 theorems (0 sorrys): surface_stokes_brinkman_gradient_mode_pos, myosin_feedback_fixed_point,
#   rosette_resolution_junction_balance. Self-test extended (7 check groups), measure_morphoeval() 7 -> 11.
#
# Scores went DOWN on morphometric-validation and parameter-expressivity because the remediation exposed that the
# headline Pass 2 "flow correlation r = 0.924" is synthesised from the empirical value (L1046-L1055) rather than
# computed against an observed PIV field, and that the 15x15 morphospace is an analytic Gaussian surrogate
# (L1105-L1112) not produced by the solver. Overall 92.3 -> 91.0. Line numbers refer to the files at commit f18e3533.

