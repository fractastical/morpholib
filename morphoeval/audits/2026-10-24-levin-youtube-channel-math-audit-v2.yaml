# MorphoEval audit — @drmichaellevin "25 Governing Mathematical Laws" synthesis suite, 2026-10-24 (v2, independent referee)
#
# Independent cross-provider referee re-score (Claude Fable 5.1, Anthropic) of the 25-equation suite built by
# gemini-4-argon, superseding `2026-10-24-levin-youtube-channel-math-audit` (93.8, self-assessed by the builder).
# Same critical standard as `2026-10-19-planarian-hk-atpase-anterior-audit-v3` and `2026-10-17-thompson-audit`:
# score what the evidence supports, credit nothing unverifiable, cite line numbers, mark every defect `supports: false`.
#
# Headline findings (details, line numbers and the per-law classification are in the evidence and remediation below):
#   1. The v1 audit scored a different artefact. Its evidence loci (`lines: [64, 335]`, `[338, 460]` on a 403-line
#      script; `Loop_...lean [1, 108]` for "6 theorems"; `MathOfBiology.lean [1152, 1278]` on a 1268-line file) describe
#      the earlier 6-law version. The 25-law rewrite was never re-scored; 93.8 was carried over to it unexamined.
#   2. Of the 25 Python "verifications" (L49-L200) only 2 compute anything beyond a single plugged-in arithmetic
#      expression (Law 7 secretary-problem sum, Law 8 four-row truth table); Law 5 fits a power law to data generated
#      by that same power law; 16 are one-point evaluations whose `ref` is the same expression or its rounded value;
#      6 are bare literals or tautologies (`e_sat_planted = 0`, `-6 + 6`, `ca_target - ca_target`, `0.82 + 0.12`,
#      `2 * 4 + 1`, six hard-coded S_6 decimals). No ODE, PDE, Markov chain, GRN, Langevin, NCA or cable equation
#      named in the law titles is ever integrated.
#   3. Of the 25 Lean theorems, 2 prove a universally-quantified structural statement (Laws 8, 10: exhaustive Bool
#      truth tables); 10 carry one trivially-universal conjunct (`x - x = 0`, `(a + b) - b = a`, `g * (-d + d) = 0`,
#      commutativity) next to ground constants; 13 are entirely ground `by decide` arithmetic on plugged-in numbers
#      (`125 * 8 = 8 * 125`, `100 / (5 - 3) = 50`, `2*2*3*3 + 2*0*0 = 18`). Law 7's theorem uses `N_scaled = 100566`,
#      which is `37 * 2718`, not `100 * 1000`: `floor(100000 / 2718) = 36`, so the constant was chosen to make the
#      bracket hold. `all_lean4_verified: True` (L232) is a hard-coded literal; the script never invokes `lean`.
#   4. No empirical biological data enter the script. It no longer opens `levin_youtube_catalog.json` (no `open`,
#      `json.load` or path to it anywhere in L23-L39), although the math-KG YAML still lists it under `inputs`
#      (L7-L8), the v1 audit lists it as a script input and a "specimen", and the README still describes "6 laws".
#      The catalog's `mappedMathLaws` field still uses the superseded 6-law taxonomy (e.g. the Weinberg Ca2+ talk
#      `3Jol76a-urM` is mapped to the TAME law). The catalog SHA-256 quoted in the Substack article is verified by no code.
#   5. All 25 v1 measurements are `derived_from: script` with `reference_source` pointing at the suite's own Lean
#      theorem; 23 have `reference_value == value` by construction. No measurement compares against a number measured
#      on an organism, an experiment, or a published figure.
#   6. Bibliography: 6 DOIs for 25 laws by ~25 speakers (19 laws have no `references` entry); the bib has 10 entries,
#      2 without any identifier, and 17 laws have no bib entry at all. Crossref resolution (this audit, 2026-10-24)
#      shows the v1 `froese2024` entry pairs the title of Entropy 25(5):748 (2023) with the DOI of Entropy 26(4):288
#      (2024, "Irruption and Absorption"), whose abstract contains no optimal-stopping law; `pigozzi2025` is article
#      1027, not 1112; the bib's `biswas2023` title ("Fromasikan to Pavlov...") is not the title of DOI
#      10.3390/ijms24010285; `chvykov2021` has "active matter" for "active collectives".
#   7. Rubric tags: 4 laws carry C5 (pre-registered out-of-sample compression) with no pre-registration artefact;
#      Laws 16, 21, 22 are tagged O1 "verbatim" but implement Delphi scalar reductions; Law 7's O1 attribution to
#      Froese is unsupported (the 1/e law is Lindley 1961 / Gilbert-Mosteller 1966); docs section 3 says T2 = 8/25
#      and T4 = 8/25 while the table and script carry T2 = 9, T4 = 7.
#   8. CLI exposes only `--self-test` (L398-L403); zero model parameters can be varied.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# working-tree files at HEAD bfe377c2 on 2026-10-24; every audited file except `MathOfBiology.lean` is an
# uncommitted, untracked working-tree file at audit time, so no commit yet contains the artefacts being scored.

