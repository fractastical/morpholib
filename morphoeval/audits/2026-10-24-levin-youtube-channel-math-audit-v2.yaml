    summary: >-
      Independent referee re-score of the 25-law `@drmichaellevin` synthesis suite: 26.4/100 (v1 self-score 93.8),
      verdict band 'unfaithful'. The v1 audit's evidence loci belong to the superseded 6-law script, so the 25-law
      rewrite had never been examined. On examination: 2 of 25 Python laws compute anything (Law 7 secretary sum, Law
      8 truth table), 1 fits its own generating function (Law 5), 16 evaluate one closed-form expression at one
      hard-coded point with `ref` set to the same expression, and 6 are literals or tautologies (Laws 6, 9, 10, 17,
      19, 24); no ODE/PDE/SDE/Markov/NCA system named in any title is integrated. In Lean, 2 theorems are genuine
      exhaustive Bool proofs (Laws 8, 10), 10 pair a trivially-universal identity with ground constants, 13 are
      entirely ground `decide` arithmetic, and Law 7's theorem brackets a rigged constant (100566 = 37 x 2718).
      Nothing empirical is loaded: the script no longer reads `levin_youtube_catalog.json` (still declared as an
      input in the math-KG YAML and as a 'specimen' in v1), the catalog's law mapping is the stale 6-law taxonomy,
      and all 25 v1 measurements reference the suite's own Lean theorem with `reference_value == value` for 23.
      The bibliography covers 6 of 25 laws, and Crossref resolution shows a title/DOI mismatch (`froese2024`), a
      wrong article number (`pigozzi2025` 1112 vs 1027), a fabricated title (`biswas2023`) and a mis-transcribed
      title (`chvykov2021`). Four C5 tags have no pre-registration artefact; Laws 16, 21 and 22 are O1-tagged scalar
      reductions; Law 7's O1 attribution to Froese is unsupported by either Froese paper's abstract; the docs' tier
      counts (T2 8/25, T4 8/25) disagree with the table and script (9, 7). The CLI exposes only `--self-test`.
      `--self-test` passes (0.3 s) and both Lean modules compile with 0 sorry; `--conform` on the v1 audit passes,
      which shows the schema check cannot catch stale loci or tautological measurements.
    scores:
      model-fidelity:
        value: 36
        rationale: >-
          What is implemented: each law has its governing equation written in a comment (L49-L200), the two
          Boltzmann-type closed forms (Laws 2, 3) and the Shannon-Hartley capacity (Law 16) are evaluated with
          physically meaningful constants, Law 7 computes the full secretary-problem objective over k = 1..99 and
          recovers k* = 37, P = 0.3710 (independently re-derived here with exact rationals), and Law 8 enumerates
          all four Boolean inputs for three observers (12/12 agree). Deductions: 16 laws are one-point evaluations
          whose `ref` is the same expression (Law 4 L70 vs L206 `round(math.exp(4.0), 4)` is literally identical;
          Laws 1, 11-15, 18, 20-23, 25 likewise), so the self-test can never fail and verifies nothing about the
          law (-20); 6 laws are bare literals or tautologies: Law 10 `e_sat_planted = 0` (L106) evaluates no clause
          and no instance despite the comment claiming a planted 3-SAT instance, Law 19 `-6 + 6` (L158-L160), Law
          24 `ca_target - ca_target` (L191-L193), Law 6 invented `0.82 + 0.12` (L81-L82), Law 9 `2 * 4 + 1` (L101),
          Law 17 six hard-coded decimals copied from the repository's own earlier S_6 run (L143-L147) (-14); Law 5
          fits a power law to p_ss = r^-1/Z that it has just defined, so slope = -1 and enrichment = 1.25/0.08 are
          tautological (-6); no dynamical system in any law title (gap-junction ODE, Nernst-Planck PDE, Markov jump
          process, Langevin SDE, free-energy gradient flow, Ca2+ integral control, ephaptic cable, NCA) is ever
          integrated, so the C2 interventional and C4 breakdown-horizon claims are asserted, not exhibited (-10);
          Law 16's Python metric and Lean theorem are different equations (-4); Law 22's second half (Huxley
          allometry, alpha = 1.42) is an unused literal at L180 with no computation (-3); Law 20's comment and
          figure legend say cooperators dominate at k = 16 but pi_C(16) = pi_D(16) = 0.5, strict dominance begins at
          k = 17 (-2); Law 13's Lean docstring (k_fb 20 -> 1, D 1 -> 20) matches neither its own theorem (20/20,
          400/1) nor the Python (0.1/2.0, 1.0/0.05) (-1). Not lower because the written equations are, for the O1
