        sorting-morphogenesis/figures/quantifying_emergence_ce2_metrics.json: b54103b87a1f5d77cb03bf7a37462f6267687e7f8234cfe115c24f3cdd74ac86
    claim_boundary:
      reported_in_source:
        - "Cervera, Levin & Mafe (2020): voltage-gated gap-junction coupling G_ij(V_i, V_j) = G_0 / [(1 + e^{(V_i - V_th)/V_0})(1 + e^{(V_j - V_th)/V_0})] with polarising and depolarising channel currents; depolarised domains electrically isolate"
        - "Pietak & Levin (2016, 2017): Nernst-Planck electrodiffusion in BETSE; at zero flux the charged-morphogen ratio is Boltzmann, exp(-zF dV / RT), independent of gap-junction permeability"
        - "Chvykov et al. (2021): low-rattling principle P_ss ∝ exp(-gamma R) tested on smarticle collectives and simulation; the 'rattling' is a diffusion-tensor quantity, not a scalar exit rate"
        - "Watson & Szathmary (2016): natural induction / Hebbian deepening of visited attractors; Pigozzi, Goldstein & Levin (2025): associative conditioning in continuous GRN ODE models with measured conditioning success; Biswas et al. (2023): pathway-level memory in transcriptional network models"
        - "Hoel et al. (2013), Hoel (2026): causal emergence via effective information and the determinism/degeneracy decomposition CP = det - deg"
        - "Levin (2019, 2022): TAME cognitive light cone (diagrammatic); Bongard & Levin (2023): polycomputing (conceptual); Shreesha & Levin (2025): agent-based spatial Prisoner's Dilemma with controllable borders"
      reconstructed_in_script:
        - "Law 1 (L177-L225): N-cell linear diffusion-leak BVP -G (V_{i-1} - 2V_i + V_{i+1}) + (G_half/N) V_i = delta_{i0}; reach L = sum_i V_i / V_0 at G_gj in {0, 0.5, 1.0} and on a 51-point grid; continuum sqrt(1/k) tanh(N sqrt(k)); Hill curve 1 + (N-1) G/(G + G_half) computed but unused"
        - "Law 2 (L231-L277, unchanged since Pass 3): 20-cell ODE, cells 0-4 clamped at -10 mV, cubic bistable I_ion with roots -60 / -38 / -10 mV (not Cervera's channel currents), Bell-Boltzmann vs ohmic G_ij, RK45 to t = 80"
        - "Law 3 (L283-L331): 1-D zero-flux BVP with central-difference / Pade(1,1) edge coefficients a_i = G(-1 + dv/2), b_{i+1} = G(1 + dv/2) on a linear voltage profile; grid refinement N_ap = 15..240 and a 5-value G_gj sweep at N_ap = 120"
        - "Law 4 (L337-L404): 24-state CTMC, W(i->j) = r_i^gamma K_ij(alpha) with K(alpha) = (1 - alpha) K_sym + alpha K_trap, K_sym Sinkhorn-symmetrised doubly stochastic, K_trap row-normalised weights linspace(0.1, 2.5)^2.5 (column sums != 1); stationary vector from L^T p = 0; log-log fit of p against the fixed r_exit at alpha = 0, 0.5, 0.9"
        - "Laws 5 and 7 (L410-L449): 4-row x 3-gate truth table; S_6 CE2 numbers read from the hash-pinned sorting-morphogenesis JSON"
        - "Law 6 (L455-L540): 16-gene symmetric J, Hebbian J += eta s s^T for 15 epochs, energy trace, basin fraction over 120 four-flip trials; 3-node ODE dx_CS = -x_CS + I_CS, dx_M = -0.02 x_M + 0.25 sigma(12 (x_CS x_US - 0.5)), dx_US = -x_US + sigma(12 (I_US + 0.9 x_M x_CS - 0.55)) in four phases (CS test, paired training t = 25, washout t = 5, CS test t = 10)"
        - "Law 8 (L546-L580, unchanged): pi_C(k) = (1 - k^-1/2) b - c and pi_D(k) = b k^-1/2 over k = 1..36; exact m x m directed bond count for m = 1..6"
        - "8 Lean theorems (Loop L30-L288, unchanged since Pass 3; duplicated in MathOfBiology.lean L1200-L1375), each on Nat/Int/Bool reductions of the law"
      transfer_boundary:
        - "The 8 laws are evaluated on synthetic parameter sets chosen by the builder (cubic current coefficients, r_exit table, K_trap weights, J ~ N(0, 0.25), 3-node ODE gains, b = 2, c = 1); no quantity is compared with a value measured in Cervera 2020, Pietak 2016/2017, Chvykov 2021, Pigozzi 2025 or Shreesha 2025"
