      artifact_sha256: 93541cfba66e436d973f1aee7c8c6a6cd1cbac78d2693f37e3d4cc61c100417f
      input_dataset_sha256:
        datasets/levin_youtube_channel/levin_youtube_catalog.json: 216a474f76c137c32c33b96ab93beda695478b16bc6cdb541908c6c875c13557
        datasets/levin_youtube_channel/paper_citations.bib: 1491f6f1107bea0d9145658e1e1b820e20d87b8e462835ccaf91271c85566065
        sorting-morphogenesis/figures/quantifying_emergence_ce2_metrics.json: b54103b87a1f5d77cb03bf7a37462f6267687e7f8234cfe115c24f3cdd74ac86
    claim_boundary:
      reported_in_source:
        - "Cervera, Levin & Mafe (2020): voltage-gated gap-junction coupling G_ij(V_i, V_j) = G_0 / [(1 + e^{(V_i - V_th)/V_0})(1 + e^{(V_j - V_th)/V_0})] with polarising and depolarising channel currents; depolarised domains electrically isolate"
        - "Pietak & Levin (2016, 2017): Nernst-Planck electrodiffusion in BETSE; at zero flux the charged-morphogen ratio is Boltzmann, exp(-zF dV / RT), independent of gap-junction permeability (with production / decay the steady state is not zero-flux and the ratio does depend on permeability)"
        - "Chvykov et al. (2021): low-rattling principle P_ss ∝ exp(-gamma R) tested on smarticle collectives and simulation; the 'rattling' is a diffusion-tensor quantity, not a scalar exit rate, and the principle is stated for driving whose embedded jump process is unbiased"
        - "Watson & Szathmary (2016): natural induction / Hebbian deepening of visited attractors; Pigozzi, Goldstein & Levin (2025): associative conditioning in continuous GRN ODE models with measured conditioning success; Biswas et al. (2023): pathway-level memory in transcriptional network models"
        - "Hoel et al. (2013), Hoel (2026): causal emergence via effective information and the determinism/degeneracy decomposition CP = det - deg"
        - "Levin (2019, 2022): TAME cognitive light cone (diagrammatic); Bongard & Levin (2023): polycomputing (conceptual); Shreesha & Levin (2025): agent-based spatial Prisoner's Dilemma with controllable borders"
      reconstructed_in_script:
        - "Law 1 (L177-L233): N-cell linear diffusion-leak BVP -G (V_{i-1} - 2V_i + V_{i+1}) + (G_half/N) V_i = delta_{i0}; reach L = sum_i V_i / V_0 at G_gj in {0, 0.5, 1.0} and on a 51-point grid; continuum sqrt(1/k) tanh(N sqrt(k)); Hill form 1 + (N-1) G/(G + G_eff) fitted by curve_fit (G_eff 2.26, RMS 3.05) and reported"
        - "Law 2 (L239-L285, unchanged since Pass 3): 20-cell ODE, cells 0-4 clamped at -10 mV, cubic bistable I_ion with roots -60 / -38 / -10 mV (not Cervera's channel currents), Bell-Boltzmann vs ohmic G_ij, RK45 to t = 80"
        - "Law 3 (L291-L339): 1-D zero-flux BVP with central-difference / Pade(1,1) edge coefficients a_i = G(-1 + dv/2), b_{i+1} = G(1 + dv/2) on a linear voltage profile; grid refinement N_ap = 15..240 and a 5-value G_gj sweep at N_ap = 120"
        - "Law 4 (L345-L412): 24-state CTMC, W(i->j) = r_i^gamma K_ij(alpha) with K(alpha) = (1 - alpha) K_sym + alpha K_trap, K_sym Sinkhorn-symmetrised doubly stochastic, K_trap row-normalised weights linspace(0.1, 2.5)^2.5 (column sums != 1); stationary vector from L^T p = 0; log-log fit of p against the fixed r_exit at alpha = 0, 0.5, 0.9"
        - "Laws 5 and 7 (L418-L457): 4-row x 3-gate truth table; S_6 CE2 numbers read from the hash-pinned sorting-morphogenesis JSON"
        - "Law 6 (L463-L548): 16-gene symmetric J, Hebbian J += eta s s^T for 15 epochs, energy trace, basin fraction over 120 four-flip trials; 3-node ODE dx_CS = -x_CS + I_CS, dx_M = -0.02 x_M + 0.25 sigma(12 (x_CS x_US - 0.5)), dx_US = -x_US + sigma(12 (I_US + 0.9 x_M x_CS - 0.55)) in four phases (CS test, paired training t = 25, washout t = 5, CS test t = 10); the docstring now states this ODE and its results"
        - "Law 8 (L554-L588, unchanged): pi_C(k) = (1 - k^-1/2) b - c and pi_D(k) = b k^-1/2 over k = 1..36; exact m x m directed bond count for m = 1..6"
        - "8 Lean theorems (Loop L30-L288, unchanged since Pass 3), each on Nat/Int/Bool reductions of the law; Law 1's theorem formalises the Hill numerator, not the BVP the Python metric is now scored on"
      transfer_boundary:
        - "The 8 laws are evaluated on synthetic parameter sets chosen by the builder (cubic current coefficients, r_exit table, K_trap weights, J ~ N(0, 0.25), 3-node ODE gains, b = 2, c = 1); no quantity is compared with a value measured in Cervera 2020, Pietak 2016/2017, Chvykov 2021, Pigozzi 2025 or Shreesha 2025"
        - "Law 1's BVP reach is a cable-theory space constant (L ≈ sqrt(G/k), measured exponent 0.48 over the sweep); the Hill form fitted to it has its half-saturation (2.26) outside the sweep and a plateau at N the BVP never shows, so the Lean theorem (Hill numerator) and the Python metric (BVP) describe different functions of G_gj"
        - "Law 4's breakdown is a genuine property of the model (non-doubly-stochastic routing with fixed exit rates) and its magnitude (+0.1866) is now reported consistently; at alpha = 0 the slope -1 is the elementary CTMC result p ∝ 1/r for a uniform embedded chain"
        - "Law 3's grid-refinement convergence is a genuine numerical check of the discretisation against the Boltzmann closed form; the G_gj invariance is linear algebra (G_gj scales Q) and holds only in the zero-flux limit the law is restricted to"
        - "Law 6's 3-node ODE is a hand-tuned minimal conditioning circuit, not a model from Pigozzi 2025 or Biswas 2023; it is now documented as what it is"
