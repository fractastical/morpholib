    summary: >-
      Pass 3.2 referee score of the committed 8-law `@drmichaellevin` synthesis suite at 9987ff10: 63.5/100 (57.4 on
      the uncommitted Pass 3.1 tree; 44.8 on Pass 3; v2 26.4 on the 25-law version; v1 self-score 93.8), verdict band
      'mostly faithful' by 3.5 points. Five of the seven Pass 3.1 remediation items are closed on the evidence: the
      written record now matches the code everywhere it is generated or hand-aligned (criteria doc, YAML, KG
      verified_laws, script header and Law 6 docstring); Law 1 fits the Hill form to the BVP curve with curve_fit
      (G_eff 2.26, RMS 3.05, reproduced); the Ross DOI resolves at the third attempt (10.1017/9781009300940, 2025);
      froese2024 and hoel2026ce2 carry the Crossref titles and author lists and all 17 bib DOIs resolve; the package
      is committed and the audited files are unchanged through HEAD. One is partial (`--delta-v-mv 0` passes and the
      summary JSON records the script hash, but `--law` still runs every solver). One is not closed and regressed:
      docs/bioelectricity/levin_youtube_kg.json has no generator, its eight code_locus values are the pre-commit line
      numbers (Laws 2-8 no longer start at their `def`), its domain_summary keeps the Stoica / Morozov names, and two
      entries of the referee's Pass 3 sidecar embedded in it (m4, m5) were rewritten by the builder under the
      referee's meas_ids - the values match this referee's own findings, but builder-authored numbers under referee
      identifiers is the pattern C6 exists to prevent. Substantively the eight laws are unchanged: Laws 3 and 4 are
      correct textbook statements (zero-flux Boltzmann ratio; p ∝ 1/r for a uniform embedded chain) with genuine
      numerical checks; Law 2 is a real two-regime ODE on an invented current; Law 1 is a cable-theory space constant
      relabelled as a cognitive light cone, with a Lean theorem about a different (Hill) function; Laws 5 and 7 are
      elementary identities (a symmetric Boolean function factors through a + b; a telescoping sum) dressed as T1
      theorems; Law 6 is a Hebbian identity plus a hand-built conditioning circuit; Law 8 is a closed form evaluated
      at k values no square cluster realises. No law is compared with any published measurement, which keeps
      specimen-match and morphometric-validation where they were.
