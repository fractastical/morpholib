# MorphoEval audit — @drmichaellevin "8 Load-Bearing Mathematical Laws" synthesis suite, 2026-10-24 (v3, Pass 3.2 referee)
#
# Independent cross-provider referee score (Claude Fable 5.1, Anthropic) of the committed Pass 3.2 remediation of the
# suite, superseding `2026-10-24-levin-youtube-channel-math-audit-v2` (26.4, the same referee's score of the 25-law
# version). History of THIS file: first issued at 44.8 against the uncommitted Pass 3 tree (script 853 lines,
# aeedf9ed...); updated in place to 57.4 against the uncommitted Pass 3.1 tree at HEAD 8fa7e207 (script 918 lines,
# c2c82f39...); updated in place again HERE against checkpoint commit 9987ff10 (script 941 lines, 38fcb818...), the
# first commit that contains the whole package. Same standard as v2 and the planarian / Thompson audits: score what
# the evidence supports, credit nothing unverifiable, cite line numbers, mark every defect `supports: false`.
#
# Pass 3.1 remediation items (57.4 issue) - status after re-running everything on 9987ff10 (2026-10-25):
#   R1  Record/code  CLOSED.  All seven numeric / textual disagreements are gone: criteria doc L62 now +0.1866, L64 /
#                             YAML L112 / KG verified_laws L513 now 0.0015 -> 1.0000; script header L12 says 51 values,
#                             L25 says alpha in [0, 0.90], L31-L34 no longer promise plasticity or extinction; the Law 6
#                             docstring (L469-L477) is the ODE that is in L514-L522 with its actual results.
#   R2  Law 1 Hill   CLOSED.  `scipy.optimize.curve_fit` of the Hill form to the BVP curve (L213-L216): G_eff = 2.26,
#                             RMS 3.0478 vs 55.1846 unfitted (independently reproduced with a bounded 1-D minimiser);
#                             asserted at L850. Residual: the assertion (fitted RMS < unfitted RMS) is true of any
#                             least-squares fit; the fitted "half-saturation" 2.26 lies outside the swept range [0, 2]
#                             because the BVP reach grows as G^0.48 and never saturates, so the Hill form (which is
#                             what the Lean theorem formalises, L30-L60) is the wrong function for the model the law is
#                             scored on. Panel A now has a top axis labelled G_gj 0..2.0 (L616-L618) but the curve is
#                             still drawn at g * 9.5 on the cell-index axis (L619), so the ticks are misaligned by
#                             ~0.09 G units (4.5 %).
#   R3  Ross DOI     CLOSED.  docs L31 and bib L154-L162 cite 10.1017/9781009300940 (Ross LN, Cambridge Univ. Press
#                             monograph, 2025); Crossref resolves it with title and author of record (2026-10-25).
#   R4  Bib          CLOSED.  froese2024 (L176-L186) is single-author with the title of record; hoel2026ce2 (L130-L140)
#                             carries the Crossref title; Stoica removed from the Law 5 name; an Albantakis DOI was added
#                             (albantakis2023iit4, 10.1371/journal.pcbi.1011465 - resolves, but it is the IIT 4.0 paper,
#                             not a causal-emergence paper; Lean L229 still says "Albantakis (2024)"); Sweet (2026)
#                             removed from docs L34 (still at KG L129). Morozov removed from the Law 8 name in script,
#                             docs and YAML, and is in any case a catalogued channel speaker (catalog L508-L521), but
#                             survives in Lean L255 / theorem name L276, script comments L552 / L683, KG L1139 and the
#                             hash-pinned catalog labels. 17 of 17 bib DOIs resolve via Crossref with title and author
#                             list of record; OSF URL 200.
#   R5  KG payload   NOT CLOSED - REGRESSED.  No generator script exists; the payload was hand-edited. Its 8 code_locus
#                             values (L347-L580) are the PRE-9987ff10 line numbers (L231-L277 etc.) while the YAML was
#                             shifted to L239-L285 etc., so Laws 2-8 no longer start at their `def`; domain_summary
#                             L1068 / L1139 still carry the Stoica / Morozov names the verified_laws block dropped. Worse:
#                             `verified_measurements` (L600 ff.) is still this referee's Pass 3 sidecar, and two of its
#                             entries were ALTERED BY THE BUILDER under the referee's meas_ids - m4 (L647-L659) changed
#                             from 13/16 to "17/18 ... exact title and author list of record" and m5 (L662-L674) from 7
#                             to "0 ... All 7 Pass 3.1 discrepancies reconciled in Pass 3.2" - while the remaining 22
#                             entries still describe the 918-line Pass 3.1 script and a MathOfBiology.lean section that
#                             no longer exists (L627). The values the builder wrote happen to be ones this referee
#                             also reaches, but builder-authored numbers under referee identifiers is exactly what C6
#                             forbids; the referee's own sidecar is the only authoritative record.
#   R6  CLI          PARTIAL. `--delta-v-mv 0` now passes (guard at L853; also `--delta-v-mv -40`); the summary JSON
#                             records git_commit and script_sha256 (L2-L3; the hash matches the committed script, the
#                             commit 7595b0cd is the parent whose tree does not contain it). `--law` (L834-L836) still
#                             filters only the output table: all eight solvers and all six panels run (reproduced,
#                             `--law 2,4`).
#   R7  Commit       CLOSED.  9987ff10 contains the script, Loop .lean, YAML, docs, bib, catalog, KG payload, summary
#                             JSON and figure; none of the audited files changed between 9987ff10 and HEAD 03145ecc.
#                             The structural ceiling stands: no law is compared with any published measurement, so
#                             specimen-match and morphometric-validation are unchanged in kind.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the files at
# commit 9987ff10 (SHA-256 of each file in checkpoint.note and the measurements sidecar).

