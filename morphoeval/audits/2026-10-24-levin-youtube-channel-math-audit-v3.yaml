# MorphoEval audit — @drmichaellevin "8 Load-Bearing Mathematical Laws" synthesis suite, 2026-10-24 (v3, Pass 3.1 referee)
#
# Independent cross-provider referee score (Claude Fable 5.1, Anthropic) of the Pass 3.1 remediation of the suite,
# superseding `2026-10-24-levin-youtube-channel-math-audit-v2` (26.4, the same referee's score of the 25-law version).
# This file was first issued at 44.8 against the Pass 3 tree (script 853 lines, aeedf9ed...) and is UPDATED IN PLACE
# here after the builder closed the ten Pass 3 remediation items (script 918 lines, c2c82f39...). Same standard as
# v2 and the planarian / Thompson audits: score what the evidence supports, credit nothing unverifiable, cite line
# numbers, mark every defect `supports: false`.
#
# Pass 3 remediation items R1-R10 (44.8 issue) - status after re-running everything on the Pass 3.1 tree:
#   R1  Law 1  CLOSED.  The 100-cell BVP reach (32.0099 cells WT, 1.0 at G_gj = 0) is now the metric (L718) and the
#                       asserted quantity (L837-L838, parameterised); the reach curve is plotted (panel A twin axis);
#                       a continuum check sqrt(1/k) tanh(N sqrt(k)) = 31.5097 is reported (1.6 % from the BVP).
#                       Residual: the docstring (L182-L183) and header (L12-L14) promise a fitted Hill G_eff and an
#                       RMS residual that are not computed (`hill_curve` L211/L224 is returned and used nowhere;
#                       referee RMS = 55.2 cells, best-fit G_eff = 2.26 vs the G_half = 0.1 the Hill formula uses);
#                       header says 101 G_gj values, code has 51 (L203); panel A draws G_gj x 9.5 on the cell-index
#                       axis (L608).
#   R2  Law 4  CLOSED.  Exit rates are fixed at every alpha (L372) and detailed balance is broken by a
#                       non-doubly-stochastic K_trap (L360-L365); the fit regresses on the rates in the generator.
#                       The breakdown is now real: slope -1.0000 / -0.5598 / +0.1866 at alpha = 0 / 0.5 / 0.9.
#                       Residual: BIOLOGICAL_LAW_CRITERIA.md L62 reports "+0.7618" at alpha = 0.90, a value the
#                       code does not produce (summary JSON, --self-test and KG payload all say 0.1866); header L25
#                       says alpha in [0, 0.95], code sweeps to 0.90. Panel C relabelled (L636) - closed.
#   R3  Law 3  CLOSED.  Central-difference / Pade(1,1) edge coefficients (L300-L303) no longer impose exp(-dv);
#                       convergence to exp(40/25.85) is genuine O(h^2) (errors 7.4e-3, 1.7e-3, 4.2e-4, 1.0e-4,
#                       2.5e-5 for N = 15..240, ratio ~4.1 per doubling). Residual: the G_gj spread is still 0 by
#                       linear algebra (G_gj multiplies Q); `--delta-v-mv 0` aborts at L841 because all errors are 0.
#   R4  Law 6  CLOSED.  A 3-node [x_CS, x_M, x_US] ODE (L506-L527) replaces the 1-D tanh unit; CS-only response
#                       0.0015 -> 1.0 after paired training with a slow memory node (0.02 decay); Delta E = -eta N^2
#                       is labelled an identity (L532); the basin trace is plotted (L661). Residual: the docstring
#                       (L461-L469) gives different coefficients (-0.2, 8, 0.35, 1.8, 0.50) and different results
#                       (0.023 -> 0.909) from the code (-0.02, 0.25, 12, 0.50, 0.90, 0.55; 0.0015 -> 1.0); the header
#                       (L33-L35) promises "slow associative weight plasticity (w_CS_M)" and "extinction", neither of
#                       which exists in the code; the criteria doc (L64), math-KG YAML (L112) and KG payload (L583)
#                       all quote "0.0020 -> 0.9036". No Pigozzi 2025 model is instantiated.
#   R5  CLI    CLOSED.  All assertions (L833-L850) precede the writes (L885-L889) and are functions of the CLI
#                       values; 13 of 14 model flags complete with non-default values (direct single invocations);
#                       `--law` exists (L823-L825) but filters only the output table - all eight solvers still run.
#                       Both hashes are pinned (L63, L65) and asserted (L834-L835).
#   R6  Catalog CLOSED. `mappedMathLaws` regenerated: 9 distinct labels = the 8 laws + `channel_concepts_index`
#                       (mOWfZncXt_g -> math-4 Chvykov, PIrHLnmI_9o -> math-2 Cervera, 5cXtdZ4blKM -> math-7 Hoel,
#                       3Jol76a-urM -> concepts); new SHA-256 216a474f... pinned in code and recorded in README L9.
#                       Residual: no crawl / regeneration script is committed.
#   R7  KG     CLOSED.  docs/bioelectricity/levin_youtube_kg.json regenerated (schema 3.0.0, total_laws 8,
#                       channel_concepts_index 17, criteria_rubric, referee_audit_v2 block). Residual: its
#                       `verified_measurements` block (L672 ff.) is a copy of THIS referee's Pass 3 sidecar and so
#                       describes the superseded code ("Law 1 one-point formula", "1-D tanh unit", slope -0.1556);
#                       no generator script exists for the payload.
#   R8  Loci   CLOSED.  Every lean_locus starts at its lean_decl (L30/71/107/137/168/196/235/262) and every
#                       code_locus at its `def` (L177/231/283/337/410/455/410/546); `verify_integrity.py --loop-yaml`
#                       passes (0 violations), re-checked programmatically here.
#   R9  Bib    PARTIAL. C4 is now claimed only by Laws 4 and 8; C2 withdrawn from Laws 5 and 7; hoel2026ce2 has a
#                       verification note. NOT closed: the Ross DOI was changed from 10.1017/9781108942850 (Maran)
#                       to 10.1017/9781009301435, which Crossref and doi.org do not resolve at all ("Resource not
#                       found", HTTP 404); the Element "Explanation in Biology" (Ross LN, Cambridge Univ. Press,
#                       issued 2025-01-16) is 10.1017/9781009300940. `froese2024` still carries a paraphrased title
#                       ("...for Modeling How Mind and Matter Interact in Living Systems" vs the title of record
#                       "...for How Mind and Matter Make a Difference to Each Other") and lists a co-author
#                       (Karelin) absent from the Crossref record, under a "Crossref-verified" note. Stoica, Morozov
#                       and Albantakis remain in law names with no identifier.
#   R10 verify_integrity CLOSED. check_math_kg_loop_yaml (L197-L254) bound-checks every locus and requires the decl
#                       / theorem names inside the slice; classify_lean_theorem_signature (L170-L187) now requires
#                       a bound name in the conclusion; `loan_body` is gone; the suite's own classifier (L142-L153)
#                       applies the same rule. NOT closed: every audited file is still untracked (`??`) at HEAD
#                       8fa7e207 (two commits after a26d6683, neither touching this package).
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# working-tree files on 2026-10-24 18:05 EDT (SHA-256 of each file in checkpoint.note and the measurements sidecar).

