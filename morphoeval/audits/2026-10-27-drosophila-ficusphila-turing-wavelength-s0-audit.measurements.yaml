    claim_boundary:
      reported_in_source:
      - 'Turing (1952): a reaction-diffusion system can be unstable at a finite critical wavenumber.'
      - 'Schnakenberg (1979): two-species kinetics with a homogeneous steady state and a limit-cycle regime; the
        Jacobian used here is the standard linearisation of R_u = a - u + u^2 v, R_v = b - u^2 v.'
      - 'Tanaka, Barmina & Kopp (2009): longitudinal sex combs evolve by about 90 degrees of rotation of a transverse
        row, or by bristles that arise already longitudinal.'
      - 'Tanaka et al. (2011) and Kopp (2011): sex-comb teeth are a recent, sex-specific bristle innovation under
        doublesex and Scr.'
      reconstructed_in_script:
      - The assigned detail-tier wavelength λ_c = 2.072 µm (2.072e-6 m, log10 = -5.684) is imposed by choosing D_u
        at diffusion ratio 20.
      - Predecessor D. eugracilis is given linear density 2/3 and successor D. grimshawi density 1/2, at geological
        age 0 Ma, producing λ = 3.108 µm and 4.144 µm.
      - Spiral charge m = 2 is a render choice so the growing mode has the same two-arm layout as the gallery plate.
      transfer_boundary:
      - No cited sex-comb paper reports a 2.072 µm Turing wavelength, a Schnakenberg parameter table, or a measured
        tooth-ridge spacing at this tier.
      - The chronoseries order (eugracilis before ficusphila before grimshawi) is the project series of extant species,
        not a stratigraphic lineage.
      does_not_claim:
      - That the gallery plate is an SEM or a light micrograph of a sex-comb tooth.
      - That 2.072 µm was measured on D. ficusphila cuticle.
      - That the 100 µm sibling slot's alpha/beta power law is this model.
