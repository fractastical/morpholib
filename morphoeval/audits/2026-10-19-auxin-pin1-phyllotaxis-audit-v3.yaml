          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [773, 814], note: "Hill-exponent sweep + no-feedback ablation with Spearman monotonicity test", supports: true}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [820, 886], note: "Five trafficking regimes (explicit, QSS, BFA, endocytosis, fast-cycling) run on the same dome and compared", supports: true}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [1792, 1812], note: "CLI: 8 new Pass 3 flags for kinetics, mechanism, rates, BFA onset, canalization exponent/K and ablation", supports: true}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [944, 957], note: "Gamma regimes: divs = nominal +/- N(0, 0.55-0.65); no model parameter enters", supports: false}
      morphometric-validation:
        value: 68
        rationale: >-
          Credited: 16 measurements with units, reference values, sources and methods (L1529-1680);
          the new ones compare against literature or against the paper's own analytic predictions
