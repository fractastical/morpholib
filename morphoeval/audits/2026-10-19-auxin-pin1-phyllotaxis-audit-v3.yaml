        rate 0.38 with the transport term weighted 0.14, so the convergence maxima and the 137.39 deg
        divergence angle are inputs. Replace with Jönsson Eq. 1 as published (da/dt = rho0 - mu a + sum J)
        on a growing/advecting peripheral zone (radial advection v_r = gamma r, primordium sink mu_prim as in
        Smith 2006) so that maxima and successive divergence angles emerge, and report the emergent angle.
      - >-
        2006-jonsson-auxin-pin1-meristem.py:921-960 — simulate_four_phyllotactic_modes returns the nominal
        angle plus seeded noise for distichous/decussate/tricussate and places the spiral at k*137.5 deg by
        construction; Gamma = R_PZ / lambda_0 enters nothing. Implement a Douady-Couder / Smith 2006 ring
        model (threshold initiation on an expanding ring with depletion wavelength lambda_0) and sweep Gamma
