# MorphoEval Pass 3 (v3) Audit — Jönsson et al. (2006) PNAS & Smith et al. (2006) PNAS
# Up-the-Gradient Auxin-PIN1 Polarized Transport, PIN1 Trafficking Kinetics, Subepidermal
# Canalization & Phyllotaxis in the Shoot Apical Meristem, 2026-10-20 (v3)
#
# Pass 3 remediation-round re-score of `2006-jonsson-auxin-pin1-meristem.py` (Slot 032) in the isolated
# loop `morphoeval/runs/2026-10-19-auxin-pin1-phyllotaxis-loop-pass3`, superseding
# `2026-10-19-auxin-pin1-phyllotaxis-audit-v2` (92.8).
#
# What Pass 3 changed (the single v2 remediation item, closed in reduced and honestly-labelled form):
#   1. Explicit sub-cellular PIN1 exocytosis/endocytosis trafficking kinetics replace the instantaneous
#      Boltzmann allocation in the 2D L1 dome: each cell carries a cytosolic pool P_cyt and per-wall membrane
#      pools P_ij with dP_ij/dt = k_exo f(a_j) P_cyt - k_endo P_ij, solved by an exact exponential integrator
#      (`integrate_pin1_trafficking_exact`, L238-284) that conserves membrane + cytosol PIN1 to round-off and
#      is unconditionally stable for the stiff Boltzmann weights. Five regimes are run and compared
#      (`evaluate_pin1_trafficking_regimes`, L820-886): explicit WT, QSS ablation (Pass 2 behaviour), brefeldin A
#      exocytosis block (PM fraction 0.0857 after 2 h, equal to PM(t_BFA) exp(-k_endo 2 h) because the integrator is exact; polarity 0.052 vs WT 0.584),
#      auxin-inhibited endocytosis (Paciorek 2005; weaker polarity 0.21), fast-cycling limit (max |P - Boltzmann|
#      = 0.013, recovering Law 1 from Law 4).
#   2. The "3D subepidermal canalization" half was implemented as a REDUCED quasi-3D model: a 2D vertical slice
#      (15 lateral x 12 deep cells) beneath P1 with Mitchison/Feugier with-the-flux exocytosis targeting
#      (`simulate_subepidermal_canalization`, L617-770), fed by the L1 primordium efflux and drained by a vascular
#      sink row. A single-file strand (width 1 cell at mid-depth, flux concentration 0.63, 97 % of the source flux
#      delivered) emerges; the no-feedback ablation spreads over 14 cells; a Hill-exponent sweep n in {1, 1.5, 2,
#      2.5, 3} gives widths {15, 6, 1, 1, 1} (Spearman rho = -0.89). It is NOT a full 3D meristem (residual
#      carried below).
#   3. Two new Lean 4 theorems (jonsson_2006_pin1_trafficking_qss, mitchison_1980_canalization_winner_take_all),
#      0 sorrys; self-test 8 -> 13 checks; measure_morphoeval 9 -> 16; 7 new DOI-verified references vendored
#      (bib + reference JSON schema 1.1.0, SHA-256 re-pinned).
#   4. Two presentational defects were removed rather than kept: the Pass 2 affine recalibration of the PIN1
#      convergence index (0.842 + 0.04 (raw - 0.72), which pinned the value to the 0.84 reference) and the
#      synthetic padding of the divergence-angle series to 24 points.
#
# Why the overall score goes DOWN (92.8 -> 75.9): wiring real kinetics into the dome exposed how much of the
# v2-credited output is prescribed rather than simulated, and v2 did not notice:
#   - the dome primordia P1..P8 are placed at golden-angle targets (L396-397) and the auxin field is relaxed
#     toward a hand-built peripheral-zone/primordium envelope (L508-513) with the transport term down-weighted
#     by 0.14, so the "137.39 deg divergence angle" and the auxin maxima are inputs, not outputs of Eqs. 1-4;
#   - the four phyllotactic "regimes" are the mode's nominal angle plus seeded noise (L944-957) and the spiral
#     mode places primordia at k*137.5 deg by construction (L923-931): Gamma controls nothing;
#   - the wild-type ring profile of the NPA/IAA panel is a sum of hand-placed Gaussians (L1025-1028);
#   - the dispersion peak is calibrated to the 5.2-cell reference it is then compared against (L180-184);
#   - the specimen is Aeonium tabuliforme, not Arabidopsis, and no PIN1 or provascular-strand image is vendored.
# These are reported as failed/absent comparisons and listed as Pass 4 items, not tuned away.
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# files in the working tree at commit d58a084 after the Pass 3 edits (the script is 1870 lines).

