          - {file: docs/media/auxin_pin1_phyllotaxis_growth.gif, lines: [0, 0], note: "18 frames x 3 panels: dome polarity build-up from a fully internalised PIN1 start, ring profiles, and the subepidermal strand narrowing to one file", supports: true}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [1094, 1176], note: "ExG + DoG segmentation of the SHA-256-locked Aeonium tabuliforme specimen; 410 tips, 12/12 sectors", supports: true}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [1346, 1354], note: "Parastichy 'overlay' curves phi = 5.2 t and -3.4 t + 1.1 are hard-coded, not fitted to the detected leaf tips", supports: false}
          - {file: datasets/auxin_pin1_phyllotaxis/README.md, lines: [1, 20], note: "Only specimen is a top-down Aeonium rosette; no Arabidopsis SAM PIN1 image or strand image is vendored", supports: false}
      parameter-expressivity:
        value: 70
        rationale: >-
          Credited: the with-the-flux Hill exponent visibly and monotonically controls strand width
          (15 -> 6 -> 1 -> 1 -> 1 cells; Spearman rho -0.89) with a no-feedback ablation at 14 cells
          (L773-814, Panel I); the trafficking regime switch changes polarity as expected (explicit
