simulations:
  - id: jonsson-auxin-pin1-meristem
    name: "Jönsson et al. (2006) & Smith et al. (2006) up-the-gradient PIN1 polarization with explicit PIN1 trafficking kinetics, quasi-3D subepidermal canalization, and polar auxin transport for shoot apical meristem phyllotaxis"
    organism: "Arabidopsis thaliana (shoot apical meristem L1 epidermis & subepidermal provascular strand); Aeonium tabuliforme (spiral rosette specimen)"
    script: 2006-jonsson-auxin-pin1-meristem.py
    output: docs/media/auxin_pin1_phyllotaxis_comparison.png
    extra_outputs:
      - docs/media/auxin_pin1_phyllotaxis_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-auxin-pin1-phyllotaxis-audit-v2
    claim_boundary:
      reported_in_source:
        - "Jönsson et al. (2006) PNAS 103:1633-1638 & Smith et al. (2006) PNAS 103:1301-1306: up-the-gradient PIN1 membrane allocation P_ij = P_i exp(c_1 a_j) / sum_k exp(c_1 a_k) with explicit PIN1 membrane cycling kinetics whose quasi-steady state is that allocation, intercellular active polar + diffusive auxin transport, and periodic convergence maxima separated by a characteristic wavelength"
        - "Geldner et al. (2001) Nature: brefeldin A blocks PIN1 exocytosis and internalises plasma-membrane PIN1 within 1-2 h; Paciorek et al. (2005) Nature: auxin inhibits PIN endocytosis"
        - "Bayer et al. (2009) Genes Dev: epidermal up-the-gradient patterning couples to subepidermal with-the-flux canalization (Mitchison 1980/1981; Feugier et al. 2005) producing a narrow provascular strand from the L1 convergence point to the existing vasculature; Scarpella et al. (2006): PIN1-marked preprocambial strands are 1-2 cells wide"
        - "Smith et al. (2006): transitions across spiral (137.5 deg), distichous (180 deg), decussate (90 deg) and tricussate (120 deg) phyllotaxis with meristem size; Reinhardt et al. (2003) Nature: NPA/pin1 pin-formed apex and localized IAA rescue"
      reconstructed_in_script:
        - "Explicit per-cell cytosolic + per-wall membrane PIN1 pools cycling by first-order exocytosis (targeting f_ij = exp(c_1 (a_j - a_0))) and endocytosis, solved by an exact exponential integrator (membrane + cytosol conservation err 0.0, flux antisymmetry err 1.3e-14), with QSS ablation, BFA block (PM fraction 0.0857 after 2 h = PM(t_BFA) exp(-k_endo 2 h) exactly; polarity 0.052 vs WT 0.584), auxin-inhibited-endocytosis variant (polarity 0.21) and fast-cycling Boltzmann limit (max |P - Boltzmann| 0.013)"
        - "Quasi-3D 15 x 12 subepidermal slice beneath P1 with with-the-flux Hill feedback f_ij = f_0 + J^n/(K^n + J^n): single-file strand (width 1 cell at mid-depth, mean 1.0 over rows 1-8, flux concentration 0.63, 97 % of source flux delivered to the sink); no-feedback ablation width 14 cells; Hill-exponent sweep widths {15, 6, 1, 1, 1} for n in {1, 1.5, 2, 2.5, 3} (Spearman rho -0.89, p 0.04)"
        - "Linearized Turing-like dispersion relation with kappa_4 calibrated so that the peak sits at the 5.2-cell reference (threshold c_1 a_0 = 1.75; NPA collapse sigma(k) < 0); 1D ring NPA (contrast 1.000, 0 peaks) and IAA-paste rescue (1 peak at 60 deg)"
        - "ExG + DoG segmentation of 410 leaf tips on the SHA-256-locked Aeonium tabuliforme rosette (12/12 sectors, NN 1 - CV = 0.774)"
      transfer_boundary:
        - "The 180-cell dome does NOT generate its primordia: P1..P8 are seeded at golden-angle targets (L396-397) and the auxin field is relaxed toward a prescribed envelope (L508-513); only the PIN1 trafficking, polarity, conservation and BFA/QSS/fast-cycling results are emergent outputs of that function"
        - "The four phyllotactic regimes are prescribed (nominal angle + seeded noise, L944-957; spiral placed at k*137.5 deg, L923-931) and the WT ring profile is hand-built (L1025-1028); Gamma is a label, not a control parameter"
        - "The canalization model is one non-growing vertical slice with a uniform Dirichlet sink row, no lateral neighbours' strands, no growth and no 3D geometry; strand width is compared to a literature band (1-2 cells), not to a vendored PIN1::GFP image"
        - "The rosette specimen is Aeonium tabuliforme (top-down leaf rosette), not an Arabidopsis inflorescence meristem"
      does_not_claim:
        - "Full 3D meristem geometry, tissue growth or cell division, PIN1 phosphorylation (PINOID/PP2A) control of apical-basal targeting, emergent golden-angle phyllotaxis, emergent mode transitions with Gamma, or a quantitative comparison of PIN1 plasma-membrane fractions with immunolocalization data"
    source_refs:
      - jonsson2006
      - smith2006
      - reinhardt2003
      - heisler2005
      - geldner2001
      - paciorek2005
      - bayer2009
      - mitchison1980
      - mitchison1981
      - feugier2005
      - scarpella2006
    summary: >-
      Pass 3 (v3) evaluation of `2006-jonsson-auxin-pin1-meristem.py` (overall weighted score 75.9/100,
      down from 92.8 in v2). The single v2 remediation item is closed in reduced form: PIN1 polarity now
      arises from explicit exocytosis/endocytosis kinetics with an exact integrator, verified against the
      analytic QSS (Lean Law 4), BFA internalisation (0.0857, exactly the first-order prediction) and the fast-cycling
      Boltzmann limit (0.013), and a quasi-3D subepidermal slice canalizes a single-file provascular strand
      (width 1 cell, 97 % delivery; no-feedback ablation 14 cells; Hill sweep monotone) under Mitchison's
      with-the-flux rule (Lean Law 5). The score falls because the remediation exposed that v2 credited
      prescribed outputs as simulations: the dome primordia and auxin maxima are seeded, the four-mode
      angles and WT ring profile are hand-built, and the dispersion peak is calibrated to its own reference.
      Those defects are now labelled in the code, figure and measurements and carried as Pass 4 items.
    scores:
      model-fidelity:
        value: 72
        rationale: >-
          Credited: the Boltzmann allocation and antisymmetric active + diffusive flux (L434-439, L495-499)
          match Jönsson Eqs. 1-4 / Smith Eq. 2; the new trafficking kinetics dP_ij/dt = k_exo f P_cyt -
          k_endo P_ij with pool conservation are the paper's PIN1 cycling scheme and are solved exactly
          (L238-284), with the QSS, BFA (k_exo = 0) and fast-cycling limits all behaving as Law 4 predicts
          (L820-886); the canalization slice implements the Mitchison/Feugier with-the-flux rule with the
          same trafficking kinetics (L705-716) and reproduces winner-take-all strand formation (Law 5).
          Deductions: the dome's auxin equation is not Jönsson Eq. 1 — the transport term is down-weighted
          by 0.14 and the field is relaxed at rate 0.38 toward a hand-built envelope target_a = 1.35 +
          0.55 pz + 2.65 prim (L508-513), with the primordia seeded at golden-angle targets (L396-397), so
          the convergence maxima are imposed (-10); the four phyllotactic regimes are not simulated at all —
          nominal angle plus seeded noise (L944-957) and golden placement by construction (L923-931) (-8);
          the WT ring profile is a sum of five hand-placed Gaussians (L1025-1028) (-3); kappa_4 is
          calibrated so the dispersion peak hits the 5.2-cell reference (L180-184), so lambda_c is an input
          (-3); the canalization is a single non-growing slice with a uniform sink row rather than the
          requested 3D tissue (-4).
        evidence:
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [238, 306], note: "Exact exponential integrator and analytic QSS of the PIN1 exocytosis/endocytosis kinetics (Law 4); verified in self-test 5 to 1e-9 against the frozen-field fixed point", supports: true}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [460, 499], note: "Coupled dome step: explicit kinetics or QSS ablation, BFA switch (L463), per-wall endocytosis variant with substeps (L477-487), membrane+cytosol conservation (L491) and antisymmetric flux (L495-499)", supports: true}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [617, 770], note: "Quasi-3D subepidermal canalization slice: net wall flux, Hill flux feedback f_0 + J^n/(K^n+J^n) (L712), uniform Dirichlet sink row (L722), strand width/concentration/delivery metrics (L728-744)", supports: true}
          - {file: morphoeval/lean/loops/Loop_032_auxin_pin1_phyllotaxis.lean, lines: [136, 202], note: "Laws 4 and 5 (trafficking QSS conservation/fixed point/monotonicity/BFA; quadratic flux feedback winner-take-all) machine-checked, 0 sorrys; Laws 1-3 at L31-111", supports: true}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [396, 415], note: "P1..P8 seeded at (k+1)*golden + N(0, 0.012 rad) and the initial auxin field pre-shaped by prim_envelope: primordium positions are inputs", supports: false}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [506, 514], note: "da/dt = rho0 - mu a + 0.14 sum J + 0.38 (target_a - a): a relaxation toward a prescribed envelope, not Jönsson Eq. 1", supports: false}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [921, 960], note: "Four 'regimes': spiral placed at k*137.5 deg by construction; distichous/decussate/tricussate = nominal angle + seeded noise; Gamma unused in the dynamics", supports: false}
          - {file: 2006-jonsson-auxin-pin1-meristem.py, lines: [180, 184], note: "kappa_4 = alpha_eff / s*(5.2 cells): the dispersion peak is calibrated to the reference it is later compared against", supports: false}
      specimen-match:
        value: 74
        rationale: >-
          Judged on the regenerated PNG and GIF: Panel A shows PIN1 polarity vectors converging on
          discrete auxin maxima in a hexagonal L1 lattice, visually consistent with Heisler 2005 /
          Jönsson Fig. 3 convergence points; Panel H shows a single-file strand of high auxin with
          PIN1 polarised downward from the source to the sink, resembling the midvein strand of Bayer
          2009 Fig. 3 and Scarpella 2006 PIN1::GFP files; Panel F overlays 410 detected leaf tips and
          the rosette mask on the Aeonium specimen with 12/12 sector coverage; the GIF shows the strand
          canalizing over 240 h. Deductions: the convergence pattern in Panel A is imposed by the seeded
          envelope, so its resemblance to live-imaging data is not evidence for the model (-8); the
          specimen is a Crassulaceae rosette, not an Arabidopsis meristem, and no PIN1 immunolocalization
          or provascular-strand image is vendored for side-by-side comparison of Panels A, G or H (-10);
          the parastichy spiral overlays in Panel F are fixed curves (L1348-1353), not fitted to the
          detected tips (-4); the Panel D wild-type profile is hand-drawn (-4).
        evidence:
