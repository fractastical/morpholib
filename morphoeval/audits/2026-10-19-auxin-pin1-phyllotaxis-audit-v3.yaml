          (L820-886, Panel G); --pin1-kinetics, --polarity-mechanism, --k-exo, --k-endo, --bfa-onset-h,
          --canal-hill-n, --canal-K-flux and --no-flux-feedback are wired through main() (L1802-1809,
          L1830-1855) alongside the existing --T-polar/--D-diff/--c1-gain/--rho0/--mu. Deductions: the
          headline morphospace parameter Gamma does not control anything — the four-regime panel is
          prescribed (L944-957) (-15); --T-polar/--D-diff/--c1-gain reach the dome only through a
          0.14-weighted transport term under a 0.38 envelope relaxation, so their effect on the auxin
