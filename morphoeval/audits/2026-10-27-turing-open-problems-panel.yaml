  - id: TOP-02
    slug: diffusion-ratio-census
    title: 'The diffusion-ratio problem: which molecularly identified Turing systems can be two-species at all?'
    assessors:
      gpt-5.6-sol:
        label: GPT 5.6 Sol Medium
        provider: OpenAI
        resolvability: 73
        band_detail: RESOLVE NOW — tool_fit 11/25, data_in_hand 14/20, falsifiable_done 13/15, compute_in_repo 15/15, isolation
          10/10, time_to_verdict 6/10, not_blocked 4/5
        factors:
          tool_fit:
            score: 11
            why: The literature scout and two-species dispersion code exist, but extraction and three-class adjudication are
              manual.
          data_in_hand:
            score: 14
            why: The cited public literature seeds six systems, though several diffusivities may be unavailable or incomparable.
          falsifiable_done:
            score: 13
            why: Six DOI-backed rows and explicit class counts are checkable, subject to rules for bounds and network topology.
          compute_in_repo:
            score: 15
            why: Literature extraction and dispersion calculations need no wet lab or heavy computation.
          isolation:
            score: 10
            why: The census table, analysis, and registration can be created independently.
          time_to_verdict:
            score: 6
            why: Finding defensible in-vivo diffusivities across six systems is more than a routine single search.
          not_blocked:
            score: 4
            why: A related zebrafish mobility prior was negative, but no census has tested this route.
        for_db: 4.0
        against_db: -2.5
        net_db: 1.5
        posterior_percent: 58.55
        confidence: 0.67
        verdict: PLAUSIBLY_DECISIVE
        note: A useful census is achievable, but class rules must distinguish unmeasured transport from evidence for a third
          immobile node.
        evidence_for:
        - db: 2.5
          text: The target systems and several cornerstone measurements are already named, making six classifications plausible.
        - db: 1.5
          text: The existing dispersion implementation directly tests two-node feasibility once coefficients are available.
        evidence_against:
        - db: -1.5
          text: Many systems may lack measured effective diffusivities in the relevant tissue and developmental stage.
        - db: -1
          text: The needs-immobile-node class cannot be inferred from a failed two-species diffusion ratio alone without a
            topology-specific model.
      gemini-4-argon:
        label: Gemini 4 Argon Medium
        provider: Google
        resolvability: 89
        band_detail: RESOLVE NOW — tool_fit 21/25, data_in_hand 15/20, falsifiable_done 14/15, compute_in_repo 15/15, isolation
          10/10, time_to_verdict 9/10, not_blocked 5/5
        factors:
          tool_fit:
            score: 21
            why: models/1952-turing-morpho.py already implements the exact 2-node Jacobian dispersion relation and d_c threshold,
              and morphoeval/scout_literature.py automates literature queries.
          data_in_hand:
            score: 15
            why: Nodal/Lefty FRAP/FCS diffusivities (Mueller 2012) and GDF5/NOG parameters (Grall 2024) are known in literature;
              the remaining systems require structured literature extraction.
          falsifiable_done:
            score: 14
            why: Three mutually exclusive classes (two-node-feasible, needs immobile third node, D unmeasured) with pre-registered
              counts across >=6 systems give an unambiguous score.
          compute_in_repo:
            score: 15
            why: Evaluating analytic dispersion inequalities and critical diffusion ratios across a table of <10 systems takes
              milliseconds in Python.
          isolation:
            score: 10
            why: Self-contained as a new literature table, dispersion verifier script, and prediction registry file.
          time_to_verdict:
            score: 9
            why: Reachable in a single sitting via targeted literature lookup and algebraic verification.
          not_blocked:
            score: 5
            why: No prior attempt in the repo has assembled or tested the cross-system diffusivity ratio census.
        for_db: 7.0
        against_db: -1.5
        net_db: 5.5
        posterior_percent: 78.01
        confidence: 0.88
        verdict: HIGHLY_TRACTABLE_DECISIVE
        note: The crux is distinguishing truly unmeasured in vivo diffusivities from indirect effective range estimates, since
          all three classification buckets are already guaranteed to be populated by Nodal/Lefty, Bmp-Sox9-Wnt, and WNT/DKK.
          Note that d_c = 3.9271 is specific to Turing's 1952 numerical Jacobian example, whereas each biological system has
          its own kinetic Jacobian bounds on D_inh/D_act.
        evidence_for:
        - db: 4.0
          text: 'Published literature already anchors all three target classes: zebrafish Nodal/Lefty has measured D_Lefty/D_Nodal
            ~ 15-20 (Mueller et al. 2012, class 1), Bmp-Sox9-Wnt and GDF5/NOG rely on cell-autonomous Sox9/pSmad nodes (Raspopovic
            2014, Grall 2024, class 2), and mammalian WNT/DKK lacks paired in vivo extracellular FCS/FRAP values (class 3).'
        - db: 3.0
          text: The algebraic dispersion criterion in models/1952-turing-morpho.py is already Lean-verified and requires zero
            PDE integration noise.
        evidence_against:
        - db: -1.5
          text: Pre-registering exact class counts before literature extraction carries a modest risk of missing the exact
            integer split if an obscure FRAP paper exists for FGF/Shh or EDAR/BMP.
      claude-fable-5-1:
        label: Claude Fable 5.1 Thinking High (fresh context)
        provider: Anthropic
        resolvability: 61
        band_detail: RESOLVABLE WITH WORK — tool_fit 8/25, data_in_hand 12/20, falsifiable_done 9/15, compute_in_repo 13/15,
          isolation 8/10, time_to_verdict 6/10, not_blocked 5/5
        factors:
          tool_fit:
            score: 8
            why: scout_literature.py --query is only an OpenAlex search; the 1952 dispersion/d_c = 3.9271 is for the Gray-Scott
              Jacobian and does not transfer to WNT/DKK, Nodal/Lefty etc. kinetics, so the classifying computation is not
              a run-as-is tool.
          data_in_hand:
            score: 12
            why: Public literature; Nodal/Lefty (Mueller 2012) and GDF5/NOG (Grall 2024) are known; others need targeted FRAP/FCS
              lookups and may be unmeasured (which the packet counts as a finding).
          falsifiable_done:
            score: 9
            why: Pre-registered class counts are checkable, but assigning 'two-node-feasible' needs a kinetics-specific threshold;
              'bounded D' and class boundaries carry taste.
          compute_in_repo:
            score: 13
            why: Dispersion evaluation is trivial; the effort is reading, not compute.
          isolation:
            score: 8
            why: New table under datasets/ plus one registry row in a shared file.
          time_to_verdict:
            score: 6
            why: '>=6 systems with DOI-cited D values is one long literature sitting; feasible but easily spills over.'
          not_blocked:
            score: 5
            why: No prior repo attempt at a census; scout-063 ZF-TUR-01 is a related negative, not a refutation of this route.
        for_db: 8
        against_db: -6
        net_db: 2
        posterior_percent: 61.31
        confidence: 0.55
        verdict: CENSUS_REACHABLE_CLASSES_DISPUTABLE
        note: 'Crux: the table will be assembled, but ''two-node-feasible'' needs a per-system Jacobian or a stated generic
          bound; the packet''s reliance on the GS d_c is the weak link.'
        evidence_for:
        - db: 3
          text: 'Nodal/Lefty D values are measured (Mueller 2012: ~0.7 vs ~18 um^2/s), giving at least one clean two-node-feasible
            row.'
        - db: 2
          text: GDF5/NOG (Grall 2024) is a published no-differential-diffusion case, populating the 'needs immobile third
            node' class.
        - db: 3
          text: The 'D unmeasured' class is trivially populated (WNT/DKK in skin, EDAR/WNT/BMP ridges), so the >=6-row and
            three-class coverage conditions are easy to meet.
        evidence_against:
        - db: -3
          text: Two-node feasibility depends on the kinetic Jacobian, not just the D ratio; using the Gray-Scott d_c as a
            universal gate makes class assignments disputable.
        - db: -2
          text: The three classes are not mutually exclusive once network topology is considered (Marcon 2016), so a scorer
            can contest the pre-registered counts.
        - db: -1
          text: Extracellular D estimates differ 10-100x between FRAP, FCS and modelling fits for the same morphogen, so single
            rows can flip class.
    pooled:
      method: log-odds mean across 3 assessors (equal priors 50%, so pooled net dB = mean net dB)
      prior_percent: 50.0
      net_db: 3.0
      bayes_factor: 1.9953
