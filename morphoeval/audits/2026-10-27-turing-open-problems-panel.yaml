  problems:
  - id: TOP-01
    slug: mechanism-discriminator
    title: 'Mechanism identification: a pre-registered statistic that separates reaction-diffusion from colonisation, phase
      separation and buckling on static patterns'
    assessors:
      gpt-5.6-sol:
        label: GPT 5.6 Sol Medium
        provider: OpenAI
        resolvability: 70
        band_detail: RESOLVE NOW — tool_fit 10/25, data_in_hand 16/20, falsifiable_done 14/15, compute_in_repo 12/15, isolation
          9/10, time_to_verdict 6/10, not_blocked 3/5
        factors:
          tool_fit:
            score: 10
            why: The RD/Eden paired harness exists, but two generators and the four-way discriminator must be written.
          data_in_hand:
            score: 16
            why: Ten pinned specimen references and ROIs exist, although the image files themselves are absent from the checked
              dataset directory.
          falsifiable_done:
            score: 14
            why: A locked accuracy threshold and confusion matrix make the synthetic test objective.
          compute_in_repo:
            score: 12
            why: All four synthetic generators are feasible on the scientific Python stack, but two require substantive implementation.
          isolation:
            score: 9
            why: The discriminator and missing generators can be added as new files with only registry additions.
          time_to_verdict:
            score: 6
            why: Generator implementation, calibration, and held-out scoring are unlikely to fit one short loop.
          not_blocked:
            score: 3
            why: The exact multi-feature route is untried, but the direct RD-versus-Eden precursor was non-discriminating.
        for_db: 5
        against_db: -3
        net_db: 2
        posterior_percent: 61.31
        confidence: 0.72
        verdict: LIKELY_DECISIVE
        note: 'The synthetic benchmark is closeable, but the packet overstates data-in-hand: the checked dataset has pinned
          references rather than the ten image files. A reject or abstention rule is also needed to make the Holstein class
          assignment scientifically definite.'
        evidence_for:
        - db: 3
          text: The repository contains mature RD and Eden generators, specimen metadata, ROIs, and paired comparison code.
        - db: 2
          text: Synthetic ground-truth labels permit an unambiguous held-out classification score.
        evidence_against:
        - db: -2
          text: Cahn-Hilliard, buckling, and the actual discriminator are new implementations whose artifacts could dominate
            accuracy.
        - db: -1
          text: High synthetic accuracy does not ensure that heterogeneous real photographs receive a stable definite class.
      gemini-4-argon:
        label: Gemini 4 Argon Medium
        provider: Google
        resolvability: 84
        band_detail: RESOLVE NOW — tool_fit 16/25, data_in_hand 20/20, falsifiable_done 14/15, compute_in_repo 14/15, isolation
          10/10, time_to_verdict 7/10, not_blocked 3/5
        factors:
          tool_fit:
            score: 16
            why: models/1981-murray-bos-taurus-turing-wavelength.py and models/1952-turing-morpho.py provide RD and Eden generators
              plus Holstein mask handling, but Cahn-Hilliard and elastic buckling solvers must be written fresh.
          data_in_hand:
            score: 20
            why: The 10 Holstein coat masks and reference fixtures are already pinned in datasets/bos_taurus_turing_wavelength/
              and synthetic ground truth is generated in-run.
          falsifiable_done:
            score: 14
            why: Pre-registered held-out accuracy threshold on four-class synthetic data and blind application to 10 Holstein
              masks is strictly checkable once feature set and hyperparameters are hash-locked.
          compute_in_repo:
            score: 14
            why: 2D PDE sweeps for RD, Eden, Cahn-Hilliard, and Swift-Hohenberg/Foppl-von Karman buckling on ~160x120 grids
              run in minutes on NumPy/SciPy.
          isolation:
            score: 10
            why: Can be implemented entirely as a new benchmark script, prediction registry entry, and output artifact without
              touching existing tracked files.
          time_to_verdict:
            score: 7
            why: Building and validating two new physical generators plus multi-feature extraction and cross-validation takes
              a focused multi-hour loop.
          not_blocked:
            score: 3
            why: OP-11 already showed growing RD and Eden colonisation are indistinguishable on basic patch statistics (p=0.91),
              narrowing the feature space that could separate them.
        for_db: 5.5
        against_db: -4.5
        net_db: 1.0
        posterior_percent: 55.73
        confidence: 0.78
        verdict: SYNTHETIC_SEPARABLE_EMPIRICAL_AMBIGUOUS
        note: The crux is whether higher-order morphological statistics (Minkowski functionals, chord-length distributions,
          or boundary curvature spectra) can break the OP-11 degeneracy between growing-domain RD and Eden colonisation after
          binary Otsu thresholding. The packet understates how severely the low patch count per Holstein flank limits spectral
          and defect-based features on the empirical specimens.
        evidence_for:
        - db: 3.5
          text: Cahn-Hilliard coarsening (power-law structure factor k^4 tail), elastic buckling (narrow spectral ring with
            rigid defect lattice), and RD/Eden have distinct spectral and Minkowski signatures on synthetic domains.
        - db: 2.0
          text: All 10 Holstein ROI masks and the paired evaluation harness in models/1981-murray-bos-taurus-turing-wavelength.py
            are already in-repo and SHA-256 verified.
        evidence_against:
        - db: -3.0
          text: OP-11 demonstrated that growing-domain RD and stochastic Eden colonisation converge on adult patch morphology
            (Wilcoxon p=0.91), making 4-way synthetic accuracy hard to maintain when thresholded to binary coat masks.
        - db: -1.5
          text: Small sample size per specimen (a handful of body-scale patches per cow flank) produces high variance in Minkowski
            functionals and defect counts on the empirical test set.
      claude-fable-5-1:
        label: Claude Fable 5.1 Thinking High (fresh context)
        provider: Anthropic
        resolvability: 74
        band_detail: RESOLVE NOW — tool_fit 15/25, data_in_hand 18/20, falsifiable_done 12/15, compute_in_repo 12/15, isolation
          7/10, time_to_verdict 7/10, not_blocked 3/5
        factors:
          tool_fit:
            score: 15
            why: models/1981-murray-bos-taurus-turing-wavelength.py has RD + Eden generators, coat masks and a paired harness
              as-is; Cahn-Hilliard (adaptable from 2002-sumper diatom phase-sep) and buckling (1975-richman) need adapting;
              the discriminator/classifier itself is new code.
          data_in_hand:
            score: 18
            why: 10 SHA-pinned Holstein specimens in datasets/bos_taurus_turing_wavelength (1 + 9 extra_specimens); synthetic
              ground truth is generated in-run.
          falsifiable_done:
            score: 12
            why: Locked held-out accuracy + confusion matrix is taste-free; 'definite class for the Holstein set' needs a
              pre-registered posterior/margin criterion or it becomes arguable.
          compute_in_repo:
            score: 12
            why: Four 2D generators x ~100 seeds, Minkowski/PSD features and a numpy LDA/kNN run in hours on the numpy/scipy
              stack; no wet lab.
          isolation:
            score: 7
            why: New script + new result files; the predictions/ registry row touches a shared CSV/JSON that parallel agents
              also append to.
          time_to_verdict:
            score: 7
            why: 'One long sitting: generator adaptation, feature pipeline, training, blind application.'
          not_blocked:
            score: 3
            why: OP-11 found RD-vs-Eden indistinguishable on these masks (p=0.91); not the same multi-feature route, but a
              recorded negative on the Holstein leg.
        for_db: 9
        against_db: -7
        net_db: 2
        posterior_percent: 61.31
        confidence: 0.6
        verdict: SYNTHETIC_LEG_DECISIVE_HOLSTEIN_FRAGILE
        note: 'Crux: the synthetic confusion matrix is cheap and decisive; the blind Holstein application is where the hypothesis
          will be fought over. Packet says CH/buckling generators ''must be written fresh'' but non-template phase-separation
          (2002-sumper) and buckling (1975-richman) scripts exist to adapt.'
        evidence_for:
        - db: 4
          text: Synthetic ground truth is generated in-run, so the registered held-out accuracy is measurable with no external
            dependency.
        - db: 3
          text: Three of four generators (RD, Eden, phase separation, buckling) already exist in some form in models/; only
            adaptation, not invention, is needed.
        - db: 2
          text: Candidate features (radial PSD shape, Minkowski functionals, junction statistics) are standard and implementable
            in numpy/scipy in-repo.
        evidence_against:
        - db: -3
          text: OP-11 p=0.91 on the same masks suggests RD vs Eden is near-indistinguishable at photo resolution, so the Holstein
            leg may land in an indeterminate region.
        - db: -2
          text: Synthetic-to-photograph domain shift (mask resolution, body curvature, Otsu/colour segmentation artefacts)
            can dominate the features; a scorer may dispute whether the Holstein class reflects mechanism.
        - db: -2
          text: '''Returns a definite class'' is a second, taste-prone clause; unless a margin is locked, an ambiguous posterior
            yields a contested rather than decisive outcome.'
