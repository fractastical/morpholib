    remediation:
      - id: R1
        item: "Parameter-regime sweep: vary the diffusion scale and show that measured wavelength tracks the analytic square-root law."
      - id: R2
        item: "Negative control: set D_u = D_v and show that the activator amplitude collapses."
      - id: R3
        item: "Segment the real specimen photograph (foreground, contour circularity, structure-tensor coherency, movable-band count, osteoderm spacing)."
      - id: R4
        item: "Goodness-of-fit on the sweep: Pearson r, RMSE, a KS statistic, and the coefficient of variation across seeds."
      - id: R5
        item: "Independent second assessor. This pass is single-assessor."
      - id: R6
        item: "Decompose the 4.56 µm versus 4.108 µm red-shift (finite amplitude versus the linear dispersion curve)."
