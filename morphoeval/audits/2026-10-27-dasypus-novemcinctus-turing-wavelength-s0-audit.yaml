simulations:
  - id: delphi10000-dasypus-novemcinctus-turing-wavelength-s0
    name: "Schnakenberg Turing wavelength at 4.108 µm on Holocene Dasypus novemcinctus dermis (Pass 1)"
    organism: "Dasypus novemcinctus (nine-banded armadillo)"
    script: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py
    output: docs/media/dasypus_novemcinctus_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/dasypus_novemcinctus_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs: [chen2011, vickaryous2006, turing1952, schnakenberg1979, murray1981]
    claim_boundary:
      reported_in_source:
        - "Vickaryous and Hall (2006) describe five osteoderm shields and hexagonal rosettes on the Dasypus novemcinctus carapace, developed intramembranously in the dermis."
        - "Chen et al. (2011) report mechanical tests and microstructure of mineralized armadillo osteoderm."
        - "Turing (1952) and Schnakenberg (1979) give the two-species reaction-diffusion dispersion relation."
      reconstructed_in_script:
        - "Schnakenberg parameters a=0.10, b=0.90, D_v/D_u=20, with D_u solved so the linear wavelength is 4.108 µm on a periodic 12-wavelength patch."
        - "Saturated activator wavelength 4.56 µm against the linear target 4.108 µm, and σ(k_c)=0.219 > 0 while σ(0)<0."
      transfer_boundary:
        - "The 4.108 µm figure is this loop's subcellular detail rung, not a wavelength measured by Chen or Vickaryous. The photograph is an organism-scale carapace, not a 4.1 µm micrograph."
      does_not_claim:
        - "That nine-banded armadillo osteoderm rosettes are caused by a 4.1 µm Turing instability."
        - "A parameter sweep, an equal-diffusion ablation, or a Pearson/RMSE/KS fit (those are Pass 1 gaps)."
    summary: >-
      Pass 1 overall 77.2/100. The script implements Schnakenberg kinetics and the
      Turing wavenumber identity at 4.108 µm (0 Ma, Holocene, chronoseries length 1)
      and renders a 12-frame 640×480 GIF next to a CC BY-SA specimen photograph.
      The saturated lattice measures 4.56 µm, longer than the linear target.
      No sweep, ablation, specimen segmentation, or goodness-of-fit is present yet.
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          Fourier-split Schnakenberg integration and the critical-wavenumber formula
          are implemented as published. Diffusivities are reconstructed to hit 4.108 µm
          rather than taken from a Dasypus experiment, so this is not a direct paper reproduction.
        evidence:
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [79, 126], note: "Jacobian and k_c identity (Eqs. 1-3)", supports: true}
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [128, 167], note: "Periodic Fourier-split integrator", supports: true}
          - {file: morphoeval/lean/loops/Loop_3166_dasypus_novemcinctus_turing_wavelength_s0.lean, lines: [20, 54], note: "Seven theorems, zero sorry, mode packing 66 and Turing discriminant", supports: true}
      specimen-match:
        value: 76
        rationale: >-
          The comparison figure places the real La Fortuna photograph beside the activator
          and an overlay. The GIF modulates that carapace with the growing spot field.
          There is no segmented osteoderm measurement yet, and the photo is not a 4.1 µm micrograph.
        evidence:
          - {file: docs/media/dasypus_novemcinctus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Three-panel specimen, activator, overlay", supports: true}
          - {file: docs/media/dasypus_novemcinctus_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640x480", supports: true}
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [215, 263], note: "Growth GIF uses specimen carrier plus activator", supports: true}
      parameter-expressivity:
        value: 58
        rationale: >-
          a, b, and the diffusion ratio are named constants and the dispersion identity is
          checked in --self-test. No range is exercised, so monotonic control of wavelength
          is not demonstrated.
        evidence:
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [42, 58], note: "Named a, b, diffusion ratio, grid, and seed. Pass 1 did not sweep them.", supports: true}
      morphometric-validation:
        value: 64
        rationale: >-
          The saturated wavelength (4.56 µm) is reported against the linear target 4.108 µm,
          and σ(k_c) is positive. Pearson r, RMSE, KS, and a specimen segmentation are absent,
          so the dimension cannot score higher on this pass.
        evidence:
          - {file: models/2026-delphi10000-dasypus-novemcinctus-turing-wavelength-s0.py, lines: [169, 201], note: "Radial Fourier wavelength with parabolic peak", supports: true}
      source-traceability:
