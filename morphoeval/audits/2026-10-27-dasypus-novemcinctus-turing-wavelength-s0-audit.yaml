          - {file: datasets/dasypus_novemcinctus_turing_wavelength_s0/dasypus_novemcinctus_turing_wavelength_s0_reference.json, lines: [1, 70], note: "Scale 4.108e-06 m, age 0 Ma, specimen SHA-256", supports: true}
      code-traceability:
