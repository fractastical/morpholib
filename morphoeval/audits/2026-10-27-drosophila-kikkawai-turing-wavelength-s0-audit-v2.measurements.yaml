      - Slot 3190's 2.343 µm assignment is the growth-rate peak at Du=0.020, Dv=1.364, a=0.070, b=0.940, and the
        rendered field is locked to the twentieth mode of a 46.86 µm patch (L/20 = 2.343 µm).
      - The chronoseries shift is inhibitor range only. The Gibert major-gene axis is reconstructed as b, not re-estimated
        from their plates.
      transfer_boundary:
      - Nothing here is a measurement of hydei or mauritiana cuticle, and nothing transfers to the 93 µm tergite-band
        sibling slot.
