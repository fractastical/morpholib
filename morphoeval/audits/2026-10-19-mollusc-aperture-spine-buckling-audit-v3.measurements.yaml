      reported_in_source:
      - 'Chirat, Moulton & Goriely (2013): the mantle edge is an elastic strip growing against the calcified shell
        margin; excess growth gamma > gamma_c buckles it with wavelength lambda_1 ~ (E h_1^3 / 3 K_s)^(1/4) set
        by the mantle thickness and the foundation stiffness, giving comb spines along the siphonal canal of Murex
        pecten and varix spines in muricids'
