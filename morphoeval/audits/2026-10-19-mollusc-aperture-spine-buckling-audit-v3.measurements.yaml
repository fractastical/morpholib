        into a hollow tube, and thinner secondary/tertiary mantle generations produce the fractal frond cascade
        k_{i+1}/k_i = (h_i/h_{i+1})^(3/4) of Chicoreus ramosus'
      - 'Rudraraju et al. (2019): the full problem is a finite-strain morphoelastic shell with surface and volume
        growth, solved by finite elements'
      - 'Koiter (1966) and Manor, Hagberg & Meron (2008): the thin-shell energy used for the reduced surface model,
        and wave-number locking of a pattern-forming system to a spatially periodic forcing (Arnold tongues)'
      reconstructed_in_script:
      - Hierarchical wavenumber law k_i^* = (3 K_s / (E h_i^3))^(1/4); 1-D unilateral fourth-order comb energy minimised
        by L-BFGS-B at the rounded mode q_mode = 2 pi round(L/lambda_1)/L; parametric omega-loop spine profile with
        a linear neck-gap law; prescribed 3-stage frond cosines; prescribed 120 deg varix bursts; 10-species cross-taxa
        table; DoG specimen segmentation (Pass 2)
      - 'Pass 3: reduced linearised Koiter/FvK surface w(s,t) on a 192x96 bi-periodic torus (L_s = 67.2 mm, L_t
        = 24 mm, D = 1, K_0 = (k_1^*)^4) with varix growth window P(t), additive cord ridge forcing, semi-implicit
        gradient flow + L-BFGS-B relaxation from noise, emergent spine count / cord-intersection registration /
        ridge tilt; locking-tongue and obliquity sweeps; inverse-WKB h(u) from the specimen spacing profile; graded-rigidity
        1-D comb with uniform control; allometric instar series with Brent root beta*'
      transfer_boundary:
      - The Koiter surface is linearised (no finite membrane strain, flat reference torus, nondimensional D = 1
        with outputs labelled mm) and the planar elastica cross-section is not coupled to it; both are separate
        modules, so the Pass 2 item 1 (3D finite-strain Koiter FE coupling) is addressed only in reduced form
      - h(s) is inferred from a Murex pecten photograph via inverse WKB (R^2 = 0.29, floor 0.35), not measured by
        micro-CT, and the species is not the Chicoreus ramosus the Pass 2 item asked for; no Chicoreus specimen
