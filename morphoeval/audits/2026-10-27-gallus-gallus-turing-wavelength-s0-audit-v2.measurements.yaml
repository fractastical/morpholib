    claim_boundary:
      reported_in_source:
      - Turing (1952) derived a finite-wavenumber instability of a homogeneous reaction-diffusion state.
      - Prum & Williamson (2002) reproduced within-feather bars, spots, and ocelli with reaction-diffusion on a
        growing feather germ.
      - Harris et al. (2005) reported Shh/Bmp2 activator-inhibitor interactions during barb-ridge formation in embryonic
        Gallus gallus.
      reconstructed_in_script:
      - Schnakenberg onset at (a, b, Du, Dv) = (0.2005, 0.7995, 1, 16) with γ solved so λ_c = 319.2 µm.
      - Dv sweep, equal-diffusion ablation, and a short periodic integration of the same kinetics.
      - Held-out three-harmonic radial fit and computer-vision segmentation of the gallery ocellus plate.
      - 'Singleton Holocene chronoseries: age 0 Ma, no predecessor and no successor.'
      transfer_boundary:
      - 319.2 µm is the slot wavelength. The painted bar measures a 66.4 µm ring pitch on this plate and is not
        used as λ_c.
      - The radial reconstruction is a weakly nonlinear reduction of the critical circle, not Prum & Williamson's
        full growing-feather geometry.
      does_not_claim:
      - A blinded test on a second feather.
      - That the painted 100 µm bar equals 319.2 µm.
      - An independent second assessor.
