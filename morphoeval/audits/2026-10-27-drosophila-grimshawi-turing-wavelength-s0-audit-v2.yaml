simulations:
  - id: delphi10000-drosophila-grimshawi-turing-wavelength-s0
    name: "Drosophila grimshawi Turing wavelength at 2.8 µm (detail)"
    organism: "Drosophila grimshawi"
    script: models/2026-delphi10000-drosophila-grimshawi-turing-wavelength-s0.py
    output: docs/media/drosophila_grimshawi_turing_wavelength_s0_comparison.png
    supersedes_audit_id: 2026-10-27-drosophila-grimshawi-turing-wavelength-s0-audit
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, edwards2007, clark2007, werner2010, koshikawa2020]
    summary: >-
      Pass 2 closes the three pass-1 remediation items. The comparison figure
      now plots λ_c against δ from 9 to 20 (monotone lengthening; grimshawi at
      δ = 16.3186, λ = 2.766 µm).       Sobel-orientation KS between the masked gallery specimen and the spiral
      is 0.0418; the zero-arm ablation KS is 0.0191, so orientation distance
      alone does not rank the spiral first. The full CV score does: the
      zero-arm ablation, which is not histogram-matched, scores CV 71.4
      against 93.8 for the spiral (drop 22.4). Specimen Otsu fraction is
      referenced to that ablation, not to a copy of itself.
      Dispersion growth Pearson r remains 0.99974. Chronoseries at 0 Ma, same kinetics: ficusphila 2.512 µm,
      guttifera 2.629 µm, grimshawi 2.766 µm. Residual limit: the canonical
      image is the project gallery spiral, not a 2.8 µm wing micrograph, and
      Lean was not executed because no Lean binary is installed.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) and Schnakenberg (1979) supply the instability and the kinetics."
        - "Edwards et al. (2007) and Werner et al. (2010) are the picture-wing and guttifera Wingless sources. They do not measure a 2.765 µm wavelength."
      reconstructed_in_script:
        - "Fastest-mode calibration, numerical growth fit, δ sweep, chronoseries order, orientation KS, Otsu fractions, and the zero-arm ablation."
        - "Spiral render with the specimen radial envelope and a melanin colour regression."
      transfer_boundary:
        - "Image fitness uses the gallery asset because Commons results were envelope labels."
      does_not_claim:
        - "Does not claim a measured ultrastructural wavelength from Edwards or Werner."
        - "Does not claim nonlinear spot coarsening stays at 2.765 µm."
        - "Does not claim the Lean proofs were checked by a Lean kernel in this environment."
    scores:
      model-fidelity:
        value: 89
        rationale: "The eigenvalue, the cosine-seeded PDE (r = 0.99974), equal-diffusion σ_max = -0.717, and a zero-arm ablation whose CV falls from 93.8 to 71.4 are all in the script. The animation is still the near-onset spiral, not a coarsened 2D spot field."
        evidence:
          - {file: models/2026-delphi10000-drosophila-grimshawi-turing-wavelength-s0.py, lines: [67, 79], note: "dispersion eigenvalue", supports: true}
          - {file: models/2026-delphi10000-drosophila-grimshawi-turing-wavelength-s0.py, lines: [607, 627], note: "zero-arm ablation", supports: true}
      specimen-match:
        value: 87
        rationale: "GIF last frame CV is 93.8 at 800×600 with 12 frames. Removing the spiral carrier drops CV by 22.4 (ablation 71.4). The gallery frame is not a retinal micrograph, which caps this score."
        evidence:
          - {file: docs/media/drosophila_grimshawi_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 800x600 GIF", supports: true}
          - {file: docs/media/drosophila_grimshawi_turing_wavelength_s0_comparison.png, lines: [1, 1], note: "specimen, spiral, sweep, ablation", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "λ_c increases monotonically with δ from 9 to 20 on the pass-2 panel. The focal, predecessor, and successor ratios are marked by the dispersion curves and the bar chart."
        evidence:
          - {file: models/2026-delphi10000-drosophila-grimshawi-turing-wavelength-s0.py, lines: [335, 347], note: "δ sweep and ablation panels", supports: true}
          - {file: models/2026-delphi10000-drosophila-grimshawi-turing-wavelength-s0.py, lines: [110, 120], note: "parameter_sweep", supports: true}
      morphometric-validation:
        value: 90
        rationale: "Growth Pearson r = 0.99974 (gate 0.98). Radial envelope r = 0.99542. Orientation KS is 0.0418 for the spiral and does not by itself beat the ablation; the CV drop of 22.4 does. Specimen Otsu fraction is referenced to the unmatched ablation, not copied from the specimen."
        evidence:
          - {file: models/2026-delphi10000-drosophila-grimshawi-turing-wavelength-s0.py, lines: [559, 604], note: "Otsu fraction and orientation KS", supports: true}
          - {file: models/2026-delphi10000-drosophila-grimshawi-turing-wavelength-s0.py, lines: [122, 173], note: "growth-rate Pearson fit", supports: true}
      source-traceability:
        value: 89
        rationale: "DOIs for Turing, Schnakenberg, Edwards 2007, Clark 2007, Werner 2010, and Koshikawa 2020 are in the bib and reference JSON. Specimen SHA-256 is pinned. The rejected Commons envelopes are recorded in the scout manifest."
        evidence:
