          - {file: datasets/drosophila_grimshawi_turing_wavelength_s0/scout_manifest.json, lines: [1, 40], note: "slot 3186 territory and Commons hits", supports: true}
      code-traceability:
        value: 86
        rationale: "Dispersion, sweep, ablation, and morphometrics are separate functions. Lean states the trace sign, equal-diffusion suppression, wavelength order, and stripe count with zero sorry. The kernel was not run here."
        evidence:
