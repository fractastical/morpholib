    note: >-
      External inputs are three vendored, SHA-256-pinned JSON fixtures derived
      from MesmerPrism/rusty-matter at commit
      ad111fa7ecfd8f43d292ff3b1d27d3af2741d828 and PlanformDB 2.5.0, plus the
      cached Wikimedia Commons Smediterranea.jpg photograph (SHA-256 pinned in
      the script; CC BY 2.5).  The pinned rusty-matter source was inspected in
      the first audit.  A fresh search again exposed the 2021 abstract and an
      author presentation, and the 2020 abstract, but not either full article;
      equation-level fidelity was not assessed.  To avoid changing repository
      outputs, the prescribed headless runs used --out and --csv under /tmp:
      --self-test, --no-show, and --gif were run, followed by a second complete
      PNG/CSV/GIF generation.  Both PNGs, both CSVs and both 46-frame GIFs were
      byte-identical.

