# MorphoEval audit — Cervera–Levin–Mafe gap-junction synthesis, 2026-10-17 (re-score; supersedes 2026-10-17-cervera-audit)
#
# This re-score independently checks the remediation pass at a0d6848.  Several
# defects in the first audit (44.9) are genuinely fixed.  The program now calls
# its reaction–diffusion system a qualitative analogue and rusty-matter an
# educational circuit port; f3 changes an explicitly plotted ML concentration
# profile; crop CSV wavefronts are direct solver results; the real silhouette
# yields an area fraction; parity covers every sampled frame and is correctly
# distinguished from biological validation; the PMID is corrected; and the
# expanded self-test exercises symmetry, monotonic f2 response, f3 sensitivity
# and CSV bookkeeping.  Two independent complete runs produced byte-identical
# PNG, CSV and 46-frame GIF.
#
# The new empirical comparison is meaningful but weak.  One parameter is fit to
# four octanol crop positions (RMSE 4.2 percentage points) and transferred to
# four innexin-RNAi positions (RMSE 23.5, r=0.94); the held-out error is large,
# the series share crop positions and source curation, and no uncertainty is
# estimated.  The separate rusty-matter crop curve still uses its old
# crop-specific wound-gain lookup.  f3 now controls m3 monotonically, but m3 is
# not mapped to a measured lateral anatomy, so it is a signal axis rather than
# demonstrated morphology expressivity.
#
# The claimed "derived" bipolar cutoff is only partly derived.  Its numerical
# value uses the Planform WT pharynx centre, but combines it with the renderer's
# hard-coded 100-unit pharynx length and the silhouette helper's padded plotting
# bounds; most importantly, the biological rule that an m1/m2 boundary crossing
# the posterior pharynx end causes a double head has no cited source or empirical
# test.  A new inversion defect also remains: shift_index clips at one, so
# f2_for_shift(1) returns its lower search bound 0.20, while direct evaluation
# puts x*=0.583 near f2=0.42.  The CSV and panel E therefore print a wrong f2
# threshold, and the self-test checks only that x*_b is in (0.5,1), not that its
# inverse is correct.
#
# Specimen fidelity remains limited.  The photograph is now measured, but only
# as a body-width-weighted area under a one-dimensional territory boundary; no
# treated head or auricle is generated or compared.  Morphology still switches
# categorically between two Planform cartoons.  Panel D honestly labels its
# 0–24 h map illustrative, but its 3–6 h shading and hard-coded 85.8/20.6% legend
# values do not match the current simulation (91.8/23.5%).  The full 2021 and
# 2020 articles were again unavailable, so equation-level fidelity remains
# unverified and is not inferred from comments.
#
# Scores are on the rubric's 0-100 scale.  Line numbers refer to files at the
# checkpoint commit recorded below; [0, 0] denotes generated image/CSV evidence.

