simulations:
  - id: vogel-phyllotaxis
    name: "Vogel (1979) & Douady–Couder (1992) Golden-Angle Phyllotaxis"
    organism: "Helianthus annuus (sunflower capitulum)"
    script: 1979-vogel-phyllotaxis.py
    output: vogel_phyllotaxis_comparison.png
    also: [docs/media/vogel_phyllotaxis_growth.gif, vogel_phyllotaxis_metrics.csv]
    domain: morphogenesis
    status: evaluated
    supersedes_audit_id: 2026-10-18-phyllotaxis-audit
    claim_boundary:
      reported_in_source:
        - "Vogel (1979) defines planar capitulum spiral placement r_n = c*sqrt(n), theta_n = n*alpha_0 with golden divergence angle alpha_0 = 360/tau^2 = 137.507764 deg"
        - "Douady & Couder (1992, 1996) demonstrate self-organized convergence of repulsive Hofmeister primordia on a radially advecting meristem ring to the golden and Lucas noble angles"
        - "Swinton, Ochu & MSI Turing's Sunflower Consortium (2016) report 768 photoreviewed parastichy counts across 657 Helianthus annuus heads (82.3% Fibonacci structure; 49 Fib-1 vs 17 Fib+1, binomial p = 5.07e-5)"
      reconstructed_in_script:
        - "Planar Vogel spiral generator, Delaunay/Voronoi rising Fibonacci parastichy cascade (8,13)->(13,21)->(21,34)->(34,55), bounded Voronoi area CV & circularity optimality, Douady-Couder Hofmeister relaxation, DoG floret segmentation on helianthus_annuus_capitulum_specimen.jpg, and rim-dislocation ensemble reproducing Fib-1 > Fib+1"
      transfer_boundary:
        - "Outer-rim Delaunay contact-chain loss on noisy capitula used to model the empirical excess of Fibonacci-1 over Fibonacci+1 counts in Swinton et al. (2016)"
      does_not_claim:
        - "Full 3D auxin PIN1 transport PDE simulation on a curved dome (uses Vogel's kinematic spiral and Douady & Couder's effective Hofmeister inhibitory potential)"
    source_refs: [vogel1979, douady1992, douady1996, swinton2016, jean1994]
    summary: >-
      Remediated v2 reproduction of Vogel (1979) and Douady & Couder (1992, 1996)
      golden-angle phyllotaxis validated against Swinton et al. (2016) Royal
      Society Helianthus annuus parastichy data and direct Difference-of-Gaussians
      floret segmentation on a real capitulum photograph (621 segmented florets,
      402 interior Voronoi cells, mean circularity 0.793 vs 0.853 model). All
      four defects surfaced in the v1 dual-agent audit are resolved and verified
      by automated assertions in `run_self_tests()`.
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          Vogel's (1979) planar spiral law, rising Fibonacci parastichy cascade
          (8,13)->(13,21)->(21,34)->(34,55), Lucas (29,47)->(47,76) branch, and
          bijugate 2*(21,34) = (42,68) whorls are reproduced and verified by
          Delaunay contact-graph topology. Douady & Couder's (1992) Hofmeister
          repulsive energy minimization converges from disparate initial angles
          (175 deg and 130 deg -> 137.59 deg; 99.8 deg -> 99.38 deg), and the
          noisy rim-dislocation ensemble mechanistically links outer-rim contact
          chain loss to Swinton et al.'s (2016) Fib-1 > Fib+1 grain-defect bias.
        evidence:
          - {file: 1979-vogel-phyllotaxis.py, lines: [110, 154], note: "vogel_spiral(): exact planar spiral and multijugate whorl generator"}
          - {file: 1979-vogel-phyllotaxis.py, lines: [383, 441], note: "simulate_douady_couder_hofmeister(): Hofmeister repulsive energy minimization"}
          - {file: 1979-vogel-phyllotaxis.py, lines: [470, 562], note: "simulate_swinton_dislocation_ensemble(): rim contact-chain loss mechanism"}
      specimen-match:
        value: 84
        rationale: >-
          Panel A segments 621 florets directly from `helianthus_annuus_capitulum_specimen.jpg`
          via Difference-of-Gaussians filtering and measures 402 bounded interior
          Voronoi cells (mean circularity 0.7934 vs 0.8525 in the ideal Vogel lattice
          and 0.7045 in the 137.3 deg control). Panel F compares all 6 parastichy
          categories against Swinton et al. (2016) Table 1 (N=768 photoreviewed counts)
          and Schoute (1938, N=319), achieving Pearson r = 0.9950 and reproducing
          Fib-1 (68) > Fib+1 (22) (p = 6.25e-7).
        evidence:
          - {file: 1979-vogel-phyllotaxis.py, lines: [310, 377], note: "segment_specimen_photograph(): DoG floret centroid segmentation & Voronoi circularity"}
          - {file: 1979-vogel-phyllotaxis.py, lines: [754, 799], note: "Panel A overlays 621 segmented florets on real Helianthus capitulum photo"}
          - {file: vogel_phyllotaxis_comparison.png, lines: [0, 0], note: "6-panel comparison figure with segmented florets and Swinton survey match"}
      parameter-expressivity:
        value: 82
        rationale: >-
          Sweeps divergence angle alpha across [136.6, 138.4] deg plus Lucas (99.502 deg),
          rational (120.0 deg), and bijugate (J=2) regimes, plastochron schedule G(n)
          across [0.65, 0.04], floret count N across [30, 600] in the growth animation,
          and angular/radial noise in the 384-head dislocation ensemble.
        evidence:
          - {file: 1979-vogel-phyllotaxis.py, lines: [856, 922], note: "Panel C 2x2 sensitivity grid with dynamically computed NND CV labels"}
          - {file: 1979-vogel-phyllotaxis.py, lines: [927, 960], note: "Panel D alpha resonance scan across 76 angles"}
      morphometric-validation:
        value: 86
        rationale: >-
          Bounded Voronoi polygon clipping with 72 outer guard vertices completely
          resolves the v1 unbounded-cell artifact: `rational_120.0` now scores
          `voronoi_cv_area = 0.6207` and `mean_circularity = 0.0284`, while the
          golden angle (`137.5078 deg`) simultaneously minimizes `voronoi_cv_area`
          (`0.007209`), minimizes `nnd_cv` (`0.011108`), and maximizes Voronoi
          circularity (`0.852513`). All 7 morphometrics are independently verified
          in `2026-10-18-phyllotaxis-audit-v2.measurements.yaml`.
        evidence:
          - {file: 1979-vogel-phyllotaxis.py, lines: [223, 303], note: "compute_packing_metrics(): bounded Voronoi cells with guard ring & disk clipping"}
          - {file: 1979-vogel-phyllotaxis.py, lines: [634, 654], note: "run_self_tests(): asserts golden angle beats 137.3, 137.6, and 120.0 deg on all 3 metrics"}
          - {file: vogel_phyllotaxis_metrics.csv, lines: [0, 0], note: "6 regimes including empirical_specimen_helianthus_jpg"}
      source-traceability:
        value: 90
        rationale: >-
          All primary and historical sources (Vogel 1979, Douady & Couder 1992/1996,
          Swinton et al. 2016, Dryad dataset 10.5061/dryad.f9k77, Schoute 1938,
          Weisse 1897, Jean 1994, and both Wikimedia Commons specimen photographs)
          are cited in `datasets/phyllotaxis/paper_citations.bib` and locked by
          SHA-256 digests verified on every run of `--self-test`.
        evidence:
          - {file: 1979-vogel-phyllotaxis.py, lines: [586, 596], note: "SHA-256 verification of phyllotaxis_reference.json and both specimen JPEGs"}
          - {file: datasets/phyllotaxis/paper_citations.bib, lines: [1, 88], note: "Complete BibTeX entries for primary papers, historical surveys, Dryad, and Commons assets"}
      code-traceability:
        value: 88
        rationale: >-
          Every code-to-label discrepancy noted by the second assessor in v1 has
          been eliminated: Panel C and Panel E format their labels directly from
          the computed dictionary values, Sunflower 171 is verified on its exact
          (47, 76) outer-zone Lucas pair, and `classify_parastichy_number()` cleanly
          separates `Fibonacci + 1` (14) from `F4` (9, 23, 37, 60, 97).
        evidence:
          - {file: 1979-vogel-phyllotaxis.py, lines: [614, 626], note: "Exact verification of Lucas (29,47)->(47,76) and Bijugate (26,42)->(42,68) zones"}
          - {file: 1979-vogel-phyllotaxis.py, lines: [969, 994], note: "Panel E legend dynamically formatted from simulation dictionary"}
      repro-package:
        value: 88
        rationale: >-
          Deterministic RNG seeds (`1979`, `2016`, `42`), fast `--self-test` (<1.5 s),
          explicit virtualenv invocation instructions in docstring, SHA-256 locks on
          all input JSON/JPEG files, and SHA-256 digest reporting for all generated
          PNG, GIF, and CSV artifacts.
        evidence:
          - {file: 1979-vogel-phyllotaxis.py, lines: [1247, 1277], note: "CLI entrypoint running self-tests first and printing output SHA-256 digests"}
          - {file: docs/media/vogel_phyllotaxis_growth.gif, lines: [0, 0], note: "27-frame centripetal growth animation"}
    remediation:
      - "Extend specimen image analysis from 2D planar projection to 3D dome surface profilometry when micro-CT capitulum scans become available."
      - "Couple the Douady–Couder Hofmeister potential directly to a continuum auxin-PIN1 reaction-advection-diffusion solver on the meristematic dome (Jönsson et al. 2006 / Newell et al. 2008)."
