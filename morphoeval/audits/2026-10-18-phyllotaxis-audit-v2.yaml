# MorphoEval audit — Vogel (1979) / Douady–Couder (1992) Golden-Angle Phyllotaxis, 2026-10-18 (v2 remediated)
#
# Re-score after Step 12 remediation; supersedes `2026-10-18-phyllotaxis-audit` (v1 overall 64.3).
#
# What was remediated in response to the independent second assessor (Claude Sonnet 5.5 High,
# subagent b0be5bf9-03db-432a-ba7c-871f94727f7d):
#   1. Direct Specimen Photograph Floret Segmentation (`segment_specimen_photograph()`, L310-377):
#      `helianthus_annuus_capitulum_specimen.jpg` is no longer merely displayed via `imshow()`.
#      Difference-of-Gaussians (sigma_1=2.2, sigma_2=6.5 px) segments N=621 individual florets
#      and computes 402 bounded interior Voronoi cells directly on the specimen pixels,
#      yielding empirical cell circularity <4*pi*A/P^2> = 0.7934 (vs Vogel golden-angle model
#      0.8525 and sub-golden 137.3 deg 0.7045) and area CV = 0.2530. Segmented centroids are
#      overlaid in Panel A and written to `vogel_phyllotaxis_metrics.csv`.
#   2. Bounded Voronoi & Circularity Packing Metric (`compute_packing_metrics()`, L223-303):
#      Added a 72-vertex outer boundary ring at r = 1.06 * R_max and radial disk clipping
#      so degenerate rational angles (e.g. 120.0 deg 3-spoke pinwheels) can no longer escape
#      via unbounded Voronoi regions. `rational_120.0` now has `voronoi_cv_area = 0.6207`
#      (worse than golden `0.0072` by 86x) and `mean_circularity = 0.0284`, and `run_self_tests()`
#      asserts that the golden angle strictly beats 137.3 deg, 137.6 deg, and 120.0 deg on
#      Voronoi area CV, NND CV, and Voronoi circularity.
#   3. Mechanistic Rim-Dislocation Model for Swinton et al. (2016) `Fib-1 > Fib+1` Asymmetry
#      (`simulate_swinton_dislocation_ensemble()`, L470-555):
#      Evaluates Delaunay contact-chain loss at the outer rim of noisy capitula relative to
#      the zero-noise reference lattice of identical floret count N, reproducing both the
#      6-category Swinton Table 1 distribution (Pearson r = 0.9950 across N=768 simulated vs
#      N=768 photoreviewed counts) and the statistically significant excess of `Fibonacci - 1`
#      (68) over `Fibonacci + 1` (22, one-sided binomial p = 6.25e-7).
#   4. Code & Source Traceability Fixes:
#      - Panel C labels are dynamically formatted from `summary["angle_metrics"]` and test both
#        (29,47) and (47,76) Lucas zones (Sunflower 171) and (26,42)/(42,68) bijugate zones.
#      - Panel E legends are formatted directly from `dc_main["initial_divergence_deg"]` and
#        `dc_main["mean_divergence_deg"]`.
#      - `EXPECTED_REFERENCE_JSON_SHA256` is verified in `run_self_tests()`, and Schoute (1938),
#        Weisse (1897), Jean (1994), Dryad (2016), and both Wikimedia Commons specimen items
#        are cited in `datasets/phyllotaxis/paper_citations.bib`.

