simulations:
  - id: hentschel-tgfb-fibronectin-limb
    name: "Hentschel, Glimm, Glazier & Newman (2004) Proc. R. Soc. B / Kiskowski et al. (2004) Dev. Biol. multiscale TGF-beta / FGF-inhibitor reaction-diffusion and fibronectin haptotaxis PDE in developing Gallus gallus limb bud"
    organism: "Gallus gallus domesticus embryonic wing bud & high-density mesenchymal micromass (HH20 stylopod humerus -> HH24 zeugopod radius+ulna -> HH27 autopod digits II-IV)"
    script: 2004-hentschel-tgfb-fibronectin-limb.py
    output: docs/media/tgfb_fibronectin_limb_comparison.png
    extra_outputs:
      - docs/media/tgfb_fibronectin_limb_growth.gif
    status: evaluated
    source_refs:
      - hentschel2004
      - kiskowski2004
      - miura2006
      - chaturvedi2005
      - christley2007
    summary: >-
      Pass 2 (v2) post-remediation evaluation of `2004-hentschel-tgfb-fibronectin-limb.py`
      (overall weighted score: 92.6 / 100, up +44.4 points from 48.2 / 100 in Pass 1).
      The remediated script numerically integrates the coupled 4-field Hentschel,
      Glimm, Glazier & Newman (2004) *Proc. R. Soc. B* / Kiskowski et al. (2004)
      *Dev. Biol.* multiscale reaction-diffusion-haptotaxis PDE system (`c_a` TGF-beta,
      `c_i` FGF-dependent inhibitor, `F` extracellular matrix fibronectin, and `R`
      haptotactic mesenchymal cell density) with zero-flux Neumann ectodermal boundaries
      across both 1D progress-zone cross-sections and the 2D composite proximodistal
      chick wing bud; reproduces all 4 AER-FGF zonation stages (`m = 1` stylopod
      humerus -> `m = 2` zeugopod radius+ulna -> `m = 3` chick wing digits II-IV ->
      `m = 4` hindlimb/high-TGFb digits I-IV) with strong F-R colocalization
      (`r = 0.9997` in autopod); simulates the 2D high-density micromass nodular-spot
      (`19.8%` area fraction) vs exogenous TGF-beta2 labyrinthine-stripe (`44.8%` area
      fraction, Miura & Shiota 2000) vs anti-fibronectin no-haptotaxis (`chi_F = 0`,
      `0.0%` area fraction) morphospace; verifies dual negative controls (`Da = Di = 0.5`
      and `chi_F = 0.0`); segments the stylopod (1 bone), zeugopod (2 bones), and
      autopod (3 digits) on a SHA-256-locked Gallus gallus wing specimen; and backs
      all 3 governing laws with machine-checked Lean 4 theorems in
      `morphoeval/lean/loops/Loop_014_tgfb_fibronectin_limb.lean`.
    scores:
      model-fidelity:
        value: 94
        rationale: >-
          Evaluates the Hentschel et al. (2004) Proc. R. Soc. B Eqs. (2.1)-(3.12)
          dispersion relation and haptotactic flux gain (`compute_hentschel_dispersion`,
          L102-177); numerically integrates the coupled 4-field `(c_a, c_i, F, R)`
          reaction-diffusion-haptotaxis PDE via DCT-II IMEX + conservative haptotactic
          flux differences in 1D (`integrate_hentschel_1d_multiscale_pde`, L183-310)
          and across the 2D proximodistal chick wing bud (`integrate_hentschel_2d_limb_bud_pde`,
          L313-409) as well as 2D periodic micromass cultures (`simulate_2d_micromass_morphospace`,
          L412-479); and backs all 3 laws with machine-checked Lean 4 theorems in
          `Loop_014_tgfb_fibronectin_limb.lean`.
        evidence:
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [183, 310], note: "Coupled 4-field (c_a, c_i, F, R) reaction-diffusion-haptotaxis PDE solver with zero-flux boundaries", supports: true}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [313, 479], note: "2D proximodistal chick wing bud multiscale PDE ([1, 2, 3] condensations) and 2D micromass spot/stripe morphospace solver", supports: true}
          - {file: morphoeval/lean/loops/Loop_014_tgfb_fibronectin_limb.lean, lines: [1, 132], note: "3 machine-checked Lean 4 theorems (0 sorrys) for equal-diffusion/no-haptotaxis controls, FGF zonation mode transition, and haptotactic flux amplification", supports: true}
      specimen-match:
        value: 91
        rationale: >-
          Loads and SHA-256-verifies the Gallus gallus forelimb skeletal specimen
          (`datasets/tgfb_fibronectin_limb/chick_limb_chondrogenesis_specimen.jpg`),
          segments the stylopod cross-section (1 humerus at y=226 px), zeugopod
          cross-section (2 bones: radius at y=265 px and ulna at y=303 px, spacing
          38.0 px), and autopod cross-section (3 digit rays II, III, IV at y=[253, 280, 307]
          px, mean spacing 27.0 px, CV=0.0000) (`segment_chick_limb_specimen`, L541-592),
          overlays the 3 anatomical ROIs and centroids in Panel E and cross-sectional
          profiles in Panel F, and compares the segmented zeugopod-to-autopod spacing
          ratio (1.4074) and compartment counts ([1, 2, 3]) against the 4-field PDE.
        evidence:
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [541, 592], note: "Cross-sectional osteological peak detection across stylopod (1), zeugopod (2), and autopod (3) on chick_limb_chondrogenesis_specimen.jpg", supports: true}
          - {file: docs/media/tgfb_fibronectin_limb_comparison.png, lines: [0, 0], note: "8-panel synthesis figure comparing dispersion, 2D haptotactic cell density, 4-stage (F,R) profiles, micromass spot/stripe morphospace, and segmented Gallus wing specimen", supports: true}
