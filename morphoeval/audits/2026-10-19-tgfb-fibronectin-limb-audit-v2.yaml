        evidence:
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [628, 688], note: "8 reference-backed morphometric measurements across 4-field PDE stages, 2D wing bud, F-R colocalization, negative controls, and Gallus wing specimen", supports: true}
