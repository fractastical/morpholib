simulations:
  - id: carmona-neural-crest-chase-and-run
    name: "Carmona-Fontaine et al. (2008, 2011) & Theveneau et al. (2013) neural crest CIL, C3a co-attraction & Sdf1 chase-and-run migration"
    organism: "Xenopus laevis & Mus musculus vertebrate cranial neural crest streams and epibranchial placodes"
    script: 2012-carmona-neural-crest-chase-and-run.py
    output: docs/media/neural_crest_chase_and_run_comparison.png
    extra_outputs:
      - docs/media/neural_crest_chase_and_run_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Theveneau et al. (2013) Nat. Cell Biol. 15:763-772 five-regime chase-and-run hierarchy across wild-type NC + placode (FMI = 0.68, 6h disp = 185 um), stationary Sdf1 bead (FMI = 0.42, disp = 95 um), N-cadherin/DshDep+ CIL blockade (FMI = 0.28, disp = 54 um), C3aR-MO COA ablation (FMI = 0.21, disp = 38 um), and placode/Sdf1 ablation (FMI = 0.04, disp = 12 um)"
        - "Carmona-Fontaine et al. (2008, 2011) and Woods et al. (2014) PLOS ONE 9:e104969 short-range PCP/RhoA contact inhibition of locomotion (CIL) and autocrine C3a/C3aR co-attraction (COA) stabilizing collective cluster migration"
      reconstructed_in_script:
        - "2D interacting multi-agent chase-and-run dynamical system across all 5 experimental regimes of Theveneau et al. (2013) (FMI Pearson r = 0.9954, RMSE = 0.0269; 6h displacement Pearson r = 0.9779) plus 3-stream pharyngeal arch simulation (r4, r6, r7 streams targeting e1, e2, e3 placodes between pharyngeal pouches p1-p3)"
        - "Automated segmentation of neural_crest_specimen.jpg (Panel A control vs Panel C BMPR-inhibited) quantifying dorsoventral chaser-runner separation (+0.4063), inter-placode spacing CV (0.0457), BMPR ventral stream loss (0.5877), and dorsoventral density profile correlation (r = 0.9225, RMSE = 0.2640)"
      transfer_boundary:
        - "2D planar agent-based cranial neural crest and epibranchial placode migration mapped to whole-embryo 3D cranial stream reconstructions"
      does_not_claim:
        - "Subcellular actin-myosin vertex mechanics or 3D cranial neural tube delamination prior to neural crest EMT"
    source_refs:
      - theveneau2013
      - carmona2008
      - carmona2011
      - theveneau2010
      - woods2014
    summary: >-
      Pass 2 post-remediation evaluation of `2012-carmona-neural-crest-chase-and-run.py` (91.1/100,
      up from 57.6/100 in Pass 1; +33.5 overall). The remediated script simulates all 5 experimental
      perturbation regimes of Theveneau et al. (2013) (`wildtype_chase_and_run` FMI = 0.6853,
      `stationary_sdf1_bead` FMI = 0.4220, `ncad_dshdep_no_cil` FMI = 0.2899, `c3ar_morpholino_no_coa`
      FMI = 0.2191, and `placode_ablated_no_sdf1` FMI = 0.0080), achieving Pearson r = 0.9954
      (RMSE = 0.0269) against empirical FMI and r = 0.9779 against 6-hour collective displacement,
      models the 3 cranial neural crest streams (`r4`, `r6`, `r7`) chasing epibranchial placodes
      (`e1`, `e2`, `e3`) between Semaphorin-3F repulsive pharyngeal pouches (`p1`, `p2`, `p3`),
      and segments `neural_crest_specimen.jpg` across Control Panel A and BMPR-inhibited Panel C
      (dorsoventral separation +0.4063, inter-placode spacing CV = 0.0457, profile r = 0.9225),
      backed by 4 machine-checked Lean 4 theorems in `Loop_091_neural_crest_chase_and_run.lean`.
    scores:
      model-fidelity:
        value: 93
        rationale: >-
          Faithfully implements the Woods et al. (2014) / Carmona-Fontaine et al. (2008, 2011)
          homotypic CIL repulsion and C3a/C3aR co-attraction force laws (`compute_cil_coa_pair_force`,
          L101-140), analytical chase-and-run wave equilibria (`compute_chase_and_run_wave_state`,
          L143-185), 5-regime agent-based co-migration solver (`simulate_chase_and_run_regime`,
          L192-371), and 3-stream pharyngeal arch solver (`simulate_three_pharyngeal_streams`,
          L374-515), backed by 4 machine-checked Lean 4 theorems (0 sorrys) in
          `morphoeval/lean/loops/Loop_091_neural_crest_chase_and_run.lean`.
        evidence:
          - {file: 2012-carmona-neural-crest-chase-and-run.py, lines: [101, 185], note: "Analytical CIL/COA equilibrium spacing and chase-and-run co-migration wave state", supports: true}
          - {file: 2012-carmona-neural-crest-chase-and-run.py, lines: [192, 515], note: "2D agent-based 5-regime chase-and-run solver and 3-stream pharyngeal arch simulation", supports: true}
          - {file: morphoeval/lean/loops/Loop_091_neural_crest_chase_and_run.lean, lines: [22, 160], note: "4 machine-checked Lean 4 theorems (0 sorrys) for CIL/COA balance, chase-and-run wave, 5-regime hierarchy, and CIL collision inversion", supports: true}
      specimen-match:
        value: 89
        rationale: >-
          Loads and SHA-256-verifies `datasets/neural_crest_chase_and_run/neural_crest_specimen.jpg`
          (`verify_reference_dataset`, L79-94) and segments the 3 blue cranial neural crest streams
          (`r4`, `r6`, `r7`), 3 orange epibranchial placode targets (`e1`, `e2`, `e3`), and green
          pharyngeal pouches (`p1`, `p2`, `p3`) across Control Panel A and BMPR-inhibited Panel C
          (`segment_neural_crest_specimen`, L555-663), reproducing dorsoventral chaser-runner
          separation +0.4063, inter-placode spacing CV 0.0457, BMPR ventral stream reduction 0.5877,
          and dorsoventral density profile correlation r = 0.9225 (RMSE = 0.2640).
        evidence:
          - {file: 2012-carmona-neural-crest-chase-and-run.py, lines: [79, 94], note: "Runtime SHA-256 verification of neural_crest_specimen.jpg against reference JSON", supports: true}
          - {file: 2012-carmona-neural-crest-chase-and-run.py, lines: [555, 663], note: "Multi-channel segmentation of neural crest streams, epibranchial placodes, and pharyngeal pouches in Panel A and Panel C", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          Simulates all 5 experimental regimes of Theveneau et al. (2013) (`evaluate_all_five_regimes`,
          L666-720), executes a 5x5 2D parameter sweep over `(k_COA, chi_Sdf1)` (`run_2d_parameter_sweep`,
          L518-548), models the 3-stream pharyngeal pouch architecture, and exposes CLI flags for
          `--k-cil`, `--k-coa`, `--chi-sdf1`, `--k-run`, `--steps`, `--seed`, `--output`, `--gif`,
          and `--self-test` (`main`, L1068-1101).
        evidence:
          - {file: 2012-carmona-neural-crest-chase-and-run.py, lines: [518, 548], note: "5x5 2D parameter sweep across C3a co-attraction gain k_COA and Sdf1 chemotaxis chi_Sdf1", supports: true}
          - {file: 2012-carmona-neural-crest-chase-and-run.py, lines: [666, 720], note: "5-regime experimental perturbation sweep matching Theveneau et al. (2013)", supports: true}
          - {file: 2012-carmona-neural-crest-chase-and-run.py, lines: [1068, 1101], note: "CLI parser exposing --k-cil, --k-coa, --chi-sdf1, --k-run, --steps, --seed, and --self-test", supports: true}
      morphometric-validation:
        value: 91
        rationale: >-
          Quantifies 8 reference-anchored morphometric and kinematic metrics in `measure_morphoeval()`
          (L940-1010), validating the 5-regime Forward Migration Index hierarchy (r = 0.9954,
          RMSE = 0.0269), 6-hour stream displacement hierarchy (r = 0.9779), C3a/C3aR cluster
          cohesion drop under C3aR-MO (1.000 vs 0.449), specimen dorsoventral separation (+0.4063),
          inter-placode periodicity (CV = 0.0457), BMPR stream truncation (0.5877), and dorsoventral
          density profile match (r = 0.9225).
        evidence:
          - {file: 2012-carmona-neural-crest-chase-and-run.py, lines: [666, 720], note: "Pearson r and RMSE validation of 5-regime FMI and 6-hour collective displacement", supports: true}
          - {file: 2012-carmona-neural-crest-chase-and-run.py, lines: [940, 1010], note: "8 reference-anchored morphometric measurements in measure_morphoeval()", supports: true}
