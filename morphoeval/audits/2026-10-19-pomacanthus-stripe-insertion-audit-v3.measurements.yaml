        doubling scales s in {1, 2, 4, 8} (body length 2, 4, 8, 16 cm -> 3, 6, 12, 24 stripes), subcritical inhibitor-diffusion
        control D_I = 0.050 < d_c D_A (0 stripes), continuous growing-domain kymograph (3 -> 6 -> 12 stripes), and
        2D Y-branch horizontal unzipping (3 -> 4 stripes, +0.663 domain fraction displacement)
      - 'Pass 3: curvilinear C-shaped polar-sector solver (rho in [0.25, 1], theta in [-100, 100] deg, 48 x 96,
        sparse-LU IMEX) with growing outer radius; 3 -> 6 concentric arcs at s* = 2.18 with mid-trough inhibitor
        trace I_mid(s) against the zero-activator threshold c_3/|c_2| = 0.625; 1D hybrid field + 128-cell iridophore/melanophore
        agent lattice with contact rules and bounded feedback kappa on c_3/c_5, ablated over kappa in {0, 0.005,
        0.01, 0.02}'
      - 'Computer-vision segmentation of juvenile Pomacanthus semicirculatus specimen (`pomacanthus_semicirculatus_specimen.jpg`,
        CC BY-SA 4.0): 115 row-wise inter-stripe spacings (3.80 mm at 40 mm body span, CV = 0.34), primary/secondary
