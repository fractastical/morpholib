        PDE on an expanding skin domain L(t) = L_0 exp(gamma t), mid-trough secondary stripe insertion cascade (3
        -> 6 -> 12 -> 24 stripes) in Pomacanthus semicirculatus, and 2D horizontal Y-junction branch point unzipping
        in Pomacanthus imperator
      - Gierer & Meinhardt (1972) Kybernetik 12:30-39 short-range autocatalytic activation and long-range lateral
