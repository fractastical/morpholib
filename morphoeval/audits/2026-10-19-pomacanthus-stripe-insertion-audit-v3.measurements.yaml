        fit (centre (262, 217) px, 8 arc radii, curvature-corrected radial spacing 2.62 mm, CV 0.28)'
      transfer_boundary:
      - The curvilinear domain is an idealised polar sector (fixed rho_in = 0.25, theta_half = 100 deg), not the
        specimen's body silhouette; its centre and radial extent are not fitted to the specimen's concentric centre,
        so arc angular spans are not compared
      - The agent layer is 1D on a periodic L = 6 lambda_c domain, so the wavelength is quantised to L/6 and only
        stripe contrast responds to the feedback; the rule probabilities (0.9 / 0.1 / update rate 0.35 / softness
