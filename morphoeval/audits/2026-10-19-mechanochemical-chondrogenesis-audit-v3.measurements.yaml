      reconstructed_in_script:
      - Exact marginal stability curve tau_eff(k^2) with analytic tau_c = 1.2776 at k_c = 0.9597 (lambda_c = 6.5472)
        and the 1D spectral-pseudospectral cell-ECM solver reproducing modes [0, 1, 2, 4, 5] on periodic domains
        W = m lambda_c with seeded m-cosine perturbations
      - A 2D coupled cell-ECM PDE on a limb paddle with a moving free-boundary AER front (progress-zone traction
        suppression and proliferation, AER regression, anisotropic PD cell diffusion a_y = 3, ectoderm-balanced
        prestress) producing the forelimb [1, 2, 4] and hindlimb [1, 2, 5] hierarchies from a seeded proximal nucleus
        plus noise, with proximo-distal onset order and the Saunders (1948) ablation series [1, 1, 2, 3]
      - A 4x4 hybrid Jacobian and 1D hybrid PDE coupling the mechanics to Raspopovic (2014) BSW kinetics (tau(1
        + alpha_S S), +kappa_S (n - N_0)), with wavelength-matched ligand diffusivities, showing tau_c lowering
        1.44 -> 0.35 and a 2x2 factorial [0, 0, 0, 4] at tau = 0.85
      - Morphological segmentation of the vendored Oedipina ecuatoriana specimen giving [1, 2, 4] / [1, 2, 5] hierarchies,
        autopod spacings 39.0 / 41.25 px and the zeugopod/autopod spacing ratio compared with the 2D PDE (1.235
        vs 1.373)
      transfer_boundary:
      - The 2D domain is a Fourier-periodic box with a diffuse (tanh) competence field, not a sharp Neumann boundary;
        the ECM force balance is reduced to a component-wise Helmholtz operator (no shear/Poisson coupling, no ECM
        density equation) and the viscous relaxation rate 1/(mu + 0.15) is ad hoc
      - The solvers' drift kernel includes mu k^2 in the quasi-static stiffness, so their effective tau_c (1.4397)
        is 12.7% above the analytic 1.2776 shown in Panels A/D; all supercritical regimes used exceed both
      - Only the proximal humeral/femoral nucleus is seeded in the 2D solver; the stylopod width W = 1.4 lambda_c
        is a tuned choice (W = 1.0 is marginal), and the autopod count is partly inherited by 2 -> 4 bifurcation
        rather than set by W / lambda_c
      - The BSW parameters are copied from the Slot 016 reference JSON, rescaled in diffusivity to match lambda_c;
        the Saunders (1948) comparison is a qualitative stage-to-segment mapping, not digitised data; lengths are
        in lambda_c units with no micron calibration against the specimen
      does_not_claim:
      - A 3D finite-element limb, explicit ECM density/advection, joint/phalangeal segmentation of the rods, Hoxd13
        gene-dosage polydactyly scaling (Slot 017), or quantitative reproduction of the full Raspopovic (2014) 2D
        autopod (Slot 016)
