      reported_in_source:
      - Oster, Murray & Harris (1983) J. Embryol. Exp. Morph. 78:83-125 and Oster, Murray & Maini (1985) J. Embryol.
        Exp. Morph. 89:93-112 coupled mesenchymal cell-density and viscoelastic ECM traction PDE system; the AER
        maintains a distal recruitment/progress zone and condensations are laid down proximo-distally
      - 'Critical cell traction bifurcation threshold tau_c driving focal condensation (stylopod), dichotomous Y-bifurcation
        (zeugopod) and digital branching (autopod: 4 forelimb / 5 hindlimb digits in urodele salamanders)'
      - 'Saunders (1948): removing the chick-wing AER at progressively later stages leaves progressively more distal
