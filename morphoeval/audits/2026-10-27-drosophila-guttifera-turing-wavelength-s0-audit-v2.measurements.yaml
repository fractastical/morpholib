        peak spacing.
      - 'Wing-membrane mask: foreground outside the dilated reddish body.'
      - Grimshawi anisotropy 3.15 and heteroneura activator 0.24 at geological age 0 Ma.
      transfer_boundary:
      - 2.12 µm is the campaign detail tier. Werner et al. 2010 do not report that length.
      - The adult photograph cannot resolve 2.12 µm. Its role is the organism, not a micrograph of the grain.
      does_not_claim:
      - That the saturated spacing equals 2.12 µm. It is 1.33 µm.
