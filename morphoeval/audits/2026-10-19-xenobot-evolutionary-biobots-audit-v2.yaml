simulations:
  - id: kriegman-xenobot-evolutionary-biobots
    name: "Kriegman et al. (2020, 2021) Xenobot evolutionary biomechanics & kinematic self-replication"
    organism: "Xenopus laevis (African clawed frog blastula ectoderm & cardiac progenitor biobots)"
    script: 2020-kriegman-xenobot-evolutionary-biobots.py
    output: docs/media/xenobot_evolutionary_biobots_comparison.png
    extra_outputs:
      - docs/media/xenobot_evolutionary_biobots_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Kriegman, Blackiston, Levin & Bongard (2020) PNAS 117:1853-1859 voxel-based passive ectoderm + contractile cardiac progenitor spring-lattice design pipeline, AFPO phase-randomization transferability filter, dorsal inversion locomotion collapse, and mechanical laceration regeneration"
        - "Kriegman, Blackiston, Levin & Bongard (2021) PNAS 118:e2112672118 C-shaped ('Pac-Man') kinematic self-replication sweeping dissociated Xenopus stem cells into multi-generational daughter spheroids"
      reconstructed_in_script:
        - "2D sagittal 8x5 voxel spring-lattice locomotion simulator across 5 experimental regimes, 60-generation AFPO pareto evolution, and 2D arena kinematic stem-cell compaction across mouth angles theta_mouth in [0, 120] deg"
        - "Automated chromatic R-B/R-G segmentation and 2D convex-hull solidity/concavity analysis on xenopus_biobot_specimen.jpg (concavity = 0.1588, cardiac fraction = 0.3647, ectoderm fraction = 0.6353)"
      transfer_boundary:
        - "Reduced 2D sagittal voxel spring-lattice and orbital stem-cell sweeping kinematics calibrated to 3D VoxCAD and wet-lab Xenopus laevis biobot trajectories"
      does_not_claim:
        - "Full 3D fluid-structure Stokes ciliary boundary-element hydrodynamics or single-cell transcriptomic reprogramming after laceration"
    source_refs:
      - kriegman2020
      - kriegman2021
      - blackiston2021
      - cheney2013
    summary: >-
      Pass 2 post-remediation evaluation of `2020-kriegman-xenobot-evolutionary-biobots.py`
      (91.5/100, up from 59.5/100 in Pass 1; +32.0 overall). The remediated script
      couples passive animal-cap ectoderm ($\Delta V = 0$) and rhythmic contractile
      cardiac progenitor ($f_{\mathrm{act}} = 1.5\text{ Hz}, \varepsilon_0 = 0.18$)
      voxel spring-lattice mechanics with the AFPO phase-randomization transferability
      filter, reproducing all 5 Kriegman et al. (2020, 2021) experimental regimes:
      evolved ventral-concavity bipedal walking ($1.95\ L_{\mathrm{body}}$),
      phase-randomized cardiomyocyte noise retention ($74.3\%$ vs $13.3\%$ for
      checkerboard), $180^\circ$ dorsal inversion collapse ($0.12\ L_{\mathrm{body}}$),
      $50\%$ mechanical laceration wound-closure recovery ($85.2\%$), and $C$-shaped
      ("Pac-Man", $\theta_{\mathrm{mouth}} = 65^\circ$) kinematic self-replication
      ($3$ daughter generations, $2.95\times$ spherical yield), alongside automated
      convex-hull concavity ($0.1588$) and red-fluorescent cardiac core ($0.3647$)
      segmentation on `xenopus_biobot_specimen.jpg`, backed by 3 machine-checked Lean 4
      theorems in `Loop_083_xenobot_evolutionary_biobots.lean`.
    scores:
