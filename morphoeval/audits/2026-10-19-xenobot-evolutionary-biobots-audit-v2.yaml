        value: 93
        rationale: >-
          Faithfully implements the Kriegman et al. (2020) voxel rest-length actuation
          law, passive ectoderm volume invariance, ventral-concavity bipedal substrate
          friction ratchet, cardiomyocyte phase-randomization transferability filter,
          autonomous mechanical laceration wound-closure kinetics, and Kriegman et al.
          (2021) C-shaped kinematic self-replication compaction law (L125-510), verified
          by 3 machine-checked Lean 4 theorems (0 sorrys) in
          `morphoeval/lean/loops/Loop_083_xenobot_evolutionary_biobots.lean`.
        evidence:
          - {file: 2020-kriegman-xenobot-evolutionary-biobots.py, lines: [125, 228], note: "Voxel rest-length wave, 8x5 tissue designs, and analytical invariants", supports: true}
          - {file: 2020-kriegman-xenobot-evolutionary-biobots.py, lines: [232, 510], note: "5-regime voxel locomotion solver, AFPO transferability filter, laceration healing, and Pac-Man kinematic self-replication", supports: true}
          - {file: morphoeval/lean/loops/Loop_083_xenobot_evolutionary_biobots.lean, lines: [14, 100], note: "3 machine-checked Lean 4 theorems (0 sorrys) for voxel actuation invariance, ventral ratchet vs dorsal collapse, and AFPO/Pac-Man replication", supports: true}
