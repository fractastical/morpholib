          cardiac progenitor core (`cardiac_fraction = 0.3647` vs voxel model `0.4062`,
          3-feature RMSE = `0.0343`, Panels C1, C3).
        evidence:
          - {file: 2020-kriegman-xenobot-evolutionary-biobots.py, lines: [515, 595], note: "Automated chromatic R-B/R-G and convex-hull segmentation on xenopus_biobot_specimen.jpg", supports: true}
          - {file: docs/media/xenobot_evolutionary_biobots_comparison.png, lines: [0, 0], note: "9-panel synthesis figure including specimen convex-hull concavity and red cardiac core segmentation", supports: true}
