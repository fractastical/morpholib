simulations:
  - id: nelson-airway-mucosal-creasing
    name: "Wiggs et al. (1997), Li et al. (2011) & Eskandari et al. (2015) cylindrical bilayer mucosal folding, period-doubling & Poiseuille airway resistance"
    organism: "Mammalian bronchial airway mucosa & submucosa (Bos taurus, Homo sapiens, Ovis aries)"
    script: 2018-nelson-airway-mucosal-creasing.py
    output: docs/media/airway_mucosal_creasing_comparison.png
    extra_outputs:
      - docs/media/airway_mucosal_creasing_growth.gif
    status: evaluated
    source_refs:
      - wiggs1997
      - li2011
      - jin2011
      - eskandari2015
    summary: >-
      Pass 1 (v1) baseline evaluation of `2018-nelson-airway-mucosal-creasing.py`
      (overall weighted score: 56.1/100). The v1 script implements the cylindrical
      bilayer circumferential mode selection law m* = (R_0/h_m)*(3*mu_s/mu_m)^(1/3)
      and basic Hagen-Poiseuille resistance scaling R_flow ~ (A_0/A_lumen)^2 across
      healthy (m*=14), chronic bronchitis (m*=9), and severe asthma (m*=5) phenotypes,
      but uses a single-harmonic cosine ansatz instead of a nonlinear L-BFGS-B ring
      buckling + period-doubling and creasing solver, omits the 12-point cross-airway
      scaling collapse and relaxed ASM negative control, and does not segment the
      vendored bronchiole histology specimen (`bronchiole_mucosal_rosette_specimen.jpg`).
    scores:
      model-fidelity:
        value: 58
        rationale: >-
          Computes the analytical cylindrical bilayer circumferential mode number
          m* = (R_0/h_m)*(3*mu_s/mu_m)^(1/3) (L41-50), backed by 3 Lean 4 theorems in
          `Loop_068_airway_mucosal_creasing.lean`. However, `generate_parametric_rosette_contour`
          (L53-77) uses a closed-form cosine profile rather than minimizing the nonlinear
          cylindrical bilayer Föppl-von Kármán / neo-Hookean energy with period-doubling
          subharmonic (m/2) and sulcal self-contact creasing.
        evidence:
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [41, 50], note: "Exact cylindrical bilayer circumferential fold wavenumber formula m*", supports: true}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [53, 77], note: "Single-harmonic cosine profile without L-BFGS-B energy minimization, period-doubling, or creasing", supports: false}
      specimen-match:
        value: 35
        rationale: >-
          Although `datasets/airway_mucosal_creasing/bronchiole_mucosal_rosette_specimen.jpg`
          is vendored on disk, the v1 script never loads, segments, or measures the
          luminal star contour, mucosal fold count m_obs, or lumen circularity on the
          histology micrograph.
        evidence:
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [80, 112], note: "Evaluates only 3 tabular phenotypes without loading or segmenting bronchiole_mucosal_rosette_specimen.jpg", supports: false}
          - {file: docs/media/airway_mucosal_creasing_comparison.png, lines: [0, 0], note: "4-panel v1 plot omits histology specimen segmentation and 12-point cross-airway collapse", supports: false}
      parameter-expressivity:
        value: 48
        rationale: >-
          Evaluates 3 constricted airway phenotypes (Healthy, Bronchitis, Asthma, L80-112),
          but skips the relaxed ASM (epsilon_theta = 0) circular negative control, omits
          the 12-point cross-species/cross-generation wavenumber collapse, and exposes
          no CLI parameter overrides.
        evidence:
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [80, 112], note: "Skips relaxed_asm_control and omits 12-point comparative wavenumber collapse", supports: false}
      morphometric-validation:
        value: 52
        rationale: >-
          `measure_morphoeval()` (L181-212) reports only 3 analytical mode numbers m*
          without relaxed L-BFGS-B lumen area, period-doubling subharmonic ratio,
          Poiseuille resistance amplification, 12-point Pearson r / log-log slope, or
          specimen segmentation metrics.
        evidence:
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [181, 212], note: "Only 3 analytical m* values without p-values, resistance ratios, or specimen CV metrics", supports: false}
      source-traceability:
        value: 74
        rationale: >-
          Vendors `datasets/airway_mucosal_creasing/` with 4 primary DOIs in
          `paper_citations.bib` (`10.1152/jappl.1997.83.6.1814`, `10.1016/j.jmps.2011.01.010`,
          `10.1115/1.4004128`, `10.1016/j.jtbi.2016.05.022`), `scout_manifest.json`, and
          `airway_mucosal_creasing_reference.json`, but lacks runtime SHA-256 verification.
        evidence:
          - {file: datasets/airway_mucosal_creasing/airway_mucosal_creasing_reference.json, lines: [1, 180], note: "Reference JSON with clinical phenotypes, ASM constriction curves, and 12-point airway dataset", supports: true}
      code-traceability:
        value: 68
        rationale: >-
          Links module header to Wiggs et al. (1997), Li et al. (2011), Eskandari et al.
          (2015), Jin et al. (2011), and `Loop_068_airway_mucosal_creasing.lean` (L1-23),
          but lacks trace links for nonlinear ring buckling, period-doubling, and
          sulcal creasing.
        evidence:
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [1, 23], note: "Baseline header linking primary literature and Loop_068 Lean module", supports: true}
      repro-package:
        value: 62
        rationale: >-
          Provides `--self-test` (`L215-221`) checking mode ordering and Poiseuille
          resistance inequality, but lacks SHA-256 dataset verification, relaxed ASM
          control assertions, and two-run bitwise determinism checks on an energy minimizer.
        evidence:
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [215, 221], note: "Minimal 3-assertion self_test() without SHA-256 or determinism checks", supports: false}
    remediation:
      - "Replace the single-harmonic cosine contour with a nonlinear cylindrical bilayer Föppl-von Kármán / neo-Hookean L-BFGS-B ring energy minimizer that captures primary rosette buckling (m*), secondary period-doubling (m -> m/2), and sulcal self-contact creasing across (h_m/R_0, mu_m/mu_s)."
      - "Evaluate all 4 clinical airway phenotypes including the relaxed ASM (epsilon_theta = 0) circular negative control, plus the full ASM constriction trajectory R_flow(Delta P_ASM) and 12-point cross-species/cross-generation wavenumber collapse (Homo sapiens, Bos taurus, Ovis aries)."
      - "Segment the vendored mammalian bronchiole histology specimen (`bronchiole_mucosal_rosette_specimen.jpg`) to extract the luminal star contour, inward mucosal fold count m_obs, and lumen circularity, and enforce runtime SHA-256 verification of all dataset files."
