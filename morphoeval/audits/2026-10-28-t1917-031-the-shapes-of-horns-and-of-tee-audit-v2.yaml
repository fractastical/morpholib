    authors: "Skalak R, Farrow DA, Hoger A"
    venue: "Journal of Mathematical Biology 35:869-907 (1997)"
    doi: 10.1007/s002850050081
  evans2021:
    title: "A universal power law for modelling the growth and form of teeth, claws, horns, thorns, beaks, and shells"
    authors: "Evans AR, Pollock TI, Cleuren SGC, et al."
    venue: "BMC Biology 19:58 (2021)"
    doi: 10.1186/s12915-021-00990-w
