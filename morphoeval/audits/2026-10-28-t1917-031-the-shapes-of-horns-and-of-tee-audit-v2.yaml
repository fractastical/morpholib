      origin/main fc7454cd8. Python 3.12.3, numpy/scipy/scikit-image/Pillow/matplotlib per requirements.txt,
      Lean 4.35.0. Script v2.0.0-pass2; full run 11 s, --self-test 11 s (bootstrap 20 per source).

