# MorphoEval audit v2 (Pass 2 remediation) — T1917-031 Thompson (1917) horns as logarithmic spirals on a cone, 2026-10-28
#
# Supersedes 2026-10-28-t1917-031-the-shapes-of-horns-and-of-tee-audit (Pass 1, overall 53.5).
# Remediates R2 (real specimen + Capra figure), R3 (gnomonic breadth test, implied beta), R4 (bootstrap CI,
# KS, controls, ablation), R5 (verdict logic separating form / alpha-beta identifiability / self-similarity;
# Dryad labelled as non-shape analogue), R6 (two-pass end trimming about the fitted pole), R7 (beta sweep).
# R1 (independent second assessor) remains OPEN: builder and assessor are the same agent (Claude Fable 5.1).
#
# Headline: the logarithmic-spiral FORM is supported on both Ovis ammon sources (log spiral beats the circle
# null by delta-AIC 425 on Thompson's Fig. 320 and 666 on the real Argali horn, and is not beaten by an
# Archimedean spiral).  The real specimen's projected spiral angle is 74.7 deg (bootstrap 95 % CI 73.6-75.6),
# matching Thompson's "about 75 deg"; Thompson's own drawing projects at 84.2 deg, consistent with 75 deg only
# on a cone of semi-angle ~22 deg (alpha and beta are not separable in 2D — Lean theorem).  Strict gnomonic
# self-similarity (E4) FAILS on Fig. 320 (breadth pitch 0.32 vs edge pitch 0.13) and is inconclusive on the
# photograph.  Verdict: mixed.  Overall 53.5 -> 67.6.

