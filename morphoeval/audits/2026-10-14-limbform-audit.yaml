# MorphoEval audit — Limbform limb-morphology decoder, 2026-10-14.
#
# First audit of 2014-lobo-limbform-morphology.py, the sibling of the Planform
# decoder audited on 2026-10-14 (2026-10-14-morphology-audit).  It decodes the
# labelled-graph encoding of all 565 limb morphologies in LimbformDB 2.1.0
# (Lobo, Feldman, Shah, Malone & Levin 2014) and draws them in the style of
# the paper's own cartoons (Regeneration 1:37, Fig. 1 A''-E'').  The paper's
# figure is the only published rendering of these entries, so it is the
# specimen the output is compared with; the comparison is quantified in the
# measurements sidecar (silhouette IoU and bounding-box aspect per panel).
#
# Scores are on the rubric's 0-100 scale.  Line numbers refer to the files at
# the checkpoint commit recorded below.  This is the first audit built with
# the ProbKnow-template-conformant builder (template links, full timestamps).

audit:
  id: 2026-10-14-limbform-audit
  rubric_version: 0.1.0
  date: "2026-10-14"
  assessor:
    id: claude-fable-5-1
    label: "Claude Fable 5.1 (Cursor agent)"
    homepage: https://www.anthropic.com
  publisher_orcid: null
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  code_creators:
    - id: joel-dietz
      name: "Joel Dietz"
      orcid: null
      github: https://github.com/fractastical
  domain: morphogenesis
  tracked_by: https://github.com/fractastical/morpholib/issues/1
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 747c57f          # Limbform decoder added
    environment:
      python: "3.14.7"
      numpy: "2.5.4"
      scipy: "1.16.3"
      pandas: "2.3.3"
      scikit-image: "0.26.0"
      matplotlib: "3.10.7"
      Pillow: "12.0.0"
    note: >-
      Input: LimbformDB 2.1.0 (limbformDB_2.1.0.ldb, SQLite, 897,024 bytes,
      SHA-256 9c26bf39…099f0), downloaded by the script into the git-ignored
      .limbform_cache/ and hash-checked on every run.  The reference figure
      (Regeneration 1:37 Fig. 1, PMC4339036, CC BY, SHA-256 b26e25c1…f1ba2) is
      fetched and pinned by morphoeval/measure_outputs.py the same way.

references:
  lobo2014a:
    title: "Limbform: a functional ontology-based database of limb regeneration experiments"
    authors: "Lobo D, Feldman EB, Shah M, Malone TJ, Levin M"
    venue: "Bioinformatics 30(24):3598-3600 (2014)"
    doi: 10.1093/bioinformatics/btu582
  lobo2014b:
    title: "A bioinformatics expert system linking functional data to anatomical outcomes in limb regeneration"
    authors: "Lobo D, Feldman EB, Shah M, Malone TJ, Levin M"
    venue: "Regeneration 1(2):37-56 (2014), CC BY"
    doi: 10.1002/reg2.13
  limbformdb:
    title: "LimbformDB 2.1.0 (31 Jul 2014), the Limbform database file"
    authors: "Lobo Lab, UMBC"
    venue: "https://lobolab.umbc.edu/limbform/download/"
    url: https://lobolab.umbc.edu/limbform/downloads/limbformDB_2.1.0.ldb

simulations:
  - id: lobo-limbform-morphology
    name: LimbformDB limb morphologies
    organism: "Urodele and anuran amphibians, decapod crustaceans, orthopteroid insects and a spider (LimbformDB 2.1.0)"
    script: 2014-lobo-limbform-morphology.py
    output: limbform_wildtype_gallery.png
    domain: morphogenesis
    status: evaluated
    source_refs: [lobo2014a, lobo2014b, limbformdb]
    summary: >-
      Decodes the Limbform formalism (segments as graph edges with length and
      direction, joints as vertices with border radii, sub-joints for grafts,
      digits with phalanx counts) for 555 of the 565 morphology rows of
      LimbformDB 2.1.0 — the other 10 are outcome labels without geometry —
      and draws each limb as a smooth outline through the joint control points
      with the paper's proximodistal red-to-blue gradient, green coxa, yellow
      basis/trochanter, black long bones and blue digits.  Against the paper's
      own cartoons of the five Fig. 1 wild types the decoded silhouettes have
      the same topology, pose and segment/digit counts; bounding-box-aligned
      IoU is 0.41-0.74 (best for the cricket leg, worst for the frog hindlimb,
      where the thigh-shank angle differs).  The joint-radius rule of the
      formalism holds for 3137 of 3146 joints when a sub-joint counts its host
      segment twice.
    scores:
      model-fidelity:
        value: 85
        rationale: >-
          The encoding is read as the formalism defines it: Link rows are
          segments with Type, Dist, Ang, Side/Reversed/Inverted and NumBones;
          JointParam radii are one per bisector of consecutive segments at the
          joint or +90/+180/+270 deg for a terminal joint; LinkSubJoint places
          grafts at (Dist, Ang) on their host segment; Digit rows hang off the
          hand/foot segment.  The rule is checked against every joint at load
          time (3137/3146) and the 9 under-parameterised joints are padded
          with the joint's mean radius, which is stated in the code.  Short of
          full marks because the papers describe the formalism in prose, so
          the bisector-order convention and the 'host segment counts twice'
          rule for sub-joints were established by checking the database, and
          because the residual silhouette differences against Fig. 1 (below)
          leave the Ang convention not fully confirmed.
        evidence:
          - {file: 2014-lobo-limbform-morphology.py, lines: [26, 47], note: "the formalism as implemented"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [222, 260], note: "load_morphologies(): the five tables read"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [314, 352], note: "_edges_of()/control_points(): the radius rule, edge order kept"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [606, 620], note: "check_encoding(): the rule checked on every joint"}
      specimen-match:
        value: 65
        rationale: >-
          The only published renderings of these database entries are the
          cartoons in Fig. 1 of the Regeneration paper; side by side, the
          decoded axolotl forelimb, Xenopus hindlimb, fiddler-crab walking
          leg, cricket T3 leg and huntsman-spider leg have the same segments,
          digits, pose and colour scheme (gradient, coxa green, basis yellow,
          bones, digits).  Measured on the figure, bounding-box-aligned
          silhouette IoU is 0.64, 0.41, 0.43, 0.74 and 0.49 for panels
          A''-E'': the cricket leg is essentially identical, the others differ
          in joint angles and segment width (the frog thigh-shank angle most
          of all), which may reflect a database revision after the figure was
          drawn or an angle convention not captured.  Distinct morphologies
          (double limbs, grafts, branched chelipeds, missing segments) render
          distinctly.  No photographs of real limbs are compared.
        evidence:
          - {file: limbform_wildtype_gallery.png, lines: [0, 0], note: "the five Fig. 1 wild types plus ten further wild-type limbs"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [419, 453], note: "boundary_tour(): Euler tour of the limb tree -> closed outline"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [632, 666], note: "colour_field(): the paper's gradient and flat colours"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [678, 704], note: "draw_bones(): long bones for salamanders and frogs only"}
      parameter-expressivity:
        value: 75
        rationale: >-
          Every encoded number has a visible effect: each radius moves one
          control point of the outline, each segment's Dist/Ang moves its
          distal joint and everything beyond it, each sub-joint places a
          graft, each digit's Dist/Ang/NumBones draws one digit.  Morphologies
          in one frame share one scale, so size differences between phenotypes
          are preserved.  There is no parameter sweep in the output and
          Side/Reversed/Inverted are only reported (no 2.1.0 entry uses them),
          so their effect is untested.
        evidence:
          - {file: 2014-lobo-limbform-morphology.py, lines: [286, 312], note: "layout(): joint positions from Dist/Ang"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [377, 400], note: "build_geometry(): control points, pieces, digits"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [788, 862], note: "render_timeline(): shared scale per frame; category grids"}
      morphometric-validation:
        value: 55
        rationale: >-
          The script computes per-morphology morphometrics (segment and digit
          counts, proximodistal path length, bounding box, silhouette area)
          and writes them as CSV, and the measurements sidecar compares the
          five Fig. 1 wild types quantitatively with the paper's own figure
          (segment and digit counts against the labelled graphs A'-E', all
          equal; silhouette IoU and bounding-box aspect against the cartoons
          A''-E'').  Those are comparisons with the source authors' rendering
          of the same data, not with measurements of real limbs, and the IoU
          values themselves show the agreement is partial.
        evidence:
          - {file: 2014-lobo-limbform-morphology.py, lines: [587, 604], note: "morphometrics()"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [569, 585], note: "longest_path_length(): proximodistal length"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [869, 883], note: "write_csv()"}
          - {file: limbform_wildtype_gallery.png, lines: [0, 0], note: "the output measured against Fig. 1 (see the measurements sidecar)"}
      source-traceability:
        value: 85
        rationale: >-
          Both papers are cited with DOIs, the database version, download
          URL, byte size and SHA-256 are recorded and verified on every run,
          the schema tables used are listed, and the reference figure used by
          the measurements is pinned by hash.  The database's licence is not
          stated on the Lobo-lab page or in the file, which is why it is
          cached rather than vendored; that gap is the source's, but it is
          recorded here.
        evidence:
          - {file: 2014-lobo-limbform-morphology.py, lines: [14, 24], note: "references with DOIs and database URL"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [89, 93], note: "URL, SHA-256 and size of the database"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [200, 219], note: "resolve_db_path(): download and hash check"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [263, 284], note: "load_first_report_year(): the join to Publication.Year"}
      code-traceability:
        value: 75
        rationale: >-
          The module docstring states the formalism table by table and names
          the paper section it follows; the radius rule, the sub-joint rule,
          the Fig. 1 colour conventions and the bones-for-tetrapods-only
          convention are documented where they are implemented.  As with the
          Planform sibling, the papers give no numbered equations, so the
          rules were confirmed against the database rather than quoted.
        evidence:
          - {file: 2014-lobo-limbform-morphology.py, lines: [1, 13], note: "what is reproduced and from which figure"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [113, 125], note: "colour and bone conventions named"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [330, 352], note: "control_points(): rule and padding stated"}
      repro-package:
        value: 65
        rationale: >-
          Deterministic (no random state), invocation documented in the
          docstring and README, the input is fetched and hash-verified by the
          script itself, rows without geometry are skipped with a message,
          outputs are identical on re-run.  Dependencies are in
          requirements.txt with lower bounds only and the known-good
          environment (Python 3.14) is recorded only in this audit.
        evidence:
          - {file: 2014-lobo-limbform-morphology.py, lines: [49, 60], note: "documented invocation and outputs"}
          - {file: 2014-lobo-limbform-morphology.py, lines: [885, 921], note: "main(): download, checks, outputs"}
          - {file: requirements.txt, lines: [1, 7], note: "lower bounds only"}
    remediation:
      - Confirm the Ang convention and the joint-radius order against the Limbform software source or the authors, and explain the Fig. 1 B''/C'' silhouette residuals.
      - Compare at least the five wild types with photographs of the real limbs (Fig. 1 A-E), e.g. segment-length ratios, not only with the paper's cartoons.
      - Pin the Python 3.14 environment (exact versions) in requirements or a lock file.
      - Ask the Lobo lab for the LimbformDB licence so the file can be vendored with its hash.
