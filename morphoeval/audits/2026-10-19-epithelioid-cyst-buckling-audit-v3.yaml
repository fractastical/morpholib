    - >-
      2019-trushko-epithelioid-cyst-buckling.py:201-212 and 248-251 — the 2D ring is a prescribed profile: the
      fold mode is hard-wired from h/R0 < 0.082, the depth is a fitted law c_delta (g - g_c)^0.68 (1 + 0.22 Gamma)
      and the L-BFGS-B result is rescaled to that target, so the ring's r = 0.998 trajectory fit is circular.
      Replace it with a free Föppl-von Kármán ring minimiser (no target_delta, no mode rule) or relabel it as a
      calibrated empirical profile in the figure titles, measurement `method` strings and the math KG Law 3 entry.
    - >-
      2019-trushko-epithelioid-cyst-buckling.py:421-460 and 487-503 — the WT 12-fold pattern coincides with the 12
      five-valent vertices of the subdivision-3 icosphere (mesh-templated). Add a defect-free or random
      (Fibonacci-sphere + Delaunay) mesh and a subdivision-4 convergence check, and report the fold count only if
      it is mesh-independent; the fold-detection thresholds 0.35 / 0.04 should be swept too.
    - >-
      2019-trushko-epithelioid-cyst-buckling.py:562-563 and 613-616 — with K_alg = 2.36 kPa from the pinned
      E_alg = 5 kPa the Winkler wall is as soft as the sheet (k_conf ~ 1.2 Y_2D/R0): fold depth is under-predicted
