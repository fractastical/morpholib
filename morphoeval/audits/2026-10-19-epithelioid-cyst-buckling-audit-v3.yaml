# MorphoEval audit — Trushko et al. (2020) Dev. Cell, Hannezo et al. (2014) PNAS & Zoelly (1915) Spherical Epithelial Cyst Buckling Under Alginate Confinement, 2026-10-20 (v3)
#
# Pass 3 re-score of `2019-trushko-epithelioid-cyst-buckling.py` and `datasets/epithelioid_cyst_buckling/` after the
# remediation of the single open v2 item in the instrumented loop `morphoeval/runs/2026-10-19-epithelioid-cyst-buckling-loop-pass3`,
# superseding `2026-10-19-epithelioid-cyst-buckling-audit-v2` (93.3). Assessor: Claude Fable 5.1 (Phase B subagent of
# slot-069), scoring from the Phase A handoff, `git diff`, the current file at commit 8a7928d7 and a fresh `--self-test`.
#
# What Pass 3 changed (v2 remediation item 1):
#   1. A full 3D triangulated shell solver (`solve_confined_cyst_shell3d`, icosphere subdivision 3: 642 vertices /
#      1280 faces / 1920 edges) with harmonic edge springs, discrete Helfrich bending with a Hannezo-Prost-Joanny
#      spontaneous curvature H0 R0 = 6 (1 - nu^2) dGamma R0 / (E_epi h^2) along the radial (apical-basal) axis, a
#      unilateral Winkler capsule wall, a self-contact penalty and quasi-static L-BFGS-B continuation in g with a
#      1e-3 R0 radial imperfection re-seeded every step; WT / Blebbistatin / unconfined / linear-g regimes along the
#      Fig. 2E schedule, a 5-point apical-basal tension (dGamma) sweep, 9 new measurements, ~25 new self-test
#      assertions, a 6-panel 3D figure + 19-frame GIF, a SHA-256-pinned `shell3d_apicobasal_reference.json`, and 2
#      new Lean theorems (Laws 4 and 5; 7 theorems, 0 sorry) registered in the per-loop math KG.
#
# What the remediation exposed (why several dimensions go DOWN despite the new solver):
#   - The 2D ring solver that produced every v2 headline number is prescribed, not solved: the fold mode is
#     hard-wired from h/R0 (line 205), the fold depth is a fitted power law (lines 207-212) and the L-BFGS-B result
#     is rescaled back to that target (lines 248-251), so the v2 "trajectory r = 0.998" is circular.
#   - The free 3D solver under-predicts the WT fold depth (delta/R0 0.30 vs 0.64), produces 12 shallow folds vs the
#     observed 1 and the 12 coincide with the 12 five-valent icosphere vertices (mesh-templated); the capsule dilates
#     21 % (experiment: a few %) and a stiff (68 kPa) capsule does not fold by g = 1.527 at all.
#   - dGamma_WT = 4.26 mN/m is calibrated so that H0 R0 = 1, not measured; the specimen micrograph is a thyroid
#     follicle H&E, not an MDCK cyst in a capsule, and the v2 audit misreported its circularity (0.654; the script
#     prints 0.848).
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the files at
# commit 8a7928d7 (working tree of the Pass 3 loop).

