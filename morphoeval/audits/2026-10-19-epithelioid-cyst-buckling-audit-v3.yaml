        evidence:
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [1248, 1348], note: "9 new 3D-shell measurements: fold depth, delta(t) r, P(t) r, fold counts (both readings), H0 R0, dGamma slopes, ring-vs-shell r; Pearson p-values computed", supports: true}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [697, 707], note: "Capsule pressure read as K_alg (r_wall / R0 - 1) and traj_P_kPa - the same read-out Trushko use (capsule dilation)", supports: true}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [1368, 1420], note: "Ring measurements with hard-coded p_value / stddev literals (1.0e-12, 1.2e-6, 2.4e-6, 4.8e-6; 0.045, 0.038, 0.032)", supports: false}
