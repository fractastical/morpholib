        evidence:
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [727, 795], note: "evaluate_shell3d_regimes: WT, Blebbistatin, unconfined and WT-linear 3D runs along the g schedule with Pearson r / RMSE vs delta(t) and P(t) and ring-vs-shell cross-check", supports: true}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [798, 837], note: "evaluate_apicobasal_tension_sweep: 5 dGamma values, slopes of delta/R0, onset g and fold count", supports: true}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [1558, 1600], note: "CLI: --delta-gamma, --growth, --probe, --skip-3d-media; legacy overrides now drive a ring + shell JSON probe", supports: true}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [586, 589], note: "growth_is_area_ratio toggle: sqrt(g) (area reading) vs g (ring's linear reading)", supports: true}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [984, 990], note: "Panel D phase diagram DELTA_MAP = min(0.80, 0.728 sqrt(1.52 - g_c) 1.22) - closed-form, not solver output", supports: false}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [156, 166], note: "solve_confined_cyst_ring signature: `seed` accepted but never used (ring is deterministic by construction)", supports: false}
      morphometric-validation:
        value: 68
        rationale: >-
          Credit: measurements now computed from the free 3D solver and compared with transcribed
          Fig. 2E data - P(t) from capsule dilation r = 0.939 (RMSE 0.089 kPa; P_3D = 0.506 kPa vs
          0.485 at g = 1.527), delta(t) r = 0.799 (RMSE 0.27), Blebbistatin r = 0.813, ring-vs-shell
          r = 0.827 - with their Pearson p-values computed, not typed; the 12-point Zoelly scaling
          (r = 1.0000, slope 1.990) is an exact law check. Deductions: the ring trajectory
          r = 0.9927 / r = 0.998 that v2 scored is circular because the ring depth is a fitted law
