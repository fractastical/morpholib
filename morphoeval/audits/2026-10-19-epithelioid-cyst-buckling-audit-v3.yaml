simulations:
  - id: trushko-epithelioid-cyst-buckling
    name: "Trushko et al. (2020) Dev. Cell & Hannezo et al. (2014) PNAS Föppl-von Kármán / 3D triangulated-shell spherical epithelial cyst buckling under alginate confinement"
    organism: "Mammalian polarized epithelial cyst monolayers (Canis lupus familiaris MDCK II, Homo sapiens Caco-2)"
    script: 2019-trushko-epithelioid-cyst-buckling.py
    output: docs/media/epithelioid_cyst_buckling_comparison.png
    extra_outputs:
      - docs/media/epithelioid_cyst_buckling_growth.gif
      - docs/media/epithelioid_cyst_buckling_shell3d_apicobasal.png
      - docs/media/epithelioid_cyst_buckling_shell3d_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-epithelioid-cyst-buckling-audit-v2
    source_refs:
      - trushko2020
      - hannezo2014
      - alessandri2013
      - zoelly1915
      - helfrich1973
      - seung1988
    claim_boundary:
      reported_in_source:
        - "Trushko et al. (2020): an MDCK II monolayer growing to confluence inside a 5 kPa alginate microcapsule (R0 ~ 100 um, h ~ 10 um) buckles into a single deep inward fold once the confinement pressure reaches the Zoelly threshold P_c = 2 E h^2 / (sqrt(3 (1 - nu^2)) R0^2); the fold depth and the capsule pressure read from capsule dilation grow over ~11 h post-confluence (Fig. 2E); Blebbistatin reduces and soft (0.4 kPa) capsules abolish the fold"
        - "Hannezo, Prost & Joanny (2014): an apical-basal tension difference dGamma in a monolayer of thickness h induces a spontaneous curvature H0 ~ dGamma / (kappa / h) and selects the sign of folding"
        - "Zoelly (1915): the critical external pressure of a thin elastic spherical shell scales as (h / R0)^2"
      reconstructed_in_script:
        - "Zoelly critical pressure and its (h/R0)^2 scaling over a 12-capsule table, an alginate Winkler capsule stiffness, a critical growth stretch g_c and buckling time, a prescribed-profile 2D equatorial ring (mode n in {0, 1, 2}, fitted fold-depth law) with lumen volume partitioning, and (Pass 3) a free 3D icosphere shell with springs, Helfrich bending with apical-basal spontaneous curvature, unilateral capsule contact and self-contact, relaxed quasi-statically in g; WT, Blebbistatin, unconfined and linear-g regimes along the Fig. 2E schedule; a 5-point dGamma sweep; capsule pressure read as K_alg (r_wall / R0 - 1); automated segmentation of a histology micrograph"
      transfer_boundary:
        - "The dataset's g = 2^((t - t_c) / tau_d) is a cell-number (area) ratio; the 3D shell applies sqrt(g) as the linear rest stretch by default while the 2D ring still applies g as a linear perimeter stretch, so the two solvers are not on the same growth convention"
        - "dGamma_WT = 4.26 mN/m is calibrated so that H0 R0 = 1 (no apical/basal tension measurement exists in Trushko 2020); the 12-fold 3D pattern coincides with the 12 five-valent icosphere vertices and has not been shown to be mesh-independent"
        - "The histology specimen (`epithelioid_cyst_specimen.jpg`) is a thyroid-follicle H&E section, not an MDCK cyst in a capsule; its reference values are attributed loosely to Trushko Fig. 1-2"
      does_not_claim:
        - "A cell-level vertex model with apical/basal/lateral faces, lumen pressure, cell division or T1 transitions; a resolved rigid-cavity (displacement-controlled) buckling threshold for a stiff 68 kPa capsule; a measured apical-basal tension; or a validated single-fold 3D morphology matching the experimental fold depth 0.64 R0"
    summary: >-
      Pass 3 (v3) remediated evaluation of `2019-trushko-epithelioid-cyst-buckling.py`. The single
      v2 remediation item is closed: a free 3D triangulated shell with apical-basal spontaneous
      curvature, Winkler capsule wall and self-contact (`solve_confined_cyst_shell3d`) now runs
      beside the 2D ring, reproduces the Fig. 2E pressure trajectory from capsule dilation
      (r = 0.939, RMSE 0.089 kPa), keeps the unconfined control spherical (delta/R0 = 0.005,
      0 folds), responds to the dGamma sweep in the Hannezo direction and is backed by 2 new Lean
      theorems (7 total, 0 sorry). It also exposes that the 2D ring which carried the v2 scores
      is a prescribed Gaussian profile rescaled to a fitted target depth, that the free solver
      under-predicts the WT fold depth (0.30 vs 0.64 R0) with 12 mesh-templated shallow folds
      instead of 1, that dGamma is calibrated rather than measured, and that the specimen is a
      thyroid follicle whose circularity (0.848) the v2 audit misreported as 0.654. The overall
      score therefore goes DOWN from 93.3 while the model is more honest and more capable.
    scores:
      model-fidelity:
        value: 76
        rationale: >-
          Credit: `solve_confined_cyst_shell3d` is a genuine free energy minimiser (harmonic
          springs with rest length sqrt(g) l0, discrete Helfrich bending (kappa/2) A_v (2H - 2H0)^2
          via an umbrella Laplacian with a lagged curvature normalisation, spontaneous curvature
          from the Hannezo formula along the radial axis, unilateral Winkler wall, cKDTree
          self-contact, analytic gradients, L-BFGS-B continuation in g with re-seeded 1e-3
          imperfections) on a closed icosphere (Euler chi = 2 asserted); Laws 4-5 are machine
          checked. Deductions: the 2D ring that still produces every regime/trajectory panel is
          prescribed - mode hard-wired from h/R0 (line 205), depth a fitted power law (lines
          207-212), L-BFGS-B result rescaled back to the target (lines 248-251) - so it is not a
          Föppl-von Kármán solve as v2 scored it (-10); the 3D solver gives 12 shallow folds that
          coincide with the 12 five-valent vertices, i.e. a mesh-templated pattern, not the single
          Pogorelov fold of the experiment (-6); the capsule is as soft as the sheet (k_conf ~
          1.2 Y_2D/R0) and a stiff 68 kPa capsule does not fold by g = 1.527, so the
          displacement-controlled confinement physics is unresolved (-4); the apical-basal axis is
          the radial direction and there is no cell-level apical/basal/lateral structure, lumen
          pressure or division topology (-4).
        evidence:
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [506, 718], note: "3D shell solver: cache, icosphere, umbrella Laplacian, material constants, lagged curvature scale, energy + analytic gradient, continuation loop, wall/depth/fold/volume read-outs", supports: true}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [591, 631], note: "energy_and_grad: springs, Helfrich bending with spontaneous curvature 2 c0 m_v n_hat, Winkler wall, self-contact penalty", supports: true}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [476, 484], note: "compute_apicobasal_spontaneous_curvature: H0 R0 = 6 (1 - nu^2) dGamma R0 / (E_epi h^2) (Hannezo 2014; Lean Law 4)", supports: true}
          - {file: morphoeval/lean/loops/Loop_069_epithelioid_cyst_buckling.lean, lines: [148, 177], note: "Law 4: completed-square proof that the apical-basal bending energy is minimised at kappa c = t (spontaneous curvature)", supports: true}
          - {file: morphoeval/lean/loops/Loop_069_epithelioid_cyst_buckling.lean, lines: [203, 221], note: "Law 5: inverted-cap penalty (h + c0)^2 >= (h - c0)^2 and Winkler penalty zero inside the capsule wall", supports: true}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [201, 212], note: "2D ring: fold mode hard-wired from h/R0 < 0.082 and target fold depth from fitted constants 0.818 / 0.685 / 0.575 / 0.68 / 0.22 - prescribed, not solved", supports: false}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [248, 251], note: "2D ring: optimised profile rescaled so that its peak equals target_delta, making the minimisation a smoothing step", supports: false}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [421, 460], note: "build_icosphere: subdivision 3 icosahedron carries 12 five-valent vertices; the WT 12-fold pattern coincides with them (mesh-templated)", supports: false}
      specimen-match:
        value: 62
        rationale: >-
          Credit: the 3D figure renders the WT shell as a trisurf coloured by inward deflection
          beside the ring and the Fig. 2E data, the GIF shows wrinkle-to-coarsening, the
          unconfined control stays spherical, and the segmentation of the SHA-256-locked
          micrograph (19 cysts, h/R0 = 0.106 vs reference 0.105) is reproducible. Deductions:
          the specimen is a thyroid-follicle H&E (Wikimedia), not an MDCK cyst in an alginate
          capsule, and its 0.105 / 0.650 reference values are attributed loosely to Trushko
          Fig. 1-2 (-12); the segmented mean circularity is 0.848 (printed in panel F) whereas
          the v2 audit reported 0.654, i.e. the v2 specimen-match claim rested on a misreported
          number and the 0.650 reference is not matched (-8); the free 3D WT shell shows 12
          shallow folds at delta/R0 = 0.30 instead of the single 0.64 R0 fold seen in the
          experiment, and the linear-g ablation overshoots to 1.18 R0 (-10); segmentation uses
          uncited calibration factors x1.12 (perimeter) and x1.65 (thickness) (-4); the
          ring's lumen circularity in the unbuckled branch is a constant 0.9985 (-2); honest
          display of the miss in panel F of the 3D figure (sim vs experimental fold count) is
          credited.
        evidence:
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [1107, 1206], note: "render_shell3d_figure: 6 panels incl. 3D trisurfs, delta(t) and P(t) vs Fig. 2E, dGamma sweep, fold multiplicity vs experiment (12 vs 1 shown honestly)", supports: true}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [840, 899], note: "segment_epithelioid_cyst_specimen: 19 contours, h/R0 = 0.106; calibration factors x1.12 (line 870) and x1.65 (line 874) are uncited", supports: false}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [1449, 1460], note: "Circularity measurement with reference 0.650 attributed to Trushko Fig. 2 and Wikimedia File:Thyroid_follicle.jpg; script prints 0.848 (panel F title, line 1017)", supports: false}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [1285, 1294], note: "Measurement: 3D shell WT fold count 12 vs reference 1 - a genuine miss recorded as a measurement", supports: false}
          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [1209, 1229], note: "render_shell3d_gif: 19 frames of the linear-g shell (wrinkle -> coarsening to 2 folds)", supports: true}
          - {file: docs/media/epithelioid_cyst_buckling_shell3d_apicobasal.png, lines: [0, 0], note: "Rendered 3D figure: panels A/B trisurfs show 12 shallow wrinkles (g = N/N_c) vs 2 deep folds (g linear); panel F fold count 12 vs experimental 1", supports: false}
          - {file: docs/media/epithelioid_cyst_buckling_shell3d_growth.gif, lines: [0, 0], note: "Rendered 3D growth GIF (19 frames): wrinkle onset and coarsening of the linear-g shell inside the capsule", supports: true}
          - {file: docs/media/epithelioid_cyst_buckling_growth.gif, lines: [0, 0], note: "Rendered 2D ring growth GIF: prescribed single-fold invagination deepening along the g schedule", supports: true}
      parameter-expressivity:
        value: 84
        rationale: >-
          Credit: four 3D regimes (WT, Blebbistatin via Gamma_myo and E_epi/h, unconfined 0.4 kPa,
          linear-g ablation) along the Fig. 2E schedule; a 5-point dGamma sweep (H0 R0 in {-1, 0,
          0.5, 1, 2}) with slopes of fold depth and onset g; a `growth_is_area_ratio` toggle; the
          previously dead `--e-alg/--h-scale/--r0-scale/--blebbistatin/--seed` flags now drive a
          ring + shell probe printed as JSON with `--delta-gamma`, `--growth`, `--probe`,
