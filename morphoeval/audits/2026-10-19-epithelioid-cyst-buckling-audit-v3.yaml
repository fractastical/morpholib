          - {file: 2019-trushko-epithelioid-cyst-buckling.py, lines: [124, 149], note: "Unsourced constants 0.98 (capsule stiffness prefactor) and alpha_myo = 0.24", supports: false}
          - {file: datasets/epithelioid_cyst_buckling/shell3d_apicobasal_reference.json, lines: [1, 10], note: "Pass 3 reference table: mesh counts, dGamma_WT (flagged calibrated), expected H0 R0, Blebbistatin Gamma_myo", supports: true}
