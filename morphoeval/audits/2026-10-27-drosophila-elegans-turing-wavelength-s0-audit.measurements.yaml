      reported_in_source:
      - 'Yeh, Liou & True 2006: male D. elegans carries an apical wing melanin patch used in courtship, divergent
        from D. gunungcola.'
      - 'Turing 1952: diffusion can destabilize a stable homogeneous state at a finite wavenumber. Schnakenberg
        1979: the two-species kinetics used here.'
      reconstructed_in_script:
      - Du is solved so argmax sigma(k) equals 2π/1.803 µm at r/r_c = 1.06. Deflecta and erecta wavelengths are
        the same law at r/r_c = 2.65 and 1.48.
      transfer_boundary:
      - Deflecta and erecta are chronoseries neighbors (11/41), not the sister species in the Yeh and Massey papers.
      does_not_claim:
      - The macro photograph does not resolve 1.8 µm granules.
      - No published granule-spacing measurement for D. deflecta or D. erecta is being reproduced.
