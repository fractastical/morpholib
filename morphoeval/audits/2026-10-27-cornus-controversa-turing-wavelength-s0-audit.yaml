simulations:
  - id: delphi10000-cornus-controversa-turing-wavelength-s0
    name: "Cornus controversa Turing wavenumber at 1.939 mm (Holocene, 0 Ma)"
    organism: "Cornus controversa"
    script: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py
    output: docs/media/cornus_controversa_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/cornus_controversa_turing_wavelength_s0_growth.gif
      - datasets/cornus_controversa_turing_wavelength_s0/cornus_controversa_turing_wavelength_s0_metrics.json
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, gierer1972, kondo2010, xiang2006, feng2011, vareed2006]
    summary: >-
      Pass 1. Schnakenberg kinetics with a=0.06, b=0.94 (trace -0.120, det 1)
      and diffusivities solved so the continuum critical wavelength is 1.939 mm
      (0.001939 m, log10 -2.712). Eleven real-eigenvalue Fourier modes give
      Pearson r = 0.9999998 and RMSE = 2.13e-4 against analytic sigma(k).
      The equal-diffusion control has sigma_max = -0.0615 and std ratio 0.018.
      A Dv sweep from 0.65 to 2.4 times nominal moves lambda monotonically
      from 1.998 mm to 1.881 mm. The saturated 8-wavelength patch peaks at
      2.216 mm, the neighboring Fourier bin. The crown photograph has no
      scale bar. PASS2_REMEDIATION is False, so the 16-wavelength remeasure,
      the horizontal bias, and the resolution block are not in this run.
      Weighted score 82.7/100.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 critical wavenumber and the diffusion-driven instability conditions"
        - "Schnakenberg 1979 two-species kinetics"
        - "Xiang et al. 2006 place Cornus controversa in extant Cornus; this chronoseries is the Holocene tip only"
        - "Public-domain Meise Botanic Garden photograph of C. controversa 'Variegata'"
      reconstructed_in_script:
        - "Slot-specific rates a=0.06, b=0.94 and the diffusivities that pin lambda_c = 1.939 mm"
        - "Early-time mode growth, Dv sweep, and equal-diffusion ablation"
      transfer_boundary:
        - "The 1.939 mm length is the Delphi detail-scale assignment, not a published Cornus measurement"
        - "Crown pixels are used for orientation and occupancy, not for a millimetre reading"
      does_not_claim:
        - "That the Variegata cream margin is a Turing pattern"
        - "That pagoda tiers are chemical stripes"
        - "A fossil predecessor inside this 1/1 chronoseries"
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          Equations (1)–(6) in the module docstring are the Schnakenberg PDE,
          the steady state, the Jacobian, and Turing's k_c. solve_diffusivities
          returns lambda = 1.939000 mm and a self-test checks trace < 0, det > 0,
          Dv > Du, and a closed band when Du = Dv. Modes whose eigenvalues are
          a complex pair are excluded, because |u-hat| is then not a pure
          exponential; the eleven real modes that remain track sigma(k).
          Deduction: a and b were chosen for this slot so the wavelength would
          land on 1.939 mm. They are not parameters reported for Cornus.
        evidence:
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [1, 40], note: "docstring states the PDE, the Jacobian, and k_c", supports: true}
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [90, 155], note: "jacobian() and solve_diffusivities() pin lambda_c", supports: true}
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [157, 172], note: "dispersion_parts / growth_rate implement sigma(k), including a negative discriminant", supports: true}
          - {file: morphoeval/lean/loops/Loop_3155_cornus_controversa_turing_wavelength_s0.lean, lines: [10, 44], note: "six decide theorems: trace, det, 2 pi closure, inhibitor contrast, equal diffusion, chronoseries gap", supports: true}
      specimen-match:
        value: 72
        rationale: >-
          The comparison figure shows the Meise crown beside the dispersion
          fit and the lamina field, and the GIF has 12 frames at 480x640 whose
          last frame is that photograph (CV similarity 96.0 against the
          specimen file). The generative field itself is a spot lattice on a
          square, not a cream leaf margin and not the pagoda tiers. Foreground
          fraction of the photo is 0.866; bright foliage above the lawn is
          0.212. Those are crown statistics. Score stays in the 70s because
          the organism is on the page while the mechanism's picture is not
          the organism's picture.
        evidence:
          - {file: docs/media/cornus_controversa_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "crown, dispersion, lamina field, sweep, orientation, ablation", supports: true}
          - {file: docs/media/cornus_controversa_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 480x640, last frame is the specimen, CV 96.0", supports: true}
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [581, 629], note: "render_gif documents that the terminal frame is the photograph", supports: true}
      parameter-expressivity:
        value: 86
        rationale: >-
          lambda_of_dv moves monotonically as Dv/Dv* runs through
          0.65, 0.80, 1.00, 1.35, 1.80, 2.40: wavelengths 1.998, 1.966, 1.939,
          1.913, 1.894, 1.881 mm. The nominal factor returns the assignment.
          The equal-diffusion ablation is a separate switch, not a point on
          that curve. The horizontal bias exists in integrate() but
          PASS2_REMEDIATION is False, so this pass does not exercise it.
        evidence:
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [175, 183], note: "lambda_of_dv returns None when the band is closed", supports: true}
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [318, 325], note: "parameter_sweep factors", supports: true}
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [82, 83], note: "Pass 1 executed with the remediation flag off, so the midrib template was not applied", supports: false}
      morphometric-validation:
        value: 82
        rationale: >-
          Linear probe: Pearson r = 0.9999998 (n = 11 real modes), RMSE =
          2.13e-4 per time unit, against reference bar 0.98. KS statistic of
          the residuals versus Normal(0, s) is 0.514 (p = 0.003): the
          residuals are structured truncation error, not a normal sample, and
          that failure is reported rather than dropped. Nonlinear dominant
          wavelength on the 8-lambda box is 2.216 mm versus 1.939 mm (ratio
          1.14), i.e. Fourier bin 7 instead of bin 8. Ablation std ratio
          0.018 with sigma_max -0.0615. Specimen foreground 0.866 versus null
          0.50, foliage fraction 0.212 versus null 0.25, horizontal-edge
          fraction 0.433 versus the field's 0.421. The crown frame is
          960x1280 and has no scale bar, so none of those photo numbers is a
          millimetre. The resolution block is not written on this pass.
        evidence:
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [236, 283], note: "linear_mode_probe Pearson, RMSE, and KS", supports: true}
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [327, 347], note: "ablation_control equal diffusion", supports: true}
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [381, 415], note: "segment_specimen crown-scale CV, scale_bar_present False", supports: true}
          - {file: datasets/cornus_controversa_turing_wavelength_s0/cornus_controversa_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "r=0.9999998, lambda_pattern=2.216, ablation ratio=0.018", supports: true}
      source-traceability:
        value: 88
        rationale: >-
          Eight DOIs were checked against Crossref on 2026-10-27, including
          Turing 1952, Schnakenberg 1979, and Xiang et al. 2006. The specimen
          SHA-256 be3da2bb8b817bec105efa4dec6064d234f1c47ab458bdf8059d885529dccff4
          matches the species-gallery file and is pinned in the reference JSON.
          License recorded as public domain (Meise / Wikimedia). Deduction:
          slot 3155 is absent from campaign_100_slots.yaml, so the scout CLI
          could not be pointed at --slot 3155; OpenAlex lexical search did not
          return the seed papers, which were resolved on Crossref instead.
        evidence:
          - {file: datasets/cornus_controversa_turing_wavelength_s0/paper_citations.bib, lines: [1, 80], note: "BibTeX with the Crossref-checked DOIs", supports: true}
          - {file: datasets/cornus_controversa_turing_wavelength_s0/scout_manifest.json, lines: [1, 40], note: "records the KeyError path and the slug collision check", supports: true}
          - {file: datasets/cornus_controversa_turing_wavelength_s0/cornus_controversa_turing_wavelength_s0_reference.json, lines: [1, 40], note: "scale 0.001939 m, age 0 Ma, specimen SHA-256", supports: true}
      code-traceability:
        value: 84
        rationale: >-
          jacobian, solve_diffusivities, growth_rate, integrate, and
          ablation_control are named for equations (1)–(6). The Lean module
          uses the same scaled integers (trace -120 per thousand, wavelength
          product 1939*3240, equal-diffusion contrast). The proofs are kernel
          `decide` witnesses on those integers, not a formal PDE.
        evidence:
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [197, 224], note: "integrate() is the explicit Euler of equations (1)–(2)", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-cornus-controversa-turing-wavelength-s0.yaml, lines: [1, 60], note: "four laws point at the Lean declarations and the script", supports: true}
      repro-package:
        value: 86
        rationale: >-
          --self-test checks the hash, the band, the monotonic sweep, Pearson
          r > 0.98, RMSE < 0.05, and the decaying ablation. Seed is 3155.
          Full run writes the PNG, the 12-frame GIF, and the metrics JSON.
          Deduction: dependency versions are the environment's scientific
          stack, not a per-script lockfile, and the checkpoint commit does not
          yet contain these new paths.
        evidence:
          - {file: models/2026-delphi10000-cornus-controversa-turing-wavelength-s0.py, lines: [803, 842], note: "self_test assertions", supports: true}
          - {file: datasets/cornus_controversa_turing_wavelength_s0/README.md, lines: [1, 31], note: "states 1.939 mm and 0 Ma and the two commands", supports: true}
    remediation:
      - id: R1
        item: "Nonlinear peak is 2.216 mm on the 8-wavelength box (Fourier bin 7). Re-measure on a 16-wavelength patch before treating 1.939 mm as the saturated wavelength."
      - id: R2
        item: "Horizontal midrib bias is implemented but PASS2_REMEDIATION is False, so orientation is not exercised as a parameter."
      - id: R3
        item: "resolution_limit is null. Record that the crown photograph has no scale bar and that 1.939 mm is not read off those pixels."
      - id: R4
        item: "No second assessor. This score is the builder's own."
      - id: R5
        item: "No ~/.nanopub/profile.yml. Do not invent a signature."
