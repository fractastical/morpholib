  id: 2026-10-27-cornus-controversa-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  supersedes: null
  supersedes_audit_id: null
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, single-agent round; second assessor not run)"
  publisher_github: https://github.com/fractastical
