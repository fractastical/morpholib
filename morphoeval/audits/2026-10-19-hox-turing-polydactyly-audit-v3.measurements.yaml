    claim_boundary:
      reported_in_source:
      - 'Sheth et al. (2012): progressive loss of distal Hox (Hoxa13, Hoxd11-13) in a Gli3-null background shrinks
        the digit period (wavelength) of a Turing-type mechanism, raising digit number from 5 to ~14 at roughly
        constant autopod width (Figs. 1-3)'
      - 'Crampin, Gaffney & Maini (1999): on a growing domain the reaction-diffusion equations acquire an advection
        term and a dilution term -(div v) u; patterns lag the fixed-domain wavelength and transition by peak insertion
        / frequency doubling'
      - 'Boehm et al. (2010): limb bud proliferation is distally biased but a proliferation gradient alone is insufficient
        to explain bud shape'
      - 'Summerbell (1974): AER excision arrests distal outgrowth; the earlier the excision the more proximal the
        truncation'
      reconstructed_in_script:
      - Sheth et al. (2012) linear dispersion, k_c(H) and the cubic-saturated two-component PDE on a 1D Neumann
        arc and a 2D fixed-width polar fan (Pass 2), plus the Pass 3 AER-FGF8 kinematic growing fan in ALE form
        with dilution, mesh-relative advection, physical-metric angular modes, backward-Euler radial diffusion,
        Lagrangian tracers, AER regression and ablation, a g_max sweep and the quasi-static digit-number/width law;
        6-genotype allelic series; dual negative controls; radiograph digit-ray segmentation; 5 Lean 4 theorems
      transfer_boundary:
      - 'Growth is kinematic: g(r,t) is prescribed by the mitogen field and div v = g; no elastic/viscous constitutive
        law, stress balance or oriented cell behaviour is solved (Boehm et al. 2010 show these matter for shape)'
      - Digit-ray (stripe) orientation is imposed by PD/AP diffusion anisotropy D_r = 0.05 D rather than derived
        from the Fgf/Wnt proximodistal modulation of Raspopovic et al. (2014)
      - k_c(H) = 14 - 9H and g_u(H) = 200 f_u + 25 k_c^4 - 4.5|tr J_kc| are closure ansaetze that interpolate the
        allelic series and pin sigma_max ~ 4.5; they are not fitted to Sheth et al.'s supplementary parameter values
      - The 1D arc and fixed-width fan solvers seed the target cosine mode (-0.08 cos(n_target s)); only the Pass
        3 growing fan evolves from seeded noise alone, and it shows a growth-induced wavelength lag (N_grow = 3.5
        WT, 13.0 null vs law 5 / 14)
      does_not_claim:
      - 3D limb bud geometry, cell-level mechanics, Sox9/Bmp/Wnt three-node kinetics, quantitative reproduction
        of Sheth et al.'s Fig. 2G digit-period measurements (not vendored), or hour-calibrated developmental time
