      - 1D anteroposterior Thom-Zeeman cusp catastrophe ODE tau_chi*dchi/dt = -(chi^3 - a(x,t)*chi - b_osc(x,t))
        with either the prescribed kinematic front a = tanh((v t - x)/sigma_w) or the Goldbeter FGF/RA toggle front
        a = tanh((R - F)/kappa_a), m = F^4/(F^4 + K_mob^4), driven by tailbud elongation through M_F = exp(-(x_tb
        - x)/lambda_F), lambda_F = v_tb/k_dM (reduced two-variable toggle; Cyp26/Raldh2 lumped)
      - Endogenous front velocity fit (v_front = 2.22222 um/min vs v_tb = 2.2222, R^2 = 1.000), 4-point v_tb sweep
        (S RMSE 0.09 um), decaying-Gaussian FGF8 bead perturbation (min adjacent somite ratio 0.70, max 1.55)
      - 'Farhadifar vertex model of a 60 x 6 hexagonal PSM sheet (20 um pitch, Lambda_0 = 0.12, Gamma = 0.04, dLambda_cleft
        = 0.9, outer boundary pinned, gradient descent, no T1) in which only posterior(-1)->anterior(+1) half-somite
        interfaces are loaded: 12 clefts at 100.0 um pitch, cleft angle 28.2 -> 10.3 deg (control 27.3), tortuosity
        1.30 -> 1.03, shape index 3.76'
      - Bilateral dorsal somite row DoG peak and inter-somitic cleft segmentation on somite_embryo_specimen.jpg
        (48.47 px mean spacing, symmetry ratio 0.9605) plus a per-cleft luminance-minimum line fit giving an empirical
        cleft angle of 7.9 deg
      transfer_boundary:
      - 1D anteroposterior paraxial mesoderm axis mapped to dorsal vertebrate SEM somite rows; the specimen is a
        chick SEM in pixels with no scale bar, so S_obs (px) is compared to the Cooke-Zeeman waveform shape and
        cleft orientation only, not to S_sim in um
      - The FGF/RA toggle parameters (alpha = 3, K = 1, n = 4, tau_FR = 12 min, k_dM = 0.0074/min) are tuned to
        place the front offset ~0.19 mm behind the tailbud; they are not Goldbeter et al.'s published kinetic constants,
        so only the qualitative predictions (bistability, v_front = v_tb, bead effect) are tested
      - The chi = +1 / -1 compartments of the cusp are read as anterior / posterior half-somites (Saga & Takeda
        2001) to decide which interfaces are clefts; Cooke & Zeeman themselves did not make this identification
      does_not_claim:
