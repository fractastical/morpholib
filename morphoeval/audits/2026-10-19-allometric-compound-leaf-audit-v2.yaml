        evidence:
          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [441, 521], note: "Excess-green + Euclidean distance-transform segmentation of Cardamine hirsuta compound leaf specimen extracting 32 leaflet lobes and I_D = 0.5202", supports: true}
          - {file: docs/media/allometric_compound_leaf_comparison.png, lines: [0, 0], note: "6-panel figure comparing epidermal Auxin-CUC2 antiphase, 2D genotype contours, P3-P6 intercalary insertion, 6-genotype I_D benchmark, and specimen CV segmentation", supports: true}
      parameter-expressivity:
