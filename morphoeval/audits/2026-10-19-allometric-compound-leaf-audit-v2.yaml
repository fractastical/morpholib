simulations:
  - id: przemyslaw-allometric-compound-leaf
    name: "Bilsborough et al. (2011), Barkoulas et al. (2008), Vlad et al. (2014) & Kierzkowski et al. (2019) growing leaf margin PIN1-Auxin-CUC2-RCO feedback loop and serration vs compound leaflet dissection"
    organism: "Arabidopsis thaliana / Cardamine hirsuta (growing leaf margin epidermis, serration teeth, and compound leaflets)"
    script: 2011-przemyslaw-allometric-compound-leaf.py
    output: docs/media/allometric_compound_leaf_comparison.png
    extra_outputs:
      - docs/media/allometric_compound_leaf_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Bilsborough et al. (2011) PNAS 108:3424-3429 interconnected leaf margin feedback loops: Loop 1 (CUC2 promotes PIN1 up-the-gradient polarization rho_{ij} propto (1 + gamma_CUC2 C_i) exp(beta A_j)), Loop 2 (Auxin represses CUC2 transcription C_i = C_max / (1 + (A_i/K_A)^n), restricting CUC2 to inter-tooth sinuses), and Loop 3 (differential normal margin outgrowth v_n(s) = v_0 [A(s)^m/(K_g^m+A(s)^m)] (1 - eta_sinus C(s)) with intercalary tooth insertion when inter-peak distance exceeds lambda_c)"
        - "Vlad et al. (2014) Science 343:780-783 and Kierzkowski et al. (2019) Cell 177:1405-1418 demonstrating that local sinus growth repression by RCO in Cardamine hirsuta converts shallow serrations into deeply incised compound leaflets without changing PIN1/auxin convergence patterning"
      reconstructed_in_script:
        - "1D/2D growing leaf margin Auxin-PIN1-CUC2-RCO reaction-transport and normal contour outgrowth solver verifying Law 1 up-the-gradient PIN1 promotion (error 0.0 < 1e-15) and strong spatial Auxin-CUC2 antiphase (r = -0.9908), Law 2 smooth margin collapse under cuc2-1 loss-of-function (I_D = 0.0120) and cuc2-1D uniform unrepressed CUC2 control (I_D = 0.0250), and Law 3 RCO-driven compound leaflet dissection across 6 genotypes (Pearson r = 0.9983, p = 4.58e-6, RMSE = 0.0169) and 4 developmental stages P3-P6 (1, 3, 5, 7 peaks)"
        - "Automated excess-green chromatic + Euclidean distance-transform segmentation of the SHA-256-locked Cardamine hirsuta botanical specimen (`cardamine_hirsuta_compound_leaf_specimen.jpg`, Public domain, 617x992 px) extracting foliage area fraction (0.3668), 32 compound leaflet lobes, perimeter dissection ratio P/(2*sqrt(pi*A)) = 4.0939, and radial tip-to-sinus dissection index I_D = 0.5202 +- 0.0128 SE"
      transfer_boundary:
        - "1D epidermal margin reaction-transport coupled to 2D normal leaf contour outgrowth and 2D botanical specimen contour morphometrics"
      does_not_claim:
        - "3D finite-element adaxial-abaxial lamina thickness mechanics or vascular bundle differentiation inside the rachis"
    source_refs:
      - bilsborough2011
      - barkoulas2008
      - vlad2014
      - kierzkowski2019
    summary: >-
      Pass 2 (v2) evaluation of `2011-przemyslaw-allometric-compound-leaf.py` (overall
      weighted score: 93.1/100, up from 54.4/100 in v1). The remediated script couples
      the Bilsborough et al. (2011) epidermal Auxin–PIN1–CUC2 feedback PDE with 2D leaf
      margin contour outgrowth and Vlad et al. (2014) / Kierzkowski et al. (2019) RCO
      sinus growth repression; verifies Law 1 CUC2-promoted up-the-gradient PIN1
      polarization (residual 0.0) and complementary spatial antiphase between Auxin tooth
      peaks and CUC2 sinus maxima (r = -0.9908); proves Law 2 smooth margin collapse in
      `cuc2-1` loss-of-function (I_D = 0.0120) and `cuc2-1D` unrepressed uniform CUC2
      (I_D = 0.0250); reproduces the 6-genotype dissection depth sweep across *Arabidopsis*
      and *Cardamine hirsuta* (Pearson r = 0.9983, p = 4.58e-6, RMSE = 0.0169) and
      intercalary peak insertion across stages P3–P6 (1, 3, 5, 7 peaks); and segments the
      SHA-256-locked *Cardamine hirsuta* compound leaf specimen (`cardamine_hirsuta_compound_leaf_specimen.jpg`,
      32 leaflet lobes, perimeter dissection ratio 4.0939, empirical I_D = 0.5202 +- 0.0128 SE).
    scores:
      model-fidelity:
        value: 94
        rationale: >-
          Implements the 1D epidermal Auxin-PIN1-CUC2 reaction-transport PDE
          (`simulate_growing_margin_feedback_pde`, L97-234) and 2D bilateral leaf margin
          normal outgrowth solver (`build_2d_leaf_margin_contour`, `simulate_genotype_morphospace`,
          L239-435) coupling Loop 1 (CUC2-promoted PIN1 up-the-gradient polarization),
          Loop 2 (Auxin Hill repression of CUC2), Loop 3 (differential tooth outgrowth vs
          CUC2/RCO sinus repression), and intercalary peak insertion across developmental
          stages P3-P6, backed by 3 machine-checked Lean 4 theorems in
          `morphoeval/lean/loops/Loop_037_allometric_compound_leaf.lean`.
        evidence:
          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [97, 234], note: "1D growing epidermal margin Auxin-PIN1-CUC2 reaction-transport PDE verifying Law 1 antiphase and PIN1 promotion", supports: true}
          - {file: 2011-przemyslaw-allometric-compound-leaf.py, lines: [239, 435], note: "2D leaf margin contour outgrowth solver across 6 Arabidopsis/Cardamine genotypes and 4 intercalary growth stages P3-P6", supports: true}
          - {file: morphoeval/lean/loops/Loop_037_allometric_compound_leaf.lean, lines: [13, 149], note: "3 machine-checked Lean 4 theorems for Auxin-CUC2 antiphase, mutant smooth margin collapse, and RCO dissection enhancement (0 sorrys)", supports: true}
      specimen-match:
