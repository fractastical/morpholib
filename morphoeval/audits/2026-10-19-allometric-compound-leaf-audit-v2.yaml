        rationale: >-
          Sweeps all 6 *Arabidopsis* and *Cardamine* genotypes (`cuc2-1`, `cuc2-1D`
          unrepressed uniform CUC2 control, *Arabidopsis* WT Col-0, `mir164a-4`,
          *Cardamine* `rco` mutant, and *Cardamine hirsuta* WT + RCO) plus 4 developmental
