# MorphoEval audit v2 — Bicyclus anynana Turing wavelength.
# Scores the control suite that pass 1 listed and that the script now records:
# k_p sweep, width doubling (1 focus → 2), equal-diffusion ablation (k_c → 0),
# specimen segmentation, and dispersion goodness-of-fit.
# Supersedes the pass-1 audit. R5 and R6 stay open.
