simulations:
  - id: delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0
    name: "Schnakenberg wavelength at 52 µm for the Late Pleistocene marine stickleback (Pass 1 bare field)"
    organism: "Gasterosteus aculeatus_marine"
    script: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py
    output: docs/media/gasterosteus_aculeatus_marine_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, colosimo2005, colosimo2004, bell1985, kondo1995, nakamasu2009]
    summary: >-
      Pass 1 reports the bare Schnakenberg activator (k_c^2 = 0.775, λ = 52 µm,
      age 0.015 Ma). Radial Pearson against the Holger Krisp CC BY 4.0 photograph
      is 0.262 and the z-scored radial RMSE is 1.215. The photograph's flank bars
      measure about 641 µm, which is not the 52 µm carrier.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) critical wavenumber from the dispersion determinant"
        - "Colosimo et al. (2004, 2005) Eda complete-plate versus low-plate morphs"
        - "Bell, Baumgartner and Olson (1985) temporal change in G. doryssus armor characters"
      reconstructed_in_script:
        - "Schnakenberg (a, b, D_u, D_v) placed so the marine wavelength is 52 µm"
        - "λ(N) = 52 µm * sqrt(32/N) giving 104 µm (doryssus_late) and 78 µm (living aculeatus)"
      transfer_boundary:
        - "N_eff = 8 for the predecessor is the Colosimo low-morph analogy, not a Truckee plate count"
        - "The 2020 German photograph is an extant anatomical plate, not a 15 ka fossil"
      does_not_claim:
        - "That 52 µm was measured on a fossil melanophore"
        - "That the bare activator image is a pixel match to the photograph"
    scores:
      model-fidelity:
        value: 84
        rationale: "The script integrates Schnakenberg kinetics with implicit diffusion and the analytical k_c. Parameters are chosen to hit 52 µm; they are not a published stickleback rate table."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py, lines: [81, 100], note: "dispersion(): h, k_c^2, lambda_nd", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py, lines: [109, 140], note: "integrate(): operator-split Schnakenberg", supports: true}
      specimen-match:
        value: 52
        rationale: "The growth frames show a spot field, and the comparison figure places it beside the fish, but the Pass-1 bare field is not the fish. Computer-vision similarity of that bare field is 80.5, while radial Pearson is only 0.262."
        evidence:
          - {file: docs/media/gasterosteus_aculeatus_marine_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, bare activator, and chronoseries bars", supports: true}
          - {file: docs/media/gasterosteus_aculeatus_marine_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame growth; early frames are the activator", supports: true}
      parameter-expressivity:
        value: 74
        rationale: "λ(s) = 52 * sqrt(s) is monotone on s in {0.64, 1, 2.25, 4}, but Pass 1 did not yet use that sweep as the reported specimen fit."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py, lines: [160, 174], note: "parameter_sweep over diffusivity scale s", supports: true}
      morphometric-validation:
        value: 64
        rationale: "Flank-bar spacing on the photograph is 641 µm against the 52 µm anchor (values differ). The Pass-1 radial Pearson of 0.262 does not clear 0.98, so the goodness-of-fit is not yet a pass."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py, lines: [551, 601], note: "measure_morphoeval includes pass1_untuned_radial_pearson_r", supports: true}
          - {file: datasets/gasterosteus_aculeatus_marine_turing_wavelength_s0/gasterosteus_aculeatus_marine_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "pass1 radial Pearson 0.262, RMSE 1.215", supports: true}
      source-traceability:
        value: 90
        rationale: "Turing, Colosimo 2004/2005, Bell 1985, Kondo 1995, and Nakamasu 2009 are cited with DOIs. The specimen is Holger Krisp, CC BY 4.0, SHA-256 pinned."
        evidence:
          - {file: datasets/gasterosteus_aculeatus_marine_turing_wavelength_s0/paper_citations.bib, lines: [1, 21], note: "Turing 1952 and Colosimo 2005", supports: true}
      code-traceability:
        value: 82
        rationale: "dispersion() and integrate() are commented against the Turing formulae. The plate-count map is labeled as a reconstruction."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py, lines: [1, 28], note: "module docstring states the equations and the chronoseries", supports: true}
      repro-package:
        value: 84
        rationale: "Seed 3232, --self-test, and pinned specimen bytes. Pass 1 self-test correctly rejects the bare-field Pearson."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py, lines: [635, 653], note: "self-test asserts bare-field r < 0.98 and fitted r > 0.98", supports: true}
    remediation:
      - "Goodness-of-fit: bare-field radial Pearson is 0.262. Fit a specimen-locked gain and recompute Pearson, RMSE, and KS."
      - "Real specimen CV segmentation: report foreground fraction, structure-tensor coherency, and flank-bar spacing, and keep bar spacing unequal to the 52 µm reference."
      - "Parameter-regime sweep: require λ(s) to increase monotonically for s in {0.64, 1, 2.25, 4}."
      - "Negative control: equal diffusion (Du = Dv) must stay outside the Turing band and the pattern/control activator-std ratio must exceed 3."
