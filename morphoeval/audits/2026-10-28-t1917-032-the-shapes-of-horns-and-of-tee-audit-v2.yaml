# MorphoEval audit — Thompson (1917) T1917-032 "Teeth and tusks grow by the same spiral/torsion
# geometry (St Venant torsion curves)" — Pass 2 (v2), 2026-10-28
#
# Supersedes 2026-10-28-t1917-032-the-shapes-of-horns-and-of-tee-audit (Pass 1, 60.7/100).
# Pass 2 evaluation of `thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py` (1338 lines)
# after closing all five Pass 1 remediation items.  Weighted overall ~ 86.0 / 100 (+25.3).
#
# Key remediation verified in Pass 2:
#   1. 3-D screw-accretion fits (E4-E6) Procrustes-aligned to the projected mammoth centreline in a 2 × 2 nested
#      design {κ = Δ/w̄ constant width, κ = Δ/w(s) measured width} × {τ = 0 plane, τ free twisted}
#      (`fit_screw_model`, `compare_screw_models`, L542-L611): RMSE 33.1 / 17.4 / 37.3 / 23.1 px.  Twist halves
#      the residual (ΔAIC = 477 and 355) — Thompson's "curve of double curvature" is strongly supported; the
#      accretion width-law κ ∝ 1/w(s) is NOT (constant-width helix fits better, width-law RMSE ratio 0.75).
#   2. Parameter-regime sweep (`parameter_sweep`, L639-L700): 30 (λ, c) regimes, 5 τ values, 16 ψ regimes —
#      S1 κ falls with taper, S2 constant width ⇒ constant curvature, S3 imposed τ recovered as Frenet torsion
#      (≤ 2 %), S4 E5 prediction tan ψ = Δ/c_s vs fitted ψ: r = 1.000, RMSE 0.2°, S5 helix slope monotone in ρ.
#   3. Controls: Archimedean spiral (RMSE 123.6 px vs log spiral 36.8 px), block-shuffled-width permutation
#      (Spearman p = 0.80 — coupling not better than chance; sign is the wrong way, ρ = −0.18), τ = 0 ablation,
#      circular-section St Venant null (max|u_z| = 0).
#   4. Statistics: block-bootstrap 95 % CIs (ψ 34.7-40.1°, r 0.984-0.998, narwhal φ 26.3-33.0°), one-sample KS
#      on standardised residuals (p < 0.001: systematic misfit, honestly reported), tan α vs 1/d regression
#      along the narwhal shaft (slope −1766, 95 % CI −17847..−1079; confounded by camera obliquity, not scored).
#   5. Width-scaled smoothing (σ = 0.65 × median width = 50 px), CLI overrides (--sigma-frac, --n-trials,
#      --n-boot, --n-perm, --pass1), library versions and all parameters recorded in result.json.
# Verdict on the claim: MIXED (6/10 components) — torsion / helical component and St Venant torsion curves
# supported, narwhal groove angle 70.2° within 1 SD of Kiladze & Chernova (2018) 66.9 ± 3.3°, gnomonic
# differential-accretion log spiral not supported on this single 2-D mammoth photograph.

