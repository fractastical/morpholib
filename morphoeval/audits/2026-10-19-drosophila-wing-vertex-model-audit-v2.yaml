    claim_boundary:
      reported_in_source:
        - "Farhadifar, Röper, Aigouy, Eaton & Jülicher (2007) Current Biology Eqs. 1-2 & Fig. 2A: apical epithelial vertex energy functional E({r_i}) = sum (K/2)(A_alpha - A^(0))^2 + sum Lambda_{ij} l_{ij} + sum (Gamma/2) L_alpha^2 parameterized by (Lambda_bar, Gamma_bar), partitioning ground states into Case I (rigid hexagonal, canonical wing disc Lambda_bar=0.12, Gamma_bar=0.04), Case II (soft network), and Case III (cell collapse)."
        - "Farhadifar et al. (2007) Fig. 3-4, Gibson et al. (2006) Nature & Classen et al. (2005) Dev. Cell: proliferating 3rd-instar Drosophila wing disc exhibits P(6) approx 0.455 (mu_2 = 0.765) and obeys Lewis's Law <A_n>/<A> = (n-2)/4, whereas post-mitotic pupal wing annealing increases P(6) to ~0.78 (mu_2 = 0.250)."
      reconstructed_in_script:
        - "2D periodic apical vertex packing and mitotic cleavage simulation across 4 mechanical regimes (Proliferating Wing Disc, Post-Mitotic Pupal Wing, High-Contractility Case I, and Soft Case II), 2D (Lambda_bar, Gamma_bar) phase diagram, UV laser junction ablation recoil curves, and 7-point continuous Lambda_bar sweep."
        - "Junction-guided Voronoi-watershed segmentation of the apical junction-stained polygonal epithelial micrograph (`drosophila_wing_epithelium_specimen.jpg`, N=37 interior cells, P(6)=0.4865, P(n) correlation r = 0.9913)."
      transfer_boundary:
        - "2D apical junctional projection of 3D pseudostratified/columnar wing imaginal disc epithelial cells."
      does_not_claim:
        - "Does not model basal extracellular matrix curvature or 3D apico-basal scutoid transitions."
    summary: >-
      Pass 2 (v2) evaluation of `2007-farhadifar-drosophila-wing-vertex-model.py` (90.9/100,
      up from 57.7/100 in Pass 1; +33.2 points). The remediated script implements the full
      Farhadifar et al. (2007) apical vertex energy functional, classifies the 2D
      `(Lambda_bar, Gamma_bar)` ground-state phase diagram across Cases I, II, and III,
      simulates all 4 mechanical/developmental regimes (proliferating larval wing disc
      `P(6)=0.440, r=0.9820`, annealed pupal wing `P(6)=0.840, mu_2=0.160`, high-contractility
      cortex `Gamma_bar=0.10`, and soft Case II network `Lambda_bar=-0.25`), models UV laser
      adherens-junction ablation recoil (`v_0 = 0.22 um/s`), segments the SHA-256-locked
      apical junction-stained epithelial specimen (`drosophila_wing_epithelium_specimen.jpg`,
      `N=37` cells, `P(n)` Pearson `r = 0.9913`), and is backed by 4 machine-checked Lean 4
      theorems in `Loop_043_drosophila_wing_vertex_model.lean`.
