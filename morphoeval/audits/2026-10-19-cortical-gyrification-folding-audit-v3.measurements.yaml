    claim_boundary:
      reported_in_source:
      - 'Richman et al. (1975): a stiff cortical plate growing on a softer subcortical foundation buckles with wavelength
        lambda = 2 pi h (mu_c / 3 mu_s)^(1/3), predicting fine folds for thin (microgyric) cortex and broad folds
        for thick cortex'
      - 'Tallinen et al. (2014, 2016): multiplicative tangential growth F = F_e G of a neo-Hookean cortex above
        a critical excess g_c produces cusped sulci; a 3D gel-brain and a tetrahedral FEM on a GW22 MRI template
        reproduce fetal gyrification GW22-GW34 with GI rising to about 2.5'
      - 'Mota & Herculano-Houzel (2015): cortical folding scales universally with surface area and thickness across
        mammals'
      - 'Zilles et al. (1988): human whole-hemisphere coronal gyrification index 2.56 +/- 0.08'
      - 'Stoop et al. (2015): a stiff film on a soft curved substrate follows a generalized Swift-Hohenberg equation
        whose curvature-induced quadratic term selects hexagonal dimples at low overstress and labyrinths at high
        overstress'
      - 'Fischl & Dale (2000): regional human cortical thickness varies from about 1 mm to 4.5 mm (mean about 2.5
        mm) across the hemisphere'
      reconstructed_in_script:
      - Laws 1-3 (growth excess, cube-root wavelength, GI = 1 + 2 N d / P_hull) as closed-form functions; a 2D coronal
        shell relaxation (L-BFGS-B) toward a prescribed cusp profile with sulcus count and GI target set from the
        formula; 11-species and 4-condition sweeps; segmentation of one coronal specimen image
      - 'Pass 3: generalized Swift-Hohenberg relaxation on an ellipsoidal hemisphere surface (cotangent Laplace-Beltrami,
        semi-implicit Euler, Lyapunov energy), regional k_c(x) from a linear thickness gradient, raster skeleton
        Y-junction counting, marching-triangles iso-contour fundus length, 3D crease-wall GI with depth imported
        from the 2D solver, 4-point thickness-gradient sweep'
      transfer_boundary:
      - The 11-species lambda_obs values in the reference JSON are generated from the Richman formula (4.3633 h),
        so cross-species wavelength agreement (r = 1.0000, alpha = 0.9993, lambda/h = 4.3642) is formula-vs-formula,
        not model-vs-measurement
      - The 2D coronal solver's sulcus count, GI target and cusp profile are prescribed before minimisation; L-BFGS-B
        removes injected noise rather than selecting a buckling mode, so GI_sim, lambda_sim and sulcus counts equal
        their targets by construction
      - The 3D surrogate's preferred wavenumber k_c(x) is imposed by the GSH operator; lambda_3D = 11.41 vs 11.33
        and the gradient slope 1.006 are consistency checks of the nonlinear planform, and eps_scale = 0.5 / g2_curvature_coeff
        = 0.35 are tuning constants chosen to place GW26 in the dimple phase and GW38 in the labyrinth phase
      - The ellipsoid (1.30 R, 0.70 R, 0.95 R) is not an MRI template; Y-junction density has only the honeycomb
        upper bound 2.31 per lambda^2 as reference; the percolation ratio has only a > 1 lower bound
      does_not_claim:
      - A volumetric tetrahedral neo-Hookean FEM, emergent sulcal depth or GI amplitude in 3D, gyral-crown vs fundus
        thickness differentiation, MRI-template geometry, a Floquet/linear-stability derivation of g_c, or validation
        of Y-junction density against measured fetal sulcal graphs
