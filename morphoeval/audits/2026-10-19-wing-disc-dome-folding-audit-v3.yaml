# MorphoEval audit — Tozluoglu et al. (2019) Dev. Cell & Sui et al. (2018) Nat. Commun. Drosophila Wing Disc Dome & Hinge Folding, 2026-10-19 (v3)
#
# Pass 3 (v3) re-score of `2020-tozluoglu-wing-disc-dome-folding.py` (1900 lines, script v3) after the Pass 3
# remediation round in the instrumented loop `morphoeval/runs/2026-10-19-wing-disc-dome-folding-loop-pass3`,
# superseding `2026-10-19-wing-disc-dome-folding-audit-v2` (93.7).
#   - Primary assessor: Claude Fable 5.1 (Phase B assessor subagent; scored from the Phase A handoff note, the
#     `git diff` of the script and Lean file, a fresh `--self-test` run (10/10 PASSED, 11.9 s) and a fresh
#     `lean` check (exit 0, 0 sorrys) against the CURRENT working-tree file at commit 028758bc).
#
# What Pass 3 changed (the single open v2 remediation item):
#   1. v2 item "extend the 2D sagittal bilayer to a full 3D FEM coupling the disc proper (DP) to the squamous
#      peripodial epithelium (PE) and lumenal hydrostatic pressure" — closed in REDUCED form, residual carried.
#      No 3D FEM. A quasi-1D plane-strain three-compartment sac was added: neo-Hookean BM shell tension
#      (`compute_disc_proper_shell_tension`, L521-534), shallow-cap Laplace dome deflection
#      (`compute_laplace_dome_deflection`, L536-547), PE as a tensioned membrane T_PE z'' = -p clamped at the
#      margins and in unilateral contact with the DP via L-BFGS-B box bounds (`_solve_peripodial_membrane`,
#      L550-590), lumen pressure closed by bisection on a prescribed fluid volume or imposed directly
#      (`solve_coupled_disc_peripodial_lumen`, L592-742), an imposed-pressure sweep 0-800 Pa
#      (`evaluate_lumen_pressure_sweep`, L745-791), a 6th perturbation `peripodial_ablation` (L921-936,
#      prediction only), 6 new CLI flags (L1861-1866), a new provenance-tagged dataset file
#      `peripodial_lumen_reference.json` (SHA-256 pinned), a new sweep figure, 5 new measurements (13 total),
#      self-test 8 -> 10 checks, and 2 new Lean 4 theorems (Law 4).
#   Results at 96 h WT (volume mode): p = 0.62 Pa, dome 53.91 um (uncoupled 53.98; ref 54.0), d_HH 19.65 um
#   (ref 19.4), fold-locus shift 0.000 across the sweep, p_half = 372.5 Pa (prediction).
#
# Why the overall score goes DOWN (93.7 -> ~86): the Pass 3 work is honest and well-tagged, but reading the
# solver closely for this round exposed defects that the v1/v2 audits did not penalise:
#   (a) the "relaxed" bilayer surface is tethered (k_tether = 1.0, L414) to a hand-built target shape whose dome
#       envelope (L354-368), stage scaling (L371-374) and Gaussian cleft depths 15.35/19.95/16.75 um x fitted
#       multipliers (L383-394) are tuned to the reference table, so dome r = 0.998 and 15-fold r = 0.995 are
#       largely prescribed, not emergent from g(s);
#   (b) `c_finite = 8.395` (L208) is calibrated to hit the 0.0128 um^-1 reference curvature;
#   (c) the 7-zone curvature r = 1.0000 compares hard-coded zone values (0.0148/0.0151, 0.0042, -0.0020*depth,
#       L879-885) with the reference, i.e. it is copied, not computed;
#   (d) the uniform-growth positional SD discards the 12 solved replicates and samples U(0.18, 0.68) (L970), and
#       the WT pinned SD is drawn with the reference SD as generating sigma (L975);
#   (e) the specimen fold loci are found inside narrow windows with an explicit pull toward s = 0.39 (L1061-1072).
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# working-tree files at commit 028758bc (uncommitted Pass 3 edits included).

