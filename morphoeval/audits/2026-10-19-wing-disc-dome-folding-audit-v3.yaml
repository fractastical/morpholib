simulations:
  - id: tozluoglu-wing-disc-dome-folding
    name: "Tozluoglu et al. (2019) Dev. Cell & Sui et al. (2018) Nat. Commun. Drosophila wing imaginal disc planar differential growth, basal ECM dome & H/N, H/H, H/P hinge folding (Pass 3: + reduced disc-proper / peripodial / lumen sac)"
    organism: "Drosophila melanogaster (third-instar larval wing imaginal disc, 64h-96h AEL)"
    script: 2020-tozluoglu-wing-disc-dome-folding.py
    output: docs/media/wing_disc_dome_folding_comparison.png
    extra_outputs:
      - docs/media/wing_disc_dome_folding_growth.gif
      - docs/media/wing_disc_dome_folding_lumen_pressure_sweep.png
    status: evaluated
    supersedes_audit_id: 2026-10-19-wing-disc-dome-folding-audit-v2
    source_refs:
      - tozluoglu2019
      - sui2018
      - villafombuena2021
      - nelson2016
      - mcclure2005
      - mosaliganti2019
    claim_boundary:
      reported_in_source:
        - "Tozluoglu et al. (2019): planar differential growth rates in the third-instar wing disc, together with the basal ECM, position the H/N, H/H and H/P folds precisely; uniform growth gives unpinned buckling; Collagenase flattens the dome and abolishes folds"
        - "Sui et al. (2018): differential lateral and basal tension drive H/H vs H/P folding by two distinct mechanisms"
        - "McClure & Schubiger (2005): the peripodial epithelium is a thin squamous layer overlying the columnar disc proper (used only for h_PE ~ 3 um; DOI not verified offline)"
        - "Mosaliganti et al. (2019): epithelial lumen pressures of ~100-300 Pa in the zebrafish otic vesicle (order-of-magnitude context only; NOT wing-disc data; DOI not verified offline)"
      reconstructed_in_script:
        - "L-BFGS-B 2D sagittal apico-basal bilayer with multiplicative growth stretch, stiff BM tether and local fold remodeling (Pass 2); Pass 3 adds a quasi-1D plane-strain sac: neo-Hookean BM shell tension, shallow-cap Laplace dome deflection, tensioned PE membrane in unilateral contact, lumen pressure closed by prescribed volume (bisection) or imposed, an imposed-pressure sweep, a PE-ablation control, 13 measurements and 10 self-test checks"
      transfer_boundary:
        - "The bilayer 'relaxed' surface is tethered to a hand-built target shape (dome envelope, stage scaling and Gaussian cleft depths fitted to the reference table), so the 64-96 h dome and fold-depth correlations largely reproduce the prescription rather than emerge from g(s)"
        - "T_PE = 1 mN/m, h_lumen = 12 um, h_margin = 8 um and T_cell = 0.5 mN/m are order-of-magnitude assumptions with no wing-disc measurement; the self-consistent p = 0.62 Pa and p_half = 372.5 Pa are model predictions with no published value to compare"
      does_not_claim:
        - "A 3D finite-element mesh, dorsoventral curvature, PE growth or PE fold mechanics, a measured wing-disc lumen pressure, or an emergent (untethered) fold pattern"
    summary: >-
      Pass 3 (v3) evaluation of `2020-tozluoglu-wing-disc-dome-folding.py`. The single open v2 item (3D FEM
      of DP + PE + lumen) was closed in reduced form: a quasi-1D plane-strain three-compartment sac coupling
      the Pass 2 bilayer disc proper to a tensioned squamous peripodial membrane in unilateral contact and an
      incompressible lumen whose pressure is closed by prescribed volume (p = 0.62 Pa at 96 h, dome 53.91 um
      vs ref 54.0, d_HH 19.65 um vs ref 19.4) or imposed (sweep 0-800 Pa; p_half = 372.5 Pa; fold-locus shift
      0.000), with a PE-ablation control, provenance-tagged parameters, two Lean 4 theorems and 10/10 passing
      self-test checks. The round also exposed that the headline fits are largely prescribed: the relaxed
      surface is tethered to a reference-fitted target shape, the dome-curvature constant is calibrated to the
      reference, the 7-zone curvature correlation compares hard-coded values, the uniform-growth positional SD
      is sampled rather than measured from the solved replicates, and the specimen fold loci are
      window-prescribed. Scores drop accordingly; the Pass 3 additions themselves are honest and well tagged.
    scores:
      model-fidelity:
        value: 82
        rationale: >-
          Credited: the Pass 3 sac is a physically coherent reduced model — neo-Hookean BM membrane tension
          T_DP = mu_BM h_BM (gamma^2 - gamma^-4) + T_cell (L521-534), shallow-cap Laplace response
          dz = p chord^2 / (16 T_DP) (L536-547), PE membrane energy sum 0.5 T_PE (dz/dx)^2 - p z with
          unilateral contact z_PE >= z_DP + h_min through L-BFGS-B bounds (L550-590), and a volume-closed
          lumen pressure by bisection with PE-ablation reducing exactly to the uncoupled DP (L592-742);
          Law 4 is machine-checked (Lean L168-207) and the Law 2 trough second difference is proven
          invariant to a uniform load. Deductions: the Pass 2 bilayer (L267-519) builds `z_target` from a
          hand-tuned dome envelope (L354-368), stage scaling (L371-374) and Gaussian cleft amplitudes with
          per-condition multipliers 0.861 / 0.959 / 1 + 0.092(...) and `remodel_mult` / `jak_mult`
          (L383-394) fitted to the reference, and tethers the solution to it with k_tether = 1.0 (L414), so
          folds are prescribed rather than emergent from g(s) (-9); `c_finite = 8.395` (L208) is calibrated
          to the 0.0128 um^-1 reference (-3); the lumen is quasi-1D per unit D-V width with no PE growth or
          fold mechanics and no 3D mesh, which is the v2 item still open (-4); the pressure-mode sweep lets
          the PE sag > 100 um for p > 10 Pa, so the sweep is a DP-only response, not a sac equilibrium (-2).
        evidence:
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [521, 590], note: "Pass 3: DP shell tension, Laplace dome deflection and PE membrane with unilateral contact via L-BFGS-B box bounds", supports: true}
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [592, 742], note: "solve_coupled_disc_peripodial_lumen: volume-mode bisection on p, pressure mode, PE ablation (T_PE = 0, p = 0) reduces to uncoupled DP", supports: true}
          - {file: morphoeval/lean/loops/Loop_049_wing_disc_dome_folding.lean, lines: [168, 207], note: "Law 4: lumen_pressure_laplace_dome_deflection and uniform_lumen_load_preserves_growth_trough_second_diff (0 sorrys, lean exit 0)", supports: true}
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [354, 414], note: "Target shape: dome_amp_stage with fitted per-condition multipliers, fold_stage_scale, cleft depths 15.35/19.95/16.75 x remodel_mult/jak_mult; k_tether = 1.0 tethers the relaxed surface to z_target", supports: false}
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [193, 211], note: "compute_bilayer_dome_curvature with c_finite = 8.395 calibrated to the 0.0128 um^-1 reference", supports: false}
      specimen-match:
        value: 85
        rationale: >-
          Credited: the CC BY-SA 2.5 micrograph is SHA-256-locked and segmented (`segment_wing_disc_specimen`,
          L1005-1118) into 3 discs with a proximal-distal reporter profile; the 6-panel figure now shows the
          coupled DP + PE + lumen sac cross-section, 6 perturbation bars including the PE-ablation prediction
          and the specimen CV panel, and the GIF overlays PE and lumen on the 5 stage frames and now honours
          the CLI overrides (`render_growth_gif(overrides=...)`, L1499-1601). Deductions: the H/N, H/H and
          H/P loci are searched inside windows [0.22, 0.30], [0.35, 0.43] and [0.50, 0.54], and the H/H
          objective subtracts 0.8 |s - 0.39| (L1061-1072), so the 'mean fold position error 0.004' and the
          pouch fraction `pouch_frac = s_hp_emp` (L1082) mostly reflect the windows rather than the
          specimen (-9); the specimen is a Wikimedia micrograph of unstated genotype, stage and reporter, so
          the 'reporter staining' reading is unsourced (-4); no side-by-side with Tozluoglu et al. Fig. 1
          cross-sections or with a PE/lumen micrograph for the new sac (-2).
        evidence:
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [1005, 1118], note: "CV segmentation of 3 discs, reporter profile and H/N, H/H, H/P loci", supports: true}
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [1061, 1082], note: "Fold loci confined to narrow windows with an explicit -0.8|s - 0.39| pull to the reference; pouch_frac = s_hp_emp", supports: false}
          - {file: docs/media/wing_disc_dome_folding_comparison.png, lines: [0, 0], note: "6 panels: g(s), DP + PE + lumen sac cross-section, 64-96 h timecourse, 6 perturbation bars incl. PE ablation, specimen CV", supports: true}
          - {file: docs/media/wing_disc_dome_folding_growth.gif, lines: [0, 0], note: "5 stage frames with PE and lumen overlaid; GIF now follows CLI overrides", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          Credited: 5 stages x 7 zones (L809-903), 6 perturbation conditions including the new
          `peripodial_ablation` (L906-999), the imposed-pressure sweep over 9 values 0-800 Pa reporting
          p_half, maximal fold-locus shift and monotonicity (L745-791), and 11 CLI overrides: `--mu-bm`,
          `--g-pouch`, `--jak-stat-boost`, `--remodeling`, `--seed` plus the new `--lumen-mode`,
