          through `_lumen_kwargs_from_overrides` (L797-806) into timecourse, figure and GIF. Deductions:
          because the fold family is tethered to a prescribed target (L354-414), the swept growth parameters
          change amplitudes but cannot move or create folds (-6); `--p-lumen` is silent unless
          `--lumen-mode pressure` is also passed (L1862) (-2); no sweep over T_PE or h_lumen, the two most
          uncertain Pass 3 inputs (-2).
        evidence:
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [745, 806], note: "evaluate_lumen_pressure_sweep (0-800 Pa, p_half, locus shift, monotonicity) and _lumen_kwargs_from_overrides", supports: true}
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [906, 999], note: "6 perturbation conditions incl. peripodial_ablation (L921-936) flagged is_prediction_only (L996)", supports: true}
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [1853, 1866], note: "11 CLI flags incl. --lumen-mode, --p-lumen, --h-lumen, --t-pe, --ablate-peripodial, --skip-sweep; --p-lumen only active with --lumen-mode pressure", supports: true}
