          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [879, 885], note: "7-zone curvature: hinge 0.0148/0.0151, notum 0.0042, fold -0.0020*depth hard-coded; r = 1.0000 is copied", supports: false}
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [958, 975], note: "Uniform-growth SD sampled via rng_rep.uniform(0.18, 0.68); WT pinned SD drawn with the reference SD as sigma", supports: false}
          - {file: 2020-tozluoglu-wing-disc-dome-folding.py, lines: [474, 476], note: "Uniform-growth d_hn/d_hh/d_hp set equal to the prescribed targets", supports: false}
      source-traceability:
