# MorphoEval audit — Raspopovic et al. (2014) Science Bmp-Sox9-Wnt 3-Node Turing Digit Network on a
# Moving-Boundary Finite-Element Limb-Bud Outgrowth Mesh, 2026-10-19 (v3, Pass 3 Remediated)
#
# Pass 3 re-score of `2014-raspopovic-bmp-sox9-wnt-digits.py` (2066 lines; 12 self-test checks; 18 measurements)
# after the remediation of the single open v2 finding in the instrumented loop
# `morphoeval/runs/2026-10-19-bmp-sox9-wnt-digits-loop-pass3` (isolated telemetry), superseding
# `2026-10-19-bmp-sox9-wnt-digits-audit-v2` (96.3, Gemini 4 Argon).
#   - Primary assessor: Claude Fable 5.1 (same agent that built the remediation; every evidence line below was
#     re-read against the working-tree file at commit d58a084 and the scores are deliberately conservative).
#   - No fresh blinded second assessor was run in this round (see `checkpoint.note`).
#
# What Pass 3 changed (closing the v2 item "couple the 2D polar-fan Bmp-Sox9-Wnt reaction-diffusion solver to a
# moving-boundary finite-element limb-bud outgrowth mesh"):
#   1. New Section 3b (L669-1140): a genuine P1 linear-triangle finite-element solver (lumped mass, implicit
#      diffusion via splu, explicit reaction) on a Lagrangian / ALE polar-fan limb-bud mesh whose distal boundary
#      (AER) moves as R(t) = min(R1, R0 exp(g t)); the conservative update M(t+dt) c(t+dt) = M(t)[c + dt f(c)]
#      (L883-886) realises the Crampin-Gaffney-Maini growth-dilution term exactly; the stiffness matrix is
#      re-assembled on the deformed mesh (L874). AER-anchored FGF/Hoxd wavelength modulation
#      lambda(r,t) = lambda_AER r / R(t) through D ∝ (r/R(t))^2 (L850-856) with `--fgf-mode scaled|material|none`.
#      Initial condition is unbiased noise (no mode seeding). Result: 5 unbranched Sox9 rays (bifurcation range 0),
#      r(Sox9,Bmp) = -0.978, r(Sox9,Wnt) = -0.994, sequential ray addition 2 -> 4 -> 5 as L_arc grows 11.9 -> 20.1.
#   2. Verification layer (L960-1030): K x^2 = -2M to 4e-16, sum(M) = area exactly, seeded-mode growth rate within
#      2.2 % of Re sigma(q_c) (4.7 % at q = 1.885), ALE mass conservation exact.
#   3. New sweeps: growth-dilution sweep (slope -1.000, threshold rho_c = 0.265 vs sigma_max = 0.2608; L1033-1085),
#      final-arc sweep L_arc = 12..28 (monotone, Spearman 0.97, slope 0.225 vs 1/lambda = 0.250; L1088-1120),
#      3-mode x 3-seed modulation ablation (scaled 0.00 / material 0.67 / none 0.67 mean bifurcation range; L1123-1139).
#   4. Lean 4: 3 new theorems (Laws 4-6, 0 sorry, `lean` exit 0) in Loop_016 L98-168; registered as laws 4-6 in
#      morphoeval/math_kg_loops/raspopovic-bmp-sox9-wnt-digits.yaml.
#   5. Dataset: `limb_bud_outgrowth_fem_reference.json` + `paper_citations_pass3.bib` (both SHA-256-pinned; 6 pinned
#      files), README items 5-6; figure 6 -> 9 panels (A FEM limb bud, G outgrowth sequence, H ablation, I arc sweep);
#      GIF now shows the growing FEM mesh; self-test 8 -> 12 checks; measurements 9 -> 18; render 41 s, self-test 55 s.
#
# Why the overall score FALLS from 96.3 to 84.0 although the v2 item is closed: building the FEM layer exposed
# that three headline v2 results were imposed rather than emergent and were scored at 95-97 by the v2 assessor:
#   (a) the v2 2D polar-fan solver seeds the target 5-ray mode as its initial condition (L526-528), scales radial
#       diffusion by 0.0008 (L549-550) and multiplies the output by a cosmetic autopod envelope (L514, L560-567);
#   (b) the 7-regime FGF/Hox wavelength collapse (r = 0.978) is produced by a fitted power-law diffusion scaling
#       d_scale = (k_bs_eff / k_bs)^3.12 (L318) — with D fixed, the model's own dispersion relation gives the OPPOSITE
#       sign (k_bs 1.0 -> 3.2 shortens lambda_c 5.02 -> 3.27), so the reference table's k_bs_eff / lambda_obs pairing
#       is not a prediction of the network;
#   (c) the LDN-193189 and CHIR99021 digit counts are capped by hand (min(1, ...), min(2, ...), L644-649) and every
#       perturbation carries a hand-set basal Sox9 offset (L617-629).
# These are now priced into model-fidelity, parameter-expressivity, morphometric-validation and code-traceability
# and listed as Pass 4 remediation items together with the next layer of FEM defects (prescribed fan geometry,
# interior rather than marginal ray insertion, analytic rather than measured growth references).
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the working-tree files at commit d58a084.

