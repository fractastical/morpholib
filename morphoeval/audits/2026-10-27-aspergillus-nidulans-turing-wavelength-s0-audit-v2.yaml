          - {file: morphoeval/lean/loops/Loop_3122_aspergillus_nidulans_turing_wavelength_s0.lean, lines: [21, 52], note: "Five sorry-free theorems", supports: true}
          - {file: models/2026-delphi10000-aspergillus-nidulans-turing-wavelength-s0.py, lines: [575, 688], note: "measure_morphoeval exports non-circular metrics including the pass-2 rows", supports: true}
      repro-package:
        value: 92
        rationale: >
