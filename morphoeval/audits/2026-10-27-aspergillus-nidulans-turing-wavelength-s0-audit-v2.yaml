        evidence:
          - {file: models/2026-delphi10000-aspergillus-nidulans-turing-wavelength-s0.py, lines: [280, 298], note: "Dispersion Pearson and RMSE", supports: true}
          - {file: models/2026-delphi10000-aspergillus-nidulans-turing-wavelength-s0.py, lines: [437, 456], note: "Multi-seed CV", supports: true}
          - {file: models/2026-delphi10000-aspergillus-nidulans-turing-wavelength-s0.py, lines: [670, 678], note: "Sobel L1 measurement with a null reference", supports: true}
      source-traceability:
