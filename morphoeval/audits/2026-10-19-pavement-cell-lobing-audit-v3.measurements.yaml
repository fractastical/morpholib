    claim_boundary:
      reported_in_source:
      - 'Sapala et al. (2018) eLife 7:e32794: outer periclinal cell wall tensile stress in pressurised FEM cell
        templates increases with the Largest Empty Circle radius (thin-wall proxy sigma_max ~ P R_LEC / h, Box 1
        & Fig. 3); interdigitated puzzle lobing pins R_LEC near ~11.4 um as cell area expands to 4500 um^2 whereas
        isotropic polygonal/mutant cells grow as sqrt(A/pi)'
      - 'Fu et al. (2005) Cell 120:687-700 & Lin et al. (2013) Curr Biol 23:290-297: antagonistic cortical ROP2-RIC4
        (actin lobe outgrowth) and ROP6-RIC1-KTN1 (katanin-mediated microtubule neck bundling) polarisation in antiphase
        across shared anticlinal cell walls; lobeyness collapse in rop2 rop4 RNAi and ktn1/ric1 mutants'
      - 'Armour et al. (2015) Plant Cell 27:2484-2500: lobe formation involves differential growth of periclinal
        and anticlinal walls in 3D (depth context; no amplitude-vs-depth table is used here)'
      reconstructed_in_script:
      - Exact 2D Euclidean Distance Transform R_LEC and ConvexHull solidity/lobeyness across A in [250, 4500] um^2
        for a compact branched WT puzzle construction (band + alternating staggered finger lobes; aspect 2.6 at
        4500 um^2), unlobed isotropic cells, ktn1/ric1 and rop2 rop4 mutants, and parallel-file monocot epidermis
      - 196-node periodic anticlinal boundary coupled ROP2-RIC4 / ROP6-RIC1-KTN1 reaction-diffusion PDE integrator
        (intracortical r = -0.9899, trans-wall r = 0.9998, 24.5 um lobe wavelength, exact intercellular area conservation)
      - '(Pass 3) Reduced Foppl uniform-tension pressurised periclinal membrane solve -T lap(z) = P on the rasterised
        footprint with self-consistent tension T = T0 + E h eps/(1-nu), T0 = P H / 2, verified against the closed-form
        disk (0.9 %) and the inscribed-disk bound (18/18), used to TEST the LEC stress proxy: Pearson r(sigma_m,
        R_LEC) = 0.982 but fitted exponent 0.51 and isotropic/WT ratio 1.73 vs the proxy''s 3.32'
      - '(Pass 3) Depth-resolved anticlinal wall strip: outer-junction forcing by the ROP2-ROP6 wall displacement,
        Robin inner face (beta sweep 0 .. clamped), sparse FD Laplace solve vs modal closed form (1.2 %), dominant
        k = 8 mode inner/outer gain 0.028 (e^-1 penetration 4 um of H = 15 um), depth-distributed-forcing ablation
        (inner/outer 0.70)'
      - Automated DoG + zero-compactness watershed segmentation of 10 interlocking puzzle cells from the SHA-256-locked
        Arabidopsis leaf epidermis micrograph (mean S = 0.720, min S = 0.626; mean L = 1.316 in this environment
        vs 1.506 recorded by v2)
      transfer_boundary:
      - The periclinal 'shell' is a uniform-tension membrane with an analytic clamped-edge bending boundary layer
        on the 2D footprint, not a bending-coupled 3D finite-element shell; E = 300 MPa, nu = 0.3, H = 15 um and
        T0 = PH/2 are order-of-magnitude assumptions (flagged in the vendored JSON), so the absolute stresses (34
        vs 59 MPa) and the 1.73x ratio are model-conditional
      - The depth law (sinh/cosh modal attenuation) is a prediction of a prestressed-strip model verified against
        its own analytic solution; the inner-face anchoring beta = 2 is a modelling choice and no depth-resolved
        specimen measurement is vendored
      - The WT footprint is a deterministic geometric construction whose constants (lobe half-width 0.62 r_t, tip
        1.25x, pitch 3.0 r_t, band fraction polynomial) were tuned to the vendored benchmark series, not grown by
        the spring-remodelling simulator of Sapala et al. (2018); the ROP2-ROP6 PDE does not feed the polygon
      does_not_claim:
      - Full 3D finite-element shell modelling of dome deflection coupled to anticlinal wall growth anisotropy,
        discrete microtubule stochastics, or any digitised amplitude-vs-depth measurement from confocal stacks
