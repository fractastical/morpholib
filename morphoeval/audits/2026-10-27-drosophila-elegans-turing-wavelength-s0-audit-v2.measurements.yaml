      - Turing 1952 dispersion relation and Schnakenberg 1979 kinetics.
      reconstructed_in_script:
      - NONLINEAR_K_CORRECTION = 1.08014 is the Pass 1 ratio of linear to nonlinear wavelength, used to re-solve
        Du.
