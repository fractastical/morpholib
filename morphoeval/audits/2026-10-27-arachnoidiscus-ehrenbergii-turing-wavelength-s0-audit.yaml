simulations:
  - id: delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0
    name: "Arachnoidiscus ehrenbergii Schnakenberg Turing wavelength at 242 nm (Holocene, 0 Ma)"
    organism: "Arachnoidiscus ehrenbergii"
    script: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py
    output: docs/media/arachnoidiscus_ehrenbergii_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: null
    source_refs:
      - turing1952
      - schnakenberg1979
      - sumper2002
      - kroger1999
      - lenoci2008
      - gordon1994
      - yendo1910
    claim_boundary:
      reported_in_source:
        - "Turing 1952: a diffusion-driven instability selects a finite wavenumber when the inhibitor diffuses sufficiently faster than the activator."
        - "Schnakenberg 1979: the two-species mass-action system du/dt = a - u + u^2 v, dv/dt = b - u^2 v has a stable homogeneous fixed point that can be Turing-unstable."
        - "Sumper 2002 and Lenoci & Camp 2008: diatom biosilica nanopatterns are consistent with polyamine phase separation inside the silica deposition vesicle."
        - "Yendo & Akatsuka 1910: Arachnoidiscus ehrenbergii was observed alive forming auxospores, so the species is extant (Holocene, 0 Ma)."
      reconstructed_in_script:
        - "Slot-3118 coefficients a=0.062, b=1.35, D_v/D_u=31.18 chosen so the analytic fastest mode equals the assigned 242 nm detail scale on a 6-wavelength Neumann patch. A 3-arm logarithmic spiral biases the initial condition. The GIF is the unguided activator passed through the gallery photograph's colour quantiles."
      transfer_boundary:
        - "242 nm is the campaign detail-scale assignment (tier 2_macromolecular_100nm), not a pore spacing measured on A. ehrenbergii in the cited papers."
        - "The gallery JPEG is a stylized 100 μm frame, about 413 times coarser than 242 nm. The Wikimedia file is Arachnoidiscus sp., not a confirmed ehrenbergii type."
      does_not_claim:
        - "That the three saturated spots are a measured cribral lattice, that 284.76 nm equals 242 nm, or that the gallery spiral was predicted ab initio."
    summary: >-
      Pass 1 weighted score 79.4/100. The script implements Schnakenberg kinetics and the Turing
      fastest-mode wavenumber, with sigma(k_c)=0.2415 and an equal-diffusion analytic control at
      -0.9649. The rendered GIF is 12 frames at 640x480 and scores cv_sim_similarity 82.2 against
      the gallery photograph. The nonlinear FFT peak is 284.76 nm, not 242 nm. There is no
      diffusivity sweep, no simulated ablation trajectory, and no specimen radial-spectrum
      goodness-of-fit. Those are the Pass 2 remediations.
    scores:
      model-fidelity:
        value: 88
        rationale: >-
          steady_state, jacobian, diffusivities and dispersion_sigma implement Schnakenberg 1979
          and the Turing fastest-mode formula k_c^2 = (D_v f_u + D_u g_v)/(2 D_u D_v), with
          D_u solved so lambda_c = 242 nm at D_v/D_u = 31.18, which is above the discriminant
          onset 13.605. Neumann edges and the mass-action terms match the cited kinetics.
          Deducted because the nonlinear field's dominant FFT wavelength is 284.76 nm, so the
          saturated pattern is not yet shown to sit on the linear carrier.
        evidence:
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [62, 115], note: "Steady state, Jacobian, diffusivity solve for lambda_c, and dispersion_sigma", supports: true}
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [117, 151], note: "turing_report: trace, det, discriminant, sigma(k_c)=0.2415, equal-diffusion sigma=-0.9649", supports: true}
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [178, 234], note: "Explicit Euler on the Neumann patch; 3-arm spiral initial bias", supports: true}
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [243, 260], note: "FFT peak returned 284.76 nm against the analytic 242 nm carrier", supports: false}
      specimen-match:
        value: 76
        rationale: >-
          The GIF is a 12-frame, 640x480 animation. cv_sim_similarity against the gallery
          photograph is 82.2 (orientation, 24-bin radial FFT, structure-tensor coherency,
          occupancy), using the same crop as verify_image_fitness.py. The colour table is
          taken from that photograph. Deducted because the saturated field is three ocelli
          rather than the gallery spiral, the photograph is a 100 μm stylized frame rather
          than a 242 nm micrograph, and no segmentation of either image is reported yet.
        evidence:
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [262, 300], note: "Gallery quantile LUT and 12-frame GIF at 640x480", supports: true}
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [351, 442], note: "cv_similarity reproduces the 12-bin Sobel, radial FFT and coherency score; Pass 1 result 82.2", supports: true}
          - {file: docs/media/arachnoidiscus_ehrenbergii_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Side-by-side gallery frame and unguided three-spot activator", supports: true}
      parameter-expressivity:
        value: 64
        rationale: >-
          The comparison figure plots sigma(k) at the nominal ratio 31.18 against the
          equal-diffusion curve, and k_c is marked. The ratio was raised from a trial value
          12.42 (discriminant negative, pattern decayed) to 31.18 (pattern grows), which is
          one real expressivity check. Deducted because there is no sweep of D_v/D_u, a, or
          domain size, and the spiral arm count is fixed.
        evidence:
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [302, 349], note: "Dispersion panel: patterned ratio versus equal diffusion, vertical line at k_c", supports: true}
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [79, 96], note: "diffusivities() accepts a ratio but main() never sweeps it", supports: false}
      morphometric-validation:
        value: 70
        rationale: >-
          measure_morphoeval reports the analytic 242 nm carrier, the FFT peak 284.76 nm
          (reference 242, not equal), sigma(k_c)=0.2415 against a marginal reference of 0,
          the equal-diffusion growth rate -0.9649, a dispersion Pearson correlation against
          an independent eigenvalue evaluation, and the activator contrast gain.
          Deducted because the FFT error is 18 percent, the Pearson number is a parity check
          rather than a specimen fit, and there is no RMSE or KS comparison to the photograph.
        evidence:
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [465, 534], note: "Six Pass 1 measurements; FFT wavelength differs from 242 nm", supports: true}
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [444, 463], note: "dispersion_curve_correlation is analytic-versus-eigenvalue parity, not a specimen goodness-of-fit", supports: false}
      source-traceability:
        value: 86
        rationale: >-
          Crossref resolved Turing 1952, Schnakenberg 1979, Sumper 2002, Kröger 1999,
          Lenoci & Camp 2008, Gordon & Drum 1994, and Yendo & Akatsuka 1910 after OpenAlex
          returned HTTP 429. The gallery JPEG is SHA-256 pinned (499034f8…) and the CC BY 2.0
          Wikimedia valve is pinned separately and labelled Arachnoidiscus sp. The reference
          JSON states that 242 nm is an assigned scale. Deducted because the Wikimedia image
          is not species-confirmed and OpenAlex itself did not return records.
        evidence:
          - {file: datasets/arachnoidiscus_ehrenbergii_turing_wavelength_s0/arachnoidiscus_ehrenbergii_turing_wavelength_s0_reference.json, lines: [1, 77], note: "Scale 242 nm, age 0 Ma, claim boundary, specimen SHA-256, DOI list", supports: true}
          - {file: datasets/arachnoidiscus_ehrenbergii_turing_wavelength_s0/paper_citations.bib, lines: [1, 75], note: "BibTeX for the seven Crossref-resolved sources", supports: true}
          - {file: datasets/arachnoidiscus_ehrenbergii_turing_wavelength_s0/scout_manifest.json, lines: [1, 84], note: "OpenAlex 429 recorded; literature_resolution added from Crossref and Wikimedia", supports: true}
      code-traceability:
        value: 84
        rationale: >-
          The module docstring and turing_report name the wavenumber formula and the two
          source DOIs. The Lean file witnesses the 242 nm window, the ratio 31.18 above
          onset 13.605, the 1452 nm domain, the equal-diffusion sign, and the zero Holocene
          age offset, with no sorry. Deducted because the Lean proofs are concrete integer
          comparisons rather than a real-valued dispersion derivation.
        evidence:
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [1, 28], note: "Docstring maps the slot, the wavenumber law, and the source DOIs", supports: true}
          - {file: morphoeval/lean/loops/Loop_3118_arachnoidiscus_ehrenbergii_turing_wavelength_s0.lean, lines: [17, 46], note: "Five theorems, zero sorry: wavelength window, ratio versus onset, six-wavelength domain, equal-diffusion sign, Holocene offset", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.yaml, lines: [1, 37], note: "Math KG records the three laws and the Lean declarations", supports: true}
      repro-package:
        value: 88
        rationale: >-
          --self-test checks the Turing inequalities, the 242 nm assignment, the 0 Ma age,
          the specimen SHA-256, GIF length and resolution, and bitwise repeatability of the
          seeded field. matplotlib uses the Agg backend. Deducted because the test does not
          yet assert a specimen Pearson threshold, a sweep monotonicity, or a simulated
          ablation, and dependencies are imported rather than pinned in a lockfile local to
          the slot.
        evidence:
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [540, 593], note: "self_test: analytic gates, SHA-256, animation gates, determinism; Pass 1 run passed", supports: true}
          - {file: models/2026-delphi10000-arachnoidiscus-ehrenbergii-turing-wavelength-s0.py, lines: [30, 52], note: "Constants: seed 3118, grid 96, 12 frames, 640x480, specimen digest", supports: true}
    remediation:
      - "Sweep D_v/D_u across the discriminant onset and show that sigma(k_c) and the nonlinear wavelength respond monotonically; put the sweep on the comparison figure."
      - "Run a simulated equal-diffusion ablation from the same initial condition and report the contrast ratio against the patterned trajectory."
      - "Segment the gallery photograph and the Wikimedia valve (Otsu foreground, coherency, radial spectrum) and report Pearson r, RMSE and KS against the rendered field, with value not equal to the reference."
      - "Separate the linear 242 nm carrier from the nonlinear spot spacing (Pass 1 FFT peak was 284.76 nm) and raise specimen-spectrum Pearson above 0.98 without claiming the gallery resolves 242 nm."
      - "Re-score as audit-v2 after those measurements exist. Do not treat the analytic-versus-eigenvalue correlation as a specimen fit."
