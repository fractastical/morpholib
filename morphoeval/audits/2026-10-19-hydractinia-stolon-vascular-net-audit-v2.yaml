simulations:
  - id: badin-hydractinia-stolon-vascular-net
    name: "Buss, Anderson & Perry (2015) Biol. Bull., Dudgeon et al. (1999) Am. Nat. & Blackstone (1999) Syst. Biol. colonial hydroid pulsatile gastrovascular stolon network, anastomosis loop closure, and runner-to-sheet morphospace"
    organism: "Hydractinia symbiolongicarpus / Podocoryna carnea (Colonial marine hydroids)"
    script: 2020-badin-hydractinia-stolon-vascular-net.py
    output: docs/media/hydractinia_stolon_vascular_net_comparison.png
    extra_outputs:
      - docs/media/hydractinia_stolon_vascular_net_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Buss, Anderson & Perry (2015) Biol. Bull. 228:146-158 & Dudgeon et al. (1999) Am. Nat. 153:292-309 pulsatile polyp contraction oscillators V_p(t) = V_0 + Delta_V sin(omega_p t + phi_p) driving Hagen-Poiseuille gastrovascular lumen flow Q_ij = (pi r_ij^4 / (8 mu L_ij))(p_i - p_j) and endodermal wall shear stress tau_w = 4 mu |Q_ij| / (pi r_ij^3)"
        - "Blackstone (1999) Syst. Biol. 48:75-85 & Buss (2001) Evol. Dev. 3:311-322 heterochronic runner-to-sheet colonial hydroid morphospace continuum: low polyp pumping produces sparse Podocoryna runner trees (low planar meshedness alpha), 2,4-DNP redox uncoupling shifts runner colonies toward reticulate webs, and high Hydractinia pumping produces confluent anastomosed stolonal mats/sheets (alpha ~ 0.78)"
        - "Polyp excision or MgCl2 muscular contraction arrest (Delta_V_p = 0) eliminates gastrovascular flow and wall shear stress below tau_reg, triggering stolon lumen collapse and regression into empty chitinous perisarc tubes"
      reconstructed_in_script:
        - "Full weighted graph Laplacian Kirchhoff gastrovascular solver (`solve_gastrovascular_kirchhoff`) across V = 26 stolon/polyp nodes and E = 62 stolon segments verifying nodal volume conservation (error 1.42e-12 < 1e-11), flux antisymmetry (< 1e-14), and cubic-radius wall shear identity (< 1e-12)"
        - "8-point polyp pumping gain sweep across eta in [0.35, 1.65] reproducing the runner-to-sheet planar meshedness continuum alpha (Pearson r = 0.99886, RMSE = 0.0130, p = 3.74e-9) and coenosarc mat area coverage (Pearson r = 0.99768, RMSE = 0.0213, p = 3.12e-8)"
        - "5 canonical morphospace regimes: Podocoryna runner (eta = 0.55, alpha = 0.1064, b_1 = 5), 2,4-DNP redox-uncoupled shift (eta = 0.90, alpha = 0.3404, b_1 = 16, delta = +0.2340), Hydractinia intermediate web (eta = 1.25, alpha = 0.5745, b_1 = 27), Hydractinia mature stolonal sheet (eta = 1.65, alpha = 0.7872, b_1 = 37), and polyp-excision / MgCl2 contraction arrest regression control (eta = 0.0, surviving stolon fraction = 0.0, b_1 = 0)"
        - "Computer-vision segmentation of Yale Peabody Museum `hydractinia_symbiolongicarpus_specimen.jpg` (`YPM IZ 080458`, CC0) extracting coenosarc mat coverage 0.8918, V = 332 gastrovascular polyp cavities, E = 845 stolon links, b_1 = 514 closed anastomosed loops, planar meshedness alpha = 0.7800, and inter-polyp NND CV = 0.3022 (18.64 +- 5.63 px)"
      transfer_boundary:
        - "2D planar pulsatile Kirchhoff pipe network with shear-stress-gated lumen adaptation and Delaunay-coenosarc vascular graph extraction mapped to colonial hydroid stolonal mats"
      does_not_claim:
        - "Subcellular chitin synthase secretion kinetics or allorecognition histocompatibility (alr1/alr2) fusion/rejection signaling between genetically distinct colonies"
    source_refs:
      - buss2015
      - dudgeon1999
      - blackstone1999
      - marfenin1997
      - buss2001
    summary: >-
      Pass 2 (v2) evaluation of `2020-badin-hydractinia-stolon-vascular-net.py` (overall
      weighted score: 93.8/100, up from 53.0/100 in v1). The remediated script solves
      the coupled pulsatile polyp oscillator + Hagen-Poiseuille Kirchhoff gastrovascular
      network across V = 26 stolon/polyp nodes and E = 62 stolon segments (conservation
      error 1.42e-12); reproduces the Blackstone (1999) and Buss, Anderson & Perry (2015)
      runner-to-sheet continuum across polyp pumping gain eta in [0.35, 1.65] for planar
      meshedness alpha (Pearson r = 0.99886, RMSE = 0.0130, p = 3.74e-9) and coenosarc
      mat coverage (Pearson r = 0.99768, RMSE = 0.0213, p = 3.12e-8); captures the
      Podocoryna runner morph (alpha = 0.1064, b_1 = 5), 2,4-DNP redox uncoupling shift
      (alpha = 0.3404, b_1 = 16), Hydractinia dense sheet morph (alpha = 0.7872, b_1 = 37),
      and MgCl2 polyp-arrest regression control (alpha = 0.0000, b_1 = 0); and segments
      the SHA-256-locked Yale Peabody Museum Hydractinia symbiolongicarpus specimen
      (`YPM IZ 080458`, V = 332 polyps, b_1 = 514 loops, alpha = 0.7800, tissue coverage = 0.8918).
