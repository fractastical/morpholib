          - {file: 2007-farhadifar-drosophila-wing-vertex-model.py, lines: [378, 379], note: "Pupal regime adds 0.042 * displacement toward the perfect hexagonal lattice (seeds_hex) — hexagonal order is partly imposed", supports: false}
          - {file: morphoeval/lean/loops/Loop_043_drosophila_wing_vertex_model.lean, lines: [126, 215], note: "Theorems 5-6: PCP bond tensor traceless + perpendicular cancellation + tension ordering; shear-decomposition closure and area-preserving pure shear (lean exit 0, 0 sorrys)", supports: true}
      specimen-match:
        value: 78
        rationale: >-
          Judged on the regenerated PNG: the four Section 2 regimes are visually distinct, the segmentation overlay
          (A5) follows the junction network of the micrograph, and the new C1/C2 panels show PD-elongated cells with
          bonds coloured by PCP-modulated tension against an isotropic control, which resembles the elongated pupal
