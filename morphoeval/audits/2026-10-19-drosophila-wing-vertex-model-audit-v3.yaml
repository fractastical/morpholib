# MorphoEval audit — Farhadifar, Röper, Aigouy, Eaton & Jülicher (2007) Drosophila Wing Epithelial Vertex Model, 2026-10-19 (v3)
#
# Pass 3 re-score of `2007-farhadifar-drosophila-wing-vertex-model.py` (v3, 2057 lines) after the remediation of the
# single open v2 item in the instrumented loop `morphoeval/runs/2026-10-19-drosophila-wing-vertex-model-loop-pass3`,
# superseding `2026-10-19-drosophila-wing-vertex-model-audit-v2` (90.9).
#
# What Pass 3 changed (v2 remediation item 1, closed):
#   1. Section 2b (L480-1061): a genuine tri-cellular vertex model (vertices are the degrees of freedom, cells are
#      CCW vertex rings, analytic forces F_i = -dE/dr_i of Farhadifar Eq. 1 verified against central differences in
#      the self-test, T1 exchanges below l_T1 with 3-valence/side-sum conservation) coupled to a per-bond planar cell
#      polarity Frizzled/Strabismus asymmetry tensor Q_ab = 2 c_ab (n (x) n - I/2), bond tension
#      Lambda_ab = Lambda_bar (1 + eps_pcp n.Q_ab.n), Fz-Stbm feedback + flow-alignment polarity dynamics, and the
#      pupal hinge-contraction pure-shear boundary strain diag(lambda, 1/lambda) with an Etournay (2015)-style
#      shear decomposition (imposed shear = cell-elongation change + rearrangement residual).
#   2. eps_pcp ablation sweep (-0.6 .. 0.8; 0 = fz/stbm mutant) and `--pcp-epsilon` / `--hinge-strain` CLI flags.
#   3. Five new figure panels (C1-C5) and a fourth GIF panel; 6 new measurements (14 total); 6 new self-test checks
#      (14 total); 2 new Lean 4 theorems (6 total, 0 sorrys); 3 new references and a `pcp_hinge_contraction_reference`
#      block in the vendored dataset.
#
# Why the overall score goes DOWN (90.9 -> 84.8) although the remediation item is closed: re-reading the whole script
# against the current rubric exposed defects the v2 assessor credited without checking:
#   - the Section 2 "regimes" (panels A1-A4, measurements 1-7) are a Voronoi-seed Lloyd relaxation, not a vertex
#     model, and their Lewis's-law agreement (r = 0.9994) is manufactured by an explicit post-hoc area reweighting
#     `adjusted_areas = areas * (1 + 0.14 * (n - 6))` (L401-405) while the pupal regime is pulled toward the perfect
#     hexagonal lattice by a `0.042 * hex_disp` term (L378-379);
#   - the vendored "specimen" is a Wikimedia micrograph whose scout manifest records organism "Mus musculus"
#     (datasets/.../scout_manifest.json:8); it is not a Drosophila wing, so the P(n) match (r = 0.9913) is a
#     cross-species transfer, not a specimen match;
#   - the Pass 3 reference values (Etournay 2015 |Q| peak 0.25, ~50% rearrangement share; Classen 2005 WT 0.78 vs
#     PCP-mutant 0.60) are approximate figure reads recorded offline and the three new DOIs could not be verified
#     online in this pass (network tools disabled by the loop protocol) — all flagged in the JSON/README/bib;
#   - the PCP model reproduces oriented T1s and elongation relaxation but gives the WRONG SIGN for the Classen (2005)
#     hexagon-fraction effect: P(6) falls from 0.867 (eps = 0) to 0.733 (eps = 0.5), delta -0.133 vs +0.18 expected.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the files in the working tree at commit 7e4f207 plus this slot's uncommitted Pass 3 edits.

