simulations:
  - id: farhadifar-drosophila-wing-vertex-model
    name: "Farhadifar et al. (2007) Drosophila wing disc apical vertex model, Lewis's law packing & PCP (Fz/Stbm) hinge-contraction vertex dynamics"
    organism: "Fruit fly (Drosophila melanogaster) 3rd-instar larval wing imaginal disc & pupal wing epithelium (vendored specimen micrograph is a Mus musculus epithelium — see transfer_boundary)"
    script: 2007-farhadifar-drosophila-wing-vertex-model.py
    output: docs/media/drosophila_wing_vertex_model_comparison.png
    extra_outputs:
      - docs/media/drosophila_wing_vertex_model_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-drosophila-wing-vertex-model-audit-v2
    source_refs:
      - farhadifar2007
      - gibson2006
      - classen2005
      - nagai2001
      - lewis1928
      - aigouy2010
      - etournay2015
      - sugimura2013
    claim_boundary:
      reported_in_source:
        - "Farhadifar, Röper, Aigouy, Eaton & Jülicher (2007) Current Biology Eqs. 1-2 & Fig. 2A: apical epithelial vertex energy functional E({r_i}) = sum (K/2)(A_alpha - A^(0))^2 + sum Lambda_{ij} l_{ij} + sum (Gamma/2) L_alpha^2 parameterized by (Lambda_bar, Gamma_bar), partitioning ground states into Case I (rigid hexagonal, canonical wing disc Lambda_bar=0.12, Gamma_bar=0.04), Case II (soft network), and Case III (cell collapse)."
        - "Farhadifar et al. (2007) Fig. 3-4, Gibson et al. (2006) Nature & Classen et al. (2005) Dev. Cell: proliferating 3rd-instar Drosophila wing disc exhibits P(6) approx 0.455 and obeys Lewis's Law <A_n>/<A> = (n-2)/4, whereas post-mitotic pupal wing annealing increases P(6) to ~0.78, and PCP (fz, stbm) mutants fail to reach wild-type hexagonal order."
        - "Aigouy et al. (2010) Cell & Etournay et al. (2015) eLife: hinge contraction from ~15 hAPF stretches the blade along the proximal-distal axis, cells elongate along PD and then relax through oriented cell rearrangements while the Fz/Stbm PCP axis reorients to PD; tissue shear decomposes into cell-elongation change plus rearrangement, division and correlation contributions."
      reconstructed_in_script:
        - "2D periodic Voronoi-seed (Lloyd-type) packing and mitotic cleavage simulation across 4 regimes (Proliferating Wing Disc, Post-Mitotic Pupal Wing, High-Contractility Case I, Soft Case II), 2D (Lambda_bar, Gamma_bar) phase diagram, UV laser junction ablation recoil curves, and 7-point continuous Lambda_bar sweep (Section 2, panels A1-A4, B1-B5)."
        - "Pass 3: explicit tri-cellular vertex model (analytic forces of Eq. 1, T1 exchanges) on a 100-cell patch with a per-bond Frizzled/Strabismus asymmetry tensor Q_ab modulating line tension Lambda_ab = Lambda_bar (1 + eps_pcp n.Q_ab.n), Fz-Stbm feedback + flow-alignment polarity dynamics, an area-preserving hinge-contraction boundary strain diag(lambda, 1/lambda) with ln lambda = 0.35, shear decomposition into cell-elongation and rearrangement parts, a PCP loss-of-function (eps_pcp = 0) control and a 6-point eps_pcp sweep (Section 2b, panels C1-C5, GIF panel 4)."
        - "Junction-guided Voronoi-watershed segmentation of the vendored apical junction-stained polygonal epithelial micrograph (N=37 interior cells, P(6)=0.4865, P(n) correlation r = 0.9913 against the Farhadifar wing-disc distribution)."
      transfer_boundary:
        - "2D apical junctional projection of 3D pseudostratified/columnar wing imaginal disc epithelial cells."
        - "The vendored specimen `drosophila_wing_epithelium_specimen.jpg` is a Wikimedia Commons epithelial monolayer whose scout manifest records organism Mus musculus; its polygon statistics are compared with Drosophila literature values as a cross-species epithelial-packing transfer, not as a Drosophila specimen."
        - "The Section 2 regimes are Voronoi-seed relaxations with a post-hoc Lewis's-law area reweighting and a hexagonal-lattice pull in the pupal regime; only Section 2b integrates the Farhadifar energy on vertex degrees of freedom."
        - "The PCP coupling sign (PCP-complex-bearing AP junctions stiffened for eps_pcp > 0), the polarity-dynamics gains (k_fb = 0.6, k_flow = 0.4), the initial polarity spread (0.6 rad) and the hinge log-strain (0.35) are modelling choices, not fitted to data; Pass 3 reference values from Etournay (2015) and Classen (2005) are approximate figure reads recorded offline."
      does_not_claim:
        - "Does not model basal extracellular matrix curvature, 3D apico-basal scutoid transitions, Fat/Dachsous polarity, the pre-15 hAPF margin-directed PCP pattern, cell divisions or extrusions during pupal morphogenesis, the hinge as a separate mechanical compartment, or periodic boundary conditions for the explicit vertex model (the patch is clamped at its margin)."
        - "Does not claim to reproduce the Classen et al. (2005) PCP-mutant loss of hexagonal order: in this model the PCP coupling lowers the final hexagon fraction (sign mismatch disclosed in measurement `pcp_wt_minus_mutant_hexagonal_fraction_delta`)."
    summary: >-
      Pass 3 (v3) evaluation of `2007-farhadifar-drosophila-wing-vertex-model.py` (84.8/100, down from 90.9 in Pass 2).
      The single v2 remediation item is closed: Section 2b adds a genuine vertex model (tri-cellular vertices,
      analytic forces of Farhadifar Eq. 1 verified by finite differences, T1 exchanges) coupled to an explicit
      per-bond Frizzled/Strabismus asymmetry tensor with zero trace and perpendicular cancellation (Lean theorem 5),
      driven by a pupal hinge-contraction pure-shear strain with an Etournay-style shear decomposition (Lean theorem
      6). At eps_pcp = 0.5 the model gives a cell-elongation peak <|Q|> = 0.253 (Etournay 2015 ~0.25, approx.), 20 T1s
      all on AP-oriented junctions versus 11 in the eps_pcp = 0 control, a rearrangement share of tissue shear of 0.307
      (vs 0.165 control), bond-tension anisotropy Lambda_AP/Lambda_PD = 2.39 and a monotonic eps_pcp sweep. The
      re-score is lower because the audit now records what the v2 scores overlooked: the Section 2 regimes are Lloyd
      relaxations whose Lewis's-law fit is imposed by a post-hoc area reweighting, the only vendored specimen is a
      mouse epithelium, three new DOIs and all new reference values are unverified offline, and the PCP effect on
      hexagon fraction has the opposite sign to Classen et al. (2005).
    scores:
      model-fidelity:
        value: 85
        rationale: >-
          Credited: Farhadifar Eq. 1-2 single-cell energy and the Case I/II/III ground-state classifier
          (L120-202), the ablation recoil model (L205-234), and in Pass 3 a true vertex model — mesh built from the
          Voronoi tessellation with CCW rings and 3-valent interior vertices (L533-567), per-bond Fz/Stbm asymmetry
          tensor c_ab/a_ab = n.Q_ab.n (L617-647), analytic forces dA/dr, dL/dr, dl/dr with half-shared bond tension
          (L650-692) that pass a central-difference check to 1e-5 (self-test 10, L1912-1927), T1 exchange with
          4-cell re-wiring (L723-771), hinge-contraction pure shear and polarity dynamics (L846-935). Deductions:
          panels A1-A4 and measurements 1-7 still come from the Section 2 Voronoi-seed Lloyd relaxation, whose
          Lewis's-law agreement is produced by an explicit post-hoc reweighting `adjusted_areas = areas * (1 + 0.14 *
          gamma_slope_boost * (n - 6))` (L401-405) and whose pupal regime is pulled toward the perfect lattice by
          `0.042 * hex_disp` (L378-379) — neither is in Farhadifar et al. (2007) (-8); the explicit vertex model is a
          clamped non-periodic patch, so boundary cells are prescribed rather than mechanically coupled, and the
          PCP coupling sign, k_fb, k_flow and the |Q|/0.15 saturation (L931) are uncited modelling choices (-5);
          polarity is polar but the tension law is nematic, so Fz-distal vs Stbm-proximal identity does not enter
          the mechanics beyond the bridge density (-2).
        evidence:
