          - {file: 2007-farhadifar-drosophila-wing-vertex-model.py, lines: [723, 771], note: "_attempt_t1: interior-bond T1 with A/B losing and C/D gaining the bond, 3-valence preserved, CCW re-sort of the four affected rings", supports: true}
          - {file: 2007-farhadifar-drosophila-wing-vertex-model.py, lines: [774, 1023], note: "simulate_pcp_hinge_contraction: pre-relaxation, smoothstep hinge ramp diag(lambda,1/lambda) on boundary vertices, overdamped vertex update, T1 pass, Fz-Stbm feedback + flow alignment polarity ODE, shear decomposition", supports: true}
