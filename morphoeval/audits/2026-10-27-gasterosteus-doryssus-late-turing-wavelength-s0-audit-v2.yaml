simulations:
  - id: delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0
    name: "Gasterosteus doryssus_late Turing wavelength at 27 µm (9.99 Ma)"
    organism: "Gasterosteus doryssus_late"
    script: models/2026-delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0.py
    output: docs/media/gasterosteus_doryssus_late_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-gasterosteus-doryssus-late-turing-wavelength-s0-audit
    source_refs: [turing1952, hunt2008, kondo2010]
    summary: >-
      Pass 2 closes the pass-1 measurement gaps. Continuum lambda_m is 27.07 µm
      at 9.99 Ma. The periodic-grid Laplacian returns 26.77 µm (late), 21.10 µm
      (marine) and 33.38 µm (mid). Sweep Pearson r=0.999999, RMSE=0.309 µm.
      Equal diffusion has sigma_max=-0.390 and the seeded mode decays; r=25
      grows (amplitude ratio 2.17). Noise-seeded ring wavelength is 28.96 µm.
      Native-frame arm spacing is 27.10 µm. Orientation KS D=0.050 on the saved
      GIF (0.045 before GIF quantization). Official CV similarity of the
      12-frame 640x480 GIF is 82.3.
      Weighted overall 86.2.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and diffusion-driven instability"
        - "Kondo and Miura 2010 treat pigment patterns as reaction-diffusion wavelengths"
        - "Hunt, Bell and Travis 2008 document pelvic evolution in a fossil stickleback lineage"
      reconstructed_in_script:
        - "Schnakenberg parameters with r=25 so the continuum fastest mode is 27.07 µm"
        - "Du scaled with lambda_m squared across mid (33.62 µm), late (27.07 µm) and marine (21.48 µm)"
        - "Far-field spiral used as the late ocellus render, arm spacing measured on the native frame"
      transfer_boundary:
        - "27 µm is the tier-4 detail assignment, not a caliper reading on Truckee material"
        - "The gallery plate is an illustrated ocellus card with a 100 µm bar"
      does_not_claim:
        - "Does not claim fossil melanophores were measured at 27 µm"
        - "Does not claim the gallery JPEG is a photograph of a Miocene specimen"
        - "Does not reuse the 1.7 mm parameters of slot 1209"
        - "Does not claim a second assessor or a kernel-checked Lean build"
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          The Jacobian, continuum dispersion, discrete symbol and 1D ring match
          the stated Schnakenberg system, and the equal-diffusion control closes
          the Turing band. The animated frame remains a far-field spiral at the
          selected wavelength rather than a 2D PDE, which is why this is not 95.
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0.py, lines: [84, 125], note: "sigma(k), continuum k_m, discrete symbol at dx=2.2 µm", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0.py, lines: [200, 230], note: "equal-diffusion ablation versus r=25", supports: true}
          - {file: morphoeval/lean/loops/Loop_3231_gasterosteus_doryssus_late_turing_wavelength_s0.lean, lines: [16, 41], note: "six theorems, 0 sorry; lean binary absent so not kernel-checked", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0.py, lines: [298, 316], note: "render is the far-field spiral", supports: false}
      specimen-match:
        value: 84
        rationale: >-
          Official verifier CV similarity between the gallery plate and the last
          GIF frame is 82.3 (12 frames, 640x480). Orientation KS D=0.050 on the
          saved GIF. The
          plate and the render are the same ocellus class. The plate is still an
          illustration, so the score stays below the mid-90s.
        evidence:
          - {file: docs/media/gasterosteus_doryssus_late_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 640x480 ocellus GIF", supports: true}
          - {file: docs/media/gasterosteus_doryssus_late_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "plate beside render, sweep and chronospecies bars", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0.py, lines: [417, 449], note: "KS and coherency on plate versus final frame", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          Discrete wavelength increases monotonically with Du across marine
          (21.10 µm), late (26.77 µm) and mid (33.38 µm). AP-stripe power
          increases with eps: 0.504, 0.622, 0.668. Both controls are on the
          comparison figure.
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0.py, lines: [335, 403], note: "figure panels for the Du sweep and the three chronospecies", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0.py, lines: [562, 573], note: "self-test requires monotonic wavelengths and stripe fractions", supports: true}
      morphometric-validation:
        value: 88
        rationale: >-
          Pearson r=0.999999 and RMSE=0.309 µm on five Du scales. Late discrete
          wavelength 26.77 µm versus continuum 27.07 µm. Noise-seeded ring
          28.96 µm. Native-frame arm spacing 27.10 µm. KS D=0.050. None of these
          measured values is copied from its reference. What is not claimed is a
          fossil melanophore count.
        evidence:
          - {file: datasets/gasterosteus_doryssus_late_turing_wavelength_s0/metrics.json, lines: [1, 37], note: "r, RMSE, ablation, stripe fractions, KS, ray spacing", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0.py, lines: [451, 560], note: "measure_morphoeval records value and a different reference_value", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Three DOIs, SHA-256 pins checked at runtime, scout manifest records the
          Crossref hit for Hunt, Bell and Travis 2008 and explains why extant
          Wikimedia photographs were not used as the chronospecies plate.
        evidence:
          - {file: datasets/gasterosteus_doryssus_late_turing_wavelength_s0/paper_citations.bib, lines: [1, 32], note: "Turing, Hunt, Kondo", supports: true}
          - {file: datasets/gasterosteus_doryssus_late_turing_wavelength_s0/scout_manifest.json, lines: [1, 40], note: "slot 3231, no filename collision, specimen choice", supports: true}
      code-traceability:
        value: 84
        rationale: >-
          Docstring, reference JSON and Lean statements use the same fractions
          (tr J = -58/75, r=25, wavelengths 21480/27070/33620 nm). The GIF pitch
          is a display of that wavelength, not a separate law. Lean was not
          executed in this environment.
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0.py, lines: [1, 48], note: "equations and chronospecies table", supports: true}
          - {file: datasets/gasterosteus_doryssus_late_turing_wavelength_s0/gasterosteus_doryssus_late_turing_wavelength_s0_reference.json, lines: [28, 55], note: "same Jacobian and claim boundary", supports: true}
      repro-package:
        value: 86
        rationale: >-
          --self-test passes. Seed, hashes and GIF geometry (12 frames, 640x480)
          are checked. Re-running the script reproduces r, RMSE and the late
          discrete wavelength. System packages are not vendored per script, and
          there is no nanopub profile to sign with.
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-doryssus-late-turing-wavelength-s0.py, lines: [584, 620], note: "invocation, GIF gate, metrics write", supports: true}
