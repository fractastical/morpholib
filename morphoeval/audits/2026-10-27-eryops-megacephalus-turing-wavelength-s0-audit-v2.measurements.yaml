    claim_boundary:
      reported_in_source:
      - 'Turing 1952: reaction-diffusion instabilities select a finite critical wavenumber k_c.'
      - 'Schnakenberg 1979: the quadratic two-species system used as the kinetics.'
      - 'Pawley and Warren 2006: Eryops megacephalus Cope, 1877 is an Early Permian eryopoid; this slot uses 295
        Ma.'
      - 'Witzmann et al. 2010: basal tetrapod dermal bone carries sculptured ornament.'
      reconstructed_in_script:
      - Jacobian and k_c with D scaled so lambda_c = 12 px = 127 µm on a 1.016 mm periodic patch.
      - 'Euler growth rates versus the discrete Laplacian symbol on modes m=2..16: Pearson r = 0.99999998, RMSE
        = 1.137e-4, KS = 0.0667.'
      - Equal-diffusion control (max sigma = -0.4166, std 0.0399 to ~0) and autocatalysis ablation (std 0.0399 to
        9.7e-5).
      - Otsu bone mask (foreground fraction 0.3208, aspect 1.3358) and a 12-frame 720x540 GIF. Masked cv_sim_similarity
        = 96.0, up from unmasked 94.4. Interior field Pearson r = 0.9913.
      transfer_boundary:
      - The 127 µm wavelength is the model scale. The AMNH photograph is an identity and silhouette standard, not
        a micrograph of dermal pits.
      - 8184 = 64*127+56 is the comparison to the organ-scale pit, not a second measurement of this fossil.
      does_not_claim:
      - Histological pit counts at 127 µm on this mount.
      - A successor Eryops chronospecies. Series length is 1.
      - That the nonlinear FFT peak equaling 127.0 µm is independent of the linear design mode. It is not.
