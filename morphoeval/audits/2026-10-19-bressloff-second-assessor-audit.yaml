references:
  bressloff2001:
    title: "Geometric visual hallucinations, Euclidean symmetry and the functional architecture of striate cortex"
    authors: "Bressloff PC, Cowan JD, Golubitsky M, Thomas PJ, Wiener MC"
    venue: "Philosophical Transactions of the Royal Society of London B 356(1407):299-330 (2001)"
    doi: 10.1098/rstb.2000.0769
  bressloff2002:
    title: "What geometric visual hallucinations tell us about the visual cortex"
    authors: "Bressloff PC, Cowan JD, Golubitsky M, Thomas PJ, Wiener MC"
    venue: "Neural Computation 14(3):473-491 (2002)"
    doi: 10.1162/089976602317250861
  ermentrout1979:
    title: "A mathematical theory of visual hallucination patterns"
    authors: "Ermentrout GB, Cowan JD"
    venue: "Biological Cybernetics 34(3):137-150 (1979)"
    doi: 10.1007/BF00336965
  rule2011:
    title: "A model for the origin and properties of flicker-induced geometric phosphenes"
    authors: "Rule M, Stoffregen M, Ermentrout B"
    venue: "PLoS Computational Biology 7(9):e1002158 (2011)"
    doi: 10.1371/journal.pcbi.1002158
  mesmerprism_v1sim:
    title: "bressloff-v1-form-constants: reference implementation and calibration reports (commit 344863a)"
    authors: "Karácsony M, Holzapfel T (MesmerPrism)"
    venue: "GitHub repository, MIT License (2023-2026); derived from karacsm/V1-sim"
    url: https://github.com/MesmerPrism/bressloff-v1-form-constants

simulations:
  - id: bressloff-v1-form-constants
    name: "Bressloff et al. (2001/2002) V1 Euclidean Symmetry-Breaking & Klüver Form Constants"
    organism: "Homo sapiens primary visual cortex (V1) — geometric visual hallucinations (Klüver form constants) and flicker phosphenes"
    script: 2001-bressloff-v1-form-constants.py
    output: bressloff_v1_form_constants_morphospace.png
    also:
      - docs/media/bressloff_v1_form_constants.gif
      - bressloff_v1_metrics.csv
    domain: morphogenesis
    status: evaluated
    source_refs: [bressloff2001, bressloff2002, ermentrout1979, rule2011, mesmerprism_v1sim]
    summary: >-
      Blinded second-assessor pass. 2001-bressloff-v1-form-constants.py faithfully implements the Bressloff et al. (2001/2002) retino-cortical log-polar mapping, intra-hypercolumn Fourier harmonics, anisotropic lateral Fourier-Bessel coupling, second-order perturbative dispersion relations, and cubic amplitude-equation integrals, matching the upstream Rust reference report on five stability targets to 2.22e-16. However, several headline claims exceed what the Python code actually computes: Rule et al. (2011) flicker-phosphene Floquet tongues are not simulated at all but loaded from a pre-computed JSON fixture whose own metadata flags it as failing calibration acceptance thresholds. Furthermore, odd-parity hexagonal versus triangular planform selection omits the fifth-order amplitude terms required when the quadratic coefficient vanishes, cortical planforms are synthesized via a scalar max-over-orientation tanh surrogate rather than Bressloff's double-map oriented contours, and all quantitative validation compares against another software implementation rather than empirical psychophysical or anatomical measurements.
    scores:
      model-fidelity:
        value: 75
        rationale: >-
          The script accurately implements the log-polar retino-cortical pullback parameters (epsilon=0.051, w0=0.087, alpha=3/pi, beta=1.589/2) from Bressloff et al. (2001 Section 2; 2002 Eq. 2.1), the local orientation Fourier coefficients W_n (Eq. 3.12), the lateral Fourier-Bessel harmonics W_n^lat(q) (Eq. 4.9), the second-order perturbative eigenvalue branches lambda_even/odd(q) (Section 4), and the quadratic and cubic amplitude-equation integrals gamma_2 and gamma_3(theta) (Eqs. 5.14-5.15). We deduct 10 points because despite claiming in the module docstring to implement Rule, Stoffregen & Ermentrout (2011) flicker-phosphene Floquet resonance tongues, the script contains no E-I neural-field dynamics or Floquet monodromy solver and instead loads pre-computed curve coordinates directly from datasets/bressloff/rule-2011-floquet.json. We deduct 6 points because odd-parity hexagonal branch selection (fig40_odd_hex_bifurcation) sets eta_hex = 0.0 and unconditionally defaults to honeycomb without implementing the fifth-order amplitude terms required by Bressloff et al. (2001 Section 5.2, Fig. 40) to select odd triangles, reproducing an unfixed upstream check failure. We deduct 6 points because cortical and retinal planforms are rendered via static cosine superpositions with ad-hoc phase-drift weights (0.35, -0.25, 0.5), clamped eigenfunction coefficients in [-1.5, 1.5], and a scalar max-over-orientation tanh envelope rather than solving the neural-field PDE or rendering Bressloff's double-map orientation contours (and make_gif disables orientation coupling entirely via noncontoured mode). Finally, we deduct 3 points because for non-auto gallery presets such as fig31_square_even, render_cortical_and_retinal_planform ignores branch_selection_for (where 2*gamma_square > gamma0 makes squares unstable and selects roll/spiral) and force-renders the unstable square lattice while labeling its panel mode=spiral.
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [309, 389], note: "Exact implementation of local Fourier harmonics W_n, lateral Fourier-Bessel coupling W_n^lat(q), and second-order perturbative dispersion lambda_even/odd(q)"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [515, 553], note: "Cubic amplitude branch selection omits fifth-order terms for odd hex vs. triangle (eta_hex=0 defaults to honeycomb) and shows square lattice instability (2*gamma_square > gamma0)"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [721, 743], note: "Contoured planform rendering uses a discrete max-over-orientation scalar tanh envelope rather than Bressloff double-map oriented contour segments"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [952, 954], note: "Rule et al. (2011) Floquet resonance tongues are loaded directly from a static JSON file rather than computed by a model solver"}
      specimen-match:
        value: 73
        rationale: >-
          Across the top two rows of bressloff_v1_form_constants_morphospace.png and the four animated stages of docs/media/bressloff_v1_form_constants.gif, the four Klüver form-constant families (concentric tunnel rings, logarithmic spiral/funnel, radial-concentric cobweb, and fovea-scaled hexagonal honeycomb) are visually distinct and geometrically faithful to the log-polar pullback topology. Bottom Panels A and B also closely match the qualitative shapes of the marginal-stability dispersion curves (Bressloff 2001 Figs. 16-17) and oscillatory cubic coupling curves gamma_3(theta) (Figs. 37 and 39). We deduct 12 points because Bressloff et al. (2001 Figs. 31-36; 2002 Figs. 5-7) depict double-map contoured planforms as oriented line-element drawings that rotate with retinal azimuth, whereas this script collapses orientation into a continuous twilight_shifted scalar heatmap that visually resembles scalar non-contoured activity maps (Figs. 29-30). We deduct 6 points because no empirical subject drawings, psychophysical phosphene sketches (e.g., Klüver 1966 / Bressloff Fig. 1), or digitized reference curves from the source papers are plotted side-by-side for visual comparison. We deduct 5 points because the plotted Rule et al. (2011) Fig. 8 Floquet tongue boundaries in Panel C remain fragmented and outside calibration acceptance against the published figure (domain-normalized RMS error 0.154, continuity score 0.469, and 3 of 4 branches covered in rule-2011-floquet.json). Finally, we deduct 4 points because the middle-row subplot titles in bressloff_v1_form_constants_morphospace.png mislabel both the Tunnel/Rings panel (col 1) and the Cobweb/Square panel (col 3) as mode=spiral.
        evidence:
          - {file: bressloff_v1_form_constants_morphospace.png, lines: [0, 0], note: "12-panel figure showing 4 V1 cortical planforms, 4 retinal log-polar pullbacks (cols 1-3 all subtitled mode=spiral), and 3 bottom diagnostic plots"}
          - {file: docs/media/bressloff_v1_form_constants.gif, lines: [0, 0], note: "36-frame animation stepping through non-contoured cortical lattices and log-polar retinal pullbacks for the four Klüver families"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [1045, 1050], note: "Retinal subplot title prints branch_selection['selected_pattern'] (spiral) instead of the actually rendered preset pattern (rings or cobweb)"}
          - {file: datasets/bressloff/rule-2011-floquet.json, lines: [85, 115], note: "Upstream Floquet fixture metadata flags Panel C curves as outside-threshold-diagnostic with calibration_claim_allowed=false and continuity_score=0.46875"}
      parameter-expressivity:
        value: 80
        rationale: >-
          The script demonstrates meaningful parameter control in its analytical stability and amplitude panels: widening the lateral angular spread theta_0 from 0 deg (fig16_odd) to 60 deg (fig17_even) switches the dominant marginal-stability branch from odd to even, and setting lateral_inhibition to 0.0 in evaluate_gaussian_negative_control collapses the interior band-pass wavenumber peak (q* = 1.028, prominence 0.120) to the lower boundary (q_min = 0.050, prominence 0.0). In addition, Panel B continuously sweeps wavevector intersection angle theta across [0, 180] deg to track gamma_3(theta) across the (1/2)*gamma_3(0) roll/lattice stability threshold. However, we deduct 10 points because the four gallery morphologies are selected via discrete hard-coded mode tables (pattern = rings, spiral, cobweb, honeycomb in planform_modes) rather than emerging continuously from sweeping biophysical control parameters with pattern = auto. We deduct 6 points because stability_scan overrides the critical wavenumber q* with a fixed wave_count whenever pattern != auto, decoupling the rendered spatial wavelength in the gallery from the underlying lateral-inhibition kernel parameters. Finally, we deduct 4 points because make_gif claims in its inline comment to perform a continuous angle sweep, but actually holds pattern_angle_deg fixed per preset and only translates the spatial phase over one cycle.
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [635, 645], note: "When pattern != 'auto', wave_number is computed from fixed params.wave_count rather than the critical wavenumber critical_q from the dispersion relation"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [660, 691], note: "Discrete pattern string switch in planform_modes hard-codes wavevector angles and amplitudes for each form-constant family"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [880, 898], note: "Gaussian-only negative control (lateral_inhibition=0.0) cleanly demonstrates loss of the interior Turing wavenumber peak"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [1226, 1233], note: "make_gif comment claims a continuous angle sweep, but the loop only increments spatial phase while keeping pattern_angle_deg fixed"}
      morphometric-validation:
        value: 62
        rationale: >-
          The script computes 2D FFT spectral metrics (k_star_cycles, wavelength_grid_cells, ring_sharpness, and azimuthal harmonics m=2, 4, 6) in spectral_ring_metrics, evaluates cubic coupling coefficients across five calibration presets in verify_paper_calibration_parity, and quantifies peak prominence for the Gaussian negative control. However, we deduct 20 points because the headline machine-precision validation (max_abs_err_vs_rust = 2.22e-16) compares the script exclusively against another software implementation (MesmerPrism/bressloff-v1-form-constants in Rust) evaluating the identical algebraic formulas, and paper-calibration.json explicitly notes that its targets are analytic normalization checks rather than digitized paper figures. We deduct 12 points because no empirical biological or psychophysical measurements (such as human flicker-phosphene frequency/wavenumber data from Rule et al. 2011 or V1 hypercolumn psychophysical spacing) are compared in the script or CSV, and the error column max_abs_err_vs_rust is hardcoded to 0.000e+00 for all kluver_form_constant and negative_control rows. Finally, we deduct 6 points because spectral_ring_metrics is evaluated only on the Cartesian cortical sheet (recovering the prescribed input wave_count) rather than the retinal pullback, and the exported CSV summary metric max(azimuthal_m4_square, azimuthal_m6_hex) yields ~0.98 for 1D roll gratings (since a 1D cosine grating has all even azimuthal Fourier harmonics near 1), failing to distinguish square or hexagonal lattices from simple stripes.
        evidence:
          - {file: bressloff_v1_metrics.csv, lines: [0, 0], note: "Exported metrics table showing Rust regression residuals (2.22e-16), hardcoded 0.000e+00 errors for gallery rows, and m4/m6 values of 0.9862/0.9815 on 1D rolls"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [793, 812], note: "spectral_ring_metrics computes unsubtracted even azimuthal harmonics c2, c4, c6 on the cortical grid, where 1D rolls saturate all even harmonics"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [818, 877], note: "verify_paper_calibration_parity compares against upstream Rust JSON outputs including fig40 where upstream recorded actual='honeycomb' vs expected='triangle'"}
          - {file: datasets/bressloff/paper-calibration.json, lines: [37, 43], note: "Upstream fixture explicitly states the report is an analytic-normalized software calibration check, not a digitized paper figure"}
      source-traceability:
        value: 92
        rationale: >-
          Primary literature sources—Bressloff et al. (2001, 2002), Ermentrout & Cowan (1979), and Rule et al. (2011)—are documented with resolvable DOIs and PubMed IDs in both the script header and datasets/bressloff/README.md. The upstream reference repository MesmerPrism/bressloff-v1-form-constants is pinned to exact commit 344863a1bd9e8a8e8c9cb20aced2897f3ffb2c4c with clear MIT license and author lineage attribution (Márton Karácsony and Till Holzapfel), and all three JSON fixtures are verified via SHA-256 checksums at runtime. We deduct 5 points for bibliographic errors and irrelevant entries in datasets/bressloff/paper_citations.bib: ermentrout1979mathematical lists year={2001} instead of 1979, rule2011model lists pmid={21980269} instead of 21980279, and unused entries for Turing (1952) and Pearson (1993) are bundled without connection to the V1 script. We deduct 3 points because driven-neural-fields-registry.json is checksum-pinned in FIXTURE_CHECKSUMS but never used by the script, while rule-2011-floquet.json references an unbundled external file (reports\source-curves\rule-2011-fig8-source-curves.json) for its source comparison.
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [11, 32], note: "Complete DOIs, PMIDs, and exact upstream git commit hash 344863a1bd9e8a8e8c9cb20aced2897f3ffb2c4c in module docstring"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [74, 107], note: "SHA-256 fixture checksum dictionary and runtime verification routine covering all three JSON files in datasets/bressloff/"}
          - {file: datasets/bressloff/paper_citations.bib, lines: [30, 83], note: "BibTeX file lists year={2001} for Ermentrout & Cowan (1979), wrong PMID 21980269 for Rule et al. (2011), and unused Turing/Pearson citations"}
          - {file: datasets/bressloff/rule-2011-floquet.json, lines: [33, 39], note: "References external unvendored source curve file reports\\source-curves\\rule-2011-fig8-source-curves.json"}
      code-traceability:
        value: 90
        rationale: >-
          Core mathematical functions in 2001-bressloff-v1-form-constants.py are clearly annotated with specific section, equation, and figure pointers to Bressloff et al. (2001/2002), including Eq. 2.1 for the retino-cortical log-polar map, Eq. 3.12 for local orientation harmonics, Eq. 4.9 for Fourier-Bessel lateral weights, Figs. 16-17 for perturbative dispersion curves, and Eqs. 5.14-5.15 / Figs. 37-40 for quadratic and cubic amplitude integrals. In addition, Section 14 of morphoeval/lean/MathOfBiology.lean formally documents and proves the algebraic laws underlying the log-polar wave pullback, cubic roll stability boundary, and Floquet multiplier periodicity. We deduct 6 points because several upstream implementation heuristics in the code—such as clamping perturbative eigenfunction coefficients to [-1.5, 1.5], the candidate scoring formula in _make_branch_candidate, the hard-coded phase-scale multipliers (0.35, -0.25, 0.5) in planform_modes, and the max-over-orientation tanh rendering surrogate—are presented alongside paper equations without noting that they are software heuristics rather than equations from Bressloff et al. We deduct 4 points because the CSV export schema overloads three incompatible quantity types into shared columns (gamma0_or_k_star, gamma_cross_or_sharpness, eta_hex_or_m4_m6) and writes gamma_hex into gamma_cross_or_sharpness even for rhombic calibration rows.
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [309, 459], note: "Equation-pinned docstrings for Eq. 3.12, Eq. 4.9, Section 4 Figs. 16-17, Eq. 5.14, and Eq. 5.15 alongside undocumented [-1.5, 1.5] eigenfunction clipping"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [660, 691], note: "Hard-coded phase_scale multipliers (0.35, -0.25, 0.5) in planform_modes lack paper equation or section provenance"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [959, 989], note: "CSV export overloads column headers across sections and writes gamma_hex into gamma_cross_or_sharpness for rhombic rows"}
          - {file: morphoeval/lean/MathOfBiology.lean, lines: [507, 589], note: "Lean 4 theorems formally linking retino-cortical phase geometry, cubic roll stability (gamma0 < 2*gamma_theta), and Floquet period doubling to source equations"}
      repro-package:
        value: 94
        rationale: >-
          The script is completely deterministic, requires no random number generation, and executes its built-in --self-test suite in ~1.5 seconds with all checks passing. Both lower-bound dependencies (requirements.txt) and exact locked package versions for the audit environment (requirements.lock.txt) are present, and headless Agg rendering is automatically enabled when --no-show, --self-test, or no DISPLAY is detected. Invocation flags (--out, --csv, --gif, --no-show, --self-test) are cleanly implemented via argparse and documented in the README. We deduct 4 points because the default output path for --gif in make_gif and main is REPO_ROOT / 'bressloff_v1_form_constants.gif', whereas the repository's tracked animation referenced by README.md and datasets/bressloff/README.md resides at docs/media/bressloff_v1_form_constants.gif. We deduct 2 points for importing scipy.special.iv as bessel_iv on line 69 and leaving it unused while re-implementing modified_bessel_i in pure Python.
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [61, 70], note: "Automatic headless Agg backend configuration and unused scipy.special.iv import"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [1277, 1348], note: "Deterministic self_test() and CLI entrypoint supporting --out, --csv, --gif, --no-show, and --self-test"}
          - {file: requirements.lock.txt, lines: [1, 51], note: "Exact locked package versions (numpy==2.5.4, scipy==1.16.3, matplotlib==3.10.7, pillow==12.0.0) for the Python 3.14 audit environment"}
    remediation:
      - "2001-bressloff-v1-form-constants.py:952-954,1123-1161 — Rule et al. (2011) flicker-phosphene Floquet resonance tongues are claimed as implemented in the docstring (lines 6-8), but the script only loads pre-computed JSON boundary points from datasets/bressloff/rule-2011-floquet.json (which itself has calibration_claim_allowed=false at lines 87-101)."
      - "2001-bressloff-v1-form-constants.py:526,543,852-856 — Odd-parity hexagonal branch selection (fig40_odd_hex_bifurcation) sets eta_hex = 0.0 and always picks 'honeycomb' instead of 'triangle', omitting the fifth-order amplitude terms from Bressloff et al. (2001 Section 5.2, Fig. 40); verify_paper_calibration_parity masks this by asserting equality against rep['selected_pattern'] ('honeycomb') instead of the failing check target ('triangle' at datasets/bressloff/paper-calibration.json:1716-1721)."
      - "2001-bressloff-v1-form-constants.py:701-706,999-1000,1048 — For non-auto gallery presets (such as fig7_lattice_tunnel and fig31_square_even), render_cortical_and_retinal_planform renders the hardcoded params.pattern ('rings' or 'cobweb') while the retinal subplot title and CSV export report branch_selection['selected_pattern'] ('spiral'), mislabeling cols 1 and 3 of the middle row as mode=spiral."
      - "2001-bressloff-v1-form-constants.py:793-812,1004 — spectral_ring_metrics computes raw even azimuthal Fourier harmonics (c2, c4, c6) on the cortical grid and exports max(c4, c6) to bressloff_v1_metrics.csv, which evaluates to 0.9862 and 0.9815 for 1D roll gratings (fig7_lattice_tunnel, fig33_rhombic_even_roll) because a 1D stripe grating has all even azimuthal harmonics near 1.0."
      - "2001-bressloff-v1-form-constants.py:729-742,1227-1230 — Contoured cortical/retinal planforms collapse the orientation dimension via a scalar max-over-orientation tanh envelope rather than rendering Bressloff et al.'s (2001 Figs. 31-36) double-map local orientation contours, and make_gif overrides contour_mode='noncontoured' plus fixed pattern_angle_deg despite a comment claiming a continuous angle sweep."
      - "datasets/bressloff/paper_citations.bib:36,54,58-83 — BibTeX metadata lists year={2001} for Ermentrout & Cowan (1979), wrong pmid={21980269} (should be 21980279) for Rule et al. (2011), and includes unused Turing (1952) and Pearson (1993) entries."
      - "2001-bressloff-v1-form-constants.py:69,1203,1329 — Unused import `from scipy.special import iv as bessel_iv`, and default `--gif` output path points to repo root (`bressloff_v1_form_constants.gif`) instead of the tracked path `docs/media/bressloff_v1_form_constants.gif`."
