  id: 2026-10-19-bressloff-second-assessor-audit
  rubric_version: 0.1.0
  date: "2026-10-19"
  role: second_assessor
  blinded: true
  assessor:
    id: gemini-4-argon
    label: "Gemini 4 Argon (Cursor agent, blinded second assessor)"
    homepage: https://deepmind.google
  publisher_orcid: null
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  code_creators:
    - id: joel-dietz
      name: "Joel Dietz"
      orcid: null
      github: https://github.com/fractastical
  domain: morphogenesis
  tracked_by: https://github.com/fractastical/morpholib/issues/1
