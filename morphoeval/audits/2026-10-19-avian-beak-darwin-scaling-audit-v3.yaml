simulations:
  - id: alberti-avian-beak-darwin-scaling
    name: "Campas et al. (2010) PNAS affine scaling-and-shear transformation + Abzhanov et al. (2004, 2006) Bmp4/Calmodulin beak morphogenesis + Soons et al. (2010-2015) reduced FEM fracture risk"
    organism: "Darwin's finches (Geospiza magnirostris, Geospiza fortis, Geospiza scandens, Camarhynchus parvulus, Certhidea olivacea)"
    script: 2021-alberti-avian-beak-darwin-scaling.py
    output: docs/media/avian_beak_darwin_scaling_comparison.png
    extra_outputs:
      - docs/media/avian_beak_darwin_scaling_growth.gif
      - docs/media/avian_beak_darwin_scaling_fem_fracture.png
      - docs/media/avian_beak_darwin_scaling_fem_load_sweep.gif
    domain: morphogenesis
    status: evaluated
    source_refs: [campas2010, abzhanov2004, abzhanov2006, fritz2014, soons2010, soons2012, soons2015, herrel2005, gibson1997, seki2005]
    supersedes_audit_id: 2026-10-19-avian-beak-darwin-scaling-audit-v2
    claim_boundary:
      reported_in_source:
        - "Campas et al. (2010): upper-beak profiles of the 14 Darwin's finch species collapse onto one master curve under a 3-parameter affine scaling-and-shear group M(s_L, s_D, gamma); Geospiza (Group A) collapse under pure scaling, Camarhynchus/Platyspiza/Cactospiza (Group B) and Certhidea/Pinaroloxias (Group C) need the shear"
        - "Abzhanov et al. (2004, 2006): Bmp4 scales beak depth/width and calmodulin scales length; RCAS::Bmp4, RCAS::Noggin and RCAS::CaM in chick change beak proportions accordingly"
        - "Soons et al. (2010, 2012, 2015): micro-CT finite-element models of Geospiza upper beaks show peak von Mises stress under in vivo bite force far less variable than bite force itself, a stress-reducing role for the keratin rhamphotheca, and lower stresses for base biting than tip biting"
        - "Herrel et al. (2005): in vivo bite forces of Darwin's finches scale with head width"
      reconstructed_in_script:
        - "Affine matrix and analytic inverse, canonical culmen curve, 2D/3D conical-parabolic beak surface, 14-species collapse with a pure-scaling negative control, 2D Bmp4/CaM Gaussian mesenchymal field, cantilever bending index W D^3/(12 L), four RCAS conditions, connected-component culmen contour extraction on the Gould (1845) plate, and (Pass 3) a two-material plane-stress Q4 FEM of the sagittal upper-beak section with Gibson-Ashby trabecular core, keratin shell, tip/base/oblique seed loads, beam-theory verification, mesh convergence, 14-species fracture-risk indices, keratin-modulus and BV/TV ablations"
      transfer_boundary:
        - "The 14-species 'empirical' profiles are generated by the script's own forward transform plus Gaussian noise (sigma = 0.24 % of s_D), so the collapse RMS 0.0021 / r = 0.9999 and the 45x negative-control ratio validate the inverse of the same transform, not digitised Campas Fig. 2/3 profiles"
        - "The FEM is a 2D sagittal plane-stress idealisation (out-of-plane thickness = W_mm everywhere) of a Law-1 sheared culmen profile with a 0.7 mm solid-keratin tip clamp, not a voxel-resolved micro-CT mesh; all moduli, strengths, thicknesses and the three Soons predictions were transcribed offline from memory and are order-of-magnitude anchors"
        - "The 'observed' RCAS D/L values and several reference values equal Law-2 formula outputs or the script's own earlier output, so those comparisons are self-referential"
      does_not_claim:
        - "Reproduction of any digitised Campas, Abzhanov or Soons figure value; a 3D micro-CT finite-element model; crack initiation or propagation; keratin-bone interface failure; mediolateral load asymmetry; per-species provenance of the species table (s_L, s_D, s_W, gamma, bite force)"
    summary: >-
      Pass 3 (v3) evaluation of `2021-alberti-avian-beak-darwin-scaling.py` (overall weighted score 87.6/100,
      down from 93.2 in v2). The single v2 remediation item is closed as an honest reduced model: Section 4b
      (L584-L1468) adds a two-material plane-stress Q4 finite-element solver for the sheared sagittal upper beak
      (Gibson-Ashby trabecular core + keratin rhamphotheca) under tip-biting, base-biting and 30 deg oblique
      seed loads, verified against Euler-Bernoulli (0.9925) and Timoshenko (0.9905), mesh-converged to 0.45 %,
      and exercised across all 14 species (tapered-beam slope 0.971, r = 0.9986; CV(sigma)/CV(F) = 0.432;
      G. magnirostris base-biting bone risk index 0.017). Two new Lean theorems (5 total, 0 sorrys), two new
      SHA-256-pinned dataset files, two new media outputs, 19 measurements and a 10-check self-test are credited.
      The score falls because this round exposed defects the v2 audit did not penalise: the 14-species collapse is
      circular (synthetic profiles from the model's own forward transform, L266-L272); several reference values are
      the script's own output or Law-2 formula outputs (L1905, L1915, L1955); the species table and the geometry
      constants (L96-L101, L198, L213, L397-L405) carry no per-value provenance; the Gould specimen D/L is tuned by
      hard-coded `ref_dl` and a 0.74 perspective factor (L478-L483, L522); the bite-force citation names the wrong
      venue (L1936); every Pass 3 FEM constant was transcribed offline; and the thin canonical tip is replaced by an
      artificial 0.7 mm keratin plate (L684) that dominates the 10.8x tip/base stress ratio.
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          Credited: exact upper-triangular affine group and analytic inverse (L154-L172), Bmp4/CaM field and RCAS
          suite (L377-L461), and the new reduced FEM — a correct vectorised Q4 plane-stress formulation (2x2 Gauss,
          symmetric positive-definite D, exact linearity 2F -> 2 sigma) verified against Euler-Bernoulli and
          Timoshenko (L744-L782, L785-L861, L935-L971), Gibson-Ashby E_trab = E_s (BV/TV)^2 (L636-L641), a
          two-material shell/core map (L722-L735), three Soons-type load cases (L974-L1064) and 5 machine-checked Lean
          theorems. Deductions: the 14-species 'empirical' profiles are the forward transform plus Gaussian noise
          (L266-L272), so the headline collapse and negative control are circular (-5); the remediation item asked for
          a micro-CT 3D fracture solver and received a 2D sagittal plane-stress section with uniform out-of-plane
          thickness W_mm (L763-L782), no crack model, and an artificial 0.7 mm solid-keratin tip clamp (L684) that
          dominates the tip-biting peaks (-3); the `bmp4_index` used for the r_Bmp4 = 0.9997 correlation is linear in
          `s_D` by construction (L349-L351) (-1); lower-mandible (-0.34, 0.88, 0.90; L198) and 3D half-width
          (0.48 x^0.82; L213) factors are uncited model inventions (-1).
        evidence:
          - {file: 2021-alberti-avian-beak-darwin-scaling.py, lines: [154, 172], note: "Affine scaling-and-shear matrix M(s_L, s_D, gamma) and its closed-form inverse", supports: true}
          - {file: 2021-alberti-avian-beak-darwin-scaling.py, lines: [266, 272], note: "14-species 'empirical' profiles are forward_transform_beak_surface() output plus rng.normal(0, 0.0024 s_D) — the collapse tests the inverse of the same transform", supports: false}
          - {file: 2021-alberti-avian-beak-darwin-scaling.py, lines: [636, 641], note: "Gibson-Ashby open-cell law for the homogenised trabecular core modulus", supports: true}
          - {file: 2021-alberti-avian-beak-darwin-scaling.py, lines: [744, 861], note: "Q4 strain-displacement, sparse plane-stress stiffness assembly, and solve_beak_fem with tributary-weighted contact traction and oblique load vector", supports: true}
          - {file: 2021-alberti-avian-beak-darwin-scaling.py, lines: [935, 971], note: "Rectangular-cantilever verification against Euler-Bernoulli (sigma ratio 0.9925) and Timoshenko (delta ratio 0.9905)", supports: true}
          - {file: 2021-alberti-avian-beak-darwin-scaling.py, lines: [974, 1064], note: "Three Soons-type load cases (tip x/L = 0.08, base 0.70, oblique 30 deg) with bone/keratin fracture-risk indices", supports: true}
          - {file: 2021-alberti-avian-beak-darwin-scaling.py, lines: [680, 684], note: "Tip clamped to tip_solid_depth_mm (0.7 mm solid keratin) because the x^1.85 culmen is ~1 % of basal depth at x = 0.1 L; this plate dominates the 10.8x tip/base ratio", supports: false}
          - {file: morphoeval/lean/loops/Loop_070_avian_beak_darwin_scaling.lean, lines: [109, 153], note: "Two new theorems: soons_cantilever_peak_stress_depth_quadratic_shielding and gibson_ashby_keratin_isostrain_shielding (5 total, 0 sorrys, lean exit 0)", supports: true}
      specimen-match:
        value: 85
        rationale: >-
          Credited: the SHA-256-locked Gould (1845) lithograph is segmented into four culmen contours
          (L466-L581), the comparison PNG panel E shows the contours, and the new FEM PNG (6 panels) and
          seed-contact sweep GIF render the von Mises fields on the sheared G. fortis / G. magnirostris sections.
