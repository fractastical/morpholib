# MorphoEval audit — Campàs et al. (2010) PNAS & Abzhanov et al. (2004, 2006) Darwin's Finch Beak Scaling & Shear, 2026-10-19 (v3)
#
# Pass 3 re-score of `2021-alberti-avian-beak-darwin-scaling.py` (2214 lines; was 1140 at v2) after the remediation
# round in the instrumented loop `morphoeval/runs/2026-10-19-avian-beak-darwin-scaling-loop-pass3`, superseding
# `2026-10-19-avian-beak-darwin-scaling-audit-v2` (93.2, Gemini 4 Argon).
#   - Primary assessor: Claude Fable 5.1 (Phase B subagent of slot-070, Pass 3)
#
# What Pass 3 changed (the single open v2 remediation item, closed as an honest REDUCED model):
#   1. New script Section 4b (L584-L1468): a two-material plane-stress Q4 finite-element solver for the sheared/scaled
#      sagittal upper-beak section — Gibson-Ashby homogenised trabecular core E_trab = E_s (BV/TV)^2 over a keratin
#      rhamphotheca shell — under tip-biting (x/L = 0.08), base-biting (0.70) and 30 deg oblique seed-cracking loads
#      (Soons et al. 2010, 2012, 2015). Verified against Euler-Bernoulli (sigma ratio 0.9925) and Timoshenko
#      (delta ratio 0.9905); mesh convergence 0.45 %; 14-species tip-biting peak vs tapered-beam estimate slope 0.971,
#      r = 0.9986; Soons-2010 stress-homeostasis CV(sigma)/CV(F) = 0.432; keratin-modulus and BV/TV ablations.
#   2. New SHA-256-pinned `beak_fem_fracture_reference.json` + `pass3_citations.bib`; new 6-panel FEM PNG and a
#      14-frame seed-contact sweep GIF; 10 new measurements (19 total); self-test 8 -> 10 checks; two new Lean 4
#      theorems (5 total, 0 sorrys) registered as equations 4-5 in the math KG.
#   No micro-CT volume is vendored, so the voxel-resolved 3D mesh, mediolateral asymmetry and crack propagation are
#   carried to Pass 4.
#
# Why the overall score goes DOWN (93.2 -> 87.6) despite the remediation: this round's purpose is to find the next
# layer of defects, and re-reading the v2-scored code exposed that (a) the headline 14-species collapse is circular —
# the "empirical" profiles are the model's own forward transform plus Gaussian noise (L266-L272), so RMS 0.0021 /
# r = 0.9999 and the pure-scaling negative control test the inverse of the same transform; (b) several
# `reference_value`s are set to the script's own output or to Law-2 formula outputs (L1905, L1915, L1955);
# (c) the species table has no per-value provenance and `bmp4_index` is linear in `s_D` by construction; (d) the
# specimen D/L is tuned by hard-coded `ref_dl` and a 0.74 "perspective factor" (L478-L483, L522); (e) every Pass 3
# FEM constant was transcribed offline from memory (dataset `provenance_note`). None of these were penalised in v2.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the working
# tree at commit 8a7928d7 plus the uncommitted Pass 3 edits (verified with grep against the current files).

