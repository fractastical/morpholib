      'empirical' profiles are forward_transform_beak_surface() plus rng.normal(0, 0.0024 s_D), so RMS 0.0021,
      r = 0.9999 and the 45x negative-control ratio test the inverse of the model's own transform. Vendor digitised
      Campas et al. (2010) Fig. 2/3 culmen profiles (or at least the published s_L, s_D, gamma table with figure
      loci) and collapse those; relabel the current metric as a synthetic self-consistency check.
    - >-
      datasets/avian_beak_darwin_scaling/avian_beak_darwin_scaling_reference.json `darwin_finch_species` and
      2021-alberti-avian-beak-darwin-scaling.py:349-351 — no per-value provenance (paper/figure/table) for s_L, s_D,
      s_W, gamma_shear, bmp4_index, cam_index, L/D/W_mm or bite_force_N; bmp4_index is linear in s_D so
      r_Bmp4 = 0.9997 is by construction. Add a `provenance` field per value and replace bmp4_index/cam_index with
      Abzhanov (2004, 2006) in situ expression scores or drop the correlation.
    - >-
      2021-alberti-avian-beak-darwin-scaling.py:1905, 1915-1917, 1945, 1955 — reference values set to the script's
      own output (negative control 0.092, Certhidea shear RMS 0.012), to Law-2 formula outputs (RCAS D_over_L_obs),
      or unsourced (r_DL 0.98). Replace each with a literature value carrying a figure/table locus or mark
      `reference_source: self-consistency` so measure_outputs.py does not count them as external anchors.
    - >-
      2021-alberti-avian-beak-darwin-scaling.py:478-483 and 522 (segment_darwin_finches_specimen) — hard-coded
      per-bird ref_dl and the 0.74 'calibrated perspective factor' tune D_over_L_cv toward the references it is
      correlated with (n = 4). Derive the perspective correction from the plate geometry (or measure it from the
      image) and source the four reference D/L values to a measured table (e.g. Grant & Grant morphometrics).
    - >-
      2021-alberti-avian-beak-darwin-scaling.py:680-684 (build_beak_fem_mesh) — the x^1.85 canonical culmen gives
      ~1 % of basal depth at x = 0.1 L, so the tip is clamped to a 0.7 mm solid-keratin plate that dominates the
      tip-biting peaks (99 MPa for G. magnirostris, 10.8x tip/base ratio vs the 3.07 lever estimate at L2014-2019).
      Model a real tomial depth and tip thickness (ventral boundary below y = 0) and re-check tip-biting mesh
      convergence (fem_mesh_convergence at L1215-1227 covers base biting only).
    - >-
      2021-alberti-avian-beak-darwin-scaling.py:763-782 (assemble_plane_stress_stiffness) and 1174-1212
      (sweep_keratin_modulus) — uniform out-of-plane thickness W_mm ignores the mediolateral taper of Law 1's 3D
      surface, mediolateral load asymmetry cannot be represented in 2D, and the keratin ablation substitutes
      material only, so the geometric (added-thickness) contribution of the rhamphotheca is never separated and
      the -3.6 % 'shielding' sign conflicts with the recalled Soons (2012) claim. Add a thickness-varying
      plane-stress (or 3D shell/solid) section and a geometry-with/without-shell ablation.
