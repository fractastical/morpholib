# MorphoEval audit — Coturnix japonica 22.42 µm Turing wavelength, Pass 2.
# Supersedes the Pass 1 audit. Builder and assessor remain the same agent.

audit:
  id: 2026-10-27-coturnix-japonica-turing-wavelength-s0-audit-v2
  supersedes_audit_id: 2026-10-27-coturnix-japonica-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, single-agent round; second assessor not available)"
  publisher_github: https://github.com/fractastical
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
  license: https://creativecommons.org/licenses/by/4.0/
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 0c76d15d14afcec6c366e1b9274a6586a0de48fc
    note: >-
      Slot 3157 files are new in the working tree and are not in commit
