      reported_in_source:
        - "Brodland (2002) J. Biomech. Eng. Eqs. 1-4: Differential Interfacial Tension Hypothesis (DITH) decomposing cell-cell interfacial tension into actomyosin cortical tension minus cadherin adhesion (gamma_{alpha,beta} = beta_alpha + beta_beta - omega_{alpha,beta})."
        - "Krieg et al. (2008) Nature Cell Biology Figs. 1-4: AFM cortical tension hierarchy across zebrafish shield-stage germ-layer progenitors (beta_ectoderm ~ 50 < beta_mesoderm ~ 95 < beta_endoderm ~ 130 pN/um), concentric 3-germ-layer sorting, Blebbistatin Myosin-II inhibition arrest, and caMLCK ectodermal cortical stiffening sorting reversal."
        - "Maître et al. (2012) Science Eq. 1: Young-Dupré cell-doublet contact angle cos(theta) = 1 - gamma_cc/(2*gamma_cm) and normalized contact radius r_c/R = sin(theta)."
      reconstructed_in_script:
        - "2D deformable DITH cell sorting across all 4 perturbation regimes (wild-type engulfment, caMLCK cortex reversal, Blebbistatin Myosin-II inhibition, and high-HIT mushroom doublet) plus simultaneous 3-germ-layer concentric stratification (r_E = 0.870 > r_M = 0.663 > r_N = 0.446), a 7-point continuous beta_E sweep across the sorting inversion threshold beta_E = beta_M = 95 pN/um, and the Young-Dupré doublet contact curve."
        - "Computer-vision segmentation of zebrafish blastoderm cross-transplantation GFP/RFP micrographs (`germ_layer_doublet_specimen.jpg`) across both layered engulfment (Row B, radial profile r = 0.9301, RMSE = 0.1844) and the protruding mushroom doublet (Row C, empirical r_c/R = 0.9717)."
      transfer_boundary:
        - "2D lattice DITH representation of 3D zebrafish germ-layer progenitor reaggregates and blastoderm cross-transplants."
      does_not_claim:
        - "Does not model sub-second single-molecule E-cadherin bond rupture kinetics or whole-embryo epiboly yolk-syncytial-layer microtubule pulling."
