    claim_boundary:
      reported_in_source:
      - 'Thompson (1917) pp. 770-773: the human skull drawn in a 5x4 Cartesian net (Fig. 404) and the chimpanzee,
        baboon and dog skulls drawn in deformed nets (Figs. 405-408); prose statements that the deformation is one
        ''harmonious and congruent transformation'', that cell areas increase ''in approximately logarithmic order''
        from above downwards and behind forwards, that the baboon differs ''only in an increased intensity'', that
        the chimpanzee is ''much nearer the human type than the baboon'', and that the dog''s net ''tapers away
        in front'' on ''different lines''.'
      reconstructed_in_script:
      - The Fig. 405 net digitised and reconstructed as a thin-plate spline T in human grid units (E1-E3); cell-area
        log-linear regression (E4); 11 homologous landmarks digitised by the loop agent on Fig. 404, Fig. 406 and
        four Commons specimens; full-Procrustes explained fraction of T(H) toward the real chimpanzee (E6) with
        jitter bootstrap, label-permutation null, r / RMSE / KS / Wilcoxon; lambda and k sweeps with k* scan; mirrored-net
        and wrong-target controls; silhouette segmentation taper index and face fraction; facial index and facial
        angle (E7).
      transfer_boundary:
      - One specimen per taxon (museum photographs for chimpanzee, baboon, dog; a rendered anatomical model for
        the human, whose influence is bounded by the Fig. 404-reference robustness check); the baboon and dog nets
        of Figs. 407-408 were not digitised, so C2/C5 are tested on real specimens (and, for C2, on the k* scan
        along the chimpanzee ray), not on Thompson's drawings of them.
      does_not_claim:
      - Nothing about growth, ontogeny or phylogeny; no claim that Thompson's curves are the optimal smooth map
        (a lambda-smoothed net does slightly better, E 0.38 vs 0.35); no claim that the baboon lies on exactly the
        chimpanzee ray - C2 is reported as mixed; the verdict is for these four specimens and would need a population
        sample to generalise.
