# MorphoEval audit — Economou et al. (2012) Nature Genetics Mammalian Palate Rugae Growth-Zone Turing Morphogenesis, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2012-economou-palate-ruguga-turing.py` (295 lines)
# prior to Step 12 remediation in `2026-10-19-palate-ruguga-turing-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.2 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `simulate_1d_palatal_transect` (L88-145) integrates only a static 1D fixed-length
#      domain L=29.0 and lacks the 2D growing palatal shelf reaction-diffusion PDE with
#      a localized anterior-posterior growth zone immediately anterior to pioneer ruga 8
#      generating the sequential intercalation order `8 -> 1 -> 2 -> 3 -> 4 -> 5 -> 6 -> 7 -> 7b`
#      (Economou et al. 2012 Fig. 1a-d; Pantalacci et al. 2008 BMC Dev. Biol. 8:116) and
#      lacks the equal-diffusion (D_A = D_H = 0.2) negative control.
#   2. Evaluates only the wild-type baseline in 1D and omits the surgical incision and
#      pharmacological/genetic perturbation suite of Economou et al. (2012) Figs. 2-4:
#      coronal surgical cut across the ruga-8 growth zone (causing ruga bifurcation/spots),
#      sagittal surgical cut (preserving parallel stripe orientation), cyclopamine SHH
#      inhibition (broadened/merged rugae), exogenous FGF10 bead / Spry2-/-;Spry4+/-
#      hyperactive FGF signaling (high-density fragmented rugae), and equal-diffusion control.
#   3. The vendored biological specimen `datasets/palate_ruguga_turing/palate_rugae_specimen.jpg`
#      (mammalian hard palate transverse rugae specimen, CC BY-SA 3.0) is never loaded,
#      segmented, or compared in `palate_ruguga_turing_comparison.png`.
#   4. Runtime SHA-256 verification of the 4 files in `datasets/palate_ruguga_turing/` and
#      CLI parameter overrides (`--a11`, `--a12`, `--a21`, `--a22`, `--D-ratio`, `--growth-rate`, `--seed`)
#      are missing.

