        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [6, 38], note: "Nine sources with DOIs in the module docstring", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [167, 189], note: "verify_dataset_integrity: pinned SHA-256 for specimen + scout manifest; reference JSONs only recorded (L185-188)", supports: true}
          - {file: datasets/clock_and_wavefront/fgf_ra_vertex_reference.json, lines: [1, 69], note: "Pass 3 reference table: 6 sources with DOIs, toggle/vertex parameters, derived values, sweep, bead, reference values", supports: true}
          - {file: datasets/clock_and_wavefront/paper_citations.bib, lines: [45, 97], note: "Five new BibTeX entries: Dubrulle 2004, Dubrulle 2001, Farhadifar 2007, Bi 2015, Saga & Takeda 2001", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [125, 132], note: "EXPECTED_SHA256 does not include fgf_ra_vertex_reference.json", supports: false}
      code-traceability:
        value: 91
        rationale: >-
          The module docstring states Laws 1-5 with their equations, sources and Lean theorem names (L40-93);
          every section banner and function docstring names the paper, figure or law it implements
          (e.g. Section 4a Goldbeter 2007, Section 4c Farhadifar 2007 / Bi 2015, L262-265, L636-639); the math-KG
