        value: 91
        rationale: >-
          Deterministic RNG (seed 1976 for the cusp noise and the vertex jitter, L403, L648, L682); `--self-test`
          now asserts bitwise two-run determinism for both wavefront modes, bistability, v_front within 2 % and
