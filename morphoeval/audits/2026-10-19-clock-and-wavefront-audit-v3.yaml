        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [40, 93], note: "Governing Laws 1-5 with equations, sources and Lean theorem names", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [262, 265], note: "Section 4a banner: Goldbeter-Gonze-Pourquie (2007) FGF8/RA bistable toggle analysis (Law 4)", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [636, 639], note: "Section 4c banner: vertex sheet (Farhadifar 2007; Bi 2015; Law 5)", supports: true}
          - {file: morphoeval/math_kg_loops/cooke-clock-and-wavefront.yaml, lines: [108, 159], note: "Equations 4-5 with Lean declarations, loci and code loci", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [136, 161], note: "Tuned constants (kappa_a, K_mob, k_dM, dLambda_cleft) without source citation", supports: false}
