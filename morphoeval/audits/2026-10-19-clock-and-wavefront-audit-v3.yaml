# MorphoEval audit — Cooke & Zeeman (1976) Clock-and-Wavefront Somite Segmentation, 2026-10-19 (v3)
#
# Pass 3 remediation re-score of `1976-cooke-clock-and-wavefront.py` (Slot 021) after closing both
# open items of the Pass 2 audit in the instrumented loop `morphoeval/runs/2026-10-19-clock-and-wavefront-loop-pass3`,
# superseding `2026-10-19-clock-and-wavefront-audit-v2` (90.4). Same assessor/second-assessor blocks as v2.
#
# What Pass 3 changed (both v2 remediation items):
#   1. Goldbeter-Gonze-Pourquie (2007) FGF8/RA bistable toggle + Dubrulle & Pourquie (2004) fgf8 mRNA decay gradient
#      (`wavefront_mode="fgf_ra"`): the tailbud elongates at v_tb, every cell runs the toggle, the cusp unfolding
#      parameter a = tanh((R-F)/kappa_a) and the commitment mobility m = F^4/(F^4+K_mob^4) are read off the toggle,
#      so the determination front and its velocity emerge from axis elongation (v_front = 2.22222 vs v_tb = 2.2222
#      um/min, R^2 = 1.000; 4-point v_tb sweep S RMSE 0.09 um; FGF8 bead gives 0.70x smaller adjacent somites).
#   2. Farhadifar et al. (2007) vertex-model sheet of the anterior 1.2 mm of PSM (360 cells) coupled to the chi field
#      through an anterior/posterior half-somite rule (only posterior(-1)->anterior(+1) interfaces get dLambda):
#      12 clefts / 100.0 um pitch, cleft angle 28.2 -> 10.3 deg (dLambda = 0 control 27.3 deg; SEM specimen clefts
#      7.9 deg), tortuosity 1.30 -> 1.03, shape index 3.76 (< 3.81 solid). No T1 transitions / rosettes.
#   3. Five new Lean 4 theorems (front velocity = elongation speed for any toggle offset; endogenous somite length;
#      half-somite cleft count; tension selectivity; compartment length), 0 sorry; math-KG laws 4-5 registered;
#      datasets/clock_and_wavefront/fgf_ra_vertex_reference.json + 5 new DOIs; self-test 6 groups, 13 measurements.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files at commit d58a084 (working tree of this loop).

