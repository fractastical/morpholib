simulations:
  - id: cooke-clock-and-wavefront
    name: "Cooke & Zeeman (1976) clock-and-wavefront somite segmentation"
    organism: "Xenopus laevis & Gallus gallus vertebrate paraxial mesoderm somites"
    script: 1976-cooke-clock-and-wavefront.py
    output: docs/media/clock_and_wavefront_comparison.png
    extra_outputs:
      - docs/media/clock_and_wavefront_growth.gif
      - docs/media/clock_and_wavefront_vertex_sheet.png
    status: evaluated
    supersedes_audit_id: 2026-10-19-clock-and-wavefront-audit-v2
    claim_boundary:
      reported_in_source:
        - "Cooke & Zeeman (1976) J. Theor. Biol. 58:455-476 kinematic somite wavelength law S = v * T_c and Thom-Zeeman cusp catastrophe wavefront manifold"
        - "Cooke (1975) Nature 254:196-199 Xenopus laevis blastula size-reduction invariance (N ~ 40 somites across normal and miniature embryos)"
        - "Goldbeter, Gonze & Pourquie (2007) Dev. Dyn. 236:1495-1508: mutual FGF/RA inhibition is bistable and its switching threshold defines a sharp determination front that moves with axis elongation; Dubrulle & Pourquie (2004) Nature 427:419-422: the fgf8 gradient is set by mRNA decay in cells leaving the tailbud"
        - "Dubrulle, McGrew & Pourquie (2001) Cell 106:219-232: an ectopic FGF8 bead produces smaller somites at its level (no numerical ratio reported)"
        - "Farhadifar et al. (2007) Curr. Biol. 17:2095-2104 vertex-model energy and case-I parameters; Bi et al. (2015) Nat. Phys. 11:1074-1079 shape-index rigidity transition p0* = 3.81"
      reconstructed_in_script:
        - "1D anteroposterior Thom-Zeeman cusp catastrophe ODE tau_chi*dchi/dt = -(chi^3 - a(x,t)*chi - b_osc(x,t)) with either the prescribed kinematic front a = tanh((v t - x)/sigma_w) or the Goldbeter FGF/RA toggle front a = tanh((R - F)/kappa_a), m = F^4/(F^4 + K_mob^4), driven by tailbud elongation through M_F = exp(-(x_tb - x)/lambda_F), lambda_F = v_tb/k_dM (reduced two-variable toggle; Cyp26/Raldh2 lumped)"
        - "Endogenous front velocity fit (v_front = 2.22222 um/min vs v_tb = 2.2222, R^2 = 1.000), 4-point v_tb sweep (S RMSE 0.09 um), decaying-Gaussian FGF8 bead perturbation (min adjacent somite ratio 0.70, max 1.55)"
        - "Farhadifar vertex model of a 60 x 6 hexagonal PSM sheet (20 um pitch, Lambda_0 = 0.12, Gamma = 0.04, dLambda_cleft = 0.9, outer boundary pinned, gradient descent, no T1) in which only posterior(-1)->anterior(+1) half-somite interfaces are loaded: 12 clefts at 100.0 um pitch, cleft angle 28.2 -> 10.3 deg (control 27.3), tortuosity 1.30 -> 1.03, shape index 3.76"
        - "Bilateral dorsal somite row DoG peak and inter-somitic cleft segmentation on somite_embryo_specimen.jpg (48.47 px mean spacing, symmetry ratio 0.9605) plus a per-cleft luminance-minimum line fit giving an empirical cleft angle of 7.9 deg"
      transfer_boundary:
        - "1D anteroposterior paraxial mesoderm axis mapped to dorsal vertebrate SEM somite rows; the specimen is a chick SEM in pixels with no scale bar, so S_obs (px) is compared to the Cooke-Zeeman waveform shape and cleft orientation only, not to S_sim in um"
        - "The FGF/RA toggle parameters (alpha = 3, K = 1, n = 4, tau_FR = 12 min, k_dM = 0.0074/min) are tuned to place the front offset ~0.19 mm behind the tailbud; they are not Goldbeter et al.'s published kinetic constants, so only the qualitative predictions (bistability, v_front = v_tb, bead effect) are tested"
        - "The chi = +1 / -1 compartments of the cusp are read as anterior / posterior half-somites (Saga & Takeda 2001) to decide which interfaces are clefts; Cooke & Zeeman themselves did not make this identification"
      does_not_claim:
        - "The published 3-4 variable Goldbeter (2007) kinetics with explicit Cyp26 / Raldh2, quantitative reproduction of its hysteresis figures or of Dubrulle (2001) somite sizes, T1 transitions / epithelial rosette formation / apical constriction, the 90-degree Xenopus somite cell-block rotation, 3D epithelialisation mechanics, or explicit Delta-Notch intercellular delay coupling (Slots 022-023)"
    source_refs:
      - cooke1976
      - cooke1975
      - palmeirim1997
      - goldbeter2007
      - dubrulle2004
      - dubrulle2001
      - farhadifar2007
      - bi2015
      - saga2001
    summary: >-
      Pass 3 post-remediation evaluation of `1976-cooke-clock-and-wavefront.py` (90.3/100, essentially flat vs 90.4
      in Pass 2). Both Pass 2 remediation items are closed: (i) a reduced Goldbeter-Gonze-Pourquie (2007) FGF8/RA
      toggle driven by Dubrulle & Pourquie (2004) fgf8 mRNA decay behind an elongating tailbud now supplies the
      cusp unfolding parameter and commitment mobility, so the wavefront velocity is derived rather than
      prescribed (v_front = 2.22222 vs v_tb = 2.2222 um/min, S = 100.13 um, N = 40; S tracks v_tb*T_c across a
      4-point sweep with RMSE 0.09 um; an FGF8 bead yields 0.70x smaller adjacent somites as in Dubrulle 2001);
      (ii) a Farhadifar (2007) vertex-model sheet of 360 PSM cells coupled through an anterior/posterior
      half-somite cleft rule forms 12 blocks at 100.0 um pitch and rotates the lattice cleft from 28.2 to
      10.3 deg from the mediolateral axis (dLambda = 0 control 27.3 deg; SEM specimen clefts 7.9 deg) while
      straightening it (tortuosity 1.30 -> 1.03). Five new Lean 4 theorems (0 sorry) formalise the front-velocity
      and cleft-count laws. The score does not rise because the remediation exposed the next layer: the toggle is a
      two-variable reduction with tuned rather than published constants, the specimen has no um scale, the
      bead comparison is directional only, the sheet has no T1 transitions or rosettes, and the new reference
      JSON is recorded but not SHA-256-pinned.
    scores:
      model-fidelity:
        value: 91
        rationale: >-
          The Cooke & Zeeman (1976) kinematics (S = v*T_c, N = L/(v*T_c)) and the Thom-Zeeman cusp ODE are
          implemented as published (L208-223, L358-606) and the Pass 2 kinematic path is byte-identical
          (S_sim = 100.13 um, N = 40). Pass 3 adds the Goldbeter (2007) mechanism in recognisable form: mutual
          Hill repression, fgf8 mRNA decay gradient with lambda_F = v_tb/k_dM, bistable window located by a
          saddle-node scan (M_lo = 0.53), irreversible switching, and the front read off the toggle (L266-350,
          L428-494), with the predicted v_front = v_tb verified to 1e-4 %. The vertex sheet uses the Farhadifar
          energy with its case-I constants and an analytic gradient (L701-731). Deductions: the toggle is a
          two-variable reduction with Cyp26/Raldh2 lumped and alpha, K, n, tau_FR, k_dM tuned rather than taken
          from the paper (-4); the chi = +1/-1 -> anterior/posterior half-somite identification that decides
          cleft placement is an interpretive step (Saga & Takeda 2001), not Cooke-Zeeman's (-2); the sheet has no
          T1 transitions, so the zig-zag cleft can only partially resolve and no rosette forms (-2); the
          commitment mobility window m(x,t) remains an added construct not in the 1976 paper (-1).
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [208, 223], note: "Analytical S = v*T_c and N = L/(v*T_c) (Laws 1-2)", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [266, 350], note: "Reduced Goldbeter toggle steady-state scan: saddle-node bistable window [M_lo, M_hi] and front threshold M_lo", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [428, 494], note: "fgf_ra branch: tailbud M_F gradient, Euler toggle update, a = tanh((R-F)/kappa_a), m = F^4/(F^4+K_mob^4), front located from a = 0", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [136, 148], note: "FGF_RA_PARAMS are tuned normalised constants (alpha 3, K 1, n 4, tau 12 min, k_dM 0.0074/min), not Goldbeter's published values; docstring L80-81 states the Cyp26/Raldh2 lumping", supports: false}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [701, 731], note: "Farhadifar (2007) energy gradient: area elasticity, perimeter contractility, per-edge line tension", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [817, 822], note: "Half-somite cleft rule: only posterior(-1)->anterior(+1) interfaces receive dLambda; no T1 transitions (docstring L778)", supports: true}
          - {file: morphoeval/lean/loops/Loop_021_clock_and_wavefront.lean, lines: [75, 192], note: "Laws 4-5: front velocity = v_tb for any offset D, endogenous somite length, half-somite cleft count N, tension selectivity (0 sorry, lean 4.35 OK)", supports: true}
      specimen-match:
        value: 87
        rationale: >-
          Panels E-F keep the bilateral SEM segmentation (8 + 9 somites, 48.47 px, symmetry 0.9605, phase
          correlation r = 0.563) and Panel E now overlays the 8 lower-row clefts whose fitted orientation (7.9 deg
          from the ML axis) is the empirical anchor for the vertex-sheet cleft angle (10.3 deg after differential
          tension vs 27.3 deg control), so for the first time a 2D feature of the rendered tissue is compared with
          the specimen. The sheet renders as transverse somite blocks with straightened yellow clefts
          (clock_and_wavefront_vertex_sheet.png) and the GIF shows the FGF/RA profiles and emergent front.
          Deductions unchanged or newly exposed: the specimen is a chick SEM in pixels with no scale bar, so S_obs
          cannot be compared to S_sim in um and the Xenopus-parameterised model is matched to a different species
          (-6); the red/blue anterior/posterior half-somite colouring and the 20-um hexagonal cells are schematic
          and have no counterpart in the SEM (-4); the specimen cleft angle comes from a crude luminance-minimum
          line fit through a 44-px band (-2); the 1D waveform correlation r = 0.563 is modest (-1).
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [883, 976], note: "Bilateral DoG segmentation plus per-cleft luminance-minimum line fit (L944-958) giving lower_row_cleft_angle_mean_deg = 7.9", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [1404, 1432], note: "Panel E overlays peaks and the 8 cleft lines on the SEM; title reports the cleft angle", supports: true}
          - {file: docs/media/clock_and_wavefront_comparison.png, lines: [0, 0], note: "9 panels: kymograph, trains incl. FGF/RA and bead, morphospace, size invariance, SEM segmentation, waveform fit, toggle bistability, endogenous front, vertex sheet with angle-vs-time inset", supports: true}
          - {file: docs/media/clock_and_wavefront_vertex_sheet.png, lines: [0, 0], note: "Full 1.2 mm sheet: treated (clefts straight, 10.3 deg) vs dLambda = 0 control (zig-zag, 27.3 deg)", supports: true}
          - {file: datasets/clock_and_wavefront/clock_and_wavefront_reference.json, lines: [30, 41], note: "Specimen metadata gives px ROIs only; no um scale or scale bar, species listed as Gallus gallus / vertebrate", supports: false}
      parameter-expressivity:
        value: 92
        rationale: >-
          The 5 Cooke (1975) regimes and the S(v, T_c) morphospace are retained (Panels C-D). Pass 3 adds a sweep
          of the mechanistic parameter that now controls S: tailbud elongation speed v_tb in {1.33, 1.67, 2.22,
          3.33} um/min gives v_front = v_tb to <= 1e-4 % and S = 60.1 / 75.1 / 100.1 / 150.0 um (RMSE 0.09 um,
          r = 1.000) with no wavefront parameter changed (L609-633, Panel H inset, Panel C diamonds); an FGF8 bead
          perturbation shrinks adjacent somites to 0.70x and enlarges the next to 1.55x (Panel B); the vertex
          dLambda ablation (0.9 vs 0) isolates the cleft-rotation effect (Panel I inset); and `--v-tailbud`,
          `--wavefront-mode`, `--summary` expose the new axis on the CLI (L1754-1762). Deductions: dLambda is only
          tested at two values, so monotonicity of cleft angle with tension is not shown (-3); toggle parameters
          (tau_FR, k_dM, kappa_a) that set front width and offset are not swept (-3); A_clock / b0_bias of the cusp
          remain unswept (-2).
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [609, 633], note: "evaluate_endogenous_front_sweep over v_tb: v_front, S_sim vs S_pred, lambda_F per point", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [982, 1028], note: "run_pass3_models: FGF/RA normal, miniature, bead, sweep, bistability scan, treated and dLambda = 0 sheets", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [1754, 1762], note: "CLI: --L-mm, --Tc-min, --T-total-min, --v-tailbud, --wavefront-mode, --seed, --skip-gif, --summary", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [150, 161], note: "VERTEX_PARAMS: single dLambda_cleft = 0.9; only the 0 control is also run", supports: false}
      morphometric-validation:
        value: 91
        rationale: >-
          `measure_morphoeval()` (L1030-1193) now returns 13 reference-anchored measurements: the 5 Pass 2 metrics
          (S_sim 100.13 vs 100 um; N_mini/N_norm 1.000 vs 0.985; clock-doubled minus arrested 20; S_obs 48.47 px;
          5-regime RMSE 0.27) plus v_front 2.2222 vs 2.2222 um/min, S(fgf_ra) 100.13 vs 100 um, v_tb-sweep RMSE
          0.09 um, bead ratio 0.70 vs control 1.0 (directional), cleft angle 10.3 vs specimen 7.9 deg, tortuosity
          1.03 vs 1.0, S_2d 100.0 vs 100 um and shape index 3.76 vs Bi (2015) 3.81. Deductions: five of the new
          references are the model's own analytical laws (S = v_tb*T_c, v = L/T_total, straight cleft), so they
          test internal consistency rather than biology (-4); the bead reference is directional because Dubrulle
          (2001) gives no ratio (-2); the specimen cleft angle is from an 8-cleft luminance fit without
          uncertainty (-2); the 13 blocks vs 12.0 analytical on the sheet includes two partial end blocks that are
          counted without correction (-1).
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [1030, 1193], note: "13 measurements with value, unit, method, reference_value, reference_source, note", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [1109, 1149], note: "FGF/RA metrics: v_front vs v_tb, S(fgf_ra), sweep RMSE, bead ratio (reference_source states 'directional comparison only')", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [1150, 1193], note: "Vertex-sheet metrics: cleft angle vs specimen 7.9 deg, tortuosity vs 1.0, S_2d vs 100 um, shape index vs 3.81 (vendored)", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [1141, 1149], note: "Bead measurement reference_value 1.0 is the control; the paper gives no numerical ratio", supports: false}
      source-traceability:
        value: 93
        rationale: >-
          Nine primary sources carry DOIs in the module docstring (L6-38), `paper_citations.bib` (9 entries) and
          the two reference JSONs; the specimen and scout manifest remain SHA-256-pinned and verified fail-closed
          at every run (L125-132, L167-189); the new `fgf_ra_vertex_reference.json` records every toggle and
          vertex parameter, the v_tb sweep, bead settings and the Bi (2015) / specimen reference values, and the
