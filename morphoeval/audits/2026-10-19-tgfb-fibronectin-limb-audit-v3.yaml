# MorphoEval audit — Hentschel, Glimm, Glazier & Newman (2004) Proc. R. Soc. B Dynamical Mechanisms for Skeletal Pattern Formation in the Vertebrate Limb, 2026-10-19 (v3)
#
# Pass 3 (remediation round) re-score of `2004-hentschel-tgfb-fibronectin-limb.py` (v3, 1759 lines) after closing the
# single Pass 2 remediation item (couple the continuum 4-field PDE to a Glazier-Graner-Hogeweg cellular Potts cell
# lattice as in Kiskowski et al. 2004 / Chaturvedi et al. 2005) in the instrumented loop
# `morphoeval/runs/2026-10-19-tgfb-fibronectin-limb-loop-pass3`, superseding `2026-10-19-tgfb-fibronectin-limb-audit-v2` (92.6).
#
# What Pass 3 changed:
#   1. New Section 3b (L646-949): `simulate_ggh_cellular_potts_condensation` — GGH Hamiltonian with Graner-Glazier (1992)
#      contact energies (14/2/11/16), T = 10, lambda_V = 6, V_T = 25 px, Savill-Hogeweg haptotaxis copy energy mu_F = 10,
#      Metropolis acceptance, checkerboard-parallel stride-3 sub-lattice sweeps; coupled to the continuum through the PDE's
#      own Hill switch for the R1 -> R2 state (L790-793) and a two-way cell-deposited fibronectin field (L796-798).
#      `run_cpm_micromass_coupling` (4 regimes: WT, DA-only, haptotaxis-only, full ablation) and `run_cpm_wing_bud_coupling`
#      (per-compartment discrete condensation counts) feed Panels I-L, 6 new measurements and 6 new self-test checks.
#   2. Pass 3 exposed that the Pass 2 2D micromass continuum field was chemotactically collapsed (24.4 % of pixels pinned at the
#      clip bounds, 415 single-pixel "islands"), so its "nodular spots 19.8 % vs stripes 44.8 %" contrast was an artefact; the
#      solver now uses volume-filling haptotaxis chi_F R (1 - R/2) grad F (Hillen & Painter 2001; L605-606) and reports
#      `clip_fraction_R`. With the resolved solver BOTH regimes are labyrinthine bands (8 vs 6 islands, 21 % area each).
#   3. The same diagnostic shows the 1D stage solver pins 100 % of R(x) at the clip bounds for fa = 11 and 18 (52 % at fa = 6)
#      and the 2D wing solver 19.3 % — the Pass 2 "haptotactic condensation amplitudes", std(R) sweep (Panel G) and
#      F-R colocalisation r = 0.9997 were set by the clip, not by the PDE. Counts are unchanged; amplitudes are not resolved.
#      These are disclosed (Panel L, measurement 13, dataset README) and carried to Pass 4, NOT fixed, because applying the
#      volume-filling form to the 1D solver removes the stylopod m = 1 condensation (std(R) = 0.017 at R_max = 2).
#   4. Lean Laws 4-5 (`ggh_differential_adhesion_sorting_condition`, `ggh_metropolis_haptotaxis_acceptance`), 0 sorrys;
#      dataset: `kiskowski_ggh_cpm_reference.json` (SHA-256 pinned), 5 new DOIs in paper_citations.bib, README findings.
#
# Net effect: the remediation item is closed (model-fidelity credit) but the deeper defects it exposed pull model-fidelity,
# specimen-match, parameter-expressivity and morphometric-validation DOWN. Overall 82.6 (v2 92.6).
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the files at commit 58b898c.

