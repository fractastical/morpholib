simulations:
  - id: hentschel-tgfb-fibronectin-limb
    name: "Hentschel, Glimm, Glazier & Newman (2004) Proc. R. Soc. B / Kiskowski et al. (2004) Dev. Biol. multiscale TGF-beta / FGF-inhibitor reaction-diffusion and fibronectin haptotaxis PDE in developing Gallus gallus limb bud, coupled to a Glazier-Graner-Hogeweg cellular Potts cell lattice"
    organism: "Gallus gallus domesticus embryonic wing bud & high-density mesenchymal micromass (HH20 stylopod humerus -> HH24 zeugopod radius+ulna -> HH27 autopod digits II-IV)"
    script: 2004-hentschel-tgfb-fibronectin-limb.py
    output: docs/media/tgfb_fibronectin_limb_comparison.png
    extra_outputs:
      - docs/media/tgfb_fibronectin_limb_growth.gif
      - docs/media/tgfb_fibronectin_limb_cpm_sorting.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-tgfb-fibronectin-limb-audit-v2
    source_refs:
      - hentschel2004
      - kiskowski2004
      - miura2006
      - chaturvedi2005
      - christley2007
      - graner1992
      - glazier1993
      - savill1997
      - hillen2001
      - tapia2011
    claim_boundary:
      reported_in_source:
        - "Hentschel et al. (2004): a 4-field TGF-beta activator / FGF-dependent inhibitor / fibronectin / mesenchymal-cell-density reaction-diffusion-haptotaxis system whose AER-FGF-modulated unstable wavenumber increases proximodistally, giving 1 -> 2 -> 3 skeletal elements"
        - "Kiskowski et al. (2004): discrete cells on a lattice with a continuous activator/inhibitor prepattern, activated cells deposit fibronectin and bind to it, producing autonomous condensations; Chaturvedi et al. (2005): the same scheme realised in a GGH cellular Potts framework (CompuCell)"
        - "Graner & Glazier (1992) / Glazier & Graner (1993): differential adhesion with J_dd < J_ld < J_ll < J_cM at T = 10 sorts cells; heterotypic boundary length decreases"
        - "Miura & Shiota (2000): exogenous TGF-beta2 fuses micromass condensations into bar-like patterns; anti-fibronectin treatment blocks condensation"
      reconstructed_in_script:
        - "Linear dispersion of the activator/inhibitor subsystem, 1D and 2D (x, z) pseudo-spectral IMEX integration of the 4-field system with zero-flux boundaries, 2D periodic micromass morphospace with volume-filling haptotaxis, dual negative controls, a GGH cellular Potts lattice coupled through the PDE's Hill switch and a two-way fibronectin field, four GGH regimes plus a wing-bud GGH run, specimen segmentation of a Gallus wing, 14 measurements, 5 Lean 4 theorems"
      transfer_boundary:
        - "Kiskowski et al. (2004) is a lattice-cell / biased-random-walk model, not a cellular Potts model; the GGH realisation follows Chaturvedi et al. (2005), as the Pass 2 remediation item requested, and the dataset JSON says so"
        - "The 1D stage and 2D wing continuum solutions are chemotactically collapsed (clip_fraction_R = 1.00 at fa = 11, 18; 0.52 at fa = 6; 0.193 in 2D): condensation counts are reproduced but amplitudes, std(R) and F-R correlations are clip-determined"
        - "GGH references are internal (continuum ratio, ablation value, adopted thresholds) because the cited discrete-model papers do not report the metrics used here"
      does_not_claim:
        - "A hexagonal nodular-spot micromass regime (both resolved continuum regimes are labyrinthine), a discrete stylopod condensation (GGH gives [0, 2, 3]), quantitative agreement with Kiskowski et al. (2004) condensation sizes, a sequential (exact-volume) cellular Potts update, 3D geometry, limb outgrowth, or cell division"
    summary: >-
      Pass 3 (v3) post-remediation evaluation of `2004-hentschel-tgfb-fibronectin-limb.py`
      (overall weighted score 82.6 / 100, down 10.0 points from 92.6 in Pass 2). The single Pass 2
      remediation item is closed: Section 3b implements a Glazier-Graner-Hogeweg cellular Potts lattice
      (Graner-Glazier contact energies 14/2/11/16, T = 10, lambda_V = 6, Savill-Hogeweg haptotaxis
      mu_F = 10, Metropolis acceptance, checkerboard-parallel sweeps) coupled to the continuum through
      the PDE's own Hill switch for the R1 -> R2 state and a two-way cell-deposited fibronectin field.
      On the x3-upsampled WT micromass prepattern the four GGH regimes order as WT 1.355 > DA-only 1.204
      > haptotaxis-only 1.078 > full ablation 0.969 in condensation index (continuum 1.514), the
      heterotypic boundary fraction falls from 0.514 (ablation) to 0.293 (WT), the discrete R2 density
      correlates with the continuum R_2 at r = 0.918 (ablation 0.800), all 1296 cells survive, and on the
      2D wing bud the lattice forms [0, 2, 3] discrete condensations against the continuum [1, 2, 3].
      The score falls because Pass 3 also found that the Pass 2 continuum fields were chemotactically
      collapsed: the micromass "spots vs stripes" contrast (19.8 % vs 44.8 %) was an artefact of
      thresholding a field with 24 % of pixels pinned at the clip bounds (now fixed with volume-filling
      haptotaxis; both regimes are labyrinthine), and the 1D stage (100 % pinned at fa = 11, 18) and 2D
      wing (19.3 % pinned) solvers still are — counts hold, amplitudes do not. Lean Laws 4-5 are
      machine-checked (0 sorrys); the dataset gains a SHA-256-pinned GGH parameter table and 5 DOIs.
    scores:
      model-fidelity:
        value: 78
        rationale: >-
          Credit: the Hentschel et al. (2004) dispersion (L185-266) and the 4-field PDE structure in 1D
          (L271-418), 2D wing (L421-536) and periodic micromass (L539-644) are the published equations;
          the new GGH module (L678-862) is a correct Graner-Glazier Hamiltonian (adhesion L811-815,
          volume L816-817, Savill-Hogeweg haptotaxis L818-819, Metropolis L820) coupled to the continuum
          through the PDE's own Hill switch (L790-793) and a two-way fibronectin law (L796-798), with
          the adhesion energy exact within each stride-3 sub-sweep; the micromass solver now uses the
          Hillen-Painter volume-filling form (L605-606) and reaches a resolved solution (clip fraction
          0.000). Deductions: the 1D haptotaxis step (L353-365) collapses R(x) onto the two clip levels
          for fa = 11 and 18 (clip_fraction_R = 1.00; 0.52 at fa = 6) and the 2D wing step (L495-512)
          pins 19.3 % of R(x, z), so the reported condensation amplitudes, std(R) and the F-R
          correlation r = 0.9997 are set by np.clip, not by the PDE (-10); the 1D and 2D solvers also
          carry uncited factors 3.75 * D_R (L335) and 0.40 (L361) and per-zone dt multipliers (L473)
          that are tuning, not Hentschel (2004) parameters (-4); the GGH volume term uses sub-sweep-stale
          volumes (L816-817), an acknowledged parallel-CPM approximation never validated against a
          sequential update (-3); Kiskowski et al. (2004) itself is not a CPM, so the "as in Kiskowski"
          coupling is a Chaturvedi-style realisation (disclosed, -2); lambda_V = 6 departs from the
          Graner-Glazier lambda = 1 for cell survival (disclosed in the JSON, -1); the stylopod
          condensation exists only in the collapsed continuum, not in the discrete model (-2).
        evidence:
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [678, 862], note: "simulate_ggh_cellular_potts_condensation: GGH Hamiltonian, Hill-switch cell state (L790-793), two-way fibronectin deposition (L796-798), adhesion/volume/haptotaxis dH (L811-819), Metropolis acceptance (L820), checkerboard sub-lattices (L770)", supports: true}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [605, 606], note: "Volume-filling haptotactic sensitivity chi_F R (1 - R/R_max) grad F in the micromass solver (Hillen & Painter 2001); clip fraction now 0.000", supports: true}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [353, 365], note: "1D haptotaxis step without volume filling and with an uncited 0.40 divergence factor; clip_fraction_R = 1.00 for fa = 11 and 18 — condensation amplitudes are clip-determined", supports: false}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [495, 512], note: "2D wing haptotaxis loop (180 explicit steps, denom_R without the 3.75 factor); 19.3 % of R(x, z) pinned at the clip bounds, digit condensations are single-pixel lines (Panel B)", supports: false}
          - {file: morphoeval/lean/loops/Loop_014_tgfb_fibronectin_limb.lean, lines: [131, 191], note: "Lean Laws 4-5: GGH sorting condition 2 J_ld > J_ll + J_dd and Metropolis haptotactic acceptance, 0 sorrys, verified with `lean`", supports: true}
      specimen-match:
        value: 76
        rationale: >-
          Credit: Panel E/F still segment the SHA-256-locked Gallus wing into 1 / 2 / 3 elements
          (L1027-1084) and Panel H compares theory, PDE and specimen counts; Panel I shows discrete GGH
          cells visibly condensing inside the continuum Hill contour and Panel J shows compact discrete
          zeugopod (2) and autopod (3) condensations at the digit positions, which is the first
          cell-level morphology in this loop. Deductions: the 1D and 2D wing "condensations" in Panels
          B and C are one-pixel-wide clip spikes rather than the several-cell-wide condensations of
          Hentschel Figs. 2-4 or the specimen's bone widths (-8); the micromass morphospace (Panel D) no
          longer shows a spot vs stripe distinction — both regimes are labyrinthine bands, so the Miura &
          Shiota (2000) nodular-island phenotype in the dataset is not reproduced (-6); the GGH wing bud
          forms no stylopod condensation (Panel J: GGH m = 0 vs PDE m = 1 vs specimen 1 humerus) (-4);
          no side-by-side with a Kiskowski (2004) or Chaturvedi (2005) cell-lattice figure (-3); the
          GGH sheet dewets into medium holes (Panel I) that have no counterpart in a confluent micromass
          (-3).
        evidence:
          - {file: docs/media/tgfb_fibronectin_limb_comparison.png, lines: [0, 0], note: "12-panel figure: Panels I-L add GGH lattice (cells inside red Hill contour), wing-bud discrete condensations [0, 2, 3], 4-regime kinetics, parity bars; Panels B/C show 1-px clip spikes; Panel D shows two labyrinths", supports: true}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [1027, 1084], note: "Cross-sectional osteological peak detection across stylopod (1), zeugopod (2), autopod (3) on chick_limb_chondrogenesis_specimen.jpg", supports: true}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [1287, 1325], note: "Panels I-J: GGH cell types with outlines and continuum Hill(c_a) = 1/2 contour; per-compartment GGH vs PDE counts annotated", supports: true}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [1163, 1179], note: "Panel D labels now report islands/area for 'WT (thresholded)' vs '+TGF-beta2 (fused)'; no spot regime exists", supports: false}
      parameter-expressivity:
        value: 84
        rationale: >-
          Credit: the FGF zonation sweep (L955-995) still produces [1, 2, 3, 4]; the four GGH regimes
          (L865-910) form a genuine 2 x 2 ablation (differential adhesion x haptotaxis) whose
          condensation index orders monotonically WT > DA-only > haptotaxis-only > ablation and whose
          heterotypic fraction drops only when differential adhesion is on; new CLI flags `--cpm-mcs`,
          `--cpm-wing-mcs`, `--mu-F`, `--J-R2R2` (L1737-1740) are resolved at call time (L725-732).
          Deductions: the Panel G chi_F sweep (L1231-1258) reports std(R) on clip-collapsed fields, so
          its plateau at 0.76 is the clip ceiling, not a haptotaxis response (-6); the GGH wing-bud
          count is prepattern-determined — the full ablation also yields [0, 2, 3] (L913-949), so that
          panel does not test cell behaviour (-4); haptotaxis adds only +0.15 to the condensation index
          and mu_F was tuned by hand to 10 because mu_F >= 25 fingers cells across the Hill boundary
          (disclosed in the JSON) — no mu_F sweep is rendered (-4); no T or lambda_V sweep (-2).
        evidence:
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [865, 910], note: "run_cpm_micromass_coupling: WT / DA-only / haptotaxis-only / full-ablation GGH regimes on the x3 prepattern plus continuum condensation index", supports: true}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [1727, 1755], note: "CLI: --fa, --L-AP-um, --Da, --Di, --chi-F, --k-F, --steps, --seed, --cpm-mcs, --cpm-wing-mcs, --mu-F, --J-R2R2, --self-test", supports: true}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [1231, 1258], note: "Panel G chi_F sweep uses std(R) of clip-collapsed 1D fields (clip fraction 1.00 at fa = 11)", supports: false}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [913, 949], note: "run_cpm_wing_bud_coupling counts peaks of the R2 density; ablation gives the same [0, 2, 3] (prepattern-determined)", supports: false}
      morphometric-validation:
        value: 80
        rationale: >-
          Credit: `measure_morphoeval()` (L1457-1612) now returns 14 measurements, every one with a
          reference value; the 6 new ones quantify the discrete-continuum parity (condensation index
