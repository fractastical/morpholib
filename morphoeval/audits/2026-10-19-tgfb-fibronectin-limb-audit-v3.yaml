        evidence:
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [129, 162], note: "EXPECTED_SHA256 for 5 dataset files incl. kiskowski_ggh_cpm_reference.json; runtime verification", supports: true}
          - {file: datasets/tgfb_fibronectin_limb/kiskowski_ggh_cpm_reference.json, lines: [1, 62], note: "GGH parameter/metric table with DOIs, provenance notes and the Kiskowski (lattice model) vs GGH attribution", supports: true}
          - {file: datasets/tgfb_fibronectin_limb/paper_citations.bib, lines: [55, 113], note: "5 Pass 3 BibTeX entries with DOIs and usage notes", supports: true}
          - {file: datasets/tgfb_fibronectin_limb/README.md, lines: [31, 43], note: "Pass 3 contents and findings (collapse artefact, stylopod gap)", supports: true}
