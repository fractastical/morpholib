          attribution; `paper_citations.bib` gains 5 DOIs (Graner 1992, Glazier 1993, Savill 1997,
          Hillen 2001, Tapia 2011) and the README records the Pass 3 findings. Deductions: Kiskowski
          (2004) figure/table values are not extracted, so the discrete model has no quantitative
          literature anchor (-4); the 1D/2D tuning factors (3.75, 0.40, dt multipliers) have no
