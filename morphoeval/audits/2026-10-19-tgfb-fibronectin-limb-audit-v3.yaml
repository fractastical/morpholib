          vs 45-55 % Miura & Shiota ranges because the model cannot reproduce them (-4); no uncertainty
          (seed replicates) on any GGH metric (-3).
        evidence:
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [1551, 1611], note: "6 Pass 3 measurements: GGH condensation index, heterotypic boundary fraction, discrete-continuum R2 Pearson r, GGH wing compartment total, 2D wing clip fraction, resolved micromass island counts", supports: true}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [1470, 1549], note: "8 Pass 2 measurements retained (stage counts, 2D total, F-R r, controls, specimen spacing ratio) — counts valid, amplitudes clip-determined", supports: true}
          - {file: datasets/tgfb_fibronectin_limb/kiskowski_ggh_cpm_reference.json, lines: [42, 49], note: "Metric definitions (condensation index, heterotypic boundary fraction, discrete-continuum r, compartment counts, clip_fraction_R) used by measurements 9-14", supports: true}
          - {file: 2004-hentschel-tgfb-fibronectin-limb.py, lines: [1572, 1580], note: "r(R2 disc, R2 cont) reference_value 0.9 is an adopted threshold, not a literature value (stated in reference_source)", supports: false}
      source-traceability:
        value: 94
        rationale: >-
          Vendors 5 SHA-256-pinned files in `datasets/tgfb_fibronectin_limb/` (L129-146, verified
          fail-closed at L151-162 on every run), including the new `kiskowski_ggh_cpm_reference.json`
