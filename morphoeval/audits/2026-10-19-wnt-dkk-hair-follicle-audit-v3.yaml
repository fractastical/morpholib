        evidence:
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [129, 160], note: "EXPECTED_SHA256 (bib re-pinned 7843d2b7...) and fail-closed runtime verification", supports: true}
          - {file: datasets/wnt_dkk_hair_follicle/wnt_dkk_hair_follicle_reference.json, lines: [174, 215], note: "dermal_condensate_model block: equations, parameters, genotype expectations, sources", supports: true}
          - {file: datasets/wnt_dkk_hair_follicle/paper_citations.bib, lines: [44, 120], note: "7 references appended in Pass 3 (Keller & Segel, Huh, Glover, Botchkarev, Mou, Paus, Painter & Hillen)", supports: true}
          - {file: datasets/wnt_dkk_hair_follicle/README.md, lines: [12, 13], note: "D_w/D_h/d corrected to 0.015/0.45/30 (Pass 2 README said 0.01/0.40/40)", supports: true}
