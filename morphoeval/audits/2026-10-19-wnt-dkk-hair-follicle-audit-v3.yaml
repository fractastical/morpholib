          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [1457, 1609], note: "13 measurements with reference_value/source; 6 dermal measurements added in Pass 3 (L1479-L1538)", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [1580, 1589], note: "K14-Wnt ratio reference_value set to null with explanation (Sick et al. report no numeric ratio)", supports: true}
