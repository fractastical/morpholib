# MorphoEval audit — Sick et al. (2006) Science & Andl et al. (2002) WNT/DKK Hair Follicle Spacing Morphogenesis, 2026-10-19 (v3)
#
# Pass 3 re-score of `2002-sick-wnt-dkk-hair-follicle.py` (v3, 1768 lines; 12 self-test checks; 13 measurements)
# after the remediation round of the instrumented loop `morphoeval/runs/2026-10-19-wnt-dkk-hair-follicle-loop-pass3`,
# superseding `2026-10-19-wnt-dkk-hair-follicle-audit-v2` (91.9 consensus; 94/91/90/92/95/92/92).
#   - Primary assessor: Claude Fable 5.1 (Cursor agent, Pass 3 builder + assessor; same checkpoint, line numbers
#     verified against the file as it is at commit 64526a0 + this working tree).
#   - Second assessor: none ran in Pass 3 (single-assessor round; the v2 second-assessor block is retained for
#     provenance but no second score is claimed).
#
# What Pass 3 changed (the single open v2 remediation item + defects exposed while doing it):
#   1. CLOSED — "Couple the 2D epidermal WNT/DKK sheet to a 3D dermal condensate mesenchymal chemotaxis
#      (FGF20/BMP4) model to simulate hair peg downgrowth": Section 3b (L654-L969) adds a 42x42x12 dermal slab
#      (lateral periodic, zero-flux in depth) beneath the WT placode field. FGF20 is sourced by the placodes at
#      z = 0 (L835), BMP4 is produced by the dermis (L836), mesenchymal density follows Keller-Segel chemotaxis
#      with volume filling through a conservative face-flux scheme (`chemotactic_divergence_3d`, L707-L723), and
#      each placode carries a hair-peg depth ODE slaved to the dermal condensate (DC) beneath it (L847). Genotypes:
#      WT 15/15 DCs (mean lateral offset 0.41 px), Fgf20-null 0 DCs / 0 downgrowth, chemotaxis-null 0 DCs, 5x BMP4
#      excess 0 DCs; 5-point chi_f sweep monotone (r = 0.913); mesenchymal mass drift 0.0; epidermis-free dermal
#      subsystem linearly stable for all q (instructed, not spontaneous, condensation). Row D of the figure and a
#      15-frame Phase 3 GIF segment render it. Six new measurements, four new self-test checks (9-12), CLI --chi-f.
#      Honest reduction (stated in code, README and here): planar epidermis as a source term, one-way coupling,
#      scalar peg depth, ordinal Paus (1999) stages as a model convention — NOT a deforming-tissue FEM.
#   2. FOUND + FIXED — the Pass 2 placode counter (`ndi.label` without the periodic seam) double-counted
#      seam-straddling placodes: the headline "16 WT placodes = 16 specimen placodes" was 14 seam-aware threshold
#      components (one a fused touching pair) + 2 seam duplicates. Placodes are now periodic local WNT maxima
#      (`label_periodic_2d`, `periodic_centroids_2d`, L456-L507; L551-L552): WT 15, K14-Wnt 30 (was 32 in code,
#      22 in docstring/JSON), enlarged 10 (was 12), area +38.5% (was +45%). JSON, docstrings and self-test updated;
#      the invented "2.0" K14-Wnt reference ratio is withdrawn (reference_value null, L1584-L1586).
#   3. FOUND + FIXED — parameter parity: `math_kg_loops` yaml carried kappa 0.04, D_w 0.01, D_h 0.40, d 40 and the
#      dataset README D_w 0.01 / D_h 0.40 / d 40, disagreeing with the JSON and the script (0.02, 0.015, 0.45, 30).
#   4. Lean 4: 3 new laws (`dermal_subsystem_instructed_stable`, `keller_segel_fourier_det_sign` +
#      `ks_det_neg_of_supercritical`, `hair_peg_depth_monotone` + `hair_peg_depth_closed_form`), 0 sorrys,
#      `lean` exit 0, registered in `morphoeval/math_kg_loops/sick-wnt-dkk-hair-follicle.yaml` (6 equations).
#   5. Seven references appended to `paper_citations.bib` (SHA-256 re-pinned in the script and the JSON).
#
# Net effect on the score: DOWN, 91.9 -> 85.9. The remediation item is closed, but doing it exposed that the
# Pass 2 specimen-match and morphometric headline rested on a counting artifact, that the K14-Wnt regime is a
# confounded multi-parameter change, and that the vendored specimen (a Gad1 in situ of vibrissa placodes) is a
# loose stand-in for Sick et al.'s pelage pattern (NN-spacing CV 0.086 PDE vs 0.323 specimen). Those are now
# listed as Pass 4 remediation items rather than hidden behind a matching integer.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files in this working tree (checkpoint 64526a0 + Pass 3 edits).

