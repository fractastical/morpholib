        2002-sick-wnt-dkk-hair-follicle.py:771-925 (peg ODE at 847, stage thresholds at 888-891) — the dermal
        coupling is one-way and the hair peg is a scalar depth with ordinal stage cut-offs at 25%/50% of a 12-layer
        slab. Replace the scalar with an epidermal invagination field (phase-field or level-set interface driven by
        the DC), add DC -> epidermis feedback (DC-derived Noggin/FGF maintaining the placode), and calibrate slab
        depth and peg length to micrometres from Paus et al. (1999) / Huh et al. (2013) sections so the stage
