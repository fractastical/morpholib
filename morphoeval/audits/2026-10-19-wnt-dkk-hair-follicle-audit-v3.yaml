simulations:
  - id: sick-wnt-dkk-hair-follicle
    name: "Sick et al. (2006) & Andl et al. (2002) WNT/DKK reaction-diffusion hair follicle spacing, secondary wave insertion, transgenic phenotypes & (Pass 3) 3D dermal condensate FGF20/BMP4 chemotaxis with hair peg downgrowth"
    organism: "Embryonic mouse (Mus musculus) epidermal hair follicle placode lattice with dermal condensate formation and hair peg downgrowth; K14-Wnt / Dkk1 / Fgf20-null / BMP4-excess genotypes"
    script: 2002-sick-wnt-dkk-hair-follicle.py
    output: docs/media/wnt_dkk_hair_follicle_comparison.png
    extra_outputs:
      - docs/media/wnt_dkk_hair_follicle_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-wnt-dkk-hair-follicle-audit-v2
    source_refs:
      - sick2006
      - andl2002
      - gierer1972
      - maddox2004
      - kellersegel1970
      - huh2013
      - glover2017
      - botchkarev1999
      - mou2006
      - paus1999
      - painter2002
    claim_boundary:
      reported_in_source:
        - "Sick et al. (2006): WNT (short-range activator) and DKK (long-range inhibitor) form a Turing/Meinhardt reaction-diffusion pair that sets pelage follicle spacing; K14-Dkk1 overexpression reduces/abolishes follicles, altered WNT/DKK balance enlarges or crowds placodes, and a secondary follicle wave inserts between primary follicles as the skin grows"
        - "Andl et al. (2002): ectopic Dkk1 blocks follicle initiation (no placodes)"
        - "Huh et al. (2013): placode-derived FGF20 is required for primary and secondary dermal condensates; Fgf20-null placodes form but do not progress"
        - "Glover et al. (2017): dermal cells aggregate directly beneath placodes by directed migration toward placode FGF20"
        - "Botchkarev et al. (1999), Mou et al. (2006): BMP4 inhibits follicle induction / dermal condensation; Noggin/EDA antagonise it"
        - "Paus et al. (1999): ordinal morphological stages placode -> hair germ (with DC) -> hair peg"
      reconstructed_in_script:
        - "Saturating Gierer-Meinhardt WNT/DKK PDE with exact steady state, Jacobian and d_c = (sqrt2+1)^2; 1D primary wave -> 2x expansion -> secondary insertion (4 -> 8); 2D WT / K14-Wnt / enlarged / Dkk1 / equal-diffusion regimes; Dkk1 dosage and domain-length sweeps; optical-density segmentation of the vendored specimen"
        - "(Pass 3) 3D dermal slab beneath the WT placode field: FGF20 sourced at z = 0 by the placodes, BMP4 produced by the dermis, Keller-Segel chemotaxis with volume filling in conservative face-flux form, per-placode hair-peg depth ODE, WT / Fgf20-null / chemotaxis-null / BMP4-excess genotypes, chi_f sweep, dermal linear stability, seam-aware placode counting"
      transfer_boundary:
        - "All parameters are dimensionless and chosen to produce the qualitative regimes; none of D_w, D_h, mu, rho, kappa, D_f, mu_f, chi_f, chi_b, D_rho, v_peg is traced to a measured value or to Sick et al.'s SOM parameter table"
        - "The vendored specimen is a Gad1 whole-mount in situ of E12.5-E13.5 vibrissa/hair placodes (Maddox & Condie 2004), not a pelage pattern from Sick et al.; the PDE lattice (15 placodes, NN-spacing CV 0.086) and the specimen (16 segmented placodes, CV 0.323) agree in count only approximately and disagree in regularity"
        - "The K14-Wnt regime changes D_w, D_h and kappa together with rho_w, so it is a 'denser lattice' preset rather than a pure WNT-overexpression perturbation"
        - "The dermal coupling is one-way (placodes -> dermis); the epidermis stays planar and peg downgrowth is a scalar depth per placode; stage thresholds 25%/50% of slab depth are a model convention"
      does_not_claim:
        - "A deforming epithelial interface or tissue mechanics of invagination, DC -> epidermis feedback (DC-derived Noggin/FGF), follicle-type specification by DC size, calibration of slab depth or peg depth to micrometres, or numerical parity with Sick et al.'s own simulation parameters"
    summary: >-
      Pass 3 (v3) evaluation of `2002-sick-wnt-dkk-hair-follicle.py` (85.9/100, down 6.0 from 91.9 in Pass 2).
      The single open Pass 2 item is closed: a 42x42x12 dermal FGF20/BMP4 Keller-Segel chemotaxis slab is
      coupled beneath the WT placode lattice, forms one dermal condensate under each of the 15 placodes (mean
      lateral offset 0.41 px), drives hair-peg downgrowth to 67% of slab depth in WT, and reproduces the
      Fgf20-null (0 DCs, placodes persist, no downgrowth), chemotaxis-null and BMP4-excess suppressions; the
      scheme conserves mass exactly, the chi_f sweep is monotone, and three new Lean 4 laws cover the dermal
      stability, the Keller-Segel threshold and peg monotonicity. The score falls because the remediation exposed
      that Pass 2's headline specimen match (16 = 16) was a seam double-counting artifact (true count 15 periodic
      maxima / 14 components), that the K14-Wnt regime is a confounded preset, that the invented 2.0 density
      reference had no source, and that the specimen regularity (CV 0.323) does not match the PDE lattice
      (CV 0.086). These are now stated in the code, the JSON and the measurements rather than hidden.
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          The WNT/DKK core is still faithful: saturating activator-inhibitor PDEs with the exact unsaturated steady
          state, Jacobian, d_c = (sqrt2+1)^2 and dispersion (L171-L249), 1D primary -> secondary insertion
          (L341-L397), 2D regimes (L509-L652). Pass 3 adds the requested dermal dimension as a reduced but
          mechanistic model: FGF20 sourced by placodes, dermally produced BMP4, Keller-Segel chemotaxis with volume
          filling in conservative form, peg depth slaved to the DC (L654-L969), with a correct linear analysis
          showing condensation is epidermally instructed (L726-L768; Lean Law 4). Deductions: the coupling is one-way
          and the epidermis never deforms (-4); the K14-Wnt regime changes D_w, D_h and kappa together with rho_w
          (L600-L603) so the 'overexpression' phenotype is not a single-parameter perturbation (-4); BMP4 is produced
          uniformly in proportion to rho with no interfollicular-epidermal source (L836) and the FGF20 source
          S(x,y) is a thresholded, rescaled w rather than a modelled Fgf20 transcriptional response (L806-L807)
          (-3); no parameter is taken from Sick et al.'s SOM table and the dermal constants are hand-tuned (-3).
        evidence:
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [171, 249], note: "Exact WNT/DKK steady state, Jacobian J_0, d_c = (sqrt2+1)^2 and dispersion Re sigma(k) for d = 30, d_c and d = 1", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [699, 723], note: "7-point slab Laplacian (periodic x,y / zero-flux z) and conservative face-flux chemotactic divergence with volume-filling mobility m = rho(1 - rho/rho_max)", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [826, 848], note: "Time loop: FGF20 source at z = 0 (L835), dermal BMP4 production (L836), chemotaxis up f / down b (L837-L841), per-placode peg ODE (L847)", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [726, 768], note: "Linearised dermal subsystem (-tr, det >= 0 for all q) and autonomous Keller-Segel comparison; matches Lean Laws 4-5", supports: true}
          - {file: morphoeval/lean/loops/Loop_006_wnt_dkk_hair_follicle.lean, lines: [87, 169], note: "Laws 4-6: dermal_subsystem_instructed_stable, keller_segel_fourier_det_sign + ks_det_neg_of_supercritical, hair_peg_depth_monotone + closed_form (lean exit 0, 0 sorrys)", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [600, 603], note: "K14-Wnt 'overexpression' preset also changes kappa 0.02 -> 0.015, D_w 0.015 -> 0.008, D_h 0.45 -> 0.32: confounded, not a pure rho_w perturbation", supports: false}
      specimen-match:
        value: 80
        rationale: >-
          Panels B1-B3 and C1 are visually distinct and the segmented specimen with its Delaunay graph is
          shown side by side with the PDE lattice; row D now shows the 3D condensates, an x-z section with
          pegs and the genotype downgrowth curves, and the GIF carries a 15-frame Phase 3. Deductions: the Pass
          2 claim that the WT lattice 'matches the 16 segmented placodes' was a seam-duplication artifact — the
          corrected count is 15 periodic maxima (14 components) and, more importantly, the nearest-neighbour
          spacing regularity disagrees (CV 0.086 PDE vs 0.323 specimen) (-8); the specimen is a Gad1 in situ of
          vibrissa/hair placodes (Maddox & Condie 2004), not Sick et al.'s pelage pattern, so the comparison is a
          stand-in (-5); row D has no histological or live-imaging reference image (Huh 2013 / Glover 2017 /
          Paus 1999) beside the model, so DC shape, depth and peg morphology are judged against nothing (-5);
          the saturated 'ringing' regime (B3) shows plateaus, not the annular rings described in the text (-2).
        evidence:
          - {file: docs/media/wnt_dkk_hair_follicle_comparison.png, lines: [0, 0], note: "12-panel figure: B1 WT lattice (N = 15), C1 Mus musculus specimen segmentation (N = 16) with Delaunay graph, D1 3D DC voxels + pegs, D2 x-z section, D3 downgrowth curves", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [974, 1042], note: "Optical-density segmentation of the vendored specimen; 16 placodes, NN 70.86 +- 22.92 px, CV 0.3234", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [456, 507], note: "Seam-aware labelling and circular-mean centroids added in Pass 3; placodes now periodic local maxima (L551-L552)", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [1570, 1579], note: "WT count 15 vs specimen 16 and CV 0.086 vs 0.323 reported in the measurement note — regularity does not match", supports: false}
          - {file: datasets/wnt_dkk_hair_follicle/wnt_dkk_hair_follicle_reference.json, lines: [57, 70], note: "Specimen is Gad1 in situ of E12.5-E13.5 vibrissa/hair placodes (Maddox & Condie 2004), not a pelage follicle pattern", supports: false}
      parameter-expressivity:
        value: 86
        rationale: >-
          Three real sweeps behave monotonically: Dkk1 dosage rho_h in {0, 0.004, 0.01, 0.02, 0.05, 0.12} gives
          15, 15, 15, 14, 0, 0 placodes (L616-L631, self-test asserts monotone non-increasing), domain length L in
          [20..80] gives r = 0.985 (L400-L441), and the new FGF20 chemotactic sensitivity chi_f in
          {0, 0.1, 0.15, 0.2, 0.25} gives 0, 13, 15, 15, 15 DCs and peg depth 0 -> 0.665 (monotone, r = 0.913)
          (L928-L969). CLI exposes --cw --ch --mu-w --mu-h --Dw --Dh --seed --chi-f (L1728-L1737). Deductions: the
          five epidermal genotypes are multi-parameter presets rather than single-axis sweeps (L600-L611) (-6);
          bmp4_scale is evaluated at one point (5x) with no sweep, so the BMP4 axis is not shown to be monotone
          (L943) (-4); v_peg, e_thr and Z are not exposed and their effect on the stage histogram is unexplored (-4).
        evidence:
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [616, 631], note: "6-point ectopic Dkk1 dosage sweep", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [928, 969], note: "4 dermal genotypes + 5-point chi_f sweep with Pearson r and monotonicity flag", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [1728, 1737], note: "CLI flags incl. new --chi-f", supports: true}
          - {file: 2002-sick-wnt-dkk-hair-follicle.py, lines: [943, 943], note: "BMP4 excess evaluated only at bmp4_scale = 5.0; no sweep", supports: false}
      morphometric-validation:
        value: 84
        rationale: >-
          `measure_morphoeval()` (L1457-L1609) now returns 13 measurements with units, methods and sources: d_c,
          w_*, secondary doubling ratio, WT count vs specimen, K14-Wnt ratio, Dkk1/equal-diffusion count, domain
          scaling r, and six dermal quantities (DC/placode ratio 1.0 vs Huh 2013; Fgf20-null + chemotaxis-null
          DC count 0; DC-placode offset 0.41 px vs 0; Fgf20-null/WT peg ratio 0; chi_f sweep r; mass drift 0).
          Deductions: the only quantitative specimen comparison (NN-spacing CV) disagrees and is reported in a
