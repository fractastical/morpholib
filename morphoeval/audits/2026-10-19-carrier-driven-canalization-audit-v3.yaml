simulations:
  - id: feugier-carrier-driven-canalization
    supersedes_audit_id: 2026-10-19-carrier-driven-canalization-audit-v2
    name: "Feugier, Mochizuki & Iwasa (2005) PIN1 efflux carrier canalization on a Lockhart (1965)-growing hexagonal leaf blade with Scarpella et al. (2004/2006) procambial commitment: sequential 1°→4° vein-order emergence, open trees vs closed areoles vs decelerating no-branching"
    organism: "Arabidopsis thaliana (dicot leaf lamina and procambial venation network)"
    script: 2005-feugier-carrier-driven-canalization.py
    output: docs/media/carrier_driven_canalization_comparison.png
    extra_outputs:
      - docs/media/carrier_driven_canalization_growth_stages.png
      - docs/media/carrier_driven_canalization_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Feugier, Mochizuki & Iwasa (2005) J. Theor. Biol. 236(4):366-375 hexagonal leaf lamina auxin S_i and directional PIN1 carrier P_ij ODEs with conserved total cellular carrier pool P_total = P_{i,cyt} + sum_{j=1}^6 P_ij; accelerating carrier-response functions Phi(J) produce branching vein patterns while linear or decelerating Phi produce no branching; conserved-pool competition yields higher auxin in veins than surrounding tissue"
        - "Scarpella, Francis & Berleth (2004) Development 131:3445-3455: vein orders form sequentially (midvein, then secondaries, tertiaries, quaternaries) during blade expansion; preprocambial domains extend as freely ending strands and fuse with pre-existing veins; procambial identity, once acquired, is not lost"
        - "Scarpella, Marcos, Friml & Berleth (2006) Genes & Development 20:1015-1027 ProPIN1:PIN1-GFP imaging showing epidermal PIN1 convergence points and transient bipolar PIN1 cells bridging strands into closed areoles"
        - "Lockhart (1965) J. Theor. Biol. 8:264-275: irreversible cell expansion rate (1/V)dV/dt = phi * max(0, P - Y) with wall extensibility phi, turgor P and yield threshold Y"
      reconstructed_in_script:
        - "Emergent growing-blade module (`simulate_growing_blade_canalization`): Feugier Eqs. 1-6 integrated on a 26x22 hexagonal mesh whose active blade mask expands by the Lockhart area law A(t) = A_0 exp(phi[(P-Y_0)t - kappa t^2/2]) (A(7)/A(2) = 2.399, arrest at 8 DAG) through four stages (2.0, 3.5, 5.0, 7.0 DAG) with marginal cell birth; 1°, 2°, 3°, 4° vein orders emerge sequentially (4 of 4 orders) with beta_1 = 0 at every stage in the accelerating open-tree regime, beta_1 = 4 closed areoles at 7 DAG under the Scarpella (2004) commitment lock, vein-cell fraction 0.86 (no discrete strands) under decelerating Phi, and no veins under k_1 = 0"
        - "Commitment-delay expressivity sweep tau_commit in {0.5, 1, 2, 4, 8} giving monotone non-increasing beta_1 (Spearman rho = -1.0)"
        - "6-face hexagonal intracellular PIN1 pool conservation and face-competition algebra (`verify_hexagonal_pool_conservation_and_face_competition`): pool error 0.0, winner-take-all share 0.9978 (ref 0.9960), saturated bipolar share 0.5221 (ref 0.5180), 6-regime Pearson r = 0.9999"
        - "Templated topology scaffold (`simulate_hexagonal_venation_models`, Panels A-B): vein paths placed by a shortest-path template, ODEs relaxed on the scaffold, Betti-1 = 0 vs 16 graph readouts — relabelled in Pass 3 as a scaffold / Law 1 & Law 3 check, NOT an emergent result"
        - "Automated ridge + chromatic warmth segmentation of the cleared dicot leaf tip venation skeleton specimen (`leaf_tip_venation_loops_specimen.jpg`, CC BY-SA 4.0, 539x351 px): vein density 0.3585, Betti-1 = 205 closed areoles, mean compactness 0.7749 +- 0.0191 SE"
      transfer_boundary:
        - "2D hexagonal cellular lattice with Lockhart area growth and marginal cell addition mapped to a cleared dicot leaf venation skeleton; blade growth is applied to the area/mask only (no per-cell anisotropic expansion, no carrier dilution by growth)"
        - "The 'closed areole' mechanism is Scarpella (2004/2006) procambial commitment, implemented as a sustained-flux lock, not a Feugier (2005) result"
      does_not_claim:
        - "3D viscoelastic cell-wall FEM, turgor-driven anisotropic cell expansion, or stress feedback on PIN1 polarity"
        - "That Feugier et al. (2005) report closed loops under saturating Phi (withdrawn in Pass 3: the paper reports no branching under decelerating Phi, which the `decelerating_no_branching` regime reproduces)"
        - "Quantitative agreement of the simulated areole count (beta_1 = 4 on a 407-cell blade) with the specimen's 205 areoles; only the topological class (open tree vs reticulate) is compared"
    source_refs:
      - feugier2005
      - scarpella2004
      - scarpella2006
      - kang2004
      - lockhart1965
      - kuchen2012
      - rollandlagan2005
      - stoma2008
    summary: >-
      Pass 3 (v3) evaluation of `2005-feugier-carrier-driven-canalization.py` (overall weighted score
      91.9/100, down from 93.1/100 in v2). The Pass 2 remediation item is closed: a new Section 3b
      couples the Feugier (2005) hexagonal PIN1 carrier-flux ODEs to a Lockhart (1965) yield-threshold
      growing blade mesh (allometric mask, marginal cell birth, four stages 2.0-7.0 DAG) and produces
      sequential 1°→2°→3°→4° vein-order emergence (4/4 orders) with beta_1 = 0 at every stage for the
      accelerating open-tree regime, beta_1 = 4 closed areoles under the Scarpella (2004) irreversible
      commitment lock, a diffuse all-polarized sheet (vein fraction 0.86) under decelerating Phi
      (Feugier result 2), and nothing under k_1 = 0. Three new Lean 4 theorems (Lockhart yield-threshold
      growth, growth-event Betti-1 bookkeeping, commitment-lock monotonicity) bring the file to 6 theorems
      with 0 sorrys; `measure_morphoeval()` grows to 15 measurements and `--self-test` to 15 checks (27 s).
      The pass also corrects the record: the primary citation (236(4):366-375), the withdrawn "Model B →
      closed loops" attribution to Feugier, and the relabelling of Panels A-B as a templated scaffold. The
      net score falls because v2 had credited those defects as supporting evidence and because the new
      growing-blade reference values (`growing_blade_reference.json`) are internally authored expectations
      rather than externally digitised stage-resolved areole counts.
    scores:
      model-fidelity:
        value: 91
        rationale: >-
          The emergent growing-blade module (`simulate_growing_blade_canalization`, L862-1076) integrates the
          Feugier Eqs. 1-6 (flux kernel L933-1003, pool conservation error 0.0, flux antisymmetry error 0.0)
          on a Lockhart-growing mask (`lockhart_blade_area`, `blade_mask_at_growth_fraction`, L699-813) and
          reproduces Feugier's own dichotomy — accelerating Phi = J^2 → branching open tree (beta_1 = 0 at all
          four stages), decelerating Phi = J^2/(1+(J/K)^2) → no discrete branching (vein fraction 0.86) — plus
          the Scarpella (2004) commitment lock (L998-1001) that converts transient bipolar cells into closed
          areoles (beta_1 = 4). Debits: Panels A-B still render the Pass 2 shortest-path template
          (`simulate_hexagonal_venation_models`, L421-693) which is not an emergent result; the commitment
          lock is switched on by stage index (`commitment_on = ... s_idx >= 1`, L979) rather than by auxin
          history; the midvein is seeded by an apex convergence point (L948) rather than emerging; growth
          acts only on the mask (no per-cell expansion, no carrier dilution); emergent 3°/4° strands are 2-3
          cells wide in the stage figure, wider than the single-file procambial strands of Scarpella (2006).
