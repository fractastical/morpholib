simulations:
  - id: delphi10000-dugesia-japonica-turing-wavelength-s0
    name: "Saturated Schnakenberg Turing wavelength for Dugesia japonica dorsal pigment at 6.912 µm (Holocene, Pass 2)"
    organism: "Dugesia japonica (freshwater planarian)"
    script: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py
    output: docs/media/dugesia_japonica_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/dugesia_japonica_turing_wavelength_s0_growth.gif
      - datasets/dugesia_japonica_turing_wavelength_s0/dugesia_japonica_turing_wavelength_s0_metrics.json
    status: evaluated
    supersedes_audit_id: 2026-10-27-dugesia-japonica-turing-wavelength-s0-audit
    source_refs: [turing1952, gierer1972, schnakenberg1979, murray1981, kondo2009, nogi2009, orii2002, lapan2012, herath2020]
    summary: >-
      Pass 2 keeps the same kinetics and the same 6.912 µm linear wavelength.
      The saturated steady field peaks at Fourier mode 6, λ = 8.064 µm, which is
      reported beside λ_c rather than tuned away. Diffusion ratio R from 36 to 120
      shortens λ monotonically, and equal diffusion (R = 1) has max σ = -0.565.
      Interior gray KS distance against the Nogi plate is D = 0.434 (reference
      null 0.5). The Kalininsky wild-type voucher yields two bodies with mean
      circularity 0.307. Linear dispersion Pearson r remains 0.99998.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) gives the diffusion-driven instability and the critical wavenumber."
        - "Schnakenberg (1979), Gierer & Meinhardt (1972), and Murray (1981) supply the kinetics and the pigment-prepattern reading."
        - "Nogi et al. (2009) published the CC BY 2.5 regenerated Dugesia japonica plate. Kalininsky's iNaturalist photo 226612281 is CC BY 4.0."
      reconstructed_in_script:
        - "κ = 0.15, R = 48, D_u solved for λ_c = 6.912 µm, spectral integrator, seed 3213."
        - "Nonlinear radial-FFT wavelength, KS interior comparison, diffusion-ratio sweep, and equal-diffusion ablation."
        - "Pale-body segmentation of the wild-type voucher."
      transfer_boundary:
        - "Kondo (2009) is a fish pigment wave. Lapan & Reddien (2012) is Schmidtea eye regeneration. Herath & Lobo (2020) is planarian fission, not this wavelength."
        - "Neither specimen plate is a calibrated 6.912 µm micrograph."
      does_not_claim:
        - "Does not claim 6.912 µm was measured on this species. It is the slot's detail-scale operating point (6.912e-6 m, log10 = -5.160), age 0 Ma."
        - "Does not claim a fossil predecessor. Chronoseries 1/1."
        - "Does not claim the brightness mask separates every worm on the Nogi plate."
    scores:
      model-fidelity:
        value: 88
        rationale: "Same saturated Schnakenberg system and wavenumber formula as Pass 1. Pass 2 states the nonlinear shift (8.064 µm versus 6.912 µm) instead of treating the linear wavelength as the steady-state peak. κ and R are still chosen for this slot, not taken from a Dugesia pigment paper."
        evidence:
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [122, 156], note: "Saturated Jacobian and D_u solved from k_c", supports: true}
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [458, 470], note: "dominant_wavelength_um on the steady activator", supports: true}
      specimen-match:
        value: 86
        rationale: "The 640 px, 16-frame GIF still paints the field through the Nogi body mask (CV similarity 94.7). Pass 2 does not pretend the wild-type rocks-and-worms photo is the same object; it measures that voucher separately. Merged outlines on the regeneration plate remain visible."
        evidence:
          - {file: docs/media/dugesia_japonica_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "16 frames, 640 px, CV 94.7 against the Nogi plate", supports: true}
          - {file: docs/media/dugesia_japonica_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Plate, render, field, dispersion, sweep, ablation", supports: true}
      parameter-expressivity:
        value: 90
        rationale: "The figure plots λ(R) from 36 to 120, falling from 7.002 µm to 6.758 µm, and the equal-diffusion bar is negative while σ(k_c) at R = 48 is positive. Self-test asserts the monotonicity."
        evidence:
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [582, 602], note: "Sweep curve and ablation bars on the comparison figure", supports: true}
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [344, 360], note: "diffusion_ratio_sweep at fixed operating-point D_u", supports: true}
      morphometric-validation:
        value: 90
        rationale: "Pearson r = 0.99998 on the linear modes. Nonlinear peak 8.064 µm versus reference 6.912 µm. KS D = 0.434 versus reference 0.5. Nogi circularity 0.261 versus 0.55. Ocelli 7 versus 2. Wild-type circularity 0.307 versus 0.55. None of these values is copied onto its reference."
        evidence:
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [494, 508], note: "ks_specimen_vs_render", supports: true}
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [729, 756], note: "nonlinear wavelength, KS, and iNat circularity in measure_morphoeval", supports: true}
      source-traceability:
        value: 92
        rationale: "Pass 1 provenance stands. The wild-type voucher is now actually measured, and both SHA-256 digests remain in the reference JSON."
        evidence:
          - {file: datasets/dugesia_japonica_turing_wavelength_s0/paper_citations.bib, lines: [1, 80], note: "Crossref-checked DOIs including Nogi 2009 and the iNaturalist credit", supports: true}
          - {file: datasets/dugesia_japonica_turing_wavelength_s0/README.md, lines: [1, 28], note: "6.912 µm, 0 Ma, both licences", supports: true}
      code-traceability:
