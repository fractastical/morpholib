        rationale: "--self-test now also checks a non-flat patch, a nonlinear wavelength off 6.912 µm, and at least one wild-type body. Seed, grid, and commands are unchanged. Still one assessor, and no nanopub signature because this VM has no ~/.nanopub/profile.yml."
        evidence:
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [759, 808], note: "self_test including nonlinear wavelength and iNat mask", supports: true}
          - {file: datasets/dugesia_japonica_turing_wavelength_s0/dugesia_japonica_turing_wavelength_s0_metrics.json, lines: [1, 20], note: "Pass 2 metrics JSON written by the script", supports: true}
