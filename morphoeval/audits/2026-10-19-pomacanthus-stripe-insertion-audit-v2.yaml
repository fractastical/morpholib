    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Kondo & Asai (1995) Nature 376(6543):765-768 piecewise-linear saturating Gierer-Meinhardt reaction-diffusion PDE on an expanding skin domain L(t) = L_0 exp(gamma t), mid-trough secondary stripe insertion cascade (3 -> 6 -> 12 -> 24 stripes) in Pomacanthus semicirculatus, and 2D horizontal Y-junction branch point unzipping in Pomacanthus imperator"
        - "Gierer & Meinhardt (1972) Kybernetik 12:30-39 short-range autocatalytic activation and long-range lateral inhibition"
      reconstructed_in_script:
        - "1D and 2D IMEX spectral solvers for the Kondo-Asai piecewise-linear saturating PDE across stationary domain doubling scales s in {1, 2, 4, 8} (body length 2, 4, 8, 16 cm -> 3, 6, 12, 24 stripes), subcritical inhibitor-diffusion control D_I = 0.050 < d_c D_A (0 stripes), continuous growing-domain kymograph (3 -> 6 -> 12 stripes), and 2D Y-branch horizontal unzipping (3 -> 4 stripes, +0.663 domain fraction displacement)"
        - "Computer-vision segmentation of juvenile Pomacanthus semicirculatus specimen (`pomacanthus_semicirculatus_specimen.jpg`, CC BY-SA 4.0) extracting 115 inter-stripe spacings (3.80 mm mean wavelength at 40 mm body span, CV = 0.3435), alternating primary vs newly inserted secondary mid-trough stripe prominence ratio (2.65x), and bimodal Kondo-Asai waveform correlation (r = 0.858)"
      transfer_boundary:
        - "1D and 2D planar piecewise-linear reaction-diffusion PDE mapped to juvenile Pomacanthus semicirculatus lateral flank stripes and Pomacanthus imperator Y-junction dislocations"
      does_not_claim:
        - "Discrete chromatophore-level cell-cell contact-dependent depolarization or 3D curved body-fin boundary mechanics"
    source_refs:
      - kondo1995
      - gierer1972
      - crampin1999
      - kondo2009
    summary: >-
      Pass 2 post-remediation evaluation of `1995-kondo-pomacanthus-stripe-insertion.py`
      (92.0/100, up from 54.7/100 in Pass 1; +37.3 overall). The remediated script integrates
      the nonlinear 1D and 2D Kondo & Asai (1995) piecewise-linear saturating Gierer-Meinhardt
      reaction-diffusion PDE dA/dt = min(F_max, max(0, c_1 A + c_2 I + c_3)) - g_A A + D_A Lap(A),
      dI/dt = min(G_max, max(0, c_4 A + c_5)) - g_I I + D_I Lap(I), verifying the interior
      steady state (A*, I*) = (3.0, 2.5), critical diffusivity ratio d_c = 5.2 + 1.6*sqrt(10) =
      10.2596, and intrinsic wavelength lambda_c = 3.4739 with 0.000% simulated wavelength error
      across the 5-regime P. semicirculatus doubling cascade (N = 3, 6, 12, 24 stripes for body
      lengths 2, 4, 8, 16 cm and N = 0 for subcritical control D_I = 0.050, RMSE = 0.0000),
      continuous growing-domain mid-trough stripe insertion (3 -> 6 -> 12 stripes), 2D
      P. imperator Y-junction horizontal unzipping (+0.6627 displacement converting 3 -> 4
      posterior stripes), and automated CV segmentation of the CC BY-SA 4.0 juvenile
      Pomacanthus semicirculatus specimen (`pomacanthus_semicirculatus_specimen.jpg`, inter-stripe
      wavelength 3.80 mm = 36.11 px, primary-to-secondary prominence ratio 2.65x, bimodal wave
      correlation r = 0.858), backed by 3 machine-checked Lean 4 theorems in
      `Loop_004_pomacanthus_stripe_insertion.lean`.
