      reported_in_source:
      - Hubaud, Regev, Mahadevan & Pourquie (2017) Cell 171:668-682 FitzHugh-Nagumo excitable oscillator model of
        primary mouse presomitic mesoderm (PSM) cells gated by nuclear YAP mechanotransduction
      - Quiescent excitable state in isolated spread fibronectin PSM cells (high nuclear YAP) rescued into ~140
        min autonomous LuVeLu oscillations by Latrunculin A, Y-27632 (Rockout), or Yap1 inhibition, and blocked
        by constitutively active Yap5SA
      - Cooke & Zeeman (1976) clock-and-wavefront law S = v_wf T; Dubrulle, McGrew & Pourquie (2001) posterior-high
        fgf8 mRNA gradient regressing with axis elongation and positioning the determination front; Dupont et al.
        (2011) YAP/TAZ cytoplasmic on ~0.7 kPa and nuclear on ~40 kPa fibronectin hydrogels under Rho/F-actin control;
        Wada et al. (2011) stress fibres inhibit LATS1/2
      reconstructed_in_script:
      - Analytical cubic nullcline continuation, Jacobian spectrum, and supercritical Hopf bifurcation diagram across
        Y_nuc in [0, 1] (|u_H| = 0.9675, Y_crit = 0.6109)
      - RK4 single-cell & ensemble simulations across all 6 Hubaud et al. (2017) perturbation regimes (Pearson r
        = 0.9976, RMSE = 0.0469) plus subthreshold vs suprathreshold single-pulse excitability
      - 2D reaction-diffusion mPSM target-wave PDE solver with Yap5SA constitutive block control and bilateral somite
        DoG peak segmentation on mouse_psm_somites_specimen.jpg (47.14 px mean spacing, CV = 0.2010)
      - '[Pass 3] 1D anteroposterior excitable chain with juxtacrine Dll1-Notch coupling and a regressing Fgf8/Wnt
        gradient: arrest front g(F) = g_crit, frozen-phase Mesp2-like switch, 8 stripes with S = 101.7 um vs v_wf
        T = 102.0 um (CV 0.024), 0 um anterior pulse leak at gamma_F = 1.6 (802 um at 0.8), v_wf / lambda_F / gamma_F
        sweeps and uniform-FGF ablation (0 stripes)'
      - '[Pass 3] Stiffness -> F-actin tension -> LATS1/2 -> three-state YAP kinetics cascade fitted to the five
        wild-type regimes (RMSE 0.054), E_crit = 12.6 kPa, dynamic Latrunculin A rescue (onset 30.8 min, period
        142.5 min), and a 48-cell Dll1-Notch ring synchrony sweep (Kuramoto R 0.27 -> 0.80)'
      transfer_boundary:
      - Fast-slow 2-variable FitzHugh-Nagumo phenomenological reduction of the Notch/FGF/Wnt/YAP mouse PSM segmentation
        clock compared with a dorsal chick-embryo somite SEM (Wikimedia 'Aves_Neural_tube_and_somites_in_chick_embryo.jpg',
        filed as mouse_psm_somites_specimen.jpg) whose px spacing has no um calibration
      - The FGF/Wnt gate acts additively on I_eff (gamma_F (g(F) - 1)) and the determination front is defined by
        the Hopf margin, which is a reduced reading of Hubaud et al. (2017) Fig. 7 and of the clock-and-wavefront
        literature, not an equation published in the source paper; the chain is 1D with no cell flow, convergent
        extension or mediolateral extent
      - The YAP cascade is a lumped ODE keeping both a LATS-dependent branch (Wada 2011) and a LATS-independent
        tension-driven import branch; Dupont et al. (2011) reported the stiffness response as largely LATS-independent,
        and the E_50 = 10 kPa, A_50 = 500 um^2, m = 3, k_exp, k_PP, tau_actin constants are modelling choices, not
        measured values
      does_not_claim:
      - Explicit molecular transcriptional-translational delay equations for Hes7/Lfng/Axin2, a PSM-wide period/phase
        gradient (Lauschke 2013 kinematic waves are only reproduced within ~50 um of the front), 3D focal-adhesion
        traction force microscopy, or the mouse somite AP length beyond an order-of-magnitude anchor (~100 um, Gomez
        et al. 2008)
