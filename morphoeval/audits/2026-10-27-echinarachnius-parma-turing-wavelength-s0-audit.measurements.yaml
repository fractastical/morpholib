    claim_boundary:
      reported_in_source:
      - Turing (1952) diffusion-driven instability at a finite wavenumber when the inhibitor diffuses faster than
        the activator
      - Schnakenberg (1979) kinetics a - u + u^2 v and b - u^2 v, published for limit cycles and used here as the
        standard two-species Turing extension
      - Gierer and Meinhardt (1972) short-range activation with long-range inhibition; Kondo and Miura (2010) review
        of reaction-diffusion as a patterning framework
      - Seilacher (1979) constructional morphology of the sand-dollar test at centimetre scale (petaloids, dome,
        pressure drainage)
      reconstructed_in_script:
      - Periodic Fourier IMEX integration of the Schnakenberg system on a 480 µm patch, Du = 28.006 µm²/time, Dv
        = 336.069 µm²/time (ratio 12), seed 3214
      - Linear dispersion peak λ = 61.343 µm and equilibrated FFT wavelength λ = 60.336 µm
      - Diffusivity-scale sweep with Pearson r = 0.9965, RMSE = 2.575 µm; equal-diffusion ablation amplitude 5.69e-3;
        10 µm patch amplitude 0
      - Union-mask segmentation of the CC0 USNM E39365 plate (foreground fraction 0.357, union circularity 0.066,
        coherency 0.404)
      transfer_boundary:
      - Du and Dv are chosen so the equilibrated lattice sits on the assigned 60 µm detail scale. They are not measured
        diffusion coefficients of sand-dollar epithelium.
      - The 60 µm wavelength is the slot scale. Seilacher (1979) does not report it.
      - The chronoseries has one member (Holocene, 0 Ma). The predecessor and successor contrasted here are scale
        tiers (10 µm and 600 µm), not older named species.
      - The rendered disc is a 480 µm patch coloured with the plate's mean pigment. It is not a photograph of a
        whole test, and the union mask does not separate the three individuals.
      does_not_claim:
      - A measured echinochrome diffusion constant, a gene-regulatory network for E. parma pigment, or a fit to
        the centimetre-scale petaloid
      - That sibling slot 160's dimensionless parameters (α = 1.71, β = 0.43) apply at 60 µm
