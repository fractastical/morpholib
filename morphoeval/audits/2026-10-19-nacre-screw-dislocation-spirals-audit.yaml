simulations:
  - id: cartwright-nacre-screw-dislocation-spirals
    name: "Cartwright & Checa (2007), Cartwright et al. (2009) & BCF (1951) nacre screw-dislocation spirals, Frank-Read target loops, and chitin pore mineral-bridge columnar vs sheet transition"
    organism: "Haliotis rufescens (Gastropoda columnar nacre) / Pteria hirundo & Pinctada margaritifera (Bivalvia sheet nacre)"
    script: 2019-cartwright-nacre-screw-dislocation-spirals.py
    output: docs/media/nacre_screw_dislocation_spirals_comparison.png
    extra_outputs:
      - docs/media/nacre_screw_dislocation_spirals_growth.gif
    status: evaluated
    source_refs:
      - cartwright2007
      - cartwright2009
      - burton1951
      - cartwright2012
    summary: >-
      Pass 1 (v1) baseline evaluation of `2019-cartwright-nacre-screw-dislocation-spirals.py`
      (consensus score 52.8/100). The v1 script evaluates an analytical Cabrera-Levine
      phase field for a single isolated screw dislocation (r_c=0.42 um, lambda_0=7.97 um),
      but omits opposite-charge (+1, -1) Frank-Read target-ring generation for d > 2*r_c,
      subcritical dipole annihilation for d <= 2*r_c, sub-saturated (Delta_mu <= 0) zero-growth
      negative control, Voronoi polygonal tablet tessellation upon terrace coalescence,
      chitin mineral-bridge gastropod (*Haliotis*) columnar vs bivalve (*Pteria*) sheet nacre
      transition, supersaturation and 12-species cross-taxa scaling, and computer-vision
      segmentation of the vendored SEM nacre specimen.
    scores:
      model-fidelity:
        value: 56
        rationale: >-
          Evaluates a static analytical Cabrera-Levine spiral phase for one isolated screw
          dislocation (L31-62), but lacks a 2D excitable phase-field / step-flow and chitin
          mineral-bridge solver for opposite-charge (+1, -1) Frank-Read closed target terraces,
          subcritical dipole pinch-off failure (d <= 2*r_c), sub-saturated (Delta_mu <= 0)
          zero-growth negative control, Voronoi polygonal tablet tessellation, and gastropod
          columnar vs bivalve sheet nacre reconstruction.
        evidence:
          - {file: 2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [31, 62], note: "Single analytical spiral phase without Frank-Read target dipole, Voronoi tessellation, or columnar mineral-bridge solver", supports: false}
      specimen-match:
        value: 24
        rationale: >-
          Renders a 2-panel synthetic spiral phase field and velocity curve without loading,
          SHA-256-verifying, or segmenting the vendored SEM nacre specimen
          (`datasets/nacre_screw_dislocation_spirals/haliotis_nacre_spirals_specimen.jpg`).
        evidence:
          - {file: 2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [65, 92], note: "2-panel synthetic plot with zero biological SEM specimen comparison", supports: false}
          - {file: docs/media/nacre_screw_dislocation_spirals_comparison.png, lines: [0, 0], note: "Pass 1 2-panel synthetic plot lacking SEM nacre segmentation", supports: false}
      parameter-expressivity:
        value: 44
        rationale: >-
          Hardcodes a single parameter tuple (v_inf=1.25, r_c=0.42, h_0=0.50) with no CLI
          parameter overrides, no chemical supersaturation Delta_mu sweep, and no comparison
          across the 5 nacre morphospace regimes.
        evidence:
          - {file: 2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [31, 38], note: "Single hardcoded parameter set without CLI flags or supersaturation/dipole sweep", supports: false}
      morphometric-validation:
        value: 50
        rationale: >-
          Reports only 3 analytical single-spiral scalars (L112-145) without validating
          terrace wavelength lambda_0 ≈ 19*r_c across supersaturation Delta_mu or across the
          12 empirical bivalve, gastropod, and cephalopod nacre species, without Voronoi
          hexagonal coordination checks, and without extracting SEM specimen morphometrics.
        evidence:
          - {file: 2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [112, 145], note: "Only 3 analytical scalars without supersaturation, 12-species scaling, or SEM specimen morphometrics", supports: false}
      source-traceability:
        value: 64
        rationale: >-
          Reference dataset `datasets/nacre_screw_dislocation_spirals/nacre_screw_dislocation_spirals_reference.json`
          and SEM specimen exist on disk, but v1 does not load or verify their SHA-256
          digests at runtime.
        evidence:
          - {file: 2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [1, 29], note: "No runtime loading or SHA-256 verification of datasets/nacre_screw_dislocation_spirals/", supports: false}
      code-traceability:
        value: 62
        rationale: >-
          Module docstring cites Cartwright & Checa (2007), Cartwright et al. (2009), and
          BCF (1951), but functions lack explicit equation mappings to the 3 Lean 4 theorems
          in `morphoeval/lean/loops/Loop_078_nacre_screw_dislocation_spirals.lean`.
        evidence:
          - {file: 2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [31, 62], note: "Functions lack explicit paper equation and Lean 4 theorem cross-references", supports: false}
      repro-package:
        value: 70
        rationale: >-
          Includes `--self-test` and `--verify-only` (L148-162), but checks only 3 basic
          assertions without testing SHA-256 dataset provenance, JSON parity, negative
          controls (Delta_mu <= 0 and d <= 2*r_c), or bitwise two-run determinism.
        evidence:
          - {file: 2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [148, 155], note: "Minimal 3-check self_test() without SHA-256 provenance or bitwise determinism checks", supports: false}
    remediation:
      - "Implement a 2D Phase-Field / Excitable BCF Spiral Wave + Chitin-Membrane Mineral Bridge solver reproducing all 5 Cartwright-Checa morphospace regimes: (1) sub-saturated zero-growth negative control (Delta_mu = -0.20 k_B T <= 0 -> 0 terraces), (2) subcritical Frank-Read dipole (d = 0.60 um < 2*r_c = 0.84 um -> pinch-off failure, 0 terraces), (3) single screw dislocation (+b = +1 -> Archimedean spiral in bivalve sheet nacre *Pteria*), (4) supercritical opposite-charge Frank-Read pair (+1, -1, d = 2.40 um > 2*r_c, B_tot = 0 -> closed concentric target terraces), and (5) gastropod (*Haliotis rufescens*) chitin mineral-bridge columnar nacre stacks & Voronoi polygonal tablet coalescence."
      - "Load and SHA-256-verify `datasets/nacre_screw_dislocation_spirals/` at runtime, validate terrace wavelength lambda_0 ≈ 18.9848*r_c ≈ 19*r_c across chemical supersaturation Delta_mu (r > 0.999) and across 12 empirical bivalve sheet-nacre and gastropod/cephalopod tower-nacre species, and verify Voronoi polygonal tablet tessellation (mean hexagonal coordination Z ≈ 6.0)."
      - "Perform computer-vision lamellar seam and Voronoi tablet segmentation (`segment_nacre_sem_specimen`) on the vendored SEM mother-of-pearl specimen (`haliotis_nacre_spirals_specimen.jpg`), measuring aragonite inter-lamellar terrace spacing h_0 (0.5000 um, CV = 0.2933), hexagonal coordination number Z (5.96), and tablet aspect ratio (3.2436)."
      - "Expose full CLI parameter overrides (`--v-inf`, `--r-c`, `--delta-mu`, `--h-0`, `--dipole-d`, `--seed`, `--skip-gif`, `--verify-only`), upgrade `self_test()` to an 8-point verification suite with bitwise two-run determinism, and render a 6-panel publication-grade synthesis figure and co-evolving 2-panel growth GIF."
