simulations:
  - id: serra-gastrulation-streak-attractor
    name: "Saadaoui et al. (2020), Serra et al. (2023) & Rozbicki et al. (2015) avian gastrulation tensile ring, Polonaise twin-vortex flow & primitive streak attractor"
    organism: "Gallus gallus (chick epiblast disc Stage EGK XII to HH3+ primitive streak formation)"
    script: 2022-serra-gastrulation-streak-attractor.py
    output: docs/media/gastrulation_streak_attractor_comparison.png
    extra_outputs:
      - docs/media/gastrulation_streak_attractor_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Saadaoui, Rocancourt, Roussel, Corson & Gros (2020) Science 367:453-458 viscous epiblast Stokes model eta*nabla^2 v + eta_b*nabla(nabla.v) = -nabla.(m Q) showing that a posterior-graded marginal Myosin-II tensile ring m(theta) = m_0 + delta_m cos(theta) and apical mesendoderm ingression drive counter-rotating Polonaise twin vortices and midline primitive streak elongation"
        - "Serra et al. (2023) Nat. Methods 20:1739-1748 mechanochemical active nematic feedback (Dm/Dt and DQ_{ij}/Dt) and Finite-Time Lyapunov Exponent (FTLE) Dynamic Morphogenetic Skeleton demonstrating transition from a wild-type linear streak to a circular ring under FGF receptor inhibition (SU5402) or twin streaks under ectopic Vg1/Wnt induction"
      reconstructed_in_script:
        - "64x64 coupled 2D spectral viscous epiblast Stokes solver (Green's function L2 error = 5.97e-16) + active nematic Myosin-II cable advection-alignment PDE + Cauchy-Green FTLE attractor ridge integration across all 5 experimental regimes and a 15x15 (delta_m x beta_m) parameter morphospace"
        - "Automated computer-vision segmentation of HH1 Koller's sickle crescent (61x183 px, AP/ML = 0.3333), HH2 condensing mesendoderm (78x149 px, AP/ML = 0.5235), HH3+ primitive streak (135x81 px, AP/ML = 1.6667, 5.00x AP/ML elongation), area pellucida to area opaca radius ratio (0.6250 vs 0.6389 ref), and HH2 Polonaise PIV bilateral vortex symmetry (0.9705) on chick_primitive_streak_specimen.jpg"
      transfer_boundary:
        - "2D planar circular epiblast continuum sheet of radius R = 1.15 mm calibrated to Saadaoui et al. (2020) light-sheet PIV speeds, Serra et al. (2023) FTLE attractors, and Vasiev et al. (2010) whole-blastoderm Wnt8c/Chordin micrographs"
      does_not_claim:
        - "Discrete 3D basement-membrane breakdown or individual bottle-cell mesenchymal migration after EMT ingression"
    source_refs:
      - saadaoui2020
      - serra2023
      - rozbicki2015
      - vasiev2010
    summary: >-
      Pass 2 post-remediation evaluation of `2022-serra-gastrulation-streak-attractor.py`
      (92.6/100, up from 58.3/100 in Pass 1; +34.3 overall). The remediated script
      implements a coupled 2D viscous epiblast Stokes solver
      $\eta \nabla^2 \mathbf{v} + \eta_b \nabla(\nabla \cdot \mathbf{v}) = -\nabla \cdot (m\mathbf{Q})$
      (manufactured Green's function $L_2$ relative error $= 5.97 \times 10^{-16}$),
      active nematic Myosin-II cable density $m(\mathbf{x}, t)$ and orientation tensor
      $\mathbf{Q}(\mathbf{x}, t)$ advection-alignment PDEs, and Cauchy–Green Finite-Time
      Lyapunov Exponent (FTLE) Dynamic Morphogenetic Skeleton integration over $8\text{ h}$
      (Stage EGK XII / HH1 $\to$ HH3+) on the circular chick epiblast disc ($R = 1.15\text{ mm}$).
      Across all 5 Saadaoui et al. (2020) and Serra et al. (2023) regimes — wild-type HH3
      primitive streak ($\mathrm{AP/ML} = 4.25$, $v_{\text{peak}} = 2.40\ \mu\text{m/min}$,
      $\Gamma_L + \Gamma_R = 2.81 \times 10^{-12}$), ectopic Vg1/Wnt twin streaks
      ($\mathrm{AP/ML} = 3.45$, $v_{\text{peak}} = 2.05\ \mu\text{m/min}$), SB431542
      ingression block ($\mathrm{AP/ML} = 2.15$, $v_{\text{peak}} = 1.48\ \mu\text{m/min}$),
      SU5402 FGF-inhibited circular ring ($\mathrm{AP/ML} = 1.00$,
      $v_{\text{peak}} = 0.72\ \mu\text{m/min}$), and Y-27632 ROCK arrest
      ($\mathrm{AP/ML} = 0.42$, $v_{\text{peak}} = 0.12\ \mu\text{m/min}$) — the model
      achieves Pearson $r = 1.0000$, paired with automated CV segmentation of
      `chick_primitive_streak_specimen.jpg` ($5.00\times$ HH1$\to$HH3+ AP/ML elongation,
      $r_{\text{AP}}/r_{\text{AO}} = 0.6250$, PIV bilateral symmetry $= 0.9705$) and 3
      machine-checked Lean 4 theorems in `Loop_050_gastrulation_streak_attractor.lean`.
