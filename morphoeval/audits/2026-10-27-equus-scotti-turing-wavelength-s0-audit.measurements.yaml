      - 'Schnakenberg 1979: activator-substrate kinetics du/dt and dv/dt with the u^2 v nonlinearity.'
      - 'Bard 1977: zebra initiation spacing about 0.4 mm, fixed at different embryonic weeks; week 3 for the plains-zebra
