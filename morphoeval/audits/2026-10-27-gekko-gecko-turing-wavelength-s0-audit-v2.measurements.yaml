    claim_boundary:
      reported_in_source:
      - Turing 1952 dispersion relation for a two-species reaction-diffusion system.
      - Murray 1981 use of that wavelength as a coat pre-pattern.
      - 'Manukyan 2017 and Fofonjka 2021: reptile skin can carry a mesoscopic reaction-diffusion pattern (Timon,
        not Gekko).'
      - 'Saenko 2013: gekkotan color colocalizes structural and pigment cells (Phelsuma, not Gekko).'
      reconstructed_in_script:
      - Schnakenberg field with (a, b) = (0.137, 0.863) and diffusion ratio 1.35 times critical, calibrated so k_c
        = argmax sigma(k) gives 242 µm.
      - Diffusivity sweep, equal-diffusivity ablation, reaction-off control, and orange-ocellus segmentation of
        the Dupont dorsum crop.
      transfer_boundary:
      - 242 µm is the slot's primordium detail scale. The photograph has no scale bar, so it is not a micrometre
        measurement.
      - Adult spot spacing is reported only as a fraction of frame width.
      does_not_claim:
      - That adult Tokay ocelli are 242 µm apart.
      - That the nonlinear ring centroid equals the linear k_c (measured 232.994 µm).
      - That Tokay chromatophores implement the Timon scale automaton.
      - That granular scale texture is produced by this two-species field.
