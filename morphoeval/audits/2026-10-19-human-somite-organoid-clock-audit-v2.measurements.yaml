        mouse WT (122.00 min), human WT (300.01 min, ratio = 2.4591), and exact tempo rescaling collapse (std =
        2.32e-13 nM, linear r = 1.0000)
      - 6-regime genetic & metabolic perturbation series (mouse WT, mouse + hHES7 swap, human WT, human + LbNOX
