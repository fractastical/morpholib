    doi: 10.1016/0022-5193(81)90334-9
  maini1997:
    title: "Spatial pattern formation in chemical and biological systems"
    authors: "Maini PK, Painter KJ, Nguyen Phong Chau H"
    venue: "Journal of the Chemical Society, Faraday Transactions 93:3601-3610 (1997)"
    doi: 10.1039/a702602a
  chang2009:
