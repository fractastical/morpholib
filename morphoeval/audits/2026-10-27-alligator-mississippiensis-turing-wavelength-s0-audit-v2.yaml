# MorphoEval audit — Alligator mississippiensis 1.498 mm Turing wavelength, pass 2.
# Supersedes the pass-1 audit. Weighted overall on rubric 0.1.0: 87.6 / 100.
#   88*0.20 + 82*0.25 + 90*0.10 + 90*0.15 + 92*0.10 + 88*0.08 + 90*0.12 = 87.64
# R1-R4 from pass 1 are closed in the rendered artifacts. R5 (single assessor) stays open.

audit:
  id: 2026-10-27-alligator-mississippiensis-turing-wavelength-s0-audit-v2
  supersedes_audit_id: 2026-10-27-alligator-mississippiensis-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, pass 2; second assessor still absent)"
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    note: >-
      Pass-2 working tree. No publisher ORCID and no ~/.nanopub/profile.yml, so
      the knowledge-graph builder cannot emit signed or unsigned nanopubs.
      Commit omitted until this loop's files are the commit being published.

