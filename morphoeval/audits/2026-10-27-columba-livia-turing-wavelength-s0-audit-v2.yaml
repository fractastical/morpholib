  id: 2026-10-27-columba-livia-turing-wavelength-s0-audit-v2
  supersedes_audit_id: 2026-10-27-columba-livia-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
