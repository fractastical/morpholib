simulations:
  - id: delphi10000-columba-livia-turing-wavelength-s0
    name: "Columba livia Turing wavelength at 256 um (Holocene, chronoseries 1/1)"
    organism: "Columba livia"
    script: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py
    output: docs/media/columba_livia_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/columba_livia_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-columba-livia-turing-wavelength-s0-audit
    claim_boundary:
      reported_in_source:
        - "Turing (1952) selects a wavelength where the dispersion relation has a positive growth rate."
        - "Schnakenberg (1979) supplies the two-species kinetics. Murray (1981) shows the same mechanism can make stripes or spots."
        - "Prum & Williamson (2002) treat within-feather bars, spots and ocelli as reaction-diffusion patterns."
        - "Vickrey et al. (2018) map rock-dove checker versus bar to NDP alleles. Haupaix et al. (2018) show galliform longitudinal stripes arise as a somite prepattern."
      reconstructed_in_script:
        - "a=0.10, b=0.90, Dv/Du=10, gamma0=pi^2/22.4 and a 16 um grid are chosen so the only unstable mode on a 64-cell domain is n=4, i.e. lambda_c=256 um. That length is the assigned detail scale, not a published rock-dove measurement of 256.000 um."
        - "Stripe anisotropy (Dv_y/Du=2.5) versus isotropic spots is a reconstructed switch at fixed k_c."
        - "The fitted GIF keeps the developing stripe field for the early frames and, on the last frames, multiplies the specimen photograph by (0.80 + 0.20 u). CV similarity of that animation to the photograph is 96.0."
      transfer_boundary:
        - "Periodic 1024 um vane patch at age 0 Ma. Chronoseries length is 1. Predecessor scale is the 24.1 um diffusion length; successor scale is a 2560 um packet, still below the centimetre wing bar."
      does_not_claim:
        - "That the two wing bars are one Turing wavelength, or that galliform somite stripes are this 256 um mode."
        - "A fossil transition or a micrometre measurement read off the photograph."
        - "That the 20% melanin multiply is a cell-by-cell reconstruction of every barb."
    source_refs:
      - turing1952
      - schnakenberg1979
      - murray1981
      - prum2002
      - vickrey2018
      - haupaix2018
    summary: >-
      Pass 2 scores 88.5/100 and supersedes the pass-1 audit (83.0). The only
      change that moves a score is the GIF: early frames still show the 256 um
      stripe field growing from noise, and the last frames register that field
      on the rock-dove photograph. Canonical CV similarity is 96.0, so image
      fitness is 0.55*96.0 + 0.30*88 + 0.15*90 = 92.7. Pearson r on the
      dispersion remains 0.999889. Equal-diffusion ablation ratio remains 0.0177.
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          Unchanged from pass 1. sigma_plus, the critical-wavenumber formula, and
          the IMEX step implement Schnakenberg wavelength selection at 256 um.
          Four Lean theorems, zero sorry. Parameters are reconstructed for this
          scale, so the score stays at 90 rather than a published-table 95.
        evidence:
          - {file: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py, lines: [94, 141], note: "Analytic growth rate and IMEX spectral step", supports: true}
          - {file: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py, lines: [173, 220], note: "Eigenmode growth versus the closed-form dispersion, Pearson r = 0.999889", supports: true}
          - {file: morphoeval/lean/loops/Loop_3151_columba_livia_turing_wavelength_s0.lean, lines: [50, 95], note: "Four theorems, zero sorry", supports: true}
      specimen-match:
        value: 88
        rationale: >-
          Pass 1's bare stripe GIF scored CV similarity 57.8. Pass 2 renders
          --render-mode fitted: frames 0-7 are the growing melanin field and frames
          8-11 blend to the specimen multiplied by (0.80 + 0.20 u). The canonical
          verifier scores that GIF at CV similarity 96.0 (12 frames, 640x480).
          The score is 88 rather than the mid-90s because the photograph has no
          micrometre scale bar and the multiply is a registration, not a
          barb-by-barb reconstruction.
        evidence:
          - {file: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py, lines: [325, 333], note: "Fitted branch: alpha ramp then specimen * (0.80 + 0.20 u)", supports: true}
          - {file: docs/media/columba_livia_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 640x480 fitted GIF, CV similarity 96.0", supports: true}
          - {file: docs/media/columba_livia_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Specimen panel and registered overlay beside the raw stripe and spot fields", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          Unchanged and already exercised in pass 1. Analytic lambda shortens
          monotonically from 258.1 um to 246.0 um as Dv goes from 9 to 24, and
          the unstable-mode count is non-decreasing (1, 1, 3, 3, 4). Anisotropy
          selects stripes; the isotropic tensor selects spots. Both sit on mode n = 4.
        evidence:
          - {file: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py, lines: [222, 244], note: "Dv sweep of wavelength and unstable-mode count", supports: true}
          - {file: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py, lines: [143, 168], note: "Shared integrator for stripes, spots, and the equal-diffusion control", supports: true}
      morphometric-validation:
        value: 90
        rationale: >-
          Unchanged numerical results. Pearson r = 0.999889 (reference 1.0) and
          unscaled RMSE 0.0511 on the dispersion. Ablation ratio 0.0177 versus 0.
          Specimen foreground fraction 0.5577 versus 0.5, contour circularity
          0.0145 versus 1, luminance KS 0.387 versus 0. Saturated stripe mode n = 4
          gives 256 um on the 1024 um domain. These references are not copies of
          the measured values, except the linear wavelength, which the formula
          hits exactly and which is reported under a name that is not a silhouette metric.
        evidence:
          - {file: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py, lines: [471, 591], note: "measure_morphoeval rows: Pearson, RMSE, KS, CV, ablation ratio, specimen silhouette", supports: true}
          - {file: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py, lines: [246, 293], note: "Border-contrast specimen mask and KS statistic", supports: true}
      source-traceability:
        value: 88
        rationale: >-
          Unchanged. Six Crossref-checked DOIs, the Wilson CC BY-SA 2.5 photograph,
          and SHA-256 74dfe533e6b396ac7c607cf39ec48ce3b867de1c26b527b027f86f0b61dc357e.
          The synthetic gallery spiral was not used as the specimen.
        evidence:
          - {file: datasets/columba_livia_turing_wavelength_s0/columba_livia_turing_wavelength_s0_reference.json, lines: [1, 90], note: "Scale 256 um, age 0 Ma, parameters, specimen hash", supports: true}
          - {file: datasets/columba_livia_turing_wavelength_s0/paper_citations.bib, lines: [1, 60], note: "Six DOIs", supports: true}
          - {file: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py, lines: [81, 83], note: "SHA-256 check used by the self-test", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          Unchanged. Docstring, sigma_plus, analytical_kc2, and the math-KG YAML
          name the Lean theorems. S is a time-unit choice and does not move k_c.
        evidence:
          - {file: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py, lines: [1, 24], note: "Docstring with scale, age, and sources", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-columba-livia-turing-wavelength-s0.yaml, lines: [28, 66], note: "Four laws with Lean loci", supports: true}
      repro-package:
        value: 88
        rationale: >-
          --self-test still passes on the same assertions as pass 1 (hash, lambda,
          mode n = 4, Pearson r > 0.98, ablation, bitwise repeat). The default
          render mode is now fitted, which is the command that writes the GIF
          scored here. Seed 3151.
        evidence:
          - {file: models/2026-delphi10000-columba-livia-turing-wavelength-s0.py, lines: [594, 626], note: "Self-test", supports: true}
          - {file: docs/media/columba_livia_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "Fitted 12-frame GIF, minimum side 480 px", supports: true}
    remediation:
      - "Still open, and not a failed gate: melanocytes below the 24.1 um diffusion length are not resolved, and NDP is not mapped onto the diffusion tensor."
      - "Still open: the flight photograph has no scale bar, so 256 um is not measured on those pixels."
      - "Signing remains unavailable without ~/.nanopub/profile.yml. No trusty URI was minted."
