    claim_boundary:
      reported_in_source:
      - 'Bilsborough et al. (2011) PNAS 108:3424-3429 interconnected leaf margin feedback loops: Loop 1 (CUC2 promotes
        PIN1 up-the-gradient polarization rho_{ij} propto (1 + gamma_CUC2 C_i) exp(beta A_j)), Loop 2 (Auxin represses
        CUC2 transcription C_i = C_max / (1 + (A_i/K_A)^n), restricting CUC2 to inter-tooth sinuses), and Loop 3
        (differential normal margin outgrowth v_n(s) = v_0 [A(s)^m/(K_g^m+A(s)^m)] (1 - eta_sinus C(s)) with intercalary
        tooth insertion when inter-peak distance exceeds lambda_c)'
      - Vlad et al. (2014) Science 343:780-783 and Kierzkowski et al. (2019) Cell 177:1405-1418 demonstrating that
        local sinus growth repression by RCO in Cardamine hirsuta converts shallow serrations into deeply incised
        compound leaflets without changing PIN1/auxin convergence patterning
      reconstructed_in_script:
      - 1D/2D growing leaf margin Auxin-PIN1-CUC2-RCO reaction-transport and normal contour outgrowth solver verifying
        Law 1 up-the-gradient PIN1 promotion (error 0.0 < 1e-15) and strong spatial Auxin-CUC2 antiphase (r = -0.9908),
        Law 2 smooth margin collapse under cuc2-1 loss-of-function (I_D = 0.0120) and cuc2-1D uniform unrepressed
        CUC2 control (I_D = 0.0250), and Law 3 RCO-driven compound leaflet dissection across 6 genotypes (Pearson
        r = 0.9983, p = 4.58e-6, RMSE = 0.0169) and 4 developmental stages P3-P6 (1, 3, 5, 7 peaks)
      - Automated excess-green chromatic + Euclidean distance-transform segmentation of the SHA-256-locked Cardamine
        hirsuta botanical specimen (`cardamine_hirsuta_compound_leaf_specimen.jpg`, Public domain, 617x992 px) extracting
        foliage area fraction (0.3668), 32 compound leaflet lobes, perimeter dissection ratio P/(2*sqrt(pi*A)) =
        4.0939, and radial tip-to-sinus dissection index I_D = 0.5202 +- 0.0128 SE
      transfer_boundary:
      - 1D epidermal margin reaction-transport coupled to 2D normal leaf contour outgrowth and 2D botanical specimen
        contour morphometrics
      does_not_claim:
      - 3D finite-element adaxial-abaxial lamina thickness mechanics or vascular bundle differentiation inside the
        rachis
