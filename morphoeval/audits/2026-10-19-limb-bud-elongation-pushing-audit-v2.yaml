# MorphoEval audit — Boehm et al. (2010) & Gros et al. (2010) Vertebrate Limb Bud Elongation Pushing, 2026-10-19 (v2)
#
# Pass 2 (v2) evaluation of `2015-boehm-limb-bud-elongation-pushing.py` (1191 lines)
# after completing the 12-step closed remediation loop (`2026-10-19-limb-bud-elongation-pushing-loop`):
#   - Primary assessor: Gemini 4 Argon — 93.8 / 100 (up from 57.3 / 100 in v1; +36.5 overall)
#
# Key remediation improvements verified in Pass 2:
#   1. Implemented 2D/3D continuum artificial-compressibility pressure-Poisson & Stokes velocity
#      solver (`solve_continuum_pressure_velocity_field`, L205-294) coupled to 3D principal
#      strain-rate decomposition (`compute_principal_strain_rates`, L128-153) and 12-substep RK2
#      Lagrangian boundary & internal clone advection (`simulate_limb_bud_regime`, L297-461).
#   2. Simulated all 5 biological perturbation regimes (`evaluate_all_five_regimes`, L464-514) —
#      Model II WT (+43.37% PD, AR=2.30), FGF8/MAPK motility-only (+29.27% PD, AR=1.78),
#      Wnt5a-/- PCP mutant (+16.10% PD, AR=1.29), Model I isotropic proliferation gradient
#      (+10.18% PD, AR=1.12), and Uniform T_c=15.5h control (+8.76% PD, AR=0.98) — matching
#      empirical benchmarks with Pearson r = 0.9970 (RMSE = 1.232%) and E11.5 aspect-ratio
#      Pearson r = 0.9920 (RMSE = 0.0801), plus a 5-decade Reynolds sensitivity sweep
#      (Re in [10^-6, 10^-1], r = 0.9995) and 25-point 2D (zeta_OCD, chi_FGF) morphospace grid.
#   3. Implemented automated multi-panel contour segmentation (`segment_limb_bud_specimen`,
#      L577-673) of the SHA-256-locked biological specimen image
#      `datasets/limb_bud_elongation_pushing/mouse_limb_bud_specimen.jpg` (Boehm et al. 2010 Fig. 2
#      Panels D, E, F Dorsal/Posterior, and G), extracting St1/St0 dorsal PD elongation = 1.3404,
#      posterior DV-PD elongation = 1.3587 (AR 1.0888 -> 1.3021), and 3D OPT iso-surface AR gain = 1.1732.
#   4. Enforced runtime SHA-256 verification across all 4 dataset files (`verify_reference_dataset`,
#      L105-122), expanded `measure_morphoeval()` to 8 reference-anchored morphometric metrics
#      (quick_gate = 100/100), and verified 8 assertions in `self_test()`.

