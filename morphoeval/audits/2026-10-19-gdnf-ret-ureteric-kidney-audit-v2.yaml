          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [333, 603], note: "3D growing ureteric tree solver across g=1..8 and exact Horton-Strahler R_b and R_L ordering", supports: true}
          - {file: morphoeval/lean/loops/Loop_055_gdnf_ret_ureteric_kidney.lean, lines: [11, 90], note: "3 machine-checked Lean 4 theorems for Turing instability, ampulla mode transition, and renal agenesis / Spry1-/- budding (0 sorrys)", supports: true}
