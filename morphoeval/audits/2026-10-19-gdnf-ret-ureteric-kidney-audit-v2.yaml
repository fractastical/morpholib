      the coupled 4-species mesenchymal GDNF + epithelial RET + Wnt11 + Sprouty1
      reaction-diffusion PDE on the ureteric ampulla dome, demonstrating exact mode
      transitions across m=1, 2, 3, 4; grows a 3D metanephric ureteric tree across
      E11.5-E15.5 (g=1..8) reproducing Short et al. (2014) OPT tip counts (r = 1.0000)
      and Horton-Strahler R_b = 2.059 (ref 2.08) and R_L = 1.239 (ref 1.38); validates
      the 5-condition perturbation suite (WT, Spry1-/-, GDNF bead, BMP4 inhibition,
      Gdnf-/-/Ret-/- agenesis); and segments the SHA-256-locked E12.5 metanephric
      specimen image (`kidney_ureteric_tree_specimen.jpg`, WT 13 tips vs Mutant 6 tips,
      38.65x pErk1/2 signaling fold).
