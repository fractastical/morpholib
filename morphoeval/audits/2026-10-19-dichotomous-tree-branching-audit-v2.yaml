    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Honda (1971) J. Theor. Biol. 31(2):331-338 3D recursive vector-rotation tree architecture parameterized by daughter divergence angles (theta_1, theta_2), length contraction ratios (r_1, r_2), and vertical phyllotactic roll angle alpha = 137.5 deg in the local horizontal plane spanned by v and v x z_hat"
        - "Honda & Fisher (1978) Science 199(4331):888-890 & Fisher & Honda (1979) Am. J. Bot. 66:633-644 demonstration that empirical branching angles (theta_1 approx 24-32 deg, theta_2 approx 52-62 deg) and contraction ratios (r_1 = 0.90, r_2 = 0.70) in Terminalia catappa and Cornus controversa maximize non-overlapping effective leaf area A_eff / A_total across 5-branch horizontal whorls"
        - "Shinozaki et al. (1964) Jpn. J. Ecol. 14:97-105 pipe-model theory and Eloy (2011) Phys. Rev. Lett. 107:258101 wind-stress derivation of Leonardo da Vinci's cross-sectional area conservation d_parent^Delta = d_1^Delta + d_2^Delta (Delta = 2.0)"
      reconstructed_in_script:
        - "Full Honda (1971) 3D rotation-matrix tree builder (`grow_honda_1971_3d_tree`) across 4 botanical crown archetypes (excurrent conifer H/W = 1.12, pagoda tiered Cornus H/W = 0.45, decurrent deliquescent Quercus H/W = 0.44, and weeping pendulous Salix H/W = 0.53) over k = 6 orders (127 internodes, 64 terminal leaf clusters)"
        - "Honda & Fisher (1978) 5-whorl horizontal tier disk-union integration (`compute_effective_leaf_area_ratio`) and 2D (theta_1, theta_2) optimization surface (`evaluate_honda_fisher_optimization_surface`), matching the 8-regime benchmark curve (Pearson r = 0.99782, RMSE = 0.0128, p = 2.75e-8) and confirming Terminalia (0.7739) and Cornus (0.7591) outperform the collinear theta_1 = theta_2 = 0 ablation control (0.2001, a 74.14% self-shading penalty)"
        - "Exact Leonardo da Vinci / Shinozaki pipe-model sapwood area conservation (sum d_{k,i}^2 / d_0^2 = 1.0000 across all 6 orders and 63 bifurcations, RMSE = 0.00e+00) contrasted against Murray's vascular cube law (Delta = 3.0) and untapered cylinder controls"
        - "Computer-vision segmentation of the Pagoda Dogwood (Cornus controversa 'Variegata') specimen (`cornus_controversa_tiered_crown_specimen.jpg`, Botanic Garden Meise, 960x1280 px) detecting 7 horizontal pagoda foliage tiers, 12,213 woody skeleton pixels, and 25 Y-bifurcations with empirical theta_1 = 22.40 +- 8.18 deg, theta_2 = 50.93 +- 14.23 deg, and Leonardo area ratio (d_1^2 + d_2^2)/d_0^2 = 0.9533 +- 0.1705"
      transfer_boundary:
        - "3D recursive vector-rotation internode skeletons and 2D horizontal whorl leaf-cluster disk unions mapped to optical crown stratigraphy and woody bifurcation geometry of Cornus controversa"
      does_not_claim:
        - "Cambial auxin-cytokinin molecular transport kinetics or turbulent eddy-resolvable wind-tunnel aeroelasticity at individual leaf blades"
