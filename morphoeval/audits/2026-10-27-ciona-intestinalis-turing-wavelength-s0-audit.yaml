simulations:
  - id: delphi10000-ciona-intestinalis-turing-wavelength-s0
    name: "Ciona intestinalis Turing wavelength at 51 µm (5.056e-05 m), Holocene 0 Ma"
    organism: "Ciona intestinalis"
    script: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py
    output: docs/media/ciona_intestinalis_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/ciona_intestinalis_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, abitua2012, jeffery2004, hotta2007, hudson2016, kourakis2021, brunetti2015, gall2019]
    summary: >-
      Pass 1. Schnakenberg activator-inhibitor kinetics on a periodic 4-wavelength
      patch, with gamma set so lambda_c = 5.056e-05 m (tier label 51 µm, log10 = -4.296,
      tier 4_cellular_10um, detail). Age 0 Ma, chronoseries 1/1. Critical-mode
      log-amplitude Pearson r = 0.9994 on the linear window. Numerical radial-FFT
      wavelength 50.05 µm against the 50.56 µm pin. Equal-diffusion amplitude ratio
      1.98e-5 and gamma=0 ratio 2.80e-4, against a Turing ratio 2.95. YPM IZ 082346
      (CC0) body length 34.0 mm on the 10 mm bar; adult pigment spacing 873 µm, which
      is not the detail-tier wavelength. The image-fitness JSON for the loop is not
      assembled yet.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) derived the diffusion-driven instability and the critical wavenumber. Schnakenberg (1979) gave the two-species kinetic scheme used here."
        - "Ciona pigment cells are a neural-crest-like lineage (Abitua et al. 2012). Jeffery et al. (2004) showed migratory pigment cells in a urochordate. The larval ocellus and otolith sit in the sensory vesicle (Hudson 2016; Kourakis et al. 2021; Hotta et al. 2007)."
      reconstructed_in_script:
        - "gamma, Du and Dv are chosen so the analytical lambda_c equals the slot pin 5.056e-05 m. They are not a regression onto a Ciona dose-response curve."
        - "The growth GIF paints the activator inside the segmented YPM body. Computer-vision similarity to that photograph is a silhouette-and-texture score, not a claim that the adult tunic stripes at 51 µm."
      transfer_boundary:
        - "Chronoseries length is 1, so there is no temporal predecessor. The scale sandwich is melanosome (1 µm) < detail patch (4 × 51 µm) < adult body on the 10 mm bar."
        - "Adult red-channel spacing on this photograph is 873 µm. That number must not be quoted as a measurement of k_c."
      does_not_claim:
        - "Does not claim u and v are identified Ciona morphogens."
        - "Does not claim Brunetti et al. (2015) type A versus type B was resolved from this photograph."
        - "Does not claim a nanopublication signature. No ~/.nanopub/profile.yml is present on this runner."
    scores:
      model-fidelity:
        value: 86
        rationale: "The script integrates the Schnakenberg parenthesis with a semi-implicit Fourier step and sets gamma from the Turing formula so lambda_c matches 5.056e-05 m to numerical tolerance. Periodic boundaries match the Fourier symbol. u and v are not dressed up as named genes."
        evidence:
          - {file: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py, lines: [88, 131], note: "Jacobian, gamma(lambda), dispersion sigma(k)", supports: true}
          - {file: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py, lines: [140, 202], note: "Periodic spectral step and critical-mode amplitude", supports: true}
      specimen-match:
        value: 78
        rationale: "The comparison figure places YPM IZ 082346 beside the body mask, the stripe field, and a specimen-conditioned render. CV similarity of the 12-frame 560×779 GIF against that photograph saturates the scorer cap at 96. The loop fitness JSON that combines CV with these rubric subscores is not written yet, so this pass does not treat the visual match as closed."
        evidence:
          - {file: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py, lines: [298, 308], note: "Largest-component body mask", supports: true}
          - {file: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py, lines: [424, 444], note: "Alpha sweep; strongest tied blend is locked", supports: true}
          - {file: docs/media/ciona_intestinalis_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 560×779", supports: true}
      parameter-expressivity:
        value: 84
        rationale: "Analytical lambda falls monotonically as Dv/Du runs through 4, 6, 8, 10, 16, 24 (57.0 µm down to 48.6 µm), crossing the pin at ratio 10. Short integrations at ratio 4 do not amplify; that is reported rather than hidden. Equal diffusion and gamma=0 both decay."
        evidence:
          - {file: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py, lines: [252, 295], note: "Ratio sweep and two ablations", supports: true}
      morphometric-validation:
        value: 78
        rationale: "Pearson r of log|A(k_c)| versus t is 0.9994 (RMSE on the log-amplitude residual is stored). Radial FFT wavelength is 50.05 µm against the 50.56 µm pin. Body length 34.0 mm, circularity 0.248 against a circle null of 1, KS statistic 0.434 against a zero-difference null. Adult spacing 873 µm is a different scale. The fitness file that lists these as non-circular metrics is still missing."
        evidence:
          - {file: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py, lines: [204, 250], note: "Pearson window and radial wavelength", supports: true}
          - {file: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py, lines: [311, 363], note: "10 mm bar, body length, adult spacing", supports: true}
          - {file: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py, lines: [446, 463], note: "Two-sample KS", supports: true}
      source-traceability:
        value: 88
        rationale: "DOIs were checked on Crossref/OpenAlex. The specimen file is SHA-256 pinned (bacc05b7…) with photographer, CC0, catalog number, and GBIF dataset DOI 10.15468/0lkr3w. Slot 3148 is outside campaign_100_slots.yaml; the scout manifest says so."
        evidence:
          - {file: datasets/ciona_intestinalis_turing_wavelength_s0/paper_citations.bib, lines: [1, 20], note: "Turing 1952 and Schnakenberg 1979 entries", supports: true}
          - {file: datasets/ciona_intestinalis_turing_wavelength_s0/ciona_intestinalis_turing_wavelength_s0_reference.json, lines: [1, 40], note: "Scale pin, age 0 Ma, specimen hash", supports: true}
      code-traceability:
        value: 84
        rationale: "The module docstring states the PDE, the wavenumber formula, the periodic boundary, and the claim that u and v are not named genes. gamma_for_wavelength is the line that enforces the pin. Lean Loop_3148 proves the integer form of the trace, determinant, cross term, discriminant, equal-diffusion ablation, and the scale sandwich."
        evidence:
          - {file: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py, lines: [1, 40], note: "Governing system and scale pin in the docstring", supports: true}
          - {file: morphoeval/lean/loops/Loop_3148_ciona_intestinalis_turing_wavelength_s0.lean, lines: [22, 55], note: "trace, det, cross, discriminant, ablation, scale sandwich", supports: true}
      repro-package:
        value: 82
        rationale: "--self-test checks the sign of the Turing conditions, the wavelength pin, monotonic lambda(ratio), Pearson r > 0.98, and both ablations. Seed 3148. The fitness JSON writer exists but has not been run for this pass."
        evidence:
          - {file: models/2026-delphi10000-ciona-intestinalis-turing-wavelength-s0.py, lines: [729, 760], note: "--self-test assertions", supports: true}
          - {file: datasets/ciona_intestinalis_turing_wavelength_s0/README.md, lines: [1, 24], note: "Invocation and scale statement", supports: true}
    remediation:
      - id: R1
        item: "Write morphoeval/runs/2026-10-27-ciona-intestinalis-turing-wavelength-s0-loop-image-fitness.json with image_fitness = 0.55*CV + 0.30*specimen-match + 0.15*morphometric-validation, n_frames, resolution, and non-circular specimen metrics (value != reference)."
