simulations:
  - id: onuff-joint-interzone-clefting
    name: "Kavanagh et al. (2013) phalangeal Inhibitory Cascade & Hiscock et al. (2017) BMP-GDF5-Noggin synovial joint interzone segmentation"
    organism: "Gallus gallus / Mus musculus tetrapod autopod digits & synovial joint interzones"
    script: 2016-onuff-joint-interzone-clefting.py
    output: docs/media/joint_interzone_clefting_comparison.png
    extra_outputs:
      - docs/media/joint_interzone_clefting_growth.gif
    status: evaluated
    source_refs:
      - kavanagh2013
      - hiscock2017
      - hartmann2001
      - brunet1998
      - storm1994
    summary: >-
      Pass 1 (v1) baseline evaluation of `2016-onuff-joint-interzone-clefting.py`
      (overall weighted score: 56.4/100). The v1 script computes the 2x2 GDF5-Noggin
      Turing dispersion curve, evaluates the analytical Kavanagh et al. (2013)
      Inhibitory Cascade line P2/P1 = 1/2 + (1/2)(P3/P1), and plots a 1D wild-type
      3-joint profile, but lacks a growing-domain 1D/2D reaction-diffusion PDE solver
      with distal PFR-FGF wavefront modulation, omits the Nog-/-, Gdf5 bp/bp, Wnt9a,
      and zero-diffusion perturbation controls, and never loads or segments the vendored
      tetrapod digit radiograph specimen image.
    scores:
      model-fidelity:
        value: 58
        rationale: >-
          Computes the 2x2 GDF5-Noggin Turing dispersion relation (L36-62) and analytical
          Kavanagh et al. (2013) Inhibitory Cascade trajectory (L65-76), backed by 3 Lean 4
          theorems in `Loop_018_joint_interzone_clefting.lean`. However, `simulate_1d_joint_clefting`
          (L79-119) uses an analytical Gaussian profile rather than integrating a growing-domain
          1D/2D BMP-GDF5-Noggin reaction-diffusion PDE with distal PFR-FGF gradient modulation
          and zero-diffusion (D_G = D_N = 0) ablation control.
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [36, 76], note: "GDF5-Noggin Turing dispersion relation and Kavanagh (2013) Inhibitory Cascade equations", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [79, 119], note: "Uses analytical Gaussian profile instead of growing-domain 1D/2D reaction-diffusion PDE and omits D=0 control", supports: false}
      specimen-match:
        value: 35
        rationale: >-
          Although `datasets/joint_interzone_clefting/tetrapod_digit_interzone_specimen.jpg`
          is vendored on disk, the v1 script never loads, segments, or displays the
          vertebrate autopod radiograph specimen image.
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [122, 187], note: "4-panel v1 plot never loads or segments tetrapod_digit_interzone_specimen.jpg", supports: false}
      parameter-expressivity:
        value: 48
        rationale: >-
          Evaluates only the single wild-type triphalangeal condition (L79-119) without
          simulating the 6 genetic/signaling perturbation regimes (`Nog-/-` joint fusion,
          `Gdf5 bp/bp` brachypodism PIP fusion, `Wnt9a` ectopic supernumerary clefting,
          sustained PFR-FGF equal-length phalanges, and `D=0` ablation control) or the
          12-taxon cross-clade regression, and exposes no CLI parameter overrides (L248-262).
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [248, 262], note: "CLI exposes only --self-test and --skip-gif without Noggin/Gdf5/taper parameter overrides", supports: false}
      morphometric-validation:
        value: 55
        rationale: >-
          `measure_morphoeval()` (L214-239) returns only 3 baseline metrics (lambda_c,
          wild-type P2 fraction, and wild-type joint count) without evaluating the 12-taxon
          Kavanagh et al. (2013) Inhibitory Cascade regression (Pearson r, p-value, RMSE),
          perturbation joint counts, or computer-vision segmentation of P1, P2, P3 and
          MCP/PIP/DIP synovial joint clefts on the radiograph specimen.
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [214, 239], note: "Only 3 baseline metrics returned in measure_morphoeval() without cross-clade or specimen CV metrics", supports: false}
      source-traceability:
        value: 74
        rationale: >-
          Loads `datasets/joint_interzone_clefting/joint_interzone_clefting_reference.json`
          and cites Kavanagh et al. (2013) PNAS (L1-9), but does not perform runtime
          SHA-256 verification of the 4 dataset files.
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [31, 33], note: "Loads REF_JSON without runtime SHA-256 cryptographic verification", supports: false}
      code-traceability:
        value: 68
        rationale: >-
          Functions compute dispersion and analytical cascade ratios (L36-119), but lack
          explicit equation-level docstrings cross-referencing Kavanagh et al. (2013)
          PNAS Figs. 1-3, Hiscock et al. (2017) Dev. Cell, Hartmann & Tabin (2001) Cell,
          Brunet et al. (1998) Science, and the 3 Lean 4 theorems in
          `Loop_018_joint_interzone_clefting.lean`.
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [36, 119], note: "Brief docstrings without explicit paper figure/equation or Lean 4 theorem mappings", supports: false}
      repro-package:
        value: 68
        rationale: >-
          Provides `--self-test` and `--skip-gif` flags (L242-262), but `self_test()` runs
          only 3 basic assertions without verifying SHA-256 dataset integrity, growing-domain
          PDE convergence, `Nog-/-` and `D=0` joint ablation controls, cross-clade IC
          regression, specimen phalanx segmentation, or two-run bitwise determinism.
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [242, 247], note: "Minimal 3-check self_test() without determinism, ablation, or specimen verification", supports: false}
    remediation:
      - "Implement a growing-domain 1D and 2D chondrogenic digit-ray reaction-diffusion PDE solver for GDF5/Wnt9a and Noggin modulated by a distal Phalanx-Forming Region (PFR) FGF8 gradient alongside the zero-diffusion (D_G = D_N = 0) negative control."
      - "Simulate all 6 genetic and developmental perturbation conditions (Wild-Type 3 joints, Nog-/- complete joint fusion 0 joints, Gdf5 bp/bp proximal PIP fusion 2 joints, Wnt9a ectopic overexpression 4 joints, sustained PFR-FGF equal-length phalanges, and D=0 ablation control) and evaluate the 12-taxon cross-clade Kavanagh et al. (2013) Inhibitory Cascade morphospace regression."
      - "Implement computer-vision axial intensity profile segmentation of `datasets/joint_interzone_clefting/tetrapod_digit_interzone_specimen.jpg` across Digits II, III, and IV to detect the radiolucent MCP, PIP, and DIP synovial joint interzone clefts and quantify empirical phalanx lengths P1, P2, P3 and P2/(P1+P2+P3) against the 1/3 Inhibitory Cascade law."
      - "Add runtime SHA-256 verification of all 4 files in `datasets/joint_interzone_clefting/`, expose full CLI parameter overrides (`--noggin-dose`, `--gdf5-dose`, `--alpha-taper`, `--D-ratio`, `--seed`), and expand `measure_morphoeval()` to 9 metrics and `self_test()` to 8 comprehensive checks."
