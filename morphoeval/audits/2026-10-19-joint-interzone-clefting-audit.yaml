# MorphoEval audit — Kavanagh et al. (2013) PNAS & Hiscock et al. (2017) Dev. Cell Synovial Joint Interzone Clefting & Phalangeal Inhibitory Cascade, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2016-onuff-joint-interzone-clefting.py` (267 lines)
# prior to Step 12 remediation in `2026-10-19-joint-interzone-clefting-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.4 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `simulate_1d_joint_clefting` (L79-119) evaluates an analytical Gaussian interzone
#      profile rather than integrating a growing-domain 1D/2D coupled BMP-GDF5-Noggin
#      reaction-diffusion PDE modulated by a distal Phalanx-Forming Region (PFR) FGF8
#      gradient, and omits the zero-diffusion (D_G = D_N = 0) negative control.
#   2. Evaluates only the wild-type triphalangeal condition and omits the genetic and
#      developmental perturbation experiments of Brunet et al. (1998) Science (Nog-/-
#      complete joint ablation -> continuous cartilaginous rod), Storm et al. (1994)
#      Nature (Gdf5 bp/bp brachypodism proximal interphalangeal fusion), Hartmann &
#      Tabin (2001) Cell (ectopic Wnt9a supernumerary joint clefting), and sustained
#      PFR-FGF8 equal-phalanx signaling.
#   3. The vendored vertebrate autopod radiograph specimen
#      `datasets/joint_interzone_clefting/tetrapod_digit_interzone_specimen.jpg` is never
#      loaded, segmented for MCP/PIP/DIP synovial joint interzone clefts or P1/P2/P3
#      phalangeal lengths, or displayed in `joint_interzone_clefting_comparison.png`.
#   4. Runtime SHA-256 verification of the 4 files in `datasets/joint_interzone_clefting/`
#      and CLI parameter overrides (`--noggin-dose`, `--gdf5-dose`, `--alpha-taper`,
#      `--D-ratio`, `--seed`) are missing.

