    claim_boundary:
      reported_in_source:
        - "Pietak & Levin (2017) J. R. Soc. Interface 14:20170425 & Pietak & Levin (2016) Front. Bioeng. Biotechnol. 4:55 electrodiffusive Nernst-Planck transport of cationic serotonin (5-HT, z=+1) through voltage-gated gap junctions G_gj(DeltaV)"
        - "Boltzmann zero-flux equilibrium concentration ratio c_post/c_ant = exp(-(z*F/(R*T))*(V_post - V_ant)) = 4.70 under wild-type planarian AP polarization (-20 mV anterior vs -60 mV posterior)"
        - "Cyclic-AMP / PKA / beta-catenin / ERK mutual feedback loop and permanent cryptic two-headed (2H0T) planarian memory persistence after transient 8-octanol gap-junction blockade and washout (Durant et al. 2017)"
      reconstructed_in_script:
        - "1D Scharfetter-Gummel conservative Nernst-Planck electrodiffusive 5-HT + voltage-gated gap-junction + cAMP/PKA/beta-catenin/ERK PDE across 6 experimental regimes and 9-point Boltzmann voltage sweep"
        - "Automated dorsal body-contour and bilateral photoreceptor ocelli segmentation on planarian_ap_polarity_specimen.jpg (N=2 eyespots at x/L=0.0528, length=1478 px) and 2D body-plan silhouette synthesis"
      transfer_boundary:
        - "1D anteroposterior electrodiffusive 5-HT, beta-catenin, and ERK profiles mapped onto 2D dorsal planarian body-plan silhouettes and eyespot coordinates"
      does_not_claim:
        - "Full 3D finite-volume Voronoi cell lattice geometry of BETSE or explicit sub-millisecond action potential spiking"
    source_refs:
      - pietak2017
      - pietak2016
      - durant2017
      - oviedo2010
    summary: >-
      Pass 2 post-remediation evaluation of `2017-pietak-bioelectric-morphogen-coupling.py`
      (91.7/100, up from 58.6/100 in Pass 1; +33.1 overall). The remediated script
      implements conservative Scharfetter-Gummel Nernst-Planck electrodiffusive transport
      of cationic serotonin (5-HT, z=+1) through symmetric Bell-form voltage-gated gap
      junctions coupled to the cAMP/PKA -> beta-catenin / ERK feedback loop, matching the
      exact analytical Boltzmann equilibrium ratio c_post/c_ant = exp(40/25.85) = 4.6992
      (PDE = 4.6984, 9-point sweep r = 1.0000) and reproducing all 6 canonical regeneration
      phenotypes with zero head-count error (RMSE = 0.0000): Wild-Type `1H1T`, 8-Octanol
      pulse `2H0T`, Cryptic Washout Memory `2H0T` (persisting after eta_oct -> 0),
      SCH-28080/Forskolin `0H2T` headless, Uncharged Morphogen Control `z=0` (`2H0T`), and
      Targeted Posterior K+ Hyperpolarization Rescue `1H1T`, alongside automated bilateral
      ocelli segmentation on `planarian_ap_polarity_specimen.jpg` (N = 2 eyespots at
      x/L = 0.0528), backed by 3 machine-checked Lean 4 theorems in
      `Loop_082_bioelectric_morphogen_coupling.lean`.
