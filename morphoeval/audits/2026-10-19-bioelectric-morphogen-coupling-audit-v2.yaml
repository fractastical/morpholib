  - id: pietak-bioelectric-morphogen-coupling
    name: "Pietak & Levin (2017) electrodiffusive Nernst-Planck gap-junction morphogen transport & cryptic two-headed memory"
    organism: "Dugesia japonica / Schmidtea mediterranea freshwater planarian flatworm"
    script: 2017-pietak-bioelectric-morphogen-coupling.py
