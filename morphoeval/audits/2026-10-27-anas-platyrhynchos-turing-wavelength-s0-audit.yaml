simulations:
  - id: delphi10000-anas-platyrhynchos-turing-wavelength-s0
    name: "Schnakenberg within-feather Turing wavelength of Anas platyrhynchos at 378.4 µm (Pass 1)"
    organism: "Anas platyrhynchos (Holocene, 0 Ma)"
    script: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py
    output: docs/media/anas_platyrhynchos_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, prum2002, inaba2020, stavenga2017]
    summary: >-
      Pass 1 integrates the Schnakenberg Jacobian (trace -0.200, det +1) with
      cubic saturation on a periodic vane. k_c = 0.623 and k_star = 0.524 rad/cell
      after Du is scaled so lambda_star = 378.34 µm (anchor 378.4 µm, 0.0003784 m,
      log10 = -3.422, age 0 Ma). The pass-1 GIF is the colorized vane alone
      (build_frames pass_id=1) and scores cv_sim_similarity 60.3 against the
      Xosema drake. That is not a specimen match. Image fitness at these subscores
      is 61.4.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and the diffusion-driven instability conditions."
        - "Schnakenberg 1979 kinetics f = a - u + u^2 v, g = b - u^2 v."
        - "Prum & Williamson 2002: within-feather bars, stripes, and spots can be reaction-diffusion patterns."
        - "Inaba & Chuong 2020: macro body pattern and micro within-feather pattern are different levels."
        - "Stavenga et al. 2017: mallard speculum hue is a multilayer, not a pigment wavenumber."
      reconstructed_in_script:
        - "Near-onset deviation PDE with cubic saturation and an optional quadratic term q U^2."
        - "lambda_star pinned to the campaign anchor 0.0003784 m, not to a published mallard measurement."
      transfer_boundary:
        - "The Anas chronoseries is 1/1 at 0 Ma. Scale neighbours (348 µm bioelectric, 1.3 mm vertex packing, 2.4 cm plumage block) are other laws or another length, not other chronospecies."
      does_not_claim:
        - "That 378.4 µm was measured on a mallard feather in the cited papers."
        - "That the green head or the speculum is a Turing pigment."
        - "That the pass-1 vane GIF matches the drake photograph."
    scores:
      model-fidelity:
        value: 86
        rationale: "The Jacobian, classical k_c, fastest-growing k_star, periodic Laplacian, and cubic saturation are the Schnakenberg linearisation, not a cosine pasted in as the field. The quadratic term that selects ocelli is a normal-form addition, and the axial seed chooses orientation. Full far-from-onset Schnakenberg kinetics are not what is integrated."
        evidence:
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [80, 137], note: "steady state, Jacobian, k_c, sigma(k), k_star, Du scaling", supports: true}
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [150, 184], note: "periodic explicit Euler of the deviation PDE", supports: true}
      specimen-match:
        value: 58
        rationale: "Pass 1 scores the colorized vane GIF at cv_sim_similarity 60.3. The frame is buff-and-melanin bars, not the drake. The comparison PNG does place the photograph beside the field, which keeps this above a pure schematic, but the animated output fails the specimen."
        evidence:
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [368, 382], note: "colorize_vane is the pass-1 frame", supports: true}
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [468, 486], note: "pass_id=1 returns the vane, not the photograph", supports: true}
          - {file: docs/media/anas_platyrhynchos_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "six-panel figure; photograph is one panel", supports: true}
      parameter-expressivity:
        value: 80
        rationale: "q = 0 with an axial seed makes bars (orientation ratio 234); q = 0.55 makes a spot/ocellus field (orientation ratio 0.71). Equal diffusion drives the amplitude down by about 1e-5. The Du sweep exists but is not yet the pass-1 fitness claim."
        evidence:
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [236, 264], note: "Du sweep of analytical versus measured k_star", supports: true}
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [266, 294], note: "equal-diffusion and reaction-off controls", supports: true}
      morphometric-validation:
        value: 72
        rationale: "k_c and k_star are distinct (0.623 versus 0.524), so lambda_c is 317.8 µm against the 378.4 µm anchor. The pass-1 record does not yet treat specimen foreground, coherency, or circularity as scored comparisons, and the vane GIF is not a morphometric overlay."
        evidence:
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [97, 129], note: "k_c formula and k_star argmax", supports: true}
          - {file: datasets/anas_platyrhynchos_turing_wavelength_s0/anas_platyrhynchos_turing_wavelength_s0_reference.json, lines: [98, 140], note: "pass-1 parameter block inside simulation_results", supports: true}
      source-traceability:
        value: 90
        rationale: "Crossref-checked DOIs for Turing, Schnakenberg, Prum & Williamson, Inaba & Chuong, and Stavenga. The drake file is CC BY-SA 4.0 (Xosema, 2017) and its SHA-256 is in the reference JSON. 378.4 µm and 0 Ma are stated as the slot anchor, not as a literature measurement."
        evidence:
          - {file: datasets/anas_platyrhynchos_turing_wavelength_s0/paper_citations.bib, lines: [1, 90], note: "DOI records", supports: true}
          - {file: datasets/anas_platyrhynchos_turing_wavelength_s0/anas_platyrhynchos_turing_wavelength_s0_reference.json, lines: [80, 96], note: "specimen SHA-256 and licence", supports: true}
      code-traceability:
        value: 84
        rationale: "Dispersion, integrator, controls, and the chronoseries ratio (62 * 378.4 µm + 79.2 µm = 23540 µm) are named in the module docstring and in the Lean theorems. The display zoom on the GIF is easy to misread as a change of k_star; the docstring says it is not."
        evidence:
          - {file: morphoeval/lean/loops/Loop_3110_anas_platyrhynchos_turing_wavelength_s0.lean, lines: [1, 44], note: "trace, determinant, discriminant, scale split; 0 sorry", supports: true}
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [1, 40], note: "module statement of scale, age, and what is not claimed", supports: true}
      repro-package:
        value: 86
        rationale: "--self-test checks the Jacobian, equal-diffusion stability, closed-form versus eigenvalue dispersion (r > 0.999), and stripe growth. Seed 3110. Dependencies are the repo scientific stack (numpy, scipy, pillow, matplotlib)."
        evidence:
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [813, 840], note: "self_test", supports: true}
          - {file: datasets/anas_platyrhynchos_turing_wavelength_s0/README.md, lines: [1, 32], note: "invocation and scale statement", supports: true}
    remediation:
      - id: R1
        item: "The saved animation must be the specimen-mapped growth, not the vane-only colorization. Pass-1 cv_sim_similarity is 60.3 and image fitness at these subscores is 61.4."
      - id: R2
        item: "Publish specimen segmentation metrics whose values are not copies of the reference (foreground, coherency, circularity) plus the Du-sweep Pearson r and RMSE."
      - id: R3
        item: "Show the equal-diffusion control on the same colour scale as the bars so a decayed field is not stretched into a fake pattern, and keep a fixed scale on the growth inset so amplitude actually grows."
