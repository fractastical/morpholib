# Pass 1 — Anas platyrhynchos within-feather Turing wavelength, 378.4 µm, 0 Ma.
# The vane-only animation scored cv_sim_similarity 60.3. Image fitness using the
# pass-1 subscores below is 0.55*60.3 + 0.30*58 + 0.15*72 = 61.4, under 70.
