provenance:
  farhadifar-drosophila-wing-vertex-model:
    spec_fingerprint: 00f70e92aaa338b22956554153bb93fbccd372cdaae2e3f47f4744bcadfffe52
    artifact_sha256: 2cb99062ead6793102bd757b45c1c91c5b484d3f97e6a67b428f78f2fbb36aa7
    input_dataset_sha256: {}
    claim_boundary:
      reported_in_source:
      - 'Farhadifar, Röper, Aigouy, Eaton & Jülicher (2007) Current Biology Eqs. 1-2 & Fig. 2A: apical epithelial
        vertex energy functional E({r_i}) = sum (K/2)(A_alpha - A^(0))^2 + sum Lambda_{ij} l_{ij} + sum (Gamma/2)
        L_alpha^2 parameterized by (Lambda_bar, Gamma_bar), partitioning ground states into Case I (rigid hexagonal,
        canonical wing disc Lambda_bar=0.12, Gamma_bar=0.04), Case II (soft network), and Case III (cell collapse).'
      - 'Farhadifar et al. (2007) Fig. 3-4, Gibson et al. (2006) Nature & Classen et al. (2005) Dev. Cell: proliferating
        3rd-instar Drosophila wing disc exhibits P(6) approx 0.455 and obeys Lewis''s Law <A_n>/<A> = (n-2)/4, whereas
        post-mitotic pupal wing annealing increases P(6) to ~0.78, and PCP (fz, stbm) mutants fail to reach wild-type
        hexagonal order.'
      - 'Aigouy et al. (2010) Cell & Etournay et al. (2015) eLife: hinge contraction from ~15 hAPF stretches the
        blade along the proximal-distal axis, cells elongate along PD and then relax through oriented cell rearrangements
        while the Fz/Stbm PCP axis reorients to PD; tissue shear decomposes into cell-elongation change plus rearrangement,
        division and correlation contributions.'
      reconstructed_in_script:
      - 2D periodic Voronoi-seed (Lloyd-type) packing and mitotic cleavage simulation across 4 regimes (Proliferating
        Wing Disc, Post-Mitotic Pupal Wing, High-Contractility Case I, Soft Case II), 2D (Lambda_bar, Gamma_bar)
        phase diagram, UV laser junction ablation recoil curves, and 7-point continuous Lambda_bar sweep (Section
        2, panels A1-A4, B1-B5).
      - 'Pass 3: explicit tri-cellular vertex model (analytic forces of Eq. 1, T1 exchanges) on a 100-cell patch
        with a per-bond Frizzled/Strabismus asymmetry tensor Q_ab modulating line tension Lambda_ab = Lambda_bar
        (1 + eps_pcp n.Q_ab.n), Fz-Stbm feedback + flow-alignment polarity dynamics, an area-preserving hinge-contraction
        boundary strain diag(lambda, 1/lambda) with ln lambda = 0.35, shear decomposition into cell-elongation and
        rearrangement parts, a PCP loss-of-function (eps_pcp = 0) control and a 6-point eps_pcp sweep (Section 2b,
        panels C1-C5, GIF panel 4).'
      - Junction-guided Voronoi-watershed segmentation of the vendored apical junction-stained polygonal epithelial
        micrograph (N=37 interior cells, P(6)=0.4865, P(n) correlation r = 0.9913 against the Farhadifar wing-disc
        distribution).
      transfer_boundary:
      - 2D apical junctional projection of 3D pseudostratified/columnar wing imaginal disc epithelial cells.
      - The vendored specimen `drosophila_wing_epithelium_specimen.jpg` is a Wikimedia Commons epithelial monolayer
        whose scout manifest records organism Mus musculus; its polygon statistics are compared with Drosophila
        literature values as a cross-species epithelial-packing transfer, not as a Drosophila specimen.
      - The Section 2 regimes are Voronoi-seed relaxations with a post-hoc Lewis's-law area reweighting and a hexagonal-lattice
        pull in the pupal regime; only Section 2b integrates the Farhadifar energy on vertex degrees of freedom.
      - The PCP coupling sign (PCP-complex-bearing AP junctions stiffened for eps_pcp > 0), the polarity-dynamics
        gains (k_fb = 0.6, k_flow = 0.4), the initial polarity spread (0.6 rad) and the hinge log-strain (0.35)
        are modelling choices, not fitted to data; Pass 3 reference values from Etournay (2015) and Classen (2005)
        are approximate figure reads recorded offline.
      does_not_claim:
      - Does not model basal extracellular matrix curvature, 3D apico-basal scutoid transitions, Fat/Dachsous polarity,
        the pre-15 hAPF margin-directed PCP pattern, cell divisions or extrusions during pupal morphogenesis, the
        hinge as a separate mechanical compartment, or periodic boundary conditions for the explicit vertex model
        (the patch is clamped at its margin).
      - 'Does not claim to reproduce the Classen et al. (2005) PCP-mutant loss of hexagonal order: in this model
        the PCP coupling lowers the final hexagon fraction (sign mismatch disclosed in measurement `pcp_wt_minus_mutant_hexagonal_fraction_delta`).'
