    claim_boundary:
      reported_in_source:
      - Runions et al. (2005) define open auxin space-colonization (Eq. 1) via Voronoi nearest-vein neighborhoods
        and closed reticulate venation (Eq. 2-3) via Toussaint Relative Neighborhood Graph (RNG) neighborhoods with
        persistent tagged-source anastomosis
      - Murray (1926) derives minimum-work pipe scaling r_parent^3 = sum r_child^3, while Price et al. (2013) measure
        349 cleared leaves (1,514,771 junctions) showing a transition from Murray's law in minor veins (gamma ~
        3, area ratio ~ 1.25) to area-preserving branching in major veins (gamma ~ 2, area ratio ~ 1.01)
      - Katifori & Magnasco (2012) and Ronellenfitsch et al. (2015) quantify hierarchical areole loop nesting via
        recursive minimum-width vein removal on the planar dual graph
      reconstructed_in_script:
      - Open Ginkgo biloba (Table 1 Fig. 10) and closed dicot (Table 1 Fig. 15) space-colonization simulators with
        persistent V(s) source tagging and planar segment-intersection checks, multiscale Horton-Strahler vascular
        tree measurement, and planar dual areole loop nesting on both simulated networks and segmented specimen
        photographs
      transfer_boundary:
      - Direct comparison of simulated planar dual areole nesting and Strahler bifurcation scaling against segmented
        leaf skeleton specimens and Price et al. (2013) / Ronellenfitsch et al. (2015) empirical benchmarks
      does_not_claim:
      - 2D planar lamina space-colonization and pipe-model radius propagation do not model 3D mesophyll thickness
        or stomatal transpiration dynamics
