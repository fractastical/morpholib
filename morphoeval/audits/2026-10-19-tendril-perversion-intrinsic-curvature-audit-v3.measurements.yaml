    claim_boundary:
      reported_in_source:
      - 'Goriely & Tabor (1998) / McMillen & Goriely (2002): an intrinsically curved Kirchhoff rod with both ends
        held undergoes a supercritical pitchfork bifurcation below T_c = B kappa_0^2 / (1 + Gamma) into two opposite-handed
        helices joined by a perversion, with zero net link'
      - 'Gerbode et al. (2012): the cucumber tendril''s G-fiber ribbon sets the intrinsic curvature; soft tendrils
        (Gamma < 1) overwind under axial stretch while lignified ones unwind; coil radius and pitch scale across
        species'
      - 'Darwin (1865) Ch. IV: tendrils curve toward a touched side within tens of seconds, complete a wrap around
        a thin stick within minutes to about an hour, and grasp thin supports more readily than thick ones (qualitative)'
      - 'Jaffe & Galston (1968): thigmotropic coiling is a contact-triggered, propagating growth response; Euler
        (1762): the capstan law exp(mu Theta) for a flexible line on a cylinder'
      reconstructed_in_script:
      - Timoshenko bilayer kappa_0, exact T_c, 161-node L-BFGS-B Kirchhoff perversion solver with zero-link enforcement
        and negative controls; 10-point pitchfork sweep; soft vs lignified overwinding; 4-species scaling; DoG segmentation
        of the SHA-256-locked Passiflora caerulea specimen (Pass 2)
      - 'Pass 3: 61-node inertia-free discrete rod with contact-gated intrinsic curvature pointing toward the support
        axis, implicit backward-Euler incremental potential (L-BFGS-B), rigid-cylinder penalty contact, penalty
        self-contact, lagged-normal Coulomb friction on support and self-contact, quasi-static grip test vs mu*sum(N)
        and exp(mu Theta); no-support, frictionless, friction-sweep, support-radius-sweep and stacked-turns scenarios'
      transfer_boundary:
      - 'The contact solver is a separate bending-only rod: it has no material-frame twist, so Gamma = C/B plays
        no role in contact coiling and the perversion (zero-link) physics of section 3 is not coupled to it'
      - mu_support, mu_self, kappa_contact, tau_thigmo, v_signal, the 55 deg approach angle and the initial placement
        touching the support at 25 % of L are provenance-tagged assumptions; the only empirical anchors for Pass
        3 are Darwin's qualitative timings and support-size statements
      - Friction uses normal forces lagged one macro step; F_hold / mu*sum(N) = 0.67 is a consistency check of the
        scheme, not an experiment; N_wrap counts loose loops that enclose but do not touch the support (contact
        fraction 33 % of nodes)
      does_not_claim:
      - Circumnutation or support-search before first touch, a measured tendril-on-wood friction coefficient, compliant
        or rough or finite-length supports, G-fiber lignification time course, or a validated time-to-wrap (tau_thigmo
        and v_signal were chosen inside Darwin's 5-60 min window and the model's 4.75 min falls slightly below it)
