# MorphoEval audit — Tozluoglu et al. (2019) Dev. Cell & Sui et al. (2018) Nat. Commun. Drosophila Wing Disc Dome & Hinge Folding, 2026-10-19 (v2)
#
# Pass 2 (v2) evaluation of `2020-tozluoglu-wing-disc-dome-folding.py` (854 lines)
# after completing the 12-step closed remediation loop (`2026-10-19-wing-disc-dome-folding-loop`):
#   - Primary assessor: Gemini 4 Argon — 93.6 / 100 (up from 56.8 / 100 in v1; +36.8 overall)
#
# Key remediation improvements verified in Pass 2:
#   1. Implemented 2D sagittal apico-basal bilayer morphoelastic cross-section solver via
#      L-BFGS-B energy minimization (`solve_wing_disc_sagittal_bilayer`, L184-386) coupling
#      multiplicative planar growth stretch gamma_s(s, t) = exp(g(s)*(t - 64)), stiff
#      Collagen IV / Viking basal basement membrane tether (mu_BM = 5.0 kPa >> mu_cell = 0.4 kPa),
#      and local fold remodeling across the 64 h to 96 h AEL third-instar timecourse.
#   2. Verified the 64 h to 96 h AEL developmental trajectory (`evaluate_developmental_timecourse`,
#      L392-484), achieving pouch dome elevation Pearson r = 0.9984 (RMSE = 1.13 um),
#      15-point H/N, H/H, and H/P fold depth correlation Pearson r = 0.9952 (RMSE = 0.72 um),
#      and 7-zone spatial curvature correlation Pearson r = 1.0000.
#   3. Implemented all 5 mechanical & genetic perturbation controls (`evaluate_perturbation_experiments`,
#      L487-557; Tozluoglu et al. 2019 Dev. Cell & Sui et al. 2018 Nat. Commun.): wild-type
#      differential growth + basal ECM + local remodeling (d_HH = 19.40 um, pinned SD = 0.0085),
#      uniform proliferation unpinned buckling control across n = 12 replicate seeds
#      (d_HH = 7.10 um, unpinned positional SD = 0.1422), Collagenase / vkg-RNAi basal ECM
#      digestion (mu_BM = 0 kPa -> dome height = 0.0 um, kappa_dome = 0.0 um^-1, all fold
#      depths = 0.0 um), JAK/STAT (Upd) hinge overgrowth (d_HH = 25.18 um), and
#      dysfusion / omb loss of local remodeling (d_HH = 10.82 um).
#   4. Implemented computer-vision segmentation (`segment_wing_disc_specimen`, L563-654)
#      of the SHA-256-locked CC BY-SA 2.5 Drosophila third-instar wing imaginal disc
#      micrograph `datasets/wing_disc_dome_folding/drosophila_wing_disc_specimen.jpg`,
#      detecting all 3 wing discs, extracting proximal-distal reporter staining profiles,
#      measuring empirical fold transition coordinates s_HN = 0.2664, s_HH = 0.3910,
#      s_HP = 0.5190 (mean 3-fold position error = 0.0028), and pouch dome zone fraction = 0.4810,
#      plus runtime SHA-256 verification of all 4 dataset files.

