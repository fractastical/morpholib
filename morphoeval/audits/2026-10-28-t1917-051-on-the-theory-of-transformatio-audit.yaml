# MorphoEval audit — Thompson (1917) T1917-051 crocodylian skull transformations, Pass 1 (v1 baseline)
#
# Pass 1 runs `thompson/claims/t1917-051_on-the-theory-of-transformations.py --pass1` without
# Moebius parameter sweep, shuffled-landmark ablation, specimen CV segmentation, or KS tests.

audit:
  id: 2026-10-28-t1917-051-on-the-theory-of-transformatio-audit
  rubric_version: 0.1.0
  date: "2026-10-28"
  assessor:
    id: gemini-4-argon
    label: "Gemini 4 Argon (MorphoEval loop thompson1917-t1917-051 Pass 1)"
    homepage: https://deepmind.google
  publisher_orcid: null
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: f1d96f32ba3f00517c53e9cd007634306cc8d4f4
    environment:
      python: "3.12"
      numpy: "2.x"
      scipy: "1.x"
      matplotlib: "3.x"
    note: >-
      Pass 1 baseline with --pass1 flag: Dryad 10.5061/dryad.14fn1 landmarks pinned;
      outputs docs/media/t1917_051_on_the_theory_of_transformatio_comparison.png and growth.gif.

references:
  thompson1917:
    title: "On Growth and Form, Ch. XVII, pp. 752-753, Fig. 383"
    authors: "Thompson DW"
    venue: "Cambridge University Press (1917)"
    url: https://archive.org/details/ongrowthform1917thom
  watanabe2014:
    title: "The utility of cranial ontogeny for phylogenetic inference: a case study in crocodylians using geometric morphometrics"
    authors: "Watanabe A, Slice DE"
    venue: "Journal of Evolutionary Biology (2014)"
    doi: 10.1111/jeb.12382
  watanabe2014data:
    title: "Data from: crocodylian cranial ontogeny geometric morphometrics"
    authors: "Watanabe A, Slice DE"
    venue: "Dryad (2014)"
    doi: 10.5061/dryad.14fn1
  bookstein1989:
    title: "Principal warps: thin-plate splines and the decomposition of deformations"
    authors: "Bookstein FL"
    venue: "IEEE TPAMI 11:567-585 (1989)"
    doi: 10.1109/34.24792

simulations:
  - id: thompson1917-t1917-051
    name: "Thompson (1917) Fig. 383 crocodylian skull coordinate transformations"
    organism: "Crocodylus porosus, C. acutus, Alligator mississippiensis (Notosuchus absent); 78 3D cranial landmarks"
    script: thompson/claims/t1917-051_on-the-theory-of-transformations.py
    output: docs/media/t1917_051_on_the_theory_of_transformatio_comparison.png
    also:
      - docs/media/t1917_051_on_the_theory_of_transformatio_growth.gif
      - datasets/thompson_1917/t1917-051/result.json
    domain: morphogenesis
    status: evaluated
    source_refs: [thompson1917, watanabe2014, watanabe2014data, bookstein1989]
    summary: >-
      Pass 1 baseline: parses Watanabe & Slice (2014) NTS landmarks, GPA, species-mean lateral
      shapes for cropor/croacu/allmis; fits similarity, affine, Moebius, and TPS between pairs;
      headline cross-species RMSE / within-species LOO ratio ≈ 1.40 → mixed verdict; Notosuchus
      not testable on Dryad set.
    scores:
      model-fidelity:
        value: 72
        rationale: >-
          Implements Thompson-style similarity, affine, Moebius coaxial, and Bookstein TPS maps on
          78 landmarks with pinned Dryad ingestion; omits Pass-2 Moebius c sweep and zero-reflection
          grid visualization against Thompson IA Fig. 383.
        evidence:
          - {file: thompson/claims/t1917-051_on-the-theory-of-transformations.py, lines: [175, 220], note: "fit_similarity, fit_affine, fit_tps, fit_moebius", supports: true}
          - {file: thompson/claims/t1917-051_on-the-theory-of-transformations.py, lines: [248, 290], note: "Pass 1 run_analysis lacks moebius_c_sweep when --pass1", supports: false}
      specimen-match:
        value: 44
        rationale: >-
          Vendored CC BY 2.0 alligator skull photograph is pinned but not segmented or overlaid in
          Pass 1 figures; Thompson 1917 Fig. 383 page fetched (IA leaf 772) but not digitised in panels.
        evidence:
          - {file: thompson/claims/t1917-051_on-the-theory-of-transformations.py, lines: [330, 380], note: "render_figures does not load specimen JPG in --pass1 mode", supports: false}
      parameter-expressivity:
        value: 50
        rationale: >-
          No CLI or sweep over Moebius c or TPS bending in Pass 1; single default c=0.12.
        evidence:
          - {file: thompson/claims/t1917-051_on-the-theory-of-transformations.py, lines: [488, 495], note: "--pass1 skips full_validation parameter regime", supports: false}
      morphometric-validation:
        value: 58
        rationale: >-
          Computes pairwise RMSE and LOO noise floor; lacks shuffled-label ablation, KS test, and
          specimen landmark-in-mask fraction in Pass 1 measure_morphoeval path when --pass1 used.
        evidence:
          - {file: thompson/claims/t1917-051_on-the-theory-of-transformations.py, lines: [292, 328], note: "full_validation block gated off under --pass1", supports: false}
      source-traceability:
        value: 82
        rationale: >-
          Runtime SHA-256 verification of NTS and specimen JPG; reference JSON and scout manifest
          cite Dryad DOI and OpenAlex paper.
        evidence:
          - {file: thompson/claims/t1917-051_on-the-theory-of-transformations.py, lines: [56, 68], note: "verify_pinned_assets checks NTS and JPG digests", supports: true}
      code-traceability:
        value: 70
        rationale: >-
          Module docstring cites Thompson 1917 and Watanabe 2014; warp functions map to rubric
          families but lack line-level Lean theorem references in docstrings.
        evidence:
          - {file: thompson/claims/t1917-051_on-the-theory-of-transformations.py, lines: [1, 16], note: "Claim and dataset citation in header", supports: true}
      repro-package:
        value: 64
        rationale: >-
          --self-test and --pass1 flags exist; self_test does not verify Pass-1 vs Pass-2 feature
          split or two-run figure hash stability.
        evidence:
          - {file: thompson/claims/t1917-051_on-the-theory-of-transformations.py, lines: [463, 495], note: "Minimal self_test; no artifact hash check", supports: false}
    remediation:
      - "Enable full_validation by default (remove --pass1 gate) with Moebius c grid sweep, shuffled-landmark TPS ablation, and KS comparison of within- vs between-species distance distributions."
      - "Segment alligator_mississippiensis_skull.jpg (Otsu + largest component) and report landmark-in-mask fraction against allmis mean shape."
      - "Expand measure_morphoeval() to export sweep, ablation, KS, and segmentation metrics; add self_test assertions for shuffled > homologous TPS RMSE."
      - "Overlay Thompson IA Fig. 383 crop or specimen inset on comparison figure."
