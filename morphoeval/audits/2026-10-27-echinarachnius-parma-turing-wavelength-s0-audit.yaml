# MorphoEval audit — Echinarachnius parma 60 µm Turing wavelength, Pass 1.
#
# Slot 3214. Holocene (0 Ma), detail scale 60 µm. Schnakenberg kinetics on a
# periodic 480 µm epithelial patch. Overall 86.8. Three remediation items are
# open for Pass 2: per-disc segmentation of USNM E39365, a spacing-sample KS
# test (the 7-point wavelength KS only moves in steps of 1/7), and a visible
# mark on the quenched 10 µm bar.

