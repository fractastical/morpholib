    claim_boundary:
      reported_in_source:
      - 'Bressloff et al. (2001, 2002): a Euclidean shift-twist symmetric neural field on the orientation-hypercolumn
        lattice of V1 undergoes a Turing-type instability whose even (contoured) and odd (non-contoured) planforms,
        pulled back through the retino-cortical map x=(alpha/eps)ln(1+eps r/w0), y=beta r theta/(w0+eps r), give
        Klüver''s four form constants; the 2002 paper states a foveal magnification of 11.5 mm/deg, 30-36 perceived
        stripes and a cortical wavelength of 2.4-3.2 mm'
      - 'Ermentrout & Cowan (1979): cortical rolls map to tunnels, funnels and spirals under the log-polar retino-cortical
        map'
      - 'Horton & Hoyt (1991): human V1 linear cortical magnification follows M(E) = 17.3/(E + 0.75) mm/deg'
      - 'Rule, Stoffregen & Ermentrout (2011): periodic flicker drives 1:1 (stripe) and 2:1 period-doubling (hexagon)
        Floquet resonance tongues over forcing period and wave number'
      - 'Tamekue, Prandi & Chitour (2024): a Gaussian-only (no Mexican-hat) lateral kernel produces no MacKay-type
        pattern, used here as the negative control'
      reconstructed_in_script:
      - Fourier-Bessel lateral coupling, even/odd orientation eigenbranches and marginal-stability scans, cubic
        amplitude-equation coefficients gamma_0, gamma_3(theta), eta_hex with unrestricted branch selection (rhombic
        angle = argmin gamma_3) and per-panel SELECTED / STABLE-coexisting / IMPOSED-unstable badges, the exact
        two-regime retino-cortical map with analytic inverse in a full-field theta in (-pi, pi] convention (bilateral-mirror
        mode kept and compared, seam contrast and mirror symmetry quantified), an orientation field drawn as line
        elements in cortex and in the visual field via the tangent map phi_R = phi + theta_R, rendered wavenumber
        |k| = q*/d_hyp quantised to integer torus cycles, exact parity with all 5 stability_reports and all 24 preset
        runs of the upstream fixture with all 133 of its paper-expectation checks counted (121 pass), a comparison
        of the map's magnification with Horton & Hoyt (1991) and with the 2002 paper's own scale anchors, parameter
        sweeps over lateral width, lateral inhibition and lateral spread (CLI --sweep), a Gaussian-only negative
        control cross-referenced to the vendored registry, and a diagnostic overlay of the Rule (2011) tongue boundaries
        (16 curves over 5 forcing amplitudes) vendored from the upstream MesmerPrism fixture with its calibration
        status printed
      transfer_boundary:
      - Numerical parity to 2.2e-16 is with the MesmerPrism/bressloff-v1-form-constants Rust implementation's stability_reports
        and runs, not with digitised figures of the 2001 paper; alpha = 3/pi and beta = 1.589/2 are the upstream
        params.rs values (foveal magnification 10.98 vs the paper's 11.5 mm/deg) and the rendered cortical wavelength
        8.7 mm is 3.1x the paper's 2.4-3.2 mm — both are computed and printed, not corrected
      - Of the five gallery panels only the rhombic lattice is SELECTED by the cubic amplitude equations; the honeycomb
        is STABLE-coexisting and tunnel/spiral/cobweb are IMPOSED-unstable, because the bare orientation-overlap
        cubic coefficients make 2 gamma_3(theta*) < gamma_0 for every parameter value swept (rolls and squares never
        stable)
      - The full-field pullback carries a discontinuity on the left horizontal meridian (seam contrast 7-10x for
        oblique modes) because the theta in (-pi, pi] branch cut maps to a line in cortex; the bilateral-mirror
        alternative removes the seam but destroys spiral chirality (mirror symmetry 1.000)
      does_not_claim:
      - Fifth-order resolution of the odd-branch hexagon/triangle degeneracy (Bressloff 2001 Section 5.2), the full
        cubic coefficients with firing-rate derivative weights and quadratic feedback (Eq. 5.15), a Floquet solver
