    reference_value: 1.0
    source: Hellström et al. (2007) Nature 445:776-780 & Bentley et al. (2008) PLoS Comput. Biol. 4:e1000052
    note: RMSE = 0.0136, p = 2.61e-08; alternation sweep r = 0.99809 (RMSE = 0.0227)
    derived_from: script
  - name: HUVEC angiogenic sprouting plexus specimen vascular area density
    value: 0.1967
    unit: vascular area fraction
    method: Calcein green fluorescence morphological segmentation on huvec_angiogenic_sprouting_plexus_specimen.jpg
      (N_junc=69, N_tip=58)
    reference_value: 0.1967
    source: Wikimedia Commons CC BY 4.0 Homo sapiens HUVEC angiogenic vascular network micrograph
    note: vascular cord density = 0.1967 with 69 branch junctions
    derived_from: script
  - name: HUVEC angiogenic sprouting plexus specimen sprouting tip-to-junction ratio
    value: 0.8406
    unit: sprouting tips / branch junctions
    method: Medial-axis skeleton degree-1 endpoint vs degree>=3 junction detection (N_tip=58, N_junc=69, inter-tip
      NND CV=0.7003)
    reference_value: 0.8406
    source: Wikimedia Commons CC BY 4.0 Homo sapiens HUVEC angiogenic vascular network micrograph & Hellström et
      al. (2007)
    note: N_tip = 58 sprouting tips, N_junc = 69 junctions, inter-tip NND = 31.11 +- 21.79 px (CV = 0.7003)
    derived_from: script
  - name: WT perfused plexus median capillary wall shear stress after remodelling
    value: 1.0555
    unit: Pa
    method: Hagen-Poiseuille/Kirchhoff resistor network on the anastomosed 16-rung ladder plexus with Pries pressure-dependent
      set-point adaptation (240 steps, 8/16 perfused, shear CV 0.536 -> 0.782, set-point error 0.137)
    reference_value: 1.5
    source: Pries, Secomb & Gaehtgens (1995) Circ. Res. 77:1017-1023 & (1998) Am. J. Physiol. 275:H349-H360 (capillary
      tau_w band 1-2 Pa)
    note: reference is a band [1.0, 2.0] Pa, not a point; uniform-shear-sensing ablation gives 2.935 Pa with 16/16
      perfused, shear-only (no metabolic term) collapses to 1/16 shunt at 4.395 Pa
    derived_from: script
  - name: WT remodelled plexus emergent Murray bifurcation exponent
    value: 3.5264
    unit: radius exponent k (r_p^k = sum r_d^k)
    method: Brent root of r_p^k - r_a^k - r_c^k at every perfused arteriolar bifurcation of the remodelled network
      (median; OLS log Q vs log r slope = 3.595, R^2 = 0.949); k is NOT a parameter of the model
    reference_value: 3.0
    source: Murray (1926) PNAS 12:207-214 & Lean 4 Theorem 4 (uniform wall shear + Kirchhoff => cube law)
    note: deviation from 3 measures the residual pressure-dependence of the Pries set point and the metabolic term;
      DAPT bed k = 3.697
    derived_from: script
  - name: WT perfused plexus maximum Kirchhoff node mass-conservation residual
    value: 6.728e-26
    unit: m^3/s
    method: max |sum_e Q_e| over all internal nodes of the final Poiseuille solve (total perfusion 0.645 pL/s, 8
      perfused rungs)
    reference_value: 0.0
    source: Pries, Secomb & Gaehtgens (1998) Am. J. Physiol. 275:H349-H360 (network conservation)
    note: solver-correctness check; residual is ~1e-10 of the 6.455e-13 m^3/s total perfusion
    derived_from: script
  - name: Notch blockade (DAPT) to WT perfused-segment density ratio after pruning
    value: 1.625
    unit: DAPT / WT perfused capillary count
    method: DAPT all-tip bed (13/16 perfused, pruned 0.188) vs WT salt-and-pepper bed (8/16, pruned 0.500) under
      identical hemodynamic boundary conditions
    reference_value: 1.5
    source: Lobov et al. (2007) PNAS 104:3219-3224 & Hellström et al. (2007) Nature 445:776-780 (Dll4/Notch blockade
      hyperdensity, approximate 1.3-2x band)
    note: the reference is an approximate band [1.3, 2.0]; the validated claim is the direction (Notch blockade
      under-prunes); perfusion-arrest control prunes to 1/16
    derived_from: script
  - name: WT Notch-gated arteriovenous (ephrinB2/EphB4) marker segregation index
    value: 1.0
    unit: segregation index (0.5 = chance, 1.0 = exclusive)
    method: Logistic readout of local pressure rank and log wall-shear ratio gated by Notch transduction (1.00);
      fraction of arteriolar segments reading arterial and venular segments reading venous
    reference_value: 1.0
    source: Wang, Chen & Anderson (1998) Cell 93:741-753 & Lawson et al. (2001) Development 128:3675-3683
    note: 'DAPT (Notch transduction 0) gives 0.500 (ref 0.5 = AV shunting), perfusion arrest gives 0.500 (le Noble
      2004: flow required for AV identity)'
    derived_from: script
