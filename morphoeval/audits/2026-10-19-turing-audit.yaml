references:
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing AM"
    venue: "Philosophical Transactions of the Royal Society of London B 237(641):37-72 (1952)"
    doi: 10.1098/rstb.1952.0012
  pearson1993:
