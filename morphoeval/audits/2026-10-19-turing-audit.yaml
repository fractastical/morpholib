    doi: 10.1038/376765a0

simulations:
  - id: turing-gray-scott
    name: "Turing (1952), Pearson (1993) & Kondo-Asai (1995) reaction-diffusion morphogenesis"
    organism: "Marine angelfish (Pomacanthus semicirculatus / P. imperator) skin stripes & chemical reaction-diffusion patterns"
    script: 1952-turing-morpho.py
    output: turing_pearson_morphospace.png
    extra_outputs:
      - docs/media/turing_gray_scott.gif
      - turing_pearson_metrics.csv
    status: evaluated
    source_refs:
      - turing1952
      - pearson1993
      - lee1994
      - kondo1995
    summary: >-
      Pass 1 (v1) dual-agent evaluation of `1952-turing-morpho.py` (Gemini 4 Argon +
      Claude Sonnet 5.5 High consensus: 39.6/100). The v1 script integrates the 2D
      Gray-Scott PDE across 4 hardcoded (F, k) regimes plus an equal-diffusion control
      and computes 2D FFT radial power spectra, but completely omits Turing's (1952)
      linear reaction-diffusion instability equations, dispersion relation sigma(k^2),
      and ring-of-20-cells model; omits Pearson's (1993) saddle-node (4(F+k)^2 = F) and
      Hopf bifurcation curves; uses a conceptually flawed trivial-state extinction
      control for Du=Dv; has zero biological specimen images or segmentation (no
      Kondo & Asai 1995 Pomacanthus stripe spacing or Y-junction analysis); and lacks a
      vendored `datasets/turing/` reference package with SHA-256 verification.
    scores:
      model-fidelity:
        value: 54
        rationale: >-
          Integrates the 2D periodic Gray-Scott PDE dU/dt = Du*Lap(U) - U*V^2 + F*(1-U),
          dV/dt = Dv*Lap(V) + U*V^2 - (F+k)*V (L162-221) with Du/Dv = 2.0. However, as
          identified by the independent second assessor (Claude Sonnet 5.5 High): (1)
          Turing (1952) is not implemented at all—there is no linearized 2-morphogen
          reaction-diffusion system, no dispersion relation sigma(k^2), no critical
          wavenumber k_c, and no ring-of-20-cells model; (2) Pearson's (1993) saddle-node
          bifurcation curve 4*(F+k)^2 = F and Hopf boundary are not computed, and 3 of the
          4 patterned regimes lie past the saddle-node boundary where no nontrivial
          homogeneous steady state exists; and (3) the equal-diffusion control (Du=Dv=0.10,
          L147-155) halves Du and tests finite-amplitude front extinction toward the
          always-stable trivial state (1,0) rather than linear Turing instability around
          a homogeneous steady state.
        evidence:
          - {file: 1952-turing-morpho.py, lines: [100, 156], note: "PEARSON_REGIMES with 4 patterned points + flawed Du=Dv=0.10 trivial-state extinction control", supports: false}
          - {file: 1952-turing-morpho.py, lines: [162, 221], note: "5-point periodic Gray-Scott forward Euler solver without Turing (1952) linear dispersion or Pearson bifurcation boundaries", supports: false}
      specimen-match:
        value: 14
        rationale: >-
          No biological specimen photograph, segmentation, or comparison to Kondo & Asai
          (1995) Pomacanthus angelfish skin stripes or boxfish/pufferfish hexagonal spot
          arrays is present anywhere in the v1 script. Furthermore, in
          `turing_pearson_morphospace.png`, the first two spot panels (mitosis_spots at
          F=0.028 and soliton_spots at F=0.030) are visually near-indistinguishable at
          t=4000 because both are initialized with 10 nucleation patches rather than
          Pearson's single central 20x20 perturbation.
        evidence:
          - {file: 1952-turing-morpho.py, lines: [173, 200], note: "multi-patch synthetic initialization with zero biological specimen images or segmentation", supports: false}
          - {file: turing_pearson_morphospace.png, lines: [0, 0], note: "2x5 synthetic plot with no biological specimen panel and near-identical spot panels in cols 0 and 1", supports: false}
      parameter-expressivity:
        value: 38
        rationale: >-
          Only 4 patterned (F, k) points plus 1 control are hardcoded in `PEARSON_REGIMES`
          (L100-156), omitting Pearson's (1993) 12 pattern classes (alpha through mu) and
          (F, k) phase diagram. No CLI arguments exist for F, k, Du, Dv, N, steps, dt, or
          seed (L561-580), and no continuous parameter sweep of diffusivity ratio d = Du/Dv
          or feed/kill rates is performed.
        evidence:
          - {file: 1952-turing-morpho.py, lines: [100, 156], note: "hardcoded 5-element tuple without Pearson's 12 pattern classes", supports: false}
          - {file: 1952-turing-morpho.py, lines: [561, 580], note: "CLI exposes only --no-show, --skip-gif, --self-test, --output-png, --output-csv", supports: false}
      morphometric-validation:
        value: 30
        rationale: >-
          Computes 2D Hann-windowed FFT radial PSD, azimuthal m=2/m=6 harmonics, and
          connected-component Euler characteristic (L227-313), but all metrics are
           purely self-referential without comparison to analytical Turing wavelength
          lambda_c = 2*pi/k_c, Pearson's (1993) phase boundaries, or Kondo & Asai (1995)
          empirical stripe wavelengths. Moreover, integer-binned k* gives k* = 11, 12, 12, 11
          cycles across all four patterned regimes, failing to resolve sub-bin wavelength
          shifts.
        evidence:
          - {file: 1952-turing-morpho.py, lines: [270, 286], note: "integer-binned k_star_idx = argmax(radial_psd) yields identical 11-12 bin values across regimes", supports: false}
          - {file: turing_pearson_metrics.csv, lines: [1, 6], note: "self-referential FFT metrics with no analytical lambda_c or biological benchmark comparison", supports: false}
      source-traceability:
        value: 45
        rationale: >-
          Module docstring lists DOIs for Turing (1952), Pearson (1993), and Lee et al.
          (1994) (L7-15), but `datasets/turing/` does not exist, no formal JSON/CSV
          reference dataset or specimen photographs are vendored or SHA-256-locked, and
          Kondo & Asai (1995) (`10.1038/376765a0`) is absent.
        evidence:
          - {file: 1952-turing-morpho.py, lines: [7, 15], note: "3 DOIs in docstring but no vendored datasets/turing/ or SHA-256 verification", supports: false}
      code-traceability:
        value: 45
        rationale: >-
          Section headers and docstrings describe the Gray-Scott PDE and FFT ring metrics
          (L160-313), but functions lack explicit equation, section, and figure mappings
          to Turing (1952) Sections 8-9, Pearson (1993) Eq. 1 & Fig. 1-2, and Kondo & Asai
          (1995) Fig. 1-3.
        evidence:
          - {file: 1952-turing-morpho.py, lines: [162, 221], note: "solver functions lack explicit paper section/equation citations", supports: false}
      repro-package:
        value: 61
        rationale: >-
          Uses deterministic `np.random.default_rng(1952)` and includes `--self-test`,
          `--no-show`, and `--skip-gif` flags (L511-591). However, `--self-test` uses
          overly loose thresholds (`ring_sharpness > 5.0` when observed values are 718-967),
          does not verify two-run hash determinism, and `render_legacy_neon_gif` writes
          `turing_patterns_black_neon.gif` (N=200, 5000 steps) out of sync with
          `docs/media/turing_gray_scott.gif`.
        evidence:
          - {file: 1952-turing-morpho.py, lines: [319, 364], note: "render_legacy_neon_gif writes turing_patterns_black_neon.gif rather than updating docs/media/turing_gray_scott.gif", supports: false}
          - {file: 1952-turing-morpho.py, lines: [528, 557], note: "loose self_test thresholds (sharpness > 5.0) and no determinism check", supports: false}
    remediation:
      - "Implement Turing (1952) Section 8-9 two-morphogen linear reaction-diffusion dispersion relation sigma(k^2), critical wavenumber k_c, analytical wavelength lambda_c = 2*pi/k_c, and Turing's N=20 ring-of-cells morphogenesis model."
      - "Implement Pearson (1993) exact Saddle-Node (4*(F+k)^2 = F) and Hopf bifurcation curves, map all 12 Pearson pattern classes (alpha through mu) on the (F, k) phase diagram, and replace the flawed trivial-state extinction control with a true diffusivity-ratio sweep (d = Du/Dv across the analytical Turing threshold d_c around a nontrivial steady state)."
      - "Vendor `datasets/turing/` with SHA-256-locked reference data (Turing 1952 ring parameters, Pearson 1993 12-regime table, Kondo & Asai 1995 Pomacanthus stripe spacing table) plus real CC-licensed biological specimen photographs (Pomacanthus semicirculatus skin stripes & Tetraodon/Ostracion hexagonal spots), and segment the biological stripes, inter-stripe wavelength, and Y-branch dislocations directly in `1952-turing-morpho.py`."
      - "Upgrade spectral morphometrics to sub-bin parabolic/centroid wavenumber estimation, compare measured wavelengths against analytical lambda_c and empirical Pomacanthus stripe spacing, expose full CLI parameters, sync `docs/media/turing_gray_scott.gif`, and formalize Turing dispersion & Pearson saddle-node theorems in `morphoeval/lean/MathOfBiology.lean` Section 5."
