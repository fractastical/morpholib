    remediation:
    - >-
      2001-bressloff-v1-form-constants.py:686-695 — amplitude_gamma3 integrates only u^2(phi - theta) u^2(phi) with
      unit cubic gain; Bressloff 2001 Eq. 5.15 also carries the firing-rate derivative weights and quadratic-feedback
      terms, so the 'rolls and squares never stable' verdict at lines 811-818 and every SELECTED/IMPOSED badge rest on
      a reduced functional. Implement the full coefficient or relabel gamma3 as the bare overlap integral in the
      docstring, ledger and badges.
    - >-
      2001-bressloff-v1-form-constants.py:74-76 and 1102-1107 — the full-field theta in (-pi, pi] convention leaves a
      gap L/2 - y(pi) of 0.82 wavelengths at 10 deg, 1.43 at 5 deg and 0.23 at 40 deg, so the 9.9x seam spans most of
      the 40 deg disc (visible in the PNG spiral panel and GIF frame 8), not 'near the fovea' as the docstring says.
      Fix: in bilateral-mirror mode negate pattern_angle_deg for the left hemisphere (reflect the wavevector, not the
      mode) so chiral spirals stay continuous without a seam, and correct the docstring.
    - >-
      2001-bressloff-v1-form-constants.py:291, 1062, 1070-1076 and 592-599 — contour_mode is a preset flag; the
      paper's contoured vs non-contoured dichotomy is whether the n = 0 (Hubel-Wiesel) or n = 1 local harmonic is
      critical (W0 vs W1), but branch_growth always uses W1 as its base. Derive contour_mode from argmax_n of the
      critical growth over n in {0, 1} so Figs. 29-30 non-contoured planforms are selected rather than imposed.
    - >-
      2001-bressloff-v1-form-constants.py:1506-1560 with bressloff_v1_metrics.csv parameter_sweep rows — the
      unrestricted cubic selection is 'rhombic' at every point of all three sweeps, so no swept model parameter
      changes the form-constant family; the tunnel/spiral/cobweb/honeycomb axis is the categorical pattern string and
      pattern_angle_deg at lines 982-1013. Either add a sweep (e.g. eigen_beta or local_sigma_deg across a range where
      the selected lattice changes) with pullbacks rendered along it, or state in Panel F/G that the family is not
      parameter-controlled.
    - >-
      2001-bressloff-v1-form-constants.py:131-132, 305-306, 309 and 949-958 — alpha = 3/pi and lateral widths xi = 1,
      xi_hat = 1.5 are upstream choices that give lambda_c = 8.7 mm (3.1x the paper's 2.4-3.2 mm) and 11 rings vs
      30-36 stripes, and stability_q_max = 3.5 makes the paper's q* ~ 4.5 unreachable. Add a paper-scale preset (q
      scan to ~5, or d_hyp consistent with lambda_c ~ 2d) rendered beside the parity preset so the discrepancy is
      tested, not only reported.
    - >-
      2001-bressloff-v1-form-constants.py:982-1013 — planform_modes hard-codes phase multipliers 0.35 and -0.25 and an
      amplitude of -1 on one hex_pi mode without citation; cos(k1.r) - cos(k2.r) + cos(k3.r) is not the paper's H_pi
      (a translate of H_0 with all phases pi). Cite the source of each multiplier or replace hex_pi with the Eq. 5.17
      definition.
    - >-
      README.md:432 and 437-441 — stale against the code: '--self-test runs 17 checks ... in ~3 s' (27 PASS lines, ~12
      s), 'the same four presets' and '1/4 ... 4/4' (GIF shows five presets labelled n/5), and 'both hemispheres carry
      the same bilateral eigenmode so the vertical meridian is continuous' although the default hemifield_mode is
      full-field (line 297). Update the section to the current CLI, preset count and default convention.
    - >-
      2001-bressloff-v1-form-constants.py:2487-2493 and 2576-2580 — the Horton & Hoyt acceptance threshold (25% RMS)
      passes a 30% maximum relative error and E2 = 1.71 vs 0.75 deg, and the k* check compares the FFT ring with the
      rendered cycle count derived from the same q* (circular). Tighten the magnification test to the paper's own 11.5
      mm/deg and 5.75 mm/deg anchors and add a retinal morphometric (rings per degree, spiral pitch, cobweb spoke
      count) compared with Klüver's or Bressloff Fig. 1 observations.
    - >-
      [second assessor, gemini-4-argon] 2001-bressloff-v1-form-constants.py:672-695 — amplitude_gamma2 and
      amplitude_gamma3 compute only local orientation overlap integrals without the spatial lateral-kernel weighting,
      quadratic-mode feedback, or quintic terms of Bressloff et al. (2001 §5, Eqs. 5.12-5.15), so rolls and squares
      are never stable anywhere in parameter space and 3 of Klüver's 4 form constants in the gallery must be manually
      imposed.
    - >-
      [second assessor, gemini-4-argon] 2001-bressloff-v1-form-constants.py:769-783 — in branch_selection_for,
      roll_stable tests 2*gamma_3(theta) > gamma_0 only at the preset's rendering angle pattern_angle_deg (clipped to
      [15, 75] deg) instead of across all theta (or theta_opt ~ 45 deg), falsely reporting roll_stable=True in
      bressloff_v1_metrics.csv lines 9, 10, and 12 whenever pattern_angle_deg is 0, 60, or 90 deg.
    - >-
      [second assessor, gemini-4-argon] 2001-bressloff-v1-form-constants.py:931-959 — in stability_scan, when
      params.pattern != 'auto' and params.parity differs from critical_branch (e.g. fig29_* and fig30_* where
      parity='even' but critical_branch='odd'), branch_selection_for evaluates the even eigenfunction at the odd
      branch's critical_q and critical_growth.
    - >-
      [second assessor, gemini-4-argon] 2001-bressloff-v1-form-constants.py:1080-1092 — _eval_xy selects the contoured
      orientation via np.abs(val) > np.abs(best) (argmax_phi |a(x, phi)|) rather than signed activity argmax_phi a(x,
      phi), causing discontinuous sign flips across nodal lines that shift the contoured hexagonal FFT peak to the 2k
      harmonic (21 cycles vs 11 linear cycles).
    - >-
      [second assessor, gemini-4-argon] 2001-bressloff-v1-form-constants.py:954-958 — setting wave_number_qstar =
      critical_q / hypercolumn_mm (with d_hyp = 2.0 mm and gallery q* = 1.4475) produces a cortical wavelength
      lambda_c = 8.68 mm (11 cycles on the 97.9 mm torus), 3.1x longer than Bressloff et al.'s (2002 §1.1) 2.4-3.2 mm
      (30-36 stripes), and only quantizes |k| rather than (k_x, k_y), leaving non-integer azimuthal cycles
      k_y*L/(2*pi) = 11*sin(theta) and a 9.9x left-meridian seam on oblique/spiral modes.
    - >-
      [second assessor, gemini-4-argon] 2001-bressloff-v1-form-constants.py:1156-1172 — retinal_pullback_diagnostics
      computes seam_contrast from |f[cy] - f[cy-1]| across v = 0, which vanishes identically on both meridians for any
      y-even planform at phase = 0 (Cobweb and Honeycomb), returning NaN and mislabelling both panels as 'seam n/a
      (y-independent)' at line 1957.
    - >-
      [second assessor, gemini-4-argon] README.md:431-442 — the ### [2001-bressloff-v1-form-constants.py]
      documentation is out of sync with the script: it claims 10/11 fixture checks pass (omitting the 122
      runs[].checks with 11 failures), states that both hemispheres carry a bilateral-mirror mode by default (now
      full-field), attributes the contoured hex FFT shift to sqrt(3)k instead of 2k, and describes a 4x4 figure /
      4-preset GIF / 17 self-test checks instead of the actual 4x5 figure / 5-preset GIF / 22 self-test checks and
      --sweep/--preset/--hemifield-mode flags.
