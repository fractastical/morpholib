simulations:
  - id: bressloff-v1-form-constants
    name: "Bressloff et al. (2001/2002) V1 Euclidean Symmetry-Breaking & Klüver Form Constants"
    organism: "Homo sapiens primary visual cortex (V1) — geometric visual hallucinations (Klüver form constants) and flicker phosphenes"
    script: 2001-bressloff-v1-form-constants.py
    output: bressloff_v1_form_constants_morphospace.png
    also:
      - docs/media/bressloff_v1_form_constants.gif
      - bressloff_v1_metrics.csv
      - datasets/bressloff/horton_hoyt_1991_magnification.json
    domain: morphogenesis
    status: evaluated
    source_refs: [bressloff2001, bressloff2002, ermentrout1979, rule2011, horton1991, tamekue2024, kluver1966, mesmerprism_v1sim]
    supersedes_audit_id: 2026-10-19-bressloff-audit-v2
    claim_boundary:
      reported_in_source:
        - "Bressloff et al. (2001, 2002): a Euclidean shift-twist symmetric neural field on the orientation-hypercolumn lattice of V1 undergoes a Turing-type instability whose even (contoured) and odd (non-contoured) planforms, pulled back through the retino-cortical map x=(alpha/eps)ln(1+eps r/w0), y=beta r theta/(w0+eps r), give Klüver's four form constants; the 2002 paper states a foveal magnification of 11.5 mm/deg, 30-36 perceived stripes and a cortical wavelength of 2.4-3.2 mm"
        - "Ermentrout & Cowan (1979): cortical rolls map to tunnels, funnels and spirals under the log-polar retino-cortical map"
        - "Horton & Hoyt (1991): human V1 linear cortical magnification follows M(E) = 17.3/(E + 0.75) mm/deg"
        - "Rule, Stoffregen & Ermentrout (2011): periodic flicker drives 1:1 (stripe) and 2:1 period-doubling (hexagon) Floquet resonance tongues over forcing period and wave number"
        - "Tamekue, Prandi & Chitour (2024): a Gaussian-only (no Mexican-hat) lateral kernel produces no MacKay-type pattern, used here as the negative control"
      reconstructed_in_script:
        - "Fourier-Bessel lateral coupling, even/odd orientation eigenbranches and marginal-stability scans, cubic amplitude-equation coefficients gamma_0, gamma_3(theta), eta_hex with unrestricted branch selection (rhombic angle = argmin gamma_3) and per-panel SELECTED / STABLE-coexisting / IMPOSED-unstable badges, the exact two-regime retino-cortical map with analytic inverse in a full-field theta in (-pi, pi] convention (bilateral-mirror mode kept and compared, seam contrast and mirror symmetry quantified), an orientation field drawn as line elements in cortex and in the visual field via the tangent map phi_R = phi + theta_R, rendered wavenumber |k| = q*/d_hyp quantised to integer torus cycles, exact parity with all 5 stability_reports and all 24 preset runs of the upstream fixture with all 133 of its paper-expectation checks counted (121 pass), a comparison of the map's magnification with Horton & Hoyt (1991) and with the 2002 paper's own scale anchors, parameter sweeps over lateral width, lateral inhibition and lateral spread (CLI --sweep), a Gaussian-only negative control cross-referenced to the vendored registry, and a diagnostic overlay of the Rule (2011) tongue boundaries (16 curves over 5 forcing amplitudes) vendored from the upstream MesmerPrism fixture with its calibration status printed"
      transfer_boundary:
        - "Numerical parity to 2.2e-16 is with the MesmerPrism/bressloff-v1-form-constants Rust implementation's stability_reports and runs, not with digitised figures of the 2001 paper; alpha = 3/pi and beta = 1.589/2 are the upstream params.rs values (foveal magnification 10.98 vs the paper's 11.5 mm/deg) and the rendered cortical wavelength 8.7 mm is 3.1x the paper's 2.4-3.2 mm — both are computed and printed, not corrected"
        - "Of the five gallery panels only the rhombic lattice is SELECTED by the cubic amplitude equations; the honeycomb is STABLE-coexisting and tunnel/spiral/cobweb are IMPOSED-unstable, because the bare orientation-overlap cubic coefficients make 2 gamma_3(theta*) < gamma_0 for every parameter value swept (rolls and squares never stable)"
        - "The full-field pullback carries a discontinuity on the left horizontal meridian (seam contrast 7-10x for oblique modes) because the theta in (-pi, pi] branch cut maps to a line in cortex; the bilateral-mirror alternative removes the seam but destroys spiral chirality (mirror symmetry 1.000)"
      does_not_claim:
        - "Fifth-order resolution of the odd-branch hexagon/triangle degeneracy (Bressloff 2001 Section 5.2), the full cubic coefficients with firing-rate derivative weights and quadratic feedback (Eq. 5.15), a Floquet solver or validated reproduction of Rule (2011) Fig. 8 (the vendored fixture is marked diagnostic-only upstream and the script says so), derivation of contoured vs non-contoured from the critical local harmonic (contour_mode is a preset flag), or a comparison with subject drawings of hallucinations"
    summary: >-
      The script implements the Bressloff et al. (2001/2002) orientation-hypercolumn model in recognisable form: the
      exact two-regime retino-cortical map with the paper's w0 and eps and an analytic inverse, Fourier-Bessel lateral
      harmonics with the sin(2n theta0)/(2n theta0) spread factor, even/odd perturbative dispersion curves to
      O(beta^2), cubic normal-form stability tests (roll stable iff 2 gamma3(theta) > gamma0) and the tangent map
      phi_R = phi + theta_R for line elements. Its numerical parity is with the vendored MesmerPrism Rust port (max
      |diff| 2.2e-16 on 5 stability_reports and 24 runs), which is stated plainly; the fixture's 12 failed paper-
      expectation checks, the alpha/lambda_c discrepancies and the Rule (2011) calibration_claim_allowed=false status
      are disclosed in the ledger, CSV and self-test rather than hidden. The remaining substantive gaps are that the
      cubic coefficients are bare eigenfunction overlap integrals, contoured vs non-contoured is a preset flag rather
      than a derived W0/W1 criterion, no swept model parameter changes the selected lattice family (rhombic
      everywhere), the rendered wavelength is 3.1x the paper's perceptual estimate, and the full-field spiral carries
      a seam spanning most of the 40 deg disc. Rendering is byte-identical across runs and pinned to a lock file.
    scores:
      model-fidelity:
        value: 70
        rationale: >-
          The map x = (alpha/eps) ln(1 + eps r/w0), y = beta r theta/(w0 + eps r) with w0 = 0.087, eps = 0.051 is the
          paper's, and its inverse, the lateral Fourier-Bessel harmonics exp(-xi^2 q^2/4) I_n(xi^2 q^2/4) with (-1)^n
          sign and the theta0 spread factor, the O(beta) + O(beta^2) even/odd dispersion relation and the 2
          gamma3(theta) > gamma0 roll criterion all match the 2001 formulation as I know it. Deductions: alpha = 3/pi
          and beta = 1.589/2 are the Rust port's values, not the paper's (foveal magnification 10.98 vs the stated
          11.5 mm/deg), kept for fixture parity (-4); gamma3(theta) and eta are reduced to the bare overlap integrals
          of u(phi) with unit gain, omitting the firing-rate derivative weights and quadratic-feedback terms of Eq.
          5.15, so the 'rolls and squares never stable' verdict that drives every SELECTED/IMPOSED badge rests on a
          reduced functional (-8); contoured vs non-contoured is a preset flag, whereas the paper derives it from
          whether the n = 0 or n = 1 local harmonic is critical, and branch_growth always takes W1 as its base (-5);
          the lateral widths xi = 1, xi_hat = 1.5 hypercolumns are upstream choices that put lambda_c at 8.7 mm, 3.1x
          the paper's 2.4-3.2 mm, and the q scan is capped at 3.5 so the paper's scale is unreachable (-5); the
          default full-field theta in (-pi, pi] convention departs from the paper's hemispheric map and the resulting
          seam is understated as 'near the fovea' (-4); tanh sharpness, the m <= 4 eigenfunction truncation and the
          +/-1.5 clamp are upstream artifacts, not paper steps, and quintic selection is absent (-4).
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [158, 172], note: "Exact two-regime map and analytic inverse; constants w0, eps are the paper's, alpha, beta are upstream params.rs values (lines 117-138)"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [553, 599], note: "Fourier-Bessel lateral harmonics with (-1)^n and spread factor; branch_growth adds O(beta^2) coupling sum but is always anchored on W1 (n = 1 critical assumed)"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [686, 695], note: "amplitude_gamma3 is the bare integral of u^2(phi - theta) u^2(phi); no sigma'' / sigma''' weights or quadratic-feedback terms from Eq. 5.15"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [778, 828], note: "Roll/square/rhombic/hex stability tests and the unrestricted argmin-gamma3 rhombic selection that labels rolls and squares as never stable"}
      specimen-match:
        value: 63
        rationale: >-
          Judged on the PNG gallery and the GIF, the tunnel panel is a convincing set of concentric rings with
          tangential line elements, the oblique roll pulls back to a clearly chiral logarithmic spiral, and the square
          lattice gives a radial-plus-circular cobweb that resembles Bressloff's Fig. 31; the four families are
          visually distinct. Deductions: the spiral is not continuous - the full-field convention leaves a seam on the
          left horizontal meridian with 9.9x row-to-row contrast that I computed to span 0.8 wavelengths at 10 deg and
          0.23 at 40 deg, and it is visible in both the PNG and GIF frame 8, whereas Klüver's spirals are continuous
          (-10); the contoured honeycomb panel reads as a hexagonal lattice of blobs rather than a honeycomb (the non-
          contoured GIF frame does show cells) (-4); the fifth panel, the only one the model actually selects, is a
          rhombic blob field that corresponds to no reported form constant, so the model's own choice does not look
          like a Klüver class (-6); at 11 rings per 40 deg the pullbacks are coarser than the 30-36 stripes the paper
          quotes from subjects (-5); there is no side-by-side with Klüver's or Bressloff Fig. 1 / Ermentrout-Cowan
          drawings in the figure, so the match is left to the viewer (-5); the honest SELECTED/IMPOSED badging is
          credited and prevents a larger deduction for imposing three of the four forms.
        evidence:
          - {file: bressloff_v1_form_constants_morphospace.png, lines: [0, 0], note: "Row 2: rings/tunnel and cobweb convincing; spiral chiral but with visible left-meridian seam; honeycomb renders as blob lattice; rhombic (SELECTED) resembles no Klüver class"}
          - {file: docs/media/bressloff_v1_form_constants.gif, lines: [0, 0], note: "Frame 8 (spiral) shows the seam across the left half of the disc; frame 22 (honeycomb, non-contoured) shows clear hexagonal cells"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [1102, 1118], note: "Full-field theta_map = arctan2(v, u) default; bilateral-mirror reflects the same mode so spirals become chevrons (mirror_symmetry 1.000 for all five presets)"}
          - {file: bressloff_v1_metrics.csv, lines: [0, 0], note: "kluver_form_constant rows: spiral seam_contrast=9.91, rendered_cycles=11 for all five panels, three panels IMPOSED-UNSTABLE"}
      parameter-expressivity:
        value: 52
        rationale: >-
          Three genuine model parameters are swept and behave as claimed: q* falls monotonically with the lateral
          surround width (1.46 -> 0.70), rises monotonically with lateral inhibition (0.05 -> 1.00, collapsing to the
          homogeneous mode at I_lat = 0), and the lateral spread flips the critical parity at about 45 and 90 deg; the
          --sweep CLI works for any of six parameters and writes a table. Deductions: at every point of all three
          sweeps the unrestricted cubic selection is 'rhombic', so no swept parameter changes the form-constant family
          - the tunnel/spiral/cobweb/honeycomb morphospace is controlled by the categorical pattern string and
          pattern_angle_deg in planform_modes, which are rendering inputs rather than model parameters (-25); the
          sweeps are displayed only as q* curves, with no gallery of pullbacks along a sweep to show the feature of
          form changing (-10); pattern_angle_deg, which does control spiral pitch, is neither swept nor shown (-5);
          the paper-scale wavelength is unreachable because the scan is capped at q = 3.5 (-5); the hemifield-mode
          toggle is credited as a working chirality control (-3 net).
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [1506, 1560], note: "SWEEPABLE_PARAMS and parameter_sweep record q*, parity and selection; unrestricted_selected_family is rhombic for every value in every sweep"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [982, 1013], note: "planform_modes: the form family is set by the categorical pattern string and pattern_angle_deg, not by any swept coupling parameter"}
          - {file: bressloff_v1_metrics.csv, lines: [0, 0], note: "parameter_sweep rows: selected_family 'rhombic' for all three sweeps; q* ranges and parity flips reported but no family change"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [2139, 2169], note: "Panel F shows only q* vs parameter curves; no rendered pullbacks along the sweep"}
      morphometric-validation:
        value: 55
        rationale: >-
          Quantitative metrics are computed on the output and compared with literature values: the map's magnification
          against Horton & Hoyt's human M(E) = 17.3/(E + 0.75) over 1-40 deg (RMS 6.8%, A = 18.72 vs 17.3, E2 = 1.71
          vs 0.75 deg, extent 74.6 vs 83.0 mm), and the rendered cycle count and lambda_c against the paper's 30-36
          stripes and 2.4-3.2 mm. Deductions: the headline comparison fails - lambda_c is 3.1x too long and 11 cycles
          vs 30-36 stripes - and the failure is disclosed but not resolved or explained by a parameter choice traced
          to the paper (-12); the FFT k* and azimuthal class validate the rendering against its own q*-derived cycle
          count, which is circular (-8); no morphometric of the retinal pullbacks (ring count per degree, spiral pitch
          angle, arm count, cobweb spoke count) is compared with Klüver's reports or Bressloff Fig. 1 (-10); the Rule
          (2011) RMS beta error 0.154 is a fixture-internal comparison to digitised model curves whose source file is
          not vendored, not a comparison to flicker-phosphene psychophysics (-5); the Horton & Hoyt self-test
          threshold of 25% RMS is lenient given a 30% maximum relative error at 1 deg and E2 more than twice the
          empirical value (-5); the Gaussian-only negative control is a correct and credited sanity check.
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [185, 216], note: "compare_cortical_magnification: RMS and max relative error vs Horton & Hoyt over 1-40 deg; the one comparison to measured human data"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [219, 256], note: "compare_paper_scale_anchors: lambda_c 8.68 mm vs 2.4-3.2 mm (ratio 3.1), 11 cycles vs 30-36 stripes, disclosed not corrected"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [2576, 2593], note: "Self-test checks k* equals the rendered cycle count derived from the same q* - a self-consistency check, not a specimen comparison"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [2487, 2493], note: "Horton & Hoyt acceptance threshold 25% RMS; max_abs_rel_error 0.30 and E2 1.71 vs 0.75 deg pass under it"}
      source-traceability:
        value: 84
        rationale: >-
          All seven sources carry DOIs (and PMIDs where they exist) in the docstring, the dataset README and
          paper_citations.bib; the upstream repository is pinned to commit 344863a with file:line references for the
          borrowed constants; the four fixtures are SHA-256 pinned and verified fail-closed at every run; the Horton &
          Hoyt fixture records DOI, PMID, formula and comparison range, and the formula is the one Horton & Hoyt
          published. Deductions: the Rule (2011) fixture's RMS beta error refers to a source-curve file
          (reports/source-curves/rule-2011-fig8-source-curves.json) that is not vendored, so the digitised Fig. 8 data
          behind the 0.154 figure cannot be traced from this repository (-6); the upstream Rust repository and the
          cited params.rs/planform.rs/presets.rs line numbers could not be independently resolved from the repository
          contents, so the alpha/beta provenance rests on assertion (-5); the paper-scale anchors cite only '2002 §1.1
          / §4' without page or equation pinpoints (-3); Klüver (1966) is cited without page for the four-class
          taxonomy (-2).
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [11, 44], note: "Seven primary sources with DOI/PMID and the upstream commit hash and licence"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [111, 138], note: "FIXTURE_CHECKSUMS for four JSON inputs and RETINO_CONSTANT_PROVENANCE mapping each map constant to paper or upstream file:line"}
          - {file: datasets/bressloff/horton_hoyt_1991_magnification.json, lines: [1, 15], note: "Empirical anchor fixture with DOI, PMID, formula A/(E+E2), A = 17.3, E2 = 0.75 and comparison range"}
          - {file: datasets/bressloff/README.md, lines: [9, 14], note: "Fixture table with SHA-256, upstream path and description; Horton & Hoyt row marked as created in this repository"}
      code-traceability:
        value: 72
        rationale: >-
          Most modelling functions carry a docstring citing a specific equation, section or figure (local W_n -> Eq.
          3.12, lateral W_n^lat(q) -> Eq. 4.9, eigenfunction -> §4.2 Eqs. 4.14-4.16, cubic equations -> Eqs. 5.9-5.15
          and Figs. 37-40, map -> §2 / 2002 Eq. 1.1, tangent map -> 2002 §1.1), and the section banners and panel
          titles name the figures being reproduced. Deductions: planform_modes hard-codes per-mode phase multipliers
          (0.35, -0.25) and an amplitude of -1 on one hex_pi mode with no citation, and that hex_pi is cos k1 - cos k2
          + cos k3 rather than the paper's H_pi (-8); tanh sharpness, the m <= 4 truncation and the +/-1.5 clamp are
          traced to upstream planform.rs, not to any paper step (-4); lateral_spread_factor and modified_bessel_i have
          no equation citation (-3); the even-branch hex stability condition (gamma_hex > 0 and gamma0 + 4 gamma_hex >
          0, skipping 2 gamma_hex < gamma0) is uncited (-4); the Lyapunov tie-break is acknowledged as heuristic but
          is still what decides SELECTED vs STABLE-coexisting (-3); the 'Eq.' numbers for W_n could not be verified
          and read as approximate (-2); the ledger panel and CSV columns documenting what each number means are
          credited.
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [519, 532], note: "local_weight_coeff cites Eq. 3.12; lateral_spread_factor has no citation"}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [982, 1013], note: "planform_modes: uncited phase multipliers 0.35 / -0.25 and hex_pi amplitude -1"}
