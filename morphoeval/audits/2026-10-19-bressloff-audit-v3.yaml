# MorphoEval audit — Bressloff et al. (2001/2002) V1 Euclidean Symmetry-Breaking & Klüver Form Constants, 2026-10-19 (v3)
#
# Pass 3 re-score of `2001-bressloff-v1-form-constants.py` and `datasets/bressloff/` after the remediation of all
# 15 open v2 findings in the instrumented loop `morphoeval/runs/2026-10-19-bressloff-v1-loop-pass3`, superseding
# `2026-10-19-bressloff-audit-v2` (62.8 primary / 79.2 second assessor). Same protocol as Passes 1-2:
#   - Primary assessor: Claude Fable 5.1 (fresh subagent d404abfa-cf80-4812-84f9-3ba1afd64565)
#   - Independent blinded second assessor: Gemini 4 Argon (subagent ef92b32d-9f54-4f6c-9608-f3aad7422672),
#     published separately as `2026-10-19-bressloff-second-assessor-audit-v3.yaml` (role: second_assessor).
# Both ran in parallel against commit d6f3c94 with no access to each other's work, to the earlier audits,
# KG or run files, or to git history.
#
# What Pass 3 changed (all 15 v2 remediation items):
#   1. paper-calibration.json runs[] parity (24/24 presets, max |dq*| 2.2e-16; 9 upstream presets added) and all
#      133 fixture checks counted (121 pass: stability_reports 10/11 + runs 111/122), every failure listed.
#   2. Every gallery panel badged SELECTED / STABLE-coexisting / IMPOSED-unstable against the unrestricted cubic
#      amplitude equations (rhombic angle = argmin gamma_3); fifth column = the rhombic lattice the equations select.
#   3. Contoured planforms rendered as an orientation field (argmax_phi) drawn as line elements in cortex and, via
#      the tangent map phi_R = phi + theta_R, in the visual field.
#   4. Full-field theta in (-pi, pi] pullback (chiral spirals continuous) with the left-meridian seam and the mirror
#      symmetry quantified; bilateral-mirror mode kept and compared (--hemifield-mode).
#   5. alpha, beta provenance moved to upstream params.rs:5-8; paper scale anchors (11.5 mm/deg, 30-36 stripes,
#      2.4-3.2 mm) computed: rendered lambda_c = 8.7 mm is 3.1x too long — disclosed, not rescaled.
#   6. Hex contoured FFT k*=21 explained and tested as the 2k harmonic (power at k / sqrt3 k / 2k measured).
#   7. Dead `drift` removed; --sweep PARAM[:lo:hi:n] CLI and Panels F/G (q* vs xi_lat, q* vs I_lat, parity flips
#      at theta_0 = 45 / 90 deg); xi_lat 1.5 vs 3.0 stated in Panel A and the ledger.
#   8. Rule (2011) panel: 16 curves shaded by 5 forcing amplitudes, "no Floquet solver" stated; eigenfunction
#      clamp/truncation disclosed; Lyapunov tie-break documented; registry read (Tamekue 2024 control).
#   9. GIF: uniform phase (seamless loop), 45 deg label from the preset, 5 presets with badges; bib + Tamekue 2024,
#      Klüver 1966; self-test 17 -> 27 checks.
#
# Scores below are the primary assessor's: overall 67.7 (impl. 64.0, bio. 60.0, repro. 81.6), up from 62.8.
# The second assessor scored 80.9 (impl. 76.0, bio. 75.9, repro. 92.5), up from 79.2; panel mean 74.3.
# Remaining findings (both assessors) are listed under `remediation`; the largest are now structural rather than
# presentational: the cubic coefficients are bare orientation-overlap integrals (so rolls and squares are never
# stable and three of Klüver's four forms must be imposed), the full-field seam spans most of the 40 deg disc,
# no swept parameter changes the selected lattice family, and the rendered wavelength is 3.1x the paper's.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not
# calibrated probabilities). Line numbers refer to the files at commit d6f3c94.

