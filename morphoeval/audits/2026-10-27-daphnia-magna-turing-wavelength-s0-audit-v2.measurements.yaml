    claim_boundary:
      reported_in_source:
      - Turing (1952) selects λ_c = 2π/k_c. Schnakenberg (1979) supplies du/dt = a − u + u²v and dv/dt = b − u²v.
      - Macagno (1981), Smith & Macagno (1990), and Hebert & Emery (1990) are the Daphnia sources for visual-system
        pattern formation, ommatidial photoreceptors, and inducible cuticular melanin. None of them reports a 2.736
        µm stripe period.
      reconstructed_in_script:
      - Length unit fixed so the analytical wavelength is 2.736 µm, with a = 0.062, b = 1.180, D_u = 0.016, D_v
        = 0.640.
      - Pass 2 scores σ(k) on the odd modes of the band σ > -0.15 separately from the full band. Both exceed r =
        0.98.
      - The ratio of the saturated Fourier peak to 2.736 µm is reported as coarsening, not as a second target wavelength.
      transfer_boundary:
      - Age does not change along this 1/1 chronoseries. The melanosome and ommatidium comparisons are scale comparisons.
      - The 20.17 µm cuticle peak does not transfer to the 2.736 µm field, and the 2.736 µm field does not transfer
        to the polygons.
      does_not_claim:
      - Does not claim a published 2.736 µm measurement.
      - Does not claim the ×130 polygons are the Turing pattern.
      - Does not claim a signed nanopublication. ~/.nanopub/profile.yml is absent, and no signature was fabricated.
      - Does not claim a second independent assessor.
