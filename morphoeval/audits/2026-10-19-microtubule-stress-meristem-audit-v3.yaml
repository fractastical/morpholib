simulations:
  - id: hamant-microtubule-stress-meristem
    name: "Hamant et al. (2008), Bozorg et al. (2014), Sampathkumar et al. (2014), Uyttewaal et al. (2012), Heisler et al. (2010) & Louveaux et al. (2016) shoot apical meristem shell stress tensor, stress-vs-strain CMT alignment, katanin boundary morphogenesis and PIN1/CMT co-alignment on a growing L1 cellular vertex mesh"
    organism: "Arabidopsis thaliana (shoot apical meristem L1 epidermal shell, organ-meristem saddle boundary, cylindrical stem, and epidermal cells)"
    script: 2008-hamant-microtubule-stress-meristem.py
    output: docs/media/microtubule_stress_meristem_comparison.png
    extra_outputs:
      - docs/media/microtubule_stress_meristem_growth.gif
      - docs/media/microtubule_stress_meristem_vertex_pin1.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-microtubule-stress-meristem-audit-v2
    claim_boundary:
      reported_in_source:
        - "Hamant et al. (2008) Science 322:1650-1655 and Bozorg, Krupinski & Jönsson (2014) PLoS Comput. Biol. 10:e1003410: pressurized-shell / finite-element stress models of the SAM with isotropic stress on the central dome (K > 0), anisotropic tensile stress along the negative-Gaussian-curvature organ boundary (K < 0), 2:1 hoop-to-axial Laplace stress on the stem, circumferential CMTs around single-cell ablations, and the argument that maximal principal stress, not strain, is the directional cue"
        - "Uyttewaal et al. (2012) Cell 149:439-451 and Sampathkumar et al. (2014) eLife 3:e01967: katanin (BOT1/KTN1) sets the mechanical feedback gain; bot1/ktn1 and oryzalin reduce CMT ordering and flatten the boundary crease"
        - "Heisler et al. (2010) PLoS Biol. 8:e1000516: PIN1 polarity correlates with CMT orientation (PIN1-rich membranes parallel to the CMT array), both reorient after ablation (CMTs circumferential, PIN1 directed away from the wound) and the PIN1 response persists under oryzalin; hypothesis that PIN1 accumulates at the most stressed anticlinal wall"
        - "Louveaux et al. (2016) PNAS 113:E4294-E4303: SAM cells, especially at the organ boundary, orient division planes along maximal tensile stress, deviating from the Errera shortest-wall rule when stress is anisotropic"
      reconstructed_in_script:
        - "Section 2: 4-zone pressurized-shell stress table (prescribed sigma_1, sigma_2 per zone), nematic CMT order S = gamma a / (gamma a + 2 D_theta), stiffness anisotropy and viscoplastic Lockhart strain rates; exact integer checks of Lean Laws 1-3; an analytic (Gaussian-weight) 2D cross-section anisotropy field labelled 'FEM' in v2"
        - "Section 3: 24-cell ring with prescribed angular dispersions for stress / strain / bot1 cues; closed-form 5-condition sweep of S, crease depth and ablation cos^2 fitted to the reference JSON (Pearson r = 0.9992 against the same JSON)"
        - "Section 3b (Pass 3): 2D L1 cellular vertex mesh — zone stress tensor as affine boundary pre-strain epsilon_i = sigma_i / E_shell; Hookean wall tensions; virial wall-stress tensor and wall-strain tensor per cell; CMT director relaxation with gamma_MT and S; cellulose reinforcement of CMT-parallel walls; softmax PIN1 allocation on wall tension; PIN1-polar auxin transport with diffusion, production and decay; auxin-enhanced Lockhart creep; division along sigma_1 (else Errera); T1 detection and flip (disabled by default); 9 scenarios with emergent PIN1/CMT co-alignment 0.747 (saddle WT), wound-ring CMT circumferential cos^2 0.985, PIN1 away-from-wound fraction 0.83 in WT and 0.83 under oryzalin, katanin sweep r = 0.995, 57 divisions with Euler residual 0"
        - "Section 4: optical-density segmentation and Sobel/Gaussian structure-tensor coherency on the SHA-256-locked longitudinal SAM section (dome / saddle / stem ROIs)"
      transfer_boundary:
        - "The vertex mesh is a tangent-plane (2D) approximation of the L1 sheet: curvature enters only through the boundary pre-strain, so dome vs saddle differ by boundary anisotropy, not by Gaussian curvature of a 3D surface; absolute S values on the mesh (dome 0.42, saddle 0.57, stem 0.59) are compared with but do not match the Hamant 2008 zone references (0.08, 0.81, 0.57)"
        - "The Heisler (2010) and Louveaux (2016) reference values used for the new measurements are within-30-degree ordinal thresholds (cos^2 >= 0.75) derived from the papers' qualitative statements, with 0.5 as the random null; no figure of either paper was digitised"
        - "The specimen is a stained longitudinal histological section, not an apical PIN1-GFP / MBD-GFP image, so its structure-tensor coherency measures cell-wall edge anisotropy in the section plane, not CMT or PIN1 organisation"
      does_not_claim:
        - "A 3D curved-surface vertex or FEM shell solver, the Bozorg (2014) stress-vs-strain discrimination as an emergent property of the mesh (both cues give circumferential CMTs around the wound here), auxin-maximum (phyllotactic) patterning from PIN1 up-the-gradient transport, subcellular katanin dynamics, or internal L2/L3 corpus mechanics"
    source_refs:
      - hamant2008
      - bozorg2014
      - sampathkumar2014
      - uyttewaal2012
      - heisler2010
      - louveaux2016
      - hamant2010
    summary: >-
      Pass 3 (v3) evaluation of `2008-hamant-microtubule-stress-meristem.py` (overall weighted score 71.0/100,
      down from 93.4 in v2). The remediation adds a genuine mechanistic layer: a growing 2D L1 cellular vertex
      mesh (`L1VertexTissue`, L509-985; `simulate_l1_vertex_patch`, L1020-1156) in which the zone shell stress
      tensor is applied as boundary traction, Hookean wall tensions feed a per-cell virial stress tensor, CMT
      directors follow it with katanin gain, cellulose reinforcement closes the feedback loop, PIN1 is allocated
      to the most stressed walls and transports auxin, cells divide along sigma_1 and T1 flips are detected.
      It reproduces, emergently, Heisler (2010)'s co-alignment of PIN1-rich walls with CMTs (cos^2 0.747 WT vs
      0.47 oryzalin), PIN1 polarity away from an ablated cell in WT and microtubule-independently under oryzalin
      (0.83 / 0.83), circumferential CMTs around the wound (0.985), a monotone katanin sweep (r = 0.995) and
      Louveaux (2016)'s stress-vs-Errera contrast (1.00 vs 0.18), with the Euler characteristic preserved over
      420 divisions and two new machine-checked Lean theorems. The re-score is lower because the Pass 2 layers
      that v2 credited as 'FEM' and 'measurements' are prescribed constants and closed-form fits whose
      headline correlations compare the reference JSON with itself, the mesh is 2D rather than the requested 3D,
      it does not reproduce the Bozorg discrimination, and it over-predicts dome CMT order.
    scores:
      model-fidelity:
        value: 70
        rationale: >-
          Credited: the vertex mesh implements recognisable published mechanisms — Hookean anticlinal wall
          tension with Lockhart creep above a yield strain (`wall_state` L674-682, `step_fields` L819-835),
          the Batchelor virial wall-stress tensor sum_e T_e l_e t⊗t and its principal axis as the CMT cue
          (`cell_tensors` L722-747), nematic S = gamma a / (gamma a + 2 D_theta) in the Bozorg Eq. 12 form
          (L790-798), cellulose reinforcement of CMT-parallel walls closing the stress feedback loop
          (`_wall_stiffness` L665-672), Heisler's stress-based PIN1 rule as a softmax on wall tension with
          PIN1-polar auxin fluxes (`pin1_state` L749-770, transport L803-817), division along sigma_1 with an
          Errera fallback (L1062-1093) and a correct, unit-tested T1 flip (`apply_t1` L922-965); Laws 4-5 are
          machine-checked. Deductions: the mesh is 2D, so the saddle's negative Gaussian curvature is replaced by
          an anisotropic boundary pre-strain (L1046-1047) — the K < 0 vs K > 0 physics of Law 1 is not on the
          mesh (-8); the v2 'FEM' field is a sum of hand-placed Gaussians (L325-330) and the per-zone principal
          stresses are prescribed constants (L173-215), not solved from turgor and curvature (-8); the
          5-condition sweep is a closed-form fit with uncited exponents 1.45 / 0.68 / 15.95 and literal strain-cue
          and oryzalin values (L412-432) (-6); the Bozorg stress-vs-strain discrimination does not emerge on the
          mesh (ablation CMT circumferential 0.985 vs 0.968 for the strain cue; L1137-1155 report it) (-4);
          auxin feedback on growth is phenomenological (k_aux on creep) and no auxin maximum forms (-2);
          in-plane turgor is a small residual (P = 0.15) with periclinal area elasticity standing in for the
          out-of-plane pressure load (-2).
        evidence:
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [509, 985], note: "L1VertexTissue: Voronoi-jittered hex patch, Hookean walls with rest lengths, virial stress tensor, CMT/S dynamics, PIN1 softmax, auxin transport, Lockhart creep, division, T1 flip", supports: true}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [1020, 1156], note: "simulate_l1_vertex_patch: zone stress -> boundary pre-strain -> walls -> M_c -> CMT -> reinforcement -> PIN1 -> auxin -> growth -> division chain; 2D only, curvature not represented (L1046-1047)", supports: true}
          - {file: morphoeval/lean/loops/Loop_036_microtubule_stress_meristem.lean, lines: [165, 268], note: "Laws 4-5 (PIN1/CMT co-alignment under anisotropic wall tension incl. gamma_MT = 0; division/T1 Euler invariant), lean-verified, 0 sorrys", supports: true}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [325, 330], note: "'2D FEM' anisotropy field is three hand-placed Gaussian weights plus a lateral_compression constant — not a finite-element solve", supports: false}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [173, 215], note: "Per-zone sigma_1 / sigma_2 are prescribed multiples of sigma_0 (e.g. 1.90, 0.30) rather than solved from curvature and turgor", supports: false}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [412, 432], note: "5-condition sweep: closed-form S_pred / depth with uncited constants; strain-cue and oryzalin S, depth, cos^2 and r are literals", supports: false}
      specimen-match:
        value: 64
        rationale: >-
          Judged on the regenerated 9-panel PNG and the two GIFs. Credited: Panel E overlays the segmented L1
          contour and three ROIs on the SHA-256-locked Arabidopsis SAM section; Panels G-H show a cellular L1
          patch whose polygonal cell packing, horizontal CMT bars in the stretched saddle patch and circumferential
          bars around the grey ablated cell with magenta PIN1 arrows pointing outward read like Heisler 2010's
          ablation panels and Hamant 2008 Fig. 3; the vertex GIF shows divisions accumulating. Deductions: there
          is still no side-by-side with any author figure (Hamant 2008 Fig. 2-3 CMT maps, Heisler 2010 PIN1-GFP,
          Louveaux 2016 division maps), so the resemblance is left to the viewer (-10); the vendored specimen is a
          longitudinal histological section whereas every mechanism modelled lives in the apical L1 surface, so
          Panel E/F compare section-plane wall-edge anisotropy with CMT order — a category mismatch that v2 scored
          as a match (-10); the dome patch (Panel I, 'Dome WT') shows S = 0.42 and visibly ordered CMT bars where
          the dome should be isotropic (reference 0.08) (-6); Panels A-D are unchanged phenomenological renderings
          (-4); the vertex-mesh panels have no scale bar or micron axis (-2); 'Distinct morphologies visually
          distinct' is satisfied (dome / saddle / ablation differ clearly) and credited.
        evidence:
          - {file: docs/media/microtubule_stress_meristem_comparison.png, lines: [0, 0], note: "Panels G-H: saddle mesh with horizontal CMT bars and PIN1-rich (green) walls; ablation mesh with circumferential CMTs and outward PIN1 arrows around the grey wound; Panel E specimen with ROIs; no author-figure side-by-side", supports: true}
          - {file: docs/media/microtubule_stress_meristem_vertex_pin1.gif, lines: [0, 0], note: "9 frames of the growing saddle patch (0 -> 57 divisions) with PIN1-rich walls and CMT directors", supports: true}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [1268, 1341], note: "Specimen segmentation + structure-tensor coherency on a longitudinal section; measures wall-edge anisotropy in the section plane, not CMT/PIN1 organisation in the L1 surface", supports: false}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [1779, 1803], note: "Panels G and H draw auxin / S fills, PIN1-rich walls, CMT bars, polarity arrows and the wound ring (_draw_vertex_mesh L1521-1571); no scale bar", supports: true}
      parameter-expressivity:
        value: 72
        rationale: >-
          Credited: on the mesh, gamma_MT controls S monotonically (0 -> 0.147 -> 0.57 for 0 / 0.45 / 2.4, r =
