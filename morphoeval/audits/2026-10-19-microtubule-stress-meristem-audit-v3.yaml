# MorphoEval Pass 3 (v3) Audit — Hamant et al. (2008) Science, Bozorg et al. (2014) PLoS Comput. Biol.,
# Sampathkumar et al. (2014) eLife, Uyttewaal et al. (2012) Cell, Heisler et al. (2010) PLoS Biol. &
# Louveaux et al. (2016) PNAS — SAM Shell Stress, CMT Feedback, PIN1 Co-Alignment on a Growing L1 Vertex Mesh,
# 2026-10-20 (v3)
#
# Pass 3 re-score of `2008-hamant-microtubule-stress-meristem.py` (Slot 036) after the Step 12 -> 5 remediation
# of the single open v2 item in the instrumented loop `2026-10-19-microtubule-stress-meristem-loop-pass3`,
# superseding `2026-10-19-microtubule-stress-meristem-audit-v2` (93.4).
#   - Primary assessor: Claude Fable 5.1 (builder + assessor in the same autonomous slot; no blinded second
#     assessor was available in this round, so `second_assessor` is carried from v2 for provenance only and
#     did not score this version).
#
# What Pass 3 changed (closes the v2 remediation item in its closest honest reduced form):
#   1. New section 3b: `L1VertexTissue`, a 2D apical-view cellular vertex model of the L1 epidermis (61 Voronoi-
#      jittered cells) in which the zone shell stress tensor (sigma_1, sigma_2) of section 2 is applied as an
#      affine boundary pre-strain, anticlinal walls carry Hookean tension with Lockhart creep, each cell's virial
#      (Batchelor) wall-stress tensor drives a CMT director with katanin gain gamma_MT, cellulose reinforces
#      CMT-parallel walls (positive feedback), PIN1 is allocated by a softmax on wall tension (Heisler 2010) and
#      transports auxin that loosens walls, cells divide along sigma_1 (Louveaux 2016) and T1 neighbour exchanges
#      are detected (flip implemented and unit-tested, disabled by default because plant walls are cemented).
#   2. Nine scenarios (dome / saddle / stem x WT, bot1, oryzalin, strain cue; ablation x WT / strain / oryzalin),
#      7 new emergent measurements (16 total), 6 new self-test checks (14 total), panels G-I and a 9-frame
#      vertex-mesh GIF; two new Lean 4 theorems (Laws 4-5, 0 sorrys); Heisler 2010, Louveaux 2016, Hamant & Traas
#      2010 added to the bib; `pin1_cmt_coalignment_reference.json` SHA-256-pinned (5 pinned files).
#   3. Dead CLI flags (`--turgor-mpa`, `--gamma-mt`, `--wall-thickness-um` were parsed and never used in v2) now
#      drive the zone solver; `--self-test` no longer silently re-renders the media.
#
# WHY THE OVERALL SCORE FALLS (93.4 -> 71.0): re-reading the Pass 2 code against the evidence shows that several
# v2 credits were not supported: the "2D FEM" field (L288-355) is a sum of hand-placed Gaussians, the per-zone
# principal stresses (L173-215) are prescribed constants, the 5-condition sweep (L412-432) is a closed-form fit
# whose strain-cue values and "empirical correlation r" (0.991, -0.415) are literal constants copied from the
# reference JSON and then reported as measurements, two specimen measurements use reference_value = value, and
# the CLI overrides were dead code. The vertex mesh adds a genuine mechanistic layer, but it is 2D not 3D, does
# not reproduce the Bozorg stress-vs-strain discrimination, and over-predicts dome CMT order. The drop is a
# correction of inflated v2 scores plus honest accounting of the new layer's limits, not a regression.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the working-tree files at commit d58a084 (Pass 3 changes uncommitted
# in the shared tree; see checkpoint note).

