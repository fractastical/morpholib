          dome 0.56 cos^2 with the x-axis), the cue type switches between stress and strain tensors, ablation
          flips the ring to circumferential, and `--vertex-scenario / --vertex-steps / --n-rings / --enable-t1`
          expose the scenario, duration, mesh size and T1 switch (L2002-2006); the previously dead
          `--turgor-mpa / --gamma-mt / --wall-thickness-um` flags now reach the zone solver (L2019-2021).
          Deductions: the vertex-mesh constants that matter most (E_shell, k_wall, K_A, beta_pin, phi_wall,
          kappa_cmt) are not CLI-exposed and no sweep over them is rendered (-10); the strain-cue switch does not
          produce a visibly different morphology (S 0.49 vs 0.57, same alignment) so that parameter fails the
          'visibly controls the feature' test on the mesh (-8); the zone-level and sweep-level parameters of
          sections 2-3 act through fitted closed forms rather than the model (-6); `--gamma-mt` changes only the
          zone solver printout and not the rendered figure or the mesh suite (-4).
        evidence:
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [1159, 1225], note: "VERTEX_SCENARIOS (9 scenarios over zone x gamma x cue x ablation) and the suite's katanin sweep / zone comparison", supports: true}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [1993, 2032], note: "CLI: --vertex-scenario, --vertex-steps, --n-rings, --enable-t1; --turgor-mpa/--gamma-mt/--wall-thickness-um now applied to the zone solver (L2019-2021) — in v2 these three were parsed and unused", supports: true}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [519, 530], note: "Mesh constants P_turgor, k_wall, K_A, kappa_cmt, D_theta are constructor defaults with no CLI path", supports: false}
      morphometric-validation:
        value: 60
        rationale: >-
          Credited: `measure_morphoeval` (L1344-1519) now returns 16 measurements; the 7 Pass 3 entries
          (L1451-1518) are emergent quantities computed on the mesh — PIN1-wall/CMT co-alignment with bot1 and
