    remediation:
    - >-
      2008-hamant-microtubule-stress-meristem.py:1397-1405 with 412-432 — the 'Bozorg stress cue vs strain-cue
      correlation' measurement reports emp_r, a literal 0.991 / -0.415 copied from the reference JSON, and the
      5-condition sweep's S_pred / depth / cos^2 are closed-form fits (strain-cue and oryzalin rows are pure
      constants). Replace both with values computed on the vertex mesh (e.g. correlation between the mesh CMT
      director field and the shell sigma_1 field under stress vs strain cue; crease depth from an out-of-plane
      buckling or curvature proxy) or delete the measurements and the r = 0.9992 panel title.
    - >-
      2008-hamant-microtubule-stress-meristem.py:509-606 and 1046-1047 — the mesh is planar; the saddle's K < 0
      enters only as boundary pre-strain (76:12 MPa -> 0.19:0.03 strain). Embed the vertex positions on a
      parametrised surface (sphere cap for the dome, hyperbolic paraboloid for the boundary, cylinder for the
      stem), apply turgor as a normal load and recover the in-plane stress from the shell equilibrium so that
      Law 1's Gaussian-curvature inversion is tested on the mesh rather than imposed.
    - >-
      2008-hamant-microtubule-stress-meristem.py:1137-1155 and 1451-1478 — the Bozorg stress-vs-strain
      discrimination does not emerge: strain-cue ablation gives circumferential CMTs (0.968) like the stress cue
      (0.985), and the saddle strain-cue S (0.49) barely differs from WT (0.57). Implement growth-strain (not
      elastic wall strain) as the strain cue — the rate tensor of rest-length creep per cell — which is what
      Bozorg et al. show becomes perpendicular to the stiffened direction under feedback.
    - >-
      2008-hamant-microtubule-stress-meristem.py:1206-1212 and Panel I — dome WT S = 0.42 vs reference 0.082
      (zone RMSE 0.24): growth-induced cell-scale stress anisotropy (0.31) under an isotropic boundary drives CMT
      order the dome should not have. Add a cell-scale averaging length or an anisotropy threshold below which
      S collapses (Hamant 2008 reports isotropic CMTs in the CZ), and sweep it so the dome / saddle contrast
      becomes a tested prediction.
    - >-
      2008-hamant-microtubule-stress-meristem.py:288-355 and Panel A title — `build_2d_meristem_fem_field` is a
      sum of Gaussians; rename it (`build_2d_meristem_anisotropy_sketch`) and retitle Panel A, or replace it with
      a real 2D membrane solve on the cross-section profile.
    - >-
      2008-hamant-microtubule-stress-meristem.py:1438 and 1447 — specimen coherency and area-fraction measurements
      use reference_value = value. Either digitise a published coherency value (e.g. Sampathkumar 2014 Fig. 2
      anisotropy) or mark reference_value null and let measure_outputs report 'no reference recorded'.
    - >-
      datasets/microtubule_stress_meristem/pin1_cmt_coalignment_reference.json:70-118 — figure numbers for
      Heisler 2010 and Louveaux 2016 are unverified and the thresholds are ordinal. Verify against the PDFs and
      digitise at least one quantitative distribution (Heisler 2010 PIN1-vs-CMT angle histogram; Louveaux 2016
      division-angle vs stress histogram) so the co-alignment and division measurements get numeric references.
    - >-
      2008-hamant-microtubule-stress-meristem.py:519-530 and 1993-2032 — expose E_shell, k_wall, K_A, beta_pin,
      kappa_cmt and phi_wall on the CLI, add a `--sweep PARAM:lo:hi:n` over them with a rendered panel, and add
      a `--seed` sweep so the self-test thresholds (0.70, 0.66) are shown to hold across seeds rather than
      sitting just below one seed's values.
