        evidence:
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [1451, 1518], note: "7 Pass 3 measurements with methods, references (ordinal thresholds flagged as such), random nulls and controls", supports: true}
          - {file: datasets/microtubule_stress_meristem/pin1_cmt_coalignment_reference.json, lines: [1, 118], note: "Reference thresholds with reference_kind and random_control_value fields; parameter table of the mesh", supports: true}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [1397, 1405], note: "'Principal stress cue r = 0.991 vs strain-cue r = -0.415' measurement is the literal emp_r constant from L420/L426, not a computed correlation", supports: false}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [1424, 1432], note: "5-condition Pearson r compares fitted closed forms with the reference JSON they were fitted to", supports: false}
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [1438, 1447], note: "Specimen coherency and area-fraction measurements use reference_value = value (self-referential)", supports: false}
      source-traceability:
        value: 84
        rationale: >-
          Credited: seven primary sources with DOIs in the module docstring, dataset README and bib (Heisler
