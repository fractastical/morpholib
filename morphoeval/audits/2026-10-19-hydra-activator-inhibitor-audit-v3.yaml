          {64..150} raises the tentacle number 5 -> 10 (rho = 0.97, Panel E2); --shell-length,
          --shell-steps and --kappa-a are exposed on the CLI (L2008-2010). Deductions: the kappa_a
          effect on ring position is small (0.05 L over three decades) because the tentacle
          inhibitor already excludes the apex (-4); the count sweep jumps 5 -> 7 and never
          produces the specimen's 6 (-3); the tentacle-inhibitor range D_c, the most obvious
          "number of tentacles" knob, is not swept in the shell (in prototyping it changed amplitude
