        1972-gierer-hydra-activator-inhibitor.py:788-799 and 913-923 — THREE_SYSTEM_PARAMS and the coupling
        functions tentacle_drive / foot_drive are this implementation's reduced forms (Hill gating
        sigma^8/(0.6^8+sigma^8), suppression 1/(1+kappa_a a), foot 1/(1+(sigma/0.03)^2)). Digitise Meinhardt
