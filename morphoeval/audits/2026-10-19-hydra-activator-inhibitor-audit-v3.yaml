          uniform and the foot sits at the basal disc as in the animal. Deductions: the shell gives 7
          tentacle primordia where the specimen has 6, and the body length that makes the spacing
          match is a calibration (L800, L1733-1742) (-5); the ring offset 0.111 is inside but not at
          the centre of the specimen band 0.070 +- 0.081 (-2); the regenerated hypostome on the wide
