          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [981, 1046], note: "analyze_shell_pattern: head CV_theta, ring rows/peaks/spacing CV/offset/circumference, foot, apex leak, analytic firing band", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [1744, 1783], note: "Foot, ablation, Spearman and regeneration measurements use model-internal reference values rather than literature or specimen numbers", supports: false}
