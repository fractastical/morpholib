simulations:
  - id: gierer-hydra-activator-inhibitor
    name: "Gierer & Meinhardt (1972) & Meinhardt (1993, 2012) Hydra vulgaris activator-inhibitor morphogenesis, head regeneration, tentacle ring & coupled three-system 3D shell"
    organism: "Freshwater cnidarian polyp (Hydra vulgaris): apical hypostome polarity, surgical head regeneration, sub-hypostomal tentacle ring and basal foot on a specimen-shaped body shell"
    script: 1972-gierer-hydra-activator-inhibitor.py
    output: docs/media/hydra_activator_inhibitor_comparison.png
    extra_outputs:
      - docs/media/hydra_activator_inhibitor_growth.gif
    status: evaluated
    source_refs:
      - gierer1972
      - meinhardt1974
      - meinhardt1993
      - meinhardt2012
    supersedes_audit_id: 2026-10-19-hydra-activator-inhibitor-audit-v2
    claim_boundary:
      reported_in_source:
        - "Gierer & Meinhardt (1972) Eqs. (15a)-(15b): short-range autocatalytic activator a^2/h with long-range inhibitor; a shallow source gradient yields a single apical peak (Fig. 2); removing the apical half lets the basal fragment regenerate a peak at its cut end (Fig. 3)"
        - "Meinhardt (1993): hypostome, tentacles and foot are generated by separate activator-inhibitor systems coupled through a slowly adapting source density; tentacle activation requires a high source density and is locally suppressed by the head activator (so tentacles form at the border of the hypostome); the foot forms where the source density is lowest; fragments regenerate a hypostome and a new tentacle ring"
        - "Meinhardt (2012): review of the same three-system scheme including size-dependent and regeneration behaviour"
      reconstructed_in_script:
        - "Exact homogeneous steady state, Jacobian, d_c = (sqrt(2)+1)^2 and dispersion relation; 1D polar column (N = 40) with apical dominance; surgical bisection with 87.4 % head recovery; periodic 64-cell tentacle ring (6 peaks) with equal-diffusion control, diffusivity-ratio and domain-length sweeps; computer-vision segmentation of the vendored specimen (6 tentacles)"
        - "Pass 3: the specimen's body-column radius profile, tentacle-attachment ring and inter-tentacle spacing; a finite-difference Laplace-Beltrami shell (90 x 64) on that surface of revolution; reduced head / tentacle / foot Gierer-Meinhardt loops with basal inhibitor production (analytic firing threshold w_c = 0.1633) and a head-raised source density; kappa_a sweep with kappa_a = 0 ablation, body-length sweep, amputation at L/2 with head/ring regeneration timeline; 14 quantitative measurements"
      transfer_boundary:
        - "The three-system couplings (Hill gating sigma^8/(0.6^8 + sigma^8), suppression 1/(1 + kappa_a a), foot drive 1/(1 + (sigma/0.03)^2), sigma dynamics c_sigma a - mu_sigma (sigma - sigma_0)) and all coefficients are this script's reduced choices calibrated to reproduce the qualitative Meinhardt (1993) layout; they are not digitised from the paper's appendix equations"
        - "The shell body length L = 90 cells is a declared scale calibration (model tentacle spacing ~8.1 cells vs specimen spacing 0.084 of body length), so the tentacle COUNT (7 vs specimen 6) is a geometric consequence, not an independent prediction; the ring axial offset (0.111 vs 0.070 +- 0.081), uniform hypostome cap, basal foot and head-before-ring regeneration order are uncalibrated predictions"
        - "The 1D ring (N_ring = 64, lambda ~10.7 cells, 6 peaks) and the shell ring (lambda ~8.1 cells) use the same D_b, D_c but select different wavelengths; the 1D '6 tentacles' therefore also rests on an (undeclared in v2) circumference calibration"
        - "Specimen references are measured on a 2D projection of a tilted, contracted polyp and used as bands, not exact targets; there is one specimen and one seed"
      does_not_claim:
        - "A finite-element mesh, wound closure or tissue remodelling (the regenerated head on the wide cut surface is a localised spot, CV_theta = 0.95, not a cap), Meinhardt's tentacle-before-hypostome regeneration order (the model gives t_head < t_ring), the foot -> source-density negative feedback, budding, or a quantitative size series for tentacle number"
    summary: >-
      Pass 3 (v3) evaluation of `1972-gierer-hydra-activator-inhibitor.py` (89.5/100, down 2.1 from
      91.6 in Pass 2). The v2 remediation item is closed in a reduced, honestly labelled form: the 1D
      column and ring are now accompanied by a coupled head / tentacle / foot activator-inhibitor
      model on a finite-difference surface of revolution whose radius profile is measured on the
      vendored Hydra vulgaris specimen. The shell reproduces an azimuthally uniform hypostome cap
      (CV_theta = 0.002), one sub-hypostomal tentacle ring of 7 primordia at s/L = 0.111 (specimen
      attachment band 0.070 +- 0.081; 6 tentacles), a uniform basal foot (head-foot separation
      0.99 L), a monotone basal shift of the ring with the head->tentacle suppression kappa_a
      (Spearman rho = 1.0) with tentacle activator leaking into the hypostome when kappa_a = 0
      (x~15), a monotone increase of tentacle number with body size (rho = 0.97), and after
      amputation at L/2 a regenerated hypostome (98 %) followed by a new ring below it. The
      remediation also exposed and fixed provenance defects that v2 had not caught (JSON regimes
      block, docstring statistics, environment versions), and the remaining gaps are structural:
      reduced coupling forms, declared scale calibration, no FEM / remodelling, head-first
      regeneration, model-internal reference values for some new measurements.
    scores:
      model-fidelity:
        value: 91
        rationale: >-
          The Gierer & Meinhardt (1972) part is unchanged and exact: steady state, Jacobian,
          d_c = (sqrt(2)+1)^2, dispersion (L187-268), 1D column / bisection / ring (L298-533),
          backed by 3 Lean theorems. Pass 3 adds the requested mechanism: three coupled
          activator-inhibitor loops plus source density on a 3D surface of revolution with the
          correct Laplace-Beltrami operator (L827-886, L925-978), each loop given a stable off state
          by basal inhibitor production so that the tentacle band and the foot are placed by an
          analytic threshold w_c (L808-825) that the self-test verifies against the simulated band
          (L1964-1965). Deductions: the coupling functions and all 20 coefficients in
          THREE_SYSTEM_PARAMS (L788-799) are the script's reduced forms, cited to Meinhardt (1993)
          only qualitatively, not the paper's appendix equations (-4); the shell is finite-difference
          with fixed geometry, not the finite-element shell the v2 item asked for (-2); the foot ->
          source-density feedback of Meinhardt's scheme is absent and the sigma equation relaxes to a
          prescribed exp(-4s/L) profile (-2); Meinhardt's tentacle-first regeneration is not
          reproduced because tentacle gating requires sigma to rise under the new head first (-1).
        evidence:
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [187, 268], note: "Exact Gierer-Meinhardt homogeneous steady state, Jacobian J_0, d_c = (sqrt(2)+1)^2 and dispersion sigma(k) (unchanged from v2)", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [827, 886], note: "CylindricalShellGrid: Laplace-Beltrami (1/r) d_s(r d_s) + (1/r^2) d_theta^2 with exact Fourier theta step and backward-Euler tridiagonal s step", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [925, 978], note: "simulate_three_system_shell: head (a,h), tentacle (b,c), foot (f,g) loops with basal inhibitor production and source density sigma raised by a", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [788, 799], note: "THREE_SYSTEM_PARAMS: 20 coefficients and Hill constants chosen by this implementation, not digitised from Meinhardt (1993)", supports: false}
          - {file: morphoeval/lean/loops/Loop_001_hydra_activator_inhibitor.lean, lines: [96, 198], note: "5 new Lean 4 theorems (firing-threshold discriminant antitone + instance, tentacle-drive monotonicity, head-foot exclusion, shell Laplacian conserves constants); 0 sorrys", supports: true}
      specimen-match:
        value: 87
        rationale: >-
          The rendered figure now puts the model and the specimen side by side at three levels:
          the segmented photograph with its 6 tentacles and body axis (Panel C1), the azimuthal
          luminance profile vs the 1D ring (C2), and in Pass 3 a 3D shell whose silhouette IS the
