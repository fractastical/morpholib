          shown (-3); sigma_t, p_t and sigma_f (which set the ring and foot positions) have no
          sweep or CLI flag (-2).
        evidence:
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [1123, 1144], note: "kappa_a sweep incl. ablation; Spearman of ring centroid vs kappa_a", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [1146, 1166], note: "Body-length sweep L in {64,72,90,110,131,150}: tentacle count, spacing and Spearman", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [2008, 2010], note: "CLI flags --shell-length / --shell-steps / --kappa-a wired into render_outputs()", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [788, 799], note: "sigma_t, p_t, sigma_f, D_c fixed in THREE_SYSTEM_PARAMS without sweep or CLI exposure", supports: false}
      morphometric-validation:
        value: 89
        rationale: >-
          `measure_morphoeval()` (L1691-1856) now returns 14 measurements. The 7 Pass 2 metrics
          keep their literature / specimen references; the 7 new shell metrics include three with
