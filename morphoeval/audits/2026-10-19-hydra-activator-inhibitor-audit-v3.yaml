          - {file: docs/media/hydra_activator_inhibitor_comparison.png, lines: [0, 0], note: "Panels C1/D1/D2/E1/E3: specimen segmentation, specimen-shaped 3D shell with red cap / cyan 7-spot ring / green foot, unrolled map with the specimen attachment band, regeneration map", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [695, 785], note: "measure_specimen_body_profile: tip/basal-disc walk, distance-transform radius profile r(s), attachment radius (tissue fraction < 0.98), spacing / body length", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [1403, 1467], note: "Panel D1 3D surface of revolution from grid.surface_xyz() and Panel D2 unrolled map with specimen attachment band", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [800, 805], note: "SHELL_DEFAULT_LENGTH_CELLS = 90 is the declared scale calibration; the resulting 7 tentacles vs 6 on the specimen is a mismatch", supports: false}
      parameter-expressivity:
        value: 88
        rationale: >-
          Pass 2 sweeps remain (diffusivity ratio across d_c, domain length). Pass 3 adds two sweeps
          of genuine three-system parameters with monotone, verified effects: the head->tentacle
          suppression kappa_a in {0, 0.3, 1, 3, 10} shifts the ring centroid basally
          (0.072 -> 0.122 L, Spearman rho = 1.00) and the kappa_a = 0 ablation lets tentacle
