# MorphoEval audit — Gierer & Meinhardt (1972) / Meinhardt (1993, 2012) Hydra Activator-Inhibitor Morphogenesis, 2026-10-19 (v3)
#
# Pass 3 re-score of `1972-gierer-hydra-activator-inhibitor.py` (2,047 lines, 14 self-test checks) after the
# remediation of the single open v2 finding in the instrumented loop
# `morphoeval/runs/2026-10-19-hydra-activator-inhibitor-loop-pass3`, superseding
# `2026-10-19-hydra-activator-inhibitor-audit-v2` (91.6). Same protocol as Passes 1-2; the primary assessor
# re-read every cited line of the CURRENT file (commit 4d5512d) before scoring.
#
# What Pass 3 changed (the v2 remediation item: "extend the 1D column and ring to a coupled 3D cylindrical
# shell with separate head-, tentacle- and foot-activator loops (Meinhardt 1993, 2012)"):
#   1. `measure_specimen_body_profile` (L695-785): the vendored Hydra vulgaris photograph now supplies the
#      body-column radius profile r(s) (distance transform along the PCA axis from the hypostome tip to the
#      basal disc), the tentacle-attachment ring (offset 0.070 of body length, half-thickness 0.081) and the
#      inter-tentacle spacing / body length (0.084).
#   2. `CylindricalShellGrid` (L827-886): Laplace-Beltrami operator of the specimen-shaped surface of
#      revolution on a 90 x 64 finite-difference grid — exact Fourier step in theta (row-dependent symbol
#      -D k_n^2 / r_i^2), backward-Euler tridiagonal step in s, unconditionally stable (D_h = D_g = 60).
#   3. `simulate_three_system_shell` (L925-978): reduced Meinhardt (1993) head / tentacle / foot
#      Gierer-Meinhardt loops with basal inhibitor production (firing threshold w_c = 0.1633,
#      `three_system_firing_threshold` L808-825), tentacle drive H_t(sigma)/(1 + kappa_a a) (L913-918),
#      foot drive 1/(1 + (sigma/sigma_f)^2) (L920-923) and a source density raised by the head activator.
#   4. Experiments (L1049-1186): kappa_a sweep incl. the kappa_a = 0 ablation, body-length sweep,
#      amputation at L/2 with regeneration timeline; 7 new measurements (L1712-1783), self-test 8 -> 14
#      checks (L1922-1992), CLI flags --shell-length / --shell-steps / --kappa-a (L2008-2010).
#   5. Provenance fixes exposed by the remediation: the reference JSON's `hydra_regimes_and_experiments`
#      block did NOT match the code in Pass 2 (N = 60 vs 40, slope -0.15 vs -0.20, ring 50 vs 64,
#      recovery 0.90 vs 0.85, domain lengths {20..95} vs {22..88}) and is now in parity and asserted;
#      the v2 docstring quoted CV = 0.0442 and std = 1.48e-6 where the code produces 0.070 and 1.8e-15;
#      the v2 environment block listed numpy 2.4.2 / scipy 1.17.0 / matplotlib 3.10.8 / Pillow 12.1.1
#      whereas the venv actually has numpy 2.5.4 / scipy 1.16.3 / matplotlib 3.10.7 / Pillow 12.0.0.
#   6. Five new Lean 4 theorems (0 sorrys, `lean` exit 0) in `Loop_001_hydra_activator_inhibitor.lean`
#      L96-198, registered in `math_kg_loops/gierer-hydra-activator-inhibitor.yaml` (7 laws).
#
# Scores below: overall 89.5 (down from 91.6). The decrease is deliberate: the remediation delivered the
# requested mechanism in a reduced, declared form, but it also exposed that (a) the Pass 2 JSON/doc/env
# provenance was partly wrong, (b) the 1D ring's "6 tentacles" rested on an undeclared circumference
# calibration (N_ring = 64) just as the shell's scale now rests on a declared one, and (c) the three-system
# couplings are this script's functional forms, not Meinhardt's appendix equations. Remaining findings are
# listed under `remediation` with line pins.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files at commit 4d5512d (working tree of this loop).

