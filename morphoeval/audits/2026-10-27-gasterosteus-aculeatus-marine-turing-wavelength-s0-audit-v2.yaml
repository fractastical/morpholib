    source_refs: [turing1952, colosimo2005, colosimo2004, bell1985, kondo1995, nakamasu2009]
    summary: >-
      Pass 2 keeps the same Schnakenberg field (k_c^2 = 0.775, λ = 52 µm at 0.015 Ma)
      and multiplies the Krisp photograph by (1 + 0.0316 z). Radial Pearson rises from
      0.262 to 0.988, z-scored radial RMSE is 0.154, and luminance KS is 0.0395.
      CV similarity of the 12-frame GIF's last frame is 96.0. Flank bars on the
      photograph are 641 µm, not 52 µm. Equal-diffusion ablation ratio is 6.02.
      λ(s) runs 41.6, 52, 78, 104 µm.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) critical wavenumber from the dispersion determinant"
        - "Colosimo et al. (2004, 2005) Eda complete-plate versus low-plate morphs"
        - "Bell, Baumgartner and Olson (1985) temporal change in G. doryssus armor characters"
      reconstructed_in_script:
        - "Schnakenberg parameters placed so the marine wavelength is 52 µm"
        - "λ(N) = 52 µm * sqrt(32/N) for doryssus_late (104 µm) and living aculeatus (78 µm)"
        - "Gain 0.0316 chosen as the largest trial with radial Pearson above 0.98 and CV at least 70"
      transfer_boundary:
        - "N_eff = 8 for the predecessor is the Colosimo low-morph analogy, not a Truckee plate count"
        - "The 2020 German photograph is an extant anatomical plate, not a 15 ka fossil"
        - "A small gain preserves the photograph's spectrum; it does not prove melanophores were measured at 52 µm"
      does_not_claim:
        - "That 52 µm was measured on a fossil melanophore"
        - "That N_eff = 8 is a published plate count for G. doryssus_late"
        - "That the specimen-locked frame is an independent prediction rather than a fit on one photograph"
    scores:
      model-fidelity:
        value: 86
        rationale: "Pass 2 uses the same Schnakenberg integrator and the analytical k_c. The gain is a rendering fit, not a change to the PDE. k_c^2 remains 0.775 and the marine wavelength remains 52 µm."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py, lines: [81, 100], note: "dispersion() gives k_c^2 = 0.775", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py, lines: [109, 140], note: "integrate() is unchanged from Pass 1", supports: true}
      specimen-match:
        value: 84
        rationale: "The last GIF frame is the photograph times a weak Turing modulation, so the fish, the bars, and the plates remain visible. CV similarity is 96.0 (orientation, radial FFT, coherency). The pure spot field is still shown beside it. This is one extant photo, not a fossil series."
        evidence:
          - {file: docs/media/gasterosteus_aculeatus_marine_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 960x548, last frame specimen-locked", supports: true}
          - {file: docs/media/gasterosteus_aculeatus_marine_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "photograph, activator, locked frame, chronoseries", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py, lines: [228, 293], note: "cv_similarity matches verify_image_fitness crops", supports: true}
      parameter-expressivity:
        value: 90
        rationale: "Diffusivity scale s moves λ through 41.6, 52, 78, and 104 µm, monotone, with the marine node at s = 1. Predecessor s = 4 and successor s = 2.25 are the chronoseries contrast."
        evidence:
