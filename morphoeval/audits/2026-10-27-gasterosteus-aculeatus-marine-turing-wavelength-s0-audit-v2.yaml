    name: "Schnakenberg wavelength at 52 µm for the Late Pleistocene marine stickleback (Pass 2 specimen-locked)"
    organism: "Gasterosteus aculeatus_marine"
    script: models/2026-delphi10000-gasterosteus-aculeatus-marine-turing-wavelength-s0.py
    output: docs/media/gasterosteus_aculeatus_marine_turing_wavelength_s0_growth.gif
