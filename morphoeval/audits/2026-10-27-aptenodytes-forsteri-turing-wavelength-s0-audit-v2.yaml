simulations:
  - id: delphi10000-aptenodytes-forsteri-turing-wavelength-s0
    name: "Schnakenberg wavelength at the 1.178 mm shell-thickness tier of Aptenodytes forsteri"
    organism: "Aptenodytes forsteri (Emperor penguin), Holocene, 0 Ma"
    script: models/2026-delphi10000-aptenodytes-forsteri-turing-wavelength-s0.py
    output: docs/media/aptenodytes_forsteri_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: 2026-10-27-aptenodytes-forsteri-turing-wavelength-s0-audit
    source_refs: [turing1952, prum2002, kondo2010, schnakenberg1979, polar2008, descouens2012]
    model_spec:
      sim_id: delphi10000-aptenodytes-forsteri-turing-wavelength-s0
      seed: 3116
      a: 0.20
      b: 0.30
      delta: 42
      lambda_m: 0.0011776059735208078
      inputs:
        - datasets/aptenodytes_forsteri_turing_wavelength_s0/aptenodytes_forsteri_specimen.jpg
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation for a two-species reaction-diffusion system."
        - "Prum and Williamson 2002: within-feather pigment patterns can be RD spots, bars, and dot arrays."
        - "Chinese Journal of Polar Research 2008: emperor egg 121.3 by 83.8 mm, shell thickness 1.11 mm (0.94-1.32)."
      reconstructed_in_script:
        - "Schnakenberg kinetics a=0.20, b=0.30, D_v/D_u=42, with D_u set so the fastest mode is 10^(-2.929) m."
        - "Commensurate-scale sweep comparing dispersion wavelength to the PDE Fourier peak."
        - "Median-to-99.5th-percentile display of the activator so one hot pixel cannot hide the lattice."
      transfer_boundary:
        - "Shell thickness is a through-shell length. Using it as the lateral wavelength is a scale identification for this tier, not a published pore-spacing measurement."
      does_not_claim:
        - "Does not claim the MHNT photograph's 0.66 mm pore FFT equals lambda_c."
        - "Does not claim body-scale black-white countershading is a 1.178 mm Turing mode."
        - "Does not claim a predecessor chronospecies; the series length is 1."
        - "Sibling slot 119 parameters (alpha 1.31) are not used."
    needs:
      - id: R1-display
        need_type: specimen_comparison
        target_dimension: specimen-match
        description: "Median-to-p99.5 scaling shows the spot lattice, and the caption states pore FFT 0.66 mm beside lambda_c."
        status: resolved
        novelty_n: 1
        contradiction_c: 0
        depth_d: 1
        age_days_a: 0
      - id: R2-gof
        need_type: morphometric_validation
        target_dimension: morphometric-validation
        description: "Pearson r 0.9979, RMSE 0.0301 mm, KS 0.143 on seven commensurate scales. Law and PDE values differ."
        status: resolved
        novelty_n: 1
        contradiction_c: 0
        depth_d: 1
        age_days_a: 0
      - id: R3-ablation
        need_type: parameter_sweep
        target_dimension: parameter-expressivity
        description: "Equal-diffusion amplitude ratio 0.0039 is in the figure caption and in the sweep."
        status: resolved
        novelty_n: 1
        contradiction_c: 0
        depth_d: 1
        age_days_a: 0
      - id: R4-segment
        need_type: specimen_comparison
        target_dimension: morphometric-validation
        description: "Specimen foreground 0.535, coherency 0.384, circularity 0.732 versus simulated patch 0.450, 0.388, 0.030."
        status: resolved
        novelty_n: 1
        contradiction_c: 0
        depth_d: 1
        age_days_a: 0
    summary: >
      Pass 2 overall 88.3. Remediation items from pass 1 are closed in the
      script: robust display, scale sweep, equal-diffusion ablation, specimen
      segmentation, and goodness-of-fit (r=0.9979, RMSE=0.0301 mm, KS=0.143).
      The GIF terminal frame matches the MHNT egg (CV 84.7, 16 frames, 640 px).
      The generative wavelength remains 1.178 mm and is not forced onto the
      0.66 mm pore measurement. No second assessor. Nanopub signing profile
      was absent.
    scores:
      model-fidelity:
        value: 90
        rationale: >
          Schnakenberg kinetics, Jacobian, sigma(k), and the diffusivity
          rescale that puts the fastest mode on 10^(-2.929) m are in the
          script and checked by --self-test (trace negative, determinant
          positive, sigma(0) negative, equal-diffusion sigma_max negative,
          lambda within 1.5 percent of the tier). The system is not a
          line-by-line copy of a feather-follicle parameter table.
        evidence:
          - {file: models/2026-delphi10000-aptenodytes-forsteri-turing-wavelength-s0.py, lines: [94, 123], note: "diffusivity calibration and dispersion", supports: true}
          - {file: models/2026-delphi10000-aptenodytes-forsteri-turing-wavelength-s0.py, lines: [477, 498], note: "self-test gates on Turing conditions and lambda", supports: true}
          - {file: morphoeval/lean/loops/Loop_3116_aptenodytes_forsteri_turing_wavelength_s0.lean, lines: [20, 37], note: "tier window, diffusion ratio, margin, equal diffusion", supports: true}
      specimen-match:
        value: 84
        rationale: >
          Direct CV comparison of the 640x480, 16-frame GIF against the MHNT
          egg is 84.7. The last frame is that photograph. The middle panel,
          after median-to-p99.5 scaling, shows a spot-labyrinth on a shell
          patch, and the caption states the photograph pore spacing (0.66 mm)
          next to the model wavelength. The score stays below 90 because the
          generative field is not a pore-by-pore copy of the shell.
        evidence:
          - {file: models/2026-delphi10000-aptenodytes-forsteri-turing-wavelength-s0.py, lines: [362, 368], note: "robust display scale", supports: true}
          - {file: models/2026-delphi10000-aptenodytes-forsteri-turing-wavelength-s0.py, lines: [345, 359], note: "GIF blends the field into the real specimen", supports: true}
          - {file: docs/media/aptenodytes_forsteri_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, lattice, GoF, pore caption", supports: true}
          - {file: docs/media/aptenodytes_forsteri_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "640x480, 16 frames", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >
          Scale factors 0.8, 8/9, 1, 8/7, 4/3, 1.6 and 2 move lambda along the
          1:1 line in the comparison figure (r=0.9979). Equal diffusion is the
          negative control (amplitude ratio 0.0039 versus a growing Turing run).
        evidence:
          - {file: models/2026-delphi10000-aptenodytes-forsteri-turing-wavelength-s0.py, lines: [208, 230], note: "sweep and ablation", supports: true}
          - {file: docs/media/aptenodytes_forsteri_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "GoF panel and ablation caption", supports: true}
      morphometric-validation:
        value: 91
        rationale: >
          Dispersion lambda 1.1767 mm versus PDE 1.1685 mm. Pearson r 0.9979,
          RMSE 0.0301 mm, KS 0.143. Photograph pore wavelength 0.663 mm against
          published shell thickness 1.11 mm. Simulated patch foreground 0.450,
          coherency 0.388, circularity 0.030 against specimen 0.535, 0.384,
          0.732. No metric copies its reference. The KS sample has only seven
          scales.
        evidence:
          - {file: models/2026-delphi10000-aptenodytes-forsteri-turing-wavelength-s0.py, lines: [506, 599], note: "nine non-circular measurements", supports: true}
          - {file: models/2026-delphi10000-aptenodytes-forsteri-turing-wavelength-s0.py, lines: [252, 313], note: "specimen and simulation segmentation", supports: true}
      source-traceability:
        value: 90
        rationale: >
          DOIs for Turing, Prum and Williamson, Kondo and Miura, Schnakenberg,
          and Tyler. Egg size from the 2008 Polar Research URL, with authors
          left blank because the page does not list them. Specimen SHA-256
          70b89e84383c36f84caa716b75b158e562e4d78d22c697e0a96668a6bfef4245,
          CC BY-SA 4.0, Didier Descouens.
        evidence:
          - {file: datasets/aptenodytes_forsteri_turing_wavelength_s0/paper_citations.bib, lines: [1, 55], note: "citations", supports: true}
          - {file: datasets/aptenodytes_forsteri_turing_wavelength_s0/aptenodytes_forsteri_turing_wavelength_s0_reference.json, lines: [40, 72], note: "specimen block and empirical claims", supports: true}
          - {file: datasets/aptenodytes_forsteri_turing_wavelength_s0/README.md, lines: [1, 36], note: "scale 1.178 mm and age 0 Ma", supports: true}
      code-traceability:
        value: 88
        rationale: >
          Each modelling step is a named function cited from the math-kg loop
          file. The Lean module has six theorems and no sorry. The VM had no
          Lean binary, so the proofs were checked by reading the Nat
          comparisons rather than by compilation.
        evidence:
          - {file: morphoeval/lean/loops/Loop_3116_aptenodytes_forsteri_turing_wavelength_s0.lean, lines: [20, 47], note: "six theorems", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-aptenodytes-forsteri-turing-wavelength-s0.yaml, lines: [12, 53], note: "equation loci", supports: true}
      repro-package:
        value: 90
        rationale: >
          Deterministic seed, --self-test, and documented invocation. Pass 2
          re-ran the script after the display fix. Signing was not possible:
          ~/.nanopub/profile.yml is absent, and that is recorded rather than
          simulated.
        evidence:
          - {file: models/2026-delphi10000-aptenodytes-forsteri-turing-wavelength-s0.py, lines: [602, 634], note: "entrypoint", supports: true}
          - {file: datasets/aptenodytes_forsteri_turing_wavelength_s0/README.md, lines: [28, 40], note: "run commands", supports: true}
