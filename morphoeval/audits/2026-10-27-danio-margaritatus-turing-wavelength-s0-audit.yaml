    source_refs: [turing1952, nakamasu2009, patterson2014, volkening2018, conway2008, quigley2004]
    summary: >-
      Pass 1. Linear lambda_c is 13.39 µm by construction and the 1D PDE
      growth-rate series matches the eigenvalue (Pearson r = 0.99999995,
      RMSE = 5.5e-4 /s). Danio albolineatus is stable at this rung
      (sigma_max = -0.080 /s). Danio nigrofasciatus selects 17.80 µm.
      The adult photograph's pearl nearest-neighbour gap is 510 µm, so the
      elementary mode is not resolved. First-pass gaps: the diffusion-ratio
      sweep had to be checked at the anchor, the pearl hull had to be kept
      on the blue flank, circularity had to be a polygon quotient rather than
      a clipped raster, and the comparison figure had to separate the
      nonlinear FFT peak (17.22 µm) from the linear law.
    scores:
      model-fidelity:
        value: 76
        rationale: "Schnakenberg kinetics, Jacobian, and k_c formula are implemented and the 1D growth test matches the eigenvalue. Pass 1 still docks the nonlinear FFT peak (17.22 µm) sitting well above the linear 13.39 µm law, and gamma = 1/s is a time unit rather than a measured rate."
        evidence:
          - {file: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py, lines: [74, 110], note: "Jacobian and analytic sigma(k)", supports: true}
          - {file: models/2026-delphi10000-danio-margaritatus-turing-wavelength-s0.py, lines: [231, 291], note: "Periodic 1D PDE growth versus the eigenvalue", supports: true}
      specimen-match:
        value: 72
        rationale: "The CC BY-SA lateral photograph is shown beside a flank hull. Pass 1 hull selection still needed a blue-window gate so wood orange was not treated as pearls, and the GIF flank is a convex polygon rather than the body outline."
        evidence:
