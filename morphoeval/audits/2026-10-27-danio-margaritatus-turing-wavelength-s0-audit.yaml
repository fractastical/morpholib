    claim_boundary:
      reported_in_source:
        - "Turing 1952: a reaction-diffusion system can be stable at k = 0 and unstable at a finite k_c."
        - "Nakamasu et al. 2009: melanophore-xanthophore interactions have the short-range activation and long-range inhibition structure of a Turing system."
        - "Quigley et al. 2004 and Patterson et al. 2014: Danio species differ in how stripes and spots are deployed."
        - "Conway, Chen & Mayden 2008: the celestial pearl danio is a miniature Danio."
      reconstructed_in_script:
        - "Schnakenberg parameters that set lambda_c to 1.339e-05 m for margaritatus, stability for albolineatus, and 17.80 µm for nigrofasciatus."
        - "0.018 m catalog length applied to the pearl-field major axis."
      transfer_boundary:
        - "The adult photograph samples at about 21 µm per pixel, so 13.39 µm is not a direct measurement on that image."
        - "Predecessor and successor parameters are not fits to photographs of those species."
      does_not_claim:
        - "That adult pearl spacing equals 13.39 µm."
        - "That the convex-hull animation is a copy of the photograph."
    remediation:
      - id: R1
        item: "Keep the pearl hull on the blue flank (drop wood and plants) and report polygon circularity instead of a raster quotient clipped at 1."
      - id: R2
        item: "Diffusion-ratio sweep at fixed D_u must decrease lambda_c and equal 13.39 µm at delta = 40."
      - id: R3
        item: "Print the bootstrap 95% CI and the nonlinear FFT peak on the comparison figure, separate from the linear 13.39 µm law."
      - id: R4
        item: "Replace the axis-aligned ellipse occupancy model with the flank principal-axis chord model and report the odd-bin Pearson without forcing it above 0.98."
