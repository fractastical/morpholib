# MorphoEval audit — Cartwright & Checa (2007) J. R. Soc. Interface, Cartwright et al. (2009) PNAS & BCF (1951)
# Nacre Screw-Dislocation Spirals, 2026-10-20 (v3)
#
# Pass 3 re-score of `2019-cartwright-nacre-screw-dislocation-spirals.py` (2273 lines, was 1340 in v2) after the
# remediation of both open v2 items in the instrumented loop `morphoeval/runs/2026-10-19-nacre-screw-dislocation-spirals-loop-pass3`,
# superseding `2026-10-19-nacre-screw-dislocation-spirals-audit-v2` (91.8 dual-agent consensus).
#   - Primary assessor: Claude Fable 5.1 (Phase B subagent of slot-078; scored from the Phase A handoff, the git diff
#     and the CURRENT file at commit 9987db7d — every `lines:` pin below was re-verified with grep against that file).
#   - Second assessor: none this pass (single-assessor remediation round; the v2 second-assessor protocol is retained
#     in the block below for provenance only).
#
# What Pass 3 changed (both v2 remediation items, each closed as a *reduced, honest* model):
#   1. 2D BCF phase field -> 3D cholesteric chitin-fibroin liquid-crystal membrane stack (Section 3b, L476-L650):
#      continuous phase Phi_2D reconstructed exactly from the Pass 2 solver (`reconstruct_continuous_bcf_phase`),
#      director n = (cos phi, sin phi, 0), phi = (pi/h_0)(z - u), layer displacement u = h_0 Phi_2D / 2 pi so every
#      membrane is a helicoid around the screw core; twist rate q = -n.curl n (6.224 vs pi/h_0 = 6.283 rad/um), membrane
#      period (0.5007 vs SEM h_0 0.5000 um), Burgers vector (1/0/2 h_0 for spiral/target/Haliotis pair) and v_z measured
#      from the discrete volume; 9-point pitch sweep P -> v_z = P omega / 4 pi.  No Frank free-energy minimisation.
#   2. Brick-and-mortar tablet-sliding fracture under tension (Section 6b, L977-L1223): Ji & Gao (2004) tension-shear
#      chain modulus (89.5 GPa), Schmid single-slip yield sigma_y = Phi rho tau_p / 2 (148.2 MPa), Barthelat-type waviness
#      hardening, Griffith tablet fracture cap (356.8 MPa at flaw h/2) -> sigma_f = 169.5 MPa, eps_p,f = 0.82 %,
#      pull-out work Gamma = tau_p L_ov^2 / h = 608 J/m^2 (x608 over Gamma_m; Currey's ~3000x NOT reached), Gao (2003)
#      h* = 28.3 nm, ductile-brittle rho* = 17.8; tau_p / rho sweeps, psi = 0 and monolithic ablations, 17-angle Schmid
#      envelope.  Tablets are elastic-brittle: no intra-tablet crystal plasticity, no cohesive-zone / FEM RVE.
#   3. 2 new Lean 4 theorems (`cholesteric_half_pitch_screw_dislocation_coupling`, `tsc_tablet_sliding_fracture_toughness`;
#      5 total, 0 sorry, `lean` exit 0), registered as equations 4-5 in the math KG YAML; self-test 8 -> 11 checks,
#      measure_morphoeval() 9 -> 16 measurements; new SHA-256-pinned `cholesteric_fracture_reference.json` +
#      `pass3_citations.bib`; new 6-panel figure and 9-frame tablet-sliding GIF.
#
# Scores below: overall 87.9 (model-fidelity 89, specimen-match 86, parameter-expressivity 88, morphometric-validation 86,
# source-traceability 88, code-traceability 90, repro-package 91), DOWN from 91.8.  The decrease is deliberate: the v2
# assessors credited the terrace-pitch "measurement" (which is 85 % analytic, L451), the supersaturation / 12-species
# r = 0.9999 collapses (whose `lambda_obs` were generated from the same BCF law), and SEM reference values that are the
# script's own earlier outputs (L2015, L2025).  None of these was fixed in Pass 3 and they are now scored as defects.
# The two new mechanisms are credited as reduced kinematic / rate-independent models with every constant transcribed
# offline (no DOI verified this pass).  Remaining findings are listed under `remediation` for Pass 4.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale.  Line numbers refer to the files
# in the working tree at commit 9987db7d after the Pass 3 Phase A edits (uncommitted; `git diff` is the delta).

