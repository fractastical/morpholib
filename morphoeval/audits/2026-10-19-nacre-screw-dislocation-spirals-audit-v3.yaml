    remediation:
    - >-
      2019-cartwright-nacre-screw-dislocation-spirals.py:435-451 — `_measure_radial_terrace_pitch` returns
      0.15 * raw_pitch + 0.85 * theo_pitch, so the Pteria 'measured' terrace wavelength (7.94 vs 7.97 um) and the
      Lean-anchored lambda_0 ~ 19 r_c check are 85 % analytic. Return the raw regression pitch (and its uncertainty)
      and let the measurement honestly report the solver's deviation from BCF theory.
    - >-
      2019-cartwright-nacre-screw-dislocation-spirals.py:2008-2029 — SEM `reference_value` 5.96 (Z) and 3.2436
      (aspect) are the script's own Pass 2 outputs copied into the JSON; SEM Z now evaluates to 6.01. Replace with
      independent literature values (e.g. Cartwright & Checa 2007 Z ~ 6 hexagonal packing cited to a figure, a
      published Haliotis tablet aspect ratio) or label both `derived_from: output` with no reference.
    - >-
      datasets/nacre_screw_dislocation_spirals/nacre_screw_dislocation_spirals_reference.json:80-95 and the
      cross_taxa_nacre_terrace_scaling table (consumed at 2019-cartwright-nacre-screw-dislocation-spirals.py:790-879)
      — `lambda_obs_um` values were generated from the same BCF law they are correlated against (r = 0.9999 at every
      level). Digitise terrace spacings from Cartwright et al. (2009) Figs. 1-3 / Cartwright & Checa (2007) or
      drop the correlation measurements and keep only the analytic scaling check.
    - >-
      2019-cartwright-nacre-screw-dislocation-spirals.py:489-611 — the cholesteric coupling is a kinematic template
      (docstring L521-L529): no Frank free-energy (K1/K2/K3) relaxation, no pitch selection by chitin concentration,
      no membrane-pore transport. Pass 4: a 3D Frank / Landau-de Gennes relaxation of the chitin director with the
      BCF front as a moving boundary, anchored to an independently measured cholesteric pitch of chitin suspensions
      (e.g. Belamie et al. 2004 J. Phys. Chem. B), so that q and the period become predictions rather than
      consistency checks.
    - >-
      2019-cartwright-nacre-screw-dislocation-spirals.py:995-1110 — tablets are elastic-brittle and sigma_f = Phi
      sigma_crit / 2 = 169.5 MPa lands on Jackson's 170 MPa by the Griffith flaw = h/2 convention; E = 89.5 GPa
      overshoots Jackson dry 73 GPa by 23 %; the toughening ratio x608 is 5x short of Currey's ~3000x. Add
      intra-tablet aragonite crystal plasticity (dislocation glide / deformation twinning yield), a cohesive-zone
      interface with normal strength sigma_nc so the Schmid envelope handles debonding near theta -> 90 deg, and
      a hydration switch (dry / wet parameter sets), and report the flaw-size sensitivity of sigma_f.
    - >-
      datasets/nacre_screw_dislocation_spirals/cholesteric_fracture_reference.json:1-82 and pass3_citations.bib —
      every empirical target (Jackson 73/64 GPa, 170/140 MPa, 350-1240 J/m^2; Currey 3000x; Wang 110 MPa / 1 %;
      Gao 30 nm; Barthelat tau 20-40 MPa) and all nine new DOIs were transcribed offline from memory. Verify each
      DOI and each number against the paper (page / table / figure pin) in a pass with network access and record
      the verification date in the JSON.
    - >-
      2019-cartwright-nacre-screw-dislocation-spirals.py:2231-2240 and 1922 — `--seed` (L2238) is parsed but never
      used; `--v-inf / --r-c / --h-0 / --dipole-d / --tau-p` never reach `measure_morphoeval()`, the sweeps or the
      self-test; the `--self-test` help still says '8-check'. Thread the CLI overrides through a single parameter
      dataclass consumed by every evaluator, or remove the dead flags.
    - >-
      2019-cartwright-nacre-screw-dislocation-spirals.py:719, 735 and 684-722 — Law 3 stacking margins
      `42 - 80 * 2` and `78 - 36 * 1` are literals, and `pitch_tower = 3.6071`, `tower_spacing = 11.5`,
      `spacing = 7.8` are unsourced. Compute I_col from the simulated mineral-bridge offsets and terrace pitch,
      and move the three constants into the reference JSON with a citation.
    - >-
      2019-cartwright-nacre-screw-dislocation-spirals.py:2165-2173 — the Haliotis cholesteric volume is built at
      the bivalve h_0 = 0.50 for all regimes, and the 2 % twist / period tolerances are tuned to n_z = 120. Use
      each regime's own h_0 / r_c, derive the tolerance from the finite-difference truncation error (O(dz^2)), and
