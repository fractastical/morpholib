simulations:
  - id: cartwright-nacre-screw-dislocation-spirals
    name: "Cartwright & Checa (2007), Cartwright et al. (2009) & BCF (1951) nacre screw-dislocation spirals, Frank-Read target loops, chitin pore mineral-bridge columnar vs sheet transition, 3D cholesteric chitin precursor coupling and brick-and-mortar tablet-sliding fracture"
    organism: "Haliotis rufescens (Gastropoda columnar nacre) / Pteria hirundo & Pinctada margaritifera (Bivalvia sheet nacre)"
    script: models/2019-cartwright-nacre-screw-dislocation-spirals.py
    output: docs/media/nacre_screw_dislocation_spirals_comparison.png
    extra_outputs:
      - docs/media/nacre_screw_dislocation_spirals_growth.gif
      - docs/media/nacre_screw_dislocation_spirals_cholesteric_fracture.png
      - docs/media/nacre_screw_dislocation_spirals_tablet_sliding.gif
    domain: morphogenesis
    status: evaluated
    source_refs: [cartwright2007, cartwright2009, burton1951, cartwright2012, degennes1993, kleman2003, jackson1988, currey1977, gao2003, ji2004, jager2000, barthelat2007, wang2001]
    supersedes_audit_id: 2026-10-19-nacre-screw-dislocation-spirals-audit-v2
    claim_boundary:
      reported_in_source:
        - "Cartwright & Checa (2007): nacre tablets nucleate on a pre-formed stack of chitin-fibroin interlamellar membranes; screw dislocations in the membrane stack drive BCF spiral terrace growth with wavelength lambda_0 ~ 19 r_c and Gibbs-Thomson step velocity v = v_inf (1 - r_c / r); mineral bridges through membrane pores give columnar (gastropod) vs sheet (bivalve) stacking"
        - "Cartwright et al. (2009): spiral and target patterns in bivalve nacre arise from screw-dislocation and Frank-Read-type (+1,-1) defect pairs in a cholesteric liquid-crystal chitin precursor whose half-pitch sets the interlamellar spacing"
        - "Burton, Cabrera & Frank (1951): spiral step-flow around a screw dislocation; Archimedean spiral of pitch 2 pi / omega_0 r_c"
        - "Jackson, Vincent & Turner (1988): nacre tensile modulus ~ 73 GPa (dry) / 64 GPa (wet), tensile strength ~ 170 / 140 MPa, work of fracture 350-1240 J/m^2; Currey (1977): mother-of-pearl ~ 3000x tougher than monolithic aragonite; Wang et al. (2001): ~ 1 % inelastic strain by interlamellar sliding; Gao et al. (2003): flaw-insensitive critical mineral size h* ~ 30 nm; Ji & Gao (2004): tension-shear-chain modulus 1/E = 4(1-Phi)/(G_p Phi^2 rho^2) + 1/(Phi E_m); Barthelat et al. (2007): tablet waviness produces progressive interface hardening (tau ~ 20-40 MPa)"
      reconstructed_in_script:
        - "2D phase-field / eikonal BCF step-flow solver for 5 regimes (sub-saturated arrest, subcritical dipole pinch-off, single screw spiral, (+1,-1) target, Haliotis (+1,+1) columnar), 3D mineral-bridge Voronoi coalescence, SEM DoG seam / Delaunay segmentation of the SHA-pinned specimen (Pass 2, unchanged)"
        - "Pass 3: exact reconstruction of the continuous BCF phase from the solver output; a 3D cholesteric director field n = (cos phi, sin phi, 0), phi = (pi / h_0)(z - u), u = h_0 Phi_2D / 2 pi on an 81x81x120 grid; lamellar density S = cos 2 phi and aragonite occupancy M = [z < h_0 floor(Phi_2D / 2 pi)]; finite-difference twist rate, z-power-spectrum membrane period, loop-integral Burgers vector and core-column membrane count measured from the volume; 9-point pitch sweep P -> h_0 = P/2 -> v_z"
        - "Pass 3: rate-independent single-slip-system brick-and-mortar RVE: TSC modulus, Schmid yield sigma_y = Phi rho tau_p / 2, waviness hardening H = E_n tan^2 psi / t_m, Griffith tablet fracture cap at flaw h/2, pull-out work Gamma = tau_p L_ov^2 / h, K_Ic, Gao h*, ductile-brittle rho* = sigma_crit / tau_p, three failure-mode branches, tau_p and rho sweeps, psi = 0 and Phi = 1 ablations, 17-angle Schmid envelope"
      transfer_boundary:
        - "The 3D cholesteric coupling is a kinematic liquid-crystal template imposed by the BCF phase (stated at L521-L529): twist rate, membrane period and Burgers vector recovered from the volume are consistency checks of the construction (0.94 % finite-difference error on q, 0.14 % on the period), not independent predictions of chitin self-assembly"
        - "Every Pass 3 mechanical constant (tau_p = 20 MPa, psi = 1.5 deg, G_p = 1.4 GPa, Phi = 0.95, t_m = 30 nm, Gamma_m = 1 J/m^2, E_m = 100 GPa) and every empirical target (Jackson 73/64 GPa, 170/140 MPa, 350-1240 J/m^2; Currey 3000x; Wang 110 MPa / 1 %; Gao 30 nm) was transcribed offline from memory of the papers; none of the nine new DOIs was verified online this pass"
        - "sigma_f = Phi sigma_crit / 2 = 169.5 MPa lands on Jackson's 170 MPa by construction of the Griffith flaw = h/2 choice, not by fit or by prediction; E = 89.5 GPa overshoots Jackson dry 73 GPa by 23 % and the toughening ratio x608 is 5x short of Currey's ~3000x — both reported, neither corrected"
        - "The Pass 2 terrace-pitch 'measurement' blends 0.15 x raw + 0.85 x analytic (L451); the supersaturation and 12-species `lambda_obs` tables were generated from the same BCF law they are correlated against (r = 0.9999 is therefore not an empirical validation); the SEM Z and aspect-ratio reference values are the script's own Pass 2 outputs copied into the JSON"
      does_not_claim:
        - "Frank / Landau-de Gennes free-energy relaxation of the chitin director, pitch selection by chitin concentration or ionic strength, membrane-pore (mineral-bridge) transport, time evolution of the director beyond the BCF phase, intra-tablet aragonite crystal plasticity (dislocation glide, deformation twinning), cohesive-zone or FEM RVE mechanics, rate or hydration dependence, interface tensile (normal debonding) strength sigma_nc, or comparison with digitised figure points from any of the cited mechanical papers"
    summary: >-
      Pass 3 (v3) re-score of `2019-cartwright-nacre-screw-dislocation-spirals.py` (overall 87.9/100, down from the
      v2 consensus 91.8). Both v2 remediation items are closed as reduced, honestly-labelled models: (1) the 2D BCF
      spiral/target phase field is lifted into a 3D cholesteric chitin-fibroin membrane stack whose every membrane is
      a helicoid around the screw core, with twist rate (6.224 vs pi/h_0 = 6.283 rad/um), membrane period (0.5007 vs
      SEM h_0 = 0.5000 um), Burgers vector (1 / 0 / 2 h_0 for spiral / target / Haliotis pair) and v_z measured from
      the discrete volume and a cholesteric-pitch -> v_z sweep (slope omega / 4 pi); (2) a rate-independent
      single-slip brick-and-mortar RVE gives E = 89.5 GPa (Jackson dry 73), sigma_y = 148.2 MPa, sigma_f = 169.5 MPa
      (Jackson 170), eps_p,f = 0.82 % (Wang ~1 %), Gamma = 608 J/m^2 (Jackson 350-1240; x608 vs Currey ~3000x),
      h* = 28.3 nm (Gao ~30), rho* = 17.8 > nacre 15.6, with tau_p / rho sweeps and ablations. Two new Lean 4
      theorems (5 total, 0 sorry), 11 self-test checks and 16 measurements. The score falls because this round
      scores defects the v2 assessors credited: the 'measured' terrace pitch is 85 % analytic, the supersaturation and
      12-species collapses are against synthetic `lambda_obs` generated from the same law, the SEM Z / aspect references
      are the script's own earlier outputs, the Haliotis cholesteric test reuses the bivalve h_0, `--seed` and the
      physical CLI overrides never reach `measure_morphoeval()`, and every Pass 3 constant and DOI is unverified
      offline transcription.
    scores:
      model-fidelity:
        value: 89
        rationale: >-
          The Pass 2 solvers are unchanged and still match Cartwright & Checa (2007) / BCF (1951) as formulated:
          Gibbs-Thomson step velocity, multi-dislocation eikonal step flow, Frank-Read dipole clearance, mineral-bridge
          columnar vs sheet stacking and Voronoi coalescence. Pass 3 adds a correct de Gennes cholesteric construction
          (n = (cos phi, sin phi, 0), phi = (pi/h_0)(z - u), half-pitch = h_0, n = -n so S = cos 2 phi) in which the
          BCF phase enters as the layer displacement u, so membranes are helicoids and the Burgers vector equals the
          net screw charge (+5 vs a template-free v2), and a tension-shear-chain / Schmid-slip / waviness-hardening /
          Griffith-cap fracture model that reproduces the Jackson, Wang and Gao orders of magnitude (+4). Deductions:
          the cholesteric coupling is kinematic — no Frank free-energy, no pitch selection, no director dynamics — so
          it is a template imposed by the BCF phase rather than the self-assembly Cartwright et al. (2009) describe,
          and the function's own docstring says so (-5); the terrace pitch returned to the ledger is 0.15 raw +
          0.85 analytic, so the solver's pitch is never actually tested against theory (-3); the Law 3 stacking margin
          is a hard-coded literal (42 - 80*2, 78 - 36*1) rather than computed from the simulated fields (-3); tablets
          are elastic-brittle with no intra-tablet crystal plasticity and sigma_f = Phi sigma_crit / 2 hits 170 MPa by
          the flaw = h/2 convention (-3); `pitch_tower`, `tower_spacing`, `spacing` constants are unsourced (-1).
        evidence:
          - {file: models/2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [480, 611], note: "reconstruct_continuous_bcf_phase (exact Phi_2D from floor/angle) and simulate_cholesteric_chitin_lamellar_3d: helicoidal director, S = cos 2 phi, aragonite occupancy, finite-difference twist rate, z-spectrum period, loop-integral Burgers vector", supports: true}
          - {file: models/2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [521, 529], note: "Docstring states the coupling is a kinematic liquid-crystal template, NOT a Frank free-energy minimisation; q / period / Burgers are consistency checks of the construction", supports: false}
          - {file: models/2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [995, 1110], note: "simulate_tablet_sliding_fracture: TSC elastic branch, Schmid yield sigma_y = Phi rho tau_p / 2, waviness hardening H = E_n tan^2 psi / t_m, Griffith cap, three failure-mode branches (L1037-L1046), Gamma collapse to Gamma_m on brittle fracture (L1073-L1077)", supports: true}
          - {file: models/2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [435, 451], note: "_measure_radial_terrace_pitch returns 0.15 * raw_pitch + 0.85 * theo_pitch — the reported 'measured' pitch is 85 % the analytic value", supports: false}
          - {file: models/2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [719, 735], note: "stacking_margin = 42 - 80 * 2 and 78 - 36 * 1 are literals, not computed from the simulated mineral-bridge / terrace fields", supports: false}
          - {file: morphoeval/lean/loops/Loop_078_nacre_screw_dislocation_spirals.lean, lines: [118, 201], note: "Theorems cholesteric_half_pitch_screw_dislocation_coupling (P = 2 h_0, (+1,-1) zero Burgers, (+1,+1) b = P, 2 pi v_z strictly increasing in h_0) and tsc_tablet_sliding_fracture_toughness (sigma_y < sigma_f ductile at 20 MPa, yield-before-fracture iff tau_p <= 22, Gamma monotone and inside Jackson range); 5 theorems, 0 sorry, lean exit 0", supports: true}
      specimen-match:
        value: 86
        rationale: >-
          The SHA-256-pinned public-domain SEM mother-of-pearl specimen is still segmented by DoG seam detection and
          Delaunay coordination (h_0 = 0.5000 um at 0.019867 um/px, 328 seams, CV 0.29; Z = 6.01; aspect 3.24) and
          shown in panels E-F of the comparison figure; Pass 3 adds an x-z section through the screw core with white
          membranes and yellow mineral fill, a director-twist panel and a brick-and-mortar RVE GIF whose geometry
          (L_ov = 7.8 um, h = 0.5 um, Phi = 0.95) is taken from the SEM-anchored h_0 (+3 for the new visual
          comparison surface). Deductions: the reference values the SEM Z and aspect ratio are compared against
          (5.96 and 3.2436) are the script's own Pass 2 outputs copied into the measurement block — SEM Z has since
          drifted to 6.01 under the current scipy and still 'passes' a 5.5-6.4 band — so two of the three specimen
          metrics are self-referential (-6); the Pass 3 'membrane period vs SEM h_0' measurement uses the script's own
          segmentation as its reference and is flagged as such but remains intra-script (-2); the fracture RVE is
          compared with Jackson's numbers for Pinctada, not with any morphometric read from the Haliotis specimen
          (tablet waviness, overlap length, mortar thickness are literature assumptions), so the mechanical panels are
          not specimen-matched (-4); no Cartwright et al. (2009) spiral / target micrograph is vendored for the
          morphospace panels, as in v2 (-2).
        evidence:
          - {file: models/2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [881, 979], note: "segment_nacre_sem_specimen: DoG inter-lamellar seam detection across 25 column transects and Delaunay hexagonal coordination on the SHA-pinned specimen", supports: true}
          - {file: models/2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [2008, 2029], note: "SEM Z reference_value 5.96 (L2015) and aspect reference_value 3.2436 (L2025) are the script's own earlier outputs, not independent literature values", supports: false}
          - {file: models/2019-cartwright-nacre-screw-dislocation-spirals.py, lines: [1609, 1851], note: "render_cholesteric_fracture_figure: panels A-C (x-z section through core, director twist vs theory, pitch -> v_z) and D-F (sigma-eps, tau_p / rho sweeps, Schmid envelope) rendered beside the Jackson / Wang targets", supports: true}
          - {file: docs/media/nacre_screw_dislocation_spirals_comparison.png, lines: [0, 0], note: "6-panel figure (v3 suptitle): 3D spiral, 4 chiral defect regimes, supersaturation sweep, 12-species collapse, SEM specimen panel E and seam histogram F", supports: true}
          - {file: docs/media/nacre_screw_dislocation_spirals_tablet_sliding.gif, lines: [0, 0], note: "9-frame brick-and-mortar RVE sliding (x25 exaggerated) with sigma-eps marker; geometry from SEM h_0 but tablet waviness / overlap are assumed, not measured on the specimen", supports: true}
          - {file: docs/media/nacre_screw_dislocation_spirals_cholesteric_fracture.png, lines: [0, 0], note: "New 6-panel Pass 3 figure: x-z section through the screw core (white membranes, yellow mineral), director twist phi(z) vs theory at three columns, pitch -> v_z, sigma-eps with Jackson / Wang targets, tau_p and rho sweeps, Schmid envelope", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          Pass 2 coverage is retained (5 morphospace / control regimes, 11-point supersaturation sweep, 12 species)
          and Pass 3 adds genuinely new axes: a 9-point cholesteric pitch sweep that propagates P into h_0 and v_z,
          a tau_p sweep 10-40 MPa that crosses the ductile-brittle transition at tau* = sigma_crit / rho = 22.9 MPa,
          a rho sweep 4-30 that partitions failure modes at rho* = 17.8, psi = 0 (perfectly plastic pull-out) and
          Phi = 1 (monolithic Griffith) ablations, a 17-angle Schmid envelope, and a `--tau-p` / `--skip-pass3` CLI
          (+5). Deductions: `--seed` is parsed but never passed to any function, so it is a dead flag (-3); the
          physical overrides `--v-inf / --r-c / --h-0 / --dipole-d / --tau-p` reach only `render_comparison_figure()`
          or the Pass 3 figure's default RVE, never `measure_morphoeval()`, the sweeps or the self-test, so the
          ledger and measurements cannot be re-run at a different parameter point from the CLI (-4); the Haliotis
          regime's cholesteric volume is built at the bivalve h_0 = 0.50 for all three regimes although that regime
          has its own r_c = 0.19 / Delta_mu = 1.105 (-2); hydration (dry vs wet Jackson) is displayed as two targets
          but not an input (-2); the supersaturation and 12-species axes are consumed from synthetic tables (-1 here,
          scored mainly under morphometric-validation).
        evidence:
