simulations:
  - id: delphi10000-dugesia-japonica-turing-wavelength-s0
    name: "Saturated Schnakenberg Turing wavelength for Dugesia japonica dorsal pigment at 6.912 µm (Holocene, Pass 1)"
    organism: "Dugesia japonica (freshwater planarian)"
    script: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py
    output: docs/media/dugesia_japonica_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/dugesia_japonica_turing_wavelength_s0_growth.gif
      - datasets/dugesia_japonica_turing_wavelength_s0/dugesia_japonica_turing_wavelength_s0_metrics.json
    status: evaluated
    source_refs: [turing1952, gierer1972, schnakenberg1979, murray1981, kondo2009, nogi2009, orii2002, lapan2012, herath2020]
    summary: >-
      Pass 1 selects λ_c = 6.912 µm by solving D_u at diffusion ratio 48 for the
      saturated Schnakenberg Jacobian (κ = 0.15, a = 0.05, b = 1.40). Linear-mode
      growth matches analytic σ(k) at Pearson r = 0.99998 (RMSE 0.0054). Equal
      diffusion is stable (max σ = -0.565). The 16-frame, 640 px GIF paints that
      field through the segmented Nogi et al. 2009 plate. Not yet shown: the
      diffusion-ratio sweep, a KS comparison, the nonlinear peak wavelength, and
      the iNaturalist wild-type voucher.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) gives the diffusion-driven instability and the critical wavenumber from the reaction Jacobian and the two diffusivities."
        - "Schnakenberg (1979) gives the polynomial activator-substrate kinetics; Gierer & Meinhardt (1972) and Murray (1981) are the pigment-pattern reading."
        - "Nogi, Zhang, Chan & Marchant (2009) published the CC BY 2.5 plate of regenerated Dugesia japonica with dorsal pigment and ocelli."
        - "Orii, Ito & Watanabe (2002) describe extant Dugesia japonica anatomy. Herath & Lobo (2020) model planarian fission with Turing patterns, not this wavelength."
      reconstructed_in_script:
        - "κ = 0.15 saturation, R = D_v/D_u = 48, and D_u solved so λ_c = 6.912 µm on a 48.384 µm patch (seven linear wavelengths)."
        - "Spectral diffusion plus explicit reaction, seed 3213, and the linear-mode Pearson comparison."
        - "Body mask and ocellus cups segmented from the Nogi plate and used as the display domain."
      transfer_boundary:
        - "Fish pigment waves (Kondo 2009) and Schmidtea eye regeneration (Lapan & Reddien 2012) are not measurements of a 6.912 µm Dugesia japonica mode."
        - "The Nogi plate is a praziquantel-regeneration micrograph without a scale bar. Pixel size is not 6.912 µm."
      does_not_claim:
        - "Does not claim that 6.912 µm was measured on Dugesia japonica in any of the cited papers. It is this slot's detail-scale operating point."
        - "Does not claim a fossil predecessor. The chronoseries is Holocene 1/1, age 0 Ma."
        - "Does not claim the rendered body outlines are a pixel-perfect copy of four separate worms; the brightness mask merges some animals."
    scores:
      model-fidelity:
        value: 86
        rationale: "The script integrates the saturated Schnakenberg system and the Turing wavenumber formula, and D_u is solved so λ_c is 6.912 µm. Saturation is a numerical bound, not a measured pigment Michaelis constant. The wavelength is the assigned scale, not a fitted biological constant."
        evidence:
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [122, 156], note: "Jacobian of w = u^2 v / (1+κ u^2) and D_u solved from k_c", supports: true}
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [198, 243], note: "Reaction and spectral time step on a 7-wavelength patch", supports: true}
      specimen-match:
        value: 82
        rationale: "The GIF and the comparison panel place the pigment field inside segmented bodies from the Nogi plate, with a bright rim and dark cups. The mask merges animals that are separate on the plate, and the field is a magnified motif, not a resolution-matched micrograph. Still clearly a planarian pigment plate rather than an abstract plot."
        evidence:
          - {file: docs/media/dugesia_japonica_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "16-frame 640 px animation, CV similarity 94.7 against the Nogi plate", supports: true}
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [365, 456], note: "Body mask, circularity, ocellus cups, rim and color map", supports: true}
      parameter-expressivity:
        value: 72
        rationale: "Self-test checks that λ(R) falls from R = 36 to R = 120 and that R = 1 has a negative gap. The published figure does not show that sweep or the ablation, so a reader of the figure alone cannot see the control."
        evidence:
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [344, 360], note: "diffusion_ratio_sweep at fixed operating-point D_u", supports: true}
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [495, 537], note: "Pass 1 figure is specimen, render, field, and dispersion only", supports: false}
      morphometric-validation:
