        rationale: "Linear dispersion Pearson r = 0.99998 against analytic σ(k_disc), ablation max σ = -0.565, body-mask circularity 0.261 versus an ellipse reference 0.55, and 7 ocelli versus the wild-type pair of 2. Missing a KS histogram test and the nonlinear steady-state wavelength."
        evidence:
          - {file: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py, lines: [294, 340], note: "linear_dispersion_fit and ablation_equal_diffusion", supports: true}
