    input_dataset_sha256: {}
    claim_boundary:
      reported_in_source:
      - Turing 1952 selects a finite critical wavenumber when the two morphogens diffuse at different rates.
      - Eldredge 1972 documents a step from 18 to 17 dorsoventral lens files between the Cazenovian and Tioughniogan
        horizons.
      - Lindgren et al. 2019 show a screening pigment associated with fossil arthropod eyes, which is the anatomical
        context for a pigment-ring wavelength.
      reconstructed_in_script:
      - Schnakenberg parameters rho_a=0.082, rho_b=0.918, D_u=0.060, D_v=1.200, periodic cell 1.15 lambda_c, seed
        3216.
      - Quadratic optical readout I = c0 + c1 u_hat + c2 v_hat + c3 u_hat^2 + c4 v_hat^2 fit to the plate's radial
        luminance.
      - Predecessor cell side scaled by 17/18 at fixed lambda_c = 342 nm.
      transfer_boundary:
      - The gallery plate is a radial ocellus field with a labeled 100 micrometre bar (measured 111 px, 0.901 µm/px).
        Comparison is dimensionless radial shape plus computer-vision texture, not a claim that the plate's field
        of view is 342 nm.
      does_not_claim:
      - That 342 nm was measured on a Tioughniogan lens.
      - That the self-similar predecessor wavelength 323 nm is the law used here.
      - That a second independent assessor has scored this script.
