    claim_boundary:
      reported_in_source:
        - "Riedel-Kruse et al. (2007) Science 317:1911-1915 & Morelli et al. (2009) HFSP J. 3:55-66 delayed Kuramoto phase-oscillator model dtheta_i/dt = omega_0 + (kappa/z)*sum_j sin(theta_j(t - tau_c) - theta_i(t)) + xi_i(t)"
        - "Collective synchronization frequency shift Omega = omega_0 - kappa*sin(Omega*tau_c), linear stability stiffness kappa_eff = kappa*cos(Omega*tau_c) > 0, and DAPT pulse-chase Anterior Limit of Defects (ALD ~ 5-7 somites) and Posterior Rescue Point (PRP after washout)"
      reconstructed_in_script:
        - "Transcendental collective frequency solver and 2D (tau_c, kappa) linear stability tongue mapping verifying attractive in-phase synchronization at tau_c = 20.5 min (T_sync = 22.18 min, kappa_eff = 0.0623 min^-1 > 0) vs repulsive anti-phase instability at tau_c = 11.0 min (kappa_eff = -0.0353 min^-1 < 0)"
        - "2D 8x8 delayed Kuramoto PSM lattice with delay history buffer reproducing gastrula initiation (R_0 = 0.18 -> 0.986), DAPT Notch blockade failure (ALD = 5.5 somites), and DAPT washout rescue (PRP = 14.5 somites, R_min = 0.283 -> rescued R = 0.986)"
        - "Bilateral dorsal somite row DoG peak and inter-somitic cleft segmentation on zebrafish_psm_synchrony_specimen.jpg (48.47 px mean spacing, symmetry ratio 0.9605)"
      transfer_boundary:
        - "2D delayed Kuramoto PSM phase lattice and 1D clock-gated somite boundary profile mapped to dorsal vertebrate SEM somite metameres"
      does_not_claim:
        - "Full 3D cell-sorting advection in the tailbud progenitor zone or explicit Mib1 E3 ubiquitin ligase endocytosis stoichiometry"
    source_refs:
      - riedelkruse2007
      - morelli2009
