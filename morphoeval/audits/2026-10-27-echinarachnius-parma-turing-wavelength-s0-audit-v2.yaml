        evidence:
          - {file: models/2026-delphi10000-echinarachnius-parma-turing-wavelength-s0.py, lines: [1, 48], note: "Docstring states the PDE, 60 µm, and 0 Ma", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-echinarachnius-parma-turing-wavelength-s0.yaml, lines: [1, 75], note: "Laws linked to Lean and to the Pass 2 line ranges", supports: true}
          - {file: morphoeval/lean/loops/Loop_3214_echinarachnius_parma_turing_wavelength_s0.lean, lines: [19, 53], note: "Six theorems, zero sorry", supports: true}
      repro-package:
        value: 89
        rationale: >-
          --self-test now also requires exactly three discs, mean circularity above
          0.60, and mean aspect between 0.85 and 1.15, on top of the Pass 1 checks
