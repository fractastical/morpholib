        evidence:
          - {file: datasets/echinarachnius_parma_turing_wavelength_s0/paper_citations.bib, lines: [1, 55], note: "Five Crossref DOIs", supports: true}
          - {file: datasets/echinarachnius_parma_turing_wavelength_s0/echinarachnius_parma_turing_wavelength_s0_reference.json, lines: [1, 80], note: "60 µm, 0 Ma, specimen SHA-256", supports: true}
          - {file: datasets/echinarachnius_parma_turing_wavelength_s0/README.md, lines: [1, 40], note: "Scale ladder and the exclusion of slot 160 parameters", supports: true}
      code-traceability:
        value: 87
        rationale: >-
          Pass 2 code is still pointed at from the math-kg yaml, including the
