      model-fidelity:
        value: 58
        rationale: >-
          Computes analytical critical tension T_c and integrates a kinematic tanh(s/xi)
          centerline (`kinematic_perversion_centerline`, L49-89), but does not minimize the
          Kirchhoff elastic rod energy functional E[theta, phi, psi] via variational
          relaxation or model G-fiber bilayer differential hydration strain Delta_eps_g -> kappa_0.
