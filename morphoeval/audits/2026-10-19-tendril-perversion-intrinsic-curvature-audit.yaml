    summary: >-
      Pass 1 (v1) baseline evaluation of `1998-goriely-tendril-perversion-intrinsic-curvature.py`
      (overall weighted score: 56.2/100). The baseline computes the analytical critical
      pitchfork tension T_c = B*kappa_0^2/(1+Gamma) and integrates a kinematic tanh(s/xi)
