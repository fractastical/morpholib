          soft young (Gamma = 0.25) vs mature lignified (Gamma = 1.45) overwinding regimes,
          4 climbing plant species, or CLI overrides.
        evidence:
          - {file: 1998-goriely-tendril-perversion-intrinsic-curvature.py, lines: [49, 56], note: "Single default parameter evaluation", supports: false}
      morphometric-validation:
        value: 54
        rationale: >-
          `measure_morphoeval()` (L125-146) returns only 2 basic analytical checks without
          pitchfork bifurcation curve correlation, overwinding peak Delta_N comparison,
          species coil radius/pitch validation, or specimen image segmentation metrics.
        evidence:
          - {file: 1998-goriely-tendril-perversion-intrinsic-curvature.py, lines: [125, 146], note: "Only 2 baseline measurements returned", supports: false}
      source-traceability:
        value: 68
        rationale: >-
          Vendors `datasets/tendril_perversion_intrinsic_curvature/` with 4 DOIs in
          `paper_citations.bib`, `scout_manifest.json`, reference JSON, and specimen JPEG,
