simulations:
  - id: gierer-hydra-activator-inhibitor
    name: "Gierer & Meinhardt (1972) Hydra vulgaris activator-inhibitor morphogenesis"
    organism: "Freshwater cnidarian polyp (Hydra vulgaris) apical hypostome polarity & radial tentacle ring"
    script: 1972-gierer-hydra-activator-inhibitor.py
    output: docs/media/hydra_activator_inhibitor_comparison.png
    extra_outputs:
      - docs/media/hydra_activator_inhibitor_growth.gif
    status: evaluated
    source_refs:
      - gierer1972
      - meinhardt1974
      - meinhardt1993
      - meinhardt2012
    summary: >-
      Pass 1 (v1) baseline evaluation of `1972-gierer-hydra-activator-inhibitor.py`
      (55.0/100). The v1 baseline implements the 1D Gierer-Meinhardt (1972) Eqs. (15a)-(15b)
      activator-inhibitor PDE on a 60-cell apico-basal column and computes the analytical
      dispersion relation sigma(k) and critical diffusivity ratio d_c = (sqrt(2)+1)^2 = 5.8284,
      but omits surgical bisection head regeneration (Gierer & Meinhardt 1972 Fig. 3),
      periodic sub-hypostomal tentacle-ring morphogenesis (Meinhardt 1993), equal-diffusion
      negative control (D_a = D_h), allometric domain-scaling peak insertion, and automated
      computer-vision segmentation of the vendored Hydra vulgaris specimen image.
    scores:
      model-fidelity:
        value: 62
        rationale: >-
          Implements Gierer & Meinhardt (1972) Eqs. (15a)-(15b) 1D PDE with zero-flux
          Neumann boundary conditions (L85-134) and exact linear stability analysis
          (L38-82, d_c = 5.8284, a_* = 1.5, h_* = 2.25). However, v1 omits Gierer &
          Meinhardt's signature surgical bisection and head regeneration experiment
          (Fig. 3), omits periodic circular ring morphogenesis for the tentacle whorl
          (Meinhardt 1993), and runs no equal-diffusion negative control (D_a = D_h).
        evidence:
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [38, 82], note: "Linear stability analysis computing d_c = (sqrt(2)+1)^2 and dispersion curve", supports: true}
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [85, 134], note: "1D polar column solver without bisection regeneration or equal-diffusion negative control", supports: false}
      specimen-match:
        value: 38
        rationale: >-
          Displays `datasets/hydra_activator_inhibitor/hydra_vulgaris_specimen.jpg` in
          Panel 3 (L164-168), but performs zero computer-vision segmentation of the
          translucent Hydra body column, apical hypostome, or the 6 radiating tentacles,
          and does not simulate the periodic 6-tentacle ring to match the specimen.
        evidence:
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [164, 168], note: "Raw imshow of Hydra specimen without segmentation or tentacle angular detection", supports: false}
          - {file: docs/media/hydra_activator_inhibitor_comparison.png, lines: [0, 0], note: "3-panel baseline figure showing raw specimen without morphometric overlay", supports: false}
      parameter-expressivity:
        value: 44
        rationale: >-
          Simulates only a single parameter point (d = D_h/D_a = 30, N = 60) with no
          diffusivity-ratio sweep across d_c = 5.8284, no domain-length sweep L, and no
          CLI parameter overrides beyond `--self-test` (L227-237).
        evidence:
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [227, 237], note: "CLI exposes only --self-test without PDE parameter flags or regime sweeps", supports: false}
      morphometric-validation:
        value: 45
        rationale: >-
          `measure_morphoeval()` reports only 3 basic scalars (d_c, a_*, and apical peak
          index, L190-215) without uncertainty metrics (CV, std, RMSE, Pearson r), without
          negative-control contrast, and without specimen tentacle count / angular spacing
          comparison.
        evidence:
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [190, 215], note: "Only 3 scalar measurements without CV/RMSE/r or specimen tentacle morphometrics", supports: false}
      source-traceability:
        value: 68
        rationale: >-
          Vendors `datasets/hydra_activator_inhibitor/` with `hydra_activator_inhibitor_reference.json`,
          `hydra_vulgaris_specimen.jpg`, `scout_manifest.json`, and `paper_citations.bib`,
          but v1 script does not verify SHA-256 digests of the dataset files at runtime or
          assert JSON-to-code parameter parity in `self_test()`.
        evidence:
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [34, 36], note: "Loads reference JSON path but performs no runtime SHA-256 verification", supports: false}
      code-traceability:
        value: 64
        rationale: >-
          Docstring cites Gierer & Meinhardt (1972) Eqs. (15a)-(15b), but lacks explicit
          mappings to Gierer & Meinhardt (1972) Fig. 2-3 (regeneration), Meinhardt (1993)
          (tentacle ring), and the 3 Lean 4 theorems in `Loop_001_hydra_activator_inhibitor.lean`.
        evidence:
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [1, 18], note: "Baseline module header without Lean 4 theorem or regeneration figure mappings", supports: false}
      repro-package:
        value: 65
        rationale: >-
          Includes deterministic `np.random.default_rng(1972)` and a basic `self_test()`
          (L218-225), but does not test bitwise two-run determinism, SHA-256 dataset locks,
          equal-diffusion control decay, or surgical head regeneration recovery.
        evidence:
          - {file: 1972-gierer-hydra-activator-inhibitor.py, lines: [218, 225], note: "4-assertion baseline self_test() without bitwise determinism or SHA-256 check", supports: false}
    remediation:
      - "Implement Gierer & Meinhardt (1972) Fig. 3 surgical bisection and head regeneration experiment (cutting the 60-cell column at x = 30 after apical peak formation and verifying autonomous regeneration of a new apical hypostome peak in the basal fragment once long-range inhibitor decays)."
      - "Implement Meinhardt (1993) periodic circular tentacle-ring reaction-diffusion simulation (C = 50 cells, periodic BCs) producing 6 evenly spaced tentacle primordia, paired with an equal-diffusion negative control (D_a = D_h = 0.015, d = 1.0 < d_c = 5.8284) and a 6-point diffusivity-ratio sweep across d in {1.0, 3.0, 5.0, 8.0, 15.0, 30.0}."
      - "Implement automated computer-vision segmentation of `datasets/hydra_activator_inhibitor/hydra_vulgaris_specimen.jpg` to extract the Hydra polyp silhouette, apico-basal body axis, apical hypostome centroid, and angular positions/spacing CV of the 6 radiating tentacles, plus an allometric domain-length scaling sweep L in {20, 35, 50, 65, 80, 95} with Pearson r and RMSE."
      - "Add runtime SHA-256 verification of all files in `datasets/hydra_activator_inhibitor/`, expand `measure_morphoeval()` to 8 quantitative measurements with reference values, CV/RMSE/r uncertainty, and negative-control delta, expose full CLI flags, and upgrade the comparison figure to a 9-panel publication synthesis."
