        - "Murray 1981 reaction-rate scale: chemical wavelength shortens as gamma^{-1/2}."
        - "Wittkopp et al. 2009: the pale abdominal cuticle of D. novamexicana relative to D. americana is caused in large part by cis-regulatory alleles of ebony and tan."
        - "Lamb et al. 2020: ebony contributes to pigmentation divergence between D. americana and D. novamexicana."
