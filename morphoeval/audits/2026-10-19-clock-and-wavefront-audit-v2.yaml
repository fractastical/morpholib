        - "Cooke (1975) Nature 254:196-199 Xenopus laevis blastula size-reduction invariance (N ~ 40 somites across normal and miniature embryos)"
      reconstructed_in_script:
        - "1D anteroposterior Thom-Zeeman cusp catastrophe ODE tau_chi*dchi/dt = -(chi^3 - a(x,t)*chi - b_osc(x,t)) with proportional wavefront width scaling"
        - "Bilateral dorsal somite row DoG peak and inter-somitic cleft segmentation on somite_embryo_specimen.jpg (48.47 px mean spacing, symmetry ratio 0.9605)"
      transfer_boundary:
        - "1D anteroposterior paraxial mesoderm axis mapped to dorsal vertebrate SEM somite rows"
