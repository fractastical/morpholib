          - {file: docs/media/clock_and_wavefront_comparison.png, lines: [0, 0], note: "6-panel synthesis figure including kymograph, somite trains, morphospace contour, size-invariance scaling, SEM segmentation, and waveform fit", supports: true}
      parameter-expressivity:
        value: 89
        rationale: >-
          Evaluates 5 experimental regimes from Cooke (1975) and Cooke & Zeeman (1976)
          (normal 4.0 mm, reduced 3.0 mm, miniature 2.4 mm, 2x clock period T_c=90 min,
          and 1.5x wavefront velocity), maps the continuous 2D parameter morphospace
          S(v, T_c) = v * T_c across v in [1.0, 3.6] um/min and T_c in [25, 100] min
