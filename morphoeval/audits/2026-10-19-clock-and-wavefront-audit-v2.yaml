          (S = v * T_c, N = L / (v * T_c)) and Thom-Zeeman cusp catastrophe ODE
          tau_chi * dchi/dt = -(chi^3 - a(x,t)*chi - b_osc(x,t)) with irreversible
          post-wavefront commitment mobility (L88-246), reproducing S_sim = 100.13 um
          (0.13% error vs analytical 100.0 um) and exact N_norm = N_mini = 40 size
          invariance, verified by 3 machine-checked Lean 4 theorems (0 sorrys) in
          `morphoeval/lean/loops/Loop_021_clock_and_wavefront.lean`.
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [88, 108], note: "Analytical somite wavelength S = v * T_c and count N = L / (v * T_c)", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [145, 246], note: "Thom-Zeeman cusp catastrophe clock-and-wavefront spatiotemporal solver", supports: true}
          - {file: morphoeval/lean/loops/Loop_021_clock_and_wavefront.lean, lines: [18, 72], note: "3 machine-checked Lean 4 theorems (0 sorrys) for wavelength scaling, size invariance, and cusp bifurcation", supports: true}
