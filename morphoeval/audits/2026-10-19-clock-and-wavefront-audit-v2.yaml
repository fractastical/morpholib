    summary: >-
      Pass 2 post-remediation evaluation of `1976-cooke-clock-and-wavefront.py` (90.4/100,
      up from 58.4/100 in Pass 1; +32.0 overall). The remediated script integrates the
      Thom-Zeeman cusp catastrophe wavefront ODE tau_chi*dchi/dt = -(chi^3 - a(x,t)*chi - b_osc(x,t))
      with proportional wavefront transition scaling, achieving 0.13% somite wavelength
      accuracy (S_sim = 100.13 um vs S = 100.0 um, CV = 0.0025), exact somite count
      invariance across normal (L = 4.0 mm, N = 40) and miniature (L = 2.4 mm, S = 60.08 um,
      N = 40) embryos, a clock-doubled perturbation (T_c = 90 min -> N = 20, S = 200.25 um),
      a clock-arrested negative control (A_clock = 0 -> 0 somites), and automated bilateral
      DoG somite segmentation on `somite_embryo_specimen.jpg` (8 upper and 9 lower somites,
      mean spacing 48.47 px, bilateral symmetry ratio 0.9605), backed by 3 machine-checked
      Lean 4 theorems in `Loop_021_clock_and_wavefront.lean`.
    scores:
