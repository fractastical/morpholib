# MorphoEval Pass 3 (v3) Audit — Sapala et al. (2018) eLife & Fu et al. (2005) Cell
# ROP2-ROP6 Interdigitated Puzzle-Shaped Pavement Cells, LEC Turgor Stress Scaling, Reduced Pressurized
# Periclinal Membrane-Shell & Depth-Resolved Anticlinal Wall Buckling, 2026-10-20 (v3)
#
# Pass 3 remediation-round re-score of `2017-runions-pavement-cell-lobing.py` (Slot 039) in the instrumented
# loop `morphoeval/runs/2026-10-19-pavement-cell-lobing-loop-pass3`, superseding
# `2026-10-19-pavement-cell-lobing-audit-v2` (93.1).
#
# What Pass 3 changed (the single v2 remediation item closed in a reduced, honestly-labelled form):
#   1. Reduced 3D pressurized periclinal shell: a sparse finite-difference Föppl uniform-tension membrane
#      solve -T ∇²z = P on the exact rasterised cell footprint (z = 0 on the anticlinal walls), with the
#      tension T = T0 + E h ε̄/(1-ν) made self-consistent with the mean membrane stretch and T0 = PH/2,
#      plus an analytic clamped-edge bending boundary layer. Verified against the closed-form disk
#      (z_max rel. err. 0.9 %, mean strain 0.3 %) and the inscribed-disk comparison bound (18/18).
#      NOT a finite-element shell (stated in code, JSON, figure and here).
#   2. Depth-resolved anticlinal wall buckling: prestressed vertical strip forced by the ROP2-ROP6 wall
#      displacement at the outer periclinal junction, Robin-anchored at the inner junction (β sweep from
#      free to clamped), sparse 2D FD Laplace solve cross-checked against the modal closed form
#      (rel. err. 1.2 %), plus a depth-distributed-forcing ablation.
#   3. The Pass 2 wild-type polygon construction was found to pin R_LEC by stretching a sinusoid into a
#      417 x 22 µm ribbon (aspect 18.7) at A = 4500 µm² — a monocot-like file cell, not a puzzle cell —
#      which Panel B had hidden by clipping its axes to ±68 µm. It was replaced by a compact branched
#      construction (central band + alternating staggered finger lobes, aspect 2.6, 142 x 55 µm).
#   4. Three new Lean 4 theorems (`sapala_2018_pressurized_membrane_inscribed_disk_bound`,
#      `anticlinal_depth_mode_monotone_outward`, `anticlinal_depth_mode_wavenumber_comparison`; 0 sorrys),
#      self-test 8 -> 13 checks, measure_morphoeval 9 -> 17 measurements, a new SHA-256-pinned parameter
#      table `pavement_cell_shell_depth_reference.json`, two secondary references (Armour 2015, Timoshenko 1959).
#
# Why the overall score goes DOWN (93.1 -> 85.2): the remediation exposed defects that v2 credited:
#   - the v2 WT "puzzle cell" was a ribbon (model-fidelity and specimen-match were over-scored in v2);
#   - the script's own reduced mechanics contradicts its headline: the Föppl membrane gives an
#     isotropic/WT periclinal stress ratio of 1.73 at 4500 µm² and a sub-linear σ(R_LEC) exponent of 0.51,
#     whereas the Laplace proxy the script still reports as "3.32x lower stress" assumes exponent 1 —
#     reported as a failed comparison, not tuned away;
#   - the WT footprint is still a hand-constructed geometry (band + capsules with fitted constants), not an
#     emergent spring-remodelling simulation, and the ROP2-ROP6 PDE still does not feed the polygon;
#   - the depth law is verified only against its own analytic solution — no depth-resolved specimen data;
#   - the specimen lobeyness recorded by v2 (L = 1.506) is not reproduced by the unchanged segmentation code
#     in the current environment (L = 1.316; same N = 10 cells, same S = 0.720) — environment-induced drift.
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# working-tree files at commit d58a084 after the Pass 3 edits (the script is 1952 lines).

