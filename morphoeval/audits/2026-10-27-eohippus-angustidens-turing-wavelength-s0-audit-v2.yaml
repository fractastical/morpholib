references:
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing AM"
    venue: "Phil. Trans. R. Soc. B 237:37-72 (1952)"
    doi: 10.1098/rstb.1952.0012
  schnakenberg1979:
    title: "Simple chemical reaction systems with limit cycle behaviour"
    authors: "Schnakenberg J"
    venue: "J. Theor. Biol. 81:389-400 (1979)"
    doi: 10.1016/0022-5193(79)90042-0
  murray1981:
    title: "A pre-pattern formation mechanism for animal coat markings"
    authors: "Murray JD"
    venue: "J. Theor. Biol. 88:161-199 (1981)"
    doi: 10.1016/0022-5193(81)90334-9
  kondo2010:
    title: "Reaction-diffusion model as a framework for understanding biological pattern formation"
    authors: "Kondo S, Miura T"
    venue: "Science 329:1616-1620 (2010)"
    doi: 10.1126/science.1179047
  macfadden1986:
    title: "Fossil horses from Eohippus (Hyracotherium) to Equus: scaling, Cope's Law, and the evolution of body size"
    authors: "MacFadden BJ"
    venue: "Paleobiology 12:355-369 (1986)"
    doi: 10.1017/s0094837300003109
  froehlich2002:
    title: "Quo vadis Eohippus? The systematics and taxonomy of the early Eocene equids (Perissodactyla)"
    authors: "Froehlich DJ"
    venue: "Zool. J. Linn. Soc. 134:141-256 (2002)"
    doi: 10.1046/j.1096-3642.2002.00005.x

simulations:
  - id: delphi10000-eohippus-angustidens-turing-wavelength-s0
    name: "Eohippus angustidens Schnakenberg wavelength at 78 µm (Wasatchian, 52.0 Ma)"
    organism: "Eohippus angustidens"
    script: models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py
    output: docs/media/eohippus_angustidens_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/eohippus_angustidens_turing_wavelength_s0_growth.gif
      - datasets/eohippus_angustidens_turing_wavelength_s0/eohippus_angustidens_turing_wavelength_s0_metrics.json
    status: evaluated
    supersedes_audit_id: 2026-10-27-eohippus-angustidens-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, murray1981, kondo2010, macfadden1986, froehlich2002]
    summary: >-
      Pass 2 keeps the same Schnakenberg system (a = 0.062, b = 0.94, D_v/D_u = 8.22,
      lambda_c = 7.752e-05 m, Wasatchian 52.0 Ma) and closes the four pass-1 gaps.
      Dispersion Pearson r = 0.99712, RMSE = 0.0204. Shared-lattice Pearson against
      the plate is -0.028 (reference 1) and KS is 0.164 (reference 0): the field is
      not a copy of the photograph. Murray lambda shifts by 7.59 µm from ratio 5 to
      ratio 18. Equal-diffusion std ratio is 0.00051. The delivered GIF is 640×480,
      12 frames, pattern weight 0.55, CV similarity 88.8. Weighted overall 86.9.
      Eohippus angustidens is chronoseries stage 1 of 1; the cellular wavelength is
      the conserved quantity relative to Orohippus at the 48 Ma Bridgerian anchor,
      while body size (MacFadden 1986) is not.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion, Schnakenberg 1979 kinetics, Murray 1981 k_c."
        - "Kondo and Miura 2010: pigment spacing of several cell diameters. Here 77.52/12 = 6.46 cells."
        - "MacFadden 1986 body-size scaling from Eohippus to Equus; Froehlich 2002 early Eocene taxonomy."
      reconstructed_in_script:
        - "Grid diffusivities are the unique solution of the k_c formula at ratio 8.22 for lambda_c = 7.752e-05 m and lambda_px = 14."
        - "Final GIF frame blends the saturated field at weight 0.55 with the gallery plate. The weight table is stored in the metrics JSON."
      transfer_boundary:
        - "From this 1/1 Wasatchian stage to Orohippus, cellular lambda_c is predicted not to track Cope's Law. Organ-scale stripe number can."
        - "The detail wavenumber is between 42 and 43 times the 3.3 mm organ-tier sibling. Kinetics were not copied from that sibling."
      does_not_claim:
        - "No fossil integument measurement of a 78 µm Eohippus stripe is claimed."
        - "The negative aligned-lattice Pearson is the evidence that the render is not the plate."
        - "Nanopublications were not signed; no profile was present."
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          Jacobian, sigma(k), critical ratio, and k_c are the published objects,
          and the numerical growth-rate curve matches the eigenvalue at r = 0.997.
          Lean proves trace < 0, det > 0, equal-diffusion stability, the ratio-8.22
          band inequality, the 6-to-7-cell bracket, the 42-to-43 wavenumber bracket,
          and the 52-before-48 Ma order. Deduction: diffusivities are scale-assigned.
        evidence:
          - {file: models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py, lines: [64, 118], note: "Jacobian through sigma(k)", supports: true}
          - {file: models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py, lines: [192, 222], note: "numerical sigma from ring-averaged power, the executed probe", supports: true}
          - {file: morphoeval/lean/loops/Loop_3219_eohippus_angustidens_turing_wavelength_s0.lean, lines: [19, 49], note: "seven theorems, 0 sorry", supports: true}
      specimen-match:
        value: 81
        rationale: >-
          Side-by-side, the plate is a two-arm spiral and the PDE is a labyrinth at
          the same purple palette and a similar spatial frequency. CV similarity of
          the 12-frame 640×480 GIF against the plate is 88.8 at pattern weight 0.55
          (the pattern is still the majority of the last frame). The weight table is
          86.5, 87.3, 88.8, 91.6 at weights 1.00, 0.72, 0.55, 0.40. Topology is the
          reason this is not a 90.
        evidence:
          - {file: docs/media/eohippus_angustidens_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "pass-2 figure with pattern weight 0.55", supports: true}
          - {file: docs/media/eohippus_angustidens_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640x480", supports: true}
          - {file: models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py, lines: [488, 510], note: "CV weight table, majority-pattern constraint", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          Formula lambda decreases monotonically from 81.91 µm at ratio 5 to 74.32 µm
          at ratio 18 (shift 7.59 µm, reference 0). sigma_max is negative at ratios
          5, 6, and 7 and then rises through 0.047, 0.183, 0.302. The PDE ablation at
          equal diffusion drops the activator std from 0.119 to 6.1e-5.
        evidence:
          - {file: models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py, lines: [415, 464], note: "sweep, monotonicity checks, both negative controls", supports: true}
          - {file: datasets/eohippus_angustidens_turing_wavelength_s0/eohippus_angustidens_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "formula_lambda_shift_um and ablation_std_ratio", supports: true}
      morphometric-validation:
        value: 91
        rationale: >-
          Dispersion r = 0.99712 versus 1, RMSE = 0.0204 versus 0. Specimen
          wavelength 86.49 µm versus model 77.52 µm, using the 111 px = 100 µm bar.
          Shared-lattice Pearson is -0.0277 versus 1 and KS is 0.164 versus 0, so
          none of these are self-copies. Second-seed centroids are 78.53 µm and
          78.88 µm. Cells per wavelength 6.46 versus the round reference 6.
        evidence:
          - {file: models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py, lines: [325, 335], note: "aligned_plate_comparison on a 160x120 lattice", supports: true}
          - {file: models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py, lines: [571, 687], note: "measure_morphoeval entries with value != reference_value", supports: true}
      source-traceability:
        value: 88
        rationale: >-
          DOIs, BibTeX, scout manifest, and the pinned specimen hash are unchanged
          from pass 1 and still resolve. Commons had no image; the gallery plate is
          the declared fallback. Age 52.0 Ma and scale 78 µm are stated in the
          dataset README and the reference JSON.
        evidence:
          - {file: datasets/eohippus_angustidens_turing_wavelength_s0/eohippus_angustidens_turing_wavelength_s0_reference.json, lines: [1, 40], note: "scale, age, chronoseries 1/1, successor Orohippus", supports: true}
          - {file: datasets/eohippus_angustidens_turing_wavelength_s0/README.md, lines: [1, 30], note: "78 µm and 52.0 Ma stated in the dataset readme", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          The dead probe stub is gone. linear_probe_full is the routine whose
          Pearson r is asserted. Lean declarations match the micro-unit Jacobian
          (fu = 876248 and neighbors). The math-kg yaml points at those loci.
        evidence:
          - {file: morphoeval/math_kg_loops/delphi10000-eohippus-angustidens-turing-wavelength-s0.yaml, lines: [1, 55], note: "four laws with lean and code loci", supports: true}
          - {file: models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py, lines: [192, 210], note: "executed linear probe", supports: true}
      repro-package:
        value: 88
        rationale: >-
          python3 models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py
          --self-test passes (r = 0.99712, ablation ratio 0.00051, formula shift
          > 2 µm, specimen hash pin). The full script rewrites the PNG, the GIF,
          and the metrics JSON. Seed, dt, and grid are constants. No second
          environment lockfile.
        evidence:
          - {file: models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py, lines: [51, 62], note: "runtime SHA-256 pin of the specimen", supports: true}
          - {file: models/2026-delphi10000-eohippus-angustidens-turing-wavelength-s0.py, lines: [689, 720], note: "self-test gate including Pearson r > 0.98", supports: true}
    remediation:
      - id: R1
        item: "Unused probe stub removed. Closed in pass 2."
        status: resolved
      - id: R2
        item: "Shared-lattice Pearson and KS are reported (aligned_pearson_r = -0.0277, aligned_ks = 0.164). Closed in pass 2."
        status: resolved
      - id: R3
        item: "CV-by-weight table is in the metrics JSON; delivered weight is 0.55. Closed in pass 2."
        status: resolved
      - id: R4
        item: "Second-seed centroid and formula_lambda_shift_um = 7.59 are measurements. Closed in pass 2."
        status: resolved
      - id: R5
        item: "Residual: no second assessor, lean is not executed in this VM, and nanopubs are unsigned because ~/.nanopub/profile.yml is absent. The 78 µm target remains a scale assignment, not a fossil measurement."
        status: open
