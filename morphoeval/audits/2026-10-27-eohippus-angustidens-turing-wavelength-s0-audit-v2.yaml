# MorphoEval audit — Eohippus angustidens cellular Turing wavelength, pass 2.
# Supersedes the pass-1 audit. R1–R4 are closed in the script that this file scores.
# Weighted overall 86.9 / 100. Single assessor remains grok-4.7.

audit:
  id: 2026-10-27-eohippus-angustidens-turing-wavelength-s0-audit-v2
  supersedes_audit_id: 2026-10-27-eohippus-angustidens-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (single assessor; pass 2 of the same cloud loop)"
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
