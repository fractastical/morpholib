# MorphoEval audit — Oster, Murray & Harris (1983) / Oster, Murray & Maini (1985) Mechanochemical Chondrogenesis, 2026-10-19 (v3)
#
# Pass 3 remediation-round re-score of `1983-oster-mechanochemical-chondrogenesis.py` (Slot 013) in the
# instrumented loop `morphoeval/runs/2026-10-19-mechanochemical-chondrogenesis-loop-pass3`, superseding
# `2026-10-19-mechanochemical-chondrogenesis-audit-v2` (90.7). Both Pass 2 remediation items were closed:
#   R1. The 2D limb paddle is now a genuine coupled cell-ECM PDE on a domain whose distal boundary (the AER
#       front L(t) = L_0 + v_AER t) is a moving free boundary with an AER progress zone; the 1 -> 2 -> 4/5
#       hierarchy emerges from the dynamics (only the proximal humeral nucleus is seeded) and the Saunders
#       (1948) AER-ablation truncation series is reproduced ([1, 1, 2, 3] segments).
#   R2. Raspopovic et al. (2014) Bmp-Sox9-Wnt kinetics are hybridised with the traction mechanics; the 4x4
#       hybrid Jacobian lowers tau_c from 1.44 to 0.35 and a 2x2 factorial at tau = 0.85 gives [0, 0, 0, 4].
# What the remediation exposed (hence several dimensions go DOWN despite the model being much better):
#   - The Pass 2 Panel C that v2 scored as a "2D ... solver" (v2 evidence L280-345) was a kinematic template
#     (prescribed Gaussian rods gated by tanh weights), so the v2 model-fidelity/parameter-expressivity
#     evidence was overstated.
#   - The 1D (and now 2D) solvers' drift kernel i k sigma_hat / (E k^2 + s + mu k^2) puts the viscous term in
#     the quasi-static stiffness; its effective threshold tau_c = 1.4397 is 12.7% above the analytic 1.2776
#     that the figure, phase diagram and measurement 1 report. Measured and disclosed (measurement 14).
#   - The 1D "wavelength = lambda_c, CV = 0" validation (measurement 2) is tautological: the periodic domain is
#     set to W = 4 lambda_c and the m = 4 cosine is seeded, so the spacing is lambda_c by construction.
#   - The vendored reference JSON `canonical_parameters` (D_1 = 0.08, D_2 = 0.0025, s = 0.5, r = 0.2) were never
#     the script's parameters (D_1 = 0.28, D_2 = 0.015, s = 0.85, r = 0.32); now disclosed side by side.
#   - In the 2D solver the autopod count is partly inherited by 2 -> 4 bifurcation of the zeugopod rods: during
#     tuning W_autopod = 3.0 ... 4.5 lambda_c all gave 4 rods, so Law 3 (m = W / lambda_c) is not what the 2D
#     dynamics does in that range; the staircase m(W) has not been measured in the shipped script.
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# files at commit d58a084 after the Pass 3 edits (verified against the working tree while writing this audit).

