        evidence:
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [1069, 1262], note: "measure_morphoeval(): 14 measurements with reference_value/reference_source/unit; 9 added in Pass 3 (L1168-1261)", supports: true}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [1129, 1137], note: "Measurement 2: 1D autopod wavelength vs lambda_c is exact by construction (domain W = 4 lambda_c with seeded cosine at L312-313)", supports: false}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [1200, 1220], note: "Proximo-distal onset-order measurement (Spearman rho) and Saunders ablation RMSE", supports: true}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [1241, 1250], note: "corr(S, B) = -0.988 vs Raspopovic (2014) out-of-phase reference -1.0", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Credits: 8 primary sources with DOIs in the docstring (L6-34), `paper_citations.bib` and the
