simulations:
  - id: oster-mechanochemical-chondrogenesis
    name: "Oster, Murray & Harris (1983) / Oster, Murray & Maini (1985) mechanochemical limb chondrogenesis"
    organism: "Ambystoma mexicanum & Oedipina ecuatoriana urodele salamander limb cartilage"
    script: 1983-oster-mechanochemical-chondrogenesis.py
    output: docs/media/mechanochemical_chondrogenesis_comparison.png
    extra_outputs:
      - docs/media/mechanochemical_chondrogenesis_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-mechanochemical-chondrogenesis-audit-v2
    claim_boundary:
      reported_in_source:
        - "Oster, Murray & Harris (1983) J. Embryol. Exp. Morph. 78:83-125 and Oster, Murray & Maini (1985) J. Embryol. Exp. Morph. 89:93-112 coupled mesenchymal cell-density and viscoelastic ECM traction PDE system; the AER maintains a distal recruitment/progress zone and condensations are laid down proximo-distally"
        - "Critical cell traction bifurcation threshold tau_c driving focal condensation (stylopod), dichotomous Y-bifurcation (zeugopod) and digital branching (autopod: 4 forelimb / 5 hindlimb digits in urodele salamanders)"
        - "Saunders (1948): removing the chick-wing AER at progressively later stages leaves progressively more distal skeletal parts (proximo-distal sequence of origin)"
        - "Raspopovic et al. (2014): a Bmp-Sox9-Wnt Turing network with Sox9 out of phase with Bmp and Wnt patterns the digits"
      reconstructed_in_script:
        - "Exact marginal stability curve tau_eff(k^2) with analytic tau_c = 1.2776 at k_c = 0.9597 (lambda_c = 6.5472) and the 1D spectral-pseudospectral cell-ECM solver reproducing modes [0, 1, 2, 4, 5] on periodic domains W = m lambda_c with seeded m-cosine perturbations"
        - "A 2D coupled cell-ECM PDE on a limb paddle with a moving free-boundary AER front (progress-zone traction suppression and proliferation, AER regression, anisotropic PD cell diffusion a_y = 3, ectoderm-balanced prestress) producing the forelimb [1, 2, 4] and hindlimb [1, 2, 5] hierarchies from a seeded proximal nucleus plus noise, with proximo-distal onset order and the Saunders (1948) ablation series [1, 1, 2, 3]"
        - "A 4x4 hybrid Jacobian and 1D hybrid PDE coupling the mechanics to Raspopovic (2014) BSW kinetics (tau(1 + alpha_S S), +kappa_S (n - N_0)), with wavelength-matched ligand diffusivities, showing tau_c lowering 1.44 -> 0.35 and a 2x2 factorial [0, 0, 0, 4] at tau = 0.85"
        - "Morphological segmentation of the vendored Oedipina ecuatoriana specimen giving [1, 2, 4] / [1, 2, 5] hierarchies, autopod spacings 39.0 / 41.25 px and the zeugopod/autopod spacing ratio compared with the 2D PDE (1.235 vs 1.373)"
      transfer_boundary:
        - "The 2D domain is a Fourier-periodic box with a diffuse (tanh) competence field, not a sharp Neumann boundary; the ECM force balance is reduced to a component-wise Helmholtz operator (no shear/Poisson coupling, no ECM density equation) and the viscous relaxation rate 1/(mu + 0.15) is ad hoc"
        - "The solvers' drift kernel includes mu k^2 in the quasi-static stiffness, so their effective tau_c (1.4397) is 12.7% above the analytic 1.2776 shown in Panels A/D; all supercritical regimes used exceed both"
        - "Only the proximal humeral/femoral nucleus is seeded in the 2D solver; the stylopod width W = 1.4 lambda_c is a tuned choice (W = 1.0 is marginal), and the autopod count is partly inherited by 2 -> 4 bifurcation rather than set by W / lambda_c"
        - "The BSW parameters are copied from the Slot 016 reference JSON, rescaled in diffusivity to match lambda_c; the Saunders (1948) comparison is a qualitative stage-to-segment mapping, not digitised data; lengths are in lambda_c units with no micron calibration against the specimen"
      does_not_claim:
        - "A 3D finite-element limb, explicit ECM density/advection, joint/phalangeal segmentation of the rods, Hoxd13 gene-dosage polydactyly scaling (Slot 017), or quantitative reproduction of the full Raspopovic (2014) 2D autopod (Slot 016)"
    source_refs:
      - oster1983
      - oster1985
      - murray1984
      - shubin1986
      - saunders1948
      - raspopovic2014
      - tenberge2008
      - hall2000
    summary: >-
      Pass 3 remediation-round evaluation of `1983-oster-mechanochemical-chondrogenesis.py` (87.1/100,
      down from 90.7 in Pass 2 although the model is substantially more faithful). Both v2 remediation
      items were closed: the kinematic 2D template that v2 had credited as a solver is replaced by a
      genuine 2D coupled cell-ECM PDE on a limb paddle with a moving free-boundary AER front
      (`_simulate_2d_aer_free_boundary_outgrowth`, L427-628) that produces the forelimb [1, 2, 4] and
      hindlimb [1, 2, 5] hierarchies from a seeded proximal nucleus plus noise, lays them down in
      proximo-distal order (onset 30.0 < 56.5 < 78.5) and reproduces the Saunders (1948) AER-ablation
      truncation series [1, 1, 2, 3]; and the mechanics are hybridised with Raspopovic (2014)
      Bmp-Sox9-Wnt kinetics (`hybrid_mechanochemical_bsw_jacobian`, L717-759;
      `simulate_1d_hybrid_mechanochemical_bsw`, L816-902) showing a synergy window (tau_c 1.44 -> 0.35)
      and a 2x2 factorial [0, 0, 0, 4] at tau = 0.85 with corr(S, B) = -0.988. The same work exposed
      that the solvers' drift kernel is 12.7% off the analytic threshold, that the 1D wavelength
      validation is tautological, that the reference JSON's canonical parameters were never the
      script's, and that in 2D the autopod count is partly inherited by bifurcation rather than set by
      W / lambda_c; these drive the lower, more honest scores. 9 machine-checked Lean 4 theorems
      (6 new, 0 sorrys) and 14 reference-anchored measurements (9 new).
    scores:
      model-fidelity:
        value: 85
        rationale: >-
          Credits: the analytic marginal-stability curve and tau_c (L192-237) match the linearised
          Oster-Murray-Maini balance; the new 2D solver (L427-628) couples cell conservation with
          biharmonic diffusion, traction-driven drift and Kelvin-Voigt ECM relaxation to a moving
          free-boundary AER with a progress zone, which is the mechanism Oster, Murray & Maini (1985)
          Sec. 4 describe; the hybrid 4x4 Jacobian (L717-759) is a correct linearisation of the stated
          coupled system and its analytic-kernel limit reproduces tau_c = 1.2776 (self-test L1645).
          Deductions: the drift kernel 1/(E k^2 + s + mu k^2) (L508; 1D L329) treats viscosity as
          stiffness, so the solvers' tau_c = 1.4397 differs by 12.7% from the analytic value the figure
          reports (-5); the ECM balance is component-wise Helmholtz with no shear/Poisson term, no ECM
          density rho equation and the paper's -div(n du/dt) advection is replaced by the traction-drift
          velocity (-4); ad hoc constants (relaxation 1/(mu + 0.15) L327/L572-573, cubic -0.18 (n - N_0)^3
          L334/L580, aniso_y = 3.0 L444) are not from the source (-3); the v2 Panel C was a kinematic
          template, so part of the v2 fidelity credit was unearned and is not restored here (-3).
        evidence:
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [192, 237], note: "Analytic marginal stability curve tau_eff(k^2) and tau_c = 1.2776 at k_c = 0.9597", supports: true}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [427, 628], note: "2D coupled cell-ECM PDE with moving free-boundary AER front, progress zone, AER regression, anisotropic PD diffusion and ectoderm-balanced prestress (sigma_drive L566, drift kernel L508)", supports: true}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [717, 759], note: "4x4 hybrid mechanochemical + Bmp-Sox9-Wnt Jacobian; den = m_k + mu k^2 (solver kernel) vs m_k (analytic) at L751", supports: true}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [1251, 1261], note: "Measurement 14 discloses tau_c(solver) = 1.4397 vs analytic 1.2776 (12.7%) — the solver does not implement the analytic dispersion relation exactly", supports: false}
          - {file: morphoeval/lean/loops/Loop_013_mechanochemical_chondrogenesis.lean, lines: [98, 185], note: "6 new machine-checked theorems: AER front monotone, outgrowth mode monotone, Saunders ablation truncation, hybrid threshold lowering, synergy window, n-Sox9 loop determinant", supports: true}
      specimen-match:
        value: 86
        rationale: >-
          Credits: the vendored Oedipina ecuatoriana specimen is SHA-256-verified and segmented into
          [1, 2, 4] / [1, 2, 5] (L968-1058); the 2D free-boundary PDE output (Panels C, G) now shows a
          single proximal rod, a Y-bifurcation and 4 or 5 parallel digital rays within a widening
          paddle, visibly the same architecture as the specimen in Panel E, and its autopod section is
          overlaid on the specimen profile in Panel F; the GIF shows the sequence emerging behind the
          AER. Deductions: the PDE rods are continuous with no joints, carpals/tarsals or phalangeal
          segmentation and all digits have equal length, unlike the specimen (-6); the PDE
          zeugopod/autopod spacing ratio is 1.235 vs the specimen's 1.373 (10% error, L1190-1199) (-3);
          the forelimb stylopod rod is faint (amplitude ~0.3-0.4 vs ~0.6 for digits) because
          W_stylopod = 1.4 lambda_c is near-marginal (-3); the comparison remains count-and-spacing level
          with no micron calibration (-2).
        evidence:
          - {file: docs/media/mechanochemical_chondrogenesis_comparison.png, lines: [0, 0], note: "Panels C/G: 2D free-boundary PDE forelimb [1, 2, 4] and hindlimb [1, 2, 5]; Panel E specimen segmentation; Panel F specimen profile with the scaled PDE autopod section overlaid", supports: true}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [968, 1058], note: "Specimen segmentation (forelimb/hindlimb hierarchies, spacings, profile correlation r = 0.874)", supports: true}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [1190, 1199], note: "Zeugopod/autopod spacing ratio PDE 1.235 vs specimen 1.373 (10% error)", supports: true}
          - {file: docs/media/mechanochemical_chondrogenesis_growth.gif, lines: [0, 0], note: "24 frames of the free-boundary PDE: stylopod rod -> Y-bifurcation -> 4 digits behind the advancing AER front", supports: true}
      parameter-expressivity:
        value: 86
        rationale: >-
          Credits: v_AER, t_ablate, bsw_gain, coupling and digits are CLI flags (L1682-1692, --sweep-2d);
          the ablation time controls the truncation level monotonically ([1, 1, 2, 3], Spearman rho =
          0.95, Panel H); the coupling strength lowers tau_c monotonically along an 11-point curve
          (L928-929, inset of Panel I; self-test L1647-1648); autopod_digits = 4 / 5 sets the distal paddle
          width and yields 4 / 5 digits; the phase diagram marks the 2D-PDE zone counts. Deductions:
          during tuning W_autopod = 3.0 ... 4.5 lambda_c all produced 4 rods, i.e. in the 2D solver the
          digit count is partly inherited by 2 -> 4 bifurcation and is not the m = round(W / lambda_c)
          staircase of Law 3 that Panel D draws — this sweep is not in the shipped script and the
          discrepancy is not displayed (-7); W_stylopod = 1.0 gives no condensation and 1.3-1.5 give one,
          so the stylopod regime is narrow and tuned (-4); aniso_y, d_pz and gate_w are fixed and unswept
          although they decide rod orientation (isotropic diffusion gives stripes parallel to the front)
          (-3).
        evidence:
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [631, 668], note: "Saunders ablation series over t_ablate = (0, 14, 30, intact) with Spearman rho and RMSE vs [1, 1, 2, 3]", supports: true}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [905, 962], note: "Synergy evaluation: tau_c(alpha_S = kappa_S) curve, factorial counts, phase correlations", supports: true}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [1678, 1716], note: "CLI: --tau, --digits, --aer-speed, --ablate-at, --bsw-gain, --coupling, --seed, --sweep-2d", supports: true}
          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [444, 451], note: "aniso_y = 3.0, w_stylopod = 1.4, w_zeugopod = 2.0 fixed defaults; no shipped W-sweep of the 2D mode staircase", supports: false}
      morphometric-validation:
        value: 88
        rationale: >-
          Credits: 14 reference-anchored measurements (L1069-1262), 9 new: 2D hierarchies vs specimen
          [1, 2, 4] / [1, 2, 5] (RMSE 0), 2D zeugopod/autopod spacing ratio vs the specimen's 1.373,
