          - {file: 1983-oster-mechanochemical-chondrogenesis.py, lines: [128, 158], note: "SHA-256 pins for specimen JPG and scout manifest; reference JSON hashed at runtime", supports: true}
          - {file: datasets/mechanochemical_chondrogenesis/mechanochemical_chondrogenesis_reference.json, lines: [1, 60], note: "8 sources with DOIs (4 added in Pass 3) and the SHA-pinned specimen record", supports: true}
          - {file: datasets/mechanochemical_chondrogenesis/mechanochemical_chondrogenesis_reference.json, lines: [102, 137], note: "canonical_parameters (never used by the script) next to the new script_default_parameters block with the disclosure note", supports: false}
