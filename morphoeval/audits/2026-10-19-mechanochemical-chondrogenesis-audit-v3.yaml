          out-of-phase prediction, and the disclosed solver/analytic tau_c discrepancy. Deductions:
          measurement 2 (1D wavelength = lambda_c, CV = 0.0000, L1129-1137) is circular — the periodic
          domain is W = 4 lambda_c and the m = 4 cosine is seeded (L312-313) (-5); the synergy and
