      name: "Joel Dietz"
      orcid: null
      github: https://github.com/fractastical
  domain: morphogenesis
  tracked_by: https://github.com/fractastical/morpholib/issues/1
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: fb234bc
    environment:
      python: "3.14.7"
      numpy: "2.4.2"
      scipy: "1.17.0"
      matplotlib: "3.10.8"
      Pillow: "12.1.1"
    note: >-
      First formal 7-axis MorphoEval audit of `1984-wolfram-conus-textile-rule30.py`,
      covering Wolfram Rule 30 (1984/2019 Prize Problems), Erica Jen's (1990)
      left-cone period-doubling dislocation theorem, Meinhardt & Klingler's (1987)
      mantle-edge activator-substrate-hormone PDE, 3D Raup Conus shell texture
      mapping, and 1D space-time defect-front kymograph tooling.

