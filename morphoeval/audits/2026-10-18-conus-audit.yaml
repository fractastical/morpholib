# MorphoEval audit — Wolfram (1984) Rule 30 & Meinhardt–Klingler (1987) Conus textile Pigmentation, 2026-10-18
#
# Evaluates `1984-wolfram-conus-textile-rule30.py` across the 7 MorphoEval axes:
#   - Wolfram (1983, 1984, 2002) Elementary Cellular Automaton Rule 30 (`p XOR (q OR r)`)
#     and the 2019 Wolfram Rule 30 Prize Problems #1-#3 (OEIS A051023 center column,
#     Erica Jen 1990 left-bijective inverse & diagonal period-doubling dislocation cascade,
#     and directional Boolean damage-cone velocities).
#   - Meinhardt & Klingler (1987) 3-component activator-substrate-hormone reaction-diffusion
#     PDE for mollusk mantle-edge tent pigmentation and lesion scar recovery.
#   - Raup (1966) 3D biconical Conus shell mesh (`W=1.42, D=0.05, T=3.15`) validated against
#     segmented OSU Conus textile specimen photography (`24399204286`, James St. John, CC BY 2.0).

