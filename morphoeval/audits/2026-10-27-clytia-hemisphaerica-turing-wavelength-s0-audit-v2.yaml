    summary: >-
      Pass 2 closes the Pass-1 probe defect. With the analytic eigenvector and a
      second-half fit, PDE growth rates match Jacobian σ(k) at Pearson r = 0.9993
      and RMSE = 0.014 s⁻¹. Selected wavelength is 8.646 µm (assigned 8.64 µm,
      log10 = -5.063) at age 0 Ma. Equal-diffusion std(u) = 0.00132 versus wild-type
      0.0193. Dv/Du from 10 to 36 increases λ_*. Segmented planula aspect is 3.23
      against a circular null of 1, circularity 0.371, interior KS 0.191 against 0.
      CV similarity of the 12-frame 640 px GIF against the Momose micrograph is 82.1.
      A feathered outline was tried and rejected: it dropped CV to 60.5.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion and Schnakenberg 1979 kinetics"
        - "Murray 1981 scale argument that wavelength count tracks domain size"
        - "Extant Clytia life cycle, gonad opsin, and hydrozoan ocelli as context"
      reconstructed_in_script:
        - "γ = 2.2268 s⁻¹ pins k_* to 8.64 µm at Du = 1 µm²/s and Dv/Du = 20"
        - "Mode counts 28 (250 µm planula, reconstructed) and 231 (2 mm bell)"
        - "Render domain is the segmented planula mask"
      transfer_boundary:
        - "The 8.64 µm length is the assigned detail-tier anchor transferred onto k_*"
        - "The photograph is a planula; the ocellus is a medusa organ"
      does_not_claim:
        - "That a paper measured an 8.64 µm ocellus stripe in Clytia"
        - "Any temporal wavelength change (chronoseries 1/1, age delta 0 Ma)"
        - "That the synthetic species-gallery spiral is this specimen"
