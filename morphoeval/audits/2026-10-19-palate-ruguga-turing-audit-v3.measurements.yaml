    claim_boundary:
      reported_in_source:
      - 'Economou et al. (2012): mesenchymal FGF10/FGF7 (activator) and epithelial SHH (inhibitor) form a Turing
        reaction-diffusion system at the rugae growth zone anterior to ruga 8; rugae are added sequentially 8 ->
        1..7b as the palate elongates; a coronal explant cut across the growth zone yields bifurcations / spots
        whereas a sagittal cut preserves stripes; cyclopamine broadens and FGF10 beads / Spry2-/-;Spry4+/- compact
        the pattern; Shh expression marks each morphological ruga (Fig. 1)'
      - 'Pantalacci et al. (2008), Welsh & O''Brien (2009): staging of sequential ruga addition in the RGZ anterior
        to ruga 8'
      - 'Turing (1952): diffusion-driven instability of a two-component activator-inhibitor system'
      - 'Landau & Lifshitz (1986): equilibrium equation of a thin elastic plate and its bending stiffness'
      reconstructed_in_script:
      - '2x2 Jacobian and dispersion relation with lambda_c = 3.2221; 1D and 2D RD solvers with growth-zone envelope;
        9-stage L/lambda_c intercalation count; 6-condition perturbation suite; DoG segmentation of the specimen
        shelves (15 / 16 rugae); Pass 3: quasi-static Kirchhoff plate on a Winkler foundation driven by beta max(A,
        0), solved exactly by DCT-II, optional chi_m feedback, ridge count / phase-offset / duty-cycle morphometrics,
        kappa / k_f / chi_m sweeps, 2 Lean 4 theorems on the transfer stiffness'
      transfer_boundary:
      - The plate constants kappa = 0.05, T = 0.2, k_f = 1, beta = 1 are dimensionless modelling assumptions (no
        offline-verifiable measurement of embryonic palatal epithelial stiffness); only the sign-preservation, wavelength-transfer
        and monotone-attenuation predictions are scored, not ridge heights in micrometres
      - The specimen is an adult horse palate photograph; its duty cycle (0.49 / 0.44) is compared qualitatively
        with the simulated mouse-embryo ridges (0.42) after the same peak_widths estimator; DoG smoothing broadens
        the specimen crests
      - The 2D RD solver integrates on a rescaled x spacing dx_eff = dx (q / 1.24), so the realised grid wavelength
        (3.37) differs from the dispersion lambda_c (3.22) that Panels B / D use; the plate solver uses the physical
        dx
      does_not_claim:
      - A 3D finite-element simulation of epithelial invagination with large deflections or nonlinear growth; calibrated
        ridge heights; emergence of the coronal-cut / bead / cyclopamine phenotypes from identical initial conditions
        (they are seeded by condition-specific initial patterns at L606-633); mechanics-dependent phenotypes compared
        with a published mechanical perturbation
