    claim_boundary:
      reported_in_source:
      - 'Sharon et al. (2002): a free sheet with excess marginal arc length (torn plastic, lettuce, kale) buckles
        into a self-similar sub-harmonic cascade of edge waves whose wavelength grows linearly with distance from
        the edge'
      - 'Audoly & Boudaoud (2003): self-similar cascade scaling lambda_{m+1} = lambda_m / r near a strained boundary'
      - 'Liang & Mahadevan (2009): saddle-to-ripple transition of a long leaf controlled by the dimensionless metric
        strain parameter'
      - 'Nath et al. (2003), Palatnik et al. (2003), Efroni et al. (2008): CIN/TCP transcription factors arrest
        marginal proliferation basipetally; cin / jaw-D leaves grow excess marginal area and become negatively curved,
        miR319-resistant TCP flattens'
      - 'Bilsborough et al. (2011), Nikovics et al. (2006), Koyama et al. (2007), Hay et al. (2006): CUC2-gated
        PIN1 auxin convergence points position serrations on the growing margin; cuc2 and pin1 margins are smooth'
      - 'Smith et al. (2006), Jönsson et al. (2006): up-the-gradient PIN1 polarisation generates auxin maxima'
      reconstructed_in_script:
      - Exponential marginal metric g_yy(x) = 1 + g_0 exp(-x/ell), exact Brioschi K(x) < 0, linear lambda_loc(x),
        a surrogate L-BFGS-B FvK multi-generation cascade relaxation with flat-metric negative control, 3D mesh
        reconstruction, 9-station inward profile, 4-system taxon sweep and ExG specimen segmentation (Pass 2)
      - 'Pass 3: 1D forward-Euler PDEs on a growing Lagrangian margin lattice for auxin (diffusion + PIN1 up-the-gradient
        transport + production - decay - growth dilution), CUC2 (repressed by auxin and TCP, gating PIN1) and a
        basipetal TCP maturation front; interior and marginal growth strains whose ratio gives g_0(y,t); the FvK
        cascade re-solved on <g_0>; serration tips, primary/secondary hierarchy and emergence time from the kinematic
        outgrowth field; 5 genotype presets vs a 6-check ordinal phenotype table'
      transfer_boundary:
      - The gene network parameters (TCP front speed, auxin diffusion/transport/decay, CUC2 kinetics) are Arabidopsis-literature-motivated
        magnitudes applied to a Lactuca sativa margin; the wild-type calibration target g_0 = 0.64 is the Pass 2
        Lactuca mechanical value, so WT agreement is a cross-module self-consistency check, not a measurement
      - cin/WT = 1.5 and TCP-OE/WT = 0.6 in the reference table are placeholder magnitudes for the ordinal statements
        '> 1' and '< 1'; the serration-count range [5, 40] is a broad plausibility bound, not a digitised count
      - The Pass 2 cascade relaxation minimises a surrogate energy whose target slope, aspect constant, penetration
        targets and activation cutoff are chosen so the output reproduces the reference table; wavelength / penetration
        r = 1.0000 are by construction
      does_not_claim:
      - A 2D growing-sheet FvK or FEM solution with spatially resolved K(x,y) feedback, mechanical feedback on PIN1
        polarity, cell division on the stretching lattice, an elastic in-plane solution for serration outgrowth,
        digitised serration/lobe counts from Bilsborough 2011 or Nath 2003, or online verification of the 9 new
        DOIs
