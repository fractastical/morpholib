      Pass 1 of slot 3156. The Lean file is integer `decide` proofs; this environment
      has no `lean` binary, so the kernel was not executed. Nanopub signing profile
      ~/.nanopub/profile.yml is absent.

references:
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing AM"
    venue: "Philosophical Transactions of the Royal Society B 237:37-72 (1952)"
    doi: 10.1098/rstb.1952.0012
  schnakenberg1979:
    title: "Simple chemical reaction systems with limit cycle behaviour"
    authors: "Schnakenberg J"
    venue: "Journal of Theoretical Biology 81:389-400 (1979)"
    doi: 10.1016/0022-5193(79)90042-0
  schmid1983:
    title: "Wall morphogenesis in Coscinodiscus wailesii. I. Valve morphology and development of its architecture"
    authors: "Schmid A-MM, Volcani BE"
    venue: "Journal of Phycology 19:387-402 (1983)"
    doi: 10.1111/j.0022-3646.1983.00387.x
  edwards2001:
    title: "Case history and persistence of the non-indigenous diatom Coscinodiscus wailesii in the north-east Atlantic"
    authors: "Edwards M, John AWG, Johns DG, Reid PC"
    venue: "Journal of the Marine Biological Association of the United Kingdom 81:207-211 (2001)"
    doi: 10.1017/S0025315401003654
  kondo2010:
    title: "Reaction-diffusion model as a framework for understanding biological pattern formation"
    authors: "Kondo S, Miura T"
    venue: "Science 329:1616-1620 (2010)"
    doi: 10.1126/science.1179047

simulations:
  - id: delphi10000-coscinodiscus-wailesii-turing-wavelength-s0
    name: "Coscinodiscus wailesii Turing wavelength at 4.3 mm (Holocene, chronoseries 1/1)"
    organism: "Coscinodiscus wailesii"
    script: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py
    output: docs/media/coscinodiscus_wailesii_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/coscinodiscus_wailesii_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs:
      - turing1952
      - schnakenberg1979
      - schmid1983
      - edwards2001
      - kondo2010
    summary: >-
      Pass 1 implements spatial Schnakenberg kinetics and reports k_c = argmax sigma_+(k),
      calibrated so the nominal wavelength is 4.3 mm at age 0 Ma. The early-time power
      spectrum tracks lambda_sigma with Pearson r = 0.9899 and RMSE = 1.453 length units.
      The determinant-minimizer proxy anti-correlates (r = -0.919) and is rejected.
      Equal diffusivities decay (amplitude ratio 0.038). The upper-left SEM panel yields
      718 areolae at pitch 10.15 px. The animated GIF is 12 frames at 640×480 and scores
      cv_sim_similarity 84.8 against the vendored plate.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: a homogeneous reaction-diffusion equilibrium can select a stationary wavelength."
        - "Schnakenberg 1979: trimolecular kinetics. The paper is well-mixed; the spatial PDE is a transfer."
        - "Schmid and Volcani 1983: C. wailesii valve formation is centrifugal and proximal-to-distal, with distal cribra."
        - "Edwards et al. 2001: the species persisted in the north-east Atlantic from 1977 through 1995."
      reconstructed_in_script:
        - "Jacobian, sigma_+(q), and k_c = sqrt(argmax sigma_+)."
        - "Calibration of nominal lambda_sigma to 4.3 mm (0.004316 m)."
        - "Periodic spot integration, D_v sweep, equal-diffusivity ablation, and SEM pore segmentation."
      transfer_boundary:
        - "4.3 mm is the Delphi detail-scale wavelength for this slot, not a measured valve diameter."
        - "The cohort form class is realized as areolar spots."
      does_not_claim:
        - "That one frustule is 4.3 mm across."
        - "That q_det is the selected wavenumber."
        - "That SEM scale bars have been read as nanometres."
        - "That a predecessor or successor chronospecies exists in this 1/1 series."
    scores:
      model-fidelity:
        value: 84
        rationale: >-
          The PDE, Jacobian, and sigma_+ maximizer are implemented (sigma_plus, sigma_max_wavenumber).
          The det-minimizer is kept only as a negative control and anti-correlates with the spectrum.
          Pass 1 still headlines the power-spectrum peak, which is systematically longer than sigma_+
          (RMSE 1.453 length units), so the reported comparison is not yet the linear growth rate.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [15, 28], note: "PDE, steady state, Jacobian, and the statement that q_det is not the reported law", supports: true}
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [143, 165], note: "sigma_+ and k_c = sqrt(argmax sigma_+)", supports: true}
          - {file: morphoeval/lean/loops/Loop_3156_coscinodiscus_wailesii_turing_wavelength_s0.lean, lines: [26, 48], note: "Integer Turing-band and ablation theorems; kernel not executed in this environment", supports: true}
      specimen-match:
        value: 76
        rationale: >-
          The comparison figure places the vendored six-panel SEM beside the spot field, and the
          GIF scores cv_sim_similarity 84.8 at 640×480 with 12 frames. Pass 1 does not yet treat
          that score as a closed specimen match: the animation is a periodic spot lattice, while
          the micrograph is a labelled plate montage, and the disc-clamped valve is unmeasured.
        evidence:
          - {file: docs/media/coscinodiscus_wailesii_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "SEM plate, periodic spots, disc clamp, dispersion, sweep, and panel pitches", supports: true}
          - {file: docs/media/coscinodiscus_wailesii_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 640×480 growth GIF, cv_sim_similarity 84.8", supports: true}
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [451, 466], note: "Six-panel segmentation of the SHA-256-pinned SEM", supports: true}
      parameter-expressivity:
        value: 74
        rationale: >-
          An eight-point D_v sweep and an equal-diffusivity ablation are computed, and lambda_sigma
          lengthens with inhibitor diffusivity (14.086, 16.328, 18.895 length units at D_v = 16, 32, 64).
          Pass 1 does not yet record a one-point CLI probe or the interior standard deviation of the
          disc-clamped margin, so the boundary condition is shown rather than measured.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [321, 364], note: "D_v sweep over (16, 20, 24, 28, 32, 40, 48, 64) with det-proxy control", supports: true}
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [367, 390], note: "Ablation at D_v = D_u decays; nominal branch grows", supports: true}
      morphometric-validation:
        value: 76
        rationale: >-
          Power-spectrum Pearson r = 0.9899 against lambda_sigma, with RMSE = 1.453 length units.
          Upper-left areola pitch is 10.15 px (CV 0.268, n = 718) against simulated pitch 14.06 px
          (CV 0.086). KS distance on median-normalised diameters is 0.317. The RMSE is a real bias,
          so this pass does not treat the fit as closed.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [251, 263], note: "Early-time radial power peak used as the pass-1 wavelength observable", supports: true}
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [696, 780], note: "measure_morphoeval records r, RMSE, pitch, pitch CV, and KS with references that differ from the values", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Five DOIs are vendored in paper_citations.bib and the reference JSON. The specimen JPEG
          is SHA-256 cf556dab9e116068…, matching the species-gallery file and the CC BY-SA 4.0
          Wikimedia plate. Slot 3156 is absent from campaign_100_slots.yaml; the scout used the
          OpenAlex/Crossref/Wikimedia query path and found no colliding slug.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [101, 112], note: "Runtime SHA-256 pin of the specimen and the 4.3 mm / 0 Ma reference fields", supports: true}
          - {file: datasets/coscinodiscus_wailesii_turing_wavelength_s0/coscinodiscus_wailesii_turing_wavelength_s0_reference.json, lines: [1, 40], note: "Scale 4.3 mm, age 0 Ma, chronoseries 1/1, and specimen digest", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          The module docstring maps each symbol onto Turing 1952 and Schnakenberg 1979, and the
          Lean namespace MathOfBiology.Loop_3156 restates the integer band conditions. The spatial
          step is explicitly a transfer of a well-mixed paper.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [1, 39], note: "Header ties equations, scale, age, and the rejected proxy to the sources", supports: true}
      repro-package:
        value: 86
        rationale: >-
          Seed 3156, a self-test covering the Turing band, ablation decay, bitwise rerun, the
          power-spectrum correlation, and panel pitch order. Dependencies are the scientific
          stack already used by MorphoEval. The Lean kernel and nanopub signer were not available.
        evidence:
          - {file: models/2026-delphi10000-coscinodiscus-wailesii-turing-wavelength-s0.py, lines: [858, 917], note: "self_test guards, including r > 0.98 on the power spectrum and ablation ratio < 0.2", supports: true}
    remediation:
      - "Headline the goodness of fit on the two-time Fourier growth-rate wavelength (empirical_growth_wavelength) and report its RMSE beside the 1.453 length-unit power-spectrum residual."
      - "Expose a --dv/--seed probe so inhibitor diffusivity is a command-line regime, and print lambda_sigma against lambda_growth at that point."
      - "Measure the disc-clamped valve interior standard deviation against the ablation amplitude so the margin boundary condition is a number, not only a panel."
