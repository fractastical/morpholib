# MorphoEval audit — Coscinodiscus wailesii Turing wavelength, slot 3156, pass 1.
# Scale 4.3 mm (0.004316 m), Holocene 0 Ma, chronoseries 1/1.
# Headline fit at this pass is the early-time power spectrum:
#   Pearson r(lambda_sigma, lambda_spectrum) = 0.9899, RMSE = 1.453 length units.
# That residual, the unmeasured disc clamp, and the unused diffusivity probe are the
# remediation items closed by the v2 audit.

audit:
  id: 2026-10-27-coscinodiscus-wailesii-turing-wavelength-s0-audit
  supersedes_audit_id: null
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (pass 1 assessment)"
    homepage: https://x.ai
  second_assessor:
    id: grok-4.7-numeric-crosscheck
    label: "Same-runtime cross-check of sigma_+ against the early-time radial spectrum"
    homepage: https://x.ai
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
  license: https://creativecommons.org/licenses/by/4.0/
