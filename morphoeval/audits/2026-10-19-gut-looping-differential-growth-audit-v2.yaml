simulations:
  - id: savin-gut-looping-differential-growth
    name: "Savin et al. (2011) Kirchhoff elastic rod + stretched neo-Hookean dorsal mesentery gut looping morphogenesis"
    organism: "Vertebrate midgut & dorsal mesentery (Gallus gallus, Coturnix japonica, Taeniopygia guttata, Mus musculus)"
    script: 2011-savin-gut-looping-differential-growth.py
    output: docs/media/gut_looping_differential_growth_comparison.png
    extra_outputs:
      - docs/media/gut_looping_differential_growth_growth.gif
    status: evaluated
    source_refs:
      - savin2011
      - nerurkar2017
      - kurpios2008
      - shyer2013
    summary: >-
      Pass 2 (v2) evaluation of `2011-savin-gut-looping-differential-growth.py` (overall
      weighted score: 92.6/100, up from 56.4/100 in v1). The remediated script relaxes a
      120-node 3D discrete Kirchhoff elastic rod coupled to a stretched neo-Hookean dorsal
      mesentery sheet via L-BFGS-B energy minimization; reproduces Savin et al.'s (2011)
      universal cube-law scaling collapse across 14 developmental stages in 4 vertebrate
      species (zebra finch, quail, chick, mouse; r = 0.9999, RMSE = 0.025 mm, log-log
      exponent alpha = 0.9963 ± 0.0044); validates surgical mesentery ablation (epsilon = 0 ->
      0 loops, tortuosity = 1.0000) and Nerurkar et al. (2017) BMP2/Noggin perturbations;
      and segments the SHA-256-locked biological specimen image (`intestine_mesentery_specimen.jpg`,
      76 loop apices, CV = 0.2319).
    scores:
      model-fidelity:
        value: 94
        rationale: >-
          Implements Savin et al.'s (2011) exact differential strain epsilon = (L_t - L_m)/L_m,
          annular second moment of area I_t = (pi/4)*(R_t^4 - R_i^4), cube-root characteristic
          length ell_* = (E_t*I_t / (E_m*h_m))^(1/3) (L114-144), and a 120-node 3D discrete
          Kirchhoff elastic rod + stretched neo-Hookean dorsal mesentery L-BFGS-B energy
          minimizer (`relax_kirchhoff_gut_rod`, L149-292) with surgical mesentery ablation
          (epsilon = 0 -> straight unlooped rod, tortuosity = 1.0000) and BMP2/Noggin
          perturbation controls (L434-478), backed by 3 machine-checked Lean 4 theorems in
          `morphoeval/lean/loops/Loop_062_gut_looping_differential_growth.lean`.
        evidence:
          - {file: 2011-savin-gut-looping-differential-growth.py, lines: [114, 144], note: "Exact differential strain, annular inertia I_t, and cube-root characteristic length ell_*", supports: true}
          - {file: 2011-savin-gut-looping-differential-growth.py, lines: [149, 292], note: "3D discrete Kirchhoff elastic rod + neo-Hookean dorsal mesentery L-BFGS-B energy minimizer and epsilon=0 ablation control", supports: true}
          - {file: morphoeval/lean/loops/Loop_062_gut_looping_differential_growth.lean, lines: [11, 86], note: "3 machine-checked Lean 4 theorems for differential strain, cube-law stationarity, and annular inertia factorization (0 sorrys)", supports: true}
      specimen-match:
        value: 90
        rationale: >-
          Vendors and SHA-256-verifies the CC BY-SA 4.0 biological specimen image
          `datasets/gut_looping_differential_growth/intestine_mesentery_specimen.jpg`,
          segments the yellow-orange vascularized dorsal mesentery fan and pinkish-red
          intestinal loop coils (`segment_intestine_mesentery_specimen`, L484-565; 76 loop
          apices, mean inter-loop spacing 22.30 px, CV = 0.2319), and matches all 14
          empirical points across Zebra finch, Quail, Chick, and Mouse (Savin et al. 2011
          Fig. 4e-f, r = 0.9999).
        evidence:
          - {file: 2011-savin-gut-looping-differential-growth.py, lines: [484, 565], note: "Chromaticity + DoG ridge segmentation of dorsal mesentery sheet and 76 intestinal loop apices", supports: true}
          - {file: docs/media/gut_looping_differential_growth_comparison.png, lines: [0, 0], note: "6-panel synthesis figure comparing 3D Kirchhoff rod, 4-species collapse, BMP2/Noggin/ablation controls, and specimen segmentation", supports: true}
      parameter-expressivity:
        value: 91
        rationale: >-
          Spans 5 Chick ontogenetic stages (E8-E16, epsilon in [1.26, 3.72], L298-353),
          14 developmental stages across 4 vertebrate species spanning a 6.3-fold range in
          ell_* (0.230 to 1.447 mm, L356-431), 4 signaling/surgical conditions at E12
          (surgical ablation epsilon=0, RCAS-Noggin epsilon=1.95, Wild-Type epsilon=3.12,
          RCAS-BMP2 epsilon=4.15, L434-478), and exposes `--epsilon`, `--E-ratio`, `--R-t`,
          `--h-m`, and `--seed` CLI overrides (L1002-1028).
        evidence:
          - {file: 2011-savin-gut-looping-differential-growth.py, lines: [356, 478], note: "14-point 4-species morphospace evaluation and 4-condition BMP2/Noggin/ablation sweep", supports: true}
          - {file: 2011-savin-gut-looping-differential-growth.py, lines: [1002, 1028], note: "CLI parameter overrides wired into evaluate_chick_stages and figure rendering", supports: true}
      morphometric-validation:
        value: 93
        rationale: >-
          `measure_morphoeval()` (L856-949) computes 9 reference-anchored morphometric
          measurements with uncertainty and statistical tests: 4-species wavelength
          Pearson r = 0.9999 (p = 3.5e-24, RMSE = 0.025 mm), 4-species radius Pearson r =
          0.9999 (p = 1.9e-23, RMSE = 0.010 mm), log-log scaling exponent alpha = 0.9963 ±
          0.0044 (ref 1.0), Chick E12 relaxed 3D rod wavelength 3.1132 mm (ref 3.12 mm) and
          radius 1.1499 mm (ref 1.15 mm), surgical ablation tortuosity 1.0000 (ref 1.0),
          BMP2/Noggin loop-count ratio 1.8581 (ref 2.0909), specimen inter-loop spacing
          CV = 0.2319, and cross-species lambda/R = 2.7126 (ref 2.7083).
        evidence:
          - {file: 2011-savin-gut-looping-differential-growth.py, lines: [856, 949], note: "9 quantitative morphometric measurements with p-values, RMSE, SE, CV, and negative-control deltas", supports: true}
      source-traceability:
        value: 95
        rationale: >-
          Vendors `datasets/gut_looping_differential_growth/` with 4 primary DOIs in
          `paper_citations.bib` (`10.1038/nature10277`, `10.1073/pnas.1618677114`,
          `10.1073/pnas.0803578105`, `10.1126/science.1238842`), `scout_manifest.json`,
          `gut_looping_differential_growth_reference.json`, and `intestine_mesentery_specimen.jpg`,
          all verified via runtime SHA-256 checks (`verify_dataset_integrity`, L72-109).
        evidence:
          - {file: 2011-savin-gut-looping-differential-growth.py, lines: [72, 109], note: "Runtime SHA-256 verification of all 4 dataset files in datasets/gut_looping_differential_growth/", supports: true}
          - {file: datasets/gut_looping_differential_growth/gut_looping_differential_growth_reference.json, lines: [1, 215], note: "SHA-256-locked reference dataset with Chick E8-E16, 4-species collapse, and BMP2/Noggin tables", supports: true}
      code-traceability:
        value: 92
        rationale: >-
          Module and function docstrings map every equation to Savin et al. (2011)
          Figs. 1-4 & Supplementary Sec. S2-S4, Nerurkar et al. (2017) PNAS Figs. 2-3,
          Kurpios et al. (2008) PNAS, and the 3 formal Lean 4 theorems in
          `morphoeval/lean/loops/Loop_062_gut_looping_differential_growth.lean` (L1-42, L114-165).
        evidence:
          - {file: 2011-savin-gut-looping-differential-growth.py, lines: [1, 42], note: "Explicit equation-to-paper and Lean 4 theorem traceability in module header", supports: true}
      repro-package:
        value: 93
        rationale: >-
          8-point `self_test()` suite (`L952-999`) verifying SHA-256 dataset integrity,
          JSON-to-code parity, zero-strain surgical ablation uncoiling, Chick E8-E16
          monotonicity & L-BFGS-B energy drop, 4-species scaling collapse, BMP2/WT/Noggin
          loop ordering, specimen CV segmentation, and two-run bitwise determinism
          (`np.allclose(..., atol=0.0)`).
        evidence:
          - {file: 2011-savin-gut-looping-differential-growth.py, lines: [952, 999], note: "Comprehensive 8-check self_test() including bitwise determinism and ablation invariants", supports: true}
    remediation:
      - "Couple the 3D discrete Kirchhoff rod to a full 2D finite-element triangular mesh of the fan-shaped dorsal mesentery with spatially varying apicobasal Pitx2 stiffness gradients."
