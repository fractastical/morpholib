    doi: "10.1016/0022-5193(79)90042-0"
  murray1981:
    title: "A pre-pattern formation mechanism for animal coat markings"
    authors: "Murray, J. D."
    venue: "Journal of Theoretical Biology"
    doi: "10.1016/0022-5193(81)90334-9"
  kondo2010:
    title: "Reaction-diffusion model as a framework for understanding biological pattern formation"
    authors: "Kondo, S. and Miura, T."
    venue: "Science"
