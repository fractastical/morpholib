# MorphoEval audit v2 — Canis lupus Turing wavelength, detail scale.
# Closes pass-1 items R1, R2, R3, and R5. R4 (second assessor) stays open.
audit:
  id: 2026-10-27-canis-lupus-turing-wavelength-s0-audit-v2
  rubric_version: "0.1.0"
  date: "2026-10-27"
  supersedes_audit_id: 2026-10-27-canis-lupus-turing-wavelength-s0-audit
  publisher_orcid: "https://orcid.org/0009-0007-4948-9192"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, single agent; second assessor still not run)"
    model_label: "Grok 4.7"
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 0c76d15d14afcec6c366e1b9274a6586a0de48fc
    note: "Pass 2 working tree. REMEDIATION_PASS = 2. Unsigned: no ~/.nanopub/profile.yml."
references:
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing, A. M."
