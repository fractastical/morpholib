          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [121, 166], note: "Poiseuille + metabolic power functional, conductance constant k_M, optimal radius and wall shear stress", supports: true}
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [455, 551], note: "Pries 1992 eta_rel(D), apparent viscosity normalised to Murray's eta at large D, log-slope eps, generalised stationarity Q*(r), local gamma_eff and bisection junction exponent", supports: true}
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [655, 745], note: "Geodesic Murray tree on a sphere: exact great-circle stepping, Rodrigues rotation about the surface normal, cube-law radii, repulsive A/V handedness rule (L714-727)", supports: true}
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [761, 890], note: "Arterial then venous trees, AVR-coupled venous root, k_v/k_a flow balance, interdigitation/pairing/crossing metrics, fundus-projection foreshortening", supports: true}
          - {file: morphoeval/lean/loops/Loop_052_vascular_cube_law_branching.lean, lines: [129, 170], note: "Laws 4-5: fl_stationarity_residual + fahraeus_lindqvist_stationarity_shift (Newtonian limit, vanishing residual, strict metabolic-share drop) and arteriovenous_coupled_cube_balance", supports: true}
          - {file: 1959-murray-vascular-cube-law-branching.py, lines: [714, 727], note: "A/V coupling is a geometric handedness rule (keep the side farther from the nearest rival node); no haemodynamic or angiogenic mechanism", supports: false}
