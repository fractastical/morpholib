    claim_boundary:
      reported_in_source:
        - "Murray (1926a): minimising Poiseuille pumping power plus a metabolic cost proportional to blood volume gives Q proportional to r^3 and a scale-invariant wall shear stress sqrt(eta b); at the optimum the metabolic term is twice the viscous term"
        - "Murray (1926b): the same functional fixes the bifurcation angles via cos(theta_1) = (r_0^4 + r_1^4 - r_2^4)/(2 r_0^2 r_1^2) and its mirror; symmetric total angle 74.93 deg"
        - "Zamir (1976): alternative optimality principles (surface, volume, drag, power) give different angle laws; Sherman (1981): the cube law holds across generations of a tree"
        - "Fåhraeus & Lindqvist (1931) / Pries et al. (1992): the apparent viscosity of blood falls in tubes narrower than ~300 um, fitted by eta_rel(D) = 220 e^{-1.3D} + 3.2 - 2.44 e^{-0.06 D^0.645} at H_D = 0.45"
        - "Hubbard et al. (1999): the clinical retinal arteriole-to-venule caliber ratio is about 2/3"
      reconstructed_in_script:
        - "Power functional, stationarity radius, wall shear invariance, asymmetric cosine laws, Zamir/Steiner/Da Vinci ablation controls, 7-generation Sherman hierarchy and the gamma power sweep (Newtonian)"
        - "Fahraeus-Lindqvist eta(r) in the Poiseuille term, generalised stationarity 2 P_met = (4 - eps) P_visc, local gamma_eff(r), symmetric junction exponent gamma_j(r_0) and a Newtonian-vs-F-L tree exponent sweep (gamma* 3.000 -> 2.773)"
        - "Geodesic arterial and venous Murray trees on a 12 mm sphere with tangent-plane Murray angles, AVR-coupled venous root, repulsive A/V coupling with an uncoupled control, orthographic fundus-projection foreshortening and projected A/V crossings"
        - "Green-channel top-hat / Zhang-Suen skeleton / EDT segmentation of the vendored human fundus specimen (N = 19 Y-junctions)"
      transfer_boundary:
        - "The 3D retinal cup is a reduced geometric model: no haemodynamic network solve, no capillary bed connecting arterial and venous tips, no oxygen/VEGF-guided angiogenesis, optic disc at the posterior pole; the venous root radius is an input (AVR = 0.67), not emergent"
        - "The F-L fit is the in-vitro glass-tube relation at fixed H_D = 0.45 (no in-vivo endothelial surface layer correction, no phase separation at bifurcations), applied per generation to a symmetric tree; the '~2.7' target is reached by the tree optimum (2.773) but not by the local junction exponent (2.859 at 25 um)"
        - "The J01-J08 'Zamir 1979' junction table carries a Murray-prediction column and agrees with Murray to <= 0.3 deg without page/figure provenance, so the RMSE = 0.134 deg / r = 0.9999 figures are a parity check, not independent validation; the Sherman (1981) hierarchy table is generated from r_g = 82 um * 2^(-g/3), not digitised"
      does_not_claim:
        - "Independent human morphometric confirmation of the F-L exponent shift, of the AVR (an input), or of arteriovenous interdigitation (index 0.504 ~ random mixing, reference 1.0 is an idealisation); verification of the three Pass 3 DOIs (recalled offline, flagged in bib, JSON and script header)"
    summary: >-
      Pass 3 (v3 remediated) evaluation of `1959-murray-vascular-cube-law-branching.py`
      (89.2/100, down 1.7 from 90.9/100 in Pass 2). Both Pass 2 remediation items landed:
      Section 4b implements Pries et al. (1992) Fahraeus-Lindqvist apparent viscosity in the
      Poiseuille term with the generalised stationarity 2 P_met = (4 - eps) P_visc (Lean 4
      `fahraeus_lindqvist_stationarity_shift`), shifting the 7-generation power-minimising
      exponent from 3.000 to 2.773 (junction exponent at 25 um 2.859); Section 4c grows coupled
      arterial and venous Murray trees by exact geodesic steps on a 12 mm hemispherical retinal
      cup (sphericity residual 7e-15 mm) with AVR-coupled venous root (Lean 4
      `arteriovenous_coupled_cube_balance`), a repulsive A/V coupling versus an uncoupled control,
      fundus-projection foreshortening (3.3 deg central, 32.4 deg peripheral) and a new 3D GIF.
      The figure now has 9 panels, `measure_morphoeval()` 15 entries and `self_test()` 9 suites
      (all pass, 2.6 s; render 4.9 s). The score nonetheless falls because the round exposed
      defects v2 had credited: the J01-J08 junction table is prescribed/circular and its source
      (Zamir, Medeiros & Cunningham 1979) is uncited in the bib, the Sherman hierarchy table is
      synthetic, three new DOIs are unverified, the F-L "2.7" reference is the audit's own target,
      the interdigitation item is only partially closed (index 0.504 vs 0.41 control, random
      level), and the specimen measurement still uses an uncorrected planar reference angle.
    scores:
      model-fidelity:
        value: 93
        rationale: >-
          Murray's (1926a) power functional, stationarity radius and exact tau_w = sqrt(eta b)
          invariance (L121-166, L305-359), Murray's (1926b) asymmetric cosine laws with Zamir,
          Steiner and Da Vinci controls (L175-240, L361-443) are unchanged and correct. Pass 3
          adds the Fahraeus-Lindqvist mechanism correctly: eta(r) normalised so the large-vessel
          limit equals Murray's eta (L467-483), generalised stationarity Q*(r) = (pi/2) r^3
          sqrt(b/(eta(r)(4 - eps))) with eps = d ln eta / d ln r (L486-521) and a bisection
          junction exponent (L524-551); the 3D cup uses exact geodesic stepping and Rodrigues
          tangent-plane rotations with cube-law radii (L655-745) and a flow-balance venous
          coupling k_v/k_a = sum r^3 / sum R^3 (L761-890). Five machine-checked Lean 4 theorems
          (0 `sorry`s). Deductions: the retinal cup is a kinematic growth rule with no
          haemodynamic solve or capillary closure, and its A/V "coupling" is a heuristic
          handedness choice (L714-727) that segregates territories rather than producing paired
          arcades (-4); the F-L fit is in-vitro at fixed H_D = 0.45 with no phase separation, and
          eta(r) is applied generation-wise to a symmetric tree (-2); the empirical junction
          evaluator (L242-300) still scores a table that is itself Murray-generated (-1).
