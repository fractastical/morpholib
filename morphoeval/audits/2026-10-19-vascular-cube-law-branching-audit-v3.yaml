# MorphoEval audit — Murray (1926a, 1926b) / Zamir (1976) / Sherman (1981) Minimum-Work Vascular Cube Law & Bifurcation Angles, 2026-10-19 (v3)
#
# Pass 3 superseding assessment of `1959-murray-vascular-cube-law-branching.py` (v3, 1,819 lines; was 1,090)
# after the remediation round `2026-10-19-vascular-cube-law-branching-loop-pass3` closed both Pass 2
# remediation items:
#   1. Section 4c (L639-890): 3D hemispherical retinal-cup geometry (globe radius 12 mm) with geodesic
#      Murray trees, tangent-plane bifurcation rotations, AVR-coupled venous root, a repulsive
#      arteriovenous growth coupling plus an uncoupled ablation control, fundus-projection
#      foreshortening and projected A/V crossing counts (Panel H, new 3D GIF).  Reduced geometric model:
#      the terminal-tip interdigitation index stays at random-mixing level (0.504 vs 0.41 uncoupled),
#      so the "coupled interdigitation" half of the item is only PARTIALLY closed.
#   2. Section 4b (L445-636): Fahraeus-Lindqvist eta(r) (Pries, Neuhaus & Gaehtgens 1992 in-vitro fit,
#      H_D = 0.45) in the Poiseuille term with generalised stationarity 2 P_met = (4 - eps) P_visc;
#      the 7-generation tree optimum shifts gamma* = 3.000 -> 2.773 (Panels G, I).  The symmetric
#      junction exponent at r0 = 25 um is 2.859, so "~2.7" holds for the tree optimum only.
#   Lean 4 Laws 4-5 (`fahraeus_lindqvist_stationarity_shift`, `arteriovenous_coupled_cube_balance`)
#   verified, 0 `sorry`s; 15 measurements (7 new); 9 self-test suites.
#
# Overall 89.2 (v2 90.9, -1.7): model-fidelity, parameter-expressivity, code-traceability and
# repro-package improve, but the round exposed deeper defects that the v2 audit had credited at face
# value — the J01-J08 "Zamir 1979" junction table is prescribed/circular (RMSE 0.134 deg is not an
# independent validation), the Sherman (1981) hierarchy is generated rather than digitised, three new
# DOIs are unverified, and the specimen pipeline is unchanged while its reference angle is still an
# uncorrected planar projection.  Scores are uncalibrated criterion-referenced scores on the rubric's
# 0-100 scale.  Line numbers refer to the working-tree files at commit 028758bc (uncommitted Pass 3
# remediation applied on top).

