    name: "Murray (1926a, 1926b), Zamir (1976) & Sherman (1981) minimum-work vascular cube law & arterial branching angles"
    organism: "Homo sapiens (human retinal arterial and microvascular bifurcation network)"
    script: 1959-murray-vascular-cube-law-branching.py
