# MorphoEval audit — Armon, Efrati, Kupferman & Sharon (2011) Science Chiral Seed Pod Opening, 2026-10-19 (v3)
#
# Pass 3 re-score of `2007-liang-chiral-seed-pod-opening.py` (2123 lines) after the remediation of the single open
# v2 item in the instrumented loop `morphoeval/runs/2026-10-19-chiral-seed-pod-opening-loop-pass3`, superseding
# `2026-10-19-chiral-seed-pod-opening-audit-v2` (93.4).
#
# What Pass 3 changed (v2 remediation item 1, closed as an honest REDUCED 1-D model, not a 3-D elastodynamic FEM):
#   1. Energy coupling: `bending_energy_prefactor` (B_eff = Y h^3 / (12 (1 + nu)) from the Efrati 2009 bending content)
#      and `released_valve_energy_density` call the Pass 2 L-BFGS-B minimizer and return Delta_e = B_eff (kappa_0^2 -
#      e_final) and the suture energy release rate G = Delta_e W / h (278.0 J/m^2 fully dried, 47.5 mJ per valve).
#   2. Transient suture fracture: `rayleigh_wave_speed` (c_R = 418 m/s), `freund_crack_speed` (Freund 1990
#      v = c_R max(0, 1 - Gamma_c/G)), `heterogeneous_suture_toughness` (seeded Gamma_c(a), CV 0.15),
#      `integrate_suture_crack` (explicit da/dt with arrest where Gamma_c(a) >= G).
#   3. Two-timescale coupling: `simulate_suture_fracture_ballistic_ejection` — desiccation kappa_0(t) on a 96-point
#      grid, minimizer at every kappa_0(t) -> G(t), Griffith initiation at t_c = 63.7 h, 9 stick-slip jumps, opening
#      fraction 1.0, <v_crack> = 36 m/s = 0.086 c_R; seeds eject tip -> base as the crack passes.
#   4. Ballistics: `elastic_catapult_seed_speed` (v = sqrt(2 eta Delta_U_seg / (m_seg/3 + m_seed)), 2.77 m/s mean,
#      3.84 m/s fully-dried bound) and `ballistic_range_with_drag` (RK4 quadratic drag, 1.65 m vs 1.97 m drag-free).
#   5. `evaluate_suture_toughness_sweep`: 7-point Gamma_c/G in {0.2..1.2}; homogeneous suture reproduces the Freund law
#      (r = 1.0000); heterogeneous suture arrests (opening 1.0 -> 0.05); Gamma_c >= G no-fracture control.
#   6. Figure 3x3 (panels G-I), new `docs/media/chiral_seed_pod_opening_suture_fracture.{png,gif}`, CLI --gamma-c,
#      --eta, --m-seed, --fracture-json; self-test 8 -> 12 checks; 2 new Lean 4 theorems (5 laws, 0 sorrys); new
#      SHA-256-pinned `suture_fracture_ballistic_reference.json` with per-constant provenance flags; bib + 4 entries.
#
# Why the overall score goes DOWN (93.4 -> 87.1) despite the item being closed: the Pass 3 remediation exposed a
# deeper layer of defects that the v2 audit credited as validation. The `*_obs` columns of the width and cutting-angle
# sweeps in the SHA-pinned reference JSON are analytical values of the same reduced model (not digitised Armon 2011
# figure data), so v2 measurements 3-7 (r = 1.0000) are self-referential; the specimen-CV reference is the script's
# own output; the 4-system table carries page pointers but no digitisation coordinates; the pitchfork threshold is an
# input (Lambda is normalised by w_tilde_c) and H / branch / phi are post-processed after the minimizer; and all 12
# Pass 3 fracture/ballistic constants are `provenance: model` with a Cardamine (different taxon) launch-speed benchmark.
# Model-fidelity, specimen-match and parameter-expressivity hold or improve; morphometric-validation and
# source-traceability are re-scored on what the evidence actually supports.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the working-tree files at checkpoint 45670cb8 plus the uncommitted Pass 3 edits listed in
# the handoff note (`git diff` of the three remediated files), verified by grep at audit time.

