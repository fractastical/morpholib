        evidence:
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [1163, 1248], note: "Contour and bilayer reflectance segmentation of the SHA-locked Bauhinia specimen; hard-coded ROI at L1175 and runs[0]/runs[-1] valve assignment at L1194-1200", supports: true}
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [645, 722], note: "4-system table evaluation; the JSON R_obs/P_obs for Erythrina and latex carry page pointers only, no digitisation coordinates", supports: false}
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [1249, 1358], note: "Panels G-I: suture toughness profile and crack tip trajectory, catapult speed vs Gamma_c/G with Cardamine/Hura transfer-boundary lines, ballistic arcs", supports: true}
