simulations:
  - id: liang-chiral-seed-pod-opening
    name: "Armon et al. (2011) Science / Efrati et al. (2009) JMPS Incompatible Shell Elasticity & Chiral Seed Pod Opening"
    organism: "Bauhinia variegata (Orchid tree chiral seed pod valves) & Erythrina corallodendron"
    script: 2007-liang-chiral-seed-pod-opening.py
    output: docs/media/chiral_seed_pod_opening_comparison.png
    extra_outputs:
      - docs/media/chiral_seed_pod_opening_growth.gif
      - docs/media/chiral_seed_pod_opening_suture_fracture.png
      - docs/media/chiral_seed_pod_opening_suture_fracture.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-chiral-seed-pod-opening-audit-v2
    source_refs:
      - armon2011
      - efrati2009
      - armon2014
      - forterre2005
      - freund1990
      - hofhuis2016
      - swaine1977
      - vogel2005
    claim_boundary:
      reported_in_source:
        - "Armon et al. (2011): orthogonal +-45 deg sclerenchyma layers prescribe a saddle target curvature b_0 = diag(kappa_0, -kappa_0) with det(b_0) < 0; narrow strips (w_tilde below a critical FvK width) adopt pure-twist helicoids, wide strips cylindrical helical ribbons; cutting angle controls chirality and pitch"
        - "Efrati et al. (2009): incompatible non-Euclidean plate energy E = E_stretch + E_bend with bending content proportional to Y h^3 [nu Tr(M)^2 + (1 - nu) Tr(M^2)], M = b - b_0"
        - "Freund (1990): mode-I dynamic energy release rate G_dyn(v) ~ (1 - v/c_R) G, so a crack runs at v = c_R (1 - Gamma_c/G) and arrests when Gamma_c >= G"
        - "Hofhuis et al. (2016) / Swaine & Beer (1977) / Vogel (2005): explosive seed launch speeds of order 10 m/s (Cardamine) and 70 m/s (Hura), elastic-catapult energy budgets and drag-limited ranges of small projectiles"
      reconstructed_in_script:
        - "Reduced L-BFGS-B non-Euclidean energy functional U(H, D, phi; w_tilde) over the dimensionless width, pitchfork sweep, cutting-angle sweep, 4-system table, 3-D ribbon mesh and specimen segmentation (Pass 2); Pass 3 adds B_eff Delta_e -> suture G, a 1-D Freund crack equation of motion over a seeded heterogeneous toughness field, drying-coupled Griffith initiation and stick-slip propagation, an elastic-catapult launch-speed estimate and an RK4 quadratic-drag trajectory, and a 7-point Gamma_c/G ablation sweep"
      transfer_boundary:
        - "The `*_obs` columns of the width and cutting-angle sweep tables in chiral_seed_pod_opening_reference.json are analytical values of the same reduced model (H_obs = (1 - nu)/2 sqrt(1 - (w_tilde_c/w_tilde)^4), tau_obs = D sin 2theta), not digitised Armon 2011 figure points; the r = 1.0000 correlations are self-consistency, not validation"
        - "The launch-speed benchmark (10 m/s) is Cardamine hirsuta and the upper bound (70 m/s) is Hura crepitans; no Bauhinia variegata launch-speed, suture-toughness or dispersal datum was verifiable offline, and the predicted 2.8-3.8 m/s is ~3.6x below the Cardamine value"
        - "All 12 fracture/ballistic constants (rho, Gamma_c, CV_Gamma, a_0, tau_dry, n_seeds, m_seed, r_seed, C_d, eta, launch angle, launch height) are `provenance: model` in suture_fracture_ballistic_reference.json"
      does_not_claim:
        - "3-D elastodynamic shell or FEM simulation of valve coiling (inertia enters only via eta and a first-mode cantilever coil time), plate-wave corrections to c_R, a measured Bauhinia fracture toughness or seed mass, or digitised comparison against Armon 2011 Figs. 3-4"
    summary: >-
      Pass 3 (v3) evaluation of `2007-liang-chiral-seed-pod-opening.py` (overall weighted score 87.1/100, down from
      93.4 in v2). The single v2 remediation item is closed honestly as a reduced 1-D model: the Pass 2 L-BFGS-B
      minimizer now supplies a suture energy release rate G = B_eff (kappa_0^2 - e_final) W / h (278 J/m^2 fully dried)
      that drives a Freund (1990) crack equation of motion along a seeded heterogeneous suture, coupled to a desiccation
      curve kappa_0(t) (Griffith initiation at 63.7 h, 9 stick-slip jumps, opening fraction 1.0, <v_crack> = 0.086 c_R),
      an elastic-catapult launch-speed estimate (2.77 m/s) and a drag-limited ballistic range (1.65 m), with a 7-point
      toughness ablation that reproduces the Freund law (r = 1.0000) and a Gamma_c >= G no-fracture control. Two new
      Lean 4 theorems (5 laws, 0 sorrys) and 4 new self-test checks (12/12) were added. The score falls because the
      remediation exposed that the v2 "observations" were analytical outputs of the same model, the specimen-CV
      reference is the script's own value, the pitchfork threshold is an input rather than emergent, and every Pass 3
      fracture/ballistic constant is an unsourced modelling choice benchmarked against a different taxon.
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          The incompatible-plate core is unchanged and credited (saddle b_0 with det(b_0) = -kappa_0^2 < 0,
          `compute_target_curvature_tensor` L174-209; FvK critical width L210-217; L-BFGS-B minimizer of
          U(H, D, phi; w_tilde) L278-416). Pass 3 adds a physically coherent reduced coupling: B_eff derived from the
          Efrati bending content (L733-741), Delta_e -> G (L743-776), Freund's equation of motion with arrest
          (L783-790, L807-859), drying-driven Griffith initiation and stick-slip in
          `simulate_suture_fracture_ballistic_ejection` (L932-1097), and energy-partition ballistics (L861-879,
          L889-931), each with a negative control and backed by 2 new Lean theorems. Deductions: the pitchfork
          threshold is prescribed, not emergent — Lambda is normalised by (w_tilde/w_tilde_c)^4 (L324-325) so the
          bifurcation occurs at w_tilde_c by construction (-3); after the minimizer, H is forced to 0 for
          w_tilde <= w_tilde_c, its sign is forced to `branch`, and phi is snapped to 0 (L362-366), so the reported
          branch structure is partly post-processed (-3); e_init = kappa_0^2 assumes a perfectly flat closed valve
          (upper bound on stored energy, L753-756), the crack area assumes h_suture = h, c_R uses the bulk shear speed
          not plate waves (L778-781), and m_eff = m_seg/3 is a cantilever heuristic (L871-875) — no flexural or
          snap-through dynamics of the coiling valve are simulated (-4).
        evidence:
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [174, 217], note: "Rotated saddle target curvature tensor b_0(theta) with det(b_0) = -kappa_0^2 < 0 and FvK critical width w_tilde_c", supports: true}
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [278, 416], note: "L-BFGS-B minimizer of the reduced non-Euclidean energy; Lambda normalised by (w_tilde/w_tilde_c)^4 at L324-325 and H/branch/phi post-processing at L362-366 make the pitchfork partly prescribed", supports: false}
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [733, 790], note: "B_eff from the Efrati 2009 bending content, released energy density Delta_e -> suture G, Rayleigh speed and Freund crack speed law with arrest", supports: true}
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [807, 931], note: "Explicit da/dt integration with arrest, elastic-catapult launch speed (cantilever m/3 heuristic), cantilever coil time and RK4 quadratic-drag ballistics", supports: true}
          - {file: 2007-liang-chiral-seed-pod-opening.py, lines: [932, 1097], note: "Two-timescale coupling: desiccation kappa_0(t) -> minimizer -> G(t) -> Griffith initiation, stick-slip jumps, seed ejection timeline", supports: true}
          - {file: morphoeval/lean/loops/Loop_065_chiral_seed_pod_opening.lean, lines: [126, 189], note: "freund_crack_speed_arrest_and_monotonicity and elastic_catapult_energy_partition (Int-linear abstractions of the scaled Freund law and eta energy partition; 0 sorrys)", supports: true}
      specimen-match:
        value: 86
        rationale: >-
          The SHA-256-locked Bauhinia variegata specimen (MHNT.BOT.2011.3.22) is still segmented into both dehisced
          valves and 8 helical lobe apices (`segment_bauhinia_pod_specimen` L1163-1248) and Panel E overlays the
