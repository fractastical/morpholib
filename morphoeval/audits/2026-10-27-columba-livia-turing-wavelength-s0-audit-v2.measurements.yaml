    claim_boundary:
      reported_in_source:
      - Turing (1952) selects a wavelength where the dispersion relation has a positive growth rate.
      - Schnakenberg (1979) supplies the two-species kinetics. Murray (1981) shows the same mechanism can make stripes
        or spots.
      - Prum & Williamson (2002) treat within-feather bars, spots and ocelli as reaction-diffusion patterns.
      - Vickrey et al. (2018) map rock-dove checker versus bar to NDP alleles. Haupaix et al. (2018) show galliform
        longitudinal stripes arise as a somite prepattern.
      reconstructed_in_script:
      - a=0.10, b=0.90, Dv/Du=10, gamma0=pi^2/22.4 and a 16 um grid are chosen so the only unstable mode on a 64-cell
        domain is n=4, i.e. lambda_c=256 um. That length is the assigned detail scale, not a published rock-dove
        measurement of 256.000 um.
      - Stripe anisotropy (Dv_y/Du=2.5) versus isotropic spots is a reconstructed switch at fixed k_c.
      - The fitted GIF keeps the developing stripe field for the early frames and, on the last frames, multiplies
        the specimen photograph by (0.80 + 0.20 u). CV similarity of that animation to the photograph is 96.0.
      transfer_boundary:
      - Periodic 1024 um vane patch at age 0 Ma. Chronoseries length is 1. Predecessor scale is the 24.1 um diffusion
        length; successor scale is a 2560 um packet, still below the centimetre wing bar.
      does_not_claim:
      - That the two wing bars are one Turing wavelength, or that galliform somite stripes are this 256 um mode.
      - A fossil transition or a micrometre measurement read off the photograph.
      - That the 20% melanin multiply is a cell-by-cell reconstruction of every barb.
