      - 168-cell paraboloidal L1 dome coupled Auxin-PIN1-CMT ODE simulator with the L1 stress field supplied by
        the 3D mesh (Pass 3) or by the Pass 2 analytic field (ablation); antisymmetric active flux conservation;
