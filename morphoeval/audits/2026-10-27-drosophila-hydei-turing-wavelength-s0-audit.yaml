# MorphoEval audit — Drosophila hydei detail-scale Turing wavelength, loop 3189, pass 1.
# Builder and assessor are the same agent (grok-4.7). No second assessor.
# This pass scores the first self-test: real-eigenvalue modes only (Pearson r = 0.984),
# oscillatory mode n=1 excluded, and the GIF computer-vision score not yet emitted
# by measure_morphoeval. Those three items are the remediation list.

audit:
  id: 2026-10-27-drosophila-hydei-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, single agent; no second assessor)"
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: a4df1e95
    note: "Pass 1 of loop 3189. Evidence paths are the slot-3189 files added on this branch."
  environment:
    python: "3.12.3"
    numpy: "2.5.4"
    scipy: "1.18.1"
    matplotlib: "3.11.2"
    Pillow: "13.0.0"

references:
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing AM"
    venue: "Philosophical Transactions of the Royal Society of London B 237(641):37-72 (1952)"
    year: 1952
    doi: 10.1098/rstb.1952.0012
  schnakenberg1979:
    title: "Simple chemical reaction systems with limit cycle behaviour"
    authors: "Schnakenberg J"
    venue: "Journal of Theoretical Biology 81(3):389-400 (1979)"
    year: 1979
    doi: 10.1016/0022-5193(79)90042-0
  gierer1972:
    title: "A theory of biological pattern formation"
    authors: "Gierer A, Meinhardt H"
    venue: "Kybernetik 12(1):30-39 (1972)"
    year: 1972
    doi: 10.1007/BF00289234
  kondo2010:
    title: "Reaction-diffusion model as a framework for understanding biological pattern formation"
    authors: "Kondo S, Miura T"
    venue: "Science 329(5999):1616-1620 (2010)"
    year: 2010
    doi: 10.1126/science.1179047
  pitnick1995:
    title: "How long is a giant sperm?"
    authors: "Pitnick S, Spicer GS, Markow TA"
    venue: "Nature 375(6527):109 (1995)"
    year: 1995
    doi: 10.1038/375109a0
  pitnick1995pnas:
    title: "Delayed male maturity is a cost of producing large sperm in Drosophila"
    authors: "Pitnick S, Markow TA, Spicer GS"
    venue: "Proceedings of the National Academy of Sciences 92(23):10614-10618 (1995)"
    year: 1995
    doi: 10.1073/pnas.92.23.10614
  gompel2005:
    title: "Chance caught on the wing: cis-regulatory evolution and the origin of pigment patterns in Drosophila"
    authors: "Gompel N, Prud'homme B, Wittkopp PJ, Kassner VA, Carroll SB"
    venue: "Nature 433(7025):481-487 (2005)"
    year: 2005
    doi: 10.1038/nature03235
    role: "counter-evidence that Drosophila pigment patterns have a demonstrated cis-regulatory mechanism"

simulations:
  - id: delphi10000-drosophila-hydei-turing-wavelength-s0
    name: "Drosophila hydei 2.3 µm Turing wavenumber (Holocene, 0 Ma)"
    organism: "Drosophila hydei"
    script: models/2026-delphi10000-drosophila-hydei-turing-wavelength-s0.py
    output: docs/media/drosophila_hydei_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/drosophila_hydei_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, gierer1972, kondo2010, pitnick1995, pitnick1995pnas, gompel2005]
    summary: >-
      Schnakenberg field (a=0.10, b=0.90, γ=1, D_u=1, D_v=20) on a periodic
      9.376 µm patch whose length unit is fixed so λ_c = 2.344 µm
      (2.344e-06 m, log10=-5.630, tier 3_subcellular_um). Age is Holocene, 0 Ma.
      Trace=-0.2, det=1, equal-diffusion control σ_max=-0.1025. First self-test
      Pearson r=0.984 on real-eigenvalue modes only. Predecessor D. heteroneura
      is 175.4 µm, the same-species primordium slot is exactly 50× coarser
      (117.2 µm), successor D. kikkawai is 93.41 µm. The CC BY 3.0 photograph
      does not resolve 2.3 µm. Weighted score 82.4/100 before the envelope fit
      and the in-measurement CV score.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: diffusion-driven instability at a critical wavenumber."
        - "Schnakenberg 1979: the two-species kinetics used here."
        - "Pitnick, Spicer and Markow 1995: giant Drosophila sperm; the PNAS abstract says some species exceed ten male body lengths."
        - "Gompel et al. 2005: a Drosophila pigment spot with a cis-regulatory origin."
      reconstructed_in_script:
        - "Length unit chosen so λ_c(γ=1)=2.344 µm, with λ scaling as γ^(-1/2)."
        - "Chronoseries ratios against 175.4 µm, 117.2 µm and 93.41 µm at geological age 0 Ma."
      transfer_boundary:
        - "The cohort law is applied at the assigned detail scale. It is not a parameter estimate from a hydei cuticle micrograph."
      does_not_claim:
        - "That a 2.3 µm Turing instability has been measured in D. hydei."
        - "That the whole-animal photograph resolves that wavelength."
        - "That the campaign epithet of a 58 mm sperm was re-measured in this loop."
        - "That cis-regulatory pigment control is absent."
    scores:
      model-fidelity:
        value: 84
        rationale: >-
          The script implements the Schnakenberg steady state, Jacobian, and
          Turing dispersion, and the Lean module proves the scaled trace, determinant,
          diffusion inequality, equal-diffusion failure, and the 50× primordium
          identity. The kinetics are the standard Schnakenberg system, not a
          hydei-specific published PDE, and the first fit dropped complex eigenvalues.
        evidence:
          - {file: models/2026-delphi10000-drosophila-hydei-turing-wavelength-s0.py, lines: [1, 36], note: "equations, 2.344 µm scale, 0 Ma age, predecessor and successor", supports: true}
          - {file: models/2026-delphi10000-drosophila-hydei-turing-wavelength-s0.py, lines: [87, 129], note: "jacobian, dispersion σ(k), and k_c", supports: true}
          - {file: morphoeval/lean/loops/Loop_3189_drosophila_hydei_turing_wavelength_s0.lean, lines: [25, 54], note: "seven theorems, 0 sorry, scaled Jacobian and chronoseries inequalities", supports: true}
      specimen-match:
        value: 80
        rationale: >-
          The comparison figure places the CC BY 3.0 photograph beside the
          9.376 µm activator patch, and the 12-frame 720×540 GIF ends on that
          photograph with a low-amplitude pigment window. The animal is recognisable.
          The 2.3 µm stripes themselves are not visible in the photograph, so this
          is not a pixel-level micrograph match.
        evidence:
          - {file: docs/media/drosophila_hydei_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, patch, dispersion, chronoseries bars, gamma sweep, ablation", supports: true}
          - {file: models/2026-delphi10000-drosophila-hydei-turing-wavelength-s0.py, lines: [492, 518], note: "GIF last frame keeps specimen texture; earlier frames show the growing field", supports: true}
      parameter-expressivity:
        value: 86
        rationale: >-
          Analytical λ(γ) for γ in {0.25, 1, 4, 9} is 4.688, 2.344, 1.172, 0.781 µm,
          strictly decreasing, and a γ=4 integration returns 1.172 µm. Equal diffusion
          drives σ_max to -0.1025. a and b are not swept.
        evidence:
          - {file: models/2026-delphi10000-drosophila-hydei-turing-wavelength-s0.py, lines: [349, 367], note: "gamma sweep and the closed-form λ ∝ γ^(-1/2)", supports: true}
          - {file: models/2026-delphi10000-drosophila-hydei-turing-wavelength-s0.py, lines: [388, 406], note: "equal-diffusion ablation", supports: true}
      morphometric-validation:
        value: 74
        rationale: >-
          Real-eigenvalue modes already gave Pearson r=0.984, and the specimen
          mask is measured (foreground 0.5504, circularity 0.0615, coherency 0.679)
          against independent references. The first fit excluded the oscillatory
          mode, the KS call warned that the exact method failed, and the GIF CV
          score was not yet a measurement row. Those are remediation R1–R3, so
          this dimension stays below the pass-2 score.
        evidence:
          - {file: models/2026-delphi10000-drosophila-hydei-turing-wavelength-s0.py, lines: [226, 238], note: "FFT wavelength of the steady activator", supports: true}
          - {file: models/2026-delphi10000-drosophila-hydei-turing-wavelength-s0.py, lines: [409, 446], note: "specimen border-contrast segmentation", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Turing 1952, Schnakenberg 1979, Gierer & Meinhardt 1972, Kondo & Miura 2010,
          both Pitnick 1995 papers, and Gompel et al. 2005 are in the BibTeX with DOIs
          checked on OpenAlex. The specimen is Wikimedia Commons File:Drosophila hydei 09.JPG,
          CC BY 3.0, SHA-256 pinned. The 58 mm epithet is not given a new measurement.
        evidence:
          - {file: datasets/drosophila_hydei_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "Turing, Schnakenberg, Gierer-Meinhardt DOIs", supports: true}
          - {file: datasets/drosophila_hydei_turing_wavelength_s0/drosophila_hydei_turing_wavelength_s0_reference.json, lines: [1, 40], note: "2.344e-06 m, log10=-5.630, age 0 Ma, specimen pin", supports: true}
      code-traceability:
        value: 82
        rationale: >-
          Docstring equations match jacobian(), dispersion(), and critical_wavenumber().
          Lean declarations name the same scaled integers. There is no map onto
          numbered equations of Turing 1952.
        evidence:
          - {file: models/2026-delphi10000-drosophila-hydei-turing-wavelength-s0.py, lines: [14, 28], note: "displayed PDE, steady state, k_c, and equal-diffusion failure", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-drosophila-hydei-turing-wavelength-s0.yaml, lines: [1, 40], note: "model_spec parameters and law names", supports: true}
      repro-package:
        value: 86
        rationale: >-
          Seed 3189, dt below the explicit-Euler diffusion bound, --self-test,
          and SHA-256 pins. Python 3.12.3 with numpy 2.5.4, scipy 1.18.1,
          matplotlib 3.11.2, Pillow 13.0.0. No per-script lock file beyond the repo requirements.
        evidence:
          - {file: models/2026-delphi10000-drosophila-hydei-turing-wavelength-s0.py, lines: [734, 782], note: "self_test assertions for trace, det, Pearson, ablation, sweep, wavelength", supports: true}
          - {file: datasets/drosophila_hydei_turing_wavelength_s0/README.md, lines: [1, 40], note: "scale, age, chronoseries table, and the run command", supports: true}
    remediation:
      - "R1: Include oscillatory modes. Mode n=1 has a negative discriminant; fit Re(σ) from the amplitude envelope instead of dropping it."
      - "R2: Emit the specimen-versus-GIF computer-vision score from measure_morphoeval, using the same orientation, radial-FFT, and coherency comparison as verify_image_fitness.py."
      - "R3: Call ks_2samp with method=asymp so the seven-to-eight point goodness-of-fit does not depend on a failed exact permutation."
