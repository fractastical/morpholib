simulations:
  - id: delphi10000-asteroxylon-mackiei-turing-wavelength-s0
    name: "Asteroxylon mackiei Schnakenberg critical wavelength at 5.2 µm (Pass 2)"
    organism: "Asteroxylon mackiei (Early Devonian Rhynie Chert lycopsid)"
    script: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py
    output: docs/media/asteroxylon_mackiei_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [kidston1920, turing1952, schnakenberg1979, hetherington2021, edwards2017, gierer1972]
    supersedes_audit_id: 2026-10-27-asteroxylon-mackiei-turing-wavelength-s0-audit
    summary: >-
      Pass 2 keeps the 5.2 µm, 407 Ma Schnakenberg calibration (δ = 160,
      156 µm × 117 µm window, σ(k_c) = 0.3961, equal-diffusion σ_max = -0.0800).
      Activator contrast α is now the largest value whose Pearson r on the top
      75% of rows stays at or above 0.985. That rule selects α = 0.35.
      Held-out bottom 25% scores r = 0.98639. Full-frame r = 0.98783,
      RMSE = 8.096 gray levels, gray-level KS = 0.161. The leafy-axis envelope
      on the model scale bar is 117 µm, against the 5.2 µm stripe; the spectral
      centroid of the activator is 7.646 µm. The δ sweep remains monotonic.
      Asteroxylon chronoseries is 1/1 at 407 Ma; the 283.4 µm enation sibling
      is 54.5 times longer and is not re-parameterized here.
    claim_boundary:
      reported_in_source:
        - "Kidston & Lang 1920: actinostele and microphyll leaf traces (DOI 10.1017/s0080456800004506)."
        - "Edwards, Kenrick & Dolan 2017: Rhynie Chert, Pragian, used here as 407 Ma."
        - "Turing 1952 critical wavenumber and Schnakenberg 1979 kinetics."
        - "Gierer & Meinhardt 1972: short-range activation and long-range inhibition, the reason δ = 160 is large."
        - "Hetherington et al. 2021: whole-plant reconstruction that this 156 µm window does not replace."
      reconstructed_in_script:
        - "λ_c = 5.2 µm at δ = 160 on a 30-wavelength tracheid-file window."
        - "α selected on the top 75% of rows; Pearson r reported on the bottom 25% (R1)."
        - "Two-sample KS between plate and render gray histograms (R2)."
        - "Axis-envelope wavelength 117 µm under the model scale bar, set beside 5.2 µm (R3)."
        - "Equal-diffusion ablation and the monotonic δ sweep, carried forward from Pass 1."
      transfer_boundary:
        - "117 µm envelope versus 5.2 µm stripe is the quantitative transfer gap. The Kenraiz plate is not a 5.2 µm micrograph."
        - "Metres per pixel equal domain width divided by image height. That is a model scale bar."
      does_not_claim:
        - "Does not claim a measured Asteroxylon pigment period of 5.2 µm in the Rhynie chert."
        - "Does not claim the PDE generates the compression fossil from noise; the plate is the basic-look canvas."
        - "Does not claim the 283 µm sibling's diffusivities."
        - "Does not claim a signed nanopublication. Signing was skipped because ~/.nanopub/profile.yml is absent."
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          Pass 1's Jacobian, quadratic dispersion, and pseudospectral integrator
          are unchanged and still match Schnakenberg at λ_c = 5.2 µm. Pass 2
          does not alter the PDE to chase the plate; it only changes how
          contrast is chosen and how the residual is reported.
        evidence:
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [93, 127], note: "steady-state Jacobian and σ(k)", supports: true}
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [163, 199], note: "Fourier diffusion, explicit reaction", supports: true}
      specimen-match:
        value: 84
        rationale: >-
          The re-rendered last frame still shows the Kenraiz leafy axis. Hold-out
          rows, which did not choose α, correlate at 0.98639, so the match is
          not confined to the rows used to set contrast. The plate remains a
          compression fossil; the 117 µm envelope versus the 5.2 µm stripe is
          why this score is 84 rather than a micrograph overlay.
        evidence:
          - {file: docs/media/asteroxylon_mackiei_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Pass 2 figure with hold-out r and envelope in the caption", supports: true}
          - {file: docs/media/asteroxylon_mackiei_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640×480, last frame is the α=0.35 composite", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          δ still shortens λ_c monotonically at fixed D_u, and the equal-diffusion
          curve is on the figure. α is now the largest contrast that keeps the
          train-row correlation at or above 0.985, which is a one-dimensional
          expressivity rule with a held-out check.
        evidence:
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [138, 161], note: "δ sweep and equal-diffusion control", supports: true}
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [310, 335], note: "α grid on the top 75% of rows", supports: true}
      morphometric-validation:
        value: 90
        rationale: >-
          Full-frame Pearson r = 0.98783 (reference 1), RMSE = 8.096 gray levels
          (reference 0), hold-out r = 0.98639 (reference 1), KS = 0.161
          (reference 0), stripe centroid 7.646 µm (reference 5.2), axis envelope
          117 µm (reference 5.2), control σ_max = -0.080 (reference 0), scale
          ratio 54.5 (reference 50). None of these equal their references.
          Plate foreground, circularity, and coherency are measured on the
          vendored image.
        evidence:
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [284, 335], note: "KS, envelope wavelength, and row hold-out", supports: true}
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [465, 571], note: "measure_morphoeval metrics with unequal references", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Unchanged from Pass 1, plus the Gierer & Meinhardt 1972 DOI for the
          long-range inhibitor. Plate SHA-256 and CC BY-SA attribution remain pinned.
        evidence:
          - {file: datasets/asteroxylon_mackiei_turing_wavelength_s0/paper_citations.bib, lines: [1, 80], note: "bibliography including Gierer & Meinhardt", supports: true}
          - {file: datasets/asteroxylon_mackiei_turing_wavelength_s0/README.md, lines: [1, 30], note: "5.2 µm, 407 Ma, Kenraiz license, run command", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          Pass 2 functions gray_ks, envelope_wavelength_um, and select_alpha_holdout
          are named for R1–R3. Lean theorems are unchanged and still have no sorry.
        evidence:
          - {file: morphoeval/lean/loops/Loop_3124_asteroxylon_mackiei_turing_wavelength_s0.lean, lines: [18, 51], note: "four decide theorems", supports: true}
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [284, 335], note: "remediation functions mapped to R1–R3", supports: true}
      repro-package:
        value: 88
        rationale: >-
          --self-test now also requires hold-out r > 0.98, 0 < KS < 0.5, and
          envelope > 20 µm. The Pass 2 run passed: r = 0.98783, hold-out = 0.98639,
          KS = 0.161, envelope = 117 µm, 12 frames at 640×480. Dataset SHA-256
          pins still match.
        evidence:
          - {file: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py, lines: [573, 609], note: "self-test including hold-out, KS, and envelope", supports: true}
    remediation:
      - id: R1
        item: "Closed in Pass 2. α = 0.35 chosen on the top 75% of rows; bottom 25% Pearson r = 0.98639."
      - id: R2
        item: "Closed in Pass 2. Gray-level KS = 0.161 against reference 0."
      - id: R3
        item: "Closed in Pass 2. Leafy-axis envelope = 117 µm against the 5.2 µm stripe."
