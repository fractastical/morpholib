    claim_boundary:
      reported_in_source:
      - 'Sumper (2002): LCPA/silica liquid-liquid phase separation inside the SDV yields three self-similar hexagonal
        pore tiers (foramen d_1 = 1250 nm / a_1 = 1850 nm; cribrum d_2 = 220 / a_2 = 380 nm; cribrella d_3 = 42
        / a_3 = 75 nm)'
      - 'Lenoci & Camp (2008): a two-stage quenched Cahn-Hilliard model with solidified silica walls reproduces
        nested foramen/cribrum pore hierarchies; linear spinodal dispersion sigma(k) = M k^2 (1 - 3 phi0^2 - eps^2
        k^2)'
      - 'Furukawa (1992): a quench front moving at speed v through a binary mixture produces lamellae perpendicular
        to the front at slow speeds and parallel to the front at fast speeds, with an isotropic limit as v -> infinity'
      - 'Schmid & Volcani (1983): C. wailesii valve morphogenesis proceeds centrifugally from the pattern centre
        with radial costae branching toward the margin'
      reconstructed_in_script:
      - Semi-implicit spectral Cahn-Hilliard solver with exact zero-mode mass conservation, extended with a spatially
        varying bulk term phi^3 - a(x) phi and a zero-mobility frozen mask with total-mass re-projection (L178-L243)
      - Radial quench front a(r,t) = tanh((R0 + v t - r)/w) with lagging solidification front R_s = R - lag lambda_c
        on a disc, conserved thermal noise, margin gradient-tensor anisotropy A, front Peclet number v/(lambda_c
        sigma_max), 5-speed ablation and 3-seed isotropic null (L346-L580)
      - Three-stage single-domain 512^2 quench with per-tier eps from lambda_c inversion at 12.5 nm/px, eroded parent-pore
        chambers with frozen walls, per-tier counts, nested multiplicities, nearest-neighbour pitches and equivalent
        diameters (L587-L724)
      - Pass 2 two-stage hierarchy, dispersion relation, eps sweep, SEM segmentation of 139 foramina / 74 cribrum
        pores, hexatic |psi_6| and 3-tier log-linear scaling (L124-L171, L244-L331, L730-L975)
      transfer_boundary:
      - 'The costae model is validated against its own isotropic null and the sign of A, not against a specimen:
        the vendored SEM shows the valve face at three magnifications and no margin, so no empirical A or rib spacing
        exists in the package'
      - Front speed, solidification lag (1.0 lambda_c), noise amplitude (0.005), front width (2.0) and R0 (8) were
        selected from ~24 exploratory runs to reach the radial regime; the stage durations (290, 160, 100 steps)
        and erosions (0, 3, 1 px) of the 3-stage model were tuned from 4 trial runs for nested-count visibility.
        None of these values is from the cited papers
      - Frozen-silica conservation is global (leaked spectral flux spread uniformly over all mobile pixels), not
        local; the 3-stage cribrella sit at the grid floor (d_3 = 3.4 px target, 3.7 px measured), so their pitch/diameter
        are resolution-biased upward
      - Costae (phi0 = 0 rib layer) and areolae (phi0 = -0.30 droplet layer) are separate simulations; the model
        does not produce both in one domain
      does_not_claim:
      - Quantitative agreement with measured C. wailesii costae spacing or bifurcation count, the exact Furukawa
        crossover speed, cribrum-per-foramen multiplicities of 7-19 (model gives 4.8 at 512^2), SDV chemistry, or
        online verification of the Furukawa (1992) and Schmid & Volcani (1983) DOIs
