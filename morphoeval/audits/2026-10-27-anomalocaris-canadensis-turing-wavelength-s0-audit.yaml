simulations:
  - id: delphi10000-anomalocaris-canadensis-turing-wavelength-s0
    name: "Anomalocaris canadensis Turing wavenumber k_c at 24 µm (508 Ma)"
    organism: "Anomalocaris canadensis"
    script: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py
    output: docs/media/anomalocaris_canadensis_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, gierer1972, paterson2011, daley2014, vanroy2011, lubensky2011]
    summary: >-
      Pass 1 integrates Schnakenberg kinetics on a no-flux corneal patch whose
      continuous k_c is pinned to 2.397e-05 m at 508 Ma, and places that field
      beside the Tyrrell cast TMP 2023.003.0003. The sweep, ablation, specimen
      segmentation, and dispersion goodness-of-fit are not yet accepted as
      closing evidence.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: a homogeneous reacting-diffusing state can be unstable at a finite wavenumber."
        - "Paterson et al. 2011: Emu Bay eyes 2-3 cm, at least 16000 hexagonal lenses, about 515 Ma."
        - "Daley and Edgecombe 2014: Burgess Shale A. canadensis has paired stalked eyes and a triradial oral cone."
        - "Van Roy and Briggs 2011: Fezouata anomalocaridids (488-472 Ma) are larger than Cambrian bodies."
      reconstructed_in_script:
        - "Schnakenberg (a, b) = (0.10, 0.90), Dv/Du = 20, Du set so lambda_c = 8 cells = 2.397e-05 m."
        - "Hexagonal spacing on a 2.5 cm hemisphere with 16000 lenses, about 266 µm. That reconstruction is not a published lens diameter."
      transfer_boundary:
        - "Burgess Shale compressions do not resolve a 24 µm pigment lattice. The cast photograph is organism-scale."
        - "Lubensky et al. 2011 is cited as a non-transfer: the Drosophila R8 lattice is not a Turing instability."
      does_not_claim:
        - "That a, b, Du, Dv were measured in anomalocaridid cornea."
        - "That the Commons length of about 20 cm is a Daley and Edgecombe morphometric."
        - "That Fezouata giants kept this same k_c. Only that a tissue-local wavenumber does not have to grow with body length."
    scores:
      model-fidelity:
        value: 80
        rationale: "The Jacobian, the k_c formula, and the Neumann integrator are the published Turing/Schnakenberg objects. Pass 1 does not yet treat the numerical growth-rate comparison as part of the fidelity score."
        evidence:
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [61, 90], note: "jacobian and turing_margin", supports: true}
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [174, 214], note: "Neumann Laplacian and Schnakenberg update", supports: true}
      specimen-match:
        value: 72
        rationale: "The plate shows the real Tyrrell cast beside the activator. The 24 µm spots are a registration, not a feature a viewer can find in the shale. Pass 1 does not yet score the cast segmentation."
        evidence:
          - {file: docs/media/anomalocaris_canadensis_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "cast, activator, composite, dispersion", supports: true}
          - {file: docs/media/anomalocaris_canadensis_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 720x540 growth gif", supports: true}
      parameter-expressivity:
        value: 58
        rationale: "Du is fixed to the slot length. Pass 1 does not yet accept a sweep in which lambda_c moves monotonically, nor the equal-diffusion ablation, as expressivity evidence."
        evidence:
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [74, 90], note: "nominal Du chosen for an 8-cell wave", supports: true}
      morphometric-validation:
        value: 60
        rationale: "The slot length and the 508 Ma age are explicit. Pass 1 does not yet accept Pearson r, RMSE, KS, or specimen-mask morphometrics."
        evidence:
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [48, 59], note: "LAMBDA_M = 2.397e-05 and AGE_MA = 508", supports: true}
          - {file: datasets/anomalocaris_canadensis_turing_wavelength_s0/anomalocaris_canadensis_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "metrics sidecar from the render", supports: true}
      source-traceability:
        value: 90
        rationale: "Crossref and Europe PMC resolve the seed papers. The cast is SHA-256 pinned with catalogue number, licence, and artist. OpenAlex search returned HTTP 429; the dossier says so."
        evidence:
          - {file: datasets/anomalocaris_canadensis_turing_wavelength_s0/paper_citations.bib, lines: [1, 79], note: "seven DOIs", supports: true}
          - {file: datasets/anomalocaris_canadensis_turing_wavelength_s0/anomalocaris_canadensis_turing_wavelength_s0_reference.json, lines: [1, 40], note: "scale, age, specimen hash", supports: true}
      code-traceability:
        value: 82
        rationale: "The module docstring and the law functions name Turing 1952 and Schnakenberg 1979. Pass 1 does not yet tie the dispersion fitter and the self-test assertions into the score."
        evidence:
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [1, 30], note: "module docstring states scale, age, and BC", supports: true}
      repro-package:
        value: 84
        rationale: "Seed 3113 and --self-test are present. Pass 1 does not yet treat the self-test's sweep, ablation, and Pearson gate as the reproducibility package."
        evidence:
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [567, 610], note: "self_test assertions", supports: true}
    remediation:
      - "R1: Accept a Du diffusivity sweep and show that lambda_c increases monotonically across the stated range."
      - "R2: Accept the equal-diffusion negative control and the linear-reaction ablation, with a pattern-std ratio against the Turing run."
      - "R3: Segment the real Tyrrell cast (foreground fraction, circularity, structure-tensor coherency) and keep those values distinct from their references."
      - "R4: Report goodness-of-fit of the stencil growth rate against the numerical growth rate (Pearson r, RMSE, KS) and require Pearson r > 0.98."
