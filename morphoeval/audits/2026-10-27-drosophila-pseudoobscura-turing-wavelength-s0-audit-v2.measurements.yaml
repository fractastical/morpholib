    claim_boundary:
      reported_in_source:
      - Turing (1952) gives the two-species dispersion relation and the conditions for a diffusion-driven band.
      - Richards et al. (2005) sequenced D. pseudoobscura. They do not report a Turing wavelength.
      - Kopp (2011) reviews sex-comb evolution. The two-segment comb is not a 1.961 µm stripe.
      - The Hanson 2019 Commons file is a lateral photograph of an adult male under CC BY-SA 4.0.
      reconstructed_in_script:
      - Jacobian (0.84, -0.90, 1.55, -1.20) s^-1 and diffusivities D_u = 0.028046, D_v = 0.131825 µm²/s place the
        fastest mode at 1.961 µm.
      - Split-step integration of σ(k) u - γ u³ with γ = σ_max / 0.35², 320 steps, seed 3200. A weak x-axis orientation
        weight is a stand-in for the anterior-posterior axis.
      - 'Chronoseries comparison: Δlog10 λ versus planitibia is -2.003 and versus santomea is +1.717, with Δage
        = 0 Ma. Diffusivity would have to be about 10112 times larger to put this Jacobian on the planitibia rung.'
      transfer_boundary:
      - 1.961e-6 m is the assigned detail rung of this slot, not a published histological period for a D. pseudoobscura
        ocellus.
      - Planitibia and santomea wavelengths are neighbouring MorphoEval primordium rungs, not measurements made
        in this script.
      does_not_claim:
      - That Richards 2005 measured a reaction-diffusion wavelength.
      - That the sex comb or the third-chromosome inversions are produced by this 2 µm mode.
      - That planitibia → pseudoobscura → santomea is a stratigraphic ancestor-descendant series.
      - That spacing RMSE = 0 is an independent empirical discovery. The domain was built so twelve critical wavelengths
        fit exactly, and the saturated stripes lock to that harmonic.
      - That the growth GIF is a time-lapse of embryogenesis.
