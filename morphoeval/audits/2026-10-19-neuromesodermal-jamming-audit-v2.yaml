          L168-186), Bingham viscoplastic strain rate (`compute_bingham_plastic_strain_rate`,
          L189-201), continuous AP crossover profile (`solve_ap_jamming_profile`, L204-303),
          and 2D U-shaped tailbud viscoplastic flow (`simulate_2d_tailbud_jamming_regime`,
          L310-442). Backed by 4 machine-checked Lean 4 theorems (0 sorrys).
        evidence:
