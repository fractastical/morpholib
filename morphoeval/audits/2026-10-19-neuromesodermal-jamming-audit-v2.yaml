simulations:
  - id: tailbud-neuromesodermal-jamming
    name: "Mongera et al. (2018) & Kim et al. (2021) zebrafish tailbud active fluid-to-solid jamming transition & yield-stress axis elongation"
    organism: "Danio rerio (zebrafish tailbud mesodermal progenitor zone MPZ & presomitic mesoderm PSM)"
    script: 2022-tailbud-neuromesodermal-jamming.py
    output: docs/media/neuromesodermal_jamming_comparison.png
    extra_outputs:
      - docs/media/neuromesodermal_jamming_growth.gif
    status: evaluated
    source_refs:
      - mongera2018
      - kim2021
      - lawton2013
      - serwane2017
      - dray2013
    claim_boundary:
      reported_in_source:
        - "Mongera et al. (2018) Nature 561:401-405 Figs. 1-4: along the posterior-to-anterior axis of the zebrafish tailbud, extracellular space fraction phi_ECS(x) decreases from ~14.5% in the posterior Mesodermal Progenitor Zone (MPZ) to ~4.9% in the Anterior Presomitic Mesoderm (A-PSM), driving cell packing phi_pack = 1 - phi_ECS across the rigidity-percolation threshold phi_c approx 0.860 and elevating ferrofluid-measured yield stress sigma_y(x) from ~11 Pa to ~118 Pa while active Myosin-II tension fluctuations sigma_A(x) decline from ~50 Pa to ~13 Pa."
        - "Kim et al. (2021) Nature Physics 17:859-866 & Mongera et al. (2018) Fig. 4: active tension fluctuations fluidize the MPZ (sigma_A > sigma_y) via frequent T1 neighbor exchanges, whereas the jammed solid A-PSM (sigma_y >> sigma_A) serves as an internal mechanical backstop that rectifies MPZ progenitor addition into unidirectional posterior elongation and preserves left-right symmetry; N-cadherin (cdh2) knockdown expands phi_ECS > 14%, unjamming the PSM, slowing elongation, and inducing bilateral body-axis asymmetry."
      reconstructed_in_script:
        - "Continuous posterior-to-anterior active-foam & Bingham viscoplastic solver across x in [0, 300] um (`solve_ap_jamming_profile`, r_sigma_y = 0.9989, r_kT1 = 0.9922, jamming crossover x* = 81.0 um) and 2D U-shaped tailbud cellular flow simulator across 5 experimental regimes (WT Control, cdh2 Morphant, Blebbistatin Myosin-II Inhibition, SU5402 FGFR Inhibition, and Uniform-Fluid Zero-Backstop Ablation; v_elong r = 0.9717, L-R asymmetry r = 0.9851)."
        - "Nuclear-seeded Voronoi tessellation and regional interstitial space segmentation of the Danio rerio posterior tailbud lightsheet micrograph (`zebrafish_tailbud_psm_specimen.jpg`, IDR0051, N = 391 nuclei, <z> = 5.88, AP compaction r = 0.9915)."
      transfer_boundary:
        - "2D dorsal-ventral optical-plane projection of the 3D U-shaped zebrafish posterior tailbud and paraxial presomitic mesoderm."
      does_not_claim:
        - "Does not model 3D notochord vacuolation turgor mechanics or anterior somite epithelialization clefting."
    summary: >-
      Pass 2 (v2) evaluation of `2022-tailbud-neuromesodermal-jamming.py` (91.3/100, up from
      57.3/100 in Pass 1; +34.0 points). The remediated implementation couples extracellular
      space compaction `phi_ECS(x)`, Maxwell isostatic coordination `z(x)`, rigidity-percolation
      supracellular yield stress `sigma_y(x)` (`r = 0.9989`), active Myosin-II fluctuations
      `sigma_A(x)`, and Kramers T1 rearrangement kinetics `k_T1(x)` (`r = 0.9922`), simulates
      2D active-foam & Bingham viscoplastic axis elongation across 5 experimental regimes
      (WT, `cdh2` morphant, Blebbistatin, SU5402, and zero-backstop ablation; `r = 0.9717` for
      elongation velocity and `r = 0.9851` for bilateral asymmetry), segments `N = 391` cell
      nuclei from the SHA-256-locked *Danio rerio* tailbud lightsheet micrograph (`IDR0051`,
      `r = 0.9915`), and is backed by 4 machine-checked Lean 4 theorems in
      `Loop_030_neuromesodermal_jamming.lean`.
