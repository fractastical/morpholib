    claim_boundary:
      reported_in_source:
      - Turing 1952 selects a finite wavenumber when inhibitor diffusion sufficiently exceeds activator diffusion.
      - Schnakenberg 1979 supplies the mass-action kinetics used here.
      - Sumper 2002 and Lenoci & Camp 2008 relate diatom nanopatterns to polyamine phase separation in the silica
        deposition vesicle.
      - Yendo & Akatsuka 1910 observed living A. ehrenbergii, fixing this chronoseries at Holocene, 0 Ma.
      reconstructed_in_script:
      - a=0.062, b=1.35, D_v/D_u=31.18 lock the linear carrier at 242 nm. Pass 2 sweeps the ratio, simulates the
        equal-diffusion collapse, segments both images, and reports Pearson, RMSE and KS.
      - The GIF last frame uses gallery-envelope weight 0.55. The unguided three-ocellus field is retained and its
        spatial correlation (0.071) is reported separately.
      transfer_boundary:
      - 242 nm is the assigned detail scale, not a published A. ehrenbergii pore measurement. The gallery frame
        is a 100 μm stylized image. The Wikimedia file is Arachnoidiscus sp.
      - Radial Pearson 0.986 is between the gallery and the envelope-mixed frame, not between the gallery and the
        unguided activator.
      does_not_claim:
      - Pixel-level prediction of the gallery spiral, a species-level identification of the Wikimedia valve, or
        equality of the 284.76 nm nonlinear spacing with the 242 nm linear carrier.
