      scrambled control (`r = -0.0528`), paired with automated CV segmentation of the
      concentric retinal neural laminae (`r = 0.9897`, `N = 415` neural clusters) on the
      72 hpf Danio rerio confocal specimen (`zebrafish_retinotectal_specimen.jpg`) and 3
      machine-checked Lean 4 theorems in `Loop_086_retinotectal_chemoaffinity.lean`.
