        - "Brown et al. (2000) Cell 102:77-88 Isl2-EphA3 knock-in experiments showing relative EphA signaling bifurcates the retinocollicular projection into two non-overlapping maps in ki/ki homozygotes and a rostral-convergent split map in ki/+ heterozygotes"
