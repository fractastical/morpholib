    summary: >-
      Pass 2 post-remediation evaluation of `1976-willshaw-retinotectal-chemoaffinity.py`
      (92.4/100, up from 57.3/100 in Pass 1; +35.1 overall). The remediated script solves
      the 2D retinotectal synaptic weight matrix W_ij(t) ODE with Prestige-Willshaw Group II
