      map duplication (`Delta_y = 0.5122`), Isl2-EphA3/+ heterozygous `ki/+` partial
      bifurcation (`Delta_y = 0.2785`), Prestige & Willshaw (1975) Group II caudal
      half-tectum compression (`slope = -0.4947` vs Group I nasal pileup), temporal
