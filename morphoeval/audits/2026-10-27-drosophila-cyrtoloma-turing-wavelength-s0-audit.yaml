          - {file: datasets/drosophila_cyrtoloma_turing_wavelength_s0/drosophila_cyrtoloma_turing_wavelength_s0_reference.json, lines: [7, 22], note: "4.315e-6 m, 0 Ma, predecessor buzzatii", supports: true}
      parameter-expressivity:
        value: 72
        rationale: "The σ sweep at γt = 0.55 moves the analytic wavelength but the simulated transect does not follow it (r = 0.906). Species diffusivities are coded and not yet the scored comparison."
        evidence:
