        - "That buzzatii is a cladistic ancestor or deflecta a descendant"
        - "That DOI 10.11646/zootaxa.2400.1.1 is about Drosophila cyrtoloma"
    summary: >
      Pass 1 integrates the diffusivity sweep only to γt = 0.55. The activator
      has not selected a wavelength, and Pearson r against the linear λ(σ) is
      0.906. The equal-diffusion control, Otsu segmentation, spacing CV/KS,
      and the domain-length count are specified as remediation and scored in v2.
    scores:
      model-fidelity:
        value: 82
        rationale: "Schnakenberg kinetics and the Turing dispersion formula are implemented (trace < 0, det > 0, k_c). Pass 1 does not yet separate the linear wavelength (3.70 µm on the calibrated grid) from the 4.315 µm nonlinear calibration in the scored fit."
        evidence:
          - {file: models/2026-delphi10000-drosophila-cyrtoloma-turing-wavelength-s0.py, lines: [95, 133], note: "linear_dispersion implements k_c^2 = h/(2 Du Dv)", supports: true}
          - {file: models/2026-delphi10000-drosophila-cyrtoloma-turing-wavelength-s0.py, lines: [147, 197], note: "explicit Schnakenberg update", supports: true}
          - {file: morphoeval/lean/loops/Loop_3180_drosophila_cyrtoloma_turing_wavelength_s0.lean, lines: [50, 55], note: "dispersion threshold witness at Dv/Du = 18", supports: true}
      specimen-match:
        value: 74
        rationale: "The GIF is 640×480 and 12 frames and the plate is pinned, but Pass 1 has not yet scored Otsu circularity or structure-tensor coherency of the plate against the last frame. The plate is the project gallery spiral, not a pinned adult."
        evidence:
