    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion conditions and critical wavenumber k_c"
        - "Schnakenberg 1979 two-species kinetics"
        - "Edwards et al. 2007 Hawaiian picture-wing diversity"
        - "Loeschcke, Bundgaard and Barker 1999 buzzatii wing and thorax size reaction norms"
      reconstructed_in_script:
        - "4.315 µm assignment for the cyrtoloma melanin carrier"
        - "7.84 µm buzzatii and 6.05 µm deflecta chronoseries hypotheses"
      transfer_boundary:
        - "Gallery spiral plate is a long-wave prepattern, not a measured cuticle micrograph"
      does_not_claim:
