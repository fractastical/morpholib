    claim_boundary:
      reported_in_source:
      - 'Tozluoglu et al. (2019): planar differential growth rates in the third-instar wing disc, together with
        the basal ECM, position the H/N, H/H and H/P folds precisely; uniform growth gives unpinned buckling; Collagenase
        flattens the dome and abolishes folds'
      - 'Sui et al. (2018): differential lateral and basal tension drive H/H vs H/P folding by two distinct mechanisms'
      - 'McClure & Schubiger (2005): the peripodial epithelium is a thin squamous layer overlying the columnar disc
        proper (used only for h_PE ~ 3 um; DOI not verified offline)'
      - 'Mosaliganti et al. (2019): epithelial lumen pressures of ~100-300 Pa in the zebrafish otic vesicle (order-of-magnitude
        context only; NOT wing-disc data; DOI not verified offline)'
      reconstructed_in_script:
      - 'L-BFGS-B 2D sagittal apico-basal bilayer with multiplicative growth stretch, stiff BM tether and local
        fold remodeling (Pass 2); Pass 3 adds a quasi-1D plane-strain sac: neo-Hookean BM shell tension, shallow-cap
        Laplace dome deflection, tensioned PE membrane in unilateral contact, lumen pressure closed by prescribed
        volume (bisection) or imposed, an imposed-pressure sweep, a PE-ablation control, 13 measurements and 10
        self-test checks'
      transfer_boundary:
      - The bilayer 'relaxed' surface is tethered to a hand-built target shape (dome envelope, stage scaling and
        Gaussian cleft depths fitted to the reference table), so the 64-96 h dome and fold-depth correlations largely
        reproduce the prescription rather than emerge from g(s)
      - T_PE = 1 mN/m, h_lumen = 12 um, h_margin = 8 um and T_cell = 0.5 mN/m are order-of-magnitude assumptions
        with no wing-disc measurement; the self-consistent p = 0.62 Pa and p_half = 372.5 Pa are model predictions
        with no published value to compare
      does_not_claim:
      - A 3D finite-element mesh, dorsoventral curvature, PE growth or PE fold mechanics, a measured wing-disc lumen
        pressure, or an emergent (untethered) fold pattern
