# MorphoEval audit — Douady & Couder (1992, 1996) Self-Organized Magnetic-Drop Phyllotaxis, 2026-10-20 (v3)
#
# Pass 3 remediation re-score of `1992-douady-magnetic-drop-phyllotaxis.py` (Slot 031) in the instrumented loop
# `morphoeval/runs/2026-10-19-magnetic-drop-phyllotaxis-loop-pass3`, superseding
# `2026-10-19-magnetic-drop-phyllotaxis-audit-v2` (91.2). The v2 audit listed no `supports: false` evidence and
# no remediation items, so Pass 3 derived its targets from the weakest two v2 dimensions (specimen-match 88,
# parameter-expressivity 90) and from a line-by-line re-read of the v2 script, which exposed defects that the v2
# audit had credited as strengths:
#   1. The (1,1)->(1,2) bifurcation was IMPOSED, not emergent: `if G >= 0.85901889: ... 180.0` short-circuits at
#      v2 L337, L561 and L583, and the Hessian `curv_180` computed at L336 was discarded.
#   2. The displayed/triangulated geometry used a clipped visual growth rate `g_vis = clip(G, 0.012, 0.12)`
#      (v2 L516-518), which mislabelled the Delaunay pair at G = 0.30 as (3,5) (visible in the v2 PNG, panel B2
#      title "Fibonacci (2,3) ... Delaunay=(3, 5)") and at G = 0.5 as (5,8); the Row B dish panels showed only
#      the outer few drops (B1 collapsed to a line, B2/B4 spanned +/-4000 and +/-20000 R_0).
#   3. The Delaunay edge-census extractor is biased to the higher Fibonacci pair near the van Iterson
#      transitions (G = 0.25, 0.10, 0.04 and Lucas G = 0.11) relative to Douady & Couder's nearest-neighbour
#      contact definition.
#   4. Two measurement names misdescribed their content (`pitchfork_threshold_G_c1_*` held the static fold
#      G_fold = 0.773484, not G_c1 = 0.859019; `lucas_branch_divergence_angle_G006` was evaluated at G = 0.11
#      against the asymptote 99.50 while the table row at G = 0.10 reads 101.43), the Voronoi CV carried an
#      unsourced reference 0.14 while the v2 rationale quoted CV = 0.132 against a measured 0.0013, and the
#      N = 123 "scales" are DoG detections (about 2 per scale; lattice-consistent count ~48).
#   5. The vendored reference JSON itself carries the G_c1 / G_fold mislabel in its key names.
# What Pass 3 changed (all in this slot's files):
#   - emergent threshold by bisection on the unclamped iterated map (0.8595 vs analytic 0.859019), dynamical
#     discriminant S_dyn(G) used for the 180-deg branch of the equilibrium diagram, Lean 4 Theorem 4;
#   - true radii r_k = exp(kG) triangulated, nearest-neighbour contact pair as primary extractor (Delaunay kept as
#     secondary), log-radial display rho = 1 + ln(r/R_0) = 1 + kG (= the PRL 1992 dish geometry) in Row B & GIF;
#   - memory-depth sweep N_mem in {1..45}, --n-mem CLI, comparison with the 6 dish regimes of the reference table;
#   - specimen reciprocal-lattice inversion (alpha_emp = 138.03 deg, G_emp = 0.0308, chirality -1) from the
#     sub-bin (5,8) log-polar FFT peaks, validated on a synthetic image of the simulated lattice (0.014 deg,
#     0.06 % error), Lean 4 Theorem 5 window; disclosed negative result for radius-ranked detections (R = 0.137);
#   - 18 measurements (10 -> 18) with provenance-tagged references, 14 self-test checks (8 -> 14), 16 panels.
# Scores below are the primary assessor's and are uncalibrated criterion-referenced ratings on 0-100 (not
# probabilities). Line numbers refer to the files in the working tree at commit d58a084 (uncommitted Pass 3 edits).
# Overall 90.2, DOWN from 91.2: the model, specimen analysis and validation suite are stronger than in v2, but the
# re-read showed that v2's 93 / 94 for model-fidelity / source-traceability rested on imposed thresholds and a
# mislabelled reference table, and Pass 3 scores what the evidence now supports.

