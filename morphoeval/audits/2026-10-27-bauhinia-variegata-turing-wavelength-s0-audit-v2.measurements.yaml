    claim_boundary:
      reported_in_source:
      - Turing (1952) gives k_c and the requirement that the inhibitor diffuse faster. Schnakenberg (1979) gives
        the kinetics. Maini, Painter & Chau (1997) and Kondo & Miura (2010) review spatial wavelength selection.
      - Armon et al. (2011) is the centimetre-scale shell law for this species. Along 1 cm the 69.12 µm mode repeats
        144 times and a 145th does not fit. Both are present at 0 Ma. This chronoseries has no earlier point.
      reconstructed_in_script:
      - D_u = 44.827 µm²/time and D_v = 16.9 D_u place the linear wavelength at 69.12 µm. A pure-mode integration
        gives sigma = 0.193 against the analytic 0.188. The saturated radial peak is 76.16 µm.
      - The adult frame is the MHNT photograph with a 42 percent blend of the activator in a corner inset. Full-frame
        Pearson r = 0.9935, valve RMSE = 2.42 gray levels, valve KS = 0.035.
      transfer_boundary:
      - The silhouette, seeds, and 1 cm bar are measured on the scan. The PDE does not grow the legume. The scan
        cannot show a 0.26 px wavelength, so the cellular field is the inset, not a texture painted across the valve
        at the wrong scale.
      does_not_claim:
      - Does not claim Bauhinia pericarp was measured at 69.12 µm in any cited paper.
      - Does not claim the 10 percent nonlinear shift (76.16 versus 69.12 µm) has been removed.
      - Does not claim the full-frame KS of 0.745 is a valve mismatch. It is the GIF palette moving the paper white.
      - Does not claim a second assessor or a signed nanopublication. No ~/.nanopub/profile.yml is present.
