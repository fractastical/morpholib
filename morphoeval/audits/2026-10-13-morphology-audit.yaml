# MorphoEval audit — morphology simulations, 2026-10-13.
#
# Source data for morphoeval/build_morphoeval_kg.py.  Every score is backed by
# at least one `evidence` locus (file + lines) that was inspected in this audit;
# scripts that were NOT inspected are listed with status: unevaluated and carry
# no scores (the rubric forbids invented gaps or invented credit).
#
# Scores are on the rubric's 0-100 scale.  Line numbers refer to the files at
# the checkpoint commit recorded below.

audit:
  id: 2026-10-13-morphology-audit
  rubric_version: 0.1.0
  date: "2026-10-13"
  # ProbKnow attribution.  The scores were produced by a language-model agent,
  # so they are emitted as pk:LLMClaimAssessment assessed by this pk:Model; the
  # human publisher (ORCID, read from ~/.nanopub/profile.yml unless given here)
  # is dct:creator of the nanopubs and the agent prov:actedOnBehalfOf them.
  assessor:
    id: claude-fable-5-1
    label: "Claude Fable 5.1 (Cursor agent)"
    homepage: https://www.anthropic.com
  publisher_orcid: null          # null -> read orcid_id from ~/.nanopub/profile.yml
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  # Creator of the CODE under assessment (distinct from the assessor and from
  # the nanopub publisher).  Every audited script is a schema:SoftwareSourceCode
  # entity with dct:creator = these people.  Per-simulation override:
  # `code_creators:` / `code_contributors:` (ids below or pkr:model ids).
  code_creators:
    - id: joel-dietz
      name: "Joel Dietz"
      orcid: null                # null -> same as publisher_orcid
      github: https://github.com/fractastical
  # code_license: <url>          # repo has no LICENSE file yet; add one and set this
  domain: morphogenesis          # default pkr:domain/<slug>; override per simulation
  tracked_by: https://github.com/fractastical/morpholib/issues/1
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: f3fe478          # first commit containing all audited scripts
    environment:
      python: "3.14.7"
      numpy: "2.5.4"
      scipy: "1.16.3"
      scikit-image: "0.26.0"
    note: >-
      numpy was upgraded 2.2.6 -> 2.5.4 during this audit after 2.2.6 on
      Python 3.14 was found to silently corrupt large boolean-array results
      (wing mask collapsed from 1,905,316 px to 25,146 px, deterministically).

