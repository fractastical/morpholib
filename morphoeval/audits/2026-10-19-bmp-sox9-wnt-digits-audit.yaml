# MorphoEval audit — Raspopovic et al. (2014) Science Bmp-Sox9-Wnt 3-Node Turing Digit Network, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2014-raspopovic-bmp-sox9-wnt-digits.py` (297 lines)
# prior to Step 12 remediation in `2026-10-19-bmp-sox9-wnt-digits-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.8 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `simulate_1d_distal_arc` (L91-145) integrates only a 1D arc with explicit finite
#      differences and lacks a 2D fan-shaped embryonic autopod reaction-diffusion PDE
#      with distal AER-FGF + Hoxd gradient modulation preventing radial digit bifurcation
#      (Raspopovic et al. 2014 Fig. 4A-D) and lacks the zero-diffusion (D_B=D_W=0) negative control.
#   2. Evaluates only the wild-type pentadactyl condition and omits the pharmacological
#      and genetic perturbation experiments of Raspopovic et al. (2014) Figs. 2F-G & 3A-F
#      (LDN-193189 BMP receptor inhibition, CHIR99021 Wnt activation, IWP-2 Wnt secretion
#      inhibition, and Hox/Tbx2 short-wavelength polydactyly).
#   3. The vendored biological specimen `datasets/bmp_sox9_wnt_digits/sox9_limb_digits_specimen.jpg`
#      (E12.5 Sox9 & E13.5 Col2a1 WISH mouse limb buds) is never loaded, segmented, or
#      compared in `bmp_sox9_wnt_digits_comparison.png`.
#   4. Runtime SHA-256 verification of the 4 files in `datasets/bmp_sox9_wnt_digits/` and
#      CLI parameter overrides (`--k-bs`, `--k-sb`, `--k-sw`, `--D-ratio`, `--fgf-scale`, `--seed`)
#      are missing.

