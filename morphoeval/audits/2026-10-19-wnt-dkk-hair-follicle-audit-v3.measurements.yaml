    claim_boundary:
      reported_in_source:
      - 'Sick et al. (2006): WNT (short-range activator) and DKK (long-range inhibitor) form a Turing/Meinhardt
        reaction-diffusion pair that sets pelage follicle spacing; K14-Dkk1 overexpression reduces/abolishes follicles,
        altered WNT/DKK balance enlarges or crowds placodes, and a secondary follicle wave inserts between primary
        follicles as the skin grows'
      - 'Andl et al. (2002): ectopic Dkk1 blocks follicle initiation (no placodes)'
      - 'Huh et al. (2013): placode-derived FGF20 is required for primary and secondary dermal condensates; Fgf20-null
        placodes form but do not progress'
      - 'Glover et al. (2017): dermal cells aggregate directly beneath placodes by directed migration toward placode
        FGF20'
      - 'Botchkarev et al. (1999), Mou et al. (2006): BMP4 inhibits follicle induction / dermal condensation; Noggin/EDA
        antagonise it'
      - 'Paus et al. (1999): ordinal morphological stages placode -> hair germ (with DC) -> hair peg'
      reconstructed_in_script:
      - Saturating Gierer-Meinhardt WNT/DKK PDE with exact steady state, Jacobian and d_c = (sqrt2+1)^2; 1D primary
        wave -> 2x expansion -> secondary insertion (4 -> 8); 2D WT / K14-Wnt / enlarged / Dkk1 / equal-diffusion
        regimes; Dkk1 dosage and domain-length sweeps; optical-density segmentation of the vendored specimen
      - '(Pass 3) 3D dermal slab beneath the WT placode field: FGF20 sourced at z = 0 by the placodes, BMP4 produced
        by the dermis, Keller-Segel chemotaxis with volume filling in conservative face-flux form, per-placode hair-peg
        depth ODE, WT / Fgf20-null / chemotaxis-null / BMP4-excess genotypes, chi_f sweep, dermal linear stability,
        seam-aware placode counting'
      transfer_boundary:
      - All parameters are dimensionless and chosen to produce the qualitative regimes; none of D_w, D_h, mu, rho,
        kappa, D_f, mu_f, chi_f, chi_b, D_rho, v_peg is traced to a measured value or to Sick et al.'s SOM parameter
        table
      - The vendored specimen is a Gad1 whole-mount in situ of E12.5-E13.5 vibrissa/hair placodes (Maddox & Condie
        2004), not a pelage pattern from Sick et al.; the PDE lattice (15 placodes, NN-spacing CV 0.086) and the
        specimen (16 segmented placodes, CV 0.323) agree in count only approximately and disagree in regularity
      - The K14-Wnt regime changes D_w, D_h and kappa together with rho_w, so it is a 'denser lattice' preset rather
        than a pure WNT-overexpression perturbation
      - The dermal coupling is one-way (placodes -> dermis); the epidermis stays planar and peg downgrowth is a
        scalar depth per placode; stage thresholds 25%/50% of slab depth are a model convention
      does_not_claim:
      - A deforming epithelial interface or tissue mechanics of invagination, DC -> epidermis feedback (DC-derived
        Noggin/FGF), follicle-type specification by DC size, calibration of slab depth or peg depth to micrometres,
        or numerical parity with Sick et al.'s own simulation parameters
