    summary: >-
      Pass 3 (v3) post-remediation evaluation of `1979-newman-limb-chondrogenesis-turing.py`
      (overall weighted score: 93.8 / 100 (93.85 unrounded), up +1.5 from 92.3 / 100 in Pass 2). The single Pass 2
      remediation item is closed in a reduced, explicitly scoped form: Section 4b adds a 3D
      moving-boundary wing bud whose proximodistal axis is a Lagrangian P1 finite-element mesh
      advected by FGF8-graded Hill-2 proliferation beneath the AER (dilution, h-refinement,
      moving distal boundary), with DCT-II/DST-II spectral Galerkin anteroposterior/dorsoventral
      cross-sections, a one-parameter hyaluronidase clock fitted to Newman & Frisch Table 1
      (tau_H = 37.0 h, max |rel err| 4.6 %), three FGF8 zones (apical refractory / active
      progress zone / frozen record), active-zone Turing kinetics from the paper's 3D Helmholtz
      relation using the lowest eigenvalue of the actual discrete PD operator, and AER-excision
      and parameter sweeps. The intact run deposits a 3D skeletal record of [1, 2, 3] elements
      (DV core-mode purity 0.99, record AP spacing ratio 1.484 vs 1.5 theory / 1.407 specimen),
      reproduces L_PD(24 h) = 250.2 um (Table 1: 250) and L_PD(48 h) = 128.6 um (Table 1: 140),
      and the Summerbell (1974) excision-time series 1/1/3/3/3/6 elements for t_exc =
      0/8/16/24/32/40 h. Six Lean 4 theorems (3 new) are machine-checked with 0 sorrys. The
      remediation also exposed that the element count is set by the clock rather than by growth
      (S_max = 0 still gives [1, 2, 3]), that the Table 1 mode map and the joint reset remain
      imposed, and that the cross-section is a spectral box rather than a FEM paddle; these are
      carried as Pass 4 items and model-fidelity is held flat rather than raised.
    scores:
      model-fidelity:
        value: 94
        rationale: >-
          Retains the exact Newman & Frisch (1979) Eqs. (1)-(7) dispersion relation
          (`compute_newman_dispersion`, L161-271) and the 1D/2D nonlinear DCT-II IMEX solvers
          (L274-468). Pass 3 adds the requested 3D moving boundary (L847-1152): Lagrangian P1
          FEM in z with advection a(z) = int S dz, dilution and bisection refinement
          (L1045-1108), a moving distal boundary, DST-II Dirichlet dorsal/ventral ectoderm
          (L898), active-zone kinetics with k_PD^2 from the actual discrete PD operator
          (L668-692) and fu chosen by bisection so the fastest linear mode is exactly
          m^2 + k_DV^2 + k_PD^2 (L695-770), plus three new Lean theorems (Helmholtz budget,
          FGF8 window depth, Hill-2 monotonicity). It is held at 94 rather than raised because
          the remediation exposed structural limits: (i) pattern selection is not
          growth-sensitive — the S_max = 0 sweep run (zero outgrowth) still yields [1, 2, 3]
          (L1204-1209), so the moving boundary sets element lengths only; (ii) the Table 1
          map m(L_PD) (L186-191) is still an empirical input and the m-increment
          joint/interzone is an imposed field reset (L1006-1012); (iii) the AP/DV
          cross-section is spectral on a box (header L567-600), not a FEM mesh of the
          paddle-shaped bud; (iv) post-excision kinetics are held by rule (L991-997).
        evidence:
          - {file: 1979-newman-limb-chondrogenesis-turing.py, lines: [847, 1152], note: "3D moving-boundary solver: Lagrangian P1 FEM in z (advection, dilution, bisection), DCT-II/DST-II spectral x/y, three FGF8 zones, deposition of the record at the advancing front, block-Thomas implicit step", supports: true}
          - {file: 1979-newman-limb-chondrogenesis-turing.py, lines: [668, 770], note: "k_PD^2 from the lowest eigenvalue of the discrete active-zone PD operator (Dirichlet ghosts) and fu by bisection to the Helmholtz target q* = m^2 + k_DV^2 + k_PD^2", supports: true}
          - {file: morphoeval/lean/loops/Loop_012_limb_chondrogenesis_turing.lean, lines: [114, 214], note: "Pass 3 Lean Laws 4-6 (Helmholtz AP mode budget, FGF8 window depth independent of AER output, Hill-2 strict monotonicity), 0 sorrys, `lean` exits 0", supports: true}
          - {file: 1979-newman-limb-chondrogenesis-turing.py, lines: [186, 191], note: "Table 1 mode map m(L_PD) thresholds 375/190/125 um remain an empirical input to the kinetics (not derived from hyaluronate -> D_eff)", supports: false}
          - {file: 1979-newman-limb-chondrogenesis-turing.py, lines: [1006, 1012], note: "Joint/interzone on m increment is an imposed reset of the active + apical field to noise (documented, not emergent)", supports: false}
          - {file: 1979-newman-limb-chondrogenesis-turing.py, lines: [1204, 1209], note: "S_max sweep: S = 0 (no outgrowth) still produces [1, 2, 3] — element count is clock-set, growth-insensitive", supports: false}
      specimen-match:
