# MorphoEval audit — Newman & Frisch (1979) Science Dynamics of Skeletal Pattern Formation in Developing Chick Limb, 2026-10-19 (v3)
#
# Pass 3 (remediation round) re-score of `1979-newman-limb-chondrogenesis-turing.py` (v3, 1982 lines) after closing the
# single Pass 2 remediation item ("couple the 2D proximodistal chick wing bud Turing solver to a 3D moving-boundary
# finite-element mesh driven by spatially graded FGF8 mitogenic proliferation beneath the AER") in the instrumented loop
# `morphoeval/runs/2026-10-19-limb-chondrogenesis-turing-loop-pass3`, superseding `2026-10-19-limb-chondrogenesis-turing-audit-v2` (92.3).
#
# What Pass 3 changed:
#   1. New Section 4b (L562-1217): `integrate_newman_3d_moving_boundary_pde` — 3D box [0,L_AP]x[0,L_DV]x[0,L(t)] whose distal
#      boundary advances at the FGF8-driven outgrowth velocity. PD axis = Lagrangian P1 finite elements (nodes advected with
#      a(z) = int S dz, lumped mass, dilution -S u, h-refinement by bisection, L1045-1100); AP = DCT-II (Neumann), DV = DST-II
#      (Dirichlet ectodermal inhibition) spectral Galerkin; fully implicit coupled step via block-Thomas 2x2 (L773-794) + exact
#      cubic substep. FGF8 F = F_AER exp(-(L-z)/lambda_F(t)), Hill-2 proliferation S(F) (L797-803), hyaluronidase clock
#      lambda_F(t) = lambda_0 exp(-t/tau_H) fitted to Table 1 (tau_H = 37.0 h, max |rel err| 4.6 %, L639-665). Three zones
#      (apical refractory / active progress zone / frozen record); the active-zone kinetics use the paper's 3D Helmholtz
#      relation with k_PD^2 = lowest eigenvalue of the ACTUAL discrete PD operator (L668-692) and fu from bisection (L695-770).
#      Output: 3D record [1, 2, 3] (6 elements, DV core purity 0.99), L_PD(24 h) = 250.2 um, L_PD(48 h) = 128.6 um,
#      Summerbell (1974) excision-time series t_exc = 0/8/16/24/32/40 h -> 1/1/3/3/3/6 elements, S_max and lambda_F0 sweeps.
#   2. Lean Laws 4-6 (`newman_helmholtz_3d_mode_bound`, `fgf8_progress_zone_depth_independent_of_aer_output`,
#      `fgf8_hill_proliferation_monotone`), 0 sorrys; `fgf8_moving_boundary_reference.json` (SHA-256 pinned, sourced constants
#      separated from model assumptions); 9 new DOIs in paper_citations.bib; Panels I-L + 7 GIF frames; 6 new measurements
#      (8 -> 14); 6 new self-test checks (8 -> 14); 5 new CLI flags.
#   3. What the remediation EXPOSED (not fixed, carried to Pass 4): (a) the element count is set by the hyaluronidase clock,
#      not by growth — the S_max = 0 run (zero outgrowth) still yields [1, 2, 3] (L1204-1209), so the moving boundary changes
#      element LENGTHS but pattern selection is not growth-sensitive; (b) the Table 1 map m(L_PD) (L186-191) is still an
#      empirical input and the m-increment joint/interzone event is an imposed field reset (L1006-1012); (c) the AP/DV
#      cross-section is spectral on a box, not a FEM mesh of the paddle-shaped bud (header L567-600); (d) after excision the
#      kinetics are held by rule (L991-997) rather than by an explicit distal cell-death zone.
#
# Net effect: the item is closed in a reduced, honestly scoped form; model-fidelity is held flat (3D moving boundary and
# operator-consistent kinetics gained; growth/pattern decoupling and imposed joints exposed), the other six dimensions move
# up modestly. Overall 93.8 (93.85 unrounded; v2 92.3). Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale.
# Line numbers refer to the working-tree files at checkpoint commit d58a084 (the prompt's 469bf3c had advanced by the time
# of this audit). Note: the Newman & Frisch DOI is 10.1126/science.462174 (verified; 10.1126/science.472739 is a different paper).

