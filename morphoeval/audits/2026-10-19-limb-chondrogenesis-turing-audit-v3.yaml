    remediation:
      - "Make proximodistal mode selection growth-sensitive: derive the Table 1 map m(L_PD) (L186-191) and the active-zone fu (L695-770) from a hyaluronate density field (Toole 1972) advected and diluted on the same Lagrangian mesh instead of thresholds on L_PD, so that the S_max = 0 run (L1204-1209) no longer yields [1, 2, 3] with zero outgrowth."
      - "Replace the imposed joint/interzone reset on m increment (L1006-1012) with an emergent interzone: e.g. a Gdf5/Wnt9a-type inhibitor released where the deposited record saturates, or the mechanical clefting of Loop 018, and verify that the 1 -> 2 -> 3 compartments still separate."
      - "Replace the DCT-II/DST-II spectral box cross-section (L898-907, header L567-600) with an unstructured 3D P1 finite-element mesh on a paddle-shaped bud outline with anteroposterior widening (Zhu et al. 2010 geometries), keeping the moving distal boundary."
      - "Replace the post-excision kinetics-hold rule (L991-997) with an explicit distal cell-death zone (Rowe & Fallon 1982, ~200 um) and FGF8 bead rescue (Niswander et al. 1993) so the Summerbell (1974) series and partial rescue are predicted rather than rule-driven."
      - "Reduce the L_PD(48 h) residual (128.6 vs 140 um, L639-665) by fitting the hyaluronidase clock to a dense Summerbell (1976) elongation series rather than three Table 1 points, and report the fit's confidence interval in measurement 10."
