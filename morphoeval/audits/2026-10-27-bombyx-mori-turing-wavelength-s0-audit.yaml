# Pass 1 — Bombyx mori Turing wavelength, slot 3134, 41 µm, 0 Ma.
# Overall weighted score is computed by the rubric (expected ~82.5).
# The scale-bar helper returns micrometres per pixel while the fitter treats it
# as pixels per micrometre, so the 41 µm carrier is misplaced and the reported
# ring pitch is inflated. That is the main Pass-1 gap.
