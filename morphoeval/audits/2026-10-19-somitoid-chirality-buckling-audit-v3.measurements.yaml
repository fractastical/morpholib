    claim_boundary:
      reported_in_source:
      - 'Yamanaka et al. (2023) Nature 614:509-520 & Miao et al. (2023) Nature 614:500-508: Matrigel ECM embedding
        and RhoA/ROCK-dependent apical actomyosin constriction drive epithelial somite rosette polarization and
        central somitecoel lumen formation in human axioloids and somitoids; HES7 oscillations and periodic MESP2/RIPPLY2
        stripes precede boundary formation'
      - 'Adhyapok et al. (2021) Dev. Cell 56:1312-1324: combined apical constriction (gamma_ap > gamma_bas) and
        EphA4/ephrinB2 heterotypic boundary repulsion (gamma_het > gamma_hom) govern somite rounding and inter-somitic
        cleft separation'
      - Y-27632 ROCK inhibition or absence of Matrigel abolishes the apico-basal tension differential and prevents
        polarized epithelial somite rosette morphogenesis
      - 'Lewis (2003): a transcriptional-delay autoinhibition loop yields a limit-cycle segmentation oscillator;
        Diaz-Cuadros et al. (2020) and Matsuda et al. (2020): the human iPSC-PSM HES7 period is ~5 h'
      - 'Cooke & Zeeman (1976): segment length equals wavefront speed times clock period, S = v T'
      - 'Gomez-Galvez et al. (2018): scutoids arise from apical/basal Voronoi mismatch under anisotropic (tubular)
        curvature; a spherical epithelium predicts none'
      reconstructed_in_script:
      - 2D 32-vertex apico-basal differential interfacial tension relaxation solver for an N=16 wedge-cell somite
        rosette (WT L_ap/L_bas = 0.3030 vs 0.3030 polygon law, 0.305 empirical), 6-regime perturbation series (Pearson
        r = 0.9989, RMSE = 0.0154), Eph/ephrin cleft barrier (S_cleft = 0.8189 WT vs 0.0930 KD), 28x28 phase diagram
        and bilateral specimen segmentation (45.375 px, CV 0.2391) carried from Pass 2
      - 'Pass 3: closed 3D polyhedral shell of 96 spherical-Voronoi frustum cells with volume elasticity, face tensions
        and -P V_lumen, relaxed over 192 radii and matched to the closed-form Law 4 balance (WT rho_3D = 0.3229
        discrete vs 0.3229 analytic; Y-27632 0.7098), a lumen-pressure sweep with saddle-node rupture P_crit = 0.115
        gamma_lat/um (Laplace open-shell bound 0.510) and a scutoid topology audit (0 scutoids by construction)'
      - 'Pass 3: Lewis (2003) HES7 delayed oscillator time-scaled to T = 4.995 h in 64 PSM cells, Cooke-Zeeman wavefront
        arrest (v = 20 um/h), MESP2 gated by frozen HES7 phase (0.50 of each segment), RIPPLY2 boundary fixation,
        5 ephrinB2-|EphA4+ boundaries at S = 100.0 um = v T, exponential RhoA/ROCK gamma_ap(x,t) (tau 3 h) and EphA4/ephrinB2
        gamma_het,k(t) (tau 1.5 h) ramps fed live into the vertex, shell and cleft models: S0 0.3428 -> S-III 0.3033
        maturation, Y-27632 coupled 0.7013 at every stage, Eph/ephrin KD cleft 0.0930'
      transfer_boundary:
      - The 2D and 3D laws share the same empirical cross-section ratio 0.305 as their only external anchor; the
        3D shell with the 2D-fitted tensions gives 0.323 (6% high) and the tensions were NOT re-fitted for 3D
      - The clock-coupling constants v, tau_ROCK, tau_Eph, tau_RIPPLY2 are model choices (segment ~100 um, MET over
        ~1 period); S = v T is therefore an analytical identity check, not a comparison with a digitised somite
        length; the HES7 period is calibrated to 5 h, so its measurement validates the calibration rather than predicting
        the period
      - 'The HES7 clock is synchronous across the PSM (Cooke-Zeeman limit): no posterior-anterior period gradient,
        hence no kinematic HES7 waves as seen in axioloids; the coupling is one-way (clock -> tension), with no
        mechanical feedback on the clock or on MESP2'
      - 'The 3D shell cells are radial frusta with 2 DOF each on a fixed Voronoi tessellation: no tangential vertex
        motion, no T1 transitions, no scutoids; the 0% scutoid result is a construction, consistent with but not
        a test of Gomez-Galvez (2018)'
      - No somitocoel pressure has been measured in the source papers; P_crit is referenced to the model-internal
        Laplace bound only
      does_not_claim:
      - Full 3D sclerotome/dermomyotome lineage regionalization, scutoid or T1 cell rearrangements, kinematic HES7
        phase waves, Notch-mediated clock synchronisation, a TBX6/MESP2/RIPPLY2 gene-network model, mechanical feedback
        onto the clock, or a quantitative match of the stage-resolved lumen ratios to digitised Yamanaka (2023)
        / Miao (2023) stage data
