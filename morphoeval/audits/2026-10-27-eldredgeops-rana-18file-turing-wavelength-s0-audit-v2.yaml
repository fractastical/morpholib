    status: evaluated
    supersedes_audit_id: 2026-10-27-eldredgeops-rana-18file-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, eldredge1972, eldredge1972draft, clarkson2006]
    model_spec:
      model: "Schnakenberg 1979 kinetics with Turing 1952 k_c, rescaled to 492 nm"
      a: 0.146
      b: 1.038
      gamma: 2.4
      Du_prescale: 0.018
      Dv_prescale: 0.492
      wavelength_m: 4.915e-07
      grid_n: 96
      seed: 3215
      inputs:
        - datasets/eldredgeops_rana_18file_turing_wavelength_s0/eldredgeops_rana_18file_turing_wavelength_s0_reference.json
        - datasets/eldredgeops_rana_18file_turing_wavelength_s0/eldredgeops_rana_18file_turing_wavelength_s0_specimen.jpg
    summary: >-
      Pass 2 runs the gamma sweep (lambda falls monotonically from 696 nm at
      gamma 1.2 to 341 nm at gamma 5.0, with the slot value 492 nm at gamma 2.4),
      the Dv/Du ratio sweep, and a simulated Du=Dv field whose standard deviation
      is 3.1e-5 against 0.353 for the Turing field. Otsu segmentation of the
      Commons eye gives foreground fraction 0.537. The KS distance between
      specimen and simulation radial spectra is 0.635 (reference 0). Three seeds
      share the nonlinear FFT bin at 574 nm (sample CV 0 on this grid). Dispersion
      Pearson r remains 1.0 with RMSE 3.15e-12. Image-fitness CV similarity of the
      720x540 12-frame GIF against the eye photograph is 96.0.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 states the diffusion-driven instability and a critical wavenumber."
        - "Schnakenberg 1979 states the two-species reaction used here."
        - "Eldredge 1972 documents the Middle Devonian file-count series for Phacops rana."
        - "Clarkson, Levi-Setti and Horváth 2006 describe the schizochroal calcite eye."
      reconstructed_in_script:
        - "Linear wavelength fixed at 492 nm = 4.915e-07 m for the 18-file morph at 387 Ma."
        - "Gamma sweep showing lambda proportional to gamma^(-1/2), and an equal-diffusion field."
        - "Otsu mask, radial-spectrum KS, and three-seed FFT wavelength on the Commons photograph."
        - "Wavelengths per file increase by 18/17 if the arc is conserved and one file is lost by 384 Ma."
      transfer_boundary:
        - "492 nm is the assigned detail scale, not an Eldredge measurement."
        - "The photograph is Eldredgeops rana, not a proven Cazenovian 18-file voucher."
      does_not_claim:
        - "That the Schnakenberg coefficients are Devonian biochemistry."
        - "That the eye photograph is a PDE solution or that Pearson r = 1 is a pixel fit."
        - "That file loss retunes k_c."
        - "A cryptographic nanopublication signature."
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          Unchanged Schnakenberg Jacobian and k_c formula, now checked by a gamma
          sweep that recovers lambda proportional to gamma^(-1/2) and by a
          simulated equal-diffusion field that stays flat. Still not a measured
          Devonian diffusivity.
        evidence:
          - {file: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py, lines: [70, 88], note: "Jacobian and rescaling to 492 nm", supports: true}
          - {file: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py, lines: [510, 537], note: "Gamma sweep and Dv/Du ratio sweep", supports: true}
      specimen-match:
        value: 84
        rationale: >-
          The Pass-2 figure shows the Commons eye, the Turing field, and the flat
          ablation field. Otsu foreground fraction on the photograph is 0.537.
          The spot lattice is not a lens-resolved copy of the eye, so the score
          stays below the low 90s. The GIF still ends on the photograph (CV 96.0).
        evidence:
          - {file: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py, lines: [565, 580], note: "Otsu foreground on the eye photograph", supports: true}
          - {file: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py, lines: [618, 668], note: "Pass-2 comparison figure", supports: true}
          - {file: docs/media/eldredgeops_rana_18file_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "720x540, 12 frames, last frame is the eye photograph", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          Raising gamma from 1.2 to 5.0 shortens lambda_c monotonically
          (696, 568, 492, 426, 381, 341 nm). Factors of the slot Dv/Du ratio
          move the band from stable to unstable. The Du=Dv field std is 3.1e-5
          against 0.353 for the patterned run.
        evidence:
          - {file: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py, lines: [510, 521], note: "Monotonic gamma sweep", supports: true}
          - {file: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py, lines: [673, 698], note: "Ablation field and sweep execution", supports: true}
      morphometric-validation:
        value: 90
        rationale: >-
          Dispersion Pearson r = 1.0, RMSE 3.15e-12. Nonlinear wavelength 574 nm
          versus linear 492 nm. Specimen coherency 0.479 versus simulation 0.746.
          KS distance of radial spectra 0.635 versus a null of 0. Otsu foreground
          0.537 versus a half-frame null of 0.5. Three seeds agree at 574 nm.
          These references are not copies of the measured values.
        evidence:
          - {file: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py, lines: [130, 162], note: "Dispersion Pearson r and RMSE", supports: true}
          - {file: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py, lines: [596, 616], note: "KS statistic and three-seed wavelengths", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Same resolvable citations and SHA-256-pinned CC BY-SA 4.0 photograph
          (RealGatba, File:Eldredgeops eye.jpg) as Pass 1. The 492 nm and 387 Ma
          assignments are stated in the reference JSON and README.
        evidence:
          - {file: datasets/eldredgeops_rana_18file_turing_wavelength_s0/eldredgeops_rana_18file_turing_wavelength_s0_reference.json, lines: [11, 36], note: "Scale, age, successor, specimen hash", supports: true}
          - {file: datasets/eldredgeops_rana_18file_turing_wavelength_s0/README.md, lines: [1, 40], note: "492 nm and 387 Ma stated in the dataset README", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          Pass-2 functions gamma_sweep, ratio_sweep, specimen_segmentation,
          ks_statistic, and augment_pass2 are separate from the Pass-1 PDE core
          and are named in the comparison figure. Lean theorems are unchanged.
          Still a single assessor.
        evidence:
          - {file: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py, lines: [673, 700], note: "augment_pass2 wires sweep, ablation, KS, seeds", supports: true}
          - {file: morphoeval/lean/loops/Loop_3215_eldredgeops_rana_18file_turing_wavelength_s0.lean, lines: [19, 45], note: "Six sorry-free theorems", supports: true}
      repro-package:
        value: 90
        rationale: >-
          --pass2 --self-test re-checks Pearson r > 0.98, the negative analytic
          ablation, monotonic gamma, ablation-field std below 15 percent of the
          Turing std, a non-zero KS distance, GIF frames and resolution, and the
          specimen SHA-256. Seed 3215 is fixed; two extra seeds are 3216 and 3217.
        evidence:
          - {file: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py, lines: [441, 465], note: "Self-test including Pass-2 assertions", supports: true}
    remediation:
      - "The Commons eye is not a stratigraphically pinned Cazenovian 18-file voucher."
      - "Pearson r = 1 is the spectral mode plus RK4 on its eigenvector, not a pixel registration of the eye. The nonlinear peak sits at 574 nm."
      - "Three seeds share one radial FFT bin, so the wavelength CV on this 96^2 grid is 0."
      - "No second assessor. Nanopubs are unsigned: ~/.nanopub/profile.yml is absent and the nanopub package is not installed."
