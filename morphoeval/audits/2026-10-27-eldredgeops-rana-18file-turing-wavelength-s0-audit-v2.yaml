simulations:
  - id: delphi10000-eldredgeops-rana-18file-turing-wavelength-s0
    name: "Turing k_c at 492 nm for the 18-file Eldredgeops eye (Pass 2)"
    organism: "Eldredgeops rana_18file"
    domain: morphogenesis
    script: models/2026-delphi10000-eldredgeops-rana-18file-turing-wavelength-s0.py
    output: docs/media/eldredgeops_rana_18file_turing_wavelength_s0_comparison.png
    extra_outputs:
