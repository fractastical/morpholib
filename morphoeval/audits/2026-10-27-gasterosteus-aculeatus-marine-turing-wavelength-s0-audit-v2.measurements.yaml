      - The 2020 German photograph is an extant anatomical plate, not a 15 ka fossil
      - A small gain preserves the photograph's spectrum; it does not prove melanophores were measured at 52 µm
      does_not_claim:
      - That 52 µm was measured on a fossil melanophore
      - That N_eff = 8 is a published plate count for G. doryssus_late
