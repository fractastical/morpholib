    claim_boundary:
      reported_in_source:
      - 'Thompson (1917) pp. 591-598: chambers/whorls in continued proportion lie on a logarithmic spiral; von Moller''s
        Fusulina whorls in ratio ~1.5 (half-whorl 1.225, alpha ~86 deg); van Iterson''s Triloculina 1.323; Rhumbler''s
        Pulvinulina ~1.187 with a ''small secondary fluctuation''; constant volume ratio from growth proportional
        to existing mass.'
      - 'Thompson (1917) pp. 602-605: rotaline, Miliolid, Nodosarian, Textularian, Orbitolitid forms are all logarithmic-spiral
        cases differing in numerical coefficients and pass into one another by continuous gradations.'
      reconstructed_in_script:
      - A discrete similar-chamber generative model (centres on r = r0 rho^k at angle k d, radii a0 rho^k, optional
        translation) that Thompson describes verbally; chamber size a0 and overlap are free choices, not source
        parameters.
      - Per-specimen log-linear fits of test DIAMETER (perpendicular to the coiling axis, PCA frame from the mid-ontogeny
        outline) vs half-whorl stage on the Dryad outlines; BIC comparison with linear growth; CV and linear trend
        of successive ratios; a gap/overlap statistic for genus continuity; pre-registered pass/fail thresholds
        (r >= 0.98, 80 %, CV <= 0.15, +/-0.05, gap ratio <= 6).
      - Longest-segment rule for the 14 specimens digitised at two magnifications.
      transfer_boundary:
      - Dryad outlines are whorl-level axial sections in pixels of Late Paleozoic fusulinids; Thompson's chamber-level
        claims (septal chambers, Miliolidae, rotaline forms) are tested only via his own printed tables and the
        generative model, not via new specimen measurements.
      - The fusulinid thin-section photograph is displayed but not measured in v1.
      does_not_claim:
      - Does not claim that the growth ratio is physiologically caused by mass-proportional growth (E4 is proved
        algebraically, not tested).
      - Does not claim the verdict generalises to planktonic or miliolid foraminifera; n = 5 fusulinid genera, 106
        specimens, one Dryad deposit.
      - The T4 'continuity' statistic is a heuristic with an arbitrary threshold; its FAIL in v1 (gap ratio 6.34
        vs 6.0) is not evidence of discontinuity.
