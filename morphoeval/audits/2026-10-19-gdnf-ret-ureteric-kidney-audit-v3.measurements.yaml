    claim_boundary:
      reported_in_source:
      - 'Menshykau & Iber (2013): a ligand-receptor (GDNF-RET) Schnakenberg-type Turing mechanism on the ureteric
        bud epithelium selects elongation, bifurcation or trifurcation according to the ampulla geometry; GDNF is
        produced by the cap mesenchyme and bound by epithelial RET'
      - 'Short et al. (2014): OPT tip counts across E11.5-E15.5 (2 to 354 tips), Horton-Strahler R_b 2.08 and R_L
        1.38, stereotyped early branching followed by a spatially regulated nephrogenic-zone programme in which
        all tips reside beneath the renal capsule'
      - 'Watanabe & Costantini (2004), Basson et al. (2005), Miyazaki et al. (2000), Shakya et al. (2005): GDNF-bead
        attraction, Spry1-/- supernumerary budding, BMP4 stalk inhibition and Gdnf-/-/Ret-/- renal agenesis'
      reconstructed_in_script:
      - 4-species GDNF-RET-Wnt11-Sprouty1 reaction-diffusion solver on a 1D periodic ampulla ring with m = 1..4
        mode selection (L212-L361); a 3D stochastic ureteric tree across g = 1..8 with Horton-Strahler ordering
        (L366-L457, L655-L914); a steady diffuse-domain GDNF field inside an expanding spherical renal capsule with
        nephrogenic-zone production shell and RET tip sinks (L526-L604) coupled to the tree by chemotaxis, confinement,
        interstitial dilation and GDNF-gated arrest; a 6-condition capsule coupling sweep (L990-L1051); a 5-condition
        perturbation suite at g = 5 (L1057-L1101); colour-threshold segmentation of a vendored E12.5 micrograph
        (L1107-L1215)
      transfer_boundary:
      - The capsule is a sphere on a fixed Eulerian grid with isotropic dilation, not a moving-mesh finite-element
        model of the kidney; its radius R_cap(g) is prescribed from the Short (2014) observed tip numbers (L509-L519,
        L750), so the moving boundary is partly data-driven rather than emergent
      - Per-generation segment lengths and branch angles are read from the reference table (L743-L747); the tree
        reproduces the ordering of tip counts, not an independent prediction of the generation-wise geometry
      - The capsule constants (300/550 um anchors, 110 um nephrogenic zone, 150 um GDNF decay length, kappa_tip
        2.0, gate 0.15, chi 0.35) are modelling assumptions tagged as such in renal_capsule_phase_field_reference.json,
        not literature table values
      does_not_claim:
      - A deforming tetrahedral/FEM mesh of capsule and nephrogenic zone, anisotropic tissue growth, an ellipsoidal
        kidney, epithelial mechanics, cell-level nephron induction, or quantitative reproduction of the specimen
        micrograph's pErk1/2 fold (the 2.40 reference is unsourced)
