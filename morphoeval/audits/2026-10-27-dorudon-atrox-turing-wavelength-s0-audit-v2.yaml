# MorphoEval audit — Dorudon atrox Turing wavelength, 253 µm, 37.0 Ma. Pass 2.
#
# Supersedes 2026-10-27-dorudon-atrox-turing-wavelength-s0-audit.
# Same agent as pass 1 (Grok 4.7). Not a second-assessor consensus.
# Default command is pass 2:
#   python3 models/2026-delphi10000-dorudon-atrox-turing-wavelength-s0.py

audit:
  id: 2026-10-27-dorudon-atrox-turing-wavelength-s0-audit-v2
  rubric_version: "0.1.0"
  date: "2026-10-27"
  supersedes: 2026-10-27-dorudon-atrox-turing-wavelength-s0-audit
  supersedes_audit_id: 2026-10-27-dorudon-atrox-turing-wavelength-s0-audit
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder and assessor, single-agent cloud loop; no second assessor)"
  publisher_orcid: "https://orcid.org/0009-0007-4948-9192"
  publisher_github: https://github.com/fractastical
