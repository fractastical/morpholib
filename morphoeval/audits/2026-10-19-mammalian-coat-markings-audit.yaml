simulations:
  - id: murray-mammalian-coat-markings
    name: "Murray (1981) Thomas substrate-inhibition reaction-diffusion pre-pattern & conical tail spot-to-ring transition"
    organism: "African leopard (Panthera pardus) coat rosettes and tapered tail markings"
    script: 1981-murray-mammalian-coat-markings.py
    output: docs/media/mammalian_coat_markings_comparison.png
    extra_outputs:
      - docs/media/mammalian_coat_markings_growth.gif
    status: evaluated
    source_refs:
      - murray1981
      - thomas1975
      - murray1988
      - liu2006
    summary: >-
      Pass 1 (v1) baseline evaluation of `1981-murray-mammalian-coat-markings.py`
      (overall weighted score: 49.4 / 100). The v1 script solves the homogeneous
      steady state (u0, v0) = (9.9338, 9.2892) and linear Turing instability band
      [k_-^2, k_+^2] = [0.5236, 0.9648] of Thomas (1975) / Murray (1981) kinetics,
      but approximates pattern formation via a heuristic cosine superposition rather
      than integrating the nonlinear Thomas reaction-diffusion PDE with zero-flux
      Neumann boundaries on a 2D flank and curvilinear tapered conical tail; omits
      negative/ablation controls (d = 1 equal diffusion and K = 0 non-inhibitory
      Michaelis-Menten ablation); does not load or segment the vendored Panthera
      pardus specimen photograph; and exposes only 2 measurements without dispersion
      metrics or CLI parameter flags.
    scores:
      model-fidelity:
        value: 52
        rationale: >-
          Computes the exact Thomas (1975) / Murray (1981) homogeneous steady state
          (u0, v0) = (9.9338, 9.2892), Jacobian J0, and unstable wavenumber interval
          gamma*k^2 in [0.5236, 0.9648] (L24-62), but `simulate_cylinder_eigenmodes`
          (L65-91) synthesizes patterns using a Gaussian-weighted linear cosine sum
          rather than numerically integrating the nonlinear Thomas reaction-diffusion
          PDE du/dt = gamma*f(u,v) + Lap(u), dv/dt = gamma*g(u,v) + d*Lap(v) on a
          tapered conical cylinder with curvilinear Laplace-Beltrami operator and
          Neumann boundary conditions, and omits Liu, Liaw & Maini (2006) two-stage
          spot-to-rosette maturation.
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [24, 62], note: "Exact Thomas steady state and linear Turing band [k_-^2, k_+^2]", supports: true}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [65, 91], note: "Linear cosine superposition instead of nonlinear Thomas PDE + curvilinear conical tail Laplace-Beltrami solver", supports: false}
      specimen-match:
        value: 28
        rationale: >-
          Although `datasets/mammalian_coat_markings/panthera_pardus_specimen.jpg` is
          vendored in the repository, the v1 script never loads, segments, or displays
          the biological specimen photograph (`docs/media/mammalian_coat_markings_comparison.png`
          shows only 2 synthetic heatmaps), and performs no quantitative comparison
          against leopard flank rosette spacing or tail banding anisotropy.
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [94, 118], note: "2-panel synthetic plot without biological specimen panel or segmentation", supports: false}
          - {file: docs/media/mammalian_coat_markings_comparison.png, lines: [0, 0], note: "2-panel synthetic figure lacking Panthera pardus specimen comparison", supports: false}
      parameter-expressivity:
        value: 44
        rationale: >-
          Simulates only 2 static gamma values (8.0 and 25.0) in the comparison figure
          without Murray's full 5-regime scale morphospace sweep (gamma from subcritical
          0.4 uniform mouse coat to 120.0 large mammal high-mode crowding), without
          equal-diffusion (d=1.0) or non-inhibitory (K=0.0) negative controls, and
          without CLI flags for a, b, alpha, rho, K, d, or gamma (L133-141).
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [94, 110], note: "Only 2 gamma values rendered in static figure without negative controls", supports: false}
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [133, 141], note: "CLI exposes only --self-test", supports: false}
      morphometric-validation:
        value: 42
        rationale: >-
          `measure_morphoeval()` (L112-130) returns only 2 analytical scalar quantities
          (u0 and gamma*k_c^2) without measuring spatial wavelengths, proximal-vs-distal
          tail mode anisotropy, negative-control amplitude suppression, or biological
          specimen rosette spacing CV and nearest-neighbor statistics.
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [112, 130], note: "Only 2 analytical measurements returned; no PDE or specimen morphometrics", supports: false}
      source-traceability:
        value: 62
        rationale: >-
          Header cites Murray (1981) DOI `10.1016/0022-5193(81)90334-9` and
          `datasets/mammalian_coat_markings/` is present on disk, but the v1 script
          does not load `mammalian_coat_markings_reference.json` or verify SHA-256
          digests at runtime.
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [1, 8], note: "Single DOI in docstring; no runtime SHA-256 verification of datasets/mammalian_coat_markings/", supports: false}
      code-traceability:
        value: 58
        rationale: >-
          Basic docstrings are present for steady-state root finding (L24-62), but
          functions lack explicit equation, section, and figure mappings to Murray
          (1981) Eqs. (4)-(16), Section 4 Eqs. (26)-(32) Figs. 9-12, Liu et al. (2006)
          two-stage rosette equations, and the 3 Lean 4 theorems in
          `Loop_003_mammalian_coat_markings.lean`.
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [24, 91], note: "Docstrings omit explicit equation numbers and Lean 4 theorem cross-references", supports: false}
      repro-package:
        value: 68
        rationale: >-
          Includes deterministic `np.random.default_rng(1981)` and `--self-test`
          (L123-130), but `self_test()` checks only 3 basic inequalities without
          verifying dataset SHA-256 locks, PDE convergence, negative-control quenching,
          specimen segmentation, or bitwise determinism across two runs.
        evidence:
          - {file: 1981-murray-mammalian-coat-markings.py, lines: [123, 130], note: "Minimal 3-line self_test() without SHA-256, PDE, specimen, or determinism checks", supports: false}
    remediation:
      - "Replace the linear cosine superposition with a genuine 2D nonlinear Thomas (1975) / Murray (1981) reaction-diffusion PDE solver (with zero-flux Neumann boundaries) on both a planar mammalian flank domain (including Liu, Liaw & Maini 2006 two-stage spot-to-rosette maturation) and a curvilinear tapered conical cylinder (Laplace-Beltrami operator (1/r) d/dx(r du/dx) + (1/r^2) d^2u/dtheta^2)."
      - "Implement dual negative/ablation controls around the homogeneous steady state: (1) equal-diffusion control d = Dv/Du = 1.0 < d_c = 9.6292, and (2) non-inhibitory Michaelis-Menten ablation K = 0.0 (testing Lean Theorem 2 where K*u0^2 = 0 < 1 prevents self-activation)."
      - "Load and SHA-256-verify `datasets/mammalian_coat_markings/mammalian_coat_markings_reference.json`, `panthera_pardus_specimen.jpg`, and `scout_manifest.json` at runtime; segment the biological leopard flank rosettes and distal tail rings directly from `panthera_pardus_specimen.jpg`; and compare biological vs simulated inter-spot wavelength CV, Voronoi polygonality, and proximal-to-distal tail anisotropy."
      - "Sweep all 5 scale regimes gamma in {0.4, 3.5, 8.0, 25.0, 120.0}, expose full CLI parameters (--a, --b, --alpha, --rho, --K, --d, --gamma, --steps, --seed), expand `measure_morphoeval()` to 8 reference-backed morphometric measurements with uncertainty/control deltas, and upgrade `docs/media/mammalian_coat_markings_comparison.png` and `docs/media/mammalian_coat_markings_growth.gif`."
