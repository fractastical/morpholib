simulations:
  - id: sekimura-papilio-wing-stripe-mimicry
    name: "Sekimura et al. (2000) Proc. R. Soc. B, Madzvamuse et al. (2002) J. Math. Biol. & Thompson et al. (2014) Nature anisotropic Gierer–Meinhardt butterfly wing pattern formation and Batesian mimicry polymorphism in Papilio dardanus"
    organism: "Papilio dardanus (African mocker swallowtail female mimetic morphs: hippocoonides, trophonius, cenea, planemoides)"
    script: 2016-sekimura-papilio-wing-stripe-mimicry.py
    output: docs/media/papilio_wing_stripe_mimicry_comparison.png
    extra_outputs:
      - docs/media/papilio_wing_stripe_mimicry_growth.gif
    status: evaluated
    source_refs:
      - sekimura2000
      - madzvamuse2002
      - thompson2014
      - gierer1972
      - nijhout1991
    summary: >-
      Pass 1 (v1) baseline evaluation of `2016-sekimura-papilio-wing-stripe-mimicry.py`
      (overall weighted score: 56.4/100). The v1 script computes the Gierer–Meinhardt
      homogeneous steady state u0 = (a+1)/b = 1.1, v0 = u0^2 = 1.21, Jacobian J0, and
      critical diffusivity ratio d_c = 8.2384, but approximates spatial wing patterns
      via a static planar harmonic proxy (`synthesize_planar_eigenmode_field`, L68-86)
      rather than solving the 2D anisotropic Gierer–Meinhardt PDE on a curved forewing
      mesh with margin boundary conditions, omits the 6-point threshold u_th sweep,
      5-point anisotropy epsilon orientation sweep, and equal-diffusion negative control,
      and never loads or segments the vendored Papilio dardanus specimen image
      (`papilio_dardanus_cenea_specimen.jpg`).
    scores:
      model-fidelity:
        value: 56
        rationale: >-
          Computes the exact Gierer–Meinhardt homogeneous steady state (u0, v0), Jacobian
          entries, and critical Turing diffusivity ratio d_c = 8.2384 (`compute_gm_steady_state`,
          L37-65), backed by 3 Lean 4 theorems in `Loop_099_papilio_wing_stripe_mimicry.lean`.
          However, `synthesize_planar_eigenmode_field` (L68-86) substitutes a static planar
          cosine formula for time-stepping the nonlinear 2D anisotropic Gierer–Meinhardt PDE
          on the curved Papilio dardanus forewing domain with vein-aligned diffusivity tensor
          D = diag(1, epsilon) and boundary margin source gradients.
        evidence:
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [37, 65], note: "Exact Gierer-Meinhardt steady state (u0=1.1, v0=1.21), Jacobian J0, and critical diffusivity ratio d_c=8.2384", supports: true}
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [68, 86], note: "Static planar cosine proxy instead of 2D anisotropic Gierer-Meinhardt PDE solver on curved butterfly forewing domain", supports: false}
      specimen-match:
        value: 36
        rationale: >-
          Although `datasets/papilio_wing_stripe_mimicry/papilio_dardanus_cenea_specimen.jpg`
          is vendored on disk, the v1 script never loads, segments, or quantifies wing contour,
          melanic vs light patch area fractions, or band orientation from the biological
          specimen photograph.
        evidence:
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [89, 113], note: "Evaluates planar morph proxies without loading or segmenting papilio_dardanus_cenea_specimen.jpg", supports: false}
          - {file: docs/media/papilio_wing_stripe_mimicry_comparison.png, lines: [0, 0], note: "4-panel v1 plot shows rectangular cosine proxies without curved wing geometry or biological specimen segmentation", supports: false}
      parameter-expressivity:
        value: 52
        rationale: >-
          Evaluates the 4 female mimetic morph configurations (L89-113), but omits the
          6-point threshold u_th melanic expansion sweep, the 5-point anisotropic diffusivity
          epsilon stripe-to-band orientation sweep, the equal-diffusion (d = 1.0) and
          homogeneous-boundary negative controls, and CLI parameter overrides.
        evidence:
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [89, 113], note: "Evaluates 4 morph points without threshold sweep, anisotropy orientation sweep, negative controls, or CLI overrides", supports: false}
      morphometric-validation:
        value: 52
        rationale: >-
          `measure_morphoeval()` (L149-186) reports only 4 scalar metrics without Pearson r,
          p-value, RMSE, anisotropic stripe orientation angle, negative-control amplitude
          suppression, or empirical specimen wing segmentation metrics.
        evidence:
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [149, 186], note: "Only 4 baseline metrics without statistical correlations, negative controls, or specimen CV validation", supports: false}
      source-traceability:
        value: 74
        rationale: >-
          Vendors `datasets/papilio_wing_stripe_mimicry/` with 5 primary DOIs in
          `paper_citations.bib` (`10.1098/rspb.2000.1081`, `10.1007/s002850100133`,
          `10.1038/nature12979`, `10.1007/BF00289234`, `10.5962/bhl.title.119515`),
          `scout_manifest.json`, and `papilio_wing_stripe_mimicry_reference.json`, but lacks
          runtime SHA-256 verification in `2016-sekimura-papilio-wing-stripe-mimicry.py`.
        evidence:
          - {file: datasets/papilio_wing_stripe_mimicry/papilio_wing_stripe_mimicry_reference.json, lines: [1, 145], note: "Reference JSON with Gierer-Meinhardt parameters, 4 mimetic morphs, threshold sweep, and anisotropy sweep", supports: true}
      code-traceability:
        value: 68
        rationale: >-
          Links module docstrings to Sekimura et al. (2000), Madzvamuse et al. (2002), and
          the 3 Lean 4 theorems in `Loop_099_papilio_wing_stripe_mimicry.lean` (L1-21),
          but lacks trace links for curved forewing PDE discretization, vein-directed
          anisotropy tensor D = diag(1, epsilon), and boundary gradient switching.
        evidence:
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [1, 21], note: "Baseline docstring linking Sekimura et al. (2000), Madzvamuse et al. (2002), and Loop_099 Lean theorems", supports: true}
      repro-package:
        value: 64
        rationale: >-
          Provides `--self-test` (`L189-197`) checking steady state and threshold ordering,
          but lacks SHA-256 asset verification, two-run bitwise determinism checks on the
          nonlinear PDE solver, and specimen segmentation assertions.
        evidence:
          - {file: 2016-sekimura-papilio-wing-stripe-mimicry.py, lines: [189, 197], note: "Minimal 3-assertion self_test() without SHA-256 or PDE determinism checks", supports: false}
    remediation:
      - "Replace the static planar cosine proxy with a full 2D anisotropic Gierer-Meinhardt reaction-diffusion PDE solver on a curved Papilio dardanus forewing domain with vein-aligned diffusivity tensor D = diag(1, epsilon) and proximal-to-distal margin boundary profiles."
      - "Reproduce all 4 Sekimura et al. (2000) female Batesian mimetic morphs (hippocoonides broad diagonal patch, trophonius brick-red median patch, cenea fragmented spots, planemoides transverse band) plus the 6-point threshold u_th sweep and 5-point anisotropy epsilon orientation sweep."
      - "Implement equal-diffusion (d = 1.0 < d_c) and homogeneous-boundary negative controls verifying Turing pattern suppression and boundary-gradient role."
      - "Segment the vendored CC BY-SA 4.0 Papilio dardanus specimen photograph (`papilio_dardanus_cenea_specimen.jpg`) to extract wing contour, melanic vs light patch area fractions, discrete light patch count, and dominant pattern orientation angle, and enforce runtime SHA-256 verification."
