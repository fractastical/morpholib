# MorphoEval audit — Sekimura, Madzvamuse, Wathen & Maini (2000) Proc. R. Soc. B, Madzvamuse et al. (2002) J. Math. Biol. & Timmermans/Thompson et al. (2014) Nature Papilio dardanus Wing Mimicry Patterning, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2016-sekimura-papilio-wing-stripe-mimicry.py` (201 lines)
# prior to Step 12 remediation in `2026-10-19-papilio-wing-stripe-mimicry-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.4 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `synthesize_planar_eigenmode_field` (L68-86) evaluates a static planar rectangular
#      cosine proxy rather than numerically integrating the coupled 2D anisotropic
#      Gierer–Meinhardt reaction–diffusion PDE (du/dt = gamma*(a - b*u + u^2/v) + div(D_u grad u),
#      dv/dt = gamma*(u^2 - v) + div(D_v grad v)) on a curved Papilio dardanus forewing domain
#      with anterior/posterior Dirichlet/Robin boundary source gradients.
#   2. Evaluates only the 4 morph points without executing the 6-point threshold u_th
#      melanic expansion sweep, the 5-point anisotropic diffusivity ratio epsilon = D_perp/D_par
#      stripe-to-transverse band orientation sweep, or the equal-diffusion (d = 1.0) and
#      homogeneous boundary negative controls.
#   3. The vendored CC BY-SA 4.0 Papilio dardanus cenea butterfly photograph
#      `datasets/papilio_wing_stripe_mimicry/papilio_dardanus_cenea_specimen.jpg` is never
#      loaded, segmented for wing contour, melanic vs light patch area fractions, or spot/band
#      orientation in `papilio_wing_stripe_mimicry_comparison.png`.
#   4. Runtime SHA-256 verification of dataset assets and CLI parameter overrides
#      (`--a`, `--b`, `--d`, `--gamma`, `--epsilon`, `--u-th`, `--seed`) are missing.

