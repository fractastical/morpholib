  id: 2026-10-19-conus-second-assessor-audit
  rubric_version: 0.1.0
  date: "2026-10-19"
  role: second_assessor
  blinded: true
  assessor:
    id: claude-fable-5-1
    label: "Claude Fable 5.1 (Cursor agent, blinded second assessor)"
    homepage: https://www.anthropic.com
  publisher_orcid: null
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  code_creators:
    - id: joel-dietz
      name: "Joel Dietz"
      orcid: null
      github: https://github.com/fractastical
  domain: morphogenesis
  tracked_by: https://github.com/fractastical/morpholib/issues/1
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: fb234bc
    environment:
      python: "3.14.7"
      numpy: "2.5.4"
      scipy: "1.16.3"
      matplotlib: "3.10.7"
      Pillow: "12.0.0"
    note: >-
      Same checkpoint as the primary audit 2026-10-18-conus-audit (fb234bc), so
      the two assessments score byte-identical code.  Outputs were regenerated in
      the worktree with the environment above (the primary audit ran under numpy
      2.4.2 / scipy 1.17.0 / matplotlib 3.10.8 / Pillow 12.1.1); the regenerated
      conus_textile_rule30_comparison.png has the same artifact_sha256
      (b204b836…) and the same spec_fingerprint (6baf9ffa…) as recorded in the
      primary audit's measurement sidecar, so the rendering is deterministic
      across those library versions.  The script has since gained Rule 30
      Theorems 6-10 (commits after fb234bc); those are out of scope here.

