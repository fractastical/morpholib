# MorphoEval audit — Blinded second-assessor replication of the Conus textile Rule 30 /
# Meinhardt–Klingler audit, 2026-10-19.
#
# Purpose: give `1984-wolfram-conus-textile-rule30.py` the same cross-company dual
# scoring every other evaluated script already has.  The primary audit
# (2026-10-18-conus-audit, gemini-4-argon, Google, commit fb234bc) was the only
# evaluated script in the corpus with a single assessor.  This pass scores the
# identical checkpoint with an assessor from a different provider
# (claude-fable-5-1, Anthropic).
#
# Protocol: the assessor worked in a detached git worktree at commit fb234bc from
# which morphoeval/audits/, morphoeval/kg/, morphoeval/runs/ and
# morphoeval/README.md had been removed, was told not to read the scoring tables
# of README.md, not to inspect other commits, and not to search for prior
# evaluations.  It had the script, datasets/conus/, the cached specimen
# photographs, requirements*.txt, morphoeval/rubric.yaml, and the outputs
# regenerated from that exact code (whose spec_fingerprint and artifact_sha256
# match the primary audit's measurement sidecar byte for byte).  It was asked to
# verify the equations against the cited sources, to look at the rendered images,
# and to pin every deduction to a file and line range.
#
# These assessments do NOT supersede the primary chain; they are parallel
# pk:LLMClaimAssessments of the same pkr:hypothesis/morphoeval-<sim>-<dim>
# nodes by a second pk:Model.  Scores are uncalibrated criterion-referenced
# scores on the rubric's 0-100 scale (not calibrated probabilities).  Line
# numbers refer to the files at commit fb234bc.

