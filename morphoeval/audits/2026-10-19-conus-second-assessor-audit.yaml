    authors: "Wolfram S"
    venue: "Nature 311(5985):419-424 (1984)"
    doi: 10.1038/311419a0
  meinhardt1987:
    title: "A model for pigment pattern formation on the shells of mollusks"
    authors: "Meinhardt H, Klingler M"
    venue: "Journal of Theoretical Biology 126(1):63-89 (1987)"
