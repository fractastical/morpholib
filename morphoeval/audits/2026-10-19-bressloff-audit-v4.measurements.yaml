      datasets/bressloff/driven-neural-fields-registry.json: 4f07b5175a48bcb50bad4998953505a3f92faf4c6f5514d2b4643c2a67c36b10
    claim_boundary:
      reported_in_source:
      - 'Bressloff et al. (2001, 2002): a Euclidean shift-twist symmetric neural field on the orientation-hypercolumn
        lattice of V1 undergoes a Turing-type instability whose even/odd, contoured (m=1) / non-contoured (m=0)
        planforms, pulled back through the retino-cortical map (2001 Section 2: x=(alpha/eps)ln(1+eps r/w0), y=beta
        theta/eps; 2002 Eq. 1.1: y=beta r theta/(w0+eps r)), give Klüver''s four form constants; cubic amplitude
        equations (2001 Eqs. 5.9-5.15) with coefficients built from the firing-rate derivatives sigma_2, sigma_3
        and a quadratic-feedback term select rolls, rhombi, squares or hexagons; the 2002 paper states a foveal
        magnification of 11.5 mm/deg, 30-36 perceived stripes and a cortical wavelength of 2.4-3.2 mm'
      - 'Ermentrout & Cowan (1979): cortical rolls map to tunnels, funnels and spirals under the log-polar retino-cortical
        map (the non-contoured limit)'
      - 'Horton & Hoyt (1991): human V1 linear cortical magnification follows M(E) = 17.3/(E + 0.75) mm/deg'
      - 'Rule, Stoffregen & Ermentrout (2011): periodic flicker drives 1:1 (stripe) and 2:1 period-doubling (hexagon)
        Floquet resonance tongues over forcing period and wave number'
      - 'Tamekue, Prandi & Chitour (2024): a Gaussian-only (no Mexican-hat) lateral kernel produces no MacKay-type
        pattern, used here as the negative control'
      reconstructed_in_script:
      - Perturbative Fourier-Bessel even/odd dispersion scans with exact parity to the upstream fixture (5 stability_reports,
        24 preset runs, all 133 paper-expectation checks counted, 121 pass) kept as branch_selection_upstream; PLUS
        the exact Hermitian orientation-space operator on e^{2 i m phi}, |m| <= 8, diagonalised directly (top eigenvalue
        within 3e-4 of the perturbative scan, dq* = 0) whose dominant harmonic derives the contoured/non-contoured
        regime (switch at local inhibition A_loc ~ 0.24-0.25 where W0 = W1); fixture presets that impose a non-critical
        harmonic or parity are flagged (imposed_harmonic, parity_imposed_subcritical)
      - Full cubic amplitude coefficients gamma(theta) = [3 s3 Gamma_3 - 2 s2^2 Q]/N with sigmoid derivative weights
        s2 = (1-2 sigma0)/2, s3 = (6 sigma0(1-sigma0)-1)/6 and the quadratic feedback Q through the resolvent (lambda_c
        - W_K)^-1 W_K at K = 0 and K = k_i +/- k_j (critical direction removed); eta = 2 s2 Gamma_2 / N with the
        eta-aware thresholds Lambda_r < Lambda_h; roll stability tested against every perturbation direction theta
        on a 5-degree grid, squares/rhombi against all external directions; at sigma0 = 1/2 the coefficients reduce
        to the upstream bare overlaps (gamma(60)/gamma(0) 0.4864 vs 0.4870); a feedback_fraction > 1 flag (near_resonant)
        and a gamma(0) <= 0 flag (subcritical) mark where the cubic truncation is unreliable; a regime map over
        A_loc x sigma0 (260 cells) and sweeps over lateral width, lateral inhibition, lateral spread, local inhibition
        and sigma0
      - 'Gallery of five planforms rendered at each branch''s own q* with k_x and k_y quantised to integer torus
        cycles: derived non-contoured tunnel and spiral (SELECTED: rolls stable with min 2 gamma/gamma0 - 1 = +0.92),
        contoured cobweb (IMPOSED-unstable), honeycomb (STABLE-coexisting) and the selected rhombic lattice; contoured
        planforms use the signed envelope with the exact eigenfunction u(phi) and an orientation field drawn as
        line elements in cortex and, via the tangent map phi_R = phi + theta_R, in the visual field'
      - 'Retinal pullback through the conformal complex-log angular coordinate by default (cortical torus closes
        exactly: seam 0.00, spiral chirality 0.89 with the LR/UD reflection metric) with the exact 2002 coordinate
        retained (--retinal-map exact) and its seams quantified on all four half-meridians under full-field, chiral-mirror
        and bilateral-mirror conventions; retinal morphometrics (ring counts fovea to 90 degrees on the model map
        and the Horton-Hoyt map, spoke count, cortical roll angle vs visual log-spiral angle)'
      - 'A paper_scale_tunnel preset (lateral widths / 3.3, q scan to 6): q* = 4.84, lambda_c = 2.60 mm (paper 2.4-3.2),
        29 rings fovea to 90 degrees on the alpha = 3/pi map vs 32 on the Horton-Hoyt map (paper 30-36); comparison
        of the map''s magnification with Horton & Hoyt (1991) (RMS 6.8%) and with the 2002 paper''s own scale anchors;
        a Gaussian-only negative control cross-referenced to the vendored registry; and a diagnostic overlay of
        the Rule (2011) tongue boundaries (16 curves over 5 forcing amplitudes) with its calibration status printed'
      transfer_boundary:
      - Numerical parity to 2.2e-16 is with the MesmerPrism/bressloff-v1-form-constants Rust implementation's stability_reports
        and runs, not with digitised figures of the 2001 paper; alpha = 3/pi and beta = 1.589/2 are the upstream
        params.rs values; the parity presets' rendered wavelength 8.7 mm is 3.1x the paper's and the paper-scale
        preset is a repo-added parameter choice (lateral widths / 3.3) that reaches the paper's wavelength but not
        the paper's parameter values
      - The quadratic-feedback term is evaluated through the linear resolvent of the same flat-dispersion operator,
        whose uniform K = 0 mode is nearly marginal; for sigma0 != 1/2 the feedback dominates the bare cubic term
        (resolvent gain 50-2000) and the script flags these cells near_resonant instead of reporting a selection
        (178 of 260 regime-map cells are subcritical or feedback-dominated) — a mean-mode-coupled amplitude equation
        (Matthews & Cox 2000) would be needed there
      - In the contoured (m = 1) regime rolls and squares are unstable for every sigma0 and the cobweb remains an
        imposed lattice; the non-contoured regime in which tunnels and spirals are SELECTED is reached by lowering
        the local inhibition to A_loc = 0.15 (a repo-added preset), not by the fixture's parameters
      - The conformal angular map removes the pullback seam by construction (the torus closes exactly); the exact
        2002 map's seams (left meridian 11.0 full-field; vertical meridians 10.3 chiral-mirror) are quantified,
        not fixed, because that map cannot close the torus at finite r
      does_not_claim:
      - Fifth-order (quintic) resolution of the odd-branch hexagon/triangle degeneracy or of the subcritical sigma0
        <= 0.25 cases (Bressloff 2001 Section 5), a mean-mode-coupled amplitude equation for the near-resonant K
        = 0 mode, a Floquet solver or validated reproduction of Rule (2011) Fig. 8 (the vendored fixture is marked
