# MorphoEval audit — Haupaix et al. (2018), Inaba et al. (2019) & Lin et al. (2013) Somite-Prepatterned
# Avian Plumage Stripes with Feather-Follicle Ring-Niche Coupling, 2026-10-19 (v3)
#
# Pass 3 re-score of `2018-haupaix-avian-plumage-somite-stripes.py` (v3, 1452 lines, 12 self-test checks,
# 14 measurements) after the remediation loop `2026-10-19-avian-plumage-somite-stripes-loop-pass3`,
# superseding `2026-10-19-avian-plumage-somite-stripes-audit-v2` (92.2).
#
# What Pass 3 changed:
#   1. The single open v2 item — couple the 2D somite-Agouti solver to individual 3D cylindrical feather-follicle
#      progenitor niches (Lin et al. 2013) — is closed as a reduced geometric + threshold model: a hexagonal
#      follicle lattice (9 feather rows per somitic period) whose ring niches read the body-wide field u(x, y),
#      the Haupaix (2018) agouti-dose yellow-pulse-duration law (feather type b / y / fully pheomelanic), and
#      each follicle unrolled from a 3D cylinder into the opened sheet of Lin's fig. S9 with chevron bands
#      s(ell) = s_0 + k|ell|. Two new Lean 4 theorems (Laws 4-5, 0 sorrys) pin the governing maths.
#   2. New paper-grounded validation: wild-type / recessive-black / Fawn quail yellow-feather-row counts
#      (4 / 2 / 5-6 rows, Haupaix Fig. 3B) are reproduced (4 / 2 / 6) with fitted dose multipliers; Fawn centre
#      rows are fully pheomelanic (paper: no eumelanin before hatching); centre-row yellow band > edge-row (fig. S1).
#   3. Two of the four primary citations were WRONG in Passes 1-2 and are corrected: Haupaix et al. (2018) was
#      cited under a non-existent title; Inaba et al. (2019) was cited as a non-existent Science 363:eaaw1969
#      article (it is PNAS 116(14):6884-6890, doi:10.1073/pnas.1816107116). Bib + JSON re-pinned (SHA-256).
#   4. Reading the paper for (2) exposed that the Pass 1-2 "reference" numbers the model is fitted to — the 5-species
#      mm stripe widths, the quail Lambda = 0.95 / w_y = 0.42 mm, the "Agouti bead" dose regimes (not a Haupaix
#      experiment; ASIP beads are Lin 2013 and whiten feathers) and the reverse-direction chimeras — are not in
#      the papers. They are flagged in the dataset (`pass3_provenance_flags`) and scored accordingly below.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the files at commit 469bf3c (working tree of the slot-010 loop). Several dimensions go
# DOWN relative to v2 because the v2 assessor credited reference values and citations that do not exist.

