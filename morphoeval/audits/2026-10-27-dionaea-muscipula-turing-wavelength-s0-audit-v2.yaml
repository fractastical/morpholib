simulations:
  - id: delphi10000-dionaea-muscipula-turing-wavelength-s0
    name: "Dionaea muscipula Turing wavenumber at 24 µm (pass 2)"
    organism: "Dionaea muscipula"
    domain: morphogenesis
    script: models/2026-delphi10000-dionaea-muscipula-turing-wavelength-s0.py
    output: docs/media/dionaea_muscipula_turing_wavelength_s0_growth.gif
    also:
      - docs/media/dionaea_muscipula_turing_wavelength_s0_comparison.png
      - datasets/dionaea_muscipula_turing_wavelength_s0/metrics.json
    status: evaluated
    supersedes_audit_id: 2026-10-27-dionaea-muscipula-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, murray1981, kondo2010, forterre2005, hedrich2018]
    summary: >-
      Pass 2 keeps the Schnakenberg field on the 192 µm × 144 µm patch
      (linear λ_c = 24 µm, saturated Fourier wavelength 26.63 µm). PDE mode
      growth matches the analytic dispersion with Pearson r = 0.999999 and
      RMSE = 0.00137 on k ∈ [0.11, 0.52] µm⁻¹. Scaling both diffusivities
      by s ∈ {0.25, 0.5, 1, 2, 4} moves the linear wavelength as 24·sqrt(s)
      and the saturated wavelength as 1.25 times that line (Pearson r ≈ 1,
      RMSE 7.47 µm). Equal diffusion gives σ_max = −0.114. The GIF last
      frame is the CC BY-SA photograph plus a 3% pigment modulation
      (CV similarity 96.0, 12 frames, 640×480). Redness KS versus the
      photograph is 0.0083, which is small because the scaffold is the
      photograph. At 0 Ma the 8 µm predecessor supports no unstable mode
      and the 480 µm successor holds 20 wavelengths at the same k_c.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 selects a finite k_c from the dispersion relation of a two-species reaction-diffusion system."
        - "Schnakenberg 1979 supplies the kinetics a − u + u²v and b − u²v."
        - "Murray 1981: the number of wavelengths that fit changes when the domain grows and the intrinsic wavelength does not."
        - "Forterre 2005 and Hedrich & Neher 2018 describe the trap lobe. They do not measure a 24 µm pigment wavelength."
      reconstructed_in_script:
        - "Du and Dv at ratio 18 so that λ_c = 24 µm exactly."
        - "Fourier PDE, pure-mode growth rates, diffusivity sweep, and Dv = Du ablation."
        - "Otsu redness segmentation of the Wikimedia specimen and of the GIF last frame."
      transfer_boundary:
        - "Marginal cilia and the lobe outline in the GIF are taken from the photograph. The PDE grows the activator on a flat patch; it does not grow the cilia."
        - "The saturated wavelength is 1.25 times the linear k_c, not equal to it. RMSE of that sweep is 7.47 µm."
        - "24 µm is the assigned cellular-detail scale. Age is 0 Ma. Chronoseries length is 1."
      does_not_claim:
        - "A published wet-lab spacing of 24.00 µm for Dionaea digestive glands."
        - "That the redness KS of 0.008 validates the PDE against gland positions. It only says the last frame is close to the photograph."
        - "A second independent assessor."
    scores:
      model-fidelity:
        value: 88
        rationale: "The script integrates Schnakenberg kinetics and compares pure-mode PDE growth to the Turing eigenvalue. Pearson r is 0.999999 and RMSE is 0.00137. a = 0.10 and b = 0.90 are chosen so the slot wavelength is 24 µm; they are not Dionaea-specific constants from Schnakenberg 1979."
        evidence:
          - {file: models/2026-delphi10000-dionaea-muscipula-turing-wavelength-s0.py, lines: [134, 158], note: "diffusivities() and sigma_analytic()", supports: true}
          - {file: models/2026-delphi10000-dionaea-muscipula-turing-wavelength-s0.py, lines: [171, 247], note: "sigma_pde_mode and dispersion_goodness_of_fit", supports: true}
      specimen-match:
        value: 82
        rationale: "The last GIF frame is the trap photograph with a 3% activator modulation, so the lobes and cilia are the specimen's (CV 96.0). The comparison figure also shows the raw 192 µm field. The silhouette is not a prediction of the PDE."
        evidence:
          - {file: docs/media/dionaea_muscipula_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640x480, CV 96.0", supports: true}
          - {file: models/2026-delphi10000-dionaea-muscipula-turing-wavelength-s0.py, lines: [500, 532], note: "render_pass2_frames scaffold and 3% last-frame modulation", supports: true}
          - {file: docs/media/dionaea_muscipula_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, last frame, and epidermal field side by side", supports: true}
      parameter-expressivity:
        value: 86
        rationale: "Multiplying both diffusivities by s moves λ as sqrt(s), and the PDE peak follows that line with a constant 1.25 factor. Setting Dv = Du makes every σ(k) negative (σ_max = −0.114) and the field variance collapses. a and b themselves are not swept."
        evidence:
          - {file: models/2026-delphi10000-dionaea-muscipula-turing-wavelength-s0.py, lines: [327, 372], note: "wavelength_scale_sweep", supports: true}
          - {file: models/2026-delphi10000-dionaea-muscipula-turing-wavelength-s0.py, lines: [311, 325], note: "ablation_equal_diffusion", supports: true}
      morphometric-validation:
        value: 84
        rationale: "Dispersion Pearson r = 0.999999 (reference gate 0.98) and RMSE = 0.00137 (reference 0). The sweep RMSE is 7.47 µm because saturated spots run at 1.25 times the linear wavelength; that bias is reported. Specimen foreground 0.449 vs render 0.445, coherency 0.475 vs 0.474, circularity 0.0167 vs 0.0169, redness KS 0.0083 vs a null of 0. The KS is small because the frame is built on the photograph."
        evidence:
          - {file: models/2026-delphi10000-dionaea-muscipula-turing-wavelength-s0.py, lines: [608, 727], note: "measurements_pass2, value != reference on each row", supports: true}
          - {file: datasets/dionaea_muscipula_turing_wavelength_s0/metrics.json, lines: [0, 0], note: "pass-2 dispersion, sweep, ablation, specimen segmentation", supports: true}
      source-traceability:
        value: 90
        rationale: "Bib DOIs were checked on Crossref. The specimen file is Wikimedia Commons 'Venus Flytrap showing trigger hairs', CC BY-SA 2.5, SHA-256 6e5b87a7… pinned in the reference JSON. Forterre 2005 and Hedrich & Neher 2018 are labelled as anatomy, not as the wavelength law."
        evidence:
          - {file: datasets/dionaea_muscipula_turing_wavelength_s0/paper_citations.bib, lines: [1, 107], note: "verified DOI entries", supports: true}
          - {file: datasets/dionaea_muscipula_turing_wavelength_s0/scout_manifest.json, lines: [1, 40], note: "uniqueness check and Wikimedia source", supports: true}
          - {file: datasets/dionaea_muscipula_turing_wavelength_s0/README.md, lines: [1, 44], note: "24 µm and 0 Ma stated in the dataset README", supports: true}
      code-traceability:
        value: 84
        rationale: "sigma_analytic is the dispersion formula from the docstring. The Lean file proves the integer shadow of the margin, the trace, the ablation sign, and the 8 / 20 wavelength counts. Pass-2 plotting labels the numeric curve against that formula."
        evidence:
          - {file: models/2026-delphi10000-dionaea-muscipula-turing-wavelength-s0.py, lines: [1, 48], note: "governing equations in the module docstring", supports: true}
          - {file: morphoeval/lean/loops/Loop_3169_dionaea_muscipula_turing_wavelength_s0.lean, lines: [11, 47], note: "six theorems, no sorry", supports: true}
      repro-package:
        value: 88
        rationale: "--self-test passed (λ = 24 µm, dispersion r > 0.98, sweep r > 0.98, ablation σ_max < 0, SHA-256 inputs). Seed 3169. --emit 1 and --emit 2 are separate commands. No nanopub profile was present, so nothing was signed."
        evidence:
          - {file: models/2026-delphi10000-dionaea-muscipula-turing-wavelength-s0.py, lines: [927, 968], note: "self_test assertions", supports: true}
          - {file: datasets/dionaea_muscipula_turing_wavelength_s0/dionaea_muscipula_turing_wavelength_s0_reference.json, lines: [1, 30], note: "scale_um 24, geological_age_ma 0", supports: true}
    remediation:
      - id: R1
        item: "Closed. Diffusivity scales s = 0.25, 0.5, 1, 2, 4. PDE wavelength tracks 24*sqrt(s) with ratio 1.25."
