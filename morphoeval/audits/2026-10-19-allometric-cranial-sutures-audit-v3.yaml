simulations:
  - id: bailleul-allometric-cranial-sutures
    name: "Miura et al. (2009) & Jaslow (1990) cranial suture fractal interdigitation, Kuramoto-Sivashinsky osteogenic instability, quasi-3D plate layering and reduced-order masticatory strain coupling"
    organism: "Homo sapiens and Mus musculus coronal, sagittal and lambdoid calvarial skull sutures"
    script: 2020-bailleul-allometric-cranial-sutures.py
    output: docs/media/allometric_cranial_sutures_comparison.png
    extra_outputs:
      - docs/media/allometric_cranial_sutures_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-allometric-cranial-sutures-audit-v2
    claim_boundary:
      reported_in_source:
        - "Miura et al. (2009) PNAS 106:11218-11223 fourth-order Kuramoto-Sivashinsky / KPZ osteogenic front instability dh/dt = -alpha*d^2h/dx^2 - beta*d^4h/dx^4 + (v_0/2)*(dh/dx)^2 + eta(x,t) generating self-affine fractal cranial suture interdigitation (D_f ~ 1.30-1.45) and collapse to a flat line under surgical mechanical unloading"
        - "Jaslow (1990) J. Biomech. 23:313-321 monotonic enhancement of cranial suture bending and impact energy absorption with Suture Interdigitation Index SII = L_arc / L_chord"
        - "Khonsari et al. (2013) Proc. R. Soc. B 280:20122670 & Zollikofer & Weissmann (2011) J. Anat. 219:100-114 bidirectional normal-front overhang and FGFR2 craniosynostosis fusion"
        - "Byron et al. (2004) Anat. Rec. 279A:676-684 increased temporalis mass / bite force raises sagittal suture fractal dimension (direction of mechanotransduction only); Herring & Teng (2000) in vivo suture strains are suture-specific and heterogeneous; Curtis et al. (2013) full-skull finite-element suture-strain coupling (precedent, not reproduced)"
      reconstructed_in_script:
        - "Pseudo-spectral integrating-factor / ETDRK2 Kuramoto-Sivashinsky + KPZ solver with spatially heterogeneous alpha(x) = alpha_mean + alpha_dev(x) (alpha_dev h_xx evaluated in real space, 2/3 dealiased), a 5-layer ectocranial-to-endocranial stack through T = 6 mm coupled by explicit kappa_z d^2h/dz^2, a continuous flat/infant/overhang blend of the 2D front construction, 5 vendored regimes, a simulated 15x15 (alpha, beta) morphospace, depth ablations (no gradient, kappa_z = 0) and a nuchal : temporalis traction sweep"
        - "Reduced-order Kirchhoff-Love vault strain field: analytic ellipsoid (90 x 70 x 65 mm), Gaussian temporalis and nuchal normal-deflection patches, isotropic intracranial membrane strain, curvature tensor projected on each suture's in-plane normal, eps_nn(s, zeta) = eps_mem + zeta kappa_nn, affine mechanotransduction alpha(eps_hat) = -0.35 + 1.55 eps_hat anchored on the vendored unloading and sagittal regimes"
        - "Automated CV calvarial segmentation, sagittal suture midline cleft extraction, SII (2.6791) and 5-scale dyadic box-counting fractal dimension (D_f = 1.2847) on human_sagittal_suture_specimen.jpg; 5 Lean 4 theorems (0 sorrys)"
      transfer_boundary:
        - "1D/2D osteogenic front geometry (x(s), y(s)), box-counting D_f, SII and Jaslow bending energy ratio compared against the superior-view human calvarial sagittal suture only; coronal, lambdoid and endocranial outputs are compared against vendored/literature expectations, not against a specimen"
        - "The strain field is a reduced-order analytic model whose traction magnitudes are stated assumptions; it reproduces the mean-alpha ordering lambdoid > sagittal > coronal but NOT the SII ordering (lambdoid/sagittal SII = 0.885 vs vendored 1.22) for any nuchal scale in [0, 2]"
        - "The 2D overhanging trace is a phenomenological construction (std(h)-normalised KS shape plus cascade harmonics), so D_f/SII magnitudes are set by that construction rather than by the PDE amplitude"
      does_not_claim:
        - "A finite-element solution of masticatory strain on a CT-derived 3D skull mesh, trabecular diploe micro-CT fracture mechanics, membrane equilibrium of a pressurised triaxial ellipsoidal shell, or single-cell scRNA-seq trajectories of Twist1+/Runx2+ suture stem cells"
    source_refs:
      - miura2009
      - jaslow1990
      - khonsari2013
      - zollikofer2011
      - herring2000
      - byron2004
      - nicolay2006
      - curtis2013
    summary: >-
      Pass 3 closes both v2 remediation items in reduced, explicitly labelled form and re-scores the
      script at 86.5/100 (down from 92.4). The solver now integrates a spatially heterogeneous
      alpha(x) Kuramoto-Sivashinsky/KPZ front in a 5-layer ectocranial-to-endocranial stack
      (`simulate_cranial_suture_regime`, L505-727) and derives alpha(s, zeta) for the coronal,
      sagittal and lambdoid sutures from a reduced-order Kirchhoff-Love vault strain field
      (`calvarial_shell_strain_field`, L346-441) through an affine mechanotransduction law
      (`strain_to_alpha`, L267-281) formalised by two new Lean 4 theorems. Results: ectocranial
      sagittal SII 2.863 / D_f 1.339 against a flat endocranial table (SII 1.000; no-gradient null
      2.81, kappa_z = 0 ablation 1.00), strain-coupled SII coronal 2.161 < lambdoid 2.433 <
      sagittal 2.748, simulated morphospace Spearman rho(D_f, alpha) = 1.00 and rho(D_f, beta) =
      -1.00, the five vendored regimes and the GIF numerically unchanged (sagittal D_f 1.3484,
      SII 2.9181; specimen CV D_f 1.2847, SII 2.6791). The score falls because the round exposed
      that the 2D overhang trace is a std(h)-normalised phenomenological construction, that the
      reduced strain model fails the lambdoid > sagittal SII comparison, and that only the sagittal
      suture is validated against a specimen.
    scores:
      model-fidelity:
        value: 84
        rationale: >-
          Credited: the damped KS dispersion and completing-the-square identity (L126-136, L203-262), the
          pseudo-spectral integrating-factor step with 2/3 dealiasing, the new heterogeneous-alpha treatment
          (alpha_mean in the exact integrating factor, -alpha_dev(x) h_xx in real space, L616-631), the
          5-layer through-plate stack with explicit Neumann kappa_z coupling (L634-637), the Kirchhoff-Love
          eps(zeta) = eps_mem + zeta kappa law and the affine mechanotransduction law anchored on the two
          vendored regimes (L267-281, L346-441), all with 5 machine-checked Lean theorems; the constant-profile
          case reduces bitwise to the Pass 2 solver (self-test 9). Deductions: the 2D overhanging front is not a
          solved bidirectional interface — `construct_osteogenic_front_curve` normalises the KS field by std(h)
          and adds three hand-coded cascade harmonics and a lobe drive locked to h, so only the shape (not the
          amplitude) of the PDE solution reaches D_f/SII (L466-491; -8); the vault strain field is Gaussian
          deflection patches plus an isotropic ICP term, not a shell-equilibrium or finite-element solution,
          and the lambdoid asterion flanks need an alpha clip of 3.0 to keep the explicit term stable (L322-344,
          L368, JSON L151; -5); the integrating factor is clipped to [-4, 0.12] and the growth saturation
          1/(1 + 0.55 var h) and cubic -0.18 h^3 are uncited closures (L619, L629-632; -3).
        evidence:
          - {file: 2020-bailleul-allometric-cranial-sutures.py, lines: [126, 136], note: "Damped KS dispersion omega(k) = alpha k^2 - beta k^4 - gamma", supports: true}
          - {file: 2020-bailleul-allometric-cranial-sutures.py, lines: [267, 281], note: "Affine strain mechanotransduction law alpha(eps_hat) = alpha_unl + (alpha_sag - alpha_unl) eps_hat anchored on vendored -0.35 and 1.20 (Lean Law 4)", supports: true}
          - {file: 2020-bailleul-allometric-cranial-sutures.py, lines: [346, 441], note: "Reduced-order Kirchhoff-Love vault strain field: Gaussian deflection Hessian, in-plane suture normal projection, eps(zeta) = eps_mem + zeta kappa, sagittal normalisation (Lean Law 5); explicitly NOT FEM", supports: true}
          - {file: 2020-bailleul-allometric-cranial-sutures.py, lines: [616, 637], note: "Heterogeneous alpha_dev(x) h_xx real-space term, dealiased nonlinear step, explicit Neumann kappa_z d^2h/dz^2 layer coupling", supports: true}
          - {file: 2020-bailleul-allometric-cranial-sutures.py, lines: [466, 491], note: "Carried defect: trace amplitude normalised by std(h) and cascade harmonics 0.62/0.34/0.16 hand-coded; D_f/SII are set by this construction, not by the PDE amplitude", supports: false}
          - {file: morphoeval/lean/loops/Loop_020_allometric_cranial_sutures.lean, lines: [117, 193], note: "Two new Lean 4 theorems (Laws 4 and 5), file verifies with 0 sorrys", supports: true}
      specimen-match:
        value: 82
        rationale: >-
          Credited: the SHA-256-pinned CC BY-SA human calvaria is segmented, its sagittal suture traced and
          overlaid (C1), compared waveform-to-waveform (C2) and in box-counting space (B1) with the simulated
