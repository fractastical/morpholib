# MorphoEval audit — Miura et al. (2009) & Jaslow (1990) Cranial Suture Fractal Interdigitation, 2026-10-19 (v3)
#
# Pass 3 remediation-round re-score of `2020-bailleul-allometric-cranial-sutures.py` (Slot 020) in the
# instrumented loop `morphoeval/runs/2026-10-19-allometric-cranial-sutures-loop-pass3`, superseding
# `2026-10-19-allometric-cranial-sutures-audit-v2` (92.4).
#
# What Pass 3 changed (both v2 remediation items closed in reduced, honestly-labelled form):
#   1. Quasi-3D ectocranial-to-endocranial plate thickness: 5-layer KS/KPZ stack through T = 6 mm with
#      per-layer alpha_j(x), explicit vertical coupling kappa_z d^2h/dz^2 (Neumann), per-layer D_f/SII,
#      no-gradient and kappa_z = 0 ablations; the endocranial table is flat (SII 1.00) while the
#      ectocranial table interdigitates (SII 2.86).
#   2. Heterogeneous masticatory strain coupling across coronal / sagittal / lambdoid: reduced-order
#      Kirchhoff-Love thin-shell strain on an analytic ellipsoidal vault (Gaussian temporalis + nuchal
#      deflection patches, isotropic ICP membrane term), projected onto each suture's in-plane normal
#      and through-thickness offset, mapped to alpha(s, zeta) by an affine mechanotransduction law whose
#      two anchors are the vendored unloading (-0.35) and sagittal (1.20) regimes; the KS solver now
#      treats alpha(x) = alpha_mean + alpha_dev(x) pseudo-spectrally. NOT finite elements (stated in
#      code, JSON and here).
#   3. The Pass 2 closed-form tanh morphospace surrogate (a defect v2 scored 92 without noticing) was
#      replaced by 225 actual simulations; a nuchal : temporalis traction sweep was added.
#   4. Two new Lean 4 theorems (strain_mechanotransduction_alpha_monotone,
#      kirchhoff_love_ectocranial_endocranial_ordering), 0 sorrys; self-test 8 -> 14 checks;
#      measure_morphoeval 6 -> 11 measurements; 4 new DOI-verified secondary references.
#
# Why the overall score goes DOWN (92.4 -> 86.5): the remediation exposed defects that v2 credited:
#   - the 2D "overhanging" trace is a phenomenological construction (std(h)-normalised amplitude plus
#     hand-coded cascade harmonics locked to h), not a solved bidirectional front (L466-491);
#   - the reduced strain model does NOT reproduce the lambdoid > sagittal SII ordering for any nuchal
#     scale in the sweep (SII ratio 0.80-0.88 vs vendored 1.22), although it does reproduce the mean-alpha
#     ordering; this is reported as a failed comparison, not tuned away;
#   - the vendored specimen only validates the sagittal suture; coronal, lambdoid and endocranial outputs
#     have no specimen comparison.
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to
# the files in the working tree at commit d58a084 after the Pass 3 edits (the script is 1572 lines).

