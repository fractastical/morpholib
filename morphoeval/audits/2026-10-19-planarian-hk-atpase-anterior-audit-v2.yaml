simulations:
  - id: beane-planarian-hk-atpase-anterior
    name: "Beane et al. (2011) planarian H,K-ATPase bioelectric V_mem anterior polarity switch"
    organism: "Schmidtea mediterranea freshwater planarian flatworm"
    script: 2011-beane-planarian-hk-atpase-anterior.py
    output: docs/media/planarian_hk_atpase_anterior_comparison.png
