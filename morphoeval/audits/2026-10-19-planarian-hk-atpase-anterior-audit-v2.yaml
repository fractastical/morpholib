        value: 93
        rationale: >-
          Faithfully implements the coupled Beane et al. (2011) and Pietak-Levin (2017)
          bistable membrane voltage PDE, symmetric Bell-form voltage-gated gap-junction
          flux divergence (10x conductance isolation at 36 mV trans-junctional drop),
          voltage-gated L-type Ca2+ influx gate Ca_ss(V), and mutually antagonistic
          anterior Head H(x,t) (*pc2/ndk*) and posterior Tail T(x,t) (*wnt1*) reaction-diffusion
          equations (L118-378), verified by 3 machine-checked Lean 4 theorems (0 sorrys)
          in `morphoeval/lean/loops/Loop_081_planarian_hk_atpase_anterior.lean`.
        evidence:
