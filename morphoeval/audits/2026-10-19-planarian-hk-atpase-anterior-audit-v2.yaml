          - {file: 2011-beane-planarian-hk-atpase-anterior.py, lines: [198, 378], note: "1D coupled V_mem + nonlinear voltage-gated GJ + Ca2+ head/tail morphogen PDE solver", supports: true}
          - {file: morphoeval/lean/loops/Loop_081_planarian_hk_atpase_anterior.lean, lines: [12, 92], note: "3 machine-checked Lean 4 theorems (0 sorrys) for bistable equilibria, GJ symmetry, and 4 phenotypes", supports: true}
