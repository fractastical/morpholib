    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Beane et al. (2011) Chem. Biol. 18:77-89 H,K-ATPase-mediated anterior blastema membrane depolarization (V_mem) and L-type Ca2+ channel requirement for head regeneration in Schmidtea mediterranea (1H1T wild-type, 0H2T SCH-28080/RNAi headless, 2H0T ivermectin double-head)"
        - "Oviedo et al. (2010) Dev. Biol. 339:188-199 & Pietak-Levin (2017) J. R. Soc. Interface 14:20170425 voltage-gated innexin gap-junction coupling G_GJ(DeltaV) and 8-octanol double-head (2H0T) induction"
      reconstructed_in_script:
        - "1D coupled bistable V_mem + Bell-form voltage-gated gap-junction PDE and mutually antagonistic Head H(x,t) / Tail T(x,t) morphogen cascade across 5 experimental regimes"
        - "Automated dorsal body-contour and bilateral photoreceptor ocelli segmentation on schmidtea_mediterranea_specimen.jpg (N=2 eyespots at x/L=0.0528, length=1478 px) and 2D body-plan silhouette synthesis"
      transfer_boundary:
        - "1D anteroposterior bioelectric V_mem and morphogen profiles mapped onto 2D dorsal Schmidtea mediterranea body-plan silhouettes and eyespot coordinates"
      does_not_claim:
        - "Single-cell stochastic neoblast migration trajectories or full 3D muscle-fiber extracellular matrix remodeling during blastema outgrowth"
    source_refs:
      - beane2011
      - oviedo2010
      - pietak2017
      - durant2017
    summary: >-
      Pass 2 post-remediation evaluation of `2011-beane-planarian-hk-atpase-anterior.py`
      (91.3/100, up from 59.2/100 in Pass 1; +32.1 overall). The remediated script
      couples the cubic bistable membrane potential PDE to Bell-form voltage-gated
      innexin gap-junction conductance G_GJ(DeltaV) = (1 - eta_oct)*G_0 / (1 + (DeltaV/V_0)^2)
      and L-type Ca_v-gated anterior/posterior gene transcription, reproducing all 5
      canonical Beane et al. (2011) and Oviedo et al. (2010) regeneration phenotypes with
      zero head-count error (RMSE = 0.0000): Wild-Type `1H1T` (delta_V = +50.5 mV),
      SCH-28080 / H,K-ATPase RNAi `0H2T` headless, Ivermectin `2H0T` double-headed,
      8-Octanol gap-junction blockade `2H0T` double-headed, and Nifedipine Ca_v-block
      negative control `0H2T`, alongside automated bilateral ocelli segmentation on
      `schmidtea_mediterranea_specimen.jpg` (N = 2 eyespots at x/L = 0.0528), backed by
      3 machine-checked Lean 4 theorems in `Loop_081_planarian_hk_atpase_anterior.lean`.
    scores:
