# MorphoEval audit — Menshykau & Iber (2013) Phys. Biol. & Short et al. (2014) Dev. Cell GDNF-RET Kidney Ureteric Bud Branching, 2026-10-19 (v3)
#
# Pass 3 re-score of `2014-menshykau-gdnf-ret-ureteric-kidney.py` (1958 lines) after the remediation of the single open
# v2 item in the instrumented loop `morphoeval/runs/2026-10-19-gdnf-ret-ureteric-kidney-loop-pass3`, superseding
# `2026-10-19-gdnf-ret-ureteric-kidney-audit-v2` (92.8, Gemini 4 Argon).
#   - Primary assessor: Claude Fable 5.1 (MorphoEval Autonomous Loop Slot 055 Pass 3 Phase B assessor), scoring
#     from the current file at commit 028758bc, the Phase A diff and the regenerated outputs.
#
# What Pass 3 changed (v2 remediation item 1, closed in REDUCED form — stated in the module header L8-L16):
#   1. New Section 3b (L460-L653): a diffuse-domain (phase-field) steady mesenchymal GDNF field
#      0 = D div(phi_cap grad G) + rho_G phi_nz - delta phi_cap G - kappa_tip T(x) G on a fixed 36x36x39 Eulerian grid
#      (`solve_renal_capsule_gdnf_field_3d`, L526-L604) inside a spherical renal capsule whose radius grows with the
#      Short (2014) observed tip number (`renal_capsule_radius_um`, L509-L519), a tanh nephrogenic-zone shell, RET tip
#      sinks, and a moving-boundary contact map (`_confine_to_capsule`, L623-L652).
#   2. Four couplings inside `grow_ureteric_tree_3d` (L655-L914): interstitial dilation of the existing tree about the
#      previous capsule centre with the hilum as fixed point (L752-L761), GDNF-gated branching arrest (L794-L797),
#      chemotaxis up grad G (L802, L854) and confinement (L806, L861); the Pass 2 hard-coded WT `branch_prob = 1.0`
#      override is gone (L778).
#   3. Six-condition coupling sweep / ablation (`CAPSULE_COUPLING_CONDITIONS`, `evaluate_capsule_coupling_sweep`,
#      L990-L1051): coupled 293 tips / NZ fraction 0.67; no-chemotaxis 289 / 0.51; decoupled v2 tree 307 / 0.11 (80 % of
#      its tips outside the nominal capsule); capsule x0.6 268 / 0.90; x0.5 198 / 0.95; x1.3 289 / 0.58.
#   4. Panels G-H added to the 8-panel figure (L1485-L1494, L1508-L1586), new `docs/media/gdnf_ret_ureteric_kidney_capsule_coupling.png`
#      (L1589-L1619), CLI `--capsule-growth`, `--chemotaxis`, `--no-capsule` and the previously dead `--D-ratio` wired
#      (L331-L361, L1920-L1926); 3 new `measure_morphoeval()` entries (12 total, L1684-L1822); self-test 8 -> 9 checks
#      (L1825-L1912); 2 new Lean theorems (`menshykau_capsule_confinement_bound`, `menshykau_capsule_crowding_arrest_monotone`,
#      Loop_055 L107-L151; 5 theorems, 0 sorrys); `renal_capsule_phase_field_reference.json` with per-constant status tags.
#
# Scores below: overall 88.1 (down from 92.8). The decrease is deliberate: the Pass 3 remediation exposed defects that
# the v2 audit did not penalise — the E15.5 tip count is now 293 vs the observed 354 (v2's "r = 1.0000 / 354" came from
# the removed WT `branch_prob = 1.0` override), the capsule constants are order-of-magnitude anchors rather than table
# values, the moving boundary is driven by the observed tip numbers it is later compared against, the per-generation
# segment lengths and angles are read from the reference table (so the segment-length r is circular), the specimen
# micrograph is from a prorenin-receptor study rather than a GDNF/RET study, and the pErk1/2 fold (38.65) is compared
# with an unsourced reference of 2.40. These are listed under `remediation` as the Pass 4 work list.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the files in the working tree at commit 028758bc (Phase A remediation applied, uncommitted).

