simulations:
  - id: menshykau-gdnf-ret-ureteric-kidney
    name: "Menshykau & Iber (2013) & Short et al. (2014) GDNF-RET-Wnt11-Sprouty1 kidney ureteric bud Turing branching morphogenesis"
    organism: "Mouse embryonic metanephric kidney ureteric bud & cap mesenchyme (Mus musculus, E11.5-E15.5)"
    script: 2014-menshykau-gdnf-ret-ureteric-kidney.py
    output: docs/media/gdnf_ret_ureteric_kidney_comparison.png
    extra_outputs:
      - docs/media/gdnf_ret_ureteric_kidney_capsule_coupling.png
      - docs/media/gdnf_ret_ureteric_kidney_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-gdnf-ret-ureteric-kidney-audit-v2
    source_refs:
      - menshykau2013
      - short2014
      - watanabe2004
      - basson2005
      - miyazaki2000
      - shakya2005
    claim_boundary:
      reported_in_source:
        - "Menshykau & Iber (2013): a ligand-receptor (GDNF-RET) Schnakenberg-type Turing mechanism on the ureteric bud epithelium selects elongation, bifurcation or trifurcation according to the ampulla geometry; GDNF is produced by the cap mesenchyme and bound by epithelial RET"
        - "Short et al. (2014): OPT tip counts across E11.5-E15.5 (2 to 354 tips), Horton-Strahler R_b 2.08 and R_L 1.38, stereotyped early branching followed by a spatially regulated nephrogenic-zone programme in which all tips reside beneath the renal capsule"
        - "Watanabe & Costantini (2004), Basson et al. (2005), Miyazaki et al. (2000), Shakya et al. (2005): GDNF-bead attraction, Spry1-/- supernumerary budding, BMP4 stalk inhibition and Gdnf-/-/Ret-/- renal agenesis"
      reconstructed_in_script:
        - "4-species GDNF-RET-Wnt11-Sprouty1 reaction-diffusion solver on a 1D periodic ampulla ring with m = 1..4 mode selection (L212-L361); a 3D stochastic ureteric tree across g = 1..8 with Horton-Strahler ordering (L366-L457, L655-L914); a steady diffuse-domain GDNF field inside an expanding spherical renal capsule with nephrogenic-zone production shell and RET tip sinks (L526-L604) coupled to the tree by chemotaxis, confinement, interstitial dilation and GDNF-gated arrest; a 6-condition capsule coupling sweep (L990-L1051); a 5-condition perturbation suite at g = 5 (L1057-L1101); colour-threshold segmentation of a vendored E12.5 micrograph (L1107-L1215)"
      transfer_boundary:
        - "The capsule is a sphere on a fixed Eulerian grid with isotropic dilation, not a moving-mesh finite-element model of the kidney; its radius R_cap(g) is prescribed from the Short (2014) observed tip numbers (L509-L519, L750), so the moving boundary is partly data-driven rather than emergent"
        - "Per-generation segment lengths and branch angles are read from the reference table (L743-L747); the tree reproduces the ordering of tip counts, not an independent prediction of the generation-wise geometry"
        - "The capsule constants (300/550 um anchors, 110 um nephrogenic zone, 150 um GDNF decay length, kappa_tip 2.0, gate 0.15, chi 0.35) are modelling assumptions tagged as such in renal_capsule_phase_field_reference.json, not literature table values"
      does_not_claim:
        - "A deforming tetrahedral/FEM mesh of capsule and nephrogenic zone, anisotropic tissue growth, an ellipsoidal kidney, epithelial mechanics, cell-level nephron induction, or quantitative reproduction of the specimen micrograph's pErk1/2 fold (the 2.40 reference is unsourced)"
    summary: >-
      Pass 3 (v3) evaluation of `2014-menshykau-gdnf-ret-ureteric-kidney.py` (overall weighted
      score 88.1/100, down from 92.8 in v2). The single v2 remediation item — couple the 3D tree to
      a phase-field / moving-boundary model of the expanding renal capsule and nephrogenic zone — is
      closed in a reduced, honestly labelled form: a steady diffuse-domain GDNF field on a fixed
      36x36x39 grid inside an expanding spherical capsule with a nephrogenic-zone production shell
      and RET tip sinks, coupled to the tree by chemotaxis, moving-boundary confinement, interstitial
      dilation and GDNF-gated arrest. The coupling demonstrably matters: 67 % of E15.5 tips lie in
      the nephrogenic zone (decoupled v2 tree 11 %, with 80 % outside the capsule), a half-rate
      capsule suppresses the tip count to 198/293 through 103 vs 7 gated arrests, and the field is
      2.15x enriched in the nephrogenic zone. Two Lean theorems (confinement bound, crowding-arrest
      monotonicity) are machine-checked, the self-test grows to 9 checks and 12 measurements, and
      three CLI flags plus the previously dead --D-ratio are wired. The lower score reflects what the
      remediation exposed rather than regressions: E15.5 tips 293 vs 354 observed (RMSE 23.3; v2's
      perfect fit came from a hard-coded WT branch_prob = 1.0 that is now removed), capsule constants
      that are order-of-magnitude anchors, a capsule radius prescribed from the observed tip counts,
      self-referential generation lengths/angles, a fragile Horton-Strahler R_b (2.18 at gate 0.15,
      2.35 at 0.18), a specimen micrograph from a prorenin-receptor study with an unsourced pErk fold
      reference, and CLI overrides that do not reach the perturbation suite, sweep or capsule figure.
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          The 4-species Schnakenberg GDNF-RET-Wnt11-Sprouty1 PDE (L212-L328), m = 1..4 ampulla mode
          selection (L331-L361), 3D tree with exact Strahler ordering (L366-L457, L655-L914) and the
          agenesis / Spry1 controls are unchanged and sound. Pass 3 adds a physically reasonable
          diffuse-domain GDNF field: production confined to the nephrogenic shell phi_nz, decay and
          RET tip sinks inside phi_cap, zero GDNF outside the capsule (verified by self-test 9), and
          four couplings — chemotaxis, confinement, interstitial dilation with the hilum fixed, and
          GDNF-gated arrest — each of which produces the qualitatively expected effect in the sweep
          (+3 net vs v2 for the mechanism, backed by 2 new Lean theorems). Deductions, all exposed by
          the remediation: the capsule radius is prescribed from the Short (2014) observed tip number
          it is later compared against, so the moving boundary is not an emergent part of the model
          (-3); R_cap anchors, nephrogenic-zone thickness, GDNF decay length, kappa_tip, the 0.15 gate
          and chi = 0.35 are order-of-magnitude assumptions, not Menshykau/Short values (-2); the
          capsule is a sphere with isotropic dilation whereas the kidney is ellipsoidal with
          anisotropic growth (-1); per-generation segment lengths and angles come from the reference
          table rather than from the PDE or capsule (-1); the ampulla PDE is a periodic 1D ring of
          length pi R_tip described as a dome, with m = 1..4 seeded explicitly in the initial bias
          (-1). Net: 94 -> 90.
        evidence:
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [212, 361], note: "Coupled 4-species GDNF-RET-Wnt11-Sprouty1 ampulla PDE and m=1..4 mode selection; `--D-ratio` now reaches `evaluate_ampulla_mode_selection(D_ratio=...)` (L331)", supports: true}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [526, 604], note: "Steady diffuse-domain GDNF field 0 = D div(phi_cap grad G) + rho_G phi_nz - delta phi_cap G - kappa_tip T G on a fixed 36x36x39 grid with tanh phase fields and RET tip sinks", supports: true}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [750, 806], note: "Per-generation capsule radius and field solve, interstitial dilation about the previous capsule centre (hilum fixed), GDNF-gated arrest (L794-L797), chemotaxis (L802) and confinement (L806)", supports: true}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [509, 519], note: "Capsule radius R_cap(g) interpolated from the OBSERVED Short (2014) tip number of the same generation — the moving boundary is data-prescribed, not emergent", supports: false}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [479, 489], note: "CAPSULE_PARAMS: 300/550 um anchors, 110 um NZ, 150 um decay length, kappa_tip 2.0, margin 22 um, hilum offset 0.62 are approximate anchors / modelling assumptions", supports: false}
          - {file: morphoeval/lean/loops/Loop_055_gdnf_ret_ureteric_kidney.lean, lines: [107, 151], note: "`menshykau_capsule_confinement_bound` and `menshykau_capsule_crowding_arrest_monotone`: 2 new machine-checked theorems (5 total, 0 sorrys, lean exit 0)", supports: true}
      specimen-match:
        value: 84
        rationale: >-
          The 8-panel figure now shows the coupled 3D tree, the ampulla modes, the g = 1..8 scaling,
          the perturbation suite, the specimen segmentation, a mid-plane capsule GDNF slice with
          capsule / nephrogenic-zone contours and confined tips (Panel G), and the ablation bars
          (Panel H); the dedicated capsule-coupling figure contrasts the E13.0 and E15.5 coupled trees
          with the decoupled v2 tree, 80 % of whose tips lie outside the nominal capsule — a visually
          convincing demonstration that the coupling is what keeps tips in the nephrogenic zone.
          Specimen segmentation still finds 13 WT vs 6 mutant tips. Deductions, which the v2 audit
          did not apply: the vendored Wikimedia micrograph is from a prorenin-receptor (PRR UB-/-)
          study, not a GDNF/RET or Short (2014) specimen, so the "mutant" panel is not the Gdnf/Ret
          perturbation the model simulates (-4); the measured pErk1/2 fold of 38.65 is compared with
          a reference of 2.40 whose source string is unsourced, a 16x discrepancy left unexplained
          (-3); the pErk ROIs are hard-coded pixel boxes that ignore the ROI stored in the reference
          JSON (-1); the GIF draws every generation frame with the final dilated node positions, so
          early frames show already-stretched segments (-1); the E15.5 coupled tree has 293 tips vs
          the 354 the figure's own Panel C reports as observed (-2). Net: 91 -> 84.
        evidence:
          - {file: docs/media/gdnf_ret_ureteric_kidney_comparison.png, lines: [0, 0], note: "8-panel (2x4) synthesis: 3D coupled tree, ampulla modes, g=1..8 scaling, perturbations, specimen panels, Panel G capsule GDNF slice with NZ contours, Panel H coupling sweep bars", supports: true}
          - {file: docs/media/gdnf_ret_ureteric_kidney_capsule_coupling.png, lines: [0, 0], note: "E13.0 and E15.5 coupled slices vs decoupled v2 tree against the nominal capsule (80 % of tips outside) and sweep panel", supports: true}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [1508, 1586], note: "`_draw_capsule_slice` / `_draw_capsule_sweep` render the phase-field slice, capsule/NZ contours, confined tips and the ablation bars", supports: true}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [1107, 1215], note: "Specimen segmentation: 13 WT vs 6 mutant tips detected; pErk ROIs hard-coded at L1193-L1198 ignoring the reference JSON ROI", supports: true}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [1812, 1821], note: "pErk1/2 fold 38.65 vs `reference_value: 2.40` whose source is an unsourced description string; specimen is from a PRR study, not GDNF/RET", supports: false}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [1622, 1678], note: "GIF uses final (dilated) node positions for every generation frame", supports: false}
      parameter-expressivity:
        value: 90
        rationale: >-
          Pass 3 adds a 6-condition capsule coupling sweep (coupled, no-chemotaxis, decoupled,
          capsule x0.6 / x0.5 / x1.3) whose outputs move monotonically with capsule growth (198 <
          268 < 293 tips; NZ fraction 0.95 > 0.90 > 0.67 > 0.58), the `grow_ureteric_tree_3d`
          signature exposes `capsule_growth`, `chemotaxis_weight`, `capsule_confinement`, `gdnf_gate`
          (L663-L666), `evaluate_short_2014_generations` forwards them, and the CLI gains
          `--capsule-growth`, `--chemotaxis`, `--no-capsule` while `--D-ratio` (dead in v2) is now wired.
          The 4 ampulla regimes, 8 generations and 5 perturbation conditions are retained. Deductions:
          CLI overrides affect only the g = 1..8 tree (Panels A, C, F, G); the perturbation suite,
          Panel H sweep and the capsule figure take `seed` only and ignore them (-4); the `no_capsule`
          ablation changes chi, confinement, gate and dilation simultaneously, so only `no_chemotaxis`
          isolates a single coupling (-3); the gate value 0.15 is not sweepable from the CLI although
          R_b is sensitive to it (-1). Net: 92 -> 90.
        evidence:
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [990, 1051], note: "`CAPSULE_COUPLING_CONDITIONS` + `evaluate_capsule_coupling_sweep`: 6 conditions over capsule growth, chemotaxis, confinement and gate", supports: true}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [1917, 1927], note: "CLI: --rho-G, --gamma, --D-ratio (now wired), --bmp4, --capsule-growth, --chemotaxis, --no-capsule, --seed", supports: true}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [1230, 1234], note: "`render_comparison_figure` passes overrides only to the ampulla modes and the g=1..8 tree; `evaluate_perturbation_suite(seed)` and `evaluate_capsule_coupling_sweep(seed)` ignore them", supports: false}
          - {file: 2014-menshykau-gdnf-ret-ureteric-kidney.py, lines: [993, 993], note: "`no_capsule` condition sets chemotaxis 0, capsule False and gate 0 at once — a conflated ablation", supports: false}
      morphometric-validation:
        value: 86
        rationale: >-
          `measure_morphoeval()` returns 12 reference-anchored measurements (9 carried from v2 plus
          E15.5 tips-in-nephrogenic-zone fraction 0.666 vs ref 1.0 with the decoupled 0.114 stated,
          capsule-crowding suppression ratio 0.676 vs decoupled null 1.0, and NZ/core GDNF enrichment
          2.15 vs uniform null 1.0), each with method, reference source and a note. Short (2014) tip
          correlation r = 0.9997 (RMSE 23.3 vs 2^g RMSE 38.7), R_b 2.177 (ref 2.08), R_L 1.371 (ref
          1.38), Delta m = 1, Spry1/WT and BMP4/WT ratios, agenesis 0 tips, specimen 13/6 tips.
          Deductions: the E15.5 count is 293 vs 354 observed and the g = 5 WT count 36 vs 40.2 — the
