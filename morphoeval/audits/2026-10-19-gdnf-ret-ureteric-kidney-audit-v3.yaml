    remediation:
    - >-
      2014-menshykau-gdnf-ret-ureteric-kidney.py:509-519 and 750 — `renal_capsule_radius_um` interpolates R_cap(g)
      from the OBSERVED Short (2014) tip number of the same generation, so the moving boundary is data-prescribed and
      the Panel C tip-count comparison is not independent of the reference. Drive the capsule radius from simulated
      state (e.g. cumulative tip count or an interstitial growth law R_cap(t) with its own anchor) and report the
      comparison as a prediction.
    - >-
      2014-menshykau-gdnf-ret-ureteric-kidney.py:479-489 and datasets/gdnf_ret_ureteric_kidney/renal_capsule_phase_field_reference.json:15-28 —
      the capsule anchors (300 / 550 um), nephrogenic-zone thickness 110 um, GDNF decay length 150 um, kappa_tip 2.0,
      gate 0.15, chi 0.35, hilum offset 0.62 and margin 22 um are tagged as assumptions. Trace at least the capsule
      radii and nephrogenic-zone thickness to a measured source (Short 2014 OPT volumes or a histology table) and add
      a sensitivity sweep over gate and chi showing how R_b and the tip count respond.
    - >-
      2014-menshykau-gdnf-ret-ureteric-kidney.py:743-747 and 956-957 — per-generation `segment_length_um` and
      `branch_angle_deg` are read from the reference table, so the segment-length Pearson r is circular; recorded
      generation lengths are at formation while Strahler lengths include later dilation (752-761). Derive segment
      length from the ampulla PDE / capsule geometry or drop the length correlation from the measurement list.
    - >-
      2014-menshykau-gdnf-ret-ureteric-kidney.py:705-709 and 772-778 — trifurcation constants 0.08 / 0.24 / 0.22,
      stage factors 1.28 / 0.72 and branch probability 0.99 * gain^0.42 have no cited source; the E15.5 tip count is
      293 vs 354 observed (RMSE 23.3) and g=5 WT is 36 vs 40.2. Either calibrate these against the Short (2014) table
      with the calibration stated, or expose them as documented parameters.
    - >-
      2014-menshykau-gdnf-ret-ureteric-kidney.py:427-436 and 1849 — `compute_horton_strahler_metrics` drops the last
      ratio and falls back to R_b = 2.0, and the 1.90-2.30 self-test window passes only at gate 0.15 (R_b = 2.35 at
      gate 0.18 or chi = 0). Compute R_b by log-linear regression over all orders with >= 2 streams and report its
      sensitivity to the gate.
    - >-
      2014-menshykau-gdnf-ret-ureteric-kidney.py:1193-1198 and 1812-1821 — the pErk1/2 ROIs are hard-coded pixel
      boxes that ignore `panel_d_f_wt_if_roi_xyxy` in the reference JSON, and the measured fold 38.65 is compared with
      an unsourced `reference_value: 2.40`. Read the ROIs from the JSON, state a sourced reference or mark the
      measurement as uncalibrated.
    - >-
      2014-menshykau-gdnf-ret-ureteric-kidney.py:1807-1808 and datasets/gdnf_ret_ureteric_kidney/gdnf_ret_ureteric_kidney_reference.json —
      the vendored Wikimedia micrograph is from a prorenin-receptor (PRR UB-/-) study, not a GDNF/RET or Short (2014)
