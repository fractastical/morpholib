    claim_boundary:
      reported_in_source:
      - 'Thompson p. 305: cellular tissue resembles a froth'
      - 'Thompson p. 309/323: partitions meet three at a point at ~120 degrees (Lamarle minimal-area condition)'
      - 'Thompson p. 321: hexagonal pattern illustrated in countless cases but perfectly regular only rarely; eye
        pigment epithelium as the exemplar'
      - 'Thompson p. 325: cells on the average hexagonal, some with fewer and some with more sides than six'
      - 'Thompson p. 330: closely packed hexagons give the minimal extent of boundary in a plane'
      reconstructed_in_script:
      - Periodic Voronoi froth morphospace with Gaussian positional disorder delta and Lloyd relaxation (not in
        Thompson)
      - Euler side-sum, mu2, isoperimetric excess perimeter, Lewis and Aboav-Weaire fits on the model (E1-E5)
      - Mean-field Gibson 2006 division-topology Markov chain with through-centre cleavage (E6; reconstruction,
        not Gibson's exact matrix)
      transfer_boundary:
      - Lloyd (centroidal Voronoi) relaxation is a proxy for surface-tension perimeter minimisation; it is not a
        Plateau/vertex-model energy descent
      - The honeycomb bound is applied cell-by-cell to the measured area distribution (Hales 2001 proves the equal-area
        case)
      does_not_claim:
      - v1 does not measure any polygon statistic on the corneal endothelium or on Thompson's Fig. 125
      - No statement about proliferating epithelia beyond the reconstructed division chain
      - No scale (um) is attached to the specimen; morphometrics are dimensionless
