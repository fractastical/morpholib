      - cartwright2009
      - burton1951
      - cartwright2012
    summary: >-
      Pass 1 (v1) baseline evaluation of `2007-cartwright-nacre-spiral-dislocation-terraces.py`
      (consensus score 52.8/100). The v1 script evaluates an analytical Cabrera-Levine
      phase field for a single isolated screw dislocation (r_c=0.42 um, lambda_0=7.97 um),
      but omits opposite-chirality (+b, -b) Frank-Read target-ring generation for d > 2*r_c,
      subcritical dipole annihilation for d <= 2*r_c (negative control), same-chirality (+b, +b)
      double spirals, 3D bivalve sheet vs gastropod tower nacre architectures, 12-species
      cross-taxa BCF pitch scaling, and computer-vision segmentation of the vendored SEM
      nacre aragonite tablet specimen.
    scores:
      model-fidelity:
        value: 56
        rationale: >-
          Evaluates a static analytical Cabrera-Levine spiral phase for one isolated screw
          dislocation (L31-73), but lacks a 2D PDE / eikonal step-flow solver for multi-defect
          interactions, omits opposite-chirality (+b, -b) Frank-Read closed target terraces
          and subcritical dipole pinch-off annihilation (d <= 2*r_c), omits same-chirality
          (+b, +b) double spirals, and omits 3D gastropod columnar tower vs bivalve terraced
          sheet nacre reconstruction.
        evidence:
          - {file: 2007-cartwright-nacre-spiral-dislocation-terraces.py, lines: [31, 73], note: "Single analytical spiral phase without Frank-Read target dipole, subcritical annihilation control, or 3D tower/sheet nacre solver", supports: false}
      specimen-match:
        value: 24
        rationale: >-
          Renders a 2-panel synthetic spiral heightmap and velocity curve without loading,
          SHA-256-verifying, or segmenting the vendored SEM nacre fracture specimen
          (`datasets/nacre_spiral_dislocation_terraces/nacre_aragonite_tablets_specimen.jpg`).
        evidence:
          - {file: 2007-cartwright-nacre-spiral-dislocation-terraces.py, lines: [76, 102], note: "2-panel synthetic plot with zero biological SEM specimen comparison", supports: false}
          - {file: docs/media/nacre_spiral_dislocation_terraces_comparison.png, lines: [0, 0], note: "Pass 1 2-panel synthetic plot lacking SEM nacre aragonite tablet segmentation", supports: false}
      parameter-expressivity:
        value: 44
        rationale: >-
          Hardcodes a single parameter tuple (v_inf=1.25, r_c=0.42, h_0=0.50) with no CLI
          parameter overrides, no dipole separation sweep across d / (2*r_c), and no
          comparison across the 4 chiral defect morphospace regimes.
        evidence:
          - {file: 2007-cartwright-nacre-spiral-dislocation-terraces.py, lines: [31, 38], note: "Single hardcoded parameter set without CLI flags or chiral dipole regime sweep", supports: false}
      morphometric-validation:
        value: 50
        rationale: >-
          Reports only 3 analytical single-spiral scalars (L123-155) without validating
          the universal BCF pitch law lambda_0 ≈ 18.9848*r_c across the 12 empirical bivalve,
          gastropod, and cephalopod nacre species, without verifying topological Burgers
          winding charges, and without extracting SEM inter-lamellar mortar spacing h_0.
        evidence:
          - {file: 2007-cartwright-nacre-spiral-dislocation-terraces.py, lines: [123, 155], note: "Only 3 analytical scalars without 12-species scaling or SEM specimen morphometrics", supports: false}
      source-traceability:
        value: 64
        rationale: >-
          Reference dataset `datasets/nacre_spiral_dislocation_terraces/nacre_spiral_dislocation_terraces_reference.json`
          and SEM specimen exist on disk, but v1 does not load or verify their SHA-256
          digests at runtime.
        evidence:
          - {file: 2007-cartwright-nacre-spiral-dislocation-terraces.py, lines: [1, 29], note: "No runtime loading or SHA-256 verification of datasets/nacre_spiral_dislocation_terraces/", supports: false}
      code-traceability:
        value: 62
        rationale: >-
          Module docstring cites Cartwright & Checa (2007), but functions lack explicit
          equation mappings to Burton, Cabrera & Frank (1951), Cartwright et al. (2009),
          and the 4 Lean 4 theorems in `morphoeval/lean/loops/Loop_073_nacre_spiral_dislocation_terraces.lean`.
        evidence:
          - {file: 2007-cartwright-nacre-spiral-dislocation-terraces.py, lines: [31, 73], note: "Functions lack explicit paper equation and Lean 4 theorem cross-references", supports: false}
      repro-package:
        value: 70
        rationale: >-
          Includes `--self-test` (L158-164), but checks only 3 basic assertions without
          testing SHA-256 dataset provenance, JSON parity, subcritical Frank-Read dipole
          pinch-off annihilation, or bitwise two-run determinism.
        evidence:
          - {file: 2007-cartwright-nacre-spiral-dislocation-terraces.py, lines: [158, 164], note: "Minimal 3-check self_test() without SHA-256 provenance or bitwise determinism checks", supports: false}
    remediation:
      - "Implement a 2D multi-dislocation eikonal / excitable step-flow & 3D terrace solver covering all 4 Cartwright-Checa chiral dislocation morphospace regimes: (1) subcritical Frank-Read dipole (d = 0.60 um < 2*r_c = 0.84 um -> pinch-off annihilation negative control, 0 active terraces), (2) single screw dislocation (+b = +1 -> Archimedean spiral in bivalve sheet nacre *Pteria*), (3) supercritical opposite-chirality Frank-Read pair (+b, -b, d = 2.40 um > 2*r_c, b_net = 0 -> closed concentric target terraces), and (4) same-chirality pair (+b, +b, b_net = +2 -> interlocked double-spiral & gastropod columnar tower nacre *Haliotis*)."
      - "Load and SHA-256-verify `datasets/nacre_spiral_dislocation_terraces/` at runtime, validate the universal BCF terrace pitch law lambda_0 = (2*pi/omega_0)*r_c ≈ 18.9848*r_c and angular velocity law omega = omega_0*v_inf/r_c across 12 empirical bivalve sheet-nacre and gastropod/cephalopod tower-nacre species, and verify discrete contour winding numbers around single, target, and double-spiral cores."
      - "Perform computer-vision lamellar seam segmentation (`segment_nacre_sem_specimen`) on the vendored SEM fractured mother-of-pearl specimen (`nacre_aragonite_tablets_specimen.jpg`), measuring inter-lamellar chitin-protein mortar spacing h_0 (25.17 px = 0.5000 um, CV = 0.2933), aragonite tablet aspect ratio (3.2436), and vertical column layer count (14.12 layers)."
      - "Expose full CLI parameter overrides (`--v-inf`, `--r-c`, `--h-0`, `--dipole-d`, `--seed`, `--skip-gif`), upgrade `self_test()` to an 8-point verification suite with bitwise two-run determinism, and render a 6-panel publication-grade synthesis figure and co-evolving 2-panel growth GIF."
