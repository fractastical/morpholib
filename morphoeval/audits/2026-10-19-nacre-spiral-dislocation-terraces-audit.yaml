simulations:
  - id: cartwright-nacre-spiral-dislocation-terraces
    name: "Cartwright & Checa (2007) & Cartwright et al. (2009) nacre screw-dislocation spirals, Frank-Read target terraces, and defect pair annihilation"
    organism: "Pteria hirundo & Pinctada margaritifera (Bivalvia sheet nacre) / Haliotis rufescens & Gibbula umbilicalis (Gastropoda tower nacre)"
    script: 2007-cartwright-nacre-spiral-dislocation-terraces.py
