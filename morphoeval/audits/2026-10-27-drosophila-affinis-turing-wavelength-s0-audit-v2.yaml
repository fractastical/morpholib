        rationale: "With the classical wavelength held at 2.444 µm, peak growth rate rises monotonically across Dv/Du = 7.63, 8.5, 10, 12, 16, 24. Dv = Du is a negative control (sigma_max = -0.099). The Pass-2 bisection shows Du itself moves the selected wavelength onto the assigned scale."
        evidence:
