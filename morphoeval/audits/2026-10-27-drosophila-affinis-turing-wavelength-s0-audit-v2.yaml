simulations:
  - id: delphi10000-drosophila-affinis-turing-wavelength-s0
    name: "Drosophila affinis Turing wavenumber at 2.4 µm (Holocene, detail tier)"
    organism: "Drosophila affinis"
    script: models/2026-delphi10000-drosophila-affinis-turing-wavelength-s0.py
    output: docs/media/drosophila_affinis_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-drosophila-affinis-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, gierer1972, murray1981, kondo2010, sturtevant1916, miller1955, wittkopp2002, wittkopp2003, shoup1966]
    summary: >-
      Pass 2 bisects Du at Dv/Du = 10 until the fastest linear mode is 2.443 µm.
      The periodic Schnakenberg field then selects 2.432 µm by Fourier peak
      (reference 2.444 µm). The determinant-minimizing wavelength at the same
      diffusivities is 2.251 µm and is not substituted for the pattern wavelength.
      Continuum versus discrete sigma(k): Pearson r = 0.9991, RMSE = 0.0117.
      Ablation Dv = Du gives sigma_max = -0.099. Ratio sweep at fixed classical
      wavelength is monotonic in peak growth rate. Specimen foreground fraction
      0.221 versus last-frame 0.299; orientation KS = 0.0025 against a 0.05
      reference. Image-fitness CV similarity of the 12-frame 960 px GIF against
      the CC BY-SA habitus is 96.0. Weighted overall 86.2.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: the critical wavenumber and the requirement that the inhibitor diffuse faster than the activator."
        - "Schnakenberg 1979 kinetics and the Gierer-Meinhardt activator-inhibitor reading."
        - "Murray 1981: the selected length is a diffusion scale. Kondo and Miura 2010 review the same framework."
        - "Sturtevant 1916 and Miller 1955 establish the species and its sex-comb diagnosis."
      reconstructed_in_script:
        - "Du = 0.05101 µm^2/time, Dv = 0.5101 µm^2/time, chosen so argmax sigma(k) is 2.443 µm."
        - "Nonlinear FFT wavelength 2.432 µm on a 160 by 120 periodic grid, seed 3174, 4500 steps."
        - "Length ratios 2.444/98.43 = 0.0248 versus berryi and 2.444/138.7 = 0.0176 versus americana."
      transfer_boundary:
        - "Pigment-granule ontogeny is taken from Shoup 1966 on D. melanogaster and is not re-measured here."
        - "Tergite pigment genetics (Wittkopp 2002, 2003) operate at a coarser scale than 2.444 µm."
        - "The adult frame of the GIF is the photograph. Computer-vision similarity therefore scores the habitus, not an independently drawn fly."
      does_not_claim:
        - "Does not claim the determinant-minimizing wavelength (2.251 µm) equals the pattern wavelength (2.432 µm). Both are reported."
        - "Does not claim the sex-comb tooth spacing equals 2.444 µm."
        - "Does not claim a signed nanopublication. No local nanopub profile was present."
        - "Does not claim berryi is the ancestor of affinis or that affinis is the ancestor of americana."
    scores:
      model-fidelity:
        value: 88
        rationale: "Pass 2 keeps the published Jacobian and dispersion relation and adds an explicit bisection so the fastest-growing mode, which is the mode the nonlinear field selects, lies on the assigned 2.444 µm scale. The determinant minimizer at that Du (2.251 µm) is still computed and labeled as a different wavenumber. Kinetics remain the standard Schnakenberg system, not a fly-specific measured Jacobian."
        evidence:
          - {file: models/2026-delphi10000-drosophila-affinis-turing-wavelength-s0.py, lines: [130, 139], note: "Analytical growth rate sigma(k)", supports: true}
          - {file: models/2026-delphi10000-drosophila-affinis-turing-wavelength-s0.py, lines: [228, 257], note: "classical_wavelength and calibrate_du_to_target_wavelength", supports: true}
          - {file: models/2026-delphi10000-drosophila-affinis-turing-wavelength-s0.py, lines: [546, 562], note: "Run uses the calibrated Du and still records the ablation", supports: true}
      specimen-match:
        value: 82
        rationale: "Side-by-side, the female habitus (red eye, banded abdomen, 250 µm scale bar, age 0 Ma) sits next to a spot field whose FFT wavelength is 2.432 µm. The GIF interior is that habitus, so computer-vision similarity is high by construction of the adult frame. The spots are a generated pigment field, not a copy of the tergite bands, and the photograph does not resolve 2.444 µm."
        evidence:
          - {file: docs/media/drosophila_affinis_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Pass-2 comparison with a readable log-axis chronoseries", supports: true}
