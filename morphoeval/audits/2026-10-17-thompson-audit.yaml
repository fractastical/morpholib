# MorphoEval audit — D'Arcy Thompson's Scarus -> Pomacanthus transformation
# fitted to real species, 2026-10-17
# (re-score; supersedes the thompson-scarus-pomacanthus nanopubs of 2026-10-16-thompson-audit).
#
# What changed since the first audit (overall 70.2): the second remediation item -
# "add outlines ... so the comparison is of the form Thompson deformed, not 17
# points" - was done.  The script now fetches two openly licensed photographs
# from Wikimedia Commons (a collected Scarus ghobban on a white background, J.
# Huet / IFREMER, CC BY 4.0; a living Pomacanthus semicirculatus over sand, E.
# Levy, CC BY 2.0; SHA-256-pinned, cached, not vendored), segments their
# silhouettes (Lab distance from white; a marker watershed on Mahalanobis colour
# distance from the frame-sampled background plus colour gradient, with texture
# seeds for the dark caudal peduncle, inside a declared box with a declared shadow
# cut), registers each silhouette to its own species' 17 landmarks by a similarity
# fixed by two anchors the silhouette gives (snout -> LM2; the caudal peduncle,
# tracked from the tail tip as the narrowest column between caudal fin and body,
# -> the LM5-LM6 midpoint), fits the five families to the landmarks of S. ghobban
# -> P. semicirculatus (species, not genus, means) and carries the parrotfish
# silhouette with each; agreement with the angelfish silhouette is the IoU of the
# filled outlines and the mean symmetric boundary distance.
#
# The new finding strengthens the negative one.  With no deformation at all the
# two silhouettes overlap with IoU 0.662; every map read off the landmarks leaves
# the outline no better - affine 0.652, Moebius 0.645, Thompson's oblique coaxial
# circles 0.618, and the thin-plate spline that matches the 17 landmarks exactly
# 0.629 (boundary distance 5.6 % of body length for the similarity, 7.0 % for the
# coaxial circles).  What the landmarks ask of the body the fins do not follow:
# the angelfish's soft dorsal and anal lobes trail behind the peduncle, which no
# smooth map of the parrotfish produces.  The IoU values are re-derived in the
# measurements sidecar with a different rasteriser (point-in-polygon on a 900-px
# grid against the script's skimage.draw on 1000 px) and agree to 0.0001.
#
# What this does not settle, and what keeps specimen match out of the 80s: one
# individual per species, a dead specimen against a living fish (fin posture is a
# confound the script declares rather than removes), a segmentation that depends
# on a declared box and shadow cut for the field photograph, and landmarks that
# are placed on the photographs by two anchors rather than digitised on them.
# Thompson's own drawn grid is still shown beside the fitted one, not digitised.
#
# This is a data analysis, not a simulation, so the rubric is read as before:
# "model" is Thompson's family of grids, "rendered output" is the fish that
# family carries, "specimens" are the 791 digitised species and now the two
# photographed individuals.
#
# Scores are on the rubric's 0-100 scale.  Line numbers refer to the files at
# the checkpoint commit recorded below.

