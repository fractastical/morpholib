simulations:
  - id: delphi10000-drosophila-erecta-turing-wavelength-s0
    name: "Schnakenberg–Turing critical wavelength for Drosophila erecta at 2.262 µm (Pass 2)"
    organism: "Drosophila erecta"
    script: models/2026-delphi10000-drosophila-erecta-turing-wavelength-s0.py
    output: docs/media/drosophila_erecta_turing_wavelength_s0_comparison.png
    extra_outputs:
