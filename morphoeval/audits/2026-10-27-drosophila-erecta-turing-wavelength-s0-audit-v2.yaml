    status: evaluated
    source_refs: [turing1952, schnakenberg1979, yassin2016, kondo2010, gierer1972]
    summary: >-
      Dispersion wavelength is 2.262 µm at a=0.17, b=0.93, Dv/Du=16, age 0 Ma.
      Gallery annulus Pearson r=0.99803, RMSE=1.966 gray levels, KS=0.064.
      Annulus radius 97.30 µm versus the elegans primordium anchor 101.1 µm.
      δ sweep λ falls 2.847, 2.415, 2.310, 2.262, 2.217, 2.183 µm.
      Critical-mode std ratio 3.36; equal-diffusion ratio 7.5e-5; ablation ratio 2.1e-7.
      Dark/light production shift 1.24 exceeds wavelength shift 0.30.
      Wavenumber versus elegans is ×44.69. GIF CV similarity against the gallery
      image is 82.0 (16 frames, 640×480).
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation"
        - "Schnakenberg 1979 kinetics"
        - "Yassin et al. 2016 tan balancing selection in female D. erecta"
        - "Gallery image has a drawn 100 µm scale bar (measured run 111 px)"
      reconstructed_in_script:
        - "Du = 3.987e-14 m^2/s and Dv = 6.380e-13 m^2/s so lambda_c = 2.262 µm"
        - "Dark a=0.29 and light a=0.08 at fixed Du, Dv"
        - "Damped J0 disk mode fitted to the gallery radial profile"
        - "Fourier ring at 2.262 µm used as the fine texture on the GIF"
      transfer_boundary:
        - "2.262 µm is the assigned detail tier, not a length Yassin et al. measured"
        - "The 97.3 µm dark ring is the primordium-scale annulus in the same image, not the detail wavelength"
      does_not_claim:
        - "Does not claim geological age changes among elegans, erecta, and eugracilis (all 0 Ma)"
        - "Does not claim the tan enhancer numerically equals Dv/Du"
        - "Does not claim a wild-caught CC photograph was obtained"
    scores:
      model-fidelity:
        value: 88
        rationale: "k_c^2 = (Dv fu + Du gv)/(2 Du Dv) is solved so the physical wavelength is 2.262 µm (Du=3.987e-14 m^2/s, δ=16). Trace=-0.519 and det=1.210, so the homogeneous state is stable until diffusion. The disk-mode envelope is an extra radial fit on top of that law, which is why this is not 100."
        evidence:
          - {file: models/2026-delphi10000-drosophila-erecta-turing-wavelength-s0.py, lines: [78, 111], note: "critical_kc2, physical_diffusivity, turing_capable", supports: true}
          - {file: models/2026-delphi10000-drosophila-erecta-turing-wavelength-s0.py, lines: [124, 188], note: "integrate_patch Schnakenberg update and ablation switch", supports: true}
      specimen-match:
        value: 82
        rationale: "Direct CV similarity of the 16-frame 640×480 GIF against the gallery specimen is 82.0 (Sobel 12-bin, radial FFT, coherency, occupancy). The annulus reads as the same bright core and dark ring. The image is the project gallery field, not a wild fly, so the score stays below the mid-90s."
        evidence:
          - {file: docs/media/drosophila_erecta_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "16 frames, 640×480, CV 82.0", supports: true}
          - {file: docs/media/drosophila_erecta_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, render, radial overlay, chronoseries bars", supports: true}
      parameter-expressivity:
        value: 90
        rationale: "At fixed Du, λ(δ) for δ=4,8,12,16,24,40 is 2.847, 2.415, 2.310, 2.262, 2.217, 2.183 µm, strictly decreasing. Dark versus light production shift is 1.235 while the wavelength shift is 0.305. Equal diffusion and autocatalysis removal both kill the pattern."
        evidence:
          - {file: models/2026-delphi10000-drosophila-erecta-turing-wavelength-s0.py, lines: [351, 392], note: "sweep, dark/light a, equal-diffusion control, quadratic ablation", supports: true}
      morphometric-validation:
        value: 86
        rationale: "Annulus Pearson r=0.99803 against reference ceiling 1.0 (RMSE=1.966, so the series are not copies). KS=0.064 against anchor 0.5. Segmented ring radius 97.30 µm against the elegans primordium anchor 101.1 µm. PDE patch grows by 3.36× at the critical mode; the negative controls fall below 1e-4."
        evidence:
          - {file: models/2026-delphi10000-drosophila-erecta-turing-wavelength-s0.py, lines: [236, 258], note: "Pearson, RMSE, KS on the radial samples", supports: true}
          - {file: models/2026-delphi10000-drosophila-erecta-turing-wavelength-s0.py, lines: [482, 551], note: "measure_morphoeval anchors differ from measured values", supports: true}
