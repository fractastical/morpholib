simulations:
  - id: delphi10000-ambulocetus-natans-turing-wavelength-s0
    name: "Ambulocetus natans Turing wavenumber at 224 µm (47.5 Ma, detail primordium)"
    organism: "Ambulocetus natans"
    domain: morphogenesis
    script: models/2026-delphi10000-ambulocetus-natans-turing-wavelength-s0.py
    output: docs/media/ambulocetus_natans_turing_wavelength_s0_growth.gif
    also:
      - morphoeval/lean/loops/Loop_3106_ambulocetus_natans_turing_wavelength_s0.lean
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, thewissen1994, kondo2010, gingerich1994, thewissen2001]
    summary: >-
      Pass 1 implements Schnakenberg kinetics at a=0.05, b=0.90, Du=1, Dv=50, with the
      physical length chosen so the fastest analytic mode is 224 µm. Forward-Euler mode
      growth matches the eigenvalue curve at Pearson r=0.9997 (RMSE=0.0034). The nonlinear
      field on a 50x50 periodic patch selects about 178 µm, short of the 224 µm target,
      which is reported rather than forced. Equal diffusion is stable. The GIF (12 frames,
      720x540) paints that field into a flank window of the Naturalis mount (Ghedoghedo,
      CC BY-SA 3.0). Hydration factors for Pakicetus (0.72) and Rodhocetus (1.35) are a
      transfer hypothesis, not fossil measurements. ANALYSIS_PASS is still 1.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: diffusion-driven instability at a finite wavenumber."
        - "Schnakenberg 1979: activator-inhibitor kinetics du/dt = a - u + u^2 v + Du lap u."
        - "Thewissen, Hussain and Arif 1994: Ambulocetus natans, amphibious archaeocete, early middle Eocene of Pakistan."
        - "Thewissen et al. 2001 and Gingerich et al. 1994: Pakicetus is more terrestrial; Rodhocetus is more aquatic."
      reconstructed_in_script:
        - "Dimensionless parameters a=0.05, b=0.90, Du=1, Dv=50 and gamma=8, length-scaled to a 224 µm fastest mode."
        - "Forward-Euler dispersion check and a nonlinear periodic patch."
        - "Chronoseries wavelengths 190, 224 and 260 µm from lambda = 224 µm * sqrt(h)."
      transfer_boundary:
        - "Hydration h=0.72 and h=1.35 are this slot's reconstruction of how dermal diffusivity could change from Pakicetus to Rodhocetus. They are not in the fossil papers."
        - "The flank window is a visualization of a dermal primordium on a photograph of bone."
      does_not_claim:
        - "That 224 µm stripes are preserved on the Naturalis skeleton."
        - "That the emergent 178 µm peak was measured on a fossil skin."
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          The script integrates the Schnakenberg system and the Turing dispersion
          eigenvalue. Onset k_c and the fastest-mode k are both computed and are not
          treated as the same number. Gamma rescales time only. The integer Lean file
          pins the trace-diffusion sign and the 190 < 224 < 260 µm order.
        evidence:
          - {file: models/2026-delphi10000-ambulocetus-natans-turing-wavelength-s0.py, lines: [58, 88], note: "Jacobian, sigma(k), onset k_c", supports: true}
          - {file: models/2026-delphi10000-ambulocetus-natans-turing-wavelength-s0.py, lines: [216, 251], note: "Nonlinear periodic Schnakenberg", supports: true}
          - {file: morphoeval/lean/loops/Loop_3106_ambulocetus_natans_turing_wavelength_s0.lean, lines: [55, 63], note: "Equal-diffusion versus faster-inhibitor theorems", supports: true}
      specimen-match:
        value: 84
        rationale: >-
          The comparison figure places the Naturalis mount beside the simulated field
          and the last GIF frame. The mount is recognizable. The dermal pattern is an
          inset, not a claim that the bones are striped. Soft-tissue pigment is absent
          from the fossil, so this cannot be a pigment-photograph match.
        evidence:
          - {file: models/2026-delphi10000-ambulocetus-natans-turing-wavelength-s0.py, lines: [345, 372], note: "Flank-window composite on the mount", supports: true}
          - {file: docs/media/ambulocetus_natans_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Side-by-side mount, field, GIF frame", supports: true}
          - {file: docs/media/ambulocetus_natans_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame growth, 720x540", supports: true}
      parameter-expressivity:
        value: 82
        rationale: >-
          Hydration h moves the analytic wavelength as sqrt(h), and the bar chart
          shows Pakicetus < Ambulocetus < Rodhocetus. Equal diffusion flips the sign
          of the maximum growth rate. Pass 1 does not yet re-simulate the nonlinear
          patch at the predecessor and successor hydrations.
        evidence:
          - {file: models/2026-delphi10000-ambulocetus-natans-turing-wavelength-s0.py, lines: [148, 183], note: "lambda(h), chronoseries, ablation", supports: true}
          - {file: docs/media/ambulocetus_natans_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Chronoseries bars and ablation panel", supports: true}
      morphometric-validation:
        value: 88
        rationale: >-
          Analytic versus Euler growth rates give Pearson r=0.9997 and RMSE=0.0034.
          The nonlinear radial peak is about 178 µm against the 224 µm slot target.
          Otsu foreground fraction, structure-tensor coherency and a KS test compare
          the fossil photograph with the field, and those pairs are not value==reference.
        evidence:
          - {file: models/2026-delphi10000-ambulocetus-natans-turing-wavelength-s0.py, lines: [116, 145], note: "Dispersion goodness of fit", supports: true}
          - {file: models/2026-delphi10000-ambulocetus-natans-turing-wavelength-s0.py, lines: [522, 598], note: "measure_morphoeval specimen and KS rows", supports: true}
      source-traceability:
        value: 92
        rationale: >-
          Primary DOIs are pinned for Turing, Schnakenberg, Thewissen 1994, Kondo and
          Miura, Gingerich 1994 and Thewissen 2001. The specimen file carries artist,
          date, Commons URL, CC BY-SA 3.0 and a SHA-256 checked at runtime.
        evidence:
          - {file: datasets/ambulocetus_natans_turing_wavelength_s0/ambulocetus_natans_turing_wavelength_s0_reference.json, lines: [63, 73], note: "Specimen SHA-256, artist, license", supports: true}
          - {file: datasets/ambulocetus_natans_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "BibTeX for Turing, Schnakenberg, Thewissen 1994", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          onset_kc, sigma_of_k, run_schnakenberg and lambda_of_h are named for the
          expressions in the reference JSON. Lean theorems are the integer skeleton
          of the same sign and ordering statements, not a rewrite of the floats.
        evidence:
          - {file: models/2026-delphi10000-ambulocetus-natans-turing-wavelength-s0.py, lines: [68, 88], note: "sigma_of_k and onset_kc", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-ambulocetus-natans-turing-wavelength-s0.yaml, lines: [14, 45], note: "Law entries point at Lean loci", supports: true}
      repro-package:
        value: 90
        rationale: >-
          --self-test checks r>0.98, the 224 µm target, ablation sign, chronoseries
          order, GIF frame count and the 480 px floor. Seed 3106 and the specimen
          digest are fixed. ANALYSIS_PASS=1 is the pass-1 gate.
        evidence:
          - {file: models/2026-delphi10000-ambulocetus-natans-turing-wavelength-s0.py, lines: [36, 45], note: "Pinned parameters and ANALYSIS_PASS", supports: true}
          - {file: models/2026-delphi10000-ambulocetus-natans-turing-wavelength-s0.py, lines: [613, 628], note: "Self-test assertions", supports: true}
    remediation:
      - id: R1
        item: "ANALYSIS_PASS is 1, so extra seeds are skipped and no cross-seed wavelength CV is reported."
      - id: R2
        item: "Specimen segmentation is global Otsu. Largest-component cleanup is gated off, so dark-background specks can enter the mask."
      - id: R3
        item: "Pakicetus and Rodhocetus wavelengths are analytic sqrt(h) only. The nonlinear patch is not re-run at h=0.72 and h=1.35."
