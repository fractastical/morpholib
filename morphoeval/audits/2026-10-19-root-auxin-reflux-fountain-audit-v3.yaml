# MorphoEval Pass 3 (v3) Audit — Grieneisen, Xu, Marée, Hogeweg & Scheres (2007) Nature & Mähönen et al. (2014) Nature
# Reverse-Fountain Root Tip Auxin Reflux Capacitor, Growing Dividing Cellular Lattice & Gravistimulated PIN3/PIN7 Bending, 2026-10-20 (v3)
#
# Pass 3 post-remediation evaluation of `2014-grieneisen-root-auxin-reflux-fountain.py` (Slot 038)
# superseding `2026-10-19-root-auxin-reflux-fountain-audit-v2` in `2026-10-19-root-auxin-reflux-fountain-loop-pass3`:
#   - Primary assessor: Claude Fable 5.1 — 91.5 / 100 (DOWN from 93.2 / 100 in v2; -1.7 overall)
#
# WHAT CHANGED AND WHY THE SCORE WENT DOWN
#   - Pass 2 did not solve the Grieneisen transport equations: `simulate_2d_root_reflux_lattice` assembled an analytical
#     field whose per-regime QC amplification (142.5/124.8/58.4/11.2/1.35/96.2) was hard-coded to the reference-table
#     values, so the v2 "Pearson r = 1.0 / 0.9929" was circular. Those table values are Pass-1 SYNTHETIC calibration
#     targets, not digitised paper values. Pass 3 replaces the construction with a solved sparse cellular PIN-permeability
#     steady-state operator; every regime is now emergent and the agreement with the synthetic table is reported honestly
#     (log-amplitude r = 0.919; 6-regime z_MZ r = -0.331 because the NPA regime saturates PLT instead of collapsing it).
#   - The v2 remediation item is closed in REDUCED form: a growing 9-file cellular lattice with explicit mitotic division
#     (`simulate_growing_cellular_lattice`) and gravistimulated PIN3/PIN7 statocyte asymmetry with Sachs sine-law bending
#     and a Band (2012) tipping-point reset (`simulate_gravitropic_bending`). It is NOT a vertex/CPM mechanics solver.
#   - specimen-match and morphometric-validation drop because (a) the confocal specimen still contributes only nuclear
#     statistics with no model-predicted quantity compared against it, and (b) three disclosed disagreements remain
#     (tipping point 5.55 h vs ~2 h; growth 82 um/h vs ~180 um/h; NPA z_MZ saturates). model-fidelity drops 2 points
#     because the growth/bending mechanics are reduced, not the requested vertex/CPM.
#   - source-/code-traceability and repro-package rise slightly: 10 DOI-verified references, 5 SHA-256-pinned files,
#     6 Lean theorems (3 new) with line-pinned loci in the docstring and KG yaml, 14-check self-test, 16 measurements.

