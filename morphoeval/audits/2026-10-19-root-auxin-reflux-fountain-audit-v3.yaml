simulations:
  - id: grieneisen-root-auxin-reflux-fountain
    supersedes_audit_id: 2026-10-19-root-auxin-reflux-fountain-audit-v2
    name: "Grieneisen et al. (2007) Nature & Mähönen et al. (2014) Nature reverse-fountain root tip auxin reflux capacitor solved on a cellular PIN-permeability lattice, with a growing dividing cellular lattice and gravistimulated PIN3/PIN7 bending (Friml 2002, Band 2012)"
    organism: "Arabidopsis thaliana (primary root apex: vascular stele, pericycle/endodermis, cortex, epidermis/lateral root cap, quiescent center, and columella statocytes)"
    script: 2014-grieneisen-root-auxin-reflux-fountain.py
    output: docs/media/root_auxin_reflux_fountain_comparison.png
    extra_outputs:
      - docs/media/root_auxin_reflux_fountain_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Grieneisen, Xu, Marée, Hogeweg & Scheres (2007) Nature 449:1008-1013 cellular root apex reverse-fountain auxin reflux loop (rootward PIN1 stele permeability v_s, apolar columella PIN3/PIN4/PIN7 redistribution k_col, shootward PIN2 epidermal/LRC permeability v_e, inward lateral reflux k_lat on epidermis/cortex/endodermis) generating a >100-fold Quiescent Center auxin maximum that persists after shoot decapitation and regenerates proximally after QC laser ablation (Xu et al. 2006)"
        - "Mähönen et al. (2014) Nature 515:125-129 slow auxin-induced PLETHORA synthesis, cell-to-cell movement, and growth dilution creating an axial PLT dosage gradient whose thresholds Theta_MZ = 0.36 and Theta_EZ = 0.14 position the meristematic, elongation and differentiation zones"
        - "Friml et al. (2002) Nature 415:806-809 and Kleine-Vehn et al. (2010) PNAS 107:22344 gravity-induced lateral relocation of PIN3/PIN7 in columella statocytes producing a lower/upper lateral auxin asymmetry; Band et al. (2012) PNAS 109:4668 transient lateral auxin gradient dissipating at a ~40 degree tipping point"
        - "Beemster & Baskin (1998) Plant Physiol 116:1515 cell division and elongation kinetics of the Arabidopsis root (cell cycle ~17-18 h, mature cortical cell ~160 um); Dello Ioio et al. (2007) Curr Biol 17:678 meristem cortical cell number ~30"
      reconstructed_in_script:
        - "Solved steady-state cellular PIN-permeability transport operator on a 32-row x 9-file lattice (`build_pin_lattice_operator`, `solve_cellular_auxin_steady_state`) with Law 1 counter-current flux and closed-operator mass conservation verified on the real operator (column-sum error < 1e-12); all six regimes EMERGENT: WT 113.6x shoot concentration at z = 52.5 um, shoot decapitation retaining 92.5 %, pin2 (v_e = 0) 0.46x WT, lateral-PIN ablation k_lat = 0 collapsing to 0.18x WT, NPA 1.10x shoot, QC laser ablation + Xu (2006) respecification regenerating the maximum at 112.5 um (+60 um)"
        - "Mähönen (2014) PLETHORA finite-volume solver on variable-length rows with meristem dilution ln2/17 h folded into turnover (`solve_plethora_gradient`, `zone_boundaries`): WT z_MZ = 240 um, z_EZ = 390 um; decap 225, pin2 120, k_lat = 0 45, NPA 480 (saturated, disclosed disagreement), ablation 255 um"
        - "Growing 9-file cellular lattice with explicit mitotic division of PLETHORA-high cells at 2 x birth length and auxin-independent elongation of PLETHORA-intermediate cells (`simulate_growing_cellular_lattice`): 23 divisions in 10 h, 26 meristem cells (ref 32 +- 6), 82 um/h growth (ref 180 +- 80, disclosed low), 0.958 cells/h/file (ref 1.5 +- 0.7)"
        - "Gravistimulation as a g-biased PIN3/PIN7 statocyte efflux split k_col(1 +- g) on the central columella files with Sachs sine law g = g_max sin(phi), auxin-inhibited epidermal elongation and a curvature integral with Band (2012) tipping-point reset at 40 degrees (`simulate_gravitropic_bending`): lateral auxin ratio 1.85 (ref 2.0 +- 0.7), tipping point reached at 5.55 h (ref 2 +- 1 h, disclosed slow), pin3 bending-rate fraction 0.52 (ref 0.5 +- 0.25)"
        - "Empirical CV segmentation of the 3-panel Arabidopsis root meristem confocal micrograph (`arabidopsis_root_meristem_specimen.jpg`, CC BY-SA 4.0, 1527x513 px): N = 113 DAPI nuclei, spacing 18.34 +- 0.58 px SE, apical/proximal nuclear density ratio 1.118 (unchanged from Pass 2)"
      transfer_boundary:
        - "Rectangular cellular compartments with uniform row lengths across the 9 files; growth and bending are reduced kinematic models (no wall mechanics, no vertex/CPM), and the Pass-1 reference-table six-regime values are synthetic calibration targets, not digitised paper data"
      does_not_claim:
        - "Vertex or Cellular Potts wall mechanics, cell-wall viscoplasticity, 3D curvature, quantitative reproduction of digitised Grieneisen (2007) or Mähönen (2014) figure data, or quantitative model-to-micrograph matching beyond order-of-magnitude meristem cell number"
    source_refs:
      - grieneisen2007
      - mahonen2014
      - blilou2005
      - sabatini1999
      - friml2002
      - band2012
      - kleinevehn2010
      - beemster1998
      - delloioio2007
      - xu2006
    summary: >-
      Pass 3 (v3) evaluation of `2014-grieneisen-root-auxin-reflux-fountain.py` (overall
      weighted score 91.5/100, down from 93.2/100 in v2). The v2 field was assembled from
      hard-coded reference-table amplitudes (circular r = 1.0); Pass 3 solves the Grieneisen
      cellular PIN-permeability operator as a sparse linear steady state so that all six regimes
      are emergent (WT 113.6x at z = 52.5 um, decapitation retention 0.925, k_lat = 0 0.18x WT,
      NPA 1.10x, QC ablation regenerating at 112.5 um), feeds it to the Mähönen PLETHORA
      finite-volume solver (WT z_MZ = 240 um, z_EZ = 390 um), and closes the v2 remediation
      item in reduced form with a growing dividing cellular lattice (23 divisions, 26 meristem
      cells, 82 um/h) and gravistimulated PIN3/PIN7 statocyte asymmetry driving sine-law bending
      with a Band (2012) tipping-point reset (lateral ratio 1.85, tipping at 5.55 h, pin3 0.52x).
      Six Lean 4 theorems (3 new) verify the laws; 16 reference-anchored measurements, a 14-check
      self-test, 10 DOI-verified references and 5 SHA-256-pinned dataset files back the package.
      Disagreements with literature anchors (tipping point ~2.8x too slow, growth rate ~2x too
      low, NPA z_MZ saturating instead of collapsing) are disclosed rather than tuned away.
    scores:
      model-fidelity:
        value: 92
        rationale: >-
          The Grieneisen (2007) cellular PIN-permeability reflux model is now actually solved
          (`build_pin_lattice_operator` L178-288 assembles the sparse operator with rootward
          stele, shootward epidermal, inward lateral and apolar columella permeabilities, passive
          exchange, turnover and the shoot source; `solve_cellular_auxin_steady_state` L291-295),
          the Mähönen (2014) PLETHORA solver runs on variable-length rows with growth dilution
          (`solve_plethora_gradient` L334-362), the growing lattice divides cells explicitly
          (`simulate_growing_cellular_lattice` L542-636) and gravistimulation is a g-biased
          statocyte efflux split (L253-263) feeding sine-law bending (`simulate_gravitropic_bending`
          L641-716). Six machine-checked Lean 4 theorems (0 sorrys) cover the laws. Two points
          below v2 because the v2 remediation asked for vertex/CPM mechanics and the delivered
          growth/bending are reduced kinematic models with uniform row lengths and an imposed
          40 degree tipping point.
        evidence:
          - {file: 2014-grieneisen-root-auxin-reflux-fountain.py, lines: [178, 288], note: "Sparse cellular PIN-permeability steady-state operator (Grieneisen 2007) with g-biased PIN3/PIN7 statocyte split at L253-263 and QC/columella respecification for ablation", supports: true}
          - {file: 2014-grieneisen-root-auxin-reflux-fountain.py, lines: [334, 372], note: "Mähönen (2014) PLETHORA finite-volume Helmholtz / implicit-Euler solver on variable-length rows and zone_boundaries thresholds Theta_MZ / Theta_EZ", supports: true}
          - {file: 2014-grieneisen-root-auxin-reflux-fountain.py, lines: [542, 636], note: "Growing cellular lattice with explicit mitotic division at 2 x birth length, PLT-gated elongation and mature-row shedding", supports: true}
          - {file: 2014-grieneisen-root-auxin-reflux-fountain.py, lines: [641, 716], note: "Gravistimulated bending: Sachs sine law, auxin-inhibited epidermal elongation with first-order lag, curvature integral and Band (2012) tipping-point reset; reduced kinematics, not vertex/CPM", supports: true}
          - {file: morphoeval/lean/loops/Loop_038_root_auxin_reflux_fountain.lean, lines: [31, 229], note: "6 Lean 4 theorems: reflux conservation, QC capacitor vs collapse, PLT boundary monotonicity, gravistimulated efflux asymmetry (L147-176), PLT growth-dilution monotonicity (L188-203), mitotic division length conservation (L213-229); 0 sorrys", supports: true}
      specimen-match:
