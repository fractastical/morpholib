          - {file: docs/media/root_auxin_reflux_fountain_comparison.png, lines: [0, 0], note: "9-panel figure: solved WT lattice, ablation regeneration, 6-regime axial profiles, emergent vs synthetic-table QC amplitudes, zone boundaries, growing lattice, bending kinetics, parameter sweeps, confocal specimen overlay", supports: true}
          - {file: datasets/root_auxin_reflux_fountain/README.md, lines: [20, 30], note: "Dataset README disclosing that the six-regime reference-table values are Pass-1 synthetic calibration targets, not digitised paper data", supports: false}
