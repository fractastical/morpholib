    claim_boundary:
      reported_in_source:
      - Turing (1952) selects a finite wavenumber. Schnakenberg (1979) supplies the kinetics. Carbone et al. (2005),
        Llopart et al. (2002) and Wittkopp et al. (2002) supply the yakuba pigmentation biology and the Yellow/Ebony
        antagonism.
      reconstructed_in_script:
      - Discrete dispersion test (r = 0.995), equal-diffusion ablation (σ* = −0.102), monotone D_v sweep, and a
        spiral Schnakenberg integration whose FFT ring is the reported wavelength.
      - Radial arm-to-arm periods replace the pass-1 bead nearest-neighbour distance. The bead KS (0.592) is kept
        only as ks_pass1_nearest_neighbour.
      transfer_boundary:
      - Periodic boundaries still bead the spiral where it meets the opposite edge. Ratio statistics cross to the
        specimen; pixel bin indices do not, because the specimen is 800×600 and the GIF is 640×480.
      does_not_claim:
      - Does not claim a measured 2.2 µm granule spacing in Carbone et al. The 2.157 µm figure is the selected wavelength
        of this reconstruction.
      - Does not claim the gallery JPEG is a light micrograph of yakuba cuticle. It is the project species-gallery
        canonical asset, SHA-256 pinned.
      - No successor chronospecies. The only comparison is to D. willistoni at 86 µm (ratio 40.01).
