      reported_in_source:
      - 'Milne-Edwards & Haime (1848): hexameral cyclic septal insertion N_hex(k) = 6 * 2^(k-1) with decreasing
        radial reach of successive cycles'
      - 'Kunth (1869): Paleozoic Rugosa serial insertion in four fossular loci, N_rugosa(m) = 6 + 4m'
      - 'Chindapol et al. (2013): advection-diffusion limited accretive growth of Pocillopora verrucosa with upstream-polarised
        growth under unidirectional flow and symmetric, compact growth under bidirectional (surge) flow'
      - 'Wells (1956) Treatise Part F: solitary corallum shape classes by apical angle (ceratoid, trochoid, turbinate,
        patellate) and the endothecal elements dissepiments and synapticulae'
      - 'Keulegan & Carpenter (1958): the ratio U_max T / L governing oscillatory-flow forces on bodies; Falter
        et al. (2005) and Reidenbach et al. (2006): oscillatory flow enhances mass transfer to reef corals relative
        to unidirectional flow at the same speed'
      reconstructed_in_script:
      - 2D calice insertion with perimeter-threshold triggering 2 pi R_k = N_hex(k) lambda_s, Kunth Rugosa comparison,
        a phenomenological boundary-layer flux law j(theta) = j0 (1 + beta sqrt(Pe) cos theta + gamma Pe/(1+Pe)
        cos 2theta) with Pe = 0 symmetry control, a reduced kinematic 3D conical corallum (cylindrical label volume)
        with stacked insertion fronts, pali, dissepiments and synapticulae ablated at fixed outer geometry, specimen-measured
        apical angle (side-profile cone fit) and septal thickness (0.80 R duty cycle), Otsu calice area fraction,
        an oscillatory surge quasi-steady closure with sgn(U) dipole and a renewal law eta(KC) = 1 - exp(-KC/2pi),
        KC sweep and reef KC estimates
      transfer_boundary:
      - 'The 3D corallum is kinematic (labels assigned from the cone profile), not accretive growth or mechanics;
        dissepiment/synapticula spacings and thicknesses are modelling choices tagged `provenance: model`'
      - The quasi-steady surge closure gives <sqrt(Pe(t))>/sqrt(Pe_max) = 0.763 < 1, i.e. it cannot reproduce the
        oscillatory mass-transfer ENHANCEMENT of Falter 2005 / Reidenbach 2006; only the symmetry (dipole cancellation)
