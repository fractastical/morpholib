simulations:
  - id: delphi10000-aulacopleura-koninckii-holaspis18-turing-wavelength-s0
    name: "Turing wavenumber at 15.49 µm on Aulacopleura koninckii holaspis18 (428.3 Ma)"
    organism: "Aulacopleura koninckii_holaspis18"
    domain: morphogenesis
    script: models/2026-delphi10000-aulacopleura-koninckii-holaspis18-turing-wavelength-s0.py
