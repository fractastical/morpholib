    scores:
      model-fidelity:
        value: 88
        rationale: "The script solves k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v) for lambda_c = 15.49 µm and checks trace < 0, det > 0, and the diffusion-ratio numerator. Euler integration of the Fourier symbol tracks the analytical growth rate (r = 0.9948). Cubic saturation is a closure, not Schnakenberg's full mass-action system."
        evidence:
          - {file: models/2026-delphi10000-aulacopleura-koninckii-holaspis18-turing-wavelength-s0.py, lines: [79, 111], note: "diffusivities() solves D_u at ratio 40; critical_k and sigma_of_k are the dispersion law", supports: true}
          - {file: models/2026-delphi10000-aulacopleura-koninckii-holaspis18-turing-wavelength-s0.py, lines: [43, 52], note: "Jacobian and 15.49 µm target, distinct from the 544 µm sibling", supports: true}
      specimen-match:
        value: 82
        rationale: "The 12-frame 720×540 GIF keeps the Commons matrix and paints an 18-segment rib carrier inside a geometric oval. Computer-vision similarity of the last frame to the photograph is 86.0. The oval is not the trilobite outline, so the match is photometric more than anatomical."
        evidence:
          - {file: docs/media/aulacopleura_koninckii_holaspis18_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame growth GIF, 720×540, last-frame CV similarity 86.0", supports: true}
          - {file: models/2026-delphi10000-aulacopleura-koninckii-holaspis18-turing-wavelength-s0.py, lines: [365, 370], note: "Pass-1 geometric oval mask", supports: true}
      parameter-expressivity:
        value: 86
        rationale: "Multiplying both diffusivities by alpha in {0.25, 0.5, 1, 2, 4} moves lambda_c monotonically as 15.49*sqrt(alpha) (Pearson r > 0.98). Setting D_v = D_u closes the Turing band (max Re sigma < 0). Segment count changes N at fixed k_c across the chronoseries."
        evidence:
