    claim_boundary:
      reported_in_source:
        - "Hughes & Chapman 1995 and Fusco et al. 2004: Aulacopleura konincki adds thoracic segments through the meraspid period and holaspids vary in segment number, including an 18-segment morphotype."
        - "Fusco, Hong & Hughes 2016: axial growth gradients make trunk pitch non-uniform."
        - "Turing 1952: a reaction-diffusion instability selects a finite critical wavelength."
        - "Commons File:Aulacopleura konincki.jpg is a 14 mm Silurian specimen, CC BY-SA 3.0."
      reconstructed_in_script:
        - "Jacobian entries, diffusion ratio 40, and D_u solved so lambda_c = 15.49 µm (1.549e-05 m) at 428.3 Ma."
        - "Rib-span fraction 0.2245 measured on the pinned photograph and applied to the 4.2 mm meraspis and 22 mm holaspis22 characteristic lengths."
        - "Mode counts 5, 11 and 14 repeats of 15.49 µm per pitch."
        - "Sixteen-mode Fourier fit to the photograph's axial rib profile (Pearson r = 0.9832)."
      transfer_boundary:
        - "The species_gallery meraspis, holaspis18 and holaspis22 JPEGs are byte-identical, so predecessor and successor pitches are not re-measured on separate fossils."
        - "The 15 µm carrier is painted at the photograph's resolved rib wavenumber; the photograph does not resolve a 15 µm lattice."
      does_not_claim:
        - "Does not claim a measured holochroal lens diameter of 15.49 µm for this species."
        - "Does not claim the geometric oval is a segmented cuticle outline."
        - "Does not claim an independent second assessor."
