    source_refs: [turing1952, schnakenberg1979, fusco2004, hughes1995, fusco2016]
    summary: >-
      Linear Turing wavelength is solved so lambda_c = 15.49 µm at D_v/D_u = 40
      with the holaspis18 Jacobian (trace -0.56 s^-1, det > 0). Explicit Euler
      matches the analytical dispersion at Pearson r = 0.9948. Equal diffusion
      is a negative control (max Re sigma = -0.048 s^-1). Repeats of that
      wavelength per thoracic pitch are 5 (meraspis, 428.5 Ma), 11 (this
      18-segment holaspid, 428.3 Ma) and 14 (holaspis22, 428.1 Ma). The 14 mm
      Commons photograph's rib span gives an in-sample 16-mode Pearson r = 0.9832.
      The growth GIF is 12 frames at 720×540. The cuticle carrier is still
      painted inside a geometric oval rather than a segmented outline.
