measurements:
  diaza-human-somite-organoid-clock:
  - name: human vs mouse HES7 segmentation clock period ratio T_human / T_mouse
    value: 2.4591
    unit: dimensionless ratio
    method: ratio of human WT iPSC-PSM period (300.01 min) to mouse WT PSM period (122.00 min) in the delayed HES7
      TTFL DDE solver (exact rescaling collapse std = 2.32e-13 nM)
    reference_value: 2.459
    reference_source: Diaz-Cuadros et al. (2020) Nature 580:113-118 Fig. 2; Matsuda et al. (2020) Science 369:1450-1455
      Fig. 1 (300 min / 122 min = 2.459)
    note: intronless Hes7 Delta-intron1-3 ablation collapses to T = 0.0 min (sustained=False)
    derived_from: script
  - name: human pluripotent stem-cell PSM HES7-Achilles oscillation period T_human
    value: 300.01
    unit: min
    method: 'parabolic peak-refined limit-cycle period of human WT HES7 DDE (mouse-WT anchor dilated by lam_eff
      = 300/122: tau_tx = 30.5 min, tau_tl = 13.1 min, t_{1/2,p} = 38.1 min, t_{1/2,m} = 35.9 min)'
    reference_value: 300.0
    reference_source: Diaz-Cuadros et al. (2020) Nature 580:113-118 Fig. 2d (human segmentation clock period 300
      +/- 18 min = 5.0 h)
    note: LbNOX NAD+ elevation accelerates human period to 227.8 min; sodium azide ETC inhibition slows period to
      396.8 min
    derived_from: script
  - name: 6-regime HES7 genetic & metabolic perturbation series Pearson correlation r
    value: 0.9999
    unit: Pearson r
    method: correlation between DDE-predicted and empirical oscillation periods across 6 Matsuda (2020) & Diaz-Cuadros
      (2020, 2023) regimes (RMSE = 2.18 min)
    reference_value: 1.0
    reference_source: Matsuda et al. (2020) Science 369:1450-1455 Figs. 1-4; Diaz-Cuadros et al. (2023) Nature 613:550-557
      Figs. 2-4
    note: p = 5.90e-09; mouse hHES7 knock-in swap period = 135.1 min vs 134.0 min observed
    derived_from: script
  - name: 6-species vertebrate segmentation clock delay-turnover allometry Pearson r
    value: 0.997
    unit: Pearson r
    method: correlation between HES7 DDE predicted and empirical clock periods across 6 vertebrate species (zebrafish
      30 min to human 300 min, RMSE = 14.24 min)
    reference_value: 1.0
    reference_source: Diaz-Cuadros et al. (2020) Nature 580:113-118; Matsuda et al. (2020) Science 369:1450-1455;
      Lazaro et al. (2023) Nat. Ecol. Evol. 7:1107-1118
    note: linear allometric slope vs (tau + t_1/2,p) = 3.334 (r = 0.9955, p = 3.08e-05)
    derived_from: script
  - name: vertebrate somite/PSM specimen bilateral somite spacing S_obs
    value: 47.1429
    unit: px
    method: bilateral dorsal somite row DoG peak segmentation on human_somite_organoid_specimen.jpg (upper=8 somites,
      lower=8 somites, CV=0.2010)
    reference_value: 47.14
    reference_source: Vendored CC BY 4.0 vertebrate embryo SEM specimen (datasets/human_somite_organoid_clock/human_somite_organoid_specimen.jpg)
    note: bilateral symmetry ratio = 1.0061, std = 9.48 px, phase correlation r = 0.4795
    derived_from: output
  - name: DLL1-Notch coupled hexagonal PSM lattice Kuramoto order parameter R after DAPT washout (6 cycles)
    value: 0.85
    unit: Kuramoto R (dimensionless)
    method: 12x12 odd-r hexagonal lattice of delay-coupled HES7 TTFL cells (eps = 0.25, tau_c = 240 min = 0.80 T,
      5 % cell-autonomous tempo CV); mean R over the last cycle of a 6-cycle post-washout window; coupling-ablated
      control R = 0.2085 (synchrony lost, R < 0.5, after 2.99 cycles)
    reference_value: 1.0
    reference_source: Matsuda et al. (2020) Nature 580:124-129 (DAPT pulse-washout synchronises culture-level HES7
      oscillations; R = 1 is perfect in-phase synchrony); Riedel-Kruse et al. (2007) Science 317:1911-1915 (Notch-inhibition
      desynchronisation)
    note: pre-DAPT R from random phases after 5 coupled cycles = 0.396 (R_0 = 0.188); DAPT amplitude ratio = 0.166
      (collapse); coupling gain in R = 0.641; R_end vs eps Spearman rho = 0.66 over eps in [0.0, 0.05, 0.1, 0.15,
      0.25, 0.35]
    derived_from: script
  - name: post-washout collective period of the Notch-coupled lattice T_coll
    value: 298.22
    unit: min
    method: tissue-mean HES7 peak-to-peak period over the last 4.5 post-washout cycles (restart transient excluded);
      exact mean-field reduction at tau_c = 0.8 T gives 299.9 min; Herrgen (2010) delay sweep spans 235-417 min
      over tau_c/T in [0, 0.95]
    reference_value: 300.0
    reference_source: Diaz-Cuadros et al. (2020) Nature 580:113-118 Fig. 2d (human segmentation clock period 300
      +/- 18 min); Herrgen et al. (2010) Curr. Biol. 20:1244-1253 (coupling delay sets the collective period)
    note: in-phase state stable (R_end >= 0.85) for tau_c/T in [0.625, 0.75, 0.8, 0.875, 0.95]; single-cell period
      = 300.01 min
    derived_from: script
  - name: Matrigel-embedded (10 %) axioloid somite rosette radial apical-polarity order P_rad
