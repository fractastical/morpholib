      - tau_c = 0.8 T (240 min) is an assumption from delayed-coupling-theory stability, not a human measurement;
        the DAPT basal promoter fraction b = 0.1 and the competitive-promoter gate (synthesis and threshold both
        scaled by (1 - eps) + 2 eps S) are modelling reductions
      - Matrigel stiffness kappa = 0.01 min^-1 per % and the polarisation / constriction rate constants are phenomenological;
        the rosette reference values (P_rad = 1, contrast = 1) are geometric ideals, not measured organoid morphometrics
      does_not_claim:
