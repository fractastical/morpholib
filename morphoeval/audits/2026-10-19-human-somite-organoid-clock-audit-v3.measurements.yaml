      - 'Matsuda et al. (2020) Nature 580:124-129: a DAPT pulse followed by washout synchronises HES7 oscillations
        across hPSC-derived PSM cultures; Riedel-Kruse et al. (2007) Science: Notch inhibition desynchronises segmentation
        clock cells; Herrgen et al. (2010) Curr. Biol.: delayed intercellular coupling sets the collective period'
      - 'Yamanaka et al. (2023) Nature 614:509-520 and Sanaki-Matsumiya et al. (2022) Nat. Commun. 13:2325: epithelial
        somite rosettes form only in Matrigel-embedded human axioloids / somitoids (qualitative)'
      reconstructed_in_script:
      - Delayed autoinhibitory HES7 TTFL RK2 DDE solver (mouse WT 122.00 min; rescaled 'human' cell 300.01 min),
        exact tempo-rescaling collapse across lambda in [1, 3] (max std 2.32e-13 nM), intronless-Hes7 subcritical
        collapse, and a 6-regime series whose per-regime tempo factors are hard-coded from the observed periods
        (Pearson r = 0.9999 is a calibration, not a prediction)
      - 6-species vertebrate clock allometry (r = 0.9970) from a vendored species table of delays/half-lives, a
        kinematic (not DDE-derived) axioloid phase-wave kymograph, and bilateral DoG somite segmentation on a chick
        embryo SEM (47.14 px mean spacing, CV 0.2010)
      - 'Pass 3: DLL1-Notch delay-coupled HES7 lattice (12 x 12 hex, eps = 0.25, tau_c = 0.8 T, 5 % tempo CV) through
        the DAPT pulse-washout protocol: R_0 = 0.19 -> R_pre = 0.40 after 5 coupled cycles; DAPT amplitude ratio
        0.17; washout reset R = 0.9995; R retained after 6 cycles = 0.85 (coupled) vs 0.21 (coupling-ablated, lost
        at 3.0 cycles); T_coll = 298.2 min; in-phase stable for tau_c/T in [0.625, 0.95]; T_coll(tau_c) spans 235-417
        min; R_end(eps) 0.26 -> 0.96 (eps 0 -> 0.25), 0.88 at 0.35'
      - 'Pass 3: reduced 2D cell-centre Matrigel rosette model: P_rad = -0.08 (0 %) -> 0.99 (10 %), epithelial fraction
        0 -> 0.67, aggregate radius 85 -> 28 um, Matrigel sweep Spearman rho = 0.94'
      transfer_boundary:
      - Single-cell / lattice HES7 DDE kinetics are compared with a chick (Gallus gallus) dorsal SEM, not with a
        human axioloid image; the 47.14 px 'reference' spacing is the script's own measurement recorded in the dataset
