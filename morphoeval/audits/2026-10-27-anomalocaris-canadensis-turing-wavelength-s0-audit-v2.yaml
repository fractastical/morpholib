simulations:
  - id: delphi10000-anomalocaris-canadensis-turing-wavelength-s0
    name: "Anomalocaris canadensis Turing wavenumber k_c at 24 µm (508 Ma)"
    organism: "Anomalocaris canadensis"
    script: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py
    output: docs/media/anomalocaris_canadensis_turing_wavelength_s0_comparison.png
    also:
      - docs/media/anomalocaris_canadensis_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-anomalocaris-canadensis-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, gierer1972, paterson2011, daley2014, vanroy2011, lubensky2011]
    summary: >-
      Pass 2 accepts the Du sweep (lambda_c from 5.93 to 10.73 cells, monotonic),
      the equal-diffusion ablation (std ratio about 0.0026), the Tyrrell-cast
      segmentation (foreground 0.589, circularity 0.303, coherency 0.559), and
      the stencil-versus-numerical growth-rate fit (Pearson r = 0.999989,
      RMSE = 0.00626, KS D = 0.071 against a zero-growth null of 0.714).
      The 508 Ma wavelength remains 2.397e-05 m, below the reconstructed
      266 µm Emu Bay facet spacing. What changes at the Ordovician successor
      is body size, not this cellular wavenumber.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: instability at a finite wavenumber when the inhibitor diffuses sufficiently faster than the activator."
        - "Paterson et al. 2011: 2-3 cm eyes, at least 16000 lenses, Emu Bay Shale, about 515 Ma."
        - "Daley and Edgecombe 2014: stalked eyes on Burgess Shale A. canadensis."
        - "Van Roy and Briggs 2011: Fezouata bodies larger than any Cambrian anomalocaridid, 488-472 Ma."
      reconstructed_in_script:
        - "k_c^2 = (Dv f_u + Du g_v) / (2 Du Dv) with f_u = 0.8 and g_v = -1, pinned so lambda_c = 2.397e-05 m."
        - "Facet spacing reconstructed from the published diameter and lens count, not measured on a lens row."
        - "Cast segmentation: border-contrast mask, circularity, structure-tensor coherency."
      transfer_boundary:
        - "The 24 µm mode is a model scale inside a facet. The Tyrrell photograph is a cast about 20 cm long and does not resolve that mode."
        - "Schnakenberg a and b are a spot-capable regime, not a fitted anomalocaridid rate."
      does_not_claim:
        - "That Burgess Shale pigment chemistry followed these rate constants."
        - "That the Drosophila switch-and-template R8 circuit (Lubensky et al. 2011) operated in A. canadensis."
        - "A second chronospecies of A. canadensis. The series index is 1/1; Emu Bay and Fezouata are lineage brackets."
    scores:
      model-fidelity:
        value: 90
        rationale: "The code integrates the Schnakenberg PDE, evaluates the Turing discriminant, and checks the discrete growth rate against the stencil symbol at 14 wavenumbers (r = 0.999989). The kinetics are the standard spot system, not a rate law measured on this fossil."
        evidence:
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [83, 172], note: "turing_margin, sigma_discrete, sigma_numeric, dispersion_goodness_of_fit", supports: true}
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [180, 214], note: "Neumann Schnakenberg step and linear ablation branch", supports: true}
      specimen-match:
        value: 84
        rationale: "The comparison plate and the 12-frame GIF use the CC BY-SA Tyrrell cast as the organism image, with the activator grown in a footer strip and as a light registration on the slab. The shale itself does not display 24 µm ocelli, so the match is the animal plus an explicit scale-separated field, not a photographic twin of a pigment pattern."
        evidence:
          - {file: docs/media/anomalocaris_canadensis_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "four-panel plate", supports: true}
          - {file: docs/media/anomalocaris_canadensis_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "720x540, 12 frames, spot strip grows along the footer", supports: true}
          - {file: datasets/anomalocaris_canadensis_turing_wavelength_s0/anomalocaris_canadensis_TMP2023_003_0003_tyrrell.jpg, lines: [0, 0], note: "TMP 2023.003.0003 cast", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "Scaling both diffusivities from 0.55 to 1.80 moves analytical lambda_c monotonically from 5.93 to 10.73 cells, and every scale stays Turing-unstable. Setting Du = Dv makes the discriminant negative and the field std collapses (ratio about 0.0026)."
        evidence:
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [216, 232], note: "parameter_sweep", supports: true}
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [567, 604], note: "self-test gates on monotonicity and ablation std", supports: true}
      morphometric-validation:
        value: 91
        rationale: "Pearson r = 0.999989 against a perfect-agreement reference of 1, RMSE = 0.00626 against 0, and KS D = 0.071 against a zero-growth null of 0.714. The cast mask is not a circle (circularity 0.303 versus 1) and the slot wavelength is 0.090 of the reconstructed 266 µm facet spacing versus a ratio of 1."
        evidence:
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [149, 172], note: "Pearson, RMSE, KS", supports: true}
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [234, 266], note: "segment_specimen", supports: true}
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [466, 565], note: "measure_morphoeval rows, values differ from references", supports: true}
      source-traceability:
        value: 92
        rationale: "Seven Crossref-checked DOIs, a SHA-256 pin of the Commons file, catalogue TMP 2023.003.0003 / ROMIP 51211, CC BY-SA 4.0, artist Chris Woodrich. The scout note records the OpenAlex 429."
        evidence:
          - {file: datasets/anomalocaris_canadensis_turing_wavelength_s0/paper_citations.bib, lines: [1, 79], note: "bibliography", supports: true}
          - {file: datasets/anomalocaris_canadensis_turing_wavelength_s0/scout_manifest.json, lines: [1, 40], note: "slot, scale 2.397e-05 m, age 508 Ma, uniqueness", supports: true}
          - {file: datasets/anomalocaris_canadensis_turing_wavelength_s0/README.md, lines: [1, 37], note: "scale and age stated in the dataset readme", supports: true}
      code-traceability:
        value: 86
        rationale: "Each scored closure is a named function with a docstring that points at the law. The Lean file proves the integer forms of the trace sign, the diffusion-ratio gate, the sub-facet inequality, and the age order. There is no line-by-line map onto Turing's 1952 section numbers."
        evidence:
          - {file: morphoeval/lean/loops/Loop_3113_anomalocaris_canadensis_turing_wavelength_s0.lean, lines: [1, 61], note: "seven theorems, zero sorry", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-anomalocaris-canadensis-turing-wavelength-s0.yaml, lines: [1, 40], note: "law records for k_c and the chronoseries inequality", supports: true}
      repro-package:
        value: 90
        rationale: "python3 script --self-test checks trace, determinant, discriminant, slot length, equal-diffusion stability, Pearson r > 0.98, monotonic sweep, sub-facet inequality, age order, segmentation, and ablation std. Seed 3113. Dependencies are the repo scientific stack (numpy, scipy, pillow, matplotlib)."
        evidence:
          - {file: models/2026-delphi10000-anomalocaris-canadensis-turing-wavelength-s0.py, lines: [567, 649], note: "self_test and main", supports: true}
    remediation:
      - "R5 (open): only one photographed object, and it is a museum cast rather than the original Burgess surface. A second specimen would test whether the mask statistics are about this mount."
      - "R6 (open): a and b are a spot-capable regime, not rates measured on anomalocaridid cuticle. No 24 µm pigment map exists to fit them to."
      - "R7 (open): single assessor. A second provider has not scored this audit."
