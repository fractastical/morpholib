    claim_boundary:
      reported_in_source:
      - 'Hentschel et al. (2004): a 4-field TGF-beta activator / FGF-dependent inhibitor / fibronectin / mesenchymal-cell-density
        reaction-diffusion-haptotaxis system whose AER-FGF-modulated unstable wavenumber increases proximodistally,
        giving 1 -> 2 -> 3 skeletal elements'
      - 'Kiskowski et al. (2004): discrete cells on a lattice with a continuous activator/inhibitor prepattern,
        activated cells deposit fibronectin and bind to it, producing autonomous condensations; Chaturvedi et al.
        (2005): the same scheme realised in a GGH cellular Potts framework (CompuCell)'
      - 'Graner & Glazier (1992) / Glazier & Graner (1993): differential adhesion with J_dd < J_ld < J_ll < J_cM
        at T = 10 sorts cells; heterotypic boundary length decreases'
      - 'Miura & Shiota (2000): exogenous TGF-beta2 fuses micromass condensations into bar-like patterns; anti-fibronectin
        treatment blocks condensation'
      reconstructed_in_script:
      - Linear dispersion of the activator/inhibitor subsystem, 1D and 2D (x, z) pseudo-spectral IMEX integration
        of the 4-field system with zero-flux boundaries, 2D periodic micromass morphospace with volume-filling haptotaxis,
        dual negative controls, a GGH cellular Potts lattice coupled through the PDE's Hill switch and a two-way
        fibronectin field, four GGH regimes plus a wing-bud GGH run, specimen segmentation of a Gallus wing, 14
        measurements, 5 Lean 4 theorems
      transfer_boundary:
      - Kiskowski et al. (2004) is a lattice-cell / biased-random-walk model, not a cellular Potts model; the GGH
        realisation follows Chaturvedi et al. (2005), as the Pass 2 remediation item requested, and the dataset
        JSON says so
      - 'The 1D stage and 2D wing continuum solutions are chemotactically collapsed (clip_fraction_R = 1.00 at fa
        = 11, 18; 0.52 at fa = 6; 0.193 in 2D): condensation counts are reproduced but amplitudes, std(R) and F-R
        correlations are clip-determined'
      - GGH references are internal (continuum ratio, ablation value, adopted thresholds) because the cited discrete-model
        papers do not report the metrics used here
      does_not_claim:
      - A hexagonal nodular-spot micromass regime (both resolved continuum regimes are labyrinthine), a discrete
        stylopod condensation (GGH gives [0, 2, 3]), quantitative agreement with Kiskowski et al. (2004) condensation
        sizes, a sequential (exact-volume) cellular Potts update, 3D geometry, limb outgrowth, or cell division
