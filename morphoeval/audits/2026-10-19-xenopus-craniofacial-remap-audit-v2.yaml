        rationale: >-
          Simulates all 6 canonical regimes from Vandenberg et al. (2012) and Pinet et al.
          (2019) (`wild_type_unperturbed_remodeling`, `picasso_scrambled_craniofacial_closed_loop`,
          `caudal_lateral_eye_rotation_closed_loop`, `lateral_jaw_mouth_translocation_closed_loop`,
          `open_loop_fixed_displacement_null`, and `mmp_inhibitor_gm6001_blockade_ablation`),
          evaluates organ migration speed vs defect distance across 20 landmark trajectories
          (`r = 0.9495`, Panel B2), and maps the 15x15 (perturbation scale, MMP mobility)
          morphospace (Panel B3).
        evidence:
          - {file: 2019-bischof-xenopus-craniofacial-remap.py, lines: [255, 297], note: "6-regime evaluator, 20-landmark speed-vs-defect scaling, and 15x15 morphospace sweep", supports: true}
      morphometric-validation:
