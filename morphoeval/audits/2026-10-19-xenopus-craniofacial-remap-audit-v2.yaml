simulations:
  - id: bischof-xenopus-craniofacial-remap
    name: "Vandenberg, Adams & Levin (2012) & Pinet et al. (2019) Picasso tadpole craniofacial attractor remodeling"
    organism: "Xenopus laevis African clawed frog tadpole and froglet"
    script: 2019-bischof-xenopus-craniofacial-remap.py
    output: docs/media/xenopus_craniofacial_remap_comparison.png
    extra_outputs:
      - docs/media/xenopus_craniofacial_remap_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Vandenberg, Adams & Levin (2012) Dev. Dyn. 241:863-878 craniofacial landmark tracking of eyes, nostrils/nares, and jaws across Nieuwkoop-Faber stages 45 to 65 showing goal-directed 'Picasso tadpole' normalization to froglet anatomy vs open-loop fixed-displacement vector failure"
        - "Proportional organ migration velocity scaling with displacement distance from target morphology (Vandenberg et al. 2012 Fig. 6) and restoration of bilateral facial symmetry"
        - "Pinet et al. (2019) Development 146:dev175893 thyroid-hormone-independent pre-metamorphic craniofacial remodeling and arrest under matrix metalloproteinase (MMP) inhibition (GM6001)"
      reconstructed_in_script:
        - "Coupled 5-landmark Procrustes attractor ODE dx_i/dt = eta_MMP * [-K_i*(x_i - x_i^*) - sum_j C_ij*((x_i - x_j) - (x_i^* - x_j^*))] integrated via RK4 across NF stages 45->65 for 6 experimental regimes plus a 15x15 (alpha_pert, eta_MMP) morphospace grid"
        - "Automated PCA craniofacial axis, snout apex, 40-bin dorsal head width profile (r=0.9114), and bilateral dorsolateral eye detection (N=2 eyes, |Delta s|=0.0023) on xenopus_craniofacial_specimen.jpg"
      transfer_boundary:
        - "2D dorsal Procrustes craniofacial landmark coordinates (left/right eye, left/right naris, jaw midpoint) and reconstructed froglet head contour compared against dorsal Xenopus laevis specimen geometry"
      does_not_claim:
        - "3D finite-element cartilage biomechanics of Meckel's/palatoquadrate chondrocytes or explicit collagen-I fibril cleavage kinetics"
    source_refs:
      - vandenberg2012
      - pinet2019
      - pezzulo2016
      - pai2012
    summary: >-
      Pass 2 post-remediation evaluation of `2019-bischof-xenopus-craniofacial-remap.py`
      (92.1/100, up from 57.8/100 in Pass 1; +34.3 overall). The remediated script
      integrates the coupled 5-landmark Procrustes attractor ODE with inter-organ relational
      spring coupling C_ij via 4th-order Runge-Kutta across Nieuwkoop-Faber stages 45->65,
      proving strict monotonic Lyapunov energy decay V(X) -> 0 and reproducing all 6
      canonical Vandenberg et al. (2012) and Pinet et al. (2019) regimes: Wild-Type
      remodeling (`D_P = 0.0005`), Picasso scrambled closed-loop (`D_P = 0.0009`, bilateral
      asymmetry `0.715 -> 0.0002`, 99.97% symmetry restoration), Caudal lateral eye
      rotation (`D_P = 0.0007`), Lateral jaw/mouth translocation (`D_P = 0.0007`),
      Open-loop fixed-vector null hypothesis (`D_P = 0.3439`, preserving exact initial
      defect), and GM6001 MMP inhibition blockade (`D_P = 0.2775`), alongside linear
      velocity-vs-defect scaling (`r = 0.9495`) and empirical CV segmentation of bilateral
      eyes (`N = 2`, `|Delta s| = 0.0023`) and head width (`r = 0.9114`) on
      `xenopus_craniofacial_specimen.jpg`, backed by 3 machine-checked Lean 4 theorems in
      `Loop_085_xenopus_craniofacial_remap.lean`.
    scores:
      model-fidelity:
        value: 94
        rationale: >-
          Faithfully implements the coupled Procrustes landmark attractor ODE
          dx_i/dt = eta_MMP * [-K_i*(x_i - x_i^*) - sum_j C_ij*((x_i - x_j) - (x_i^* - x_j^*))]
          with RK4 integration, exact Procrustes Lyapunov energy functional V(X) (L72-195),
          and exact spectral propagator across the 15x15 (alpha_pert, eta_MMP) morphospace
          (L235-295), verified by 3 standalone Lean 4 theorems (0 sorrys) in
          `morphoeval/lean/loops/Loop_085_xenopus_craniofacial_remap.lean`.
        evidence:
          - {file: 2019-bischof-xenopus-craniofacial-remap.py, lines: [72, 165], note: "Inter-organ coupling matrix C_ij, Procrustes Lyapunov functional V(X), and closed-loop attractor RHS", supports: true}
          - {file: 2019-bischof-xenopus-craniofacial-remap.py, lines: [168, 252], note: "RK4 Procrustes landmark integrator across NF stages 45->65 vs open-loop vector null model", supports: true}
          - {file: morphoeval/lean/loops/Loop_085_xenopus_craniofacial_remap.lean, lines: [18, 129], note: "3 machine-checked Lean 4 theorems (0 sorrys) for Lyapunov decrease, open-loop divergence/MMP arrest, and bilateral symmetry restoration", supports: true}
