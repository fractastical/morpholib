        rationale: >-
          Vendors and SHA-256-verifies the CC BY 4.0 dorsal whole-mount photograph of
          Xenopus laevis (`datasets/xenopus_craniofacial_remap/xenopus_craniofacial_specimen.jpg`),
          automatically segments the PCA craniofacial midline, snout apex, 40-bin dorsal
          triangular head width profile (`r = 0.9114`, `RMSE = 0.1045`), and bilateral
          dorsolateral eyes (`segment_xenopus_specimen`, L300-388: `N = 2` eyes at
          `s/L = 0.1134` and `0.1111`, AP symmetry `|Delta s| = 0.0023`), and overlays them
          in Panels C1-C2.
        evidence:
          - {file: 2019-bischof-xenopus-craniofacial-remap.py, lines: [300, 388], note: "Automated PCA craniofacial midline, snout apex, head width profile, and bilateral eye CV segmentation", supports: true}
          - {file: docs/media/xenopus_craniofacial_remap_comparison.png, lines: [0, 0], note: "9-panel dark-mode comparison figure with dorsal Xenopus specimen CV overlay and head-width match", supports: true}
      parameter-expressivity:
