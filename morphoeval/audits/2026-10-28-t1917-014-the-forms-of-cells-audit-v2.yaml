# MorphoEval audit — Thompson (1917) claim T1917-014 "The Forms of Cells": are Lagena tests
# Delaunay (constant-mean-curvature) surfaces of revolution?  Pass 2 (v2), 2026-10-28.
# Supersedes 2026-10-28-t1917-014-the-forms-of-cells-audit (Pass 1, overall 60.8).
#
# Single-assessor Pass 2 for `thompson/claims/t1917-014_the-forms-of-cells.py` (v2, commit
# a1dca587c).  LIMITATION: builder and assessor are the same cloud agent (claude-fable-5-1);
# remediation R1 (independent second assessor) remains open.
#
# Pass 1 remediation closed in this round: R2 real photographs (Kireenko 2022 CC BY 4.0 plate,
# 5 unilocular tests + 2 polythalamous controls, 100 um scale bars), R3 ellipsoid null and
# free-form noise floor, R4 KS statistic / 2-fold CV / Pearson r per model, R5 negative controls
# plus a sphere+cylinder model ablation, R6 B / t parameter-regime sweep, R7 result.json verdict.
#
# Headline: verdict MIXED.  11/18 unilocular tests are Delaunay-compatible: 11/13 flask or
# globular morphotypes (median nRMSE 0.050, free-form floor 0.049, ellipsoid null 0.116,
# sphere+cylinder ablation 0.148) and 0/5 slender spindles (median 0.209; L/W 4.7-10.9 exceeds
# the Lean-checked unduloid bead bound L/W <= pi).  Specificity caveat: 1/2 polythalamous
# controls (the egg-shaped Quinqueloculina) also passes the gate, so the positive result is
# 'consistent with' rather than a unique demonstration; the spindle refutation is specific.

