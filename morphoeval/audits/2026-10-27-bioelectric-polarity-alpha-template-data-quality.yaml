evaluated_at: '2026-10-27T00:00:00Z'
repository: https://github.com/fractastical/morpholib
checker: morphoeval/problem_fixers/check_bioelectric_template_artifact.py
generator:
  script: morphoeval/run_overnight_1000_loops.py
  lines: 592-633
  formula: alpha_scale * x_control**1.25 + beta_offset + slot_seeded_gaussian_noise
  slot_alpha: round(1.15 + 0.08 * (slot % 9), 4)
  slot_beta: round(0.25 + 0.03 * (slot % 7), 4)
verdict: confirmed_template_artifacts
summary: >
  The three core bioelectric_polarity reference JSON files store 12-point
  empirical_series curves that are synthetically generated from slot-derived
  alpha_scale/beta_offset templates, not digitised measurements from the
  seed papers named in paper_citations.bib. High Pearson r between y_empirical
  and y_simulated therefore restates generator noise, not biological validation
  of Bistable V_mem / G_ij Threshold assignments.
thresholds:
  min_pearson_r_y_empirical_vs_alpha_x: 0.99
  min_pearson_r_y_empirical_vs_y_simulated: 0.99
  expected_poson_law: Bistable V_mem / G_ij Threshold
