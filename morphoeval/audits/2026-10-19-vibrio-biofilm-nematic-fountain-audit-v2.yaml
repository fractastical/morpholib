        evidence:
          - {file: 2019-yan-vibrio-biofilm-nematic-fountain.py, lines: [73, 89], note: "Runtime SHA-256 verification of all 4 dataset files in datasets/vibrio_biofilm_nematic_fountain/", supports: true}
          - {file: datasets/vibrio_biofilm_nematic_fountain/vibrio_biofilm_nematic_fountain_reference.json, lines: [1, 215], note: "SHA-256-locked reference dataset with cell-length sweep, expansion trajectory, and genetic/pharmacological controls", supports: true}
      code-traceability:
        value: 93
        rationale: >-
          Module and function docstrings map every governing equation and control to Beroz
          et al. (2018) Nature Physics Eqs. (1)-(5) & Figs. 1-4, Hartmann et al. (2019)
          Nature Physics, Yan et al. (2016) PNAS, Drescher et al. (2016) PNAS, and the 3
          formal Lean 4 theorems in `morphoeval/lean/loops/Loop_095_vibrio_biofilm_nematic_fountain.lean`
          (L1-39, L95-278).
        evidence:
          - {file: 2019-yan-vibrio-biofilm-nematic-fountain.py, lines: [1, 39], note: "Explicit equation-to-paper and Lean 4 theorem traceability in module header", supports: true}
      repro-package:
        value: 94
        rationale: >-
          8-point `self_test()` suite (`L601-635`) verifying SHA-256 dataset integrity,
          parabolic radial stress & critical radius invariants, cell-length inverse
