        evidence:
          - {file: 2019-yan-vibrio-biofilm-nematic-fountain.py, lines: [601, 635], note: "8-check self_test() verifying SHA-256 digests, scaling laws, mutant controls, CV specimen, and bitwise determinism", supports: true}
    remediation:
      - "Couple the 2D/axisymmetric Landau-de Gennes vertical tilt solver to a discrete 3D rod-element Hertzian contact simulation resolving individual cell-cell topological defects and polar peeling trajectories."
