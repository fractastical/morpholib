    claim_boundary:
      reported_in_source:
      - 'Turing 1952: a finite critical wavenumber can be selected by diffusion.'
      - 'Schnakenberg 1979: kinetics a - u + u^2 v and b - u^2 v.'
      - Kopp & True 2002, Mishra & Singh 2006, and Hurtado-Gonzales et al. 2014 describe D. bipectinata sex combs.
        None of them states a 1.92 µm wavenumber.
      - Gompel et al. 2005 is the predecessor citation for D. biarmipes wing pigment.
      reconstructed_in_script:
      - Focal linear wavelength 1.92 µm by solving gamma at D_u = 0.0504 µm^2/s and delta = 31.5.
      - At 0 Ma, D. biarmipes (D_u × 25/16) selects 2.40 µm and D. buzzatii (D_u × 16/25) selects 1.536 µm.
      - Saturated activator on the 64×64 grid selects 2.56 µm, which is reported rather than forced back to 1.92.
      transfer_boundary:
      - Melanin optical density on the gallery JPEG is a visualization of the activator, not a photograph of a 1.92
        µm granule field.
      does_not_claim:
      - A wet-lab measurement of 1.92 µm in D. bipectinata.
      - Stratigraphic ancestry among D. biarmipes, D. bipectinata, and D. buzzatii.
      - That the catalog DOI 10.1111/j.1525-142X.2005.05044.x belongs to this morphology. It is a zebrafish myostatin
        paper.
