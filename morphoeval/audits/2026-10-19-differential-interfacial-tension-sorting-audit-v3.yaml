# MorphoEval audit — Brodland (2002) J. Biomech. Eng. / Krieg et al. (2008) Nature Cell Biology / Maître et al. (2012) Science DITH Germ-Layer Sorting, 2026-10-19 (v3)
#
# Pass 3 re-score of `2002-brodland-differential-interfacial-tension-sorting.py` (v3, 1872 lines) after the
# remediation of the single open v2 item in the instrumented loop
# `morphoeval/runs/2026-10-19-differential-interfacial-tension-sorting-loop-pass3`, superseding
# `2026-10-19-differential-interfacial-tension-sorting-audit-v2` (91.3).
#
# What Pass 3 changed (the one v2 remediation item, "couple DITH cortical tension dynamics to time-dependent
# Nodal/TGF-beta morphogen signalling gradients during zebrafish shield-stage internalization"):
#   1. Section 1b (L229-L344): marginal Nodal field C(x,t) = C0 (1 - e^{-(t-t_on)/tau_N}) e^{-x/lambda}
#      (`nodal_signal`), two-threshold Hill dose -> cortical tension target beta*(C) (`nodal_to_cortical_tension_target`),
#      continuous-cortex DITH closure gamma_ij = kappa |beta_i - beta_j| (`cortical_tension_mismatch_gamma`), and the
#      explicit-Euler relaxation ODE d beta_i/dt = (beta* - beta_i)/tau_beta (`integrate_nodal_cortical_tension_dynamics`).
#   2. Section 2b (L773-L1030): `simulate_nodal_coupled_internalization` — every cell carries its own beta_i(t), the
#      per-cell-pair bond matrix is rebuilt every MCS from the closure, MCS is mapped linearly onto 4.0 -> 7.0 hpf,
#      and the shield-stage (6 hpf) mesendoderm / endoderm tier counts, the time at which the Krieg hierarchy is
#      established, Delta_r(t) and the class fractions are recorded; `run_nodal_dose_sweep` sweeps C0 over
#      {0 (lefty1 / MZoep), 0.25, 0.5, 1, 2}.
#   3. Row C of the figure (now 3x5, L1405-L1510) and a new GIF (`..._nodal_internalization.gif`, L1515-L1537);
#      4 new CLI flags (`--nodal-C0`, `--nodal-lambda`, `--tau-beta`, `--kappa`).
#   4. `measure_morphoeval()` 8 -> 13 measurements; `self_test()` 8 -> 13 checks; two hard-coded "p=0.0001" strings
#      in the v2 measurement methods replaced by a computed Pearson p-value / an explicit "no replicate statistics" note.
#   5. Lean: 3 new theorems (`nodal_dose_cortical_tension_monotone_bounded`, `cortex_mismatch_closure_satisfies_engulfment`,
#      `cortical_tension_relaxation_contracts`; 6 total, 0 sorrys, `lean` exit 0) registered in the math KG yaml.
#   6. Dataset: 7 new references (bib + reference JSON, DOIs recorded offline), a `nodal_tgfb_cortical_tension_coupling_pass3`
#      block, a reduction disclosure in the README, and a correction of the v2 heterotypic adhesion entries
#      (omega_EM/MN/EN = 35/45/35 contradicted the gamma_het = 30 anchor; now the implied closure values 115/195/150).
#
# Scoring protocol: single assessor (Claude Fable 5.1, this loop's agent), criterion-referenced, every score pinned to
# the CURRENT file at commit 8beed34. The remediation deliberately exposed the next layer of defects (listed under
# `remediation`), two of which lower dimensions relative to v2: the static regimes' lattice energy uses a single
# homotypic bond energy for E-E and M-M contacts although `compute_dith_tensions` returns gamma_EE = 70 != gamma_MM = 150
# (model-fidelity), and the vendored specimen is a whole-blastoderm / yolk-cell transplant micrograph rather than a
# Krieg (2008) germ-layer progenitor aggregate, with no specimen at all behind the new Nodal row (specimen-match).
# Overall 89.2 (v2 91.3): the v2 remediation item is closed, but the honest re-score is lower.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).

