simulations:
  - id: brodland-differential-interfacial-tension-sorting
    name: "Brodland (2002) / Krieg et al. (2008) / Maître et al. (2012) Differential Interfacial Tension Hypothesis (DITH) and zebrafish germ-layer cortical tension sorting, with time-dependent Nodal/TGF-beta coupling (Pass 3)"
    organism: "Danio rerio (zebrafish shield-stage gastrula germ-layer progenitors: ectoderm, mesoderm, endoderm)"
    script: 2002-brodland-differential-interfacial-tension-sorting.py
    output: docs/media/differential_interfacial_tension_sorting_comparison.png
    extra_outputs:
      - docs/media/differential_interfacial_tension_sorting_growth.gif
      - docs/media/differential_interfacial_tension_sorting_nodal_internalization.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-differential-interfacial-tension-sorting-audit-v2
    source_refs:
      - brodland2002
      - krieg2008
      - maitre2012
      - kafer2007
      - canty2017
      - chen2001
      - dubrulle2015
      - vanboxtel2015
      - hagos2007
      - gritsman1999
      - warga1999
      - kimmel1995
    claim_boundary:
      reported_in_source:
        - "Brodland (2002) J. Biomech. Eng. Eqs. 1-4: Differential Interfacial Tension Hypothesis (DITH) decomposing cell-cell interfacial tension into actomyosin cortical tension minus cadherin adhesion (gamma_{alpha,beta} = beta_alpha + beta_beta - omega_{alpha,beta})."
        - "Krieg et al. (2008) Nature Cell Biology Figs. 1-4: AFM cortical tension hierarchy across zebrafish shield-stage germ-layer progenitors (beta_ectoderm ~ 50 < beta_mesoderm ~ 95 < beta_endoderm ~ 130 pN/um) obtained by lefty1 / cyclops / cyclops+casanova mRNA injection, concentric 3-germ-layer sorting, Blebbistatin Myosin-II inhibition arrest, and caMLCK ectodermal cortical stiffening sorting reversal."
        - "Maître et al. (2012) Science Eq. 1: Young-Dupré cell-doublet contact angle cos(theta) = 1 - gamma_cc/(2*gamma_cm) and normalized contact radius r_c/R = sin(theta)."
        - "Chen & Schier (2001), Dubrulle et al. (2015), van Boxtel et al. (2015), Hagos & Dougan (2007): Nodal (Squint/Cyclops) acts as a graded marginal morphogen whose signalling domain is set by a temporal window between sphere and shield stage and whose dose specifies mesoderm vs endoderm; Gritsman et al. (1999): MZoep embryos lack all mesendoderm."
      reconstructed_in_script:
        - "2D deformable DITH cell sorting across all 4 perturbation regimes (wild-type engulfment, caMLCK cortex reversal, Blebbistatin Myosin-II inhibition, and high-HIT mushroom doublet) plus simultaneous 3-germ-layer concentric stratification (r_E = 0.870 > r_M = 0.663 > r_N = 0.446), a 7-point continuous beta_E sweep across the sorting inversion threshold beta_E = beta_M = 95 pN/um, and the Young-Dupré doublet contact curve."
        - "Pass 3: a reduced time-dependent Nodal/TGF-beta coupling — 1D marginal Nodal field C(x,t) with range lambda = 3 tiers and rise time tau_N = 0.6 h from 4.0 hpf, two-threshold Hill dose -> cortical tension target (beta_E/beta_M/beta_N = 50/95/130 pN/um), first-order cortex relaxation tau_beta = 0.5 h, and a continuous-cortex DITH closure gamma_ij = (2/3)|beta_i - beta_j| re-evaluated every MCS inside the lattice sorter; the model reproduces 5 mesendoderm / 2 endoderm tiers at shield stage, establishes the Krieg hierarchy by 4.87 hpf, reaches Delta_r = +0.350 at 7 hpf, and gives Delta_r = 0 with no mesendoderm in the Nodal-null (C0 = 0) control; 5-point C0 dose sweep."
        - "Computer-vision segmentation of a zebrafish blastoderm transplantation GFP/RFP micrograph (`germ_layer_doublet_specimen.jpg`) across both layered engulfment (Row B, radial profile r = 0.9301, RMSE = 0.1844) and the protruding mushroom doublet (Row C, empirical r_c/R = 0.9717)."
      transfer_boundary:
        - "2D lattice DITH representation of 3D zebrafish germ-layer progenitor reaggregates and blastoderm transplants; the circular 60-cell disc with medium all round is a reaggregate, not an embryo, so 'internalization' is sorting toward the disc centre."
        - "The Nodal coupling is 1D in tier distance from the margin, each cell's Nodal exposure is frozen to its tier of origin (specification memory), there is no epiboly / YSL motion and no Lefty feedback; lambda, K_M, K_N, tau_N and tau_beta were chosen to reproduce recalled literature anchors (~5 mesendoderm tiers, endoderm from tiers 1-2), not fitted to a digitised pSmad2 profile."
        - "The vendored specimen is a Wikimedia whole-blastoderm / yolk-cell transplant micrograph, not a Krieg et al. (2008) progenitor aggregate or a shield-stage internalization image; it is a proxy for layered GFP/RFP sorting, and no specimen underlies the Nodal row of the figure."
      does_not_claim:
        - "Does not model sub-second single-molecule E-cadherin bond rupture kinetics, whole-embryo epiboly yolk-syncytial-layer microtubule pulling, 2D/3D Nodal-Lefty reaction-diffusion, or quantitative pSmad2 gradient fits."
    summary: >-
      Pass 3 (v3) evaluation of `2002-brodland-differential-interfacial-tension-sorting.py` (89.2/100; v2 91.3).
      The single open v2 item is closed: Section 1b (`nodal_signal`, `nodal_to_cortical_tension_target`,
      `cortical_tension_mismatch_gamma`, `integrate_nodal_cortical_tension_dynamics`, L229-L344) and Section 2b
      (`simulate_nodal_coupled_internalization`, `run_nodal_dose_sweep`, L773-L1030) couple a time-dependent
      marginal Nodal/TGF-beta field to per-cell cortical tensions that are relaxed every MCS and fed back into a
      per-cell-pair DITH lattice energy; the coupled model yields 5 mesendoderm / 2 endoderm tiers at shield stage,
      the Krieg hierarchy by 4.87 hpf, Delta_r = +0.350 at 7 hpf, and no sorting in the Nodal-null control, with
      three new Lean theorems (6 total, 0 sorrys). The re-score is nevertheless lower than v2 because the round
      exposed defects the v2 audit had not scored: the static regimes' lattice uses one homotypic bond energy for
      E-E and M-M contacts although `compute_dith_tensions` returns gamma_EE = 70 != gamma_MM = 150 (so the static
      energy is not Brodland's), the v2 dataset JSON carried heterotypic adhesion values inconsistent with its own
      gamma_het anchor (corrected here), two v2 measurement methods carried hard-coded "p=0.0001" strings
      (removed), the specimen is a whole-blastoderm transplant proxy rather than a germ-layer progenitor aggregate,
      and the Nodal row has no specimen or digitised gradient behind it; the 7 new DOIs were recorded offline.
    scores:
      model-fidelity:
        value: 92
        rationale: >-
          Brodland (2002) Eq. (1) is implemented exactly in `compute_dith_tensions` (L136-L184) and now also in
          continuous per-cell form in the Nodal-coupled sorter: `_cell_pair_J` (L840-L847) rebuilds the bond matrix
          every MCS from gamma_i0 = beta_i and gamma_ij = kappa|beta_i - beta_j|, which is Brodland's law with
          omega_ij = beta_i + beta_j - gamma_ij, and Lean theorem 5 proves the closure always satisfies the Krieg
          regime-I inequality 0 < gamma_ij < |gamma_i0 - gamma_j0|. The Nodal coupling (L232-L334) is a recognisable
          reduced morphogen model: exponential range, first-order temporal rise from sphere stage, two-threshold
          Hill dose response mirroring Krieg's own lefty1 / cyclops / cyclops+casanova induction, first-order cortex
          relaxation; Lean theorems 4 and 6 prove monotonicity/bounds of the dose map and non-overshoot of the
          relaxation step. Deductions: the static regimes (L496-L508) use j_hom = 4.0 for both E-E and M-M
          contacts, discarding the gamma_EE = 70 / gamma_MM = 150 that `compute_dith_tensions` returns, so the
          static lattice energy is a Steinberg-type J matrix and not Brodland's full DITH energy (-4); the Nodal
          field is 1D and exposure is frozen to the tier of origin (L826, L893), with no Lefty feedback or
          epiboly (-3); kappa = 2/3 is a phenomenological closure tuned to gamma_EM = 30 (-1).
        evidence:
          - {file: 2002-brodland-differential-interfacial-tension-sorting.py, lines: [136, 184], note: "Exact Brodland (2002) Eq. 1 DITH tension decomposition and regime classifier", supports: true}
          - {file: 2002-brodland-differential-interfacial-tension-sorting.py, lines: [232, 334], note: "Pass 3 Nodal field C(x,t), two-threshold Hill dose -> cortical tension target, continuous-cortex closure, explicit-Euler relaxation ODE", supports: true}
          - {file: 2002-brodland-differential-interfacial-tension-sorting.py, lines: [776, 1001], note: "Nodal-coupled sorter: per-cell beta_i(t) relaxed each MCS (L892-L896), per-cell-pair J rebuilt from the DITH closure (L840-L847, L896), swap + Metropolis moves using cell-indexed J (L898-L959)", supports: true}
          - {file: 2002-brodland-differential-interfacial-tension-sorting.py, lines: [496, 508], note: "Static regimes: j_hom = 4.0 shared by E-E and M-M bonds; gamma_EE / gamma_MM from compute_dith_tensions are not used in the energy", supports: false}
          - {file: morphoeval/lean/loops/Loop_044_differential_interfacial_tension_sorting.lean, lines: [88, 163], note: "3 new machine-checked theorems: Nodal dose map monotone/bounded with Nodal-null = ectoderm, closure satisfies engulfment inequality with gamma_EM = 30 anchor, relaxation step never overshoots (6 theorems total, 0 sorrys)", supports: true}
      specimen-match:
        value: 84
        rationale: >-
          The PNG (3000 x 1890) shows the specimen comparison clearly: Panel B4 overlays the Row C mushroom-doublet
          contours and centroid line on the GFP/RFP composite, and Panel B5 plots the 12-annulus specimen RFP core /
          GFP rim profiles against the simulated core-shell profiles (r = 0.930, RMSE = 0.184); Panels A1-A5 are
          visually plausible engulfment / reversal / arrested / mushroom / 3-layer configurations and Row C3 shows a
          high-tension (yellow) core enveloped by lower-tension cells after Nodal-driven differentiation.
          Deductions: the vendored image is titled "Whole blastoderm transplants show yolk cell domain of
          function" — it is a blastoderm-on-yolk transplant, not a Krieg (2008) germ-layer progenitor aggregate,
          so the layered GFP/RFP configuration is a proxy for germ-layer sorting (-8); the new Nodal row (C1-C5) is
          compared with no micrograph at all — no shield-stage internalization image, no pSmad2 gradient (-5);
          the Row B radial profile is computed from fluorescence intensity ratios inside a hand-set ROI
          (L1063-L1065) rather than from segmented cells (-3).
        evidence:
          - {file: 2002-brodland-differential-interfacial-tension-sorting.py, lines: [1036, 1156], note: "Segmentation of Row B layered panels and Row C mushroom doublet; hand-set ROI centre/radius at L1063-L1065; Pearson r and computed p at L1121-L1123", supports: true}
          - {file: docs/media/differential_interfacial_tension_sorting_comparison.png, lines: [0, 0], note: "15-panel figure: B4 specimen overlay and B5 empirical-vs-simulated radial profiles visible; Row C (C1-C5) Nodal coupling has no specimen panel", supports: true}
          - {file: datasets/differential_interfacial_tension_sorting/differential_interfacial_tension_sorting_reference.json, lines: [75, 88], note: "Specimen metadata: Wikimedia 'Whole blastoderm transplants show yolk cell domain of function' — a transplant proxy, not a germ-layer aggregate", supports: false}
      parameter-expressivity:
        value: 92
        rationale: >-
          Four DITH regimes plus 3-layer sorting (A1-A5), the 7-point beta_E sweep crossing the inversion point
          (B2, L733-L770), the 6-point Young-Dupré curve (B3), and now a 5-point marginal Nodal dose sweep
          C0 in {0, 0.25, 0.5, 1, 2} (C5, `run_nodal_dose_sweep` L1004-L1030) whose C0 = 0 point is the lefty1 /
          MZoep null and whose mesendoderm fraction, endoderm fraction, shield tier count and Delta_r all respond;
          the Nodal-null trajectory is drawn beside the wild-type one in C4. CLI exposes `--beta-E/M/N`,
          `--gamma-EM`, `--Vt`, `--lam`, `--T`, `--mcs`, `--seed` and the new `--nodal-C0`, `--nodal-lambda`,
          `--tau-beta`, `--kappa` (L1814-L1829) and all are wired through `run_all_regimes_and_render`
          (L1162-L1175, L1208-L1219). Deductions: lambda, tau_beta and kappa are CLI-only and not swept in any
          panel (-5); K_M, K_N, n_hill and tau_N are hard-wired defaults (-3).
        evidence:
          - {file: 2002-brodland-differential-interfacial-tension-sorting.py, lines: [1004, 1030], note: "5-point Nodal dose sweep incl. Nodal-null control", supports: true}
          - {file: 2002-brodland-differential-interfacial-tension-sorting.py, lines: [733, 770], note: "7-point beta_E sweep across the inversion threshold", supports: true}
          - {file: 2002-brodland-differential-interfacial-tension-sorting.py, lines: [1814, 1829], note: "CLI incl. 4 new Nodal flags; lambda/tau_beta/kappa not swept in the figure", supports: true}
