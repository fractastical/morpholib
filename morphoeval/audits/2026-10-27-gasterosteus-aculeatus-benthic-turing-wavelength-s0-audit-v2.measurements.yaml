    claim_boundary:
      reported_in_source:
      - Low-plate Eda alleles and Pitx1 pelvic-enhancer deletion distinguish post-glacial benthic sticklebacks from
        the complete-plate marine ancestor (Colosimo 2005; Chan 2010).
      - Juvenile pigment patterns in threespine sticklebacks are genetically divergent (Greenwood et al. 2011);
        Kit ligand dosage changes pigmentation (Miller et al. 2007).
      - Turing 1952 and Schnakenberg 1979 define k_c. Kondo and Asai 1995 and Nakamasu et al. 2009 show activator-inhibitor
        chromatophore patterns in other teleosts.
      reconstructed_in_script:
      - Schnakenberg integration with a=0.1, b=0.9, gamma=0.3, Du=0.55, Dv=12, seed 3234, and dx chosen so linear
        λ_c = 43.15 µm.
      - Twelve PDE snapshots rendered with the steady two-morphogen readout; last frame held to the azimuthal fit.
      - Du sweep at fixed dx, equal-diffusion ablation, four full-length seeds, plate foreground mask, activator-only
        correlation.
      transfer_boundary:
      - Zebrafish and angelfish rate constants are not benthic-stickleback measurements.
      - 43 µm is the catalog detail-tier assignment, not a published melanophore count on G. aculeatus.
      does_not_claim:
      - Does not claim the Commons lateral photograph (Ron Offermans, CC BY-SA 3.0) is a benthic low-plate fish.
      - Does not claim the gallery detail plate is a raw 43 µm lattice micrograph.
      - Does not claim the 2.2 mm organ-scale benthic model.
      - Does not claim a signed nanopublication. No local nanopub profile was present.
