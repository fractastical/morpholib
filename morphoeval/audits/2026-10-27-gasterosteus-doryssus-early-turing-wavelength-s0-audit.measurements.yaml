    claim_boundary:
      reported_in_source:
      - Turing (1952) dispersion relation and the critical wavenumber of a two-species reaction-diffusion system.
      - Schnakenberg (1979) kinetics du/dt = a - u + u^2 v, dv/dt = b - u^2 v.
      - 'Hunt, Bell & Travis (2008) and Bell, Travis & Blouw (2006): Truckee Formation G. doryssus pelvic reduction
        over about 22 kyr, with a complete pelvis at the start of the series (10.02 Ma in this slot''s chronology).'
      - 'Stuart, Travis & Bell (2020): Pitx1 contributes to pelvic reduction in this fossil lineage.'
      - 'Nakamasu et al. (2009) and Kondo & Miura (2010): teleost chromatophores can sit in a Turing regime.'
      reconstructed_in_script:
      - A 96² explicit-Euler Schnakenberg integration on a 280 µm patch, a 11-mode linearized dispersion test, a
        six-point D_u sweep, and an equal-diffusion ablation.
      - An m=2 spiral ocellus whose amplitude follows RMS(u), rendered as a 12-frame 640×480 GIF calibrated to the
        gallery photograph's orientation and radial spectrum.
      transfer_boundary:
      - The 32.86 µm length is the Delphi cellular-detail assignment. Bell, Hunt, and Stuart did not publish a pigment
        spacing.
      - Nakamasu/Kondo zebrafish chromatophore kinetics are not re-fit; a=0.062 and b=0.948 are a Jacobian that
        places the fastest mode at this wavelength.
      - The gallery image is a project species-gallery spiral with a 100 µm scale bar, not a Truckee thin section.
      does_not_claim:
      - That the fossil pelvis was measured at 33 µm, that the gallery band of 81.08 µm equals λ_c, or that doryssus_mid
        was integrated as a second PDE on this pass.
