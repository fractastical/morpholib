    claim_boundary:
      reported_in_source:
      - 'Turing 1952: the critical wavenumber and the requirement that the inhibitor diffuse faster than the activator.'
      - Schnakenberg 1979 kinetics and the Gierer-Meinhardt activator-inhibitor reading.
      - 'Murray 1981: the selected length is a diffusion scale. Kondo and Miura 2010 review the same framework.'
      - Sturtevant 1916 and Miller 1955 establish the species and its sex-comb diagnosis.
      reconstructed_in_script:
      - Du = 0.05101 µm^2/time, Dv = 0.5101 µm^2/time, chosen so argmax sigma(k) is 2.443 µm.
      - Nonlinear FFT wavelength 2.432 µm on a 160 by 120 periodic grid, seed 3174, 4500 steps.
      - Length ratios 2.444/98.43 = 0.0248 versus berryi and 2.444/138.7 = 0.0176 versus americana.
      transfer_boundary:
      - Pigment-granule ontogeny is taken from Shoup 1966 on D. melanogaster and is not re-measured here.
      - Tergite pigment genetics (Wittkopp 2002, 2003) operate at a coarser scale than 2.444 µm.
      - The adult frame of the GIF is the photograph. Computer-vision similarity therefore scores the habitus, not
        an independently drawn fly.
      does_not_claim:
      - Does not claim the determinant-minimizing wavelength (2.251 µm) equals the pattern wavelength (2.432 µm).
        Both are reported.
      - Does not claim the sex-comb tooth spacing equals 2.444 µm.
      - Does not claim a signed nanopublication. No local nanopub profile was present.
      - Does not claim berryi is the ancestor of affinis or that affinis is the ancestor of americana.
