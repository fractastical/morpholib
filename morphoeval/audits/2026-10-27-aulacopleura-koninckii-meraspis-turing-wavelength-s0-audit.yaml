simulations:
  - id: delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0
    name: "Schnakenberg critical wavelength at 3.125 µm for Aulacopleura koninckii meraspis (Pass 1)"
    organism: "Aulacopleura koninckii meraspis (12 thoracic segments, Wenlock, 428.5 Ma)"
    script: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py
    output: docs/media/aulacopleura_koninckii_meraspis_turing_wavelength_s0_comparison.png
    also:
      - docs/media/aulacopleura_koninckii_meraspis_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs: [fusco2004, hughes1995, hughes2006, turing1952, schnakenberg1979, murray1981]
    summary: >-
      Pass 1 integrates a near-onset Schnakenberg system whose classical k_c is
      2π/3.125 µm. Eigenmode growth on the pattern-forming band matches the
      discrete dispersion relation at Pearson r = 0.99937, RMSE = 0.0271 /s.
      Equal diffusion gives σ_max = -0.458 /s. A diffusion-ratio sweep moves
      λ_max from 3.146 µm to 3.993 µm. The vendored dorsal photograph yields 11
      axial furrows against the assigned meraspid count of 12, circularity
      0.191, coherency 0.613. The GIF (720×560, 13 frames at this pass) ends
      on that photograph (CV similarity 95.7). k_c is held fixed into the
      holaspis18 successor; the trunk segment surplus is 6.
    claim_boundary:
      reported_in_source:
        - "Meraspid Aulacopleura adds thoracic segments; holaspid number varies (Fusco et al. 2004; Hughes & Chapman 1995)."
        - "Turing 1952 selects an intrinsic chemical wavelength; Schnakenberg 1979 supplies the two-species kinetics."
      reconstructed_in_script:
        - "a=0.0625, b=0.875, D_u=2e-12 m^2/s, D_v/D_u = 1.02 × r_crit, and γ are solved so λ_c = 3.125 µm."
        - "The M12 to holaspis18 change at this scale is the segment surplus 6 at fixed k_c."
      transfer_boundary:
        - "Murray 1981 is used only as the scale argument that domain length, not k_c, changes the number of hosted wavelengths."
      does_not_claim:
        - "That 3.125 µm was measured on the photograph."
        - "That the dorsal photograph is a verified degree-12 meraspis (counted furrows are 11)."
        - "That a Turing mechanism operated in the Silurian animal."
    scores:
      model-fidelity:
        value: 84
        rationale: "The script steps the Schnakenberg PDE and the classical k_c formula, and the pattern-band eigenmodes track the discrete dispersion relation (r=0.999). Parameters are reconstructed to hit 3.125 µm; they are not a published trilobite kinetic table. Pass 1 does not yet score a 2D patch."
        evidence:
          - {file: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py, lines: [8, 28], note: "PDE, Jacobian, and k_c formula", supports: true}
          - {file: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py, lines: [98, 127], note: "γ solved so k_c = 2π/3.125 µm", supports: true}
          - {file: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py, lines: [180, 235], note: "eigenmode probe versus discrete dispersion", supports: true}
      specimen-match:
        value: 78
        rationale: "The growth GIF ends on the vendored fossil and the comparison figure places that fossil beside a lira field. The lira panel is a generated stripe texture, not the exoskeleton, and Pass 1 does not draw the segmentation contour. Counted furrows (11) are not forced to the assigned 12."
        evidence:
          - {file: docs/media/aulacopleura_koninckii_meraspis_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "animated growth, last frame is the specimen", supports: true}
          - {file: docs/media/aulacopleura_koninckii_meraspis_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen beside simulated field", supports: true}
          - {file: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py, lines: [344, 388], note: "border-contrast mask, coherency, furrow peaks", supports: true}
      parameter-expressivity:
        value: 84
        rationale: "Raising D_v/D_u from 2% to 140% above onset moves λ_max monotonically from 3.146 µm to 3.993 µm. Setting D_u = D_v makes σ_max negative. a and b are not swept."
        evidence:
          - {file: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py, lines: [237, 254], note: "diffusion-ratio sweep", supports: true}
          - {file: models/2026-delphi10000-aulacopleura-koninckii-meraspis-turing-wavelength-s0.py, lines: [256, 261], note: "equal-diffusion ablation", supports: true}
      morphometric-validation:
