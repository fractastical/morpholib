# MorphoEval audit — Thompson (1917) Ch. XVII Figs. 404-408, claim T1917-058
# "human skull in Cartesian co-ordinates, deformed, gives chimpanzee / baboon / dog"
# Loop thompson1917-t1917-058 (slot 247), Pass 1, 2026-10-28.
#
# Single-assessor Pass 1 for `thompson/claims/t1917-058_on-the-theory-of-transformations.py` (v1).
# LIMITATION: builder and assessor are the same agent (claude-fable-5.1); no independent
# second assessor has scored this script (remediation R6).
#
# Headline of the round: Thompson's drawn human->chimpanzee net (Fig. 405), reconstructed as
# a thin-plate spline and applied to the human landmarks of Fig. 404, removes 35 % of the
# Procrustes distance to a REAL chimpanzee skull (affine "box stretch" part alone: -12 %,
# i.e. it moves away).  The net's cell areas grow ~5.7x back->front and ~7.4x top->bottom
# with a log-linear fit R^2 = 0.95 (Thompson's "approximately logarithmic order").
# Real specimens: d_P(human, chimp) = 0.315 < baboon 0.505 < dog 0.603; facial angle
# 89 / 68 / 56 / 45 deg.  Weaknesses: n = 1 per taxon, agent-digitised landmarks with NO
# uncertainty propagation, no parameter sweep, no negative control, no image segmentation,
# the human "specimen" is a rendered model.  These are the Pass 2 remediation items.

audit:
  id: 2026-10-28-t1917-058-on-the-theory-of-transformatio-audit
  rubric_version: 0.1.0
  date: "2026-10-28"
  assessor:
    id: claude-fable-5.1
    label: "Claude Fable 5.1 (builder-assessor, single-agent Pass 1; second assessor pending)"
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 6475519d7
    note: >-
      Branch cursor/t1917-058-primate-skull-transformation-ac9f; script v1 committed with
      its dataset, Lean module and rendered outputs.  Environment: Python 3.12, numpy 2.5.4,
      scipy 1.18.1, matplotlib 3.11.2 (Agg), Pillow 13.0, Lean 4.15.0 (elan installed in-run).

references:
  thompson1917:
    title: "On Growth and Form, Ch. XVII On the Theory of Transformations, pp. 770-773, Figs. 404-408"
    authors: "Thompson DW"
    venue: "Cambridge University Press (1917); Internet Archive scan ongrowthform1917thom, leaves 789-792"
    url: https://archive.org/details/ongrowthform1917thom
  bookstein1989:
    title: "Principal warps: thin-plate splines and the decomposition of deformations"
    authors: "Bookstein FL"
    venue: "IEEE Trans. Pattern Anal. Mach. Intell. 11(6):567-585 (1989)"
    doi: 10.1109/34.24792
  mitteroecker2005:
    title: "Heterochrony and geometric morphometrics: a comparison of cranial growth in Pan paniscus versus Pan troglodytes"
    venue: "Evolution & Development 7(3):244-258 (2005)"
    doi: 10.1111/j.1525-142X.2005.05027.x
    role: modern GM context for chimpanzee cranial shape (OpenAlex top hit for the slot query)
  aristide2018:
    title: "Data from: Multiple factors behind early diversification of skull morphology in the continental radiation of New World monkeys"
    venue: "Dryad (2018)"
    doi: 10.5061/dryad.7r85116
    role: dataset named by the pre-scout; platyrrhines only -> DATASET_MISMATCH, metadata pinned, not used

simulations:
  - id: thompson1917-t1917-058
    name: "Thompson (1917) Cartesian transformation of the human skull into chimpanzee, baboon and dog (Figs. 404-408)"
    organism: "Homo sapiens, Pan troglodytes, Papio ursinus, Canis lupus familiaris (lateral skull)"
    script: thompson/claims/t1917-058_on-the-theory-of-transformations.py
    output: docs/media/t1917_058_on_the_theory_of_transformatio_comparison.png
    extra_outputs:
      - docs/media/t1917_058_on_the_theory_of_transformatio_growth.gif
      - datasets/thompson_1917/t1917-058/t1917_058_metrics.json
      - datasets/thompson_1917/t1917-058/result.json
    status: evaluated
    source_refs: [thompson1917, bookstein1989, mitteroecker2005, aristide2018]
    model_spec:
      model: "TPS reconstruction of Thompson's Fig. 405 net (30 nodes) + Procrustes explained-fraction test against real specimens"
      tps_regularisation_lambda: 0.0
      deformation_intensity_k: 1.0
      landmarks: 11
      seed: 1917
      inputs:
        - datasets/thompson_1917/t1917-058/t1917_058_on_the_theory_of_transformatio_reference.json
        - datasets/thompson_1917/t1917-058/fig404_human_skull_cartesian.jpg
        - datasets/thompson_1917/t1917-058/fig405_chimpanzee_coordinates.jpg
        - datasets/thompson_1917/t1917-058/homo_sapiens_lateral.jpg
        - datasets/thompson_1917/t1917-058/pan_troglodytes_lateral.jpg
        - datasets/thompson_1917/t1917-058/papio_ursinus_lateral.jpg
        - datasets/thompson_1917/t1917-058/canis_familiaris_lateral.jpg
    claim_boundary:
      reported_in_source:
        - "Thompson (1917) pp. 770-773: the human skull drawn in a 5x4 Cartesian net (Fig. 404) and the chimpanzee, baboon and dog skulls drawn in deformed nets (Figs. 405-408); prose statements that the deformation is one 'harmonious and congruent transformation', that cell areas increase 'in approximately logarithmic order' from above downwards and behind forwards, that the baboon differs 'only in an increased intensity', that the chimpanzee is 'much nearer the human type than the baboon', and that the dog's net 'tapers away in front' on 'different lines'."
      reconstructed_in_script:
        - "The Fig. 405 net digitised (skeleton junctions + 4 manual corners), reconstructed as a thin-plate spline T in human grid units (E1-E3); cell-area log-linear regression (E4); 11 homologous landmarks digitised by the loop agent on Fig. 404, Fig. 406 and four Commons specimens; full-Procrustes explained fraction of T(H) toward the real chimpanzee (E6); displacement-field cosines and intensity ratios between real specimens; facial index and Camper-type facial angle (E7)."
      transfer_boundary:
        - "One specimen per taxon (museum photographs for chimpanzee, baboon, dog; a rendered anatomical model for the human); the baboon and dog nets of Figs. 407-408 were not digitised, so sub-claims C2/C5 are tested on real specimens only, not on Thompson's drawings of them."
      does_not_claim:
        - "Nothing about growth, ontogeny or phylogeny; no claim that Thompson's particular curves are the optimal smooth map; the 'supported' verdict of v1 carries no confidence interval (remediation R1)."
    summary: >-
      v1 reconstructs Thompson's human->chimpanzee net as a TPS (bending energy 2.10,
      affine determinant 0.54, net-alignment RMS 1.02 grid units) and warps the Fig. 404
      drawing through it, visually reproducing Fig. 406.  Applied to the 11 human landmarks
      of Fig. 404 the net removes 35 % of the Procrustes distance to a real chimpanzee skull
      (0.383 -> 0.249; affine part alone 0.430, i.e. -12 %), 24 % toward the baboon, 22 %
      toward the dog and -27 % toward the human specimen (T is a prognathism direction that
      helps every non-human target, most for the chimpanzee).  Direction cosine between
      Thompson's drawn displacement and the real human->chimp displacement 0.73.  Cell-area
      field of the net: log-linear R^2 0.95, beta_i +0.40 (behind->forwards), beta_j -0.61
      (upwards), 5.7x front/back, 7.4x bottom/top.  Real specimens: d_P(H,C) 0.315 <
      d_P(H,B) 0.505 < d_P(H,D) 0.603; cos(chimp,baboon) 0.78, cos(chimp,dog) 0.78,
      k_baboon/k_chimp 1.25; facial index 0.48/0.66/1.27/0.61 and facial angle
      89/68/56/45 deg for H/C/B/D.  Verdict by the script's 11 binary checks: 9/11
      ("supported") - but without any uncertainty quantification.  Overall 62.2/100.
    scores:
      model-fidelity:
        value: 70
        rationale: >-
          Thompson's method is implemented as published - a Cartesian net of the human
          skull and its smooth deformation - using the standard modern formalisation
          (Bookstein 1989 TPS: exact interpolation of the drawn nodes, affine + bending
          decomposition), and the net itself is Thompson's own Fig. 405 rather than a
          re-drawn analogue.  Four Lean 4 laws (affine cell congruence, log-area gradient,
          intensity family, rectangular-vs-triangular taper) are kernel-checked, 0 sorry.
          Deductions: the baboon and dog nets (Figs. 407-408) are not digitised, so
          Thompson's own drawn transformations for those taxa are not reconstructed; the
          TPS regularisation lambda and intensity k are CLI options but never swept in v1.
        evidence:
          - {file: thompson/claims/t1917-058_on-the-theory-of-transformations.py, lines: [187, 224], note: "tps_fit / tps_eval / affine_fit: E1-E3 exactly as in the reference JSON", supports: true}
          - {file: thompson/claims/t1917-058_on-the-theory-of-transformations.py, lines: [325, 335], note: "build_transformation: Procrustes-align Fig. 405 nodes to the human grid, TPS through all 30 nodes", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_058.lean, lines: [60, 99], note: "affine_net_cells_congruent: flat area field for any affine map (why the graded areas need bending)", supports: true}
          - {file: datasets/thompson_1917/t1917-058/scout_manifest.json, lines: [1, 40], note: "Fig. 407/408 nets not extractable by the automatic method - baboon/dog tested on real specimens only", supports: false}
      specimen-match:
        value: 55
        rationale: >-
          Rendered side by side (panel c vs Fig. 406) the human drawing warped through the
          digitised net is recognisably Thompson's chimpanzee figure, and the quantitative
          test against a REAL chimpanzee specimen is positive (35 % explained, T(H) closer
          to the real chimp than to the real human).  Deductions: n = 1 specimen per taxon;
          the human 'specimen' is a rendered anatomical model, not a museum photograph; all
          landmarks were digitised by the loop agent (+/- ~12 px) with no uncertainty
          propagated; the human drawing itself sits d_P = 0.21 from the human specimen,
          two-thirds of the human-chimp distance, so drawing fidelity is a confound.
        evidence:
          - {file: docs/media/t1917_058_on_the_theory_of_transformatio_comparison.png, lines: [0, 0], note: "panel c (warped Fig. 404 inside the Fig. 405 net) next to the four landmarked specimens and the Procrustes overlay", supports: true}
          - {file: datasets/thompson_1917/t1917-058/t1917_058_metrics.json, lines: [0, 0], note: "C1 targets: explained 0.351 chimp, 0.238 baboon, 0.218 dog, -0.270 human specimen", supports: true}
          - {file: datasets/thompson_1917/t1917-058/t1917_058_metrics.json, lines: [0, 0], note: "drawing_fidelity: d(Fig.404, human specimen) = 0.210; human specimen is a render", supports: false}
      parameter-expressivity:
        value: 40
        rationale: >-
          The two morphospace parameters are exposed (--lam regularisation toward the affine
          limit, --k deformation intensity) and the GIF animates k from 0 to 2, but v1 runs
          and reports only lam = 0, k = 1: no sweep table, no demonstration that E or the
          facial angle move monotonically with k, no affine-limit check as lam -> infinity.
        evidence:
          - {file: thompson/claims/t1917-058_on-the-theory-of-transformations.py, lines: [785, 795], note: "--lam and --k CLI options exist", supports: true}
          - {file: thompson/claims/t1917-058_on-the-theory-of-transformations.py, lines: [341, 345], note: "analyse() evaluates a single (lam, k) pair; no sweep", supports: false}
          - {file: docs/media/t1917_058_on_the_theory_of_transformatio_growth.gif, lines: [0, 0], note: "k = 0 -> 1 -> 2 morph of the net with the warped drawing", supports: true}
      morphometric-validation:
        value: 50
        rationale: >-
          Scale-free morphometrics (Procrustes distances, explained fraction, displacement
          cosines, cell-area log gradient, facial index, facial angle) are computed on the
          real specimens and the facial angles (89/68/56/45 deg) fall in the textbook Camper
          bands for man / chimpanzee / baboon / dog.  Deductions: no confidence intervals or
          permutation null for the 35 % headline; no goodness-of-fit statistics (r, RMSE,
          KS) beyond R^2 of the area fit; no literature landmark table was found to compare
          against; the C5 'different lines' test (cos chimp-dog 0.78 vs chimp-baboon 0.78)
          is a tie and not a meaningful discriminator.
        evidence:
          - {file: thompson/claims/t1917-058_on-the-theory-of-transformations.py, lines: [247, 322], note: "procrustes_distance, cell_area_ratios, log_area_regression, facial_proportions", supports: true}
          - {file: thompson/claims/t1917-058_on-the-theory-of-transformations.py, lines: [450, 480], note: "verdict_from: 11 point-estimate binary checks, no uncertainty", supports: false}
      source-traceability:
        value: 85
        rationale: >-
          Every vendored file (3 IA scan leaves, 5 figure crops, 4 Commons images, Dryad
          metadata) is SHA-256 pinned in the reference JSON and re-hashed at runtime; Commons
          author/licence/original-SHA1 and IA leaf->page rule are recorded; the pre-scouted
          Dryad dataset is fetched (metadata), judged a species mismatch and explicitly not
          used; Bookstein and the OpenAlex hits carry DOIs.  Deduction: the Dryad archive
          bytes could not be downloaded (bearer-token / Anubis block), so only its metadata
          record is pinned.
        evidence:
          - {file: thompson/claims/t1917-058_on-the-theory-of-transformations.py, lines: [128, 136], note: "verify_pinned_files re-hashes all 13 vendored files; self-test asserts all match", supports: true}
          - {file: datasets/thompson_1917/t1917-058/scout_manifest.json, lines: [1, 60], note: "named-dataset verification: DATASET_MISMATCH with reason and blocked-download record", supports: true}
      code-traceability:
        value: 75
        rationale: >-
          The module docstring maps E1-E7 and the Lean laws to functions and to Thompson's
          page/figure numbers; each sub-claim C1-C6 cites the sentence of pp. 770-773 it
          operationalises (scout manifest).  Deduction: the correspondence between the
          digitised Fig. 405 nodes and the figure's labels is documented in the reference
          JSON but not re-derived or checked by code.
        evidence:
          - {file: thompson/claims/t1917-058_on-the-theory-of-transformations.py, lines: [1, 90], note: "docstring: equations, data, claim boundary, invocation", supports: true}
          - {file: datasets/thompson_1917/t1917-058/t1917_058_on_the_theory_of_transformatio_reference.json, lines: [0, 0], note: "node coordinates + digitisation method; landmark protocol with definitions", supports: true}
      repro-package:
        value: 70
        rationale: >-
          Deterministic (seed 1917, no stochastic step in v1), --self-test (TPS exactness,
          Lean-anchor identities, Procrustes invariances, pinned digests) passes in < 1 s,
          full run 12 s, outputs written to documented paths, dependencies are the repo's
          requirements.txt.  Deductions: no per-script dependency pins; Lean verification
          needs an elan toolchain that is not part of the environment image; audit
          checkpoint is a feature-branch commit.
        evidence:
          - {file: thompson/claims/t1917-058_on-the-theory-of-transformations.py, lines: [727, 778], note: "self_test()", supports: true}
          - {file: thompson/claims/t1917-058_on-the-theory-of-transformations.py, lines: [785, 860], note: "main(): documented CLI, metrics + result JSON, figure + GIF", supports: true}
    remediation:
      - id: R1
        item: "Propagate landmark-digitisation uncertainty: jitter bootstrap (sigma 1.5 % centroid size, 1000 reps) for the explained fraction, facial indices and distance ordering; add a permutation null for E_C; report r, RMSE and a KS test on per-landmark residuals"
      - id: R2
        item: "Run and report the parameter-regime sweep: lambda in {0, 1e-3, 1e-2, 1e-1, 1} (affine limit) and k in {0, 0.5, 1, 1.5, 2, 2.5}; show E and the predicted facial angle as monotone functions of k"
      - id: R3
        item: "Add negative / ablation controls: affine-only ablation already present - add a label-shuffled null, a mirrored (anti-Thompson) net and a wrong-target specificity index"
      - id: R4
        item: "Computer-vision segmentation of the four specimen photographs (Otsu silhouette on the grey museum background) -> silhouette height profile and taper index to test the dog 'triangular conformation' criterion (C5) instead of the tied displacement cosines; also a silhouette face fraction"
      - id: R5
        item: "Replace or supplement the rendered human model with a museum photograph of a real Homo sapiens skull; report drawing-fidelity (Fig. 404 vs specimen) alongside the headline"
      - id: R6
        item: "Independent second assessor (different provider) - this round is builder-scored"
