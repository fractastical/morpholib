simulations:
  - id: delphi10000-drosophila-elegans-turing-wavelength-s0
    name: "Drosophila elegans Schnakenberg Turing wavelength at 1.8 µm (Holocene, 0 Ma), Pass 2"
    organism: "Drosophila elegans"
    script: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
    output: docs/media/drosophila_elegans_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: 2026-10-27-drosophila-elegans-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, yeh2006, prudhomme2006, gompel2005]
    phenomenon_size_m: 1.803e-06
    scale_tier: 3_subcellular_um
    geological_age_ma: 0.0
    geological_period: "Holocene (Extant)"
    fossil_lineage_group: "Sophophora suzukii–biarmipes Wing-Spot Clade"
    summary: >-
      Pass 2 at 1.8 µm and 0 Ma. The Pass 1 nonlinear wavelength was 1.669 µm.
      Du was lengthened by the measured k ratio 1.08014. The FFT wavelength is
      now 1.799 µm. At the retuned Du, deflecta selects 2.372 µm and erecta
      2.096 µm, both longer than the elegans linear mode (1.948 µm). A sweep
      of r/r_c from 1.02 to 3.20 at the uncorrected Du is monotonic
      (1.788 → 2.284 µm). Equal diffusion decays to std 1.4e-5 against a
      patterned std of 0.515 (KS 0.624). Seed CV of the nonlinear wavelength
      is 0.0023. The yellow-leaf mask gives foreground fraction 0.150, the
      largest red component has circularity 0.173, and the 159 px scale bar
      puts the non-leaf box at 3.55 mm by 2.15 mm. Dispersion Pearson r is
      0.989, RMSE 0.031. Age 0 Ma, scale 1.8 µm.
    claim_boundary:
      reported_in_source:
        - "Yeh, Liou & True 2006: male D. elegans has an apical wing melanin patch used in courtship, divergent from D. gunungcola."
        - "Turing 1952 dispersion relation and Schnakenberg 1979 kinetics."
      reconstructed_in_script:
        - "NONLINEAR_K_CORRECTION = 1.08014 is the Pass 1 ratio of linear to nonlinear wavelength, used to re-solve Du."
        - "Deflecta 2.372 µm and erecta 2.096 µm are the same law at r/r_c = 2.65 and 1.48 with that Du."
      transfer_boundary:
        - "Deflecta and erecta are chronoseries neighbors, not the gunungcola comparison in Yeh and Massey."
      does_not_claim:
        - "The photograph does not resolve 1.8 µm granules. The lattice is the simulated field, shown magnified."
        - "Eye circularity 0.173 is the largest red component, not a claim that one ommatidial field is a circle."
        - "The 3.55 mm box includes wings and legs; it is not a new measurement of thorax length."
        - "No second assessor scored this pass. Nanopubs were not signed."
    model_spec:
      model: "Schnakenberg 1979 + Turing 1952, Du solved so the nonlinear FFT wavelength is 1.803 µm"
      a: 0.12
      b: 0.88
      nonlinear_k_correction: 1.08014
      elegans_r_over_rc: 1.06
      deflecta_r_over_rc: 2.65
      erecta_r_over_rc: 1.48
      grid_resolution: [220, 160]
      dt: 0.2
      steps: 1100
      seed: 3182
      inputs:
        - datasets/drosophila_elegans_turing_wavelength_s0/drosophila_elegans_turing_wavelength_s0_reference.json
        - datasets/drosophila_elegans_turing_wavelength_s0/drosophila_elegans_specimen.jpg
        - datasets/drosophila_elegans_turing_wavelength_s0/paper_citations.bib
        - datasets/drosophila_elegans_turing_wavelength_s0/scout_manifest.json
        - datasets/drosophila_elegans_turing_wavelength_s0/README.md
    scores:
      model-fidelity:
        value: 91
        rationale: >-
          The spectral Schnakenberg step, the Jacobian, and the onset margin
          are unchanged and still match Turing 1952 and Schnakenberg 1979.
          Pass 2 applies the measured wavenumber ratio 1.08014 so the emergent
          lattice is 1.799 µm rather than 1.669 µm. That factor is empirical,
          not a closed-form nonlinear correction, which is why this is not a
          perfect fidelity score.
        evidence:
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [68, 72]
            note: "NONLINEAR_K_CORRECTION = 1.08014 from the Pass 1 k ratio"
            supports: true
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [206, 242]
            note: "Spectral Schnakenberg integrator"
            supports: true
          - file: datasets/drosophila_elegans_turing_wavelength_s0/loop_3182_metrics.json
            lines: [0, 0]
            note: "nonlinear_wavelength_um 1.799 against the 1.803 µm target"
            supports: true
      specimen-match:
        value: 83
        rationale: >-
          The comparison still sets the real adult beside a hexagonal activator
          lattice, and the 12-frame GIF ends on the photograph. Pass 2 adds a
          leaf mask that actually separates the yellow leaf (foreground 0.150)
          and reports the red eye and the 1 mm bar. The lattice remains a
          magnified subcellular field: this macro photograph cannot show 1.8 µm
          granules, so the match is phenotypic context plus pattern class, not
          a pixel identity of the ocellus texture.
        evidence:
          - file: docs/media/drosophila_elegans_turing_wavelength_s0_comparison.png
            lines: [0, 0]
            note: "Pass 2 panels: specimen, lattice, ratio sweep, chronoseries, ablation"
            supports: true
          - file: docs/media/drosophila_elegans_turing_wavelength_s0_growth.gif
            lines: [0, 0]
            note: "12-frame 960×640 growth animation; last frame is the adult canvas"
            supports: true
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [261, 339]
            note: "Yellow-leaf mask, eye component, and scale-bar run length"
            supports: true
      parameter-expressivity:
        value: 88
        rationale: >-
          At fixed activator diffusivity, raising r/r_c from 1.02 to 3.20
          lengthens the linear wavelength monotonically from 1.788 µm to
          2.284 µm. The equal-diffusion control (Du = Dv) falls to std 1.4e-5
          while the elegans pattern holds std 0.515. Both controls do what the
          dispersion law says they should.
        evidence:
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [341, 382]
            note: "ratio_sweep and ablation_and_ks"
            supports: true
          - file: docs/media/drosophila_elegans_turing_wavelength_s0_comparison.png
            lines: [0, 0]
            note: "Sweep curve and ablation bar"
            supports: true
      morphometric-validation:
        value: 89
        rationale: >-
          Continuous versus stencil dispersion: Pearson r = 0.989, RMSE = 0.031
          (28 modes). Nonlinear FFT wavelength 1.799 µm versus 1.803 µm.
          KS statistic between the pattern and the ablation is 0.624.
          Seed CV across 3182–3184 is 0.0023. Specimen foreground 0.150 versus
          a 0.50 prior, eye circularity 0.173 versus a circle, body box 3.55 mm
          versus the 2.62 mm manifest size. None of these values is copied from
          its reference.
        evidence:
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [151, 181]
            note: "dispersion Pearson r and RMSE"
            supports: true
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [593, 720]
            note: "measure_morphoeval records wavelength, KS, CV, and specimen metrics with unequal references"
            supports: true
      source-traceability:
        value: 90
        rationale: >-
          Same Crossref-checked DOIs as Pass 1, including Prud'homme 2006 at
          10.1038/nature04597. The specimen JPEG is now in the dataset directory
          (SHA-256 ed8dfe6c…) and is the gallery file, because Wikimedia Commons
          returned HTTP 403.
        evidence:
          - file: datasets/drosophila_elegans_turing_wavelength_s0/paper_citations.bib
            lines: [1, 48]
            note: "Yeh 2006, Turing 1952, Schnakenberg 1979, Prud'homme 2006"
            supports: true
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [51, 59]
            note: "SHA-256 pins, including the specimen JPEG"
            supports: true
      code-traceability:
        value: 85
        rationale: >-
          sigma_of_k, the Du solver, ratio_sweep, ablation_and_ks, and
          segment_specimen are separate functions, and the module docstring
          states the Pass 2 change. Turing section numbers are still only in
          the Jacobian docstring.
        evidence:
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [1, 42]
            note: "Docstring states the 1.8 µm / 0 Ma Pass 2 closure"
            supports: true
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [114, 148]
            note: "Growth rate, fastest wavenumber, Du solver, onset margin"
            supports: true
      repro-package:
        value: 88
        rationale: >-
          --self-test checks the law-table wavelength, monotonic sweep,
          dispersion r > 0.98, the leaf-mask range, dataset hashes, and the
          Lean file. The render additionally refuses a nonlinear wavelength
          outside 2.5% of 1.803 µm or an ablation ratio below 3. Seed 3182.
        evidence:
          - file: models/2026-delphi10000-drosophila-elegans-turing-wavelength-s0.py
            lines: [736, 810]
            note: "run_pass1 guards and self_test"
            supports: true
