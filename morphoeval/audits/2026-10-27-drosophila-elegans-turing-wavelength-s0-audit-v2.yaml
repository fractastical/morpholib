  id: 2026-10-27-drosophila-elegans-turing-wavelength-s0-audit-v2
  rubric_version: 0.1.0
  date: "2026-10-27"
  supersedes_audit_id: 2026-10-27-drosophila-elegans-turing-wavelength-s0-audit
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, single agent; no second assessor)"
    homepage: https://x.ai
  publisher_orcid: "https://orcid.org/0009-0007-4948-9192"
  license: https://creativecommons.org/licenses/by/4.0/
