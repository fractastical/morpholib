# MorphoEval audit — Graner & Glazier (1992) PRL / Glazier & Graner (1993) PRE Cellular Potts Cell Sorting, 2026-10-19 (v3)
#
# Pass 3 re-score of `1992-graner-cellular-potts-cell-sorting.py` (1564 lines) after the remediation of the single
# open v2 item (perimeter / cortical tension constraint) in the instrumented loop
# `morphoeval/runs/2026-10-19-cellular-potts-cell-sorting-loop-pass3`, superseding
# `2026-10-19-cellular-potts-cell-sorting-audit-v2` (91.1).
#
# What Pass 3 changed:
#   1. Ouchi et al. (2003) Physica A Eq. 2 perimeter elasticity H_P = lambda_P sum (p_sigma - P_t)^2 added to the
#      Metropolis kernel with incremental 8-neighbour bond-count bookkeeping (Delta_p_old = 2 n - 8,
#      Delta_p_new = 8 - 2 n) verified against a full recount (max |error| = 0 after 150 MCS); lambda_P = 0
#      reproduces the Pass 2 lattice bit-for-bit.
#   2. New regime `cortical_tension_sorting` (Panel C1, GIF column 4), a 6-point lambda_P ablation sweep (C2), a
#      per-cell perimeter histogram (C3), a 5-point P_t sweep (C4) and a T = 80 melting ablation (C5).
#   3. 3 new Lean 4 theorems (`cpm_square_block_target_perimeter`, `cpm_perimeter_elasticity_restoring_identity`,
#      `cpm_cortical_tension_monotone_above_target`; 0 sorrys), registered in the math_kg loop file.
#   4. Self-test 8 -> 12 checks; measure_morphoeval() 8 -> 15 measurements; dataset JSON/bib/README extended
#      with Ouchi 2003 and Farhadifar 2007 (DOIs recorded from memory, flagged `doi_verification`).
#
# What the Pass 3 review found (all pre-date Pass 3 and were missed by the v1/v2 assessors):
#   - A whole-cell `cell_type` identity-swap move (8 attempts per MCS) with its own Metropolis rule at an
#     inconsistent temperature 2.5 T is not part of the Graner-Glazier formalism; it teleports cell identities and
#     is the main driver of the sorting the panels show.
#   - Inside that move, the "partial sorting lens" regime is manufactured by an uncited lateral bias field
#     1.8 * x; the resulting A2 panel is a concentric core-shell (Delta_r = +0.352 > A1's +0.332), not a lens.
#   - Cells sit at 75.6 % of V_t (mean v = 12.1 of 16, 3 cells at the hard floor v = 6) because lambda = 1.2 is weak
#     against J ~ 14-16, and a hard `vols <= 6` floor outside the Hamiltonian hides the resulting cell loss.
#   - `depinning_prob` is computed and never used; the PRL Fig. 3 "empirical_mcs_checkpoints" (0-150 MCS) have no
#     digitisation provenance; the specimen thresholds (82nd / 42nd percentile, 0.35 channel bleed, r_roi = 88 px)
#     are uncited.
# Scores therefore go DOWN on model-fidelity, specimen-match, morphometric-validation, source- and
# code-traceability even though the v2 remediation item is closed; see `remediation` for Pass 4.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files at commit 654cd6fc plus this loop's uncommitted edits.

