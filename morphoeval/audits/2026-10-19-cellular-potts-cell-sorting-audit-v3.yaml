          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [698, 777], note: "Pass 3 lambda_P ablation sweep (6 values) and P_t sweep (5 values) returning perimeter, shape index, fragmentation and sorting order parameters", supports: true}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [1505, 1523], note: "CLI: --J-LL/--J-DD/--J-LD/--J-LM/--J-DM/--Vt/--lam/--T/--mcs/--seed plus Pass 3 --lam-P and --Pt", supports: true}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [963, 967], note: "All five sweeps wired into the default render (B2, B5, C2, C4, C5)", supports: true}
      morphometric-validation:
        value: 85
        rationale: >-
          Credited: `measure_morphoeval()` (L1265-1391) returns 15 measurements with non-null references and
          units, including the 7 new Pass 3 metrics (P_t = 44 vs Lean, RMS(p - P_t) 1.73 vs the lambda_P = 0
