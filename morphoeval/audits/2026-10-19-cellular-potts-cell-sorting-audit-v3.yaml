simulations:
  - id: graner-cellular-potts-cell-sorting
    name: "Graner & Glazier (1992) / Glazier & Graner (1993) extended large-Q Cellular Potts Model cell sorting + Ouchi et al. (2003) cortical tension"
    organism: "Hydra attenuata (endoderm/ectoderm reaggregates) & Gallus gallus embryonic cell spheroids"
    script: 1992-graner-cellular-potts-cell-sorting.py
    output: docs/media/cellular_potts_cell_sorting_comparison.png
    extra_outputs:
      - docs/media/cellular_potts_cell_sorting_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-cellular-potts-cell-sorting-audit-v2
    source_refs:
      - graner1992
      - glazier1993
      - steinberg1963
      - gierer1972
      - foty1996
      - ouchi2003
      - farhadifar2007
    claim_boundary:
      reported_in_source:
        - "Graner & Glazier (1992) PRL Eqs. 1-3 & Fig. 3: extended large-Q Cellular Potts Model Hamiltonian with bond-energy surface tensions gamma_LD = J_LD - (J_LL + J_DD)/2 and gamma_alphaM = J_alphaM - J_alphaalpha/2 driving logarithmic heterotypic boundary decay L_het(t) ~ A - B ln(t)."
        - "Glazier & Graner (1993) PRE Table I & Section III.B: classification of 4 equilibrium phase regimes (complete engulfment, partial sorting lens, checkerboard mixing, and cell dissociation) and fluctuation temperature controls (T=0 lattice pinning arrest vs optimal thermal sorting vs high-T thermal melting)."
        - "Ouchi et al. (2003) Physica A Eq. 2: a perimeter (cortical tension) elasticity term lambda_P (p_sigma - P_t)^2 added to the CPM Hamiltonian suppresses ragged, fragmented cell boundaries; Farhadifar et al. (2007) Eq. 1 is the vertex-model analogue."
      reconstructed_in_script:
        - "2D extended large-Q Cellular Potts Model (60 x 60 lattice, 60 cells of V_t = 16) across all 4 canonical phase regimes plus T=0 pinning and equal-adhesion negative controls, a 7-point continuous J_LD sweep, and a 6-point fluctuation temperature sweep (all at lambda_P = 0)."
        - "Ouchi et al. (2003) perimeter / cortical tension term with incremental 8-neighbour bond-count bookkeeping (max drift 0 after 150 MCS), a cortical-tension sorting regime (lambda_P = 2, P_t = 44), a 6-point lambda_P ablation sweep at T = 10 and T = 80, and a 5-point P_t sweep (32-56) with realised-perimeter tracking r = 0.9999."
        - "Computer-vision segmentation of a confocal fluorescence embryonic cell aggregate (`embryonic_cell_aggregate_specimen.jpg`) comparing empirical GFP/RFP radial occupancy against CPM core-shell profiles (r = 0.961, RMSE = 0.154)."
      transfer_boundary:
        - "2D lattice Cellular Potts representation of 3D multicellular spheroid cross-sections; the specimen is an embryoid-body spheroid, not a Hydra reaggregate, and its core/shell labels are assigned by fluorescence channel, not by cell type."
        - "Sorting dynamics include a whole-cell identity-swap move (8 attempts/MCS, Metropolis at 2.5 T) that is not part of the Graner-Glazier single-site copy formalism; the 'partial sorting lens' regime adds an uncited lateral bias field inside that move. Both are disclosed here, not in the script."
        - "Cells equilibrate at ~76 % of V_t under lambda = 1.2 and a hard v >= 6 floor; the PRL Fig. 3 comparison uses 0-150 MCS checkpoints whose digitisation from the 10^4-MCS figure is not documented."
      does_not_claim:
        - "Does not model subcellular cytoskeletal actin-myosin turnover, active chemotactic signaling, cell growth/division, or 3D aggregates; does not reproduce Glazier & Graner (1993) quantitative boundary-length curves at the paper's cell size (V_t ~ 40) or run length (10^4 MCS)."
    summary: >-
      Pass 3 (v3) evaluation of `1992-graner-cellular-potts-cell-sorting.py` (84.5/100, down from
      91.1/100 in Pass 2). The single v2 remediation item is closed: the Ouchi et al. (2003) perimeter
      elasticity term lambda_P (p_sigma - P_t)^2 is in the Metropolis kernel (`perimeter_energy_delta`,
      L199-206; `dp_old`/`dp_new` parity bookkeeping and acceptance, L560-588) with zero drift against a
      full recount, lambda_P = 0 reproduces the Pass 2 lattice bit-for-bit, and at lambda_P = 2 RMS(p - P_t)
      falls 14.05 -> 1.73 bonds, fragmentation 0.217 -> 0.083 and shape index 13.27 -> 12.30 while sorting
      survives (Delta_r = +0.355 vs +0.332). Three new Lean theorems (0 sorrys) pin the target perimeter
      12 s - 4, the single-copy perimeter parity and cost identities, and the monotonicity of the term above
      P_t. The re-read of the kernel, however, finds defects the v1/v2 assessors missed: a whole-cell
      `cell_type` identity-swap move with its own Metropolis rule at 2.5 T (L467-500) that is not in the
      Graner-Glazier formalism, an uncited 1.8 * x lateral bias that manufactures the 'lens' regime
      (L494-497; A2 is a concentric core-shell, Delta_r = +0.352), cells at 75.6 % of V_t with 3 cells on a
      hard v >= 6 floor (L530-531), dead `depinning_prob` code (L451-454), PRL Fig. 3 checkpoints without
      digitisation provenance, and uncited specimen thresholds (L807-831). Model fidelity, specimen match,
      morphometric validation and both traceability dimensions are therefore scored lower than in v2.
    scores:
      model-fidelity:
        value: 76
        rationale: >-
          Credited: the surface tension relations (`compute_cpm_tensions`, L109-154) match PRL Eqs. 2-3; the
          single-site Metropolis copy kernel (L502-588) carries the exact adhesion + quadratic volume Hamiltonian
          of PRL Eq. 1 with the Glazier & Graner (1993) Eq. 2 acceptance rule (P = 1 for dH <= 0, exp(-dH/T)
          otherwise, strictly negative only at T = 0); the Pass 3 Ouchi et al. (2003) term is correct in form
          (8-neighbour bond-count perimeter, Delta_p parity laws L562-563, energy delta L199-206, bookkeeping
          verified drift-free) and lambda_P = 0 recovers the v2 lattice bit-for-bit (self-test check 9). Deductions
          (all pre-date Pass 3, missed in v2): a whole-cell identity-swap move exchanges `cell_type` between two
          random cells 8 times per MCS under a separate Metropolis rule at temperature 2.5 T (L467-500); this
          teleports cell identity without any lattice motion and is not part of the Graner-Glazier formalism in
          which sorting arises from single-site copies alone (-10); the 'partial sorting lens' regime is not an
          emergent consequence of gamma_LD > gamma_DM - gamma_LM but is manufactured by a 1.8 * x lateral bias
          added inside that swap move (L494-497), and the realised A2 configuration is a concentric core-shell
          (Delta_r = +0.352, centroid offset 0.21), not a lens (-5); cells equilibrate at mean v = 12.1 = 75.6 % of
          V_t (RMS 5.16) because lambda = 1.2 is weak against J ~ 14-16, and a hard `vols <= 6` veto outside the
          Hamiltonian (L530-531; 3 cells sit on it) prevents the cell loss this would otherwise cause (-4);
          `depinning_prob` (L451-454) is computed from the §III.B pinning argument and never used, so the
          T = 0 arrest is a property of the acceptance rule, not of the documented factor (-2); lattice edges are
          excluded from copy attempts (L524-525) so medium contact at the boundary is never sampled (-1).
        evidence:
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [109, 154], note: "Exact PRL Eqs. 2-3 surface tensions and four-regime classifier", supports: true}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [502, 588], note: "Single-site Metropolis copy kernel: adhesion + quadratic volume + Pass 3 perimeter term with Glazier & Graner (1993) Eq. 2 acceptance", supports: true}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [199, 206], note: "perimeter_energy_delta = lambda_P dp (2 (p - P_t) + dp), Ouchi et al. (2003) Eq. 2 single-copy form matching Lean cpm_delta_perim", supports: true}
          - {file: morphoeval/lean/loops/Loop_042_cellular_potts_cell_sorting.lean, lines: [101, 193], note: "Pass 3 Theorems 4-6: target perimeter 12 s - 4, perimeter parity/cost identities, monotonicity above P_t (0 sorrys)", supports: true}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [467, 500], note: "Whole-cell cell_type identity swap, 8 attempts per MCS, own Metropolis rule at 2.5 T — not in the Graner-Glazier single-site formalism", supports: false}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [494, 497], note: "is_partial lateral bias 1.8 * x manufactures the 'lens' regime; A2 realised as concentric core-shell Delta_r = +0.352", supports: false}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [530, 531], note: "Hard vols <= 6 veto outside the Hamiltonian; cells at 75.6 % of V_t with 3 cells on the floor", supports: false}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [451, 454], note: "depinning_prob computed and never used (dead code)", supports: false}
      specimen-match:
        value: 84
        rationale: >-
          Credited: the SHA-256-locked confocal embryoid-body specimen is segmented into a GFP core (r_D/R = 0.49)
          and RFP shell (r_L/R = 0.77, Delta_r = +0.28) and its 12-annulus occupancy profile matches the CPM
          complete-sorting profile (r = 0.961, RMSE = 0.154, Panel B4); Panel C1 shows visibly more compact,
          simply connected cells than A1 with the same core-shell topology, and the GIF's fourth column shows
          the same. Deductions: the A2 'Partial Sorting / Lens' panel is visually indistinguishable from A1
          (both concentric core-shells; A2 Delta_r = +0.352 exceeds A1's +0.332) whereas Glazier & Graner's
          lens regime is a side-by-side doublet (-6); A1 at lambda_P = 0 shows 21.7 % of cells fragmented into
          satellite pixels, a lattice artefact the paper's larger cells (V_t ~ 40) do not show, and the canonical
          panels are still rendered at lambda_P = 0 (-4); the specimen is an embryoid-body spheroid labelled by
          fluorescence channel, not a Hydra endoderm/ectoderm reaggregate, so the core-shell correspondence to
          cell type is assumed (-4); the specimen comparison uses a 12-bin profile of a single image with no
          second specimen or Foty et al. (1996) envelopment measurement (-2).
        evidence:
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [791, 896], note: "Specimen segmentation (GFP core, RFP shell), 12-annulus profiles, Pearson r / RMSE and Fig. 3 checkpoint correlation", supports: true}
          - {file: docs/media/cellular_potts_cell_sorting_comparison.png, lines: [0, 0], note: "15-panel figure: A1-A5 regimes, B3 specimen overlay, B4 profile match r = 0.961, C1 compact cortical-tension cells; A2 'lens' is a concentric core-shell indistinguishable from A1", supports: true}
          - {file: docs/media/cellular_potts_cell_sorting_growth.gif, lines: [0, 0], note: "4-column GIF: complete sorting, T = 0 pinning, checkerboard, cortical tension lambda_P = 2 (compact cells, sorted core-shell)", supports: true}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [932, 936], note: "partial_sorting_lens regime rendered as Panel A2; realised Delta_r = +0.352 > A1, not a lens doublet", supports: false}
      parameter-expressivity:
        value: 91
        rationale: >-
          Credited: six regimes (A1-A5 + cortical tension C1), a 7-point J_LD sweep spanning gamma_LD in [-4, +9]
