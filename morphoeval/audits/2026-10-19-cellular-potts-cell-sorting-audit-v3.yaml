          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [1265, 1391], note: "15 measurements with reference values and units (8 Pass 2 + 7 Pass 3 cortical tension)", supports: true}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [209, 231], note: "compute_cell_fragmentation: 8-connected component count per cell (biological reference 0 fragmented)", supports: true}
          - {file: datasets/cellular_potts_cell_sorting/cellular_potts_cell_sorting_reference.json, lines: [169, 180], note: "PRL Fig. 3 'empirical_mcs_checkpoints' at 0-150 MCS with no digitisation provenance; the paper's figure spans ~10^4 MCS", supports: false}
          - {file: 1992-graner-cellular-potts-cell-sorting.py, lines: [1349, 1355], note: "cortical_tension_rms_perimeter_deviation reference_value is the script's own lambda_P = 0 run (self-referential)", supports: false}
      source-traceability:
        value: 87
        rationale: >-
          Credited: `datasets/cellular_potts_cell_sorting/` carries 7 sources with DOIs (JSON L6-46), the
          SHA-256-pinned specimen with Wikimedia source URL and CC BY 3.0 licence (L47-58), the Pass 3
