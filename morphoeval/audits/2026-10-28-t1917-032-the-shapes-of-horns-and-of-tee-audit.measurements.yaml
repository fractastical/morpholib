      reconstructed_in_script:
      - Algebraic accretion law κ = (v_max − v_min)/(w v̄) = Δ/w and its gnomonic closure sin ψ = Δ/c (E4-E5)
      - Screw-accretion frame update Ω = κ b + τ n generating circle / log spiral / helix / helico-spiral (E6)
      - Kiladze chord ratio tan α = π/(2 tan φ) conversion from a locally measured groove inclination (E7)
      transfer_boundary:
      - The narwhal tusk is a labelled analogue for the torsion component; Thompson's 1917 chapter never names the
        narwhal
      - A single 2-D museum photograph projects a 3-D helico-spiral tusk; plane-spiral tests are projection-limited
      does_not_claim:
      - 'No growth-rate (v_max, v_min) or CT data: λ and Δ are inferred from geometry, not measured'
      - No handedness determination from the narwhal photograph (tip orientation unknown)
