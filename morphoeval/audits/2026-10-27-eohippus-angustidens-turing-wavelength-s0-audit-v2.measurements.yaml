      reported_in_source:
      - Turing 1952 dispersion, Schnakenberg 1979 kinetics, Murray 1981 k_c.
      - 'Kondo and Miura 2010: pigment spacing of several cell diameters. Here 77.52/12 = 6.46 cells.'
      - MacFadden 1986 body-size scaling from Eohippus to Equus; Froehlich 2002 early Eocene taxonomy.
      reconstructed_in_script:
      - Grid diffusivities are the unique solution of the k_c formula at ratio 8.22 for lambda_c = 7.752e-05 m and
        lambda_px = 14.
      - Final GIF frame blends the saturated field at weight 0.55 with the gallery plate. The weight table is stored
        in the metrics JSON.
      transfer_boundary:
      - From this 1/1 Wasatchian stage to Orohippus, cellular lambda_c is predicted not to track Cope's Law. Organ-scale
        stripe number can.
      - The detail wavenumber is between 42 and 43 times the 3.3 mm organ-tier sibling. Kinetics were not copied
        from that sibling.
      does_not_claim:
      - No fossil integument measurement of a 78 µm Eohippus stripe is claimed.
      - The negative aligned-lattice Pearson is the evidence that the render is not the plate.
      - Nanopublications were not signed; no profile was present.
