    claim_boundary:
      reported_in_source:
        - "Lewis (2003) Current Biology 13:1398-1408 single-cell her1/her7 delay differential equations dp/dt = a m(t - T_p) - b p(t) and dm/dt = k / (1 + (p(t - T_m)/p_0)^n) - c m(t)"
        - "Supercritical Hopf bifurcation threshold T_tot = T_m + T_p > T_crit, oscillation period rule T_osc ~ 2*(T_m + T_p + tau_p + tau_m) ~ 30 min at 28 C, and DeltaC-Notch synchronization vs bea/des/aei mutant desynchronization after 5-7 anterior somites"
      reconstructed_in_script:
        - "4th-order Runge-Kutta method-of-steps DDE integrator verifying total delay invariance (T_m - delta, T_p + delta), Hopf threshold T_crit = 7.54 min, subcritical intron-deletion damping (0 late peaks), and cycloheximide arrest (a=0 -> m*=143.5 molecules)"
        - "32-cell stochastic PSM phase-oscillator ensemble reproducing wild-type Notch-coupled synchrony (R_sync = 0.9840, 14/14 intact somites) vs Notch mutant desynchronization after 6 intact anterior somites (late R_sync = 0.2316)"
        - "Bilateral dorsal somite row DoG peak and inter-somitic cleft segmentation on zebrafish_somites_specimen.jpg (48.47 px mean spacing, symmetry ratio 0.9605)"
      transfer_boundary:
        - "Single-cell her1/her7 DDE and 1D stochastic Kuramoto-Notch PSM chain mapped to dorsal vertebrate SEM somite metameres"
      does_not_claim:
