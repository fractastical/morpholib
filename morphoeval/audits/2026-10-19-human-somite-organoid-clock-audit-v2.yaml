          - {file: morphoeval/math_kg_loops/diaza-human-somite-organoid-clock.yaml, lines: [1, 95], note: "Math KG loop specification linking equations, Lean 4 declarations, and code loci", supports: true}
      repro-package:
        value: 91
        rationale: >-
          Deterministic RNG (`seed=2019`), standalone `--self-test` suite verifying SHA-256
          dataset integrity, exact tempo rescaling collapse (<1e-11 nM), bitwise two-run
