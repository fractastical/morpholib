          specimen was mislabelled as zebrafish in v1/v2 (-4).
        evidence:
          - {file: 2003-lewis-her1-her7-delayed-oscillator.py, lines: [112, 142], note: "EXPECTED_SHA256 now pins specimen, scout manifest AND reference JSON; verify_dataset_integrity fails closed", supports: true}
          - {file: datasets/her1_her7_delayed_oscillator/her1_her7_delayed_oscillator_reference.json, lines: [164, 216], note: "Vendored Schroter (2012) truth table with encoding note and lattice_model_parameters block with provenance per parameter group", supports: true}
          - {file: datasets/her1_her7_delayed_oscillator/her1_her7_delayed_oscillator_reference.json, lines: [88, 102], note: "Regime table caveat added, but regime T_m/T_p/observed values remain without page/figure pins", supports: false}
          - {file: datasets/her1_her7_delayed_oscillator/README.md, lines: [20, 46], note: "README laws 2, 4, 5 rewritten with Pass 3 corrections, lattice equations, truth table and chick-proxy disclosure", supports: true}
      code-traceability:
        value: 92
        rationale: >-
          The module docstring (L1-85) now states five laws, each mapped to its Lean theorem(s) and to Lewis
          Eqs. 1-2 / Box 1 / Figs. 5-6 or Schroter Figs. 2-3, 5-7; the lattice equations are written out
          variable by variable; every lattice/truth-table function docstring names its law id and Lean theorem;
          `math_kg_loops/lewis-her1-her7-delayed-oscillator.yaml` registers laws 4-5 with code loci. Deductions:
