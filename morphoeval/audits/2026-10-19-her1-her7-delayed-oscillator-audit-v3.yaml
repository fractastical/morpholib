# MorphoEval audit — Lewis (2003) Zebrafish her1/her7 Delayed Oscillator & Notch Coupling, 2026-10-19 (v3)
#
# Pass 3 re-score of `2003-lewis-her1-her7-delayed-oscillator.py` (1,613 lines, 9 self-test groups) after the
# remediation of both open v2 findings in the instrumented loop
# `morphoeval/runs/2026-10-19-her1-her7-delayed-oscillator-loop-pass3`, superseding
# `2026-10-19-her1-her7-delayed-oscillator-audit-v2` (91.1). The primary assessor re-read every cited line of
# the CURRENT file (commit d58a084, working tree of this loop) before scoring.
#
# What Pass 3 changed (both v2 remediation items):
#   1. v2 item 1 ("extend the 32-cell phase chain to a full 2D multicellular DDE lattice with explicit delayed
#      DeltaC protein translation and NICD cleavage kinetics") -> CLOSED, reduced form declared:
#      `simulate_her1_her7_lattice` (L598-734) integrates an 8 x 24 sheet with 7 delayed variables per cell
#      (her1/her7/deltaC mRNA + protein, NICD), Heun method-of-steps with linear history interpolation,
#      delayed DeltaC translation (T_pD = 20.5 min), NICD produced by Michaelis-Menten occupancy of neighbour
#      DeltaC after T_N (L693-701), Notch-gated her transcription G_N (L688), Langevin mRNA noise (L713),
#      per-cell delay heterogeneity (L653) and an asynchronous-onset mode (L716). `analyze_lattice` (L736-812)
#      extracts column periods (autocorrelation), per-cycle mediolateral Kuramoto R, intact anterior cycles and
#      the kinematic wave count; `compute_lattice_suite` (L814-849) runs WT / eps_N = 0 / hes6-null / T_N sweep /
#      Hes6 sweep / re-synchronisation experiments.
#   2. v2 item 2 ("couple the AP spatial phase gradient to the Schroter et al. (2012) Her1/Her7/Hes6
#      heterodimerization truth table") -> CLOSED, reduced form declared: `SCHROTER_2012_DIMER_TRUTH_TABLE`
#      (L532-542), `schroter_dimer_repression` (L558-587), `hes6_gradient_profile` (L590-595); Hes6 is a
#      non-oscillating posterior-high gradient (4 -> 40) selecting Her7:Hes6 (fast) vs Her1:Her1 (slow)
#      repression. Single-cell Hes6 titration 41.2 -> 36.4 min (monotone), lattice AP gradient 40.8 -> 38.6 min,
#      hes6-null tissue uniform at 41.4 min = her1-only DDE (Panel H).
#   3. Defects exposed by the remediation and now disclosed in code, JSON, README and here:
#      (a) the Pass 2 "5-regime validation r = 0.9999" correlated the JSON `predicted_period_min` column with the
#          JSON `observed_period_min` column; neither was computed by the script. The model-computed correlation
#          (RK4 DDE per regime) is r = 0.791, RMSE = 11.8 min (`evaluate_perturbation_regimes` L358-406,
#          `regime_correlations` L409-423, Panel D L1191-1219).
#      (b) the tabulated "pure her7 fast loop" regime (T_m = 4.6, T_p = 1.7 => T_tot = 6.3 min) lies BELOW the
#          Hopf threshold the script computes (T_crit = 7.54 min), so the model predicts a damped clock where the
#          table claims 24.65 min; the "~4.62 min" threshold quoted in the v1/v2 docstring, README and JSON was
#          not derived from the implemented linearization and has been retired.
#      (c) the Box 1 period law is 12% off the script's own DDE (30.0 vs 33.6 min with canonical parameters);
#          v2 reported the analytic value as "the" WT period and labelled Panel A with T_osc = 0.0 because the
#          180-min integration never populated the [120, 300] min period window (fixed: L1097-1101).
#      (d) the vendored specimen `zebrafish_somites_specimen.jpg` is, per its Wikimedia Commons source title, a
#          CHICK embryo SEM, not Danio rerio; it is now declared a cross-species proxy (JSON L34, README L45).
#      (e) the v2 environment block (numpy 2.4.2 / scipy 1.17.0 / matplotlib 3.10.8 / Pillow 12.1.1) did not
#          match the venv (numpy 2.5.4 / scipy 1.16.3 / matplotlib 3.10.7 / Pillow 12.0.0); corrected below.
#   4. Four new Lean 4 theorems (0 sorrys, `lean` exit 0) in `Loop_022_her1_her7_delayed_oscillator.lean`
#      L106-190, registered as laws 4-5 in `math_kg_loops/lewis-her1-her7-delayed-oscillator.yaml`.
#   5. Reference JSON now SHA-256-pinned in `EXPECTED_SHA256` (L112-127); lattice parameters and truth table
#      vendored in the JSON (L164-216) and asserted against the code by --self-test (L1513-1523).
#
# Scores below: overall 87.2 (down from 91.1). The decrease is deliberate: the requested mechanisms were
# delivered in reduced, declared form, but the remediation exposed that the v2 headline validation was
# tabulated-vs-tabulated, that one tabulated regime contradicts the model's own Hopf threshold, that the Box 1
# law and the DDE disagree by 12%, and that the specimen is a chick proxy. Remaining findings are listed under
# `remediation` with line pins.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files at commit d58a084 (working tree of this loop).

