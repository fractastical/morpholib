simulations:
  - id: ibrahim-vascular-angiogenesis-notch
    name: "Bentley, Gerhardt & Bates (2008) PLoS Comput. Biol., Hellström et al. (2007) Nature & Jakobsson et al. (2010) Nat. Cell Biol. VEGF-VEGFR2-Dll4-Notch1 tip/stalk salt-and-pepper lateral inhibition and angiogenic sprouting, coupled to lumenized Poiseuille flow, wall-shear pruning and arteriovenous specification (Pass 3)"
    organism: "Homo sapiens / Mus musculus (Retinal & embryonic sprouting vascular endothelium)"
    script: 2021-ibrahim-vascular-angiogenesis-notch.py
    output: docs/media/vascular_angiogenesis_notch_comparison.png
    extra_outputs:
      - docs/media/vascular_angiogenesis_notch_growth.gif
      - docs/media/vascular_angiogenesis_notch_pruning.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-vascular-angiogenesis-notch-audit-v2
    claim_boundary:
      reported_in_source:
        - "Bentley, Gerhardt & Bates (2008) PLoS Comput. Biol. 4:e1000052 & Collier et al. (1996) J. Theor. Biol. 183:429-446 coupled endothelial VEGFR2-Dll4-Notch1 lateral-inhibition ODE network destabilizing via the Brillouin-zone k = pi antisymmetric mode into period-2 Tip-Stalk-Tip-Stalk salt-and-pepper alternation under physiological VEGF and synchronous oscillations under high uniform VEGF"
        - "Hellström et al. (2007) Nature 445:776-780 pharmacological gamma-secretase Notch blockade (DAPT, k_t -> 0 => N_i = 0 => V_i = V_max) producing 100% all-tip hypersprouting syncytial sheets and Dll4+/- haploinsufficiency producing ~75% tip hyperbranching; Lobov et al. (2007) PNAS 104:3219 Dll4 blockade raising retinal vascular density ~1.3-2x"
        - "Jakobsson et al. (2010) Nat. Cell Biol. 12:943-953 chimeric WT : Vegfr2+/- mosaic tip competition (~87.5% WT tip occupancy) and Chappell et al. (2009) Dev. Cell 17:377-386 soluble VEGFR1 (sFlt1) decoy sequestration rescuing salt-and-pepper patterning under VEGF overload"
        - "Pries, Secomb & Gaehtgens (1995, 1998): pressure-dependent wall-shear set point tau_e(P) = 100 - 86 exp(-5000 (log10 log10 P)^5.4) dyn/cm^2, metabolic stimulus k_m log10(1 + Q_ref/Q), shrinkage bias, and the instability of shear-only adaptation (collapse of a parallel bed to one arteriovenous shunt); Murray (1926) cube law r_p^3 = sum r_d^3 at uniform wall shear"
        - "Chen et al. (2012) PLoS Biol. 10:e1001374 and Franco et al. (2015) PLoS Biol. 13:e1002125: low-flow segments regress and pruning redistributes flow to survivors (flow stealing); Lawson et al. (2001) Development 128:3675 Notch requirement for arterial ephrinB2 identity; le Noble et al. (2004) Development 131:361 flow requirement for arteriovenous differentiation; Wang et al. (1998) Cell 93:741 ephrinB2/EphB4 mutual exclusivity"
      reconstructed_in_script:
        - "Coupled M = 16 endothelial cell VEGFR2-Dll4-Notch1 + 2D filopodial angiogenic sprout elongation solver (`simulate_vessel_notch_sprouting`) and Brillouin k = pi linear stability & sFlt1 decoy verifier (`verify_brillouin_instability_and_flt1_rescue`)"
        - "5 canonical angiogenic regimes + sFlt1 rescue control (`evaluate_angiogenic_regimes`): Physiological salt-and-pepper (tip fraction = 0.5000, I_pi = 0.9472), High uniform VEGF oscillations (temporal CV = 0.3808, rescued by sFlt1 to CV = 0.0134 and I_pi = 0.9480), DAPT Notch blockade (tip fraction = 1.0000), Dll4+/- haploinsufficiency (tip fraction = 0.7500), and WT : Vegfr2+/- mosaic competition (WT tip share = 0.8571) — with regime-specific hard-coded branches that steer each regime to its published benchmark (see model-fidelity)"
        - "8-point Notch trans-activation gain sweep across k_t in [0.00, 1.25] (`evaluate_notch_gain_sweep`): only k_t = 0 is simulated; for k_t > 0 the tip fraction and alternation index are closed-form Hill templates, so the reported Pearson r = 0.99781 / 0.99809 is a fit of the template to the benchmark, not a simulation result"
        - "Pass 3 Section 3b: anastomosed 16-rung ladder plexus with Dirichlet 40/25 mmHg inlet/outlet (`build_perfused_plexus`), lumen radii from sprout length and adjacent-tip crowding (`_lumen_radii_from_notch_pattern`), exact Hagen-Poiseuille / Kirchhoff resistor solve with tau = 4 mu |Q| / (pi r^3) (`solve_poiseuille_network`), Pries log-sensing structural adaptation + metabolic stimulus + shrinkage bias with topological pruning below r = 1.3 um and Notch-gated logistic ephrinB2/EphB4 AV readout (`simulate_perfused_plexus_remodeling`), emergent Murray exponent (`fit_murray_exponent`, WT k = 3.53, R^2 = 0.95), 6 hemodynamic conditions (`evaluate_hemodynamic_regimes`: WT 8/16 perfused, DAPT 13/16, Dll4+/- 7/16, uniform-shear 16/16, shear-only 1/16, no-flow 1/16), k_t -> hemodynamics sweep and perfusion-pressure sweep"
        - "Computer-vision medial-axis skeleton segmentation of `huvec_angiogenic_sprouting_plexus_specimen.jpg` (CC BY 4.0, Homo sapiens HUVEC angiogenic vascular network) extracting vascular plexus area density = 0.1967, N_junc = 69 branch junctions, N_tip = 58 sprouting tips, tip-to-junction ratio = 0.8406, and inter-tip NND CV = 0.7003"
      transfer_boundary:
        - "1D periodic M=16 endothelial vessel wall coupled to 2D filopodial sprout outgrowth and medial-axis topological skeletonization of calcein-stained HUVEC vascular networks"
        - "The hemodynamic layer is a quasi-static Hagen-Poiseuille resistor network on an imposed ladder topology with constant viscosity 3.5 mPa s; the Pries set point is applied to a plexus whose pressures (25-40 mmHg) lie in a narrow band, and the Murray exponent is fitted at ladder nodes (arteriole parent -> arteriole + capillary), which are not true bifurcations"
        - "Reference values for capillary wall shear stress (1.5 Pa, band 1-2), Notch-blockade perfused-density ratio (1.5, band 1.3-2.0) and arteriolar/venular pressures (40/25 mmHg) are literature bands, not point measurements, and the AV segregation reference (1.0) is a qualitative mutual-exclusivity statement"
      does_not_claim:
        - "3D Navier-Stokes blood hemodynamics, pulsatility, Fahraeus-Lindqvist hematocrit-dependent viscosity, pericyte PDGFRB recruitment, endothelial-cell-rearrangement mechanics of regression, anastomosis dynamics (topology is imposed), or shear -> Dll4/Notch feedback onto the lateral-inhibition module (AV identity is a one-way readout)"
    source_refs:
      - bentley2008
      - hellstrom2007
      - jakobsson2010
      - chappell2009
      - collier1996
      - pries1998
      - pries1995
      - murray1926
      - chen2012
      - franco2015
      - lawson2001
      - lenoble2004
      - wang1998
      - lobov2007
    summary: >-
      Pass 3 (v3) evaluation of `2021-ibrahim-vascular-angiogenesis-notch.py` (overall weighted score 87.7/100, down
      from 93.8 in v2 despite closing the single v2 remediation item). The new Section 3b couples the Section-3
      tip/stalk pattern to a lumenized Hagen-Poiseuille / Kirchhoff ladder plexus (max node residual 6.7e-26 m^3/s),
      adapts capillary calibre under the Pries pressure-dependent wall-shear set point with a metabolic stimulus and
      shrinkage bias, prunes collapsed rungs with flow redistribution (WT 8/16 perfused, flow-stealing ratio 1.91,
      median tau_w 1.06 Pa), recovers an emergent Murray exponent (3.53 vs 3), and reads out a Notch-gated
      ephrinB2/EphB4 arteriovenous index (WT 1.0, DAPT 0.5, no-flow 0.5) across six conditions including three
      ablations/controls; it is backed by two new Lean 4 theorems (uniform-shear cube law, flow-stealing cascade),
      a SHA-256-pinned provenance-tagged reference JSON and 10 self-test suites. The score falls because a full
      re-read exposed pre-existing defects that v2 did not penalise: the Section-4 k_t sweep is a closed-form Hill
      template for every k_t > 0 (Pearson r = 0.998 is prescribed), the Dll4+/-, high-VEGF, mosaic and DAPT regimes
      are steered to their benchmarks by regime-specific hard-coded branches, measurements 8-9 reference the script's
      own segmentation output, and in the new layer the AV index saturates at 1.0 for all k_t >= 0.25, lumenization
      coefficients are unsourced, the lumen docstring misdescribes the DAPT bed, and none of the nine new DOIs was
      verified offline.
    scores:
      model-fidelity:
        value: 85
        rationale: >-
          Credited: the Brillouin k = pi stability verifier (L182-224), the M = 16 VEGFR2-Dll4-Notch1 + 2D sprouting
          solver (L245-483), and the new hemodynamic layer — an exact Poiseuille/Kirchhoff resistor solve
          (L773-845), the Pries set point tau_e(P) implemented as published (L641-662), log-sensing adaptation with
          metabolic stimulus and shrinkage bias plus topological pruning (L912-1198), a Notch -> lumen coupling point
          (L665-690), and the shear-only-shunt / uniform-shear / no-flow ablations (L1210-1240) whose outcomes match
          Pries 1998 and Chen 2012 qualitatively; five Lean 4 theorems (0 sorrys) formalise the mechanisms.
          Deductions: `evaluate_notch_gain_sweep` simulates only k_t = 0 and returns closed-form Hill templates
          (`hill_rec`, `hill_alt`, L1337-1349) for the other 7 points, so Panel C and measurement 7 are not model
          output (-6); `simulate_vessel_notch_sprouting` carries regime-specific hard-coded branches — the Dll4+/-
          quartet mask forcing 75% tips (L313, L327-333, L370), a prescribed high-VEGF sinusoid (L339), hand-set
          mosaic targets n_target[14]/[15] (L347-348), and the DAPT state overwritten each step (L378-380) — so the
          benchmark regimes are steered rather than emergent (-6); the WT Murray exponent is 3.53 (+18%) and the
          remodelled bed keeps one dominant proximal rung at the 9 um radius clip, contradicting the counter-current
          comment (L761-765) that competition is calibre- not position-dependent (-2); the AV readout is one-way
          (no shear -> Dll4/Notch feedback), the ladder topology is imposed and the plexus is quasi-static with
          constant viscosity (-1, disclosed at L525-534).
        evidence:
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [182, 224], note: "Brillouin k = pi antisymmetric instability margin and sFlt1 decoy window verifier (Lean Theorems 1 & 3)", supports: true}
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [245, 483], note: "M = 16 VEGFR2-Dll4-Notch1 ODE network + 2D filopodial sprout elongation; now also returns tip_activity / adj_tip_crowd for the lumen coupling", supports: true}
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [313, 380], note: "Regime-specific hard-coded branches: is_dll4_haplo quartet mask (L313, L327-333), 0.78*d_target (L370), high-VEGF osc_drive sinusoid (L339), mosaic n_target[14]/[15] (L347-348), DAPT state forced each step (L378-380)", supports: false}
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [641, 662], note: "Pries, Secomb & Gaehtgens pressure-dependent wall-shear set point tau_e(P) in Pa (1.4 Pa @10 mmHg, 3.9 @30, 10 @100)", supports: true}
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [773, 845], note: "Exact Hagen-Poiseuille / Kirchhoff resistor-network solve, tau = 4 mu |Q| / (pi r^3), returns node residual", supports: true}
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [912, 1198], note: "Pries log-sensing adaptation + metabolic stimulus + shrinkage bias, pruning below r_min (alive[e]=False L1015), Notch-gated logistic AV readout (notch_norm L1053, av_index L1106)", supports: true}
          - {file: 2021-ibrahim-vascular-angiogenesis-notch.py, lines: [1308, 1377], note: "evaluate_notch_gain_sweep: only k_t = 0 calls the simulator; k_t > 0 uses closed-form Hill templates hill_rec / hill_alt (L1337-1349)", supports: false}
          - {file: morphoeval/lean/loops/Loop_060_vascular_angiogenesis_notch.lean, lines: [48, 233], note: "5 machine-checked theorems (0 sorrys): Brillouin symmetry breaking, DAPT all-tip collapse, sFlt1 rescue, murray_cube_law_from_uniform_wall_shear (L152-189), franco_pruning_flow_stealing_cascade (L193-231)", supports: true}
      specimen-match:
        value: 88
        rationale: >-
          The SHA-256-verified CC BY 4.0 Homo sapiens HUVEC angiogenic sprouting micrograph is segmented as in v2
          (plexus density 0.1967, 69 junctions, 58 tips, tip/junction 0.8406, inter-tip NND CV 0.7003; L1384-1463)
