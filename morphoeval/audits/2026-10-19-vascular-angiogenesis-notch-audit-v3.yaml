# MorphoEval Pass 3 (v3) Audit — Bentley, Gerhardt & Bates (2008) PLoS Comput. Biol. 4(3):e1000052, Hellström et al. (2007)
# Nature 445:776-780 & Jakobsson et al. (2010) Nat. Cell Biol. 12:943-953, now coupled (Pass 3, Section 3b) to a lumenized
# Hagen-Poiseuille / Kirchhoff plexus with Pries wall-shear structural adaptation, flow-stealing pruning and Notch-gated
# arteriovenous specification (Pries, Secomb & Gaehtgens 1998; Chen et al. 2012; Franco et al. 2015; Lawson et al. 2001).
#
# Pass 3 post-remediation re-score of `2021-ibrahim-vascular-angiogenesis-notch.py` (Slot 060, 2380 lines) in the
# instrumented loop `morphoeval/runs/2026-10-19-vascular-angiogenesis-notch-loop-pass3`, superseding
# `2026-10-19-vascular-angiogenesis-notch-audit-v2` (93.8). Primary assessor: Claude Fable 5.1 (Phase B subagent).
#
# What Pass 3 changed (the single v2 remediation item):
#   1. Section 3b (L519-L1302): the M = 16 tip/stalk pattern of Section 3 is anastomosed into a 16-rung ladder plexus
#      (`build_perfused_plexus`), lumen radii are set from sprout length and adjacent-tip crowding
#      (`_lumen_radii_from_notch_pattern`), the Hagen-Poiseuille / Kirchhoff resistor network is solved exactly
#      (`solve_poiseuille_network`, max node residual 6.7e-26 m^3/s), capillary calibre adapts under the Pries
#      pressure-dependent wall-shear set point + metabolic stimulus + shrinkage bias with topological pruning below
#      r = 1.3 um (`simulate_perfused_plexus_remodeling`), the Murray exponent is fitted as an emergent diagnostic
#      (`fit_murray_exponent`, k = 3.53), and a Notch-gated logistic ephrinB2/EphB4 readout gives an AV segregation
#      index. Six conditions (wt, dapt, dll4_het, uniform_shear, shear_only_shunt, no_flow) plus a k_t -> hemodynamics
#      sweep and a perfusion-pressure sweep; Panels G-I, a pruning GIF, 5 new measurements (14 total), self-test
#      suites 9-10 (10 total), Lean Theorems 4-5 (5 total, 0 sorrys), a SHA-256-pinned reference JSON with
#      per-parameter provenance tags, +9 BibTeX entries.
#
# Why the overall score goes DOWN (93.8 -> 87.7) although the remediation item is closed: re-reading the whole script
# for Pass 3 exposed defects that v2 did not penalise and that Pass 3 left in place — the Section 4 k_t sweep is a
# closed-form Hill template for every k_t > 0 (so the reported Pearson r = 0.998 is prescribed, not simulated), the
# Dll4+/-, high-VEGF, mosaic and DAPT regimes carry regime-specific hard-coded branches that force the published
# benchmark values, and measurements 8-9 use the script's own segmentation output as the reference. The new
# hemodynamic layer is honest about being a reduced quasi-static model, but its AV index saturates at 1.0 for every
# k_t >= 0.25, the Murray exponent is +18% off the cube law, the lumenization coefficients are unsourced, and none of
# the nine new DOIs could be verified offline (network tools were forbidden in this round).
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the files in the working tree at commit 45670cb8 plus the uncommitted Pass 3 edits.

