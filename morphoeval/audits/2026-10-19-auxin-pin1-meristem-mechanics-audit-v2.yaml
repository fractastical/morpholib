          - {file: datasets/auxin_pin1_meristem_mechanics/auxin_pin1_meristem_mechanics_reference.json, lines: [1, 130], note: "SHA-256-locked reference dataset with 4-zone stresses, PIN1-auxin parameters, and ablation benchmarks", supports: true}
      code-traceability:
        value: 92
        rationale: >-
          Module and function docstrings map every equation to Hamant et al. (2008)
