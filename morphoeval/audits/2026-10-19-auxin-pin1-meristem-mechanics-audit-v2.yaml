simulations:
  - id: mirabet-auxin-pin1-meristem-mechanics
    name: "Hamant et al. (2008) & Heisler et al. (2010) pressurized SAM shell stress tensor, cortical microtubule alignment, and PIN1-auxin phyllotactic mechanics"
    organism: "Arabidopsis thaliana (shoot apical meristem L1 epidermis & floral primordia)"
    script: 2008-hamant-meristem-microtubule-stress.py
    output: docs/media/auxin_pin1_meristem_mechanics_comparison.png
    extra_outputs:
      - docs/media/auxin_pin1_meristem_mechanics_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Hamant et al. (2008) Science 322:1650-1655 pressurized shell principal tensile stress tensor across spherical dome (sigma_theta = sigma_m = PR/2t), cylindrical flank (sigma_theta = 2*sigma_z = PR/t), and negative-Gaussian-curvature primordium boundary saddle crease, driving cortical microtubule (CMT) alignment and anisotropic Lockhart wall yielding"
        - "Heisler et al. (2010) PLoS Biol 8:e1000516 co-alignment between PIN1 auxin efflux carrier polarity and CMT orientation across L1 meristem cells (84.5% within +-30 deg) and synchronous circumferential reorientation following single-cell laser ablation"
      reconstructed_in_script:
        - "Doubly-curved thin-shell Laplace-Young principal stress solver across all 4 SAM curvature zones + Fokker-Planck CMT nematic order S_CMT(A_sigma) + transverse-isotropic Lockhart cell-wall yielding"
        - "168-cell paraboloidal L1 dome coupled Auxin-PIN1-CMT ODE simulator verifying antisymmetric active flux conservation, 84.91% PIN1-CMT co-alignment within +-30 deg (p = 4.46e-41), and 137.06 deg golden-angle phyllotaxis"
        - "Kirsch circular laser-ablation wound stress redistribution (rim hoop stress doubling 2*sigma_inf), lateral micro-vise compression (dome S_CMT: 0.18 -> 0.81), and 20 ug/mL oryzalin CMT-depolymerization negative control (S_CMT = 0.04, E_par/E_perp = 1.0)"
        - "Automated segmentation of Toluidine-Blue Arabidopsis SAM histological section (`arabidopsis_sam_meristem_specimen.jpg`, 539 tunica-corpus nuclei, L1 dome contour & saddle crease localization)"
      transfer_boundary:
        - "Axisymmetric/saddle thin-shell stress laws and 168-cell paraboloidal L1 dome mapped to longitudinal histological SAM section"
      does_not_claim:
        - "Full 3D multi-layered L1/L2/L3 finite-element polyhedral vertex growth with discrete cytokinesis planes"
    source_refs:
      - hamant2008
      - heisler2010
      - jonsson2006
      - mirabet2012
    summary: >-
      Pass 2 (v2) evaluation of `2008-hamant-meristem-microtubule-stress.py` (overall
      weighted score: 92.6/100, up from 54.1/100 in v1). The remediated script solves
      doubly-curved pressurized thin-shell principal stresses and transverse-isotropic
      Lockhart yielding across all 4 SAM curvature zones (spherical dome, peripheral
      flank, cylindrical stem, and negative-Gaussian-curvature primordium saddle crease;
      CMT nematic order r = 0.9921, p = 7.88e-3); integrates a 168-cell L1 dome coupled
      Auxin-PIN1-CMT ODE system reproducing 84.91% PIN1-CMT co-alignment within +-30 deg
      (ref 84.5%, p = 4.46e-41), r_circ = 0.8738 (ref 0.88), and 137.06 deg phyllotactic
      divergence angles; validates Kirsch laser-ablation wound rim hoop-stress doubling
      (post-ablation circumferential fraction 0.9103 vs ref 0.91), lateral compression,
      and oryzalin CMT-depolymerization controls; and segments the SHA-256-locked
      Arabidopsis SAM histological specimen (`arabidopsis_sam_meristem_specimen.jpg`,
      539 nuclei, NN spacing CV = 0.2602).
    scores:
      model-fidelity:
        value: 94
        rationale: >-
          Implements doubly-curved thin-shell Laplace-Young principal stresses across
          positive and negative Gaussian curvature SAM zones (`compute_shell_stress_from_curvatures`,
          L90-141), Fokker-Planck CMT nematic order (`predict_cmt_nematic_order`, L144-158),
          transverse-isotropic Lockhart cell-wall yielding (`compute_anisotropic_lockhart_yielding`,
          L161-189), a 168-cell paraboloidal L1 coupled Auxin-PIN1-CMT ODE integrator
          (`simulate_cellular_sam_pin1_cmt`, L241-428), and Kirsch laser-ablation / lateral
          compression / oryzalin perturbation controls (`simulate_mechanical_perturbations`,
          L434-508), backed by 3 machine-checked Lean 4 theorems in
          `morphoeval/lean/loops/Loop_033_auxin_pin1_meristem_mechanics.lean`.
        evidence:
          - {file: 2008-hamant-meristem-microtubule-stress.py, lines: [90, 235], note: "Doubly-curved pressurized shell stress tensor, CMT nematic order, and anisotropic Lockhart yielding across 4 SAM zones", supports: true}
          - {file: 2008-hamant-meristem-microtubule-stress.py, lines: [241, 508], note: "168-cell coupled Auxin-PIN1-CMT ODE solver and Kirsch laser ablation / compression / oryzalin controls", supports: true}
          - {file: morphoeval/lean/loops/Loop_033_auxin_pin1_meristem_mechanics.lean, lines: [13, 102], note: "3 machine-checked Lean 4 theorems for shell stress anisotropy, Kirsch ablation rim hoop doubling, and PIN1 flux conservation (0 sorrys)", supports: true}
      specimen-match:
        value: 90
        rationale: >-
          Vendors and SHA-256-verifies the CC BY-SA 4.0 Toluidine-Blue longitudinal
          section of the Arabidopsis thaliana shoot apical meristem (`arabidopsis_sam_meristem_specimen.jpg`),
          segments the L1 epidermal contour, fits the central SAM dome curvature radius
          (R_px = 81.3 px -> 50.0 um calibrated), localizes the negative-curvature saddle
          boundary crease between the SAM dome and emerging lateral primordium, and detects
          539 tunica-corpus nuclei (NN spacing CV = 0.2602, `segment_arabidopsis_sam_specimen`, L514-612).
        evidence:
          - {file: 2008-hamant-meristem-microtubule-stress.py, lines: [514, 612], note: "Chromaticity + DoG segmentation of Arabidopsis SAM L1 dome contour, saddle crease, and 539 nuclei", supports: true}
          - {file: docs/media/auxin_pin1_meristem_mechanics_comparison.png, lines: [0, 0], note: "6-panel synthesis figure comparing 4-zone stresses, 168-cell L1 Auxin-PIN1-CMT dome, Kirsch ablation, and SAM specimen segmentation", supports: true}
      parameter-expressivity:
        value: 91
        rationale: >-
          Evaluates 4 SAM curvature regimes spanning K in [-0.00036, +0.00040] um^-2 and
          stress ratio sigma_1/sigma_2 in [1.0, 5.0] (L192-235), 5 mechanical perturbation
          states (pre-ablation, 6h post-ablation, pre-compression, lateral micro-vise
          compression, and 20 ug/mL oryzalin CMT depolymerization, L434-508), and exposes
          `--turgor-P`, `--dome-R`, `--wall-t`, `--b-sigma`, `--k-sigma`, and `--seed`
          CLI overrides (L892-928).
        evidence:
          - {file: 2008-hamant-meristem-microtubule-stress.py, lines: [192, 235], note: "4-zone curvature and stress anisotropy evaluation", supports: true}
          - {file: 2008-hamant-meristem-microtubule-stress.py, lines: [892, 928], note: "CLI parameter overrides wired into shell stress and cellular ODE solvers", supports: true}
      morphometric-validation:
        value: 93
        rationale: >-
          `measure_morphoeval()` (L772-846) computes 9 reference-anchored morphometric
          measurements with uncertainty, p-values, and negative controls, all 9 within 1%
          of reference values: cylindrical hoop/axial stress ratio 2.0000 (ref 2.0),
          saddle crease anisotropy 0.6667 (ref 0.6667), 4-zone CMT nematic order Pearson
          r = 0.9921 (p = 7.88e-3, RMSE = 0.0523), L1 PIN1-CMT co-alignment within +-30 deg
          0.8491 (ref 0.845, p = 4.46e-41), circular correlation r_circ = 0.8738 (ref 0.88),
          phyllotactic divergence angle 137.06 ± 5.07 deg (ref 137.51 deg), post-ablation
          circumferential fraction 0.9103 (ref 0.91 vs 0.34 pre-ablation), oryzalin control
          S_CMT = 0.0400 (ref 0.04), and calibrated SAM dome radius 50.00 um (ref 50.0 um).
        evidence:
          - {file: 2008-hamant-meristem-microtubule-stress.py, lines: [772, 846], note: "9 reference-anchored morphometric measurements with Binomial/Pearson p-values, RMSE, SD, and ablation controls", supports: true}
      source-traceability:
        value: 95
        rationale: >-
          Vendors `datasets/auxin_pin1_meristem_mechanics/` with 5 primary BibTeX entries
          and verified DOIs (`10.1126/science.1165594`, `10.1371/journal.pbio.1000516`,
