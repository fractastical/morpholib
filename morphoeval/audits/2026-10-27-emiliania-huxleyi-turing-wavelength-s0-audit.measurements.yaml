    claim_boundary:
      reported_in_source:
      - Turing 1952 selects a finite critical wavelength from reaction and diffusion.
      - Schnakenberg 1979 gives f = a - u + u^2 v and g = b - u^2 v.
      - 'Henriksen et al. 2004: Emiliania CAP blocks acute calcite steps. Young & Henriksen 2003: coccolith calcite
        grows inside a vesicle.'
      reconstructed_in_script:
      - a, b and the diffusion ratio are set so lambda_c is exactly 5.808 nm.
      - The predecessor spacing 7.744 nm is six modes on the eight-mode Holocene patch.
      transfer_boundary:
      - The CC BY-SA SEM is a micrometre-scale coccosphere and coccolith. The GIF maps the molecular activator onto
        that geometry.
      does_not_claim:
      - That Emiliania forms pigment stripes or ocelli at 5.8 nm.
      - That 7.744 nm was measured on a fossil.
      - That CAP kinetics are Schnakenberg kinetics.
