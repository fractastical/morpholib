simulations:
  - id: meinhardt-echinoderm-pentaradial-symmetry
    name: "Morris (2012), Mooi & David (1998/2008), Lovén (1874), Duboc et al. (2005), Luo & Su (2012) & Meinhardt (2008) echinoderm bilateral-to-pentaradial hydrocoel ring symmetry breaking with Ocular Plate Rule test growth"
    organism: "Strongylocentrotus purpuratus & Tripneustes gratilla (Echinoidea crown-group echinoderms)"
    script: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py
    output: docs/media/echinoderm_pentaradial_symmetry_comparison.png
    extra_outputs:
      - docs/media/echinoderm_pentaradial_symmetry_growth.gif
      - docs/media/echinoderm_pentaradial_symmetry_opr_test_3d.png
      - docs/media/echinoderm_pentaradial_symmetry_opr_test_growth.gif
      - docs/media/echinoderm_pentaradial_symmetry_nodal_dose_response.png
      - datasets/echinoderm_pentaradial_symmetry/opr_plate_addition_nodal_dose_reference.json
    status: evaluated
    supersedes_audit_id: 2026-10-19-echinoderm-pentaradial-symmetry-audit-v2
    source_refs:
      - morris2012
      - mooidavid1998
      - loven1874
      - duboc2005
      - meinhardt2008
      - mooidavid2008
      - zachos2009
      - raup1968
      - luosu2012
    claim_boundary:
      reported_in_source:
        - "Morris (2012): the pentaradial adult body plan arises from the left hydrocoel crescent closing into a ring, with the five primary podia initiated in the sequence II, IV, I, III, V (Carpenter C, A, D, B, E)"
        - "Lovén (1874): in each ambulacrum one of the two primary peristomial plates is enlarged, in the asymmetric pattern Ib, IIb, IIIa, IVa, Va, and ambulacral/interambulacral plates form alternating biserial columns"
        - "Mooi & David (1998, 2008): the Ocular Plate Rule — every new coronal plate is added at the ocular (apical) end of its column, so plate age increases toward the peristome and plate count increases with test size"
        - "Duboc et al. (2005): right-sided Nodal signalling represses the right hydrocoel; Nodal morpholino gives bilateral twin rudiments (2 x 5 podia) and bilateral Nodal overexpression gives none"
        - "Luo & Su (2012): BMP2/4 signalling on the left is required for rudiment formation and opposes Nodal"
        - "Raup (1968), Zachos (2009): echinoid test growth can be modelled as plate addition plus plate growth on a domed surface"
        - "Meinhardt (2008): activator-inhibitor dynamics on a closed domain select a wavenumber set by domain circumference / critical wavelength"
      reconstructed_in_script:
        - "A circular-ring mode-selection solver with a prescribed dispersion curve, crescent-to-ring closure gates at the Lovén ray angles, an m in {3..7} circumference staircase and an equal-diffusion negative control; a 2D rudiment field with a binary Nodal switch; a reduced Ocular Plate Rule plate-addition solver on a spherical-cap test seeded from the ring lobes, with logistic plate accretion, ocular-end nucleation, Lovén-enlarged primordials and an aboral projection measured with the specimen's polar Fourier pipeline; a 1D steady-state screened-Poisson Nodal/BMP2-4 gradient model with Hill competence, a dose sweep and a 2D dose map; automated specimen segmentation of a Tripneustes gratilla test; 16 reference-anchored measurements; 5 Lean 4 theorems"
      transfer_boundary:
        - "The Section 2 ring solver is NOT an integrated Gierer-Meinhardt PDE: the growth rate sigma(m) = 0.0480 (1 - 5.2 det^2) is hard-coded (L218, L283), the target mode is seeded in the initial condition (L289), the inhibitor is algebraic h = 1 + 0.65 (a - 1) (L318) and the Lovén initiation order is prescribed through delay_frac gates (L264-270). m* = 5, the staircase r = 1.0000 and the Lovén order r = 1.0000 therefore hold by construction; the DEFAULT_DA/DH/RHO constants (L120-123) do not enter the dynamics"
        - "The OPR solver is 1D meridional plate heights in rectangular azimuth bands on a sphere: no plate-plate mechanics, Voronoi packing, FEM or ambitus flattening; growth factor 40, colatitudes 22/150 deg and h_nuc/h_max are labelled assumptions in the reference JSON; the Amb/IA plate ratio target 3.0 is approximate and the emergent value 2.06 misses it"
        - "The Nodal/BMP2-4 gradient parameters were tuned only so that WT / MO / GOF give 5 / 10 / 0 podia; EC50 = 0.175 x WT is a model prediction with no empirical anchor; no Lefty/Pitx2 and no explicit Nodal-BMP antagonism term"
        - "The specimen is Tripneustes gratilla while the header organism is S. purpuratus; specimen references (C_5 = 0.9255, ray angles) are the script's own segmentation outputs, not independent measurements"
      does_not_claim:
        - "Quantitative reproduction of Duboc (2005) penetrance percentages or in-situ intensity profiles, mechanical plate packing, measured plate counts for any named species, or an integrated activator-inhibitor PDE in Section 2"
    summary: >-
      Pass 3 (v3) evaluation of `2005-meinhardt-echinoderm-pentaradial-symmetry.py` (overall 89.2/100, down from
      91.8 in Pass 2). Both v2 remediation items are closed in reduced, explicitly labelled form: a Mooi & David
      (1998/2008) Ocular Plate Rule plate-addition solver on a domed test seeded from the m = 5 ring lobes (20
      biserial columns, 640 + 310 plates at R/R_meta = 40, newest plate at the ocular in every column, Lovén-seeded
      zigzag alternation phase 0.49 that collapses to 0.00 when the enlargement is ablated, aboral C_5 = 0.9964 vs
      specimen 0.9255 through the same pipeline), and a continuous Nodal/BMP2-4 screened-Poisson dose-response
      model that reduces to the discrete 5 / 10 / 0 law at the canonical doses (max |dev| 0.055 podia, EC50 0.175 x
      WT). Two new Lean 4 theorems (5 total, 0 `sorry`s), a SHA-256-pinned reference table, 7 new measurements
      (16 total) and 3 new self-test checks (11 total) are credited. The score falls because this round exposed
      that the Section 2 "Gierer-Meinhardt ring PDE" is a templated solver whose headline numbers (m* = 5,
      staircase and Lovén-order r = 1.0000) hold by construction, and because most of the new OPR measurements
      are structural (true by construction of ocular-end nucleation) or self-referential (specimen C_5 as its own
      reference) rather than empirical.
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          Credited: the OPR solver implements the mechanism Mooi & David describe — plates nucleate only at the
          ocular end (L627-631), existing plates grow logistically (L622-625), columns are biserial a/b with the
          Lovén-enlarged primordial seeding the zigzag (L520, L598-612), and the ring-PDE lobes genuinely set the
          ambulacral azimuths (L529-539, L580) so the two modules are coupled rather than juxtaposed; the
          enlargement ablation (phase 0.49 -> 0.00) is a real mechanistic test. The Nodal/BMP2-4 module is a proper
          steady-state reaction-diffusion reduction (screened Poisson with no-flux ends, L806-818; Hill competence,
          L821-823, L826-870) that reproduces Duboc's three phenotypes continuously and encodes Luo & Su's
          left-side BMP requirement. Deductions: the Section 2 ring solver is not a Gierer-Meinhardt integration —
          sigma(m) is a hard-coded parabola (L218, L283), the initial condition seeds the target mode (L289), the
          inhibitor is algebraic (L318) and the Lovén order is prescribed by delay_frac gates (L264-270, L305), so
          m* = 5 and both r = 1.0000 results are by construction and DEFAULT_DA/DH/RHO (L120-123) are unused in
          the dynamics (-9); the OPR test has no plate-plate mechanics, Voronoi packing or ambitus (-3); the Nodal
          model omits the Nodal-BMP antagonism of Luo & Su and Lefty/Pitx2, with Hill n = 4 arbitrary (-2); the 2D
          Panel D rudiment field (L468-512) still uses the binary Nodal switch and is not wired to the continuous
          model (-2); credit for two further Lean theorems (+2 net relative to the v2 basis).
        evidence:
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [542, 694], note: "simulate_opr_test_plate_addition: 20 biserial columns, logistic accretion, ocular-end nucleation (L627-631), Lovén-enlarged primordials, alternation phase and Amb/IA ratio", supports: true}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [529, 539], note: "_map_lobes_to_loven_rays: ring-PDE lobe azimuths assigned to Lovén rays — the actual PDE -> test coupling (self-test asserts ambulacral azimuths == PDE lobes)", supports: true}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [806, 911], note: "Screened-Poisson Nodal/BMP2-4 gradients, Hill competence, 41-point dose sweep, 25x25 dose map, canonical WT/MO/GOF vs Law 3", supports: true}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [212, 218], note: "compute_ring_dispersion: sigma(m) = 0.0480 (1 - 5.2 det^2) hard-coded; not derived from D_a, D_h, rho_a, rho_h", supports: false}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [279, 292], note: "simulate_hydrocoel_ring_pde: same hard-coded sigma_vec (L283) and the initial condition seeded with 0.025 cos(m* theta) at the TARGET mode (L289)", supports: false}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [316, 318], note: "Inhibitor is the algebraic relation h = 1 + 0.65 (a - 1), not an integrated PDE", supports: false}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [262, 270], note: "Lovén initiation order prescribed through delay_frac gates at the Lovén angles, so the (II, IV, I, III, V) sequence r = 1.0000 is by construction", supports: false}
          - {file: morphoeval/lean/loops/Loop_075_echinoderm_pentaradial_symmetry.lean, lines: [195, 296], note: "Laws 4 and 5: opr_biserial_plate_addition_law (20 columns, newest at position 0, position strictly decreasing in birth index, alternating split) and nodal_dose_response_hill_reduces_to_discrete_law (integer Hill competence monotone, rounded rings = active_hydrocoel_rings, 5x = total_primary_podia); 0 sorrys", supports: true}
      specimen-match:
        value: 89
        rationale: >-
          Credited: the Tripneustes gratilla test segmentation (L916-962) is unchanged and now shares a single
          polar chromaticity + azimuthal FFT pipeline (`polar_c5_harmonics`, L759-800) with the synthetic OPR test
          projection (L739-756), so the specimen and the model are measured identically; the specimen's ambulacral
          duty cycle (0.575) calibrates the synthetic ambulacral width; the 9-panel comparison figure places the
          specimen (Panel E), its spectrum (Panel F) and the plated dome / harmonics inset (Panels G, I) side by
          side; the OPR figure insets both images. Deductions: a synthetic exactly five-fold test has C_5 ~ 1
          regardless of plate kinetics, so the 0.9964 vs 0.9255 comparison discriminates nothing about the
          accretion model (-4); detected synthetic ray angles [7, 80, 138, 210, 281] are noisy because the synthetic
          profile has flat tops (-2); the species mismatch (header organism S. purpuratus, specimen and
          "trigeminate" argument T. gratilla) persists (-3); no plate-level comparison (plate counts per column,
          plate outlines) is made against the specimen, which is the morphology the new solver actually produces
          (-3).
        evidence:
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [916, 962], note: "segment_echinoid_test_specimen: periproct detection and shared polar_c5_harmonics pipeline; rays [45,118,190,260,331], C_5 = 0.9255, duty cycle 0.575", supports: true}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [739, 800], note: "project_opr_test_aboral_view + polar_c5_harmonics: identical pipeline applied to the orthographic aboral projection of the plated dome", supports: true}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [1630, 1636], note: "Aboral C_5 measurement uses the specimen's own C_5 as reference and the specimen-calibrated duty cycle; near-trivial for an exactly 5-fold synthetic test", supports: false}
          - {file: docs/media/echinoderm_pentaradial_symmetry_comparison.png, lines: [0, 0], note: "9-panel synthesis: Panel E specimen overlay, Panel F spectrum, Panel G 3D plated dome, Panel I plate-count law with harmonics inset", supports: true}
          - {file: docs/media/echinoderm_pentaradial_symmetry_opr_test_3d.png, lines: [0, 0], note: "4-panel OPR figure: 3D dome, unrolled Ia/Ib/IA columns with Lovén plate, plate count vs R, aboral harmonics vs specimen with both images inset", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          Credited: in addition to the v2 49-point circumference sweep and m in {3..7} staircase, Pass 3 adds a
          41-point right-Nodal dose sweep, a 25 x 25 (dose_L, dose_R) map (L873-911), the Lovén enlargement
          ablation (self-test), a growth-factor parameter for the OPR test and `--growth-factor` / `--nodal-dose`
          CLI flags (L1853-1854). Deductions: `measure_morphoeval()` (L1562-1740) ignores every CLI parameter, and
          `--growth-factor` reaches only the standalone OPR figure/GIF (L1872), not Panels G/I or the measurements
