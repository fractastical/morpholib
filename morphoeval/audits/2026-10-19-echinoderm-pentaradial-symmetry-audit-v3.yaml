          JSON-only with no CLI or sweep, and the OPR solver is exercised only at m = 5 (`ROMAN_RAYS` fixed, L519)
          although the ring solver runs m = 4 (-3); `--R-ring-um`/`--lambda-c-um` still reach only
          `render_comparison_figure` (-1).
        evidence:
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [873, 911], note: "evaluate_nodal_dose_response_sweep: 41-point dose sweep, EC50, Spearman rho, 25x25 (dose_L, dose_R) map, canonical conditions", supports: true}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [1848, 1854], note: "CLI: --self-test, --skip-gif, --R-ring-um, --lambda-c-um, --seed, --growth-factor, --nodal-dose", supports: true}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [1868, 1880], note: "--growth-factor and --nodal-dose reach only the standalone Pass 3 figures; --nodal-dose overwrites sweep['wt_profile']", supports: false}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [1562, 1564], note: "measure_morphoeval() takes no arguments and ignores all CLI parameters", supports: false}
      morphometric-validation:
        value: 88
        rationale: >-
          Credited: 16 reference-anchored measurements (9 from v2 + 7 new, L1576-1646), each with reference_value,
          unit, method and source; the Nodal dose-response deviation from Law 3 (0.055 podia) and the enlargement
          ablation are genuine model-vs-target tests; the alternation phase (0.49 vs 0.5) and Amb/IA ratio (2.06 vs
          ~3.0) are reported honestly including the miss. Deductions: `newest_at_ocular_fraction` = 1.0, the
          non-decreasing plate counts and Spearman rho = 0.9995 hold by construction of ocular-end nucleation
          (L627-631) — the method text says so (L1591) but they are counted as validations (-4); the alternation
          phase 0.49 follows from the chosen enlargement factor 1.5 (JSON), so its magnitude is semi-circular (-2);
          the aboral C_5 reference is the specimen's own value through the same pipeline and the specimen C_5
          reference 0.9255 (L1735) is the script's own output (-3); the Nodal max |dev| is partly circular because
