          the Amb/IA reference 3.0 is unsourced (-1).
        evidence:
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [1576, 1646], note: "7 Pass 3 measurements: column count, newest-at-ocular fraction, plate-count vs R Spearman, Amb/IA ratio, alternation phase, aboral C_5, Nodal max |dev| from Law 3", supports: true}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [1586, 1592], note: "newest-at-ocular measurement whose method text concedes it 'holds by construction of ocular-end nucleation'", supports: false}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [1733, 1740], note: "Specimen C_5 reference_value 0.9255 is the script's own segmentation output (self-referential)", supports: false}
          - {file: models/2005-meinhardt-echinoderm-pentaradial-symmetry.py, lines: [1637, 1648], note: "Nodal dose-response deviation measurement with reference 0.0 from Duboc (2005) phenotypes and the Lean theorem", supports: true}
          - {file: datasets/echinoderm_pentaradial_symmetry/opr_plate_addition_nodal_dose_reference.json, lines: [60, 70], note: "structural_reference_values: Amb/IA ratio 3.0 justified only as 'trigeminate compounding', not a measured count", supports: false}
      source-traceability:
        value: 92
