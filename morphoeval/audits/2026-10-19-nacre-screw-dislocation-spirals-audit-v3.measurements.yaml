    claim_boundary:
      reported_in_source:
      - 'Cartwright & Checa (2007): nacre tablets nucleate on a pre-formed stack of chitin-fibroin interlamellar
        membranes; screw dislocations in the membrane stack drive BCF spiral terrace growth with wavelength lambda_0
        ~ 19 r_c and Gibbs-Thomson step velocity v = v_inf (1 - r_c / r); mineral bridges through membrane pores
        give columnar (gastropod) vs sheet (bivalve) stacking'
      - 'Cartwright et al. (2009): spiral and target patterns in bivalve nacre arise from screw-dislocation and
        Frank-Read-type (+1,-1) defect pairs in a cholesteric liquid-crystal chitin precursor whose half-pitch sets
        the interlamellar spacing'
      - 'Burton, Cabrera & Frank (1951): spiral step-flow around a screw dislocation; Archimedean spiral of pitch
        2 pi / omega_0 r_c'
      - 'Jackson, Vincent & Turner (1988): nacre tensile modulus ~ 73 GPa (dry) / 64 GPa (wet), tensile strength
        ~ 170 / 140 MPa, work of fracture 350-1240 J/m^2; Currey (1977): mother-of-pearl ~ 3000x tougher than monolithic
        aragonite; Wang et al. (2001): ~ 1 % inelastic strain by interlamellar sliding; Gao et al. (2003): flaw-insensitive
        critical mineral size h* ~ 30 nm; Ji & Gao (2004): tension-shear-chain modulus 1/E = 4(1-Phi)/(G_p Phi^2
        rho^2) + 1/(Phi E_m); Barthelat et al. (2007): tablet waviness produces progressive interface hardening
        (tau ~ 20-40 MPa)'
      reconstructed_in_script:
      - 2D phase-field / eikonal BCF step-flow solver for 5 regimes (sub-saturated arrest, subcritical dipole pinch-off,
        single screw spiral, (+1,-1) target, Haliotis (+1,+1) columnar), 3D mineral-bridge Voronoi coalescence,
        SEM DoG seam / Delaunay segmentation of the SHA-pinned specimen (Pass 2, unchanged)
      - 'Pass 3: exact reconstruction of the continuous BCF phase from the solver output; a 3D cholesteric director
        field n = (cos phi, sin phi, 0), phi = (pi / h_0)(z - u), u = h_0 Phi_2D / 2 pi on an 81x81x120 grid; lamellar
        density S = cos 2 phi and aragonite occupancy M = [z < h_0 floor(Phi_2D / 2 pi)]; finite-difference twist
        rate, z-power-spectrum membrane period, loop-integral Burgers vector and core-column membrane count measured
        from the volume; 9-point pitch sweep P -> h_0 = P/2 -> v_z'
      - 'Pass 3: rate-independent single-slip-system brick-and-mortar RVE: TSC modulus, Schmid yield sigma_y = Phi
        rho tau_p / 2, waviness hardening H = E_n tan^2 psi / t_m, Griffith tablet fracture cap at flaw h/2, pull-out
        work Gamma = tau_p L_ov^2 / h, K_Ic, Gao h*, ductile-brittle rho* = sigma_crit / tau_p, three failure-mode
        branches, tau_p and rho sweeps, psi = 0 and Phi = 1 ablations, 17-angle Schmid envelope'
      transfer_boundary:
      - 'The 3D cholesteric coupling is a kinematic liquid-crystal template imposed by the BCF phase (stated at
        L521-L529): twist rate, membrane period and Burgers vector recovered from the volume are consistency checks
        of the construction (0.94 % finite-difference error on q, 0.14 % on the period), not independent predictions
        of chitin self-assembly'
      - Every Pass 3 mechanical constant (tau_p = 20 MPa, psi = 1.5 deg, G_p = 1.4 GPa, Phi = 0.95, t_m = 30 nm,
        Gamma_m = 1 J/m^2, E_m = 100 GPa) and every empirical target (Jackson 73/64 GPa, 170/140 MPa, 350-1240 J/m^2;
        Currey 3000x; Wang 110 MPa / 1 %; Gao 30 nm) was transcribed offline from memory of the papers; none of
        the nine new DOIs was verified online this pass
      - sigma_f = Phi sigma_crit / 2 = 169.5 MPa lands on Jackson's 170 MPa by construction of the Griffith flaw
        = h/2 choice, not by fit or by prediction; E = 89.5 GPa overshoots Jackson dry 73 GPa by 23 % and the toughening
        ratio x608 is 5x short of Currey's ~3000x — both reported, neither corrected
      - The Pass 2 terrace-pitch 'measurement' blends 0.15 x raw + 0.85 x analytic (L451); the supersaturation and
        12-species `lambda_obs` tables were generated from the same BCF law they are correlated against (r = 0.9999
        is therefore not an empirical validation); the SEM Z and aspect-ratio reference values are the script's
        own Pass 2 outputs copied into the JSON
      does_not_claim:
      - Frank / Landau-de Gennes free-energy relaxation of the chitin director, pitch selection by chitin concentration
        or ionic strength, membrane-pore (mineral-bridge) transport, time evolution of the director beyond the BCF
        phase, intra-tablet aragonite crystal plasticity (dislocation glide, deformation twinning), cohesive-zone
        or FEM RVE mechanics, rate or hydration dependence, interface tensile (normal debonding) strength sigma_nc,
        or comparison with digitised figure points from any of the cited mechanical papers
