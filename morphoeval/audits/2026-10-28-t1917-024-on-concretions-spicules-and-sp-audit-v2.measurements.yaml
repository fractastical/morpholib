    claim_boundary:
      reported_in_source:
      - 'Thompson (1917, pp. 443-449), after Dreyer (1892) and Plateau (1873): calcareous spicule rays follow the
        junction lines of 3 or 4 contiguous cells; 120 deg for equal tensions, ''two equal angles and one unequal''
        otherwise, grading to a T; tetrahedral ~109 deg for four cells; the spicule is ''a crystal under restraint''.  Evidence
        given: Haeckel''s drawings (Fig. 214), no angle table.'
      reconstructed_in_script:
      - Exact Neumann law of cosines / law of sines, E5 family and inverse, tetrahedral and orthogonal constants,
        interstice area; PCA radial-arc ray-angle extraction validated by a rendered rho sweep; Dirichlet(1,1,1)
        null for the closest-pair difference with MC and KS tests; crystal-120 and lattice-30 ablations with RMSE/AIC;
        three samples (CC BY SEM plate n = 8, CC BY-SA population spread n = 25 physical, Thompson Fig. 214 n =
        4 panels); result.json with per-prediction verdict components.
      transfer_boundary:
      - One SEM plate from one individual and one spread of one Grantia sample; drawings are Haeckel's not photographs;
        2D projections of trihedral spicules (near- vs chord-axis RMSE 5.3 deg quantifies curvature/projection sensitivity);
        no alcyonarian material; tetractine apical ray not measurable.
      does_not_claim:
      - 'Does NOT claim Thompson''s mechanism is correct: Ledger & Jones (1977) and Voigt et al. (2017) show a dedicated
        founder/thickener sclerocyte sextet; only the geometric predictions are supported, and bilateral symmetry
        of that sextet would also yield two equal angles — the data cannot separate tension balance from a symmetric
        cell programme.'
      - 'Does NOT claim the general three-tension model is tested: it is saturated (fraction realised 1.0) and cannot
        fail; only E5 is falsifiable here.'
      - Does NOT claim P3 (tetrahedral 109.47 deg) or anything about alcyonarian spicules; both are 'untestable'
        in result.json.
      - 'Does NOT use the pre-assigned Dryad dataset (hexactine fossil tomograms, 5.8 GB): DATASET_MISMATCH recorded
        with pinned metadata.'
      - 'Does NOT claim independent confirmation: builder-scored (R1 open).'
