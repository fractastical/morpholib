# MorphoEval audit — C. elegans embryo from the WormGUIDES atlas, 2026-10-16
# (re-score; supersedes 2026-10-15-celegans-audit).
#
# What changed since the first audit: the remediation item "verify the 50 um
# calibration against something in the atlas instead of the nuclear cloud" was
# done.  The script now fetches and pins the atlas's own eggshell outline
# meshes (obj_files/embryo_t*.obj, 13 sampled frames) and sets the x extent of
# the re-segmented shell at frame 330 (303.1 units) to the 50 um egg length,
# giving 0.1649 um per unit; the shell's unfitted width (29.2 um against the
# ~30 um egg) and the spread of the per-frame meshes (0.1649-0.1750) are
# reported as checks and as the scale uncertainty.  A dataset observation came
# out of it: the atlas reuses one static shell mesh (285.8 units) for frames
# 1-~250 and the nuclei overrun it at the anterior pole by up to 19 units, so
# it is not the shell of this egg; the early mesh is reported, not used.  The
# previous nuclear-cloud estimate (0.1617) sits 2 % below the shell value.
# Only the three dimensions touched by this change are re-scored; the other
# four keep their 2026-10-15 values and rationales (updated line numbers).
#
# Second audit of 2015-santella-wormguides-celegans.py.  Unlike Planform and
# Limbform there is no single published "formal morphology" for C. elegans:
# the formal layer that exists is the connectome (connectivity), and the only
# formal description of embryonic geometry is the WormGUIDES nuclear-position
# atlas (Santella et al. 2015).  The script decodes that atlas (360 one-minute
# frames of nuclear positions, diameters and Sulston lineage names), checks
# the lineage encoding, re-derives the Sulston chart, calibrates the unit-less
# coordinates to the 50 um egg and sets the OpenWorm c302 connectome beside
# it.  There is no simulation here: the audit judges a data decoder, so
# parameter expressivity is not applicable and is scored neutral, as for the
# Odonata audit.
#
# Scores are on the rubric's 0-100 scale.  Line numbers refer to the files at
# the checkpoint commit recorded below.

audit:
  id: 2026-10-16-celegans-audit
  rubric_version: 0.1.0
  date: "2026-10-16"
  supersedes: 2026-10-15-celegans-audit
  assessor:
    id: claude-fable-5-1
    label: "Claude Fable 5.1 (Cursor agent)"
    homepage: https://www.anthropic.com
  publisher_orcid: null
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  code_creators:
    - id: joel-dietz
      name: "Joel Dietz"
      orcid: null
      github: https://github.com/fractastical
  domain: morphogenesis
  tracked_by: https://github.com/fractastical/morpholib/issues/1
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 303a87e          # eggshell-mesh calibration
    environment:
      python: "3.14.7"
      numpy: "2.5.4"
      scipy: "1.16.3"
      matplotlib: "3.10.7"
      Pillow: "12.0.0"
    note: >-
      Inputs: 429 files from zhirongbaolab/WormGUIDES at commit 17be611f
      (GPL-3.0; 360 nuclei tables of image series DISPIM_061416 / strain
      JIM113, 51 cell meshes at frame 330, 13 eggshell outline meshes
      embryo_t{1,30,60,100,200,250,280,300,320,330,340,350,359}.obj, CellShapesConfig.csv,
      ProductionInfo.csv, partslist.txt, CellDeaths.csv) and openworm/c302 at
      commit f54d92d7 (MIT; c302/data/herm_full_edgelist.csv), downloaded by
      the script into the git-ignored .celegans_cache/ and verified against
      datasets/celegans/pinned_inputs.sha256 on every run.

