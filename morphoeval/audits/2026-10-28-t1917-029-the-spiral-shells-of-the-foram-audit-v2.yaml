# MorphoEval Pass 2 audit — Thompson (1917) claim T1917-029 "The Spiral Shells of the Foraminifera"
# Loop 223 (`thompson1917-t1917-029`), builder = assessor (closed-loop self-audit, Pass 2 of 2).
# Supersedes 2026-10-28-t1917-029-the-spiral-shells-of-the-foram-audit (Pass 1, overall 62.45).
#
# What changed since Pass 1 (remediation items R1-R9 of the Pass 1 audit):
#   R1 CV whorl-wall extraction on the real fusulinid thin section (sector-median radial profiles,
#      dark-wall minima, joint half-whorl-offset fit) AND on Thompson's own Fig. 309 Nummulina
#      (bright-wall peaks in 8 sectors) -> W = 1.49 +/- 0.10 and 1.61 +/- 0.18 respectively.
#   R2 (W, d) 5x6 sweep + translation T line with four morphometric read-outs and monotonic checks.
#   R3 controls through the identical verdict rules: shuffled stages (refuted, 1/4), arithmetic growth
#      (T1 fails as designed), i.i.d. ratios at CV 0.15 (boundary control, passes), exact geometric
#      1.225 (positive control, 4/4).
#   R4 T2 now adds an early/mid/late-third drift statistic with Kruskal-Wallis p per genus.
#   R5 T4 now uses a Monte-Carlo null (4000 normal samples) for the largest interior gap: p = 0.74.
#   R6 bootstrap 95 % CIs of genus means, KS test of pooled standardized ln-residuals, relative RMSE.
#   R7 model overlay parameters taken from the data (W from Fig. 309's own CV walls, first-wall anchor).
#   R8 numpy/scipy/matplotlib/Pillow versions stamped into metrics; headline regression asserts in
#      --self-test; scipy actually used (KS, Kruskal-Wallis, peak detection).
#   R9 IA scans for von Moller 1878 and van Iterson 1907, Crossref DOI for Przibram 1913 in the bib.
#
# Independent checks performed (2026-10-28, Linux, python 3.12.3 / numpy 2.5.4 / scipy 1.18.1 /
# matplotlib 3.11.2 / Pillow 13.0.0):
#   * `--self-test` passes (1.0 s, 40+ assertions); full run 6.0 s; two consecutive full runs gave
#     byte-identical PNG (c266574c...) and GIF (6df0512f...).
#   * Dryad digests re-verified; the committed blobs are byte-exact (.gitattributes -text).
#   * Fig. 309 proloculus pin read off a 25-px grid overlay (546, 295); the Pass-1 pin (355, 178) was
#     a thumbnail-scale error and has been corrected in the reference JSON.
#   * The 14 two-magnification specimens drop 32 of 1396 outlines; TPJ drops exactly 5 (asserted).
#   * Verdict rules were pre-registered in scout_manifest.json (T1-T4) before the Dryad fits were run;
#     the R4/R5 recalibration changed the *statistic* of T2/T4, not the hypotheses.
#   * Lean file unchanged since Pass 1 (compiles with Lean 4.35.0, 0 sorry).

