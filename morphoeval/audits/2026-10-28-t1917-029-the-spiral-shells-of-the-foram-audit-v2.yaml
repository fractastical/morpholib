    claim_boundary:
      reported_in_source:
        - "Thompson (1917) pp. 591-598: chambers/whorls in continued proportion lie on a logarithmic spiral; von Moller's Fusulina whorls in ratio ~1.5 (half-whorl 1.225, alpha ~86 deg); van Iterson's Triloculina 1.323; Rhumbler's Pulvinulina ~1.187 with a 'small secondary fluctuation'; constant volume ratio from growth proportional to existing mass."
        - "Thompson (1917) pp. 601-605: shells differ in constant angle (rate of growth) and in chamber form/overlap; rotaline, Miliolid, Nodosarian, Textularian, Orbitolitid forms are all logarithmic-spiral cases that pass into one another by continuous gradations."
      reconstructed_in_script:
        - "Discrete similar-chamber generative model (centres r0 rho^k at angle k d, radii a0 rho^k, screw translation T) with a0 = (W-1)/2 and d = 22.5 deg chosen to mimic Fig. 309; chamber overlap and a0 are not source parameters."
        - "Per-specimen log-linear fits of test DIAMETER vs half-whorl stage (PCA frame from the mid-ontogeny outline; longest segment across the 14 two-magnification breaks); BIC vs arithmetic growth; CV and early/mid/late-third drift with Kruskal-Wallis; bootstrap CIs; KS of residuals; Monte-Carlo (normal-null) gap test; thresholds r >= 0.98, 80 %, CV <= 0.15, drift <= 10 %, +/-0.05, p >= 0.05."
        - "CV whorl-wall radii: proloculus pins from the reference JSON (refined +/-6 px for the photograph), sector-median radial profiles, prominence/intensity thresholds 0.06/0.33 (dark walls) and 0.12/0.55 (bright engraving walls); the wall count and the exclusion of the proloculus wall (r < 90 px in Fig. 309) are analyst choices."
      transfer_boundary:
        - "Dryad outlines are whorl-level axial sections of Late Paleozoic fusulinids in pixels; septal-chamber-level claims (Miliolidae, rotaline forms) are tested only through Thompson's printed tables and the generative model."
        - "n = 1 photograph (640 x 480 px, ~6 whorls per side) and n = 1 engraving (oblique, shaded) for the CV estimates; their W values carry +/-0.10 and +/-0.18 spreads and are consistency checks, not population estimates."
      does_not_claim:
        - "Does not claim that the growth ratio is physiologically caused by mass-proportional growth (E4 is proved algebraically, not tested)."
        - "Does not claim the verdict generalises beyond fusulinids plus one Nummulina engraving; the MIXED verdict is driven by the pseudoschwagerine inflation phase, which Shi (2021) describes as a heterochronic novelty."
        - "Does not claim the KS rejection (p = 7e-4) refutes the law: with 1364 residuals the test detects the S-shaped pseudoschwagerine trajectories and digitisation outliers, i.e. the same deviation that fails T2."
    overall_score: 77.4
    overall_note: "Weighted mean 20/25/10/15/10/8/12 of the seven scores below (faithfulness 75.1, reproducibility 82.7); no dimension not_applicable. Pass 1 was 62.45 (+14.95)."
    summary: >-
      Pass 2 closes the Pass 1 gaps with measurements rather than assertions.  The real fusulinid
      thin section yields W = 1.49 +/- 0.10 from 13 detected whorl walls, matching Thompson's
      von Moller value 1.5 and the Dryad Triticites 1.53; Thompson's own Fig. 309 Nummulina yields
      W = 1.61 +/- 0.18 from 17 wall ratios, a different constant angle (85.7 vs 86.1 deg), which is
      exactly Thompson's statement that genera differ in the rate of growth.  The (W, d, T) sweep
      shows d alone sets chamber overlap (Globigerina -> Cyclammina), W alone sets coiling tightness,
      and T sets the helicoid aspect, all monotonically.  The verdict machinery now registers the
      most interesting biology: the early/mid/late drift statistic fails all four pseudoschwagerine
      genera at 15 % (Triticites 4.6 %), so the pre-registered verdict is MIXED (3/4) — the
      logarithmic-spiral succession and Thompson's numbers are supported for his exemplar group, but
      'near-constant ratio' is not a universal law of foraminiferal shells.  Controls behave as
      designed (shuffled 1/4, arithmetic fails T1, exact-geometric 4/4; the i.i.d. control is a
      boundary case that passes by construction).  Remaining weaknesses: KS rejects normality of
      residuals (reported, not hidden); the Fig. 309 estimate is coarse; chamber-level (septal)
      claims remain untested on new specimens; model a0/overlap remain unconstrained by any source
      value; the environment differs from the lockfile although it is now stamped in the metrics.
