    claim_boundary:
      reported_in_source:
      - 'Thompson p. 305: cellular tissue resembles a froth'
      - 'Thompson p. 309/323: partitions meet three at a point at ~120 degrees (Lamarle minimal-area condition)'
      - 'Thompson p. 321: hexagonal pattern illustrated in countless cases but perfectly regular only rarely; eye
        pigment epithelium as the exemplar'
      - 'Thompson p. 325: cells on the average hexagonal, some with fewer and some with more sides than six'
      - 'Thompson p. 330: closely packed hexagons give the minimal extent of boundary in a plane'
      - 'Thompson Fig. 125 (after Rhumbler): soap froth between plates, compressed (A) and relaxed (B)'
      reconstructed_in_script:
      - Periodic Voronoi froth morphospace with Gaussian positional disorder delta and Lloyd relaxation; Poisson-Voronoi
        null
      - Nucleus-marker watershed segmentation of the alizarin-red corneal endothelium; distance-peak watershed for
        line drawings
      - Interior-cell polygon statistics, Crofton perimeters, 2x2-window junction valence, Lewis and Aboav-Weaire
        fits, bootstrap CIs
      - Mean-field Gibson 2006 division-topology Markov chain with through-centre cleavage (reconstruction; uniform-random
        cleavage ablation)
      - 'Rasterised-froth pipeline control: pixel perimeter bias (-0.9 %) and finite-window <n> bias (-0.18) measured
        on a tessellation with known exact statistics'
      transfer_boundary:
      - Lloyd (centroidal Voronoi) relaxation is a proxy for surface-tension perimeter minimisation, not a Plateau
        / vertex-model energy descent
      - The honeycomb bound is applied cell-by-cell to the measured area distribution (Hales 2001 proves the equal-area
        case); the measured excess includes real wall waviness as well as polygon irregularity
      - Clinical norms (Sheng & Bullimore 2007) are specular-microscopy regressions for living corneas; the specimen
        is an ex vivo alizarin-red flat mount
      does_not_claim:
      - 'n = 1 specimen: no population statement about human corneal endothelia'
      - No um/px scale, so no cell density or absolute area is reported
      - The proliferating-epithelium qualification rests on Gibson 2006's published spectrum, not on a segmented
        proliferating specimen
      - The Elodea canadensis image (Thompson Fig. 126 species) is vendored for visual comparison only; chloroplast
        clutter defeats the automatic pipeline
