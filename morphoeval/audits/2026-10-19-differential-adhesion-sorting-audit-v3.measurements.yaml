provenance:
  steinberg-differential-adhesion-sorting:
    spec_fingerprint: 439c3a9015bc8fdc9014e2aa3a89cd71cffc876fcd81d0cb0b2f88bbf798d5a9
    artifact_sha256: 6046cb66ae62af9e47d3b593c06f690c6b389ec313e42183a47ccced8c8cf39f
    input_dataset_sha256: {}
    claim_boundary:
      reported_in_source:
      - 'Steinberg (1963, 1970) Differential Adhesion Hypothesis (DAH): dissociated binary embryonic tissues spontaneously
        sort into concentric core-shell or lens configurations governed by interfacial free energy minimization.'
      - 'Graner & Glazier (1992) PRL Eqs. 1-3: extended Cellular Potts Hamiltonian with interfacial tensions gamma_AB
        = J_AB - (J_AA + J_BB)/2 and gamma_tauM = J_tauM - J_tautau/2 partitioning parameter space into checkerboard
        (gamma_AB < 0), complete engulfment (0 < gamma_AB < gamma_BM - gamma_AM), partial engulfment (gamma_AB >
        gamma_BM - gamma_AM > 0), and dissociation (gamma_AM < 0); Fig. 3 reports logarithmically slow decay of
        the heterotypic boundary length.'
      - 'Foty, Pfleger, Forgacs & Steinberg (1996) Development Table 1: empirical Gallus gallus tissue surface tensions
        (20.1 > 12.6 > 8.5 > 4.6 > 1.6 dyn/cm) strictly predict transitive mutual envelopment.'
      reconstructed_in_script:
      - 2D extended Cellular Potts Model (60^2, 68 cells) across all 5 thermodynamic regimes plus a 7-point continuous
        J_AB sweep, with a cell-level type-swap accelerator and, in the partial-engulfment regime only, an ad hoc
        symmetry-breaking field.
      - 'Pass 3: 3D extended Cellular Potts spheroid on a 64^3 lattice (840 cells, 26-neighbour adhesion, volume
        constraint, 8-colour sublattice-parallel Metropolis) with its 2D equatorial z-section, a Kawasaki-swap ablation
        and a 3D equal-adhesion control; logarithmic vs power-law fits of L_AB(t)/L(t) with exponents compared to
        the LSW alpha = 1/3 bound.'
      - Computer-vision segmentation of a confocal fluorescence embryoid body spheroid (`cell_sorting_specimen.jpg`)
        comparing empirical GFP/RFP radial occupancy against the 2D Potts core-shell profile (r = 0.925) and the
        3D equatorial-section profile (r = 0.758).
      transfer_boundary:
      - 64^3 x 200 MCS is far from the asymptotic coarsening regime; exponents are fitted over ~2.3 decades of MCS
        including the initial transient, and the power-law vs logarithmic R^2 (0.9965 vs 0.9845 in 3D; 0.737 vs
        0.769 in 2D) do not discriminate the two laws.
      - The LSW alpha = 1/3 reference is a conserved-order-parameter coarsening bound, not an exponent measured
        for the Cellular Potts model; the Nakajima & Ishihara (2011) exponent is deliberately left null in the reference
        JSON because the paper could not be consulted offline.
      - The vendored specimen is a Wikimedia Commons embryoid body, not a chick-tissue aggregate from Steinberg
        or Foty; the radial-profile comparison is a morphological analogy, not a reproduction of a paper figure.
      does_not_claim:
      - Does not model active chemotaxis, subcellular cadherin trafficking kinetics, or the fluctuation-dependence
        of sorting studied by Mombach et al. (1995).
      - Does not claim the cell-level type-swap accelerator or the partial-engulfment bias field are part of the
        Graner & Glazier (1992) Hamiltonian.
