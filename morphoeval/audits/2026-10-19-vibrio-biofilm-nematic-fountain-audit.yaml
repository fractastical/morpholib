# MorphoEval audit — Beroz et al. (2018) Nature Physics & Hartmann et al. (2019) Nature Physics Vibrio cholerae Biofilm Nematic Verticalization & Fountain Flow, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2019-yan-vibrio-biofilm-nematic-fountain.py` (194 lines)
# prior to Step 12 remediation in `2026-10-19-vibrio-biofilm-nematic-fountain-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.4 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `generate_parametric_verticalization_field` (L56-75) uses a closed-form radial tanh
#      ansatz for vertical nematic order S_z(x,y) and dome height H(x,y) rather than solving
#      a variational Landau-de Gennes / Frank-Oseen nematic tilt free-energy minimizer
#      F[theta] coupled to 3D fountain-flow dome extrusion.
#   2. `evaluate_cell_length_sweep` (L78-91) evaluates only the 7-point cell-length sweep
#      and omits the 8-point radial expansion trajectory R(t) in [6.0, 25.0] um, the
#      Delta rbmA cell-cell cohesion mutant and Delta bap1 Delta rbmC substrate-adhesion
#      mutant flat-monolayer controls.
#   3. The vendored Public Domain CDC PHIL micrograph `datasets/vibrio_biofilm_nematic_fountain/vibrio_cholerae_biofilm_specimen.jpg`
#      is never loaded, segmented, or analyzed for rod cell count, major/minor axes, empirical
#      aspect ratio L/d, or 2D nematic orientation field in `vibrio_biofilm_nematic_fountain_comparison.png`.
#   4. Runtime SHA-256 verification of dataset assets and CLI parameter overrides
#      (`--L-cell-um`, `--R-colony-um`, `--zeta`, `--seed`) are missing.

