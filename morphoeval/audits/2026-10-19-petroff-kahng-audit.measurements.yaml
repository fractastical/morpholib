provenance:
  petroff-stromatolite:
    spec_fingerprint: 2b3289aae8f3466486ffbc5f503dd7585e6e1c2863ac78c108d1488932cf713f
    artifact_sha256: 8e00cc6fabe5cf24f1544cbc867b0f6e9501cf7099a7b3da7166a2bf8fd1be01
    input_dataset_sha256: {}
    claim_boundary:
      reported_in_source:
      - 'Petroff et al. (2010): nutrient diffusion over active photosynthetic period tau sets inter-cone spacing
        ell = alpha * sqrt(D * tau) (~1 cm for daily cycle), and diffusive flux gradients along the mat interface
        govern lamina accretion and conical geometry'
      - 'Batchelor et al. (2004): deterministic KPZ / normal-plus-vertical lamina accretion dh/dt = v + lambda *
        (1 + 1/2 (dh/dr)^2) transitions from domes to cones as beta = v / lambda increases'
      reconstructed_in_script:
      - Algebraic diffusion-length spacing law ell = alpha * sqrt(D * tau) for alpha in {1.0, 0.30}, hexagonal close-packed
        cone lattice, and a 2D Lagrangian polyline front advancing by lambda * n_hat + v * w_photic * z_hat with
        pinned basal endpoints and 3-point Laplacian smoothing
      transfer_boundary:
      - The dome-to-cone lamina solver does not solve Petroff et al.'s Laplace diffusion equation (nabla^2 c = 0)
        or local diffusive flux; it substitutes a modified Batchelor et al. (2004) kinematic front with an ad-hoc
        photic weighting w_photic = 0.12 + 0.88*(z/z_max)^2
      does_not_claim:
      - Direct comparison to digitized Yellowstone mat or Proterozoic Conophyton thin-section photographs or empirical
        cone-spacing histograms
  kahng-coral-geometry:
    spec_fingerprint: 833cc6f3d6f3988fa15a852dd8366b15c68ef56d6fd98635b3250ff241f4746a
    artifact_sha256: fa8ce6cd95b493eee42054724462d8d7e6380dd161cc7899a464457cd765f812
    input_dataset_sha256: {}
    claim_boundary:
      reported_in_source:
      - 'Kahng, Odle & Wakeman (2024): colony volume increment V(t+1) = V(t) + G*S(t)/rho implies that surface-area
        productivity (SAP = dS/S) and linear extension C are governed by how S:V scales with colony size across
        hemispheroids, cones, flat discs, and cylinders'
      reconstructed_in_script:
      - Exact 1-year discrete volume-step algebraic functions for hemisphere, fixed-aspect cone, fixed-thickness
        flat disc, and fixed-diameter cylinder (`hemisphere_extension`, `hemisphere_sap`, `disc_extension`, `disc_sap`,
        `cone_extension`, `cone_sap`, `cylinder_sap`), 6-panel comparative figure, and 15-year log-area animation
      transfer_boundary:
      - Uses a finite 1-year step V(t+1) = V(t) + G*S(t)/rho without comparing against the continuum differential
        limit (dV/dt = G*S/rho, where hemisphere dR/dt = G/rho is strictly constant at all radii), and uses schematic
        2D matplotlib patches rather than 3D coral colony meshes or empirical growth time series
      does_not_claim:
      - 3D hydrodynamic polyp-scale morphogenesis or direct statistical fitting to raw field colony time series
