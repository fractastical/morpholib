    reference_value: 1330
    reference_source: all distinct names in the atlas
  - name: cells first seen after their parent
    value: 1326
    unit: count
    method: non-founder cells whose parent name appears in an earlier frame
    derived_from: script
    reference_value: 1326
    reference_source: all cells whose parent is in the movie (4 founders present at frame 1 have parents that predate
      it)
  - name: calibration
    value: 0.1649
    unit: µm per atlas unit
    method: x extent of the atlas's eggshell outline mesh at frame 330 (obj_files/embryo_t330.obj, 'Embryo Outline'
      in CellShapesConfig.csv; 303.1 units) set to the 50 µm egg length
    derived_from: script
    note: 'assumption: Gönczy et al. 1999 JCB 144:927 (''50-µm-long cell''); the atlas coordinates are unit-less
      (ProductionInfo X/Y/Z_SCALE = 1); the earlier nuclear-cloud estimate gives 0.1617; the sampled shell meshes
      give 0.1649-0.1750'
  - name: eggshell width under the calibration
    value: 29.238
    unit: µm
    method: y extent of the eggshell outline mesh at frame 330 (z extent 28.9 µm)
    derived_from: script
    reference_value: 30.0
    reference_source: 'Gönczy et al. 1999 JCB 144:927 / WormAtlas: the egg is ~50 x 30 µm'
    note: 'a consistency check of the calibration: the width is not fitted'
  - name: eggshell length spread across sampled shell meshes
    value: 17.3733
    unit: atlas units
    method: max - min x extent of the eggshell meshes at frames [1, 30, 60, 100, 200, 250, 280, 300, 320, 330, 340,
      350, 359] (285.8-303.1)
    derived_from: script
    note: one static mesh is reused for frames 1-~250, re-segmented per frame from ~280; the spread bounds the scale
      uncertainty (~6 %)
  - name: nuclear overrun of the shell in x
    value: 19.0129
    unit: atlas units
    method: largest distance by which a nucleus (centroid ± radius) lies outside the shell mesh's x range at the
      sampled frames
    derived_from: script
    note: 1.8 units at frame 330; the overrun is against the static early mesh, which is why the calibration uses
      the re-segmented shell
  - name: nuclear cloud width at the last frame
    value: 27.28
    unit: µm
    method: y span of nuclear centroids + one mean diameter under the calibration
    derived_from: script
    note: nuclei do not reach the eggshell; compare the eggshell width above
