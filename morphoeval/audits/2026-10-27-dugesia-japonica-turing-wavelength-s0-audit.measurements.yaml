    claim_boundary:
      reported_in_source:
      - Turing (1952) gives the diffusion-driven instability and the critical wavenumber from the reaction Jacobian
        and the two diffusivities.
      - Schnakenberg (1979) gives the polynomial activator-substrate kinetics; Gierer & Meinhardt (1972) and Murray
        (1981) are the pigment-pattern reading.
      - Nogi, Zhang, Chan & Marchant (2009) published the CC BY 2.5 plate of regenerated Dugesia japonica with dorsal
        pigment and ocelli.
      - Orii, Ito & Watanabe (2002) describe extant Dugesia japonica anatomy. Herath & Lobo (2020) model planarian
        fission with Turing patterns, not this wavelength.
      reconstructed_in_script:
      - κ = 0.15 saturation, R = D_v/D_u = 48, and D_u solved so λ_c = 6.912 µm on a 48.384 µm patch (seven linear
        wavelengths).
      - Spectral diffusion plus explicit reaction, seed 3213, and the linear-mode Pearson comparison.
      - Body mask and ocellus cups segmented from the Nogi plate and used as the display domain.
      transfer_boundary:
      - Fish pigment waves (Kondo 2009) and Schmidtea eye regeneration (Lapan & Reddien 2012) are not measurements
        of a 6.912 µm Dugesia japonica mode.
      - The Nogi plate is a praziquantel-regeneration micrograph without a scale bar. Pixel size is not 6.912 µm.
      does_not_claim:
      - Does not claim that 6.912 µm was measured on Dugesia japonica in any of the cited papers. It is this slot's
        detail-scale operating point.
      - Does not claim a fossil predecessor. The chronoseries is Holocene 1/1, age 0 Ma.
      - Does not claim the rendered body outlines are a pixel-perfect copy of four separate worms; the brightness
        mask merges some animals.
