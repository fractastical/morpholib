        evidence:
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [945, 1057], note: "7 conditions + stromal_ablation / no-sink / dihedral-ablation controls evaluated across generations", supports: true}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [1676, 1702], note: "CLI --a-ret --b-gdnf --gamma --d-ratio --generations --seed --k-bmp --k-grem --k-fgf7 --no-stroma wired via stromal_overrides into render_outputs", supports: true}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [856, 862], note: "base_half_deg hard-codes 51/42.5/41-1.4g half-angles; no-sink ablation only scales by 0.62", supports: false}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [726, 728], note: "gain_wt_ref, g_ref, size_jitter_sd fixed model-scale calibrations placed to hit rho_WT ~ 2", supports: false}
      morphometric-validation:
        value: 76
        rationale: >-
          `measure_morphoeval()` (L1413-1589) now reports 14 metrics with references and
          dispersion statistics: lambda_c = 0.4726 (exact), WT tip Pearson r = 0.9903
          (p ~ 1e-5) and Horton-Strahler R_b, generational angle RMSE 2.92 deg, Spry1-/- and
          bead ratios, hypoplasia ratio 0.3125 (ref 0.4), specimen 12/6 tips, plus six Pass 3
          metrics (noise-seeded staircase agreement 0/4, necking index 0.2025, dihedral 90.0
          deg (ref 90), Grem1-/- 0.4375 (ref 0.08), Fgf7-/- 1.00 (ref 0.70), Bmp4+/- 1.8125
          (ref 1.20)), all bitwise deterministic across two runs. The honesty control is
          credited for being reported rather than hidden. Deductions: the band-seeded "4/4
