simulations:
  - id: menshykau-fgf10-shh-lung-turing
    name: "Menshykau & Iber (2013), Zubkov et al. (2015) & Watanabe & Costantini (2004) kidney ureteric bud GDNF-RET-Wnt11 Turing branching morphogenesis with stromal BMP4/7-Gremlin1-FGF7 feedback and reduced-3D ampulla necking"
    organism: "Mus musculus (embryonic E11.5-E13.5 mouse metanephric kidney ureteric bud tree, cap and stromal mesenchyme)"
    script: 2012-menshykau-fgf10-shh-lung-turing.py
    output: docs/media/kidney_ureteric_bud_gdnf_ret_comparison.png
    extra_outputs:
      - docs/media/kidney_ureteric_bud_gdnf_ret_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-kidney-ureteric-bud-gdnf-ret-audit-v2
    source_refs:
      - menshykau2013
      - zubkov2015
      - watanabe2004
      - basson2005
      - menshykau2012
      - michos2004
      - qiao1999
      - miyazaki2000
      - metzger2008
      - short2014
    claim_boundary:
      reported_in_source:
        - "Menshykau & Iber (2013): a Schnakenberg-type GDNF-RET receptor-ligand reaction-diffusion system on the ureteric epithelium has a homogeneous steady state R* = a + b, G* = b/(a + b)^2 and a Turing instability whose fastest mode on the ampulla selects elongation, bifurcation or trifurcation as the tip radius grows"
        - "Watanabe & Costantini (2004): time-lapse of cultured E11.5 kidneys shows predominantly dichotomous (with some trichotomous) ampulla splitting and generation-dependent tip counts and branch angles"
        - "Basson et al. (2005): Spry1-/- kidneys hyper-branch with supernumerary buds; exogenous GDNF beads induce ectopic budding"
        - "Michos et al. (2004), Qiao et al. (1999), Miyazaki et al. (2000): Grem1-/- fails ureteric outgrowth, Fgf7-/- reduces ureteric growth and nephron number, Bmp4+/- shows ectopic budding (qualitative)"
        - "Menshykau et al. (2012), Metzger et al. (2008): branch-mode selection depends on the local geometry of the growing tip; successive lung bifurcation planes rotate ~90 deg (orthogonal bifurcation)"
      reconstructed_in_script:
        - "Steady state, dispersion relation, lambda_c and (a, b) phase space; 1D Neumann ampulla-cap IMEX solver with band-seeded and noise-seeded initial conditions; 1D Lagrangian moving-boundary necking of the dome; linear two-lobe axis selection on an anisotropic dome and a dihedral cascade; 2D self-avoiding ureteric tree coupled to GDNF sink, BMP, Gremlin1 and FGF7 Gaussian fields with per-tip stromal gain feeding R_tip -> rho_tip -> splitting multiplicity; 7 genetic/bead conditions plus no-sink, equal-diffusion and stromal-ablation controls; GFP specimen segmentation and tip counting"
      transfer_boundary:
        - "The 3D phase-field/ALE item is closed only as a 1D moving boundary on the dome plus a linear axis-selection argument; no surface tension, curvature, re-meshing or E13.5-E16.5 calyx stage; the 90 deg dihedral follows from an explicit daughter-orientation assumption (daughter_long_axis_parallel=True), not from the dynamics"
        - "Stromal constants k_B = 3.0, k_G = 4.0, k_F7 = 0.8, BMP baseline 0.5 and the Gaussian field amplitudes/widths are model-scale calibrations, not measured rate constants; BMP4 and BMP7 share a single field; ligand fields are quasi-static per generation"
        - "The band-seeded mode staircase [1, 2, 3, 4] is conditioned on its own cosine initial condition; the noise-seeded honesty control gives [2, 3, 5, 5]"
      does_not_claim:
        - "Quantitative reproduction of Grem1-/-, Fgf7-/- or Bmp4+/- tip counts (the reference ratios 0.08/0.70/1.20 are qualitative encodings); 3D ampulla shape; derivation of bifurcation angles from the PDE (half-angles are prescribed per generation); a kidney-specific dihedral distribution; verification offline of the 5 new DOIs"
    summary: >-
      Pass 3 (v3 remediated) evaluation of `2012-menshykau-fgf10-shh-lung-turing.py`
      (down from 92.1/100 in Pass 2). Both Pass 2 remediation items were closed as honestly
      labelled reduced models: a 1D Lagrangian moving-boundary necking solver on the ampulla
      dome with linear short-axis selection and a 90 deg period-2 dihedral cascade
      (`simulate_moving_boundary_ampulla_necking`, `select_splitting_axis`,
      `dihedral_rotation_cascade`, Panels H-I, Lean Law 5), and an explicit stromal
      BMP4/7-Gremlin1-FGF7 gain law gamma_eff = gamma (1 + k_F7 FGF7)/(1 + k_B BMP/(1 + k_G GREM1))
      with spatial stromal fields that now drive per-tip ampulla radius and splitting
      multiplicity (`stromal_signaling_gain`, Panel G, Lean Law 4), replacing the Pass 2
      prescribed multiplicities and hand-placed side buds. The remediation exposed defects
      Pass 2 scored over: the band-seeded cap solver seeds the cosine mode it then detects
      (noise-seeded control 0/4), the hypoplasia set (b = 0.45) has Tr J_0 > 0 and is outside
      the Turing regime, generational bifurcation half-angles are hard-coded to the reference
      table (angle RMSE 2.92 deg is self-referential), the Watanabe & Costantini generation
      table and the perturbation means are not traceable to a figure, the new stromal
      benchmarks are qualitative encodings the model misses (Grem1-/- 0.44 vs 0.08, Fgf7-/-
      1.00 vs 0.70, Bmp4+/- 1.81 vs 1.20) and Spry1-/- overshoots (3.875 vs 2.19). The
      specimen (SHA-256 locked, 12 WT vs 6 mutant tips) is unchanged; its ground truth is the
      Pass 1 agent's own count. 5 Lean 4 theorems (0 sorrys), 9 self-test suites, 14 bitwise
      deterministic measurements.
    scores:
      model-fidelity:
        value: 84
        rationale: >-
          The core Menshykau & Iber (2013) receptor-ligand system (steady state, flux
          cancellation, dispersion relation, lambda_c = 0.4726) is implemented correctly
          (L163-270) and the three Pass 3 additions are genuine mechanisms rather than
          relabelled prescriptions: the stromal gain law is a monotone BMP/Gremlin1/FGF7
          function (L649-667) whose spatial fields (L774-789) set the per-tip ampulla radius
          and hence rho_tip and the splitting multiplicity (L835-852), the moving boundary
          advances the dome with the JSON growth law v_n = v0 max(0, R^2 G - S_thr) and
          re-solves the cap PDE on the current arc (L587-647), and the axis-selection argument
          compares Re sigma(2 pi/L) along the two principal arcs (L491-537). Deductions: the
          band-seeded cap solver seeds the cosine mode of the band-predicted m (L367-378), so the
          m = 1..4 staircase is an initial-condition artefact, and the noise-seeded control
          (L380-383) selects [2, 3, 5, 5] because the two-lobe mode sits on the rising flank of
          sigma(k) (-6); the hypoplasia parameter set b = 0.45 has Tr J_0 > 0 and is outside the
          Turing regime, now labelled (L1204) but still used for the hypoplasia tree (-3); the
          moving boundary is 1D on the dome with no curvature/surface-tension term, no
          re-meshing and no 3D, and the 90 deg dihedral rests on `daughter_long_axis_parallel`
          (L544, L569) rather than dynamics (-3); the cap kinetics use a saturating cubic
          R^2 G/(1 + 0.18 (R - R*)^2) (L403) that is not in the paper (-2); BMP4/BMP7 share one
          quasi-static field and `compute_turing_phase_space` (L272-310) is dead code with a
          term multiplied by 0.0 (L299) (-2).
        evidence:
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [163, 270], note: "GDNF-RET steady state, Jacobian, dispersion relation and lambda_c (Menshykau & Iber 2013 Eqs. 3-6)", supports: true}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [649, 667], note: "stromal_signaling_gain: gamma_eff = gamma (1 + k_F7 FGF7)/(1 + k_B BMP/(1 + k_G GREM1)); constants stated as model-scale calibrations", supports: true}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [774, 852], note: "Spatial BMP/Gremlin1/FGF7 fields and per-tip eff_signal -> R_tip -> rho_tip -> splitting multiplicity (replaces Pass 2 prescribed multiplicities)", supports: true}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [491, 647], note: "select_splitting_axis (rho_flip = k_c/k_fastest), dihedral_rotation_cascade (explicit daughter-orientation assumption) and 1D Lagrangian moving-boundary necking", supports: true}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [367, 383], note: "Band-seeded cosine initial condition for the predicted m versus the noise-seeded honesty control; the staircase is conditioned on its own seed", supports: false}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [1204, 1204], note: "Panel A labels the hypoplasia set b = 0.45 as Tr J_0 > 0, outside the Turing regime; the hypoplasia tree still uses it", supports: false}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [272, 310], note: "compute_turing_phase_space is never called and sigma_proxy multiplies a term by 0.0", supports: false}
          - {file: morphoeval/lean/loops/Loop_054_kidney_ureteric_bud_gdnf_ret.lean, lines: [46, 235], note: "5 machine-checked Lean 4 theorems (0 sorrys): Laws 1-3 from Pass 2 plus stromal gain monotonicity (L183) and orthogonal dihedral cascade (L223)", supports: true}
      specimen-match:
        value: 80
        rationale: >-
          The SHA-256-locked E12.5 metanephros GFP specimen is segmented as before
          (`segment_specimen_ureteric_bud`, L1063-1160): green-channel threshold, morphological
          cleanup, EDT caliber and radial-weighted local maxima recover 12 WT tips in Panel A
          and 6 mutant tips in Panel B (ratio 2.00), overlaid in the comparison figure, and the
          nine-panel figure now shows the stromal perturbation bars (G), the necked dome
          outlines (H) and the axis-selection sweep (I) beside the specimen. Deductions: the
          "published" counts 12 and 6 are the Pass 1 agent's own counts of the image, not
          numbers from Song et al. (2013), and that attribution (L1575, L1585) is unverified
          offline (-6); the two new morphologies (necking index 0.20, 90 deg dihedral) have no
          kidney specimen or vendored distribution to compare against; the 90 deg reference is
          lung/qualitative (-5); the 2D tree remains a schematic with no shape metric (caliber,
          ampulla width, inter-tip spacing) compared with the specimen beyond the tip count
          (-4); the specimen comparison itself is unchanged from Pass 2 so no credit is added
          for the new geometry (0).
        evidence:
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [1063, 1160], note: "GFP ureteric bud epithelium segmentation, EDT caliber extraction and ampulla tip counting on Panels A & B", supports: true}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [1575, 1585], note: "Specimen measurement sources attribute the Wikimedia image to Song et al. (2013) PLoS ONE 8(5):e63835 Fig. 2A-C; unverified offline and the 12/6 ground truth is an agent count", supports: false}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [1311, 1362], note: "Panels G, H, I: stromal perturbation ratios, moving-boundary necked dome outlines and anisotropic-dome axis selection", supports: true}
          - {file: docs/media/kidney_ureteric_bud_gdnf_ret_comparison.png, lines: [0, 0], note: "9-panel synthesis figure with WT vs mutant GFP ureteric tree segmentation overlay; no kidney necking/dihedral specimen to compare Panels H-I against", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          The parameter space is substantially richer: rho_tip sweeps across four regimes with
