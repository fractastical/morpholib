        evidence:
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [1413, 1589], note: "14-metric MorphoEval suite (8 Pass 2 + 6 Pass 3) with reference values, methods and ablation notes", supports: true}
          - {file: 2012-menshykau-fgf10-shh-lung-turing.py, lines: [1445, 1518], note: "pass3_measurements: noise-seeded honesty control (0/4), necking index, dihedral angle, Grem1-/-, Fgf7-/-, Bmp4+/- ratios versus qualitative references", supports: true}
