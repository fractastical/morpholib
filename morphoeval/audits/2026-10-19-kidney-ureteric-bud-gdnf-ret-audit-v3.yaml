# MorphoEval audit — Menshykau & Iber (2013) Phys. Biol., Zubkov et al. (2015) Bull. Math. Biol. & Watanabe & Costantini (2004) Dev. Biol.
# Kidney Ureteric Bud GDNF-RET-Wnt11 Turing Branching Morphogenesis, 2026-10-19 (v3)
#
# Pass 3 (remediation round) re-score of `2012-menshykau-fgf10-shh-lung-turing.py` (1709 lines) after the
# instrumented loop `morphoeval/runs/2026-10-19-kidney-ureteric-bud-gdnf-ret-loop-pass3`, superseding
# `2026-10-19-kidney-ureteric-bud-gdnf-ret-audit-v2` (92.1).
#
# What Pass 3 changed (both v2 remediation items, each closed as an honestly-labelled reduced model):
#   1. Reduced-3D ampulla geometry (Section 3b, L475-667): 1D Lagrangian moving boundary r(phi,t) with the
#      reference-JSON growth law v_n = v0 max(0, R^2 G - S_thr) (`simulate_moving_boundary_ampulla_necking`),
#      linear two-lobe mode selection on an anisotropic dome (`select_splitting_axis`, rho_flip = k_c/k_fastest =
#      0.938, SHORT axis wins in the dichotomous band) and a 90 deg period-2 dihedral cascade under an explicit
#      daughter-orientation assumption (`dihedral_rotation_cascade`); Panels H and I; Lean 4 Law 5.
#   2. Explicit stromal BMP4/7-Gremlin1-FGF7 feedback (`stromal_signaling_gain`, L649-667; spatial fields L774-789;
#      per-tip gain -> R_tip -> rho_tip -> m, L835-852) replacing the Pass 2 per-condition prescribed multiplicities
#      and hand-placed side buds; new Grem1-/-, Fgf7-/-, Bmp4+/- and stromal-ablation conditions; CLI --k-bmp
#      --k-grem --k-fgf7 --no-stroma; Panel G; Lean 4 Law 4.
#   3. Honesty controls: noise-seeded cap solver (`seed_mode="noise"`) exposes that the Pass 2 "4/4 exact mode
#      matches" were conditioned on the band-seeded initial condition (noise run scores 0/4); Panel A now labels the
#      hypoplasia parameter set (a = 0.10, b = 0.45) as Tr J_0 > 0, outside the Turing regime; the unsourced Pass 2
#      hypoplasia gamma = 11.25 was reset to 25.0.
#   4. Self-test 7 -> 9 suites (14 metrics, bitwise determinism); SHA-256 per-condition RNG seeding; +5 bib entries
#      and 2 new JSON sections; Lean 3 -> 5 theorems (0 sorrys).
#
# The score goes DOWN from 92.1 because the remediation exposed a deeper layer of defects that Pass 2 scored over:
# the band-seeded staircase is circular, the generational bifurcation angles are prescribed, the Watanabe &
# Costantini table and the perturbation benchmark means are not traceable to a figure/table, the new stromal
# reference ratios are qualitative encodings the model misses by 2-5x, and the specimen tip counts are the Pass 1
# agent's own counts. Remaining findings are under `remediation`.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# working-tree files at checkpoint 028758bc (Phase A edits uncommitted at audit time; verified with grep).

