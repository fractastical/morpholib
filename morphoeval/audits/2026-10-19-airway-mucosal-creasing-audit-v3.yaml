# MorphoEval audit — Wiggs et al. (1997) J. Appl. Physiol., Li et al. (2011) JMPS, Jin et al. (2011) JAM, Eskandari et al. (2015) JTB
# Cylindrical Airway Mucosal Folding & Creasing + Pass 3 Weibel bronchial-tree impedance network, 2026-10-20 (v3)
#
# Pass 3 re-score of `2018-nelson-airway-mucosal-creasing.py` (now 1921 lines; 795 at v2) after Phase A of the
# instrumented loop `morphoeval/runs/2026-10-19-airway-mucosal-creasing-loop-pass3`, superseding
# `2026-10-19-airway-mucosal-creasing-audit-v2` (93.4, Gemini 4 Argon).
#   - Primary assessor: Claude Fable 5.1 (Pass 3 Phase B subagent), scoring against commit 8a7928d7 with access to
#     the Phase A handoff note, `git diff`, the v2 audit and the current files; no network (DOIs not re-verified).
#
# What Pass 3 changed (the single open v2 remediation item):
#   1. The 1D circumferential bilayer ring law is now coupled to a 3D symmetric dichotomous Weibel (1963) model-A
#      bronchial tree (G0-G12, 8191 branches) solved as an exact series-parallel Poiseuille impedance network
#      (`build_weibel_tree` L734-785, `solve_tree_impedance` L794-823; flow conservation error <= 3e-16). Each branch
#      carries its own ASM strain (log-normal, sigma = 0.10), its own m* from `compute_cylindrical_wavenumber`, a
#      closed-form lumen-area fraction (`lumen_area_fraction_vectorized` L263-276) and R_i = R_i^Pois (A_0/A_i)^2;
#      a saturating one-sided Venegas (2005) flow-stretch feedback (kappa = 0.2) is iterated to a fixed point
#      (`simulate_heterogeneous_bronchospasm` L852-1009). Headline: homogeneous tree / single-airway identity
#      1.000000; heterogeneous ventilation-defect fraction healthy 0.045 / bronchitis 0.107 / asthma 0.350 (Venegas
#      PET ~0.30); kappa sweep (`evaluate_tree_ventilation_sweep` L1012-1052); 3 new figure panels G/H/I, a new
#      tree-ventilation GIF, 2 new SHA-256-pinned dataset files, 6 new measurements (15 total), 6 new self-test
#      checks (14 total) and 2 new Lean 4 theorems (5 total, 0 sorrys).
#
# Why the overall score goes DOWN (93.4 -> 84.3) although the remediation item is closed: re-reading the ring
# solver for this round shows that the Pass 2 phenotype outputs were scored as if simulated when they are mostly
# prescribed — `relax_cylindrical_mucosal_ring` blends a_norm = 0.88*target + 0.12*computed (L436-438) and
# pd_sim = 0.85*pd_obs + 0.15*FFT (L430) whenever the reference values are passed in (which is the default,
# `evaluate_clinical_phenotypes` L516-517), the plotted lumen profile is 75 % analytic template + 25 % minimiser
# output (L420), the ASM constriction curves and growth GIF use the same 0.85/0.15 blend (L627-632, L1452-1457),
# and the specimen comparison is self-referential (reference 13 folds / 0.40 circularity are the specimen's own
# values). None of this is new code, but it was not penalised in v2; it is penalised here on model-fidelity,
# specimen-match, morphometric-validation and code-traceability. The genuinely simulated parts (wavenumber law,
# Poiseuille law, the whole tree network) are credited.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the files
# in the working tree at commit 8a7928d7 (uncommitted Pass 3 edits, as instrumented in the pass3 run ledger).

