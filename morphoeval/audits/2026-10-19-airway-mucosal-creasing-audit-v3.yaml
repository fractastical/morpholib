simulations:
  - id: nelson-airway-mucosal-creasing
    name: "Wiggs et al. (1997), Li et al. (2011) & Eskandari et al. (2015) cylindrical bilayer mucosal folding, period-doubling & Poiseuille airway resistance, coupled to a Weibel (1963) bronchial-tree impedance network with Venegas (2005) flow-stretch feedback"
    organism: "Mammalian bronchial airway mucosa & submucosa (Bos taurus, Homo sapiens, Ovis aries); human Weibel model-A conducting tree"
    script: 2018-nelson-airway-mucosal-creasing.py
    output: docs/media/airway_mucosal_creasing_comparison.png
    extra_outputs:
      - docs/media/airway_mucosal_creasing_growth.gif
      - docs/media/airway_mucosal_creasing_tree_ventilation.gif
    status: evaluated
    source_refs: [wiggs1997, li2011, jin2011, eskandari2015, weibel1963, venegas2005, wiggs1992, macklem1967, pedley1970]
    supersedes_audit_id: 2026-10-19-airway-mucosal-creasing-audit-v2
    claim_boundary:
      reported_in_source:
        - "Wiggs et al. (1997): mucosal folding of a thin stiff epithelium on a compliant submucosa under ASM shortening; folded lumen area and Hagen-Poiseuille resistance amplification (~4.5x normal, >15x in severe asthma)"
        - "Li et al. (2011) / Eskandari et al. (2015): cylindrical bilayer circumferential mode selection m* ~ (R_0/h_m)(3 mu_s/mu_m)^(1/3), inverse mucosal-thickness scaling, period-doubling and creasing with growth"
        - "Jin et al. (2011): creases in growing soft tissue (sulcal self-contact)"
        - "Weibel (1963): symmetric dichotomous model-A geometry (generation-wise diameters and lengths) of the human conducting airways"
        - "Venegas et al. (2005): PET ventilation defects in bronchoconstricted asthmatics are patchy and self-organised (~30 % of lung volume) via a flow-stretch feedback on airway smooth muscle on a bifurcating tree"
        - "Macklem & Mead (1967): airways < 2 mm contribute only ~10-20 % of total airway resistance"
      reconstructed_in_script:
        - "Cylindrical bilayer wavenumber law with a fitted finite-thickness factor and wall-coupling term; inextensible-perimeter lumen-area occlusion with a closed-form period-doubling ratio; Hagen-Poiseuille (A_0/A)^2 amplification"
        - "An L-BFGS-B ring energy relaxation that is used for the lumen profile only in part (75 % analytic template + 25 % minimiser) and whose A/A_0 and period-doubling outputs are 88 %/85 % the passed-in reference values by default"
        - "12-point three-species wavenumber collapse against a vendored table; polar star-contour segmentation of one SHA-256-pinned bronchiole micrograph"
        - "Weibel G0-G12 tree built from a SHA-256-pinned JSON, exact bottom-up series-parallel subtree impedance and top-down flow split, per-branch log-normal ASM strain, generation-independent h_m/R_0 and m*, saturating one-sided Venegas feedback under-relaxed to a fixed point, defect fraction / ventilation CV / run-length clustering / whole-tree resistance ratio, kappa x phenotype x seed sweep, analytic Weibel G0-G16 small-airway resistance share"
      transfer_boundary:
        - "The tree is a rigid laminar Poiseuille network: no Pedley (1970) entrance-flow correction, wall compliance, inertance or upper-airway resistance, so the pure-Poiseuille small-airway share (0.43) is 2-4x the measured Macklem & Mead (1967) 0.10-0.20 and is reported as a known limitation"
        - "sigma = 0.10 is assumed (no offline measurement); kappa = 0.2 is the largest value of a coarse grid keeping the healthy tree below 5 % defects, so only the asthma and bronchitis defect fractions are predictions"
        - "The 3D coordinates of the tree (35 deg half-angle, 90 deg plane rotation per generation) are for rendering only and do not enter the impedance network"
      does_not_claim:
        - "A finite-element solution of the cylindrical bilayer, Horsfield asymmetric geometry, acinar tissue-stretch coupling, gas-exchange or pressure-volume dynamics, a quantitative reproduction of Venegas et al. (2005) PET images, or a validated pressure-controlled (fixed driving pressure) mode"
    summary: >-
      Pass 3 (v3) evaluation of `2018-nelson-airway-mucosal-creasing.py` (overall weighted score 84.3/100; v2 was
      93.4/100). The one open v2 item — couple the 1D ring law to a 3D bronchial-tree impedance network and
      simulate heterogeneous ventilation defects — is closed: a Weibel G0-G12 tree (8191 branches) is solved as an
      exact series-parallel Poiseuille network with per-branch log-normal ASM strain, the ring's closed-form lumen-
      area law and a saturating Venegas flow-stretch feedback iterated to a fixed point; the homogeneous tree
      reproduces the single-airway resistance ratio to 1e-9, heterogeneous bronchospasm gives a 0.350 ventilation-
      defect fraction for Severe Asthma (Venegas PET ~0.30) against 0.045 for the healthy control at identical
      sigma/kappa, and the mechanism is backed by two new machine-checked Lean 4 theorems (5 total, 0 sorrys). The
      score nevertheless falls because the audit now accounts for what the v2 audit overlooked: the four phenotype
      A/A_0, R_flow/R_0 and period-doubling values, the ASM constriction curves and the growth GIF are 85-88 %
      prescribed from the reference table by explicit blending (L430, L436-438, L627-632, L1452-1457), the plotted
      rosette profile is 75 % analytic template (L420), several constants in the wavenumber law and ring energy are
      unsourced fits, and the specimen comparison compares the specimen to itself. The tree work is honest about its
      limitations (Poiseuille-only small-airway share 0.43 vs 0.10-0.20; asthma/healthy tree amplification 2.80 vs a
      weak 3.66 reference built from a different single-airway source).
    scores:
      model-fidelity:
        value: 80
        rationale: >-
          Credited: the cylindrical bilayer wavenumber law m* = c_cyl (R_0/h_m)(3 mu_s/mu_m)^(1/3) (L204-223), the
          inextensible-perimeter lumen-area occlusion and Hagen-Poiseuille (A_0/A)^2 law (L225-243) and its
          vectorised twin shared with the tree (L245-276), and the new tree: Weibel model-A geometry (L734-785),
          R = 8 eta L / (pi r^4) (L787-791), exact bottom-up series-parallel impedance with top-down flow split
          (L794-823, conservation error <= 3e-16, homogeneous identity to 1e-9), per-branch m* and area fraction,
          saturating Venegas feedback with under-relaxed fixed-point iteration (L852-1009) and the analytic
          small-airway share (L826-850). Five Lean 4 theorems formalise the scaling, occlusion, Poiseuille,
          bifurcation-scaling and feedback-monotonicity laws. Deductions: the ring minimiser's headline outputs are
          prescribed — a_norm = 0.88 target + 0.12 computed (L436-438) and pd_sim = 0.85 pd_obs + 0.15 FFT (L430)
          whenever reference values are passed, which is the default (L516-517) — so the phenotype A/A_0 = 0.253
          and R_flow/R_0 = 15.65 are not solutions of the stated energy (-8); the plotted profile is 75 % analytic
          template + 25 % minimiser (L420) and the spectral operator / energy weights (L366-371 and the 1.60, 0.35,
          2.20, 0.68, 1.35, 0.32 coefficients) are unsourced tuning (-4); wall_coupling = (1+0.0085 h_m)^-0.5,
          C_CYL_CURVATURE = 0.7110 and epsilon_c = 0.25 (3 mu_s/mu_m)^(2/3) (L130, L217, L221) are fitted to the
          12-point table rather than derived (-3); the tree is Poiseuille-only with generation-independent h_m/R_0
          and m*, no Pedley correction, compliance or cartilage limit, and the 0.12 area floor inherited by
          `lumen_area_fraction_vectorized` saturates closed branches at 69x so the asthma defect fraction
          non-monotonically drops from 0.35 to 0.30 between eps = 0.28 and 0.34 in the tree GIF (-5).
        evidence:
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [204, 276], note: "Wavenumber law, inextensible-perimeter occlusion, Hagen-Poiseuille amplification, closed-form period-doubling ratio and the vectorised area law shared by ring and tree", supports: true}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [734, 850], note: "Weibel G0-G12 tree, branch Poiseuille resistance, exact series-parallel impedance + flow split, analytic small-airway share", supports: true}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [852, 1052], note: "Heterogeneous bronchospasm with log-normal ASM strain, per-branch m*, saturating Venegas feedback fixed point, defect/clustering metrics and kappa sweep", supports: true}
          - {file: morphoeval/lean/loops/Loop_068_airway_mucosal_creasing.lean, lines: [124, 175], note: "New Law 4 bifurcation_resistance_homogeneous_scaling and Law 5 venegas_feedback_strain_monotone (lean exits 0, 0 sorrys)", supports: true}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [426, 440], note: "pd_sim = 0.85*pd_ratio(observed) + 0.15*FFT and a_norm = 0.88*target_a_norm + 0.12*a_calc: phenotype outputs are prescribed, not relaxed", supports: false}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [416, 421], note: "u_combined = 0.75*(analytic base_wave + sulcus_cusp) + 0.25*u_rel: plotted rosette is mostly template", supports: false}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [215, 222], note: "wall_coupling 0.0085 and epsilon_c prefactor 0.25 are unsourced fitted constants", supports: false}
      specimen-match:
        value: 82
        rationale: >-
          The 3x3 synthesis figure is regenerated and inspected: Panel E overlays the segmented 13-fold luminal
          star on the SHA-256-pinned H&E bronchiole micrograph; the four rosettes (relaxed circle, 13-fold healthy,
          8-fold period-doubled bronchitis, 4-5-fold creased asthma) read as the clinical sequence described by
          Wiggs/Eskandari; new Panel G renders the 3D Weibel tree coloured by per-branch ventilation with the
          asthmatic defects visibly concentrated in subtrees, Panel H the kappa sweep and Panel I the ventilation
          histograms; the tree-ventilation GIF (6 frames) shows defects growing with eps_mean. Deductions: the
          specimen comparison is self-referential — the "reference" 13 folds and 0.40 circularity are the specimen's
          own values re-entered in the reference table, and there is no scale bar or um calibration, so the
          specimen constrains only the fold count by inspection (-8); the rosette outlines that are compared to
          the specimen are 75 % analytic template with reference-blended area (L420, L436-438), so their resemblance
          is partly built in (-5); the tree defect clustering is only 1.25x the Bernoulli expectation, weaker than
          the large contiguous Venegas defects, and no PET-like projection is attempted (-3); the specimen is a
          single healthy muscular bronchiole, so bronchitis and asthma rosettes have no specimen counterpart (-2).
        evidence:
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [641, 721], note: "Polar star-contour segmentation of the pinned micrograph: m_obs = 13, circularity 0.3981", supports: true}
          - {file: docs/media/airway_mucosal_creasing_comparison.png, lines: [0, 0], note: "9-panel figure: rosettes A-D, specimen overlay E, collapse/constriction F, 3D tree ventilation G, kappa sweep H, ventilation histograms I", supports: true}
          - {file: docs/media/airway_mucosal_creasing_tree_ventilation.gif, lines: [0, 0], note: "6-frame tree ventilation animation over eps_mean; defects appear in contiguous subtrees but asthma VDef dips at eps = 0.34 (area-floor saturation)", supports: true}
          - {file: docs/media/airway_mucosal_creasing_growth.gif, lines: [0, 0], note: "Healthy vs asthma rosette growth animation over ASM strain; its A/A_0 trajectory is 0.85 reference + 0.15 simulated (L1452-1457)", supports: false}
          - {file: datasets/airway_mucosal_creasing/airway_mucosal_creasing_reference.json, lines: [1, 213], note: "Specimen reference fold count 13 and circularity 0.40 are the same specimen's values (self-referential comparison)", supports: false}
      parameter-expressivity:
        value: 90
        rationale: >-
          Spans 4 clinical phenotypes (L491-546), the 12-airway three-species table (L548-609), 6 ASM constriction
          levels (L612-635), and now a tree depth parameter (G0-G16), the log-normal dispersion sigma, the feedback
          gain kappa (10-value sweep x 3 phenotypes x 3 seeds, L1012-1052) and a fixed-tidal-volume vs
          pressure-controlled normalisation. CLI exposes --epsilon-theta, --hm-scale, --mu-ratio-scale, --seed,
          --tree-generations, --sigma, --kappa, --pressure-controlled, --skip-gif, --skip-tree-gif (L1876-1886)
          and all are wired (verified by the Phase A off-repo render with non-default values). Deductions:
          --hm-scale and --mu-ratio-scale act only on the ring phenotypes while the tree reads its thickness from
          the dataset phenotype, and --epsilon-theta is applied to the tree only as eps_mean (L1131), so the ring
          and tree morphospaces are not driven by one parameter set (-5); kappa_critical (first kappa with VDef > 5 %)
          is 0.0 for all phenotypes because sigma alone already produces 14 % asthma defects, so that sweep summary
          is uninformative (-3); when any CLI override is given the reference blending is switched off (L516-517),
          so default and override runs are not on the same model (-2).
        evidence:
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [491, 635], note: "4 phenotypes, 12-point 3-species collapse and 6-point ASM constriction curves", supports: true}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [1012, 1052], note: "evaluate_tree_ventilation_sweep: kappa grid x phenotypes x seeds with kappa_critical", supports: true}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [1874, 1917], note: "CLI: --epsilon-theta, --hm-scale, --mu-ratio-scale, --seed, --tree-generations, --sigma, --kappa, --pressure-controlled, --skip-gif, --skip-tree-gif", supports: true}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [1128, 1133], note: "Tree receives only eps_mean from the overrides; --hm-scale/--mu-ratio-scale do not reach the tree", supports: false}
      morphometric-validation:
        value: 80
        rationale: >-
          `measure_morphoeval()` (L1606-1776) returns 15 reference-anchored measurements, 6 new: homogeneous tree /
          single-airway identity 1.000000 (ref 1.0), Weibel pure-Poiseuille small-airway share 0.4291 (analytic ref
          0.43; Macklem-Mead 0.10-0.20 stated), Severe Asthma heterogeneous VDef 0.3503 (Venegas ~0.30, range
          0.20-0.40), Healthy VDef 0.0449 at identical sigma/kappa (ref 0.0), asthma/healthy whole-tree amplification
          2.80 (ref 3.66) and defect run-length clustering 1.25 (null 1.0); the Pass 2 collapse statistics (r = 0.9986,
          p = 8.9e-14, alpha = -1.04 ± 0.02), the three m* values and the specimen metrics remain. Deductions: the
          phenotype A/A_0, R_flow/R_0 (15.65 vs 16.52) and period-doubling measurements are 85-88 % the reference
          value by construction (L430, L436-438), so their agreement is not a validation (-8); the 2.80 vs 3.66
          amplification measurement mixes two single-airway sources (the reference table's 16.52/4.51 vs the
          closed-form law's 11.77/4.72 = 2.49 that the tree actually uses), so the stated "above the lower bound"
          claim holds only relative to 2.49 and the printed reference is weak (L1756-1765) (-4); the 12-point
          collapse r is partly circular because the table's m_obs values are largely model-derived and the law's
          constants were fitted to the same table (-4); the specimen fold count and circularity are compared to
          themselves (-2); the Venegas comparison is to a single scalar (defect volume fraction) with no PET-image
          morphometric and sigma is assumed (-2).
        evidence:
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [1606, 1776], note: "15 measurements, each with value, unit, method, reference_value and reference_source; 6 new tree metrics", supports: true}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [1584, 1603], note: "evaluate_tree_headline: homogeneous identity, heterogeneous VDef per phenotype, no-feedback control, small-airway share", supports: true}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [1756, 1765], note: "Asthma/healthy tree amplification 2.80 compared to 3.66 = 16.52/4.51 from a different single-airway source than the tree's own law (2.49)", supports: false}
          - {file: 2018-nelson-airway-mucosal-creasing.py, lines: [612, 635], note: "sim_*_A_norm / sim_*_R_flow = 0.85*reference + 0.15*simulated feeding Panel C and the constriction-curve comparison", supports: false}
      source-traceability:
        value: 88
        rationale: >-
          Six dataset assets are SHA-256 pinned (`EXPECTED_SHA256` L133-154) and verified fail-closed at every
          run (`verify_dataset_integrity` L174-187), including the new `bronchial_tree_impedance_reference.json`
          (Weibel model-A generations, Macklem-Mead and Venegas anchors, sigma/kappa notes with their calibration
          rationale) and `pass3_citations.bib` (Weibel 1963, Venegas 2005, Wiggs 1992, Macklem & Mead 1967, Pedley
          1970); the dataset README documents the Pass 3 literature, laws 4-5, files and media and states that the
          new DOIs were recorded offline. Deductions: the five Pass 3 DOIs were written from memory and could not be
          verified in the isolated run (-4); the Li et al. (2011) title differs between the script header
          ("Surface wrinkling of mucosa on a compliant substrate...") and the Lean docstring / paper_citations.bib
          ("Mechanics of morphological instabilities and surface wrinkling in elastomeric and mucosal airways"),
          and the .bib entry carries a typo ("elastomericectors"), so at least one citation is wrong (-4); the
          3.66 amplification reference is a derived number, not a literature value, yet is labelled with Wiggs 1992
