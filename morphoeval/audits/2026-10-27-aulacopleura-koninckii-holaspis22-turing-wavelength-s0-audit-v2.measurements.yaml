    claim_boundary:
      reported_in_source:
      - Five holaspid morphs with 18–22 thoracic segments; hemianamorphosis; precocious specification of the adult
        count (Fusco et al. 2004).
      - Meraspid per-stage growth 1.115 and holaspid per-stage growth 1.103; thoracic release ends at s18 for t18
        and s22 for t22 (Hughes et al. 2017).
      - A shape transition near glabellar length 1.7 mm is not strictly tied to segment number (Hughes & Chapman
        1995).
      reconstructed_in_script:
      - Schnakenberg Jacobian and k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v), with the length unit set so lambda_c
        = 1.514e-5 m.
      - Entry-size ratio 1.115^4 and the per-tergite wavelength-count ratio against the 18-segment predecessor.
      - Segment-accretion reveal on the pinned dorsal photograph, with the simulated activator painted into the
        two eye regions.
      transfer_boundary:
      - The catalog ages 428.3 Ma (holaspis18) and 428.1 Ma (holaspis22) are series bookkeeping. Fusco et al. 2004
        describe contemporaneous intraspecific morphs from one narrow Wenlock interval near 429 Ma.
      - 15 µm is the assigned cellular detail scale for this slot. It is not a lens diameter measured on Aulacopleura.
      does_not_claim:
      - That the fossil photograph resolves 15 µm ocelli.
      - That 18- and 22-segment animals are successive chronospecies separated by 0.2 Myr.
      - That Schnakenberg kinetics were written down by Fusco, Hughes, or Turing; Turing 1952 supplies the dispersion
        relation, Schnakenberg supplies a two-species carrier that realizes it.
