    summary: >-
      Pass 2 accepts the quantitative record. Dispersion Pearson r = 0.9999
      (RMSE 0.0155, KS 0.095) between analytic σ(k²_disc) and the Euler run.
      Across eight values of γ the fastest-mode index tracks the analytic
      k_c ∝ sqrt(γ) with Pearson r = 0.9932. Mode 8 (12 px = 77.44 µm) grows
      by ×2.72 in 500 steps; mode 2 decays to ×0.61; D_v = D_u decays to ×0.31.
      The gill disc on Mushroom Observer 593470 has circularity 0.231 (reference
      1.0) and cap coherency 0.633 versus frame coherency 0.614. The saturated
      radial peak sits at 68.84 µm, an 11% nonlinear shift off the linear k_c.
      CV similarity of the 12-frame 640×480 GIF against the photograph is 87.2.
