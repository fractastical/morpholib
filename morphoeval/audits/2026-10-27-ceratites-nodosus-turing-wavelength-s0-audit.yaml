simulations:
  - id: delphi10000-ceratites-nodosus-turing-wavelength-s0
    name: "Ceratites nodosus Schnakenberg Turing wavenumber at 26 µm (Ladinian, 240 Ma)"
    organism: "Ceratites nodosus"
    script: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py
    output: docs/media/ceratites_nodosus_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, gierer1972, meinhardt1987, boyajian1992, ball2015]
    summary: >-
      Pass 1. Periodic Schnakenberg activator-inhibitor on an 8-wavelength mantle
      patch. Diffusivities are solved so k_c sits at 2.56e-05 m. The saturated
      field selects that wavelength (ratio 1.000). Dispersion Pearson r against
      one Euler step is 0.990; full-curve RMSE is 0.50 because stiff modes are
      poorly resolved, and the unstable-band r is 0.964. Equal diffusion decays.
      A gamma sweep from 1.08 to 1.90 times onset lengthens lambda from 25.1 to
      28.2 µm. The shell photograph is segmented (circularity 0.659, coherency
      0.522). At fixed 26 µm, Goniatites (333 Ma, 18 mm) holds 703 cellular
      wavelengths, Ceratites (240 Ma, 32 mm) holds 1250, and Dactylioceras
      (181 Ma, 42 mm) holds 1641. The fossil does not resolve 26 µm pigment.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) dispersion relation and diffusion-driven instability."
        - "Schnakenberg (1979) kinetics f = a - u + u^2 v, g = b - u^2 v."
        - "Meinhardt and Klingler (1987) interpret molluscan shell pigment as an activator-inhibitor pattern."
        - "Boyajian and Lutz (1992) treat ammonoid suture complexity with a fractal descriptor. Campaign D_f values are 1.18, 1.34, and 1.55."
      reconstructed_in_script:
        - "a = 0.062, b = 1.140, gamma = 1.15 times onset, Du and Dv solved for lambda = 2.56e-05 m."
        - "96 by 96 periodic explicit Euler integration and a radial-FFT wavelength."
        - "Shell counts N = L / lambda at the campaign shell sizes."
      transfer_boundary:
        - "The 26 µm field is a mantle-epithelial scale. Mapping its chroma onto the shell photograph is a visualisation, not a to-scale pigment restoration."
      does_not_claim:
        - "That this photograph, or any published SEM of Ceratites nodosus, resolved a 26 µm pigment wavelength."
        - "That the Schnakenberg rates were measured in a Ceratites mantle."
        - "That Boyajian and Lutz reported D_f = 1.34 for this specimen."
        - "That the 1.088 mm sibling slot's diffusivities were reused."
    scores:
      model-fidelity:
        value: 84
        rationale: "The script linearises Schnakenberg kinetics, sets k_c^2 = sqrt(det J / (Du Dv)), and integrates the nonlinear PDE on a periodic patch. Operating Du is solved for 26 µm rather than copied from the 1.1 mm sibling. The one-step Euler dispersion test uses a large diffusive timestep, so stiff modes miss the continuous curve (RMSE 0.50)."
        evidence:
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [84, 134], note: "Jacobian, onset ratio, and k_c diffusivity solve", supports: true}
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [136, 252], note: "Dispersion measurement and periodic mantle integration", supports: true}
      specimen-match:
        value: 74
        rationale: "The comparison figure places the vendored Muschelkalk shell beside an ocellus field at 25.60 µm. The growth GIF keeps shell luminance and carries the activator as chroma, so the fitness crop sees the fossil rather than the spots. The fossil's ribs and nodes are not a 26 µm pigment pattern."
        evidence:
          - {file: docs/media/ceratites_nodosus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Specimen, mantle patch, dispersion, sweep, chronoseries", supports: true}
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [387, 428], note: "Growth GIF; last frame restores specimen luminance", supports: true}
      parameter-expressivity:
        value: 80
        rationale: "Raising the inhibitor/activator ratio from 1.08 to 1.90 times onset lengthens the selected wavelength monotonically (25.1 to 28.2 µm). Setting Dv = Du drives sigma_max to -0.28 and the amplitude to numerical zero. Gamma is a constant, not a command-line argument."
        evidence:
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [254, 304], note: "parameter_sweep and equal_diffusion_control", supports: true}
      morphometric-validation:
        value: 82
        rationale: "Full-curve Pearson r is 0.990 and the radial FFT peak is exactly 2.56e-05 m. Specimen circularity is 0.659 against a circle null of 1, foreground fraction 0.505 against 0.70, coherency 0.522 against 0.25. Radial KS versus the photograph is 0.94, which is the expected mismatch at a scale the photo cannot resolve. Unstable-band r is only 0.964."
        evidence:
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [318, 370], note: "segment_specimen and ks_radial", supports: true}
          - {file: datasets/ceratites_nodosus_turing_wavelength_s0/simulation_metrics.json, lines: [0, 0], note: "pearson_r 0.9902, lambda_ratio 1, KS 0.936", supports: true}
      source-traceability:
        value: 88
        rationale: "Six Crossref-checked DOIs are in the bib and the reference JSON. The shell file is SHA-256 pinned and copied from the campaign gallery. Wikimedia CC candidates are listed in the scout manifest. The gallery file's own license record is not in EXIF."
        evidence:
          - {file: datasets/ceratites_nodosus_turing_wavelength_s0/paper_citations.bib, lines: [1, 55], note: "Turing, Schnakenberg, Gierer-Meinhardt, Meinhardt-Klingler, Boyajian-Lutz, Ball", supports: true}
          - {file: datasets/ceratites_nodosus_turing_wavelength_s0/ceratites_nodosus_turing_wavelength_s0_reference.json, lines: [1, 40], note: "26 µm, 240 Ma, specimen SHA-256", supports: true}
      code-traceability:
        value: 80
        rationale: "The module docstring and the diffusivity solver name the Turing wavenumber. Lean theorems check the integer wavelength counts (1250, and 42 per organ-scale rib) and the sign of the integer Turing numerator. They are not a real-analysis proof of the dispersion relation."
        evidence:
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [1, 20], note: "Docstring states the k_c law and the 26 µm / 240 Ma slot", supports: true}
          - {file: morphoeval/lean/loops/Loop_3142_ceratites_nodosus_turing_wavelength_s0.lean, lines: [1, 51], note: "Six theorems, zero sorry", supports: true}
      repro-package:
        value: 86
        rationale: "Seed 3142, pinned SHA-256 of the five dataset sources, and a --self-test that checks r > 0.98, the wavelength ratio, ablation decay, sweep monotonicity, and a GIF of at least 10 frames at least 480 px. The run is deterministic given that seed."
        evidence:
          - {file: models/2026-delphi10000-ceratites-nodosus-turing-wavelength-s0.py, lines: [42, 78], note: "EXPECTED_SHA256, seed 3142, verify_sha256", supports: true}
    remediation:
      - id: R1
        item: "Re-measure the dispersion with a smaller timestep so the unstable-band Pearson r exceeds 0.98 and the stiff-mode RMSE drops."
      - id: R2
        item: "Add a second negative control: a domain shorter than one wavelength, where the lowest mode is stable."
      - id: R3
        item: "Report a 12-bin Sobel orientation cosine between the specimen and the simulated field, and a transect bootstrap CV of the selected wavelength."
      - id: R4
        item: "Expose the diffusion-ratio factor on the command line and show that it moves lambda."
      - id: R5
        item: "Single photograph. The fossil cannot confirm a 26 µm pigment; that limit stays open."
      - id: R6
        item: "No independent second assessor."
