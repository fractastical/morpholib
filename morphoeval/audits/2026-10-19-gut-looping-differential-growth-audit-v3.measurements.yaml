    claim_boundary:
      reported_in_source:
      - 'Savin et al. (2011): the midgut loops because the tube grows faster than the dorsal mesentery it is attached
        to (strain epsilon = (L_t - L_m)/L_m); loop wavelength and radius scale as lambda = 4.55 ell_*, R = 1.68
        ell_* with ell_* = (E_t I_t / (E_m h_m))^(1/3); surgically freed tubes uncoil; the collapse holds across
        chick ontogeny (E8-E16) and across zebra finch, quail, chick and mouse (Fig. 4e-f)'
      - 'Nerurkar, Mahadevan & Tabin (2017): BMP2 over-expression increases and Noggin decreases the differential
        strain and the number of loops at E12'
      - 'Kurpios et al. (2008), Davis et al. (2008): Pitx2-dependent left-right asymmetric condensation and architecture
        of the dorsal mesentery set the handedness of looping'
      reconstructed_in_script:
      - Analytical strain, annular inertia and cube-law predictions; a 96-node discrete rod (axial + second-difference
        bending energy) sharing its nodes with the gut edge of a 96 x 5 CST St.Venant-Kirchhoff plane-stress membrane
        mesh of a trapezoidal fan (root fixed, rod ends pinned) with a mean-preserving apicobasal Pitx2 stiffness
        field; L-BFGS-B relaxation with emergent turning-number loop count, R = 1/<kappa>, contour length per loop
        and tortuosity for E8-E16, BMP2/WT/Noggin/ablation at E12, a Pitx2-gradient sweep and a mesh-refinement
        check; the 14-point analytical collapse; chromaticity + DoG segmentation of a vendored mesentery photograph
      transfer_boundary:
      - 'The FE model is a pure membrane (no sheet bending, no left-right rest curvature): looping handedness is
        NOT selected and the script makes no chirality claim; W_m/L_m = 0.18, root fraction 0.7, nu_m = 0.45 and
        a_Pitx2 = 0.4 are modelling assumptions flagged in fe_mesentery_mesh_reference.json, not measurements'
      - 'The emergent morphometrics are unfitted: E12 N = 9.81 vs 8.5, R = 0.952 vs 1.15 mm; E8-E16 MAPE 18.7 %
        (N) and 21.4 % (R); the ontogenetic log-log slope of R_sim vs ell_* is 0.61 (cube law 1.0); N changes by
        7.7 % on 96x5 -> 128x6 refinement'
      - The 14-point cross-species table in gut_looping_differential_growth_reference.json reproduces lambda = 4.55
        ell_* and R = 1.68 ell_* to ~1 % with identical log-log slopes for lambda and R, so the r = 0.9999 collapse
        is a consistency check of the table against the law, not an independent validation against digitised Fig.
        4e-f data
      does_not_claim:
      - A Kirchhoff rod with twist, a Kirchhoff-Love shell, chirality / handedness selection, mesh-converged loop
        numbers, measured Pitx2 stiffness gradients, moduli for the BMP2/Noggin conditions traceable to Nerurkar
        2017, or an embryonic-chick specimen image (the vendored photograph is an adult mammalian mesentery)
