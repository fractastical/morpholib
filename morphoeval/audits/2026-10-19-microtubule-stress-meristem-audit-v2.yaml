      the Bozorg et al. (2014) stress-vs-strain directional cue discrimination (stress
      cue r = 0.9910 vs strain control r = -0.4150), the 24-cell laser ablation ring
      circumferential reorientation (<cos^2> = 0.8997 vs 0.3512), and the 5-condition
      genotype/perturbation sweep across WT, strain control, `bot1`/`ktn1`, Oryzalin, and
      lateral compression (r = 0.9992, p = 2.41e-5, RMSE = 0.3125 um); and segments the
      SHA-256-locked *Arabidopsis thaliana* SAM micrograph (`arabidopsis_meristem_boundary_specimen.jpg`).
