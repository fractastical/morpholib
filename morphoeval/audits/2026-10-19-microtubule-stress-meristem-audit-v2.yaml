      - sampathkumar2014
      - hamant2008
      - uyttewaal2012
    summary: >-
      Pass 2 (v2) evaluation of `2008-hamant-microtubule-stress-meristem.py` (overall
      weighted score: 93.4/100, up from 54.0/100 in v1). The remediated script solves
      the pressurized thin-shell / finite-element turgor stress tensor and anisotropic
      viscoplastic Lockhart growth across the 4 canonical SAM zones (Central Dome K>0,
      Peripheral Flank, Organ-Meristem Saddle Boundary K<0, and Cylindrical Stem
      sigma_theta/sigma_z = 2.0); proves and numerically verifies all 3 Lean 4 theorems
