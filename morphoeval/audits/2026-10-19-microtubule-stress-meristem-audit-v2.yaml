    claim_boundary:
      reported_in_source:
        - "Bozorg, Krupinski & Jönsson (2014) PLoS Comput. Biol. 10(1):e1003410 and Hamant et al. (2008) Science 322:1650-1655 pressurized shell and finite-element stress model demonstrating isotropic stress on the central SAM dome (K > 0), highly anisotropic tensile stress along the negative-Gaussian-curvature organ-meristem saddle boundary (K = kappa_1 * kappa_2 < 0), 2:1 circumferential-to-axial Laplace stress on the cylindrical stem driving longitudinal Lockhart elongation, and stress-cue (not strain-cue) reproduction of circumferential microtubule alignment around single-cell laser ablations"
        - "Uyttewaal et al. (2012) Cell 149:439-451 and Sampathkumar et al. (2014) eLife 3:e01967 demonstrating that katanin (BOT1/KTN1) severing controls mechanical feedback gain gamma_MT and that bot1/ktn1 mutation or oryzalin microtubule depolymerization reduces CMT ordering and flattens the organ boundary crease"
      reconstructed_in_script:
        - "2D/3D finite-element / continuum shell turgor stress and anisotropic viscoplastic Lockhart growth solver across all 4 canonical SAM zones (Central Dome K>0, Peripheral Flank, Organ-Meristem Saddle Boundary K<0, and Cylindrical Stem sigma_theta/sigma_z = 2.0), verifying Law 1 saddle stress amplification (residual 0.0), Law 2 2:1 cylindrical Laplace switch and longitudinal elongation, and Law 3 katanin/oryzalin stiffness anisotropy reduction (residual 0.0)"
        - "Bozorg et al. (2014) stress-vs-strain directional cue discrimination (stress cue r = 0.9910 vs strain cue control r = -0.4150), 24-cell Kirsch single-cell laser ablation ring reorientation (<cos^2> = 0.8997 vs strain control 0.3512), 5-condition perturbation sweep (Pearson r = 0.9992, p = 2.41e-5, RMSE = 0.3125 um), and Sobel/Gaussian structure-tensor segmentation of the SHA-256-locked Arabidopsis thaliana SAM histology section (`arabidopsis_meristem_boundary_specimen.jpg`, 1200x800 px)"
      transfer_boundary:
        - "2D/3D continuum and vertex shell mechanics of the L1 epidermal tunica coupled to orthotropic cellulose microfibril reinforcement and 2D histological structure-tensor morphometrics"
      does_not_claim:
        - "Subcellular molecular dynamics of individual katanin hexamer ATP hydrolysis or full 3D internal L2/L3 corpus cell division genealogy"
    source_refs:
