    claim_boundary:
      reported_in_source:
      - 'Turing 1952: diffusion-driven instability and a critical wavenumber.'
      - 'Schnakenberg 1979: the kinetics du/dt = a - u + u^2 v, dv/dt = b - u^2 v.'
      - 'Prum & Williamson 2002: within-feather bars, spots and ocelli as follicular reaction-diffusion.'
      - 'Harris et al. 2005: Shh self-activates and induces Bmp2; Bmp2 represses Shh on the feather epithelium.'
      - 'Haupaix et al. 2018 and Inaba & Chuong 2020: Japanese quail has a somite-scale macro pattern and a within-feather
        micro pattern.'
      reconstructed_in_script:
      - Slot parameters (a, b, Du, Dv) = (0.07, 0.93, 0.035, 1.85) with the length unit fixed so the onset lambda_c
        = 2.242e-5 m.
      - Du sweep of the linear-regime growth wavelength (Pearson r = 0.9997, RMSE = 6.52 µm) and a nominal dispersion-curve
        Pearson r = 0.993.
      - Equal-diffusion ablation drawn on the same color scale as the patterned field, so a flat control stays flat.
      - Full plumage mask and a flank-only ROI on the Yehliu photograph. The figure labels linear 22.42 µm and saturated
        FFT 33.6 µm as different lengths.
      transfer_boundary:
      - The Yehliu portrait has no micron scale bar. GIF pixels are a display envelope. 22.42 µm is the onset law;
        33.6 µm is the saturated spot spacing.
      does_not_claim:
      - Does not claim Schnakenberg rates are fitted Shh/Bmp2 biochemical constants.
      - Does not claim a geological shift from a named fossil chronospecies. The series is one Holocene node at
        0 Ma.
      - Does not claim the growth-moment RMSE has been tuned to zero. A parabolic peak fit was tested and rejected
        because the supercritical sigma peak is not the onset k_c.
