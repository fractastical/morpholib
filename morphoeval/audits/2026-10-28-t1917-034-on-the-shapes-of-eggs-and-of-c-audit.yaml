simulations:
  - id: thompson1917-t1917-034
    name: "Thompson (1917) Ch. XV: eggs as solids of revolution of a definite, species-varying family of ovoid meridian curves (Preston 1953 family on Biggins et al. 2018 / Deeming 2018 data)"
    organism: "Aves egg shells: Uria aalge (Common Guillemot), Vanellus vanellus (Northern Lapwing), Strix aluco (Tawny Owl), Podiceps cristatus (Great Crested Grebe); 30 auk + penguin species (1389 eggs); 181 species / 30 orders"
    script: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py
    output: docs/media/t1917_034_on_the_shapes_of_eggs_and_of_c_comparison.png
    extra_outputs:
      - docs/media/t1917_034_on_the_shapes_of_eggs_and_of_c_growth.gif
    status: evaluated
    source_refs:
      - thompson1917
      - thompson1908
      - preston1953
      - biggins2018
      - biggins2018data
      - deeming2018
      - deeming2017data
      - stoddard2017
    claim_boundary:
      reported_in_source:
        - "Thompson 1917 p. 652: eggs are simple solids of revolution; forms range from spherical (owl, penguin, tortoise) through ellipsoidal (grebe, cormorant, pelican) and ovoid (hen) to blunt-pointed conical (guillemot, puffin, sandpiper, plover, curlew); prolate never oblate."
        - "Thompson 1917 p. 655 (5): the most unsymmetrical / tapered eggs are large relative to the parent bird."
        - "Thompson 1917 p. 658: envelope equation p_n + T(1/r + 1/r') = P."
      reconstructed_in_script:
        - "Preston (1953) four-parameter meridian family y = (c0 + c1 x + c2 x^2 + c3 x^3) sqrt(1 - x^2) with Biggins et al. (2018) indices and a closed-form polar asymmetry R_pole = p(+/-1)^2."
        - "Closed-form volume of the solid of revolution 315 V / (4 pi (L/2)^3) = 105 c0^2 + 21 (c1^2 + 2 c0 c2) + 9 (c2^2 + 2 c1 c3) + 5 c3^2."
        - "Species-mean elongation table (30 species), 1389-egg morphospace, Deeming PC2 vs relative egg mass Spearman test."
      transfer_boundary:
        - "The Preston family is a 1953 descriptor adopted as the quantitative reading of Thompson's 'definite family'; Thompson himself gave no algebraic family (he rejected Steiner's Cartesian oval)."
        - "Biggins et al. (2018) eggs are auks and penguins (plus a 10-egg range set); order-level breadth comes only from Deeming's PCs."
      does_not_claim:
        - "That the oviduct pressure mechanism (Thompson pp. 654-660) is the cause of the family; only the geometric claim is tested."
        - "Anything about eggshell microstructure, colour, or non-avian hard-shelled eggs beyond Thompson's mention."
    summary: >-
      Pass 1 (v1) baseline evaluation of
      `thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py`
      (overall weighted score: 56.1/100). The v1 script implements the Preston (1953) ovoid
      meridian family with Biggins et al. (2018) shape indices, a closed-form polar-asymmetry
      index (r = 0.99997 against the published numeric index on 1389 eggs) and an exact
      volume functional, reproduces the published guillemot C126 coefficients, shows the
      30-species elongation table, the 1389-egg morphospace and Thompson's relative-egg-size
      prediction (Deeming PC2 vs egg/female mass, Spearman rho = 0.391, p = 6.7e-8), and
      animates sphere -> guillemot within the family. It does not exercise Thompson's
      envelope equation in code, performs no parameter sweep, never segments the five
      vendored specimen photographs (so the solid-of-revolution part of the claim is
      untested), has no negative / ablation control (Steiner Cartesian oval, Baker /
      Troscianko / Carter alternatives), no eta^2 / KS statistics, no runtime SHA-256
      verification, and no CLI parameter overrides.
    scores:
      model-fidelity:
        value: 62
        rationale: >-
          Implements the Preston family y = p(x) sqrt(1 - x^2), the Biggins indices and the
          closed-form pole radius / volume exactly as formalised in Lean Laws 1-2 (L46-81),
          but Thompson's own governing content - the envelope equation p_n + T(1/r + 1/r') = P,
          the pole-curvature closure of the family and the cone-ended-cylinder equilibrium
          (Lean Laws 3-4) - is not exercised in code, and no generative mechanical model
          produces the family from pressure asymmetry.
        evidence:
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [46, 81], note: "Preston polynomial, half-breadth, indices with closed-form pole radius, exact volume coefficient", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_034.lean, lines: [40, 191], note: "5 machine-checked theorems (pole asymmetry criterion, volume, envelope equation at poles, cone equilibrium, prolate-never-oblate), no admitted goals", supports: true}
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [224, 258], note: "GIF morphs sphere -> guillemot by linear interpolation of c, not by Thompson's pressure mechanics", supports: false}
      specimen-match:
        value: 42
        rationale: >-
          The vendored specimen set (`biggins2018_C126_uria_aalge_silhouette.jpg` and four
          Museum Wiesbaden photographs of owl, grebe, lapwing and guillemot eggs) is SHA-256
          pinned but never loaded; the figure shows only published fitted curves, so neither
          the axisymmetry (solid-of-revolution) test nor a photograph-to-family fit exists.
        evidence:
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [160, 222], note: "Comparison figure draws published Preston curves and scatter data; no image is opened", supports: false}
          - {file: docs/media/t1917_034_on_the_shapes_of_eggs_and_of_c_comparison.png, lines: [0, 0], note: "4-panel v1 figure: range-set gallery, morphospace, species elongation bars, Deeming PC2 vs relative egg mass; no specimen overlay", supports: false}
          - {file: datasets/thompson_1917/t1917-034/t1917_034_on_the_shapes_of_eggs_and_of_c_reference.json, lines: [1, 432], note: "Specimen ground truth for C126 (c0..c3, L, B) and 13 SHA-256 pins present but unused by v1", supports: true}
      parameter-expressivity:
        value: 50
        rationale: >-
          Spans the published 10-egg range set and 1389 eggs of 30 species (L98-147), but
          there is no sweep over the model's own parameters (pole pressure contrast /
          c1, c3), no exploration of Thompson's spherical / ellipsoidal / cylindrical /
          ovoid / conical classes as regions of the family, and no CLI overrides (L310-318).
        evidence:
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [98, 147], note: "Loads Biggins main / range and Deeming tables; species means", supports: true}
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [310, 318], note: "CLI exposes only --self-test; no parameter sweep", supports: false}
      morphometric-validation:
        value: 58
        rationale: >-
          `measure_morphoeval()` (L264-292) returns 5 reference-anchored measurements
          (min elongation 1.035 >= 1; C126 elongation 1.8607 vs 92.5/49.8; closed-form PA
          r = 1.0000; species elongation range 0.43; Spearman rho = 0.391) but no RMSE / KS
          goodness-of-fit of the family against outlines, no between-species eta^2 or
          Kruskal-Wallis, and no negative-control delta.
        evidence:
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [264, 292], note: "5 measurements with reference values; no fit residuals, eta^2, or control comparisons", supports: false}
      source-traceability:
        value: 70
        rationale: >-
          Reads the vendored CC0 Dryad tables (`biggins2018_*`, `deeming2018_*`) whose
          upstream and vendored SHA-256 digests are pinned in the reference JSON and
          scout manifest, and cites Thompson 1917 / Preston 1953 / Biggins 2018 / Deeming
          2018 in the module header (L1-27), but performs no runtime digest verification
          and never opens the reference JSON (REF_JSON defined at L39, unused).
        evidence:
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [35, 39], note: "Dataset paths defined; REF_JSON unused; no sha256 check", supports: false}
          - {file: datasets/thompson_1917/t1917-034/scout_manifest.json, lines: [1, 109], note: "Dryad DOIs, file ids, SHA-256 of originals, Commons licences and authors", supports: true}
      code-traceability:
        value: 66
        rationale: >-
          Module docstring cites the sources and Lean namespace, and the family block names
          the Lean definitions (L42-45), but individual functions do not map to Thompson's
          page-level statements (pp. 652, 655, 657-659) or to the Lean theorem names, and
          the Deeming PC axis identification is undocumented in code.
        evidence:
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [1, 45], note: "Header cites Thompson, Preston, Biggins, Deeming and the Lean module; block comment names prestonPoly / poleRadius / prestonVolume315", supports: true}
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [160, 222], note: "Figure code lacks page / theorem cross-references", supports: false}
      repro-package:
        value: 60
        rationale: >-
          `--self-test` (L295-307) checks sphere indices, the closed-form volume against
          numerical integration and the C126 indices against Biggins' values, and the run is
          deterministic (no RNG), but there is no dataset-integrity check, no two-run
          determinism assertion, no --verify-only / --skip-gif flags, and the GIF is 1.08 MB.
        evidence:
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [295, 307], note: "5-assert self_test(); no SHA-256 or determinism checks", supports: false}
    remediation:
      - "Exercise Thompson's envelope equation in code: implement the pole / equator curvature closure of the Preston family (given pole pressure contrast, equatorial pressure and volume solve for c0..c3), sweep the pole pressure contrast to generate sphere -> ovoid -> conical eggs, and compute the implied (P - p_n)/T mean-curvature profile for every Biggins egg (uniform pressure <=> sphere; pole tension sign)."
      - "Segment the five vendored specimen photographs (Otsu / multi-Otsu threshold, convex hull, watershed), extract upper and lower meridian profiles, test axisymmetry (RMS upper-vs-lower / half-breadth), fit the Preston family by Biggins' weighted least squares and compare C126 against the published coefficients; place owl, grebe, lapwing and guillemot in the morphospace."
      - "Add negative / ablation controls: Steiner's Cartesian oval r + m r' = c on the guillemot outline (Thompson p. 654 footnote), prolate ellipsoid (c1 = c2 = c3 = 0) and Baker / Troscianko / Carter error ratios from biggins2018_comparison_of_fits.csv."
      - "Add statistics: Preston RMSE / breadth distribution, between-species eta^2 and Kruskal-Wallis for Elongation / Pointedness / PolarAsymmetry (30 species) and order-level eta^2 for Deeming PC1 / PC2, KS test of species elongation distributions (guillemot vs penguin), Pearson r of segmented vs published C126 profile."
      - "Add runtime SHA-256 verification of the 13 pinned dataset files, CLI overrides (--pole-contrast, --equator-contrast, --frames, --skip-gif, --verify-only), expand self_test() with integrity and two-run determinism checks, document page / theorem cross-references per function, and write datasets/thompson_1917/t1917-034/result.json."
