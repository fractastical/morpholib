# MorphoEval audit — Thompson (1917) Ch. XV claim T1917-034, egg meridian-curve family, 2026-10-28 (v1)
#
# Pass 1 (v1) evaluation of `thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py`
# (322 lines) prior to Step 12 remediation in `2026-10-28-t1917-034-on-the-shapes-of-eggs-and-of-c-loop`:
#   - Primary assessor: Claude Fable 5.1 — 56.1 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. The Preston (1953) family, shape indices and closed-form volume are implemented (L46-81) and
#      the published C126 coefficients are reproduced, but Thompson's own mechanical content
#      (envelope equation p_n + T(1/r + 1/r') = P, pole-curvature closure, cone equilibrium) is
#      only formalised in Lean, not exercised in code; there is no parameter-regime sweep.
#   2. Five specimen photographs (owl, grebe, lapwing, guillemot; CC0 C126 silhouette) are vendored
#      and SHA-256 pinned in the reference JSON, yet the v1 script never loads, segments, or fits
#      any of them: the "solid of revolution" (axisymmetry) and specimen-match tests are missing.
#   3. No negative / ablation control: Thompson's footnote that Steiner's Cartesian oval
#      "fails in such a case as the guillemot" and the Baker / Troscianko / Carter alternatives in
#      `biggins2018_comparison_of_fits.csv` are not compared against the Preston family.
#   4. Statistics are thin: one Spearman correlation; no between-species eta^2 / Kruskal-Wallis,
#      no RMSE / KS goodness of fit, no runtime SHA-256 verification, no CLI overrides, and a
#      5-assert self-test without determinism or data-integrity checks.

