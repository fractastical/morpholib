    status: evaluated
    supersedes_audit_id: 2026-10-19-cajal-dendritic-wiring-audit-v2
    claim_boundary:
      reported_in_source:
        - "Cuntz, Forstner, Borst & Häusser (2010) PLoS Comput. Biol. 6(8):e1000877 & Cuntz et al. (2007) PNAS 104:13319-13324 greedy Minimum Spanning Tree dendritic growth rule minimizing C(u, v) = ||u - v|| + bf * path(u, root) across balancing factor bf in [0, 1] to balance Ramón y Cajal's (1899) conservation of cytoplasmic wiring length W and conduction time P"
        - "Wen & Chklovskii (2008) J. Neurophysiol. 99:2320-2328 & Cuntz et al. (2010) dimensional wiring scaling laws W propto N^(1/2) A^(1/2) in 2D planar arbors and W propto N^(2/3) V^(1/3) in 3D volumetric arbors"
        - "Rall (1959) Exp. Neurol. 1:491-527 electrotonic input-conductance impedance-matching power law d_parent^(3/2) = sum_k d_daughter_k^(3/2) and the passive cable length constant lambda_DC = sqrt(R_m d / 4 R_i); Koch (1999) Eq. 2.37 sinusoidal steady-state reduction lambda_f = lambda_DC sqrt(2 / (1 + sqrt(1 + (omega tau_m)^2)))"
        - "Roth & Häusser (2001) J. Physiol. 535:445-472 Purkinje passive constants (R_m ~ 122 kOhm cm2, R_i ~ 115 Ohm cm, C_m ~ 0.77 uF/cm2); Llinás & Sugimori (1980) J. Physiol. 305:197-213 all-or-none Purkinje dendritic Ca2+ spikes; Polsky, Mel & Schiller (2004) Nat. Neurosci. 7:621-627 within-branch supralinear vs between-branch linear synaptic summation; Morris & Lecar (1981) Biophys. J. 35:193-213 two-variable Ca2+/K+ membrane"
      reconstructed_in_script:
        - "Full Cuntz et al. (2010) greedy MST solver (`grow_cuntz_dendritic_tree`) across 8 balancing factors bf in [0.0, 1.0] on N = 160 synaptic carriers, reproducing normalized wiring cost W(bf)/W(0) (Pearson r = 1.0000, RMSE = 0.0042) and normalized conduction path P(bf)/P(1) (Pearson r = 0.99969, RMSE = 0.0067), plus a random spanning tree negative control (10.43x wiring inflation)"
        - "Log-log OLS scaling law verification across N in [25, 320] at bf = 0.15: alpha_2D = 0.4797 +- 0.0168 (vs 0.5000), alpha_3D = 0.6495 +- 0.0456 (vs 0.6667), bf = 1.0 star limit alpha_star = 0.9996"
        - "Bottom-up Rall 3/2 electrotonic diameter assignment verifying (sum d_daughter^(3/2))/d_parent^(3/2) = 1.0000 (RMSE = 1.27e-16 across 40 bifurcations)"
        - "Computer-vision segmentation of Santiago Ramón y Cajal's (1899) human cerebellar Purkinje neuron drawing (`cajal_purkinje_dendritic_arbor_specimen.jpg`, Museo Cajal 328 Madrid): box-counting fractal dimension D_f = 1.7817 +- 0.0248, peak Sholl intersection count = 73 at r/R_max = 0.6176, 62 primary/secondary bifurcation hubs"
        - "(Pass 3) Rall/Koch passive-cable electrotonics on every Rall-3/2 edge of every Cuntz tree (X_e = l_e / lambda_f(d_e), lambda_f / lambda_DC = 0.2487 at f_syn = 53.05 Hz), exp(-X) attenuation of two alpha-synapse inputs from the 24 nearest-neighbour terminal-tip pairs to their lowest-common-ancestor hotspot, a vectorised forward-Euler Morris-Lecar Ca2+/K+ hotspot with g_Ca = 0 and frozen-K+ (strictly linear RC) ablations, an inter-input delay sweep dt in [0, 30] ms, and the resulting coincidence window dt_c (5.24 ms at bf = 0.20 -> 0.73 ms at bf = 1), supralinear gain (4.28x vs exact linear 2.000000), same-branch fraction (1.00 -> 0.00) and Pearson r(window, bf) = -0.698 (p = 0.054)"
      transfer_boundary:
        - "2D planar fan and 3D cubic Euclidean carrier-point greedy MST arbors with Rall 3/2 passive electrotonic diameter tapering mapped to Cajal's Golgi-stained Purkinje neuron drawing; the specimen reference values in `cajal_dendritic_wiring_reference.json` (D_f = 1.7817, Sholl peak = 73, hubs = 62) are the script's own Pass 2 outputs recorded as regression anchors, not independent literature morphometrics"
        - "(Pass 3) The dendritic Ca2+ hotspot is a single isopotential Morris-Lecar compartment with the canonical barnacle Hopf parameter set (C = 20 uF/cm2, Rinzel & Ermentrout 1998), not a Purkinje P-type Ca2+ channel fit; passive attenuation to the hotspot uses the semi-infinite-cylinder factor exp(-X), exact for Rall-matched equivalent cylinders viewed from the soma and approximate centripetally; the synaptic peak current I_peak = 110 uA/cm2 is a protocol choice tuned so single inputs stay sub-threshold"
