          toward a branch node (-2); the scaling-law sweep runs at bf = 0.15 (L791, L801) while every other
          panel uses the Purkinje regime bf = 0.20 (-1). Five Lean 4 theorems (0 sorrys) back the greedy
          cost trade-off, the 3/2 law, tree topology, exact passive superposition and lambda_f <= lambda_DC.
