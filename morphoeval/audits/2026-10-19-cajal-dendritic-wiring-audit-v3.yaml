# MorphoEval Pass 3 (v3) Audit — Cuntz, Forstner, Borst & Häusser (2010) PLoS Comput. Biol. 6(8):e1000877, Cuntz et al. (2007) PNAS 104:13319-13324,
# Rall (1959) Exp. Neurol. 1:491-527, Roth & Häusser (2001) J. Physiol. 535:445-472 & Morris & Lecar (1981) Biophys. J. 35:193-213
# Ramón y Cajal Minimum-Wiring-Length & Conduction-Delay Greedy Steiner Dendritic Trees, Rall's 3/2 Power Law, Wen-Chklovskii Volume Scaling,
# and (Pass 3) Rall passive-cable electrotonics coupled to an active Morris-Lecar dendritic Ca2+ spike hotspot, 2026-10-20 (v3)
#
# Pass 3 re-score of `2007-caleo-cajal-dendritic-wiring.py` (Slot 058) after the remediation of the single open v2 item
# in the instrumented loop `morphoeval/runs/2026-10-19-cajal-dendritic-wiring-loop-pass3`, superseding
# `2026-10-19-cajal-dendritic-wiring-audit-v2` (93.8).
#   - Primary assessor: Claude Fable 5.1 (MorphoEval Autonomous Loop Slot 058 Pass 3, Phase B subagent)
#
# What Pass 3 changed (the one v2 remediation item, closed with a deliberately reduced model — Section 2b, L315-L712):
#   1. Rall DC length constant lambda_DC = sqrt(R_m d / 4 R_i) and the Koch (1999) Eq. 2.37 AC reduction lambda_f with
#      Roth & Häusser (2001) Purkinje passive constants; every Rall-3/2 edge of every Cuntz tree gets an electrotonic
#      length X_e = l_e / lambda_f(d_e) (lambda_f / lambda_DC = 0.2487 at f_syn = 53.05 Hz).
#   2. Polsky-Mel-Schiller style protocol: the 24 Euclidean-nearest terminal-tip pairs, hotspot = LCA branch node; the two
#      alpha-synapse inputs are attenuated by exp(-X) to the hotspot and drive a vectorised forward-Euler Morris-Lecar
#      (1981) Ca2+/K+ membrane with ablation switches (g_Ca = 0; frozen K+ gate = strictly linear RC).
#   3. Inter-input delay sweep dt in [0, 30] ms (13 points) over all 8 Cuntz bf trees: coincidence window dt_c, supralinear
#      gain (4.28x at bf = 0.20 vs exact linear 2.000000), same-branch fraction (1.00 at bf <= 0.2 -> 0.00 at bf = 1),
#      Pearson r(window, bf) = -0.698 (p = 0.054).
#   4. New 4-panel figure `docs/media/cajal_dendritic_wiring_ca_spike_coincidence.png`; 6 new measurements (15 total);
#      self-test suites 9-10 (10/10 PASS, 8.9 s); Lean 4 Theorems 4-5 (`rall_passive_membrane_linear_superposition`,
#      `koch_ac_length_constant_bound`; 0 sorrys); SHA-256-pinned `electrotonic_ca_spike_reference.json`; 5 new BibTeX entries.
#
# Scores below: overall 92.2, DOWN from 93.8. The remediation itself is credited (model-fidelity, code-traceability and
# repro-package hold or rise), but auditing the new layer exposed defects the v2 audit had not penalised: the specimen
# "reference" values (D_f = 1.7817, Sholl peak = 73, hubs = 62) are the script's own outputs copied into the reference JSON
# (match by construction), the Cuntz Pareto benchmark arrays carry no digitisation provenance, and all five Pass 3 sources
# plus the Purkinje passive constants were transcribed offline and not re-verified (stated honestly in the JSON note).
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the files in the working tree at checkpoint 45670cb8 (+ uncommitted Pass 3 edits, 1483-line script).

