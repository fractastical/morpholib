simulations:
  - id: bressloff-v1-form-constants
    name: "Bressloff et al. (2001/2002) V1 Euclidean Symmetry-Breaking & Klüver Form Constants"
    organism: "Homo sapiens primary visual cortex (V1) — geometric visual hallucinations (Klüver form constants) and flicker phosphenes"
    script: 2001-bressloff-v1-form-constants.py
    output: bressloff_v1_form_constants_morphospace.png
    also:
      - docs/media/bressloff_v1_form_constants.gif
      - bressloff_v1_metrics.csv
      - datasets/bressloff/horton_hoyt_1991_magnification.json
    domain: morphogenesis
    status: evaluated
    source_refs: [bressloff2001, bressloff2002, ermentrout1979, rule2011, horton1991, tamekue2024, kluver1966, matthews2000, mesmerprism_v1sim]
    supersedes_audit_id: 2026-10-19-bressloff-audit-v3
    claim_boundary:
      reported_in_source:
        - "Bressloff et al. (2001, 2002): a Euclidean shift-twist symmetric neural field on the orientation-hypercolumn lattice of V1 undergoes a Turing-type instability whose even/odd, contoured (m=1) / non-contoured (m=0) planforms, pulled back through the retino-cortical map (2001 Section 2: x=(alpha/eps)ln(1+eps r/w0), y=beta theta/eps; 2002 Eq. 1.1: y=beta r theta/(w0+eps r)), give Klüver's four form constants; cubic amplitude equations (2001 Eqs. 5.9-5.15) with coefficients built from the firing-rate derivatives sigma_2, sigma_3 and a quadratic-feedback term select rolls, rhombi, squares or hexagons; the 2002 paper states a foveal magnification of 11.5 mm/deg, 30-36 perceived stripes and a cortical wavelength of 2.4-3.2 mm"
        - "Ermentrout & Cowan (1979): cortical rolls map to tunnels, funnels and spirals under the log-polar retino-cortical map (the non-contoured limit)"
        - "Horton & Hoyt (1991): human V1 linear cortical magnification follows M(E) = 17.3/(E + 0.75) mm/deg"
        - "Rule, Stoffregen & Ermentrout (2011): periodic flicker drives 1:1 (stripe) and 2:1 period-doubling (hexagon) Floquet resonance tongues over forcing period and wave number"
        - "Tamekue, Prandi & Chitour (2024): a Gaussian-only (no Mexican-hat) lateral kernel produces no MacKay-type pattern, used here as the negative control"
      reconstructed_in_script:
        - "Perturbative Fourier-Bessel even/odd dispersion scans with exact parity to the upstream fixture (5 stability_reports, 24 preset runs, all 133 paper-expectation checks counted, 121 pass) kept as branch_selection_upstream; PLUS the exact Hermitian orientation-space operator on e^{2 i m phi}, |m| <= 8, diagonalised directly (top eigenvalue within 3e-4 of the perturbative scan, dq* = 0) whose dominant harmonic derives the contoured/non-contoured regime (switch at local inhibition A_loc ~ 0.24-0.25 where W0 = W1); fixture presets that impose a non-critical harmonic or parity are flagged (imposed_harmonic, parity_imposed_subcritical)"
        - "Full cubic amplitude coefficients gamma(theta) = [3 s3 Gamma_3 - 2 s2^2 Q]/N with sigmoid derivative weights s2 = (1-2 sigma0)/2, s3 = (6 sigma0(1-sigma0)-1)/6 and the quadratic feedback Q through the resolvent (lambda_c - W_K)^-1 W_K at K = 0 and K = k_i +/- k_j (critical direction removed); eta = 2 s2 Gamma_2 / N with the eta-aware thresholds Lambda_r < Lambda_h; roll stability tested against every perturbation direction theta on a 5-degree grid, squares/rhombi against all external directions; at sigma0 = 1/2 the coefficients reduce to the upstream bare overlaps (gamma(60)/gamma(0) 0.4864 vs 0.4870); a feedback_fraction > 1 flag (near_resonant) and a gamma(0) <= 0 flag (subcritical) mark where the cubic truncation is unreliable; a regime map over A_loc x sigma0 (260 cells) and sweeps over lateral width, lateral inhibition, lateral spread, local inhibition and sigma0"
        - "Gallery of five planforms rendered at each branch's own q* with k_x and k_y quantised to integer torus cycles: derived non-contoured tunnel and spiral (SELECTED: rolls stable with min 2 gamma/gamma0 - 1 = +0.92), contoured cobweb (IMPOSED-unstable), honeycomb (STABLE-coexisting) and the selected rhombic lattice; contoured planforms use the signed envelope with the exact eigenfunction u(phi) and an orientation field drawn as line elements in cortex and, via the tangent map phi_R = phi + theta_R, in the visual field"
        - "Retinal pullback through the conformal complex-log angular coordinate by default (cortical torus closes exactly: seam 0.00, spiral chirality 0.89 with the LR/UD reflection metric) with the exact 2002 coordinate retained (--retinal-map exact) and its seams quantified on all four half-meridians under full-field, chiral-mirror and bilateral-mirror conventions; retinal morphometrics (ring counts fovea to 90 degrees on the model map and the Horton-Hoyt map, spoke count, cortical roll angle vs visual log-spiral angle)"
        - "A paper_scale_tunnel preset (lateral widths / 3.3, q scan to 6): q* = 4.84, lambda_c = 2.60 mm (paper 2.4-3.2), 29 rings fovea to 90 degrees on the alpha = 3/pi map vs 32 on the Horton-Hoyt map (paper 30-36); comparison of the map's magnification with Horton & Hoyt (1991) (RMS 6.8%) and with the 2002 paper's own scale anchors; a Gaussian-only negative control cross-referenced to the vendored registry; and a diagnostic overlay of the Rule (2011) tongue boundaries (16 curves over 5 forcing amplitudes) with its calibration status printed"
      transfer_boundary:
        - "Numerical parity to 2.2e-16 is with the MesmerPrism/bressloff-v1-form-constants Rust implementation's stability_reports and runs, not with digitised figures of the 2001 paper; alpha = 3/pi and beta = 1.589/2 are the upstream params.rs values; the parity presets' rendered wavelength 8.7 mm is 3.1x the paper's and the paper-scale preset is a repo-added parameter choice (lateral widths / 3.3) that reaches the paper's wavelength but not the paper's parameter values"
        - "The quadratic-feedback term is evaluated through the linear resolvent of the same flat-dispersion operator, whose uniform K = 0 mode is nearly marginal; for sigma0 != 1/2 the feedback dominates the bare cubic term (resolvent gain 50-2000) and the script flags these cells near_resonant instead of reporting a selection (178 of 260 regime-map cells are subcritical or feedback-dominated) — a mean-mode-coupled amplitude equation (Matthews & Cox 2000) would be needed there"
        - "In the contoured (m = 1) regime rolls and squares are unstable for every sigma0 and the cobweb remains an imposed lattice; the non-contoured regime in which tunnels and spirals are SELECTED is reached by lowering the local inhibition to A_loc = 0.15 (a repo-added preset), not by the fixture's parameters"
        - "The conformal angular map removes the pullback seam by construction (the torus closes exactly); the exact 2002 map's seams (left meridian 11.0 full-field; vertical meridians 10.3 chiral-mirror) are quantified, not fixed, because that map cannot close the torus at finite r"
      does_not_claim:
        - "Fifth-order (quintic) resolution of the odd-branch hexagon/triangle degeneracy or of the subcritical sigma0 <= 0.25 cases (Bressloff 2001 Section 5), a mean-mode-coupled amplitude equation for the near-resonant K = 0 mode, a Floquet solver or validated reproduction of Rule (2011) Fig. 8 (the vendored fixture is marked diagnostic-only upstream and the script says so), a derivation of the paper's parameter values from first principles, or a comparison with subject drawings of hallucinations"
    summary: >-
      The script is a serious, well-instrumented implementation of the Bressloff et al. (2001/2002) orientation-
      hypercolumn model: the local/lateral Fourier-Bessel harmonics, the perturbative even/odd dispersion curves, the
      exact diagonalisation of the orientation operator (which genuinely derives the m=0 non-contoured vs m=1
      contoured regime for the auto presets), the sigmoid-expansion weights, the eta-aware hexagon/roll thresholds and
      the two-regime log-polar map all check out against the papers as I know them, and the retinal pullbacks of the
      tunnel and the chiral, seamless spiral are convincing. Its weak points are structural rather than cosmetic: the
      "full cubic" quadratic-feedback path is a reconstruction that is unusable (subcritical / near-resonant) at every
      sigma0 != 1/2 in the very regime the gallery renders, the badged honeycomb is actually drawn with wavevectors at
      +-114.6 deg because of torus quantisation, the 1e-15 parity is with a Rust port rather than with any digitised
      paper figure, and the only empirical comparisons are the paper's own 30-36 stripe / 2.4-3.2 mm statements and
      Horton & Hoyt's magnification law, neither of which the parity presets meet (lambda_c 9.0 mm, 3.2x too long).
      Provenance (DOIs, PMIDs, SHA-256 pins, lock file, 40 passing self-test checks, no RNG) is strong, but the README
      section describing the script is stale relative to this Pass-4 code.
    scores:
      model-fidelity:
        value: 74
        rationale: >-
          Verified against the papers: the local harmonics W_n = e^{-2n^2 xi^2} - A e^{-2n^2 xihat^2}, the lateral
          Fourier-Bessel harmonics (-1)^n e^{-x} I_n(x) with x = xi^2 q^2/4 and the sin(2n theta0)/(2n theta0) spread
          factor, the O(beta^2) dispersion lambda_+- = W_1 + beta(W_0 +- W_2) + ..., the 2001 Eq. 2.1 map with the
          paper's w0 = 0.087 and eps = 0.051, the sigmoid ratios s_2 = (1-2 sigma0)/2 and s_3 = (6
          sigma0(1-sigma0)-1)/6, and the standard Lambda_r = eta^2 gamma0/(2 gamma_hex - gamma0)^2 < Lambda_h
          thresholds are all correct, and the m=0/m=1 regime is read off the exact operator's top eigenvector rather
          than imposed (the fixture presets that impose it are flagged). Deductions: (a) -8 because the quadratic-
          feedback term Q and its 3 s_3 / 2 s_2^2 prefactors are "derived here for the operator as implemented", not
          pinned to Eq. 5.15, and in the derived m=0 regime the path is subcritical/near-resonant at every sigma0 !=
          1/2 (my sweep 0.3-0.7 gave roll margins of -105 to -117 and SUBCRITICAL at 4/5 points), so the new physics
          is untestable where the gallery lives; (b) -6 because the rendered hexagonal planform has wavevectors at 0,
          +-114.6 deg (n_y = 10 of 11 cycles), a 5.4 deg distortion that contradicts the "< 1 degree" docstring claim,
          so the badged 60-deg hexagon is not what is drawn; (c) -5 because the 1e-15 "parity" is with the MesmerPrism
          Rust port, no paper curve (Figs. 16-17, 37-40) is digitised and compared, and alpha, beta come from that
          port; (d) -4 because the parity presets sit 3.2x off the paper's wavelength and the paper-scale preset is an
          ad hoc 1/3.3 rescaling of the lateral widths; (e) -3 because the perturbative n=1 q* (1.491) is still what
          the CSV calls critical_q for the m=0 gallery rows that are actually rendered at q_mode = 1.404.
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [615, 695], note: "Local/lateral harmonics and perturbative dispersion match Bressloff 2001 Eqs. 3.12/4.9/4.14-16 (1D anisotropic Weber integral, spread factor, (-1)^n)."}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [825, 922], note: "Correct sigmoid expansion ratios; exact Hermitian operator and derived critical harmonic (m=0 vs m=1) from exact_dispersion_scan."}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [947, 1008], note: "Quadratic feedback Q through resolvent R_K; feedback_fraction/near_resonant flags — reconstruction, not transcribed from Eq. 5.15."}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [1603, 1616], note: "k_y quantisation moves the hex modes from +-120 to +-114.6 deg at 11 cycles, contradicting the '<1 degree' claim at line 1570."}
      specimen-match:
        value: 66
        rationale: >-
          Side by side with Kluever's families as drawn in Bressloff 2001 Fig. 1 / Ermentrout & Cowan 1979, column I
          is a clean concentric tunnel and column II a continuous, handed log-spiral (chirality 0.89, seam 0.00 on the
          conformal map — I checked the PNG at full resolution and found no meridian discontinuity), and the badges
          (SELECTED/IMPOSED/STABLE) agree with the printed roll margins (+0.92, -0.34) and with the cubic numbers in
          the CSV. Deductions: (a) -10 because the contoured honeycomb (IV) and rhombic (V) panels in the PNG are
          sparse fields of bright blobs with white line elements that are hard to recognise as a honeycomb and hard to
          tell apart from each other; the GIF's envelope rendering of the same presets is far more honeycomb-like, so
          the contoured visualisation, not the model, is what fails here; (b) -8 because the "honeycomb" is a
          65/115-degree lattice after quantisation, not a hexagonal one, so it is not the Fig. 35 planform it is
          labelled as; (c) -8 because the gallery shows ~5.8 rings in the central 40 deg (lambda_c 9.0 mm) where the
          paper and subjects report 30-36 stripes over the field, so the density of the forms is off by ~3x and only
          the small Panel D inset renders a paper-scale tunnel; (d) -8 because no actual specimen image
          (Kluever/Siegel drawings, Bressloff Fig. 1, Rule phosphene photos) is placed beside the output; the match is
          to the family labels, judged by the viewer.
        evidence:
          - {file: bressloff_v1_form_constants_morphospace.png, lines: [0, 0], note: "Cols I-II: tunnel rings and seamless chiral spiral convincing; cols IV-V: sparse blob fields with line segments, weakly distinct from each other."}
          - {file: docs/media/bressloff_v1_form_constants.gif, lines: [0, 0], note: "Envelope-only frames 3/5 and 4/5 read clearly as cobweb and honeycomb; badges carried per frame."}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [1640, 1659], note: "Contoured rendering = tanh(sharpness * max_phi a); produces lambda/2 envelope and the blob-like look of panels III-V."}
          - {file: bressloff_v1_metrics.csv, lines: [0, 0], note: "kluver rows: chirality 0.892 / seam 0.000 for the spiral; rings_analytic 5.76 in 1-40 deg for every gallery preset."}
      parameter-expressivity:
        value: 62
        rationale: >-
          A morphospace parameter does control form: my --sweep local_inhibition run (0.05-0.6) moves the critical
          harmonic from m=0 to m=1 and the unrestricted selection through roll -> square -> hexagonal -> rhombic with
          a monotonically falling roll margin, and the lateral sweeps move q* monotonically (xihat_lat: 1.46 -> 0.70)
          and flip parity at theta0 = 45 and 90 deg, all shown in Panels F/G and the CSV. Deductions: (a) -14 because
          the sigma0 axis, the only new physical parameter of the full-cubic path, is unusable in the gallery's m=0
          regime (near-resonant/subcritical at every value except 0.5 in my sweep; 178/260 regime-map cells greyed),
          so it does not visibly control anything; (b) -10 because the sweeps never render a planform, so the form
          change is shown only as colour codes and family strings, not as images; (c) -8 because three of the five
          gallery forms (cobweb, honeycomb, rhombic) still come from the preset's pattern string and pattern_angle_deg
          rather than from a swept parameter, and the spiral pitch is a rendering input; (d) -6 because --preset does
          not change what the figure renders (it only seeds --sweep), contrary to the README.
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [2212, 2222], note: "Eight sweepable couplings including local_inhibition (regime) and sigmoid_baseline (feedback)."}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [2225, 2254], note: "regime_map over A_loc x sigma0 records family, harmonic, subcritical and near_resonant per cell."}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [3780, 3781], note: "--preset is documented as 'Base paper preset for --sweep' only; the gallery presets are hard-coded at lines 2367-2373."}
          - {file: bressloff_v1_metrics.csv, lines: [0, 0], note: "parameter_sweep rows: local_inhibition families hexagonal/rhombic/roll/square; sigmoid_baseline q* constant 1.491 with no reliable form change."}
      morphometric-validation:
        value: 58
        rationale: >-
          Quantities are computed on the output and compared with numbers from the literature: ring counts fovea -> 90
          deg versus the paper's 30-36 perceived stripes, lambda_c versus 2.4-3.2 mm, foveal magnification versus 11.5
          mm/deg, the map's M(E) versus Horton & Hoyt (1991) over 1-40 deg (RMS 6.8%), plus internal FFT k*, spoke
          counts, spiral pitch, chirality and seam metrics, and the disagreements are printed rather than tuned away.
          Deductions: (a) -14 because the reference values are the paper's own summary statements and a magnification
          law, not measurements on hallucination/phosphene specimens (no Kluever/Siegel spiral pitch, no ring-spacing
          data, nothing from Rule 2011's psychophysics is compared to a model-derived quantity); (b) -10 because the
          gallery presets fail the one perceptual criterion they are compared to (9.0 vs 2.4-3.2 mm; 8.4 rings vs
          30-36) and only the ad hoc paper-scale preset reaches it, and only on the Horton & Hoyt map (32.2) not on
          the model's own map (29.0); (c) -8 because the honeycomb/cobweb/rhombic panels have no morphometric compared
          to anything (cell size, spoke count 0.0 reported but unreferenced); (d) -5 because spiral pitch is validated
          against the requested angle (self-consistency), and the H&H comparison hides a 30% max error and E2 = 1.71
          vs 0.75 deg behind the RMS figure; (e) -5 because the Floquet panel reports only the fixture's RMS, no
          quantity of this model.
        evidence:
          - {file: 2001-bressloff-v1-form-constants.py, lines: [1791, 1878], note: "retinal_morphometrics: rings 0-90 on model and H&H maps vs 30-36, spokes, spiral pitch, visual spiral angle."}
          - {file: 2001-bressloff-v1-form-constants.py, lines: [235, 306], note: "compare_cortical_magnification (H&H 1991) and compare_paper_scale_anchors (2002 section 1.1 statements)."}
          - {file: bressloff_v1_metrics.csv, lines: [0, 0], note: "retinal_morphometrics rows: 8.4/9.3 rings (gallery, out of range) vs 29.0/32.2 (paper_scale_tunnel); magnification_anchor max rel err 0.30."}
          - {file: datasets/bressloff/horton_hoyt_1991_magnification.json, lines: [1, 15], note: "Only empirical anchor file: A = 17.3 mm/deg, E2 = 0.75 deg, with DOI/PMID."}
      source-traceability:
        value: 84
        rationale: >-
          All eight sources carry DOIs (and PMIDs where they exist) in the docstring, the dataset README and the .bib
          file; the upstream repository is named with commit 344863a1 and MIT licence; all four fixtures are
