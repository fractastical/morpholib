    remediation:
    - >-
      2001-bressloff-v1-form-constants.py:1603-1616 (claim at 1568-1572): k_y quantisation to integer torus cycles
      turns the fig35_hex_zero_even wavevectors into (0, +-114.62 deg) with n_y = 10 of 11 cycles — a 5.4 deg
      distortion, not '< 1 degree' — so the panel badged 'STABLE, coexists' as a 60-deg hexagon renders a 65/115-deg
      lattice; pick n or the cycle count so 11*sin(60) is near-integer, or quantise |k| and angle jointly and print
      the realised angles on the panel.
    - >-
      2001-bressloff-v1-form-constants.py:3202-3203: the ledger line is hard-coded to say '=> 2k harmonic of tanh o
      max' while the values it prints for the hex panel (power at k/sqrt3k/2k = 0.97/1.00/0.17) show the sqrt(3)k
      difference ring dominating; derive the label from argmax of the three powers (the self-test at 3697-3702 already
      accepts either).
    - >-
      2001-bressloff-v1-form-constants.py:947-1008 with 2221/2478: in the derived m=0 regime the full-cubic path is
      subcritical and near-resonant at every sigma0 != 0.5 (my `--sweep sigmoid_baseline:0.3:0.7:5 --preset
      roll_noncontoured_derived` gave roll margins -105..-117 and 'hexagonal SUBCRITICAL' at 4/5 points; resonance_gap
      0.019), so the sigma0 parameter and the quadratic-feedback machinery contribute nothing testable where the
      gallery lives; either implement the Matthews-Cox mean-mode coupling or restrict the sigma0 sweep/regime map to
      the reliable window and state that in Panel B/G titles.
    - >-
      2001-bressloff-v1-form-constants.py:2642 (and 1457): the kluver_form_constant CSV rows write stab['critical_q']
      = 1.491139 (the perturbative n=1-anchored scan) under the column 'critical_q' for the two m=0 panels that are
      rendered at q_mode = 1.403797; write q_mode (or add a column) so the CSV's q* matches the rendered wavelength
      8.95 mm.
    - >-
      README.md:433-441: the author's section is stale relative to Pass 4 — it says `--preset ID` 'select[s] what is
      rendered' (it only seeds `--sweep`, script 3780/3819), lists `--hemifield-mode {full-field,bilateral-mirror}`
      (chiral-mirror missing), claims '27 checks in ~12 s' (40 checks, 75 s here), badges tunnel/spiral/cobweb as
      IMPOSED (now SELECTED/SELECTED/IMPOSED) and quotes lambda_c 8.7 mm for the gallery (now 9.0 mm for the derived
      presets).
    - >-
      2001-bressloff-v1-form-constants.py:796-817 and 988-992: the quadratic-feedback coefficient gamma = [3 s3 Gamma3
      - 2 s2^2 Q]/N with Q = <u0^2 R_0[u_th^2]> + <u0 u_th (R_+ + R_-)[u0 u_th]> is introduced as 'derived here for
      the operator as implemented'; no equation number of Bressloff 2001 section 5 is cited for the prefactors or for
      the K = 0 / K = k_i +- k_j decomposition, and no digitised Fig. 37-40 value is compared — add the paper's
      expression (or an appendix derivation) and at least one numeric check against the published coefficient curves
      rather than only against the Rust port.
    - >-
      2001-bressloff-v1-form-constants.py:1280-1283: with eta = 0 at sigma0 = 1/2 the honeycomb's 'STABLE, coexists'
      badge rests on d_h/gamma0 = 2*gamma(60)/gamma0 - 1 = -0.0083, i.e. a 0.8% margin from the exactly-marginal pure-
      cos(2 phi) value 1/2, on a 5-deg theta grid with 720 phi samples and interpolated shifts; print the margin on
      the badge and test its sensitivity to ORIENT_SAMPLES/ORIENT_HARMONICS before calling the hexagon stable.
    - >-
      2001-bressloff-v1-form-constants.py:2429: comment reads 'lateral widths /3.1 so q* ~ 4.5 and lambda_c ~ 2.8 mm'
      but the paper_scale_tunnel preset (588-592) divides by 3.3 and yields q* = 4.84, lambda_c = 2.60 mm; align the
      comment with the preset.
    - >-
      [second assessor, gemini-4-argon] 2001-bressloff-v1-form-constants.py:855 — `exact_orientation_modes` computes
      the dominant harmonic via `dom = int(abs(_HARM_M[int(np.argmax(np.abs(v)))]))` on complex exponential
      coefficients `e^{2im*phi}` instead of combining conjugate pairs into the real harmonic L2 norm `sqrt(|v_+m|^2 +
      |v_-m|^2) = sqrt(2)*|v_m|` for `m >= 1`; this biases the m=0 vs m=1 classification by sqrt(2), misclassifies
      modes with up to 66.7% m=1 power (e.g. A_loc=0.24-0.25) as `harmonic=0`, shifts the reported full-operator
      harmonic flip to `A_loc=0.275` (`bressloff_v1_metrics.csv:47`), and leaves `exact_curves['even_1']` as `NaN` at
      118/128 wavenumbers at `A_loc=0.24`.
    - >-
      [second assessor, gemini-4-argon] 2001-bressloff-v1-form-constants.py:926-937 — `resolvent_apply` projects out
      the critical eigenspace only when `abs(lam_c - vals[i]) < 1.0e-6 * max(abs(lam_c), 1e-12)`, which removes the
      `|k_1 - k_2| = q*` triad resonance at `theta = 60 deg` (`Q(60 deg) = 0.3170`) but leaves an unprojected near-
      resonant pole on the critical branch at adjacent grid angles `theta = 55 deg` (`Q = 0.6991`) and `theta = 65
      deg` (`Q = 0.8307`), creating artificial spikes in Panel B for `sigma0 != 0.5` and shifting
