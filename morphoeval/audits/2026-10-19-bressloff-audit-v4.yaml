# MorphoEval audit — Bressloff et al. (2001/2002) V1 Euclidean Symmetry-Breaking & Klüver Form Constants, 2026-10-19 (v4)
#
# Pass 4 re-score of `2001-bressloff-v1-form-constants.py` and `datasets/bressloff/` after the STRUCTURAL rebuild
# in the instrumented loop `morphoeval/runs/2026-10-19-bressloff-v1-loop-pass4`, superseding
# `2026-10-19-bressloff-audit-v3` (67.7 primary / 80.9 second assessor). Same protocol as Passes 1-3:
#   - Primary assessor: Claude Fable 5.1 (fresh subagent 6a280e8e-1405-4409-9d3b-f69b881c4250)
#   - Independent blinded second assessor: Gemini 4 Argon (subagent c41911b9-7fe2-4c62-a885-6216af5ebad2),
#     published separately as `2026-10-19-bressloff-second-assessor-audit-v4.yaml` (role: second_assessor).
# Both ran in parallel against commit 2aac102 with no access to each other's work, to the earlier audits,
# KG or run files, or to git history.
#
# What Pass 4 changed (the structural items left open by v3):
#   1. Full cubic coefficients of Bressloff 2001 Eq. 5.15: gamma(theta) = [3 s3 Gamma_3 - 2 s2^2 Q]/N with sigmoid
#      firing-rate derivative weights at baseline sigma0 and the quadratic feedback Q through the linear resolvent;
#      eta-aware Lambda_r < Lambda_h thresholds; sigma0 = 1/2 reduces to the upstream bare overlaps (parity kept).
#   2. Roll stability tested against every perturbation direction theta (5-degree grid), squares/rhombi against all
#      external directions; a near_resonant (feedback-dominated) and subcritical flag mark unreliable cells.
#   3. Exact orientation-space operator diagonalised; its dominant harmonic DERIVES contoured (m=1) vs
#      non-contoured (m=0) instead of a preset flag; switch at A_loc ~ 0.24-0.25; fixture presets that impose a
#      non-critical harmonic/parity are flagged. Derived non-contoured regime: rolls stable and SELECTED, so the
#      gallery tunnel and spiral are now selected planforms (3 SELECTED / 1 STABLE / 1 IMPOSED of 5).
#   4. Conformal complex-log angular map (2001 Section 2) as the default retinal pullback: torus closes exactly, seam
#      0.00, spiral chirality 0.89 (LR+UD reflection metric); exact 2002 map kept with finite seam metric on all four
#      half-meridians; k_x and k_y quantised to torus cycles.
#   5. paper_scale_tunnel preset (q scan to 6): lambda_c = 2.60 mm in the paper's 2.4-3.2 mm; 29 rings fovea-90 deg
#      on the alpha = 3/pi map vs 32 on the Horton-Hoyt map (paper 30-36) — residual shortfall attributed to alpha.
#   6. Regime map A_loc x sigma0 (Panel G), local-inhibition and sigma0 sweeps that change the selected family,
#      retinal morphometrics, signed contour envelope with the exact u(phi); self-test 27 -> 41 checks;
#      measure_bressloff 13 -> 19 measurements.
#
# Scores below are the primary assessor's: overall 70.6 (impl. 70.0, bio. 63.0, repro. 81.3), from 67.7.
# The second assessor scored 85.2 (impl. 83.3, bio. 81.5, repro. 91.9), from 80.9; panel mean 77.9.
# Remaining findings (both assessors) are listed under `remediation`.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not
# calibrated probabilities). Line numbers refer to the files at commit 2aac102.

