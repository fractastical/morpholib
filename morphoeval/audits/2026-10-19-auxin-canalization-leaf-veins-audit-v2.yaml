simulations:
  - id: mitchison-canalization-auxin-flux
    name: "Mitchison (1980, 1981) & Feugier, Mochizuki & Iwasa (2005) with-the-flux auxin canalization, Sachs wound bypass regeneration, and open vs closed leaf venation loops"
    organism: "Pisum sativum & Arabidopsis thaliana (dicot leaf lamina & stem vascular strands)"
    script: 1997-mitchison-canalization-auxin-flux.py
    output: docs/media/auxin_canalization_leaf_veins_comparison.png
    extra_outputs:
      - docs/media/auxin_canalization_leaf_veins_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Mitchison (1980) Proc. R. Soc. B 207:79-109 facilitated diffusion canalization ODEs dD_ij/dt = alpha*|phi_ij|^p + beta - gamma*D_ij proving that linear feedback (p <= 1) yields diffuse flow whereas quadratic feedback (p = 2) triggers winner-take-all symmetry breaking into 1-cell-wide vascular strands where concentration drops inside the canalized vein (S_vein < S_parenchyma)"
        - "Mitchison (1981) Phil. Trans. R. Soc. B 295:461-471 & Sachs (1981) Adv. Bot. Res. 9:151-262 polar auxin transport canalization and C-shaped vascular strand bypass regeneration around a transverse stem incision"
        - "Feugier, Mochizuki & Iwasa (2005) J. Theor. Biol. 236:366-375 PIN1 carrier-allocation dynamics comparing open hierarchical branching venation trees against closed-areole reticulate venation loops"
      reconstructed_in_script:
        - "5-regime feedback exponent sweep p in [0.5, 2.5] and 2D cellular lamina canalization solver verifying diffuse flow at p <= 1.0 (winner flux share 0.5000) vs 1-cell-wide canalized strands at p = 2.0 (winner flux share 0.9950, Pearson r = 1.0000, p = 1.48e-9) and auxin concentration drainage inside the vein (S_vein / S_par = 0.3131 < 1.0)"
        - "Sachs (1981) 20x16 cellular epicotyl transverse stem incision wound-bypass simulator reproducing C-shaped lateral deflection (4.0 cells, tortuosity L/L0 = 1.3800, sink flux recovery 0.9852) plus NPA polar auxin transport inhibitor negative control (flux recovery 0.0804)"
        - "Feugier et al. (2005) PIN1 carrier-allocated venation topology solver verifying pairwise flux conservation (antisymmetry error < 1e-14) and topological transition from open branching trees (Betti-1 = 0 loops, branch angle 52.0 deg) to closed-areole reticulate networks (Betti-1 = 14 loops, branch angle 56.5 deg)"
        - "Automated segmentation of the cleared dicot leaf venation skeleton (`leaf_venation_canalization_specimen.jpg`, primary midrib tracking, secondary vein branching angle 52.93 +- 2.53 deg, and 1843 enclosed polygonal areoles)"
      transfer_boundary:
        - "2D cellular lamina canalization and graph cycle-rank topology mapped to cleared dicot leaf venation skeleton"
      does_not_claim:
        - "3D mechanical leaf blade expansion coupled to viscoelastic turgor-driven epidermal remodeling"
    source_refs:
      - mitchison1980
      - mitchison1981
      - feugier2005
      - sachs1981
      - rollandlagan2005
    summary: >-
      Pass 2 (v2) evaluation of `1997-mitchison-canalization-auxin-flux.py` (overall
      weighted score: 92.8/100, up from 54.5/100 in v1). The remediated script solves
      the Mitchison (1980) canalization bifurcation across feedback exponents p in
      [0.5, 2.5] (winner flux share 0.5000 at p=1.0 vs 0.9950 at p=2.0; Pearson r = 1.0000,
      p = 1.48e-9) and 2D cellular lamina concentration drainage (S_vein / S_par = 0.3131
      vs ref 0.3100, proving S_vein < S_parenchyma); reproduces Sachs (1981) C-shaped
      vascular bypass regeneration around a transverse stem incision (tortuosity 1.3800,
      sink flux recovery 0.9852 vs 0.0804 under NPA transport inhibition); models the
      Feugier et al. (2005) topological transition between open venation trees (Betti-1 = 0)
      and closed-areole networks (Betti-1 = 14); and segments the SHA-256-locked cleared
      dicot leaf venation specimen (`leaf_venation_canalization_specimen.jpg`, secondary
      branch angle 52.93 +- 2.53 deg vs ref 54.50 deg, N = 1843 closed areoles).
    scores:
      model-fidelity:
        value: 94
        rationale: >-
          Implements the Mitchison (1980) 5-exponent bifurcation solver (`simulate_mitchison_exponent_sweep`,
          L102-198), 2D cellular lamina canalization and auxin concentration drainage
          (`simulate_2d_lamina_canalization`, L201-277), Sachs (1981) transverse stem
          incision bypass and NPA inhibitor control (`simulate_sachs_wound_bypass`, L283-351),
          and Feugier et al. (2005) polar PIN1 carrier flux conservation and open-tree vs
          closed-areole venation topology (`verify_polar_flux_conservation`, `simulate_feugier_venation_topologies`,
          L357-463), backed by 3 machine-checked Lean 4 theorems in
          `morphoeval/lean/loops/Loop_034_auxin_canalization_leaf_veins.lean`.
        evidence:
          - {file: 1997-mitchison-canalization-auxin-flux.py, lines: [102, 277], note: "Mitchison (1980) feedback exponent sweep p in [0.5, 2.5] and 2D cellular lamina drainage solver proving S_vein < S_parenchyma", supports: true}
          - {file: 1997-mitchison-canalization-auxin-flux.py, lines: [283, 463], note: "Sachs (1981) stem wound bypass + NPA control and Feugier et al. (2005) open-tree vs closed-areole venation topology", supports: true}
          - {file: morphoeval/lean/loops/Loop_034_auxin_canalization_leaf_veins.lean, lines: [13, 106], note: "3 machine-checked Lean 4 theorems for linear vs quadratic symmetry breaking, vein concentration drainage, and polar flux conservation (0 sorrys)", supports: true}
