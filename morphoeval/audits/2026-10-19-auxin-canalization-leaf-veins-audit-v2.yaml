          - {file: docs/media/auxin_canalization_leaf_veins_comparison.png, lines: [0, 0], note: "6-panel synthesis figure comparing lamina drainage, pitchfork bifurcation, Sachs wound bypass, Feugier open/closed venation, and specimen segmentation", supports: true}
