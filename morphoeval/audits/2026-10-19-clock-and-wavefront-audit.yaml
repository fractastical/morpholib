simulations:
  - id: cooke-clock-and-wavefront
    name: "Cooke & Zeeman (1976) clock-and-wavefront somite segmentation"
    organism: "Xenopus laevis & Gallus gallus vertebrate paraxial mesoderm somites"
    script: 1976-cooke-clock-and-wavefront.py
    output: docs/media/clock_and_wavefront_comparison.png
    extra_outputs:
      - docs/media/clock_and_wavefront_growth.gif
    status: evaluated
    source_refs:
      - cooke1976
      - cooke1975
      - palmeirim1997
      - goldbeter2007
    summary: >-
      Pass 1 baseline assessment of `1976-cooke-clock-and-wavefront.py` (58.4/100). The
      initial kinematics capture S = v * T_c and basic 1D wavefront progression, but
      require scale-invariant wavefront width sigma_w proportional to L_mm to guarantee
      exact N_mini = N_norm = 40 somite invariance across surgically reduced miniature
      embryos, full bilateral DoG somite dome segmentation against the vendored SEM
      specimen (`somite_embryo_specimen.jpg`), and explicit clock-arrested (A_c = 0)
      plus unscaled-wavefront (v = v_0) negative controls.
    scores:
      model-fidelity:
        value: 62
        rationale: >-
          Implements Cooke & Zeeman's (1976) kinematic wavelength law S = v * T_c and
          Thom-Zeeman cusp catastrophe ODE dchi/dt = -(chi^3 - a(x,t)*chi - b_osc(x,t))/tau_chi
          (L145-235), but fixed spatial phase gradient k_phi and unscaled wavefront width
          sigma_w introduce a 1-somite boundary discrepancy (N=39 vs 40) between normal
          and miniature embryos.
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [88, 108], note: "Analytical somite wavelength S = v * T_c and count N = L / (v * T_c)", supports: true}
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [145, 235], note: "Cusp catastrophe clock-wavefront solver requiring proportional sigma_w scaling", supports: false}
      specimen-match:
        value: 52
        rationale: >-
          Vendors `datasets/clock_and_wavefront/somite_embryo_specimen.jpg` (CC BY 4.0
          dorsal SEM of vertebrate neural tube and bilateral somites), but Pass 1 lacks
          automated bilateral DoG peak/cleft extraction and phase-aligned waveform
          correlation against the simulated cusp somite profile.
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [248, 315], note: "Specimen segmentation routine on somite_embryo_specimen.jpg", supports: false}
          - {file: docs/media/clock_and_wavefront_comparison.png, lines: [0, 0], note: "Comparison figure with dorsal SEM somite overlay", supports: true}
      parameter-expressivity:
        value: 58
        rationale: >-
          Covers normal (L=4.0 mm) and miniature (L=2.4 mm) embryos, but needs a full
          5-regime Cooke (1975) parameter sweep across (L, v, T_c) plus an explicit
          clock-arrested (A_clock=0) and unscaled-wavefront (v=v_0) ablation comparison.
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [115, 142], note: "Size regulation regime evaluator", supports: false}
      morphometric-validation:
        value: 54
        rationale: >-
          Measures simulated somite spacing S_sim, but Pass 1 requires full 5-regime
          Pearson correlation r and RMSE against Cooke (1975) Table 1 plus bilateral
          specimen spacing CV and symmetry ratio.
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [322, 395], note: "MorphoEval measurement hook measure_morphoeval()", supports: false}
      source-traceability:
        value: 66
        rationale: >-
          Vendors `scout_manifest.json`, `clock_and_wavefront_reference.json`,
          `paper_citations.bib`, and `somite_embryo_specimen.jpg` with SHA-256 digests,
          linking Cooke & Zeeman (1976) and Cooke (1975).
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [58, 84], note: "SHA-256 cryptographic verification of vendored dataset files", supports: true}
      code-traceability:
        value: 60
        rationale: >-
          Links functions to Cooke & Zeeman (1976) Sections 2-4 and Lean 4 theorems in
          `morphoeval/lean/loops/Loop_021_clock_and_wavefront.lean`.
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [1, 45], note: "Module docstring mapping equations to Cooke & Zeeman (1976) and Lean 4 theorems", supports: true}
      repro-package:
        value: 62
        rationale: >-
          Includes `--self-test` and deterministic seed=1976, but Pass 1 self-test caught
          the 1-somite scale-invariance boundary discrepancy prior to proportional
          wavefront-width calibration.
        evidence:
          - {file: 1976-cooke-clock-and-wavefront.py, lines: [570, 620], note: "Self-test suite with bitwise determinism and size-invariance assertions", supports: true}
    remediation:
      - "Scale wavefront transition width sigma_w proportionally to axial length L (sigma_w = 0.0045 * L) with synchronous intracellular clock phase so N_norm = N_mini = 40 holds identically with <0.2% wavelength error."
      - "Add bilateral dorsal somite row DoG peak & inter-somitic cleft segmentation on `datasets/clock_and_wavefront/somite_embryo_specimen.jpg` with phase-aligned Pearson r correlation against the cusp catastrophe spatial wave."
      - "Include both a clock-arrested negative control (A_clock = 0 -> 0 somites) and an unscaled-wavefront failure control (v = v_0 across reduced L) alongside the 5 Cooke (1975) experimental regimes."
