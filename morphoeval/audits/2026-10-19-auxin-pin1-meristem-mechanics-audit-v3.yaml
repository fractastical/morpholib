# MorphoEval audit — Hamant et al. (2008) Science & Heisler et al. (2010) PLoS Biol
# Pressurized Shell Principal Stress & Auxin-PIN1-Microtubule Coupling in Arabidopsis SAM, 2026-10-19 (v3)
#
# Pass 3 remediation-round re-score of `2008-hamant-meristem-microtubule-stress.py` (Slot 033) in the
# instrumented loop `morphoeval/runs/2026-10-19-auxin-pin1-meristem-mechanics-loop-pass3`, superseding
# `2026-10-19-auxin-pin1-meristem-mechanics-audit-v2` (92.6).
#
# What Pass 3 changed (the single v2 remediation item closed in REDUCED, honestly-labelled form):
#   1. A 3D four-sheet (L1 / L2 / L3a / L3b, 526 founder cells, 5 um epidermis) cell-centre lattice on the
#      paraboloidal SAM whose polyhedral cells are the bounded 3D Voronoi regions of the centres (Qhull),
#      with exact face areas and volumes; every shared face is a linear wall spring (L1 in-plane walls
#      5x stiffer), turgor acts on the exterior L1 faces only, rim/basal support by elastic ghost springs,
#      Jacobi-preconditioned overdamped relaxation (relative residual 0.145), per-cell Batchelor/virial
#      tension tensor (`simulate_multilayer_sam_mesh`, L513-L937).
#   2. Lockhart rest-length creep plus background growth and division at volume doubling with DYNAMIC
#      planes: L1/L2 anticlinal planes by the Louveaux et al. (2016) tension rule n_div = n_s x e_1 or the
#      Besson & Dumais (2011) Gibbs rule (beta = 20.6); L3 corpus planes by a 3D Gibbs rule over the
#      principal axes so periclinal vs anticlinal is emergent (L418-L511, L820-L905). 181 divisions in
#      80 growth steps (164 L1/L2, 17 L3).
#   3. The mesh L1 virial tension field (same-sheet e_1 and A_sigma) replaces the hand-coded
#      0.3333 (r/45)^2 dome/flank stress field of the 168-cell Auxin-PIN1-CMT ODE
#      (`simulate_cellular_sam_pin1_cmt(mesh_stress=...)`, L1041-L1066); the analytic field is an ablation.
#   4. Two new Lean 4 theorems (hamant_2008_multilayer_shell_load_sharing, Law 4;
#      louveaux_2016_anticlinal_tension_division_plane, Law 5), 0 sorrys, registered in the math KG yaml;
#      self-test 8 -> 13 checks; measure_morphoeval 9 -> 18 measurements; 4 new DOI-verified secondary
#      references (Louveaux 2016, Besson & Dumais 2011, Reddy 2004, Kutschera & Niklas 2007) with the
#      reference JSON / bib SHA-256 re-pinned; 3 new figure panels (G mesh section + specimen contour,
#      H mesh anisotropy vs membrane law + stiffness sweep, I division-plane statistics vs literature).
#
# Why the overall score goes DOWN (92.6 -> 86.9) although the remediation item was addressed: Pass 3
# exposed defects that v2 credited at 90-95, and several new comparisons FAIL and are reported as such:
#   - the 84.9 % PIN1-CMT co-alignment "match" is IMPOSED: 15.5 % of cells are drawn as switching cells with
#     a 0.62-0.92 rad offset and the rest get N(0, 0.165) jitter (L1163-L1166), so the headline metric is a
#     property of the hard-coded noise model, not of the ODE;
#   - the post-ablation circumferential fraction 0.9103 is an exponential relaxation curve with a hand-tuned
#     asymptote 0.918 (L1271-L1273), not a simulated Kirsch-field reorientation; the lateral-compression
#     S_CMT uses a 1.48 anisotropy fudge factor (L1281);
#   - the calibrated dome radius 50.0 um "match" is an identity (R_px is scaled to 50 um; L1389, L1976);
#   - the 3D mesh reproduces the circumferential maximal-tension DIRECTION on the flank (0.81) and the
#     Lean Law 4 load share (0.7144 vs 0.7143), but NOT the radial growth of the thin-shell anisotropy
#     magnitude A_sigma(r) = (1-q)/(3-q) (bin-mean Pearson r = -0.11, RMSE 0.072, apex lattice artefact
#     0.059 where 0 is expected);
#   - the tension-based division rule produces only 38 % shortest-plane divisions vs the 65-77 % measured
#     by Louveaux (binomial p = 5e-18); the geometric Gibbs rule gives 72 % but by construction; daughters
#     are 98 % symmetric vs 81 % measured; summed daughter volume / mother = 1.29 (Voronoi re-tessellation);
#   - the mesh is NOT a finite-element vertex model (no vertex DOF, no bending, no volume constraint, new
#     contacts stress-free, L653); the residual is carried as an open item;
#   - the specimen is still a single 2D Toluidine-Blue section; the mesh outer-L1 profile deviates from the
#     calibrated specimen contour by 5.5 um RMS off-apex and no division-plane statistic is specimen-derived.
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to
# the files in the working tree at commit d58a084 after the Pass 3 edits (the script is 2249 lines; the Lean
# module is 174 lines).

