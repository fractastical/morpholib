    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Hamant et al. (2008) Science 322:1650-1655 pressurized shell principal tensile stress tensor across spherical dome (sigma_theta = sigma_m = PR/2t), cylindrical flank (sigma_theta = 2*sigma_z = PR/t), and negative-Gaussian-curvature primordium boundary saddle crease, driving cortical microtubule (CMT) alignment and anisotropic Lockhart wall yielding"
        - "Heisler et al. (2010) PLoS Biol 8:e1000516 co-alignment between PIN1 auxin efflux carrier polarity and CMT orientation across L1 meristem cells (84.5% within +-30 deg) and synchronous circumferential reorientation following single-cell laser ablation"
        - "Louveaux et al. (2016) PNAS 113:E4294 shoot-apex division planes follow maximal tensile stress; 65-77% of planes are the shortest plane and 81% of divisions are symmetric (smaller daughter 40-50%); Reddy et al. (2004) L1/L2 divide anticlinally, corpus periclinally and anticlinally"
      reconstructed_in_script:
        - "Doubly-curved thin-shell Laplace-Young principal stress solver across all 4 SAM curvature zones + Fokker-Planck CMT nematic order S_CMT(A_sigma) + transverse-isotropic Lockhart cell-wall yielding"
        - "168-cell paraboloidal L1 dome coupled Auxin-PIN1-CMT ODE simulator with the L1 stress field supplied by the 3D mesh (Pass 3) or by the Pass 2 analytic field (ablation); antisymmetric active flux conservation; 137.06 deg golden-angle phyllotaxis"
        - "Pass 3: 526-cell four-sheet L1/L2/L3a/L3b 3D Voronoi cell-centre mesh with wall springs, turgor on exterior faces, Jacobi-relaxed quasi-statics, per-cell virial tension tensor, Lockhart creep, division at volume doubling with Louveaux-2016 tension or Besson-Dumais-2011 Gibbs anticlinal planes (L1/L2) and 3D Gibbs planes (L3); L1 load share vs Lean Law 4; stiffness-ratio sweep"
        - "Kirsch circular laser-ablation wound stress redistribution (rim hoop stress doubling), lateral micro-vise compression, and 20 ug/mL oryzalin negative control; the post-ablation circumferential fraction is a fitted exponential relaxation, not a simulated reorientation"
        - "Automated segmentation of the Toluidine-Blue Arabidopsis SAM histological section (539 tunica-corpus nuclei, L1 dome contour & saddle crease) and apex-registered comparison of the mesh outer-L1 profile with the calibrated specimen contour"
      transfer_boundary:
        - "Axisymmetric/saddle thin-shell stress laws, 168-cell paraboloidal L1 dome and the 3D paraboloidal cell-centre mesh mapped to a single longitudinal histological SAM section; division-plane statistics compared with literature values (Louveaux 2016, Reddy 2004), not with the specimen"
      does_not_claim:
        - "A finite-element or vertex-model mechanical solution: the 3D mesh has cell-centre degrees of freedom only, no wall bending, no cell-volume constraint, stress-free insertion of new contacts, and does not reproduce the radial growth of the thin-shell anisotropy magnitude"
        - "That the 84.9% PIN1-CMT co-alignment, the 0.91 post-ablation circumferential fraction, the lateral-compression S_CMT or the 50 um calibrated dome radius are emergent model predictions (they are imposed by hard-coded noise/fit/fudge/calibration constants, see remediation)"
    source_refs:
      - hamant2008
      - heisler2010
      - jonsson2006
      - mirabet2012
      - louveaux2016
      - besson2011
      - reddy2004
      - kutschera2007
    summary: >-
      Pass 3 (v3) evaluation of `2008-hamant-meristem-microtubule-stress.py` (overall
      weighted score 86.9/100, DOWN from 92.6 in v2). The single v2 remediation item was
      addressed in reduced form: a 526-cell four-sheet L1/L2/L3a/L3b 3D Voronoi cell-centre
      mesh with wall springs, turgor on the exterior L1 faces, Jacobi-relaxed quasi-statics
      (relative residual 0.145), Lockhart creep and 181 volume-doubling divisions with
      dynamic anticlinal (Louveaux 2016 tension rule / Besson-Dumais 2011 Gibbs rule) and
      corpus (3D Gibbs) planes; the mesh L1 virial tension field now drives the 168-cell
      Auxin-PIN1-CMT ODE. The mesh reproduces the flank circumferential e_1 direction (81 %
      hoop-aligned) and the Lean Law 4 L1 load share (0.7144 vs 0.7143 across a 1-10x
      stiffness sweep), but NOT the radial growth of the membrane-law anisotropy magnitude
      (r = -0.11, RMSE 0.072), and the tension division rule yields only 38 % shortest-plane
      divisions vs 65-77 % measured (p = 5e-18); daughter symmetry 0.98 vs 0.81. The Pass 2
      headline matches were found to be imposed: PIN1-CMT co-alignment 0.8491 via a 15.5 %
      switching-cell jitter model, post-ablation fraction 0.9103 via a fitted asymptote 0.918,
      compression S_CMT via a 1.48 factor, and the 50 um dome radius via calibration identity.
      18 measurements (9 Pass 2 with caveats + 9 Pass 3), 13/13 self-test checks, 5 Lean
      theorems (0 sorrys), 9 DOI-verified references, SHA-256-pinned dataset (re-pinned).
