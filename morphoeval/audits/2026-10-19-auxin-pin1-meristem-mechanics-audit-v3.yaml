simulations:
  - id: mirabet-auxin-pin1-meristem-mechanics
    name: "Hamant et al. (2008) & Heisler et al. (2010) pressurized SAM shell stress tensor, cortical microtubule alignment, PIN1-auxin phyllotactic mechanics, and (Pass 3) 3D multi-layered L1/L2/L3 Voronoi cell mesh with dynamic division planes"
    organism: "Arabidopsis thaliana (shoot apical meristem L1 epidermis, L2/L3 corpus & floral primordia)"
    script: 2008-hamant-meristem-microtubule-stress.py
    output: docs/media/auxin_pin1_meristem_mechanics_comparison.png
    extra_outputs:
