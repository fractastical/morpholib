simulations:
  - id: manukyan-ocellated-lizard-ca
    name: "Manukyan et al. (2017) Nature hexagonal skin-scale border thickness reduction & outer-totalistic cellular automaton — 3D skin-volume reaction-diffusion (Pass 3)"
    organism: "Ocellated / jeweled lizard (Timon lepidus) dorsal skin scale labyrinth"
    script: 2015-manukyan-ocellated-lizard-ca.py
    output: docs/media/ocellated_lizard_ca_comparison.png
    extra_outputs:
      - docs/media/ocellated_lizard_ca_growth.gif
      - docs/media/ocellated_lizard_ca_3d_volume.png
    status: evaluated
    supersedes_audit_id: 2026-10-19-ocellated-lizard-ca-audit-v2
    source_refs:
      - manukyan2017
      - kondo1995
      - fofonjka2021
      - zakany2023
      - turing1952
    claim_boundary:
      reported_in_source:
        - "Manukyan et al. (2017): skin thickness at inter-scale borders is reduced to P = h_border/h_interior ~ 0.17; a Kondo-Asai reaction-diffusion system on this geometry homogenises within scales and reduces to a hexagonal outer-totalistic cellular automaton whose adult neighbour histogram peaks at n_g = 3 (Figs. 2-4)"
        - "Fofonjka & Milinkovitch (2021): reaction-diffusion in a growing 3D skin-scale domain with thin inter-scale borders generates the discrete cellular automaton"
        - "Turing (1952): diffusion-driven instability requires tr J < 0, det J > 0, d f_u + g_v > 2 sqrt(d det J)"
      reconstructed_in_script:
        - "A genuine 3D finite-volume voxel reaction-diffusion solver on a stepped-thickness skin volume (12 interior voxels, dz = 0.2 px, h_border = round(P*12)) with zero-flux surfaces and an implicit vertical solve; its depth-averaged thin-film 2D reduction (1/h) div(h D grad u) with min(h_i, h_j) D face conductances; a leak-proof hexagonal scale geometry; Turing linear stability (d_c, k_c, lambda_c, unstable band) for the script kinetics and for the vendored canonical set; a 5-regime P sweep in 3D and 2D; insulated / equal-diffusion / continuum controls; the stochastic hexagonal outer-totalistic CA; chromatic segmentation of 182 dorsal scales on a SHA-256-pinned Timon lepidus photograph; 16 measurements and 14 self-test checks"
      transfer_boundary:
        - "The 3D domain is a stepped voxel skin on a 5 px scale pitch (border area fraction 0.36, no domain growth), not the micro-CT-derived finite-element geometry of Fofonjka & Milinkovitch (2021); the reaction kinetics (f_u = 0.50, f_v = -0.75, g_u = 0.82, g_v = -0.65, cubic 1.25) are a phenomenological Kondo-Asai-type set, not the Methods parameters of Manukyan et al. (2017)"
        - "The CA transition probabilities and adult histogram targets in ocellated_lizard_ca_reference.json carry no digitisation provenance to a specific figure/table; the 'canonical' clipped-linear parameter set in the same file is not Turing-unstable at its stated d = 20 (d_c = 23.57) and is not used by the solvers"
        - "The specimen comparison samples a fixed 13 x 14 hexagonal lattice over the dorsal ROI rather than detecting scale centres, so neighbour statistics inherit lattice-registration error"
      does_not_claim:
        - "Reproduction of the paper's exact PDE parameters, a micro-CT skin mesh, domain growth, derivation of the CA flip probabilities from the PDE time series, or a neighbour-histogram match to Manukyan Fig. 3 beyond the vendored target vectors"
    summary: >-
      Pass 3 closes the single v2 remediation item in its honest reduced form: the script now integrates the
      reaction-diffusion system in a genuine 3D voxel skin volume with thinned inter-scale borders
      (`integrate_skin_volume_pde_3d`), compares it with its depth-averaged thin-film 2D reduction
      (90.3 % scale-state agreement, RMS 0.118, vertical non-uniformity 2.2e-2 at P = 0.17), and removes
      the artificial per-scale averaging that produced the v2 result. With the physics alone, the P = 0.17
      skin volume discretises into bimodal scale states (inter/intra std ratio 14.7, Ashman D 4.88) versus
      3.29 / 4.04 for continuum skin, insulated scales (P = 0) do not pattern, equal diffusion (d = 1) is
      quenched, and the P sweep is monotone (rho = -1). Linear stability analysis exposes that the vendored
      canonical parameter set is not Turing-unstable (d_c = 23.57 > 20). Overall weighted score 83.6 / 100,
      down from 91.9: the v2 scores credited the averaging hack, a leaky border band, un-provenanced histogram
      and parameter tables and a lattice-imposed segmentation; the remaining gaps (paper kinetics, micro-CT
      geometry and growth, scale-centre detection, CA rule derived from the PDE) are listed for Pass 4.
    scores:
      model-fidelity:
        value: 82
        rationale: >-
          The code now implements the mechanism the papers describe: reaction-diffusion in a 3D skin volume whose
          thickness drops to P h_interior at scale borders (`integrate_skin_volume_pde_3d`, L739-865: voxel mask
          z < h(x,y), skin-skin face conductances, zero-flux steps, implicit Thomas vertical solve L720-736), the
          depth-averaged reduction with the correct h-weighted conductance and capacity (L616-717), a border
          definition through which all inter-scale flux passes (L450-536), and the mesoscopic premise that
          lambda_c = 5 pitches exceeds the scale so isolated scales cannot pattern (L325-443, measured: insulated
          inter std 5e-3, intra std 8e-9). The v2 averaging hack is gone and the paper's qualitative result emerges
          from the geometry alone (P = 0.17 ratio 14.7 vs continuum 3.29). Deductions: the kinetics are a
          phenomenological set, not Manukyan's Methods parameters (L326-341) (-6); the domain is a stepped voxel
          skin without growth, not the 3D geometry of Fofonjka & Milinkovitch (-5); the CA flip probabilities are
          vendored tables rather than derived from the PDE as the paper does (L276-278) (-4); the PDE neighbour
          histogram peaks at n_g = 2, not 3 (L1 to CA 0.34) (-3).
        evidence:
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [739, 865], note: "3D voxel skin-volume reaction-diffusion solver: stepped thickness mask, skin-skin face conductances, zero-flux surfaces, explicit lateral + implicit vertical (Thomas) diffusion, depth average and vertical non-uniformity", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [616, 717], note: "Depth-averaged thin-film 2D reduction (1/h) div(h D grad u) with min(h_i,h_j) D face conductance and capacity h; v2 diffusivity variant retained only for comparison; no per-scale averaging", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [325, 443], note: "Turing linear stability: Jacobian, d_c, k_c, lambda_c, unstable band; D_u chosen so lambda_c = 25 px = 5 pitches; canonical JSON set analysed", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [326, 341], note: "Script kinetics constants 0.50/-0.75/0.82/-0.65/1.25 are phenomenological (Kondo-Asai-type), not the Methods parameters of Manukyan et al. (2017)", supports: false}
          - {file: morphoeval/lean/loops/Loop_009_ocellated_lizard_ca.lean, lines: [109, 176], note: "Lean Theorems 4-5 (depth average of a uniform column; face conductance ratio = thickness ratio, insulation at h_b = 0), 0 sorrys, verified with `lean`", supports: true}
      specimen-match:
        value: 82
        rationale: >-
          Panels E-H of `docs/media/ocellated_lizard_ca_comparison.png` show the SHA-256-pinned Timon lepidus
          photograph with the dorsal ROI, the segmented 182-scale lattice (82 green / 100 black, Ashman D 2.56),
          and green/black neighbour histograms of the 3D PDE, the CA, the specimen and the vendored reference side
          by side; Panel A's depth-averaged 3D field is a labyrinth of monochromatic scales with green fraction
          0.45 that resembles the dorsal mosaic, and the new `ocellated_lizard_ca_3d_volume.png` shows the scale
          cores as islands above the thin borders. Deductions: the segmentation imposes a fixed 13 x 14 hexagonal
          lattice on the ROI (L993-1007) instead of detecting scale centres, so the specimen neighbour statistics
          (modal n_g = 3, <n_g> = 2.60) inherit registration error (-8); the 3D PDE's modal n_g is 2 whereas the
          specimen's and the CA's is 3, so the PDE pattern has thinner chains than the lizard (-5); the photograph is
          an oblique whole-animal view and the ROI is not orthorectified (-3); no side-by-side with Manukyan's own
          Fig. 2/3 panels (-2).
        evidence:
          - {file: docs/media/ocellated_lizard_ca_comparison.png, lines: [0, 0], note: "12-panel figure: A 3D depth-averaged field P=0.17 vs 1.0; E specimen + ROI; F segmented lattice N=182; G/H neighbour histograms PDE/CA/specimen/reference; I x-z voxel section; J 3D vs 2D; K growth; L dispersion", supports: true}
          - {file: docs/media/ocellated_lizard_ca_3d_volume.png, lines: [0, 0], note: "z-slices and x-z section of the 3D activator volume at P=0.17 showing 2-voxel borders below 12-voxel scale cores", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [967, 1047], note: "Specimen segmentation: DoG-normalised green index sampled on a fixed 13x14 hexagonal lattice (L993-1007), 55th-percentile threshold, Ashman D, hex neighbour statistics", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [993, 1007], note: "Scale sites are lattice positions (r+0.5)dy, (c+0.5)dx + offset, not detected scale centres", supports: false}
      parameter-expressivity:
        value: 86
        rationale: >-
          The border thickness factor P now controls scale-level discretisation monotonically in both the 3D volume
          and the 2D reduction across the five vendored regimes (3D ratio 29.9 / 14.7 / 5.7 / 3.3 for P = 0.08 /
          0.17 / 0.45 / 1.0, Spearman rho = -1.0; P = 0 insulated: no pattern), the diffusivity ratio d switches the
          Turing instability on/off (d = 1 control inter std 2e-4 vs 0.356), and the P_eff realised at voxel
          resolution is reported for every regime (`run_border_reduction_sweep`, L901-929; Panel D). CLI flags
          --P/--d/--seed drive an extra 3D run and --rows/--cols/--steps now reach the CA (L1672-1700; v2 accepted
          but ignored them). Deductions: lambda_c, nz, dz and the PDE step count are module constants, not CLI
          parameters (L135-144) (-6); the sweep is shown only as ratio/Ashman curves, with no gallery of fields along
          P (-5); P = 0.08 and 0.17 are only 1 voxel apart at nz = 12 (-3).
        evidence:
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [901, 960], note: "5-regime P sweep (3D or 2D) with P_eff, discretization ratio, Ashman D, labyrinth fraction; controls: equal diffusion, continuum P=1, insulated P=0", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [1153, 1176], note: "Panel D: 3D vs 2D discretization ratio and Ashman D vs P on a log axis with control annotations", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [1672, 1700], note: "CLI --P/--d/--seed extra 3D run; --rows/--cols/--steps wired into render_outputs", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [135, 144], note: "PDE discretization (lambda_c, nz, dz, dt, steps) are module constants not exposed on the CLI", supports: false}
      morphometric-validation:
        value: 80
        rationale: >-
          `measure_morphoeval()` (L1354-1537) returns 16 measurements with reference values and units: CA and
          specimen neighbour statistics against the vendored Fig. 3 targets, 3D discretization ratio and Ashman D,
          3D-vs-2D scale-state agreement (0.903 vs 1.0), depth-averaged RMS (0.118), vertical non-uniformity (0.022),
          voxel volume fraction vs analytic (0.700 vs 0.700), insulated and equal-diffusion controls, P-sweep
          monotonicity (rho = -1.0), lambda_c in pitches (5.0) and the canonical set's d_c (23.57 vs its stated 20).
          Deductions: only two measurements are made on a real specimen (green fraction 0.4505 vs 0.44; <n_g> 2.60 vs
          2.665) and the 0.44 / 2.665 targets have no digitisation provenance (-8); the 3.5 discretization-ratio
          reference and the 4.0-pitch lambda_c reference are assessor-chosen anchors, not values reported in the
          papers (-6); several references are self-consistency targets (agreement 1.0, RMS 0, volume fraction
          analytic) (-4); no uncertainty / seed ensemble is reported (-2).
        evidence:
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [1354, 1537], note: "16 reference-backed measurements incl. 8 new Pass 3 entries (3D ratio, 3D Ashman D, 3D-vs-2D agreement, RMS, vertical non-uniformity, volume fraction, insulated control, sweep rho, lambda_c/pitch, canonical d_c)", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [1398, 1407], note: "3D discretization ratio measurement references 3.5 — an anchor carried from Pass 1, not a value in Manukyan 2017 / Fofonjka 2021", supports: false}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [1438, 1457], note: "The two specimen-derived measurements (green fraction, <n_g>) on timon_lepidus_specimen.jpg", supports: true}
      source-traceability:
        value: 84
        rationale: >-
          Five vendored files are SHA-256-pinned and verified at every run (`EXPECTED_SHA256`, L109-125;
          `verify_dataset_sha256`, L150-162), the five sources carry DOIs in the docstring, the dataset README,
          `paper_citations.bib` and the new `skin_volume_reference.json`, and the latter states explicitly what is
          and is not vendored (no micro-CT mesh, no growth) and records the 3D discretization. Deductions: the
          'canonical_parameters', CA transition probabilities and histogram targets in
          `ocellated_lizard_ca_reference.json` (L53-90) have no figure/table/digitisation provenance, and the
          canonical set is not Turing-unstable at its stated d = 20 (d_c = 23.57), so the file's central numbers
          cannot be traced to the paper (-10); the skin thickness ratio 0.17 is cited to Fig. 4 without a page or
          Methods equation number (-3); the specimen photograph is a Wikimedia image, not a Manukyan specimen (-3).
        evidence:
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [109, 162], note: "SHA-256 pins for 5 dataset files incl. skin_volume_reference.json and runtime verification", supports: true}
          - {file: datasets/ocellated_lizard_ca/skin_volume_reference.json, lines: [1, 73], note: "Pass 3 reference notes: 3D model, thin-film reduction, kinetics Jacobian, residual gap (no micro-CT mesh, no growth, phenomenological kinetics), DOIs", supports: true}
          - {file: datasets/ocellated_lizard_ca/ocellated_lizard_ca_reference.json, lines: [53, 70], note: "canonical_parameters claim diffusivity_ratio_d = 20 but the set's Turing critical ratio is 23.57 (computed at L416-443); no provenance to a Methods equation", supports: false}
          - {file: datasets/ocellated_lizard_ca/README.md, lines: [1, 37], note: "Dataset README lists all 5 files with SHA-256 and sources", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          The module docstring (L1-85) maps each solver to its source and states the Pass 3 remediation and its
          limits; every PDE function docstring gives the governing equation it discretises (L630-646, L748-772),
          the border definition explains why the v2 band leaked (L461-470), the Lean theorems are cross-referenced
          from the code and registered with code loci in `morphoeval/math_kg_loops/manukyan-ocellated-lizard-ca.yaml`
          (laws 1-5), and measurement notes say which v2 number was an artefact. Deductions: the kinetics constants
          (L332) and the CA damping factor 0.35 (L296-297) are not traced to any equation or figure (-6); the 55th
          percentile threshold used for both PDE scales and the specimen (L594, L1012) is an unexplained choice (-4);
          the `reference_value` anchors 3.5 and 4.0 are documented as choices only in the measurement text (-4).
        evidence:
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [1, 85], note: "Module docstring: equations, Pass 3 remediation statement (what is and is not a micro-CT FEM), Lean Theorems 1-5", supports: true}
          - {file: morphoeval/math_kg_loops/manukyan-ocellated-lizard-ca.yaml, lines: [1, 126], note: "Math KG: 5 laws with Lean declarations, theorems and line-pinned code loci incl. the two Pass 3 laws", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [296, 297], note: "CA asynchronous damping factor 0.35 is uncited", supports: false}
      repro-package:
        value: 90
        rationale: >-
          Deterministic seeds throughout, lru-cached solvers whose bitwise two-run determinism is asserted with the
          cache bypassed (L1630-1636), 14-check `--self-test` (L1543-1669, ~33 s) covering SHA locks, Lean instances,
          Turing stability, 3D-vs-2D agreement, controls, sweep monotonicity, mass conservation of the implicit
          solve and specimen CV; the default render (~40 s) produced byte-identical PNG/GIF/3D-PNG on two consecutive
          runs; the dataset README documents all inputs. Deductions: environment versions are recorded only in this
          audit, not in a lock file next to the script (-4); the self-test validates the 3D solver on a reduced 8 x 8
          lattice (L1545), not the rendered 12 x 12 configuration (-3); MPLCONFIGDIR is not set by the script, so
          matplotlib may write a font cache outside the repository (-3).
        evidence:
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [1543, 1669], note: "14-check self-test incl. bitwise 3D and 2D two-run determinism, implicit-solve mass conservation, insulation and monotonicity", supports: true}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [1545, 1545], note: "Self-test runs the PDE checks on a reduced lattice (8x8 scales, 40x40 px, 3000 steps), not the rendered configuration", supports: false}
          - {file: 2015-manukyan-ocellated-lizard-ca.py, lines: [135, 144], note: "All PDE discretization constants and their stability rationale are declared in one place", supports: true}
    remediation:
      - >-
        2015-manukyan-ocellated-lizard-ca.py:326-341 and datasets/ocellated_lizard_ca/ocellated_lizard_ca_reference.json:53-70 —
        the solvers use phenomenological kinetics (f_u = 0.50, f_v = -0.75, g_u = 0.82, g_v = -0.65, cubic 1.25) while the
        vendored 'canonical' clipped-linear set has d_c = 23.57 > its stated d = 20 and is therefore not Turing-unstable.
        Digitise the Methods parameters of Manukyan et al. (2017) with provenance (equation/table), fix the vendored set,
        and run the 3D solver with those kinetics.
      - >-
        2015-manukyan-ocellated-lizard-ca.py:739-865 and 135-144 — the 3D domain is a stepped voxel skin on a 5 px pitch
        (border area fraction 0.36, h_interior = 0.48 pitch, no domain growth), not the micro-CT geometry of Fofonjka &
        Milinkovitch (2021). Replace the step by a smooth hexagonal-dome thickness profile h(x) at >= 10 px pitch, add the
        growing domain, and report convergence of the 3D-vs-2D agreement (currently 90.3 %, RMS 0.118 = 33 % of the pattern
        amplitude at P = 0.17) with h_interior / lambda_c.
      - >-
        2015-manukyan-ocellated-lizard-ca.py:993-1010 — `segment_timon_lepidus_specimen` samples a fixed 13 x 14 hexagonal
        lattice over the dorsal ROI instead of detecting scale centres; replace with blob/watershed detection of individual
        scales (and orthorectify the ROI) so the specimen neighbour histogram does not inherit lattice-registration error.
      - >-
        2015-manukyan-ocellated-lizard-ca.py:276-278 and 1418-1427 with ocellated_lizard_ca_reference.json:75-90 — the CA
        flip probabilities and adult histogram targets are vendored tables without digitisation provenance, and the 3D PDE
