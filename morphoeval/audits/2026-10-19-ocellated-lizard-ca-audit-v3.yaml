# MorphoEval audit — Manukyan et al. (2017) Ocellated Lizard (Timon lepidus) Skin-Scale Cellular Automaton, 2026-10-19 (v3)
#
# Pass 3 remediation-round re-score of `2015-manukyan-ocellated-lizard-ca.py` (v3, 1700 lines) after the
# instrumented loop `morphoeval/runs/2026-10-19-ocellated-lizard-ca-loop-pass3`, superseding
# `2026-10-19-ocellated-lizard-ca-audit-v2` (91.9, assessor gemini-4-argon).
#
# What Pass 3 changed (the single open v2 remediation item plus the defects it exposed):
#   1. 3D: `integrate_skin_volume_pde_3d` integrates the reaction-diffusion system in a genuine voxelized skin
#      volume Omega = {0 <= z < h(x, y)} with stepped thickness (h_interior = 12 voxels, h_border = round(P*12);
#      P = 0.17 -> 2 voxels, P_eff = 0.167), zero-flux boundaries on the epidermal surface / basal lamina / thickness
#      steps, explicit lateral + implicit vertical (Thomas) diffusion. This is the closest honest reduced version of
#      the "full 3D FEM micro-CT mesh" item — no micro-CT mesh is vendored and the domain does not grow; both are
#      stated in the code, in `datasets/ocellated_lizard_ca/skin_volume_reference.json` and carried below.
#   2. The 2D model is now the depth-averaged thin-film reduction (1/h) div(h D grad u) with face conductance
#      min(h_i, h_j) D and column capacity h (the v2 "D(x) = P D with unit capacity" variant is kept only as a
#      comparison), and the 3D-vs-2D agreement is measured (scale-state agreement 90.3 %, RMS 0.118, vertical
#      non-uniformity 2.2e-2 at P = 0.17; 100 % / 4e-3 / 5e-16 at P = 1.0).
#   3. The v2 per-scale averaging step applied after every PDE step (`homog_rate = 0.28 (1 - P)`) — which
#      manufactured the v2 "discretization ratio 86.79" — has been removed. The Pass 2 border band also leaked
#      (sub-pixel gaps coupled scales at full thickness); borders are now leak-proof (P = 0 gives 144 insulated
#      components for 144 scales) and the P sweep is monotone (Spearman rho = -1.0 over P > 0).
#   4. Turing linear stability added (`kinetics_linear_stability`): the script kinetics have d_c = 7.0 and
#      lambda_c = 25 px = 5 scale pitches (chosen so an isolated scale cannot pattern internally, as in Manukyan
#      Fig. 4); the vendored "canonical" clipped-linear set in `ocellated_lizard_ca_reference.json` has
#      d_c = 23.57 > its own d = 20, i.e. it is NOT Turing-unstable as vendored (new finding, open item).
#   5. Lean Theorems 4-5 (depth-average identity; face conductance = thickness ratio; 0 sorrys), 16 measurements
#      (8 new), 14 self-test checks (6 new), new `docs/media/ocellated_lizard_ca_3d_volume.png`, 12-panel figure.
#
# Scores below are lower than v2 (83.6 vs 91.9) although the model is more faithful: the v2 scores credited the
# artificial averaging step, a leaky border band, histogram/parameter tables with no digitisation provenance and a
# lattice-imposed specimen segmentation as achievements. This round scores only what the evidence supports.
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not probabilities).
# Line numbers refer to the files at commit bd54e11 (working tree of the Pass 3 loop).

