measurements:
  thompson-scarus-pomacanthus:
  - name: species in the landmark table
    value: 791
    unit: count
    method: rows of trimmed_tps_Claverie2014.csv (sha256 checked)
    derived_from: script
    reference_value: 791
    reference_source: 'Friedman et al. 2019, Dryad 10.5061/dryad.fn457gr (Claverie & Wainwright 2014 landmarks),
      CC0: ''nearly 800 species'''
  - name: Scarus species
    value: 22
    unit: count
    method: rows whose genus is Scarus
    derived_from: script
  - name: Pomacanthus species
    value: 9
    unit: count
    method: rows whose genus is Pomacanthus
    derived_from: script
  - name: Procrustes distance, Scarus mean to Pomacanthus mean
    value: 0.0312
    unit: Procrustes units (RMS per landmark)
    method: RMS landmark distance after optimal similarity superimposition of the genus means (unit centroid size)
    derived_from: script
  - name: affine residual
    value: 0.0259
    unit: Procrustes units
    method: RMS after a least-squares affine map (6 parameters)
    derived_from: script
    note: explains 30.9 % of the Procrustes distance
  - name: Moebius residual (isogonal coaxial circles)
    value: 0.0311
    unit: Procrustes units
    method: RMS after a least-squares Moebius map z -> (az+b)/(cz+1), the conformal map that turns the Cartesian
      grid into two orthogonal pencils of coaxial circles
    derived_from: script
    reference_source: 'Thompson 1917, On Growth and Form, p. 749, Figs. 375-376: ''a system of (approximately) coaxial
      circles'''
    note: 'explains 0.8 %: a conformal map cannot change the depth/length ratio'
  - name: oblique coaxial-circle residual
    value: 0.0256
    unit: Procrustes units
    method: 'RMS after an affine map followed by z -> z/(cz+1) (8 parameters): coaxial circles whose two pencils
      need not be orthogonal, the family Thompson''s Fig. 376 belongs to as drawn'
    derived_from: script
    reference_source: Thompson 1917, On Growth and Form, p. 749, Figs. 375-376
    note: explains 32.4 %
  - name: thin-plate spline bending energy
    value: 0.6778
    unit: dimensionless
    method: bending energy of the exact TPS from the Scarus mean to the Pomacanthus mean (Bookstein 1989)
    derived_from: script
  - name: within-Pomacanthus RMS (noise floor)
    value: 0.0132
    unit: Procrustes units
    method: RMS of the Pomacanthus species about their own Procrustes mean
    derived_from: script
    note: species range 0.0090-0.0180; within-Scarus 0.0099
  - name: leave-one-landmark-out RMS of the oblique coaxial family
    value: 0.0371
    unit: Procrustes units
    method: each landmark predicted by the 8-parameter map fitted to the other 16
    derived_from: script
    note: 'compare with the Procrustes distance: the family has no predictive value for held-out landmarks if it
      is not smaller'
  - name: depth/length, Scarus mean
    value: 0.3772
    unit: ratio
    method: landmark extent in y over extent in x
    derived_from: script
  - name: depth/length, Pomacanthus mean
    value: 0.5873
    unit: ratio
    method: landmark extent in y over extent in x
    derived_from: script
  - name: percentile of Scarus -> Pomacanthus among all genus pairs (oblique coaxial, explained share)
    value: 31.1475
    unit: percent
    method: share of the 3782 ordered pairs of genus means (genera with >= 3 spp.) explained less well
    derived_from: script
    note: median pair 43 %
  - name: Scarus -> Chaetodon spp., median explained by oblique coaxial circles
    value: 35.12
    unit: percent
    method: median over the 54 Chaetodon species
    derived_from: script
    reference_source: 'Thompson 1917, On Growth and Form, p. 749, Figs. 375-376: ''other fishes of the same family
      of Chaetodonts ... small variations in the values of the constants'''
    note: range 12-61 %
  - name: silhouette area, Scarus ghobban
    value: 214862
    unit: pixels
    method: segmented mask at 0.25 scale; photograph SHA-256 732f1e68da7e... checked by the script
    derived_from: script
    reference_source: Jérôme Huet, IFREMER (image.ifremer.fr 00762-87435), via Wikimedia Commons, CC BY 4.0
  - name: caudal-peduncle anchor, Scarus ghobban
    value: 0.7919
