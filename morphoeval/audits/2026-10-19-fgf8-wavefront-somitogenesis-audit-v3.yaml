# MorphoEval audit — Dubrulle & Pourquié (2001, 2004) FGF8 mRNA Decay Wavefront Somitogenesis, 2026-10-19 (v3)
#
# Pass 3 re-score of `2003-dubrulle-fgf8-wavefront-somitogenesis.py` (Slot 024, slug `doppler-somite-shortening`)
# after remediating the two open v2 items in the instrumented loop
# `morphoeval/runs/2026-10-19-doppler-somite-shortening-loop-pass3`, superseding
# `2026-10-19-fgf8-wavefront-somitogenesis-audit-v2` (90.9).
#
# What Pass 3 changed:
#   1. Section 3b (L295-L506): Goldbeter, Gonze & Pourquié (2007) RA -| FGF -> Cyp26 -| RA mutual-inhibition switch
#      driven by the Dubrulle (2004) fgf8 mRNA gradient: analytic elimination of X and RA, steady-state branch scan
#      with bisection-refined saddle-nodes (m_SN_lo = 0.184, m_SN_hi = 0.546; spatial window 218-610 um), forward
#      Euler integration along a Lagrangian PSM cell trajectory (hysteretic front x_sw = 720.4 um, 90->10 % width
#      198 um vs 792 um for the graded threshold, 4.0x sharper) and a reverse (bead re-exposure) trajectory showing
#      memory (jump back only at m >= 0.675).
#   2. Section 4b (L616-L900): 2D cell-based paraxial mesoderm strip (8 rows x 10 um cells) fed by a self-renewing
#      tailbud progenitor pool (80 cells/row, T_div = 480 min, lognormal cycles, N(0.5, 0.04) mRNA partitioning) whose
#      exported daughters push the column (elongation = progenitor division), with juxtacrine FGF8 smoothing and
#      per-row somite boundaries at clock ticks; closed forms for the periodic exit level, the dilution-compensated
#      transcription rate and the dilution front shift; T_div sweep + no-division ablation.
#   3. 5 new measurements (10 total, all with reference_value), 6 self-test blocks, CLI --t-div/--rows/--sigma-f/
#      --switch-ka/--print-pass3, Panels G-I in the PNG, 3 new Lean 4 theorems (0 sorry; 6 total), math KG laws 4-5,
#      dataset JSON/README/bib extended (Bénazéraf et al. 2010 added as the un-modelled elongation mechanism).
#
# Scoring is conservative: the Pass 3 work also exposed defects that v2 did not deduct for (hard-coded perturbation
# shifts in the lab-frame simulator, JSON-stored "predicted" and "observed" regime values whose figure pinpoints are
# unverified), so several dimensions go DOWN although the model is now richer. Line numbers refer to the files at
# commit d58a084 after the Pass 3 edits (uncommitted working tree, verified against the current file).

