          cache in a temp dir and warns, which the invocation notes do not mention (-2); the PNG changed layout
          (2x3 -> 3x3) so Pass 2 artifact hashes no longer apply and no CSV of the measurements is emitted (-4).
        evidence:
          - {file: 2003-dubrulle-fgf8-wavefront-somitogenesis.py, lines: [1485, 1582], note: "Six-block deterministic self-test incl. Pass 3 switch and strip assertions", supports: true}
          - {file: 2003-dubrulle-fgf8-wavefront-somitogenesis.py, lines: [1585, 1624], note: "CLI with --self-test, --skip-gif and Pass 3 flags; default invocation renders PNG + GIF", supports: true}
          - {file: docs/media/fgf8_wavefront_somitogenesis_growth.gif, lines: [0, 0], note: "24-frame GIF, byte-identical across Pass 2 and Pass 3 renders", supports: true}
    remediation:
      - >-
        2003-dubrulle-fgf8-wavefront-somitogenesis.py:566-584 and 271-274 — the lab-frame simulator enters the FGF8-bead
        (-52.5/+52.5 um), SU5402 (+65 um) and electroporation (67.5 um) front shifts as constants. Derive delta_x* from a
        Gaussian bead source added to m(x) and from a scaled K_A (SU5402) in the Section 3b switch, and feed the
        resulting per-cycle shifts into simulate_fgf8_somitogenesis.
      - >-
        2003-dubrulle-fgf8-wavefront-somitogenesis.py:252-291 with datasets/fgf8_wavefront_somitogenesis/
        fgf8_wavefront_somitogenesis_reference.json:82-139 — the 5-regime r = 0.9998 correlates JSON predicted values
        with JSON observed values whose Dubrulle (2001) figure/table pinpoints are unverified. Use S_calc_um (computed)
        for r/RMSE and add figure+panel pinpoints (or mark the observed values as reconstructed) for every regime.
      - >-
        2003-dubrulle-fgf8-wavefront-somitogenesis.py:302-316 — GOLDBETER_SWITCH_PARAMS are this script's bistable-regime
        choice. Pin them to the Goldbeter et al. (2007) parameter table, reproduce the paper's bistability diagram as a
        panel, and report x_sw as a prediction rather than a tuned-adjacent value (current slow-passage lag 110 um).
      - >-
        2003-dubrulle-fgf8-wavefront-somitogenesis.py:654-870 — embed the RA/FGF8 switch per cell in the 2D strip
        (currently a graded threshold on the smoothed field, L771-L779), add PSM cell division and a non-proliferative
        elongation term (Bénazéraf et al. 2010), and add mediolateral mechanical/community coupling so the somite-length
