# MorphoEval audit — Goldbeter, Gonze & Pourquié (2007) / Baker, Schnell & Maini (2006) RA–FGF8/Wnt Bistable Wavefront, 2026-10-20 (v3)
#
# Pass 3 re-score of `2012-baker-fgf-wnt-bistable-wavefront.py` (Slot 025) after remediating BOTH open v2
# findings in the instrumented loop `morphoeval/runs/2026-10-19-fgf-wnt-bistable-wavefront-loop-pass3`,
# superseding `2026-10-19-fgf-wnt-bistable-wavefront-audit-v2` (91.3).
#
# What Pass 3 changed (both v2 remediation items):
#   1. Lewis (2003) delayed Her1/Hes7 autoinhibition oscillator lattice (`simulate_delayed_her_clock_lattice`,
#      L526-816) with delayed saturating Notch-Delta coupling between adjacent PSM cells, advected through the
#      Goldbeter (2007) bistability (clock-competence) window [x(M_2), x(M_1)] = [149.4, 571.4] um
#      (`bistability_competence_window`, L501-524); the bistable switch is gated by the Her protein peak so
#      arrest is saltatory (cohorts of cells per clock cycle). Measured T_osc = 92.0 min vs 90 min observed
#      (Palmeirim 1997), Lewis formula 86.0 min; clock-derived S = v_g*T_osc = 153.3 um vs 150 um; Notch
#      ablation (eps_N = 0) collapses nearest-neighbour coherence 0.84 -> 0.03 and the saltatory index 0.87 -> 0.42;
#      T_N = T_osc/2 reproduces Lewis's anti-phase locking (self-test 5).
#   2. 2D bilateral paraxial mesoderm strips + neural tube (`solve_bilateral_2d_ra_fgf`, L837-1030) with the
#      Vermot & Pourquié (2005) RA-buffered lateralizing bias b_eff = b_LR*K^h/(K^h + R_ant^h): WT offset 6.3 um
#      (0.04 somite), VAD offset 149.8 um = 1.00 somite (left delayed), situs inversus and Raldh2-/- mouse flip
#      the delayed side; 4/4 regimes side-correct, max error 0.04 somites (`evaluate_lr_regimes`, L1118-1164).
#   3. 6 new reference-anchored measurements (11 total), 7-section self-test, 3x3 figure (Panels G-I new),
#      bilateral GIF rows, CLI flags --clock-delay/--notch-delay/--notch-coupling/--lr-bias/--situs/--print-pass3,
#      pinned SHA-256 for the new `fgf_wnt_clock_lr_reference.json`, 3 new Lean 4 theorems (6 total, 0 sorrys),
#      math_kg equations 4-6, 4 new DOIs.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the files in the working tree at the end of the Pass 3 loop (HEAD d58a084 + uncommitted
# slot-025 changes). Scores below were produced by the Pass 3 loop agent (Claude Fable 5.1); no independent
# second assessment was run in this pass — see `checkpoint.note`.

