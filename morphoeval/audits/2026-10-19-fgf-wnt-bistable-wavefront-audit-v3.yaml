          hysteresis S-curve (L191-296, L297-435) and adds the two mechanisms the v2 audit asked for with the
          papers' own equations: Lewis (2003) Eqs. 1-3 delayed autoinhibition DDE per PSM cell with
          published rate constants, delayed saturating Notch-Delta input and Lewis's own random gene-release
          initial condition (L526-816; T_osc = 92.0 min vs 90 observed; in-phase at T_N = T_osc, anti-phase
          at T_osc/2 as in Lewis Fig. 4C-D), and the 2D bilateral reaction-diffusion extension with the
          Vermot & Pourquié RA-buffering law (L819-1030; VAD offset matches the analytic law to < 1 um).
          Score moves 94 -> 93 because the coupling exposed a structural defect: clock-gated arrest yields
          irregular cohorts (segment-length CV 0.69, L799, vs ~0.05 in chick) and the 2D WT front sits at
          509 um vs 571 um in 1D because the neural-tube factor (L866, L903) perturbs the strips transversely;
          the DeltaC branch is a reduced readout (L452-453, L636). 6 Lean 4 theorems (0 sorrys) cover Laws 1-6.
