simulations:
  - id: baker-fgf-wnt-bistable-wavefront
    supersedes_audit_id: 2026-10-19-fgf-wnt-bistable-wavefront-audit-v2
    name: "Goldbeter, Gonze & Pourquié (2007) / Baker, Schnell & Maini (2006) RA–FGF8/Wnt mutual cross-inhibition bistable determination wavefront in vertebrate somitogenesis, gated by a Lewis (2003) delayed Her1/Hes7 clock lattice on 2D bilateral paraxial mesoderm strips"
    organism: "Gallus gallus (chick embryo presomitic mesoderm & bilateral paraxial somites)"
    script: 2012-baker-fgf-wnt-bistable-wavefront.py
    output: docs/media/fgf_wnt_bistable_wavefront_comparison.png
    extra_outputs:
      - docs/media/fgf_wnt_bistable_wavefront_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Goldbeter, Gonze & Pourquie (2007) Dev. Cell / Dev. Dyn. 236:1495-1508 mutual cross-inhibition + CYP26A1 RA-degradation PDEs producing an S-shaped hysteresis curve [M_1, M_2], an all-or-none determination front switch, and (Fig. 10) a bistability window that must span at least one segment so the clock can time the arrest"
        - "Baker, Schnell & Maini (2006) J. Theor. Biol. 239:413-429 & Diez del Corral et al. (2003) Neuron 40:65-79 opposing Vitamin A Deficiency (VAD) anterior front shift vs exogenous RA / SU5402 posterior front shift"
        - "Lewis (2003) Curr. Biol. 13:1398-1408 delayed autoinhibition her1/her7 oscillator (Eqs. 1-3, period ~ 2(T_m + T_p + 1/b + 1/c)), Notch-Delta synchronisation of adjacent cells and anti-phase locking at half-period coupling delay (Fig. 4); Palmeirim et al. (1997) Cell 91:639-648 90-min chick c-hairy1 period"
        - "Vermot & Pourquie (2005) Nature 435:215-220 and Vermot et al. (2005) Science 308:563-566: RA buffers a lateralizing bias so WT somites form bilaterally in synchrony, whereas VAD / disulfiram chick (left delayed) and Raldh2-/- mouse (right delayed) show a one-somite left-right desynchronisation that reverses under situs inversus"
      reconstructed_in_script:
        - "Analytical inverse hysteresis S-curve M(F) solver extracting lower saddle-node M_1 = 1.0254 nM and upper saddle-node M_2 = 3.3038 nM (Delta_M = 2.2784 nM)"
        - "1D coupled RA-FGF8/Wnt reaction-diffusion PDE solver along the 1000 um chick PSM demonstrating 22.2x sharpening of the determination front (Delta_x_front = 16.22 um vs lambda_M = 360.67 um) at x_front = 571.46 um"
        - "150-cell delayed Her1/Hes7 DDE lattice with delayed saturating Notch-Delta input, advected at v_g through the competence window [149.4, 571.4] um; cells arrest only at a Her protein peak -> saltatory cohort arrest (T_osc = 92.0 min, S = v_g*T_osc = 153.3 um, nearest-neighbour coherence 0.84 vs 0.03 Notch-ablated, saltatory index 0.87 vs 0.42)"
        - "2D (x, y) RA-FGF8/Wnt reaction-diffusion solve on left strip + neural tube + right strip (1500 x 500 um) with RA-buffered lateralizing bias; WT Delta_x_LR = 6.3 um (0.04 somite), VAD 149.8 um (1.00 somite, left delayed), situs inversus and Raldh2-/- mouse right delayed; v_sc buffering sweep monotone"
        - "5-regime somite perturbation evaluator (Pearson r = 0.9999, RMSE = 0.81 um) plus bilateral dorsal somite row segmentation on chick_ra_fgf_somites_specimen.jpg (48.47 px mean spacing)"
      transfer_boundary:
        - "1D anteroposterior chick presomitic mesoderm axis mapped to dorsal vertebrate SEM somite rows; the 2D bilateral strip geometry (strip half-width 250 um, neural tube half-width 80 um) is derived from the specimen's two somite-row pixel offsets"
        - "Lewis (2003) zebrafish her1 rate constants (a, b, c, k, p_0) reused with chick-scale transcription delay T_m = 31.5 min to reach the 90-min chick period"
      does_not_claim:
        - "Full 3D mesenchymal-to-epithelial somite rosette mechanics"
        - "Explicit deltaC mRNA/protein kinetics: Notch-Delta coupling is a delayed saturating readout of neighbour her1 transcript with K_D = k/(2c) (Lewis publishes no numeric value)"
        - "A molecular origin for the lateralizing bias b_LR = 0.727: it is a calibrated free parameter fitted to the one-somite VAD lag, buffered by anterior RA through a Hill law"
    source_refs:
      - goldbeter2007devcell
      - goldbeter2007devdyn
      - baker2006jtbi
      - baker2006devbiol
      - diezdelcorral2003
      - vermot2005
      - lewis2003
      - palmeirim1997
      - dubrulle2001
      - vermot2005science
    summary: >-
      Pass 3 post-remediation evaluation of `2012-baker-fgf-wnt-bistable-wavefront.py` (92.0/100, up from
      91.3/100 in Pass 2). Both v2 remediation items are closed: (1) the Goldbeter-Pourquié bistable switch
      is now gated by a Lewis (2003) delayed Her1/Hes7 autoinhibition oscillator lattice with delayed
      saturating Notch-Delta coupling (T_osc = 92.0 min vs 90 min observed, Lewis closed form 86.0 min;
      clock-derived S = 153.3 um vs 150 um; competence window 2.81 segments >= 1 as Goldbeter Fig. 10
      requires; Notch ablation collapses nearest-neighbour coherence 0.84 -> 0.03 and the saltatory index
      0.87 -> 0.42, cohorts 127 um vs 47 um; T_N = T_osc/2 anti-phase), and (2) the 1D PSM is extended to 2D
      bilateral paraxial strips with an RA-buffered lateralizing bias (WT offset 0.04 somite, VAD 1.00 somite
      left-delayed, situs inversus / Raldh2-/- right-delayed; 4/4 regimes side-correct, max error 0.04
      somites). The remediation also exposed the next layer of defects, carried below: the saltatory cohorts
      are irregular (segment-length CV 0.69 vs ~0.05 observed), the 2D wild-type front (509 um) does not
      coincide with the 1D front (571 um) because of the transverse neural-tube coupling, b_LR is a fitted
      constant, the 1D solver's 1000 um domain clips the VAD front, and the DeltaC pathway is reduced to a
      transcript readout. 11 reference-anchored measurements, 7-section self-test, 6 Lean 4 theorems (0 sorrys).
    scores:
