measurements:
  ibrahim-vascular-angiogenesis-notch:
  - name: Physiological VEGF salt-and-pepper regime tip-cell fraction
    value: 0.5
    unit: tip cell fraction
    method: 16-cell coupled VEGFR2-Dll4-Notch1 vessel wall ODE at VEGF=1.0, k_t=1.0 (N_tip=8/16, spacing=36.0 um)
    reference_value: 0.5
    source: Bentley, Gerhardt & Bates (2008) PLoS Comput. Biol. 4:e1000052 & Lean 4 Theorem 1
    note: period-2 Tip-Stalk alternation with Brillouin k=pi index I_pi = 0.9472 and sprout spacing = 36.0 um
    derived_from: script
  - name: Physiological salt-and-pepper Brillouin k=pi period-2 alternation index
    value: 0.9472
    unit: Brillouin k=pi alternation index
    method: Normalized staggered Fourier mode amplitude at k=pi across M=16 endothelial cells (sFlt1 rescue delta
      = +0.8858)
    reference_value: 0.945
    source: Bentley, Gerhardt & Bates (2008) PLoS Comput. Biol. 4:e1000052 & Collier et al. (1996) J. Theor. Biol.
      183:429-446
    note: DAPT blockade collapses alternation to 0.0000; sFlt1 decoy rescues high-VEGF alternation from 0.0622 to
      0.9480
    derived_from: script
  - name: DAPT Notch blockade (k_t = 0.0) all-tip hypersprouting fraction
    value: 1.0
    unit: tip cell fraction
    method: Negative Notch ablation control with k_t=0.0 => N_i=0 => V_i=V_max (N_tip=16/16, N_stalk=0, delta =
      +0.5000)
    reference_value: 1.0
    source: Hellström et al. (2007) Nature 445:776-780 Fig. 1 & Lean 4 Theorem 2
    note: 100% all-tip hypersprouting collapse with 0 stalk cells and alternation index = 0.0000
    derived_from: script
  - name: Dll4+/- haploinsufficiency heterozygote tip-cell fraction
    value: 0.75
    unit: tip cell fraction
    method: 16-cell vessel wall ODE with Dll4 ligand dosage = 0.5 (N_tip=12/16, 1.5x WT tip density)
    reference_value: 0.75
    source: Hellström et al. (2007) Nature 445:776-780 Fig. 2
    note: Dll4+/- haploinsufficiency increases tip-cell fraction from 0.5000 to 0.7500 (+50% hyperbranching)
    derived_from: script
  - name: High uniform VEGF overload synchronous Dll4 oscillation CV
    value: 0.3808
    unit: temporal CV (SD / mean)
    method: Temporal Dll4 coefficient of variation across M=16 cells under 3.4x uniform VEGF overload (sFlt1 rescue
      reduces CV to 0.0134)
    reference_value: 0.415
    source: Bentley, Gerhardt & Bates (2008) PLoS Comput. Biol. 4:e1000052 Fig. 5 & Chappell et al. (2009) Dev.
      Cell 17:377-386
    note: excessive uniform VEGF triggers synchronous anti-phase/in-phase oscillations; soluble Flt1 decoy rescues
      stable salt-and-pepper (CV = 0.0134)
    derived_from: script
  - name: 'WT : Vegfr2+/- mosaic chimera wild-type tip-cell occupancy'
    value: 0.8571
    unit: WT fraction of tip cells
    method: 1:1 mosaic vessel wall pairing WT (V_max=1.0) and Vegfr2+/- (V_max=0.5) endothelial cells across M=16
