      - "Iridophore contrast is 1.73x the quasi-static flux-balance estimate (measurement 10, L1253-1262) because n is advected during the 6 -> 12 split at s = 4.44: add a relaxation-time measurement (hold the domain after the last split until contrast settles) so the Boltzmann estimate becomes a true bound."
