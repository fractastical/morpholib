# MorphoEval audit — Painter, Maini & Othmer (1999) Pomacanthus Turing-chemotaxis stripe doubling
# & Keller-Segel rippling, 2026-10-20 (v3, Pass 3)
#
# Pass 3 post-remediation evaluation of `1999-painter-chemotactic-stripe-splitting.py` (Slot 005)
# superseding `2026-10-19-chemotactic-stripe-splitting-audit-v2` in
# `2026-10-19-chemotactic-stripe-splitting-loop-pass3`.
#
# Pass 2 remediation items closed in this pass:
#   (1) "Extend the 2D chemotactic PDE to a growing curved surface to model vertebrate skin and fish
#       pigment stripe bifurcations alongside bacterial rippling."
#       -> `simulate_pomacanthus_growing_surface` (L703-856): the ACTUAL PNAS 1999 Pomacanthus system
#          (Kondo-Asai Turing morphogens + chemotactic iridophores) integrated on a uniformly growing
#          surface of revolution (line / cylinder K = 0 / spindle K != 0) via a Laplace-Beltrami
#          eigenbasis solver with Crampin-Gaffney-Maini dilution; reproduces Kondo & Asai's 3 -> 6 -> 12
#          stripe doubling on the flat flank (doubling scale ratio 2.03) and exposes sequential
#          insertion (3 -> 6 -> 8) on the curved spindle.
#   (2) "Couple cell density n(x,t) to an explicit extracellular slime-trail orientation tensor for
#       Myxococcus xanthus social gliding motility."
#       -> `simulate_slime_trail_ks` / `evaluate_slime_trail_hysteresis` (L891-1022): nematic trail
#          tensor Q with mobility M = I + aQ on both D_n and chi; Lean Law 6 predicts chi_c(m) = 4.22,
#          verified by a hysteresis test (ridges held at chi = 4.4 < 4.5 with trails, lost without).
#
# Source correction made in this pass: DOI 10.1073/pnas.96.10.5549 is "Stripe formation in juvenile
# Pomacanthus explained by a generalized Turing mechanism with chemotaxis" (PMID 10318921). Passes 1-2
# cited a non-existent title and attributed a generic Keller-Segel system to it; the Keller-Segel
# laws are now re-attributed (Keller & Segel 1970; Painter & Hillen 2011; Crampin et al. 1999;
# Ermentrout 1991) and the PNAS 1999 model is implemented for the first time (Laws 4-5).

