          - {file: 1999-painter-chemotactic-stripe-splitting.py, lines: [478, 483], note: "Docstring discloses that the 2D stripe regime imposes a 6.2/3.8 x/y chemotactic anisotropy (not derived from the trail tensor)", supports: false}
