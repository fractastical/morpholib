simulations:
  - id: painter-chemotactic-stripe-splitting
    name: "Painter, Maini & Othmer (1999) Pomacanthus Turing-chemotaxis stripe doubling on a growing curved flank & Keller-Segel rippling with slime-trail tensor"
    organism: "Pomacanthus semicirculatus juvenile pigment stripes (model target) & Myxococcus xanthus rippling cell populations (specimen)"
    script: 1999-painter-chemotactic-stripe-splitting.py
    output: docs/media/chemotactic_stripe_splitting_comparison.png
    extra_outputs:
      - docs/media/chemotactic_stripe_splitting_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Painter, Maini & Othmer (1999) PNAS 96(10):5549-5554 Eqs. (1)-(3): Kondo-Asai piecewise-linear Turing morphogens u, v with chemotactic iridophores n, chi(u) = chi_0/(k+u)^2, chi_0 < 0, on an exponentially growing domain L(t) = 11 exp(1e-4 t) (Fig. 3: 3-peak juvenile pattern; Fig. 1 / Kondo & Asai 1995: 3 -> 6 -> 12 stripes at 2, 6, 12 months)"
        - "Keller & Segel (1970) J. Theor. Biol. 26:399-415 chemotactic flux cross-diffusion -div(n chi(c) grad(c)) and its linear instability; Crampin, Gaffney & Maini (1999) growing-domain dilution and mode doubling; Ermentrout (1991) stripe-vs-spot selection"
        - "Balagam & Igoshin (2015) trail-following alignment of gliding M. xanthus cells"
      reconstructed_in_script:
        - "PNAS 1999 Fig. 3 system integrated on a uniformly growing surface of revolution (1D line, cylinder K = 0, spindle K lambda_c^2 = 0.69) with a Laplace-Beltrami eigenbasis solver, fully implicit diffusion + Jacobian + 2r dilution, explicit clipped kinetics and chemotactic flux; stripe counts 3 -> 6 -> 12 on flat flanks (doubling scale ratio 2.03), 3 -> 6 -> 8 on the spindle; chi_0 sweep over two orders of magnitude"
        - "Generic Keller-Segel chemotaxis-logistic 1D/2D IMEX pseudospectral solvers (stationary s in {1, 2, 4, 8}, subcritical control chi = 3.0, growing-domain kymograph 1 -> 2 -> 4, 2D cubic stripes vs quadratic spots) and a slime-trail nematic tensor Q with mobility M = I + aQ tested by a chi-drop hysteresis protocol (grow at 6.2, hold at 4.0 / 4.4)"
        - "Computer-vision segmentation of the Myxococcus xanthus specimen (`chemotactic_pattern_specimen.jpg`, CC BY-SA 4.0): 4 fruiting-body spot aggregates and 362 rippling stripe spacings (74.10 um mean wavelength via the 500 um = 125 px scale bar)"
      transfer_boundary:
        - "The PNAS 1999 iridophore model is compared against Kondo & Asai's stripe COUNTS (3, 6, 12) only; no Pomacanthus photograph is vendored, so curvature-dependent stripe geometry is not validated against a fish specimen"
        - "The Keller-Segel rippling model and slime-trail tensor are mapped to M. xanthus rippling ridges; the tensor is a continuum closure, not an agent-based trail model"
      does_not_claim:
        - "Reproduction of PNAS 1999 Fig. 4-5 anisotropic 2D growth (1.8e-4 / 2.2e-4) or Fig. 8 Lengyel-Epstein adult stripe-to-spot transition"
        - "Individual-cell C-signal contact-reversal mechanics or 3D fruiting-body stalk elevation"
    source_refs:
      - painter1999
      - keller1970
      - myerscough1992
      - painter2011
      - kondo1995
      - crampin1999
      - ermentrout1991
      - balagam2015
    summary: >-
      Pass 3 post-remediation evaluation of `1999-painter-chemotactic-stripe-splitting.py`
      (92.5/100, up from 91.3/100 in Pass 2). Both Pass 2 remediation items are closed: the
      actual PNAS 1999 Pomacanthus model (Kondo-Asai Turing morphogens + chemotactic iridophores,
      Fig. 3 parameters, linear analysis tr J = -0.01, det J = 0.005, h = 0.00458, k_c^2 = 3.2714,
      lambda_c = 3.4739, Neumann modes {5, 6, 7} in band, mode 6 -> 3 stripes) is integrated on a
      uniformly growing surface of revolution and reproduces Kondo & Asai's 3 -> 6 -> 12 stripe
      doubling on flat flanks (line and cylinder; 6 at s = 2.18, 12 at s = 4.44, ratio 2.03) while
      the curved spindle (K lambda_c^2 = 0.69) inserts stripes sequentially (3 -> 6 -> 8), and the
      Keller-Segel rippling cell flux is coupled to a slime-trail nematic order tensor whose Lean-
      proved threshold shift chi_c(m) = 4.22 lies inside the observed hysteresis bracket (4.0, 4.4)
      (ridge amplitude 0.46 with trails vs 0.16 without at chi = 4.4). The seed-paper title and the
      attribution of the Keller-Segel laws were corrected across script, datasets, Lean and KG YAML;
      the SHA-pinned `scout_manifest.json` still carries the wrong title and is disclosed. 13
      reference-anchored measurements, 7 machine-checked Lean 4 theorems (0 sorrys), 9-panel figure
      and 3-row GIF. Residual defects: imposed 6.2/3.8 x/y anisotropy in the 2D KS stripe regime,
      spindle deviation from the doubling law, iridophore contrast 1.7x the quasi-static estimate,
      and no Pomacanthus specimen image.
