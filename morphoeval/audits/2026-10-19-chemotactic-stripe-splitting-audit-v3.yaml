          selection, and `simulate_pomacanthus_growing_surface` (L703-856) on a growing surface of
          revolution with metric g = s^2 g_0, Laplace-Beltrami eigenbasis (`_surface_eigenbasis`,
          L639-665), conservative chemotactic divergence (L666-683) and 2r morphogen dilution. The
          slime-trail tensor (`simulate_slime_trail_ks`, L891-997) adds a nematic closure with
          mobility on both D_n and chi. 7 Lean theorems (0 sorrys) cover Laws 1-6. Deductions:
          the 2D KS stripe regime (`simulate_2d_stripe_vs_spot`, L466-541) still imposes a 6.2/3.8
