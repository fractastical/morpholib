    remediation:
      - "`simulate_2d_stripe_vs_spot` (1999-painter-chemotactic-stripe-splitting.py L466-541) still obtains 2D stripes by imposing a 6.2/3.8 x/y chemotactic anisotropy (docstring L478-483): replace it with the slime-trail mobility tensor of `simulate_slime_trail_ks` (L891-997) so stripe orientation emerges from Q, and compare ridge spacing against the 74.1 um specimen wavelength."
