# MorphoEval audit — Dionaea muscipula Turing wavelength, slot 3169, pass 1.
# Emit 1 writes the unfitted activator field. Specimen CV against that GIF is 73.0.
# The only morphometric is λ = 24 µm compared with the same 24 µm, which is self-referential.
# Overall is the rubric weighted mean (see build_morphoeval_kg.py). Single assessor.
audit:
  id: 2026-10-27-dionaea-muscipula-turing-wavelength-s0-audit
  rubric_version: "0.1.0"
  date: "2026-10-27"
  supersedes: null
  supersedes_audit_id: null
  publisher_orcid: "https://orcid.org/0009-0007-4948-9192"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, single agent; no second assessor)"
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: d71d2f0b1c64d11b069392db32c90726b8fa5d72
    note: "Pass-1 evaluation of --emit 1. The GIF bytes hashed in the pass-1 measurement sidecar were replaced by the pass-2 render in this same commit; the sidecar keeps the pass-1 hashes."
references:
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing, A. M."
    venue: "Phil. Trans. R. Soc. B"
    doi: "10.1098/rstb.1952.0012"
