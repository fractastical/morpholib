    scores:
      model-fidelity:
        value: 90
        rationale: "The script implements Schnakenberg kinetics and the Turing dispersion formula, integrates them spectrally, and shows the equal-diffusion control dies. The nonlinear peak is 3.7% above k_m; that shift is reported rather than tuned away. The 56 µm figure is a length-unit anchor, not an extra fitted parameter inside the PDE."
        evidence:
          - {file: models/2026-delphi10000-dickinsonia-costata-turing-wavelength-s0.py, lines: [83, 100], note: "sigma_of_k and k_c", supports: true}
          - {file: models/2026-delphi10000-dickinsonia-costata-turing-wavelength-s0.py, lines: [133, 175], note: "spectral integrator", supports: true}
          - {file: models/2026-delphi10000-dickinsonia-costata-turing-wavelength-s0.py, lines: [207, 212], note: "equal-diffusion ablation", supports: true}
