        rationale: "The comparison figure shows the real fossil with an ellipse that follows the oval, and the GIF ends on that photograph (CV similarity 96.0 at 720x540, 12 frames). The dynamical field is still a spot lattice, not the parallel modules, so this is not a pixel-level generative match."
