simulations:
  - id: delphi10000-dickinsonia-costata-turing-wavelength-s0
    name: "Dickinsonia costata cellular Turing wavelength, 56 µm, White Sea 558 Ma (Pass 2)"
    organism: "Dickinsonia costata"
    domain: morphogenesis
    script: models/2026-delphi10000-dickinsonia-costata-turing-wavelength-s0.py
    output: docs/media/dickinsonia_costata_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: 2026-10-27-dickinsonia-costata-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, bobrovskiy2018, evans2017, evans2021, hoekzema2017]
    summary: >-
      Pass 2 keeps the Schnakenberg septal model (Du=0.05, Dv=0.55, a=0.12, b=0.88,
      seed 3167) and anchors the measured peak at 5.564e-5 m (55.64 µm). Across eight
      diffusivity scales, measured wavenumber versus linear fastest wavenumber has
      Pearson r = 0.999999999886, wavelength RMSE 0.061 µm against 55.64*sqrt(s),
      and KS = 0.125. Equal diffusion decays to roundoff (reported ratio 4215 after
      flooring the control std at 1e-4). The growth GIF is 12 frames at 720x540 and
      ends on the CC BY 2.5 fossil (CV similarity 96.0). A gradient-energy ellipse
      on that photograph has aspect 1.8 and Ramanujan circularity 0.882. k_meas/k_m
      remains 1.037: the nonlinear peak sits slightly off the linear fastest mode.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and critical wavenumber k_c."
        - "Schnakenberg 1979 kinetics f = a - u + u^2 v, g = b - u^2 v."
        - "Bobrovskiy et al. 2018 cholesterol biomarkers and the White Sea 558 Ma horizon."
        - "Evans et al. 2017 ovoid outline maintained by terminal module addition; Evans et al. 2021 posterior addition."
      reconstructed_in_script:
        - "Cellular-tier Du, Dv distinct from the 2.2 mm organ-tier sibling. Septal count floor(2200/56) = 39."
        - "Spectral Schnakenberg integration, diffusivity sweep, equal-diffusion ablation, and the length-unit anchor at 5.564e-5 m."
        - "Gradient-energy ellipse and minor-axis ridge autocorrelation on the vendored photograph."
      transfer_boundary:
        - "56 µm is the slot's cellular-tier assignment. It is not a spacing reported by Bobrovskiy or Evans."
        - "The photograph's ridge fraction (~0.0185 of the fitted major axis) is the organ-scale module repeat, not the 56 µm pitch."
        - "Evans' sample is largely South Australian; the age used here is the White Sea horizon."
      does_not_claim:
        - "That the spot lattice is the glide-symmetric module pattern of the fossil."
        - "That the terminal GIF frame is a forward pixel prediction. It is the specimen photograph, the empirical endpoint of the growth sequence."
        - "A calibrated millimetre reading off the ruler in the photograph."
