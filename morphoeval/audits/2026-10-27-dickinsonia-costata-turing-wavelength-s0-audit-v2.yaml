        rationale: "Pearson r = 0.999999999886 against a null of 0, RMSE 0.061 µm against a 10 µm tolerance, KS 0.125 against 0.5, and four specimen-image metrics (aspect 1.8 vs 1, circularity 0.882 vs 1, coherency 0.561 vs 0, ridge fraction 0.0185 vs 5.6e-4). The ellipse search stopped on the boundary of its box (aspect 1.8, area fraction 0.60), so the outline is a constrained fit, not a traced contour."
        evidence:
