    claim_boundary:
      reported_in_source:
      - Turing dispersion relation and critical wavenumber.
      - Short-range melanophore-xanthophore exclusion and long-range dependence (Nakamasu et al. 2009).
      - D. albolineatus does not build the reiterated zebrafish stripe stack (Patterson, Bain & Parichy 2014).
      - Danio patterns include vertical bars and spots, with kcnj13 implicated in D. aesculapii (Podobnik et al.
        2020).
      reconstructed_in_script:
      - Schnakenberg parameters (a, b) = (0.12, 0.88) and the diffusion ratios for the three species.
      - Identification of the assigned 3.686e-05 m scale with the pearl-danio fastest mode.
      transfer_boundary:
      - Sister-species wavelengths are predictions of the diffusion change, not histological measurements at 37
        µm.
      - The aquarium photograph does not resolve 37 µm (about 150 µm per pixel along the body).
      does_not_claim:
      - Sand, plants, and the body outline are not generated by the reaction-diffusion equation.
      - The kinetics are not Patterson & Parichy's cell-by-cell model.
