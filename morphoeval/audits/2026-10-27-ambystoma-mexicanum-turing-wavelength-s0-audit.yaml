simulations:
  - id: delphi10000-ambystoma-mexicanum-turing-wavelength-s0
    name: "Ambystoma mexicanum Schnakenberg onset wavelength at 184.3 µm (Pass 1)"
    organism: "Ambystoma mexicanum"
    script: models/2026-delphi10000-ambystoma-mexicanum-turing-wavelength-s0.py
    output: docs/media/ambystoma_mexicanum_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs: [turing1952, murray1981, epperlein1989, frostmason1996, epperlein1988, erickson1993]
    summary: >-
      Periodic Schnakenberg patch of eight onset wavelengths at the Delphi
      coordinate 0.0001843 m (184.3 µm), Holocene age 0 Ma, diffusion ratio 9
      just above r_c ≈ 8.568. Linear fastest mode 187.19 µm. Saturated Fourier
      shell 184.3 µm because the initial condition is that mode. Coarse-versus-fine
      wavelength sweep Pearson r = 1.0 with RMSE 3.39 µm. Ablation Dv = Du has
      max σ = −0.10. Specimen dark-area fraction 0.380 versus model 0.328;
      coherency 0.485 versus 0.915; luminance KS = 0.271. The rendered field is
      a regular lattice inside the micrograph's circular field stop, not a copy
      of the photograph and not a scale-bar measurement.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and the diffusion-driven instability conditions"
        - "Murray 1981 coat pre-pattern and the domain-growth scale argument"
        - "Epperlein & Löfberg 1989 larval Ambystoma mexicanum pigment pattern"
        - "Frost-Mason & Mason 1996 review of axolotl pigmentation"
      reconstructed_in_script:
        - "Schnakenberg (a, b, Dv/Du) = (0.10, 0.90, 9) with Du set so onset λ = 184.3 µm"
        - "Spectral integration, dispersion sweep, and Dv = Du ablation"
        - "Pixel segmentation of the CC BY-SA chromatophore micrograph"
      transfer_boundary:
        - "No cited axolotl paper measured 184.3 µm; that length is the slot's scale coordinate"
        - "The micrograph has no scale bar, so pixel fractions are not converted to micrometres"
        - "Adult ocellus size is the same species at a longer scale, not a second chronospecies, and is not fitted"
      does_not_claim:
        - "That the species-gallery limb plate is a pigment specimen"
        - "That a perfect cos+cos lattice is the geometry of the larval micrograph"
        - "A second independent assessor"
    scores:
      model-fidelity:
        value: 84
        rationale: >-
          The script integrates Schnakenberg kinetics with the Jacobian and the
          onset-wavenumber formula, holds the uniform state stable without
          diffusion (trace −0.2, det 1), and places Dv/Du = 9 just above the
          critical ratio. The saturated shell sits on 184.3 µm largely because
          the initial condition is that Fourier mode, so free wavelength
          selection is only partly tested. The dispersion curve's real-part
          branch has a sharp corner near k ≈ 0.02 µm⁻¹.
        evidence:
          - {file: models/2026-delphi10000-ambystoma-mexicanum-turing-wavelength-s0.py, lines: [94, 165], note: "steady state, Jacobian, critical ratio, onset diffusivities, σ(k)", supports: true}
          - {file: models/2026-delphi10000-ambystoma-mexicanum-turing-wavelength-s0.py, lines: [213, 263], note: "spectral integrator seeded with cos(k_c x)+cos(k_c y)", supports: true}
      specimen-match:
        value: 68
        rationale: >-
          Panel A is the larval chromatophore micrograph and panel B is the
          rendered activator in the same circular field stop, using dark and
          yellow colours measured from that photo. The simulation is a regular
          spot lattice. The micrograph is an irregular field of dendritic
          melanophores. Structure-tensor coherency is 0.915 on the render and
          0.485 on the specimen. Same class of image, different geometry.
        evidence:
          - {file: docs/media/ambystoma_mexicanum_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "side-by-side micrograph and lattice", supports: true}
          - {file: models/2026-delphi10000-ambystoma-mexicanum-turing-wavelength-s0.py, lines: [280, 320], note: "palette sampled from the specimen; circular display mask", supports: true}
      parameter-expressivity:
        value: 82
        rationale: >-
          Scaling both diffusivities by s² moves the fastest wavelength almost
          linearly from about 110 µm to about 340 µm (figure C). The ablation
          Dv = Du kills the positive growth rate. The diffusion ratio itself is
          not walked as a second rendered morphospace on this pass.
        evidence:
          - {file: models/2026-delphi10000-ambystoma-mexicanum-turing-wavelength-s0.py, lines: [168, 205], note: "wavelength_sweep and ablation_max_sigma", supports: true}
          - {file: docs/media/ambystoma_mexicanum_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "panels C and D", supports: true}
      morphometric-validation:
        value: 80
        rationale: >-
          Fine-grid versus coarse-grid wavelengths give Pearson r = 1.0 and
          RMSE 3.39 µm, so the correlation saturated even though the residual
          did not. Linear fastest wavelength 187.19 µm against the 184.3 µm
          onset coordinate. Specimen dark fraction 0.380 versus model 0.328,
          luminance KS 0.271, radial-spectrum r 0.833. None of the specimen
          numbers is copied onto its reference. The photograph is not assigned
          a false micrometre scale.
        evidence:
          - {file: models/2026-delphi10000-ambystoma-mexicanum-turing-wavelength-s0.py, lines: [518, 631], note: "measurement table: Pearson, RMSE, CV, KS, specimen fractions", supports: true}
          - {file: datasets/ambystoma_mexicanum_turing_wavelength_s0/ambystoma_mexicanum_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "Pass 1 numeric dump", supports: true}
      source-traceability:
