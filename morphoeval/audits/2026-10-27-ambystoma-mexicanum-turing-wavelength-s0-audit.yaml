          - {file: datasets/ambystoma_mexicanum_turing_wavelength_s0/ambystoma_mexicanum_turing_wavelength_s0_reference.json, lines: [1, 40], note: "scale 0.0001843 m, age 0 Ma, specimen SHA-256", supports: true}
