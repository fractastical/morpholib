  riedel-delta-notch-phase-synchrony:
  - name: delayed Kuramoto collective synchronization period T_sync vs autonomous T_0
    value: 22.18
    unit: min
    method: transcendental root of Omega = omega_0 - kappa*sin(Omega*tau_c) for T_0=25.0 min, kappa=0.070 min^-1,
      tau_c=20.5 min (Omega=0.2833 rad/min, Omega/omega_0=1.1273)
    reference_value: 22.18
    reference_source: Riedel-Kruse et al. (2007) Science 317:1911-1915 SOM & Morelli et al. (2009) HFSP J. 3:55-66
      Eqs. 2-3 (collective period 22.18 min vs uncoupled 25.0 min)
    note: DAPT Notch blockade (kappa=0) shifts period from 22.18 min to T_0 = 25.00 min (+12.7% slowing, matching
      Herrgen et al. 2010)
    derived_from: script
  - name: effective in-phase linear stability stiffness kappa_eff = kappa * cos(Omega * tau_c)
    value: 0.0623
    unit: min^-1
    method: linearized delayed Kuramoto stiffness kappa_eff = kappa*cos(Omega*tau_c) at tau_c=20.5 min (Omega*tau_c=5.808
      rad) vs repulsive anti-phase delay tau_c=11.0 min (kappa_eff=-0.0353 min^-1)
    reference_value: 0.0623
    reference_source: Morelli et al. (2009) HFSP J. 3:55-66 Eqs. 4-5 & Fig. 2 (in-phase synchronization stable iff
      kappa_eff = kappa*cos(Omega*tau_c) > 0)
    note: in_phase_stable = True at tau_c=20.5 min vs False at repulsive delay tau_c=11.0 min
    derived_from: script
  - name: DAPT pulse-chase Anterior Limit of Defects (ALD) and Posterior Rescue Point (PRP) lag
    value: 5.5
    unit: somites
    method: 2D 8x8 delayed Kuramoto PSM lattice under DAPT pulse [s_in=0, s_out=9] (ALD=5.5 somites, PRP=14.5 somites,
      min R=0.283 -> rescued late R=0.986)
    reference_value: 5.5
    reference_source: Riedel-Kruse et al. (2007) Science 317:1911-1915 Figs. 1-4 (ALD ~ 5-7 normal anterior somites
      after early DAPT; PRP ~ 5.5 somites after washout)
    note: continuous DAPT (s_in=0) drops R from 0.96 to 0.088; washout at s_out=9 rescues R to 0.986 at PRP=14.5
    derived_from: script
  - name: Riedel-Kruse (2007) 5-regime DAPT ALD prediction Pearson correlation r
    value: 1.0
