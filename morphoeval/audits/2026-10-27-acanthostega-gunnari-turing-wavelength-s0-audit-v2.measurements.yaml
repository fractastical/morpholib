    claim_boundary:
      reported_in_source:
      - Acanthostega has eight digits and Ichthyostega seven (Coates & Clack 1990).
      - Tiktaalik has lepidotrichia and no digits (Daeschler, Shubin & Jenkins 2006).
      - Turing 1952 critical wavenumber; Schnakenberg 1979 kinetics; Murray 1981 wavelength selection.
      - Dermal ornament is present on the Acanthostega skull (Porro, Rayfield & Clack 2015) at a coarser scale than
        105 µm.
      reconstructed_in_script:
      - Du = 110.73 µm²/time so analytic lambda_c = 104.9 µm at r = 10, a = 0.05, b = 1.
      - Fin-ray anisotropy alpha = 3.4 and Ichthyostega Dv factor 0.92.
      - One digit corridor reconstructed as 4200 µm (40 wavelengths).
      transfer_boundary:
      - The 105 µm target is the campaign primordium tier for this slot, applied with the Turing law, not a published
        melanosome measurement on MGUH or NHMD material.
      does_not_claim:
      - That fossil melanosomes of Acanthostega were measured at 105 µm.
      - That the Schnakenberg field is a pixel-wise reconstruction of the Brussels skull. The GIF terminus is the
        photograph; the ocellus panel is the model.
      - That alpha = 3.4 or the 0.92 factor is a caliper measurement.
