    claim_boundary:
      reported_in_source:
      - 'Trushko et al. (2020): an MDCK II monolayer growing to confluence inside a 5 kPa alginate microcapsule
        (R0 ~ 100 um, h ~ 10 um) buckles into a single deep inward fold once the confinement pressure reaches the
        Zoelly threshold P_c = 2 E h^2 / (sqrt(3 (1 - nu^2)) R0^2); the fold depth and the capsule pressure read
        from capsule dilation grow over ~11 h post-confluence (Fig. 2E); Blebbistatin reduces and soft (0.4 kPa)
        capsules abolish the fold'
      - 'Hannezo, Prost & Joanny (2014): an apical-basal tension difference dGamma in a monolayer of thickness h
        induces a spontaneous curvature H0 ~ dGamma / (kappa / h) and selects the sign of folding'
      - 'Zoelly (1915): the critical external pressure of a thin elastic spherical shell scales as (h / R0)^2'
      reconstructed_in_script:
      - Zoelly critical pressure and its (h/R0)^2 scaling over a 12-capsule table, an alginate Winkler capsule stiffness,
        a critical growth stretch g_c and buckling time, a prescribed-profile 2D equatorial ring (mode n in {0,
        1, 2}, fitted fold-depth law) with lumen volume partitioning, and (Pass 3) a free 3D icosphere shell with
        springs, Helfrich bending with apical-basal spontaneous curvature, unilateral capsule contact and self-contact,
        relaxed quasi-statically in g; WT, Blebbistatin, unconfined and linear-g regimes along the Fig. 2E schedule;
        a 5-point dGamma sweep; capsule pressure read as K_alg (r_wall / R0 - 1); automated segmentation of a histology
        micrograph
      transfer_boundary:
      - The dataset's g = 2^((t - t_c) / tau_d) is a cell-number (area) ratio; the 3D shell applies sqrt(g) as the
        linear rest stretch by default while the 2D ring still applies g as a linear perimeter stretch, so the two
        solvers are not on the same growth convention
      - dGamma_WT = 4.26 mN/m is calibrated so that H0 R0 = 1 (no apical/basal tension measurement exists in Trushko
        2020); the 12-fold 3D pattern coincides with the 12 five-valent icosphere vertices and has not been shown
        to be mesh-independent
      - The histology specimen (`epithelioid_cyst_specimen.jpg`) is a thyroid-follicle H&E section, not an MDCK
        cyst in a capsule; its reference values are attributed loosely to Trushko Fig. 1-2
      does_not_claim:
      - A cell-level vertex model with apical/basal/lateral faces, lumen pressure, cell division or T1 transitions;
        a resolved rigid-cavity (displacement-controlled) buckling threshold for a stiff 68 kPa capsule; a measured
        apical-basal tension; or a validated single-fold 3D morphology matching the experimental fold depth 0.64
        R0
