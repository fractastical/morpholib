simulations:
  - id: thompson1917-t1917-024
    name: "Thompson (1917) spicule rays as Plateau borders of the secreting cell field vs Grantia ray angles (Pass 2: null control, sweep closure, ablations, three samples)"
    organism: "Grantia aff. indica Dendy, 1913 (SEM plate, ZMA Por. 11556b); Grantia sp. (spread); Haeckel/Thompson Fig. 214 drawings"
    script: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py
    output: docs/media/t1917_024_on_concretions_spicules_and_sp_comparison.png
    extra_outputs:
      - docs/media/t1917_024_on_concretions_spicules_and_sp_growth.gif
