# MorphoEval audit v2 (Pass 2 remediation) — Thompson (1917) T1917-024, spicule rays as Plateau
# borders — 2026-10-28.  Supersedes the Pass-1 audit (62.3).
#
# Remediates R2-R8 of Pass 1.  The rendered-sweep measurement closure (R3) exposed a real Pass-1
# defect: the angular-mean ray axis was biased by a 1-3 px junction offset (noise floor for the
# closest-pair difference d up to 11.7 deg on perfectly symmetric renders).  v2 fits each ray
# direction by PCA of arc-centre positions: recovery r = 0.9999, RMSE 0.35 deg, d noise floor
# <= 2.3 deg.  With a Dirichlet(1,1,1) random-partition null, the SEM plate's median d = 4.4 deg
# (null median 34.8; set-mean MC p < 5e-5; KS p = 8e-6), the population micrograph shows the
# 120-deg mode (mean |theta-120| 17.3 vs null 71.2; all-within-15 0.52 vs null 0.011, n = 25),
# and Thompson's own Fig. 214 panels A-D give d median 3.5 (set-mean MC p = 0.0012).  The E5
# one-parameter family beats the crystal-120 and lattice-30 alternatives by RMSE and AIC.
# VERDICT (result.json): MIXED — P1/P2 geometry supported on Grantia; P3 and alcyonarians
# untestable here; the 'passive deposition between any cells' mechanism is contradicted by
# sclerocyte cell biology; bilateral symmetry of a sclerocyte sextet is an unexcluded cause of
# 'two equal angles'.  Same builder-assessor limitation as v1 (R1 open).  Overall 62.3 -> 75.9.

