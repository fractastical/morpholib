          Dreyer 1892 without resolvable identifiers.
        evidence:
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [246, 253], note: "verify_specimens: all three digests checked", supports: true}
          - {file: datasets/thompson_1917/t1917-024/paper_citations.bib, lines: [1, 128], note: "12 entries incl. Manning 2010 (E5 modern form)", supports: true}
          - {file: datasets/thompson_1917/t1917-024/result.json, lines: [0, 0], note: "dataset block: preassigned DATASET_MISMATCH, primary/population/source-figure SHA-256", supports: true}
      code-traceability:
        value: 78
        rationale: >-
          Header now states P1-P3, E1-E9, F1-F4 and the ablations with page numbers; each
          analysis function names its prediction (F1 saturation, F2 null, F4 ordering); the
          Lean header and KG yaml map theorems to equations and functions.  Deductions: KG
          code loci are by function name; segmentation constants (90/400/1500/0.9; population
          0.06/5-26 px; drawing 0.10) are tuned to these images and traced only to the plate.
        evidence:
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [1, 66], note: "CLAIM UNDER TEST / MODEL / FALSIFIABLE CONTENT / DATA header", supports: true}
          - {file: morphoeval/math_kg_loops/thompson1917-t1917-024.yaml, lines: [60, 131], note: "5 laws with lean_theorem, lean_locus, code_locus", supports: true}
      repro-package:
        value: 74
        rationale: >-
          Deterministic (seeded RNG for null, sweep orientations and saturation sample),
          --self-test covers model identities, inverse, null, saturation, sweep closure,
          alternatives, digests, detections and Fig. 214 (< 1 s); full run 4 s; CLI
          documented; measure_morphoeval returns the list format measure_outputs.py expects
          (Pass-1 crash fixed and now exercised); scikit-image FutureWarnings silenced.
          Deductions: no per-script dependency pin; checkpoint is a branch commit; the
          population and drawing extractors are tuned to two specific images.
        evidence:
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [903, 936], note: "self_test: 20 assertions incl. sweep closure thresholds", supports: true}
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [848, 900], note: "measure_morphoeval: 10 measurement records with reference values and null notes", supports: true}
    remediation:
      - id: R1
        item: "Independent second assessor (different provider) — Pass 2 is still builder-scored"
      - id: R9
        item: "A second SEM individual/species (e.g. Sycon, Leucosolenia plates in Zootaxa 4426 or other CC BY sources) so the SEM d-statistic is not n = 8 from one specimen"
      - id: R10
        item: "Quantify population-extraction selection: manually annotate a random subset of the 273 junction candidates to estimate the acceptance bias of the 3-arc criterion"
      - id: R11
        item: "Model ray curvature (Plateau bourrelet / curved partitions of unequal cells) so the near- vs chord-axis difference (RMSE 5.3 deg) becomes a prediction, not a nuisance"
      - id: R12
        item: "3D test of P3: micro-CT or stereo-SEM of tetractines to measure the apical ray angle against 109.47 deg"
      - id: R13
        item: "Alcyonarian (octocoral) sclerites: the claim text names them and nothing here tests them"
