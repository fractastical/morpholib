      - datasets/thompson_1917/t1917-024/result.json
    status: evaluated
    supersedes_audit_id: 2026-10-28-t1917-024-on-concretions-spicules-and-sp-audit
    source_refs: [thompson1917, vansoest2018, readey2020, rossi2016, voigt2017, ledger1977, manning2010, nadhira2019]
    provenance:
      spec_fingerprint: 77e8201d27dd51cb520268fe921b47c6a9cc21b65c7f28e750eaa978978c6f12
      artifact_sha256: e4526bfdf295d88731e41f15187b4f2dee07e46d148a0f2b39d42425edfa6985
      input_dataset_sha256:
        grantia_indica_zootaxa4426_fig53_sem.jpg: 70194abe78894820ff61347417ba7f2b7fa7c20ed1a42261893c6a46947bad59
        grantia_spicules_readey_100x.jpg: 08641621770534e19f605acd532684124e5b3886c3a69cfb32e4c9657c3a7f30
        thompson1917_fig214_ia_leaf465_p445.jpg: 019168c1fa4adddc2c3f731369f8f0160115f2f45f4331a55bc3be3d99637988
        dryad_8mv00jv_dataset_metadata.json: 8b1273b453ccdb77ae1562f25c263883504c6600483e84a1a96e50c159207c24
    summary: >-
      TESTED CLAIM, verdict MIXED.  Model: Neumann tension triangle E1-E3 with the equiangular
      point E4, one-parameter sagittal family E5 (cos theta_pair = -rho/2), tetrahedral /
      orthogonal limits E7/E8 and the law-of-sines inverse; six Lean theorems; the general
      three-tension model is shown saturated (realises 100 % of random angle triplets) so only
      E5 is tested.  Measurement: PCA ray axes from radial arcs, validated by rendering 20 E5
      spicules at known rho in random orientation and re-measuring (r = 0.9999, RMSE 0.35 deg,
      rho RMSE 0.011, d noise floor <= 2.3 deg).  SEM plate (8 three-ray spicules): closest-pair
      difference d median 4.4 deg vs Dirichlet null median 34.8 (set-mean MC p < 5e-5, KS p =
      8e-6, 5/8 below the null 5th percentile); unpaired deviation 26 deg; fitted rho 0.20 (T-
      shaped atrial tetractine f) to 1.12; all 7 spicules with rho < 1 have unpaired > paired
      (F4); rho CV within the three tubar triactines d = 0.004.  Alternatives on the same
      angles: crystal-120 RMSE 15.3, lattice-30 8.5, E5 2.25 deg (E5 preferred by AIC).
      Population spread (25 physical triradiates of 28 detections): mean |theta - 120| = 17.3
      vs null 71.2; all-within-15 fraction 0.52 vs null 0.011 (P1).  Thompson's own Fig. 214
      panels A-D digitised: 92/108/160, 89/93/178, 110/110/140, 115/121/125; d median 3.5,
      set-mean MC p = 0.0012; E and F unresolved (hairline drawings).  Not tested: P3
      (tetrahedral; apical ray end-on in 2D), alcyonarian spicules, and the mechanism itself,
      which modern sclerocyte biology contradicts in Thompson's 'any three cells' form.  Rubric
      scores rate the simulation package.  Overall 75.9/100.
    claim_boundary:
      reported_in_source:
        - "Thompson (1917, pp. 443-449), after Dreyer (1892) and Plateau (1873): calcareous spicule rays follow the junction lines of 3 or 4 contiguous cells; 120 deg for equal tensions, 'two equal angles and one unequal' otherwise, grading to a T; tetrahedral ~109 deg for four cells; the spicule is 'a crystal under restraint'.  Evidence given: Haeckel's drawings (Fig. 214), no angle table."
      reconstructed_in_script:
        - "Exact Neumann law of cosines / law of sines, E5 family and inverse, tetrahedral and orthogonal constants, interstice area; PCA radial-arc ray-angle extraction validated by a rendered rho sweep; Dirichlet(1,1,1) null for the closest-pair difference with MC and KS tests; crystal-120 and lattice-30 ablations with RMSE/AIC; three samples (CC BY SEM plate n = 8, CC BY-SA population spread n = 25 physical, Thompson Fig. 214 n = 4 panels); result.json with per-prediction verdict components."
      transfer_boundary:
        - "One SEM plate from one individual and one spread of one Grantia sample; drawings are Haeckel's not photographs; 2D projections of trihedral spicules (near- vs chord-axis RMSE 5.3 deg quantifies curvature/projection sensitivity); no alcyonarian material; tetractine apical ray not measurable."
      does_not_claim:
        - "Does NOT claim Thompson's mechanism is correct: Ledger & Jones (1977) and Voigt et al. (2017) show a dedicated founder/thickener sclerocyte sextet; only the geometric predictions are supported, and bilateral symmetry of that sextet would also yield two equal angles — the data cannot separate tension balance from a symmetric cell programme."
        - "Does NOT claim the general three-tension model is tested: it is saturated (fraction realised 1.0) and cannot fail; only E5 is falsifiable here."
        - "Does NOT claim P3 (tetrahedral 109.47 deg) or anything about alcyonarian spicules; both are 'untestable' in result.json."
        - "Does NOT use the pre-assigned Dryad dataset (hexactine fossil tomograms, 5.8 GB): DATASET_MISMATCH recorded with pinned metadata."
        - "Does NOT claim independent confirmation: builder-scored (R1 open)."
    scores:
      model-fidelity:
        value: 78
        rationale: >-
          Everything Thompson states algebraically is implemented exactly and Lean-checked, and
          v2 adds the law-of-sines inverse, the saturation demonstration (F1) and the explicit
          falsifiable-content statement, which is the honest reading of a tension-triangle
          model.  Still no foam / cell-doublet simulation of the deposition field itself (the
          GIF's three-cell field remains illustrative), and ray curvature is treated as a
          measurement nuisance rather than modelled (Thompson's own 'bourrelet' remark).
        evidence:
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [102, 140], note: "neumann_angles (E3), tensions_from_angles (E2 inverse), sagittal_angles (E5), tension_ratio_from_angles, polyhedral_ray_angles (E7/E8), interstice_area (E9)", supports: true}
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [165, 182], note: "general_model_saturation: fraction realised 1.0 — general model not testable", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_024.lean, lines: [59, 229], note: "6 theorems, lean exit 0, 0 sorry", supports: true}
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [557, 564], note: "three_cell_field: cells on sector bisectors, not a tension-derived foam", supports: false}
      specimen-match:
        value: 70
        rationale: >-
          Six-panel comparison: SEM overlay with per-spicule axes and angles; measured vs E5
          renders at fitted rho with corrected orientation (the Pass-1 mis-orientation is
          fixed); Thompson's own Fig. 214 with digitised axes; population spread histogram.
          The Y (c), sagittal (d), near-equiangular (e) and T (f) forms are all visibly
          reproduced by the one-parameter family.  Deductions: rays rendered straight (real c,
          e laterals curve), tetractine apical rays not rendered (stated), drawings E/F
          unresolved, and still a single SEM individual.
        evidence:
          - {file: docs/media/t1917_024_on_concretions_spicules_and_sp_comparison.png, lines: [0, 0], note: "panels (a) SEM axes, (b) measured vs E5, (f) Fig. 214 digitised", supports: true}
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [599, 605], note: "basal_direction: ray not bounding the unpaired gap (orientation fix R6)", supports: true}
          - {file: datasets/thompson_1917/t1917-024/measurements/fig214_digitised.json, lines: [0, 0], note: "panels E, F unresolved: hairline outlines detach", supports: false}
      parameter-expressivity:
        value: 78
        rationale: >-
          rho is swept over 20 values across its whole range with measured outputs: the
          re-measured unpaired angle is strictly monotone in rho and both angles track E5 with
          r = 0.9999; rho, threshold, null size and sample selection are exposed on the CLI.
          Deductions: the sweep is over rendered spicules (model-to-measurement closure), not
          over an independent generative parameter of a deposition field; the general three-
          tension model is only sampled for saturation, not swept with outputs.
        evidence:
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [522, 554], note: "rho_sweep: render at known rho, re-measure, r / RMSE / monotonicity", supports: true}
          - {file: datasets/thompson_1917/t1917-024/measurements/rho_sweep.json, lines: [0, 0], note: "20/20 recovered, r 0.9999, RMSE pair 0.35 deg, rho RMSE 0.011", supports: true}
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [939, 948], note: "CLI: --threshold --n-null --rhos --skip-population --skip-fig214 --no-gif", supports: true}
      morphometric-validation:
        value: 76
        rationale: >-
          The tautological Pass-1 angle plane is replaced by a real test: closest-pair
          difference vs a stated null (Dirichlet partition), per spicule and as a set (MC p
          with resolution floor, KS), with the method's own noise floor measured on known
          renders; alternatives scored on the same data (RMSE/AIC); P1 tested on an
          independent population sample with its own null; Thompson's own figure digitised and
          tested; near- vs chord-axis sensitivity, angle CV and within-type rho CV reported.
          Deductions: n = 8 + 25 + 4 from three heterogeneous sources; the population method
          accepts only 28 of 273 junction candidates (selection effects unquantified); the AIC
          treats the lattice snap as 0 free parameters (generous to the alternative, but a
          discrete-choice penalty is debatable); projection error of trihedral spicules is
          bounded only indirectly (near vs chord RMSE 5.3 deg).
        evidence:
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [185, 240], note: "paired_difference_null, null_statistics (MC + KS), alternative_models (RMSE, AIC)", supports: true}
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [394, 449], note: "measure_population with physical flag and Dirichlet null", supports: true}
          - {file: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py, lines: [451, 497], note: "measure_fig214: hole-filled drawing digitisation, unresolved panels reported", supports: true}
          - {file: datasets/thompson_1917/t1917-024/result.json, lines: [0, 0], note: "headline numbers: d 4.4 vs 34.8, p < 5e-5, KS 8e-6; population 17.3 vs 71.2; Fig. 214 p 0.0012", supports: true}
          - {file: datasets/thompson_1917/t1917-024/measurements/population_ray_angles.json, lines: [0, 0], note: "28 detections from 273 junction candidates: strong selection, unquantified", supports: false}
      source-traceability:
        value: 85
        rationale: >-
          Eight references, seven with Crossref-verified DOIs; three specimen files with
          licence, credit, Commons SHA-1 and SHA-256, all re-verified at run time
          (verify_specimens); IA leaf/page rule and OCR excerpt stored; the Dryad mismatch is
          documented with pinned API metadata; result.json records dataset status including
