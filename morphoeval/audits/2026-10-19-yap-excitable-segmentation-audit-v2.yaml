          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [240, 520], note: "RK4 single-cell excitability/limit-cycle integrator, 6-regime perturbation suite, and 2D mPSM reaction-diffusion PDE", supports: true}
