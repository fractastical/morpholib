    claim_boundary:
      reported_in_source:
        - "Hubaud, Regev, Mahadevan & Pourquie (2017) Cell 171:668-682 FitzHugh-Nagumo excitable oscillator model of primary mouse presomitic mesoderm (PSM) cells gated by nuclear YAP mechanotransduction"
        - "Quiescent excitable state in isolated spread fibronectin PSM cells (high nuclear YAP) rescued into ~140 min autonomous LuVeLu oscillations by Latrunculin A, Y-27632 (Rockout), or Yap1 inhibition, and blocked by constitutively active Yap5SA"
      reconstructed_in_script:
        - "Analytical cubic nullcline continuation, Jacobian spectrum, and supercritical Hopf bifurcation diagram across Y_nuc in [0, 1] (|u_H| = 0.9675, Y_crit = 0.6109)"
        - "RK4 single-cell & ensemble simulations across all 6 Hubaud et al. (2017) perturbation regimes (Pearson r = 0.9976, RMSE = 0.0469) plus subthreshold vs suprathreshold single-pulse excitability"
        - "2D reaction-diffusion mPSM target-wave PDE solver with Yap5SA constitutive block control and bilateral somite DoG peak segmentation on mouse_psm_somites_specimen.jpg (47.14 px mean spacing, CV = 0.2010)"
      transfer_boundary:
        - "Fast-slow 2-variable FitzHugh-Nagumo phenomenological reduction of the Notch/FGF/Wnt/YAP mouse PSM segmentation clock compared with dorsal vertebrate paraxial somite SEM periodicity"
      does_not_claim:
        - "Explicit molecular transcriptional-translational delay equations for Hes7/Lfng/Axin2 or 3D focal-adhesion traction force microscopy"
    source_refs:
      - hubaud2017
      - fitzhugh1961
      - lauschke2013
      - dupont2011
    summary: >-
      Pass 2 post-remediation evaluation of `2016-hubaud-yap-excitable-segmentation.py` (91.7/100,
      up from 60.6/100 in Pass 1; +31.1 overall). The remediated script implements the full
      FitzHugh-Nagumo fast-slow excitable segmentation-clock model gated by nuclear YAP
      mechanotransduction (`I_eff = I_basal + J_Dll1 - gamma_YAP * Y_nuc`), solves exact cubic
      nullcline intersections and supercritical Hopf bifurcation thresholds (`|u_H| = 0.9675`,
      `Y_nuc_crit = 0.6109`, cubic knee barrier `4/3 = 1.3333`), reproduces all 6 experimental
      perturbation regimes from Hubaud et al. (2017) (isolated fibronectin quiescent, Dll1-coated,
      Latrunculin A F-actin inhibition rescue at `T_osc = 141.50 min`, Y-27632 Rockout rescue,
      intact high-density mPSM, and constitutively active `Yap5SA` arrest; oscillating fraction
      Pearson `r = 0.9976`, `RMSE = 0.0469`), demonstrates suprathreshold single-pulse excitability,
      solves the 2D reaction-diffusion mPSM target-wave PDE (`wave_contrast = 0.931` vs `0.0144`
      under `Yap5SA` block), and segments the vendored vertebrate somite/PSM SEM specimen
      (`mouse_psm_somites_specimen.jpg`, bilateral spacing `47.14 px`, `CV = 0.2010`), backed by
      3 machine-checked Lean 4 theorems in `Loop_027_yap_excitable_segmentation.lean`.
