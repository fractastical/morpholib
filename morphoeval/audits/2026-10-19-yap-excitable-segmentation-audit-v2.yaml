          `tau_v dv/dt = u + a - b v` with exact cubic root continuation, Jacobian trace/determinant
          Hopf stability analysis (`|u_H| = sqrt(1 - epsilon*b) = 0.9675`), suprathreshold single-spike
          excitability, and 2D diffusive target-wave propagation (L120-520), verified by 3
          machine-checked Lean 4 theorems (0 sorrys) in
