          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [164, 327], note: "2D coronal neo-Hookean cortical shell + white-matter core L-BFGS-B energy minimizer and g <= g_c lissencephalic threshold", supports: true}
          - {file: morphoeval/lean/loops/Loop_061_cortical_gyrification_folding.lean, lines: [11, 86], note: "3 machine-checked Lean 4 theorems for critical growth threshold, cube-law wavelength stationarity, and GI sulcal perimeter excess (0 sorrys)", supports: true}
