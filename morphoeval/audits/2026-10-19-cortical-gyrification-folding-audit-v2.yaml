          lambda = 2*pi*h*(mu_c/(3*mu_s))^(1/3), Zilles et al.'s (1988) Gyrification Index
          GI = P_pial / P_hull (L130-158), and an L-BFGS-B energy minimizer of a growing
          2D coronal neo-Hookean cortical shell + subcortical white-matter foundation
          (`relax_neohookean_cortical_shell`, L164-327) with zero-growth (g=1.00),
          lissencephaly (h=6.50 mm, g=1.14), and polymicrogyria (h=0.85 mm) controls
          (L449-484), backed by 3 machine-checked Lean 4 theorems in
          `morphoeval/lean/loops/Loop_061_cortical_gyrification_folding.lean`.
        evidence:
