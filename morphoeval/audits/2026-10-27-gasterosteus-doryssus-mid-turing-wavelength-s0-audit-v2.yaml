  id: 2026-10-27-gasterosteus-doryssus-mid-turing-wavelength-s0-audit-v2
  supersedes_audit_id: 2026-10-27-gasterosteus-doryssus-mid-turing-wavelength-s0-audit
  supersedes: 2026-10-27-gasterosteus-doryssus-mid-turing-wavelength-s0-audit
