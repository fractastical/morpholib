    remediation:
      - "ROI/segmentation (morphometric-validation, specimen-match): replace the rectangular ROI + whole-ROI Otsu with a coat mask — at minimum a hand-drawn polygon per specimen stored in the reference JSON that excludes head, legs, udder, sky and ground; better, a two-class (coat vs background) segmentation followed by Otsu inside the coat. Re-derive all Pass-5/6 numbers; specimens 07, 08, 09 should change most. Store the per-specimen ROI polygons and the resulting masks (or their SHA-256) so the segmentation is auditable."
      - "Resolution confound (morphometric-validation): make the comparison scale-matched — either downsample every specimen mask to the simulation lattice width (160 px) before patch_stats, or run the simulations at the specimen resolution — and report roughness at matched resolution. Replace perimeter/sqrt(area) with a scale-free shape statistic (e.g. solidity or convexity defect ratio measured on smoothed contours). Re-check whether the Eden control still 'wins' once its lattice fuzz is no longer credited."
      - "Statistics (morphometric-validation): report per-seed and per-specimen distributions with a paired test (seeds are shared across models) and a bootstrap CI on the Pass-6 mean difference; state in the figure title and metrics 'note' that Eden-vs-RD is not significant at n = 5 seeds / 9 specimens (assessor: p ≈ 0.2 throughout). Increase seeds (≥ 20) — the Eden run is cheap — and store seed SDs in pass6 per_specimen."
      - "Aspect-ratio bias (morphometric-validation): normalise diameters by sqrt(ROI area) instead of ROI width, or crop/pad the simulation to each specimen's ROI aspect ratio before thresholding."
      - "Model fidelity: attach the heterogeneity field to the tissue (generate once on the embryonic grid and resize it with u and v), add the dilution term for the growing domain (Crampin, Gaffney & Maini 1999, doi:10.1006/bulm.1999.0131) or state explicitly that growth is instantaneous resize; cite Eden (1961) and Mort et al. (2016, doi:10.1038/ncomms10288) for the melanoblast control and, ideally, implement the Mort et al. proliferation-plus-migration rule rather than a generic Eden process."
      - "Consistency: use one specimen pipeline (clean_mask or raw) for verdict, self-test, render() and animate(); read ROI fractions from the reference JSON in render(); remove the hard-coded 34.0 in animate()."
      - "Source traceability / licensing: add an `author`/`credit` field for each CC-BY / CC-BY-SA image (Commons 'Artist' metadata: e.g. 02 Keith Weller/USDA, 08 Quintin Soloviev, 09 Cvmontuy), record the Commons original sha1 and the exact derivative URL fetched, complete the Schnakenberg bib entry (vol 81, pp 389-400), correct the Edea et al. author list in both the script header and the bib to 'Edea Z, Dadi H, Dessie T, Kim I-H, Kim K-S' (Crossref) and drop the 'verified' wording until it is, and update README.md to describe the ten-specimen design, the montage, the GIF and the licences."
      - "Repro package: push the checkpoint commit to the remote; extend self_test to call multi_specimen_comparison on one seed (SHA checks + distance_v2(x,x)==0); assert DT < 1/(4*max(D_U,D_V)) at import; consider committing the comparison PNG via a .gitignore exception as other datasets do for *_specimen.png."
    unverifiable:
      - "Commons licence/author metadata was checked for specimens 02, 08 and 09 only; 03-07 and 10 are taken on trust from the reference JSON."
      - "Whether the nine extra-specimen ROIs were chosen before or after inspecting model distances cannot be established from the committed tree (git history of the dataset was off-limits under blinding); the parameter hold-out is verified from code, the ROI-choice hold-out is not."
