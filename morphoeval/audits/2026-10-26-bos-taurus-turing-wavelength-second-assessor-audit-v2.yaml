# MorphoEval audit — BLINDED independent second-assessor assessment (v2) of
# models/1981-murray-bos-taurus-turing-wavelength.py at commit 6e00a18b (Pass 6:
# 10 Holstein specimens), 2026-10-26.  Assessor: Claude Fable 5.1 (Anthropic),
# role second_assessor.
#
# Blinding statement: this assessment was produced WITHOUT reading any
# morphoeval/audits/*bos-taurus* file (primary or earlier second-assessor, any
# version), any morphoeval/runs/*bos-taurus* loop record, the scoring tables in
# morphoeval/README.md, or the git history of those files.  Only
# morphoeval/rubric.yaml, morphoeval/schema.yaml, the validator, the target
# script, and the dataset directory were read.  'verdict' / 'note' /
# 'interpretation' strings inside the script and metrics JSON were treated as
# builder claims to be tested, not as evidence.  All numbers quoted below were
# re-derived by the assessor (independent numpy re-derivation of the dispersion
# relation; isolated re-run of --self-test and the full --no-show --animate
# pipeline in a /tmp copy of the tree; per-specimen ROI re-segmentation and
