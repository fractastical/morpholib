    claim_boundary:
      reported_in_source:
        - "Turing (1952): diffusion-driven instability of a homogeneous steady state; Murray (1981): RD pre-pattern as a mechanism for mammalian coat markings with a scale (domain-size) argument; Schnakenberg (1979): the a-u+u^2v / b-u^2v kinetics actually integrated."
        - "Edea et al. (2017): MITF-locus association with spotting in cattle, i.e. a melanoblast/melanocyte genetic account."
      reconstructed_in_script:
        - "Schnakenberg linear Turing analysis (J, tr, det, cross term, k_c, unstable band, numeric sigma maximiser, equal-diffusion control) and explicit-Euler periodic-grid simulation — all independently re-derived by the assessor and found correct."
        - "Stage-wise 'growing domain' (bilinear resize, no dilution term), a two-scale random gamma multiplier as 'tissue heterogeneity', and a generic Eden colonisation process with a dorsal founder row — none of these is a published model; they are the builder's analogues."
        - "Otsu + 3x3-majority mask morphometrics on rectangular ROIs of ten colour/sepia photographs, an eight-term 'distance v2', 5-seed comparison on specimen 01 and transfer of the specimen-01-fitted settings to nine further specimens."
      transfer_boundary:
        - "Dimensionless 160x120 lattice vs photographs of 288-657 px ROI height; only ratio statistics cross the boundary, but boundary roughness (perimeter/sqrt(area)) is NOT resolution-invariant and diameter/width is NOT aspect-ratio-invariant (see morphometric-validation)."
      does_not_claim:
        - "The script does not claim to implement Murray (1981)'s own kinetics (docstring lines 26-31) and does not claim a developmental cause for Holstein spotting; it tests morphometric consistency only."
        - "This audit does not claim the melanoblast-vs-RD ranking is statistically established: neither the Pass-5 nor the Pass-6 difference reaches p < 0.05 under paired tests on the committed numbers."
    summary: >-
      Blinded second-assessor pass at Pass 6.  The Turing core is correct: the
      assessor's independent numpy re-derivation reproduces J = [[0.8, 1], [-1.8, -1]],
      tr J = -0.2, det J = 1, cross term 15, k_c^2 = 0.375 (lambda_c = 10.26 px),
      unstable band k in [0.272, 0.822], numeric sigma_max = 0.263 at k* = 0.487,
      and an equal-diffusion control with sigma_max = -0.10; dt = 0.01 respects the
      1/(4 D_v) = 0.0125 explicit-Euler bound.  The script now says plainly that
      it integrates Schnakenberg (1979), not Murray's coat kinetics.  The full
      pipeline is byte-reproducible: an isolated re-run reproduced the committed
      metrics JSON, both PNGs and the 38-frame GIF with identical SHA-256; all
      ten specimen digests match the reference JSON; three Commons licences
      checked via the API agree with the JSON.  The biological-validation side
      remains weak despite real improvements (n = 10, coverage-only calibration,
      distance v2 without tautological terms, 5 seeds, genuinely held-out model
      parameters).  Independent findings: (1) the rectangular ROIs are
      materially contaminated in at least six of ten specimens — the whole
      head in 08, dark tree background in 09, grass/ground/legs/udder shadow
      in 03/05/06/10, legs and ground in 01 and 07 — so 'coverage', enclave
      counts and roughness are partly measuring background, and specimen 07
      has a single 'enclave' (the white sky-plus-coat) with CV = 0; (2) the
      boundary-roughness statistic is resolution-dependent: specimen 01's
      enclave roughness falls from 9.75 at native 1112 px to 6.27 when the ROI
      is downsampled to the 160 px simulation width, which is close to the RD
      value (5.3) rather than the Eden value (8.9) — the Eden model's
      pixel-scale fuzz is being credited as 'cow-like jaggedness'; (3) the
      headline model ranking is not statistically supported: Pass 5 paired
      t p = 0.21 (Wilcoxon p = 0.19; Eden median 2.31 vs RD 2.44, the Eden
      mean being pulled down by one seed at 0.59), Pass 6 Eden wins 7/9
      specimens (binomial p = 0.18, paired t p = 0.20), and no uncertainty is
      reported; (4) diameter/width normalisation is aspect-ratio dependent
      (ROI 03 is 2.8:1 vs the 4:3 lattice, a 0.38 log-unit bias on both
      diameter terms); (5) the tissue-heterogeneity map is re-drawn from the
      RNG at every growth stage (lines 219-223), so it is not tissue-attached;
      (6) nine CC-BY / CC-BY-SA images carry no creator attribution in the
      reference JSON (CC BY requires it), the Eden control cites no source
      (Eden 1961 / Mort et al. 2016), the Edea et al. author list that the
      script says was 'verified via Crossref' is still wrong (Crossref: Edea Z,
      Dadi H, Dessie T, Kim I-H, Kim K-S), and the README still describes an
      n = 1 study.  The script's own honest negative verdict about single-wavelength
      Turing is well supported; its positive claim for the Eden control is not.
    scores:
      model-fidelity:
        value: 64
        rationale: >-
          Turing/Schnakenberg core: correct and independently verified.  Steady
          state (u0 = a+b, v0 = b/(a+b)^2), Jacobian, tr/det stability
          conditions, cross term D_v f_u + D_u g_v = 15 > 0, inequality
          225 > 80, k_c^2 = 0.375, band roots of det(J - k^2 D) = 0 and the
          numeric sigma maximiser (k* = 0.487 != k_c, correctly commented at
          lines 120-122) all match the assessor's own derivation; the
          equal-diffusion control is a proper negative control (sigma_max =
          -0.10); dispersion_sigma returns the real part when the discriminant
          is negative (correct growth rate).  Explicit Euler dt = 0.01 is under
          the 0.0125 periodic-lattice bound; FFT wavelength 11.87 px lies
          between lambda_c 10.26 and lambda* 12.91 as expected for a
          160-px periodic lattice.  Deductions: (-12) the script is filed under
          Murray (1981) but integrates Schnakenberg kinetics — now disclosed
          (lines 26-31) but the model's fidelity to the named source remains
          loose, and Murray's scale argument is invoked verbally rather than
          implemented as a domain-size/lambda_c ratio sweep; (-10) the
          'growing domain' is three bilinear resizes with no dilution term and
          no growth-rate parameter (Crampin et al. 1999 is the standard; Kondo &
          Asai is name-checked only), so it is an analogue, not a published
          growing-domain RD model; (-6) the 'tissue heterogeneity' gamma field
          is regenerated from the RNG at each stage (lines 219-223: `_gamma_map`
          is called inside the stage loop), so the heterogeneity is not
          attached to the tissue through growth — a modelling inconsistency
          with the stated biological interpretation; (-8) the melanoblast
          'positive control' is a generic Eden cluster-growth process with a
          dorsal founder row and random founders (lines 280-314); it has no
          source citation and does not implement any published melanoblast
          model (e.g. Mort et al. 2016 proliferation-migration), so the
          two-model comparison is between a published RD system and an
          unpublished heuristic.
        evidence:
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [26, 44], note: "Docstring: Schnakenberg kinetics, steady state, Jacobian, Turing conditions, k_c, equal-diffusion control — disclaimer that these are NOT Murray (1981)'s kinetics", supports: true}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [94, 142], note: "steady_state / jacobian / dispersion_sigma / turing_analysis — assessor re-derived J=[[0.8,1],[-1.8,-1]], kc2=0.375, band [0.272,0.822], sigma_max 0.263, eq-diff -0.10: all match", supports: true}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [151, 160], note: "Explicit Euler, periodic 5-point Laplacian, dt=0.01 < 1/(4 D_v)=0.0125", supports: true}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [210, 224], note: "simulate_growing: bilinear resize stages, no dilution term; _gamma_map re-drawn inside the stage loop (219-223) so heterogeneity is not tissue-attached", supports: false}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [260, 314], note: "simulate_melanoblast: generic Eden growth with dorsal founder row, coverage stopping rule; no source model cited", supports: false}
          - {file: datasets/bos_taurus_turing_wavelength/bos_taurus_turing_wavelength_metrics.json, lines: [4, 21], note: "Committed linear_turing_analysis block reproduced exactly by the assessor's re-run and independent derivation", supports: true}
      specimen-match:
        value: 38
        rationale: >-
          Side-by-side renders exist (5-panel comparison PNG, 2x9 montage,
          38-frame GIF) and the three model outputs are visually distinct from
          one another, which the rubric requires.  But none resembles a
          Holstein flank: Pass-1 Turing (gamma = 1) is a uniform hexagonal spot
          field; the remediated growing-het fit (gamma = 0.25) is ~15
          near-circular, near-uniform white enclaves on black — the cow's
          enclaves are one large irregular region plus a few small ones; the
          Eden panel has pixel-scale fractal fuzz on every boundary, a texture
          no cow shows (real patch edges are smooth at the pixel scale and
          irregular only at the macro scale).  The script itself concedes the
          mismatch for RD (verdict, lines 683-690) and the assessor credits
          that honesty, but the rubric scores resemblance.  Further
          deductions: the left-hand 'specimen' panels are Otsu masks of
          rectangular ROIs that include background and limbs (specimen 01
          mask shows ground/leg ribbons at bottom left and right; see
          morphometric-validation for the other nine), so even the specimen
          side of the comparison is not a clean coat pattern; the comparison
          PNG shows the raw Otsu mask (lines 711-713) while all Pass-2/5/6
          statistics use the majority-filtered mask, so the picture and the
          numbers are not the same object; and the 2x9 montage is rendered at
          figsize (22, 5) / 110 dpi, giving ~230x100 px thumbnails per ROI
          that cannot be used to judge segmentation quality.  Credit: three
          models shown on one coverage-matched footing, GIF shows the growth
          and colonisation trajectories stage-by-stage, titles carry the
          numbers.
        evidence:
          - {file: datasets/bos_taurus_turing_wavelength/bos_taurus_turing_wavelength_comparison.png, lines: [0, 0], note: "Five panels: sepia flank ROI, raw Otsu mask, gamma=1 spots (142), growing-het fit (2 patches/15 round enclaves), Eden control (pixel-fuzzy blobs); none resembles the specimen", supports: false}
          - {file: datasets/bos_taurus_turing_wavelength/bos_taurus_specimens_montage.png, lines: [0, 0], note: "2x9 montage of extra specimens; thumbnails too small to judge; several masks visibly include background/limbs", supports: false}
          - {file: datasets/bos_taurus_turing_wavelength/bos_taurus_turing_wavelength_animation.gif, lines: [0, 0], note: "38 frames; RD ends as uniform round white enclaves, Eden as fuzzy clusters; cow mask panel includes ground/leg ribbons", supports: false}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [694, 739], note: "render(): raw Otsu mask shown (711-713) while statistics use clean_mask; ROI fractions hard-coded (704-707) rather than read from the reference JSON", supports: false}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [863, 883], note: "render_specimens(): 2x9 montage at figsize (22,5), dpi 110", supports: false}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [670, 691], note: "verdict(): script honestly reports single-wavelength Turing does not match (criterion at 680-682)", supports: true}
      parameter-expressivity:
        value: 60
        rationale: >-
          gamma is a live, monotone wavelength control: the committed sweep
          gives lambda_FFT = 28.3 / 11.9 / 5.4 px for gamma = 0.25 / 1 / 4
          against lambda_c = 20.5 / 10.3 / 5.1 (the gamma^-1/2 law, with the
          expected lattice quantisation at the long-wavelength end), spot
          counts 21 / 142 / 434, and setting D_v = D_u abolishes the
          instability (sigma_max = -0.10).  fit_growing sweeps gamma x mode x
          polarity x quantile (72 candidates) and publishes a leaderboard.
          Deductions: heterogeneity is binary (0 or 0.8) and never swept, so
          its claimed effects (patch-size diversification, boundary
          roughening) are asserted, not demonstrated; founder_fraction for
          Eden is a fixed 0.002 whose selection on 3 seeds is described only in
          a docstring (lines 275-278) with no table; a, b, D_v, domain size
          and the growth schedule are module constants with no CLI exposure
          (argparse has only --self-test/--no-show/--animate), so a reader
          cannot exercise any axis without editing source; and the
          'threshold quantile' axis in the Pass-2 fit is later fixed to the
          coverage, so the only genuinely free RD axes in Passes 5-6 are gamma
          and the stage schedule, neither varied there.
        evidence:
          - {file: datasets/bos_taurus_turing_wavelength/bos_taurus_turing_wavelength_metrics.json, lines: [69, 148], note: "simulation_sweep: lambda_fft 28.28/11.87/5.40 px, n_patches_big 21/142/434 for gamma 0.25/1/4 — monotone", supports: true}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [475, 505], note: "fit_growing: 3 modes x 4 gammas x 2 polarities x 3 quantiles; heterogeneity fixed at 0.8", supports: true}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [83, 90], note: "All physical parameters are module constants; no CLI axes", supports: false}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [886, 892], note: "argparse exposes only --self-test, --no-show, --animate", supports: false}
      morphometric-validation:
        value: 50
        rationale: >-
          Genuine progress over a one-photo RD demo: the same patch_stats
          function is applied to specimen and simulation; coverage is the only
          calibrated quantity and is calibrated identically for every model
          (quantile threshold for RD, stopping rule for Eden) — a legitimate
          nuisance-parameter treatment; distance v2 drops coverage and
          largest-patch share, which were tautological under that calibration,
          and the assessor confirmed distance_v2(x, x) = 0; five seeds per
          model; and the nine extra specimens are genuinely held out from the
          parameters fitted on specimen 01 (gamma, heterogeneity, polarity,
          founder density are not re-fitted in multi_specimen_comparison —
          assessor re-ran and reproduced every per-specimen number).  Against
          that, five independent defects cap the score at 50.  (a) ROI
          contamination: the rectangular ROIs plus whole-ROI Otsu include the
          entire head in 08, dark tree canopy across the top of 09,
          grass/ground/udder shadow in 03, 05, 06, 10, and legs/ground in 01
          and 07; in 07 the only 'big enclave' is white sky joined to white
          coat (enclave count 1, CV 0.0, roughness 16.5, all artefacts of the
          crop), and in 09 'pigment coverage' 0.59 is mostly background.  The
          held-out statistics therefore measure crop geometry as much as coat
          pattern.  (b) Resolution confound: boundary_roughness = perimeter /
          sqrt(area) on a 4-neighbour digital boundary is not scale-free;
          the assessor downsampled specimen 01's ROI from 1112 px to 556 / 278 /
          160 px width and the enclave roughness fell 9.75 -> 8.01 -> 7.24 ->
          6.27 (pigment 10.83 -> 6.16).  At the simulation's own 160-px
          resolution the cow is therefore close to the RD value (5.3), and the
          Eden value (8.9) is pixel-scale fuzz from a coarse lattice, not
          cow-like morphology.  The self-test assertion that Eden is rougher
          than RD (line 770) is true but measures lattice artefact.  (c) No
          inferential statistics: the Pass-5 Eden-vs-RD difference (2.07 vs
          2.70) is a paired t p = 0.21 / Wilcoxon p = 0.19 on five seeds, the
          Eden mean being pulled by one seed (0.59; medians 2.31 vs 2.44); in
          Pass 6 Eden wins 7 of 9 held-out specimens (binomial p = 0.18,
          paired t p = 0.20) and per-specimen seed spread is not even stored.
          The figure title 'distance v2 2.07 vs RD 2.70 (5 seeds)' presents an
          insignificant difference as a result.  (d) diameter/width
          normalisation depends on ROI aspect ratio: for a patch of fixed
          area fraction, d/W scales as sqrt(H/W); ROI 03 is 2.8:1 vs the 4:3
          lattice, a factor 0.69 (0.38 log-units on each of two diameter
          terms, i.e. up to ~0.75 of distance v2 from geometry alone); most
          other ROIs carry 0.2-0.25.  (e) Two specimen pipelines coexist:
          specimen_stats (raw Otsu, used for the Pass-1 verdict and
          self-test) and specimen_pattern (majority-filtered, used for
          Passes 2-6) give roughness 13.6 vs 10.8 and 181 vs 38 components for
          the same ROI, and the JSON reports both without saying so.  Also:
          the eight distance weights (1, 1, 1, 1, 0.5, 0.5, 0.3, 0.3) are
          unexplained and no weight-sensitivity is shown; the Eden founder
          density was selected on the scored enclave-count statistic for
          specimen 01 (disclosed, lines 275-278) which makes Pass 5 a
          partially in-sample comparison for Eden; and no literature-reported
          Holstein morphometric (e.g. published pigmented-area percentages)
          is used — all targets are self-measured from the photographs.
