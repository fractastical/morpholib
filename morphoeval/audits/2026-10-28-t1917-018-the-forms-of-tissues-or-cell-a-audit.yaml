simulations:
  - id: thompson1917-t1917-018
    name: "Thompson (1917) T1917-018 — Plateau tri-junction (120 degree) claim: Lami balance, periodic froth relaxation, junction-angle statistics"
    organism: "species-agnostic claim; specimens vendored: Homo sapiens corneal endothelium, Allium cepa epidermis, Thompson Fig. 103 (Zea mays parenchyma), Fig. 124 (Girardia epidermis)"
    script: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py
    output: docs/media/t1917_018_the_forms_of_tissues_or_cell_a_comparison.png
    extra_outputs:
      - docs/media/t1917_018_the_forms_of_tissues_or_cell_a_growth.gif
    status: evaluated
    source_refs:
      - thompson1917
      - plateau1873
      - taylor1976
      - farhadifar2007
      - hayashi2004
      - doughty1989
    claim_boundary:
      reported_in_source:
        - "Thompson (1917) p. 297: three similar liquid surfaces always meet at 120 degrees; p. 303 Fig. 113 cases (1)-(3): 90 / >90 / 120 degrees as the partition tension t rises to T; p. 309-310: Lamarle's least-area partition meets in threes at 120 degrees, and 'in any ordinary section of a vegetable parenchyma ... cell-walls everywhere meeting, by threes, at angles of 120 degrees, irrespective of the size of the individual cells'."
        - "Thompson (1917) pp. 314, 321-322: epidermal outer walls and growth/traction anisotropy (Fig. 124 Girardia) are stated exceptions where the angles depart from 120 degrees."
      reconstructed_in_script:
        - "Lami/Neumann triangle of forces (E1) with Fig. 113 cases, Steiner-vs-cross film lengths (E2), angle-sum identity statistics (E3), and a periodic Poisson-Voronoi vertex network relaxed by gradient descent on a Farhadifar-type energy (E5) at one parameter point."
      transfer_boundary:
        - "2D plane section / en-face projection of a 3D cell aggregate; Thompson's 109 deg 28' tetrahedral edge law is not simulated."
      does_not_claim:
        - "v1 makes no claim about any real epithelium: no specimen is loaded or segmented, so no verdict on T1917-018 can be drawn from v1."
    summary: >-
      Pass 1 (v1) evaluation (overall 40.2/100). The baseline implements Lami balance with
      Thompson's three Fig. 113 cases, the Steiner-vs-cross inequality, the angle-sum identity
      statistics, and a periodic Voronoi froth relaxed under a Farhadifar-type energy at a single
      parameter point (relaxed junction-angle SD 19.0 deg vs 29.5 deg for the Voronoi seed), with a
      3-panel figure and a relaxation GIF. It does NOT load, SHA-256-verify, or segment any of the
      four vendored specimens, does not sweep tension anisotropy or the partition-tension ratio,
      has no negative/ablation control beyond the unrelaxed seed, computes no goodness-of-fit,
      writes no result.json, and its froth relaxation is unconverged (SD 19 deg is far from the
      Plateau limit) because perimeter contractility makes edge tensions unequal and no T1
      exchanges are allowed.
    scores:
      model-fidelity:
        value: 55
        rationale: >-
          `lami_angles_from_tensions` (L61-75) implements the triangle-of-forces law exactly as
          Thompson states it (pp. 296-297) and `thompson_fig113_cases` (L78-84) reproduces cases
          (1)-(3) (90 / 100 / 120 deg); `steiner_vs_cross_lengths` (L87-89) encodes Lamarle's
          four-fold instability. However the simulated froth (L182-220) uses Farhadifar's
          Gamma_bar = 0.04 perimeter term so edge tensions are unequal (not the equal-tension soap
          froth Thompson invokes), runs a fixed 400 steps with no convergence check and no T1
          transitions, and the single-regime result (SD 19 deg) therefore mis-represents the
          Plateau limit it is meant to embody.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [61, 89], note: "Lami balance, Fig. 113 cases and Steiner inequality implemented as published", supports: true}
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [182, 220], note: "Froth energy with Gamma_bar > 0 and fixed-step descent; no equal-tension soap-froth limit, no convergence criterion, no T1", supports: false}
      specimen-match:
        value: 18
        rationale: >-
          Four specimens are vendored and SHA-256-pinned in
          `datasets/thompson_1917/t1917-018/` (corneal endothelium, onion epidermis, Thompson Figs.
          103 and 124) but v1 never opens any of them: `render_outputs` (L243-309) draws a Lami curve,
          a synthetic froth and a synthetic histogram only. There is no side-by-side with a real
          epithelium or with Thompson's own figures.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [243, 309], note: "render_outputs produces three synthetic panels; DATA_DIR is defined (L47) but never read", supports: false}
          - {file: docs/media/t1917_018_the_forms_of_tissues_or_cell_a_comparison.png, lines: [0, 0], note: "Figure contains no specimen image or overlay", supports: false}
      parameter-expressivity:
        value: 32
        rationale: >-
          The Lami curve sweeps the partition-tension ratio t/T continuously from 0 to 2 (L258-271),
          which is genuine expressivity for E1. The froth model, however, is run at a single
          (Lambda_bar, Gamma_bar) = (0.12, 0.04) point; the tension-anisotropy parameter eps of E5
          (the regime that distinguishes Thompson's Fig. 103 from Fig. 124) is not implemented at
          all, and the CLI exposes only `--self-test` (L374-377).
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [258, 271], note: "Continuous t/T sweep of the Lami angles", supports: true}
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [374, 377], note: "CLI accepts only --self-test; no eps / Lambda / Gamma / seed flags; no anisotropy regime", supports: false}
      morphometric-validation:
        value: 30
        rationale: >-
          `plateau_statistics` (L93-105) computes the right dispersion statistics (SD, RMS deviation,
          median |theta-120|, fraction within +/-15 deg) and `measure_morphoeval` (L312-345) reports
          seven quantities, but every one of them is measured on the synthetic froth or the Lami
          formula; nothing is measured on a specimen, so there is no r, RMSE, KS test or confidence
          interval against real data and no comparison with the stated a-priori tolerance on a
          real tissue.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [93, 105], note: "Correct dispersion statistics about 120 deg (E3)", supports: true}
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [312, 345], note: "All seven measurements are model-side; no specimen morphometrics, no goodness-of-fit statistics", supports: false}
      source-traceability:
        value: 58
        rationale: >-
          The module docstring (L1-35) cites Thompson's chapter, pages, figures, the IA identifier
          and page-to-leaf rule, and Farhadifar et al. (2007); the dataset directory carries a
          complete reference.json, bib file and scout manifest with every digest. But the script does
          not load `t1917_018_the_forms_of_tissues_or_cell_a_reference.json` or verify any SHA-256
          at runtime, so the provenance lives beside the code rather than in it.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [1, 35], note: "Docstring cites chapter/pages/figures/IA id and the equation set E1-E5", supports: true}
          - {file: datasets/thompson_1917/t1917-018/t1917_018_the_forms_of_tissues_or_cell_a_reference.json, lines: [1, 20], note: "Reference package exists with digests but is not consumed by v1", supports: false}
      code-traceability:
        value: 62
        rationale: >-
          Functions map one-to-one onto the equation labels E1/E2/E3/E5 used in the reference
          package and the six Lean theorems of `Thompson1917_T1917_018.lean` (Fig. 113 cases, Lami
          iff equal tensions, angle-sum identity, Euler bookkeeping, hexagon closure, Steiner
          inequality) are machine-checked with 0 sorry; `math_kg_loops/thompson1917-t1917-018.yaml`
          links each law to code loci. Some of those loci name functions that only exist in the
          planned v2 (`tensions_from_angles`, `polygon_class_distribution`, `square_lattice_control`).
        evidence:
          - {file: morphoeval/lean/loops/Thompson1917_T1917_018.lean, lines: [39, 207], note: "Six machine-checked theorems plus two lemmas, namespace MathOfBiology.Loop_213", supports: true}
          - {file: morphoeval/math_kg_loops/thompson1917-t1917-018.yaml, lines: [37, 143], note: "Law registry cites code loci not yet present in v1", supports: false}
      repro-package:
        value: 52
        rationale: >-
          Deterministic `np.random.default_rng(1917)` seed, a `--self-test` with nine assertions
          including a determinism check (L348-371), and outputs rendered to fixed paths. Missing:
          runtime SHA-256 verification of inputs, a machine-readable result.json, any CLI
          parameters, and a recorded convergence criterion for the relaxation.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [348, 371], note: "Self-test with determinism and E3 identity checks", supports: true}
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [374, 386], note: "No result.json, no input digest verification, no parameters", supports: false}
    remediation:
      - "Load and SHA-256-verify all four vendored specimens against reference.json; segment the cell-border network of the corneal endothelium and onion epidermis (border channel -> watershed from nucleus/centre markers) and binarise Thompson's Figs. 103 and 124; detect tri-cellular vertices from label images and measure the three interior angles per vertex by circular label sampling at a stated radius; report f3, SD, RMS deviation, median |theta-120| and fraction within the a-priori +/-15 deg tolerance per specimen, with bootstrap CIs."
      - "Implement the equal-tension soap-froth limit (Gamma_bar = 0) with a convergence criterion and T1 edge exchanges, add the orientation-dependent line tension Lambda(phi) = Lambda0 (1 + eps cos 2 phi) of E5 and sweep eps over 0..0.6 (7 points) to show monotone angle dispersion (Fig. 124 regime); add a partition-tension-ratio sweep of E1; expose --eps, --lambda-bar, --gamma-bar, --seed, --steps and --quick CLI flags."
      - "Add negative/ablation controls (Poisson-Voronoi null with matched vertex count, square/brick lattice with four-fold vertices, shuffled-angle null) and goodness-of-fit between the fitted-eps froth angle distribution and each specimen (Pearson r and RMSE of binned histograms, two-sample KS statistic, coefficient of variation); write datasets/thompson_1917/t1917-018/result.json with the verdict and headline numbers, and extend measure_morphoeval() with specimen-side measurements."
