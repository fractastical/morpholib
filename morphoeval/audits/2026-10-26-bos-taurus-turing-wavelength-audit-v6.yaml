# MorphoEval audit v6 (Pass 8: coat mask + scale-matched stats + significance) — 2026-10-26
# Addresses Fable round-2 findings: rectangular-ROI contamination, resolution-
# dependent roughness, aspect-ratio bias, re-drawn heterogeneity, untested
# ranking.  The headline changes: Eden's advantage does NOT survive matched
# measurement.  Builder-assessor (Muse).  Overall 73.8 -> 74.6 (the score
# rises on method quality while the favoured model changes -- the rubric
# scores the simulation package, not the hypothesis).
audit:
  id: 2026-10-26-bos-taurus-turing-wavelength-audit-v6
  rubric_version: 0.1.0
  date: "2026-10-26"
  supersedes_audit_id: 2026-10-26-bos-taurus-turing-wavelength-audit-v5
  assessor: {id: muse-wonder-1.0-high, label: "Muse Wonder 1.0 (builder-assessor)"}
  domain: morphogenesis
  checkpoint: {repository: https://github.com/fractastical/morpholib, commit: 6e00a18b,
               note: "Pass-8 working tree; committed after audit."}
references:
  turing1952: {doi: 10.1098/rstb.1952.0012}
  murray1981: {doi: 10.1016/0022-5193(81)90334-9}
  schnakenberg1979: {doi: 10.1016/0022-5193(79)90042-0}
  mitf2016: {doi: 10.1007/s13258-016-0493-4}
simulations:
  - id: murray-bos-taurus-turing-wavelength
    name: "Turing RD vs melanoblast colonisation (Pass 8: coat-mask, scale-matched, tested)"
    organism: "Bos taurus (Holstein-Friesian, 10 specimens)"
    script: models/1981-murray-bos-taurus-turing-wavelength.py
    output: datasets/bos_taurus_turing_wavelength/bos_taurus_turing_wavelength_comparison.png
    extra_outputs:
      - datasets/bos_taurus_turing_wavelength/bos_taurus_specimens_montage.png
      - datasets/bos_taurus_turing_wavelength/bos_taurus_turing_wavelength_full_animation.gif
    status: evaluated
    source_refs: [turing1952, murray1981, schnakenberg1979, mitf2016]
    summary: >-
      All morphometrics now computed inside a colour-derived coat domain
      (achromatic-coat segmentation, largest component + hole fill) and
      resampled to the 160-px lattice; diameters normalised by sqrt(domain
      area); heterogeneity tissue-attached; 12 seeds; paired Wilcoxon /
      bootstrap across specimens.  Held-out: RD static 6.46, RD growing-het
      3.29, Eden 3.43; Eden wins 4/9, mean diff +0.14 (95% CI -0.80..1.14),
      Wilcoxon p=0.91.  At matched scale the two mechanisms are
      indistinguishable on these statistics -- the Pass 5-6 Eden advantage
      was substantially a resolution artefact, as the Fable audit warned.
      Cow enclave roughness at lattice scale is 7.3-8.2 (median), between
      RD (~5) and Eden (~9).
    scores:
      model-fidelity: {value: 74, rationale: "Tissue-attached heterogeneity and a stated no-dilution limitation improve the growing-domain model's honesty; Eden remains a minimal Eden process without a literature-pinned migration law.", evidence: [{file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [230, 260], note: "simulate_growing Pass-8 docstring: material-coordinate heterogeneity, dilution disclaimer", supports: true}]}
      specimen-match: {value: 60, rationale: "Coat-masked specimen panels now track real patch shapes with background excluded (montage/full animation); model panels unchanged in character -- RD smooth ovals, Eden jagged networks, neither matching patch placement.", evidence: [{file: datasets/bos_taurus_turing_wavelength/bos_taurus_turing_wavelength_full_animation.gif, lines: [0, 0], note: "coat-mask panels (grey = not coat)", supports: true}]}
      parameter-expressivity: {value: 80, rationale: "Unchanged sweeps; 12 seeds now used in the held-out comparison.", evidence: [{file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [600, 640], note: "multi_specimen_comparison 12-seed default", supports: true}]}
      morphometric-validation:
        value: 85
        rationale: "Coat-domain, scale-matched, aspect-corrected morphometrics with paired significance testing and bootstrap CIs; the pipeline now overturns the builder's own earlier conclusion, which is what validation is for. Remaining: coat segmentation is saturation-heuristic (fails where coloured background is achromatic), n=9 held-out specimens limits power, Eden founder density was still selected on cow 01."
        evidence:
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [490, 560], note: "coat_segment + scale_pattern", supports: true}
          - {file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [640, 690], note: "paired_eden_vs_rd with Wilcoxon + bootstrap CI", supports: true}
      source-traceability: {value: 90, rationale: "Unchanged (10 pinned, credited, licensed specimens; Crossref-verified papers).", evidence: [{file: datasets/bos_taurus_turing_wavelength/bos_taurus_turing_wavelength_reference.json, lines: [40, 140], note: "extra_specimens with creators", supports: true}]}
      code-traceability: {value: 74, rationale: "Pass-8 changes carry in-situ Fable-round citations; ROI fractions read from the reference in the main paths (animate paths still duplicate some constants).", evidence: [{file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [490, 530], note: "coat_segment docstring states method + limits", supports: true}]}
      repro-package: {value: 76, rationale: "Self-test green; deterministic; but the full pipeline is now ~100 s and the animation generators duplicate the growing-domain loop (Fable nit, still open).", evidence: [{file: models/1981-murray-bos-taurus-turing-wavelength.py, lines: [700, 740], note: "self-test assertions across passes", supports: true}]}
    remediation:
      - id: R9
        item: "Cite Eden (1961) / a melanoblast migration source for the control; consider a migration-wave (neural-crest front) variant, whose enclaves invade from edges like real Holstein white"
      - id: R10
        item: "Push commits; publish KG nanopubs (steps 9-11) once the checkpoint is on a remote"
      - id: R11
        item: "Independent re-score of the Pass-8 tree before any Eden-vs-RD claim is quoted"
