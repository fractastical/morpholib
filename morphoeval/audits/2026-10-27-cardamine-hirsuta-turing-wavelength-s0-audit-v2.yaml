simulations:
  - id: delphi10000-cardamine-hirsuta-turing-wavelength-s0
    name: "Schnakenberg Turing wavelength on Cardamine hirsuta at 154 µm (Pass 2)"
    organism: "Cardamine hirsuta (hairy bittercress)"
    domain: morphogenesis
    script: models/2026-delphi10000-cardamine-hirsuta-turing-wavelength-s0.py
    output: docs/media/cardamine_hirsuta_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/cardamine_hirsuta_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-cardamine-hirsuta-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, kierzkowski2019, vlad2014, hay2006, fusterpons2024]
    summary: >-
      Pass 2 keeps the same Schnakenberg point (a=0.10, b=0.90, D_u=0.04,
      D_v=0.42, lambda_c=154.1 µm, age 0 Ma, chronoseries 1/1). Measured
      record: dispersion Pearson r = 0.999896, RMSE = 0.001564, nonlinear
      spacing 173.362 µm on both seeds, ablation sigma_max = -0.1016 with
      the control standard deviation falling, sweep wavelengths
      163.9, 173.6, 188.0, 201.0, 217.4 µm (monotonic), specimen foreground
      fraction 0.2825, bounding-box aspect 0.6048, contour circularity
      0.0926, orientation KS 0.0156, radial-FFT Pearson r = 0.9948, GIF
      12 frames at 720x540, CV similarity 96.0. The 12% nonlinear shift
      versus 154.1 µm stays in the record.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) selects a finite critical wavenumber from reaction and diffusion."
        - "Schnakenberg (1979) supplies the kinetics a - u + u^2 v and b - u^2 v."
        - "Hay and Tsiantis (2006), Vlad et al. (2014), and Kierzkowski et al. (2019) establish Cardamine hirsuta as the compound-leaf comparison and tie RCO to domain size rather than to a local wavenumber."
      reconstructed_in_script:
        - "Neumann Schnakenberg integration, dispersion fit, D_v sweep, and equal-diffusion ablation, now scored from the measurement sidecar."
        - "Specimen mask morphometrics and the orientation KS / radial-FFT comparison against the Commons photograph."
      transfer_boundary:
        - "154.1 µm is the classical wavelength of this parameter point, pinned to the slot scale. It is not a length reported by the cited Cardamine papers."
      does_not_claim:
        - "That the herbarium photograph resolves individual 154 µm ocelli."
        - "A predecessor or successor chronospecies. The series length is 1 and the age is 0 Ma."
        - "That matching the plant's silhouette validates the wavenumber. The wavenumber is tested by the dispersion fit and the spacing measurement."
    scores:
      model-fidelity:
        value: 88
        rationale: >-
          Pass 2 keeps the implemented Jacobian, wavenumber law, Neumann
          integrator, and the integer Lean checks. The ablation panel shows
          the equal-diffusion field staying flat on the same color scale as
          the patterned field, which is the negative control the kinetics
          predict. The pigment label remains a reconstruction, so the score
          stays below 95.
        evidence:
          - {file: models/2026-delphi10000-cardamine-hirsuta-turing-wavelength-s0.py, lines: [103, 134], note: "k_c law and Turing margin", supports: true}
          - {file: models/2026-delphi10000-cardamine-hirsuta-turing-wavelength-s0.py, lines: [241, 266], note: "Equal-diffusion ablation returns sigma_max and the flat field", supports: true}
          - {file: morphoeval/lean/loops/Loop_3140_cardamine_hirsuta_turing_wavelength_s0.lean, lines: [13, 28], note: "k_c cross-multiply, squared inequality, diffusion ratio, negative trace", supports: true}
      specimen-match:
        value: 86
        rationale: >-
          Last-frame CV similarity against the Commons photograph is 96.0
          (orientation, radial FFT, coherency, occupancy), with radial-FFT
          Pearson r = 0.9948. The comparison figure shows the same plant.
          The score stays under 90 because the ocellus texture is a model
          modulation, not a micrograph at 154 µm.
        evidence:
          - {file: docs/media/cardamine_hirsuta_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 720x540 growth GIF", supports: true}
          - {file: docs/media/cardamine_hirsuta_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Side-by-side specimen and field", supports: true}
          - {file: models/2026-delphi10000-cardamine-hirsuta-turing-wavelength-s0.py, lines: [338, 399], note: "CV similarity and KS against the specimen crop", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          Selected wavelength increases at every step of D_v/D_u in
          {10.5, 13.75, 20, 27.5, 40}: 163.9, 173.6, 188.0, 201.0, 217.4 µm.
          The self-test asserts that sequence is strictly increasing. The
          equal-diffusion point is a separate switch that kills the pattern
          rather than a point on that curve.
        evidence:
          - {file: models/2026-delphi10000-cardamine-hirsuta-turing-wavelength-s0.py, lines: [219, 239], note: "max-growth wavenumber and the sweep", supports: true}
          - {file: models/2026-delphi10000-cardamine-hirsuta-turing-wavelength-s0.py, lines: [704, 704], note: "Self-test asserts sweep monotonicity", supports: true}
      morphometric-validation:
        value: 88
        rationale: >-
          Dispersion-band Pearson r = 0.999896 against reference gate 0.98,
          RMSE = 0.001564 against a 0.05 tolerance, nonlinear spacing
          173.362 µm against the 154.1 µm law (values differ on purpose),
          ablation sigma_max = -0.1016 against 0, and the specimen mask
          metrics differ from their priors. Orientation KS is about 0.016,
          not zero. n = 1 photograph and two seeds.
        evidence:
          - {file: models/2026-delphi10000-cardamine-hirsuta-turing-wavelength-s0.py, lines: [551, 664], note: "measure_morphoeval rows with value != reference", supports: true}
          - {file: models/2026-delphi10000-cardamine-hirsuta-turing-wavelength-s0.py, lines: [268, 293], note: "Specimen segmentation", supports: true}
          - {file: models/2026-delphi10000-cardamine-hirsuta-turing-wavelength-s0.py, lines: [699, 710], note: "Self-test on r, RMSE, ablation, CV, and radial Pearson r", supports: true}
      source-traceability:
        value: 92
        rationale: >-
          DOIs were checked on Crossref while scouting. The specimen file
          is the Commons public-domain JPEG, SHA-256
          1c268fecb3660b310d99f688a13a679c347aabc4e2522eace472f8c985bf8510,
          distinct from the species-gallery copy. Scale 154 µm and age 0 Ma
          are in the reference JSON, the README, and the figure title.
        evidence:
          - {file: datasets/cardamine_hirsuta_turing_wavelength_s0/scout_manifest.json, lines: [1, 30], note: "Slot 3140 scout dossier", supports: true}
          - {file: datasets/cardamine_hirsuta_turing_wavelength_s0/paper_citations.bib, lines: [1, 70], note: "Verified bibliographic records", supports: true}
          - {file: datasets/cardamine_hirsuta_turing_wavelength_s0/cardamine_hirsuta_turing_wavelength_s0_reference.json, lines: [8, 30], note: "154.1 µm and 0 Ma", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          Each of k_c, the instability inequality, and the eight-wavelength
          Holocene cutoff has a Lean theorem and a Python function. The
          math-kg YAML names those declarations. Pass 2 does not add a
          second formalization.
        evidence:
          - {file: morphoeval/math_kg_loops/delphi10000-cardamine-hirsuta-turing-wavelength-s0.yaml, lines: [24, 55], note: "Three laws with Lean loci", supports: true}
          - {file: morphoeval/lean/loops/Loop_3140_cardamine_hirsuta_turing_wavelength_s0.lean, lines: [32, 46], note: "Mode count, cell cutoff, chronoseries terminus, margin lemma", supports: true}
      repro-package:
        value: 90
        rationale: >-
          Deterministic seeds, pinned input hashes, and a self-test that
          failed closed on the numerical gates before this audit was scored.
          Re-running --self-test regenerates the PNG and the GIF.
        evidence:
          - {file: models/2026-delphi10000-cardamine-hirsuta-turing-wavelength-s0.py, lines: [78, 84], note: "SHA-256 verification of the five dataset files", supports: true}
          - {file: datasets/cardamine_hirsuta_turing_wavelength_s0/README.md, lines: [14, 22], note: "Documented invocation", supports: true}
