    claim_boundary:
      reported_in_source:
      - 'Dobzhansky & Spassky 1959: D. paulistorum is a willistoni-group cluster of incipient semispecies. Holocene,
        0 Ma.'
      - 'Turing 1952 and Maini, Painter & Chau 1997: a finite critical wavenumber exists when tr(J)<0, det(J)>0,
        and the inhibitor diffuses sufficiently faster than the activator.'
      - 'Schnakenberg 1979: the two-species kinetics used here.'
      reconstructed_in_script:
      - Placement of that wavenumber on a 2.417 µm intra-ocellar pigment stripe (campaign rung 3_subcellular_um,
        detail s0).
      - Catalog comparison with Drosophila orena (89.44 µm, 37 packings) and Drosophila persimilis (116.7 µm, 48
        packings), both extant at 0 Ma.
      transfer_boundary:
      - Gompel et al. 2005 document Drosophila wing-pigment cis-regulation. That result is not an ocellar wavelength
        measurement and is not used as one.
      does_not_claim:
      - That Dobzhansky measured 2.4 µm.
      - That orena → paulistorum → persimilis is a stratigraphic ancestor chain.
      - That the habitus GIF is an electron micrograph of pigment granules.
