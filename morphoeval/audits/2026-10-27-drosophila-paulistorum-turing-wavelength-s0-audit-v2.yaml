# Pass 2 audit — Drosophila paulistorum 2.4 µm ocellar Turing wavelength (slot 3197).
# Supersedes the Pass 1 audit after the diffusivity magnitude was set so that the
# maximum linear growth rate, and the nonlinear stripe field, sit at 2.417 µm.

