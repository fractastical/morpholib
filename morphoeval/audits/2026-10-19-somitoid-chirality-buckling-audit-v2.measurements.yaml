      reconstructed_in_script:
      - 2D 32-vertex apico-basal differential interfacial tension relaxation solver for an N=16 wedge-cell somite
        rosette matching the exact analytical polygon equilibrium ratio (WT L_ap/L_bas = 0.3030 vs 0.3030 analytical
