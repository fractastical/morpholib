        rosette segmentation on somitoid_rosette_specimen.jpg (45.38 px mean spacing, CV = 0.2010)
      transfer_boundary:
      - 2D cross-sectional vertex mechanics of an N-cell epithelial somite rosette and Young-Dupre inter-somitic
