# MorphoEval audit — Cervera–Levin–Mafe gap-junction synthesis, 2026-10-17
# (first audit; independent assessment at checkpoint e71ca55).
#
# The high-level reaction–diffusion premise is supported by the 2021 abstract
# and an accessible author presentation: two antagonistic axial morphogens, an
# independent orthogonal morphogen, and altered patterns after partial
# gap-junction blockade.  The full 2021 and 2020 papers were not accessible,
# however, so the script's mutual-annihilation equations, flux implementation,
# constants and thresholds could not be verified as the published equations.
# The added rusty-matter circuit is a separate, explicitly educational model,
# not a demonstrated port of the cited 2020 ion-channel model; its pinned Rust
# source was fetched and the Python constants and update structure were checked.
#
# Two output claims are materially unsupported.  The advertised (f2,f3)
# morphospace is constant along f3 because _f3_val is never used, and its
# f2=0.58 phenotype boundary is imposed rather than derived (the implemented
# solver gives x*=0.552 there, not approximately 0.58).  The crop-specific f2
# values, wound gains, timing rescaling and head thresholds are hand-set without
# cited calibration.  Moreover, the CSV reconstructs each crop wavefront as
# 0.50 + 0.26*shift although shift was defined using a 0.13 denominator, so its
# reported displacement is exactly twice the simulated displacement.
#
# The real Schmidtea photograph contributes only a silhouette mask on which
# colours are painted; it is not measured.  The distinct wild-type and
# double-head outcomes are Planform cartoons selected by a 0.55 readout
# threshold, not generated anatomy.  PlanformDB frequencies are plotted beside
# model indices, but no error, fit, held-out test or specimen morphometric is
# computed.  The self-test establishes file integrity and approximate parity
# with synthetic rusty-matter traces (tolerance 0.035); it does not validate the
# biology, reaction–diffusion solver, thresholds, CSV transformations or plots.
# Repeated runs were nevertheless byte-identical for PNG, CSV and GIF.
#
# Scores are on the rubric's 0-100 scale.  Line numbers refer to files at the
# checkpoint commit recorded below; [0, 0] denotes generated image/CSV evidence.

