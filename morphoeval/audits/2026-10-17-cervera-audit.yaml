  rubric_version: 0.1.0
  date: "2026-10-17"
  assessor:
    id: gpt-5.6-sol
    label: "GPT-5.6 Sol (Cursor agent)"
    homepage: https://openai.com
  publisher_orcid: null
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  code_creators:
    - id: joel-dietz
      name: "Joel Dietz"
      orcid: null
      github: https://github.com/fractastical
  domain: morphogenesis
  tracked_by: https://github.com/fractastical/morpholib/issues/1
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: e71ca55
    environment:
      python: "3.14.7"
      numpy: "2.5.4"
      matplotlib: "3.10.7"
      Pillow: "12.0.0"
      scipy: "1.16.3"
      scikit-image: "0.26.0"
    note: >-
      External inputs are three vendored, SHA-256-pinned JSON fixtures derived
      from MesmerPrism/rusty-matter at commit
      ad111fa7ecfd8f43d292ff3b1d27d3af2741d828 and PlanformDB 2.5.0, plus the
      cached Wikimedia Commons Smediterranea.jpg photograph (SHA-256 pinned in
      the script; CC BY 2.5).  The pinned rusty-matter repository was fetched
      and inspected at that commit.  The 2021 abstract and an author
      presentation were accessible, but the full 2021 and 2020 publisher
      articles were not; equation-level fidelity is therefore not asserted.
      Outputs were regenerated from the repository root with MPLBACKEND=Agg
      MPLCONFIGDIR=/tmp/mplcfg ./venv/bin/python
      "2021-Cervera–Levin–Mafe.py" --self-test, then --no-show, then --gif
      /tmp/cervera_assess.gif.  The PNG, CSV and 46-frame GIF were regenerated
      a second time and were byte-identical.

