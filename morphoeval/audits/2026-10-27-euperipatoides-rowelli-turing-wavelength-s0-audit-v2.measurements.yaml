    claim_boundary:
      reported_in_source:
      - Turing 1952 dispersion relation for a two-species reaction-diffusion system.
      - Schnakenberg 1979 kinetics du/dt = a − u + u²v, dv/dt = b − u²v.
      - E. rowelli ocelli are about 100 µm across, with screening pigment and a rhabdom of microvilli (Mayer 2006;
        Kirwan 2018; Ljungholm & Nilsson 2021).
      - Photoreceptor centres are about 2.5 µm apart. Kirwan 2018 figures microvilli with a 1 µm scale bar.
      reconstructed_in_script:
      - γ is solved so argmax σ(k) = 2π × 14. Sub-bin DCT power peaks at 14.072 cycles (1.114 µm).
      - In-band max Re σ is +8571 (full), −5662 (Du = Dv), and −22114 (Dv < Du).
      - Orientation-histogram L1 between the Couch photograph and the GIF last frame is 0.0134.
      - N = 89 detail wavelengths across a 100 µm eye at 0 Ma, versus N = 0 below a 10 µm Cambrian floor.
      transfer_boundary:
      - 1.12 µm is the assigned detail scale, not a Turing wavelength measured by those papers.
      - The 15.68 µm patch is magnified onto the body mask for display. Macroscopic annuli are not assigned period
        1.12 µm.
      does_not_claim:
      - That the 0.5% residual between 1.114 µm and 1.12 µm is zero.
      - That the Couch photograph is an electron micrograph at 1.12 µm.
      - A successor chronospecies, or a second assessor.
      - Cryptographic nanopub signatures (no local nanopub profile).
