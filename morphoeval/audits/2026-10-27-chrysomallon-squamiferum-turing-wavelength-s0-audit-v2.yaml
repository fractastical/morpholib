simulations:
  - id: delphi10000-chrysomallon-squamiferum-turing-wavelength-s0
    name: "Schnakenberg fastest-mode wavelength at 2.0 nm on Chrysomallon squamiferum (Pass 2)"
    organism: "Chrysomallon squamiferum (Holocene extant, 0 Ma)"
    script: models/2026-delphi10000-chrysomallon-squamiferum-turing-wavelength-s0.py
