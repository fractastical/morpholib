    source_refs: [turing1952, schnakenberg1979, waren2003, yao2010, chen2015, chen2015gigantopelta, sun2020, wong2025, skinner1964]
    summary: >-
      Pass 2 scales D_u and D_v so the maximum of σ(k) lies on the requested
      wavelength, then applies one nonlinear correction learned at 2.0 nm.
      Sweep targets 1.35, 1.70, 2.00, 2.35, 2.80, 3.30 nm give PDE peaks
      1.229, 1.559, 1.935, 2.211, 2.620, 2.970 nm (Pearson r=0.9964, RMSE=0.182 nm,
      residual CV=0.043). Equal-diffusion ablation ratio is 6.5e-12.
      Paratype mask foreground fraction 0.394 (prior 0.55), circularity 0.118
      (circle would be 1), specimen coherency 0.310 versus composite 0.345,
      intensity KS=0.248. GIF is 12 frames at 640×480. Chronoseries 1/1 at 0 Ma;
      successor none; comparative predecessor is sclerite-less Gigantopelta.
    claim_boundary:
      reported_in_source:
        - "Iron-sulfide sclerites (Warén 2003); armor mechanics without a Turing equation (Yao 2010)"
        - "Sclerite-less Gigantopelta as the comparative predecessor (Chen 2015; Wong 2025)"
        - "Turing 1952 dispersion and Schnakenberg 1979 kinetics"
      reconstructed_in_script:
        - "Fastest-mode diffusivity calibration, six-point PDE wavelength sweep, equal-diffusion ablation"
        - "Paratype segmentation, KS test, coherency, and circularity"
        - "Copper activator overlay on the sclerite mask in a 12-frame GIF"
      transfer_boundary:
        - "2.0 nm is the assigned detail-scale critical wavelength (~2 greigite cells), not a measured pigment stripe."
        - "Matrix-confined diffusivities are assumed so that a molecular wavelength can be selected."
      does_not_claim:
        - "Does not claim a TEM measurement of 2.0 nm nuclei"
        - "Does not claim the copper spots are the animal's visible color"
        - "Does not claim a fossil chronospecies before or after 0 Ma"
