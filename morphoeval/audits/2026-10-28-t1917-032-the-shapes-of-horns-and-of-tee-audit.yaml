# MorphoEval audit — Thompson (1917) T1917-032 "Teeth and tusks grow by the same spiral/torsion
# geometry (St Venant torsion curves)" — Pass 1 (v1) baseline, 2026-10-28
#
# Evaluates `thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py` as rendered with
# `--pass1` (coarse single-grid pole search, five fixed model regimes, no sweep / ablation panel).
# Weighted overall ~ 60.7 / 100.  Pass 1 verdict on the claim: MIXED
#   - mammoth-tusk centreline: log spiral RMSE 37.3 px < circle null 41.8 px (Pearson r = 0.963 on ln r vs θ)
#     but the smoothed curvature changes sign 3 times root → tip, so the 2-D projection is NOT a plane log
#     spiral (the tip hook reverses) — consistent with Thompson's own "curve of double curvature" caveat;
#   - narwhal groove inclination α ≡ 70.2° vs Kiladze & Chernova (2018) 66.9 ± 3.3° (z = +1.00, inside range);
#   - St Venant triangular-prism warping reproduces 6 alternating sectors / 1 sign change per face (Fig. 321).
# Remediation targets: 3-D screw-accretion fit to the projected centreline (τ = 0 vs τ > 0 nested models),
# systematic parameter-regime sweep, negative/ablation controls, proper goodness-of-fit statistics
# (bootstrap CI, one-sample KS on standardised residuals), width-scaled smoothing, CLI parameters.

