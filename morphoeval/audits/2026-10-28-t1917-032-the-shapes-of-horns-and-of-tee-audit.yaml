simulations:
  - id: thompson1917-t1917-032
    name: "Thompson (1917) T1917-032 — teeth & tusks: differential-accretion log spiral + St Venant torsion"
    organism: "Mammuthus primigenius tusk (Museum Wiesbaden); Monodon monoceros tusk (torsion analogue)"
    script: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py
    output: docs/media/t1917_032_the_shapes_of_horns_and_of_tee_comparison.png
    extra_outputs:
      - docs/media/t1917_032_the_shapes_of_horns_and_of_tee_growth.gif
      - datasets/thompson_1917/t1917-032/result.json
    status: evaluated
    source_refs: [thompson1917, stvenant1856, kiladze2018, kingsley1988, raup1966]
    claim_boundary:
      reported_in_source:
        - "Thompson pp. 619, 633-634: constant growth-rate ratio across the basal zone yields a logarithmic spiral; tooth, tusk, beak, claw all follow it; elephant tusk tip ~ spiral pole; long tusks (mammoth, Babirussa) are curves of double curvature"
        - "Thompson pp. 621-623 + Fig. 321: St Venant torsion warps non-circular prisms into anticlastic surfaces whose contour lines explain the sinuous growth lines of trihedral horns"
      reconstructed_in_script:
        - "Algebraic accretion law κ = (v_max − v_min)/(w v̄) = Δ/w and its gnomonic closure sin ψ = Δ/c (E4-E5)"
        - "Screw-accretion frame update Ω = κ b + τ n generating circle / log spiral / helix / helico-spiral (E6)"
        - "Kiladze chord ratio tan α = π/(2 tan φ) conversion from a locally measured groove inclination (E7)"
      transfer_boundary:
        - "The narwhal tusk is a labelled analogue for the torsion component; Thompson's 1917 chapter never names the narwhal"
        - "A single 2-D museum photograph projects a 3-D helico-spiral tusk; plane-spiral tests are projection-limited"
      does_not_claim:
        - "No growth-rate (v_max, v_min) or CT data: λ and Δ are inferred from geometry, not measured"
        - "No handedness determination from the narwhal photograph (tip orientation unknown)"
    summary: >-
      Pass 1 baseline of `t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py` (overall ~60.7/100).
      Implements E1-E9 (equiangular spiral, accretion curvature law, screw accretion, St Venant warping and
      uniform-torsion helix), segments the SHA-256-locked mammoth tusk, fits a log spiral about a searched pole
      against a circle null (RMSE 37.3 vs 41.8 px, r = 0.963), measures narwhal groove inclination by structure
      tensor (α ≡ 70.2° vs 66.9 ± 3.3° published, z = +1.0) and reproduces the six-sector St Venant torsion curves.
      Weaknesses: the 3-D screw model is never fitted to the specimen, curvature changes sign three times so the
      plane-spiral reading fails, regimes are five hand-picked points, statistics are thin (two-sample KS misuse,
      no CI / bootstrap, no ablation controls beyond the circle fit), no CLI parameterisation.
    scores:
      model-fidelity:
        value: 62
        rationale: >-
          E1-E3 (`log_spiral_r`, `whorl_expansion`, `gnomon_radius`, L112-L131), E4-E6 screw accretion
          (`grow_tooth`, L146-L181), E8-E9 St Venant warping (`tri_warp`, `ellipse_warp`,
          `st_venant_triangle_field`, L186-L223) and E7 helix (L228-L242) are implemented as published and
          mirrored by 17 Lean theorems, but the specimen test uses only the 2-D plane-spiral special case;
          the twisted (τ > 0) model that Thompson invokes for long tusks is rendered, never fitted.
        evidence:
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [112, 181], note: "E1-E6 equiangular spiral, gnomon, accretion curvature and screw-accretion growth", supports: true}
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [186, 242], note: "E8-E9 St Venant warping field and E7 helix slope / Kiladze conversions", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_032.lean, lines: [31, 215], note: "4 laws, 17 theorems, 0 sorry, core Lean 4 only", supports: true}
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [445, 470], note: "run_analysis fits only the plane log spiral + circle; τ > 0 helico-spiral never fitted to the projected centreline", supports: false}
      specimen-match:
        value: 50
        rationale: >-
          HSV segmentation + skeleton longest path recovers the mammoth tusk centreline and width
          (`segment_mammoth_tusk`, `tusk_centreline_profile`, L247-L328) and the overlay beats the circle null,
          but the smoothed curvature changes sign 3 times (root bend, straight shaft, reversed tip hook) so the
          plane log spiral mis-tracks root and tip; the narwhal panel is an analogue; no comparison against
          Thompson's own tusk description beyond text.
        evidence:
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [247, 328], note: "HSV segmentation, skeleton longest path, width via distance transform, curvature profile", supports: true}
          - {file: docs/media/t1917_032_the_shapes_of_horns_and_of_tee_comparison.png, lines: [0, 0], note: "Panel (a) overlay: log spiral tracks the shaft but diverges at root and reversed tip hook; panel (c) 3 curvature sign changes", supports: false}
          - {file: datasets/thompson_1917/t1917-032/result.json, lines: [1, 57], note: "kappa_sign_changes = 3 recorded; T1_single_sign_curvature = false", supports: false}
      parameter-expressivity:
        value: 40
        rationale: >-
          Only five hand-picked (λ, c, τ) regimes are rendered in panel (f) (L477-L483); no systematic sweep of
          ψ, λ, taper c or twist τ, no CLI overrides, and the monotone effects proved in Lean
          (curvature falls with width; helix slope rises with ρ) are not demonstrated numerically across ranges.
        evidence:
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [477, 483], note: "Five fixed regimes; no sweep", supports: false}
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [803, 820], note: "CLI exposes only --self-test / --pass1", supports: false}
      morphometric-validation:
        value: 55
        rationale: >-
          `measure_morphoeval()` (L736-L755) returns 11 measurements with one literature reference
          (Kiladze & Chernova 2018, z = +1.0 within 2 SD) and a St Venant sector count against theory, plus
          CV(κ·w) < CV(κ) (3.59 vs 12.0); but the KS statistic is a two-sample test between the spiral and
          circle residual sets (p = 0 is uninformative), there is no bootstrap CI on ψ or on the groove angle,
          no shuffled-width control for the accretion law, and no along-shaft test of tan α vs 1/d.
        evidence:
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [736, 755], note: "11 measurements incl. Kiladze reference and CV(κ w)", supports: true}
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [459, 466], note: "two-sample KS between residual sets instead of a one-sample residual normality / CV test", supports: false}
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [378, 391], note: "accretion statistics without bootstrap or shuffle control", supports: false}
      source-traceability:
        value: 85
        rationale: >-
          Reference JSON pins SHA-256 of 5 dataset files verified at import (`load_reference`, L86-L94),
          Commons licence/author metadata, IA leaf index for Figs. 321-322, DOIs for Kiladze 2018, Kingsley 1988,
          Raup 1966 and the St Venant 1856 memoir; the Kiladze table is vendored as CSV with its PMC id.
        evidence:
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [78, 106], note: "SHA-256 fail-closed verification and Kiladze Table 1 loader", supports: true}
          - {file: datasets/thompson_1917/t1917-032/t1917_032_the_shapes_of_horns_and_of_tee_reference.json, lines: [1, 140], note: "Equations E1-E9, regimes, dataset digests and licences", supports: true}
      code-traceability:
        value: 80
        rationale: >-
          Module header maps E1-E9 to Thompson pages and to the four Lean laws; each function docstring cites
          its equation number and Lean declaration; KG yaml loci verified by `verify_integrity.py`.
        evidence:
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [1, 40], note: "Equation-to-page and Lean-law traceability in the module header", supports: true}
          - {file: morphoeval/math_kg_loops/thompson1917-t1917-032.yaml, lines: [1, 105], note: "code_locus / lean_locus pass integrity and formula-alignment checks", supports: true}
      repro-package:
        value: 72
        rationale: >-
          Fixed seed, deterministic `measure_morphoeval` (asserted twice-equal in `run_self_test`, L758-L800),
          13 self-test assertions mirroring the Lean laws, documented invocation; but library versions are not
          pinned in the script, smoothing scale (σ = 50 px) is a hand-set constant, and `--pass1` vs full differ
          only in the pole grid.
        evidence:
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [758, 800], note: "Self-test suite incl. synthetic log-spiral recovery and determinism", supports: true}
          - {file: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py, lines: [304, 328], note: "Hand-set smoothing σ and trim constants, not width-scaled", supports: false}
    remediation:
      - "Fit the 3-D screw-accretion model (E6: ψ or Δ/c, twist τ, taper, view rotation, scale) to the projected mammoth centreline and compare nested τ = 0 (plane spiral) vs τ > 0 (helico-spiral) by RMSE / AIC to test Thompson's 'curve of double curvature'."
      - "Add a systematic parameter-regime sweep over ψ (20-85°), λ, taper c and τ demonstrating the Lean-proved monotonicities numerically and rendering a morphospace panel."
      - "Add negative / ablation controls: Archimedean spiral fit, shuffled-width control for CV(κ·w), τ = 0 ablation, circular-section (a = b) St Venant null."
      - "Replace the two-sample KS misuse by a one-sample KS on standardised residuals; add bootstrap CIs for ψ, Pearson r and the narwhal groove angle; regress tan α on 1/d along the shaft for the uniform-torsion prediction."
      - "Width-scale the centreline smoothing, expose CLI overrides (--psi, --lam, --taper, --tau, --sigma-frac), and record library versions in result.json."
