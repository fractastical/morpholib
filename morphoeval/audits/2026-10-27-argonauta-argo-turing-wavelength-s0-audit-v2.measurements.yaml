    claim_boundary:
      reported_in_source:
      - Turing (1952) selects a finite critical wavenumber when the inhibitor out-diffuses the activator and the
        reaction Jacobian is stable without diffusion.
      - Gierer & Meinhardt (1972) and Murray (1981) place spots and ocelli in that class.
      - Finn & Norman (2010) describe the female Argonauta argo brood shell as a buoyancy organ.
      reconstructed_in_script:
      - Critical radial mode fitted to the 100 µm plate, length unit set so analytical λ_c equals the measured 170.03
        µm period.
      - Procedural Gaussian grain (seed 3121), amplitude chosen by a sweep of CV similarity. Phases are not copied
        from the plate.
      - Equal-diffusion ablation and a γ sweep.
      transfer_boundary:
      - The CC0 whole-shell photograph is a scale control (rib autocorrelation fraction 0.088 versus ocellus period
        fraction 0.234), not a 95 µm measurement. It has no scale bar.
      does_not_claim:
      - Finn & Norman did not measure a 95 µm wavelength.
      - The gallery plate is a prepared species-gallery image, not a Finn figure and not a population sample.
      - D_u and D_v are not measured diffusivities.
      - No predecessor chronospecies is claimed. The series is Holocene 1/1 at 0 Ma.
