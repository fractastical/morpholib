    claim_boundary:
      reported_in_source:
      - Dürer heads redrawn in rectangular (Fig. 364) and oblique (Fig. 366) nets; Hough digitisation of the pinned
        scan gives omega = 81 / 99 deg, i.e. |k| ~ 0.15
      - Camper's facial angle 'is the index to a general deformation' (p. 742 footnote); no measurements in the
        source
      reconstructed_in_script:
      - E1 stretch, E3 shear with k = -cot(omega), E4 affine, E5 tan(phi') = tan(phi) + k; Dürer sub-family fit
        (5 dof) in the Camper frame vs scale+shift null and affine bound
      - 12 ordered pairs of 4 accepted photographs, landmark-only and dense (30 semilandmarks) configurations, LOO-CV,
        noise floor, controls
      transfer_boundary:
      - 2-D soft-tissue silhouettes from photographs, not skulls or 3-D form; Commons photographs are an analogue
        of Camper's drawn series and are labelled as such
      - the Camper horizontal is approximated by the photograph horizontal after a declared deskew; +/-5 deg pose
        perturbation moves median R_Dürer 0.45 -> 0.37-0.40
      does_not_claim:
      - anything about populations or 'types'
      - growth or developmental mechanism
