    claim_boundary:
      reported_in_source:
      - Turing (1952) reaction-diffusion and a critical wavelength; Gierer and Meinhardt (1972) activator-inhibitor
        kinetics; Murray (1981) the critical-wavenumber formula used for prepatterns.
      - Haeckel (1904) Kunstformen der Natur, Tafel 21, is a published drawing captioned Acanthometra.
      - Decelle et al. (2012) describe living acantharians. They do not report a 206 nm pigment period.
      reconstructed_in_script:
      - Schnakenberg Jacobian at (a, b) = (0.14, 0.76), k_c^2 = (Dv f_u + Du g_v) / (2 Du Dv), and a six-point gamma
        sweep on a periodic 96x96 patch.
      - Equal-diffusion ablation. Spine-axis angles measured on the vendored plate crop.
      transfer_boundary:
      - 206 nm (2.064e-7 m, log10 -6.685) is the assigned detail scale. The length unit is chosen so the analytical
        wavelength equals that number. The plate's scale is the printed drawing, not 206 nm.
      - Chronoseries 1/1 at 0 Ma. There is no fossil predecessor in this slot. The comparison is with a 412 nm octave
        on a 1339 nm patch (6 waves versus 3).
      does_not_claim:
      - That celestite spicules of A. pellucida have been shown to form by this Schnakenberg system.
      - That Tafel 21 figure 2 is a photograph of the type of A. pellucida.
      - That the plate resolves a 206 nm carrier.
