    fossil_lineage_group: "Sophophora suzukii–biarmipes Wing-Spot Clade"
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, gompel2005, prudhomme2006, atallah2014, koshikawa2020, kondo2010]
    summary: >-
      Pass 1. Schnakenberg kinetics with the Turing onset wavenumber calibrated
      so lambda_c = 2.046 µm at age 0 Ma. A pure-u mode kick gave dispersion
      Pearson r = 0.970, under the 0.98 gate. The noise-seeded field is a
      labyrinth (spacing CV 0.37). Subobscura (f_u < 0) and equal diffusion
      stay flat, but the first figure autoscaled that roundoff into fake
      stripes. Specimen Otsu metrics are real and not equal to their priors.
      The McEvey plate does not resolve 2.046 µm.
    claim_boundary:
      reported_in_source:
        - "Male D. suzukii has an apical wing spot; the female has a serrated ovipositor (Atallah 2014)."
        - "Spot presence in the suzukii–biarmipes clade is a yellow cis-regulatory gain (Gompel 2005; Prud'homme 2006; Koshikawa 2020)."
        - "A two-species reaction-diffusion system selects a finite onset wavenumber k_c (Turing 1952)."
      reconstructed_in_script:
        - "Schnakenberg a=0.037, b=1.284, D_v/D_u=12.6, with D_u solved so lambda_c = 2.046 µm."
        - "Subobscura is the same diffusivities with a=0.52, b=0.18 so f_u = -17/35."
        - "Takahashii is the same kinetics with diffusivities multiplied by 1.44, so lambda_c = 2.4552 µm."
      transfer_boundary:
        - "The 2.046 µm value is the campaign detail-scale assignment, not a published granule measurement."
        - "The McEvey plate anchors the animal and the wing-spot dimorphism. Its pixels are coarser than 2 µm."
      does_not_claim:
        - "That yellow or ebony enzyme kinetics are the Schnakenberg reactions."
        - "That D. takahashii has been measured at a 2.455 µm pigment wavelength."
        - "That subobscura, suzukii and takahashii form a stratigraphic ancestor chain. All three are extant (0 Ma)."
    scores:
      model-fidelity:
        value: 84
        rationale: >-
          Onset wavenumber, Jacobian trace/determinant, and sigma(k) match Turing 1952
          and Schnakenberg 1979, and D_u is solved so lambda_c is 2.046 µm. The first
          numerical sigma used a pure-u kick, which does not isolate the unstable
          eigenvector, so the dispersion correlation was 0.970 rather than the law.
          Kinetics are phenomenological.
        evidence:
          - {file: models/2026-delphi10000-drosophila-suzukii-turing-wavelength-s0.py, lines: [88, 114], note: "onset k_c^2 and sigma(k)", supports: true}
          - {file: morphoeval/lean/loops/Loop_3207_drosophila_suzukii_turing_wavelength_s0.lean, lines: [36, 55], note: "trace < 0, det > 0, subobscura f_u < 0", supports: true}
      specimen-match:
        value: 74
        rationale: >-
          The comparison figure places the McEvey male/female plate beside the carrier.
          The noise-seeded field is a melanin-colored labyrinth, not a portrait of the fly.
          The growth GIF ends on the real plate (12 frames, 960×640). The first null-control
          panel autoscaled 1e-15 roundoff into visible stripes, which misrepresents subobscura.
        evidence:
          - {file: docs/media/drosophila_suzukii_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen plate beside suzukii, subobscura, takahashii fields", supports: true}
          - {file: docs/media/drosophila_suzukii_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame growth, 960×640, last frame is the adult plate", supports: true}
      parameter-expressivity:
        value: 82
        rationale: >-
          Diffusivity scale s moves the analytical wavelength as sqrt(s), and the fastest
          PDE mode follows it (sweep r = 0.997, monotonic). Subobscura turns the band off
          by flipping the sign of f_u. The stripe-seed lock to the 12-wave window mode is
          not yet part of this pass's scored claim.
        evidence:
          - {file: models/2026-delphi10000-drosophila-suzukii-turing-wavelength-s0.py, lines: [226, 259], note: "wavelength_sweep over diffusivity scale s", supports: true}
          - {file: models/2026-delphi10000-drosophila-suzukii-turing-wavelength-s0.py, lines: [61, 63], note: "TAK_SCALE = 1.44 and subobscura a, b", supports: true}
      morphometric-validation:
        value: 78
        rationale: >-
          Specimen foreground fraction 0.203 (prior 0.40), melanin fraction 0.028 (prior 0.10),
          left-right darkness -5.3 gray (null 0), abdominal troughs 7 (tergite prior 6),
