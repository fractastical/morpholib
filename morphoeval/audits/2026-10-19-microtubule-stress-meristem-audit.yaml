    name: "Bozorg et al. (2014), Sampathkumar et al. (2014), Hamant et al. (2008) & Uyttewaal et al. (2012) shoot apical meristem pressurized shell stress tensor, stress-vs-strain CMT alignment, and katanin organ boundary morphogenesis"
