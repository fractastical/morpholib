    status: evaluated
    source_refs:
      - bozorg2014
      - sampathkumar2014
      - hamant2008
      - uyttewaal2012
    summary: >-
      Pass 1 (v1) baseline evaluation of `2008-hamant-microtubule-stress-meristem.py`
      (weighted score: 54.0/100). The Pass 1 baseline script evaluates only algebraic
      Young-Laplace sphere and cylinder formulas (`compute_baseline_shell_stresses`,
      L25-40) without a 2D/3D finite-element or vertex shell turgor stress + anisotropic
      viscoplastic Lockhart growth solver across all 4 canonical SAM zones (Central Dome
      K > 0, Peripheral Flank, Organ-Meristem Saddle Boundary K < 0, and Cylindrical Stem),
      without the Bozorg et al. (2014) stress-vs-strain directional cue discrimination
      experiment, without laser cell-ablation ring reorientation or lateral compression
      clamp perturbations, without `bot1`/`ktn1` katanin or Oryzalin microtubule
      depolymerization controls, and without structure-tensor / cell-wall segmentation of
      the vendored *Arabidopsis thaliana* shoot apical meristem micrograph.
    scores:
      model-fidelity:
        value: 54
        rationale: >-
          Computes only closed-form algebraic sphere and cylinder Young-Laplace stress
          ratios (`compute_baseline_shell_stresses`, L25-40), omitting the negative-Gaussian-curvature
          organ-meristem saddle boundary (K = kappa_1 * kappa_2 < 0), the Bozorg et al.
          (2014) stress-vs-strain feedback comparison, anisotropic viscoplastic Lockhart
          cell-wall growth, laser single-cell ablation ring stress reorientation, and
          katanin (`bot1`/`ktn1`) / Oryzalin feedback gain perturbations.
        evidence:
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [25, 40], note: "Algebraic sphere/cylinder Young-Laplace formula only; omits saddle boundary FEM, stress-vs-strain cue comparison, ablation ring, and katanin/oryzalin controls", supports: true}
      specimen-match:
        value: 44
        rationale: >-
          Vendors `datasets/microtubule_stress_meristem/arabidopsis_meristem_boundary_specimen.jpg`
          on disk, but Pass 1 does not load, segment, or compute structure-tensor cell-wall
          nematic orientation and boundary crease curvature from the histological specimen.
        evidence:
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [71, 106], note: "Renders 2-panel schematic bar chart without loading or segmenting the Arabidopsis SAM micrograph", supports: false}
      parameter-expressivity:
        value: 52
        rationale: >-
          Evaluates only a single static parameter point (P = 0.50 MPa, R = 40 um, h = 0.25 um)
          without sweeping across the 4 SAM curvature zones, 5 experimental perturbation
          regimes, or exposing CLI overrides.
        evidence:
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [25, 40], note: "Single fixed parameter point without zone sweep, perturbation sweep, or CLI overrides", supports: false}
      morphometric-validation:
        value: 53
        rationale: >-
          Exposes only 3 unreferenced algebraic numbers in `measure_morphoeval()` (L43-68)
          without reference values, uncertainty bounds, Pearson correlations, p-values,
          stress-vs-strain cue discrimination metrics, or empirical specimen measurements.
        evidence:
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [43, 68], note: "Minimal 3-metric list lacking reference values, uncertainty, p-values, and negative controls", supports: false}
      source-traceability:
        value: 68
        rationale: >-
          Vendors `paper_citations.bib` and `microtubule_stress_meristem_reference.json`
          in `datasets/microtubule_stress_meristem/`, but the Pass 1 script does not verify
