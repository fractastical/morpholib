        evidence:
          - {file: datasets/microtubule_stress_meristem/microtubule_stress_meristem_reference.json, lines: [1, 165], note: "Reference JSON present on disk but not loaded or SHA-256-verified in Pass 1 script", supports: true}
      code-traceability:
        value: 58
        rationale: >-
          Contains only a brief top-level docstring without mapping functions to Bozorg
          et al. (2014), Sampathkumar et al. (2014), Hamant et al. (2008), Uyttewaal et al.
          (2012), or the 3 Lean 4 theorems in `Loop_036_microtubule_stress_meristem.lean`.
        evidence:
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [1, 10], note: "Minimal docstring without equation-by-equation or Lean 4 theorem traceability", supports: false}
      repro-package:
        value: 56
        rationale: >-
          Supports `--verify-only` with a single assertion on the 2:1 cylinder stress ratio
          (L109-116), but lacks a comprehensive self-test suite covering SHA-256 integrity,
          Lean 4 algebraic laws, stress-vs-strain cue discrimination, ablation ring
          reorientation, and specimen CV segmentation.
        evidence:
          - {file: 2008-hamant-microtubule-stress-meristem.py, lines: [109, 116], note: "Single cylinder ratio check without comprehensive self-test suite", supports: false}
