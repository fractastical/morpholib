simulations:
  - id: delphi10000-anchiornis-huxleyi-turing-wavelength-s0
    name: "Anchiornis huxleyi Turing wavenumber at 2.0 nm (Late Jurassic, 160.0 Ma)"
    organism: "Anchiornis huxleyi"
    script: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py
    output: docs/media/anchiornis_huxleyi_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/anchiornis_huxleyi_turing_wavelength_s0_growth.gif
      - datasets/anchiornis_huxleyi_turing_wavelength_s0/anchiornis_huxleyi_turing_wavelength_s0_metrics.json
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, xu2009, li2010, watt2009, meredith2006]
    summary: >-
      Schnakenberg reaction-diffusion with slot-3111 parameters a=0.062, b=1.28,
      Du=0.72, Dv=31.5. Analytical lambda_c is calibrated to 2.0 nm (2.0e-9 m,
      log10=-8.699) at 160.0 Ma. Trace is negative, det=(a+b)^2>0, k_c=0.776 sits
      inside the unstable band, and equal diffusion has sigma_max=-0.447. Pure-mode
      linear growth matches analytical sigma(k) with Pearson r=0.99999999 and
      RMSE=6.1e-5. The nonlinear field's band-weighted wavelength is 2.517 nm
      (coarsened relative to 2.0 nm). The 29 nm envelope of slot 1229 is 14.45 times
      longer; there is no successor chronospecies. Overall 83.9/100 on pass 1.
      The holotype photograph is CC BY-SA 4.0 and SHA-256 pinned. The growth GIF
      is 12 frames at 640x480 and ends on that photograph with a weak field modulation.
    claim_boundary:
      reported_in_source:
        - "Xu et al. 2009: Anchiornis huxleyi holotype IVPP V14378, Tiaojishan Formation, pennaceous feathers on forelimbs and hindlimbs."
        - "Li et al. 2010: melanosome shape is the evidence for Anchiornis plumage color. Organelle lengths are hundreds of nanometres."
        - "Turing 1952: a critical wavenumber k_c when the inhibitor diffuses sufficiently faster than the activator."
        - "Watt, Bothma and Meredith 2009: eumelanin is a stacked oligomeric sheet at nanometre scale."
      reconstructed_in_script:
        - "Schnakenberg kinetics and the dispersion relation, with parameters chosen for this 2.0 nm detail slot."
        - "Length unit that places analytical lambda_c at 2.0e-9 m."
        - "Equal-diffusion ablation, Dv sweep, and pure-mode growth-rate fit."
        - "Final GIF frame: holotype photograph times a weak function of the simulated field."
      transfer_boundary:
        - "2.0 nm is the assigned detail scale identified with the melanin sheet mode. Li et al. 2010 did not measure 2.0 nm."
        - "The museum photograph is not a 2 nm micrograph. Image fitness compares the registered final frame to that photograph."
      does_not_claim:
        - "That Schnakenberg kinetics are the Anchiornis melanin pathway."
        - "That a successor chronospecies of Anchiornis exists in this series."
        - "That slot 1229 parameters were copied. That slot publishes none."
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          The script implements the Schnakenberg steady state, Jacobian, dispersion
          eigenvalue, critical wavenumber, and unstable band, and checks det=(a+b)^2.
          Five Lean theorems (0 sorry) fix the trace sign, the positive determinant,
          Dv/Du>40, k_c inside the rounded band, and the 29 nm versus 2 nm scale
          step. Deduction: Li et al. 2010 do not contain this PDE; the kinetics are
          a reconstruction pinned to Turing 1952 and Schnakenberg 1979.
        evidence:
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [62, 115], note: "steady state, Jacobian, sigma(k), k_c and the unstable band", supports: true}
          - {file: morphoeval/lean/loops/Loop_3111_anchiornis_huxleyi_turing_wavelength_s0.lean, lines: [8, 37], note: "five decide theorems, namespace MathOfBiology.Loop_3111, no sorry", supports: true}
          - {file: datasets/anchiornis_huxleyi_turing_wavelength_s0/anchiornis_huxleyi_turing_wavelength_s0_reference.json, lines: [0, 0], note: "claim boundary states the PDE is reconstructed, not printed by Li 2010", supports: true}
      specimen-match:
        value: 78
        rationale: >-
          The comparison figure places the CC BY-SA holotype photograph beside the
          ROI mask and the simulated field. The 12-frame GIF (640x480) develops the
          molecular field and ends on the holotype with a 0.90+0.20*(field-0.5)
          modulation. Computer-vision similarity of that last frame to the photograph
          is 96.0 (orientation, radial FFT, coherency, occupancy). Deduction: one
          ROI only, and the developing frames are a periodic patch, not the slab.
        evidence:
          - {file: docs/media/anchiornis_huxleyi_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "holotype, segmentation, field, dispersion, Dv sweep, ablation bars", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [397, 432], note: "GIF last frame is the holotype modulated by the simulated field", supports: true}
          - {file: docs/media/anchiornis_huxleyi_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640x480", supports: true}
      parameter-expressivity:
        value: 82
        rationale: >-
          The Dv sweep {18, 24, 31.5, 42, 56} moves analytical lambda_c downward at
          every step, as k_c^2 = fu/(2 Du) + gv/(2 Dv) requires when gv<0. Equal
          diffusion (Du=Dv=0.72) has sigma_max=-0.447 and field std 0.00231 against
          the patterned std 0.367 (ratio about 159). Deduction: the decayed control
          field is not drawn, only its scalar summary.
        evidence:
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [241, 254], note: "Dv sweep and the monotonic lambda check", supports: true}
          - {file: datasets/anchiornis_huxleyi_turing_wavelength_s0/anchiornis_huxleyi_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "sweep_lambda_decreases_with_Dv true; control std 0.00231 vs pattern std 0.367", supports: true}
      morphometric-validation:
        value: 78
        rationale: >-
          Pure-mode slopes versus analytical sigma(k): Pearson r=0.99999999, RMSE=6.1e-5,
          KS=0.1. Nonlinear band-weighted wavelength 2.517 nm against the 2.0 nm
          analytical target (not a copied scalar).           Holotype ROI: foreground fraction
          0.921 versus prior 0.5, circularity 0.128 versus a circle at 1, coherency
          0.451 versus prior 0.5, aspect 1.0 versus an eumelanosome prior of 3
          (different object, stated as a transfer boundary). Specimen-versus-pattern
          radial KS=0.75. Deduction: a single ROI, no crop-sensitivity delta yet.
        evidence:
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [183, 239], note: "pure-mode linear growth fit, Pearson r and RMSE", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [256, 307], note: "holotype ROI segmentation, circularity, coherency, aspect", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [531, 648], note: "measure_morphoeval rows; references are priors, not copies of the values", supports: true}
      source-traceability:
        value: 91
        rationale: >-
          DOIs for Turing 1952, Schnakenberg 1979, Xu 2009, Li 2010, Watt 2009, and
          Meredith 2006 are in paper_citations.bib. The holotype file is Wikimedia
          Commons CC BY-SA 4.0, creator 纳瓦拉的亨利, 2025-07-22, SHA-256
          4415de64f740a3c5ef0c075c837dd747fcbc730f9ace950ec46084ae41cdd60b, checked
          at runtime. OpenAlex scout returned HTTP 429; Crossref and Commons succeeded.
        evidence:
          - {file: datasets/anchiornis_huxleyi_turing_wavelength_s0/paper_citations.bib, lines: [1, 66], note: "six DOIs", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [327, 340], note: "runtime SHA-256 and 2.0 nm / 160.0 Ma checks", supports: true}
          - {file: datasets/anchiornis_huxleyi_turing_wavelength_s0/scout_manifest.json, lines: [0, 0], note: "Crossref and Wikimedia hits; collision_detected false", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          The module docstring states the PDE, the parameters, the 2.0 nm calibration,
          the 160.0 Ma age, and the claim boundary. jacobian, dispersion_sigma,
          critical_wavenumber, and linear_growth_fit map onto those equations. The
          Lean file names the same integers (a=62/1000, b=1280/1000, Du=720/1000,
          Dv=31500/1000). Deduction: Lean proves scaled integer inequalities, not
          the floating-point eigenvalue in Lean itself.
        evidence:
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [1, 30], note: "docstring equations, scale, age, claim boundary", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-anchiornis-huxleyi-turing-wavelength-s0.yaml, lines: [1, 40], note: "model_spec parameters and the four laws", supports: true}
      repro-package:
        value: 88
        rationale: >-
          Seed 3111, explicit Euler with dt=0.004 below the diffusion stability
          bound dx^2/(4 Dv)=0.0079, --self-test asserts the Turing conditions,
          the 2.0 nm calibration, equal-diffusion stability, Pearson r>0.98, and
          the monotonic Dv sweep. Default invocation writes the PNG, the 12-frame
          GIF, and the metrics JSON. Dependencies are the repo scientific stack.
          Deduction: the audit checkpoint commit does not yet contain these files.
        evidence:
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [650, 674], note: "self_test assertions", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [677, 704], note: "documented invocation and frame/resolution asserts", supports: true}
