simulations:
  - id: onuff-joint-interzone-clefting
    name: "Kavanagh et al. (2013) phalangeal Inhibitory Cascade & Hiscock et al. (2017) BMP-GDF5-Noggin synovial joint interzone segmentation"
    organism: "Gallus gallus / Mus musculus tetrapod autopod digits & synovial joint interzones"
