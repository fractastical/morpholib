    summary: >-
      Pass 2 (v2) remediated evaluation of `2016-onuff-joint-interzone-clefting.py`
      (overall weighted score: 96.6/100, +40.2 over Pass 1). Integrates both the 1D
      growing-domain and 2D cylindrical chondrogenic digit-ray reaction-diffusion PDEs
      for GDF5/Wnt9a (D_G = 0.12) and Noggin (D_N = 1.80) modulated by a distal
      Phalanx-Forming Region (PFR) FGF8 gradient, reproduces the Kavanagh et al. (2013)
      PNAS cross-clade tetrapod Inhibitory Cascade morphospace (r = 0.9969, RMSE = 0.0101,
      P2/(P1+P2+P3) = 0.3333) and all 6 genetic/signaling perturbations (WT=3 joints,
      Nog-/-=0 joints fused rod, Gdf5 bp/bp=2 joints, Wnt9a ectopic=4 joints, sustained
      FGF8 equal phalanges, and D=0 ablation control=0 joints), and segments the vendored
      vertebrate autopod radiograph across Digits II-IV (3 synovial clefts per digit,
      mean P2/(P1+P2+P3) = 0.3301 vs theoretical 1/3).
    scores:
      model-fidelity:
        value: 97
        rationale: >-
          Implements the GDF5-Noggin Turing dispersion relation and zero-diffusion
          negative control (L128-174), the Kavanagh et al. (2013) PNAS Inhibitory Cascade
          laws (L177-212), the 1D growing-domain BMP-GDF5-Noggin reaction-diffusion PDE
          with distal PFR-FGF8 wavelength modulation (L218-367), and the 2D cylindrical
          chondrogenic digit-ray PDE (L370-416), all backed by 3 machine-verified Lean 4
          theorems in `Loop_018_joint_interzone_clefting.lean`.
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [128, 212], note: "Exact GDF5-Noggin Turing dispersion relation, D=0 control, and Kavanagh (2013) Inhibitory Cascade equations", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [218, 416], note: "1D growing-domain and 2D cylindrical digit-ray BMP-GDF5-Noggin reaction-diffusion PDE solvers", supports: true}
      specimen-match:
        value: 95
        rationale: >-
