simulations:
  - id: delphi10000-danio-albolineatus-turing-wavelength-s0
    name: "Danio albolineatus Schnakenberg wavelength at 37 µm (Holocene, 0 Ma)"
    organism: "Danio albolineatus"
    script: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py
    output: docs/media/danio_albolineatus_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/danio_albolineatus_turing_wavelength_s0_growth.gif
      - datasets/danio_albolineatus_turing_wavelength_s0/danio_albolineatus_turing_wavelength_s0_metrics.json
    status: evaluated
    source_refs: [turing1952, nakamasu2009, patterson2014, podobnik2020, volkening2018]
    summary: >-
      Pass 1. Schnakenberg reaction-diffusion on a periodic 96×60 patch.
      Activator diffusivity is solved so the pearl-danio fastest mode is
      3.686e-05 m (36.9 µm). At equal time the predecessor (anisotropic
      inhibitor, Danio aesculapii) forms vertical bars at 41.8 µm (std 0.327),
      the focal species stays near the homogeneous state (std 0.007), and the
      successor (Danio margaritatus) forms spots at 34.2 µm (std 0.707).
      Equal diffusion is stable (σ_max = −0.137). Closed-form dispersion
      matches matrix eigenvalues at Pearson r = 1.000, RMSE ~ 1e-15.
      The radial-spectrum correlation against linear theory is 0.9799.
      One Commons photograph; flank depth/length 0.221 versus the FishBase
      landmark ratio 0.250. Weighted overall 80.2/100.
    claim_boundary:
      reported_in_source:
        - "Turing dispersion relation and critical wavenumber."
        - "Short-range melanophore-xanthophore exclusion and long-range dependence (Nakamasu et al. 2009)."
        - "D. albolineatus does not build the reiterated zebrafish stripe stack (Patterson, Bain & Parichy 2014)."
        - "Danio patterns include vertical bars and spots, with kcnj13 implicated in D. aesculapii (Podobnik et al. 2020)."
      reconstructed_in_script:
        - "Schnakenberg parameters (a, b) = (0.12, 0.88) and the diffusion ratios for the three species."
        - "Identification of the assigned 3.686e-05 m scale with the pearl-danio fastest mode."
      transfer_boundary:
        - "Sister-species wavelengths are predictions of the diffusion change, not histological measurements at 37 µm."
        - "The aquarium photograph does not resolve 37 µm (about 150 µm per pixel along the body)."
      does_not_claim:
        - "Sand, plants, and the body outline are not generated by the reaction-diffusion equation."
        - "The kinetics are not Patterson & Parichy's cell-by-cell model."
    scores:
      model-fidelity:
        value: 84
        rationale: >-
          The steady state, Jacobian, dispersion root, critical inhibitor
          ratio, and equal-diffusion control are implemented and checked
          against the matrix eigenvalue (r = 1, RMSE ~ 1e-15). Five Lean
          theorems with zero sorry record the steady state, the sign of
          tr J and det J, the inhibitor ratio, the chronoseries order, and
          the k·λ product. The kinetics are generic Schnakenberg, not a
          transcription of Nakamasu's cell-interaction network or
          Volkening's three-cell iridophore model.
        evidence:
          - {file: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py, lines: [63, 114], note: "Jacobian, critical delta, closed-form sigma(k), eigenvalue check, fastest mode", supports: true}
          - {file: morphoeval/lean/loops/Loop_3161_danio_albolineatus_turing_wavelength_s0.lean, lines: [14, 41], note: "five theorems, 0 sorry", supports: true}
          - {file: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py, lines: [1, 16], note: "docstring states the reduction; it is not the published cell model", supports: false}
      specimen-match:
        value: 76
        rationale: >-
          The comparison figure places the Commons photograph beside the
          three simulated regimes on a shared colour scale, and the regimes
          are visually distinct (bars, near-blank, spots, decayed control).
          The growth GIF keeps the photograph and shows the cellular field
          in an inset because a 37 µm mode is sub-pixel on the animal.
          Computer-vision similarity of that GIF to the photograph is 96.0
          (12 frames, 1024×680). A full-frame ablation of the cellular field
          alone scores 85.2. Deduction: the high GIF score is carried by the
          unchanged background, and the pearl-danio panel on the shared
          scale is almost featureless, which is the biological claim but a
          weak visual match to any stripe the eye expects.
        evidence:
          - {file: docs/media/danio_albolineatus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, three regimes, control, sweep, dispersion, amplitudes", supports: true}
          - {file: docs/media/danio_albolineatus_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame GIF, minimum side 680 px", supports: true}
          - {file: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py, lines: [395, 431], note: "inset is contrast-stretched; the photograph is the canvas", supports: false}
      parameter-expressivity:
        value: 84
        rationale: >-
          The inhibitor-ratio sweep at fixed Du moves σ_max from −0.040
          (δ/δ_c = 0.90) through onset to 0.319 (δ/δ_c = 3.20), and λ
          lengthens monotonically from 34.4 µm to 45.3 µm. The chronoseries
          changes one geometric factor at a time: AP inhibitor anisotropy
          selects bars, a shorter activator range plus a higher ratio
          selects spots, equal diffusion decays. No command-line override
          for a, b, or α beyond editing the constants.
        evidence:
          - {file: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py, lines: [141, 204], note: "regime table and delta sweep", supports: true}
          - {file: datasets/danio_albolineatus_turing_wavelength_s0/danio_albolineatus_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "sweep sigmas and wavelengths", supports: true}
      morphometric-validation:
        value: 74
        rationale: >-
          The segmented flank has depth/length 0.221 against the FishBase
          landmark ratio 0.250, circularity 0.321 against 1, and
          structure-tensor coherency 0.360. A tighter ROI gives 0.226, so
          the ratio is not an artefact of one bounding box. Dispersion
          Pearson r = 1.000 and RMSE ~ 1e-15. The radial spectrum versus
          linear theory is r = 0.9799, just under 0.98, and has not yet
          been split into the unstable band. Kolmogorov-Smirnov distances
          of the final activator against a Gaussian are 0.015 (pearl
          danio), 0.072 (bars), 0.153 (spots). Wavelength has been measured
          at one noise seed.
        evidence:
          - {file: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py, lines: [176, 184], note: "analytic versus eigenvalue Pearson r and RMSE", supports: true}
          - {file: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py, lines: [268, 322], note: "fish segmentation, two ROIs, circularity, coherency", supports: true}
          - {file: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py, lines: [324, 379], note: "spectrum correlation and KS test; single final field", supports: true}
      source-traceability:
        value: 88
        rationale: >-
          DOIs were resolved on OpenAlex on 2026-10-27. The specimen is
          Wikimedia Commons File:Danio albolineatus.jpg, public domain,
          Steven Coburn, SHA-256 f42000111fe647d8… pinned in the reference
          JSON and checked at runtime. The FishBase depth ratio is cited
          to the repo's fish-shapes table. Deduction: sister-species
          wavelengths are not tied to a measured histological table.
        evidence:
          - {file: datasets/danio_albolineatus_turing_wavelength_s0/paper_citations.bib, lines: [1, 84], note: "Turing, Nakamasu, Inaba, Patterson, Volkening, Spiewak, Podobnik, McCluskey", supports: true}
          - {file: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py, lines: [530, 540], note: "runtime SHA-256 and scale/age pin check", supports: true}
      code-traceability:
        value: 78
        rationale: >-
          Each function corresponds to a named piece of the dispersion
          relation, and the Lean file cites the same integer witnesses the
          self-test recomputes (nanometre order within 80 nm). There is no
          map from code lines onto numbered equations of Turing 1952 or
          Nakamasu 2009.
        evidence:
          - {file: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py, lines: [1, 16], note: "module docstring states equations, scale, and age", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-danio-albolineatus-turing-wavelength-s0.yaml, lines: [1, 69], note: "law entries point at the Lean theorems and the script", supports: true}
      repro-package:
        value: 82
        rationale: >-
          Seed 3161, dt = 0.007 under the explicit-Euler stability bound,
          --self-test passes, and the full render writes the PNG, the GIF,
          and the metrics JSON. The specimen hash is checked before the
          integration. Dependencies are the repo scientific stack, not a
          per-script lockfile, and the checkpoint commit does not yet
          contain these files.
        evidence:
          - {file: models/2026-delphi10000-danio-albolineatus-turing-wavelength-s0.py, lines: [806, 845], note: "self-test: wavelength order, r > 0.98, stable control, Lean integers", supports: true}
          - {file: datasets/danio_albolineatus_turing_wavelength_s0/README.md, lines: [1, 50], note: "invocation and scale stated as 37 µm and 0 Ma", supports: true}
    remediation:
      - id: R1
        item: "All-band spectral Pearson r is 0.9799. Recompute the correlation on the unstable band σ(k) > 0 and report that number even if it is worse."
      - id: R2
        item: "FFT wavelength is reported for one noise seed. Repeat seeds 7 and 99 and record the coefficient of variation."
      - id: R3
        item: "One aquarium photograph. The depth/length ratio is a bounding box, not the FishBase landmark measurement."
      - id: R4
        item: "Single assessor. This pass is not a cross-provider audit."
      - id: R5
        item: "Predecessor and successor wavelengths are reconstructions from the diffusion change, not measurements at 37 µm."
