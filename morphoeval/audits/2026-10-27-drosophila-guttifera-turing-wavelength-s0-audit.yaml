simulations:
  - id: delphi10000-drosophila-guttifera-turing-wavelength-s0
    name: "Schnakenberg micro-ocellus wavelength of Drosophila guttifera at 2.12 µm"
    organism: "Drosophila guttifera"
    script: models/2026-delphi10000-drosophila-guttifera-turing-wavelength-s0.py
    output: docs/media/drosophila_guttifera_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/drosophila_guttifera_turing_wavelength_s0_growth.gif
      - datasets/drosophila_guttifera_turing_wavelength_s0/run_metrics.json
    status: evaluated
    source_refs: [werner2010, koshikawa2015, koseki2021, fukutomi2017, turing1952, schnakenberg1979, genomes2007, spieth1981]
    summary: >-
      Focal linear wavelength is calibrated to 2.12 µm (k_max = 2.88, marginal k_c = 4.96).
      On a fixed 12-wavelength box the spectral centroid tracks analytical λ across eight
      inhibitor-diffusivity multipliers with Pearson r = 0.992 and RMSE = 0.208 µm; the
      centroid sits systematically short of λ(k_max). Equal diffusion (Du = Dv = 0.40) decays
      (amplitude ratio 0.228, σ_max < 0). Saturated guttifera coherency is 0.010; grimshawi
      with vein anisotropy 3.15 reaches 0.480; heteroneura at a = 0.24 has linear λ = 2.048 µm.
      The adult photograph (CC BY-SA 4.0, MA Hanson) segments to 28 dark blobs against the
      nominal 16 wing spots. Pass 1 uses periodic boundaries only.
    claim_boundary:
      reported_in_source:
        - "Werner et al. 2010: Wingless at vein intersections and campaniform sensilla induces yellow melanin spots on the D. guttifera wing."
        - "Koseki, Tanaka & Koshikawa 2021: wingless is expressed in specific campaniform-sensillum cell types."
        - "Turing 1952 and Schnakenberg 1979: diffusion-driven instability and the two-species reaction used here."
      reconstructed_in_script:
        - "Schnakenberg parameters a=0.10, b=0.90, Du=0.016, Dv=1.25, with the spatial unit chosen so λ(k_max)=2.12 µm."
        - "One campaniform Gaussian (a_w=0.12) on the guttifera morphology run."
        - "Grimshawi anisotropy 3.15 and heteroneura basal activator 0.24, as chronospecies contrasts at 0 Ma."
        - "Fixed-band spectral centroid on cycles [0.30, 0.80] and the equal-diffusion ablation."
      transfer_boundary:
        - "The 2.12 µm figure is the campaign detail tier, not a length reported by Werner et al. 2010."
        - "Sibling slot 3011 is the ~102 µm whole-wing spot scale. This patch is the interior of one spot."
      does_not_claim:
        - "That Werner 2010 published this PDE."
        - "That anisotropy 3.15 or heteroneura a=0.24 was measured. Spieth 1981 is a head-shape paper."
        - "That the terminal GIF frame is a 2.12 µm micrograph. It is the adult photograph; the generative field is the preceding frames and the comparison figure."
        - "That the global dark-blob count of 28 equals the 16 named wing spots."
    scores:
      model-fidelity:
        value: 80
        rationale: "dispersion() implements the Schnakenberg Jacobian, marginal k_c, and σ(k). The Wingless Gaussian and the 2.12 µm calibration are reconstructions placed under that law. Pass 1 integrates only with periodic boundaries."
        evidence:
          - {file: models/2026-delphi10000-drosophila-guttifera-turing-wavelength-s0.py, lines: [77, 110], note: "Jacobian, k_c^2 = (Dv f_u + Du g_v)/(2 Du Dv), and argmax sigma", supports: true}
          - {file: morphoeval/lean/loops/Loop_3187_drosophila_guttifera_turing_wavelength_s0.lean, lines: [54, 58], note: "123^2 > 10*125 encodes the same focal discriminant", supports: true}
      specimen-match:
        value: 74
        rationale: "The comparison figure places the CC BY-SA adult male beside guttifera, grimshawi, and heteroneura fields. Grimshawi is the oriented field (coherency 0.48 vs 0.01). The GIF's last frame is the photograph, so it matches the adult, not a 2.12 µm micrograph. Global segmentation returns 28 blobs rather than 16 wing spots."
        evidence:
          - {file: docs/media/drosophila_guttifera_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "adult photograph beside three chronospecies fields, dispersion curve, and Dv sweep", supports: true}
          - {file: docs/media/drosophila_guttifera_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames at 640x480; frames 1-8 are the micro-field, frame 12 is the specimen", supports: true}
      parameter-expressivity:
        value: 84
        rationale: "Eight Dv multipliers move analytical and numerical wavelengths together (r = 0.992) but the centroid stays short of the 1:1 line. Anisotropy 3.15 raises coherency from 0.010 to 0.480. Equal diffusion decays (ratio 0.228)."
        evidence:
          - {file: models/2026-delphi10000-drosophila-guttifera-turing-wavelength-s0.py, lines: [295, 312], note: "fixed-domain Dv sweep", supports: true}
          - {file: models/2026-delphi10000-drosophila-guttifera-turing-wavelength-s0.py, lines: [320, 345], note: "ablation and the three chronospecies integrators", supports: true}
      morphometric-validation:
        value: 78
        rationale: "Pearson r = 0.992 and RMSE = 0.208 µm on the linear centroid. KS D = 0.5 against a reference of 0, so the numerical and analytical sets are not the same distribution. Specimen coherency 0.556 and foreground fraction 0.569 are measured on the photograph and are not equal to their reference values. The spot count (28 vs 16) is an unrefined global threshold. Saturated inter-peak spacing is not yet measured."
        evidence:
          - {file: models/2026-delphi10000-drosophila-guttifera-turing-wavelength-s0.py, lines: [360, 470], note: "measurement block: r, RMSE, KS, ablation, chronospecies wavelengths, specimen blobs", supports: true}
          - {file: models/2026-delphi10000-drosophila-guttifera-turing-wavelength-s0.py, lines: [230, 264], note: "global gray<0.28 segmentation", supports: true}
      source-traceability:
        value: 90
        rationale: "Primary DOI 10.1038/nature08896 was checked on Crossref (the sibling slot's 10.1038/nature08994 is a different paper). Specimen SHA-256, creator MA Hanson, and CC BY-SA 4.0 are in the reference JSON."
        evidence:
          - {file: datasets/drosophila_guttifera_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "Werner 2010, Koshikawa 2015, Koseki 2021, Turing 1952, Schnakenberg 1979", supports: true}
          - {file: datasets/drosophila_guttifera_turing_wavelength_s0/drosophila_guttifera_turing_wavelength_s0_reference.json, lines: [1, 40], note: "scale 2.12e-6 m, age 0 Ma, specimen sha256", supports: true}
      code-traceability:
        value: 80
        rationale: "The module docstring states the PDE, k_c, and the chronospecies contrast. dispersion() is the equation. The Lean file proves the integer form of the same discriminant and the 8-by-2120 nm patch. Pass 1 does not yet mark a zero-flux control in the code."
        evidence:
          - {file: models/2026-delphi10000-drosophila-guttifera-turing-wavelength-s0.py, lines: [1, 36], note: "docstring equations and chronospecies table", supports: true}
          - {file: morphoeval/lean/loops/Loop_3187_drosophila_guttifera_turing_wavelength_s0.lean, lines: [36, 68], note: "four theorems, zero sorry", supports: true}
      repro-package:
        value: 84
        rationale: "Seed 3187, --self-test, and a SHA-256 pin on the specimen. The self-test checks r > 0.98, ablation decay, grimshawi coherency, and the Lean file. Dependencies are the repo scientific stack. The run is deterministic given that stack."
        evidence:
          - {file: models/2026-delphi10000-drosophila-guttifera-turing-wavelength-s0.py, lines: [68, 74], note: "specimen hash check", supports: true}
          - {file: models/2026-delphi10000-drosophila-guttifera-turing-wavelength-s0.py, lines: [608, 655], note: "--self-test assertions", supports: true}
    remediation:
      - id: R1
        item: "Add a zero-flux (Neumann) control and report its wavelength against the periodic run. Pass 1 is periodic only."
      - id: R2
        item: "Replace the global dark threshold (28 blobs) with a wing-membrane mask that drops the thorax and border-touching bristles, and compare that count to 16 without forcing equality."
      - id: R3
        item: "Measure saturated inter-peak spacing and its KS/CV against the linear 2.12 µm wavelength. The linear centroid is systematically short (RMSE 0.208 µm); say whether saturation makes that better or worse."
      - id: R4
        item: "Independent second assessor. This pass is builder-scored only. Left open if no second model is available."
