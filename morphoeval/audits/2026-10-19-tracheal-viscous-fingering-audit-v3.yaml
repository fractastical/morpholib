# MorphoEval Pass 3 (v3) Audit — Nelson, Gleghorn, Myers, Radisky & Stone (2017) Development 144(23):4328-4335,
# Kim et al. (2015) Dev. Cell 34(6):668-681 & Unbekandt et al. (2008) Mech. Dev. 125:314-324
# Transmural Microfluidic Luminal Pressure (Delta P), Laplace Epithelial Wall Stress, Synchronized ASM Peristalsis,
# 3D Ellipsoidal Pleural Cavity Tree, Poiseuille/CFTR Luminal Pressure Network & Laryngeal Valve Cycles, 2026-10-20 (v3)
#
# Pass 3 post-remediation evaluation of `2015-sugimura-tracheal-viscous-fingering.py` (Slot 059)
# superseding `2026-10-19-tracheal-viscous-fingering-audit-v2` (94.0) in `2026-10-19-tracheal-viscous-fingering-loop-pass3`.
#
# What Pass 3 changed (the single open v2 remediation item, closed as an honest *reduced* model):
#   1. 3D bifurcating tree grown inside an analytic ellipsoidal pleural cavity with 90-degree rotating bifurcation
#      planes (Metzger 2008 orthogonal mode) and pleura-contact tip arrest (`simulate_3d_pleural_cavity_lung_tree`,
#      L480-620) plus a cavity-size ablation (`evaluate_pleural_cavity_ablation`, L715-736).
#   2. Spatially resolved CFTR/NKCC1 chloride secretion (`cftr_secretion_flux_per_area`, L412-417) feeding a
#      Hagen-Poiseuille resistor-network luminal pressure solve on the tree (`solve_tree_luminal_pressure`, L428-477).
#   3. Laryngeal valve opening/closing (fetal breathing-movement) cycles with an exact-exponential ODE update, an
#      11-point open-duty sweep and the Jensen gap of the Hill rate (`simulate_laryngeal_valve_cycles` L635-691,
#      `evaluate_laryngeal_duty_cycle_sweep` L694-712).
#   4. Two new machine-checked Lean 4 laws (`poiseuille_tree_pressure_accumulation`, `laryngeal_valve_duty_cycle_monotonicity`;
#      5 laws total, 0 sorrys), 7 new measurements (16 total), 4 new self-test suites (12 total), a 3x3 comparison
#      figure, a dedicated 3D cavity figure and a GIF 3D pane, `--duty-open` / `--cavity-scale` CLI flags, and
#      `pleural_cavity_valve_reference.json` with per-constant provenance flags.
#
# Scores below: overall 90.9 (down from 94.0). The remediation closed the v2 item but, as intended for this round,
# exposed a deeper layer of defects that the v2 audit did not penalise: self-referential specimen "references"
# (the reference JSON stores the script's own outputs), fitted rather than digitised `*_obs` sweep columns, a
# seed-paper / file-name identity mismatch (no Saffman-Taylor viscous-fingering mathematics exists in the script;
# the modelled papers are Nelson 2017 / Kim 2015 / Unbekandt 2008 on Mus musculus), four new DOIs that could not
# be verified offline, and a 3D tip count that is inherited from the 0-D Hill solver rather than emergent.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the files
# in the working tree at commit 171769b9 (uncommitted Pass 3 remediation; 1834-line script).

