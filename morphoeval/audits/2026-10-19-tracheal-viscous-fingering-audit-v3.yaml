simulations:
  - id: sugimura-tracheal-viscous-fingering
    name: "Nelson et al. (2017) Development & Kim et al. (2015) Dev. Cell microfluidic transmural pressure, Laplace epithelial wall stress, ASM peristalsis, 3D ellipsoidal pleural cavity tree, Poiseuille/CFTR luminal pressure network and laryngeal valve cycles driving embryonic lung branching"
    organism: "Mus musculus (E11-E16.5 pseudoglandular embryonic lung airway tree under microfluidic transmural pressure control; fetal-sheep laryngeal physiology transferred for the valve model)"
    script: 2015-sugimura-tracheal-viscous-fingering.py
    output: docs/media/tracheal_viscous_fingering_comparison.png
    extra_outputs:
      - docs/media/tracheal_viscous_fingering_growth.gif
      - docs/media/tracheal_viscous_fingering_pleural_cavity_3d.png
    status: evaluated
    supersedes_audit_id: 2026-10-19-tracheal-viscous-fingering-audit-v2
    claim_boundary:
      reported_in_source:
        - "Nelson, Gleghorn, Myers, Radisky & Stone (2017) Development 144:4328-4335 microfluidic chest cavity experiments proving that embryonic lung branching rate dN_tips/dt and synchronized airway smooth muscle (ASM) peristaltic wave frequency f_ASM depend strictly on the transmural pressure difference Delta P = P_lumen - P_pleura and are invariant under common-mode hydrostatic pressure shifts (P_lumen + P_0, P_pleura + P_0)"
        - "Laplace-Young circumferential epithelial wall stress sigma_theta = Delta P * R / h driving mechanosensitive FGF10/ERK1/2/Etv4 distal tip proliferation and bifurcation above critical threshold Delta P_c approx 50 Pa (Unbekandt et al. 2008 Mech. Dev. 125:314-324; Nelson et al. 2017)"
        - "Kim et al. (2015) Dev. Cell 34:668-681 & Nelson et al. (2017) nifedipine L-type Ca2+ channel blockade of ASM peristaltic contractions or tracheal intubation drainage (Delta P <= 0 Pa) collapsing terminal bud bifurcation"
        - "Olver & Strang (1974) chloride-driven fetal lung-liquid secretion with distal > proximal secretory activity; Harding et al. (1986) and Harding & Hooper (1996) fetal-sheep upper-airway resistance dominating lung-liquid efflux, a closed-glottis tracheal pressure plateau of 1-2 mmHg, and a laryngeal resistance drop during fetal breathing-movement episodes; Metzger et al. (2008) orthogonal bifurcation mode of the mouse bronchial tree"
      reconstructed_in_script:
        - "Coupled 2D spatial microfluidic bronchial tree and Laplace wall stress solver (`simulate_2d_microfluidic_lung_tree`) plus 8-point Delta P in [0, 400] Pa sweep (`evaluate_transmural_pressure_sweep`), reproducing the vendored 48h terminal bud counts (Pearson r = 0.99997), branching rate Gamma_branch and ASM contraction frequency f_ASM columns"
        - "Exact common-mode gauge invariance verification across (P_lumen, P_pleura) = (200, 0), (0, -200), and (500, 300) Pa (max deviation = 0.0000) for the 2D, 3D and valve solvers, alongside nifedipine Ca2+ channel blockade and tracheal drainage negative controls"
        - "(Pass 3) 3D bifurcating tree grown inside an analytic ellipsoidal pleural cavity with 90-degree rotating bifurcation planes and pleura-contact tip arrest (`simulate_3d_pleural_cavity_lung_tree`), with a cavity-scale ablation 0.7-2.0 at 300 Pa (`evaluate_pleural_cavity_ablation`: contact fractions 0.50/0.50/0.25/0.00/0.00)"
        - "(Pass 3) Spatially resolved CFTR/NKCC1 chloride secretion j_Cl(g) (geometric proximal-to-distal gradient, 6x) integrated over segment epithelial area and a Hagen-Poiseuille resistor-network luminal pressure solve P_node = P_amn + R_larynx Q_tot + sum_path R_i Q_i (`solve_tree_luminal_pressure`); intra-tree drop 6.0e-6 of the 200 Pa tracheal Delta P"
        - "(Pass 3) Laryngeal valve opening/closing cycles C dP/dt = Q - (P - P_amn)/R_larynx(t) integrated exactly per step over 48 h with an 11-point open-duty sweep (Spearman rho = -1.0, occlusion/open fold ratio 6.844 vs 6.728 reference) and the Jensen gap of the Hill branching rate (-0.0226 day^-1 at duty 0.40) (`simulate_laryngeal_valve_cycles`, `evaluate_laryngeal_duty_cycle_sweep`)"
        - "Computer-vision segmentation (`segment_embryonic_lung_specimen`) of the vendored Mus musculus pseudoglandular E11-E16.5 embryonic lung specimen (`embryonic_lung_branching_specimen.jpg`, CC BY 3.0) extracting 17 distal terminal buds, distal-to-total airway area fraction = 0.6885, and mean distal tip radius = 3.8470 +- 1.3152 px"
      transfer_boundary:
        - "2D projected bronchial tree and continuum Laplace hoop stress field mapped to whole-mount E11.5-E16.5 pseudoglandular mouse lung explants in microfluidic chest chambers"
        - "The pleural cavity is an analytic ellipsoid (CAVITY_SEMI_AXES, CHEST_LENGTH_SCALE_UM = 1.6 mm) and not a stereolithographic STL chest mesh; no lobation or left-right asymmetry; generation depth of the 3D tree is inherited from the same 0-D Hill N(t) as the 2D solver, so the 3D tip count is a consistency check and not an emergent prediction"
        - "The laryngeal valve / fetal-breathing-movement model transfers fetal-sheep in-utero physiology (Harding 1986/1996) to the explant setting of Nelson et al. (2017), whose cannulated explants have no larynx; the closed-glottis plateau (250 Pa), R_open/R_closed (0.25), duty (0.40), period (40 min) and tau_closed (6 min) are model choices flagged `provenance: model` in `pleural_cavity_valve_reference.json`"
        - "CFTR secretion is a prescribed functional form (geometric gradient), not a transcript-map-derived field; the laryngeal resistance in the 3D solver is back-solved so that the tracheal inlet pressure equals p_lumen_pa, so the tracheal Delta P is a boundary condition and only the intra-tree distribution is emergent"
        - "The `*_obs` sweep columns of `tracheal_viscous_fingering_reference.json` are not literal digitisations of Nelson 2017 figures (no figure/table coordinates or digitisation provenance) and the Hill constants were fitted to them, so the Pearson r ~ 0.9999 correlations are largely self-referential"
      does_not_claim:
        - "Saffman-Taylor viscous fingering or any Hele-Shaw interfacial instability (despite the file name and campaign slug, no viscous-fingering mathematics exists in the script); Gallus gallus data (the vendored specimen and all vendored references are Mus musculus and fetal sheep)"
        - "Full 3D Navier-Stokes Stokesian fluid-structure interaction of individual ciliated epithelial cells, single-channel CaV1.2 gating kinetics, lobar branching programme sequences, or in-utero FBM pressure traces measured in the mouse"
    source_refs:
      - nelson2017
      - kim2015
      - unbekandt2008
      - jaslove2018
      - morrisey2010
      - olver1974
      - harding1986
      - harding1996
      - metzger2008
    summary: >-
      Pass 3 (v3) evaluation of `2015-sugimura-tracheal-viscous-fingering.py` (overall weighted
      score: 90.9/100, down from 94.0/100 in v2). The single v2 remediation item is closed as an
      honest reduced model: a 3D orthogonal-bifurcation tree inside an analytic ellipsoidal pleural
      cavity with pleura-contact arrest and a cavity-scale ablation; spatially resolved CFTR/NKCC1
      chloride secretion feeding a Hagen-Poiseuille luminal pressure network (intra-tree drop
      6.0e-6 of Delta P, so the 2D uniform-pressure assumption is validated, not refuted); and
      laryngeal valve opening/closing cycles with an exact-exponential ODE, an 11-point duty sweep
      (Spearman rho = -1.0; occlusion/open fold ratio 6.844 vs Nelson-derived 6.728) and the Jensen
      gap of the Hill rate. Two new Lean 4 laws (5 total, 0 sorrys), 7 new measurements (16 total),
      4 new self-test suites (12 total, 0.9 s), 3x3 figure, 3D figure, GIF 3D pane and two new CLI
      flags. The score falls because this round surfaced defects the v2 audit did not penalise:
      specimen measurements 7-9 compare the segmentation against its own recorded outputs
      (reference == value by construction), the 8-point `*_obs` columns are fitted targets rather
      than digitised figures, the file name / seed paper / organism (Gallus gallus, Nelson 2015,
      viscous fingering) do not describe what the script models (Mus musculus; Nelson 2017 / Kim 2015 /
      Unbekandt 2008; Hill-rate exponential branching), the 3D tip count is inherited from the 0-D
      Hill solver, the valve model is fetal-sheep in-utero physiology applied to a larynx-free
      explant claim, the four new DOIs are unverified offline, and a stale comment cites a
      non-existent `calibrate_laryngeal_resistance` function.
    scores:
      model-fidelity:
        value: 91
        rationale: >-
          The Pass 2 core (Delta P gauge, Laplace hoop stress, Hill bifurcation rate, ASM frequency;
          `compute_transmural_pressure` through `simulate_2d_microfluidic_lung_tree`, L153-362) is
          unchanged and the three Pass 3 mechanisms are implemented with the stated equations:
          Poiseuille resistor network with subtree-accumulated secretion (`solve_tree_luminal_pressure`,
          L428-477), 3D tree with 90-degree rotating bifurcation planes and ellipsoid clipping
          (`simulate_3d_pleural_cavity_lung_tree`, L480-620), and the valve ODE with exact-exponential
          update and the Jensen gap (`simulate_laryngeal_valve_cycles`, L635-691), all backed by 5
          machine-checked Lean 4 laws (0 sorrys). Deductions: the 3D generation depth is set from the
          same 0-D `simulate_buds_48h` as the 2D solver (L497-499) and the per-tip Gamma(Delta P_tip)
          computed at L600 never feeds back into growth, so 3D confinement affects arrest only, not
          branching (-3); the laryngeal resistance is back-solved so that the tracheal inlet equals
          `p_lumen_pa` (L578-580), making the tracheal Delta P a boundary condition rather than an
          output of secretion vs. resistance (-2); the valve model is fetal-sheep in-utero physiology
          applied to a larynx-free explant system (-2); the file name and campaign slug promise
          Saffman-Taylor viscous fingering and the script contains none (L1-70 docstring lists Hill /
          Poiseuille / valve laws only) (-2).
        evidence:
          - {file: 2015-sugimura-tracheal-viscous-fingering.py, lines: [153, 225], note: "Pass 2 governing equations: transmural pressure, Laplace hoop stress, ASM frequency, Hill branching rate, 48h exponential bud growth (unchanged)", supports: true}
          - {file: 2015-sugimura-tracheal-viscous-fingering.py, lines: [428, 477], note: "Hagen-Poiseuille resistor network with subtree-accumulated CFTR secretion; P_node = P_amn + R_larynx Q_tot + sum_path R_i Q_i; per-tip Delta P", supports: true}
          - {file: 2015-sugimura-tracheal-viscous-fingering.py, lines: [480, 620], note: "3D ellipsoidal pleural cavity tree with orthogonal bifurcation planes, pleura-contact arrest, cavity fill fraction and per-tip branching rates", supports: true}
          - {file: 2015-sugimura-tracheal-viscous-fingering.py, lines: [495, 499], note: "3D generation depth derived from the 0-D Hill N(t) of simulate_buds_48h, so 3D tip count is inherited rather than emergent", supports: false}
          - {file: 2015-sugimura-tracheal-viscous-fingering.py, lines: [573, 580], note: "R_larynx back-solved so that the tracheal inlet pressure equals p_lumen_pa; tracheal Delta P is a boundary condition", supports: false}
          - {file: 2015-sugimura-tracheal-viscous-fingering.py, lines: [635, 691], note: "Laryngeal valve cycles: exact-exponential integration of C dP/dt = Q - (P - P_amn)/R_larynx(t), time-integrated Hill branching and Jensen gap", supports: true}
          - {file: morphoeval/lean/loops/Loop_059_tracheal_viscous_fingering.lean, lines: [138, 216], note: "Lean 4 Laws 4-5: poiseuille_tree_pressure_accumulation (list induction) and laryngeal_valve_duty_cycle_monotonicity; 5 laws total, 0 sorrys, `lean` exits 0", supports: true}
