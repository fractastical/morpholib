simulations:
  - id: hannezo-branching-random-walk-annihilation
    name: "Hannezo et al. (2017) Cell & Scheele et al. (2017) Nature unifying theory of branching morphogenesis via branching and annihilating random walks (BARW)"
    organism: "Mus musculus (mouse pubertal mammary gland, embryonic metanephric kidney, embryonic pancreas, and salivary gland ductal networks)"
    script: 2017-hannezo-branching-random-walk-annihilation.py
    output: docs/media/branching_random_walk_annihilation_comparison.png
    extra_outputs:
      - docs/media/branching_random_walk_annihilation_growth.gif
    status: evaluated
    source_refs:
      - hannezo2017
      - scheele2017
      - bordeu2023
      - chatzeli2017
    summary: >-
      Pass 2 (v2 remediated) evaluation of `2017-hannezo-branching-random-walk-annihilation.py`
      (92.4/100, up from 51.8/100 in Pass 1; +40.6 overall). The remediated script
      implements a full 2D off-lattice spatial Branching and Annihilating Random Walk
      (BARW) ductal tree simulator with persistent tip migration (v_0), Poisson tip
      bifurcation (A -> 2A at rate k_b), differentiated ductal trail deposition
      (A -> A + I), and steric/TGF-beta tip-duct annihilation within radius R_a
      (A + I -> I); verifies exact topological self-termination (N_term = N_branch + 1,
      q_branch -> 1/2) and universal critical Galton-Watson subtree size scaling
      P(S) ~ S^(-3/2) across mouse pubertal mammary gland, metanephric kidney, and
      embryonic pancreas regimes; solves the 1D Fisher-KPP travelling-wave BARW PDE
      demonstrating active-tip wake extinction (a_wake = 0.00038) and homeostatic duct
      plateau i_inf = 0.28695 (vs k_b/k_a = 0.28571); evaluates TGF-beta / R_a
      hyper-branching (R_a = 1.75), hypoplasia (R_a = 7.0), and R_a = 0 non-annihilating
      explosion ablation (+49 unarrested tips, 556 duct crossovers); segments the
      SHA-256-verified mouse branched ductal network fluorescence micrograph
      (`mouse_branched_ductal_network_specimen.jpg`, detecting N_term = 34 active
      distal buds at peripheral r/R_max = 0.7833 and N_branch = 33 bifurcations,
      q_branch = 33/67 = 0.4925); and is backed by 3 machine-checked Lean 4 theorems in
      `morphoeval/lean/loops/Loop_056_branching_random_walk_annihilation.lean`.
    scores:
      model-fidelity:
        value: 95
        rationale: >-
          Implements the full 2D off-lattice spatial BARW ductal network simulator
          with persistent tip migration, Poisson bifurcation (A -> 2A), immutable
          ductal trail deposition (A -> A + I), and steric/TGF-beta tip-duct
          annihilation within sensing radius R_a (A + I -> I) (L156-341); solves the
          1D mean-field Fisher-KPP travelling-wave BARW PDE system (L348-420);
          computes exact critical Galton-Watson subtree size distributions P(S = 2n+1)
          via Catalan numbers (L126-149); and evaluates multi-organ universality across
          mouse mammary gland, kidney, and pancreas plus TGF-beta / R_a perturbations
          and R_a = 0 non-annihilating explosion ablation (L427-504). Backed by 3
          machine-checked Lean 4 theorems (0 `sorry`s) in
          `Loop_056_branching_random_walk_annihilation.lean`.
        evidence:
          - {file: 2017-hannezo-branching-random-walk-annihilation.py, lines: [156, 341], note: "2D off-lattice spatial BARW ductal tree simulator with persistent migration, bifurcation, trail deposition, and R_a annihilation", supports: true}
          - {file: 2017-hannezo-branching-random-walk-annihilation.py, lines: [348, 504], note: "1D Fisher-KPP travelling-wave BARW PDE solver, 3-organ universality collapse, and R_a perturbation/ablation suite", supports: true}
          - {file: morphoeval/lean/loops/Loop_056_branching_random_walk_annihilation.lean, lines: [46, 147], note: "3 machine-checked Lean 4 theorems for topological tree balance, homeostatic duct density, and R_a hyper-branching scaling", supports: true}
      specimen-match:
        value: 90
        rationale: >-
          Loads and SHA-256-verifies the whole-mount fluorescence micrograph of the
          embryonic mouse branched epithelial ductal network
          (`datasets/branching_random_walk_annihilation/mouse_branched_ductal_network_specimen.jpg`)
          and segments the cyan/bright-green active distal buds (A) via chromatic
          difference scoring and connected components alongside the blue/magenta
          differentiated ductal tree (I) via Euclidean distance transform (EDT)
          medial-axis junction detection (`segment_specimen_branched_ductal_network`,
          L511-583), recovering N_term = 34 active tips (localized at peripheral
          invading radius r/R_max = 0.7833 ± 0.2582) and N_branch = 33 internal
          bifurcations (exact binary-tree identity 34 = 33 + 1, q_branch = 33/67 = 0.4925).
        evidence:
          - {file: 2017-hannezo-branching-random-walk-annihilation.py, lines: [511, 583], note: "Chromatic active-tip bud segmentation and EDT medial-axis branch junction extraction on mouse specimen", supports: true}
          - {file: docs/media/branching_random_walk_annihilation_comparison.png, lines: [0, 0], note: "6-panel synthesis figure displaying mouse branched ductal network CV segmentation in Panel F", supports: true}
