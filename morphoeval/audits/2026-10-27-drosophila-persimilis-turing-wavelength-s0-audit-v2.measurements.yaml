      reported_in_source:
      - 'Noor et al. 2001: chromosomal inversions contribute to reproductive isolation between D. pseudoobscura
        and D. persimilis.'
      - 'Dobzhansky & Spassky 1959: D. paulistorum is a cluster of incipient species.'
      - 'Kambysellis et al. 1995: Hawaiian Drosophila diversified by ecological shifts; D. planitibia is the picture-wing
        successor in this chronoseries.'
      - 'Turing 1952 and Schnakenberg 1979: differential diffusion selects a finite critical wavelength.'
      - 'Ready, Hanson & Benzer 1976: the retinal lattice motivates a period near 2 µm.'
      reconstructed_in_script:
      - Onset wavenumber tuned so λ(D. persimilis) = 2.098 µm at r = 20, a = 0.10, b = 0.90.
      - λ(paulistorum) = 1.947 µm and λ(planitibia) = 2.735 µm from L^0.42, then integrated. Centroids 1.955 µm
        and 2.807 µm.
      - Du sweep Pearson r = 0.9993, RMSE = 0.033 µm. Ablation ratio = 0.051. Five-seed SD near 0. β endpoints 0.20
        and 0.70 keep the predecessor shorter than the successor.
      transfer_boundary:
      - 2.098 µm is the assigned detail-tier wavelength (log10 = -5.678), not a numeral in the inversion paper.
      - Body lengths 2.36, 2.82 and 5.30 mm are catalog adult sizes. β = 0.42 is not fitted to a measured pigment
