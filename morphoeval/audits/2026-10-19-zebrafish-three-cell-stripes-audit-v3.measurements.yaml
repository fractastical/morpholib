    claim_boundary:
      reported_in_source:
      - 'Nakamasu et al. (2009): short-range mutual melanophore-xanthophore repulsion plus long-range xanthophore-to-melanophore
        survival support form a Turing network; xanthophore interstripe ablation kills >45% of flanked melanophores
        (Fig. 2); regeneration orientation follows intact boundaries (Fig. 3)'
      - 'Volkening & Sandstede (2015, 2018): agent-based melanophores/xanthophores on a growing domain add stripes
        sequentially; iridophores in dense (interstripe) and loose (stripe) forms switch shape according to the
        local melanophore/xanthophore environment and make stripe formation robust'
      - 'Singh et al. (2014), Frohnhöfer et al. (2013), Patterson & Parichy (2013): iridophores appear on the horizontal
        myoseptum (X0), proliferate as a dense sheet, disperse as loose cells over stripes and re-aggregate at the
        next interstripes; dense iridophores promote xanthophores and exclude melanophores; iridophore-less shady
        mutants lack organized stripes'
      - 'Parichy et al. (2009): post-embryonic stage anchors PB 7.2, PR 8.6, SP 9.6, J 10.4, J+ 11.0, J++ 13.0 mm
        SL'
      reconstructed_in_script:
      - Exact 3x3 Nakamasu Jacobian, Routh-Hurwitz invariants, dispersion curve and a DCT-II IMEX 2D 3-species PDE
        with saturating synthesis (Sections 2-3); in silico Fig. 2 / Fig. 3 ablations (Section 4); leopard sweep
        and dual negative controls (Section 5); specimen segmentation (Section 6)
      - 'Section 5b hybrid model: Lagrangian growing-flank PDE with dilution and D/g^2 diffusion, point iridophore
        agents with S/L state, density-limited proliferation, state-dependent random walk, sigmoidal S<->L switching
        on u - v, anisotropic (x-coherent) density kernel feeding back on the continuum; ontogeny record of stripe
        count vs standard length; controls and sweeps'
      - Lean 4 Theorems 1-6 for the integer kernels of the laws above
      transfer_boundary:
      - 'The hybrid model is a REDUCED version of Volkening & Sandstede: melanophores and xanthophores remain continuum
        fields (no birth/death agent rules), only iridophores are discrete, and the switching rule is a sigmoid
        of the continuum difference u - v rather than counts of neighbouring cells'
      - Growth is isometric and uniform; the standard-length axis is a linear map SL = 7.2 g / 0.4 with no allometry;
        stripe insertion happens by splitting of stretched stripes rather than by marginal addition, and symmetrically
        (X1D and X1V together) rather than ventral-first
      - The normal-table stripe counts in iridophore_ontogeny_reference.json are approximate readings (+/- 1 stripe)
        of published descriptions, not digitized data
      - Panel B and the Fig. 3 regeneration experiment still use the cos(k_c y) whole-flank template cue
      does_not_claim:
      - A reproduction of the Volkening & Sandstede (2015/2018) simulations or their parameter values; quantitative
        iridophore density, sheet correlation length or S/L switching rates measured in vivo; fin (as opposed to
        trunk flank) patterning; the 3V stripe of large adults; the Danio species variability of Volkening & Sandstede
        (2018)
