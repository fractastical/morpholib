# Pass 1 audit — Drosophila paulistorum 2.4 µm ocellar Turing wavelength (slot 3197).
# First integration implemented Schnakenberg kinetics and a habitus render, but the
# nonlinear stripe field did not sit on the stated 2.417 µm mode.

