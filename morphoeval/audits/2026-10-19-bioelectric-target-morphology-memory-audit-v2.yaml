        - "Proximal vs distal salamander limb amputation equifinality (exact stop at L* = 1.00), Farinella-Ferruzza tail-to-limb graft remodeling, rewritten bioelectric target setpoint memory, and Singer (1952) denervation arrest (Pi_s = 0)"
      reconstructed_in_script:
        - "Coupled 4D active-inference ODE solver for 3 proximodistal limb segments (stylopod, zeugopod, autopod) and organ identity psi(t) plus spatial bioelectric V_mem(s,t) kymograph across 5 experimental regimes"
        - "Articulated right forelimb skeleton (shoulder, elbow, wrist, autopod; L = 269.6 px) and 40-bin width profile segmentation on salamander_limb_regeneration_specimen.jpg (Pearson r = 0.8711) and 2D 4-digit forelimb silhouette synthesis"
      transfer_boundary:
        - "Proximodistal 3-segment active-inference trajectories mapped onto 2D articulated Ambystoma mexicanum forelimb silhouettes and joint landmarks"
      does_not_claim:
        - "Single-cell transcriptomic trajectories of blastema dedifferentiation or 3D finite-element bone mineralization mechanics"
    source_refs:
      - pezzulo2015
      - friston2015
      - pezzulo2016
      - vandenberg2012
    summary: >-
      Pass 2 post-remediation evaluation of `2015-pezzulo-bioelectric-target-morphology-memory.py`
      (91.6/100, up from 59.6/100 in Pass 1; +32.0 overall). The remediated script
      integrates the coupled Pezzulo & Levin (2015) and Friston et al. (2015) Variational
      Free Energy gradient flow over 3 proximodistal salamander limb segments (stylopod,
      zeugopod, autopod) and organ identity psi(t), reproducing all 5 canonical experimental
      regimes with zero target-length error (RMSE = 0.0000): proximal shoulder amputation
      (`L_0 = 0.20 -> 1.0000`), distal wrist amputation (`L_0 = 0.70 -> 1.0000`, equifinality
      discrepancy < 1e-6 and initial velocity ratio `v_prox/v_dist = 2.6667 = 8/3`),
      Farinella-Ferruzza tail-to-limb graft remodeling (`psi: -1.0 -> +1.0, L -> 1.0000`),
      rewritten bioelectric setpoint memory (`mu_target' = 1.45 -> L = 1.4500`), and
      Singer (1952) denervated sensory-precision ablation negative control (`Pi_s = 0 -> L = 0.2000`
      complete stump arrest), alongside automated forelimb skeleton and width segmentation on
      `salamander_limb_regeneration_specimen.jpg` (`r = 0.8711`), backed by 3 machine-checked
      Lean 4 theorems in `Loop_084_bioelectric_target_morphology_memory.lean`.
