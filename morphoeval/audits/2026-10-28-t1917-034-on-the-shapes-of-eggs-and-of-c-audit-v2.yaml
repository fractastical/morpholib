        evidence:
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [392, 511], note: "Principal-axis profile extraction, adaptive threshold + scale-bar removal + convex hull + watershed segmentation, per-egg Preston fit, axisymmetry and RMSE", supports: true}
          - {file: docs/media/t1917_034_on_the_shapes_of_eggs_and_of_c_comparison.png, lines: [0, 0], note: "Top row: four museum photographs with segmentation boxes and per-egg E / PA / axisymmetry; C126 silhouette outline vs published Preston fit vs Cartesian oval / ellipsoid", supports: true}
          - {file: datasets/thompson_1917/t1917-034/result.json, lines: [1, 60], note: "Per-specimen table and C126 photo-vs-published coefficients", supports: true}
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [483, 504], note: "Speckled museum eggs give inflated polar asymmetry; museum axisymmetry includes shadow / tilt artefacts", supports: false}
      parameter-expressivity:
        value: 88
        rationale: >-
          Spans 1389 eggs of 30 species, the 10-egg range set, 181 Deeming species and 12
          photographed eggs; sweeps the pole pressure contrast from the sphere to the 99th
