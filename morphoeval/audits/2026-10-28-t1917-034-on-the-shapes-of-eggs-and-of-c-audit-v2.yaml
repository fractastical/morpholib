# MorphoEval audit — Thompson (1917) Ch. XV claim T1917-034, egg meridian-curve family, 2026-10-28 (v2)
#
# Pass 2 (v2) evaluation of `thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py`
# (1033 lines) after completing the 12-step closed remediation loop
# (`2026-10-28-t1917-034-on-the-shapes-of-eggs-and-of-c-loop`):
#   - Primary assessor: Claude Fable 5.1 — 90.1 / 100 (up from 56.1 / 100 in v1; +34.0 overall)
#
# Key remediation improvements verified in Pass 2:
#   1. Thompson's envelope equation p_n + T(1/r + 1/r') = P is now exercised in code: the mean-curvature
#      profile 2H(x) = (P - p_n)/T is inverted on every Biggins egg (`mean_curvature_profile`, L186-210),
#      the four-constraint "Thompson closure" of the Preston family recovers the guillemot C126 from
#      its pressure descriptors to 5.6e-16 and the sphere from uniform pressure (`thompson_closure`,
#      L212-246), and a sphere -> mid-body squeeze -> posterior squeeze pressure path drives the GIF
#      (`thompson_closure_sweep`, L248-277; max closure residual along the path 1.3e-15).
#   2. All five vendored specimen photographs are segmented (`_egg_candidates`, `segment_specimens`,
#      L392-511: adaptive Otsu / multi-Otsu, scale-bar removal, convex hull, watershed): 12 eggs of
#      Thompson's owl / grebe / plover / guillemot classes, axisymmetry residual 0.4 % (back-lit C126;
#      museum median 4.2 %), and the C126 photograph re-fitted to c = (0.488, -0.245, 0.043, 0.117) vs
#      published (0.488, -0.246, 0.039, 0.121), E = 1.8616 vs 1.8607, profile r = 0.99999.
#   3. Negative / ablation controls: Steiner's Cartesian oval is 7.4x worse than Preston on the
#      guillemot (Thompson p. 654 footnote confirmed), the prolate-ellipsoid null 31x worse, and the
#      published Baker / Carter alternatives 35x / 81x worse in MSE (`fit_cartesian_oval`, `fit_ellipsoid`,
#      L514-556).
#   4. Statistics: between-species eta^2 = 0.67 / 0.83 / 0.47 for elongation / pointedness / polar
#      asymmetry (Kruskal-Wallis p < 1e-92, 29 species), order-level eta^2 of Deeming PC1 / PC2 = 0.38 /
#      0.57, KS D = 0.96 guillemot vs penguins, Preston RMSE / breadth median 0.0018, Spearman rho = 0.39
#      (p = 7e-8) asymmetry vs relative egg mass; 17 reference-anchored measurements, runtime SHA-256
#      verification of 13 files, CLI overrides, 20-assert self-test with two-run determinism, result.json.
#
# Residual weaknesses carried forward: polar asymmetry from convex-hull fits of speckled museum eggs is
# inflated (PA 3-8 vs species means 2.4-2.9) and the one-parameter pressure path tracks species means
# only moderately (r = 0.54) because penguins and auks differ in elongation at equal asymmetry.

