          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [559, 633], note: "analyse(): statistics, controls, closure and sweep computed once and shared by figure, measurements and result.json", supports: true}
