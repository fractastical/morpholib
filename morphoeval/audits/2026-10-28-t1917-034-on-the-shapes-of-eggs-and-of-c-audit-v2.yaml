        evidence:
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [956, 996], note: "Comprehensive self_test() with integrity, closure, CV and determinism assertions", supports: true}
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [874, 954], note: "result.json writer with verdict by component, headline numbers and notes", supports: true}
