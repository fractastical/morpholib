simulations:
  - id: thompson1917-t1917-034
    name: "Thompson (1917) Ch. XV: eggs as solids of revolution of a definite, species-varying family of ovoid meridian curves (Preston 1953 family on Biggins et al. 2018 / Deeming 2018 data)"
    organism: "Aves egg shells: Uria aalge (Common Guillemot), Vanellus vanellus (Northern Lapwing), Strix aluco (Tawny Owl), Podiceps cristatus (Great Crested Grebe); 30 auk + penguin species (1389 eggs); 181 species / 30 orders"
    script: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py
    output: docs/media/t1917_034_on_the_shapes_of_eggs_and_of_c_comparison.png
    extra_outputs:
      - docs/media/t1917_034_on_the_shapes_of_eggs_and_of_c_growth.gif
      - datasets/thompson_1917/t1917-034/result.json
    status: evaluated
    supersedes_audit_id: 2026-10-28-t1917-034-on-the-shapes-of-eggs-and-of-c-audit
    source_refs:
      - thompson1917
      - thompson1908
      - preston1953
      - biggins2018
      - biggins2018data
      - deeming2018
      - deeming2017data
      - stoddard2017
    claim_boundary:
      reported_in_source:
        - "Thompson 1917 p. 652: eggs are simple solids of revolution; forms range from spherical (owl, penguin, tortoise) through ellipsoidal (grebe, cormorant, pelican) and ovoid (hen) to blunt-pointed conical (guillemot, puffin, sandpiper, plover, curlew); prolate never oblate."
        - "Thompson 1917 p. 654 footnote: Steiner's Cartesian oval r + m r' = c 'fails in such a case as the guillemot'."
        - "Thompson 1917 p. 655 (5): the most unsymmetrical / tapered eggs are large relative to the parent bird (apteryx the exception, p. 656)."
        - "Thompson 1917 pp. 657-659: cone-ended-cylinder balance p cos^2(theta) = p' cos^2(theta'); envelope equation p_n + T(1/r + 1/r') = P; spherical egg <=> uniform p_n."
      reconstructed_in_script:
        - "Preston (1953) four-parameter meridian family with Biggins et al. (2018) indices, closed-form polar asymmetry R_pole = p(+/-1)^2 and exact volume functional (Lean Laws 1-2)."
        - "Thompson closure: pole / equator curvature constraints + equator position determine the Preston coefficients; mean-curvature (excess pressure) profile of every egg; pressure-asymmetry path sphere -> ellipsoid -> conical."
        - "Computer-vision segmentation and Preston weighted least squares (Biggins Analysis.R estimator) on 12 eggs in 5 photographs; axisymmetry residual; Cartesian-oval and ellipsoid controls."
        - "eta^2 / Kruskal-Wallis across 30 species and 15 orders, KS test, RMSE / breadth, Spearman asymmetry vs relative egg mass."
      transfer_boundary:
        - "The Preston family is a 1953 descriptor adopted as the quantitative reading of Thompson's 'definite family'; Thompson gave no algebraic family."
        - "Biggins et al. (2018) eggs are auks and penguins (plus a 10-egg range set); order-level breadth comes only from Deeming's outline PCs; museum photographs are oblique-lit and bound the axisymmetry test from above."
        - "The Thompson closure is a kinematic reading of his equilibrium equation (curvature <-> excess pressure), not a dynamic oviduct simulation; friction and tangential forces he mentions are not modelled."
      does_not_claim:
        - "That oviduct pressure is demonstrated to be the cause of the family; only the geometric claim and the internal consistency of Thompson's equation are tested."
        - "Anything about eggshell microstructure, colour, or non-avian hard-shelled eggs beyond Thompson's mention."
    summary: >-
      Pass 2 (v2) evaluation of
      `thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py`
      (overall weighted score: 90.1/100, up from 56.1/100 in v1). The remediated script verifies the
      13 pinned dataset files at runtime, inverts Thompson's envelope equation on every egg as the
      excess-pressure profile (P - p_n)/T = 2H(x), closes the Preston family from four curvature
      constraints (C126 recovered to 5.6e-16; sphere from uniform pressure), and drives a
      sphere -> ovoid -> conical pressure path. It segments 12 eggs of Thompson's owl, grebe, plover
      and guillemot classes from five photographs (axisymmetry residual 0.4 % on the back-lit C126
      silhouette, museum median 4.2 %), re-fits the C126 photograph to c = (0.488, -0.245, 0.043, 0.117)
      vs published (0.488, -0.246, 0.039, 0.121) (E 1.8616 vs 1.8607, profile r = 0.99999), and shows
      Steiner's Cartesian oval 7.4x and the ellipsoid null 31x worse than Preston on the guillemot
      (Thompson's own footnote). Species signal: eta^2 = 0.67 / 0.83 / 0.47 for elongation /
      pointedness / polar asymmetry (p < 1e-92), order-level eta^2 0.38 / 0.57 (Deeming PC1 / PC2),
      KS D = 0.96; prolate-never-oblate holds (min E = 1.035 over 1411 eggs); asymmetry rises with
      relative egg mass (rho = 0.39, p = 7e-8). Verdict written to result.json: supported, with two
      flagged details (King Penguin is not spherical; Thompson's pole-tension remark has the sign
      reversed under his own equation).
    scores:
      model-fidelity:
        value: 91
        rationale: >-
          Implements the Preston family, indices and exact volume (L110-184) matching Lean Laws 1-2,
          and now exercises Thompson's own mechanics: the envelope equation inverted as 2H(x) =
          (P - p_n)/T with exact pole limits (L186-210), the four-constraint Thompson closure that
          recovers C126 and the sphere (L212-246), the empirical pressure-asymmetry path (L248-277)
          and the cone-balance ratio (L279-286), all cross-referenced to the 5 Lean theorems. The
          closure is kinematic (curvature <-> pressure) rather than a dynamic oviduct model with
          friction, which Thompson himself invokes.
        evidence:
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [110, 184], note: "Preston polynomial, analytic widest point, closed-form pole radius and volume, Biggins weighted LS estimator", supports: true}
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [186, 286], note: "Analytic derivatives, mean-curvature (excess pressure) profile, Thompson closure, pressure path, cone-balance ratio", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_034.lean, lines: [40, 191], note: "5 machine-checked theorems (pole asymmetry, volume + reflection invariance, envelope equation at poles, cone equilibrium, prolate-never-oblate), no admitted goals", supports: true}
          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [248, 277], note: "Pressure path is a conditional-mean regression through the data, not a solved membrane dynamics problem", supports: false}
      specimen-match:
        value: 88
        rationale: >-
          Segments all five vendored photographs (`_egg_candidates`, `segment_specimens`,
          L392-511) into 12 eggs spanning Thompson's four named classes, tests the solid-of-
          revolution property (C126 upper-vs-lower profile RMS 0.4 % of half-breadth; museum
          median 4.2 %, max 11.9 % on a shadowed lapwing egg), reproduces the published C126
