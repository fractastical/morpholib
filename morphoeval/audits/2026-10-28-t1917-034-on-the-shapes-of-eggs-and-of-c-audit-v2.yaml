          - {file: thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py, lines: [999, 1030], note: "CLI parameter overrides wired into the Thompson closure and rendering", supports: true}
      morphometric-validation:
        value: 92
        rationale: >-
          `measure_morphoeval()` (L816-871) returns 17 reference-anchored measurements: min
          elongation 1.035 (ref 1), axisymmetry 0.048 mean (ref 0), C126 photo E 1.8616 vs 1.8607
          and PA 2.67 vs 2.63, profile r = 0.99999, Preston RMSE/B 0.0023 on C126 vs 0.0018 median,
