          - {file: datasets/thompson_1917/t1917-034/t1917_034_on_the_shapes_of_eggs_and_of_c_reference.json, lines: [1, 440], note: "Equations, parameter tables, claim decomposition C1-C8, vendored and upstream SHA-256 pins, licences", supports: true}
      code-traceability:
        value: 90
        rationale: >-
          The module header maps each section to Thompson's pages (652, 654, 655, 657-659) and to
          the five Lean theorems (L1-57); function docstrings cite Biggins Analysis.R (estimator,
          fat.point), Lean law numbers and Thompson page numbers; the Math KG YAML links each law to
