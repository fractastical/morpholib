    claim_boundary:
      reported_in_source:
      - Turing 1952 and Schnakenberg 1979 select a finite critical wavenumber when the inhibitor out-diffuses the
        activator.
      - Geng, Yan and Zhou 2022 and Bartz and Gola 2018 describe the Ceratopteris notch meristem and archegonium
        positions. They do not publish a 256 µm pigment wavelength.
      reconstructed_in_script:
      - gamma is solved so k_c = 2*pi/256 µm on a 768 µm periodic window at age 0 Ma.
      - The rendered activator is initialized on that critical mode plus seed-3143 noise.
      transfer_boundary:
      - Applying Schnakenberg kinetics to the gallery primordium plate is a scale assignment, not a measurement
        from the fern papers.
      does_not_claim:
      - That Ceratopteris pigment was shown experimentally to obey these rate constants.
      - That a fossil chronospecies at 512 µm was measured. The series has one node, Holocene 0 Ma.
      - That the Pass-1 GIF matches the plate. CV similarity is 65.9.
