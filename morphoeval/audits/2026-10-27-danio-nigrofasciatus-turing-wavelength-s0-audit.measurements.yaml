    claim_boundary:
      reported_in_source:
      - Turing 1952 dispersion relation and the critical-wavenumber formula.
      - Schnakenberg 1979 kinetics f = a - u + u^2 v, g = b - u^2 v.
      - 'Nakamasu et al. 2009: Danio pigment cells implement short-range activation and long-range inhibition and
        can form stripes or spots.'
      - 'Parichy 2006: D. nigrofasciatus keeps a striped dorsum and a broken ventral field, unlike spotted D. margaritatus
        and striped D. rerio.'
      reconstructed_in_script:
      - Explicit-Euler anisotropic Schnakenberg on a periodic cellular patch with dx set so analytical lambda_c
        equals 2.71e-05 m.
      - alpha_dorsal=6, alpha_ventral=1.15, break at 0.60 of flank height for the focal species; alpha=1.05 and
        alpha=8.5 for the chronospecies.
      - Trunk mask and composite painted onto the vendored Parichy photograph.
      transfer_boundary:
      - 27 µm is the catalog cellular wavelength, not a length resolved by the whole-body photograph.
      - alpha stands in for iridophore / Kcnj13 coupling; the script does not model those cells explicitly.
      does_not_claim:
      - Does not claim the organ-scale ~1 mm stripe spacing of slot 1203.
      - Does not claim the dorsoventral optical-density profile of the photograph is reproduced (profile Pearson
        r = 0.023).
      - Does not claim a second independent assessor.
