    claim_boundary:
      reported_in_source:
      - Turing (1952) selects a finite wavenumber when inhibitor diffusion is fast enough. Schnakenberg (1979) supplies
        the trimolecular kinetics. Kondo & Miura (2010) review wavelength selection by reaction and diffusion rates.
      - Armon et al. (2011) measured centimetre-scale helical opening of Bauhinia variegata valves. That is a different
        law.
      reconstructed_in_script:
      - D_u and D_v are chosen so the linear k_c equals 2π/69.12 µm. The 69.12 µm length is the assigned detail
        scale of this slot, not a counted spacing on the pericarp.
      transfer_boundary:
      - The photograph is a centimetre-scale herbarium scan (CC BY-SA 3.0, Roger Culos). It shows the valve envelope.
        It does not resolve 69.12 µm.
      does_not_claim:
      - Does not claim a published 69.12 µm pigment measurement for Bauhinia variegata.
      - Does not claim the reaction-diffusion field generates the pod silhouette or the seed positions.
      - Does not reuse Armon et al. curvature parameters.
