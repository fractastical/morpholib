    claim_boundary:
      reported_in_source:
      - Turing 1952 selects a finite critical wavenumber from a reaction-diffusion instability.
      - 'Glassford 2015: the epandrial posterior lobe is a melanogaster-subgroup novelty.'
      - 'Hagen 2020: simulans-clade lobes diverged within about the last 240,000 years.'
      - Edwards 2007 documents Hawaiian picture-wing melanin; Huey 2000 documents the subobscura size cline.
      reconstructed_in_script:
      - λ_c = 1.92 µm is the slot assignment. Neighbour wavelengths 2.64 µm and 1.60 µm are γ retunings.
      - On a 96 µm arc the mode counts are 36 (silvestris), 50 (simulans), 60 (subobscura).
      - The plate annulus measures 67.57 µm (111 px scale bar = 100 µm), or 35.2 detail wavelengths per ring.
      transfer_boundary:
      - Silvestris and subobscura are catalog neighbours at 0 Ma, not phylogenetic ancestors.
      - The 1.92 µm law is not the 83 µm tergite-band model of slot 2701.
      does_not_claim:
      - Does not claim a published measurement of 1.92 µm granule spacing.
      - Does not claim the gallery plate is an electron micrograph of the clasper.
      - Does not claim GIF-to-plate CV similarity uniquely identifies D. simulans; the whole-fly control also scores
        85.6.
