    claim_boundary:
      reported_in_source:
        - "Zajac, Jones & Glazier (2000, 2003) Phys. Rev. Lett. 85:2022 / J. Theor. Biol. 222:247-259 anisotropic differential adhesion energy J(theta) = J_0 - Delta_J cos(2*theta) and pure-shear convergent-extension aspect ratio scaling R_CE(t) = R_0 exp(2*dot_epsilon_T1*t)"
        - "Bertet, Sulak & Lecuit (2004) Nature 429:667-671 planar-polarized Myosin II enrichment on vertical/AP-facing type-1 junctions driving irreversible 4-way T1 vertex resolution into horizontal/ML type-3 junctions"
      reconstructed_in_script:
        - "64-cell planar-polarized T1 intercalation lattice solver with exact incompressible 2D tissue area conservation (L_AP * L_ML = A_0, error < 1e-15) and midpoint RK2 ODE convergence verification (L2 relative error 1.19e-7)"
        - "5-regime genetic & mechanical perturbation simulator (Wild-Type R_CE=3.859, T1/cell=1.45; Moderate Anisotropy R_CE=2.375; Xdd1/PCP mutant R_CE=1.566; Myosin II zip/sqh mutant R_CE=1.204; Isotropic Null Control R_CE=1.000, T1/cell=0.00; Pearson r=1.0000, RMSE=0.0042)"
        - "Automated confocal Xenopus explant segmentation and rose-diagram angular correlation on convergent_extension_axis_specimen.jpg (chordamesoderm L/W=4.945 vs animal cap 0.962; nematic S_2=0.613 vs 0.094; rose angular correlation r=0.9677)"
      transfer_boundary:
        - "2D planar 64-cell intercalating tissue sheet and 4-cell T1 quartet junction mechanics mapped to Xenopus chordamesoderm explants and Drosophila germband extension"
      does_not_claim:
        - "Full 3D multicellular rosette (5+ cell vertex) resolution or explicit subcellular F-actin/EB3 microtubule polymerization reaction-diffusion kinetics"
    source_refs:
      - zajac2003
      - zajac2000
      - bertet2004
      - wallingford2000
    summary: >-
      Pass 2 post-remediation evaluation of `2003-zajac-convergent-extension-intercalation.py` (91.9/100,
      up from 61.2/100 in Pass 1; +30.7 overall). The remediated script integrates the 64-cell Zajac et al.
      (2000, 2003) anisotropic differential adhesion law J(theta) = J_0 - Delta_J cos(2*theta) coupled with
      Bertet et al. (2004) planar-polarized Myosin II vertical junction contraction and irreversible T1
      quartet resolution, verifies midpoint RK2 convergence of the pure-shear ODE against
      R_CE(t) = R_0 exp(2*dot_epsilon_T1*t) (L2 relative error = 1.19e-7), enforces exact 2D tissue area
      conservation L_AP * L_ML = A_0, reproduces all 5 experimental regimes (Pearson r = 1.0000,
      RMSE = 0.0042), sweeps a 15x15 2D parameter morphospace, and validates cellular aspect ratio and
      angular rose polarity against the confocal Xenopus explant specimen
      (`convergent_extension_axis_specimen.jpg`, L/W = 4.945 vs 0.962, rose angular r = 0.9677), backed
      by 3 machine-checked Lean 4 theorems in `Loop_093_convergent_extension_intercalation.lean`.
