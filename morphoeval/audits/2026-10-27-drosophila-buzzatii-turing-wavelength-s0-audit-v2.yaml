    source_refs: [turing1952, schnakenberg1979, norry1997, cortese2002]
    model_spec:
      model: "Schnakenberg 1979 / Turing 1952, gamma solved for lambda_c = 2.908 um"
      a: 0.12
      b: 0.85
      Du: 0.040
      Dv: 1.160
      gamma: 0.5186191067572579
      grid_resolution: [80, 80]
      steps: 1800
      dt: 0.035
      seed: 3179
      inputs:
        - datasets/drosophila_buzzatii_turing_wavelength_s0/drosophila_buzzatii_turing_wavelength_s0_reference.json
        - datasets/drosophila_buzzatii_turing_wavelength_s0/drosophila_buzzatii_turing_wavelength_s0_specimen.jpg
    claim_boundary:
      reported_in_source:
        - "Turing 1952: instability at a finite critical wavenumber k_c."
        - "Schnakenberg 1979: activator-inhibitor kinetics with a quadratic autocatalytic term."
        - "Norry, Vilardi & Hasson 1997 and Cortese et al. 2002: wing length and thorax size in D. buzzatii are correlated and respond to selection; inversions rearrange the correlations."
      reconstructed_in_script:
        - "gamma = 0.518619 so lambda_c = 2.908 µm exactly on this Jacobian."
        - "Fourteen-point gamma sweep: Pearson r = 0.99995, RMSE = 0.962 µm between closed-form and discrete-mode wavelengths."
        - "Saturated field wavelength 3.53 µm (radial FFT), a coarsening residual against the linear target."
        - "Equal diffusion max Re(sigma) = -0.0496."
        - "Species-card segmentation: foreground 0.39-range, coherency about 0.67 versus field coherency about 0.25; KS radial 0.458."
      transfer_boundary:
        - "The 1.70 mm wing chord is a representative length for mode counting, not a reprinted Norry mean."
        - "Predecessor 85.92 µm and successor 207.6 µm are the registry chronoseries scales, not re-fit here."
      does_not_claim:
        - "That 2.908 µm was measured by Norry as a pigment spacing."
        - "That the species-card JPEG is a photograph of micro-ocelli. It is the gallery fallback after Commons, iNaturalist, and GBIF returned no CC adult bitmap."
        - "That the modulated card is a pixel copy of a wing SEM."
    summary: >-
      Pass 2 re-ran the script. Analytical lambda is 2.908 µm at 0 Ma.
      Discrete-mode sweep Pearson r = 0.99995 (RMSE 0.962 µm). Saturated spots
      sit at 3.53 µm. Ablation growth is negative. KS radial between the card
      and the pure field is 0.458. Image fitness against the canonical card is
      85.4 with CV similarity 84.6 on a 12-frame 720×540 GIF. On a 1.70 mm chord
      the mode counts are 584 (buzzatii), 19 (bipectinata), and 8 (cyrtoloma).
    scores:
      model-fidelity:
        value: 91
        rationale: "Schnakenberg kinetics, the four Turing inequalities, and the critical-wavenumber formula are implemented directly. gamma is solved for this slot's 2.908 µm target. The 102 µm sibling's power-law coefficients are not used."
        evidence:
          - {file: models/2026-delphi10000-drosophila-buzzatii-turing-wavelength-s0.py, lines: [86, 120], note: "jacobian through turing_discriminant_holds", supports: true}
          - {file: models/2026-delphi10000-drosophila-buzzatii-turing-wavelength-s0.py, lines: [182, 223], note: "periodic explicit Euler of the PDE", supports: true}
          - {file: morphoeval/lean/loops/Loop_3179_drosophila_buzzatii_turing_wavelength_s0.lean, lines: [28, 48], note: "five theorems, zero sorry", supports: true}
      specimen-match:
        value: 85
        rationale: "Side by side, the pure field is a spot lattice (micro-ocelli) and the GIF paints that density onto the canonical card, from a blank frame (activator std 0.010) to a spotted frame (std 0.926). The card itself is a radial texture, not a wing micrograph, so the score stays below a photographic match."
        evidence:
          - {file: docs/media/drosophila_buzzatii_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "panels A card+segment, B pure u, C overlay", supports: true}
          - {file: docs/media/drosophila_buzzatii_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 720×540, CV similarity 84.6", supports: true}
      parameter-expressivity:
        value: 91
        rationale: "Raising gamma shortens both the analytical and the discrete-mode wavelength (panel D, r = 0.99995). Setting D_v = D_u flips max Re(sigma) from positive to -0.050 (panel F)."
        evidence:
          - {file: models/2026-delphi10000-drosophila-buzzatii-turing-wavelength-s0.py, lines: [152, 179], note: "gamma_sweep and ablation_max_growth", supports: true}
          - {file: docs/media/drosophila_buzzatii_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "panels D and F", supports: true}
