        rationale: "Pearson r = 0.99995 and RMSE = 0.962 µm on the dispersion sweep. Nonlinear wavelength 3.53 µm versus linear 2.908 µm. Specimen coherency differs from field coherency. KS radial = 0.458 against a reference of 0. None of the specimen metrics are value == reference."
        evidence:
