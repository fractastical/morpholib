simulations:
  - id: delphi10000-chamaeleo-calyptratus-turing-wavelength-s0
    name: "Holocene Chamaeleo calyptratus Turing wavelength at 260.4 µm (Pass 1)"
    organism: "Chamaeleo calyptratus (veiled chameleon)"
    script: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py
    output: docs/media/chamaeleo_calyptratus_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, murray1981, ligon2013, teyssier2015]
    summary: >-
      Schnakenberg kinetics on a periodic flank patch, diffusivities solved so the
      most-unstable wavelength is 260.4 µm, with Dv_y/Dv_x = 0.42 so the unstable
      modes are anteroposterior. Self-test: analytical λ = 260.55 µm, saturated
      field λ = 254.3 µm, stripe anisotropy 17.3, sweep Pearson r = 0.999,
      dispersion Pearson r = 0.998, equal-diffusion ablation ratio 1.9e-4.
      The GIF opens on the noisy field and ends on the H. Zell photograph;
      the simulated bars are not visible in the last frame.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and Murray 1981 wavenumber for a two-species reaction-diffusion system."
        - "Schnakenberg 1979 kinetics du/dt = Du lap u + A - u + u^2 v, dv/dt = Dv lap v + B - u^2 v."
        - "Ligon & McGraw 2013: male Chamaeleo calyptratus change lateral stripe brightness during contests."
        - "Teyssier et al. 2015: chameleon skin has a tunable guanine-nanocrystal iridophore lattice. The animals in that study are panther chameleons (Furcifer pardalis); the reported spacing is of order 100 nm."
      reconstructed_in_script:
        - "A = 0.062, B = 1.150, supercritical factor 1.45, and Dv_y/Dv_x = 0.42, chosen so λ_c sits on the 260.4 µm slot scale and the pattern is a vertical bar."
        - "The 80 µm predecessor cutoff and the 10-wavelength (2.604 mm) successor envelope. The chronoseries has one Holocene point at 0 Ma."
      transfer_boundary:
        - "Dermal chromatophore anatomy is transferred from the panther-chameleon study to C. calyptratus. The 260.4 µm carrier is the slot scale, not a number reported by Ligon or Teyssier."
      does_not_claim:
        - "Does not claim a calibrated micrometre measurement from the Wikimedia photograph, which has no scale bar."
        - "Does not claim the guanine lattice spacing is 260.4 µm."
        - "Does not claim a second independent assessor."
    scores:
      model-fidelity:
        value: 86
        rationale: "Equations (1)-(4) are the Schnakenberg system and the Turing dispersion, integrated by spectral IMEX. The dorsoventral diffusion ratio is an addition that the cited papers do not contain."
        evidence:
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [94, 163], note: "steady state, Jacobian, critical ratio, sigma(k), diffusivities solved for k_peak = 2π", supports: true}
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [166, 243], note: "IMEX step and periodic patch integrator, including the equal-diffusion ablation", supports: true}
      specimen-match:
        value: 70
        rationale: "The comparison figure places the H. Zell animal next to a green-gold vertical-bar field. The bars are the right family of pattern, but they are a periodic patch, not the animal's outline. GIF frame 12 is the photograph; the simulated bars have dropped out."
        evidence:
          - {file: docs/media/chamaeleo_calyptratus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, saturation mask, saturated activator, dispersion", supports: true}
          - {file: docs/media/chamaeleo_calyptratus_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 720x540; frame 1 is the initial field, frame 12 is the photograph", supports: true}
      parameter-expressivity:
        value: 84
        rationale: "Scaling both diffusivities by s in {0.70, 0.85, 1.00, 1.15, 1.30, 1.50} moves the measured wavenumber with the predicted 1/sqrt(s) schedule (r = 0.999). The anisotropy switch is exercised by the ablation but not by a second rendered morph."
        evidence:
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [287, 307], note: "parameter_sweep on a 12×8 wavelength patch", supports: true}
      morphometric-validation:
        value: 86
        rationale: "Dispersion Pearson r = 0.998 (RMSE 0.028), sweep Pearson r = 0.999 (RMSE of k = 0.048), KS distance 0.45 between specimen and field orientation histograms, ablation amplitude ratio 1.9e-4. The 260.4 µm target is not a measurement on this photograph."
        evidence:
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [245, 285], note: "eigenvector-seeded dispersion sample", supports: true}
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [462, 530], note: "measure_morphoeval rows with value != reference", supports: true}
          - {file: datasets/chamaeleo_calyptratus_turing_wavelength_s0/chamaeleo_calyptratus_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "pass-1 numeric bundle", supports: true}
      source-traceability:
        value: 88
        rationale: "Crossref-checked DOIs for Turing, Schnakenberg, Murray, Ligon & McGraw, and Teyssier. Specimen is H. Zell, CC BY-SA 3.0, SHA-256 pinned. The slot scale is identified as assigned rather than measured."
        evidence:
          - {file: datasets/chamaeleo_calyptratus_turing_wavelength_s0/paper_citations.bib, lines: [1, 48], note: "five bibliographic records", supports: true}
          - {file: datasets/chamaeleo_calyptratus_turing_wavelength_s0/chamaeleo_calyptratus_turing_wavelength_s0_reference.json, lines: [1, 40], note: "scale 260.4 µm, age 0 Ma, specimen SHA-256", supports: true}
      code-traceability:
        value: 82
        rationale: "The module docstring names equations (1)-(4) and the functions follow that order. There is no line-by-line map onto Murray's section numbers."
        evidence:
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [1, 55], note: "docstring states scale, age, equations, and the transfer boundary", supports: true}
      repro-package:
        value: 84
        rationale: "Seed 3144, --self-test covering the dispersion, the sweep, the ablation and the mask, and a documented invocation. Dependencies are the repo scientific stack. One assessor."
        evidence:
          - {file: models/2026-delphi10000-chamaeleo-calyptratus-turing-wavelength-s0.py, lines: [696, 722], note: "self_test gates", supports: true}
          - {file: datasets/chamaeleo_calyptratus_turing_wavelength_s0/README.md, lines: [1, 40], note: "scale, age, reproduce commands", supports: true}
    remediation:
      - id: R1
        item: "GIF frame 12 is the unmodified photograph, so the selected bars are not visible at the end of the animation. Composite the saturated field onto the flank and keep the enclosure."
      - id: R2
        item: "Saturation mask still includes rock above the dorsum and a sand sliver. Restrict the orientation metric to a flank ROI."
      - id: R3
        item: "The GIF caption uses a lambda glyph the default bitmap font cannot draw."
      - id: R4
        item: "Single assessor. Left open; a second provider was not available in this run."
