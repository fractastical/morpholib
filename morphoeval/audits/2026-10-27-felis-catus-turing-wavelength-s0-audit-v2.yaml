# MorphoEval audit v2 — Felis catus Turing wavelength, 436 µm, Holocene 0 Ma.
# Pass 2 closes the pass-1 gaps: Dv sweep, simulated ablations, specimen segmentation,
# and dispersion goodness-of-fit (Pearson r = 0.990).
