    spec_fingerprint: 04e6692e5c44347cdef3ff055c0cf966e6a50c079cad3d06d965f070f3683587
    artifact_sha256: 5ffd7144ad26d4d8b06fe5b2d7ddf385312e2ed564432552abf59cecd5490808
    input_dataset_sha256: {}
    claim_boundary:
      reported_in_source:
      - 'Brodland (2002) J. Biomech. Eng. Eqs. 1-4: Differential Interfacial Tension Hypothesis (DITH) decomposing
        cell-cell interfacial tension into actomyosin cortical tension minus cadherin adhesion (gamma_{alpha,beta}
        = beta_alpha + beta_beta - omega_{alpha,beta}).'
      - 'Krieg et al. (2008) Nature Cell Biology Figs. 1-4: AFM cortical tension hierarchy across zebrafish shield-stage
        germ-layer progenitors (beta_ectoderm ~ 50 < beta_mesoderm ~ 95 < beta_endoderm ~ 130 pN/um) obtained by
        lefty1 / cyclops / cyclops+casanova mRNA injection, concentric 3-germ-layer sorting, Blebbistatin Myosin-II
        inhibition arrest, and caMLCK ectodermal cortical stiffening sorting reversal.'
      - 'Maître et al. (2012) Science Eq. 1: Young-Dupré cell-doublet contact angle cos(theta) = 1 - gamma_cc/(2*gamma_cm)
        and normalized contact radius r_c/R = sin(theta).'
      - 'Chen & Schier (2001), Dubrulle et al. (2015), van Boxtel et al. (2015), Hagos & Dougan (2007): Nodal (Squint/Cyclops)
        acts as a graded marginal morphogen whose signalling domain is set by a temporal window between sphere and
        shield stage and whose dose specifies mesoderm vs endoderm; Gritsman et al. (1999): MZoep embryos lack all
        mesendoderm.'
      reconstructed_in_script:
      - 2D deformable DITH cell sorting across all 4 perturbation regimes (wild-type engulfment, caMLCK cortex reversal,
        Blebbistatin Myosin-II inhibition, and high-HIT mushroom doublet) plus simultaneous 3-germ-layer concentric
        stratification (r_E = 0.870 > r_M = 0.663 > r_N = 0.446), a 7-point continuous beta_E sweep across the sorting
        inversion threshold beta_E = beta_M = 95 pN/um, and the Young-Dupré doublet contact curve.
      - 'Pass 3: a reduced time-dependent Nodal/TGF-beta coupling — 1D marginal Nodal field C(x,t) with range lambda
        = 3 tiers and rise time tau_N = 0.6 h from 4.0 hpf, two-threshold Hill dose -> cortical tension target (beta_E/beta_M/beta_N
        = 50/95/130 pN/um), first-order cortex relaxation tau_beta = 0.5 h, and a continuous-cortex DITH closure
        gamma_ij = (2/3)|beta_i - beta_j| re-evaluated every MCS inside the lattice sorter; the model reproduces
        5 mesendoderm / 2 endoderm tiers at shield stage, establishes the Krieg hierarchy by 4.87 hpf, reaches Delta_r
        = +0.350 at 7 hpf, and gives Delta_r = 0 with no mesendoderm in the Nodal-null (C0 = 0) control; 5-point
        C0 dose sweep.'
      - Computer-vision segmentation of a zebrafish blastoderm transplantation GFP/RFP micrograph (`germ_layer_doublet_specimen.jpg`)
        across both layered engulfment (Row B, radial profile r = 0.9301, RMSE = 0.1844) and the protruding mushroom
        doublet (Row C, empirical r_c/R = 0.9717).
      transfer_boundary:
      - 2D lattice DITH representation of 3D zebrafish germ-layer progenitor reaggregates and blastoderm transplants;
        the circular 60-cell disc with medium all round is a reaggregate, not an embryo, so 'internalization' is
        sorting toward the disc centre.
      - The Nodal coupling is 1D in tier distance from the margin, each cell's Nodal exposure is frozen to its tier
        of origin (specification memory), there is no epiboly / YSL motion and no Lefty feedback; lambda, K_M, K_N,
        tau_N and tau_beta were chosen to reproduce recalled literature anchors (~5 mesendoderm tiers, endoderm
        from tiers 1-2), not fitted to a digitised pSmad2 profile.
      - The vendored specimen is a Wikimedia whole-blastoderm / yolk-cell transplant micrograph, not a Krieg et
        al. (2008) progenitor aggregate or a shield-stage internalization image; it is a proxy for layered GFP/RFP
        sorting, and no specimen underlies the Nodal row of the figure.
      does_not_claim:
      - Does not model sub-second single-molecule E-cadherin bond rupture kinetics, whole-embryo epiboly yolk-syncytial-layer
        microtubule pulling, 2D/3D Nodal-Lefty reaction-diffusion, or quantitative pSmad2 gradient fits.
