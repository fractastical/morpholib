        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [134, 176], note: "SHA-256 registry for 5 files and fail-closed verify_dataset_integrity()", supports: true}
          - {file: datasets/joint_interzone_clefting/synovial_cavitation_reference.json, lines: [1, 100], note: "Eight Pass 3 sources with DOI/PMID and finding, reduced model equations and parameters", supports: true}
          - {file: datasets/joint_interzone_clefting/paper_citations.bib, lines: [56, 144], note: "BibTeX entries appended for Drachman 1966 ... Maroudas 1976", supports: true}
          - {file: datasets/joint_interzone_clefting/README.md, lines: [1, 43], note: "Dataset README with file table, Pass 3 additions and claim boundary", supports: true}
      code-traceability:
