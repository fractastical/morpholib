simulations:
  - id: onuff-joint-interzone-clefting
    name: "Kavanagh et al. (2013) phalangeal Inhibitory Cascade & Hiscock et al. (2017) BMP-GDF5-Noggin synovial joint interzone segmentation, with Pass 3 reduced Biot poroelastic synovial cavitation"
    organism: "Gallus gallus / Mus musculus tetrapod autopod digits & synovial joint interzones"
    script: 2016-onuff-joint-interzone-clefting.py
    output: docs/media/joint_interzone_clefting_comparison.png
    extra_outputs:
      - docs/media/joint_interzone_clefting_cavitation.png
      - docs/media/joint_interzone_clefting_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-joint-interzone-clefting-audit-v2
    source_refs:
      - kavanagh2013
      - hiscock2017
      - hartmann2001
      - brunet1998
      - storm1994
      - drachman1966
      - kahn2009
      - roddy2011
      - carter1988
      - edwards1994
      - dowthwaite1998
      - mow1980
      - maroudas1976
    claim_boundary:
      reported_in_source:
        - "Kavanagh et al. (2013): phalanx lengths of triphalangeal digits across tetrapods fall on the inhibitory-cascade line P2/P1 = 1/2 + 1/2 (P3/P1), i.e. P2 is 1/3 of the phalangeal total"
        - "Hiscock et al. (2017), Hartmann & Tabin (2001): periodic Gdf5+/Wnt9a+ interzones segment a chondrogenic digit ray; Brunet et al. (1998): Nog-/- embryos form no joints; Storm et al. (1994): Gdf5 bp/bp fuses interphalangeal joints"
        - "Drachman & Sokoloff (1966), Kahn et al. (2009): paralysed or muscle-less embryos specify interzones but fail to cavitate and the interzone re-chondrifies; Roddy et al. (2011): immobilised rudiments lose articular curvature"
        - "Edwards et al. (1994), Dowthwaite et al. (1998): cavitation coincides with mechanosensitive hyaluronan accumulation and loss of interzone cohesion; Mow et al. (1980), Maroudas (1976): cartilage is a biphasic poroelastic solid whose Donnan swelling pressure is ~0.1-0.25 MPa"
      reconstructed_in_script:
        - "GDF5-Noggin 2x2 Turing dispersion with D=0 control; 1D growing-domain RD PDE with a distal PFR mask; 2D digit-ray view; Kavanagh 12-taxon morphospace regression; six genetic/signalling perturbations; radiograph segmentation of Digits II-IV"
        - "Pass 3: reduced 2D Biot storage-equation cavitation solver (HA synthesis -> osmotic pore pressure with free drainage -> cohesion threshold -> irreversible cavity phase field), three literature cavitation conditions, muscle-loading and permeability sweeps, Carter-Wong articular arch, Kahn Sox9 reversion, and the radiograph joint-line sagitta/chord comparison"
      transfer_boundary:
        - "The 1D RD PDE does not self-organise its joint positions: `joint_targets` are pre-computed from the arithmetic progression and injected as a Gaussian source behind the PFR, and the bp/bp PIP fusion is hard-coded (L334-349, L364-373); the Turing dispersion is verified analytically, not as the pattern-selecting mechanism of the PDE"
        - "The poroelastic solver has a rigid solid skeleton (no u-p Biot displacement, effective stress, capsule or ligament), is 2D, one-way coupled (RD -> poroelastic), and its articular arch is a parametric Carter-Wong rule a(y) = A_arc phi(m)(1 - (y/W)^2), not a computed growth response; all constants are dimensionless and scaled only to adult cartilage"
        - "The vendored specimen is a juvenile hand radiograph with open physes, not an embryonic interzone section; the joint-line arch statistic rests on 4 valid joints with sd > mean"
      does_not_claim:
        - "A full Biot u-p or triphasic solution, 3D geometry, synovial fluid flow, capsule/ligament mechanics, convex-head emergence from growth (the model's head contour is flat because the lens cancels the arch), or any dimensional embryonic poroelastic constant"
    summary: >-
      Pass 3 (v3) re-scored evaluation of `2016-onuff-joint-interzone-clefting.py` (overall weighted score
      89.4/100, down 7.2 from the v2 score of 96.6). The single v2 remediation item is closed: the 2D Gdf5
      interzone field now drives a reduced Biot poroelastic cavitation solver (hyaluronan synthesis, Donnan
      osmotic pore pressure with Darcy drainage, HA/CD44 loss of cohesion, irreversible cavity phase field,
      Carter-Wong articular arch, Kahn Sox9 reversion) that reproduces the three literature outcomes (motile WT
      3 interzones -> 3 cavities; paralysed 3 -> 0 with interzone Sox9 0.81 vs 0.23; Nog-/- 0 -> 0), has monotone
      muscle-loading (m* = 0.80) and permeability sweeps, matches the radiograph joint-line sagitta/chord
      (0.064 vs 0.056 +/- 0.078; 3/4 joints convex-head sign), and is backed by two new machine-verified Lean 4
      theorems (5 total, 0 sorrys). Scoring the current file line by line, however, exposed defects that v2
      did not deduct for: templated joint positions and hard-coded PIP fusion in the RD PDE, an imposed rather
      than emergent articular arch (the modelled head contour is flat), a juvenile specimen with a
      low-contrast Digit II centerline and a hard-coded cleft count, and several uncited Pass 3 calibration
      constants. These are carried as 8 line-pinned Pass 4 items.
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          Credited: the GDF5-Noggin dispersion (L194-242) and the Kavanagh cascade laws (L245-285) are exact;
          the new poroelastic solver (L566-791) implements a recognisable reduced Biot storage equation
          S dp/dt = kappa lap(p) + gamma(beta H - p) with Dirichlet drainage, a mechanosensitive HA source and
          a cohesion threshold, and its steady-state gate and Darcy lens are proved in Lean (Laws 4-5).
          Deductions: the 1D "Turing-wavefront" PDE does not select its own wavelength — joint positions
          are pre-computed `joint_targets` injected as Gaussian sources and the bp/bp PIP fusion is an `if idx_j
          == 1: continue` (L334-349, L364-373), so the dispersion relation is verified beside, not inside, the
          PDE (-6); the solid skeleton is rigid (no u-p coupling, effective stress or volumetric strain), so
          "poroelastic" is a storage equation (-4); the articular arch is an imposed parametric rule and the
          interzone identity is a Hill transform chosen to make the DIP cavitate (L631-640) (-3); the Kahn
          reversion factor 0.85 (L666) is a phenomenological constant (-1).
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [194, 242], note: "Exact 2x2 GDF5-Noggin dispersion relation with integer witnesses matching Lean Law 2", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [566, 663], note: "Reduced Biot storage-equation cavitation solver: HA source, Darcy pressure diffusion with p = 0 outside the rod, cohesion threshold, irreversible cavity phase field", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [334, 373], note: "Joint positions are pre-computed `joint_targets` and the brachypodism PIP fusion is hard-coded; the RD PDE does not self-organise the pattern", supports: false}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [631, 640], note: "Articular arch a(y) is an imposed Carter-Wong rule and the interzone identity is a Hill transform (K_identity = 0.30) rather than an emergent mechanical outcome", supports: false}
          - {file: morphoeval/lean/loops/Loop_018_joint_interzone_clefting.lean, lines: [107, 193], note: "Laws 4-5: cavitation gate (m_load = 0 or gdf5 = 0 -> no cavity; monotone in loading) and Darcy lens midline maximum, 0 sorrys, verified with `lean`", supports: true}
      specimen-match:
        value: 84
        rationale: >-
          Credited: the comparison PNG shows the radiograph with traced centerlines and MCP/PIP/DIP markers
          beside the Kavanagh morphospace (Panels D, F), and the new Panel C / cavitation figure make the WT
          lens cavities, the paralysed uncavitated interzones and the Nog-/- rod visually distinct; the new
          joint-line arch trace agrees in sign with 3 of 4 valid joints (s/c 0.064 vs 0.056). Deductions:
          the specimen is a juvenile hand radiograph with open physes — the "interzone clefts" are adult
          joint spaces 10-12 px from a growth plate, not embryonic interzones (-5); Digit II's centerline has
          no bone contrast over its distal half (profile ~67 flat), so its DIP minimum is window-determined
          and it fails the Pass 3 contrast gate (L1019-1023) (-4); `n_synovial_clefts: 3` is asserted, not
          detected (L1053) (-3); the modelled proximal head contour is flat (head sagitta/half-span -0.036)
          because the lens thickening cancels the arch, whereas the radiograph heads are convex (-3); the
          joint-line statistic has sd 0.078 > mean 0.056 on n = 4 (-1).
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [1272, 1302], note: "Panel F: radiograph with Digit II-IV centerlines and MCP/PIP/DIP markers; Panel D overlays segmented digits on the Kavanagh morphospace (L1185-1246)", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [1154, 1184], note: "Panel C: motile WT cavities vs paralysed (interzones, no cavities, Sox9 re-expressed) vs Nog-/- fused rod, visually distinct", supports: true}
          - {file: docs/media/joint_interzone_clefting_cavitation.png, lines: [0, 0], note: "Rendered Pass 3 figure: lens cavities in the pressure field (A), midline gate (B), three literature conditions (C), loading and permeability sweeps (D-E), joint-line arch vs radiograph (F); the model head contour in F is flat while the specimen joint lines are convex-head", supports: true}
          - {file: docs/media/joint_interzone_clefting_growth.gif, lines: [0, 0], note: "Growth GIF regenerated; shows sequential MCP -> PIP -> DIP interzone clefting but not the Pass 3 cavitation (cavities are only in the PNGs)", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [869, 948], note: "Specimen joint-line arch trace with contrast gate; 4/6 joints valid, 3/4 convex-head sign, mean s/c 0.056 +/- 0.078", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [1019, 1023], note: "PIP/DIP minima are argmin within hand-set window fractions; Digit II's distal profile has no bone contrast so its DIP is window-determined", supports: false}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [1053, 1053], note: "`n_synovial_clefts: 3` is a constant, not a detection result", supports: false}
          - {file: datasets/joint_interzone_clefting/README.md, lines: [10, 10], note: "Specimen is a juvenile radiograph with open physes (disclosed in Pass 3, not an embryonic interzone)", supports: false}
      parameter-expressivity:
        value: 93
        rationale: >-
          Credited: the 12-taxon morphospace and six genetic conditions are retained (L245-285, L951-982);
          Pass 3 adds two genuine mechanical parameters, each swept and monotone with a visible transition —
          muscle loading m_load (cavity count 0 -> 3 with threshold m* = 0.80, pore pressure monotone up,
          interzone Sox9 monotone down; L811-841) and Darcy permeability (cavity area monotone down, cavities
          lost at 16x; L844-866), both exposed on the CLI (`--m-load`, `--permeability`, L1863-1864) and
          rendered as Panels D-E. Deductions: A_arc_over_W, kappa_G, sigma_0 and beta_osm are not swept, so
          the articular arch amplitude and the cohesion threshold are fixed calibrations (-4); the loading
          sweep is coarse (9 points) and the threshold is reported to the grid resolution 0.2 (-2);
          the CLI `--m-load` and `--permeability` only affect the cavitation figure, not Panel C of the
          comparison figure (L1872-1879 vs L1882) (-1).
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [811, 866], note: "Muscle-loading and permeability sweeps with monotonicity flags and loading threshold", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [1409, 1438], note: "Panels D-E render both sweeps (count, area, pressure, Sox9, lens height)", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [1863, 1864], note: "CLI overrides --m-load and --permeability", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [951, 982], note: "Six genetic/signalling perturbation conditions retained from Pass 2", supports: true}
      morphometric-validation:
        value: 90
        rationale: >-
          Credited: `measure_morphoeval()` (L1561-1742) returns 16 metrics, all with `reference_value`,
          `reference_source` and `unit` keys (asserted in self-test check 7); the seven Pass 3 metrics
          anchor cavity counts to Edwards 1994 / Drachman 1966 / Kahn 2009, and introduce an output-derived
          specimen statistic (joint-line s/c) that the model statistic is compared with. Deductions: two of
          the new metrics (Sox9 reversion ratio, loading threshold m*) carry `reference_value: null` because
          no published magnitude exists — they are model predictions, not validations (-4); the model s/c
          reference is the specimen mean whose sd exceeds it, so the agreement (|diff| < 0.05 in check 12)
          is weak (-3); the permeability metric is a boolean monotonicity flag rather than a measured
          quantity (-2); the Pass 2 lambda_c "reference" 3.5904 is still the model's own value (-1).
        evidence:
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [1578, 1649], note: "Seven Pass 3 measurements: WT/paralysed cavity counts, Sox9 reversion ratio, loading threshold, permeability monotonicity, model and specimen joint-line s/c", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [1791, 1794], note: "Self-test asserts 16 metrics each carrying reference_value / reference_source / unit", supports: true}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [1598, 1619], note: "Sox9 reversion ratio and loading threshold have reference_value null (no literature magnitude)", supports: false}
          - {file: 2016-onuff-joint-interzone-clefting.py, lines: [1841, 1849], note: "Check 12: model and specimen s/c agree within 0.05 and share the majority convex-head sign", supports: true}
      source-traceability:
        value: 96
        rationale: >-
          Credited: all 5 dataset files are SHA-256 pinned and verified fail-closed on every run (L134-176);
          `synovial_cavitation_reference.json` records each Pass 3 source with DOI (or PMID for Edwards 1994),
