# MorphoEval audit — Kavanagh et al. (2013) PNAS & Hiscock et al. (2017) Dev. Cell Synovial Joint Interzone
# Clefting & Phalangeal Inhibitory Cascade, 2026-10-19 slot 018 (v3, Pass 3 remediation round)
#
# Pass 3 re-score of `2016-onuff-joint-interzone-clefting.py` after the remediation of the single open v2
# finding (couple the 2D GDF5-Noggin digit-ray RD PDE to a fluid-poroelastic synovial cavitation and
# articular morphogenesis solver) in the instrumented loop `2026-10-19-joint-interzone-clefting-loop-pass3`,
# superseding `2026-10-19-joint-interzone-clefting-audit-v2` (96.6, Gemini 4 Argon).
#   - Primary assessor: Claude Fable 5.1 (same agent that performed the remediation; all line numbers were
#     re-verified against the working-tree file after the last edit, commit d58a084 + uncommitted slot changes).
#
# What Pass 3 changed:
#   1. `simulate_poroelastic_cavitation()` (L566-791): reduced 2D Biot storage-equation solver on a 360 x 72
#      refinement of the digit rod — mechanosensitive hyaluronan synthesis by Gdf5+ interzone cells
#      (Dowthwaite 1998), linearised Donnan osmotic pore pressure with free perichondrial drainage (Mow 1980,
#      Maroudas 1976), HA/CD44 loss of cohesion sigma_coh = sigma_0(1 - kappa_G G) (Edwards 1994), irreversible
#      cavity phase field where p > sigma_coh, Carter & Wong (1988) articular arch a(y), Kahn (2009) Sox9
#      reversion of unloaded interzone cells. One-way coupled to the RD Gdf5 field via a Hill interzone-identity
#      transform (L635-640).
#   2. Three literature conditions (motile WT 3/3 cavities; paralysed 3 interzones / 0 cavities; Nog-/- 0/0),
#      a muscle-loading sweep (threshold m* = 0.80, monotone) and a Darcy permeability sweep (monotone,
#      cavities lost at 16x), each rendered in the new `docs/media/joint_interzone_clefting_cavitation.png`.
#   3. New empirical comparison: the joint-line arch (sagitta/chord) traced on the vendored radiograph at
#      +/-9 px lateral offsets (`measure_specimen_articular_arc`, L869-948) vs the model's PIP cavity
#      mid-contour: 0.056 +/- 0.078 (3/4 valid joints convex-head sign) vs 0.064.
#   4. Two new Lean 4 theorems (Law 4 cavitation gate + monotonicity; Law 5 Darcy lens midline maximum),
#      0 sorrys; `synovial_cavitation_reference.json` + README added to the dataset (5 SHA-256-pinned files);
#      8 new citations in paper_citations.bib; measure_morphoeval 9 -> 16 metrics; self-test 8 -> 12 checks.
#
# Why the overall score goes DOWN (96.6 -> 89.4) although the v2 item is closed: scoring the current file
# against the rubric with line-pinned evidence exposed defects that v2 did not deduct for — the 1D "Turing"
# PDE places its joints at pre-computed `joint_targets` and hard-codes the brachypodism PIP fusion
# (L334-349, L364-373), the vendored specimen is a juvenile hand radiograph with open physes and a Digit II
# centerline whose distal half has no bone contrast (L1019-1023, L1053), the articular arch is an imposed
# parametric rule rather than an outcome of the mechanics (L631-633), and several Pass 3 constants (A_arc 0.22,
# Kahn reversion 0.85, K_identity 0.30) are uncited calibrations. These are listed under `remediation`.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the working-tree files at the Pass 3 checkpoint (commit d58a084).

