    summary: >-
      Pass 1 integrated Schnakenberg kinetics with the Turing wavenumber on a
      periodic 1.678 mm patch at Famennian 365 Ma. At r = 16 the analytic
      wavelength was 104.9 µm but the saturated FFT peak sat at 125.53 µm.
      Dispersion Pearson r was 0.993. The Brussels skull GIF terminus already
      matched the specimen (CV 96). The fin-ray neighbour was mis-stated as an
      expressed longer wavelength.
    claim_boundary:
      reported_in_source:
        - "Eight digits in Acanthostega (Coates & Clack 1990) and no digits in Tiktaalik (Daeschler, Shubin & Jenkins 2006)."
        - "Turing critical wavenumber and Schnakenberg kinetics."
      reconstructed_in_script:
        - "Du calibrated so analytic lambda_c = 104.9 µm."
        - "Pass-1 ratio r = 16, later retuned."
      transfer_boundary:
        - "105 µm is the campaign primordium tier, not a measured melanosome spacing."
      does_not_claim:
        - "That the fossil preserves a 105 µm pigment wavelength."
        - "That the RD field is a pixel copy of the skull."
