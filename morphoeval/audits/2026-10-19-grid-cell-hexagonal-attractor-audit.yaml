simulations:
  - id: burak-grid-cell-hexagonal-attractor
    name: "Burak & Fiete (2009), Hafting et al. (2005) & Stensola et al. (2012) entorhinal grid-cell hexagonal continuous attractor & discrete sqrt(2) module scaling"
    organism: "Rattus norvegicus medial entorhinal cortex (MEC Layer II) & hippocampal-entorhinal circuit"
    script: 2008-burak-grid-cell-hexagonal-attractor.py
    output: docs/media/grid_cell_hexagonal_attractor_comparison.png
    extra_outputs:
      - docs/media/grid_cell_hexagonal_attractor_growth.gif
    status: evaluated
    source_refs:
      - burak2009
      - hafting2005
      - stensola2012
      - brandon2011
    summary: >-
      Pass 1 baseline assessment of `2008-burak-grid-cell-hexagonal-attractor.py` (56.9/100).
      The baseline script evaluates a static 3-wavevector cosine superposition without solving
      the 4-subpopulation (N, S, E, W) 2D FFT Burak-Fiete continuous attractor neural sheet
      PDE tau ds_theta/dt + s_theta = [sum_{theta'} W_0(x - x' - l e_hat(theta')) * s_{theta'} + B(1 + alpha v . e_hat(theta))]_+,
      omits 2D foraging path integration and rotational spatial autocorrelation gridness score G_60,
      omits the Brandon et al. (2011) medial-septum inactivation / l=0 pinned-bump ablation control,
      and displays the Rattus norvegicus hippocampal-entorhinal fluorescence micrograph without
      automated CV segmentation.
    scores:
      model-fidelity:
        value: 56
        rationale: >-
          Evaluates only a static 3-cosine superposition (L41-61), omitting the 2D FFT
          Burak & Fiete (2009) 4-subpopulation (E, N, W, S) continuous attractor neural network
          PDE, annular Mexican-hat surround-inhibition kernel W_0(Delta_x), and velocity-driven
          bump phase integration along a 2D foraging trajectory.
        evidence:
          - {file: 2008-burak-grid-cell-hexagonal-attractor.py, lines: [41, 61], note: "Static 3-cosine superposition without 4-subpopulation Burak-Fiete CANN PDE or 2D FFT surround inhibition", supports: false}
      specimen-match:
        value: 50
        rationale: >-
          Vendors `datasets/grid_cell_hexagonal_attractor/rat_entorhinal_hippocampal_specimen.jpg`
          (CC BY-SA 3.0 immunofluorescence micrograph of Rattus norvegicus hippocampal-entorhinal
          section stained for NeuN, MBP, and DNA), but Pass 1 only displays the raw image without
          automated CV segmentation of NeuN+ neuronal somata or MBP+ perforant-path fiber density.
        evidence:
          - {file: 2008-burak-grid-cell-hexagonal-attractor.py, lines: [66, 78], note: "Raw specimen display without CV segmentation of NeuN+ neuronal layers or MBP+ perforant-path tracts", supports: false}
          - {file: docs/media/grid_cell_hexagonal_attractor_comparison.png, lines: [0, 0], note: "4-panel Pass 1 baseline comparison figure", supports: true}
      parameter-expressivity:
        value: 55
        rationale: >-
          Evaluates only a single static grid scale and static bar chart of {38, 54, 76, 108} cm,
          omitting dynamic 2D CANN simulations across all 4 Stensola et al. (2012) dorso-ventral
          modules (M1..M4), 90 deg square non-resonant control, medial-septum inactivation (l=0,
          alpha=0) pinned-bump control, and a 2D (l_shift, alpha_vel) path-integration morphospace.
        evidence:
          - {file: 2008-burak-grid-cell-hexagonal-attractor.py, lines: [41, 61], note: "Single static scale without 4-module CANN simulations or l=0 / alpha=0 ablation control", supports: false}
      morphometric-validation:
        value: 54
        rationale: >-
          Reports only 2 baseline metrics in `measure_morphoeval()`, lacking the 2D spatial
          autocorrelation 60 deg rotational gridness score G_60, 2D foraging path-integration
          tracking correlation r, pinned-bump ablation phase shift collapse, and specimen CV
          morphometrics.
        evidence:
          - {file: 2008-burak-grid-cell-hexagonal-attractor.py, lines: [98, 121], note: "Baseline 2-metric measure_morphoeval() hook without G_60 gridness or path-integration correlation", supports: false}
      source-traceability:
        value: 66
        rationale: >-
          Vendors `scout_manifest.json`, `grid_cell_hexagonal_attractor_reference.json`,
          `paper_citations.bib`, and `rat_entorhinal_hippocampal_specimen.jpg` with SHA-256
          verification linking Burak & Fiete (2009), Hafting et al. (2005), and Stensola et al. (2012).
        evidence:
          - {file: 2008-burak-grid-cell-hexagonal-attractor.py, lines: [30, 39], note: "SHA-256 verification of vendored dataset files", supports: true}
      code-traceability:
        value: 60
        rationale: >-
          Links baseline functions to Burak & Fiete (2009) and Stensola et al. (2012), requiring
          full alignment with all 3 Lean 4 theorems in `Loop_088_grid_cell_hexagonal_attractor.lean`.
        evidence:
          - {file: 2008-burak-grid-cell-hexagonal-attractor.py, lines: [1, 7], note: "Baseline docstring citing Burak & Fiete (2009), Hafting et al. (2005), and Stensola et al. (2012)", supports: true}
      repro-package:
        value: 60
        rationale: >-
          Provides `--self-test` and deterministic execution, requiring expansion to an 8-check
          verification suite covering all 6 regimes, Lean 4 invariants, specimen CV segmentation,
          and bitwise two-run determinism.
        evidence:
          - {file: 2008-burak-grid-cell-hexagonal-attractor.py, lines: [124, 132], note: "Baseline self-test checks", supports: true}
    remediation:
      - "Implement the 2D FFT Burak & Fiete (2009) 4-subpopulation (E, N, W, S) continuous attractor neural network PDE with shifted surround-inhibition kernels W_0(Delta_x - l e_hat(theta)) and threshold-linear rectification [.]_+."
      - "Simulate 2D foraging path integration, compute 2D spatial autocorrelation and 60 deg rotational gridness score G(theta) across all 4 Stensola et al. (2012) dorso-ventral modules {38, 54, 76, 108} cm, 90 deg square control, and Brandon et al. (2011) medial-septum inactivation (l=0, alpha=0) pinned-bump ablation control."
      - "Add automated CV segmentation of the Rattus norvegicus hippocampal-entorhinal immunofluorescence micrograph (NeuN+ neuronal somata bands, MBP+ perforant-path fiber density, and dorso-ventral laminar profile), and render a 9-panel dark-mode synthesis figure and 24-frame animated GIF."
