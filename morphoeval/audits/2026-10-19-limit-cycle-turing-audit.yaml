simulations:
  - id: schnakenberg-limit-cycle-turing
    name: "Schnakenberg (1979) tri-molecular limit-cycle & Turing reaction-diffusion morphogenesis"
    organism: "Dictyostelium discoideum (cellular slime mold cAMP oscillations & fruiting body aggregation)"
    script: 1979-schnakenberg-limit-cycle-turing.py
    output: docs/media/limit_cycle_turing_comparison.png
    extra_outputs:
      - docs/media/limit_cycle_turing_growth.gif
    status: evaluated
    source_refs:
      - schnakenberg1979
      - turing1952
      - goldbeter1975
      - grace2015
    summary: >-
      Pass 1 (v1) baseline evaluation of `1979-schnakenberg-limit-cycle-turing.py`
      (overall score 44.5/100). The v1 script implements the homogeneous equilibrium
      (u_*, v_*) = (a+b, b/(a+b)^2), 2x2 reaction Jacobian J_0, and a 5-point finite
      difference 2D solver at a single Turing point (a=0.10, b=0.90, d=18.0), but omits
      Schnakenberg's (1979) Hopf bifurcation curve b - a = (a+b)^3 and autonomous
      limit-cycle oscillator, omits the spatial dispersion relation sigma(k^2) and
      critical diffusivity ratio d_c(a,b), lacks an equal-diffusion negative control or
      diffusivity sweep, and performs zero biological specimen segmentation on
      `datasets/limit_cycle_turing/dictyostelium_specimen.jpg`.
    scores:
      model-fidelity:
        value: 52
        rationale: >-
          Implements Schnakenberg's (1979) cubic autocatalytic PDE du/dt = gamma*(a - u + u^2*v)
          + Lap(u), dv/dt = gamma*(b - u^2*v) + d*Lap(v) and homogeneous equilibrium
          (u_*, v_*) = (a+b, b/(a+b)^2) (L26-66). However, Schnakenberg's central
          Hopf bifurcation locus b - a = (a+b)^3, Poincare-Bendixson limit-cycle ODE
          oscillator, spatial dispersion relation sigma(k^2), critical diffusivity ratio
          d_c(a,b), and equal-diffusion negative control (d=1) are all absent in v1.
        evidence:
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [26, 66], note: "equilibrium, Jacobian, and single-regime 2D finite-difference solver without Hopf limit cycle or dispersion relation", supports: false}
      specimen-match:
        value: 18
        rationale: >-
          `datasets/limit_cycle_turing/dictyostelium_specimen.jpg` is not loaded or
          segmented in v1, and `docs/media/limit_cycle_turing_comparison.png` displays
          only a 1x2 synthetic activator/substrate heatmap without biological specimen
          overlay, sorocarp head/aggregate segmentation, or limit-cycle phase portrait.
        evidence:
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [99, 126], note: "renders only a 1x2 synthetic heatmap with no biological specimen analysis", supports: false}
          - {file: docs/media/limit_cycle_turing_comparison.png, lines: [0, 0], note: "2-panel synthetic plot lacking Dictyostelium specimen comparison", supports: false}
      parameter-expressivity:
        value: 35
        rationale: >-
          Hardcodes a single parameter point (a=0.10, b=0.90, gamma=180, d=18.0) on a
          64x64 grid (L41-66) without exposing CLI flags (--a, --b, --gamma, --d, --N,
          --steps, --dt, --seed) and without sweeping across the Hopf boundary
          b - a = (a+b)^3 or Turing threshold d_c = 8.5676.
        evidence:
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [41, 66], note: "single hardcoded regime without multi-regime phase diagram or diffusivity sweep", supports: false}
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [137, 146], note: "CLI exposes only --self-test, --skip-gif, --no-show", supports: false}
      morphometric-validation:
        value: 34
        rationale: >-
          `measure_morphoeval()` (L69-96) checks analytical equilibrium values (u_*=1.0,
          v_*=0.9, det(J_0)=1.0) and raw activator standard deviation std_u, but computes
          no 2D FFT radial power spectrum, no sub-bin wavenumber peak k* vs analytical
          k_c, no limit-cycle oscillation period T_LC, and no specimen nearest-neighbor
          or sorocarp morphometrics.
        evidence:
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [69, 96], note: "baseline 4-item measurement list without spectral wavelength or specimen validation", supports: false}
      source-traceability:
        value: 48
        rationale: >-
          Cites Schnakenberg (1979) (`10.1016/0022-5193(79)90042-0`) in the module
          docstring (L6-9), but does not load or SHA-256-verify
          `datasets/limit_cycle_turing/limit_cycle_turing_reference.json`,
          `scout_manifest.json`, or `dictyostelium_specimen.jpg` at runtime.
        evidence:
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [6, 9], note: "single DOI in docstring without runtime SHA-256 verification of datasets/limit_cycle_turing/", supports: false}
      code-traceability:
        value: 52
        rationale: >-
          Basic docstrings identify the equilibrium and Jacobian formulas (L26-39), but
          lack detailed equation-by-equation mappings to Schnakenberg (1979) Eqs. (15)-(24),
          Turing (1952) dispersion theory, and the 3 Lean 4 theorems in
          `morphoeval/lean/loops/Loop_002_limit_cycle_turing.lean`.
        evidence:
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [26, 66], note: "minimal docstrings without explicit Lean 4 theorem or equation cross-references", supports: false}
      repro-package:
        value: 64
        rationale: >-
          Uses deterministic `np.random.default_rng(1979)` and includes `--self-test` and
          `--skip-gif` (L129-146), but `self_test()` checks only 3 basic assertions without
          verifying two-run bitwise determinism, Hopf trace vanishing, dispersion
          thresholds, or dataset SHA-256 integrity.
        evidence:
          - {file: 1979-schnakenberg-limit-cycle-turing.py, lines: [129, 135], note: "3-line self_test without bitwise determinism or dataset hash checks", supports: false}
    remediation:
      - "Implement Schnakenberg's (1979) exact Hopf bifurcation curve b - a = (a+b)^3, Turing instability boundary d_c(a,b), spatial dispersion relation sigma(k^2), critical wavenumber k_c, and autonomous Poincare-Bendixson limit-cycle ODE integration with period T_LC and phase-plane limit cycle vs stable spiral comparison."
      - "Simulate all 5 canonical regimes (turing_spots_standard, turing_labyrinth_high_d, turing_hopf_codim2, hopf_limit_cycle, equal_diffusion_control) plus a 7-point diffusivity-ratio sweep across d in {1, 4, 7, d_c, 12, 18, 25} and expose full CLI flags (--a, --b, --gamma, --d, --N, --steps, --dt, --seed)."
      - "Load and SHA-256-verify `datasets/limit_cycle_turing/{scout_manifest.json,limit_cycle_turing_reference.json,dictyostelium_specimen.jpg}` at runtime, and implement computer-vision segmentation of `dictyostelium_specimen.jpg` (sorocarp spore-head sori area/diameter parity, inter-sorus spacing, interior DoG aggregation centers & NND distribution, and 2D FFT agar wavelength)."
      - "Upgrade `measure_morphoeval()` and `--self-test` with sub-bin parabolic 2D FFT wavenumber peak estimation vs analytical k_c, limit-cycle period verification, equal-diffusion ablation ratio, specimen segmentation metrics, and two-run bitwise determinism."
