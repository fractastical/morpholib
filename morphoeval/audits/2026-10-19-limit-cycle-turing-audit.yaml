# MorphoEval audit — Schnakenberg (1979) Tri-Molecular Limit-Cycle & Turing Reaction-Diffusion, 2026-10-19 (v1)
#
# Pass 1 baseline evaluation of `1979-schnakenberg-limit-cycle-turing.py` (v1, 148 lines)
# prior to Step 12 closed-loop remediation (`2026-10-19-limit-cycle-turing-loop`):
#   - Primary assessor: Gemini 4 Argon (Cursor agent) — 46.8 / 100
#   - Independent second assessor: Claude Sonnet 5.5 High (consensus rubric baseline) — 42.2 / 100
#   - Pass 1 consensus score: 44.5 / 100
#
# Key findings driving Step 12 remediation:
#   1. Only a single Turing spot point (a=0.10, b=0.90, d=18.0) is simulated on a coarse
#      64x64 grid; Schnakenberg's (1979) primary limit-cycle regime (b - a > (a+b)^3,
#      Poincare-Bendixson relaxation oscillation), the Hopf bifurcation curve b - a = (a+b)^3,
#      the Turing threshold curve d_c(a,b), and the Turing-Hopf codimension-2 regime are
#      not simulated or plotted.
#   2. No equal-diffusion negative control (d = 1.0) or diffusivity-ratio parameter sweep
#      across d_c = 8.5676 is executed.
#   3. No 2D FFT radial power spectrum or sub-bin wavenumber peak estimation k* is computed
#      to validate pattern wavelength against analytical lambda_c = 2*pi / k_c.
#   4. `datasets/limit_cycle_turing/dictyostelium_specimen.jpg` and
#      `limit_cycle_turing_reference.json` are not loaded, SHA-256-verified, or segmented
#      in the v1 script (`specimen-match: 18`).

