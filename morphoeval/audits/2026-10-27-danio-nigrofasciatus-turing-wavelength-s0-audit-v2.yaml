      - id: R1
        item: "Closed in this pass: alpha sweep Spearman is measured and drawn on the comparison figure."
        status: resolved
      - id: R2
        item: "Closed in this pass: trunk KS and anterior-posterior holdout are in measure_morphoeval, with reference floors that differ from the values."
        status: resolved
      - id: R3
        item: "Closed in this pass: ablation ratio is asserted in --self-test (pattern std / relaxation std > 3)."
        status: resolved
      - id: R4
        item: "Closed in this pass: image fitness is computed from the growth GIF against the Parichy specimen and written only to the per-loop fitness JSON."
        status: resolved
