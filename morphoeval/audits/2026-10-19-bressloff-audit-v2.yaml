simulations:
  - id: bressloff-v1-form-constants
    name: "Bressloff et al. (2001/2002) V1 Euclidean Symmetry-Breaking & Klüver Form Constants"
    organism: "Homo sapiens primary visual cortex (V1) — geometric visual hallucinations (Klüver form constants) and flicker phosphenes"
    script: 2001-bressloff-v1-form-constants.py
    output: bressloff_v1_form_constants_morphospace.png
    also:
      - docs/media/bressloff_v1_form_constants.gif
      - bressloff_v1_metrics.csv
      - datasets/bressloff/horton_hoyt_1991_magnification.json
    domain: morphogenesis
    status: evaluated
    source_refs: [bressloff2001, bressloff2002, ermentrout1979, rule2011, horton1991, mesmerprism_v1sim]
    supersedes_audit_id: 2026-10-19-bressloff-audit
    claim_boundary:
      reported_in_source:
        - "Bressloff et al. (2001, 2002): a Euclidean shift-twist symmetric neural field on the orientation-hypercolumn lattice of V1 undergoes a Turing-type instability whose even (contoured) and odd (non-contoured) planforms, pulled back through the retino-cortical map x=(alpha/eps)ln(1+eps r/w0), y=beta r theta/(w0+eps r), give Klüver's four form constants"
        - "Ermentrout & Cowan (1979): cortical rolls map to tunnels, funnels and spirals under the log-polar retino-cortical map"
        - "Horton & Hoyt (1991): human V1 linear cortical magnification follows M(E) = 17.3/(E + 0.75) mm/deg"
        - "Rule, Stoffregen & Ermentrout (2011): periodic flicker drives 1:1 (stripe) and 2:1 period-doubling (hexagon) Floquet resonance tongues over forcing period and wave number"
      reconstructed_in_script:
        - "Fourier-Bessel lateral coupling, even/odd orientation eigenbranches and marginal-stability scans, cubic amplitude-equation coefficients gamma_0, gamma_3(theta), eta_hex with both lattice-local and global branch selection and stability booleans, the exact two-regime retino-cortical map with analytic inverse and hemifield-mirrored pullback, rendered wavenumber |k| = q*/d_hyp quantised to integer torus cycles, a comparison of the map's magnification dx/dr = alpha/(w0 + eps r) with Horton & Hoyt (1991) over 1-40 deg, the upstream fixture's own paper-expectation checks (10/11, fig40 H0/H_pi degeneracy flagged), a Gaussian-only negative control, and a diagnostic overlay of the Rule (2011) tongue boundaries vendored from the upstream MesmerPrism fixture with its calibration status printed"
      transfer_boundary:
        - "Numerical parity to 2.2e-16 is with the MesmerPrism/bressloff-v1-form-constants Rust implementation's stability_reports, not with digitised figures of the 2001 paper; the four gallery presets impose their lattice (rings/spiral/cobweb/honeycomb) while the cubic amplitude equations select hexagonal (and, for the cobweb preset, roll within its own lattice) — the disagreement is printed under each panel and in the CSV rather than resolved"
        - "Both hemispheres are assumed to carry the same bilateral eigenmode, so the pullback is mirror-symmetric about the vertical meridian"
      does_not_claim:
        - "Fifth-order resolution of the odd-branch hexagon/triangle degeneracy (Bressloff 2001 Section 5.2), a validated reproduction of Rule (2011) Fig. 8 (the vendored fixture is marked diagnostic-only upstream and the script says so), oriented line-element rendering of the contoured planforms (Figs. 31-36), or a comparison with subject drawings of hallucinations"
    summary: >-
      The script is a careful Python port of the MesmerPrism/karacsm Rust implementation of the Bressloff et al. (2001/2002)
      orientation-hypercolumn model: the local and lateral Fourier-Bessel coupling harmonics, the second-order perturbative
      dispersion relation for the even/odd branches, the cubic amplitude coefficients gamma_3(theta)/eta_hex and the
      roll-stability criterion 2*gamma_3(theta) > gamma_0 all have the published form, and the exact two-regime retino-cortical
      map is implemented and inverted analytically. The headline "parity to 2e-16" is parity with the Rust fixture,
      not with any number in the paper, and the four Klüver gallery panels are imposed lattices (rings/spiral/cobweb)
      whose cubic amplitude equations actually select hexagons; this is printed under each panel but the gallery is
      still presented as the model's form constants. The only genuinely empirical comparison is the Horton & Hoyt (1991)
      magnification law (6.8% RMS, with the A/E2 mismatch disclosed); the output morphometrics are self-consistency
      checks against the model's own q*, and the Rule (2011) panel is a pass-through of an upstream fixture that fails
      its own acceptance. Provenance (DOIs, PMIDs, upstream commit, SHA-256 pins, lock file, deterministic self-test)
      is strong, but the fixture-failure ledger reports only the 11 stability_reports checks and omits the 11 additional
      failures in the fixture's runs[] checks.
    scores:
      model-fidelity:
        value: 72
        rationale: >-
          The core equations are implemented in the published form: W_n = exp(-2 n^2 xi^2) - A exp(-2 n^2 xi_hat^2)
          for the local coupling, the lateral harmonics as the Hankel transform of a normalised Gaussian difference
          exp(-xi^2 q^2/4) I_n(xi^2 q^2/4) with the anisotropy factor sin(2 n theta_0)/(2 n theta_0) and sign (-1)^n,
          the dispersion relation lambda_pm(q) = W_1 + beta (W_0 pm W_2) + beta^2 sum_m (W_{m-1} pm W_{m+1})^2/(W_1
          - W_m), gamma_3(theta) and eta_hex as orientation integrals of the eigenfunction, the roll criterion 2 gamma_3(theta)
          > gamma_0, and the exact map x = (alpha/eps) ln(1 + eps r/w_0), y = beta r theta/(w_0 + eps r). Deductions:
          parity is verified only against the Rust port's own scan values, never against a number, curve or critical
          wavenumber reported in the paper (-8); branch selection adds a non-paper free-energy "score" ranking, a lattice-local
          fallback, coefficient clipping to +-1.5 and an assumed-stable even hexagon rather than the paper's per-lattice
          stability analysis (-6); the "contoured" planform is rendered as max over phi of a scalar activity then tanh-sharpened,
          discarding the orientation field that defines contoured planforms in Figs 31-36 (-6); the map constants alpha
          = 3/pi and beta = 1.589/2 are asserted without derivation (-3); the gallery presets silently inherit lateral_wide_sigma
          = 1.5 while the Fig 16/17 panel uses 3.0, so the rendered q* = 1.45 is not the q* = 1.0 shown in Panel A (-5).
        evidence:
        - {file: 2001-bressloff-v1-form-constants.py, lines: [389, 438], note: "Local W_n and lateral Fourier-Bessel\
            \ W_n^lat(q) with sin(2n theta0)/(2n theta0) anisotropy and normalised-Gaussian 0.5 prefactor; matches Bressloff\
            \ 2001 Sections 3-4"}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [449, 469], note: "Second-order perturbative dispersion\
            \ relation lambda_even/odd(q); m=0 term vanishes on the odd branch as in the paper"}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [554, 640], note: "Cubic coefficients and roll criterion\
            \ 2*gamma3 > gamma0 are correct, but global selection uses an ad-hoc energy score and even-hex stability\
            \ is assumed"}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [837, 850], note: "Contoured rendering collapses the orientation\
            \ field to max_phi |activity| then tanh(sharpness*.); not the oriented-segment planform of the paper"}
      specimen-match:
        value: 56
        rationale: >-
          Judged against Klüver's families as drawn in Bressloff et al. (2001) Fig. 1 / Ermentrout & Cowan (1979): the
          tunnel panel is a convincing set of concentric rings, the cobweb panel is a plausible radial-plus-concentric
          web, and the honeycomb panel is a plausible log-polar spot lattice; the four panels are visually distinct
          from each other. Deductions: the "Spiral / Funnel" panel is a mirror-symmetric pair of nested loops rather
          than a recognisable spiral, and the funnel (radial rays, `rays` pattern) is never rendered although it is
          half of Klüver's first family (-14); no subject drawing or paper figure is placed side by side, so the match
          is by description only (-8); the rendered lattices are imposed by the preset `pattern`, while the model's
          own cubic selection for every gallery preset is hexagonal (roll_stable = False), so three of the four "specimens"
          are not what the model produces (-12); contour orientation, which distinguishes the contoured cobweb/honeycomb
          of Figs 31-36 from non-contoured blobs, is not shown (-6); the GIF subtitle mislabels the spiral preset as
          60 degree stripes when it is rendered at 45 degrees (-4).
        evidence:
        - {file: bressloff_v1_form_constants_morphospace.png, lines: [0, 0], note: "Row 2: rings convincing, cobweb\
            \ and hex plausible, spiral panel reads as mirrored nested loops; no funnel/rays panel"}
        - {file: docs/media/bressloff_v1_form_constants.gif, lines: [0, 0], note: 'Frame 1 tunnel/rings; same four presets,
            non-contoured'}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [1092, 1097], note: Gallery of four presets; `rays` (funnel)
            pattern defined at line 766 but never rendered}
        - {file: bressloff_v1_metrics.csv, lines: [0, 0], note: "kluver_form_constant rows: selected_family=roll/hexagonal,\
            \ global=hexagonal, roll_stable=False while rendered=rings/spiral/cobweb"}
      parameter-expressivity:
        value: 40
        rationale: >-
          Probing the model confirms the parameters do what the paper says: lateral_spread_deg flips the critical branch
          from odd to even between 30 and 45 degrees, lateral_wide_sigma monotonically lowers q* (1.57 to 0.68 over
          1.5-6), lateral_inhibition monotonically raises q* (0.05 to 1.03 over 0-1) and pattern_angle_deg sets the
          spiral pitch. Deductions: the figure demonstrates only two-point contrasts (theta_0 = 0 vs 60 degrees, I_lat
          = 1 vs 0); no parameter is swept and shown across its range (-25); the gallery varies form by choosing an
          imposed lattice per preset, not by moving a model parameter (-15); the CLI exposes no model parameter or preset
          selection, so a user cannot exercise the morphospace without editing code (-12); `wave_count` is declared
          legacy and `drift` is never read, so the parameter struct advertises dead knobs (-8).
        evidence:
        - {file: 2001-bressloff-v1-form-constants.py, lines: [193, 218], note: 'BressloffParams: `drift` never used,
            `wave_count` retained as legacy only'}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [1124, 1131], note: Only theta0 = 0 vs 60 degrees and I_lat
            = 1 vs 0 are contrasted in the stability panel; no sweep}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [1719, 1726], note: CLI flags are --out/--csv/--gif/--no-show/--self-test
            only; no preset or parameter flags}
      morphometric-validation:
        value: 45
        rationale: >-
          Quantitative metrics are computed on the output (radial FFT ring k*, ring sharpness, azimuthal m2/m4/m6 lattice
          discriminator) and a genuinely empirical comparison exists: the map's magnification dx/dr is compared with
          Horton & Hoyt (1991) M(E) = 17.3/(E + 0.75) over 1-40 degrees, with the 6.8% RMS, 30% maximum and the A =
          18.72 vs 17.3, E2 = 1.71 vs 0.75 mismatch all disclosed. Deductions: the FFT metrics are compared only to
          the model's own q*-derived cycle count and to the preset's intended lattice class, i.e. self-consistency,
          not to any measured specimen value (-20); the magnification check validates a map parameter, not a morphometric
          of the rendered form, and no ring count, wavelength or lambda_c = 8.7 mm is compared with subject reports
          or the paper's hypercolumn-wavelength estimate (-15); the Rule (2011) panel plots an upstream numerical fixture
          that fails 4 of its own acceptance checks and contains no psychophysical flicker data (-12); the stated explanation
          of the hex contoured k* = 21 as the sqrt(3)k difference ring does not match (sqrt(3)*11 = 19.05; the measured
          power peak is at 21-22, the 2k tanh harmonic) (-8).
        evidence:
        - {file: 2001-bressloff-v1-form-constants.py, lines: [133, 164], note: "Horton & Hoyt comparison: RMS/max relative\
            \ error and implied A, E2; the one literature-anchored quantitative check"}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [878, 937], note: "FFT ring and azimuthal metrics compared\
            \ against model's own rendered_cycles and intended lattice class only"}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [1103, 1111], note: sqrt(3)k explanation for hex contoured
            k*; measured peak is at 2k not sqrt(3)k}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [1133, 1145], note: "Rule 2011 panel is a pass-through\
            \ of fixture curves with calibration_claim_allowed=false; no empirical phosphene data"}
      source-traceability:
        value: 80
        rationale: >-
          All five primary sources carry DOI and PMID in the docstring, the dataset README and paper_citations.bib;
          the upstream repository is named with a full commit hash and license; four fixtures are SHA-256 pinned and
          verified at run time (I re-hashed them and they match); the Horton & Hoyt fixture records its formula, units
          and basis. Deductions: the fixture-failure disclosure is incomplete, since only the 11 stability_reports checks
          are aggregated while the fixture's runs[] carry 122 checks with 11 failures (including same-lattice-branch-family
          expected square got roll for the rendered fig31 cobweb preset) that are never surfaced (-10); alpha = 3/pi
          and beta = 1.589/2 are cited to Bressloff 2001 Section 2 but that section states w_0 and eps, and no page
          or upstream line is given for alpha/beta (-5); driven-neural-fields-registry.json is pinned and advertised
          as the negative-control source but is never read by the script (-3); the Rule fixture is a numerical calibration
          surface, not digitised Fig. 8 curves, and its own source curves are not drawn (-2).
        evidence:
        - {file: 2001-bressloff-v1-form-constants.py, lines: [11, 37], note: Five sources with DOI+PMID and upstream
            commit 344863a1 with license}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [88, 93], note: SHA-256 pins for four fixtures; registry
            fixture pinned but unused elsewhere in the script}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [1029, 1041], note: "summarize_fixture_checks aggregates\
            \ only stability_reports checks; runs[] checks (11 failures) omitted"}
        - {file: datasets/bressloff/README.md, lines: [9, 19], note: 'Fixture table with SHA-256, upstream paths and
            the two caveats the script does surface'}
      code-traceability:
        value: 68
        rationale: >-
          The main modelling functions carry equation/figure references in their docstrings (local W_n to Eq. 3.12,
          lateral W_n^lat to Eq. 4.9, dispersion to Section 4 / Figs 16-17, gamma_2 to Eq. 5.14, gamma_3 to Eq. 5.15
          / Figs 37-40, the map to Section 2 / 2002 Eq. 2.1) and the figure panels are labelled by paper figure. Deductions:
          the branch-selection machinery (`_make_branch_candidate` score, lattice-local scope, even-hex stability shortcut,
          clipping guards) has no source reference and is not in the paper (-10); `planform_modes` amplitudes, phase
          scales (0.35, -0.25, 0.5) and the hex_pi/triangle sign patterns are given without pointing to the planform
          definitions of Section 5 (-8); the `spec_to_preset` mapping that ties fixture figure IDs (fig37-fig40) to
          presets named after other figures (fig17, fig35, fig16, fig36) is unexplained (-6); the contoured rendering
          and tanh sharpness are rendering heuristics inherited from upstream with no paper anchor (-5); the alpha/beta
          map constants lack a derivation comment (-3).
        evidence:
        - {file: 2001-bressloff-v1-form-constants.py, lines: [462, 469], note: branch_growth docstring ties the dispersion
            relation to Section 4 and Figs 16-17}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [516, 539], note: gamma_2 / gamma_3 docstrings cite Eqs
            5.14-5.15 and Figs 37-40}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [759, 790], note: planform_modes amplitudes/phase scales
            with no equation reference}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [955, 961], note: Unexplained fixture-id to preset-id mapping
            used for the parity check}
      repro-package:
        value: 85
        rationale: >-
          requirements.lock.txt pins the exact environment (Python 3.14.7, numpy 2.5.4, matplotlib 3.10.7, pillow 12.0.0)
          and the venv matches it; the computation is fully deterministic with no RNG, so seeds are not needed; the
          self-test runs in about 3 s, writes to a temp directory, verifies the SHA pins and parity, and the CLI flags
          are documented via argparse and the README section; I re-ran the self-test and all checks pass. Deductions:
          the GIF subtitle hard-codes "oblique V1 stripes (60 degrees)" for a preset rendered at 45 degrees, so the
          shipped artefact mislabels its own parameters (-5); the README section quotes a parity bound of 6.7e-16 while
          the code reports 2.2e-16, a small environment-dependent inconsistency between documentation and output (-3);
          the default PNG/CSV/GIF outputs are written into the repository root and docs/media with no output manifest
          or artifact hash, so a re-run silently overwrites the audited artefacts (-4); the docstring does not list
          the CLI flags, which are only discoverable via --help (-3).
        evidence:
        - {file: requirements.lock.txt, lines: [1, 25], note: 'Exact pins incl. matplotlib==3.10.7, numpy==2.5.4, pillow==12.0.0;
            matches ./venv'}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [1628, 1716], note: "Deterministic self-test: SHA pins,\
            \ parity, map round-trip, negative control, FFT checks; writes only to tempdir"}
        - {file: 2001-bressloff-v1-form-constants.py, lines: [1559, 1564], note: GIF label '(60 deg)' for fig33_rhombic_even_roll
            whose pattern_angle_deg is 45}
        - {file: README.md, lines: [484, 495], note: 'Author''s description: outputs, --gif flag, and the 6.7e-16 parity
            figure'}
    remediation:
    - >-
      2001-bressloff-v1-form-constants.py:1029-1041 (used at 1486-1492 and 1653-1663): summarize_fixture_checks aggregates
      only paper-calibration.json stability_reports[].checks (11 checks, 10 pass); the fixture's runs[].checks hold
      122 checks with 11 failures (e.g. fig31_square_even same-lattice-branch-family expected 'square' got 'roll', fig35_hex_even
      expected 'hex_pi' got 'honeycomb') that are never read, so the ledger's '10/11 passed' under-discloses the upstream
      expectation failures.
    - >-
      2001-bressloff-v1-form-constants.py:1092-1097 with bressloff_v1_metrics.csv kluver rows: for all four gallery
      presets the cubic amplitude equations give roll_stable=False, square_stable=False and select 'hexagonal' (globally
      and, for the cobweb preset, 'roll' even within its own lattice), yet rings/spiral/cobweb are rendered because
      `pattern` imposes them; the gallery title should state that three of four panels are imposed lattices, or presets
      should be chosen where the selected and rendered branch agree.
    - >-
      2001-bressloff-v1-form-constants.py:1561: GIF subtitle 'oblique V1 stripes (60°)' contradicts the fig33_rhombic_even_roll
