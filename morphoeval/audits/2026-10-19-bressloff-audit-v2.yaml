# MorphoEval audit — Bressloff et al. (2001/2002) V1 Euclidean Symmetry-Breaking & Klüver Form Constants, 2026-10-19 (v2)
#
# Pass 2 re-score of `2001-bressloff-v1-form-constants.py` and `datasets/bressloff/` after the step-12
# remediation of the instrumented loop `morphoeval/runs/2026-10-19-bressloff-v1-loop`, superseding
# `2026-10-19-bressloff-audit` (53.0 primary / 78.2 second assessor). Same protocol as Pass 1:
#   - Primary assessor: Claude Fable 5.1 (fresh subagent 4f33498d-da81-4069-b4f8-b82018f6c158)
#   - Independent blinded second assessor: Gemini 4 Argon (subagent 7b8d640a-b523-4d13-b3c2-1a4a5f47292c),
#     published separately as `2026-10-19-bressloff-second-assessor-audit-v2.yaml` (role: second_assessor).
# Both ran in parallel against commit 9b18c52 with no access to each other's work, to the Pass 1 audits,
# KG or run files, or to git history.
#
# What Pass 2 changed (all 11 Pass 1 remediation items):
#   1. verify_paper_calibration_parity now surfaces the fixture's own `checks` (10/11; fig40 expected
#      'triangle', actual 'honeycomb' = H0/H_pi degeneracy at cubic order, flagged in CSV, ledger, self-test).
#   2. CSV and panel titles report selected_scope, global_selected_family, roll/square/hex stability
#      booleans and the rendered pattern (no more mode=spiral over rings).
#   3. Rendered |k| = q*/d_hyp quantised to integer cycles on the 2*pi*beta/eps torus; wave_count is legacy.
#   4. Exact two-regime map x=(alpha/eps)ln(1+eps r/w0), y=beta r theta/(w0+eps r) with analytic inverse,
#      hemifield mirroring (no theta=+-pi seam, no foveal hole), retinal panel = central 40 deg.
#   5. Rule (2011) panel titled DIAGNOSTIC OVERLAY with acceptance_status, calibration_claim_allowed=false,
#      RMS beta error 0.154 vs 0.10 threshold.
#   6. Normalised azimuthal discriminator (c4-c2, c6-c2) -> roll/square/hexagonal classes; linear vs
#      contoured spectra reported separately.
#   7. make_gif uses the PNG presets and q*-derived wavenumber (no 3.5-cycle override); default path docs/media/.
#   8. New empirical anchor: Horton & Hoyt (1991) magnification fixture (RMS rel. err 6.8%, A/E2 disclosed).
#   9. bib: Ermentrout & Cowan year 1979, Rule PMID 21980269, Horton & Hoyt added, unused entries dropped;
#      unused scipy import removed; provenance ledger panel added to the figure.
#
# Scores below are the primary assessor's: overall 62.8 (impl. 61.3, bio. 51.9, repro. 78.8), up from 53.0.
# The second assessor scored 79.2 (impl. 76.0, bio. 72.8, repro. 91.1), up from 78.2; panel mean 71.0.
# Remaining findings (both assessors) are listed under `remediation` for a future pass; the largest are the
# gallery presets imposing lattices the amplitude equations do not select, the 11 further failures in the
# fixture's runs[].checks that the ledger does not count, and the scalar max-over-phi contoured rendering.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not
# calibrated probabilities). Line numbers refer to the files at commit 9b18c52.

