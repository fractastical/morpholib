# MorphoEval audit — Riedel-Kruse et al. (2007) Science / Morelli et al. (2009) HFSP J. Delta-Notch Phase Synchrony, 2026-10-19 (v3)
#
# Pass 3 re-score of `2006-riedel-delta-notch-phase-synchrony.py` (1,428 lines, 9 self-test checks) after the
# remediation of both open v2 findings in the instrumented loop
# `morphoeval/runs/2026-10-19-delta-notch-phase-synchrony-loop-pass3`, superseding
# `2026-10-19-delta-notch-phase-synchrony-audit-v2` (91.3). Same protocol as Passes 1-2; the primary assessor
# re-read every cited line of the CURRENT file (commit d58a084, working tree of this loop) before scoring.
#
# What Pass 3 changed (the two v2 remediation items plus the defects their implementation exposed):
#   1. v2 item "couple the lattice to a spatially advecting FGF8/Wnt frequency gradient -> kinematic phase
#      waves alongside DAPT washout": the uniform periodic 8x8 lattice is replaced by an anteroposterior x
#      lateral PSM lattice (24 x 12 cells, 4 cells per somite length, L = 6 S) whose cells (phase histories and
#      intrinsic frequencies) are advected anteriorly one column per 1/4 segmentation period while a
#      tailbud-anchored exponential FGF8/Wnt profile omega(x) = omega_0 exp(-xi/lambda_F) (f_A = 0.5) is held in
#      lattice coordinates (`fgf_wnt_frequency_profile` L284-319, advection L523-531). Kinematic waves emerge
#      (N_w = 1.58 vs the Law-4 analytic 1.61; anterior wavelength 2.21 S vs 2.00 S), slow toward the front
#      (Panel G zoom), vanish for a uniform profile (N_w = -0.03) and fade/recover across the DAPT pulse
#      (Panel G kymograph). The coupling delay had to be scaled with the local period
#      (tau_c(x) omega(x) = tau_c omega_0, L413) because the fixed 20.5-min delay becomes repulsive
#      (cos(omega tau_c) < 0) in the slowed anterior PSM — a declared assumption, shown in Panel B.
#   2. v2 item "explicit Mib1 DeltaC ubiquitination kinetics in kappa(t)": kappa(t) = kappa_max u(t) g(t) with
#      du/dt = k_ub M (1 - u) - k_endo u (Itoh et al. 2003; `mib1_ubiquitination_steady_state` L322-331,
#      ODE L495-499) and a gamma-secretase gate g with first-order DAPT clearance after washout (L486-494).
#      mib1-null (M = 0) desynchronises like early DAPT (late R 0.28, emergent ALD 5.8), the Mib1 dose sweep is
#      monotone (Panel I inset), and Mib1 restoration at somite 9 rescues with the ubiquitination lag tau_u = 10 min.
#   3. Defects exposed and fixed: (a) Pass 2's ALD/PRP were hard-coded as s_in + 5.5 / s_out + 5.5 (v2 L326-335),
#      so its "5-regime validation r = 0.9999" compared the reference JSON's own prediction with the observations
#      — ALD and PRP are now EMERGENT from the first R_crit crossings of the front lateral order parameter
#      (L544-554, L563-581; Law 6) and the 5-regime table is re-run over 5 seeds (L661-715); (b) Pass 2's
#      coupling torque contained an uncited instantaneous mean-field term 1.6 kappa_eff sin(psi - theta) and a
#      0.35/0.65 local/mean-field blend (v2 L305-307) — removed, the lattice is now the pure nearest-neighbour
#      delayed Kuramoto model (L501-515); (c) the reference JSON's canonical Omega / T_sync / kappa_eff
#      (0.2896 / 21.70 / 0.0566) were not roots of the collective-frequency equation — corrected to
#      0.283333 / 22.176 / 0.062255 and asserted by the self-test (L1289-1294); (d) the somite stage is now
#      clock-counted at Omega(kappa(t)), so Herrgen et al.'s (2010) DAPT period lengthening (22.18 -> 25.00 min)
#      is emergent in the somite count (L517-522); (e) the vendored SEM specimen is a CHICK embryo (Wikimedia
#      "Aves Neural tube and somites in chick embryo"), not Danio rerio — species label corrected in the JSON and
#      README (file retained, SHA-256-pinned).
#   4. Three new Lean 4 theorems (0 sorrys, `lean` exit 0) in `Loop_023_delta_notch_phase_synchrony.lean`
#      L119-226, registered as laws 4-6 in `math_kg_loops/riedel-delta-notch-phase-synchrony.yaml`;
#      3 new references (Itoh 2003, Dubrulle 2001, Soroldoni 2014) with DOIs in the docstring, bib and JSON.
#
# Scores below: overall 86.5 (down from 91.3). The decrease is deliberate: the remediation delivered both
# requested mechanisms in reduced, declared form and replaced a hard-coded validation with an emergent one, but
# (a) the specimen used for specimen-match is a chick embryo mislabelled as zebrafish in Passes 1-2 and is still
# compared only through a fitted sinusoid, (b) the kinematic-wave and Mib1 references are model-internal
# (analytic law, random-phase floor) rather than digitised data, and (c) three rate constants (D_phi, sigma_omega,
# tau_wash) are calibrated to the very ALD/PRP data the model is validated against. Remaining findings are
# listed under `remediation` with line pins.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files at commit d58a084 (working tree of this loop).

