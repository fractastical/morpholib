    - >-
      2006-riedel-delta-notch-phase-synchrony.py:161-162, 174 and 661-744 — D_phi, sigma_omega and tau_wash are
      calibrated to the ALD/PRP data the model is validated against. Hold out the PRP and the s_in = 4, 9
      regimes from calibration explicitly (fit only on s_in = 0), report in-sample vs out-of-sample errors, and
      add seed-to-seed sd and n_lat / R_crit / Delta_n_det sensitivity to the validation table.
    - >-
      2006-riedel-delta-notch-phase-synchrony.py:172-176 — Mib1 (k_ub, k_endo) and DAPT (dose/IC50, Hill n,
      tau_wash) rate constants are unmeasured. Anchor k_endo to a measured Delta endocytosis/turnover half-life
