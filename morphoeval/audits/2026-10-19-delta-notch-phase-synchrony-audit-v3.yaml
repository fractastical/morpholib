simulations:
  - id: riedel-delta-notch-phase-synchrony
    name: "Riedel-Kruse et al. (2007) & Morelli et al. (2009) zebrafish Delta-Notch delayed Kuramoto phase synchrony on an advected FGF8/Wnt-graded PSM lattice: kinematic waves, Mib1-gated coupling, emergent DAPT ALD/PRP"
    organism: "Danio rerio (zebrafish presomitic mesoderm & paraxial somites); vendored SEM specimen is a chick (Gallus gallus) embryo used as a vertebrate somite-metamere stand-in"
    script: 2006-riedel-delta-notch-phase-synchrony.py
    output: docs/media/delta_notch_phase_synchrony_comparison.png
    extra_outputs:
      - docs/media/delta_notch_phase_synchrony_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-delta-notch-phase-synchrony-audit-v2
    claim_boundary:
      reported_in_source:
        - "Riedel-Kruse et al. (2007) Science 317:1911-1915 & Morelli et al. (2009) HFSP J. 3:55-66 delayed Kuramoto phase-oscillator model dtheta_i/dt = omega_i + (kappa/z)*sum_j sin(theta_j(t - tau_c) - theta_i(t)) + xi_i(t), collective frequency shift Omega = omega_0 - kappa*sin(Omega*tau_c), linear stability stiffness kappa_eff = kappa*cos(Omega*tau_c) > 0"
        - "Riedel-Kruse et al. (2007): DAPT pulse-chase Anterior Limit of Defects ALD(s_in) = s_in + ~5.5 somites (obs 5.4 +/- 0.8, 9.6 +/- 0.9, 14.4 +/- 0.9 for s_in = 0, 4, 9) and Posterior Rescue Point PRP = 14.7 +/- 1.1 after washout at s_out = 9; mib/aei/des/bea mutants desynchronise like early DAPT"
        - "Morelli et al. (2009) frequency profile omega(x) and kinematic phase waves k = (Omega - omega(x))/v travelling posterior -> anterior; Soroldoni et al. (2014) order 1-2 waves across the zebrafish PSM, waves slowing anteriorly; Herrgen et al. (2010) DAPT lengthens the segmentation period"
        - "Itoh et al. (2003): Mind bomb E3 ubiquitin ligase ubiquitinates Delta, required for Delta endocytosis and trans-activation of Notch; mib^ta52b abolishes Delta-Notch signalling"
      reconstructed_in_script:
        - "Transcendental collective frequency solver and 2D (tau_c, kappa) linear stability tongue (T_sync = 22.18 min, kappa_eff = 0.0623 min^-1 at tau_c = 20.5 min vs -0.0353 min^-1 at tau_c = 11.0 min)"
        - "Advected 24 x 12 AP x lateral nearest-neighbour delayed Kuramoto PSM lattice (open AP, periodic lateral, per-column period-scaled delay) under a tailbud-anchored exponential FGF8/Wnt frequency profile (f_A = 0.5): N_w = 1.58 kinematic waves (analytic 1.61), anterior wavelength 2.21 S (analytic 2.00 S), N_w monotone in f_A (2.52 -> -0.03 for f_A 0.3 -> 1.0)"
        - "Mib1-gated coupling kappa(t) = kappa_max u(t) g(t) with ubiquitination ODE (k_ub = 0.08, k_endo = 0.02 min^-1, u_ss^WT = 0.8) and gamma-secretase gate with 8-min DAPT clearance; mib1-null late R = 0.28 (ALD 5.8), Mib1 restoration at s = 9 rescues to R = 0.77 (PRP 15.3); dose sweep monotone"
        - "Emergent ALD/PRP from R_crit = 0.5 crossings of the half-period-smoothed front lateral order parameter + Delta_n_det = 2.5: 5-seed means ALD = 5.41 / 9.21 / 14.24 (obs 5.4 / 9.6 / 14.4), PRP = 14.86 (obs 14.7), RMSE 0.22 somites, Pearson r = 0.9998 (0.9986 over the 4 perturbed regimes); somite stage clock-counted at Omega(kappa(t)) so continuous DAPT lengthens the period from 22.18 to 25.00 min"
        - "Bilateral dorsal somite row DoG peak segmentation on the vendored SEM (48.47 px mean spacing, symmetry ratio 0.9606, fitted-sinusoid r = 0.563)"
      transfer_boundary:
        - "The frequency profile is a single exponential with f_A = 0.5 and L = 6 S chosen to land in the 1-2-wave range reported for zebrafish; it is not digitised from Morelli (2009) Fig. 3 or Soroldoni (2014) kymographs, and the N_w measurement's reference value is the model's own analytic law"
        - "tau_c(x) omega(x) = const (coupling delay scales with the local period) is this script's assumption; the Eulerian-delay alternative was not simulated"
        - "k_ub, k_endo, tau_wash, DAPT dose/IC50 and Hill n are the script's reduced rate constants; D_phi = 0.003 rad^2/min, sigma_omega = 0.014 rad/min and tau_wash = 8 min were calibrated so the emergent ALD/PRP lags match the Riedel-Kruse (2007) data (as the paper fitted its desynchronisation rate)"
        - "The SEM specimen is a chick embryo (Wikimedia 'Aves Neural tube and somites in chick embryo'), used as a vertebrate somite-metamere stand-in; no zebrafish her1/deltaC in-situ wave pattern is vendored"
      does_not_claim:
        - "PSM shortening and the Soroldoni (2014) Doppler contribution to the segmentation period, cell division/ingression in the tailbud, 3D cell sorting, explicit Mib1 E3-ligase stoichiometry or measured Delta endocytosis rates, or a boundary profile derived from the phase pattern (chi(s) is a coherence-gated synthetic rendering)"
    source_refs:
      - riedelkruse2007
      - morelli2009
      - herrgen2010
      - horikawa2006
      - itoh2003
      - dubrulle2001
      - soroldoni2014
    summary: >-
      Pass 3 remediated evaluation of `2006-riedel-delta-notch-phase-synchrony.py` (86.5/100, down from
      91.3 in Pass 2). Both v2 remediation items are closed in reduced, declared form: the lattice is now an
      advected 24 x 12 AP x lateral delayed Kuramoto PSM under a tailbud-anchored FGF8/Wnt frequency profile
      with per-column period-scaled delays, producing posterior -> anterior kinematic phase waves (N_w = 1.58
      vs the Law-4 analytic 1.61, anterior wavelength 2.21 S vs 2.00 S, monotone in f_A, absent for a uniform
      profile) that fade and recover across the DAPT pulse; and the Delta-Notch coupling is a dynamical variable
      kappa(t) = kappa_max u(t) g(t) with Mib1 ubiquitination kinetics and DAPT clearance (mib1-null
      desynchronises like early DAPT, dose sweep monotone, Mib1 restoration rescues with tau_u = 10 min). The
      remediation also exposed and removed Pass 2's hard-coded ALD/PRP (its 5-regime "validation" compared the
      reference JSON with itself) and an uncited instantaneous mean-field torque; ALD/PRP are now emergent
      (5-seed RMSE 0.22 somites, r = 0.9998) and the DAPT period lengthening is emergent in the somite count.
      Six Lean 4 theorems (0 sorrys) back laws 1-6. The score falls because the specimen is a chick embryo
      mislabelled as zebrafish in Passes 1-2 and is still compared only via a fitted sinusoid, two new measurement
      references are model-internal, and three rate constants are calibrated to the validation data.
    scores:
      model-fidelity:
        value: 91
        rationale: >-
          The lattice equation is now exactly the source model: nearest-neighbour delayed coupling
          (kappa/z_i) sum_j sin(theta_j(t - tau_c,j) - theta_i) with open AP / periodic lateral boundaries
          (L501-515), the ad hoc 1.6 kappa_eff sin(psi - theta) term and the 0.35/0.65 blend of Pass 2 are
          gone, the collective frequency / stiffness solver is unchanged (L213-266) and the kinematic
          steady state used for initialisation is the Law-4 solution k = (Omega/v)(1 - c) (L432-437); the
          emergent segmentation period of the lattice (22.18 min WT, 25.00 min DAPT) matches the solver.
          Deductions: the frequency profile is a single exponential with f_A = 0.5 (L284-319), not Morelli's
          profile (-3); the per-column delay scaling tau_c(x) omega(x) = const (L413) is a modelling choice
          introduced to keep the anterior coupling attractive, and Panel B only marks the unscaled point
          rather than simulating it (-3); Mib1 kinetics are a two-rate linear ODE with unmeasured k_ub,
          k_endo (L172-173, L495-499) and the DAPT gate is a Hill function with assumed dose/IC50 = 20
          and n = 2 (L174-176) (-2); advection is a discrete one-column shift with tailbud seeding from the
          last column plus 0.05 rad noise (L523-531), with no cell division or PSM shortening (-1).
