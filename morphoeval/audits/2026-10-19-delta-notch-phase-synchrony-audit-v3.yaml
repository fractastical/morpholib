          - {file: 2006-riedel-delta-notch-phase-synchrony.py, lines: [284, 319], note: "fgf_wnt_frequency_profile: omega(xi) = omega_0 exp(-xi/lambda_F), lambda_F = L/ln(1/f_A); analytic N_w = (1/S) Int (1 - c) dx", supports: true}
          - {file: 2006-riedel-delta-notch-phase-synchrony.py, lines: [408, 437], note: "Period-scaled per-column delays (L413) and Law-4 kinematic steady-state initialisation (L432-437); Mib1 normalisation kappa_max = kappa_WT / u_ss(1) (L420-425)", supports: true}
          - {file: 2006-riedel-delta-notch-phase-synchrony.py, lines: [486, 531], note: "DAPT gate with first-order clearance (L486-494), Mib1 ubiquitination ODE (L495-499), somite-stage clock at Omega(kappa(t)) (L517-522), Lagrangian advection of histories and delta_omega (L523-531)", supports: true}
          - {file: morphoeval/lean/loops/Loop_023_delta_notch_phase_synchrony.lean, lines: [119, 226], note: "Three new machine-checked theorems: kinematic phase-lag law, Mib1 gate monotonicity, emergent defect-span invariance (6 theorems total, 0 sorrys)", supports: true}
          - {file: 2006-riedel-delta-notch-phase-synchrony.py, lines: [171, 176], note: "k_ub, k_endo, tau_wash, dose ratio and Hill n are declared reduced constants without measured sources", supports: false}
