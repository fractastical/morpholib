      tau_c(x) omega(x) = const is asserted, not tested. Add an --eulerian-delay mode (fixed tau_c, history not
      advected) and report the anterior coherence loss it predicts, so the assumption is tested rather than declared.
    - >-
      datasets/delta_notch_phase_synchrony/zebrafish_psm_synchrony_specimen.jpg (JSON L48, README L60) and
      2006-riedel-delta-notch-phase-synchrony.py:838-847 — the only specimen is a chick SEM compared through a
