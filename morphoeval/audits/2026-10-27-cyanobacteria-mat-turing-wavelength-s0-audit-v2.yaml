  phenomenon_size_m: 6.419e-05
  scale_tier: 4_cellular_10um
  geological_age_ma: 0.0
  geological_period: Holocene (Extant)
  summary: 'Re-run of the same checkpoint after the four Pass-1 gaps were closed in the script: narrow-band
    sweep (r = 0.999475), equal-diffusion ablation (sigma_max = -0.0588, RMS ratio 0.047), plate segmentation
    (137 colonies versus 65 spots, KS = 0.453), and eigenvector dispersion fit (r = 0.999986, RMSE = 0.00558)
    with the rejected bin-mean control still reported (r = 0.5288). cv_sim_similarity remains 90.7 on
    a 12-frame 640x520 GIF. The size distributions still disagree; that is measured, not tuned away. No
    second 64 µm micrograph and no second assessor. Overall 87.1.'
  claim_boundary:
    reported_in_source:
    - Turing 1952 dispersion relation and the existence of a selected finite wavenumber
    - Schnakenberg 1979 two-species kinetics
    - Petroff et al. 2010 centimetre-scale conical stromatolite spacing
    - Shepard and Sumner 2010 reticulate mats from filament motility
    reconstructed_in_script:
    - Diffusivities, including the measured finite-amplitude factor 1.08, so the saturated Fourier mode
      is 64.19 µm
    - Eigenvector single-mode growth rates, equal-diffusion ablation, and the diffusivity sweep
    - A display transfer that paints activator peaks as beige colonies on illuminated agar for comparison
      with the culture plate
    transfer_boundary:
    - The culture plate is macroscopic. Morphometrics that compare it to the 513.5 µm domain are scale-free
      (CV spectra, median-normalised diameters).
    does_not_claim:
    - That a paper measured 64.19 µm as a pigment wavelength of this mat
    - That the plate photograph is a 64 µm micrograph
    - That colony-size distributions match the spots (KS = 0.453)
    - That Petroff's cone equation is being integrated
  scores:
    model-fidelity:
      value: 91
      rationale: 'Pass 2: the script integrates Schnakenberg kinetics with the Turing dispersion sigma(k),
        spectral diffusion, and an eigenvector probe of eleven exact Fourier modes. Slot parameters (a,
        b, Dv/Du) = (0.11, 0.83, 16) are not the Anabaena heterocyst set. The factor 1.08 on both diffusivities
        is an empirical finite-amplitude correction measured on this domain (scale 1.00 locks to mode
        9 / 57 µm; 1.08 locks to mode 8 / 64.19 µm; 1.30 locks to mode 7). It is not a diffusivity reported
        for a cyanobacterial mat.'
      evidence:
      - file: models/2026-delphi10000-cyanobacteria-mat-turing-wavelength-s0.py
        lines:
        - 14
        - 28
        note: PDE, steady state, and sigma(k) in the module docstring
        supports: true
      - file: models/2026-delphi10000-cyanobacteria-mat-turing-wavelength-s0.py
        lines:
        - 122
        - 155
        note: Jacobian and sigma(k)
        supports: true
      - file: models/2026-delphi10000-cyanobacteria-mat-turing-wavelength-s0.py
        lines:
        - 164
        - 208
        note: diffusivities, including finite-amplitude scale 1.08
        supports: true
      - file: morphoeval/lean/loops/Loop_3158_cyanobacteria_mat_turing_wavelength_s0.lean
        lines:
        - 15
        - 20
        note: Lean proof that the scaled trace is negative
        supports: true
      - file: models/2026-delphi10000-cyanobacteria-mat-turing-wavelength-s0.py
        lines:
        - 379
        - 422
        note: rejected bin-mean estimator, kept as a negative control (r = 0.529)
        supports: false
    specimen-match:
      value: 82
      rationale: 'Pass 2: the GIF last frame scores cv_sim_similarity 90.7 against the culture-plate photograph
        (12 frames, 640x520). Beige colonies on a gold ground are the right pattern class for this plate.
        The photograph is a macroscopic plate, not a 64 µm field, and the agar illumination in the display
        transfer is not a biological field. KS = 0.453 on median-normalised diameters: the size distributions
        do not match, and that disagreement is left in the figure.'
      evidence:
      - file: docs/media/cyanobacteria_mat_turing_wavelength_s0_comparison.png
        lines:
        - 0
        - 0
        note: side-by-side plate, activator, styled frame, dispersion, sweep
