        supports: true
    parameter-expressivity:
      value: 89
      rationale: 'Pass 2: diffusivity scale gamma in (0.5, 1.0, 1.5, 2.0) moves the narrow-band wavelength
        with Pearson r = 0.9995 against lambda * sqrt(gamma). An earlier integer-shell summary pinned
