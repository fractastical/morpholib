- id: delphi10000-cyanobacteria-mat-turing-wavelength-s0
  name: Cyanobacteria mat Turing ocellus wavelength at 64.19 µm (Holocene, 0 Ma)
  organism: Cyanobacteria mat (Stromatolite Mat)
