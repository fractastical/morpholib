    morphometric-validation:
      value: 86
      rationale: 'Pass 2: saturated dominant shell is 64.19 µm; the linear k_* wavelength is 66.617 µm.
        Eigenvector probe versus analytical sigma(k): Pearson r = 0.999986, RMSE = 0.00558 (11 modes).
        The rejected bin-mean estimator scores r = 0.529 on the same diffusivities. Plate segmentation
        finds 137 colonies (area CV 1.642) against 65 spots (area CV 0.295); two-sample KS = 0.453. Those
        specimen numbers are not copies of the simulation. n = 1 plate, and the plate is not at 64 µm.'
