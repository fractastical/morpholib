    status: evaluated
    source_refs: [turing1952, bouyer2008, dipatti2023, balkunde2020]
    summary: >
      Schnakenberg reduction of Bouyer TTG1 trapping/depletion on a 446.4 µm
      primordium patch, with the Turing wavenumber fixed at 111.6 µm (0.0001116 m)
      and diffusivity ratio 8.4. Holocene extant, chronoseries 1/1, age 0 Ma.
      Continuum dispersion versus the discrete Laplacian has Pearson r = 0.99991.
      Equal diffusion collapses the field. A noisy run raises the high-k spectral
      tail by a factor 1.70.
