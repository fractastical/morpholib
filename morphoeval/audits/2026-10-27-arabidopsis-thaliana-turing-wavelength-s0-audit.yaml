    scores:
      model-fidelity:
        value: 89
        rationale: >
          The script implements Schnakenberg kinetics, the steady-state Jacobian,
          and the Turing wavenumber law with Dv/Du = 8.4 so that λ_c is 111.6 µm.
          Continuum σ(k) is checked against the discrete Laplacian on the same
          128 grid (r = 0.99991, RMSE = 0.00336). Equal diffusion is integrated
          at the geometric-mean diffusivity and the field standard deviation
          falls to about 1e-14. The stochastic term is a stand-in for Di Patti
          noise, not their master equation, which is why this is not a 95.
        evidence:
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [79, 150], note: "Jacobian, k_c diffusivities, continuum and discrete-grid dispersion", supports: true}
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [158, 204], note: "Spectral IMEX Schnakenberg step and seeded integrator", supports: true}
          - {file: morphoeval/lean/loops/Loop_3117_arabidopsis_thaliana_turing_wavelength_s0.lean, lines: [10, 43], note: "Five theorems, zero sorry, for the numerator sign and the 0/4/16 mode counts", supports: true}
      specimen-match:
        value: 82
        rationale: >
          The comparison figure places Heiti Paves' CC BY-SA trichome SEM beside
          the activator field and a blend of the two. The field is a spot lattice
          on a 446.4 µm patch; it does not grow the branched hair. The growth GIF
          ends on that SEM so the differentiated trichome is what the last frame
          shows. The mislabeled Aeonium gallery file was rejected.
        evidence:
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [291, 323], note: "Cyan trichome segmentation and epidermis foreground, no invented scale bar", supports: true}
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [394, 465], note: "GIF crossfade and six-panel comparison including the Paves SEM", supports: true}
          - {file: docs/media/arabidopsis_thaliana_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Pass-1 comparison figure", supports: true}
      parameter-expressivity:
        value: 85
        rationale: >
          With Du held at the 111.6 µm value, Dv/Du runs through 1, 4, 6, 8.4, 12
          and 20. Amplitude stays near zero below the Turing threshold and rises
          past d = 8.4. The wavelength panel draws λ(argmax σ) only where σ_max
          is positive, so the equal-diffusion control is not drawn as a fake
          558 µm mode. That ratio is the knob for this slot; it is not copied
          from a millimetre-scale sibling.
        evidence:
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [325, 361], note: "Fixed-Du diffusivity sweep and short integrations", supports: true}
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [415, 465], note: "Amplitude and wavelength panels", supports: true}
      morphometric-validation:
        value: 84
        rationale: >
          The nonlinear FFT wavelength is 111.50 µm against the law value 111.6 µm.
          Nearest-neighbour spacing of 21 spots is 101.11 µm (CV 0.108), with a
          500-draw bootstrap 95% interval 96.60–105.81 µm. A KS test against
          Normal(111.6, 16.74) gives D = 0.495, which does not match that normal
          and is reported as a failure of that reference distribution rather than
          forced through. Specimen cyan fraction 0.094 is not the simulated peak
          fraction 0.284. Dispersion RMSE is 0.00336.
        evidence:
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [206, 254], note: "Radial-FFT wavelength and nearest-neighbour spacing", supports: true}
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [477, 608], note: "Measurement table with references that differ from the values", supports: true}
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [732, 758], note: "Self-test requires r > 0.98, RMSE < 0.05, and a collapsed equal-diffusion control", supports: true}
      source-traceability:
        value: 90
        rationale: >
          Four DOIs are cited. Both images are CC BY-SA 3.0 Wikimedia files with
          authors (Heiti Paves; Emmanuel Boutet) and SHA-256 pins. The scout
          manifest records that slot 3117 is not in the 100-slot campaign file.
        evidence:
          - {file: datasets/arabidopsis_thaliana_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "Turing, Bouyer, Di Patti, Balkunde", supports: true}
          - {file: datasets/arabidopsis_thaliana_turing_wavelength_s0/arabidopsis_thaliana_turing_wavelength_s0_reference.json, lines: [1, 40], note: "Scale 0.0001116 m and age 0 Ma stated in the reference", supports: true}
          - {file: datasets/arabidopsis_thaliana_turing_wavelength_s0/scout_manifest.json, lines: [1, 20], note: "Scout dossier with slot 3117 and the selected DOI", supports: true}
      code-traceability:
        value: 84
        rationale: >
          Jacobian, wavenumber, integrator, sweep, and specimen segmentation are
          separate functions. Lean theorems match the sign of the Turing numerator
          and the mode counts 0, 4, and 16. They do not encode the floating-point
          Jacobian, which is the right claim boundary for a dependency-free Lean file.
        evidence:
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [123, 156], note: "Analytic σ(k) and k_c next to the discrete symbol", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-arabidopsis-thaliana-turing-wavelength-s0.yaml, lines: [1, 40], note: "Math KG card names the law, the scale, and the Lean declarations", supports: true}
      repro-package:
