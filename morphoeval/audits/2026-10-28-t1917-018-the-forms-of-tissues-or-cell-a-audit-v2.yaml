simulations:
  - id: thompson1917-t1917-018
    name: "Thompson (1917) T1917-018 — Plateau tri-junction (120 degree) claim: Lami balance, periodic froth relaxation, junction-angle statistics"
    organism: "species-agnostic claim; specimens: Homo sapiens corneal endothelium, Allium cepa epidermis, Thompson Fig. 103 (Zea mays parenchyma), Fig. 124 (Girardia epidermis)"
    script: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py
    output: docs/media/t1917_018_the_forms_of_tissues_or_cell_a_comparison.png
    extra_outputs:
      - docs/media/t1917_018_the_forms_of_tissues_or_cell_a_growth.gif
      - datasets/thompson_1917/t1917-018/result.json
      - datasets/thompson_1917/t1917-018/t1917_018_metrics.json
    status: evaluated
    source_refs:
      - thompson1917
      - plateau1873
      - taylor1976
      - farhadifar2007
      - hayashi2004
      - alt2017
      - doughty1989
      - commons_cornea
      - commons_onion
    claim_boundary:
      reported_in_source:
        - "Thompson (1917) p. 297: three similar liquid surfaces always meet at 120 degrees; p. 303 Fig. 113 cases (1)-(3): 90 / >90 / 120 degrees as the partition tension t rises to T; pp. 309-310: Lamarle's least-area partition meets in threes at 120 degrees and 'in any ordinary section of a vegetable parenchyma ... cell-walls everywhere meeting, by threes, at angles of 120 degrees, irrespective of the size of the individual cells'."
        - "Thompson (1917) pp. 314, 321-322: epidermal outer walls and growth/traction anisotropy (Fig. 124 Girardia) are stated exceptions where the angles depart from 120 degrees while three-fold meeting persists."
      reconstructed_in_script:
        - "Lami/Neumann triangle of forces (E1) with the Fig. 113 cases and the inverse map from measured angles to tension ratios; Steiner-vs-cross film lengths (E2); angle-sum identity statistics with vertex-level bootstrap (E3); periodic Poisson-Voronoi vertex network relaxed by analytic-gradient descent with T1 exchanges under E = sum K/2 (A - A0)^2 + Gamma/2 P^2 + sum Lambda(phi) l, Lambda(phi) = Lambda0 (1 + eps cos 2 phi) (E5), in the equal-tension Plateau limit (Gamma = eps = 0), the Farhadifar Case I comparator, and a 7-point eps sweep."
        - "Segmentation of two CC BY-SA micrographs (nucleus-seeded watershed on a Sato ridge image for the corneal endothelium; Sato wall mask -> connected components for the onion epidermis) and skeleton-graph extraction of Thompson's Figs. 103 and 124; tri-cellular junction angles by a chord estimator (straight edges to the neighbouring vertices, primary) and a branch estimator (mean wall offset within R = L_e/3)."
        - "Verdict by pre-registered criteria (three-fold fraction >= 0.90 in both micrographs; chord median |theta - 120| <= 15 degrees in the isotropic specimen; dispersion below the Poisson-Voronoi null): SUPPORTED, with the branch-estimator sensitivity (15.9 degrees) reported."
      transfer_boundary:
        - "2D en-face projection / plane section of 3D cells; Thompson's 109 deg 28' tetrahedral edge law is not simulated. The vertex model has straight edges, so unlike a real soap froth it cannot realise 120 degrees at every vertex of a disordered tessellation (a straight-sided pentagon's angles sum to 540 degrees); its irreducible chord-angle SD (~10 degrees) is the appropriate null for straight-walled tissue, not an exact 120."
        - "The Commons micrographs are modern specimens not figured by Thompson; because the claim names no species they are specimens of the claim rather than analogues of a named species, and are labelled as modern throughout."
      does_not_claim:
        - "Does not claim that junction angles are exactly 120 degrees in any tissue, that cortical tensions are measured (they are inferred by inverse Lami only), or anything about the pre-scouted Dryad set doi:10.5061/dryad.mn8cs, which is a DATASET_MISMATCH (Ca2+ ratio imaging with no junction label) and is not used."
        - "Does not model cell division, active junction remodelling, or 3D apico-basal geometry."
    summary: >-
      Pass 2 (v2) evaluation (overall 87.0/100, up from 40.2/100 in Pass 1; +46.8 points). The remediated
      script SHA-256-verifies all four vendored specimens, segments the human corneal endothelium (126 cells,
      215 vertices), the onion epidermis (47 cells, 68 vertices) and Thompson's own Figs. 103 and 124 (13 and 28
      vertices), and scores tri-junction angles with two estimators against a-priori criteria. Every detected
      vertex in every specimen is three-fold (f3 = 1.000; Plateau's second law). In the isotropic corneal
      monolayer the chord-angle distribution has median |theta - 120| = 7.2 degrees [bootstrap 95 % CI 6.3, 7.7],
      SD 12.5 degrees, 81 % within +/-15 degrees, and is statistically indistinguishable from the relaxed
      equal-tension froth model (two-sample KS D = 0.045, p = 0.60; histogram r = 0.98) while far from the
      Poisson-Voronoi null (KS D = 0.27; SD 29.5 degrees). The anisotropic onion epidermis and Thompson's Fig.
      124 behave as he predicted (still three-fold, angles spread; best-fit anisotropy eps = 0.2 and 0.3), and
      his Fig. 103 is drawn with median |theta - 120| = 2.3 degrees. Verdict: SUPPORTED. Remaining weaknesses:
      the branch estimator puts the cornea at 15.9 degrees (estimator sensitivity at the tolerance edge), the
      onion segmentation under-counts small cells, Fig. 124's four boundary T-junctions are not separated from
      interior ones, and the model is straight-edged (no film curvature).
    scores:
      model-fidelity:
        value: 88
        rationale: >-
          `lami_angles_from_tensions` / `tensions_from_angles` / `thompson_fig113_cases` (L140-172) implement
          Thompson's triangle of forces exactly, `steiner_vs_cross_lengths` (L174-177) Lamarle's four-fold
          instability, and `PeriodicNetwork.energy_gradient` (L284-311) the Farhadifar-type vertex energy with
          orientation-dependent tension and an analytic gradient verified against finite differences in the
          self-test (L1267-1319). The equal-tension Plateau limit (Gamma = eps = 0) is now reached with
          combinatorial T1 exchanges (`t1_shortest_edge`, L345-406) and a gradient-norm convergence criterion
          (`relax_froth`, L440-465): the relaxed froth is three-valent with mean six sides, SD 9.9 degrees. What
          keeps it from the top band: edges are straight, so the model cannot reproduce the curved-film 120
          degrees of a real froth in a disordered topology (documented in the claim boundary), and the 3D
          tetrahedral law is not simulated.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [140, 177], note: "Lami balance, inverse Lami, Fig. 113 cases, Steiner inequality as published", supports: true}
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [284, 311], note: "Vertex energy E5 with anisotropic line tension and analytic gradient", supports: true}
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [345, 465], note: "Combinatorial T1 exchanges and convergence-checked relaxation; straight edges only (no film curvature)", supports: true}
      specimen-match:
        value: 84
        rationale: >-
          All four specimens are loaded, verified (`verify_inputs`, L124-137) and segmented with pipelines
          matched to their imaging (`segment_specimen`, L532-572: nucleus-seeded watershed on a Sato ridge for the
          alizarin-red corneal mosaic, Sato wall mask + components for the magenta-walled onion, skeleton graph of
          the closed ink for Thompson's drawings, `skeleton_graph_analysis` L681-778), and the comparison figure
          (`render_figures`, L988-1109) shows each specimen with its segmentation and detected vertices beside the
          model and the nulls. The cornea segmentation is clean (126 cells, one nucleus each). Deductions: the
          onion pipeline drops small cells (47 of roughly 60 visible), and Fig. 124's four boundary T-junctions on
          the strip's outer walls are scored together with interior vertices.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [532, 572], note: "Per-specimen segmentation pipelines", supports: true}
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [681, 778], note: "Skeleton-graph vertex extraction for Thompson's drawings with spur pruning, short-edge collapse and bourrelet hole filling", supports: true}
          - {file: docs/media/t1917_018_the_forms_of_tissues_or_cell_a_comparison.png, lines: [0, 0], note: "Four specimen panels with segmentation overlays and vertices; onion under-segmented at the periphery", supports: true}
      parameter-expressivity:
        value: 86
        rationale: >-
          `run_model_suite` (L864-908) sweeps the tension anisotropy eps over seven values (SD rises monotonically
          9.9 -> 11.8 -> 17.4 -> 25.7 -> 36.1 -> 43.8 -> 51.5 degrees, i.e. eps visibly controls the Fig. 124
          distortion), the Lami partition-tension ratio t/T continuously, and contrasts the Plateau limit with the
          Farhadifar Case I perimeter-contractility comparator; `parse_args` (L1321-1339) exposes --eps-sweep,
          --lambda-bar, --gamma-bar, --seed, --steps, --n-cells, --bootstrap, --tolerance, --quick and --no-figures.
          K and the T1 threshold remain module constants.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [864, 908], note: "eps sweep, Lami sweep, Plateau vs Farhadifar regimes, brick/square controls", supports: true}
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [1321, 1339], note: "Ten CLI flags; K and T1_LENGTH not exposed", supports: true}
      morphometric-validation:
        value: 88
        rationale: >-
          `plateau_statistics`, `bootstrap_vertex_ci`, `two_sample_ks` and `histogram_fit` (L180-232) deliver SD,
          RMS deviation, median |theta - 120| with vertex-resampled 95 % CIs, fraction within the a-priori +/-15
          degree tolerance, CV, two-sample KS D/p, histogram Pearson r and RMSE; `goodness_of_fit` (L910-935) fits
          eps by KS distance and compares each specimen with the Plateau froth, the Poisson-Voronoi null and the
          Farhadifar comparator; `decide_verdict` (L937-973) applies the pre-registered criteria and records the
          branch-estimator robustness. The cornea result (KS p = 0.60 vs the froth, D = 0.27 vs Voronoi) is a
          genuine quantitative match. Deduction: the two estimators disagree on the cornea (7.2 vs 15.9 degrees),
          so the angle criterion is estimator-sensitive at the tolerance edge; no literature junction-angle
          distribution is available to pin as an external reference value.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [180, 232], note: "Dispersion statistics, bootstrap CI, KS and histogram r/RMSE", supports: true}
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [910, 973], note: "Goodness-of-fit vs model and nulls; pre-registered verdict with estimator robustness block", supports: true}
          - {file: datasets/thompson_1917/t1917-018/result.json, lines: [1, 40], note: "Verdict, CIs and headline numbers written by the run", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          The script loads the reference package and SHA-256-verifies every specimen and both IA leaves at start-up
          (`verify_inputs`, L124-137; also in `--self-test`); result.json records the dataset names, digests, the
          IA leaf numbers, the Commons authors/licences and the Dryad DATASET_MISMATCH with its metadata digests.
          The docstring and reference.json carry page-pinned Thompson quotes and resolvable DOIs/URLs for every
          source. Minor gap: Plateau (1873) and Lamarle (1864) are cited by archive URL, not DOI.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [111, 137], note: "Runtime SHA-256 verification against reference.json", supports: true}
          - {file: datasets/thompson_1917/t1917-018/t1917_018_the_forms_of_tissues_or_cell_a_reference.json, lines: [1, 60], note: "Sources with DOIs/URLs, page-pinned quotes, digests", supports: true}
      code-traceability:
        value: 88
        rationale: >-
          Section banners and function names map onto the equation labels E1/E2/E3/E5 of the reference package;
          the six Lean theorems of `Thompson1917_T1917_018.lean` (Fig. 113 cases, Lami iff equal tensions,
          angle-sum identity, Euler/T1 bookkeeping, hexagon closure, Steiner inequality) compile with Lean 4.35.0
          and 0 sorry, and `math_kg_loops/thompson1917-t1917-018.yaml` pins each law to v2 line ranges. The
          self-test checks the Euler invariant (mean six sides) after T1s. Deduction: the segmentation
          heuristics (thresholds 0.18, 0.6 x Otsu, 0.3 x median area, 15 px ink distance) are documented in
          docstrings but not derived from a source.
        evidence:
          - {file: morphoeval/lean/loops/Thompson1917_T1917_018.lean, lines: [39, 229], note: "Six machine-checked theorems plus two lemmas (namespace MathOfBiology.Loop_213)", supports: true}
          - {file: morphoeval/math_kg_loops/thompson1917-t1917-018.yaml, lines: [1, 140], note: "Laws linked to Lean declarations and v2 code loci", supports: true}
      repro-package:
        value: 88
        rationale: >-
          Deterministic seeds, a `--self-test` (L1267-1319) covering Lami cases, inverse Lami, SHA-256 pins, analytic
          gradient vs finite difference, T1 three-valence and Euler invariant, determinism and a segmentation smoke
          test; the default run takes 12 s and writes result.json plus a full metrics JSON that
          `measure_morphoeval()` (L1216-1265) consumes so MorphoEval measurements are byte-identical to the run.
          Deductions: no environment lock file for this loop beyond the audit's recorded versions, and the PNG/GIF
          bytes depend on the Matplotlib version.
        evidence:
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [1267, 1319], note: "Self-test suite incl. gradient check and SHA-256 pins", supports: true}
          - {file: thompson/claims/t1917-018_the-forms-of-tissues-or-cell-aggregates.py, lines: [1216, 1265], note: "measure_morphoeval() reads the run's metrics JSON", supports: true}
    remediation:
      - "Pass 3: add a curved-edge (circular-arc) froth model or a Surface-Evolver-style relaxation so the Plateau limit reaches 120 degrees exactly, and compare specimen tangent angles against it."
      - "Pass 3: separate Fig. 124's outer-wall T-junctions from interior vertices (Thompson's p. 314 exemption) and improve the onion pipeline with nucleus markers to recover the small peripheral cells."
      - "Pass 3: digitise a published tricellular-junction angle histogram (e.g. Drosophila notum / wing disc) as an external reference value and add a second, independent assessor."
