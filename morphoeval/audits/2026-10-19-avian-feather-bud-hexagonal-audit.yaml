# MorphoEval audit — Glimm et al. (2014) & Ho et al. (2019) Avian Feather Bud Hexagonal Array & Traveling Competence Wave, 2026-10-19 (v1)
#
# Pass 1 assessment of `2018-glimm-avian-feather-bud-hexagonal.py` (v1 baseline, 165 lines)
# prior to Step 12 closed-loop remediation (`2026-10-19-avian-feather-bud-hexagonal-loop`):
#   - Primary assessor: Gemini 4 Argon (Cursor agent) — 58.6 / 100
#   - Second assessor rubric criteria: 53.4 / 100
#   - Pass 1 consensus score: 56.0 / 100
#
# Concrete Pass 1 defects driving Step 12 -> Pass 2 remediation:
#   1. Only a single wave speed (v_w = 0.22) is simulated: omits the central comparative
#      experiment of Ho et al. (2019) Figs. 1C, 3, 4 and Glimm et al. (2014) Figs. 3-6
#      contrasting row-by-row traveling-wave propagation (high hexagonal fidelity P_6 >= 0.85,
#      half-period phase pinning Delta_y = lambda_y/2, Delta_x = (sqrt(3)/2)*lambda_y) against
#      simultaneous global competence (v_w -> inf, Fc-chEDA1 / exogenous FGF flooding, defective
#      polycrystalline Voronoi packing with P_6 approx 0.45-0.55) and Ecto-D2 / LDN retarded
#      wave narrowing (v_w = 0.5x WT).
#   2. No negative or mutant controls are executed: omits the *scaleless* (`sc/sc`, FGF20-null,
#      chi = 0 < chi_c) mutant and Latrunculin A / Blebbistatin actomyosin motility blockade
#      (chi = 0.01 < chi_c), both of which abolish dermal mesenchymal condensation (0 buds).
#   3. Specimen photograph `chick_feather_bud_hexagonal_specimen.jpg` (Ho et al. 2019 PLOS Biol.
#      17:e3000132 Fig. 3) is displayed raw in Panel C without computer-vision segmentation of
#      the 24 feather primordia in Panel B, without Voronoi polygon-class P_6 or bond-orientational
#      |psi_6| computation, and without runtime SHA-256 verification.
#   4. `measure_morphoeval()` reports only 3 basic scalars without Voronoi P_6, |psi_6|,
#      nearest-neighbor spacing CV, wave-speed sweep correlation, or mutant negative-control delta.

