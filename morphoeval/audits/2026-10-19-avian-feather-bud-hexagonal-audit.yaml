simulations:
  - id: glimm-avian-feather-bud-hexagonal
    name: "Glimm et al. (2014) & Ho et al. (2019) avian feather bud hexagonal array & traveling competence wave"
    organism: "Embryonic chick (Gallus gallus) dorsal skin feather tract E6.5-E9.5 hexagonal feather primordia array"
    script: 2018-glimm-avian-feather-bud-hexagonal.py
    output: docs/media/avian_feather_bud_hexagonal_comparison.png
    extra_outputs:
      - docs/media/avian_feather_bud_hexagonal_growth.gif
    status: evaluated
    source_refs:
      - glimm2014
      - ho2019
      - michon2008
      - bailleul2019
    summary: >-
      Pass 1 (v1) baseline evaluation of `2018-glimm-avian-feather-bud-hexagonal.py`
      (56.0/100). The v1 baseline computes the Keller-Segel / FGF20 linear dispersion
      curve and integrates a single 2D dermal chemotaxis + FGF20/BMP4 PDE regime at
      one wave speed (v_w = 0.22), but omits Voronoi polygon-class P_6 and bond-orientational
      |psi_6| lattice order analysis, omits the traveling-wave vs simultaneous-competence
      (Fc-chEDA1 / exogenous FGF flooding, v_w -> inf) comparison, omits Ecto-D2 wave
      narrowing, omits *scaleless* (FGF20-null, chi = 0) and Latrunculin mechanical
      ablation controls, and performs zero computer-vision segmentation on the vendored
      Gallus gallus dorsal feather tract specimen image.
    scores:
      model-fidelity:
        value: 62
        rationale: >-
          Implements the linear Keller-Segel + FGF20 dispersion relation (L27-49) and a
          single 2D dermal chemotaxis + FGF20/BMP4 PDE integration (L52-97), but omits
          sequential row-by-row phase pinning metrics, simultaneous global competence
          (v_w -> inf), *scaleless* FGF20-null (chi = 0), and Latrunculin mechanical
          blockade controls.
        evidence:
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [27, 49], note: "Linear Keller-Segel + FGF20 dispersion curve and critical chi_c", supports: true}
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [52, 97], note: "Single-regime 2D solver without v_w sweep, simultaneous competence, or scaleless/Latrunculin controls", supports: false}
      specimen-match:
        value: 38
        rationale: >-
          Displays `datasets/avian_feather_bud_hexagonal/chick_feather_bud_hexagonal_specimen.jpg`
          raw in Panel C (L117-119) with zero computer-vision segmentation of the 24 feather
          primordia in Panel B or the +24h/+48h tract expansion in Panel A.
        evidence:
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [117, 119], note: "Raw imshow of specimen without feather bud segmentation or Voronoi P_6 analysis", supports: false}
          - {file: docs/media/avian_feather_bud_hexagonal_comparison.png, lines: [0, 0], note: "3-panel baseline figure showing raw specimen without morphometric overlay", supports: false}
      parameter-expressivity:
        value: 44
        rationale: >-
          Simulates only one parameter point (v_w = 0.22, chi = 0.24) without sweeping
          wave speed v_w from row-by-row propagation to simultaneous competence (v_w -> inf),
          without sweeping chemotactic sensitivity chi across chi_c, and without CLI flags
          beyond `--self-test` (L169-177).
        evidence:
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [169, 177], note: "CLI exposes only --self-test without v_w, chi, or perturbation flags", supports: false}
      morphometric-validation:
        value: 46
        rationale: >-
          `measure_morphoeval()` reports only 3 basic scalars (sqrt(3)/2 ratio, chi_c,
          and raw peak count, L136-158) without Voronoi hexagonal fraction P_6,
          bond-orientational order |psi_6|, nearest-neighbor spacing CV, or specimen
          morphometrics.
        evidence:
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [136, 158], note: "Only 3 basic scalars without Voronoi P_6, |psi_6|, or specimen validation", supports: false}
      source-traceability:
        value: 68
        rationale: >-
          Vendors `datasets/avian_feather_bud_hexagonal/` with `avian_feather_bud_hexagonal_reference.json`,
          `chick_feather_bud_hexagonal_specimen.jpg`, `scout_manifest.json`, and `paper_citations.bib`,
          but v1 script does not verify SHA-256 digests at runtime or load the reference JSON.
        evidence:
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [20, 24], note: "Defines specimen path without SHA-256 verification or reference JSON loading", supports: false}
      code-traceability:
        value: 64
        rationale: >-
          Header docstring cites Glimm et al. (2014) and Ho et al. (2019), but lacks explicit
          mappings to the 3 Lean 4 theorems in `Loop_019_avian_feather_bud_hexagonal.lean`
          and the experimental perturbation panels (Fc-chEDA1, Ecto-D2, Latrunculin, scaleless).
        evidence:
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [1, 10], note: "Minimal baseline header without Lean 4 theorem or perturbation figure mappings", supports: false}
      repro-package:
        value: 65
        rationale: >-
          Includes deterministic `np.random.default_rng(2018)` and a 4-assertion `self_test()`
          (L161-167), but does not test SHA-256 locks, Voronoi P_6 advantage of traveling
          wave over simultaneous competence, *scaleless*/Latrunculin ablation, specimen
          segmentation, or bitwise two-run determinism.
        evidence:
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [161, 167], note: "4-assertion baseline self_test() without SHA-256 or bitwise determinism checks", supports: false}
    remediation:
      - "Upgrade the 2D dermal chemotaxis + FGF20/BMP4 + EDA traveling competence wave solver to explicitly resolve row-by-row half-period phase pinning (Delta_y = lambda_y/2, Delta_x = (sqrt(3)/2)*lambda_y) and sweep wave speed v_w from optimal row-by-row propagation (P_6 >= 0.85, |psi_6| >= 0.82) to simultaneous global competence (v_w -> inf, Fc-chEDA1 / exogenous FGF flooding, P_6 approx 0.45-0.55) and Ecto-D2 wave retardation (v_w = 0.5x WT, narrowed tract)."
      - "Implement the *scaleless* (`sc/sc`, FGF20-null, chi = 0.0 < chi_c) mutant and Latrunculin A / Blebbistatin actomyosin motility blockade (chi = 0.01 < chi_c) negative controls, plus a chemotactic sensitivity sweep across chi in [0, 0.32] verifying the critical threshold chi_c."
      - "Implement automated computer-vision segmentation of `datasets/avian_feather_bud_hexagonal/chick_feather_bud_hexagonal_specimen.jpg` (Ho et al. 2019 PLOS Biol. 17:e3000132 Fig. 3): extract all 24 feather primordia in Panel B, construct their Voronoi tessellation and Delaunay neighbor graph (P_6 = 0.750, P_567 = 1.000, |psi_6| = 0.5265, NN spacing CV = 0.1974), and quantify the E6.5+24h -> E6.5+48h feather tract expansion ratio in Panel A."
      - "Add runtime SHA-256 verification of all 4 dataset files, expand `measure_morphoeval()` to 8 quantitative morphometrics with uncertainty statistics and negative-control contrast, expose full CLI flags, and upgrade the comparison figure to an 8-panel publication synthesis."
