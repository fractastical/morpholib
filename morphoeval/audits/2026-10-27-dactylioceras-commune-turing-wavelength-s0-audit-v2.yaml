    summary: >-
      Pass 2 keeps lambda_c = 24.19 µm (2.419e-05 m) at 181 Ma. Numerical
      growth rates of the Schnakenberg PDE match analytical sigma(k) with
      Pearson r = 0.99991 and RMSE = 0.00095. Equal diffusion is stable at
      k_c (sigma = -0.431) while the ratio 7.2 is unstable (sigma = +0.0297).
      Scaling both diffusivities by 0.64, 1, 1.44, and 1.96 moves lambda_c
      through 19.35, 24.19, 29.03, and 33.87 µm. The Whitby photograph
      (57 mm, CC BY 2.0) has 44 outer ribs at 3.484 mm spacing, which holds
      144 waves of 24.19 µm, more than the Ceratites organ-scale interval
      (45.0) and the Placenticeras organ-scale interval (104.6). The growth
      GIF is 12 frames at 640 px and ends on the specimen (CV similarity 96.0).
      D_f = 1.55 remains a catalogue value: the photo shows the ribbed exterior.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 critical wavenumber and Schnakenberg 1979 kinetics."
        - "Meinhardt and Klingler 1987 and Fowler, Meinhardt and Prusinkiewicz 1992: pigment laid down at a molluscan aperture."
        - "García-Ruiz, Checa and Rivas 1990 and Lutz and Boyajian 1995: ammonoid sutures are morphogenetic and fractal."
        - "James St. John, CC BY 2.0: 57 mm Whitby Formation shell, Toarcian."
        - "Catalogue: 181 Ma, 2.419e-05 m, D_f = 1.55, Ceratites 1.088 mm at 240 Ma, Placenticeras 2.53 mm at 75 Ma."
      reconstructed_in_script:
        - "Du = 5.789 and Dv = 41.680 µm² per time so the k_c formula returns 24.19 µm at ratio 7.2."
        - "Eigenvector-seeded PDE growth rates versus analytical sigma(k)."
        - "Outer-whorl rib harmonic 44 and spacing 3.484 mm from the photograph."
        - "Accretion GIF whose last frame is the specimen, plus a 216 µm stripe patch where 24.19 µm is resolved."
      transfer_boundary:
        - "Aperture pigment reaction-diffusion is transferred to a 24 µm periostracal patch of an ammonite. The whole-shell pixels are the fossil, not a PDE solution."
        - "Neighbor organ-scale wavelengths are the intervals tiled by this detail wave. Their diffusion coefficients are not reused."
      does_not_claim:
        - "24 µm stripes are not resolved across the 57 mm photograph."
        - "D_f = 1.55 was not measured on an exposed suture in this image."
        - "The PDE did not generate the pyrite texture."
        - "No nanopublication was signed: ~/.nanopub/profile.yml is absent."
        - "No second language model scored this audit."
    scores:
      model-fidelity:
        value: 92
        rationale: "The script integrates the Schnakenberg PDE from the unstable eigenvector and recovers analytical sigma(k) across the band around k_c (r = 0.99991, RMSE = 0.00095). lambda_c is exactly 2.419e-05 m. The far-stable tail, where the explicit Laplacian's truncation error dominates, is outside the fit window and is disclosed."
        evidence:
          - {file: models/2026-delphi10000-dactylioceras-commune-turing-wavelength-s0.py, lines: [101, 175], note: "k_c formula and eigenvector-seeded numerical growth rate", supports: true}
          - {file: models/2026-delphi10000-dactylioceras-commune-turing-wavelength-s0.py, lines: [177, 198], note: "dispersion_curve Pearson r and RMSE", supports: true}
          - {file: datasets/dactylioceras_commune_turing_wavelength_s0/metrics.json, lines: [18, 54], note: "r = 0.99991, RMSE = 0.00095, lambda_c_um = 24.19", supports: true}
      specimen-match:
        value: 88
        rationale: "The 12-frame 640 px GIF accretes the real Whitby shell out of the stripe field and ends on the photograph. CV similarity of that last frame is 96.0. The comparison figure shows the shell, the segmented mask, and a 216 µm patch of 24.19 µm stripes. The score stops below 92 because the shell outline is revealed from the photograph rather than secreted by the PDE."
        evidence:
