        evidence:
          - {file: models/2026-delphi10000-drosophila-takahashii-turing-wavelength-s0.py, lines: [1, 45], note: "docstring equations and chronoseries contrast", supports: true}
      repro-package:
        value: 84
        rationale: >-
          --self-test checks the Turing inequalities, the 1% wavelength tolerance,
          Pearson r > 0.98, ablation collapse, monotonic λ(Dv), and the four
