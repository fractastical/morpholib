simulations:
  - id: delphi10000-drosophila-takahashii-turing-wavelength-s0
    name: "Drosophila takahashii Schnakenberg Turing wavelength at 2.362 µm (Pass 1 field render)"
    organism: "Drosophila takahashii"
    script: models/2026-delphi10000-drosophila-takahashii-turing-wavelength-s0.py
    output: docs/media/drosophila_takahashii_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, murray1981, maini1997, tanaka2009, kopp2011, atallah2014]
    summary: >-
      Periodic Schnakenberg integration on a 28.344 µm chart (12 × 2.362 µm).
      Analytic peak λ = 2.3615 µm, σ_max = 0.0743. Numerical dominant wavelength
      2.314 µm. Dispersion Pearson r = 0.9905, RMSE = 0.0568, KS = 0.0909 on 22
      wavenumbers. Equal-diffusion ablation std collapses to ~4e-13 against a
      patterned std of 0.0475. Dv sweep wavelengths increase from 2.300 to 2.733 µm
      above onset. Raw Otsu circularity on the gallery plate is 0.0018.
      GIF is 640×480, 12 frames. CV similarity of the field GIF against the plate
      is 80.0. Geological age 0 Ma.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 diffusion-driven instability and a finite critical wavelength"
        - "Schnakenberg 1979 two-species kinetics with a cubic autocatalytic term"
        - "Murray 1981 wavelength set by the diffusion scale"
        - "Tanaka, Barmina and Kopp 2009 and Kopp 2011 on sex-comb diversification"
        - "Atallah et al. 2014 on Drosophila suzukii and its close relatives"
      reconstructed_in_script:
        - "Parameters a=0.162, b=1.247, Du=0.042744, Dv=0.971570 placing λ_c at 2.362 µm"
        - "Explicit Euler on a periodic 12-wavelength chart and the radial-FFT wavelength"
        - "Dispersion Pearson/KS, Dv sweep, and equal-diffusion ablation"
      transfer_boundary:
        - "2.362e-06 m is the campaign detail-scale assignment (log10=-5.627), not a quoted takahashii ocellus measurement"
        - "The suzukii → takahashii → teissieri order is chronoseries index 37/41 at 0 Ma, not an anagenetic fossil series"
      does_not_claim:
        - "That a wet-lab paper reports 2.362 µm for a D. takahashii ocellus"
        - "That D. takahashii carries the D. suzukii apical wing spot"
        - "That the Pass 1 Otsu contour is a usable body outline"
    scores:
      model-fidelity:
        value: 86
        rationale: >-
          The script integrates the Schnakenberg system and the Turing dispersion
          σ(k), and the analytic peak is 2.3615 µm against the 2.362 µm target
          (within 1%). Explicit Euler and periodic boundaries are a reconstruction.
          The 2.362 µm length is the slot scale, not a fitted wet-lab constant.
        evidence:
          - {file: models/2026-delphi10000-drosophila-takahashii-turing-wavelength-s0.py, lines: [105, 149], note: "Jacobian at u0=a+b and dispersion peak λ=2π/k_c", supports: true}
          - {file: models/2026-delphi10000-drosophila-takahashii-turing-wavelength-s0.py, lines: [156, 191], note: "Periodic explicit Euler of the Schnakenberg PDE", supports: true}
      specimen-match:
        value: 62
        rationale: >-
          The comparison figure places the gallery plate beside the activator field.
          The 12-frame 640×480 GIF scores CV similarity 80.0 against that plate, but
          it is a full-frame colormap, and the Otsu overlay is a fragmented grain
          contour (circularity 0.0018), not the fly body.
        evidence:
          - {file: docs/media/drosophila_takahashii_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Pass 1 six-panel plate, field, raw Otsu edge, dispersion, sweep, chronoseries", supports: true}
          - {file: docs/media/drosophila_takahashii_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame field colormap, 640×480", supports: true}
      parameter-expressivity:
        value: 78
        rationale: >-
          Holding Du fixed, analytic λ_c increases with Dv once σ_max > 0
          (2.300, 2.361, 2.463, 2.577, 2.733 µm). Dv=0.55 is stable and is the
          negative end of the same sweep. The transverse-row anisotropy of the
          sex comb is discussed and not yet a separate simulated regime.
        evidence:
          - {file: models/2026-delphi10000-drosophila-takahashii-turing-wavelength-s0.py, lines: [268, 283], note: "diffusion_sweep reports λ only where σ_max > 0", supports: true}
      morphometric-validation:
        value: 74
        rationale: >-
          Pearson r = 0.9905, RMSE = 0.0568, KS = 0.0909 between PDE growth rates
          and analytic σ(k) on 22 wavenumbers in [0.6, 5.5] rad/µm. Measured
          wavelength 2.314 µm versus reference 2.362 µm. Ablation std ~4e-13 versus
          patterned std 0.0475. Body circularity 0.0018 is not a usable outline,
          and field mode recorded simulation coherency as 0.
        evidence:
          - {file: models/2026-delphi10000-drosophila-takahashii-turing-wavelength-s0.py, lines: [221, 266], note: "linear_growth_fit Pearson, RMSE, and KS", supports: true}
          - {file: models/2026-delphi10000-drosophila-takahashii-turing-wavelength-s0.py, lines: [285, 298], note: "equal-diffusion ablation versus patterned amplitude", supports: true}
      source-traceability:
        value: 88
        rationale: >-
          DOIs were checked on OpenAlex. The specimen SHA-256 is pinned in the
          reference JSON. Commons returned only D. pseudotakahashii, which was
          rejected; the gallery plate is the documented fallback. Age 0 Ma and
          scale 2.362e-06 m are stated in the README and the reference file.
        evidence:
          - {file: datasets/drosophila_takahashii_turing_wavelength_s0/paper_citations.bib, lines: [1, 20], note: "Turing 1952 and Schnakenberg 1979 entries", supports: true}
          - {file: datasets/drosophila_takahashii_turing_wavelength_s0/drosophila_takahashii_turing_wavelength_s0_reference.json, lines: [1, 40], note: "scale 2.362e-06 m, age 0 Ma, specimen SHA-256", supports: true}
      code-traceability:
