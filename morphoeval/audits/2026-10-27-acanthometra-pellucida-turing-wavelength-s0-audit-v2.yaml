simulations:
  - id: delphi10000-acanthometra-pellucida-turing-wavelength-s0
    name: "Acanthometra pellucida Schnakenberg wavelength at 206 nm (Holocene, 0 Ma), pass 2"
    organism: "Acanthometra pellucida"
    script: models/2026-delphi10000-acanthometra-pellucida-turing-wavelength-s0.py
    output: docs/media/acanthometra_pellucida_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/acanthometra_pellucida_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-acanthometra-pellucida-turing-wavelength-s0-audit
    source_refs: [turing1952, gierer1972, murray1981, kondo2010, decelle2012, haeckel1904]
    model_spec:
      model: "Schnakenberg k_c with length unit fixed at 206 nm; held-out scale; two ablations"
      a: 0.14
      b: 0.76
      gamma_ref: 10.0
      d_ratio: 18.0
      grid_resolution: [96, 96]
      seed: 3101
      inputs:
        - datasets/acanthometra_pellucida_turing_wavelength_s0/acanthometra_pellucida_specimen.jpg
        - datasets/acanthometra_pellucida_turing_wavelength_s0/acanthometra_pellucida_turing_wavelength_s0_reference.json
    claim_boundary:
      reported_in_source:
        - "Turing (1952), Gierer and Meinhardt (1972), and Murray (1981) supply the reaction-diffusion wavelength law."
        - "Haeckel (1904) Tafel 21 figure 2 is the vendored drawing. Decelle et al. (2012) is living-acantharian biology, not a 206 nm measurement."
      reconstructed_in_script:
        - "In-sample Pearson r = 0.9991 (RMSE 43.30 nm) and a held-out scale of 1.1875 fit on gamma 4, 7, 10 and scored on 14, 19, 26 (r = 0.9991, p = 0.027, n = 3, RMSE 6.09 nm)."
        - "Equal-diffusion ratio 0.0004 and autocatalysis-knockout ratio about 0. Spine axes and foreground, coherency, and circularity are measured on the plate and on the last frame, and they are not equal."
      transfer_boundary:
        - "206 nm and 0 Ma are the assigned detail scale and the Holocene terminal of a one-point chronoseries. The plate does not resolve 206 nm."
      does_not_claim:
        - "That the held-out test, with n = 3 and p = 0.027, is a high-powered confirmation."
        - "That the radial gray profile of the carrier matches the plate (r = 0.096)."
        - "A species-level photograph of A. pellucida, or a fossil chronospecies."
    summary: >-
      Pass 2 closes the three pass-1 remediations. Held-out wavelength RMSE is 6.09 nm
      against an in-sample RMSE of 43.30 nm; Pearson r stays 0.9991. Both ablations
      collapse the field. The carrier is visible on the capsule and cv_sim_similarity
      is 92.8 (12 frames, 680 px). Radial-profile r fell from 0.548 to 0.096 because
      the disk is now the spot field rather than a flat fill under crossing spines.
      Weighted score 85.6. Open items remain a species-level photo, the radial-profile
      miss, n = 3 on the held-out split, and a second assessor.
    scores:
      model-fidelity:
        value: 88
        rationale: >-
          Pass 1's Schnakenberg system and k_c formula are unchanged. Pass 2 adds a
          linear-decay knockout that removes u^2 v without integrating the inhibitor
          to infinity, and a one-parameter scale estimated off the test gammas.
          The 206 nm figure is still the length unit. No measured SrSO4 diffusivity
          enters the kinetics.
        evidence:
          - {file: models/2026-delphi10000-acanthometra-pellucida-turing-wavelength-s0.py, lines: [135, 193], note: "simulate() accepts kinetics schnakenberg or linear_decay", supports: true}
          - {file: models/2026-delphi10000-acanthometra-pellucida-turing-wavelength-s0.py, lines: [226, 247], note: "Held-out scale fit on the first three gammas", supports: true}
          - {file: morphoeval/lean/loops/Loop_3101_acanthometra_pellucida_turing_wavelength_s0.lean, lines: [21, 27], note: "Ablation and Dv-monotonicity theorems", supports: true}
      specimen-match:
        value: 80
        rationale: >-
          The last frame is still a simplified radial acantharian on a cream ground:
          golden capsule, gray spines along measured axes, small barbs. The Turing
          spots are now the capsule texture, which is what this scale is about, and
          they are not the plate's central star. cv_sim_similarity = 92.8. A side-by-side
          look does not support a higher score than 80. The image is Haeckel's genus
          plate, not a photograph labeled A. pellucida.
        evidence:
          - {file: models/2026-delphi10000-acanthometra-pellucida-turing-wavelength-s0.py, lines: [353, 405], note: "Spines start at the capsule margin; barbs on the strong axes; carrier left visible", supports: true}
          - {file: docs/media/acanthometra_pellucida_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 960x680, frame-to-frame mean absolute difference 0.084", supports: true}
          - {file: docs/media/acanthometra_pellucida_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Plate, last frame, gamma sweep, and both ablations", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          Wavelength falls as gamma rises, for both the formula and the FFT peak.
          d = 1 and the autocatalysis knockout each drive std(u) to about 0 while
          d = 18 reaches std 0.17. The held-out scale is one number, fit on three
          gammas and applied to three others, and it moves RMSE from 43.30 nm to 6.09 nm.
        evidence:
          - {file: models/2026-delphi10000-acanthometra-pellucida-turing-wavelength-s0.py, lines: [195, 258], note: "Sweep, held-out scale, equal diffusion, and knockout", supports: true}
          - {file: docs/media/acanthometra_pellucida_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Sweep curves and the three-bar ablation panel", supports: true}
      morphometric-validation:
        value: 84
        rationale: >-
          In-sample r = 0.9991, RMSE = 43.30 nm, residual CV = 0.101. Held-out r = 0.9991,
          p = 0.027, n = 3, RMSE = 6.09 nm. The p-value is weak because n = 3; the RMSE
          drop is the result that matters. Specimen foreground 0.501 versus simulation
          0.352, coherency 0.601 versus 0.843, circularity 0.012 versus 0.014, spine
          peaks 8 versus Müller's 20, orientation KS = 0.113. Radial-profile r = 0.096,
          down from 0.548 in pass 1. That miss is why this score is not higher.
        evidence:
          - {file: models/2026-delphi10000-acanthometra-pellucida-turing-wavelength-s0.py, lines: [627, 757], note: "measure_morphoeval, including held-out r, KS, and specimen rows whose values differ from their references", supports: true}
          - {file: models/2026-delphi10000-acanthometra-pellucida-turing-wavelength-s0.py, lines: [407, 429], note: "Radial profile and Sobel-orientation samples used for Pearson r and KS", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Unchanged sources, now with the specimen file in the tree at the checkpoint
          (SHA-256 pinned in the reference JSON). OpenAlex confirmed the five DOIs.
          scout_literature.py --slot 3101 cannot run; the campaign file only lists
          slots 1-100. The scout manifest records the direct queries.
        evidence:
          - {file: datasets/acanthometra_pellucida_turing_wavelength_s0/acanthometra_pellucida_turing_wavelength_s0_reference.json, lines: [1, 30], note: "scale_nm 206, age_ma 0, chronoseries 1/1", supports: true}
          - {file: datasets/acanthometra_pellucida_turing_wavelength_s0/paper_citations.bib, lines: [1, 55], note: "Real DOIs and the Wikimedia URL", supports: true}
      code-traceability:
        value: 86
        rationale: >-
          Held-out fit, knockout, segmentation, and the wavelength FFT are separate
          functions with the formula named in the docstring. Lean proves the integer
          trace, not the grid solver. No lean binary was available to check the file.
        evidence:
          - {file: morphoeval/math_kg_loops/delphi10000-acanthometra-pellucida-turing-wavelength-s0.yaml, lines: [14, 55], note: "Four laws with Lean loci and code loci", supports: true}
          - {file: models/2026-delphi10000-acanthometra-pellucida-turing-wavelength-s0.py, lines: [266, 326], note: "Plate segmentation: yellow capsule, angular dark-edge energy, peak axes", supports: true}
      repro-package:
        value: 88
        rationale: >-
          --self-test now also requires the knockout to collapse and the held-out
          Pearson r to exceed 0.98. It passed. Seed 3101, grid 96, domain 48.
          Single assessor. Signing keys are not on this machine.
        evidence:
          - {file: models/2026-delphi10000-acanthometra-pellucida-turing-wavelength-s0.py, lines: [759, 810], note: "self_test, including knockout and held-out gates", supports: true}
          - {file: datasets/acanthometra_pellucida_turing_wavelength_s0/README.md, lines: [40, 63], note: "Invocation and the scale table", supports: true}
    remediation:
      - "Open. A photograph identified as Acanthometra pellucida, rather than Haeckel's genus plate."
      - "Open. Radial gray-profile r is 0.096. The carrier does not reproduce the plate's central star, and it should not be forced to by copying the profile."
      - "Open. Held-out n = 3 gives p = 0.027. A finer gamma grid would make that split informative."
      - "Open. Second assessor from another provider. Lean was not executed (no lean binary)."
