provenance:
  boehm-limb-bud-elongation-pushing:
    spec_fingerprint: 4c3f0cfc301e2c955c4f4f6c7d2e02e3996ca3b4cd571d212368d55baab36b29
    artifact_sha256: 1b3c6fa5a82c58c70da6b24403feecd75e9d294266957115c8a2488fa8b0e60c
    input_dataset_sha256: {}
    claim_boundary:
      reported_in_source:
      - 'Boehm et al. (2010): OPT-measured mouse limb bud growth E11.0 (St0, L_PD 1020 um) -> E11.25 (St1, L_PD
        1450 um, +42.2 % PD, +12 % AP, +1 % DV; volume 0.551 -> 0.914 mm^3); dual-label IddU/BrdU cell-cycle atlas
        (T_c 11-25 h); a 3D Navier-Stokes growth model on a tetrahedral FEM mesh of the OPT iso-surface in which
        the measured proliferation (Model I) yields only 3.4-11.8 % PD elongation while inverse optimisation demands
        s_opt > 8 s_emp with negative DV growth; anisotropic/directional growth (Model II) therefore required'
      - 'Gros et al. (2010): Wnt5a/JNK-controlled oriented cell division and FGF8/MAPK-controlled directional motility
        drive PD elongation; Wnt5a-/- and FGF-inhibited buds are shorter and more bulbous (E11.5 aspect ratios 2.1
        WT, ~1.3 Wnt5a-/-)'
      - 'Dillon & Othmer (1999): viscous incompressible continuum with distributed sources as the mechanical model
        of limb-bud outgrowth; Reynolds number irrelevant in the creeping-flow limit'
      reconstructed_in_script:
      - 'Pass 3 Section 5: visual-hull reconstruction of the St0/St1 3D surfaces from the vendored specimen''s two
        orthogonal iso-surface silhouettes; conforming prism-split P1 tetrahedral mesh; P1-P1 Brezzi-Pitkaranta-stabilised
        3D Stokes growth solver with IddU/BrdU source, extensile oriented-division stress, AER-FGF8 body force,
        traction-free ectoderm and flank Dirichlet/ALE inflow plane; two closed-form oracles to 8.2e-14; Lagrangian
        RK2 growth with volume budget closed to 0.5 %; 2-gain calibration (k_chi, k_zeta) with Wnt5a-/-, Model I
        and uniform control out of sample; flank-influx sweep; mesh-convergence; silhouette IoU against the specimen
        St1 hull'
      - 'Pass 2 Sections 2-3 (retained, now labelled): analytic strain-rate laws, IddU/BrdU vs Hooke-Jeeves inverse-opt
        profiles, a 2D Poisson pressure field used for visualisation, and a 2D boundary-advection model whose per-axis
        coefficients were calibrated to the 5-regime table; Pass 2 specimen segmentation of 5 sub-panels'
      transfer_boundary:
      - The 3D geometry is a visual hull of two projections (elliptical cross-sections), not the OPT voxel iso-surface,
        and the mesh is structured, not unstructured Delaunay; the specimen's own St1/St0 PD ratio (1.364) and DV
        thickness (926 um) disagree with the reference table (1.422; 580 um)
      - The 5-regime FEM Pearson r = 0.9944 counts 2 calibrated regimes; the fully out-of-sample set is Model I
        (+5.2 % vs 10.1 %), Wnt5a-/- (+12.0 % vs 18.5 %) and the uniform control, RMSE 5.3 pp
      - The Stokes FEM is Reynolds-number independent by construction; the 5-decade Re sweep remains in the 2D reduced
        model where Re enters only through a phenomenological `re_factor`
      - Panels C-J of the main figure and 8 of the 20 measurements still come from the calibrated 2D reduced model
      does_not_claim:
      - 'Reproduction of the paper''s inverse-optimisation (Hooke-Jeeves) in 3D, chick-embryo (Gros) geometry, cell-level
        oriented-division statistics, a Navier-Stokes (inertial) solver, or that the active-stress Model II as implemented
        reproduces the AP/DV changes of the specimen (it does not: AP -10.9 %, DV -14.5 %)'
