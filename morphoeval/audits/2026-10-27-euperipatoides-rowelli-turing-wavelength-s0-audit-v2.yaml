      controls separate: full mode +8571, equal diffusion −5662, reversed
      ratio −22114. Specimen-versus-last-frame 12-bin orientation L1 is 0.0134,
      not zero. GIF unchanged at 12 frames and 640×480; CV similarity 96.0.
