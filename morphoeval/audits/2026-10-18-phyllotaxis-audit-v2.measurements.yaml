      reconstructed_in_script:
      - Planar Vogel spiral generator, Delaunay/Voronoi rising Fibonacci parastichy cascade (8,13)->(13,21)->(21,34)->(34,55),
        bounded Voronoi area CV & circularity optimality, Douady-Couder Hofmeister relaxation, DoG floret segmentation
        on helianthus_annuus_capitulum_specimen.jpg, and rim-dislocation ensemble reproducing Fib-1 > Fib+1
      transfer_boundary:
      - Outer-rim Delaunay contact-chain loss on noisy capitula used to model the empirical excess of Fibonacci-1
        over Fibonacci+1 counts in Swinton et al. (2016)
      does_not_claim:
      - Full 3D auxin PIN1 transport PDE simulation on a curved dome (uses Vogel's kinematic spiral and Douady &
