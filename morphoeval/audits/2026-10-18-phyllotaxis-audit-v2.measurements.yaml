      reported_in_source:
      - Vogel (1979) defines planar capitulum spiral placement r_n = c*sqrt(n), theta_n = n*alpha_0 with golden
        divergence angle alpha_0 = 360/tau^2 = 137.507764 deg
      - Douady & Couder (1992, 1996) demonstrate self-organized convergence of repulsive Hofmeister primordia on
        a radially advecting meristem ring to the golden and Lucas noble angles
      - Swinton, Ochu & MSI Turing's Sunflower Consortium (2016) report 768 photoreviewed parastichy counts across
