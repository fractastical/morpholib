    source_refs: [turing1952, mcgregor2007, sucena2000, jeong2008, chenoweth2005, shoup1966]
    phenomenon_size_m: 1.548e-06
    scale_tier: 3_subcellular_um
    geological_age_ma: 0.0
    geological_period: Holocene (Extant)
    summary: >-
      Pass 2 keeps the Turing 1952 law at λ_c = 1.500 µm, age 0 Ma. The critical-shell
      power-weighted wavelength is 1.5004 µm (0.03% from 1.500). The brightest oblique
      Fourier bin remains 1.480 µm and is reported separately. Panel D now shows the
      unstable lobe (σ_max ≈ +0.004) for santomea, serrata, and sechellia. Panel F places
      the equal-diffusion note (σ_max = −0.176) above the bars. Sweep Pearson r = 0.9996.
      Predecessor λ_c = 1.921 µm (D. santomea); successor λ_c = 1.680 µm (D. serrata).
    claim_boundary:
      reported_in_source:
        - "Turing 1952: k_c from the dispersion relation, and instability only when diffusivities differ."
        - "McGregor 2007 and Sucena & Stern 2000: D. sechellia larval trichome loss is cis-regulatory at shavenbaby."
        - "Jeong 2008: D. santomea lost abdominal pigment via a tan enhancer."
        - "Chenoweth & Blows 2005: D. serrata signal traits are under mutual sexual selection."
      reconstructed_in_script:
        - "Near-onset Jacobians with analytical wavelengths 1.921, 1.680 and 1.500 µm."
        - "Critical-shell wavelength distinct from the brightest Fourier bin; zoomed dispersion lobe; ablation annotation clear of the tick labels."
      transfer_boundary:
        - "The CC-BY image is a nucleic-acid stain of an ovary, not an ocellar pigment-granule micrograph."
        - "Shoup 1966 is D. melanogaster ultrastructure, used only as a scale class."
      does_not_claim:
        - "That 1.5 µm was measured as a granule spacing in D. sechellia."
        - "That Morinda octanoic-acid resistance sets k_c."
        - "The 88 µm cellular wavelength already modelled in slot 2711."
        - "That a second assessor scored this pass."
    scores:
      model-fidelity:
        value: 90
        rationale: "Same Turing PDE, k_c formula, periodic boundaries, cubic saturation, and equal-diffusion ablation as Pass 1. Pass 2 adds the critical-shell estimator without changing the Jacobian. g_u is still co-adapted to hold h_min, not copied from a measured rate."
        evidence:
          - {file: models/2026-delphi10000-drosophila-sechellia-turing-wavelength-s0.py, lines: [97, 129], note: "critical_wavenumber and species_jacobian", supports: true}
          - {file: models/2026-delphi10000-drosophila-sechellia-turing-wavelength-s0.py, lines: [205, 235], note: "dominant_wavelength splits the brightest bin from the critical shell", supports: true}
          - {file: morphoeval/lean/loops/Loop_3202_drosophila_sechellia_turing_wavelength_s0.lean, lines: [20, 34], note: "wavelength order, trace < 0, det > 0, no sorry", supports: true}
      specimen-match:
        value: 86
        rationale: "Panel A is the CC-BY D. sechellia ovary micrograph; panel C modulates it by the field; the 12-frame 720×540 GIF keeps a moving activator and a last frame whose computer-vision similarity to that micrograph is high. Panel F no longer covers the species names. The micrograph is still an ovary, not the ocellar lattice, so the score stays short of a matched ultrastructure."
        evidence:
          - {file: docs/media/drosophila_sechellia_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Pass 2 figure: lobe visible, species labels clear", supports: true}
          - {file: docs/media/drosophila_sechellia_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 720×540", supports: true}
          - {file: models/2026-delphi10000-drosophila-sechellia-turing-wavelength-s0.py, lines: [718, 730], note: "ablation note centred above the bars", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "f_u still shortens λ monotonically (r = 0.9996) with g_u co-adapted to fixed onset depth. Panel D now shows three distinct positive lobes, with sechellia peaking nearest the dashed k_c line and santomea peaking at lower k."
        evidence:
          - {file: models/2026-delphi10000-drosophila-sechellia-turing-wavelength-s0.py, lines: [267, 302], note: "parameter_sweep", supports: true}
          - {file: models/2026-delphi10000-drosophila-sechellia-turing-wavelength-s0.py, lines: [681, 697], note: "σ(k) drawn on k in [2.8, 5.8] and σ in [−0.02, 0.008]", supports: true}
      morphometric-validation:
