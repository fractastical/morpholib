        rationale: "Critical-shell wavelength is 1.5004 µm against analytical 1.500 µm (relative error 0.03%). The brightest bin, 1.480 µm, is kept as its own measurement so the oblique mode is not hidden. Pearson r = 0.9996, calibrated RMSE = 0.0040 µm, four-seed shell CV = 0.0037, KS = 0.229. Specimen Otsu fraction 0.352, aspect 1.331, and coherency 0.612 differ from their priors."
        evidence:
          - {file: models/2026-delphi10000-drosophila-sechellia-turing-wavelength-s0.py, lines: [441, 500], note: "brightest-bin and critical-shell measurements, plus sweep r and RMSE", supports: true}
