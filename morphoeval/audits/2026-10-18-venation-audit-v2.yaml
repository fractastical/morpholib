        evidence:
          - {file: 2005-runions-leaf-venation.py, lines: [965, 987], note: "run_self_test() end-to-end verification"}
          - {file: docs/media/runions_leaf_venation_growth.gif, lines: [0, 0], note: "Animated venation growth GIF"}
    overall:
      value: 91.3
      formula: "weighted mean over rubric 0.1.0 dimensions (0.20*92 + 0.25*89 + 0.10*88 + 0.15*91 + 0.10*95 + 0.08*94 + 0.12*93)"
    recommendations:
