# MorphoEval audit — Runions et al. (2005) / Murray (1926) / Price et al. (2013) Leaf Venation Morphogenesis, 2026-10-18 (v2)
#
# Remediated v2 assessment of `2005-runions-leaf-venation.py`, `datasets/venation/`,
# and `morphoeval/lean/MathOfBiology.lean` (Section 13), superseding
# `2026-10-18-venation-audit` after resolving all 5 findings raised by the
# independent second assessor (Claude Sonnet 5.5 High, subagent
# a0af2a18-23ff-4cc5-8947-cf29f69735b3):
#   1. Segmented both vendored specimen photographs (`reticulate_vein_skeleton_specimen.jpg`
#      and `ginkgo_open_venation_specimen.jpg`) in `segment_empirical_specimens()`:
#      extracting 168 enclosed planar areole faces, vein distance-transform radii, and
#      Katifori loop nesting `i_u = 0.6134` from the cleared leaf skeleton specimen, plus
#      1,651,010 lamina pixels and parallel dichotomous vein ridge density (`0.4383`) from
#      the Ginkgo biloba specimen (both displayed in Panel C).
#   2. Replaced shortcut proximity fusion in `simulate_venation(mode="closed_reticulate")`
#      with Runions et al. (2005) Sec. 4 persistent `V(s)` source tagging, genealogical
#      hop exclusion (`tree_hop_distance >= 4`, eliminating local 3-cycle triangles), and
#      exact planar segment-intersection rejection (`segments_properly_intersect`, 0
#      crossing edges, 409 planar loops, 358 rasterized enclosed areoles), parameterized
#      directly from `load_table1_regime()` in `venation_reference.json`.
#   3. Replaced the synthetic 8x8 lattice in `compute_katifori_loop_nesting` with real
#      planar dual areole extraction (`compute_planar_areole_nesting_from_raster`) on both
#      the simulated closed venation network (`358` areoles, `i_u = 0.4462`) and the
#      segmented cleared leaf skeleton specimen (`168` areoles, `i_u = 0.6134`).
#   4. Replaced circular JSON sampling with `build_and_measure_multiscale_strahler_tree()`,
#      growing an explicit 2,175-node hierarchical vascular tree across Strahler orders
#      1–8 and running `analyze_junction_scaling()` across its binary bifurcations (`r =
#      0.9679`, MAE = `0.0208` against Price et al. 2013).
#   5. Strengthened Lean 4 Section 13 (`morphoeval/lean/MathOfBiology.lean`) with
#      parameterized `ObeysMurrayLaw γ` tree conservation (`murray_1926_tree_conservation`),
#      strict lune equivalence (`runions_2005_rng_lune_iff`), and edge-deletion areole
#      merging (`katifori_2012_edge_deletion_merges_areoles`), machine-checked by Lean 4
#      with 0 `sorry`s and 0 warnings.

