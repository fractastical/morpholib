      reported_in_source:
      - 'Turing 1952: diffusion-driven instability and a critical wavenumber.'
      - 'Schnakenberg 1979: du/dt = a - u + u^2 v, dv/dt = b - u^2 v.'
      - 'Alexander & Fahrenbach 1969: xanthophore, iridophore and basal melanophore layers in A. carolinensis; melanin
        in the processes turns the skin from green toward brown.'
      - 'Taylor & Hadley 1970: physiological melanosome migration, not a new wavelength, is the colour-change mechanism
        inside one melanophore.'
      reconstructed_in_script:
      - D_u and D_v are chosen so k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v) equals (2π/101.1 µm)^2.
      - Eight wavelengths on an 808.8 µm patch; a 40 µm cellular predecessor holds zero critical modes.
      - The nonlinear FFT peak sits at 0.971 of the onset wavelength on every swept target. That factor is the reported
        residual.
      transfer_boundary:
      - Fofonjka & Milinkovitch 2021 (Timon scale borders quantising RD into a cellular automaton) is the organ-scale
        successor, not this intra-scale 101.1 µm patch.
      does_not_claim:
      - That Alexander & Fahrenbach measured 101.1 µm as a Turing wavelength.
      - That the rendered spot field is a photograph of the animal. CV similarity 88.9 is a texture score, not an
        identity claim.
      - A fossil chronospecies. The series is Holocene only (1/1, 0 Ma).
