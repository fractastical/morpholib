    remediation:
    - >-
      2001-bressloff-v1-form-constants.py:855 — `exact_orientation_modes` computes the dominant harmonic via `dom =
      int(abs(_HARM_M[int(np.argmax(np.abs(v)))]))` on complex exponential coefficients `e^{2im*phi}` instead of
      combining conjugate pairs into the real harmonic L2 norm `sqrt(|v_+m|^2 + |v_-m|^2) = sqrt(2)*|v_m|` for `m >=
      1`; this biases the m=0 vs m=1 classification by sqrt(2), misclassifies modes with up to 66.7% m=1 power (e.g.
      A_loc=0.24-0.25) as `harmonic=0`, shifts the reported full-operator harmonic flip to `A_loc=0.275`
      (`bressloff_v1_metrics.csv:47`), and leaves `exact_curves['even_1']` as `NaN` at 118/128 wavenumbers at
      `A_loc=0.24`.
    - >-
      2001-bressloff-v1-form-constants.py:926-937 — `resolvent_apply` projects out the critical eigenspace only when
      `abs(lam_c - vals[i]) < 1.0e-6 * max(abs(lam_c), 1e-12)`, which removes the `|k_1 - k_2| = q*` triad resonance
      at `theta = 60 deg` (`Q(60 deg) = 0.3170`) but leaves an unprojected near-resonant pole on the critical branch
      at adjacent grid angles `theta = 55 deg` (`Q = 0.6991`) and `theta = 65 deg` (`Q = 0.8307`), creating artificial
      spikes in Panel B for `sigma0 != 0.5` and shifting `rhombic_theta_optimal_deg` from `45 deg` to `55 deg` at
      `sigma0 = 0.4` (`2001-bressloff-v1-form-constants.py:3598-3601`).
    - >-
      2001-bressloff-v1-form-constants.py:2686 — In the `cubic_coefficients_full` CSV writer, `'bare gamma3/N @ same'`
      is computed as `3.0 * bs['s3'] * v / bs['gamma0']`, omitting the `1 / N` (`N = <u_0^2>`) factor present in
      `bs['gamma0']` (`line 992`); for all `m=1` gallery presets (`N ~ 0.5`), the exported bare ratios in
      `bressloff_v1_metrics.csv:38-40` (`0.500, 0.416, 0.248...`) are halved relative to `gamma(theta)/gamma(0)`
      (`1.000, 0.832, 0.496...`) at `sigma0 = 0.5`.
    - >-
      2001-bressloff-v1-form-constants.py:2480-2496 — `sweep_summary` (and the `parameter_sweep` CSV rows at `lines
      2807-2828` plus `kluver_form_constant` CSV rows at `line 2643`) aggregates `q_star_min`, `q_star_max`, and
      `parity_flips` from the perturbative `n=1` fields (`critical_q`, `critical_branch`) rather than
      `critical_q_exact` / `q_mode` and `critical_parity_exact`, causing `bressloff_v1_metrics.csv:55` to report two
      false parity flips at `A_loc = 0.225, 0.25` and a false `q*_min = 0.729134` from the `O(beta^2)` zero-
      denominator singularity at `W_1^loc = W_0^loc`, and logging `critical_q = 1.491139` instead of `1.403797` for
      the `m=0` gallery presets (`bressloff_v1_metrics.csv:31-32,56`).
    - >-
      2001-bressloff-v1-form-constants.py:2933-2952 — Panel A defines `stab_gal = rendered_gallery[0]['stability']`
      (which is `roll_noncontoured_derived` at `A_loc = 0.15`, where `n=1` perturbation theory is invalid because
      `W_1^loc < W_0^loc`) and plots `stab_gal['even_growth']` (`q* = 1.49`) under the label `'Gallery presets even
      (theta_0=60 deg, xi_hat_lat=1.5, q*=1.49)'`, misrepresenting the contoured `A_loc = 1.0` gallery presets in
      Columns III-V (`q* = 1.45`).
    - >-
      2001-bressloff-v1-form-constants.py:3361-3390 — `make_gif` passes `envelope_only=True` (`line 3362`) and
      hardcodes `'non-contoured'` in `fig.suptitle` (`line 3389`) for all five gallery presets, stripping the
      contoured `argmax_phi` envelope and orientation line elements from Columns 3-5 (`fig31_square_even`,
      `fig35_hex_zero_even`, `fig33_rhombic_even`) and mislabeling them as non-contoured in
      `docs/media/bressloff_v1_form_constants.gif`.
    - >-
      README.md:435-458 — The top-level `README.md` section `### [2001-bressloff-v1-form-constants.py]` is stale from
      Pass 3: it states that tunnel and spiral are badged `IMPOSED: unstable`, that the cubic coefficients are bare
      overlaps without `sigma0` weights or quadratic feedback, that no swept parameter changes the selected family,
      that the default pullback has a 7-10x left-meridian seam, and that `--self-test` runs 27 checks in ~12 s,
      contradicting the Pass 4 code and outputs.
