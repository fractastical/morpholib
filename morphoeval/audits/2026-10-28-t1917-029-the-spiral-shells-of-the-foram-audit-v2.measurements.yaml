    claim_boundary:
      reported_in_source:
      - 'Thompson (1917) pp. 591-598: chambers/whorls in continued proportion lie on a logarithmic spiral; von Moller''s
        Fusulina whorls in ratio ~1.5 (half-whorl 1.225, alpha ~86 deg); van Iterson''s Triloculina 1.323; Rhumbler''s
        Pulvinulina ~1.187 with a ''small secondary fluctuation''; constant volume ratio from growth proportional
        to existing mass.'
      - 'Thompson (1917) pp. 601-605: shells differ in constant angle (rate of growth) and in chamber form/overlap;
        rotaline, Miliolid, Nodosarian, Textularian, Orbitolitid forms are all logarithmic-spiral cases that pass
        into one another by continuous gradations.'
      reconstructed_in_script:
      - Discrete similar-chamber generative model (centres r0 rho^k at angle k d, radii a0 rho^k, screw translation
        T) with a0 = (W-1)/2 and d = 22.5 deg chosen to mimic Fig. 309; chamber overlap and a0 are not source parameters.
      - Per-specimen log-linear fits of test DIAMETER vs half-whorl stage (PCA frame from the mid-ontogeny outline;
        longest segment across the 14 two-magnification breaks); BIC vs arithmetic growth; CV and early/mid/late-third
        drift with Kruskal-Wallis; bootstrap CIs; KS of residuals; Monte-Carlo (normal-null) gap test; thresholds
        r >= 0.98, 80 %, CV <= 0.15, drift <= 10 %, +/-0.05, p >= 0.05.
      - 'CV whorl-wall radii: proloculus pins from the reference JSON (refined +/-6 px for the photograph), sector-median
        radial profiles, prominence/intensity thresholds 0.06/0.33 (dark walls) and 0.12/0.55 (bright engraving
        walls); the wall count and the exclusion of the proloculus wall (r < 90 px in Fig. 309) are analyst choices.'
      transfer_boundary:
      - Dryad outlines are whorl-level axial sections of Late Paleozoic fusulinids in pixels; septal-chamber-level
        claims (Miliolidae, rotaline forms) are tested only through Thompson's printed tables and the generative
        model.
      - n = 1 photograph (640 x 480 px, ~6 whorls per side) and n = 1 engraving (oblique, shaded) for the CV estimates;
        their W values carry +/-0.10 and +/-0.18 spreads and are consistency checks, not population estimates.
      does_not_claim:
      - Does not claim that the growth ratio is physiologically caused by mass-proportional growth (E4 is proved
        algebraically, not tested).
      - Does not claim the verdict generalises beyond fusulinids plus one Nummulina engraving; the MIXED verdict
        is driven by the pseudoschwagerine inflation phase, which Shi (2021) describes as a heterochronic novelty.
      - 'Does not claim the KS rejection (p = 7e-4) refutes the law: with 1364 residuals the test detects the S-shaped
        pseudoschwagerine trajectories and digitisation outliers, i.e. the same deviation that fails T2.'
