    artifact_sha256: 39a638e50c464718f55cb5a04c00c6dbe57169032a3a3896d1e76a6400bec3d4
    input_dataset_sha256:
      datasets/lung_stereotyped_branching_modes/lung_stereotyped_branching_modes_reference.json: 860ab1e53046d2e758a05cfd3ade385f0315847ce14def820e4cb84d12cedeec
      datasets/lung_stereotyped_branching_modes/bronchial_tree_specimen.jpg: 3247bc8c35eddcad2681234c00203eb26a9bc95c49d5c441084d93c57033ca69
    claim_boundary:
      reported_in_source:
      - 'Metzger et al. (2008): the E11-E15 mouse bronchial tree is built from three stereotyped subroutines — Domain
        Branching, Planar Bifurcation (confined to lobe edges/margins) and Orthogonal Bifurcation (lobe interiors)
        — composed in a genetically encoded sequence'
      - 'Menshykau et al. (2012, 2014): an FGF10 / SHH-Ptch1 receptor-ligand Turing system on a growing epithelial
        domain selects between apical (bifurcation) and lateral (domain) budding, and mesenchymal geometry biases
        the direction of outgrowth'
      - 'Mund, Stampanoni & Schittny (2008): mouse alveolarisation proceeds in a bulk phase P4-P21 and a continued
        phase P14-P36; Knust et al. (2009): the adult C57BL/6 mouse lung holds ~2.3e6 alveoli'
      reconstructed_in_script:
      - 3D Bishop-frame D/P/O grammar with the 4m + 1 tip law and a 181-point dihedral sweep; the Menshykau dispersion
        relation and a 1D spectral PDE mode switch; a quasi-2D diffuse-domain FGF10 cavity bounded by a dilating
        lens-shaped pleura with the tip as Ptch1 sink, whose supply anisotropy chooses P (0 deg) vs O (90 deg) at
        each bifurcation; an exact-increment Yule septation ensemble seeded by the grammar's extrapolated E16.5
        terminal-unit count; chromatic segmentation and skeletonisation of a bronchial-tree image
      transfer_boundary:
      - The pleura model is a transverse cross-section (z-invariant) with a prescribed, tree-independent dilation;
        tips choose P/O from the field but are not advected by grad F, and the pleura does not deform in response
        to the tree — the v2 item asked for a 3D moving-boundary phase-field/BEM, which this is not
      - lambda_bulk is fitted to the adult alveolar count, so the P36 total is a calibration, not a prediction;
        the 632 terminal units at E16.5 are a log-linear extrapolation of the vendored E11-E14.5 timecourse table;
        lambda_cont / lambda_bulk = 0.12 and birth at E19.5 are assumptions
      - The 'specimen' is a Wikimedia medical illustration of human bronchioles/alveoli, not a mouse E11-E15 lung;
        its junction angles are compared with the model's reference angles but cannot validate the mouse grammar
      does_not_claim:
      - A 3D moving-boundary mesenchyme, tip chemotaxis, per-age alveolar counts from Mund (2008), digitised Metzger
        (2008) lineage coordinates, or an independent prediction of the adult alveolar number
