          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [1172, 1190], note: "Panels G-H: specimen ROIs and Voronoi overlay juxtaposed with model WT P_6", supports: true}
          - {file: docs/media/avian_feather_bud_hexagonal_comparison.png, lines: [0, 0], note: "12-panel figure with specimen (G), specimen Voronoi (H), flat and curved model lattices, kymograph, sweeps and EDA density-threshold bars", supports: true}
