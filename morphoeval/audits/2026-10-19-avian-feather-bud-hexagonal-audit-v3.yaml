          interior), P_567 = 1.0, |psi_6| = 0.5265, NN spacing 40.33 +- 7.96 px (CV 0.1974),
          and the Panel A +24h -> +48h tract expansion 38 / 18 = 2.11x. The comparison figure
          (Panels G-H, L1172-1190) now sets the specimen against the correct Ho 2019 anchors
          (P_6 ~0.75 control vs ~0.50 Latrunculin-paused) instead of the invented v2 value
          0.9167. Held at 92: the curved trunk + limb-bud surface is a schematic Monge patch,
