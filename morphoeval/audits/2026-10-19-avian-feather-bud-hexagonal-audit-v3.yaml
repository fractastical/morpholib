# MorphoEval audit — Ho et al. (2019) PLOS Biol. & Painter, Ho & Headon (2018) JTB Avian Feather Tract
# Hexagonal Array on a Curved Trunk-and-Limb Surface, 2026-10-20 (v3, Pass 3)
#
# Pass 3 remediation assessment of `2018-glimm-avian-feather-bud-hexagonal.py` (v3, 1544 lines)
# in closed loop `2026-10-19-avian-feather-bud-hexagonal-loop-pass3`, superseding
# `2026-10-19-avian-feather-bud-hexagonal-audit-v2` (92.5 / 100).
#
# What Pass 3 changed:
#   1. CLOSED the single v2 remediation item — "couple the 2D planar dorsal tract PDE to curved 3D
#      trunk-and-limb surface geometry to model tract boundary dislocations between the spinal,
#      scapular and femoral tracts":
#      - `build_embryo_trunk_surface` (L314-372): Monge patch z = h(u, v) with a tapering trunk
#        ridge and four Gaussian limb buds (L/R humeral, L/R femoral); induced metric
#        g_ij = delta_ij + h_i h_j, sqrt(det g), inverse metric and Gaussian curvature K.
#      - `surface_div_grad` (L374-399): conservative face-flux Laplace-Beltrami / surface
#        chemotaxis operator (1/sqrt g) d_i (sqrt g g^{ij} a d_j f).
#      - `geodesic_arrival_time` (L401-435): Godunov eikonal solver giving the geodesic EDA
#        competence wave arrival time T from each tract initiation line.
#      - `simulate_feather_array_on_surface` (L548-749): wave-gated inhibitory-disk nucleation
#        (3D chordal radius r_inh = 0.92 lambda_y) + Painter 2018 n/c/b PDE relaxation on the
#        surface, with the Ho 2019 mesenchymal density threshold n_0(u, v)(1 + gamma t) >= n_crit
#        that produces the bare apteria between the dorsal and lateral tracts.
#      - `surface_coordination` (L437-512) / `curvature_defect_analysis` (L751-793) /
#        `isochrone_row_count_check` (L795-842) / `run_curved_surface_suite` (L921-969):
#        flat three-tract control P_6 = 0.979 (0 five-seven pairs) -> curved P_6 = 0.905
#        (19 fives, 4 sevens, 7 dislocation pairs), defect fraction 0.222 where |K| > K_thr vs
#        0.079 where |K| <= K_thr (ratio 2.81), monotone limb-height sweep (pairs 0/1/7/10 for
#        A_l = 0/15/30/45), 0 isochrone-lemma violations, sphere charge exactly 12.
#   2. CORRECTED PROVENANCE. The Pass 1-2 seed citation "Glimm, Bhat & Newman (2014) Dev. Biol.
#      395:139-149" does not exist (Crossref resolves both candidate DOIs to unrelated papers);
#      Ho et al. (2019)'s title and Michon et al. (2008)'s venue/DOI were also wrong, and the
#      "simultaneous competence" low-regularity phenotype had been attributed to Fc-chEDA1
#      instead of the Latrunculin pause/release experiment (Ho Fig 2B/D). All of these are fixed
#      in the script docstring, bib, reference JSON (`metadata.provenance_corrections`) and
#      README; the new file hashes are pinned and `--self-test` check 1 rejects the old DOI.
#      Source-traceability is therefore re-scored DOWN relative to v2.
#   3. Ho 2019 quantitative anchors replace the invented v2 reference values: six-sided fractions
#      0.75 / 0.50 (Fig 2D), margin densities 49 / 66 / 98 cells per 100 um (Fig 5C-D) driving
#      n_crit for Fc-chEDA1 / control / Ecto-D2, MTX density x0.8 and MTX + Ecto-D2 ordering
#      (Fig 5F). Width ratios are reported as model predictions with `reference_value: null`
#      because the paper does not tabulate them.
#   4. Three new machine-checked Lean 4 theorems (Loop_019 Theorems 4-6, 0 sorrys):
#      `euler_disclination_charge` (+ corollary `sphere_pentagon_excess`),
#      `isochrone_row_count_dislocation`, `monge_metric_determinant`; registered in
#      `morphoeval/math_kg_loops/glimm-avian-feather-bud-hexagonal.yaml`.
#
# Honest limitation carried into Pass 4: primordium positions are produced by a wave-gated random
# sequential adsorption rule, NOT emergently by the surface Keller-Segel PDE (the emergent variant
# was numerically unstable with a centred chemotaxis flux); model-fidelity is scored accordingly.

