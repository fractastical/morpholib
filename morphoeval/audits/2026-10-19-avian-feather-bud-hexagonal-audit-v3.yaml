    remediation:
      - "Make primordium nucleation emergent: replace the wave-gated inhibitory-disk adsorption rule in `simulate_feather_array_on_surface` by condensation arising from the surface Keller-Segel PDE itself, using an upwind / flux-limited discretisation of div_g(n grad_g c) on the Monge patch (the centred scheme was checkerboard-unstable in Pass 3), and re-derive P_6, tract widths and curvature defects from the emergent condensates."
      - "Replace the schematic Gaussian limb-bud Monge patch with a surface digitised from a staged chick embryo (e.g. Ho et al. 2019 Fig 1B whole mount or an HH29-30 3D atlas), solve the eikonal equation with the full (off-diagonal) metric, and evaluate per-tract Gauss-Bonnet with the boundary geodesic-curvature term so tract disclination charges can be compared quantitatively, not just by sign."
      - "Digitise the Ho et al. (2019) Fig 3E / 3G / 5F bar values (S-data) to give the Fc-chEDA1, Ecto-D2 and MTX width ratios real reference values and a calibrated mesenchymal density gradient (n_base, L_dens), and add measured noise so the WT model P_6 lands near the paper's ~0.75 rather than the ideal 1.00."
      - "Regenerate `scout_manifest.json` from a fresh literature scout so it no longer records the fabricated Glimm 2014 seed (re-pin its SHA-256), and rename the script / sim_id away from the 'glimm' token once the audit chain can be re-keyed."
