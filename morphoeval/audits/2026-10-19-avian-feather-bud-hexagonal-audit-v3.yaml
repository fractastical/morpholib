        evidence:
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [844, 969], note: "Wave-speed, chi, EDA-density and limb-height sweeps", supports: true}
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [1508, 1541], note: "CLI flags including --n-crit, --density-scale, --limb-height and --single", supports: true}
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [314, 330], note: "Surface geometry parameters (trunk height/sigma/taper, limb height/sigma/offset, humeral/femoral positions, flat switch)", supports: true}
      morphometric-validation:
        value: 93
        rationale: >-
          `measure_morphoeval()` (L1304-1422) emits 16 measurements with method, reference
