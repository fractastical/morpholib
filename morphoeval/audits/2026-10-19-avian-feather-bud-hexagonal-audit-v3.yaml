          Three width ratios carry `reference_value: null` because Ho 2019 does not tabulate
          them (only ordering / significance), and the WT model lattice is noise-free so its
          P_6 = 1.00 exceeds the paper's ~0.75; both are stated explicitly.
        evidence:
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [1304, 1422], note: "16 measurements: flat suite, EDA/density suite, specimen, curved-surface defect statistics, topology checks", supports: true}
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [437, 546], note: "Local tangent-plane Delaunay coordination with interior/boundary classification and closed-hull Euler charge check", supports: true}
          - {file: datasets/avian_feather_bud_hexagonal/avian_feather_bud_hexagonal_reference.json, lines: [1, 259], note: "ho2019_quantitative_anchors lists which quantities the paper reports numerically and which it does not", supports: true}
      source-traceability:
        value: 86
        rationale: >-
          Dataset `datasets/avian_feather_bud_hexagonal/` is SHA-256-pinned and verified at
