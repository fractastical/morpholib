simulations:
  - id: glimm-avian-feather-bud-hexagonal
    name: "Ho et al. (2019) & Painter, Ho & Headon (2018) avian feather tracts on a curved trunk-and-limb surface: geodesic EDA competence wave, inhibitory-disk hexagonal packing, density-threshold tract boundaries and curvature-induced 5-7 dislocations"
    organism: "Embryonic chick (Gallus gallus) dorsal, humeral and femoral feather tracts E6.5-E7.5; Fc-chEDA1 / Ecto-D2 / methotrexate / Latrunculin A / scaleless (FGF20 sc/sc) perturbations"
    script: 2018-glimm-avian-feather-bud-hexagonal.py
    output: docs/media/avian_feather_bud_hexagonal_comparison.png
    extra_outputs:
      - docs/media/avian_feather_bud_hexagonal_curved_tracts.png
      - docs/media/avian_feather_bud_hexagonal_growth.gif
    status: evaluated
    source_refs:
      - ho2019
      - painter2018
      - michon2008
      - bailleul2019
      - bausch2003
    summary: >-
      Pass 3 (v3) evaluation of `2018-glimm-avian-feather-bud-hexagonal.py`. The script now
      solves the Painter, Ho & Headon (2018) dermal chemotaxis + FGF20 / BMP PDE on a 3D
      Monge-patch trunk with four limb buds (Laplace-Beltrami operator, geodesic eikonal EDA
      competence wave, 3D chordal inhibitory-disk nucleation, local tangent-plane Delaunay
      coordination) and adds the Ho et al. (2019) mesenchymal density threshold, so the
      dorsal, humeral and femoral tracts self-delimit through bare apteria (gap 1.19 lambda)
      and acquire curvature-induced 5-7 dislocations where the limb buds bend the sheet
      (flat P_6 = 0.979, 0 pairs -> curved P_6 = 0.905, 7 pairs; defect fraction 0.222 at
      |K| > K_thr vs 0.079 elsewhere; monotone in limb height; sphere disclination charge 12).
      The flat-sheet suite reproduces the Ho 2019 ordering: WT wave P_6 = 1.00 vs simultaneous
      (Latrunculin-paused) 0.69 (paper ~0.75 vs ~0.50); Fc-chEDA1 (n_crit = 49/66) widens the
      patterned region 1.25x, Ecto-D2 (98/66) narrows it to 0.50x, MTX 0.75x, MTX + Ecto-D2
      0.26x (< each single treatment); scaleless / Latrunculin give 0 buds. Specimen
      segmentation of Ho 2019 Fig 3 is unchanged (24 primordia, P_6 = 0.75, +48h/+24h = 2.11x).
      Provenance was corrected: the Pass 1-2 seed citation (Glimm 2014) is fabricated and has
      been removed from the bib, JSON, README and docstring; Ho 2019's title and Michon 2008's
      venue/DOI were fixed; all five DOIs were Crossref-verified. Six Lean 4 theorems
      (0 sorrys) back the dispersion threshold, hexagonal equidistance, wave fidelity
      advantage, Euler disclination charge, isochrone row-count dislocation and Monge-metric
      determinant.
    scores:
      model-fidelity:
        value: 91
        rationale: >-
          Implements the Painter, Ho & Headon (2018) Keller-Segel n/c/b system with its exact
          linear threshold chi_c = 0.0540 (L167-229) and lifts it to a curved skin surface:
          Monge-patch metric, sqrt(det g), g^{ij} and Gaussian curvature (L314-372), a
          conservative face-flux Laplace-Beltrami / surface chemotaxis operator (L374-399),
          a Godunov eikonal geodesic EDA competence wave (L401-435) and the Ho 2019
          mesenchymal density threshold n_0(1 + gamma t) >= n_crit with n_crit set by the
          measured margin densities 49 / 66 / 98 cells per 100 um (L548-749). Tract-boundary
          dislocations between the dorsal and limb tracts are now a mechanistic consequence of
          curvature (Lean Theorems 4-6; Bausch 2003), closing the v2 remediation item. Scored
          below v2's 94 because primordium nucleation is a wave-gated inhibitory-disk
          adsorption rule relaxed by the PDE rather than an emergent PDE instability
          (`model_boundary_note` in the reference JSON), the eikonal solver uses only the
          diagonal metric, and the limb-bud geometry is schematic.
        evidence:
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [167, 229], note: "Painter 2018 dispersion relation, chi_c = 0.0540, equilateral row geometry (Lean Theorems 1-2)", supports: true}
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [314, 435], note: "Monge-patch surface, metric/curvature, conservative Laplace-Beltrami operator and geodesic eikonal competence wave", supports: true}
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [548, 749], note: "Surface simulation: geodesic wave gating, density-threshold competence, 3D inhibitory-disk nucleation, surface PDE relaxation of n/c/b", supports: true}
          - {file: 2018-glimm-avian-feather-bud-hexagonal.py, lines: [751, 842], note: "Curvature-localised defect analysis and isochrone row-count lemma check", supports: true}
          - {file: morphoeval/lean/loops/Loop_019_avian_feather_bud_hexagonal.lean, lines: [29, 182], note: "6 machine-checked Lean 4 theorems (0 sorrys): KS instability, hexagonal equidistance, wave fidelity, Euler disclination charge (+ sphere corollary), isochrone dislocation, Monge metric determinant", supports: true}
          - {file: datasets/avian_feather_bud_hexagonal/avian_feather_bud_hexagonal_reference.json, lines: [1, 259], note: "governing_equations.model_boundary_note states nucleation is not emergent from the PDE; curved_surface_model.limitations lists the diagonal-metric eikonal and schematic limb geometry", supports: false}
