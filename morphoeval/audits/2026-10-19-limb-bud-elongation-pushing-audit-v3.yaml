simulations:
  - id: boehm-limb-bud-elongation-pushing
    name: "Boehm et al. (2010) & Gros et al. (2010) vertebrate limb bud oriented cell division & Wnt5a/FGF8 pushing vs proliferation-gradient hypothesis"
    organism: "Mus musculus & Gallus gallus embryonic hindlimb and forelimb buds"
    script: 2015-boehm-limb-bud-elongation-pushing.py
    output: docs/media/limb_bud_elongation_pushing_comparison.png
    extra_outputs:
      - docs/media/limb_bud_elongation_pushing_fem3d.png
      - docs/media/limb_bud_elongation_pushing_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-limb-bud-elongation-pushing-audit-v2
    source_refs:
      - boehm2010
      - kicheva2010
      - gros2010
      - wyngaarden2010
      - morishita2008
      - dillon1999
      - brezzi1984
      - dompierre1999
      - laurentin2005
    claim_boundary:
      reported_in_source:
        - "Boehm et al. (2010): OPT-measured mouse limb bud growth E11.0 (St0, L_PD 1020 um) -> E11.25 (St1, L_PD 1450 um, +42.2 % PD, +12 % AP, +1 % DV; volume 0.551 -> 0.914 mm^3); dual-label IddU/BrdU cell-cycle atlas (T_c 11-25 h); a 3D Navier-Stokes growth model on a tetrahedral FEM mesh of the OPT iso-surface in which the measured proliferation (Model I) yields only 3.4-11.8 % PD elongation while inverse optimisation demands s_opt > 8 s_emp with negative DV growth; anisotropic/directional growth (Model II) therefore required"
        - "Gros et al. (2010): Wnt5a/JNK-controlled oriented cell division and FGF8/MAPK-controlled directional motility drive PD elongation; Wnt5a-/- and FGF-inhibited buds are shorter and more bulbous (E11.5 aspect ratios 2.1 WT, ~1.3 Wnt5a-/-)"
        - "Dillon & Othmer (1999): viscous incompressible continuum with distributed sources as the mechanical model of limb-bud outgrowth; Reynolds number irrelevant in the creeping-flow limit"
      reconstructed_in_script:
        - "Pass 3 Section 5: visual-hull reconstruction of the St0/St1 3D surfaces from the vendored specimen's two orthogonal iso-surface silhouettes; conforming prism-split P1 tetrahedral mesh; P1-P1 Brezzi-Pitkaranta-stabilised 3D Stokes growth solver with IddU/BrdU source, extensile oriented-division stress, AER-FGF8 body force, traction-free ectoderm and flank Dirichlet/ALE inflow plane; two closed-form oracles to 8.2e-14; Lagrangian RK2 growth with volume budget closed to 0.5 %; 2-gain calibration (k_chi, k_zeta) with Wnt5a-/-, Model I and uniform control out of sample; flank-influx sweep; mesh-convergence; silhouette IoU against the specimen St1 hull"
        - "Pass 2 Sections 2-3 (retained, now labelled): analytic strain-rate laws, IddU/BrdU vs Hooke-Jeeves inverse-opt profiles, a 2D Poisson pressure field used for visualisation, and a 2D boundary-advection model whose per-axis coefficients were calibrated to the 5-regime table; Pass 2 specimen segmentation of 5 sub-panels"
      transfer_boundary:
        - "The 3D geometry is a visual hull of two projections (elliptical cross-sections), not the OPT voxel iso-surface, and the mesh is structured, not unstructured Delaunay; the specimen's own St1/St0 PD ratio (1.364) and DV thickness (926 um) disagree with the reference table (1.422; 580 um)"
        - "The 5-regime FEM Pearson r = 0.9944 counts 2 calibrated regimes; the fully out-of-sample set is Model I (+5.2 % vs 10.1 %), Wnt5a-/- (+12.0 % vs 18.5 %) and the uniform control, RMSE 5.3 pp"
        - "The Stokes FEM is Reynolds-number independent by construction; the 5-decade Re sweep remains in the 2D reduced model where Re enters only through a phenomenological `re_factor`"
        - "Panels C-J of the main figure and 8 of the 20 measurements still come from the calibrated 2D reduced model"
      does_not_claim:
        - "Reproduction of the paper's inverse-optimisation (Hooke-Jeeves) in 3D, chick-embryo (Gros) geometry, cell-level oriented-division statistics, a Navier-Stokes (inertial) solver, or that the active-stress Model II as implemented reproduces the AP/DV changes of the specimen (it does not: AP -10.9 %, DV -14.5 %)"
    summary: >-
      Pass 3 (v3) evaluation of `2015-boehm-limb-bud-elongation-pushing.py` (overall 89.1/100, down from
      93.8/100 in v2). The single v2 remediation item is closed in reduced form: the St0/St1 limb-bud
      surfaces are reconstructed as the visual hull of the specimen's two orthogonal OPT iso-surface
      silhouettes, tetrahedralised (466 nodes / 2150 P1 tets, convergence checked at 1198 nodes), and the
      paper's 3D Stokes growth system is solved as written with a stabilised P1-P1 FEM verified against two
      closed-form oracles (8.2e-14) and a Lean-proved volume budget. The parameter-free Model I gives
      +5.21 % PD (inside the paper's 3.4-11.8 % band) and the FEM 5-regime hierarchy has r = 0.9944 with two
      fitted gains. The remediation also exposed three defects that lower the score: (i) the Pass 2 "continuum
      solver" credited in v2 is a calibrated 2D boundary-advection model uncoupled from its Poisson field,
      now disclosed in the docstring and panel titles; (ii) measured proliferation supplies only 12 % of the
      66 % OPT volume gain, so the incompressible active-stress Model II fitted to +42.2 % PD must contract
      AP (-10.9 %) and DV (-14.5 %) while the specimen widens; flank body-wall inflow of 61.4 um/h with no
      anisotropic stress reproduces PD and the AP/DV signs and gives the best specimen silhouette IoU (0.847
      vs 0.770); (iii) the specimen's own St1/St0 PD ratio (1.364) and DV thickness (926 um) disagree with the
      SHA-locked reference table (1.422; 580 um). Self-test 14/14, 20 measurements, runtime 24 s.
    scores:
      model-fidelity:
        value: 84
        rationale: >-
          Section 5 now implements the governing equations of Boehm et al. (2010) Eqs. (3)-(5)/(10)-(11) in
          3D: P1-P1 stabilised Stokes with distributed source, traceless extensile oriented-division stress
          integrated by parts, AER-FGF8 body force, traction-free ectoderm and flank Dirichlet/ALE plane
          (`assemble_stokes_p1p1`/`solve_stokes_growth`, L878-955), verified to round-off against two
          closed-form oracles (L957-984; Lean Theorem 4) with a Lagrangian RK2 volume budget closed to
          0.5 % (L989-1095; Lean Theorem 5); the Model I conclusion of the paper is reproduced parameter-free
          (+5.21 % PD, band 3.4-11.8 %). Scored down from 94 because (a) the Pass 2 solver that v2 credited
          as a "continuum artificial-compressibility Stokes velocity solver" is a boundary-advection model
          with Pass-2-fitted coefficients (0.352, 0.560, 0.580, ...) uncoupled from the Poisson field
          (`simulate_limb_bud_regime`, L336-360 disclosure), and it still produces Panels C-J and 8 of 20
          measurements; (b) viscosity/Reynolds dependence exists only as the phenomenological `re_factor`
          (L270-273), so the "5-decade Re insensitivity" is not a property of the solved physics; (c) the
          active-stress Model II solved faithfully contracts AP/DV against the data, which the file reports
          rather than hides (L1145-1222).
        evidence:
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [722, 743], note: "Section 5 header: governing 3D Stokes growth system, BCs, stabilisation, honest scope statement (visual hull, structured mesh)", supports: true}
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [878, 984], note: "P1-P1 Brezzi-Pitkaranta Stokes assembly, flank constraints, sparse solve, and two manufactured-solution oracles (max rel. error 8.2e-14)", supports: true}
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [989, 1095], note: "Lagrangian RK2 3D growth with ALE flank inflow plane and mesh-measured volume budget (balance ratio 1.005)", supports: true}
          - {file: morphoeval/lean/loops/Loop_017_limb_bud_elongation_pushing.lean, lines: [149, 238], note: "Lean Theorems 4 (Stokes oracles exact) and 5 (flank-influx volume budget, OPT vs proliferation volume inequality); file compiles with 0 sorrys", supports: true}
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [336, 360], note: "Disclosure that the Pass 2 2D model is a calibrated boundary-advection model, not coupled to the Poisson solver; still drives Panels C-J", supports: false}
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [270, 273], note: "Reynolds dependence of the 2D model is a phenomenological re_factor = 0.52 + 0.24 (log Re + 6); the 3D Stokes FEM is Re-independent", supports: false}
      specimen-match:
        value: 86
        rationale: >-
          The 3D geometry is now imported from the SHA-256-locked specimen itself: `reconstruct_opt_visual_hull`
          (L759-800) reads the AP and DV half-width profiles of the Fig. 2F dorsal and posterior St0/St1
          silhouettes (scale anchored by L_PD(St0) = 1020 um; the two views give independent St1 PD lengths
          1391 vs 1386 um) and every FEM scenario is scored by dorsal-silhouette IoU against the specimen St1
          hull (`silhouette_iou_vs_specimen`, L1224-1252): flank influx 0.847 > WT active stress 0.770 >
          Model I 0.683 > St0 baseline 0.625; Panel F overlays FEM WT and the specimen hull, Panel P all four.
          Scored down from 93 because the hull is a two-view elliptical approximation rather than the OPT
          iso-surface, and because the specimen disagrees with the reference table on St1/St0 PD (1.364 vs
          1.422) and on DV thickness (926 vs 580 um) — a discrepancy the script measures and reports but
          cannot resolve.
        evidence:
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [744, 800], note: "Visual-hull reconstruction from the specimen's two orthogonal OPT silhouettes; per-view px->um scale; St1/St0 PD/AP/DV ratios measured from the specimen", supports: true}
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [1224, 1252], note: "Dorsal silhouette intersection-over-union of each FEM end state against the specimen St1 hull", supports: true}
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [622, 720], note: "Pass 2 multi-panel contour segmentation of mouse_limb_bud_specimen.jpg retained (Panels D, E, F dorsal/posterior, G)", supports: true}
          - {file: docs/media/limb_bud_elongation_pushing_fem3d.png, lines: [0, 0], note: "Panels K-P: specimen hull profiles, tet mesh, WT Stokes field on deformed mesh, 5-regime bars, volume closure, dorsal silhouettes vs specimen St1", supports: true}
          - {file: datasets/limb_bud_elongation_pushing/README.md, lines: [33, 43], note: "Specimen-measured hull table vs OPT reference table: PD ratio 1.364 vs 1.422 and DV 926 vs 580 um disagree", supports: false}
      parameter-expressivity:
        value: 92
        rationale: >-
          Beyond the Pass 2 suite (5 regimes, 6-point Re sweep, 25-point (zeta, chi) grid,
