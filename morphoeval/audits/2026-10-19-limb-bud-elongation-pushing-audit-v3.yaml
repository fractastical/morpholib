        evidence:
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [1788, 2016], note: "20 reference-anchored measurements; FEM block L1811-1931 reports volume gap, AP sign disagreement and Wnt5a under-prediction explicitly", supports: true}
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [1109, 1143], note: "Exactly two gains fitted by secant (k_chi -> FGF-only 29.8 %, k_zeta -> WT 42.2 %); other regimes predicted", supports: true}
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [1853, 1891], note: "WT PD is a calibration target and the 5-regime FEM r counts it; out-of-sample RMSE is 5.3 pp", supports: false}
      source-traceability:
