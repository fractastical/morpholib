        evidence:
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [1145, 1222], note: "FEM 5-regime evaluation, flank-influx sweep with v_in* root, mesh-convergence at 3 resolutions", supports: true}
          - {file: 2015-boehm-limb-bud-elongation-pushing.py, lines: [2135, 2184], note: "CLI: --zeta-ocd, --chi-fgf, --reynolds, --hours, --flank-influx, --fem-res, --output, --gif, --self-test wired to both model layers", supports: true}
