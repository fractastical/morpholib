# MorphoEval audit — Boehm et al. (2010) & Gros et al. (2010) Vertebrate Limb Bud Elongation Pushing, Pass 3 (v3)
#
# Pass 3 (v3) evaluation of `2015-boehm-limb-bud-elongation-pushing.py` (2184 lines) after the
# `2026-10-19-limb-bud-elongation-pushing-loop-pass3` remediation loop closed the single open v2 item
# ("extend the 2D mid-plane pressure-Poisson solver to an unstructured 3D tetrahedral FEM imported from
# OPT iso-surfaces").  Overall 89.1 / 100 (down from 93.8 / 100 in v2): the remediation added a genuine,
# oracle-verified 3D Stokes FEM but also exposed that the Pass 2 "continuum solver" scored in v2 is a
# calibrated boundary-advection model that never used the Poisson field, and that the paper's active-
# stress Model II, solved as written, contracts the AP and DV axes the specimen widens.
#
# What Pass 3 added (all verified against the current file):
#   1. `reconstruct_opt_visual_hull` (L759-800): the St0/St1 3D surfaces are rebuilt as the visual hull of
#      the specimen's two orthogonal OPT iso-surface silhouettes (Fig. 2F dorsal + posterior), scale fixed
#      by L_PD(St0) = 1020 um -> St1/St0 PD x1.364, AP x1.222, DV x1.010 measured from the specimen.
#   2. `build_structured_tet_mesh` (L802-868): conforming prism-split P1 tetrahedral mesh of the St0 hull
#      (466 nodes / 2150 tets; coarse 188/744, fine 1198/5978).
#   3. `assemble_stokes_p1p1` / `solve_stokes_growth` (L878-955): P1-P1 Brezzi-Pitkaranta-stabilised 3D Stokes
#      growth system -nabla p + mu nabla^2 v + nabla.sigma_active + f = 0, nabla.v = s(x), traction-free
#      ectoderm, flank Dirichlet/ALE inflow plane; two closed-form oracles reproduced to 8.2e-14
#      (`fem_manufactured_solution_errors`, L957-984; Lean Theorem 4).
#   4. `simulate_limb_bud_fem_3d` (L989-1095): Lagrangian RK2 growth, volume budget closed to 0.5 %
#      (Lean Theorem 5); `calibrate_fem_active_rates` (L1109-1143) fits exactly two gains (k_chi to FGF-only,
#      k_zeta to WT); `evaluate_fem_regimes_and_influx` (L1145-1222) runs 5 regimes, a flank-influx sweep and
#      mesh convergence; `silhouette_iou_vs_specimen` (L1224-1252) scores every scenario against the St1 hull.
#   5. New 6-panel figure `docs/media/limb_bud_elongation_pushing_fem3d.png` (`render_fem_figure`, L1289-1436),
#      Panel F overlay of FEM WT and specimen hull, 12 new measurements (20 total), 6 new self-test checks (14).
#   6. Uniform-control T_c corrected from 12.1 h to the reference-table value 16.5 h (L213-217).
#
# Headline FEM results (6 h): Model I parameter-free +5.21 % PD (paper band 3.4-11.8 %) but V1/V0 = 1.123 vs
# OPT 1.659; active-stress WT fitted to +42.2 % PD gives AP -10.9 %, DV -14.5 % (OPT: +12 %, +1 %); flank influx
# v_in* = 61.4 um/h with measured proliferation only gives PD +42.2 %, AP +4.9 %, DV +2.8 %, IoU 0.847 vs the
# specimen St1 silhouette (WT active stress 0.770, Model I 0.683, St0 baseline 0.625).

