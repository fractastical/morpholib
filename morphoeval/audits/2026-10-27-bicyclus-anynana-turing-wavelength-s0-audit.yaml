    repository: https://github.com/fractastical/morpholib
    commit: "0c76d15d"
    note: "Pass 1 working tree. Checkpoint hash is replaced with the commit that contains the script before the knowledge-graph build."
references:
  sekimura2015:
    title: "A model for selection of eyespots on butterfly wings"
    authors: "Sekimura T, Venkataraman C, Madzvamuse A"
