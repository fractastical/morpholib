  id: 2026-10-27-bicyclus-anynana-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  publisher_orcid: "https://orcid.org/0009-0007-4948-9192"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor; no independent second assessor)"
  domain: morphogenesis
