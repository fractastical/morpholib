# MorphoEval audit — Bicyclus anynana Turing wavelength, pass 1.
# The PDE, Table 1, and the dispersion identity are in place. Full credit for the
# control suite (k_p sweep, width doubling, equal-diffusion ablation, specimen
# segmentation) is withheld until pass 2 scores those runs as controls.
