    claim_boundary:
      reported_in_source:
      - 'Chirat, Moulton & Goriely (2013): the mantle margin is an elastic beam on the Winkler foundation of the
        calcified shell edge; compressive growth thrust P above P_c = 2 sqrt(EI k) buckles it at lambda_c = 2 pi
        (EI/k)^(1/4), and hollow spines form where the buckled fold grows faster than its base'
      - 'Erlich et al. (2016): isometric vs rib-intercalating antimarginal ornamentation follows from whether lambda_c
        scales with the margin length (constant N) or stays fixed (N grows)'
      - 'Rudraraju et al. (2019): a 3D finite-strain morphoelastic shell FEM with surface and volume growth reproduces
        spine formation and closure'
      - 'Vermeij (1987): durophagous predators chip shell margins; molluscs repair the break and leave repair scars'
      reconstructed_in_script:
      - Spectral L-BFGS-B minimisation of the fourth-order nonlinear Winkler-beam energy on a periodic margin (Pass
        2), now with heterogeneous foundation k(s) and template-memory warm start; pitchfork amplitude law and subcritical
        control; 3D accretionary valve synthesis across 4 regimes; 12-species quarter-power regression; Pecten specimen
        costae segmentation; (Pass 3) planar inextensible elastica cross-section of a hollow spine fold with self-contact
        penalty, continuation in growth excess eps, and stacking into a tube surface; (Pass 3) 14-station damage/repair
        accretionary trajectory, scar index, healing-length fit, registry error, 5 x 4 chip-size x callus-stiffness
        outcome phase diagram
      transfer_boundary:
      - The hollow-spine closure model is a 2D cross-section elastica with prescribed base width W = 6 mm and wall
        thickness t = 0.35 mm; there is no out-of-plane coupling between cross-sections, no shell stretching energy
        and no growth tensor, so eps_close = 4.81 is a reduced-model number and its reference value (5.00) is mesh
        convergence of the same model, not a Murex measurement
      - The repair callus stiffness ratio rho = 1.15 and decay length l_heal = 7 mm are prescribed, not measured;
        the critical chip arc 1.97 lambda is compared with a half-integer rounding heuristic (1.5 lambda), not a
        published repair-scar statistic
      - EI = 1.085 mN mm^2 for Pecten is the value that makes lambda_c = 8.7766 mm give exactly 14 ribs over L =
        122.87 mm; the vendored JSON default_parameters.EI_mN_mm2 is 0.18 and the Adult_V ontogenetic stage is 1.79,
        so the wild-type calibration is self-referential
      does_not_claim:
      - A 3D finite-strain morphoelastic shell finite-element solution (Rudraraju et al. 2019), emergent spine base
        width or wall thickness, measured repair-callus mechanics, free-edge (non-periodic) margin boundary conditions,
        or an independent empirical closure strain for Murex spines
