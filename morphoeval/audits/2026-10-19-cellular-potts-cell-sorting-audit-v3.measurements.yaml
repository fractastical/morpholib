    spec_fingerprint: 7cdd3f38f0e6192e614f25f3f47d81cb4d09870705b0e0dca1d1d4dbca9f4cc0
    artifact_sha256: a2f5372c202e946ae397351314585b49d1db212e3088826bfc3b642308249496
    input_dataset_sha256: {}
    claim_boundary:
      reported_in_source:
      - 'Graner & Glazier (1992) PRL Eqs. 1-3 & Fig. 3: extended large-Q Cellular Potts Model Hamiltonian with bond-energy
        surface tensions gamma_LD = J_LD - (J_LL + J_DD)/2 and gamma_alphaM = J_alphaM - J_alphaalpha/2 driving
        logarithmic heterotypic boundary decay L_het(t) ~ A - B ln(t).'
      - 'Glazier & Graner (1993) PRE Table I & Section III.B: classification of 4 equilibrium phase regimes (complete
        engulfment, partial sorting lens, checkerboard mixing, and cell dissociation) and fluctuation temperature
        controls (T=0 lattice pinning arrest vs optimal thermal sorting vs high-T thermal melting).'
      - 'Ouchi et al. (2003) Physica A Eq. 2: a perimeter (cortical tension) elasticity term lambda_P (p_sigma -
        P_t)^2 added to the CPM Hamiltonian suppresses ragged, fragmented cell boundaries; Farhadifar et al. (2007)
        Eq. 1 is the vertex-model analogue.'
      reconstructed_in_script:
      - 2D extended large-Q Cellular Potts Model (60 x 60 lattice, 60 cells of V_t = 16) across all 4 canonical
        phase regimes plus T=0 pinning and equal-adhesion negative controls, a 7-point continuous J_LD sweep, and
        a 6-point fluctuation temperature sweep (all at lambda_P = 0).
      - Ouchi et al. (2003) perimeter / cortical tension term with incremental 8-neighbour bond-count bookkeeping
        (max drift 0 after 150 MCS), a cortical-tension sorting regime (lambda_P = 2, P_t = 44), a 6-point lambda_P
        ablation sweep at T = 10 and T = 80, and a 5-point P_t sweep (32-56) with realised-perimeter tracking r
        = 0.9995.
      - Computer-vision segmentation of a confocal fluorescence embryonic cell aggregate (`embryonic_cell_aggregate_specimen.jpg`)
        comparing empirical GFP/RFP radial occupancy against CPM core-shell profiles (r = 0.961, RMSE = 0.154).
      transfer_boundary:
      - 2D lattice Cellular Potts representation of 3D multicellular spheroid cross-sections; the specimen is an
        embryoid-body spheroid, not a Hydra reaggregate, and its core/shell labels are assigned by fluorescence
        channel, not by cell type.
      - Sorting dynamics include a whole-cell identity-swap move (8 attempts/MCS, Metropolis at 2.5 T) that is not
        part of the Graner-Glazier single-site copy formalism; the 'partial sorting lens' regime adds an uncited
        lateral bias field inside that move. Both are disclosed here, not in the script.
      - Cells equilibrate at ~76 % of V_t under lambda = 1.2 and a hard v >= 6 floor; the PRL Fig. 3 comparison
        uses 0-150 MCS checkpoints whose digitisation from the 10^4-MCS figure is not documented.
      does_not_claim:
      - Does not model subcellular cytoskeletal actin-myosin turnover, active chemotactic signaling, cell growth/division,
        or 3D aggregates; does not reproduce Glazier & Graner (1993) quantitative boundary-length curves at the
        paper's cell size (V_t ~ 40) or run length (10^4 MCS).
