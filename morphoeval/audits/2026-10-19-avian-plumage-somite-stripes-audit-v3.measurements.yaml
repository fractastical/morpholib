    claim_boundary:
      reported_in_source:
      - 'Haupaix et al. (2018): galliform dorsal stripes form in two steps — the somite autonomously sets the position
        of dermal agouti expression bands (A1'', A1, A2; quail somite -> pheasant host grafts, neural-tube grafts
        as control), and agouti dose then sets stripe width by controlling the duration of a transient yellow-production
        pulse within each feather; wild-type quail ly stripe = feather rows 2-5, recessive-black (agouti loss) rows
        3-4, Fawn (agouti duplication) rows 1/2-6 with no eumelanin before hatching; yellow band longer at stripe
        centre than edge; stripe boundaries 2-4 mm (cb) and 3-9 mm (ly) from the midline at wing level'
      - 'Inaba et al. (2019): quail melanocytes form periodic stripes cell-autonomously; connexin40 gap junctions
        tune the pattern (dominant-negative cx40 expands black, overexpression expands yellow); melanocytes instruct
        dermal ASIP expression'
      - 'Lin et al. (2013): feather melanocyte progenitors form a horizontal ring niche in the proximal follicle
        and send melanocytes vertically into barb ridges; bars in Barred Plymouth Rock feathers are chevron-shaped
        when the follicle cylinder is opened from the posterior side and travel toward the anterior; pulp ASIP inhibits
        melanocyte differentiation (ASIP beads whiten feathers)'
      reconstructed_in_script:
      - A 2D somite-derived Gaussian agouti prepattern S_somite(y) coupled by relaxation beta_A (S - u) to a two-species
        activator-inhibitor PDE with cubic-saturating linearised kinetics and d = Dv/Du = 20; MC1R threshold switch
        u >= theta_A; AP orientation index and Ashman bimodality; negative controls beta_A = 0 and d = 1
      - 'Pass 3: a 9-row-per-period hexagonal follicle lattice whose ring niches sample u(x_i, y_i); feather type
        [A_i >= theta] + [A_i - 2a >= theta] and yellow-pulse duty (1/pi) arccos((theta - (A_i - a))/a); an agouti
        dose series (x0.60 / x1.00 / x2.80) reproducing 2 / 4 / 6 yellow rows; each follicle rendered as a 3D cylinder
        and opened into the (ell, s) sheet with chevron band edges s_0 + k|ell|, swept over k and regressed back
        (max |k_meas - k| = 7e-4); Lean Theorems 4-5'
      - 'Pass 1-2 carry-overs: an analytic Gaussian-threshold species width w_y = 2 (1.13 sigma) sqrt(2 ln(A_0/theta))
        for five species, a linear donor-autonomy chimera law alpha = 0.94, a fitted exponential dose-response for
        the ''bead'' axis, and DoG segmentation of a CC BY-SA Coturnix japonica photograph (N = 4 stripes, yellow
        fraction 0.442)'
      transfer_boundary:
      - The mm calibration (Lambda = 0.95 mm, w_y = 0.42 mm, the 5-species widths) and the 'bead' regime widths
        were introduced in Pass 1 without a source; Haupaix et al. report stripe widths in feather rows and boundaries
        in mm from the midline, so the row-count validation (Pass 3) is the only width comparison against published
        values
      - 'The follicle model is a geometric + threshold reduction of Lin et al.: the chevron arises from a pigment
        switch propagating around the ring at rate omega while cells rise at v_z (k = v_z/(r_f omega)); no barb-ridge
        helical displacement, pulp ASIP diffusion, progenitor-depletion feedback or regeneration cycle is solved;
        a, k and the dose multipliers are fitted, not measured'
      - The reverse chimeras (pheasant -> quail, guineafowl -> quail) are extrapolations of the quail -> pheasant
        result; the PDE integrates a cubic linearisation, not the rational Gierer-Meinhardt kinetics written in
        the reference JSON
      does_not_claim:
      - Quantitative reproduction of Haupaix Fig. 3C / fig. S6 relative yellow band lengths or of the midline-distance
        boundaries, a mechanistic derivation of the agouti fold-change in RB/Fa strains, the melanocyte cell-autonomy
        or cx40 experiments of Inaba et al., the Barred Plymouth Rock progenitor-depletion mechanism of Lin et al.,
        or a side-by-side comparison with the papers' own figures (none are vendored)
