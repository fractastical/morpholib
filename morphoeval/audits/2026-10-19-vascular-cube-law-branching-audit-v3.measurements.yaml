    claim_boundary:
      reported_in_source:
      - 'Murray (1926a): minimising Poiseuille pumping power plus a metabolic cost proportional to blood volume
        gives Q proportional to r^3 and a scale-invariant wall shear stress sqrt(eta b); at the optimum the metabolic
        term is twice the viscous term'
      - 'Murray (1926b): the same functional fixes the bifurcation angles via cos(theta_1) = (r_0^4 + r_1^4 - r_2^4)/(2
        r_0^2 r_1^2) and its mirror; symmetric total angle 74.93 deg'
      - 'Zamir (1976): alternative optimality principles (surface, volume, drag, power) give different angle laws;
        Sherman (1981): the cube law holds across generations of a tree'
      - 'Fåhraeus & Lindqvist (1931) / Pries et al. (1992): the apparent viscosity of blood falls in tubes narrower
        than ~300 um, fitted by eta_rel(D) = 220 e^{-1.3D} + 3.2 - 2.44 e^{-0.06 D^0.645} at H_D = 0.45'
      - 'Hubbard et al. (1999): the clinical retinal arteriole-to-venule caliber ratio is about 2/3'
      reconstructed_in_script:
      - Power functional, stationarity radius, wall shear invariance, asymmetric cosine laws, Zamir/Steiner/Da Vinci
        ablation controls, 7-generation Sherman hierarchy and the gamma power sweep (Newtonian)
      - Fahraeus-Lindqvist eta(r) in the Poiseuille term, generalised stationarity 2 P_met = (4 - eps) P_visc, local
        gamma_eff(r), symmetric junction exponent gamma_j(r_0) and a Newtonian-vs-F-L tree exponent sweep (gamma*
        3.000 -> 2.773)
      - Geodesic arterial and venous Murray trees on a 12 mm sphere with tangent-plane Murray angles, AVR-coupled
        venous root, repulsive A/V coupling with an uncoupled control, orthographic fundus-projection foreshortening
        and projected A/V crossings
      - Green-channel top-hat / Zhang-Suen skeleton / EDT segmentation of the vendored human fundus specimen (N
        = 19 Y-junctions)
      transfer_boundary:
      - 'The 3D retinal cup is a reduced geometric model: no haemodynamic network solve, no capillary bed connecting
        arterial and venous tips, no oxygen/VEGF-guided angiogenesis, optic disc at the posterior pole; the venous
        root radius is an input (AVR = 0.67), not emergent'
      - The F-L fit is the in-vitro glass-tube relation at fixed H_D = 0.45 (no in-vivo endothelial surface layer
        correction, no phase separation at bifurcations), applied per generation to a symmetric tree; the '~2.7'
        target is reached by the tree optimum (2.773) but not by the local junction exponent (2.859 at 25 um)
      - The J01-J08 'Zamir 1979' junction table carries a Murray-prediction column and agrees with Murray to <=
        0.3 deg without page/figure provenance, so the RMSE = 0.134 deg / r = 0.9999 figures are a parity check,
        not independent validation; the Sherman (1981) hierarchy table is generated from r_g = 82 um * 2^(-g/3),
        not digitised
      does_not_claim:
      - Independent human morphometric confirmation of the F-L exponent shift, of the AVR (an input), or of arteriovenous
        interdigitation (index 0.504 ~ random mixing, reference 1.0 is an idealisation); verification of the three
        Pass 3 DOIs (recalled offline, flagged in bib, JSON and script header)
