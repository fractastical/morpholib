simulations:
  - id: delphi10000-drosophila-eugracilis-turing-wavelength-s0
    name: "Schnakenberg Turing wavelength at 1.5 µm in Drosophila eugracilis (Pass 2 sweep and controls)"
    organism: "Drosophila eugracilis"
    script: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py
    output: docs/media/drosophila_eugracilis_turing_wavelength_s0_comparison.png
    also:
      - docs/media/drosophila_eugracilis_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-drosophila-eugracilis-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, murray1981, kondo2010, tanaka2009, yassin2016, ready1976]
    summary: >-
      Pass 2 keeps the focal 1.485 µm Schnakenberg lattice and adds a six-point
      gamma sweep (0.50, 0.75, 1, 1.25, 1.584, 2). Analytic versus FFT wavelength
      Pearson r = 0.992, RMSE = 0.701 µm (the FFT ring sits systematically long
      of k_c; values are not equal). Equal diffusion D_u = D_v is not Turing and
      decays to activator std 2.5e-4 against Turing std 1.23. Blurred-arm
      foreground fraction is 0.177 versus raw Otsu 0.141. Plate-versus-render KS
      is 0.343. CV similarity of the 12-frame 720x540 GIF to the gallery plate
      is 88.6. Age remains 0 Ma; erecta lambda is 2.100 µm and ficusphila is 1.180 µm.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and a critical wavenumber."
        - "Schnakenberg 1979 two-species kinetics."
        - "Murray 1981 scale parameter controlling pattern spacing."
        - "Tanaka, Barmina and Kopp 2009: sex-comb mechanisms differ among Drosophila species, including rotation versus longitudinal birth of the row."
        - "Yassin et al. 2016: female-limited colour dimorphism has recurred in Drosophila."
        - "Ready, Hanson and Benzer 1976: periodic retinal lattice."
      reconstructed_in_script:
        - "Length unit chosen so gamma=1 yields 1.485e-6 m."
        - "gamma_erecta=0.5 and lambda_ficusphila=1.180 µm as this scale's chronoseries contrast."
        - "Nonlinear FFT wavelength series, equal-diffusion ablation, blurred Otsu mask, KS luminance."
      transfer_boundary:
        - "Gallery JPEG is a canonical spiral plate (100 µm bar), not a micrograph of D. eugracilis. Commons had no species bitmap on 2026-10-27."
        - "Spot-lattice reciprocal wavenumber is not identical to the linear k_c; RMSE 0.701 µm is that bias."
      does_not_claim:
        - "A published 1.485 µm measurement on D. eugracilis ocelli or sex-comb teeth."
        - "Stratigraphic ancestry of erecta to eugracilis. Both are extant; 13/41 is the catalog chronoseries index."
        - "Sibling primordium parameters (101 µm, alpha 1.555) or DOI 10.1016/j.ydbio.2009.04.012."
        - "A nanopublication signature. No ~/.nanopub/profile.yml was present."
    scores:
      model-fidelity:
        value: 90
        rationale: "Schnakenberg kinetics, the Turing conditions, and k_c match the cited formulas. Self-test checks that the explicit dispersion and the 1/sqrt(gamma) shortcut agree to 1e-9, and that gamma=1 is exactly 1.485 µm. The length unit is assigned, not fitted to a species SEM, which is why this is not higher."
        evidence:
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [94, 120], note: "k_c and growth rate sigma(k)", supports: true}
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [699, 712], note: "self-test dispersion identity to 1e-9 and lambda 1.485e-6", supports: true}
      specimen-match:
        value: 76
        rationale: "Side-by-side, the plate is a spiral and the simulation is a spot lattice. They share the plate's brown LUT and both fill the frame. Direct CV similarity of the GIF's last frame to the plate is 88.6 (orientation, radial FFT, coherency, occupancy) on a 12-frame 720x540 animation. The plate is not a fly photograph, so specimen-match stays below the range reserved for a segmented micrograph."
        evidence:
          - {file: docs/media/drosophila_eugracilis_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Plate, ocelli, dispersion, GOF r=0.992, chronoseries bars, ablation", supports: true}
          - {file: docs/media/drosophila_eugracilis_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 720 by 540", supports: true}
      parameter-expressivity:
        value: 90
        rationale: "Raising gamma from 0.50 (erecta, 2.100 µm) through 1 (eugracilis, 1.485 µm) to the ficusphila value shortens lambda_c monotonically, and the six-point nonlinear FFT series follows that order (r=0.992). Setting D_v = D_u makes the Turing discriminant fail and the activator std falls from 1.23 to 2.5e-4."
        evidence:
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [653, 683], note: "gamma sweep, equal-diffusion ablation, smoothed segmentation", supports: true}
          - {file: docs/media/drosophila_eugracilis_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Dispersion peaks, chronoseries bars, ablation bar", supports: true}
      morphometric-validation:
        value: 88
        rationale: "Pearson r = 0.992 on six gamma points (reference 1, so the score is not self-referential). RMSE = 0.701 µm records the systematic FFT-versus-k_c offset instead of hiding it. KS luminance = 0.343. Blurred-arm fraction 0.177 versus raw Otsu 0.141. Focus spacing CV 0.294 versus a perfect lattice at 0. Absolute wavelength calibration remains biased; correlation does not remove that."
        evidence:
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [346, 365], note: "fit_series Pearson and RMSE; KS luminance", supports: true}
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [291, 310], note: "Blurred Otsu arm mask added in pass 2", supports: true}
          - {file: datasets/drosophila_eugracilis_turing_wavelength_s0/pass2_metrics.json, lines: [0, 0], note: "pearson_r 0.992318, rmse_um 0.701, ablation_std 2.48e-4", supports: true}
      source-traceability:
        value: 92
        rationale: "Crossref-verified DOIs for Turing, Schnakenberg, Gierer-Meinhardt, Murray, Kondo and Miura, Tanaka-Barmina-Kopp 2009 PNAS 10.1073/pnas.0807875106, Yassin 2016, and Ready 1976. Specimen SHA-256 f3705e55 is pinned. The rejected mouse-PGC DOI is documented in the scout manifest."
        evidence:
          - {file: datasets/drosophila_eugracilis_turing_wavelength_s0/paper_citations.bib, lines: [1, 90], note: "Primary bibliography", supports: true}
          - {file: datasets/drosophila_eugracilis_turing_wavelength_s0/drosophila_eugracilis_turing_wavelength_s0_reference.json, lines: [1, 40], note: "1.485e-06 m and geological_age_ma 0 stated in the reference", supports: true}
      code-traceability:
        value: 86
        rationale: "jacobian, turing_wavenumber and growth_rate are commented with the steady state and sigma(k). Lean theorems prove wavelength order, wavenumber reversal, twelve waves in 17820 nm, and the gamma order. The integer Lean wavelengths round the erecta float 2100.11 nm to 2100 nm."
        evidence:
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [79, 120], note: "Equation comments at the Jacobian and dispersion", supports: true}
          - {file: morphoeval/lean/loops/Loop_3184_drosophila_eugracilis_turing_wavelength_s0.lean, lines: [20, 43], note: "predecessor_wavelength_longer through murray_gamma_orders", supports: true}
      repro-package:
        value: 90
        rationale: "--self-test passed: dispersion identity, ablation std < 0.05, patterned std > 0.4, and Pearson r > 0.98 on a four-point sweep with measured lambda not equal to analytic lambda. Seed 3184 and SHA-256 locks are checked at startup. GIF gate requires at least 10 frames and 480 px."
        evidence:
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [699, 743], note: "self_test assertions", supports: true}
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [49, 62], note: "EXPECTED_SHA256 locks", supports: true}
    remediation:
      - id: R5
        item: "An independent second assessor has not scored this audit. Left open; it is not a numeric gate failure."
      - id: R6
        item: "FFT wavelengths sit about 0.70 µm long of analytic k_c (hexagonal ring versus linear mode). A spot-spacing correction could be reported beside the raw ring; the correlation is already 0.992 and was not forced through the identity line."
