simulations:
  - id: honda-dichotomous-tree-branching
    name: "Honda (1971) J. Theor. Biol. & Honda & Fisher (1978) Science 3D recursive dichotomous tree branching, effective leaf area optimization, Leonardo da Vinci pipe-model area conservation, and solar-elevation ray tracing of tiered crowns vs latitude"
    organism: "Cornus controversa (Pagoda dogwood / wedding cake tree) & Terminalia catappa (Tropical almond pagoda tree)"
    script: 1976-honda-dichotomous-tree-branching.py
    output: docs/media/dichotomous_tree_branching_comparison.png
    extra_outputs:
      - docs/media/dichotomous_tree_branching_growth.gif
      - docs/media/dichotomous_tree_branching_solar_tier_spacing.png
      - docs/media/dichotomous_tree_branching_solar_shadows.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-dichotomous-tree-branching-audit-v2
    claim_boundary:
      reported_in_source:
        - "Honda (1971) J. Theor. Biol. 31(2):331-338 3D recursive vector-rotation tree architecture parameterized by daughter divergence angles (theta_1, theta_2), length contraction ratios (r_1, r_2), and vertical phyllotactic roll angle alpha = 137.5 deg in the local horizontal plane spanned by v and v x z_hat"
        - "Honda & Fisher (1978) Science 199(4331):888-890 & Fisher & Honda (1979) Am. J. Bot. 66:633-644 demonstration that empirical branching angles (theta_1 approx 24-32 deg, theta_2 approx 52-62 deg) and contraction ratios (r_1 = 0.90, r_2 = 0.70) in Terminalia catappa and Cornus controversa maximize non-overlapping effective leaf area A_eff / A_total across 5-branch horizontal whorls"
        - "Shinozaki et al. (1964) Jpn. J. Ecol. 14:97-105 pipe-model theory and Eloy (2011) Phys. Rev. Lett. 107:258101 wind-stress derivation of Leonardo da Vinci's cross-sectional area conservation d_parent^Delta = d_1^Delta + d_2^Delta (Delta = 2.0)"
        - "Campbell & Norman (1998) Ch. 11 solar geometry sin h = sin(phi) sin(delta) + cos(phi) cos(delta) cos(H) with Cooper (1969) declination delta = 23.45 sin(2 pi (284 + n)/365) and the Monsi & Saeki (1953) Beer-Lambert canopy extinction tau = exp(-LAI)"
      reconstructed_in_script:
        - "Full Honda (1971) 3D rotation-matrix tree builder (`grow_honda_1971_3d_tree`) across 4 botanical crown archetypes (excurrent conifer, pagoda tiered Cornus, decurrent deliquescent Quercus, weeping pendulous Salix) over k = 6 orders (127 internodes, 64 terminal leaf clusters)"
        - "Honda & Fisher (1978) 5-whorl horizontal tier disk-union integration (`compute_effective_leaf_area_ratio`) and 2D (theta_1, theta_2) optimization surface (`evaluate_honda_fisher_optimization_surface`), Pearson r = 0.99782 against the vendored 8-regime benchmark curve, Terminalia (0.7739) and Cornus (0.7591) vs the collinear theta_1 = theta_2 = 0 ablation control (0.2001, 74.14% self-shading penalty)"
        - "Exact Leonardo da Vinci / Shinozaki pipe-model sapwood area conservation (sum d_{k,i}^2 / d_0^2 = 1.0000 across all 6 orders and 63 bifurcations) contrasted against Murray's cube law (Delta = 3.0) and untapered cylinder controls"
        - "Pass 3: diurnal/seasonal direct-beam sun paths at 6 latitudes (0, 15, 30, 45, 50.93 Meise, 60 deg N), a 7-tier stacked Honda & Fisher crown ray-traced tier-to-tier with Beer-Lambert tau_c^n attenuation (tau_c = exp(-2) = 0.135), annual beam light capture E(s/R) over 14 tier spacings, parameter-free 90% saturation spacing s_90/R = 1.832 (0 deg), 0.969 (45 deg), 0.850 (Meise), 0.710 (60 deg), ratio s_90(0)/s_90(45) = 1.89, and the specimen's projected tier spacing s/R = 0.376 +- 0.134 giving E = 0.747 at Meise vs 0.621 if transplanted to the equator"
        - "Computer-vision segmentation of the Pagoda Dogwood (Cornus controversa 'Variegata') specimen (`cornus_controversa_tiered_crown_specimen.jpg`, Botanic Garden Meise, 960x1280 px) detecting 7 horizontal pagoda foliage tiers, 25 Y-bifurcations with theta_1 = 22.40 +- 8.18 deg, theta_2 = 50.93 +- 14.23 deg, Leonardo area ratio 0.9533 +- 0.1705, and 6 inter-tier spacing pairs"
      transfer_boundary:
        - "3D recursive vector-rotation internode skeletons and 2D horizontal whorl leaf-cluster disk unions mapped to optical crown stratigraphy and woody bifurcation geometry of Cornus controversa"
        - "The ray-traced 'tiered crown' is a stack of planar Honda & Fisher 5-whorl disk-union tiers with a uniform per-tier transmittance, not the 3D Honda (1971) internode skeleton of `grow_honda_1971_3d_tree`; light capture is direct beam only (no diffuse sky radiance, no leaf scattering, no penumbra), and the latitude prediction is validated against the null ratio 1.0 and self-consistency, not against measured tier spacings across latitudes"
        - "The Honda & Fisher benchmark curve, the specimen theta_1/theta_2/beta/tier references and the specimen s/R reference in the vendored JSON files are values previously produced by this script (regression anchors), not digitised figure values or independent measurements"
      does_not_claim:
        - "Cambial auxin-cytokinin molecular transport kinetics, turbulent eddy-resolvable wind-tunnel aeroelasticity at individual leaf blades, diffuse-sky or scattered-light radiative transfer, photosynthetic light-response curves, or a literature-anchored optimal tier spacing vs latitude"
    source_refs:
      - honda1971
      - honda1978
      - fisher1979
      - shinozaki1964
      - eloy2011
      - campbell1998
      - cooper1969
      - monsi1953
    summary: >-
      Pass 3 (v3) evaluation of `1976-honda-dichotomous-tree-branching.py` (overall weighted score 91.2/100,
      down from 94.1/100 in v2). The single Pass 2 remediation item is closed in a reduced but honest form:
      a new section couples stacked Honda & Fisher tiers to Campbell & Norman (1998) solar geometry with Cooper
      (1969) declinations over 12 months x hourly hour angles, ray-traces tier-to-tier shadows with Monsi & Saeki
      Beer-Lambert attenuation, and sweeps 6 latitudes x 14 tier spacings to give a parameter-free 90% saturation
      spacing s_90/R = 1.832 at the equator vs 0.969 at 45 deg N and 0.850 at Meise (ratio 1.89 vs null 1.0),
      with the specimen's projected tier spacing s/R = 0.376 +- 0.134 capturing E = 0.747 at Meise vs 0.621 at
      the equator. Two new Lean 4 theorems (shadow-offset monotonicity, stacked Beer-Lambert optical depth)
      bring the total to 5 with 0 sorrys; measurements grew from 9 to 16 and self-test suites from 8 to 10 (all
      pass, 13 s). The score falls because this round examined the reference anchors v2 accepted: the Honda &
      Fisher "benchmark" curve (r = 0.9978) and the specimen references in the reference JSON are the script's own
      earlier outputs, three new measurements have no external reference, the CV junction filter pre-selects the
      Honda & Fisher angle window, and the 3D builder and the solar section use uncited constants.
