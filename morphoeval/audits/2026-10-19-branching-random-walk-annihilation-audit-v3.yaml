# MorphoEval audit — Hannezo et al. (2017) Cell & Scheele et al. (2017) Nature
# Unifying Theory of Branching Morphogenesis via Branching & Annihilating Random Walks (BARW), 2026-10-20 (v3)
#
# Pass 3 re-score of `2017-hannezo-branching-random-walk-annihilation.py` (now 2131 lines) after the remediation
# of both open v2 items in the instrumented loop `morphoeval/runs/2026-10-19-branching-random-walk-annihilation-loop-pass3`,
# superseding `2026-10-19-branching-random-walk-annihilation-audit-v2` (92.4).
#
# What Pass 3 changed (both v2 remediation items + two corrections):
#   1. 3D off-lattice BARW in a cylindrical fat pad (R_c = 14, L_c = 110) and a spherical, optionally inflating
#      mesenchymal capsule (R_s = 40, R_s(t) = R_s(0)(1 + gamma t)) with a nematic ECM fiber-alignment torque
#      du = lambda (f.u)(f - (f.u)u) dt, a length-weighted nematic order parameter S, a paired-seed lambda sweep
#      {0, 0.05, 0.1, 0.2, 0.4} in both geometries, a true-isotropic control (chi = 0, lambda = 0) and an inflation
#      sweep gamma in {0, 0.004, 0.008} (Bordeu et al. 2023). Panels G/H + supplementary `..._3d_ecm_fatpad.png`.
#   2. Clonal neutral drift inside TEBs (Scheele et al. 2017): every TEB carries k of N = 64 labelled stem cells,
#      Poisson(rho * duct length) Moran steps, hypergeometric half-split + doubling at A -> 2A, label inheritance by the
#      duct at A + I -> I; 64 mosaic replicates (f_0 = 0.125) and 600 single-cell clones. Panel I + `..._clonal_drift.png`.
#   3. CORRECTION: the Pass 2 Panel D "BARW universal curve" was a hand-fitted analytic function
#      0.455 + 0.435 exp(-0.36 (g - 0.25)), so the v2 metric r = 0.993 was circular. Panel D now compares the
#      measured, pooled 9-tree ensemble q_branch(g); honest r = 0.924, RMSE = 0.117. Scored here as a correction.
#   4. CORRECTION: the hard-coded p = 1.2e-18 in the tau metric note is now the computed log-log p-value.
#   Lean: 3 new theorems (nematic order extremes/torque, Moran martingale, TEB split label conservation);
#   6 theorems, 0 sorry, `lean` exit 0. Registered as equations 4-6 in the math KG loop file.
#
# Scores below are criterion-referenced on the rubric's 0-100 scale, not calibrated probabilities. Overall 88.9
# (down from 92.4): the two remediation items landed and the measurement suite grew from 8 to 14, but the Pass 3
# work exposed (i) that the v2 generational-correlation pass was circular, (ii) unsourced calibration constants in the
# 1D PDE that make the i_inf = k_b/k_a agreement self-referential, (iii) a hyper-branching reference (2.0x) that the
# simulation misses by 4.4x yet was scored as a pass, and (iv) that the SHA-pinned specimen is an embryonic branched
# gland whose reference values (34 tips, r/R_max = 0.783) are the segmentation's own outputs. Line numbers refer to
# the files at commit 74d06a5c.

