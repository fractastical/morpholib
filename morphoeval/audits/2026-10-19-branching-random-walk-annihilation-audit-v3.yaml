simulations:
  - id: hannezo-branching-random-walk-annihilation
    name: "Hannezo et al. (2017) Cell & Scheele et al. (2017) Nature unifying theory of branching morphogenesis via branching and annihilating random walks (BARW)"
    organism: "Mus musculus (mouse pubertal mammary gland, embryonic metanephric kidney, embryonic pancreas, and salivary gland ductal networks)"
    script: 2017-hannezo-branching-random-walk-annihilation.py
    output: docs/media/branching_random_walk_annihilation_comparison.png
    extra_outputs:
      - docs/media/branching_random_walk_annihilation_growth.gif
      - docs/media/branching_random_walk_annihilation_3d_ecm_fatpad.png
      - docs/media/branching_random_walk_annihilation_clonal_drift.png
    status: evaluated
    source_refs:
      - hannezo2017
      - scheele2017
      - bordeu2023
      - chatzeli2017
      - moran1958
      - klein2011
    supersedes_audit_id: 2026-10-19-branching-random-walk-annihilation-audit-v2
    claim_boundary:
      reported_in_source:
        - "Hannezo et al. (2017): ductal trees of mammary gland, kidney and pancreas are self-organised by a branching-and-annihilating random walk of active tips (A -> 2A at rate k_b, A -> A + I trail deposition, A + I -> I annihilation within R_a), giving N_term = N_branch + 1, q_branch -> 1/2, a critical Galton-Watson subtree law P(S) ~ S^(-3/2), a universal generational q(g) relaxation and a travelling-wave mean-field with homeostatic duct density i_inf = k_b/k_a"
        - "Scheele et al. (2017): mammary TEB stem cells follow neutral drift (equipotent, Moran-type) so clone fates are set by TEB bifurcation/termination; clone-size distributions inherit the tree statistics"
        - "Bordeu et al. (2023): salivary-gland BARW in an inflating 3D domain; domain growth and local geometry, not tip-intrinsic rules, set branch density"
        - "Moran (1958), Klein & Simons (2011): neutral birth-death drift is a martingale in the labelled fraction with variance 2k(N-k)/N^2 per step"
      reconstructed_in_script:
        - "2D off-lattice BARW tree, 1D Fisher-KPP mean-field wave, exact Catalan critical GW pmf, 3-organ universality collapse, R_a perturbation/ablation suite, specimen bud/junction segmentation (all Pass 2)"
        - "Pass 3: 3D off-lattice BARW in a cylindrical fat pad and a spherical (optionally inflating) capsule with a nematic ECM alignment torque, a length-weighted nematic order parameter S, a paired-seed lambda sweep with a true-isotropic control, an inflation sweep, a birth-vertex annihilation-exemption rule, a Moran neutral-drift clonal model inside TEBs with hypergeometric splits at bifurcations and label inheritance by ducts, 64 mosaic replicates and 600 single-cell clones, 6 additional measurements with reference values, 2 new self-test suites and 3 new Lean theorems"
      transfer_boundary:
        - "The 3D fat pad is a cylinder, not Bordeu's flattened slab; only the spherical capsule inflates and already-deposited ducts are NOT advected with the domain; no Bordeu figure or table value is reproduced numerically — only the qualitative monotonic S(lambda) and inflation ordering of L_total; S reference values are the theoretical 0 / 1 extremes"
        - "N_TEB = 64 and the Moran rate rho = 1 per unit duct length are free parameters (real TEBs have O(10^2) cells); no Scheele clone-size histogram is reproduced numerically — only the exact martingale f_bar = f_0 and the S^(-3/2) tail inherited from the tree"
        - "The 1D PDE carries uncited calibration constants (1.82 k_a, 0.55 v_0, v_drift = 0.35 v_0) tuned so the wake plateau matches k_b/k_a; the i_inf agreement is therefore a self-calibration, not an independent test"
        - "The SHA-pinned specimen is a Wikimedia whole-mount of an embryonic branched gland, not a pubertal mammary TEB network; its reference values (N_term = 34, r/R_max = 0.783) are the segmentation's own outputs"
      does_not_claim:
        - "Quantitative reproduction of any Hannezo/Scheele/Bordeu figure or table beyond the reference JSON tables; advected-duct inflation; a slab fat-pad geometry; multi-seed statistics for the 3D lambda sweep; Scheele clone-size histograms; a mammary-specific specimen"
    summary: >-
      Pass 3 (v3 remediated) evaluation of `2017-hannezo-branching-random-walk-annihilation.py`
      (88.9/100, down from 92.4/100 in Pass 2). Both v2 remediation items are closed: the 2D BARW
      is extended to a 3D off-lattice simulator in a cylindrical fat pad and a spherical, optionally
      inflating mesenchymal capsule with a nematic ECM alignment torque (`simulate_3d_spatial_barw_tree`,
      L823-1029) and a paired-seed lambda sweep with a true-isotropic control (`evaluate_3d_ecm_anisotropy_sweep`,
      L1031-1072; S_iso = 0.054, S monotonic in lambda in both geometries, sphere q_b = 0.499 with N_b = 322,
      inflation raises L_total 3331 -> 14229); and Scheele-type neutral drift inside TEBs is coupled to the tree
      (`simulate_clonal_neutral_drift_in_tebs`, L1088-1157; `evaluate_clonal_drift_ensemble`, L1159-1228;
      f_bar = 0.119 +/- 0.051 vs martingale 0.125, clone survival 0.88, tau_clone = 1.66). The measurement suite
      grows from 8 to 14, self-test from 7 to 9 suites, Lean from 3 to 6 theorems (0 sorry). The score falls
      because Pass 3 exposed that the Pass 2 Panel D universal curve was hand-fitted (metric 3 corrected from
      r = 0.993 to the honest 0.924), that the 1D PDE's i_inf agreement rests on uncited tuning constants, that
      the hyper-branching ratio misses its 2.0x reference by 4.4x, and that the specimen and its reference values
      are circular; none of these were penalised in v2.
    scores:
      model-fidelity:
        value: 92
        rationale: >-
          The core BARW rules (persistent migration, Poisson A -> 2A, trail deposition, R_a annihilation) are
          implemented in 2D (L236-489) and now in 3D (L823-1029) with the nematic alignment torque
          du = lambda (f.u)(f - (f.u)u) dt and a unit-sphere persistent random walk; the exact Catalan critical
          GW pmf (L196-234), the 1D Fisher-KPP mean field (L491-582), neutral Moran drift with hypergeometric
          splits (L1074-1157) and the inflating capsule (L891-903) are all recognisable reductions of the cited
          papers, and 6 Lean theorems machine-check the algebraic identities (0 sorry). Deductions: the 1D PDE
          uses uncited constants 1.82 k_a, 0.55 v_0 and v_drift = 0.35 v_0 (L510, L530-531) tuned to make the
          plateau hit k_b/k_a (-3); the 3D model needed a birth-vertex exemption (L934-938) absent from the 2D
          model, so the two simulators implement different annihilation rules (-2); the fat pad is a cylinder,
          not Bordeu's slab, and deposited ducts are not advected with the inflating sphere (-2); the WT 2D
          tree at seed 2017 has only N_b = 12 and other seeds give N_b from 1 to 70, so the 2D model sits at the
          edge of extinction (-1).
        evidence:
          - {file: 2017-hannezo-branching-random-walk-annihilation.py, lines: [236, 489], note: "2D off-lattice spatial BARW ductal tree simulator with persistent migration, bifurcation, trail deposition and R_a annihilation (no birth-vertex rule)", supports: true}
          - {file: 2017-hannezo-branching-random-walk-annihilation.py, lines: [823, 1029], note: "Pass 3: 3D off-lattice BARW in cylinder / inflating sphere with nematic ECM torque, polar distal bias, +/-38 deg bifurcation about a random perpendicular axis, capsule annihilation", supports: true}
          - {file: 2017-hannezo-branching-random-walk-annihilation.py, lines: [934, 938], note: "Birth-vertex rule exempting duct points within R_a of the tip's own bifurcation vertex — needed in 3D, absent in 2D", supports: true}
          - {file: 2017-hannezo-branching-random-walk-annihilation.py, lines: [510, 531], note: "Uncited PDE calibration constants v_drift = 0.35 v0, 1.82 ka, 0.55 v0 that set the wake plateau", supports: false}
          - {file: 2017-hannezo-branching-random-walk-annihilation.py, lines: [1074, 1157], note: "Neutral Moran birth-death steps and TEB clonal model with hypergeometric half-split and duct label inheritance", supports: true}
          - {file: morphoeval/lean/loops/Loop_056_branching_random_walk_annihilation.lean, lines: [178, 272], note: "3 new Lean 4 theorems: nematic order extremes/symmetry/torque, Moran martingale and variance, TEB split label conservation (6 total, 0 sorry)", supports: true}
