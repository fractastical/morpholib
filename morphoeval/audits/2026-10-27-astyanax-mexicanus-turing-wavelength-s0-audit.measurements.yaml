    claim_boundary:
      reported_in_source:
      - Turing (1952) derived diffusion-driven instability and a critical wavenumber. Schnakenberg (1979) gave the
        two-species kinetics. Murray (1981) applied the wavelength idea to animal coat markings.
      - 'Cavefish pigment loss is genetic: oca2 albinism (Protas et al. 2006) and mc1r depigmentation (Gross et
        al. 2009). Pigment-cell regression is a late melanogenesis step (McCauley, Hixon and Jeffery 2004).'
      - Eye degeneration is Hedgehog-dependent lens apoptosis (Yamamoto, Stock and Jeffery 2004). Neuromast expansion
        is a lateral-line phenotype tied to feeding behavior (Yoshizawa et al. 2010). Jeffery (2009) reviews both.
      reconstructed_in_script:
      - The 6.656e-7 m wavelength is the loop-card scale, not a length reported by those papers. The script places
        the fastest linear mode on that length by the metres-per-pixel calibration.
      - 'Pass-1 numbers: dispersion Pearson r = 0.99997, RMSE = 0.00455, nonlinear wavelength 660.7 nm, body melanin-dark
        fraction 0.002 on the voucher, scale ratio 36.33 against the 24 µm sibling.'
      transfer_boundary:
      - The composite GIF paints the subcellular patch onto a whole-body photograph. That is a visualization, not
        evidence that the voucher resolves 666 nm, and it does not transfer to surface-fish stripe spacing.
      does_not_claim:
      - Does not claim that optic-cup degeneration or neuromast expansion are outputs of k_c.
      - Does not claim a cavefish morphogen pair has been identified. Schnakenberg kinetics are a minimal carrier.
      - Does not claim the chronoseries has a fossil predecessor. The series is the single Holocene cave morph at
        0 Ma.
