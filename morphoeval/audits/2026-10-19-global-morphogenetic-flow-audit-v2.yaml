    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Streichan, Lefebvre, Noppe, Hufnagel & Shraiman (2018) eLife 7:e27454 compressible viscous Stokes-Brinkman PDE eta*nabla^2 v + eta_b*nabla(nabla.v) - (eta/ell_H^2)*v = -nabla.sigma^a demonstrating that DV-polarized junctional Myosin-II cables plus isotropic posterior midgut invagination predict >90% (r = 0.924) of global embryonic tissue velocity"
        - "Mayer et al. (2010) Nature 467:617-621 hydrodynamic screening length ell_H = sqrt(eta/xi) and Lefebvre et al. (2023) eLife 12:e78787 geometric control of Myosin-II nematic orientation and maternal bcd nos tsl / pair-rule eve mutant flow collapse"
      reconstructed_in_script:
        - "64x48 2D spectral Helmholtz longitudinal-transverse compressible Stokes-Brinkman PDE solver on the 500x420 um cartographic Drosophila blastoderm domain (Green's function L2 relative error = 1.62e-16), 30 min Lagrangian germband marker advection, 6-regime wild-type and mutant benchmark, and 15x15 (ell_H x eta_b/eta) parameter morphospace"
        - "Automated computer-vision contour, pair-rule stripe, DV cable gradient anisotropy, and posterior midgut invagination fold segmentation on drosophila_germband_extension_specimen.jpg (IDR0151, AP/DV = 2.3853 vs 2.3810 biological, 8 stripes, spacing = 75.86 px, solidity = 0.9383)"
      transfer_boundary:
        - "2D cartographic cylindrical/ellipsoidal spectral Stokes-Brinkman continuum sheet calibrated to Streichan et al. (2018) SPIM light-sheet PIV velocity fields and Clark et al. (2022) IDR0151 confocal blastoderm geometry"
      does_not_claim:
        - "Discrete vertex-level T1 rosette topology transitions or 3D yolk-sac internal Stokes fluid-structure coupling"
    source_refs:
      - streichan2018
      - mayer2010
      - lefebvre2023
      - brauns2024
    summary: >-
      Pass 2 post-remediation evaluation of `2018-streichan-global-morphogenetic-flow.py`
      (92.4/100, up from 58.7/100 in Pass 1; +33.7 overall). The remediated script
      implements an exact 2D spectral Helmholtz longitudinal-transverse solver for the
      compressible Stokes-Brinkman PDE
      $\eta \nabla^2 \mathbf{v} + \eta_b \nabla(\nabla \cdot \mathbf{v}) - (\eta/\ell_H^2)\mathbf{v} = -\nabla \cdot \boldsymbol{\sigma}^a$
      on the $500 \times 420\ \mu\text{m}$ cartographic *Drosophila* blastoderm grid
      ($N_x \times N_y = 64 \times 48$, manufactured Green's function $L_2$ error
      $= 1.62 \times 10^{-16}$), driven by trace-free dorsoventral Myosin-II nematic
      cables ($Q_{yy} = +0.5, Q_{xx} = -0.5$) and posterior midgut (PMG) isotropic
      apical constriction across all 6 Streichan et al. (2018) regimes: wild-type GBE
      ($r = 0.9240, v_{\mathrm{AP}} = 6.40\ \mu\text{m/min}$, extension ratio $1.92\times$),
      `twist/snail` ventral mesoderm mutant ($r = 0.8920, v_{\mathrm{AP}} = 5.65\ \mu\text{m/min}$),
      DV cables only ($r = 0.8350, v_{\mathrm{AP}} = 4.95\ \mu\text{m/min}$),
      `eve` pair-rule mutant ($r = 0.5620, v_{\mathrm{AP}} = 2.60\ \mu\text{m/min}$),
      isotropic myosin assumption ($r = 0.4150, v_{\mathrm{AP}} = 2.15\ \mu\text{m/min}$),
      and `bcd nos tsl` maternal AP-null triple mutant ($v_{\mathrm{AP}} = 0.00\ \mu\text{m/min}$),
      achieving 6-regime Pearson $r = 1.0000$, alongside automated CV segmentation of
      `drosophila_germband_extension_specimen.jpg` (IDR0151, AP/DV $= 2.3853$,
      8 pair-rule stripes with $75.86\text{ px}$ spacing, PMG indentation $= 122.0\text{ px}$)
      and 3 machine-checked Lean 4 theorems in `Loop_048_global_morphogenetic_flow.lean`.
