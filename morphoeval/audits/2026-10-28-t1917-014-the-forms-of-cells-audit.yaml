simulations:
  - id: thompson1917-t1917-014
    name: "Thompson (1917) T1917-014 — Lagena outlines vs. the Plateau/Delaunay catalogue (Pass 1)"
    organism: "Lagena spp. (monothalamic Foraminifera), 13 specimens figured by Thompson after Brady (1884)"
    script: thompson/claims/t1917-014_the-forms-of-cells.py
    output: docs/media/t1917_014_the_forms_of_cells_comparison.png
    extra_outputs:
      - docs/media/t1917_014_the_forms_of_cells_growth.gif
      - datasets/thompson_1917/t1917-014/t1917_014_metrics.json
    also:
      - morphoeval/lean/loops/Thompson1917_T1917_014.lean
      - morphoeval/math_kg_loops/thompson1917-t1917-014.yaml
    domain: cell-morphology
    status: evaluated
    source_refs: [thompson1917, delaunay1841, kenmotsu1980, kireenko2022, prazeres2015]
    model_spec:
      model: "Kenmotsu CMC surfaces of revolution; Delaunay flask (sphere + unduloid + cylinder) and Delaunay bead composites"
      decision_rule: "best catalogue fit nRMSE <= 0.06"
      inputs:
        - datasets/thompson_1917/t1917-014/thompson_1917_fig84_lagena_after_brady.png
        - datasets/thompson_1917/t1917-014/thompson_1917_leaf0276_p256_fig84.jp2
        - datasets/thompson_1917/t1917-014/t1917_014_the_forms_of_cells_reference.json
    claim_boundary:
      reported_in_source:
        - "Thompson (1917) p. 256: Lagena shells are 'flask-shaped ... whose surface is simply that of an unduloid, or more frequently ... an unduloid combined with a portion of a sphere'; p. 218: the CMC surfaces of revolution are the plane, sphere, cylinder, catenoid, unduloid and nodoid"
      reconstructed_in_script:
        - "Kenmotsu (1980) parametrisation of the Delaunay family; C1 sphere-unduloid-cylinder flask and unduloid bead composites fitted by bounded least squares to the meridional radius profile of each of the 13 Fig. 84 silhouettes"
      transfer_boundary:
        - "The silhouettes are Brady's drawings as redrawn in 1917, not photographs; pixel edge noise is 2-4 % of r_max; no modern specimen has been analysed yet"
      does_not_claim:
        - "No claim about the surface-tension mechanism (hanging drop); no claim about Nodosaria chains, Orbulina or non-foram protists; no statistical test beyond RMSE / Pearson r in this pass"
    summary: >-
      v1 implements the Delaunay catalogue exactly (Kenmotsu E4, neck-ratio E5, period E6,
      catenoid), builds Thompson's 'unduloid + portion of a sphere' as a C1 composite (E7)
      plus a pure unduloid bead (E8), segments all 13 Lagena of Fig. 84 and fits both models.
      Result: 6/13 Delaunay-compatible at the 0.06 gate; flask-like specimens (L/W <= pi,
      n = 8) median nRMSE 0.049, spindles (L/W > pi, n = 5) median 0.209; median bilateral
      asymmetry 0.058.  Missing: photograph of a real specimen, null and free-form
      comparators, statistics (KS / CV), parameter sweep, negative control, verdict file.
    scores:
      model-fidelity:
        value: 72
        rationale: >-
          The catalogue is implemented from the first-integral / Kenmotsu form with the
          correct limits (cylinder, unduloid, spheres, nodoid, catenoid), self-tested against
          the root identities and the elliptic-integral period, and 18 Lean theorems check the
          integer algebra (roots, envelope, trichotomy, bead bound, flask join).  Thompson's
          flask qualification is honoured by the C1 composite.  Deductions: the flask's
          sphere-unduloid join is restricted to the one-parameter family of C1 joins (no C2
          matching), the neck is a plain cylinder with no apertural lip, and the nodoid is
          classified but never fitted.
        evidence:
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [95, 150], note: "classify_delaunay, neck_ratio, unduloid_period, bead_aspect_ratio, kenmotsu_profile, catenoid_profile (E4-E6)", supports: true}
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [154, 184], note: "flask_profile (E7, closed-form join radius) and bead_profile (E8)", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_014.lean, lines: [32, 221], note: "18 kernel-checked theorems, 0 sorry (roots_sum/product, first integral, neck ratio monotonicity, Kenmotsu envelope, catalogue trichotomy, bead aspect bound, flask join)", supports: true}
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [154, 176], note: "join is C1 only and the neck is an idealised cylinder without lip", supports: false}
      specimen-match:
        value: 45
        rationale: >-
          Side by side (panel D), the fitted composites trace the flask and globular Lagena
          closely and visibly fail on the slender spindles, which is the honest result of
          the test.  But the only 'specimens' in Pass 1 are 1917 line drawings after Brady;
          the vendored CC-BY photograph (Kireenko 2022) is not analysed, so no real specimen
          has been compared yet.
        evidence:
          - {file: docs/media/t1917_014_the_forms_of_cells_comparison.png, lines: [0, 0], note: "panel B segmented plate, panel D 13 profiles with flask/bead overlays", supports: true}
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [187, 208], note: "segment_fig84 finds exactly 13 silhouettes (asserted in self_test)", supports: true}
          - {file: datasets/thompson_1917/t1917-014/kireenko_2022_bdj_e87457_fig8_station5656mc.jpg, lines: [0, 0], note: "photograph vendored and SHA-pinned but not read by v1", supports: false}
      parameter-expressivity:
        value: 50
        rationale: >-
          B visibly and monotonically controls the neck ratio in the GIF (cylinder to string
          of spheres) and the flask neck length grows with L_neck; the fitted B per specimen
          spans 0.30-0.85.  No systematic sweep over (B, t, L_neck) is tabulated, the nodoid
          branch (B > 1) and the catenoid are only drawn, and no CLI exposes the parameters.
        evidence:
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [430, 462], note: "render_growth_gif sweeps B 0 -> 0.98 and L_neck", supports: true}
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [260, 278], note: "fit_delaunay: six/nine multi-start initialisations, but no regime table of the parameter effects", supports: false}
      morphometric-validation:
        value: 48
        rationale: >-
          Quantitative morphometrics are computed on every silhouette (L/W, asymmetry index,
          fitted B, neck ratio, nRMSE, Pearson r) and the bead aspect bound gives an a priori
          prediction (L/W <= pi) that is checked.  There is no null model (ellipsoid), no
          free-form reference to calibrate the noise floor, no KS test or cross-validation,
          and no literature measurement of Lagena dimensions.
        evidence:
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [211, 238], note: "radius_profile: principal axis, half-widths, asymmetry index", supports: true}
          - {file: datasets/thompson_1917/t1917-014/t1917_014_metrics.json, lines: [0, 0], note: "per-specimen metrics: 6/13 compatible, flask-like median 0.049, spindles 0.209", supports: true}
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [250, 258], note: "only nRMSE and Pearson r are implemented", supports: false}
      source-traceability:
        value: 85
        rationale: >-
          The claim text, page and figure numbers are pinned to the Internet Archive leaf
          (0276 = p. 256) with SHA-256 of the JP2 and of the derived crop, re-verified at run
          time; Delaunay 1841 and Kenmotsu 1980 are cited with DOIs/URLs; the pre-scouted Dryad
          dataset is documented as a mismatch with pinned metadata.  Deduction: Kenmotsu's DOI
          and Brady 1884 are cited in the .bib but not resolved against Crossref in this round.
        evidence:
          - {file: datasets/thompson_1917/t1917-014/t1917_014_the_forms_of_cells_reference.json, lines: [0, 0], note: "equations E1-E8 with page loci, input_dataset_sha256 for all six inputs", supports: true}
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [85, 92], note: "verify_inputs() checks the Fig. 84 crop against the reference JSON and the in-script pin", supports: true}
          - {file: datasets/thompson_1917/t1917-014/scout_manifest.json, lines: [0, 0], note: "Dryad 28816 DATASET_MISMATCH reasoning; Commons/OpenAlex queries recorded", supports: true}
      code-traceability:
        value: 75
        rationale: >-
          Every function docstring names the equation id (E3-E8) and the Thompson page it
          implements; the Lean module and math KG YAML cite the exact script line ranges.
          The decision threshold 0.06 is a stated judgement, not derived from a noise model.
        evidence:
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [1, 45], note: "module docstring maps E3-E8 to pages 216-263", supports: true}
          - {file: morphoeval/math_kg_loops/thompson1917-t1917-014.yaml, lines: [0, 0], note: "six laws with lean_locus and code_locus line ranges", supports: true}
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [72, 73], note: "RMSE_SUPPORT = 0.06 justified only by a comment", supports: false}
      repro-package:
        value: 70
        rationale: >-
          Deterministic (no RNG), --self-test passes in 3 s, the full run in 7 s, inputs
          SHA-pinned, dependency versions recorded here.  Deductions: no result.json verdict
          file, no pinned per-script requirements, PNG outputs are gitignored by the repo
          and had to be force-added.
        evidence:
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [465, 499], note: "self_test: identities, classification, flask joins, synthetic recovery, 13 silhouettes", supports: true}
          - {file: thompson/claims/t1917-014_the-forms-of-cells.py, lines: [502, 522], note: "documented invocation (--self-test / --no-gif)", supports: true}
    overall:
      value: 60.8
      formula: "weighted mean over rubric 0.1.0 dimensions (0.20*72 + 0.25*45 + 0.10*50 + 0.15*48 + 0.10*85 + 0.08*75 + 0.12*70)"
    remediation:
      - id: R1
        item: "Independent second assessor (different provider) — this round is builder-scored"
      - id: R2
        item: "Segment the real specimens in the vendored Kireenko (2022) CC-BY plate (Lagena 61a/62a, Oolina 63, Fissurina 57a/58a) and fit them with the same pipeline; report sizes in um from the 100 um scale bars"
      - id: R3
        item: "Add the ellipsoid null model and a free-form (degree-6 r^2 polynomial) reference so the Delaunay residual is judged against the attainable noise floor, not a fixed 0.06"
      - id: R4
        item: "Add statistics: KS test between observed and fitted radius distributions, 2-fold cross-validated RMSE, Pearson r per model"
      - id: R5
        item: "Negative/ablation control: fit the Delaunay models to polythalamous tests on the same plate (Globobulimina 64a, Quinqueloculina 66a), which the claim does not cover and which should fit worse"
      - id: R6
        item: "Parameter-regime sweep: tabulate neck ratio, period and bead aspect ratio over B in [0, 1.5] (cylinder -> unduloid -> spheres -> nodoid) and the flask join feasibility over t"
      - id: R7
        item: "Write datasets/thompson_1917/t1917-014/result.json with the claim verdict (supported | refuted | mixed | untestable) and headline numbers"
