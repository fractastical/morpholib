# MorphoEval audit — Thompson (1917) claim T1917-014 "The Forms of Cells": are Lagena tests
# Delaunay (constant-mean-curvature) surfaces of revolution?  Pass 1, 2026-10-28.
#
# Single-assessor Pass 1 for `thompson/claims/t1917-014_the-forms-of-cells.py` (v1, commit
# d762bb9c6).  LIMITATION: builder and assessor are the same cloud agent (claude-fable-5-1);
# no independent second assessor has scored this script yet (remediation R1).
#
# Headline of the round: Thompson's own 13 figured Lagena split cleanly.  The 8 flask/globular
# morphotypes (L/W <= pi) fit the Delaunay flask/bead composites at median nRMSE 0.049 (6 of 8
# under the 0.06 gate); the 5 slender spindles (L/W 4.7-10.9) cannot be any single unduloid
# (bead aspect bound L/W <= pi, Lean-checked) and fit at nRMSE 0.12-0.23.  Pass 1 has no
# photograph, no null/free-form comparison and no statistics beyond RMSE/Pearson r, so the
# verdict is deferred to Pass 2.

