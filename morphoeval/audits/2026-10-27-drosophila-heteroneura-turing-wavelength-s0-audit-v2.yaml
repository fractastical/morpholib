simulations:
  - id: delphi10000-drosophila-heteroneura-turing-wavelength-s0
    name: "Drosophila heteroneura detail-scale Turing wavelength (5.222 µm, Holocene 0 Ma), pass 2"
    organism: "Drosophila heteroneura"
    script: models/2026-delphi10000-drosophila-heteroneura-turing-wavelength-s0.py
    output: docs/media/drosophila_heteroneura_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: 2026-10-27-drosophila-heteroneura-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, murray1981, spieth1981, werner2010, pitnick1995, kondo2010]
    model_spec:
      sim_id: delphi10000-drosophila-heteroneura-turing-wavelength-s0
      parameters:
        a: 0.064
        b: 1.137
        gamma: 18.6
        diffusion_ratio: 36.5
        lambda_um: 5.222
        carrier_amplitude: 0.03
      inputs:
        - datasets/drosophila_heteroneura_turing_wavelength_s0/drosophila_heteroneura_specimen.jpg
        - datasets/drosophila_heteroneura_turing_wavelength_s0/drosophila_heteroneura_turing_wavelength_s0_reference.json
        - datasets/drosophila_heteroneura_turing_wavelength_s0/paper_citations.bib
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and Schnakenberg 1979 kinetics"
        - "Spieth 1981 documents the heteroneura hammerhead head relative to silvestris"
        - "Werner 2010: guttifera wing spots are Wingless-induced yellow melanin"
        - "Pitnick 1995: hydei is a giant-sperm repleta-group fly"
        - "Kondo and Miura 2010: reaction-diffusion as a wavelength-selection framework"
      reconstructed_in_script:
        - "a=0.064, b=1.137, Dv/Du=36.5, gamma=18.6 chosen so lambda_c is 5.222 µm"
        - "Neighbor gammas 12.579 and 7.188 give 6.350 µm and 8.400 µm"
        - "Head width 1.72 mm is reconstructed"
        - "Carrier amplitude 0.03 is a render weight, not a measured concentration"
      transfer_boundary:
        - "Chronoseries neighbors are extant comparisons at 0 Ma, not ancestors"
        - "The photographed rings (68.47 µm) and the critical carrier (5.222 µm) are different lengths on one sampling"
      does_not_claim:
        - "That 68.47 µm equals 5.222 µm"
        - "That kinetic constants were assayed in heteroneura tissue"
        - "A second independent assessor"
    summary: >-
      Pass 2 keeps the dispersion root at 5.222 µm (h(k_c)=-1802.8; ablation
      growth rate -5.106). The GIF adds a radial carrier of period 5.796 px
      at amplitude 0.03. CV similarity is 87.8 on 12 frames at 800x600.
      Pearson r is 0.98482, RMSE 0.01911, KS D 0.41875. Mode counts are
      329, 270, and 204, matching Loop_3188. Weighted rubric score is 87.8.
    scores:
      model-fidelity:
        value: 88
        rationale: "The rendered field now contains the critical carrier at lambda_c / scale_bar, on top of the Schnakenberg envelope. The eye still reads the 68 µm rings first; the carrier is a 0.03 modulation, which is what the sampling can hold without pretending the rings are 5.222 µm."
        evidence:
          - {file: models/2026-delphi10000-drosophila-heteroneura-turing-wavelength-s0.py, lines: [337, 348], note: "critical_carrier at 5.222 µm", supports: true}
          - {file: models/2026-delphi10000-drosophila-heteroneura-turing-wavelength-s0.py, lines: [460, 466], note: "carrier added to the steady field before the GIF", supports: true}
          - {file: datasets/drosophila_heteroneura_turing_wavelength_s0/fit_metrics.json, lines: [20, 26], note: "carrier_period_px 5.79642, amplitude 0.03", supports: true}
      specimen-match:
        value: 88
        rationale: "CV similarity 87.8 against the gallery micrograph (Sobel orientation, radial FFT, coherency, occupancy). Side-by-side rings match. The residual is grain and the black caption, which the simulation does not copy."
        evidence:
          - {file: docs/media/drosophila_heteroneura_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 800x600 growth GIF, CV 87.8", supports: true}
          - {file: docs/media/drosophila_heteroneura_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen, steady field, absolute difference, radial fit", supports: true}
      parameter-expressivity:
        value: 90
        rationale: "Raising gamma shortens lambda. Raising Dv/Du shortens lambda. Setting Dv/Du to 1 flips the growth rate from +7.38 to -5.11 and collapses the PDE variance amplification. The carrier amplitude is fixed and reported, not silently tuned after the CV score."
        evidence:
          - {file: models/2026-delphi10000-drosophila-heteroneura-turing-wavelength-s0.py, lines: [189, 226], note: "both sweeps and the spectral PDE", supports: true}
          - {file: datasets/drosophila_heteroneura_turing_wavelength_s0/fit_metrics.json, lines: [4, 12], note: "h(k_c) negative, ablation growth rate negative, PDE amplification large only when patterned", supports: true}
      morphometric-validation:
        value: 88
        rationale: "Pearson r 0.98482 versus a reference of 1 (not a copied profile). RMSE 0.01911 versus 0. KS D 0.41875 versus 0. Specimen stripe spacing 68.47 µm versus the 5.222 µm law. Mode counts 329 versus 204. Carrier period 5.796 px versus the 76 px ring spacing. None of these pairs are equal."
        evidence:
          - {file: models/2026-delphi10000-drosophila-heteroneura-turing-wavelength-s0.py, lines: [521, 640], note: "measure_morphoeval value/reference pairs", supports: true}
          - {file: datasets/drosophila_heteroneura_turing_wavelength_s0/fit_metrics.json, lines: [14, 52], note: "r, RMSE, KS, mode counts 204/270/329", supports: true}
      source-traceability:
        value: 88
        rationale: "Same pinned DOIs and specimen SHA-256 as pass 1, plus Kondo and Miura 2010 for the wavelength-selection framework. The gallery fallback is stated because Commons was empty."
        evidence:
          - {file: datasets/drosophila_heteroneura_turing_wavelength_s0/paper_citations.bib, lines: [41, 68], note: "Kondo and Miura, Werner, Pitnick entries", supports: true}
          - {file: datasets/drosophila_heteroneura_turing_wavelength_s0/scout_manifest.json, lines: [1, 30], note: "slot 3188 scout and collision note", supports: true}
      code-traceability:
        value: 86
        rationale: "critical_carrier, mode_count_nm, and the dispersion helpers are separate functions. mode_count_nm is 1720000//lambda_nm, the same division as the Lean theorems. The Lean file still does not prove the sign of h(k_c); the self-test does."
        evidence:
          - {file: models/2026-delphi10000-drosophila-heteroneura-turing-wavelength-s0.py, lines: [162, 186], note: "mode_count_nm and chronospecies", supports: true}
          - {file: morphoeval/lean/loops/Loop_3188_drosophila_heteroneura_turing_wavelength_s0.lean, lines: [29, 35], note: "mode-count theorems", supports: true}
      repro-package:
        value: 86
        rationale: "--self-test checks dispersion signs, Pearson r > 0.98, monotonic sweeps, ablation, Lean milli-integers, mode counts, GIF frames and resolution, and CV >= 58. Seed 3188. Input hashes are checked before the run."
        evidence:
          - {file: models/2026-delphi10000-drosophila-heteroneura-turing-wavelength-s0.py, lines: [633, 700], note: "assert_gates and render", supports: true}
          - {file: datasets/drosophila_heteroneura_turing_wavelength_s0/README.md, lines: [28, 38], note: "documented invocation", supports: true}
    remediation:
      - "R1 resolved: carrier period 5.79642 px at amplitude 0.03 is in fit_metrics.json and in the GIF."
      - "R2 resolved: mode counts are 329, 270, 204, matching Loop_3188."
      - "R3 open: still a single builder-assessor."
      - "R4 open: head width 1.72 mm remains a reconstruction."
