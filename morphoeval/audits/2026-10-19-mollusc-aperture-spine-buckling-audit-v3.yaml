simulations:
  - id: moulton-mollusc-aperture-spine-buckling
    name: "Moulton, Goriely & Chirat (2015) & Chirat et al. (2013) hierarchical mollusc aperture spine folding and fractal frond serration"
    organism: "Murex pecten (Venus comb murex) & Chicoreus ramosus (ramose murex / Muricidae)"
    script: models/2015-moulton-mollusc-aperture-spine-buckling.py
    output: docs/media/mollusc_aperture_spine_buckling_comparison.png
    extra_outputs:
      - docs/media/mollusc_aperture_spine_buckling_growth.gif
      - docs/media/mollusc_aperture_spine_buckling_koiter_cord_ontogeny.png
      - docs/media/mollusc_aperture_spine_buckling_cord_locking.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-mollusc-aperture-spine-buckling-audit-v2
    source_refs:
      - moulton2015
      - chirat2013
      - moulton2012
      - rudraraju2019
      - koiter1966
      - manor2008
    claim_boundary:
      reported_in_source:
        - "Chirat, Moulton & Goriely (2013): the mantle edge is an elastic strip growing against the calcified shell margin; excess growth gamma > gamma_c buckles it with wavelength lambda_1 ~ (E h_1^3 / 3 K_s)^(1/4) set by the mantle thickness and the foundation stiffness, giving comb spines along the siphonal canal of Murex pecten and varix spines in muricids"
        - "Moulton, Goriely & Chirat (2015): further growth folds each spine into a Kirchhoff elastica loop that self-contacts into a hollow tube, and thinner secondary/tertiary mantle generations produce the fractal frond cascade k_{i+1}/k_i = (h_i/h_{i+1})^(3/4) of Chicoreus ramosus"
        - "Rudraraju et al. (2019): the full problem is a finite-strain morphoelastic shell with surface and volume growth, solved by finite elements"
        - "Koiter (1966) and Manor, Hagberg & Meron (2008): the thin-shell energy used for the reduced surface model, and wave-number locking of a pattern-forming system to a spatially periodic forcing (Arnold tongues)"
      reconstructed_in_script:
        - "Hierarchical wavenumber law k_i^* = (3 K_s / (E h_i^3))^(1/4); 1-D unilateral fourth-order comb energy minimised by L-BFGS-B at the rounded mode q_mode = 2 pi round(L/lambda_1)/L; parametric omega-loop spine profile with a linear neck-gap law; prescribed 3-stage frond cosines; prescribed 120 deg varix bursts; 10-species cross-taxa table; DoG specimen segmentation (Pass 2)"
        - "Pass 3: reduced linearised Koiter/FvK surface w(s,t) on a 192x96 bi-periodic torus (L_s = 67.2 mm, L_t = 24 mm, D = 1, K_0 = (k_1^*)^4) with varix growth window P(t), additive cord ridge forcing, semi-implicit gradient flow + L-BFGS-B relaxation from noise, emergent spine count / cord-intersection registration / ridge tilt; locking-tongue and obliquity sweeps; inverse-WKB h(u) from the specimen spacing profile; graded-rigidity 1-D comb with uniform control; allometric instar series with Brent root beta*"
      transfer_boundary:
        - "The Koiter surface is linearised (no finite membrane strain, flat reference torus, nondimensional D = 1 with outputs labelled mm) and the planar elastica cross-section is not coupled to it; both are separate modules, so the Pass 2 item 1 (3D finite-strain Koiter FE coupling) is addressed only in reduced form"
        - "h(s) is inferred from a Murex pecten photograph via inverse WKB (R^2 = 0.29, floor 0.35), not measured by micro-CT, and the species is not the Chicoreus ramosus the Pass 2 item asked for; no Chicoreus specimen is vendored"
        - "The 1-D comb spine count 16, the 120 deg varix spacing, the Chicoreus k_2/k_1 = 3.80, the neck-gap delta -3.1059 mm, the specimen CV 0.2092 reference, beta* = 4/3 and the rigid-spine 22.8 deg are prescribed or self-referential and must not be read as validations"
      does_not_claim:
        - "A finite-strain shell FE solution, a numerically integrated Kirchhoff-Clebsch elastica, emergent fractal frond serrations, emergent varix periodicity, measured mantle thickness data for any species, or sourced empirical k_2/k_1 and spine counts for the 10 muricid species"
    summary: >-
      Pass 3 (v3) remediated evaluation of `2015-moulton-mollusc-aperture-spine-buckling.py`
      (weighted overall 87.5/100, DOWN from the 91.4/100 Pass 2 consensus). Both Pass 2 remediation items were
      closed with honestly labelled reduced models: a linearised Koiter/FvK mantle-margin surface with a varix
      growth window and oblique spiral-cord ridge forcing (`solve_koiter_shell_cord_spine_coupling`, L670-900;
      17 free vs 16 cord-locked emergent spines, registration 1.00, locking tongue [1,2,5,9], de-registration at
      psi* = 35.0 deg with spine-ridge tilt), and an inverse-WKB specimen thickness gradient feeding a
      graded-rigidity comb (r = 0.991 to the local WKB wavelength) and an allometric instar series (beta* = 4/3)
      (`infer_specimen_thickness_gradient` / `solve_graded_thickness_comb` / `evaluate_ontogenetic_instar_series`,
      L1008-1190). The new emergent solvers, relaxed from noise, expose that the Pass 2 1-D comb count is pinned
      to round(L/lambda_1) by construction (L230-263), that the elastica, frond cascade and varix cycle are
      parametric/prescribed (L367-375, L411-417, L457-462), and that five reference values are the script's own
      outputs; these are the Pass 4 items. 13 self-test checks pass (74 s), 5 Lean theorems verify with 0 sorry,
      5 dataset files are SHA-256-pinned, and the 3x3 figure, two GIFs and a standalone Pass 3 figure render.
    scores:
      model-fidelity:
        value: 88
        rationale: >-
          Credit: the Pass 3 Koiter/FvK surface is a genuine reduced shell model — bilaplacian bending, varix
          pre-compression P(t) along s, Winkler foundation K_0 = (k_1^*)^4 from the Moulton-Chirat law, cubic
          saturation, and additive cord ridge forcing — relaxed from band-limited noise so the spine count (17
          free vs theory 16.47; 16 when cord-locked) and the cord registration are emergent, not seeded
          (L670-900); the Mathieu k_c/2 pumping argument for rejecting stiffness modulation (L744-748) is correct
          physics; the graded-rigidity comb D(s) = (h/h_bar)^3 with local P_c(s) reproduces the WKB spacing law
          (L1047-1148); the instar scaling N_1 ∝ L^(1-3 beta/4) is exact (L1151-1190) and both laws are
          machine-checked (Lean Laws 4-5). Deductions: the Pass 2 1-D comb is not an emergent solver — the
          foundation is built from the rounded mode q_mode = 2 pi round(L/lambda_1)/L and the initial guess is the
          16-mode itself (L230-263), so N = 16 is prescribed (-3); the "Kirchhoff-Clebsch elastica" does not
          integrate the ODE at L43-44, it draws a parametric omega loop with a linear neck-gap law and an uncited
          height law 4.8 sqrt(gamma - gamma_c) (L364-375) (-3); the frond cascade and the 120 deg varix cycle are
          prescribed cosines and bursts (L411-417, L457-462), only the k-ratios come from the model (-2); the
          Koiter model is linearised on a flat torus with nondimensional D = 1 but mm-labelled outputs, and the
          elastica cross-section is not coupled to it (-2); K_s = 0.48 for the frond cascade vs K_s_eff = 1.98
          for the comb/Koiter solvers are two different foundation stiffnesses for the same law (L163, L213,
          L677) (-1); Pass 2 credited 93 for solvers that this pass shows were templated, so the dimension falls.
        evidence:
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [670, 900], note: "Pass 3 reduced Koiter/FvK surface: bilaplacian + P(t) w_ss + K_0 w + kappa_3 w^3 - f_cord, varix tanh window (L727-731), cord ridge forcing with Mathieu justification (L744-748), noise init + gradient flow + L-BFGS-B, emergent count / registration / tilt (L835-865)", supports: true}
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [1047, 1190], note: "Graded-rigidity comb D(s)=(h/h_bar)^3 with local P_c(s) and uniform control; allometric instar series with Brent root beta* = 4/3", supports: true}
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [230, 263], note: "1-D comb foundation k_sub = q_mode^4 with q_mode = 2 pi round(L/lambda_1)/L and 16-mode seeded init: spine count 16 is prescribed, theory gives 16.47", supports: false}
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [364, 375], note: "Elastica is a parametric omega loop (cos^1.8 profile) with linear neck gap and height 4.8 sqrt(gamma-gamma_c); the ODE in the header (L43-44) is not integrated", supports: false}
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [411, 417], note: "Frond stages are hand-drawn cosines; only k2_ratio / k3_ratio come from the wavenumber law", supports: false}
          - {file: morphoeval/lean/loops/Loop_077_mollusc_aperture_spine_buckling.lean, lines: [127, 188], note: "Laws 4-5: cord/varix intersection count = free spine count when lambda_c cos_den = lambda_1 cos_num; spine-count exponent 4 - 3 beta vanishes iff beta = 4/3; 0 sorry", supports: true}
      specimen-match:
        value: 86
        rationale: >-
          Credit: the SHA-256-locked *Murex pecten* specimen is now used quantitatively twice — DoG comb
          segmentation (n = 16, CV = 0.2092; `segment_murex_specimen`, L559-634) and, new in Pass 3, its 15
          inter-spine spacings drive the inverse-WKB thickness profile h(u)/h_bar = (lambda/lambda_bar)^(4/3)
          that is then tested against the graded comb (panel I, L1486-1517; CV 0.112 emergent vs 0.209
          specimen); the specimen is visible in panels F and I of the 3x3 figure and the Koiter surface in panel
          G shows cord-registered spines in 3-D (`render_pass3_koiter_figure`, L1573-1649). Deductions: every
          *Chicoreus ramosus* claim (frond cascade, h(s) across instars) has no specimen — the Pass 2 item
          explicitly asked for Chicoreus thickness data and the closure uses a Murex photograph (-6); the
          two-harmonic thickness fit has R^2 = 0.29 and is floored at 0.35 (L1031), so the inferred
          h_max/h_min = 1.71 is weakly constrained, and the first segmented spacing (find_peaks distance = 26 px,
          L585) is plausibly a spurious peak that inflates the gradient (-4); the emergent graded-comb CV (0.112)
          reaches only about half the specimen CV (-2); the cord-locking GIF and Koiter surface are compared with
          no muricid varix photograph (-2).
        evidence:
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [559, 634], note: "DoG comb-spine segmentation on the SHA-256-locked Murex pecten specimen (find_peaks distance 26 px at L585)", supports: true}
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [1008, 1044], note: "Inverse-WKB thickness profile from the specimen's 15 spacings; two-harmonic periodic fit R^2 = 0.29 with a 0.35 floor (L1031) — quantitative specimen use but weakly constrained", supports: true}
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [1486, 1517], note: "Panel I: specimen spacing vs WKB fit vs emergent graded spacing vs uniform control", supports: true}
          - {file: docs/media/mollusc_aperture_spine_buckling_comparison.png, lines: [0, 0], note: "3x3 synthesis figure: Murex comb, elastica closure, Chicoreus frond, varix cycle, 10-species scaling, specimen segmentation, Koiter surface (G), locking tongue (H), thickness gradient (I); no Chicoreus specimen anywhere", supports: true}
          - {file: docs/media/mollusc_aperture_spine_buckling_koiter_cord_ontogeny.png, lines: [0, 0], note: "Standalone Pass 3 figure: 3-D Koiter surface with cord-registered spines, obliquity de-registration + tilt, graded comb with h(s), instar series; compared with no varix photograph", supports: true}
          - {file: datasets/mollusc_aperture_spine_buckling/README.md, lines: [37, 49], note: "Pass 3 section states the h(s) is inferred from the Murex specimen, not measured, and that no Chicoreus specimen is vendored", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          Credit: Pass 3 adds five live CLI flags `--cord-angle`, `--eps-cord`, `--n-cords`, `--beta`,
          `--skip-pass3-media` (L1988-1992) threaded through `compute_pass3_bundle` (L1193-1238, L2015);
          the locking-tongue sweep spans n_cords 12-20 x eps in {0, 0.01, 0.04, 0.15} with the eps = 0 control
          recovering the free mode (`sweep_cord_locking`, L902-938); the obliquity sweep covers realised psi in
          {0, 9.9, 19.3, 27.7, 35.0} deg with registration, tilt and the rigid-spine sinc(delta phi) prediction
          (`sweep_cord_obliquity`, L941-990); the beta sweep {0.75, 1, 4/3, 1.5} gives slopes {+0.44, +0.25, 0,
          -0.125}; the Pass 2 gamma sweep (0.96 / 1.26 / 1.42 / 1.68) and 3 frond generations remain.
          Deductions: `--K-s` reaches only the frond synthesiser (L1263, `K_s_MPa_per_mm`) while the comb, Koiter
          and graded solvers use the separate default `K_s_eff = 1.98` (L213, L677, L907, L947, L1052) — so the
          flag does not move the headline spine counts (-5); `--gamma-varix` changes only the Koiter height scale,
          never the wavelength (frozen at onset by design, L721-725), and `--E` does not reach the elastica/varix
          modules (-3); the obliquity is quantised to integer m_t for bi-periodicity so the requested psi is only
          approximately realised (L737-740) (-2); the `--self-test` help string still says "8-check" (L1981) (-1).
        evidence:
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [1981, 1992], note: "CLI: --self-test (help text stale: '8-check'), --E, --K-s, --gamma-varix, --seed, plus Pass 3 --cord-angle, --eps-cord, --n-cords, --beta, --skip-pass3-media", supports: true}
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [902, 990], note: "Locking-tongue sweep (n_cords x eps_cord, eps = 0 control) and obliquity sweep with sinc(phase drift) rigid-spine prediction", supports: true}
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [1259, 1263], note: "--K-s is passed only to synthesize_chicoreus_fractal_frond; comb/Koiter/graded solvers use K_s_eff = 1.98 defaults (L213, L677, L1052)", supports: false}
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [1151, 1190], note: "beta sweep {0.75, 1, 4/3, 1.5} and Brent root for the spine-count-conserving exponent", supports: true}
      morphometric-validation:
        value: 84
        rationale: >-
          Credit: `measure_morphoeval()` (L1681-1871) now returns 17 reference-anchored entries; the 8 new ones
          are genuinely emergent or inferred quantities with meaningful nulls — free Koiter spine count 17 vs
          16.47 theory, cord registration 1.00 vs 0.5 chance, de-registration psi* 34.99 deg vs the 22.78 deg
          rigid estimate (the gap is interpreted as tilt compensation), spine tilt 10.45 deg at psi = 19.3 deg,
          WKB spacing Pearson r = 0.9907 vs 1.0, graded CV 0.112 vs specimen 0.209, h_max/h_min 1.71 vs the
          uniform null 1.0, beta* = 1.3333 vs 4/3 (L1698-1776). Deductions: five Pass 2 / Pass 3 reference
          values are the script's own output or an analytic identity — the neck-gap delta reference -3.1059 mm
          (L1826) is the linear formula's result, the specimen CV reference 0.2092 (L1866) is the measured value,
          the Chicoreus k_2/k_1 reference 3.80 (L1806) is achieved by choosing h_2 = 0.0708 so that
          (0.42/0.0708)^(3/4) = 3.80 (L182, L391), beta* = 4/3 (L1773) is the trivial root of 4 - 3 beta, and
          the 22.78 deg "reference" (L1236) is the script's own rigid-spine estimate (-7); the "L-BFGS-B relaxed
          spine count 16.0 vs 16.0" (L1812-1820) and the "120.0 deg" varix spacing (L1832-1840) are prescribed,
          as shown under model-fidelity (-5); the 10-species cross-taxa correlations (r = 1.0000, 0.9987;
          `evaluate_cross_taxa_muricids`, L497-556) rest on `k2_over_k1_obs` / `n_primary_spines_obs` values in
          the reference JSON that equal the predictions to rounding and are not sourced to any measurement (-4);
          no empirical thickness or varix morphometric exists for the new Pass 3 quantities (-3); Pass 2 credited
          92 for a set whose anchors this pass finds largely self-referential, so the dimension falls.
        evidence:
          - {file: models/2015-moulton-mollusc-aperture-spine-buckling.py, lines: [1681, 1776], note: "measure_morphoeval(): 8 new Pass 3 entries (Koiter free count, registration, de-registration psi*, tilt, WKB r, graded CV, h ratio, beta*) with chance / uniform / theory nulls", supports: true}
