    remediation:
    - >-
      2015-moulton-mollusc-aperture-spine-buckling.py:230-263 — `solve_murex_siphonal_comb` builds the foundation
      from the rounded mode q_mode = 2 pi round(L/lambda_1)/L (k_sub = q_mode^4, L256) and seeds the 16-mode
      (L263), so the "L-BFGS-B relaxed spine count 16.0 vs 16.0" measurement (L1812-1820) is prescribed. Replace
      with the Koiter-style noise initialisation on K_0 = (k_1^*)^4 (as at L670-900) so the count is emergent
      (theory 16.47), and relabel the measurement; also make `EI_eff`, `P_load`, `kappa_3` dimensional or drop the
      `_mm` suffixes (L255-260).
    - >-
      2015-moulton-mollusc-aperture-spine-buckling.py:335-386 and 43-44 — `solve_kirchhoff_elastica_spine_loop`
      does not integrate the Kirchhoff-Clebsch ODE stated in the header; it draws a parametric omega loop
      (cos^1.8 profile, L375) with a linear neck gap (L364) and an uncited height law 4.8 sqrt(gamma - gamma_c)
      (L368, reused at L747). Integrate the elastica with unilateral self-contact (shooting or collocation) and
      couple its cross-section to the Koiter surface height scale, closing the residual of Pass 2 item 1.
    - >-
      2015-moulton-mollusc-aperture-spine-buckling.py:411-417 and 457-462 — the Chicoreus frond stages are
      hand-drawn cosines and the varix cycle prescribes 120 deg Gaussian bursts, so the k_2/k_1 = 3.80 (L1806; h_2 =
      0.0708 chosen at L182/L391 to hit it) and the 120.0 deg (L1836) measurements are circular. Derive the
      secondary serrations by solving the comb energy on the primary frond with h_2, and let varix spacing emerge
      from a growth-rate / rest-period dynamic (Lean Law 3) instead of a prescribed gamma(phi).
    - >-
      2015-moulton-mollusc-aperture-spine-buckling.py:1826, 1866, 1773, 1236 — reference values that equal the
      script's own output or an analytic identity (neck-gap delta -3.1059; specimen CV 0.2092; beta* = 4/3; rigid
      psi* 22.78 deg). Replace each with an external anchor (e.g. literature spine-spacing CV for Murex pecten,
      measured neck gaps from Moulton 2015 Fig. 6) or mark `reference_value: null` with `derived_from: model`.
    - >-
      2015-moulton-mollusc-aperture-spine-buckling.py:497-556 with
      datasets/mollusc_aperture_spine_buckling/mollusc_aperture_spine_buckling_reference.json:114-150 —
      `k2_over_k1_obs`, `n_primary_spines_obs`, h_1 and h_2 per species have no measurement source and match the
      predictions to rounding (r = 1.0000 / 0.9987). Source each row to a published figure/table or relabel the
      table as model-generated and drop the two cross-taxa correlations from `measure_morphoeval()`.
    - >-
      2015-moulton-mollusc-aperture-spine-buckling.py:163, 213, 677 — two foundation stiffnesses for the same law
      (K_s = 0.48 for the frond cascade, K_s_eff = 1.98 for comb/Koiter/graded); `--K-s` (L1985) reaches only the
      frond synthesiser (L1263). Unify on one sourced K_s (or document the effective-vs-material distinction) and
      thread `--K-s` and `--E` through every solver including the elastica and varix modules; fix the stale
      "8-check" help text (L1981).
    - >-
      2015-moulton-mollusc-aperture-spine-buckling.py:1008-1044 and 585 — the inverse-WKB thickness profile is
      inferred from a Murex pecten photograph (two-harmonic fit R^2 = 0.29, arbitrary 0.35 floor at L1031) and
      the first segmented spacing (find_peaks distance 26 px) is plausibly spurious. Vendor measured mantle-edge
      h(s) cross-sections (micro-CT or histology) for *Chicoreus ramosus* across at least two instars with the
      empirical allometric exponent beta, and exclude or justify the first spacing.
    - >-
      2015-moulton-mollusc-aperture-spine-buckling.py:670-900 — the Koiter surface is linearised on a flat
      bi-periodic torus with D = 1 (nondimensional) and periodic t with subcritical margins; the free count 17
      is quantised by the domain and shifted by onset excess (q_max = sqrt(P/2)); `converged` falls back to a
      gradient-norm test at maxiter (L817); the height-modulation metric is uninformative for locked patterns.
      Add reference-surface curvature and finite membrane strain (or a true FE shell per Rudraraju 2019), report
      D in N mm, test domain-size independence of the free count, and remove or replace the hmod metric.
    - >-
      2015-moulton-mollusc-aperture-spine-buckling.py:1874-1976 — self-test wall time ~65-75 s because the
      locking and obliquity sweeps run at full resolution; add a reduced-resolution fast path (n_s = 96, n_t = 48
      as at L1941) for the sweeps under `--self-test` and keep the full sweeps behind a flag.
