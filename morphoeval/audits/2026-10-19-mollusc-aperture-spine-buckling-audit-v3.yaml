# MorphoEval Pass 3 (v3) Audit — Moulton, Goriely & Chirat (2015) J. Theor. Biol. & Chirat et al. (2013) PNAS Mollusc Aperture Spine Buckling, 2026-10-20 (v3)
#
# Pass 3 re-score of `2015-moulton-mollusc-aperture-spine-buckling.py` (now 2029 lines; 13 self-test checks;
# 17 `measure_morphoeval()` entries) after the remediation of both open Pass 2 items in the instrumented loop
# `morphoeval/runs/2026-10-19-mollusc-aperture-spine-buckling-loop-pass3`, superseding
# `2026-10-19-mollusc-aperture-spine-buckling-audit-v2` (91.4 consensus).
#   - Primary assessor: Claude Fable 5.1 (Pass 3 Phase B audit agent), scoring from the Phase A handoff note,
#     `git diff` of the script and Lean module, a fresh `--self-test` run (PASSED 13/13, 74 s) and `lean` (exit 0).
#   - Second assessor block kept from v2 for provenance continuity; no blinded second pass was run in Pass 3.
#
# What Pass 3 changed (both Pass 2 remediation items, closed with REDUCED models — not the full requested ones):
#   1. Reduced Koiter / Föppl-von-Kármán thin-shell surface w(s,t) of the mantle margin on a bi-periodic torus
#      with a tanh varix growth window P(t) and additive oblique spiral-cord ridge forcing
#      f_cord = eps_cord K0 A_onset cos(k_c (s cos psi + t sin psi)) (`solve_koiter_shell_cord_spine_coupling`,
#      L670-900), relaxed from band-limited noise by semi-implicit gradient flow + L-BFGS-B. Emergent spine count
#      17 free (theory 16.47) vs 16 cord-locked (registration 1.00); Arnold-type locking tongue widths [1,2,5,9]
#      over eps in {0, 0.01, 0.04, 0.15} (`sweep_cord_locking`, L902-938); oblique de-registration at
#      psi* = 35.0 deg vs rigid-spine estimate 22.8 deg with partial spine-ridge tilt following
#      (`sweep_cord_obliquity`, L941-990). A pure foundation-stiffness modulation at k_c was tested and abandoned
#      (it parametrically pumps k_c/2, Mathieu). NOT a 3D finite-strain Koiter FE shell; the planar elastica
#      cross-section module is still a separate module (its height law is reused at L747 only as a scale).
#   2. Inverse-WKB mantle-edge thickness profile h(u)/h_bar = (lambda(u)/lambda_bar)^(4/3) inferred from the
#      *Murex pecten* specimen's 15 inter-spine spacings (`infer_specimen_thickness_gradient`, L1008-1044;
#      two-harmonic fit R^2 = 0.29, h_max/h_min = 1.71), fed into a graded-rigidity comb D(s) = (h/h_bar)^3
#      (`solve_graded_thickness_comb`, L1047-1148; Pearson r = 0.991 between emergent spacing and WKB
#      lambda(s); uniform control CV ~ 0) and an allometric instar series with Brent root beta* = 4/3
#      (`evaluate_ontogenetic_instar_series`, L1151-1190). NOT micro-CT data and NOT *Chicoreus ramosus*.
#   3. Main figure 2x3 -> 3x3 (panels G-I), standalone `render_pass3_koiter_figure` (L1573-1649) and
#      `render_cord_locking_gif` (L1652-1676); 5 new live CLI flags (L1988-1992); 5 SHA-256-pinned dataset files
#      (`pass3_koiter_cord_thickness_reference.json` added, L119-121); `pass3_citations.bib`; README Pass 3 section.
#   4. Lean: 2 new theorems (`cord_varix_intersection_registration`, `ontogenetic_spine_count_conservation`),
#      5 total, 0 sorry, 0 warnings; registered as equations 4-5 in the math KG YAML.
#
# Scores below are the primary assessor's: weighted overall 87.5 (dimension mean 88.0). The overall score goes DOWN relative to v2 (91.4) because reading the
# remediated script against the new emergent solvers exposed that most of the Pass 2 headline numbers were
# prescribed or self-referential: the 1-D comb spine count is pinned to round(L/lambda_1) = 16 by construction and
# seeded with the 16-mode (L230-263), the "elastica" is a parametric omega-loop (L367-375), the frond cascade and
# the 120 deg varix spacing are hand-drawn cosines / prescribed bursts (L411-417, L457-462), and five of the
# reference values equal the script's own outputs (L1806, L1826, L1866, L1773, L1236). Line numbers refer to
# the files at commit 9987db7d (working tree with the Phase A edits applied).

