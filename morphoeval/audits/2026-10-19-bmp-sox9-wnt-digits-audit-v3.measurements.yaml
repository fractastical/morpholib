    claim_boundary:
      reported_in_source:
      - 'Raspopovic et al. (2014): a 3-node network of cell-autonomous Sox9 with diffusing Bmp and Wnt (Sox9 represses
        both ligands, Bmp activates and Wnt represses Sox9) is Turing-unstable without ligand self-activation; Sox9
        digit stripes are out of phase with Bmp and Wnt; on the growing autopod a distal FGF / Hoxd gradient that
        lengthens the wavelength keeps the stripes unbranched, and the growing-domain simulations were run on a
        realistic limb-bud growth map (Marcon et al. 2011)'
      - 'Sheth et al. (2012): digit number scales with autopod width / Hox dosage through the Turing wavelength'
      - 'Crampin, Gaffney & Maini (1999): on a growing domain every species acquires the dilution term -(div u)
        c and modes are inserted sequentially as the domain lengthens'
      - 'Boehm et al. (2010): finite-element limb-bud growth; a proliferation gradient alone does not explain the
        bud shape'
      - 'Farin et al. (2013): E12.5 Sox9 / E13.5 Col2a1 WISH of wild-type (5) and Tbx2-/- (6) digit condensations
        (the vendored specimen)'
      - 'Shubin & Alberch (1986): the digital arch forms posterior to anterior with the marginal digit I last'
      reconstructed_in_script:
      - 3-node and reduced 2-diffuser Jacobians, dispersion relation and D = 0 control (Laws 1-3); 1D distal-arc
        explicit solver; 2D polar-fan finite-difference solver carried from v2; 7-regime FGF/Hox table; 6-condition
        perturbation suite; DoG + chromogen segmentation of the WISH specimen (5 WT vs 6 Tbx2-/- rays)
      - 'Pass 3: P1 finite-element solver on a Lagrangian / ALE polar-fan mesh with a moving AER boundary, implicit
        diffusion, conservative lumped-mass dilution, re-assembled stiffness, AER-anchored wavelength modulation
        with three modes, FEM verification against the analytic dispersion relation, growth-dilution sweep, final-arc
        sweep, 3 x 3 modulation ablation, 9 new reference-anchored measurements and 3 new Lean theorems (Laws 4-6)'
      transfer_boundary:
      - 'The mesh is a prescribed polar fan (r_prox = 4.2, R: 5.0 -> 8.4, theta_max = 0.38 pi) with a uniform radial
        Lagrangian stretch and an exponential-then-capped outgrowth law; there is no proliferation field, no realistic
        bud outline, no dorsoventral axis and no measured growth kinetics'
      - The FGF / Hoxd modulation enters as D ∝ (r / R(t))^2 (lambda ∝ r / R(t)); this is the unique modulation
        that keeps sigma_max fixed while scaling lambda with the arc, not an equation of Raspopovic et al. (2014),
        whose supplementary modulation functions were not retrieved
      - All new reference values are analytic consequences of the baseline parameters (dispersion relation, Lean
        Laws 4-6) or qualitative statements from the papers; no digitised stripe count, growth curve or width-vs-digit-number
        data are vendored
      - The v2 7-regime FGF/Hox collapse depends on a fitted exponent (3.12) in a diffusion scaling that the network
        itself does not produce; the v2 LDN / CHIR digit counts are capped by hand; the v2 2D polar-fan result is
        mode-seeded and cosmetically masked (all three are disclosed here and carried as Pass 4 items)
      does_not_claim:
      - A reproduction of the Raspopovic et al. (2014) supplementary growing-domain simulations, measured outgrowth
        kinetics of the mouse limb bud, the posterior-to-anterior order of digit condensation (the model inserts
        new rays in the interior), chondrogenic condensation mechanics, 3D geometry, or digit identity
