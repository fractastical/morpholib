    claim_boundary:
      reported_in_source:
        - "Yang et al. (2022): the ossicles of Protoreaster nodosus are single-crystal calcite shaped as a diamond-type TPMS lattice with [111] along the c-axis; under nanoindentation, twin bands and dislocations are arrested at the strut-pore free surfaces, confining damage to indent-adjacent struts (3D crystal-plasticity FEM in the paper)"
        - "Donnay & Pawson (1969): every echinoderm skeletal element diffracts as a single calcite crystal"
        - "Beniash et al. (1997), Politi et al. (2008), Vidavsky et al. (2014), Wilt (2002): sea urchin larval spicules are deposited as ACC delivered in ~1 um vesicles into a syncytial membrane cavity and transform to calcite by secondary nucleation propagating from a single seed granule"
        - "Eshelby, Frank & Nabarro (1951): a pile-up of n = pi(1-nu) L tau/(mu b) dislocations against an obstacle over a glide length L concentrates a head stress n tau"
      reconstructed_in_script:
        - "3D nodal TPMS level sets and implicit-surface curvature for Diamond D, Gyroid G, Primitive P, a Cahn-Hilliard spinodal control and a pinch-off ablation (Pass 2); level-set threshold sweep; Gibson-Ashby stretching vs bending scaling; DoG segmentation of the vendored crinoid ossicle SEM plate (Pass 2)"
        - "Pass 3: a reduced 2D plane-strain Q4 crystal-plasticity FEM of flat-punch nanoindentation on the [111]-projected Diamond skeletal honeycomb section vs a monolith at equal depth with two e-twin variants, lamella run lengths by ray marching, pore-adjacent arrest fraction, r90 damage radius and P/P_elastic; an Eshelby-Frank-Nabarro pile-up scaling in strut / ossicle / monolith glide lengths; a stochastic 2D syncytial-templating model of ACC vesicle delivery with secondary vs primary nucleation and templating / nucleation ablations"
      transfer_boundary:
        - "The FEM is a 2D plane-strain honeycomb section (bending-dominated; the 3D Diamond TPMS is stretching-dominated), with a single twin family (no r/f slip, both twin senses allowed via |tau|), isotropic elasticity for trigonal calcite, a flat punch rather than a Berkovich tip, no fracture coupling, and tau_twin = 500 MPa as a scale parameter (depth-normalised outputs are tau-invariant, absolute depths are not)"
        - "The templating model's kinetics (k_1, k_2, p_out, vesicle flux, front reach) are modelling choices not fitted to the Politi 2008 / Beniash 1997 ACC-fraction time courses; the template is the adult stereom honeycomb, not a larval triradiate spicule; no membrane mechanics or Mg/protein ACC stabilisation"
        - "The specimen plate is an adult Nesometra integra calyx ossicle; the slot organism is Metacrinus rotundus and the seed paper's organism is the starfish Protoreaster nodosus. The specimen reference values in the JSON (phi = 0.5187, a_0 = 14.80 um) are the script's own Pass 2 outputs, not independent literature values"
      does_not_claim:
        - "Reproduction of Yang et al. (2022) load-depth curves or twin-band micrographs; a physically faithful [111] projection (the Pass 2 projection integrates over a partial period and is flagged below); literature-digitised validation of the 12-species table (synthetic, flagged below); online-verified DOIs for the seven Pass 3 references"
    summary: >-
      Pass 3 (v3) re-score of `2020-gorzelak-crinoid-stereom-gyroid.py` after both v2 remediation items were
      closed with reduced-but-real models: a plane-strain Q4 crystal-plasticity FEM of e-twin band arrest under
      flat-punch nanoindentation on the [111]-projected Diamond skeletal section vs a monolith at equal depth
      (`solve_nanoindentation_twin_plasticity`, L692-868; `evaluate_nanoindentation_twin_arrest_fem`, L908-974:
      twinned-area ratio 0.123 vs null 0.50, max lamella 2.78 um <= projected bond 6.04 um vs 16.8 um in the
      monolith, k_lat/k_mono = 0.193) plus an Eshelby-Frank-Nabarro pile-up scaling (L871-905), and a stochastic
      syncytial ACC-vesicle templating model with secondary-nucleation single-crystallinity
      (`simulate_syncytial_acc_templating`, L1155-1269; ablations L1272-1314: IoU 0.753 vs 0.418, 2 vs 239 vs 4913
      domains). Two new Lean 4 theorems (6 total, 0 sorrys), 7 new measurements (16 total), 3 new self-test checks
      (11 total) and a SHA-256-pinned reference JSON with per-row provenance flags were added. The overall score
      nevertheless falls from 91.7 to 88.2 (rubric-weighted) because the re-audit found that several Pass 2 validations credited by
      the v2 score are artefacts or circular: the [111] projection integrates over a partial period (L558) and the
      edge dislocation is a hard-coded winding ansatz (L592); the 12-species table is synthetic with
      e_rel_obs = e_rel_pred +/- 0.002 (JSON L86-98) so r = 0.9997 is circular; the specimen reference values and
      DEFAULT_A0_UM are the script's own outputs written back; the Schoen DOI is wrong and all seven new DOIs are
      unverified offline; and `--a0` / `--c-thresh` are partially dead. These, together with the reduced-model
      residuals of the new FEM and templating code, are the Pass 4 remediation list.
