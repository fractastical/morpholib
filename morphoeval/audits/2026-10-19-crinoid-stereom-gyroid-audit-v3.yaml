          along w in [0, 2 pi) instead of the full [111] period 2 pi sqrt(3) (L558), so Panel D's hexagonal
          contrast is a partial-period artefact, and its edge dislocation is a phase-winding ansatz with
          burgers_winding = 1.0 hard-coded (L582-592) (-4); the FEM is a 2D plane-strain honeycomb section of a
          3D stretching-dominated lattice with one twin family, |tau| used for both twin senses (L798-802), no
          r/f slip, isotropic elasticity and no fracture, so it cannot be compared with Yang et al.'s load-depth
          or twin-band data (-3); the templating kinetics are unfitted model choices and the template is the
