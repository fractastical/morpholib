# MorphoEval audit — Yang et al. (2022) Science & Donnay & Pawson (1969) Science Biogenic Single-Crystal Calcite TPMS Echinoderm Stereom, 2026-10-19 (v3)
#
# Pass 3 re-score of `2020-gorzelak-crinoid-stereom-gyroid.py` (2198 lines, was 1169 at v2) and
# `datasets/crinoid_stereom_gyroid/` after the remediation of both open v2 items in the instrumented
# loop `morphoeval/runs/2026-10-19-crinoid-stereom-gyroid-loop-pass3`, superseding
# `2026-10-19-crinoid-stereom-gyroid-audit-v2` (91.7). Scored from the Phase A handoff evidence, the
# git diff of the script and Lean file, and line-pinned inspection of the files at commit 9987db7d.
#
# What Pass 3 changed (both v2 remediation items):
#   1. Nanoindentation crystal-plasticity FEM (Section 4b, L609-974): plane-strain Q4 half-space built from
#      the [111] projection of the Schwarz-Diamond skeletal graph (honeycomb, projected bond a_0/sqrt(6) = 6.04 um,
#      phi = 0.500, single connected solid, 120x120 elements), flat-punch displacement control, two calcite e-twin
#      variants (plane poles +/-26.25 deg from c, Schmid tensor m = sym(s (x) n)), perfectly plastic |tau_rss| <= tau_twin,
#      twin-shear exhaustion |gamma| <= 0.694, initial-strain iteration with one `splu` factorisation per structure,
#      lattice vs monolith at equal depth (delta/delta_on in {1, 2, 4, 6}): twinned area ratio 0.123 at 4x (null phi = 0.50),
#      max lamella 2.78 um <= bond 6.04 um vs 16.8 um monolith, k_lat/k_mono = 0.193; Eshelby-Frank-Nabarro pile-up
#      n = pi(1-nu)L tau/(mu b) for strut vs ossicle vs 1 mm monolith (L871-905). New 4-panel figure
#      `docs/media/crinoid_stereom_gyroid_twin_arrest_fem.png` and main-figure Panels G/H.
#   2. Syncytial ACC templating (Section 6b, L1155-1314): stochastic delivery of 1 um ACC vesicles into the [111]
#      skeletal section (syncytial cavity) with p_in = 1 / p_out = 0.03 vs a flux-matched untemplated control, single
#      seed granule, ACC -> calcite by secondary nucleation (k_2 = 0.6) or rare primary nucleation (k_1 = 1e-7):
#      IoU 0.753 vs 0.418, vesicle-inside fraction 0.976 vs 0.510, 2 vs 239 vs 4913 domains, ACC fraction 0.030 at
#      48 h; Panel I and `docs/media/crinoid_stereom_gyroid_spiculogenesis.gif`.
#   3. 2 new Lean 4 theorems (6 total, 0 `sorry`s), 7 new reference-anchored measurements (16 total), 3 new self-test
#      checks (11 total), new SHA-256-pinned `nanoindentation_spiculogenesis_reference.json` with per-row provenance
#      flags, `pass3_citations.bib`, README addendum, CLI `--n-fe` / `--tau-twin`.
#
# Why the score goes DOWN (91.7 -> 88.2 rubric-weighted; dimension mean 88.6) despite closing both items: the re-audit exposed defects that the v2
# score had credited as validation. (a) The Pass 2 "[111] projection" integrates over only w in [0, 2 pi) of the
# 2 pi sqrt(3) period along [111]; over the full period the projected D density is uniform, so Panel D's hexagonal
# contrast is a partial-period artefact and its "edge dislocation" is a hand-built winding ansatz with
# burgers_winding = 1.0 hard-coded. (b) The 12-species table in the reference JSON has e_rel_obs = e_rel_pred +/- 0.002
# for every row with no per-row provenance, so r = 0.9997 is circular. (c) The specimen references (phi = 0.5187,
# a_0 = 14.80 um, CV = 0.336) are the script's own Pass 2 outputs written back into the JSON and DEFAULT_A0_UM, so the
# specimen self-test is self-fulfilling. (d) Schoen (1970) carries a J. Math. Phys. DOI and all 7 new DOIs are
# recalled offline (flagged, unverified). (e) `--a0` / `--c-thresh` are partially dead. These are now listed under
# `remediation` for Pass 4 together with the reduced-model residuals of the new FEM and templating code.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files at commit 9987db7d (script path models/2020-gorzelak-crinoid-stereom-gyroid.py).

