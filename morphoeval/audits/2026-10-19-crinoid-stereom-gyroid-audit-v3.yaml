    organism: "Protoreaster nodosus (Asteroidea) & Metacrinus rotundus / Nesometra integra (Crinoidea) / Cidaris rugosa (Echinoidea); larval spiculogenesis after Strongylocentrotus purpuratus (Echinoidea)"
