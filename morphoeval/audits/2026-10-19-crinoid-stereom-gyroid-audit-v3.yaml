          per structure, displacement-controlled flat punch, lattice vs monolith at equal depth (L692-868,
          L908-974) — and the pile-up scaling is the Eshelby-Frank-Nabarro formula (L871-905); the templating
          model encodes the Politi secondary-nucleation vs primary-nucleation distinction and the Beniash /
