# MorphoEval audit — Trushko et al. (2020) Dev. Cell, Hannezo et al. (2014) PNAS & Zoelly (1915) Spherical Epithelial Cyst Buckling Under Alginate Confinement, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2019-trushko-epithelioid-cyst-buckling.py` (219 lines)
# prior to Step 12 remediation in `2026-10-19-epithelioid-cyst-buckling-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.2 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `generate_parametric_cyst_contour` (L50-65) uses a prescribed Gaussian radial dent
#      profile rather than minimizing a nonlinear Föppl-von Kármán / vertex-elastic spherical
#      shell & ring energy functional subject to inner alginate capsule wall confinement and
#      lumen/cell volume constraints.
#   2. `evaluate_baseline_regimes` (L68-96) omits the unconfined / ultra-soft alginate
#      negative control (`E_alg = 0.4 kPa`, `P < P_c`, unbuckled sphere `delta/R_0 = 0`),
#      omits the 12-point `(h/R_0)` critical buckling pressure scaling sweep across MDCK and
#      Caco-2 capsules, and omits post-confluence time-series dynamics `delta(t)/R_0` and `t_b(tau_d)`.
#   3. The vendored CC BY-SA 4.0 confluent epithelial cyst histology micrograph
#      `datasets/epithelioid_cyst_buckling/epithelioid_cyst_specimen.jpg` is never loaded,
#      segmented, or analyzed for cyst/lumen circularity, epithelial thickness ratio `h/R_0`,
#      or inward boundary invagination depth in `epithelioid_cyst_buckling_comparison.png`.
#   4. Runtime SHA-256 dataset integrity verification and CLI parameter overrides
#      (`--e-alg`, `--h-scale`, `--r0-scale`, `--blebbistatin`, `--seed`) are missing.

