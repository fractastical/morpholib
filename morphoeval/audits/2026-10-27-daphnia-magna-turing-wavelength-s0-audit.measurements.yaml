    claim_boundary:
      reported_in_source:
      - Turing (1952) selects a wavelength 2π/k_c from a dispersion relation. Schnakenberg (1979) supplies the kinetics
        du/dt = a − u + u²v, dv/dt = b − u²v.
      - Macagno (1981) showed that the Daphnia magna visual system is built by cellular interactions. Smith & Macagno
        (1990) resolved four spectral classes inside single ommatidia. Hebert & Emery (1990) showed that cuticular
        melanin is an inducible ultraviolet shield.
      reconstructed_in_script:
      - The length unit is chosen so λ_c = 2.736 µm. Parameters a = 0.062, b = 1.180, D_u = 0.016, D_v = 0.640 are
        not the slot-149 placeholders.
      - Nine Fourier modes are grown from the unstable eigenvector. Pearson r and RMSE compare those rates with
        σ(k) on the band σ > -0.15. A D_u sweep and an equal-diffusion ablation are included.
      - The SEM scale bar and an interior peak of the cuticle spectrum (20.17 µm) are measured on the vendored image.
      transfer_boundary:
      - The age delta along this chronoseries is zero. The comparison with a melanosome (~0.5 µm) and an ommatidium
        (tens of µm) is a scale comparison, not a fossil sequence.
      - Nothing here transfers to a claim that the ×130 cuticle polygons are a 2.736 µm pigment stripe.
      does_not_claim:
      - Does not claim a published measurement of a 2.736 µm ocellus stripe. That length is the assigned tier.
      - Does not claim the in-sample dispersion correlation is a held-out test. Odd modes are not yet withheld.
      - Does not claim a nanopublication signature. No ~/.nanopub/profile.yml is present.
      - Does not claim an independent second assessor scored this pass.
