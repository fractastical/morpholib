simulations:
  - id: miller-ocular-dominance-stripes
    name: "Miller, Keller & Stryker (1989) & Hubel, Wiesel & LeVay (1977) ocular dominance column development & plasticity"
    organism: "Macaca mulatta / Felis catus primary visual cortex (V1 Layer IVC)"
    script: 1989-miller-ocular-dominance-stripes.py
    output: docs/media/ocular_dominance_stripes_comparison.png
    extra_outputs:
      - docs/media/ocular_dominance_stripes_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Miller, Keller & Stryker (1989) Science 245:605-615 correlation-based Hebbian synaptic competition model showing that subtractive homeostatic normalization conserves S_Sigma = S^L + S^R while S_Delta = S^L - S^R amplifies at the Mexican-hat band-pass peak k_c"
        - "Hubel, Wiesel & LeVay (1977) Phil. Trans. R. Soc. B 278:377-409 tangential autoradiographs of Macaca mulatta V1 Layer IVC showing ~400 um single-eye column width (~800 um full wavelength), monocular deprivation shrinkage of deprived-eye stripes into narrow islands, and critical-period reverse suture rescue"
        - "Stryker & Harris (1986) J. Neurosci. 6:2117-2133 showing that bilateral intraocular TTX retinal impulse blockade (C_Delta = 0) completely prevents ocular dominance column segregation"
      reconstructed_in_script:
        - "2D spectral Miller-Keller-Stryker / Swindale solver on a 96x96 periodic tangential V1 Layer IVC sheet (6400x6400 um) across all 5 canonical regimes plus a 6-point intracortical inhibition range sigma_I wavelength sweep (170-290 um, Pearson r = 0.9970)"
        - "Automated CV segmentation of stripe territories (f_L = 0.5000), 2D Hanning FFT spectral peak (16 cycles, 800 um scaled wavelength), and N = 71 Y-branchpoints on `odc_tangential_pattern_specimen.png` plus Layer IVC laminar Nissl optical density profiling (s* = 0.35) on `macaque_striate_cortex_specimen.jpg`"
      transfer_boundary:
        - "2D tangential Layer IVC cortical sheet x in [0, 6.4 mm]^2 with isotropic Difference-of-Gaussians lateral interaction I(r) and coupled S^L, S^R synaptic densities"
      does_not_claim:
        - "Subcellular NMDA receptor channel kinetics, cytochrome oxidase blob co-alignment with orientation pinwheels in Layers 2/3, or curved calcarine sulcus 3D cortical folding geometry"
    source_refs:
      - miller1989
      - hubel1977
      - swindale1980
      - stryker1986
    summary: >-
      Pass 2 post-remediation evaluation of `1989-miller-ocular-dominance-stripes.py`
      (92.9/100, up from 57.7/100 in Pass 1; +35.2 overall). The remediated script solves
      the 2D Miller-Keller-Stryker / Swindale integro-differential ocular dominance PDE on a
      96x96 periodic V1 Layer IVC tangential sheet (`6400 x 6400 um`) tracking coupled
      left/right synaptic densities `S^L(x,t), S^R(x,t)` under subtractive normalization
      (`max |S^L + S^R - S_Sigma| < 1e-15`) across all 5 canonical experimental regimes:
      Normal Binocular 50/50 zebra stripes (`f_L = 0.5036`, `lambda = 806.19 um` vs `800.26 um`
      analytical band-pass peak), Hubel-Wiesel Critical-Period Monocular Deprivation shrunken
      bands/islands (`f_L = 0.2533`, `f_R = 0.7467`), Strabismus decorrelated broadened columns
      (`lambda = 883.82 um`, `SI = 0.9806`), Stryker-Harris Bilateral TTX Impulse Blockade
      unsegregated control (`SI = 0.0029 < 0.01`), and Reverse Suture critical-period rescue
      (`f_L = 0.6844`), paired with a 6-point intracortical inhibition range `sigma_I` sweep
      (`r = 0.9970`, `RMSE = 13.36 um`), automated CV segmentation of the tangential ODC and
      *Macaca mulatta* V1 Layer IVC specimens, and 3 machine-checked Lean 4 theorems in
      `Loop_087_ocular_dominance_stripes.lean`.
