    claim_boundary:
      reported_in_source:
      - Male D. suzukii has an apical wing spot; the female has a serrated ovipositor (Atallah 2014).
      - Spot presence in the suzukii–biarmipes clade is a yellow cis-regulatory gain (Gompel 2005; Prud'homme 2006;
        Koshikawa 2020).
      - A two-species reaction-diffusion system selects a finite onset wavenumber k_c (Turing 1952).
      reconstructed_in_script:
      - Schnakenberg a=0.037, b=1.284, D_v/D_u=12.6, with D_u solved so lambda_c = 2.046 µm.
      - Subobscura is the same diffusivities with a=0.52, b=0.18 so f_u = -17/35.
      - Takahashii is the same kinetics with diffusivities multiplied by 1.44, so lambda_c = 2.4552 µm.
      transfer_boundary:
      - The 2.046 µm value is the campaign detail-scale assignment, not a published granule measurement.
      - The McEvey plate anchors the animal and the wing-spot dimorphism. Its pixels are coarser than 2 µm.
      does_not_claim:
      - That yellow or ebony enzyme kinetics are the Schnakenberg reactions.
      - That D. takahashii has been measured at a 2.455 µm pigment wavelength.
      - That subobscura, suzukii and takahashii form a stratigraphic ancestor chain. All three are extant (0 Ma).
