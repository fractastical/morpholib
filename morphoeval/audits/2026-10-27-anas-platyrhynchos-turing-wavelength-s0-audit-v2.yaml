        value: 88
        rationale: "Sweep Pearson r = 0.9926 against a reference of 1, RMSE = 0.0516 rad/cell against a reference of 0. Specimen foreground 0.835 versus pigment fraction 0.417, coherency 0.380 versus 1.000, circularity 0.174 versus 1. Those references are not copies of the measurements. lambda_c = 317.8 µm is not forced equal to lambda_star. Deducted because the 378.4 µm anchor is the slot scale, and bar-spacing CV landed on 0 for a phase-locked cosine mode."
        evidence:
