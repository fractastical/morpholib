    summary: >-
      Pass 2 keeps the same Schnakenberg vane (k_c = 0.623, k_star = 0.524,
      lambda_star = 378.34 µm, lambda_c = 317.8 µm, age 0 Ma, scale 0.0003784 m).
      The saved GIF is the drake with a growing bar inset. cv_sim_similarity rose
      from 60.3 to 94.5 (12 frames, 960×639). The Du sweep Pearson r is 0.9926
      (RMSE 0.0516 rad/cell). Equal diffusion suppresses amplitude by ~1e-5 and
      is drawn on the bar colour scale, so the panel is flat. Specimen foreground
      0.835 versus model pigment fraction 0.417; specimen coherency 0.380 versus
      model coherency 1.000; contour circularity 0.174 versus a circle at 1.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 wavenumber and diffusion-driven instability."
        - "Schnakenberg 1979 two-species kinetics."
        - "Murray 1981: coat pre-pattern scale is set by diffusion, so a longer domain is a different wavelength."
        - "Prum & Williamson 2002 within-feather reaction-diffusion classes."
        - "Inaba & Chuong 2020 macro versus micro pigment levels."
        - "Haupaix et al. 2018 somite prepattern is a longer-scale body stripe, not this 378 µm law."
        - "Stavenga et al. 2017 speculum colour is structural."
      reconstructed_in_script:
        - "Deviation PDE, Du scaled so lambda_star matches 0.0003784 m, axial bias for bars, q = 0.55 for ocelli."
        - "GIF display zoom. The portrait is coarser than 378 µm per pixel; the inset is a magnified vane, not a micrometre overlay."
      transfer_boundary:
        - "Chronoseries 1/1 at 0 Ma. No predecessor or successor chronospecies. The 2.4 cm sibling is 62 detail wavelengths plus 79.2 µm."
      does_not_claim:
        - "A published mallard measurement of 378.4 µm."
        - "That speculum hue or the green head is produced by this wavenumber."
        - "Pixel identity between the GIF and the photograph. The fitness score is the orientation, radial-FFT, and coherency similarity."
    scores:
      model-fidelity:
        value: 90
        rationale: "Pass 2 does not change the equations. The integrator, classical k_c, and k_star remain the Schnakenberg linearisation plus cubic saturation. The deduction is the same one as pass 1: this is the near-onset deviation system, and orientation is seeded by the rachis axis rather than selected by anisotropic diffusion."
        evidence:
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [80, 184], note: "Jacobian through the periodic integrator", supports: true}
          - {file: morphoeval/lean/loops/Loop_3110_anas_platyrhynchos_turing_wavelength_s0.lean, lines: [8, 44], note: "trace, determinant, discriminant, 62-wavelength split", supports: true}
      specimen-match:
        value: 84
        rationale: "The pass-2 GIF is the CC BY-SA drake. A fixed-scale inset grows from faint bars to saturated bars, and the plumage is darkened by the same field. cv_sim_similarity is 94.5 against that photograph. It is still a portrait plus a magnified vane, not a micrograph of mallard barbs at 378 µm, so the score stays below 90."
        evidence:
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [361, 386], note: "composite and fixed-scale colorize_vane", supports: true}
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [468, 486], note: "pass_id=2 stamps the growing inset on the photograph", supports: true}
          - {file: docs/media/anas_platyrhynchos_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 960×639, cv 94.5", supports: true}
          - {file: docs/media/anas_platyrhynchos_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "bars, ocelli, flat control, drake, sweep", supports: true}
      parameter-expressivity:
        value: 90
        rationale: "Raising Du at fixed r = 16 lowers both analytical and measured k_star (predicted sequence is monotonic). q switches bars to ocelli (orientation ratio 234 versus 0.71). Equal diffusion and reaction-off both kill the pattern. The GIF zoom is documented as display-only and does not enter k_star."
        evidence:
          - {file: models/2026-delphi10000-anas-platyrhynchos-turing-wavelength-s0.py, lines: [236, 294], note: "Du sweep, equal diffusion, reaction-off", supports: true}
          - {file: docs/media/anas_platyrhynchos_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "sweep panel Pearson r = 0.993; flat control", supports: true}
