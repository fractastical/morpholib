    claim_boundary:
      reported_in_source:
      - Turing (1952) derived the diffusion-driven instability and the critical wavenumber. Schnakenberg (1979)
        gave the two-species kinetic scheme used here.
      - Ciona pigment cells are a neural-crest-like lineage (Abitua et al. 2012). The larval ocellus and otolith
        sit in the sensory vesicle (Hudson 2016; Kourakis et al. 2021; Hotta et al. 2007).
      reconstructed_in_script:
      - gamma is solved so lambda_c = 5.056e-05 m at Dv/Du = 10. The ratio sweep moves analytical lambda from 57.0
        µm to 48.6 µm.
      - The GIF blend alpha is 0.50, the strongest weight that still ties the CV cap. The dispersion panel is limited
        to sigma in [-2, 1.2] so the unstable band is visible.
      transfer_boundary:
      - Holocene chronoseries 1/1 has no temporal predecessor. Scale neighbours are a 1 µm melanosome and the adult
        body (measured length 34.0 mm).
      - Adult pigment spacing 873 µm is not a measurement of the 51 µm law.
      does_not_claim:
      - Does not claim the activator and inhibitor are identified Ciona molecules.
      - Does not claim the adult tunic pattern is a 51 µm Turing field.
      - Does not claim a signed nanopublication. The profile file is absent, so trusty URIs were not minted.
