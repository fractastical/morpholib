      reported_in_source:
      - Turing 1952 and Murray 1981 supply the critical-wavenumber law.
      - The Sévi photograph shows cream transverse bands and has no scale bar.
      - 'Milinkovitch et al. 2013: crocodilian head scales form by cracking, which this script does not integrate.'
      reconstructed_in_script:
      - gamma is solved so lambda_c = 1.498 mm. Pass 2 sets theta to the measured 12 degree band normal.
      - Photo-band pitch in millimetres is conditional on an assumed total length. It is not a measured scale bar.
      transfer_boundary:
      - Under every assumed total length in 300-600 mm the photographed bands are several times longer than 1.498
        mm. The slot scale is the detail mode, not those body bands.
      - Fossil alligatorids are outside this 1/1 chronoseries. Osteoderm bone is not this melanin wavelength.
      does_not_claim:
      - That 1.498 mm was calipered on these juveniles.
      - That head scales are a Turing pattern.
      - A second assessor's score. R5 is still open.
