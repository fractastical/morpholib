      reported_in_source:
      - 'Turing (1952): diffusion-driven instability and a selected wavenumber. Schnakenberg (1979): the a−u+u²v
        / b−u²v kinetics.'
      - 'Carbone et al. (2005) and Llopart et al. (2002): the yakuba/santomea pigmentation difference is genetic.
        Wittkopp et al. (2002): Yellow and Ebony act reciprocally on melanin versus NBAD.'
      reconstructed_in_script:
      - Linear dispersion (trace, determinant, cross term, discrete σ(q)) and an explicit-Euler Schnakenberg spiral
        on a 72×96 periodic patch, with λ* pinned to 2.157 µm.
      - Yellow = slow activator and Ebony/NBAD = fast substrate is an interpretive reading, not an equation in those
        papers.
      transfer_boundary:
      - A 16 µm periodic patch is not a whole tergite. The gallery specimen is a sepia gradation field, not a dissected
        cuticle micrograph at 2.2 µm.
      does_not_claim:
      - Does not claim Carbone et al. measured a 2.157 µm granule spacing, and does not copy the 97 µm cellular-tier
        yakuba sibling (slot 2731).
