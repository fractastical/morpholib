# MorphoEval audit — Van Essen (1997) Nature, Hilgetag & Barbas (2006) PLoS Comput. Biol. & Mota & Herculano-Houzel (2015) Science Cortical Sulcal Axon Tension, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2020-karbowski-cortical-sulcal-axon-tension.py` (219 lines)
# prior to Step 12 remediation in `2026-10-19-cortical-sulcal-axon-tension-loop`:
#   - Primary assessor: Gemini 4 Argon — 55.8 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `generate_parametric_coronal_ribbon` (L44-67) prescribes a harmonic cosine
#      ansatz for the coronal cortical ribbon rather than minimizing the coupled
#      elastoplastic cortical bending + viscoelastic cortico-cortical white-matter
#      axonal spring energy functional F_axon = sum_{i<j} K_ij C_ij (||x_i - x_j|| - L_{0,ij})_+
#      + E_bend(kappa) coupled to towed-axon growth dL_{0,ij}/dt = gamma_a (T_ij - tau_0)_+.
#   2. Omits the 12-species Mota & Herculano-Houzel (2015) Science universal cortical
#      folding scaling law A_T * sqrt(h) = k * A_E^(5/4) (log-log slope 1.25) across
#      Rodentia, Lagomorpha, Carnivora, Artiodactyla, Cetacea, and Primates, as well
#      as axonal tension ablation / callosotomy (k_a = 0) and hyper-tension controls.
#   3. The vendored coronal human brain specimen `datasets/cortical_sulcal_axon_tension/coronal_cortex_axon_tracts_specimen.jpg`
#      is not loaded, segmented into gyral crowns, sulcal fundi, pial/white-matter
#      boundaries, or measured for empirical gyral-vs-sulcal cortical thickness ratio
#      and local Gyrification Index.
#   4. Runtime SHA-256 verification of the 4 dataset files and CLI parameter overrides
#      (`--axon-stiffness`, `--bending-modulus`, `--towed-gamma`, `--growth-g`, `--seed`)
#      are missing.

