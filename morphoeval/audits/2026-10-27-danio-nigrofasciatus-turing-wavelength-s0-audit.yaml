          - {file: datasets/danio_nigrofasciatus_turing_wavelength_s0/danio_nigrofasciatus_turing_wavelength_s0_reference.json, lines: [1, 40], note: "27 µm, 0 Ma, specimen sha256", supports: true}
      code-traceability:
        value: 76
        rationale: "Module docstring states the PDE, the Jacobian, and the chronoseries. Pass 1 does not yet tie every measurement name back to a theorem line."
