simulations:
  - id: delphi10000-danio-nigrofasciatus-turing-wavelength-s0
    name: "Danio nigrofasciatus Schnakenberg wavelength at 27 µm (Holocene, 0 Ma)"
    organism: "Danio nigrofasciatus"
    script: models/2026-delphi10000-danio-nigrofasciatus-turing-wavelength-s0.py
    output: docs/media/danio_nigrofasciatus_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs:
      - turing1952
      - schnakenberg1979
      - nakamasu2009
      - parichy2006
      - volkening2018
      - podobnik2020
      - parichy2015
    summary: >-
      Pass 1 integrates Schnakenberg kinetics at a=0.1, b=0.9, D_u=0.05, D_v=2.0
      so that lambda_c = 2.71e-05 m (27 µm, log10=-4.567, tier 4_cellular_10um)
      at geological age 0 Ma. One-step eigenmode growth matches analytical sigma(k)
      at Pearson r = 0.999997 (RMSE 0.00141). The trunk of the Parichy CC BY 4.0
      photograph is the render scaffold. Full credit for the alpha sweep, KS
      holdout, and ablation is withheld until Pass 2 re-runs them.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and the critical-wavenumber formula."
        - "Schnakenberg 1979 kinetics f = a - u + u^2 v, g = b - u^2 v."
        - "Nakamasu et al. 2009: Danio pigment cells implement short-range activation and long-range inhibition and can form stripes or spots."
        - "Parichy 2006: D. nigrofasciatus keeps a striped dorsum and a broken ventral field, unlike spotted D. margaritatus and striped D. rerio."
      reconstructed_in_script:
        - "Explicit-Euler anisotropic Schnakenberg on a periodic cellular patch with dx set so analytical lambda_c equals 2.71e-05 m."
        - "alpha_dorsal=6, alpha_ventral=1.15, break at 0.60 of flank height for the focal species; alpha=1.05 and alpha=8.5 for the chronospecies."
        - "Trunk mask and composite painted onto the vendored Parichy photograph."
      transfer_boundary:
        - "27 µm is the catalog cellular wavelength, not a length resolved by the whole-body photograph."
        - "alpha stands in for iridophore / Kcnj13 coupling; the script does not model those cells explicitly."
      does_not_claim:
        - "Does not claim the organ-scale ~1 mm stripe spacing of slot 1203."
        - "Does not claim the dorsoventral optical-density profile of the photograph is reproduced (profile Pearson r = 0.023)."
        - "Does not claim a second independent assessor."
    scores:
      model-fidelity:
        value: 80
        rationale: "Jacobian, continuous k_c, and the discrete-Laplacian dispersion are implemented and checked, but Pass 1 does not yet treat the eigenmode Pearson r as a closed measurement against the 0.98 gate."
        evidence:
          - {file: models/2026-delphi10000-danio-nigrofasciatus-turing-wavelength-s0.py, lines: [83, 125], note: "jacobian, sigma_continuous, critical_wavenumber, sigma_discrete", supports: true}
      specimen-match:
        value: 74
        rationale: "The comparison figure places the Parichy specimen beside a trunk field of horizontal melanophore dashes. Head, fin margin, caption, and scale bar stay photographic. The cellular dashes are not the three broad organ-scale stripes, so this pass does not score a close silhouette match."
        evidence:
          - {file: docs/media/danio_nigrofasciatus_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen | trunk field | chronoseries | dispersion", supports: true}
          - {file: models/2026-delphi10000-danio-nigrofasciatus-turing-wavelength-s0.py, lines: [318, 386], note: "segment_specimen trunk mask and composite_on_specimen", supports: true}
      parameter-expressivity:
        value: 68
        rationale: "Alpha, break fraction, and the three chronospecies are parameters, but Pass 1 does not yet score the monotonic gradient sweep."
        evidence:
          - {file: models/2026-delphi10000-danio-nigrofasciatus-turing-wavelength-s0.py, lines: [64, 74], note: "ALPHA_MARG, ALPHA_DORSAL, ALPHA_VENTRAL, ALPHA_RERIO, BREAK_FRAC", supports: true}
      morphometric-validation:
