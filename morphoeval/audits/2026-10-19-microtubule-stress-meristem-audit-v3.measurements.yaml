    claim_boundary:
      reported_in_source:
      - 'Hamant et al. (2008) Science 322:1650-1655 and Bozorg, Krupinski & Jönsson (2014) PLoS Comput. Biol. 10:e1003410:
        pressurized-shell / finite-element stress models of the SAM with isotropic stress on the central dome (K
        > 0), anisotropic tensile stress along the negative-Gaussian-curvature organ boundary (K < 0), 2:1 hoop-to-axial
        Laplace stress on the stem, circumferential CMTs around single-cell ablations, and the argument that maximal
        principal stress, not strain, is the directional cue'
      - 'Uyttewaal et al. (2012) Cell 149:439-451 and Sampathkumar et al. (2014) eLife 3:e01967: katanin (BOT1/KTN1)
        sets the mechanical feedback gain; bot1/ktn1 and oryzalin reduce CMT ordering and flatten the boundary crease'
      - 'Heisler et al. (2010) PLoS Biol. 8:e1000516: PIN1 polarity correlates with CMT orientation (PIN1-rich membranes
        parallel to the CMT array), both reorient after ablation (CMTs circumferential, PIN1 directed away from
        the wound) and the PIN1 response persists under oryzalin; hypothesis that PIN1 accumulates at the most stressed
        anticlinal wall'
      - 'Louveaux et al. (2016) PNAS 113:E4294-E4303: SAM cells, especially at the organ boundary, orient division
        planes along maximal tensile stress, deviating from the Errera shortest-wall rule when stress is anisotropic'
      reconstructed_in_script:
      - 'Section 2: 4-zone pressurized-shell stress table (prescribed sigma_1, sigma_2 per zone), nematic CMT order
        S = gamma a / (gamma a + 2 D_theta), stiffness anisotropy and viscoplastic Lockhart strain rates; exact
        integer checks of Lean Laws 1-3; an analytic (Gaussian-weight) 2D cross-section anisotropy field labelled
        ''FEM'' in v2'
      - 'Section 3: 24-cell ring with prescribed angular dispersions for stress / strain / bot1 cues; closed-form
        5-condition sweep of S, crease depth and ablation cos^2 fitted to the reference JSON (Pearson r = 0.9992
        against the same JSON)'
      - 'Section 3b (Pass 3): 2D L1 cellular vertex mesh — zone stress tensor as affine boundary pre-strain epsilon_i
        = sigma_i / E_shell; Hookean wall tensions; virial wall-stress tensor and wall-strain tensor per cell; CMT
        director relaxation with gamma_MT and S; cellulose reinforcement of CMT-parallel walls; softmax PIN1 allocation
        on wall tension; PIN1-polar auxin transport with diffusion, production and decay; auxin-enhanced Lockhart
        creep; division along sigma_1 (else Errera); T1 detection and flip (disabled by default); 9 scenarios with
        emergent PIN1/CMT co-alignment 0.747 (saddle WT), wound-ring CMT circumferential cos^2 0.985, PIN1 away-from-wound
        fraction 0.83 in WT and 0.83 under oryzalin, katanin sweep r = 0.995, 57 divisions with Euler residual 0'
      - 'Section 4: optical-density segmentation and Sobel/Gaussian structure-tensor coherency on the SHA-256-locked
        longitudinal SAM section (dome / saddle / stem ROIs)'
      transfer_boundary:
      - 'The vertex mesh is a tangent-plane (2D) approximation of the L1 sheet: curvature enters only through the
        boundary pre-strain, so dome vs saddle differ by boundary anisotropy, not by Gaussian curvature of a 3D
        surface; absolute S values on the mesh (dome 0.42, saddle 0.57, stem 0.59) are compared with but do not
        match the Hamant 2008 zone references (0.08, 0.81, 0.57)'
      - The Heisler (2010) and Louveaux (2016) reference values used for the new measurements are within-30-degree
        ordinal thresholds (cos^2 >= 0.75) derived from the papers' qualitative statements, with 0.5 as the random
        null; no figure of either paper was digitised
      - The specimen is a stained longitudinal histological section, not an apical PIN1-GFP / MBD-GFP image, so
        its structure-tensor coherency measures cell-wall edge anisotropy in the section plane, not CMT or PIN1
        organisation
      does_not_claim:
      - A 3D curved-surface vertex or FEM shell solver, the Bozorg (2014) stress-vs-strain discrimination as an
        emergent property of the mesh (both cues give circumferential CMTs around the wound here), auxin-maximum
        (phyllotactic) patterning from PIN1 up-the-gradient transport, subcellular katanin dynamics, or internal
        L2/L3 corpus mechanics
