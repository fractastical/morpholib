        evidence:
          - {file: models/2026-delphi10000-drosophila-planitibia-turing-wavelength-s0.py, lines: [1, 42], note: "Module docstring stating 5.13 µm, 0 Ma, and the predecessor/successor contrast", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-drosophila-planitibia-turing-wavelength-s0.yaml, lines: [1, 75], note: "Math KG equations, Lean loci, and model_spec inputs", supports: true}
      repro-package:
        value: 84
        rationale: >-
          --self-test is deterministic (seed 3199), checks dataset hashes, and
          correctly failed closed on Pass 1 (Pearson r and sweep direction).
          Failure was reported rather than relaxed. A known-good invocation
