# MorphoEval audit — Hannezo, Prost & Joanny (2014) PNAS & Krajnc & Ziherl (2015) PRE 3D Epithelial Sheet
# Morphology & Apico-Basal Buckling, 2026-10-19 (v3)
#
# Pass 3 re-score of `2016-hannezo-epithelial-buckling-3d.py` (1979 lines) after the remediation of the single open
# v2 item in the instrumented loop `morphoeval/runs/2026-10-19-epithelial-buckling-3d-loop-pass3`, superseding
# `2026-10-19-epithelial-buckling-3d-audit-v2` (93.4, Gemini 4 Argon).
#   - Primary assessor: Claude Fable 5.1 (Slot 047 Pass 3 subagent), scoring against commit 654cd6fc + working tree.
#
# What Pass 3 changed (the v2 remediation item "extend the 2D continuum + vertex sheet solver to a full 3D polyhedral
# scutoid vertex mesh capturing apical-to-basal neighbour intercalations in high-curvature tubular bends"):
#   1. Section 3b (L493-858): doubly periodic (torus) Voronoi tube mesh of ~418 polyhedral cells at the Hannezo
#      (h_0, d_0) — jittered hexagonal seeds + 2 Lloyd iterations on the unrolled apical cylinder, radial projection
#      to the basal cylinder with surface ratio s = R_b/R_a, apical vs basal Delaunay neighbour sets, scutoid mask,
#      apico-basal intercalation count, Euler neighbour totals, frustum volumes and lateral-face area of the scutoid
#      vs the intercalation-free frustum tessellation (`build_scutoid_tube_mesh`, L582-709).
#   2. Surface-ratio sweep f_s(s) over 11 ratios x 3 seeds (`sweep_scutoid_surface_ratio`, L712-749); fold-crest
#      curvature coupling s_crest = 1 + h_0 kappa_max from the relaxed sheets (`fold_crest_surface_ratio`, L752-791);
#      per-tissue crest predictions for all 12 tissues (`evaluate_scutoid_intercalation`, L794-857).
#   3. Panels G/H added to the 8-panel figure (L1367-1430), a standalone 3D mesh PNG (`render_scutoid_mesh_figure`,
#      L1474-1563), 4 new measurements (12 total, L1780-1820), self-test 8 -> 11 checks (L1870-1908), CLI
#      --tube-radius / --surface-ratio (L1929-1940), `scutoid_tube_reference.json` SHA-256 pinned (L159-161),
#      Gómez-Gálvez et al. (2018) added to the bib/README, and 2 new Lean 4 theorems (Laws 4-5, 0 sorrys).
#
# Scores below are the primary assessor's: overall 82.4, DOWN from 93.4. The remediation item is closed in the
# reduced form the script itself declares (L54-57: Voronoi projection, no 3D vertex energy, no T1 dynamics), but
# auditing the new coupling exposed defects that v2 had scored as strengths: the headline 12-tissue aspect-ratio
# r = 1.0000 is circular (the per-tissue Gamma_norm values in the reference JSON reproduce aspect_ratio_obs to
# <0.5 % with no per-row source), the "simulated" wavelength is 85 % the analytic lambda_c by construction, the WT
# fold amplitude is rescaled to its own reference value, the reference JSON stores the script's own specimen
# measurements as the "reference", and the new crest coupling over-predicts s_crest by 44 % (3.33 vs 2.30) with the
# scutoid fraction saturated at 1.0 for every buckled tissue. v2's stated wavelength RMSE (1.25 um) was also wrong:
# the script reports 11.15 um.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities).
# Line numbers refer to the working-tree files at commit 654cd6fc (verified against the current script).

