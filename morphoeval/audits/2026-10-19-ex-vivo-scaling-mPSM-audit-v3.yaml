        evidence:
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [6, 29], note: "Six sources with DOIs including Kuramoto 1984 and Dubrulle & Pourquie 2004", supports: true}
          - {file: datasets/ex_vivo_scaling_mPSM/ex_vivo_scaling_mPSM_reference.json, lines: [90, 144], note: "pass3_mechanistic_parameters: gradient, adaptation and lattice constants with expected default results", supports: true}
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [135, 166], note: "SHA-256 pins for specimen and scout manifest; reference JSON digest computed but not pinned (L160-164)", supports: false}
      code-traceability:
        value: 92
        rationale: >-
          The module docstring maps Laws 1-6 to equations, source figures and Lean theorem names (L31-92);
