# MorphoEval audit — Lauschke, Tsiairis, François & Aulehla (2013) Ex Vivo mPSM Phase-Gradient Scaling, 2026-10-19 (v3)
#
# Pass 3 remediation-round re-score of `2014-lauschke-ex-vivo-scaling-mPSM.py` (Slot 026) in the
# instrumented loop `morphoeval/runs/2026-10-19-ex-vivo-scaling-mPSM-loop-pass3`, superseding
# `2026-10-19-ex-vivo-scaling-mPSM-audit-v2` (91.4). Both Pass 2 remediation items were closed:
#   1. FGF/Wnt-gradient-driven dynamic wavelength adaptation (Laws 4-5): quasi-static source-sink
#      signalling gradient whose half-length scales with R(t) vs a fixed-length decay gradient; the Notch
#      phase-wave wavelength relaxes toward the gradient length with time constant tau_lambda; segments are
#      gated by a fixed peripheral phase window so alpha = S_n/R(t_n) is an OUTPUT (0.1103 at cycle 8 with
#      tau_lambda = T_osc/4; 0.5601 with tau_lambda = inf; constant 39.5 um segments with the fixed gradient).
#   2. Tsiairis & Aulehla (2016) disordered cell-reaggregation lattice (Law 6): 1577 jittered-hexagonal
#      Kuramoto-Sakaguchi oscillators with spatially correlated frequency heterogeneity; phase-gradient
#      flow-source detection finds median 4 de novo pacemakers in cycles 1-3 consolidating to 1 (17.7 um from
#      the local frequency maximum) by cycles 12-14; K = 0 and eta = 0 ablations give 0 pacemakers.
#   + 3 new machine-checked Lean 4 theorems (6 total, 0 sorrys), 10 measurements (was 5), 9-panel figure,
#     second GIF, tau_lambda / K / eta sweeps and new CLI flags.
#
# The remediation also exposed defects that were not scored in Pass 2 and are now priced in (overall goes
# DOWN to 89.9 despite the added mechanism): the vendored "mouse" specimen is a chick embryo SEM; the
# wavelength-target constant c_lambda and the gating window delta_phi_seg are calibrated so that the
# adapted state reproduces Phi_0 and alpha = 0.11 (so the invariant is still partly built in); the FGF/Wnt
# gradient is quasi-static with a placeholder l_k = 1e6 um rather than measured D, k; a fully random initial
# phase field pins spiral defects (0 target sources) instead of re-synchronising as in the paper; the
# 4-explant "observed" S_1 / S_5 / v_1 columns of the reference table have no figure-digitisation provenance;
# and the --R0/--alpha/--T-osc/--seed CLI flags do not affect the default render.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files at commit d58a084 (working tree, Pass 3).

