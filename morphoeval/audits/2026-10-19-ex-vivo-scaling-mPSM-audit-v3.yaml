    remediation:
      - >-
        2014-lauschke-ex-vivo-scaling-mPSM.py:626-627 and 605-671 — c_lambda = (2 pi/Phi_0)/(1/2) and
        delta_phi_seg = Phi_0[1-(1-alpha)^p] are calibrated from the very invariants the adaptation is meant to
