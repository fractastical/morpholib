simulations:
  - id: lauschke-ex-vivo-scaling-mPSM
    name: "Lauschke, Tsiairis, François & Aulehla (2013) scale-invariant phase-gradient encoding in ex vivo monolayer presomitic mesoderm (mPSM)"
    organism: "Mus musculus (mouse E10.5 tailbud LuVeLu Lfng-Venus monolayer presomitic mesoderm)"
    script: 2014-lauschke-ex-vivo-scaling-mPSM.py
    output: docs/media/ex_vivo_scaling_mPSM_comparison.png
    extra_outputs:
      - docs/media/ex_vivo_scaling_mPSM_growth.gif
      - docs/media/ex_vivo_scaling_mPSM_reaggregate.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-ex-vivo-scaling-mPSM-audit-v2
    claim_boundary:
      reported_in_source:
        - "Lauschke, Tsiairis, Francois & Aulehla (2013) Nature 493:101-105 scale-invariant phase-gradient encoding in ex vivo E10.5 mouse tailbud LuVeLu (Lfng-Venus) monolayer presomitic mesoderm (mPSM) with invariant ~2*pi phase span across the shrinking radius R(t), linear segment scaling S_n = alpha R(t_n) (alpha ~ 0.11) and wave velocity ~ R(t)/T_osc; Fig. 4 links the gradient steepening to a shrinking Wnt/FGF signalling domain"
        - "Aulehla et al. (2008) and Dubrulle & Pourquie (2004): graded posterior Wnt/beta-catenin and fgf8 signalling across the PSM, the latter set by mRNA decay (fixed length) rather than tissue size"
        - "Tsiairis & Aulehla (2016) Cell 164:656-667: dissociated, randomised PSM cells re-synchronise LuVeLu oscillations in culture and self-organise multiple de novo target-wave foci"
        - "Kuramoto (1984): a pacemaker with frequency excess beta k^2 in the nonlinear phase-diffusion equation emits a target wave of wavenumber k and the fastest pacemaker entrains the medium"
      reconstructed_in_script:
        - "Universal normalized phase-gradient collapse phi(r/R(t)) across R_0 in {150, 250, 350, 450} um (collapse std 9.93e-16 rad) vs non-scaling constant-gradient divergence; 2D circular mPSM LuVeLu target-wave kymograph; geometric radius progression with constant-velocity and DAPT (0 segments) controls (Panels A-D)"
        - "Quasi-static FGF/Wnt source-sink gradient (half-length exponent 1.000) vs fixed-length exponential gradient (exponent 0.000) driving dynamic wavelength relaxation d lambda/dt = -(lambda - c l_half)/tau_lambda with fixed-window segment gating: emergent alpha_8 = 0.1103 and mean Phi = 6.125 rad (2.5% from 2*pi) at tau_lambda = 35 min; alpha_8 = 0.5601 with tau_lambda = inf; constant 39.48 um segments (CV 0.032) with the fixed gradient (Panel G)"
        - "Disordered reaggregate lattice of 1577 Kuramoto-Sakaguchi cells (K = 0.5 rad/min, eta = 0.25, a = 0.6 rad, correlation length 40 um): median 4 de novo pacemakers in cycles 1-3 consolidating to 1 in cycles 12-14 located 17.7 um from the local frequency maximum, local coherence 0.945; K = 0 -> coherence 0.004 and 0 sources, eta = 0 -> coherence 1.000 and 0 sources; K and eta sweeps (Panels H-I, reaggregate GIF)"
        - "Bilateral dorsal somite row DoG peak and inter-somitic cleft segmentation on the vendored SEM (47.14 px mean spacing, CV = 0.2010; Panels E-F)"
      transfer_boundary:
        - "The vendored SEM specimen is a chick embryo (Wikimedia 'Aves Neural tube and somites in chick embryo', CC BY 4.0) used as a structural reference for somite periodicity; it is not mouse mPSM and no mPSM explant or reaggregate micrograph is compared"
        - "The FGF/Wnt gradient is quasi-static (analytic sinh / exponential profiles re-evaluated at each step), the sink-dominated limit is imposed through l_k = 1e6 um rather than derived from measured diffusion/decay constants, and c_lambda and delta_phi_seg are calibrated so that the adapted state reproduces Phi_0 = 2*pi and alpha = 0.11"
        - "Reaggregate pacemaker counts are compared with the paper's qualitative report of several foci (lower bound >= 2) and the Kuramoto single-dominant-pacemaker end state, not with digitised counts; the Sakaguchi lag a = 0.6 rad and kappa_init = 1 (partially synchronous initial phases) are modelling choices"
      does_not_claim:
        - "Subcellular Lfng/Hes7 transcriptional-translational delay ODEs, explicit Notch-ligand delay-differential coupling, time-integrated morphogen transport on the moving boundary, 3D fibronectin traction mechanics, or cell movement/rearrangement within the reaggregate"
    source_refs:
      - lauschke2013
      - aulehla2008
      - tsiairis2016
      - beaupeux2016
      - kuramoto1984
      - dubrulle2004
    summary: >-
      Pass 3 remediation-round evaluation of `2014-lauschke-ex-vivo-scaling-mPSM.py` (89.9/100, down from
      91.4 in Pass 2 because the round exposed and now prices defects that Pass 2 did not score). Both Pass 2
      remediation items are closed: (1) an explicit FGF/Wnt source-sink signalling gradient whose half-length
      scales with R(t) (exponent 1.000 vs 0.000 for a Dubrulle-Pourquie fixed-length decay gradient) drives a
      dynamic wavelength relaxation d lambda/dt = -(lambda - c l_half)/tau_lambda with fixed-window segment
      gating, so alpha = S_n/R(t_n) is now an output: 0.1103 at cycle 8 and mean Phi = 6.125 rad (2.5% from 2*pi)
      for tau_lambda = T_osc/4, drifting to alpha_8 = 0.5601 when adaptation is frozen and to constant 39.5 um
      segments with the fixed-length gradient (Panel G, tau_lambda sweep); (2) a Tsiairis & Aulehla (2016)
      disordered reaggregate lattice of 1577 Kuramoto-Sakaguchi cells with spatially correlated frequency
      heterogeneity in which phase-gradient flow-source detection finds median 4 de novo target-wave pacemakers
      in cycles 1-3 consolidating to 1 (17.7 um from the local frequency maximum) by cycles 12-14, with K = 0 and
      eta = 0 ablations giving 0 pacemakers and K / eta sweeps (Panels H-I, new reaggregate GIF). Six machine-
      checked Lean 4 theorems (3 new, 0 sorrys), 10 reference-anchored measurements (5 new) and 18 new self-test
      assertions back the additions. Remaining defects: the vendored "mouse" specimen is a chick SEM, the
      calibration of c_lambda and delta_phi_seg partly builds the invariant back in, the gradient is quasi-static
      with a placeholder l_k, fully random initial phases pin spiral defects, the 4-explant "observed" columns lack
      digitisation provenance and the --R0/--alpha/--T-osc/--seed flags do not reach the default render.
    scores:
      model-fidelity:
        value: 93
        rationale: >-
          Laws 1-3 are implemented as in Pass 2 (phi = omega_0 t - Phi_0 (r/R)^p, S_n = alpha R_n, R_{n+1} =
          (1-alpha) R_n, v = (2 pi/Phi_0) R/T_osc; L178-544). Pass 3 adds the mechanism the audit asked for:
          a quasi-static FGF/Wnt source-sink gradient W = W_0 sinh((R-r)/l_k)/sinh(R/l_k) with the
          fixed-length exponential alternative (L552-602), a wavelength relaxation ODE toward c_lambda l_half(t)
          with Phi(t) = 2 pi R/lambda and fixed-window gating S_n = R[1-(1-delta_phi_seg/Phi)^(1/p)] (L605-671),
          and a Kuramoto-Sakaguchi reaggregate lattice whose continuum limit is Kuramoto's nonlinear phase
          diffusion equation (L724-931), each with a machine-checked Lean statement (scale covariance,
          contraction, monotone dispersion). Deductions: c_lambda = (2 pi/Phi_0)/(1/2) and delta_phi_seg =
          Phi_0[1-(1-alpha)^p] are calibrated so that the adapted fixed point reproduces Phi_0 and alpha exactly,
          so the invariant is recovered rather than predicted (-3); the gradient is not time-integrated on the
          moving boundary and l_k = 1e6 um is a placeholder for the sink-dominated limit rather than measured
          FGF8/Wnt3a D and k (-2); the Sakaguchi lag a = 0.6 rad stands in for a Notch coupling delay without a
          delay-differential derivation (-2). Net 93 (-1 vs Pass 2: more mechanism, but the new constants are
          fitted to the law they are meant to explain).
        evidence:
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [552, 602], note: "FGF/Wnt source-sink sinh profile (L579) vs fixed-length exponential (L573) and bisection half-length", supports: true}
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [605, 671], note: "Wavelength relaxation d lambda/dt (L639), Phi(t) = 2 pi R/lambda, fixed-window segment gating (L646); c_lambda and delta_phi_seg calibrated at L626-627", supports: true}
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [838, 913], note: "Kuramoto-Sakaguchi lattice update with sin(dtheta - a) + sin a coupling (L873) and correlated frequency disorder (L863)", supports: true}
          - {file: morphoeval/lean/loops/Loop_026_ex_vivo_scaling_mPSM.lean, lines: [100, 166], note: "Laws 4-6: gradient scale covariance, wavelength-adaptation contraction, pacemaker dispersion monotonicity (0 sorrys, verified with lean 4.35.0)", supports: true}
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [626, 627], note: "c_lambda and delta_phi_seg are set from Phi_0 and alpha, so the adapted state reproduces the law by construction", supports: false}
      specimen-match:
        value: 85
        rationale: >-
          Panels E-F still segment both bilateral somite rows of the vendored SEM (8 + 8 somites, 47.14 px, CV
          0.201) and Panel H now shows the reaggregate disc at cycle 2 (4 foci) and cycle 14 (1 dominant pacemaker
          at the frequency maximum) with LuVeLu-like cos(theta) colouring, qualitatively matching the multiple-foci
          to dominant-centre progression of Tsiairis & Aulehla (2016). Deductions: the file is named
          `mouse_mpsm_somites_specimen.jpg` but the reference table's own `source_url` is a chick embryo SEM,
          so the only specimen is the wrong species for a Mus musculus slot and was credited as mouse in Pass 2
          (-5 relative to Pass 2); no mPSM explant or reaggregate micrograph (Lauschke Fig. 1, Tsiairis Fig. 2) is
          vendored, so Panels B, G, H are compared with equations, not images (-6); the reaggregate's dominant
          pacemaker sits on the disc edge because the frequency maximum of the random field is there, whereas the
          paper's foci are interior (-2); a fully random initial phase field (kappa_init = 0) yields pinned spiral
          defects and 0 target sources, unlike the re-synchronisation reported in the paper (-2).
        evidence:
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [937, 1007], note: "Bilateral somite DoG segmentation of the vendored SEM (unchanged from Pass 2)", supports: true}
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [1447, 1473], note: "Panel H: early vs late reaggregate snapshots with detected sources and the frequency maximum", supports: true}
          - {file: docs/media/ex_vivo_scaling_mPSM_comparison.png, lines: [0, 0], note: "9-panel figure: specimen Panels E-F visible; Panel H shows 4 -> 1 foci; Panel G shows the adaptive phase span", supports: true}
          - {file: datasets/ex_vivo_scaling_mPSM/ex_vivo_scaling_mPSM_reference.json, lines: [41, 45], note: "specimen source_url is 'Aves_Neural_tube_and_somites_in_chick_embryo.jpg' while the filename and Pass 2 audit call it mouse", supports: false}
      parameter-expressivity:
        value: 93
        rationale: >-
          The 4-explant series (R_0 150-450 um), constant-velocity and DAPT controls remain (L458-544); Pass 3 adds
          a tau_lambda sweep {5, 35, 70, 280, inf} min whose phase-span error grows monotonically (0.3%, 2.5%, 5.0%,
          17.6%, 38.8%) with emergent alpha_8 0.110 -> 0.560, the fixed-length-gradient control, and K {0, 0.25,
          0.5, 1} and eta {0, 0.1, 0.25, 0.4} sweeps of the reaggregate (coherence 0.00 -> 0.98 with K; 0 foci at
          eta = 0, 4 -> 1 at eta >= 0.1), each visible in Panels G and I and exposed through --tau-lambda,
          --gradient-mode, --K, --eta, --kappa-init. Deductions: the sweeps are reported as text in Panel I rather
          than rendered pullbacks (-3); the K/eta sweep snapshots use a single seed so the monotonic claims are not
          seed-averaged (-2); --R0/--alpha/--T-osc/--seed only act under --print-variant (-2).
        evidence:
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [674, 717], note: "tau_lambda sweep with fixed-gradient control and gradient scaling exponents", supports: true}
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [916, 931], note: "K and eta sweeps of the reaggregate lattice", supports: true}
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [1799, 1805], note: "CLI flags --tau-lambda, --gradient-mode, --K, --eta, --kappa-init, --print-variant", supports: true}
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [1806, 1826], note: "--R0/--alpha/--T-osc/--seed are consumed only in the --print-variant branch; the default render ignores them", supports: false}
      morphometric-validation:
        value: 90
        rationale: >-
          `measure_morphoeval()` (L1012-1131) now returns 10 measurements with references and units: the five
          Pass 2 values (alpha 0.1100, Phi 6.2832 rad, S_1 38.5 um vs 38.9, Pearson r 0.9997, 47.14 px) plus the
          adaptive phase span 6.1253 rad vs 2*pi, emergent alpha_8 0.1103 vs 0.11, gradient half-length exponent
          1.000 vs 1, early pacemaker count 4 vs the >= 2 lower bound and local coherence 0.9446 vs 1.0, each
          with the matching ablation in its note. Deductions: the two Tsiairis references are qualitative (a lower
          bound and a perfect-synchrony ceiling), not values digitised from the paper (-4); the 4-explant
          "observed" S_1 / S_5 / v_1 columns in the reference table have no figure or digitisation provenance,
          so the r = 0.9997 fit (carried from Pass 2) cannot be verified against Lauschke Fig. 3d (-4); the
          pacemaker count depends on the flux threshold 0.6 and rho = 30 um of the detector without a sensitivity
          check (-2).
        evidence:
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [1079, 1109], note: "Three Pass 3 adaptation measurements with 2*pi, 0.11 and exponent-1 references and frozen/fixed-gradient ablations in notes", supports: true}
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [1110, 1131], note: "Two reaggregate measurements (pacemaker count 4 -> 1, coherence 0.9446) with K = 0 / eta = 0 controls", supports: true}
          - {file: 2014-lauschke-ex-vivo-scaling-mPSM.py, lines: [769, 835], note: "Flow-source pacemaker detector: thresholds 0.6 and rho = 30 um fixed, no sensitivity sweep", supports: false}
          - {file: datasets/ex_vivo_scaling_mPSM/ex_vivo_scaling_mPSM_reference.json, lines: [145, 209], note: "observed_S1_um / observed_S5_um / observed_v_wave_1_um_per_min lack a figure-digitisation source", supports: false}
      source-traceability:
        value: 91
        rationale: >-
          Six primary sources with DOIs in the docstring (L6-29), `paper_citations.bib` and
          `ex_vivo_scaling_mPSM_reference.json`; the reference table gains a `pass3_mechanistic_parameters`
          block recording every new constant, sweep and expected result; the specimen and scout manifest are
          SHA-256 pinned and verified at runtime (L135-166). Deductions: the reference JSON itself is hashed but
          not pinned in EXPECTED_SHA256, so it can drift silently (-3); the specimen filename contradicts its
