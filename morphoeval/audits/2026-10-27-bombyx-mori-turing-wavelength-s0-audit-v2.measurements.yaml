    claim_boundary:
      reported_in_source:
      - 'Yamaguchi et al. 2013: periodic Wnt1 expression generates Bombyx larval twin spots.'
      - 'Turing 1952 and Gierer & Meinhardt 1972: long-range inhibition selects a finite wavelength.'
      reconstructed_in_script:
      - Schnakenberg σ(k) with a = 0.058, b = 0.94, Dv/Du = 18, rescaled onto 41 µm.
      - Axisymmetric Galerkin sideband on the corrected pixel scale, fitted to the ocellus card.
      - At 0 Ma, σ(2π/96 µm) < 0 < σ(2π/41 µm). The card's own pitch is 66.67 µm.
      transfer_boundary:
      - Source Wnt1 spots are segment-scale. 41 µm is this slot's cellular detail scale.
      does_not_claim:
      - That Yamaguchi et al. measured 41 µm, or that 96 µm was measured on Bombyx mandarina.
      - That the card's dominant ring (66.67 µm) is the 41 µm eigenmode. The 41 µm carrier is in the basis; most
        of the card's radial power sits at the longer pitch.
      - A pixel-fitted nonlinear 2D spot field. The GIF is the axisymmetric projection plus synthetic grain.
