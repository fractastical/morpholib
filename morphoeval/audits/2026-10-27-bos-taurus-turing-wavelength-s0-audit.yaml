simulations:
  - id: delphi10000-bos-taurus-turing-wavelength-s0
    name: "Bos taurus Gierer–Meinhardt wavelength at 3.137 µm (Holocene, 0 Ma)"
    organism: "Bos taurus"
    script: models/2026-delphi10000-bos-taurus-turing-wavelength-s0.py
    output: docs/media/bos_taurus_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/bos_taurus_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs: [turing1952, gierer1972, kondo2010, wasmeier2008, murray1981]
    summary: >-
      Detail-scale (tier 3/8) Turing wavelength for extant Bos taurus.
      Scale 3.1 µm = 3.137e-06 m (log10 = -5.503). Age 0 Ma. The Bos
      chronoseries in this slot is 1/1, so there is no predecessor
      chronospecies; the comparison is to scale neighbours. A 500 nm
      melanosome (Wasmeier et al. 2008) sits above the unstable band
      (sigma = -10.91 at the fundamental mode). A 20 µm melanocyte soma
      admits 6.38 wavelengths of the same k_star. Kinetics are
      Gierer–Meinhardt 1972 with mu_u = 0.85, mu_v = 1.40, rho_u = 0.62,
      rho_v = 0.48, D_v/D_u = 14.5, not the sibling Schnakenberg flank
      model. The grid is calibrated so 2*pi/k_star = 3.137 µm at s = 1.
      Nine-point diffusion sweep: Pearson r = 0.99595, RMSE = 0.104 µm.
      Measured s = 1 peak is 3.199 µm, not the 3.137 µm target (discrete
      Laplacian). Equal-diffusion control sigma_max = -0.275. Reaction
      ablation amplitude ratio = 7.5e-5. Specimen is a CC BY-SA 3.0
      Hereford calf (SHA-256 pinned). GIF 640×480, 12 frames. Pass-1
      CV similarity of the last frame to the photograph is 93.0 at
      display weight 0.50.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) derived diffusion-driven instability and the dispersion relation whose fastest mode sets a wavelength."
        - "Gierer & Meinhardt (1972) published short-range activation and long-range inhibition with the activator–inhibitor kinetics implemented here."
        - "Wasmeier et al. (2008) review melanosomes as sub-micrometre organelles. Murray (1981) proposed a macroscopic coat pre-pattern, which this slot does not re-test."
      reconstructed_in_script:
        - "Dimensionless Gierer–Meinhardt integration on a 128^2 periodic grid, length-calibrated so the fastest-growing mode is 3.137 µm at diffusion scale s = 1."
        - "FFT wavelength versus k_star(s) over nine scales (Pearson r = 0.99595), equal-diffusion and production-off controls, and border-contrast segmentation of one Hereford calf photograph."
      transfer_boundary:
        - "The 3.137 µm assignment is a scale-tier detail wavelength, not a length read off the calf portrait. The portrait does not resolve 3 µm."
        - "Chronoseries length is 1. Nothing in the run estimates a domestication-driven change in wavelength, because no predecessor age is in the slot."
      does_not_claim:
        - "Does not claim Holstein flank patches are a Turing pattern. That is a different script and a different scale."
        - "Does not claim the last GIF frame is a micrograph. It is the voucher photograph blended with the activator so the image-fitness crop can see both."
        - "Does not claim a second animal or a scale-barred skin section. Both are open remediation."
    scores:
      model-fidelity:
        value: 90
        rationale: "The script integrates the Gierer–Meinhardt activator–inhibitor system, checks trace, determinant and the cross-term inequality, and separates classical k_c from the fastest mode k_star. The length calibration is explicit. Murray's Schnakenberg flank parameters are not reused."
        evidence:
          - {file: models/2026-delphi10000-bos-taurus-turing-wavelength-s0.py, lines: [66, 90], note: "mu, rho, diffusion ratio 14.5, lambda 3.137e-6 m, age 0", supports: true}
          - {file: models/2026-delphi10000-bos-taurus-turing-wavelength-s0.py, lines: [92, 124], note: "sigma(k), k_star, classical k_c", supports: true}
          - {file: models/2026-delphi10000-bos-taurus-turing-wavelength-s0.py, lines: [153, 191], note: "explicit Euler of the GM reaction terms", supports: true}
      specimen-match:
        value: 78
        rationale: "The voucher is a real CC BY-SA Hereford calf, segmented by border contrast, and the 640×480 growth GIF scores CV similarity 93.0 against that photograph. The match is a display blend (weight 0.50 on the last frame), and the photograph cannot resolve 3.137 µm, so this is not a histological identity."
        evidence:
          - {file: models/2026-delphi10000-bos-taurus-turing-wavelength-s0.py, lines: [260, 292], note: "segment_specimen on the calf RGB", supports: true}
          - {file: datasets/bos_taurus_turing_wavelength_s0/bos_taurus_turing_wavelength_s0_reference.json, lines: [64, 80], note: "SHA-256, CC BY-SA 3.0, resolves_3um false", supports: true}
          - {file: docs/media/bos_taurus_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640x480, last-frame CV 93.0", supports: true}
      parameter-expressivity:
        value: 88
        rationale: "Diffusion scale s multiplies both diffusivities and the predicted wavelength moves as sqrt(s). The FFT peak tracks that prediction (r = 0.99595) from 0.64 to 1.96. Equal diffusion is the negative end of the same axis and kills the band."
        evidence:
          - {file: models/2026-delphi10000-bos-taurus-turing-wavelength-s0.py, lines: [193, 214], note: "nine-point sweep of s", supports: true}
          - {file: models/2026-delphi10000-bos-taurus-turing-wavelength-s0.py, lines: [231, 235], note: "equal-diffusion sigma_max", supports: true}
      morphometric-validation:
        value: 86
        rationale: "Measured wavelength 3.199 µm versus the 3.137 µm target, Pearson r = 0.99595, RMSE = 0.104 µm, three-seed std, KS distance 0.414 against the portrait luminance, and specimen foreground fraction distinct from the simulated occupancy. References are not copies of the values."
        evidence:
          - {file: models/2026-delphi10000-bos-taurus-turing-wavelength-s0.py, lines: [510, 560], note: "measure_morphoeval rows with reference_value != value", supports: true}
          - {file: models/2026-delphi10000-bos-taurus-turing-wavelength-s0.py, lines: [298, 310], note: "two-sample KS on luminance", supports: true}
      source-traceability:
