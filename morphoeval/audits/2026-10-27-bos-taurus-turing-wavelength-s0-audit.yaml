        rationale: "Five DOIs were confirmed on OpenAlex. The specimen file records Wikimedia URL, CC BY-SA 3.0, credit, and SHA-256 507f9fe3562f91cd131cb6fde3a849e2b11e5ab05f1428ac9e8da414020a4134."
