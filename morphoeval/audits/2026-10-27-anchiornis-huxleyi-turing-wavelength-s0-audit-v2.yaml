# MorphoEval audit — Anchiornis huxleyi Turing wavelength at 2.0 nm, Pass 2.
# Supersedes the pass-1 audit. Same agent (grok-4.7). R1–R3 from pass 1 are fixed
# in the script: second ROI, equal-diffusion field panel, archived nonlinear wavelength.

