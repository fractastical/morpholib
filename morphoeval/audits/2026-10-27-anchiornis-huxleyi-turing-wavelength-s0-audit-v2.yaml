  id: 2026-10-27-anchiornis-huxleyi-turing-wavelength-s0-audit-v2
  supersedes_audit_id: 2026-10-27-anchiornis-huxleyi-turing-wavelength-s0-audit
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor, pass 2; no independent second assessor on this run)"
  publisher_github: https://github.com/fractastical
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
  license: https://creativecommons.org/licenses/by/4.0/
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 0c76d15d14afcec6c366e1b9274a6586a0de48fc
    note: >-
      Pass 2 working tree on top of 0c76d15d. Slot-3111 paths are new and are not
      in that commit. Nanopub signing was not performed: ~/.nanopub/profile.yml
      is absent. Environment: system Python, numpy, scipy, Pillow, matplotlib, rdflib.

references:
  turing1952:
    title: "The chemical basis of morphogenesis"
    authors: "Turing AM"
    venue: "Philosophical Transactions of the Royal Society B 237:37-72 (1952)"
    doi: 10.1098/rstb.1952.0012
  schnakenberg1979:
    title: "Simple chemical reaction systems with limit cycle behaviour"
    authors: "Schnakenberg J"
    venue: "Journal of Theoretical Biology 81:389-400 (1979)"
    doi: 10.1016/0022-5193(79)90042-0
  xu2009:
    title: "A new feathered maniraptoran dinosaur fossil that fills a morphological gap in avian origin"
    authors: "Xu X, Zhao Q, Norell M, Sullivan C, Hone D, Erickson G, Wang X, Han F, Guo Y"
    venue: "Chinese Science Bulletin 54:430-435 (2009)"
    doi: 10.1007/s11434-009-0009-6
  li2010:
    title: "Plumage color patterns of an extinct dinosaur"
    authors: "Li Q, Gao KQ, Vinther J, Shawkey MD, Clarke JA, D'Alba L, Meng Q, Briggs DEG, Prum RO"
    venue: "Science 327:1369-1372 (2010)"
    doi: 10.1126/science.1186290
  watt2009:
    title: "The supramolecular structure of melanin"
    authors: "Watt AAR, Bothma JP, Meredith P"
    venue: "Soft Matter 5:3754-3760 (2009)"
    doi: 10.1039/b902507c
  meredith2006:
    title: "The physical and chemical properties of eumelanin"
    authors: "Meredith P, Sarna T"
    venue: "Pigment Cell Research 19:572-594 (2006)"
    doi: 10.1111/j.1600-0749.2006.00345.x

simulations:
  - id: delphi10000-anchiornis-huxleyi-turing-wavelength-s0
    name: "Anchiornis huxleyi Turing wavenumber at 2.0 nm (Late Jurassic, 160.0 Ma)"
    organism: "Anchiornis huxleyi"
    script: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py
    output: docs/media/anchiornis_huxleyi_turing_wavelength_s0_comparison.png
    extra_outputs:
      - docs/media/anchiornis_huxleyi_turing_wavelength_s0_growth.gif
      - datasets/anchiornis_huxleyi_turing_wavelength_s0/anchiornis_huxleyi_turing_wavelength_s0_metrics.json
    status: evaluated
    supersedes_audit_id: 2026-10-27-anchiornis-huxleyi-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, xu2009, li2010, watt2009, meredith2006]
    summary: >-
      Pass 2 of the 2.0 nm detail-scale Schnakenberg model (a=0.062, b=1.28,
      Du=0.72, Dv=31.5) at 160.0 Ma, chronoseries 1/1. Analytical lambda_c is
      2.0 nm; the nonlinear band-weighted wavelength is 2.517 nm and is now
      archived in the reference JSON. Wide versus tight holotype ROIs differ by
      foreground delta -0.0082. The comparison figure draws the equal-diffusion
      control field (std 0.00231, sigma_max -0.447) beside the patterned field
      (std 0.367). Dispersion fit Pearson r=0.99999999, RMSE=6.1e-5. GIF is
      12 frames at 640x480; last-frame CV similarity to the holotype is 96.0.
      Overall 89.0/100. The 29 nm envelope remains the coarser mode (ratio 14.45);
      there is no successor chronospecies.
    claim_boundary:
      reported_in_source:
        - "Xu et al. 2009: Anchiornis huxleyi holotype IVPP V14378, Tiaojishan Formation, pennaceous feathers on forelimbs and hindlimbs."
        - "Li et al. 2010: melanosome shape is the evidence for Anchiornis plumage color. Organelle lengths are hundreds of nanometres."
        - "Turing 1952: a critical wavenumber k_c when the inhibitor diffuses sufficiently faster than the activator."
        - "Watt, Bothma and Meredith 2009: eumelanin is a stacked oligomeric sheet at nanometre scale."
      reconstructed_in_script:
        - "Schnakenberg kinetics and the dispersion relation, with parameters chosen for this 2.0 nm detail slot."
        - "Length unit that places analytical lambda_c at 2.0e-9 m."
        - "Equal-diffusion ablation drawn as a field, Dv sweep, pure-mode growth-rate fit, and a second holotype ROI."
        - "Final GIF frame: holotype photograph times a weak function of the simulated field."
      transfer_boundary:
        - "2.0 nm is the assigned detail scale identified with the melanin sheet mode. Li et al. 2010 did not measure 2.0 nm."
        - "The museum photograph is not a 2 nm micrograph. Image fitness compares the registered final frame to that photograph."
      does_not_claim:
        - "That Schnakenberg kinetics are the Anchiornis melanin pathway."
        - "That a successor chronospecies of Anchiornis exists in this series."
        - "That slot 1229 parameters were copied. That slot publishes none."
        - "That these nanopublications were cryptographically signed. No nanopub profile was present."
    scores:
      model-fidelity:
        value: 91
        rationale: >-
          Unchanged governing system from pass 1: Schnakenberg steady state,
          Jacobian, dispersion, k_c inside the unstable band, and det=(a+b)^2.
          Five Lean theorems, 0 sorry, encode the trace sign, positive determinant,
          Dv/Du>40, the rounded band, and the factor-of-14 gap versus the 29 nm
          envelope. The pass-2 figure now shows the equal-diffusion field that
          the algebra says must decay. Still a reconstruction: Li et al. 2010
          do not print this PDE.
        evidence:
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [62, 115], note: "steady state, Jacobian, sigma(k), k_c and band", supports: true}
          - {file: morphoeval/lean/loops/Loop_3111_anchiornis_huxleyi_turing_wavelength_s0.lean, lines: [8, 37], note: "five decide theorems, 0 sorry", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [675, 699], note: "self-test locks trace, det, band, 2.0 nm, equal-D stability, r>0.98", supports: true}
      specimen-match:
        value: 86
        rationale: >-
          Holotype photograph, wide-ROI mask, patterned field, and the decayed
          control field are in the comparison figure. Wide foreground fraction
          0.921 and tight foreground fraction 0.929 (delta -0.0082), so the
          fossil occupancy is not an artifact of one crop. The GIF last frame
          remains the holotype with a weak field modulation; CV similarity is 96.0
          at 12 frames and 640x480. The developing frames are still a periodic
          molecular patch, which is why this is not a higher score.
        evidence:
          - {file: docs/media/anchiornis_huxleyi_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "holotype, mask, pattern, dispersion, sweep, equal-D field", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [301, 317], note: "wide 18-82% ROI and tight 30-70% ROI", supports: true}
          - {file: docs/media/anchiornis_huxleyi_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640x480, last frame specimen-registered", supports: true}
      parameter-expressivity:
        value: 90
        rationale: >-
          Dv in {18, 24, 31.5, 42, 56} lowers analytical lambda_c at every step.
          The equal-diffusion control is now an image: std 0.00231 against patterned
          std 0.367 (ratio 159) and sigma_max -0.447. Pass-1 remediation R2 is
          closed by that panel.
        evidence:
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [241, 254], note: "Dv sweep", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [480, 490], note: "comparison figure draws the equal-diffusion field", supports: true}
          - {file: datasets/anchiornis_huxleyi_turing_wavelength_s0/anchiornis_huxleyi_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "monotonic sweep flag and control versus pattern std", supports: true}
      morphometric-validation:
        value: 88
        rationale: >-
          Pearson r=0.99999999 and RMSE=6.1e-5 on pure-mode growth versus
          analytical sigma(k); KS between those samples is 0.1. Nonlinear
          band-weighted wavelength 2.517 nm versus the analytical target 2.0 nm.
          Wide versus tight specimen foreground delta is -0.0082 versus a
          zero-difference prior. Circularity 0.128 versus 1, aspect 1.0 versus
          the eumelanosome prior 3 (different object), radial KS specimen versus
          pattern 0.75. None of these numeric references are copies of the values.
        evidence:
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [183, 239], note: "pure-mode Pearson r, RMSE, KS", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [547, 673], note: "measure_morphoeval including the ROI delta row", supports: true}
          - {file: datasets/anchiornis_huxleyi_turing_wavelength_s0/anchiornis_huxleyi_turing_wavelength_s0_reference.json, lines: [0, 0], note: "measured_nonlinear_wavelength archived next to the 2.0 nm target", supports: true}
      source-traceability:
        value: 93
        rationale: >-
          Six DOIs in the bib, CC BY-SA 4.0 holotype with creator, date, source
          URL, and SHA-256 checked at runtime. Pass 2 writes the measured 2.517 nm
          wavelength into the reference JSON beside the analytical 2.0 nm target
          and the 160.0 Ma age. OpenAlex was HTTP 429; Crossref and Wikimedia
          were the sources actually used.
        evidence:
          - {file: datasets/anchiornis_huxleyi_turing_wavelength_s0/paper_citations.bib, lines: [1, 66], note: "six DOIs", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [338, 351], note: "SHA-256 and scale/age checks", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [537, 545], note: "archives measured_nonlinear_wavelength into the reference JSON", supports: true}
      code-traceability:
        value: 87
        rationale: >-
          Docstring, Jacobian, dispersion, critical wavenumber, and the Lean
          integers name the same parameter point. Pass 2 adds _segment_roi and
          the control-field panel without changing the equations those functions
          implement. Lean remains integer inequalities rather than a floating-point
          eigenvalue proof.
        evidence:
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [1, 30], note: "docstring PDE, 2.0 nm, 160.0 Ma, claim boundary", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-anchiornis-huxleyi-turing-wavelength-s0.yaml, lines: [1, 55], note: "model_spec and laws", supports: true}
      repro-package:
        value: 90
        rationale: >-
          Seed 3111, dt=0.004 below dx^2/(4 Dv)=0.0079, --self-test, and a
          default run that rewrites PNG, GIF, metrics, and the archived wavelength.
          Pass 2 re-ran both commands after the ROI and control-field changes.
          Deduction: checkpoint commit 0c76d15d predates these files, and the
          nanopubs are unsigned because no profile exists.
        evidence:
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [675, 699], note: "self_test", supports: true}
          - {file: models/2026-delphi10000-anchiornis-huxleyi-turing-wavelength-s0.py, lines: [702, 730], note: "render plus frame and Pearson asserts", supports: true}
    remediation:
      - id: R1
        item: "RESOLVED in pass 2. Wide (18-82%) and tight (30-70%) holotype ROIs; foreground delta -0.0082."
      - id: R2
        item: "RESOLVED in pass 2. The comparison figure draws the equal-diffusion control field, std 0.00231."
      - id: R3
        item: "RESOLVED in pass 2. reference JSON measured_nonlinear_wavelength.band_weighted_wavelength_nm = 2.517 next to analytical 2.0 nm."
    needs:
      - id: N1
        need_type: morphometric_validation
        target_dimension: morphometric-validation
        description: "Second ROI sensitivity on the holotype segmentation."
        status: resolved
        novelty_n: 0.4
        contradiction_c: 0.0
        depth_d: 1.0
        age_days_a: 0
      - id: N2
        need_type: parameter_sweep
        target_dimension: parameter-expressivity
        description: "Show the decayed equal-diffusion field beside the patterned field."
        status: resolved
        novelty_n: 0.3
        contradiction_c: 0.0
        depth_d: 1.0
        age_days_a: 0
      - id: N3
        need_type: provenance_lock
        target_dimension: source-traceability
        description: "Archive the measured nonlinear wavelength in the reference JSON."
        status: resolved
        novelty_n: 0.2
        contradiction_c: 0.0
        depth_d: 1.0
        age_days_a: 0
