    claim_boundary:
      reported_in_source:
      - 'Turing 1952: a two-species reaction-diffusion system has a critical wavenumber when the inhibitor diffuses
        sufficiently faster than the activator.'
      - 'Nakamasu et al. 2009: zebrafish melanophores and xanthophores interact as a short-range activation / long-range
        inhibition pair.'
      - 'Hiscock & Megason 2015: anisotropy can restrict the unstable wavevector to one axis and thereby orient
        stripes.'
      - 'Quigley et al. 2004 and Patterson et al. 2014: D. nigrofasciatus expresses broken stripes or spots relative
        to D. rerio.'
      reconstructed_in_script:
      - Schnakenberg kinetics with a=0.11, b=1.24, Du=0.80, Dv_y=20.80, gamma=0.1989, anisotropy 3.85, on a 288.96
        × 144.48 µm periodic window.
      - Numerical growth rates compared with the analytical eigenvalue on 12 wavenumbers.
      - Fish outline segmented from the vendored specimen and used as the GIF domain.
      transfer_boundary:
      - The 24.08 µm window is magnified onto the adult outline. Adult flank stripes are not 24 µm wide.
      - gamma and Dv_y are chosen so the dispersion peak lies on the assigned scale; they are not a published parameter
        table.
      does_not_claim:
      - That this continuum field is the Nakamasu three-cell network or a Volkening-Sandstede agent model.
      - That D. nigrofasciatus was measured at 24.08 µm in the cited papers; the predecessor contrast is the anisotropy
        mechanism at this assigned scale.
      - A nanopublication signature. ~/.nanopub/profile.yml is not present.
