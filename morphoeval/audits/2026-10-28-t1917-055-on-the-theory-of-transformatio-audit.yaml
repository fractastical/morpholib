# MorphoEval audit — Thompson (1917) Ch. XVII Figs. 394-400, rhinoceros-allied skulls
# (Osborn) compared by coordinate-grid transformation (T1917-055, slot 244), 2026-10-28 — Pass 1 (v1)
#
# Single-assessor Pass 1 of `thompson/claims/t1917-055_on-the-theory-of-transformations.py`.
# LIMITATION: builder and assessor are the same agent (Gemini 4 Argon); no independent second
# assessor.  This audit should not be quoted as dual-agent consensus (remediation R1).
#
# Headline (Pass 1): automatic peak-picking on Figs. 394-395 yields 40 matched grid intersections
# between Hyrachyus and Aceratherium; a thin-plate spline phi on those nodes applied to the Hyrachyus
# skull boundary gives Procrustes distance 0.370 vs identity 0.377 (TPS beats identity) but affine
# interpolation 0.360 beats TPS on the primary Procrustes metric.  Six secondary pairs
# (occipital variants, titanothere, tapir, horse, rabbit) are scored the same way; only three of six
# beat identity on Procrustes.  Grid correspondences are greedy normalized-bbox nearest-neighbour
# matches, not Thompson's hand-labelled nodes.
# Weaknesses to remediate in Pass 2: no parameter-regime sweep in the first audit run (an attempted
# 36-setting sweep over all seven pairs hung); no shuffled-grid null; no correspondence-free IoU,
# Pearson r, or chamfer RMSE; no numerical Jacobian (no-fold) check; no descriptive CV pass on the
# vendored Ceratotherium photograph; affine beating TPS left the methodological claim ambiguous.

audit:
  id: 2026-10-28-t1917-055-on-the-theory-of-transformatio-audit
  rubric_version: 0.1.0
  date: "2026-10-28"
  assessor:
    id: gemini-4-argon
    label: "Gemini 4 Argon (builder-assessor, single-agent Pass 1; second assessor pending)"
    homepage: https://ai.google.dev
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
  publisher_github: https://github.com/fractastical
  license: https://creativecommons.org/licenses/by/4.0/
  code_creators:
    - id: joel-dietz
      name: "Joel Dietz"
      github: https://github.com/fractastical
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: 530b3b50c
    environment:
      python: "3.12"
      numpy: "1.26.4"
      scipy: "1.x (pip, requirements.txt lower bound >=1.7)"
      scikit-image: ">=0.19"
      matplotlib: ">=3.3"
      Pillow: ">=8.0"
      lean: "4.35.0 (elan stable)"
    note: >-
      Pass 1 of the 12-step loop 2026-10-28-t1917-055-on-the-theory-of-transformatio-loop.
      Default analysis run only; self-test passes on pinned inputs.  Comparison PNG regenerated
      by the script and git-ignored (docs/media/*.png); growth GIF tracked when emitted.

references:
  thompson1917:
    title: "On Growth and Form (Ch. XVII, On the Theory of Transformations, pp. 760-764, Figs. 394-400, skulls after Osborn)"
    authors: "Thompson DW (figures after Osborn HF, 1898)"
    venue: "Cambridge University Press (1917)"
    url: https://archive.org/details/ongrowthform1917thom
  osborn1898:
    title: "The Extinct Rhinoceroses of North America"
    authors: "Osborn HF"
    venue: "Memoirs of the American Museum of Natural History 1(3) (1898)"
    url: https://archive.org/details/extinctrhinocero01osbo
  bookstein1989:
    title: "Principal warps: thin-plate splines and the decomposition of deformations"
    authors: "Bookstein FL"
    venue: "IEEE Trans. Pattern Anal. Mach. Intell. 11(6):567-585 (1989)"
    doi: 10.1109/34.24792
  leporidae_portfolio:
    title: "Modern Leporidae skull GM cache (portfolio JSON)"
    authors: "morpholib thompson/portfolio"
    venue: "repository-local"
    url: https://github.com/fractastical/morpholib/blob/main/thompson/portfolio/results/leporidae_skulls.json
    role: pre-scouted analogue — DATASET_MISMATCH (perissodactyl series vs rabbit clade), not used in verdict

simulations:
  - id: thompson1917-t1917-055
    name: "Thompson (1917) Figs. 394-400: rhinoceros and allied skulls by coordinate-grid transformation (Osborn)"
    organism: "Hyrachyus agrarius, Aceratherium tridactylum, Titanotherium, tapir, horse, rabbit (diagrammatic skulls after Osborn; Thompson pp. 760-764)"
    script: thompson/claims/t1917-055_on-the-theory-of-transformations.py
    output: docs/media/t1917_055_on_the_theory_of_transformatio_comparison.png
    extra_outputs:
      - docs/media/t1917_055_on_the_theory_of_transformatio_growth.gif
      - datasets/thompson_1917/t1917-055/result.json
    status: evaluated
    source_refs: [thompson1917, osborn1898, bookstein1989, leporidae_portfolio]
    summary: >-
      Pass 1 (v1).  Peak-picked grid intersections and arc-length skull boundaries on nine IA-pinned
      panels; greedy normalized-bbox matching (maxd=0.12).  Primary Hyrachyus (394) -> Aceratherium
      (395): 40 matched nodes; TPS outline Procrustes 0.370 vs identity 0.377 vs affine 0.360 — TPS
      beats identity but affine wins on Procrustes.  Six secondary pairs reported; 3/6 TPS beats
      identity.  No parameter sweep completed (full 36 x all-pairs matrix hung).  No shuffled-grid
      null, IoU, Pearson r, chamfer, or Jacobian check in the Pass 1 verdict file.  Grid matching is
      automatic, not hand-labelled.  Verdict in result.json: mixed.  Overall 67.0/100.
    claim_boundary:
      reported_in_source:
        - "Fig. 394 Hyrachyus skull with rectangular Cartesian grid; Fig. 395 Aceratherium in a deformed grid (p. 760-761)"
        - "occipital Aceratherium variants related by conformal transformations (Fig. 396, p. 762)"
        - "extensions to Titanotherium, tapir, horse, and rabbit by the same method (Figs. 397-400, pp. 763-764)"
        - "methodological claim that allied skulls differ by smooth coordinate transformation of a common diagram"
      reconstructed_in_script:
        - "phi as a thin-plate spline on automatically matched grid peaks (not digitised grid ink line-by-line)"
        - "skull outlines from largest connected component + arc-length semilandmarks"
        - "identity and affine-only controls; Procrustes distance as the sole quantitative fit statistic in Pass 1"
      transfer_boundary:
        - "Thompson's hand-placed grid correspondences are approximated by greedy NN on normalized bounding boxes"
        - "affine beating TPS on the primary pair weakens the claim that a non-affine TPS grid is necessary for Aceratherium"
      does_not_claim:
        - "that automatic grid matching equals Thompson's anatomical node pairing"
        - "that modern 3D geometric-morphometric datasets validate the rabbit/horse panels (Leporidae cache is a labelled mismatch)"
        - "that the Ceratotherium photograph (vendored) was analysed in Pass 1"
    scores:
      model-fidelity:
        value: 72
        rationale: >-
          E2/E6 (equidistant interpolation), E4 (TPS), E5 (affine) and E7 (best-fit stage) are
          implemented as in the reference JSON and mirrored by eight Lean theorems in Loop_244
          (endpoints/equidistance, similarity equivariance, no-fold along grid lines, affine
          determinants).  Deductions: Thompson's drawn grid lines are not digitised; phi is fit on
          peak-picked intersections; the primary pair favours affine over TPS on Procrustes distance;
          E1 (det D phi > 0) is proved in Lean but not checked numerically on the fitted TPS in Pass 1.
        evidence:
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [184, 227], note: "tps_fit/tps_apply (E4), affine_fit/affine_interp_matrix (E5), interp_stage (E2/E6), best_fit_t (E7)", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_055.lean, lines: [16, 102], note: "interp4, interpDet; eight theorems compile under Lean 4.35.0 with 0 sorry", supports: true}
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [448, 472], note: "primary Procrustes: TPS 0.370 < identity 0.377 but affine 0.360 < TPS; no Jacobian check in Pass 1 run", supports: false}
      specimen-match:
        value: 62
        rationale: >-
          Side-by-side figure with Fig. 394/395 crops, detected grid landmarks, primary predicted-vs-drawn
          overlay, secondary Procrustes bar chart, and control bar chart (TPS/identity/affine only in
          Pass 1).  Predicted Aceratherium outline is visibly deformed from Hyrachyus.  Deductions:
          correspondences are automatic; secondary rabbit/horse panels are coarse; Ceratotherium MNHN
          photograph is pinned but not segmented in Pass 1.
        evidence:
          - {file: docs/media/t1917_055_on_the_theory_of_transformatio_comparison.png, lines: [0, 0], note: "six-panel comparison (Pass 1): grids, primary overlay, secondary bars, three-way control bars", supports: true}
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [628, 697], note: "render_comparison: primary TPS outline vs drawn Aceratherium; secondary Procrustes distances", supports: true}
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [326, 373], note: "grid_landmarks + match_grids: automatic peak matching, not hand labels", supports: false}
      parameter-expressivity:
        value: 42
        rationale: >-
          Growth GIF deforms the primary grid over t (33 frames) and CLI exposes --maxd, --lam, and
          --n-boundary, but Pass 1 ran defaults only.  SWEEP_* constants exist but no completed sweep
          was reported; an attempted 36-setting sweep across all seven pairs hung.  Only one
          transformation family (TPS) is compared to affine at default settings.
        evidence:
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [700, 735], note: "render_growth_gif: phi_t on primary Hyrachyus->Aceratherium grid", supports: true}
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [552, 585], note: "parameter_sweep defined but not executed in Pass 1 audit run; full matrix hung", supports: false}
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [858, 867], note: "--maxd / --lam / --n-boundary exposed; single default run only in Pass 1", supports: false}
      morphometric-validation:
        value: 52
        rationale: >-
          Primary and secondary pairs report Procrustes distance of the TPS-carried outline vs the drawn
          target, compared with identity and affine controls.  TPS beats identity on the primary pair
          but loses to affine on Procrustes.  Missing in Pass 1: shuffled-grid null, IoU, Pearson r,
          chamfer RMSE, permutation p-values, sweep stability, and correspondence uncertainty from
          automatic matching.
        evidence:
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [414, 479], note: "analyze_pair: TPS, identity, affine Procrustes; secondary six pairs", supports: true}
          - {file: datasets/thompson_1917/t1917-055/result.json, lines: [24, 40], note: "headline_numbers: Procrustes TPS/identity/affine; no IoU/r/chamfer/null block in Pass 1 export", supports: true}
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [414, 479], note: "no shuffled_grid_null, IoU, or chamfer in Pass 1 scoring path", supports: false}
      source-traceability:
        value: 87
        rationale: >-
          Six vendored inputs are SHA-256 pinned in the reference JSON and re-verified at runtime
          (fail closed); IA item, leaf crops, Commons Ceratotherium file page, Osborn/Thompson/Bookstein
          references in paper_citations.bib; Leporidae portfolio cache recorded as DATASET_MISMATCH.
          Deduction: Thompson 1917 has no DOI (IA URL only).
        evidence:
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [111, 122], note: "verify_inputs: SHA-256 of every pinned input, raises on mismatch", supports: true}
          - {file: datasets/thompson_1917/t1917-055/scout_manifest.json, lines: [0, 0], note: "IA pins, Commons pin, portfolio mismatch record", supports: true}
          - {file: datasets/thompson_1917/t1917-055/paper_citations.bib, lines: [1, 46], note: "Thompson, Osborn, Bookstein, IA, Commons entries", supports: true}
      code-traceability:
        value: 81
        rationale: >-
          Module docstring maps E1-E7 to functions, quotes source passages, names the Lean mirror and
          claim boundary; function docstrings cite equations where relevant; morphoeval/math_kg_loops
          pins lean_theorem and code_locus per law.  Deduction: KG code_locus entries name the script
          path without line ranges; Pass 1 statistics are thinner than the equation list.
        evidence:
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [1, 50], note: "docstring: claim, source quotes, E1-E7 map, data pins, usage", supports: true}
          - {file: morphoeval/math_kg_loops/thompson1917-t1917-055.yaml, lines: [1, 35], note: "equations with lean_theorem, lean_locus, code_locus", supports: true}
      repro-package:
        value: 73
        rationale: >-
          Deterministic analysis (fixed SEED=1917 for any stochastic null later), fail-closed input
          hashes, self-test covering E2/E4/E5/E7 and primary >=40 matches, documented CLI, outputs to
          declared paths.  Deductions: dependency versions via requirements.txt lower bounds only;
          comparison PNG git-ignored; Pass 1 did not run sweep or specimen modules in the audit loop.
        evidence:
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [811, 855], note: "self_test: hash verify, E2/E6/E4/E5/E7, primary matched >=40, TPS beats identity", supports: true}
          - {file: thompson/claims/t1917-055_on-the-theory-of-transformations.py, lines: [858, 878], note: "CLI: --self-test, --maxd, --lam, --n-boundary, --no-gif", supports: true}
    needs:
      - id: N1
        need_type: parameter_sweep
        target_dimension: parameter-expressivity
        description: "Primary-only sweep over maxd, TPS lambda, and boundary point count; report stability of TPS vs identity and vs affine"
        status: open
      - id: N2
        need_type: morphometric_validation
        target_dimension: morphometric-validation
        description: "Shuffled-grid null; IoU, Pearson r, chamfer RMSE; report when affine beats TPS"
        status: open
      - id: N3
        need_type: specimen_comparison
        target_dimension: specimen-match
        description: "Descriptive bone-vs-matrix CV on Ceratotherium simum MNHN photograph; enlarge control panel"
        status: open
      - id: N4
        need_type: model_equation
        target_dimension: model-fidelity
        description: "Numerical no-fold (Jacobian determinant) check of phi_t on the primary TPS grid"
        status: open
      - id: N5
        need_type: independent_assessor
        target_dimension: model-fidelity
        description: "Independent second assessor from a different provider"
        status: open
      - id: N6
        need_type: digitisation
        target_dimension: specimen-match
        description: "Hand-labelled or literature-backed grid correspondences vs automatic NN matching"
        status: open
    remediation:
      - id: R1
        item: "Independent second assessor (different provider) — this round is builder-scored"
      - id: R2
        item: "Parameter-regime sweep (primary Hyrachyus->Aceratherium only): maxd in {0.08,0.10,0.12,0.15}, lambda in {0,1e-3,1e-2,0.01}, n_boundary in {80,120,160}; avoid all-pairs matrix that hung Pass 1"
      - id: R3
        item: "Shuffled-grid null: permute target grid landmarks before TPS fit; compare Procrustes to nominal pairing"
      - id: R4
        item: "Correspondence-free and coordinate goodness of fit: IoU of filled outlines, Pearson r, RMSE/centroid size, symmetric chamfer RMSE/centroid size"
      - id: R5
        item: "Jacobian no-fold check of the primary TPS on a dense grid inside the skull (min det D phi_t over t in [0,1])"
      - id: R6
        item: "Ceratotherium specimen bone-vs-matrix segmentation as descriptive CV (excluded from verdict); add shuffled control to comparison figure"
