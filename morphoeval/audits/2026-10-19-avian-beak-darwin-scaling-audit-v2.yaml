# MorphoEval audit — Campàs et al. (2010) PNAS & Abzhanov et al. (2004, 2006) Darwin's Finch Beak Scaling & Shear, 2026-10-19 (v2)
#
# Pass 2 (v2) evaluation of `2021-alberti-avian-beak-darwin-scaling.py` (776 lines)
# after completing the 12-step closed remediation loop (`2026-10-19-avian-beak-darwin-scaling-loop`):
#   - Primary assessor: Gemini 4 Argon — 93.2 / 100 (up from 56.6 / 100 in v1; +36.6 overall)
#
# Key remediation improvements verified in Pass 2:
#   1. Implemented the full 3-parameter Campàs–Brenner affine scaling-and-shear group
#      transformation M(s_L, s_D, gamma) = [[1, gamma], [0, 1]] @ [[s_L, 0], [0, s_D]]
#      and analytical inverse M^-1 (`affine_scaling_shear_matrix`, `evaluate_14_species_affine_collapse`,
#      L112-304) across all 14 Darwin's finch species (Groups A, B, and C), collapsing
#      Group A under pure scaling (RMS = 0.0021) and all 14 species under scaling + shear
#      (RMS = 0.0021, Pearson r = 0.9999) while proving that pure scaling (gamma = 0) fails
#      on Groups B & C (negative-control RMS = 0.0937, 45.2x error reduction).
#   2. Implemented the 2D/3D Bmp4–Calmodulin mesenchymal growth field, cantilever bending
#      stiffness index I_beam = W*D^3/(12*L) (bite-force log-log r = 0.9902), and Abzhanov
#      et al. (2004, 2006) retroviral perturbation suite (`simulate_bmp4_cam_mesenchymal_field`,
#      `evaluate_retroviral_perturbations`, L310-387) covering Wild-Type, RCAS::Bmp4
#      (-> Geospiza magnirostris, I_beam = 22.8x), RCAS::Noggin, and RCAS::CaM (-> Geospiza scandens).
#   3. Implemented computer-vision contour extraction (`segment_darwin_finches_specimen`,
#      L393-490) on the SHA-256-locked 1845 John Gould Darwin's finches lithograph
#      (`datasets/avian_beak_darwin_scaling/darwin_finches_specimen.jpg`), extracting upper
#      culmen and lower mandible contours across Geospiza magnirostris, Geospiza fortis,
#      Camarhynchus parvulus, and Certhidea olivacea (D/L Pearson r = 0.9588, Certhidea
#      shear collapse RMS = 0.0120 vs pure-scaling 0.0412).
#   4. Added runtime SHA-256 verification of all 4 dataset files (`verify_dataset_integrity`,
#      L74-108), CLI physical parameter overrides (`--bmp4-scale`, `--cam-scale`, `--gamma-shear`,
#      `--seed`), and an 8-point `self_test()` suite with bitwise determinism.

