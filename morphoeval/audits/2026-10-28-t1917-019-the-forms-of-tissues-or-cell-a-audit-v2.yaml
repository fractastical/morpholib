          - {file: thompson/claims/t1917-019_the-forms-of-tissues-or-cell-aggregates.py, lines: [1069, 1077], note: "CLI: --delta, --lloyd, --nx", supports: true}
          - {file: docs/media/t1917_019_the_forms_of_tissues_or_cell_a_growth.gif, lines: [0, 0], note: "25-frame Lloyd relaxation with p6 / excess-perimeter trace vs specimen p6", supports: true}
          - {file: thompson/claims/t1917-019_the-forms-of-tissues-or-cell-aggregates.py, lines: [266, 270], note: "p_cut fixed at 1/3; not swept", supports: false}
      morphometric-validation:
