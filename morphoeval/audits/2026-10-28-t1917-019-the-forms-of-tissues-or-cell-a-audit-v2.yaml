# MorphoEval audit v2 (Pass 2 remediation) — Thompson (1917) claim T1917-019, 2026-10-28
#
# Supersedes 2026-10-28-t1917-019-the-forms-of-tissues-or-cell-a-audit (Pass 1, 54.4).
# Remediates R1-R6: the human corneal endothelium specimen is now SEGMENTED (nucleus-
# marker watershed, 126 cells, 85 interior) and every polygon statistic of the claim is
# measured on tissue; Thompson's own Fig. 125 A/B soap froth is digitised through the
# same pipeline; a 50-point delta x Lloyd sweep with TV and joint fits; five controls;
# r / RMSE / TV / KS / chi-square / bootstrap statistics; result.json verdict.
# Same single builder-assessor limitation as v1 (R7 open).  Overall 54.4 -> 77.5.
#
# Headline result: the corneal endothelium is a trivalent froth with <n> = 5.89
# [5.78, 6.01] (window-corrected 6.08), p6 = 0.66 [0.55, 0.77], mu2 = 0.34, 100 %
# three-way junctions, area CV 0.285 (clinical norm 0.315) and an excess perimeter of
# 8.6 % over the Hales honeycomb bound for its own cell areas.  All three readings of
# Thompson's claim pass on his own exemplar tissue -> verdict SUPPORTED, with the
# qualification that the strict "approximately hexagons" reading is tissue-state
# dependent: the specimen differs from the proliferating-epithelium spectrum of Gibson
# 2006 (chi-square p = 0.005), which has p6 = 0.46 < 0.5.

