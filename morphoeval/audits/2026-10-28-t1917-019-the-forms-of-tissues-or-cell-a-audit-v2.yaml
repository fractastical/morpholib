        rationale: >-
          16 measurements, 14 measured on the specimen or the 1917 plate, each with a
          literature reference: p6 0.659 vs clinical norm 0.616 (within 0.55-0.70), area
          CV 0.285 vs 0.315, <n> 5.89 vs 6, trivalent 1.00 vs 1, Lewis lambda 0.18 vs 0.25,
          Aboav a 0.74 vs 1.2, excess perimeter 8.6 % vs the Hales bound 0; bootstrap 95 %
          CIs; r / RMSE / TV / KS and chi-square against Gibson, best froth, honeycomb and
