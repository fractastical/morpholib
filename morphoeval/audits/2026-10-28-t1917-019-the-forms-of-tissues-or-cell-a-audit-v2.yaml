    scores:
      model-fidelity:
        value: 78
        rationale: >-
          The froth laws (E1-E5) are implemented exactly and proved in Lean; the claim is
          now actually tested — Euler mean six, trivalency, honeycomb bound and hexagon
          fraction are all measured on tissue and on Thompson's own Fig. 125.  The division
          chain (E6) reproduces Gibson's spectrum to 0.03 and its ablation shows cleavage
          geometry matters.  Remaining gap: least perimeter is modelled by Lloyd relaxation
          (a proxy), and the froth model class cannot match topology and area dispersion
          simultaneously (joint fit), which the script records rather than hides.
        evidence:
          - {file: thompson/claims/t1917-019_the-forms-of-tissues-or-cell-aggregates.py, lines: [198, 257], note: "polygon_statistics: <n>, mu2, p_n, excess perimeter vs 2*12^(1/4) sqrt(A), Lewis, Aboav-Weaire, sum rule, shuffle control", supports: true}
          - {file: thompson/claims/t1917-019_the-forms-of-tissues-or-cell-aggregates.py, lines: [316, 360], note: "tessellation_from_labels: label adjacency with >= 4 px contact, Crofton perimeters, interior mask, 2x2 junction valence", supports: true}
          - {file: thompson/claims/t1917-019_the-forms-of-tissues-or-cell-aggregates.py, lines: [486, 514], note: "fit_to_specimen: TV fit and joint topology+geometry fit; gap between them is a recorded finding", supports: true}
          - {file: thompson/claims/t1917-019_the-forms-of-tissues-or-cell-aggregates.py, lines: [151, 163], note: "lloyd_step remains a centroidal-Voronoi proxy for surface-tension relaxation", supports: false}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_019.lean, lines: [115, 148], note: "Law 3: P_6^4 = 192 A^2 < 256 A^2 < 432 A^2 and the Hales constant identity, proved", supports: true}
      specimen-match:
        value: 72
        rationale: >-
          Side by side: the segmented corneal endothelium coloured by polygon class, the
          digitised Fig. 125 A/B, and the best-fit froth.  The tissue reads as a mildly
          disordered hexagonal froth and the best-fit froth matches its polygon spectrum
          (TV 0.054, chi-square p = 0.42); but the relaxed CVT froth is visibly more
          uniform in cell size (area CV 0.10 vs 0.285), the joint fit shows no sweep point
          matches both, and the comparison rests on a single specimen.
        evidence:
          - {file: docs/media/t1917_019_the_forms_of_tissues_or_cell_a_comparison.png, lines: [0, 0], note: "panels (a) segmented specimen with side numbers, (b) Fig. 125 A/B digitised, (c) best-fit froth, (f) (p6, mu2) morphospace", supports: true}
          - {file: thompson/claims/t1917-019_the-forms-of-tissues-or-cell-aggregates.py, lines: [363, 397], note: "segment_tissue: nucleus-marker watershed (126 cells; prototype overlay inspected visually: boundaries follow the alizarin outlines)", supports: true}
          - {file: thompson/claims/t1917-019_the-forms-of-tissues-or-cell-aggregates.py, lines: [534, 557], note: "draw_segmentation overlay coloured by polygon class", supports: true}
          - {file: datasets/thompson_1917/t1917-019/result.json, lines: [0, 0], note: "joint_fit_area_cv_diff = -0.10: no froth in the sweep matches the tissue's size dispersion", supports: false}
