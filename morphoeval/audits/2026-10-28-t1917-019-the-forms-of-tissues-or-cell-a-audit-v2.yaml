simulations:
  - id: thompson1917-t1917-019
    name: "Thompson (1917) Ch. VII — tissue cells as hexagons / froth vs. human corneal endothelium (Pass 2: segmented specimen, sweep, controls, statistics)"
    organism: "Homo sapiens — corneal endothelium in situ (ocular monolayer epithelium); Elodea canadensis leaf epidermis (secondary, visual only)"
    domain: morphogenesis
    script: thompson/claims/t1917-019_the-forms-of-tissues-or-cell-aggregates.py
    also:
      - morphoeval/lean/loops/Thompson1917_T1917_019.lean
      - morphoeval/math_kg_loops/thompson1917-t1917-019.yaml
    output: docs/media/t1917_019_the_forms_of_tissues_or_cell_a_comparison.png
    extra_outputs:
      - docs/media/t1917_019_the_forms_of_tissues_or_cell_a_growth.gif
      - datasets/thompson_1917/t1917-019/t1917_019_the_forms_of_tissues_or_cell_a_metrics.json
      - datasets/thompson_1917/t1917-019/result.json
    status: evaluated
    supersedes_audit_id: 2026-10-28-t1917-019-the-forms-of-tissues-or-cell-a-audit
    source_refs: [thompson1917, gibson2006, farhadifar2007, hales2001, lewis1928, aboav1970, weaire1984, sanchezgutierrez2016, sheng2007, he2015]
    summary: >-
      Specimen (85 interior cells of 126): <n> = 5.894 [95 % CI 5.78, 6.01], window-bias
      corrected 6.08; p6 = 0.659 [0.55, 0.77], p5 = 0.224, p7 = 0.118, mu2 = 0.34; 100 %
      trivalent junctions; median shape index 3.96 (regular hexagon 3.72, square 4.00);
      area CV 0.285 vs clinical norm 0.315; excess perimeter 7.7 % raw, 8.6 % after the
      rasterised-froth pipeline correction; Lewis lambda 0.18 (Lewis 1928: 0.25); Aboav
      a = 0.74 (froths 1.0-1.5), neighbour-shuffle control a = 6.1.  Thompson's Fig. 125:
      A (compressed) p6 = 0.89, B (relaxed) p6 = 0.97.  Best topology fit: fully relaxed
      CVT froth (delta = 1.0, Lloyd = 20), TV = 0.054, r = 0.99, chi-square p = 0.42;
      joint topology+geometry fit (delta = 0.2, Lloyd = 0) cannot match the tissue's area
      CV (model 0.18) — the froth model class reproduces the tissue's topology but not its
      size dispersion.  Specimen vs Gibson 2006 proliferating spectrum: r = 0.94, RMSE
      0.10, chi-square p = 0.005 (significantly more hexagonal).  Verdict: SUPPORTED on
      Thompson's own exemplar tissue (C1 mean six, C2 least perimeter within 10 %, C3 p6
      modal and >= 0.5), qualified for proliferating epithelia.
    claim_boundary:
      reported_in_source:
        - "Thompson p. 305: cellular tissue resembles a froth"
        - "Thompson p. 309/323: partitions meet three at a point at ~120 degrees (Lamarle minimal-area condition)"
        - "Thompson p. 321: hexagonal pattern illustrated in countless cases but perfectly regular only rarely; eye pigment epithelium as the exemplar"
        - "Thompson p. 325: cells on the average hexagonal, some with fewer and some with more sides than six"
        - "Thompson p. 330: closely packed hexagons give the minimal extent of boundary in a plane"
        - "Thompson Fig. 125 (after Rhumbler): soap froth between plates, compressed (A) and relaxed (B)"
      reconstructed_in_script:
        - "Periodic Voronoi froth morphospace with Gaussian positional disorder delta and Lloyd relaxation; Poisson-Voronoi null"
        - "Nucleus-marker watershed segmentation of the alizarin-red corneal endothelium; distance-peak watershed for line drawings"
        - "Interior-cell polygon statistics, Crofton perimeters, 2x2-window junction valence, Lewis and Aboav-Weaire fits, bootstrap CIs"
        - "Mean-field Gibson 2006 division-topology Markov chain with through-centre cleavage (reconstruction; uniform-random cleavage ablation)"
        - "Rasterised-froth pipeline control: pixel perimeter bias (-0.9 %) and finite-window <n> bias (-0.18) measured on a tessellation with known exact statistics"
      transfer_boundary:
        - "Lloyd (centroidal Voronoi) relaxation is a proxy for surface-tension perimeter minimisation, not a Plateau / vertex-model energy descent"
        - "The honeycomb bound is applied cell-by-cell to the measured area distribution (Hales 2001 proves the equal-area case); the measured excess includes real wall waviness as well as polygon irregularity"
        - "Clinical norms (Sheng & Bullimore 2007) are specular-microscopy regressions for living corneas; the specimen is an ex vivo alizarin-red flat mount"
      does_not_claim:
        - "n = 1 specimen: no population statement about human corneal endothelia"
        - "No um/px scale, so no cell density or absolute area is reported"
        - "The proliferating-epithelium qualification rests on Gibson 2006's published spectrum, not on a segmented proliferating specimen"
        - "The Elodea canadensis image (Thompson Fig. 126 species) is vendored for visual comparison only; chloroplast clutter defeats the automatic pipeline"
