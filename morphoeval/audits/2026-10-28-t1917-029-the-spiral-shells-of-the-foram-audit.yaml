# datasets/thompson_1917/t1917-029/, the regenerated PNG/GIF, t1917_029_metrics.json and result.json,
# and the IA scan pages 591-605 of Thompson (1917) for the claim text and tables.
#
# Independent checks performed (2026-10-28, Linux, python 3.12.3 / numpy 2.5.4 / matplotlib 3.11.2 /
# Pillow 13.0.0 / scipy 1.18.1):
#   * `--self-test` passes (0.4 s); full run 2.4 s; outputs reproduced with identical SHA-256
#     (PNG 3ac36d67..., GIF 71030d8c...).
#   * Dryad files: SHA-256 equal to the digests served by the Dryad v2 API (f7bb3fe7..., b5ddc656...).
#   * alpha(W=1.5) = 86.31 deg recomputed by hand from cot(alpha) = ln 1.5 / 2 pi = 0.06453 (Thompson p. 593
#     says "about 86 degrees"); von Moller half-whorl refit 1.224 (Thompson 1.225); van Iterson refit 1.323.
#   * The 14 two-magnification specimens (D drop > 15 %) were listed and the longest-segment rule checked
#     on TPJ, SSG, PTI, SSR4 (segments are individually geometric).
#   * Lean file compiled with Lean 4.35.0 (0 sorry) — 5 theorems match the script identities asserted in
#     self_test() L602-L641.

