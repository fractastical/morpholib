simulations:
  - id: metzger-lung-stereotyped-branching
    name: "Metzger et al. (2008) & Menshykau et al. (2012, 2014) mouse lung stereotyped branching modes (Domain D, Planar P, Orthogonal O), FGF10-SHH-Ptch1 Turing mode selection, pleura-confined diffuse-domain FGF10 cavity and stochastic postnatal septation"
    organism: "Mus musculus (embryonic E11-E15 mouse bronchial tree; postnatal P4-P36 alveolarisation)"
    script: 2008-metzger-lung-stereotyped-branching.py
    output: docs/media/lung_stereotyped_branching_modes_comparison.png
    extra_outputs:
      - docs/media/lung_stereotyped_branching_modes_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-lung-stereotyped-branching-modes-audit-v2
    source_refs:
      - metzger2008
      - menshykau2012
      - menshykau2014
      - blanc2012
      - li2009
      - mund2008
      - knust2009
    claim_boundary:
      reported_in_source:
        - "Metzger et al. (2008): the E11-E15 mouse bronchial tree is built from three stereotyped subroutines — Domain Branching, Planar Bifurcation (confined to lobe edges/margins) and Orthogonal Bifurcation (lobe interiors) — composed in a genetically encoded sequence"
        - "Menshykau et al. (2012, 2014): an FGF10 / SHH-Ptch1 receptor-ligand Turing system on a growing epithelial domain selects between apical (bifurcation) and lateral (domain) budding, and mesenchymal geometry biases the direction of outgrowth"
        - "Mund, Stampanoni & Schittny (2008): mouse alveolarisation proceeds in a bulk phase P4-P21 and a continued phase P14-P36; Knust et al. (2009): the adult C57BL/6 mouse lung holds ~2.3e6 alveoli"
      reconstructed_in_script:
        - "3D Bishop-frame D/P/O grammar with the 4m + 1 tip law and a 181-point dihedral sweep; the Menshykau dispersion relation and a 1D spectral PDE mode switch; a quasi-2D diffuse-domain FGF10 cavity bounded by a dilating lens-shaped pleura with the tip as Ptch1 sink, whose supply anisotropy chooses P (0 deg) vs O (90 deg) at each bifurcation; an exact-increment Yule septation ensemble seeded by the grammar's extrapolated E16.5 terminal-unit count; chromatic segmentation and skeletonisation of a bronchial-tree image"
      transfer_boundary:
        - "The pleura model is a transverse cross-section (z-invariant) with a prescribed, tree-independent dilation; tips choose P/O from the field but are not advected by grad F, and the pleura does not deform in response to the tree — the v2 item asked for a 3D moving-boundary phase-field/BEM, which this is not"
        - "lambda_bulk is fitted to the adult alveolar count, so the P36 total is a calibration, not a prediction; the 632 terminal units at E16.5 are a log-linear extrapolation of the vendored E11-E14.5 timecourse table; lambda_cont / lambda_bulk = 0.12 and birth at E19.5 are assumptions"
        - "The 'specimen' is a Wikimedia medical illustration of human bronchioles/alveoli, not a mouse E11-E15 lung; its junction angles are compared with the model's reference angles but cannot validate the mouse grammar"
      does_not_claim:
        - "A 3D moving-boundary mesenchyme, tip chemotaxis, per-age alveolar counts from Mund (2008), digitised Metzger (2008) lineage coordinates, or an independent prediction of the adult alveolar number"
    summary: >-
      Pass 3 (v3 remediated) evaluation of `2008-metzger-lung-stereotyped-branching.py`
      (overall down slightly from 91.1 in Pass 2 despite both v2 remediation items being closed, because
      the round exposed defects that Pass 2 had not scored). The script now couples the Metzger (2008)
      D/P/O grammar to a diffuse-domain FGF10 cavity bounded by a dilating pleura (L612-963) so that the
      margin -> Planar / interior -> Orthogonal switch is emergent (position sweep x*/L_x = 0.54, critical
      half-thickness h* = 0.944 l0, slab-check error 0.026 with first-order convergence), replaces the
      circular Pass 2 lineage dihedral comparison with an emergent one (RMSE 3.13 deg, 8/8 mode accuracy,
      emergent isotropy vs hull flatness r = 0.996), and extends the grammar beyond E16.5 with an
      exact-increment Yule septation ensemble (632 units x 12 seeds, P36 = 2.32e6 vs the 2.3e6 calibration
      target, unit CV 0.998 vs Yule 0.9999, deterministic no-septation control frozen at 632). Five Lean 4
      theorems (0 `sorry`s) are machine-checked, 13 morphometrics are measured, and the 8-block self-test
      passes in ~4.4 s with two-run bitwise determinism. Against that: the pleura half-thickness and
      anisotropy threshold are tuned so the transition sits mid-lobe; each lineage's lobe position is
      assigned from its class label; the E11-E14.5 benchmark table has no per-row provenance and its
      r = 1.0000 tip-count fit is self-referential; two Pass 2 reference values are the model's own outputs;
      the Turing PDE clips R and F to [0.1, 3.2] every step and its seed profiles prescribe the final peak
      spacing; `--seed` is parsed but never used; and the three new DOIs are unverified.
    scores:
      model-fidelity:
        value: 92
        rationale: >-
          The Metzger (2008) 3D D/P/O grammar with the 4m + 1 tip law and the Menshykau (2012, 2014)
          FGF10-SHH-Ptch1 dispersion relation are implemented as in Pass 2 (L183-442, L448-611). Pass 3 adds
          a genuine mechanism for the margin/interior mode switch: the ligand equation is solved in a
          diffuse-domain cavity (Li et al. 2009 formulation, Dirichlet F = 0 beyond the pleura via the
          (1 - psi) F / tau penalty, L656-702), the tip acts as a Ptch1 sink (R^2 = 1 + 3 exp(-r^2/0.25^2)),
          and the P/O decision is the sign of the supply anisotropy (`decide`, L806-839); the solver is
          checked against the exact slab closed form with monotone first-order convergence (L704-747). The
          septation module is an exact-increment Yule process with the Mund (2008) phase structure
          (L1106-1172) and its mean law is proved in Lean (Law 5). Deductions: the cavity is a quasi-2D
          cross-section with a prescribed 15 %/generation dilation (L780-782) rather than a 3D moving
          boundary, tips are not advected by grad F and the pleura does not respond to the tree (-2); the
          switch depends on the tuned pair h_mid = 1.0 / A_c = 0.05 (L117, L123) and on three further
          unsourced constants (L119-121) (-2); `simulate_fgf10_shh_mode_switch` clips R and F to [0.1, 3.2]
          every step (L578-579), uses an unjustified `diff_scale = 0.25` for the domain case (L568), and its
          seed profiles hard-code the final peak spacing, so the apical-vs-lateral outcome is largely
          prescribed by the initial condition (-2, pre-existing, not scored in Pass 2).
        evidence:
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [183, 248], note: "build_subroutine_tree_3d with the Pass 3 dihedral_policy hook (L192, L245-246) replacing the fixed custom_dihedral_deg", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [638, 702], note: "Lens/slab phase fields and solve_diffuse_domain_fgf10: diffuse-domain FGF10 steady state with tip Ptch1 sink and Dirichlet penalty beyond the pleura", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [704, 747], note: "validate_diffuse_domain_against_slab: convergence 0.107 -> 0.056 -> 0.026 vs the exact 1D slab profile", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [749, 848], note: "PleuraConfinedFgf10Policy: cavity_dims dilation (L780-782), decide() anisotropy test (L806-839), single_tip_dihedral (L841-844)", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [1106, 1172], note: "septation_hazard with Mund (2008) bulk/continued phases and exact-increment Yule ensemble", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [116, 123], note: "PLEURA_* and RECEPTOR_* constants: h_mid = 1.0 and A_c = 0.05 are tuned (comment on L117); growth 0.15, gamma 4.0, tip gain 2.0 unsourced", supports: false}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [568, 579], note: "diff_scale = 0.25 for the domain case and per-step clipping of R, F to [0.1, 3.2] in the spectral Turing solver", supports: false}
          - {file: morphoeval/lean/loops/Loop_053_lung_stereotyped_branching_modes.lean, lines: [131, 188], note: "Laws 4-5: pleura_mode_select / pleura_anisotropy_mode_selection and septation_mean / septation_mean_closed_form; file has 5 theorems and 0 sorrys (lean exit 0)", supports: true}
      specimen-match:
        value: 82
        rationale: >-
          The segmentation pipeline (chromatic tissue separation, EDT caliber map, Zhang-Suen skeleton,
          N = 32 three-arm junctions, mean angle 76.49 +/- 14.61 deg, caliber ratio 0.8826, L1197-1346) runs
          unchanged and the figure now carries 8 panels with Panel G (cavity field, pleura contour, candidate
          tips, position-sweep inset) and Panel H (log-scale tips/alveoli timecourse with ensemble band,
          control and target lines, phase shading) rendered from the new modules (L1567-1657). Deductions:
          `bronchial_tree_specimen.jpg` is a Wikimedia medical illustration of human bronchioles and
          alveoli, not a mouse E11-E15 lung, so the junction-angle comparison is a drawing-vs-model match
          and cannot validate the Metzger grammar (-8; this was present in Pass 2 but not scored); the Pass 3
          morphologies (lens cross-section, septated terminal units) are compared with no image of a mouse
          lobe section or alveolar histology (-5); Panel G's legend overlaps the lens and its inset covers the
          upper-right cavity (-2); the emergent P/O choice per lineage uses a single isolated tip (L841-844)
          while the flatness comparison uses the full policy tree, and the two predictors can disagree for
          mid-lobe positions (-1).
        evidence:
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [1237, 1346], note: "segment_bronchial_tree_specimen: chromatic segmentation, skeletonisation and N = 32 junction extraction on the SHA-256-pinned image", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [1567, 1657], note: "Panel G (pleura-confined cavity and emergent switch) and Panel H (stochastic septation timecourse) added to the 2x4 figure", supports: true}
          - {file: docs/media/lung_stereotyped_branching_modes_comparison.png, lines: [0, 0], note: "8-panel figure: A-F unchanged, G cavity field + position sweep inset, H septation timecourse; legend/inset overlap in G", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [1874, 1891], note: "Junction-angle and caliber measurements derive from Wikimedia File:Bronchial_anatomy.jpg, a human medical illustration, not a mouse specimen", supports: false}
      parameter-expressivity:
        value: 90
        rationale: >-
          Pass 2's dihedral sweep, mode-sequence comparison and equal-diffusion control remain (L385-442,
          L521-611). Pass 3 adds two genuine mechanistic sweeps: the subtree root across the lobe
          cross-section x0/L_x in [0, 0.9] with emergent dihedral, tree isotropy and anisotropy reported
          (margin-interior transition x*/L_x = 0.54; L880-925), and the lobe half-thickness with a critical
          h* = 0.944 l0 and monotone anisotropy (L928-963); plus a far-tip FGF10 ablation and the
          deterministic no-septation control (L1175-1191). Four new CLI flags (`--pleura-half-thickness`,
          `--anisotropy-threshold`, `--septation-seeds`, `--septation-cont-fraction`, L2017-2023) are wired
          through `render_outputs` (L2033-2047). Deductions: `--seed` (L2024) is parsed but never passed to
          `render_outputs`, so the RANDOM trees always use the hard-coded 2008 seed (-4); the anisotropy
          threshold and tip gain are swept only implicitly through the position sweep, and no sweep shows
          how x* moves with A_c or h_mid even though the handoff documents that it is sensitive to them (-4);
          the septation continued/bulk ratio is a CLI input, not a swept or fitted quantity (-2).
        evidence:
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [880, 963], note: "run_pleura_position_sweep (11 root positions) and run_pleura_thickness_sweep (critical h*)", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [1175, 1191], note: "run_septation_module: projection + closed-form calibration + ensemble + deterministic no-septation control", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [2009, 2026], note: "CLI flags including the four Pass 3 flags; --seed on L2024 is parsed but unused", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [2033, 2047], note: "render_outputs call: pleura and septation flags forwarded, args.seed not forwarded (dead flag)", supports: false}
      morphometric-validation:
        value: 87
        rationale: >-
          `measure_morphoeval()` reports 13 entries (L1739-1893): the 8 Pass 2 metrics plus the slab-check
          relative error 0.0261 (ref 0), the P/O transition position 0.54 (ref 0.5 convention), the emergent
          dihedral RMSE 3.13 deg (ref 0; 8/8 mode accuracy; non-circular, the observed dihedral is never
          fed back), the ensemble P36 alveolar count 2.32e6 (ref 2.3e6, explicitly labelled a calibration
          target) and the per-unit CV 0.9978 (ref 0.9999, Yule law). The lineage validation now grows each
          tree with the pleura policy instead of the observed dihedral (L969-1044), which closes the Pass 2
          circularity. Deductions: the E11-E14.5 tip-count r = 1.0000 is self-referential because the
          benchmark event counts reproduce 2 + sum(D + P + O) exactly (`pred_tips`, L1004-1011) (-4); the
          `reference_value`s 0.481834 (isotropy contrast, L1838) and 1.4172 (lambda_T, L1848) are the
          model's own outputs recorded as references, unchanged since Pass 2 (-3); the adult alveolar count
          is fitted with 1 dof, so only the CVs, control, plateau and bulk/continued partition are tests and
          no per-age Mund (2008) count is compared (-3); the lung-level CV (0.028 vs 0.040 law) rests on
          12 seeds and the self-test only bounds it below 0.1 (-1); the transition position reference 0.5 is a
          convention written into the dataset JSON, not a measured value (-2).
        evidence:
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [1759, 1810], note: "Five Pass 3 measurements: slab error, transition position, emergent dihedral RMSE, P36 count (labelled calibration), per-unit CV vs Yule law", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [969, 1044], note: "evaluate_empirical_lung_lineages grows each lineage with the pleura policy at its lobe position; emergent_mode_accuracy at L999, no dihedral_obs_deg input to the model", supports: true}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [1834, 1852], note: "reference_value 0.481834 (L1838) and 1.4172 (L1848) are the script's own outputs, not literature values", supports: false}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [1004, 1011], note: "pred_tips = 2 + cumulative D+P+O events from the benchmark table whose event counts were back-filled to match, giving r = 1.0000", supports: false}
          - {file: 2008-metzger-lung-stereotyped-branching.py, lines: [1116, 1172], note: "simulate_postnatal_septation reports unit CV, lung CV vs 1/sqrt(N) law (L1170), bulk share of gain and plateau", supports: true}
      source-traceability:
