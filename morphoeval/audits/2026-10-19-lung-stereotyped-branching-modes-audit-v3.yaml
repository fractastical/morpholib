# MorphoEval audit — Metzger et al. (2008) / Menshykau et al. (2012, 2014) Lung Stereotyped Branching Modes (D, P, O), 2026-10-19 (v3)
#
# Pass 3 re-score of `2008-metzger-lung-stereotyped-branching.py` (now 2053 lines) after the remediation of the
# two open v2 items in the instrumented loop `morphoeval/runs/2026-10-19-lung-stereotyped-branching-modes-loop-pass3`,
# superseding `2026-10-19-lung-stereotyped-branching-modes-audit-v2` (91.1).
#
# What Pass 3 changed (both v2 remediation items, closed as honest reduced models):
#   1. Section 3b (L612-963): a diffuse-domain phase-field model (Li, Lowengrub, Raetz & Voigt 2009) of the
#      lens-shaped mesenchymal cavity bounded by the pleura; the Menshykau FGF10 ligand equation is solved inside
#      it with the epithelial tip as the Ptch1 sink, the cavity dilates 15 %/generation, and the Planar/Orthogonal
#      choice at every bifurcation is now an emergent function of the FGF10 supply anisotropy
#      (`PleuraConfinedFgf10Policy`, plugged into `build_subroutine_tree_3d(..., dihedral_policy=...)`).
#      Verified against the exact 1D slab closed form (relative error 0.107 -> 0.056 -> 0.026 as eps is halved).
#      Reduced to a quasi-2D transverse cross-section — NOT the 3D moving-boundary FEM/BEM the v2 item asked for.
#   2. Section 4b (L1046-1191): exact-increment stochastic Yule septation beyond E16.5 (bulk P4-P21 and continued
#      P14-P36 hazards after Mund 2008), seeded by the grammar's terminal-unit count extrapolated to E16.5 (632),
#      lambda_bulk fitted in closed form (1 dof) to the adult count 2.3e6 (Knust 2009), with a deterministic
#      no-septation control; unit CV 0.998 vs the Yule law 0.9999.
#   3. The Pass 2 lineage validation no longer feeds `dihedral_obs_deg` back into the model: each lineage tree is
#      grown with the pleura policy at its assigned lobe cross-section position (emergent dihedral RMSE 3.13 deg,
#      8/8 mode accuracy).
#   4. Lean file extended from 3 to 5 theorems (0 `sorry`s): `pleura_anisotropy_mode_selection`,
#      `septation_mean_closed_form`; registered as Laws 4-5 in the math KG loop file; `measure_morphoeval()`
#      extended from 8 to 13 entries; self-test extended with blocks 7-8; Panels G-H added to the figure;
#      3 references added (DOIs cited offline from memory, flagged unverified in JSON and bib).
#
# This round deliberately looks for the next layer of defects. Several were exposed by the remediation itself
# and are scored down here even though the new mechanisms are real: the pleura geometry (h_mid = 1.0, A_c = 0.05)
# is tuned so the P/O transition lands mid-lobe; the per-lineage lobe position is ASSIGNED from the lineage class;
# the Pass 2 lineage/timecourse benchmark table has no per-row provenance and its r = 1.0 is self-referential; two
# Pass 2 `reference_value`s are the model's own outputs; the Turing PDE clips its fields every step and its seed
# profiles prescribe the final peak spacing; and the "specimen" is a human medical illustration, not a mouse lung.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# working-tree files at commit 028758bc (Phase A edits uncommitted; verified with grep against the current file).

