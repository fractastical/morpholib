    claim_boundary:
      reported_in_source:
      - 'Turing 1952: diffusion-driven instability at a finite wavenumber.'
      - 'Schnakenberg 1979: activator-inhibitor kinetics du/dt = a - u + u^2 v + Du lap u.'
      - 'Thewissen, Hussain and Arif 1994: Ambulocetus natans, amphibious archaeocete, early middle Eocene of Pakistan.'
      - 'Thewissen et al. 2001 and Gingerich et al. 1994: Pakicetus is more terrestrial; Rodhocetus is more aquatic.'
      reconstructed_in_script:
      - Dimensionless parameters a=0.05, b=0.90, Du=1, Dv=50 and gamma=8, length-scaled to a 224 µm fastest mode.
      - Forward-Euler dispersion check and a nonlinear periodic patch.
      - Chronoseries wavelengths 190, 224 and 260 µm from lambda = 224 µm * sqrt(h).
      transfer_boundary:
      - Hydration h=0.72 and h=1.35 are this slot's reconstruction of how dermal diffusivity could change from Pakicetus
        to Rodhocetus. They are not in the fossil papers.
      - The flank window is a visualization of a dermal primordium on a photograph of bone.
      does_not_claim:
      - That 224 µm stripes are preserved on the Naturalis skeleton.
      - That the emergent 178 µm peak was measured on a fossil skin.
