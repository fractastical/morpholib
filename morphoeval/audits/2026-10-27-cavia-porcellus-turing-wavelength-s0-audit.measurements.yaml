    claim_boundary:
      reported_in_source:
      - 'Turing (1952) dispersion: a homogeneous steady state stable to k = 0 can be unstable at a finite critical
        wavenumber when the inhibitor diffuses farther than the activator.'
      - Murray (1981) identified that selected wavelength with mammalian coat stripes and spots. Schnakenberg (1979)
        supplied the activator-substrate kinetics used here.
      - Swift & Hohenberg (1977) and Cross & Hohenberg (1993) give the real amplitude equation whose linear spectrum
        peaks at a prescribed k_c.
      - Sick et al. (2006) showed a WNT/DKK reaction-diffusion interaction sets mammalian hair-follicle spacing,
        the anatomical neighbour of a ~100 µm pigment wavelength.
      reconstructed_in_script:
      - Schnakenberg Jacobian at a = 0.08, b = 1.15, gamma = 1, with D_v/D_u = 40 scaled so lambda_c = 126.7 µm
        exactly (D_u = 169.175 µm^2, D_v = 6767.013 µm^2).
      - Swift-Hohenberg spiral of charge 2 on a periodic 1.0136 mm window (eight critical wavelengths), plus an
        epsilon sweep, a below-onset decay, and a plain-diffusion ablation.
      transfer_boundary:
      - 126.7 µm is the slot-assigned tier-5 detail length (0.0001267 m, log10 = -3.897) for extant Cavia porcellus
        at 0 Ma, not a measurement quoted from a guinea-pig histology paper.
      - The Cavia chronoseries has one node. The 1267 µm and 12.67 µm neighbours are adjacent size tiers at the
        same age, not other chronospecies.
      does_not_claim:
      - That the gallery pigment field is a published micrograph, or that its measured dominant wavelength (78.18
        µm on the printed 100 µm bar) equals 126.7 µm.
      - A full nonlinear two-species Schnakenberg integration. The rendered field is the Swift-Hohenberg amplitude
        equation.
      - 'Machine execution of the Lean file: this image has no lean binary.'
