# Pass 1 — Drosophila yakuba subcellular Turing wavelength (slot 3212).
# Scores are uncalibrated 0-100 rubric ratings, not probabilities.
# The reported wavelength in this pass was the 3×3 nearest-neighbour spacing
# of activator beads along a spiral arm (1.332 µm, KS 0.592), which is not λ*.

