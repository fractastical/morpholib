simulations:
  - id: delphi10000-drosophila-kikkawai-turing-wavelength-s0
    name: "Drosophila kikkawai Turing wavelength at 2.3 µm (detail, 0 Ma)"
    organism: "Drosophila kikkawai"
    script: models/2026-delphi10000-drosophila-kikkawai-turing-wavelength-s0.py
    output: docs/media/drosophila_kikkawai_turing_wavelength_s0_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-drosophila-kikkawai-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, gibert1999, yassin2016, conner2021]
    summary: >-
      Pass 2 closes R1–R3. The hero activator is seeded on Fourier mode m=20,
      so its radial FFT wavelength is 2.334 µm, 0.4% from the 2.343 µm detail
      target (pass 1 measured 2.182 µm on the unseeded saturated field). The
      single-mode PDE assay still tracks the analytic peak at Pearson r = 0.9993
      (RMSE 0.193 µm). Chronoseries at 0 Ma, same a, b and Du: D. mauritiana
      1.820 µm (Dv=0.413), D. kikkawai 2.344 µm (Dv=1.364), D. hydei 3.056 µm
      (Dv=4.470). Light morph b=0.71 gives 2.680 µm; dark morph b=1.18 gives
      2.109 µm. Equal diffusion remains stable (σ=-0.223) and the amplitude
      ratio is about 170. GIF is 12 frames at 640×480 with cv_sim_similarity 95.7.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) and Schnakenberg (1979) are the dispersion law and the kinetics. Gibert, Moreteau & David (1999) reported a major-gene plasticity of abdominal pigmentation in D. kikkawai. Yassin et al. (2016) reported pdm3 as a hotspot for female-limited colour dimorphism."
      reconstructed_in_script:
        - "Slot 3190's 2.343 µm assignment is the growth-rate peak at Du=0.020, Dv=1.364, a=0.070, b=0.940, and the rendered field is locked to the twentieth mode of a 46.86 µm patch (L/20 = 2.343 µm)."
        - "The chronoseries shift is inhibitor range only. The Gibert major-gene axis is reconstructed as b, not re-estimated from their plates."
      transfer_boundary:
        - "Nothing here is a measurement of hydei or mauritiana cuticle, and nothing transfers to the 93 µm tergite-band sibling slot."
      does_not_claim:
        - "Does not claim a published 2.3 µm morphometric. The length is the detail-tier assignment, now matched by the rendered carrier to 0.4%."
        - "Does not claim the gallery plate is a micrograph of that carrier. Commons had no D. kikkawai photograph; the plate is the pinned gallery file."
        - "Does not claim a nanopublication signature. No ~/.nanopub/profile.yml was present, and none was minted."
    scores:
      model-fidelity:
        value: 91
        rationale: "Schnakenberg PDE, Jacobian growth rate, and a mode-20 seed so the drawn field sits on the critical wavelength. Pass 2 FFT wavelength is 2.334 µm against 2.343 µm. The seed is an initial condition, not a change to the kinetics."
        evidence:
          - {file: models/2026-delphi10000-drosophila-kikkawai-turing-wavelength-s0.py, lines: [86, 107], note: "Jacobian and growth rate", supports: true}
          - {file: models/2026-delphi10000-drosophila-kikkawai-turing-wavelength-s0.py, lines: [153, 169], note: "mode-20 cosine seed inside the periodic integrator", supports: true}
      specimen-match:
        value: 84
        rationale: "cv_sim_similarity of the 12-frame 640×480 GIF against the pinned plate is 95.7. The score stays below that figure because the plate is a gallery rendering with a 100 µm bar, and the GIF mixes plate RGB at a final weight of 0.55. The pure activator is the centre panel of the comparison figure."
        evidence:
          - {file: docs/media/drosophila_kikkawai_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640x480, cv 95.7", supports: true}
          - {file: docs/media/drosophila_kikkawai_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "plate beside the pure activator", supports: true}
          - {file: models/2026-delphi10000-drosophila-kikkawai-turing-wavelength-s0.py, lines: [369, 397], note: "documented envelope and plate weights", supports: true}
      parameter-expressivity:
        value: 89
        rationale: "Dv sets the chronoseries wavelength (1.820, 2.344, 3.056 µm). Substrate b sets the light-to-dark shift (2.680 to 2.109 µm). Equal diffusion is a true negative control (σ negative, amplitude ratio about 170). All three are drawn."
        evidence:
          - {file: models/2026-delphi10000-drosophila-kikkawai-turing-wavelength-s0.py, lines: [109, 120], note: "continuous growth-rate peak", supports: true}
          - {file: models/2026-delphi10000-drosophila-kikkawai-turing-wavelength-s0.py, lines: [399, 470], note: "comparison figure panels", supports: true}
      morphometric-validation:
        value: 91
        rationale: "Pearson r = 0.9993 on the Dv sweep (reference gate 0.98, not equal to the measured r). Hero FFT 2.334 µm versus reference 2.343 µm. Plate coherency and field coherency differ. Orientation KS is 0.238 versus a 0.25 screening threshold. Three seeds report a coefficient of variation of the small-grid FFT peak."
        evidence:
          - {file: models/2026-delphi10000-drosophila-kikkawai-turing-wavelength-s0.py, lines: [172, 213], note: "PDE mode-growth assay", supports: true}
          - {file: models/2026-delphi10000-drosophila-kikkawai-turing-wavelength-s0.py, lines: [291, 320], note: "hero FFT, ablation pair, plate KS", supports: true}
          - {file: models/2026-delphi10000-drosophila-kikkawai-turing-wavelength-s0.py, lines: [474, 538], note: "measure_morphoeval returns non-equal value/reference pairs", supports: true}
      source-traceability:
        value: 88
        rationale: "Unchanged from pass 1 and still the right score. Five Crossref-checked DOIs, a pinned specimen digest, and an explicit Commons miss. The 2.3 µm length is not in those papers, which is why this is not 95."
        evidence:
          - {file: datasets/drosophila_kikkawai_turing_wavelength_s0/paper_citations.bib, lines: [1, 53], note: "Gibert 1999, Yassin 2016, Turing 1952, Schnakenberg 1979, Conner 2021", supports: true}
          - {file: datasets/drosophila_kikkawai_turing_wavelength_s0/scout_manifest.json, lines: [1, 50], note: "collision check against the 93 µm sibling and the rejected msw044 DOI", supports: true}
      code-traceability:
        value: 87
        rationale: "Each modelling step is a named function cited from the math-kg laws, and the Lean file proves the wavelength order, the mode count of 20, the diffusion gap, and the dark-morph activator inequality with no incomplete proofs."
        evidence:
          - {file: morphoeval/lean/loops/Loop_3190_drosophila_kikkawai_turing_wavelength_s0.lean, lines: [10, 52], note: "wavelength order, mode count, diffusion gap, dark morph", supports: true}
          - {file: morphoeval/math_kg_loops/delphi10000-drosophila-kikkawai-turing-wavelength-s0.yaml, lines: [40, 79], note: "equations block points at the Lean declarations", supports: true}
      repro-package:
        value: 88
        rationale: "Self-test now fails if the hero wavelength is more than 3% from 2.343 µm, if Pearson r is not above 0.98, if the GIF has fewer than 10 frames or is under 480 px, or if CV similarity is under 58. Seed and specimen digest are pinned."
        evidence:
          - {file: models/2026-delphi10000-drosophila-kikkawai-turing-wavelength-s0.py, lines: [552, 612], note: "self-test gates including the 3% wavelength band", supports: true}
          - {file: datasets/drosophila_kikkawai_turing_wavelength_s0/README.md, lines: [1, 29], note: "2.3 µm, 0 Ma, run command", supports: true}
    remediation:
      - id: R1
        item: "Resolved in pass 2. Hero FFT wavelength is 2.334 µm (was 2.182 µm), inside 3% of 2.343 µm, by seeding mode m=20."
        status: resolved
      - id: R2
        item: "Resolved in pass 2. The comparison figure title prints the measured FFT wavelength next to the pure activator panel."
        status: resolved
      - id: R3
        item: "Resolved in pass 2. GIF remains 12 frames at 640×480 and cv_sim_similarity is 95.7."
        status: resolved
      - id: R4
        item: "Open, and not a numeric-gate failure. ~/.nanopub/profile.yml is absent, so the nanopubs are unsigned. No key was created and no trusty URI was invented."
        status: open
      - id: R5
        item: "Open, and not a numeric-gate failure. A CC light micrograph of D. kikkawai pigment at 2.3 µm was not on Wikimedia Commons. The gallery plate stays the pinned specimen."
        status: open
