  witzmann2010:
    title: "Sculpture and vascularization of dermal bones, and the implications for the physiology of basal tetrapods"
    authors: "Witzmann, F.; Scholz, H.; Müller, J.; Kardjilov, N."
    venue: "Zool. J. Linn. Soc. 160:302-340 (2010)"
    doi: 10.1111/j.1096-3642.2009.00599.x
  pawley2006:
    title: "The appendicular skeleton of Eryops megacephalus Cope, 1877 (Temnospondyli: Eryopoidea) from the Lower Permian of North America"
    authors: "Pawley, K.; Warren, A."
