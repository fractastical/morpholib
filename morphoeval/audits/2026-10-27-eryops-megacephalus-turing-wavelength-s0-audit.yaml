# Pass 1 — Eryops megacephalus, 127 µm Turing wavelength, 295 Ma.
# The full-frame composite (cv_sim_similarity 94.4) still painted the gallery wall.
# Bone-masked remediation, KS/RMSE, and the control panel are scored in audit-v2.

