  id: 2026-10-27-eryops-megacephalus-turing-wavelength-s0-audit
  supersedes_audit_id: null
  rubric_version: 0.1.0
  date: "2026-10-27"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (primary assessor, loop 3222)"
    homepage: https://x.ai
  publisher_orcid: https://orcid.org/0009-0007-4948-9192
  license: https://creativecommons.org/licenses/by/4.0/
