    summary: >-
      Pass 1 (v1) baseline evaluation of `2013-thomas-coral-calice-septa-insertion.py`
      (consensus score 52.4/100). Implements the basic Milne-Edwards & Haime (1848)
      hexameral septal doubling sequence N_hex(k) = 6 * 2^(k-1) and decreasing cycle
      reach alpha_k in 2D, but omits Kunth's Law (1869) Paleozoic Rugosa serial 4-fossula
      insertion (N_rugosa(m) = 6 + 4m) as an evolutionary comparison/negative control,
      omits Chindapol et al. (2013) Péclet-number advection-diffusion boundary-layer
      symmetry breaking (Pe sweep from 0 to 36), lacks automated CV segmentation of the
      vendored Caryophyllia quadragenaria calice specimen, and lacks runtime SHA-256
      dataset verification.
