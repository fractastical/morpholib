# MorphoEval Pass 3 (v3) Audit — Sumper (2002) Science & Lenoci-Camp (2008) Langmuir Cahn-Hilliard Diatom Biosilica, 2026-10-20 (v3)
#
# Pass 3 re-score of `2002-sumper-diatom-frustule-phase-sep.py` (now 1609 lines, was 928; 11 self-test checks, was 8)
# and `datasets/diatom_frustule_phase_sep/` after the remediation of both open v2 items in the instrumented loop
# `morphoeval/runs/2026-10-19-diatom-frustule-phase-sep-loop-pass3`, superseding
# `2026-10-19-diatom-frustule-phase-sep-audit-v2` (89.0 dual-agent consensus).
#   - Primary assessor: Claude Fable 5.1 (Phase B audit subagent, scoring from the Phase A handoff note, the
#     `git diff` of the script / Lean module / math-KG YAML, a fresh `--self-test` run (PASS, 11 checks, 30 s) and
#     a fresh `lean` check (exit 0, 0 sorry) at a69596cc)
#   - Second assessor: the Phase A remediation agent's own 12-item defect list (handoff note section (b)), taken as
#     the independent defect enumeration that the primary assessor verified line by line against the current file.
#
# What Pass 3 changed (both v2 remediation items, closed as honest reduced models):
#   1. Centrifugal precipitation front coupled to the 2D Cahn-Hilliard equation (Furukawa 1992 directional quench
#      in polar geometry): `simulate_cahn_hilliard_2d` gained an optional spatially varying bulk term
#      phi^3 - a(x) phi and a zero-mobility `frozen_mask` with exact total-mass re-projection (L178-L243; the
#      `a_field=None, frozen_mask=None` path is bitwise identical to Pass 2). `simulate_radial_quench_costae`
#      (L405-L538) sweeps a quench front a(r,t) = tanh((R0 + v t - r)/w) over a 160^2 disc with a lagging
#      solidification front R_s = R - 1.0 lambda_c; `radial_anisotropy_index` (L346-L360) measures the margin
#      gradient-tensor anisotropy A (+1 radial lamellae, 0 isotropic, -1 concentric). Emergent result at seed 2002:
#      slow front v = 0.10 (Pe = 0.045) gives A = +0.647 (radial bifurcating costae), v = 0.40 gives A = -0.942
#      (concentric), isotropic null -0.110 +/- 0.112 (3 seeds). `run_front_velocity_sweep` (L540-L580) is the
#      5-speed ablation + null; panels C3/C4 and `diatom_frustule_phase_sep_radial_costae.gif` render it.
#   2. Explicit 3-stage 512x512 single-domain quench (L600-L724): `epsilon_for_pitch` (L587-L590) inverts
#      lambda_c(eps) so each tier's fastest-growing wavelength equals Sumper's pitch at 12.5 nm/px
#      (148 / 30.4 / 6.0 px); tier k >= 2 re-quenches inside the eroded pores of tier k-1 with the previous silica
#      frozen. Result: 12 foramina -> 48 cribrum -> 225 cribrella; a_2/a_3 = 5.108 (ref 5.067), d_3 = 46.5 nm
#      (ref 42), cribrella per cribrum 5.00 (ref 7); panels C1/C2 (C2 = one-foramen zoom with 200 nm bar).
#   3. 7 new `measure_morphoeval()` entries (14 total), 3 new self-test checks (11 total), CLI `--v-front`,
#      `--N3`, `--nm-per-px`, new reference table `centrifugal_front_three_stage_reference.json`, 2 new bib entries.
#   4. Lean: 2 new theorems (`directional_quench_stable_ahead_of_front`, `frozen_front_monotone_irreversible`),
#      6 total, 0 sorry; registered as equations 4-5 of `morphoeval/math_kg_loops/sumper-diatom-frustule-phase-sep.yaml`.
#
# Scores below: rubric-weighted overall 89.0 (v2 KG REPORT 89.3; the v2 YAML header quoted a dual-agent consensus of
# 89.0), unweighted 7-dimension mean 89.6. Flat overall, by design: the two closed items are offset by the deeper
# defects they exposed. Dimensions v2 -> v3: model-fidelity 92 -> 93, specimen-match 87 -> 85,
# parameter-expressivity 86 -> 89, morphometric-validation 88 -> 86, source-traceability 93 -> 90,
# code-traceability 91 -> 92, repro-package 90 -> 92. Three dimensions go DOWN because the remediation exposed the
# next layer: the costae model has no specimen margin view to compare against (its only reference is its own
# isotropic null), three of the seven new measurements use model-internal references, two new DOIs could not be
# verified offline, the new reference JSON is neither SHA-pinned nor read by the script, and the Pass 2
# hard-coded method strings and the circular JSON parity check are still present.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the
# working-tree files at commit a69596cc (uncommitted Pass 3 edits included; verified with grep on 2026-10-20).
# The script now lives at `models/2002-sumper-diatom-frustule-phase-sep.py` (repository re-layout since v2); the
# `script:` and evidence `file:` paths below use that location so `--check` and `measure_outputs.py` resolve it.

