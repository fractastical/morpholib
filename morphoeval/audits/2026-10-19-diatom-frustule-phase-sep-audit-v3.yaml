simulations:
  - id: sumper-diatom-frustule-phase-sep
    name: "Sumper (2002) & Lenoci-Camp (2008) hierarchical Cahn-Hilliard diatom biosilica phase separation (Pass 3: centrifugal precipitation front + 3-stage single-domain quench)"
    organism: "Coscinodiscus wailesii (Centric marine diatom frustule valve pores: foramen, cribrum, cribrella; radial costae)"
    script: models/2002-sumper-diatom-frustule-phase-sep.py
    output: docs/media/diatom_frustule_phase_sep_comparison.png
    extra_outputs:
      - docs/media/diatom_frustule_phase_sep_growth.gif
      - docs/media/diatom_frustule_phase_sep_radial_costae.gif
    domain: morphogenesis
    status: evaluated
    supersedes_audit_id: 2026-10-19-diatom-frustule-phase-sep-audit-v2
    source_refs:
      - sumper2002
      - lenoci2008
      - losic2006
      - cahnhilliard1958
      - furukawa1992
      - schmid1983
    claim_boundary:
      reported_in_source:
        - "Sumper (2002): LCPA/silica liquid-liquid phase separation inside the SDV yields three self-similar hexagonal pore tiers (foramen d_1 = 1250 nm / a_1 = 1850 nm; cribrum d_2 = 220 / a_2 = 380 nm; cribrella d_3 = 42 / a_3 = 75 nm)"
        - "Lenoci & Camp (2008): a two-stage quenched Cahn-Hilliard model with solidified silica walls reproduces nested foramen/cribrum pore hierarchies; linear spinodal dispersion sigma(k) = M k^2 (1 - 3 phi0^2 - eps^2 k^2)"
        - "Furukawa (1992): a quench front moving at speed v through a binary mixture produces lamellae perpendicular to the front at slow speeds and parallel to the front at fast speeds, with an isotropic limit as v -> infinity"
        - "Schmid & Volcani (1983): C. wailesii valve morphogenesis proceeds centrifugally from the pattern centre with radial costae branching toward the margin"
      reconstructed_in_script:
        - "Semi-implicit spectral Cahn-Hilliard solver with exact zero-mode mass conservation, extended with a spatially varying bulk term phi^3 - a(x) phi and a zero-mobility frozen mask with total-mass re-projection (L178-L243)"
        - "Radial quench front a(r,t) = tanh((R0 + v t - r)/w) with lagging solidification front R_s = R - lag lambda_c on a disc, conserved thermal noise, margin gradient-tensor anisotropy A, front Peclet number v/(lambda_c sigma_max), 5-speed ablation and 3-seed isotropic null (L346-L580)"
        - "Three-stage single-domain 512^2 quench with per-tier eps from lambda_c inversion at 12.5 nm/px, eroded parent-pore chambers with frozen walls, per-tier counts, nested multiplicities, nearest-neighbour pitches and equivalent diameters (L587-L724)"
        - "Pass 2 two-stage hierarchy, dispersion relation, eps sweep, SEM segmentation of 139 foramina / 74 cribrum pores, hexatic |psi_6| and 3-tier log-linear scaling (L124-L171, L244-L331, L730-L975)"
      transfer_boundary:
        - "The costae model is validated against its own isotropic null and the sign of A, not against a specimen: the vendored SEM shows the valve face at three magnifications and no margin, so no empirical A or rib spacing exists in the package"
        - "Front speed, solidification lag (1.0 lambda_c), noise amplitude (0.005), front width (2.0) and R0 (8) were selected from ~24 exploratory runs to reach the radial regime; the stage durations (290, 160, 100 steps) and erosions (0, 3, 1 px) of the 3-stage model were tuned from 4 trial runs for nested-count visibility. None of these values is from the cited papers"
        - "Frozen-silica conservation is global (leaked spectral flux spread uniformly over all mobile pixels), not local; the 3-stage cribrella sit at the grid floor (d_3 = 3.4 px target, 3.7 px measured), so their pitch/diameter are resolution-biased upward"
        - "Costae (phi0 = 0 rib layer) and areolae (phi0 = -0.30 droplet layer) are separate simulations; the model does not produce both in one domain"
      does_not_claim:
        - "Quantitative agreement with measured C. wailesii costae spacing or bifurcation count, the exact Furukawa crossover speed, cribrum-per-foramen multiplicities of 7-19 (model gives 4.8 at 512^2), SDV chemistry, or online verification of the Furukawa (1992) and Schmid & Volcani (1983) DOIs"
    summary: >-
      Pass 3 (v3) remediated evaluation of `2002-sumper-diatom-frustule-phase-sep.py` (rubric-weighted overall
      89.0/100, v2 89.3; unweighted dimension mean 89.6).
      Both v2 remediation items are closed as honest reduced models: the Cahn-Hilliard solver is now coupled to a
      radially advancing quench + lagging silica precipitation front (`simulate_radial_quench_costae`, L405-L538)
      and the emergent slow-front regime (A = +0.647 at v = 0.10, Pe = 0.045) gives radial bifurcating lamellae
      while fast fronts (A = -0.942 at v = 0.40) give concentric ones, against a 3-seed isotropic null of
      -0.110 +/- 0.112 — the Furukawa (1992) directional-quench transition in polar geometry; and an explicit
      3-stage 512^2 single-domain quench (`simulate_three_stage_hierarchy`, L600-L713) resolves 12 foramina ->
      48 cribrum -> 225 cribrella with a_2/a_3 = 5.108 (ref 5.067) and d_3 = 46.5 nm (ref 42). The remediation
      exposed the next layer of defects: the costae model has no specimen margin view to compare against, three of
      the seven new measurements use model-internal references, the new JSON is documentation-only (not SHA-pinned,
      not loaded), the two new DOIs are unverified offline, and the Pass 2 hard-coded SEM statistics strings and the
      circular `segmented_reference_metrics` parity check remain. Self-test PASS (11 checks, 30 s); Lean 6 theorems,
      0 sorry.
    scores:
      model-fidelity:
        value: 93
        rationale: >-
          The fourth-order Cahn-Hilliard PDE with exact Fourier zero-mode conservation, the analytical spinodal
          dispersion and the Lenoci-Camp two-stage quench are unchanged from v2 and the `a_field=None,
          frozen_mask=None` path is bitwise identical (Check 7). Pass 3 adds a genuine new mechanism rather than a
          template: a spatially varying bulk term phi^3 - a(x) phi (stable single well ahead of the front, spinodal
          behind) with a lagging zero-mobility solidification front, and the radial/concentric/isotropic transition
          emerges from the front speed with no imposed stripe pattern (+2). The 3-stage model uses the CH scale
          invariance (x -> Lx, eps -> L eps, t -> L^2 t) to set per-tier eps from Sumper's pitches, and the frozen
          parent silica is a physically motivated confinement (+1). Deductions: the frozen-pixel solidification is a
          projection in a periodic spectral solver — leaked flux is re-distributed uniformly over all mobile pixels,
          so conservation is global, not local, and across all chambers in the 3-stage run (-2); the neutral wall
          value (phi_wall = tier phi0) was chosen because a -1 wetting wall produced surface-directed rings, a modelling
          decision not from the paper (-1); costae and areolae remain separate simulations (-1). Six Lean 4 theorems
          (2 new: stability ahead of the front; monotone irreversible solidification front) verify with 0 sorry.
        evidence:
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [124, 171], note: "Analytical Cahn-Hilliard spinodal dispersion sigma(k), k_c, k_0, lambda_c (unchanged from v2)", supports: true}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [178, 243], note: "Spectral CH solver with optional a_field (directional-quench bulk term) and frozen_mask; L228-L238 re-project leaked flux uniformly onto mobile pixels (global, not local, conservation)", supports: true}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [405, 538], note: "simulate_radial_quench_costae: tanh quench front, lagging solidification front R_s = R - lag*lambda_c, conserved noise, margin anisotropy A, Peclet number; L489-L496 frozen-mass re-projection", supports: true}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [600, 713], note: "simulate_three_stage_hierarchy: one 512^2 grid, per-tier eps via epsilon_for_pitch, eroded chambers (erode_px=[0,3,1] L633), frozen parent silica with neutral wall value (L644)", supports: true}
          - {file: morphoeval/lean/loops/Loop_071_diatom_frustule_phase_sep.lean, lines: [100, 144], note: "Law 4: directional_quench_stable_ahead_of_front (L109-L118) and frozen_front_monotone_irreversible (L121-L144); file verifies with lean, 0 sorry", supports: true}
      specimen-match:
        value: 85
        rationale: >-
          The Pass 2 SEM segmentation of the SHA-256-locked C. wailesii valve (139 foramina, d_1/a_1 = 0.690 vs
          0.6757, |psi_6| = 0.764; 74 cribrum sub-pores) is unchanged and the comparison figure now has 12 panels
          with the SEM panels B1/B2 beside the new 3-stage composite (C1) and a one-foramen zoom with a 200 nm scale
          bar (C2) that can be read against the SEM cribrum tier; the C3 disc visually resembles radial costae
          striation. Deductions, and the reason this dimension falls: the vendored specimen shows the valve face at
          three magnifications and NO valve margin, so the entire costae remediation (R1) has no specimen to match —
          its only reference is the model's own isotropic null (-5); the 3-stage model gives 4.8 cribrum per foramen
          versus Sumper's 7-19 and 5.0 cribrella per cribrum versus 7, and the Pass 2 two-stage run still gives 2.04
          cribrum per foramen (-3); at 12.5 nm/px the tertiary pores are 3.4-3.7 px wide so panel C2's cribrella are
          at the grid floor (-2); the GIF right panel still hard-codes '(139 foramina)' as a title string rather than
          the segmented count (-1). Net 87 -> 85.
        evidence:
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [885, 975], note: "segment_coscinodiscus_specimen: Pass 2 segmentation of 139 primary foramina and 74 cribrum sub-pores on the SHA-256-locked SEM (unchanged)", supports: true}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [1148, 1222], note: "Panels C1 (3-stage composite), C2 (one-foramen zoom, 200 nm bar), C3 (costae disc with front/margin circles), C4 (A(v) ablation with null line)", supports: true}
          - {file: docs/media/diatom_frustule_phase_sep_comparison.png, lines: [0, 0], note: "3x4 synthesis figure: Pass 2 rows A-B (Stage 1/2 sims, bicontinuous mesh, negative control, SEM B1/B2) plus Pass 3 row C; no specimen margin view exists to compare with C3", supports: true}
          - {file: datasets/diatom_frustule_phase_sep/centrifugal_front_three_stage_reference.json, lines: [1, 82], note: "specimen gap recorded: no margin / costae view in the vendored SEM; the A reference is the model's isotropic null (model_prediction)", supports: false}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [1261, 1261], note: "GIF right-panel title hard-codes '(139 foramina)' instead of the segmented count", supports: false}
      parameter-expressivity:
        value: 89
        rationale: >-
          Pass 3 adds a real control axis with a morphological transition: the 5-speed front ablation v in {0.05,
          0.10, 0.20, 0.40, 0.80} px/t sweeps A from +0.65 (radial) through -0.94 (concentric) toward the isotropic
          null (panel C4), and `bulk_control=True` is a clean null (+2); the 3-stage model exposes grid size and
          physical scale (`--N3`, `--nm-per-px`) and `--v-front` drives panel C3 and the costae GIF (+1); the Pass 2
          eps sweep, phi0 regimes and CLI flags remain. Deductions: `measure_morphoeval()` ignores every CLI
          parameter (fixed N = 128/160/512, seed 2002, v = 0.10/0.40) so the measurement block is not re-parameterisable
          from the command line (-2); the C4 sweep and the isotropic null use a fixed 5-speed list and the null's
          step count is the median-speed count, not the slow-speed count (-1); the costae parameters (lag 1.0, noise
          0.005, width 2.0, R0 8) are exposed as function kwargs but not as CLI flags (-1). Net 86 -> 89.
        evidence:
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [540, 580], note: "run_front_velocity_sweep: 5-speed ablation + 3-seed isotropic null; null uses the median-speed step count (L564-L566)", supports: true}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [1569, 1607], note: "CLI: --N --phi0 --epsilon --steps --seed --skip-gif plus Pass 3 --v-front --N3 --nm-per-px (L1578-L1580); --self-test help still says '8-check'", supports: true}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [1297, 1318], note: "measure_morphoeval() hard-codes N=128/160/512, seed 2002 and v=0.10/0.40; CLI parameters are not honoured by the measurement block", supports: false}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [837, 878], note: "Pass 2 5-point epsilon sweep (unchanged)", supports: true}
      morphometric-validation:
        value: 86
        rationale: >-
          `measure_morphoeval()` now returns 14 reference-anchored measurements (7 new) and the new metrics are
          well-defined: the gradient-tensor anisotropy A in the outer-40% annulus, the front Peclet number, exact
          mass drift over 6800 steps, per-tier counts/pitches/diameters converted to nm, and inter-tier pitch ratio
          a_2/a_3 = 5.108 vs Sumper 5.067 and d_3 = 46.5 vs 42 nm are genuine literature comparisons (+). Deductions,
          and the reason this dimension falls: three of the seven new measurements use model-internal references —
          the margin anisotropy uses the model's own 3-seed isotropic null, the radial-minus-concentric contrast
          uses the analytic null 0, and the SEM row-coherence C_6 uses the isotropic simulation as the reference for
          a specimen value (roles inverted) — none is an empirical literature value (-4); the Pass 2 method/note
          strings still hard-code '24.01 px, CV=0.133 ... 34.80 px ... n=139' and 'relative error=2.1%' instead of
          computing them, and the Pass 2 |psi_6| reference 0.75 has no literature provenance (-3); the two-stage
          'nested cribrum sub-pores per foramen' = 2.04 vs ref 7.0 is a large miss that no note discusses (-2); the
          isotropic null is estimated from 3 seeds with a standard deviation (0.11) comparable to its mean and the
          self-test tolerance |A| < 0.35 is loose (-1). Net 88 -> 86.
        evidence:
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [346, 360], note: "radial_anisotropy_index: A = <|d_theta phi|^2 - |d_r phi|^2> / <|grad phi|^2> in the margin annulus", supports: true}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [1319, 1389], note: "7 Pass 3 measurements: A (ref = own isotropic null, L1326), contrast (ref 0.0, L1336), conservation, cribrella/cribrum vs 7, d_3 vs 42 nm, a_2/a_3 vs 5.067, SEM C_6 (ref = isotropic sim, L1386)", supports: true}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [1321, 1339], note: "Margin anisotropy and contrast measurements reference the model's own null (-0.110) and the analytic 0, not an empirical value", supports: false}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [1394, 1412], note: "Pass 2 d_1/a_1 method string hard-codes 24.01 px / 34.80 px / n=139 and 'relative error=2.1%' (L1397, L1401); |psi_6| reference 0.75 (L1409) has no literature provenance", supports: false}
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [1424, 1432], note: "Two-stage nested cribrum per foramen = 2.04 vs reference 7.0; miss not discussed", supports: false}
      source-traceability:
        value: 90
        rationale: >-
          The Pass 2 package is intact: `verify_and_load_reference()` SHA-256-verifies the reference JSON, the SEM
          specimen and the scout manifest at every run, and the bib carries the four original DOIs. Pass 3 adds
          Furukawa (1992) and Schmid & Volcani (1983) to the header, the bib and the new JSON with a
          `doi_verified_online: false` flag and a provenance note that separates literature values from
          `model_prediction` rows (+ honest). Deductions, and the reason this dimension falls: the two new DOIs were
          transcribed from memory and could not be verified because network tools were disabled; the regime
          assignment 'Furukawa (1992) transition' is from memory and the crossover speed is a model prediction (-2);
          the new `centrifugal_front_three_stage_reference.json` is neither SHA-256-pinned in `EXPECTED_SHA256` nor
          read by the script — it is documentation-only, so the costae/3-stage parameters are traced to the script
          source, not to a verified dataset artifact (-2); the `segmented_reference_metrics` block of the Pass 2 JSON
          is the script's own Pass 2 output and the self-test asserts equality with it (circular, unchanged from
          v2) (-1); the Pass 2 `|psi_6|` reference 0.75 still has no cited source (already penalised above). Net
          93 -> 90.
        evidence:
          - {file: models/2002-sumper-diatom-frustule-phase-sep.py, lines: [86, 117], note: "EXPECTED_SHA256 registry (3 files) and verify_and_load_reference(); the new Pass 3 JSON is not in the registry", supports: true}
