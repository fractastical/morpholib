# MorphoEval audit — King, Ocko & Mahadevan (2015) PNAS, Ocko et al. (2017) PNAS & Ocko, Heyde & Mahadevan (2019) PNAS Solar-Powered Termite Mound Convective Chimneys & Pheromone Morphogenesis, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2015-ocko-termite-mound-convective-chimneys.py` (223 lines)
# prior to Step 12 remediation in `2026-10-19-termite-mound-convective-chimneys-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.8 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `compute_thermosiphon_velocities` (L34-47) and `compute_peclet_aspect_ratio` (L50-61)
#      evaluate only closed-form algebraic scaling laws (`u_f = K_buoy * dT` and `H/R = 1 + eta*Pe`)
#      rather than solving the coupled 24-hour diurnal solar-thermal PDE with thermal inertia
#      phase lag between exterior surface flutes and the central chimney, or solving the
#      Ocko, Heyde & Mahadevan (2019) PNAS advection-diffusion-deposition moving-boundary
#      morphogenesis PDE `d_t c + u . grad c = D_c laplacian(c) - gamma_c c`.
#   2. `evaluate_baseline_diurnal_table` (L77-96) omits the 7-point convective Péclet
#      morphogenesis sweep (`Pe in [0.0, 4.2]`), the 6-point geographic latitude equatorward
#      spire tilt sweep (`|phi_lat| in [0, 24] deg S`), the *Macrotermes michaelseni* vs
#      *Odontotermes obesus* taxon comparison, and the shaded/isothermal dome ablation control.
#   3. The vendored CC BY-SA 4.0 cathedral termite mound photograph
#      `datasets/termite_mound_convective_chimneys/macrotermes_cathedral_mound_specimen.jpg`
#      is never loaded, segmented, or analyzed for mound silhouette aspect ratio `H/W`,
#      spire taper half-angle, or vertical surface flute ridges in
#      `termite_mound_convective_chimneys_comparison.png`.
#   4. Runtime SHA-256 verification of dataset assets and CLI parameter overrides
#      (`--peclet`, `--delta-t-day`, `--latitude-deg`, `--seed`) are missing.

