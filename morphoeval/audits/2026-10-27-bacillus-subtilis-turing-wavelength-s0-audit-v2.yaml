simulations:
  - id: delphi10000-bacillus-subtilis-turing-wavelength-s0
    name: "Bacillus subtilis Turing wavenumber at 16 µm (Holocene detail scale)"
    organism: "Bacillus subtilis"
    script: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
    output: docs/media/bacillus_subtilis_turing_wavelength_s0_growth.gif
    also:
      - docs/media/bacillus_subtilis_turing_wavelength_s0_comparison.png
    domain: protista-monera
    status: evaluated
    supersedes_audit_id: 2026-10-27-bacillus-subtilis-turing-wavelength-s0-audit
    source_refs:
      - turing1952
      - kawasaki1997
      - golding1998
      - benjacob2000
      - kondo2010
      - specimen2019
    claim_boundary:
      reported_in_source:
        - "Turing 1952 selects a finite critical wavenumber from a two-species reaction-diffusion system."
        - "Kawasaki 1997, Golding 1998, and Ben-Jacob 2000 model Bacillus subtilis colony branches with reaction-diffusion at colony scale."
        - "The Korinna 2019 micrograph is an eye-shaped B. subtilis colony and carries no scale bar."
      reconstructed_in_script:
        - "Schnakenberg kinetics a=0.084, b=0.916, diffusion ratio 9.20. Linear k_star gives 16.02 µm. The nonlinear bulk field on the 192 µm square peaks at radial mode 12, wavelength 16.00 µm, std(u)=0.27."
        - "Dispersion goodness-of-fit on modes n=8..20: Pearson r=0.99998, RMSE=0.00110."
        - "Kinematic front at R=183.3 µm draws m=72 rays spaced by 16 µm. Specimen ridge count on the micrograph is 43."
      transfer_boundary:
        - "Colony-scale branching papers supply organism context. They are not a measurement of a 16 µm wavelength."
      does_not_claim:
        - "Does not claim that any cited paper measured a 16 µm pigment stripe in B. subtilis."
        - "Does not claim the ray ocellus is a disk-bounded solution of the bulk PDE, or that its branch count fits the micrograph (43 versus 72)."
    summary: >
      Pass 2 closes the pass-1 gaps. The bulk Schnakenberg field now reaches the
      nonlinear regime and its radial peak is 16.00 µm (mode 12). Dispersion
      slopes on the Turing band match the discrete Laplacian at Pearson r=0.99998
      and RMSE=0.00110. The ocellus rays are darker (contrast 0.82) and the GIF
      scores cv_sim_similarity 89.4 against the Korinna 2019 micrograph at 520 px
      and 12 frames. The specimen ridge count is 43 against the model circumference
      mode 72, so that comparison is deliberately not a self-copy. Equal-diffusion
      ablation still suppresses the pattern. Age is 0 Ma (chronoseries 1/1); the
      scale change versus the 10 µm tier center is k ratio 0.624. Gates after
      this pass are met, so pass 3 was not run. Nanopubs were not signed.
    remediation:
      - "The animated ocellus is still a kinematic front at the selected wavelength, not an integration of the Schnakenberg PDE inside a growing disk, so it does not reproduce the irregular dendritic branches of the micrograph."
      - "High-pass ridge count on the specimen is 43, not the model mode 72. Do not read m=72 as a fit to the photograph; the micrograph has no scale bar."
    scores:
      model-fidelity:
        value: 91
        rationale: >
          sigma_plus and the Schnakenberg PDE are the Turing dispersion, calibrated
          to 16.02 µm linearly. Pass 2 integrates until std(u)=0.27, and the radial
          FFT then peaks at mode 12 (16.00 µm). The animated colony is a separate
          kinematic reduction that uses that wavelength; it is not the PDE on a disk.
        evidence:
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [109, 142]
            note: "sigma_plus and calibrate_diffusivity target 2 pi / 16 µm"
            supports: true
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [288, 339]
            note: "simulate_bulk stops at std 0.35; measured wavelength is 16.00 µm"
            supports: true
      specimen-match:
        value: 88
        rationale: >
          The 12-frame 520 px GIF scores cv_sim_similarity 89.4 against the Korinna
          2019 ocellus (Sobel orientation, radial FFT, structure-tensor coherency).
          Pass 2 raised ray contrast from 0.48 to 0.82 so the branches read as dark
          ridges. They remain more regular than the dendritic micrograph.
        evidence:
          - file: docs/media/bacillus_subtilis_turing_wavelength_s0_growth.gif
            lines: [1, 1]
            note: "12 frames, 520 px, last frame is the scored ocellus"
            supports: true
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [415, 433]
            note: "contrast 0.82 and blur 1.5 after the pass-1 faint-ray failure"
            supports: true
      parameter-expressivity:
        value: 90
        rationale: >
          At fixed ratio 9.20, wavelength increases monotonically across five D_u
          scales. Setting D_u = D_v drops sigma_max to -0.085 and collapses the
          field variance. The nonlinear bulk pattern is the wavelength that sweep
          predicts, not a second unrelated texture.
        evidence:
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [236, 258]
            note: "parameter_sweep wavelength_increases_with_Du"
            supports: true
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [261, 285]
            note: "equal-diffusion ablation remains the negative control"
            supports: true
      morphometric-validation:
        value: 91
        rationale: >
          On modes n=8 through 20, Pearson r is 0.99998 and RMSE is 0.00110
          (pass 1 RMSE was 0.108 because mode n=6 was included). The bulk radial
          wavelength is 16.00 µm against the 16 µm slot target. The specimen
          ridge count is 43 against model mode 72, foreground fraction 0.169
          against a 0.35 placeholder, and coherency 0.522 against 0.5, so the
          specimen metrics are not self-copies.
        evidence:
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [204, 233]
            note: "Turing-band goodness_of_fit; mode n=6 removed"
            supports: true
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [365, 371]
            note: "High-pass ridge count on the real micrograph, value 43 versus model 72"
            supports: true
      source-traceability:
        value: 92
        rationale: >
          DOIs for Turing 1952, Kawasaki 1997, Golding 1998, Ben-Jacob 2000,
          Kondo 2010, Duran-Nebreda 2021, Sharpe 1998, and Dion 2019 are in the
          bib and the reference JSON. The specimen SHA-256 is the vendored 960 px
          CC BY 4.0 rendition, with the Wikimedia original URL. The 16 µm and 0 Ma
          assignments are stated as slot coordinates, not as numbers read from a scale bar.
        evidence:
          - file: datasets/bacillus_subtilis_turing_wavelength_s0/bacillus_subtilis_turing_wavelength_s0_reference.json
            lines: [1, 30]
            note: "age_ma 0, lambda_um 16, chronoseries 1/1, k ratio 0.625"
            supports: true
          - file: datasets/bacillus_subtilis_turing_wavelength_s0/paper_citations.bib
            lines: [1, 30]
            note: "Turing 1952 and Kawasaki 1997 DOI entries"
            supports: true
      code-traceability:
        value: 89
        rationale: >
          The dispersion, the discrete Laplacian used in the fit, and the
          pass-2 comments that explain the longer integration and the dropped
          mode sit next to the code they describe. The Lean file proves the
          trace sign, the 16-versus-10 identities, and the ratio-9.2 threshold.
          Those proofs were not run through a Lean binary here.
        evidence:
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [204, 217]
            note: "Comment and mode list for the Turing-band fit"
            supports: true
          - file: morphoeval/lean/loops/Loop_3130_bacillus_subtilis_turing_wavelength_s0.lean
            lines: [8, 36]
            note: "Six decide theorems, zero sorry, no imports"
            supports: true
      repro-package:
        value: 91
        rationale: >
          Seed 3130, --self-test, and pass_metrics.json. Self-test requires
          Pearson r > 0.98, a monotonic sweep, a suppressed ablation, and the
          12-wavelength domain identity. Re-running the script regenerates the
          PNG and the 12-frame GIF.
        evidence:
          - file: models/2026-delphi10000-bacillus-subtilis-turing-wavelength-s0.py
            lines: [670, 705]
            note: "self_test assertions including Pearson r > 0.98"
            supports: true
