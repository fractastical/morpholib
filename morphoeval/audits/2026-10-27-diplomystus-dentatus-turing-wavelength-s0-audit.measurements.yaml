    claim_boundary:
      reported_in_source:
      - Turing (1952) onset wavenumber k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v), lambda_c = 2 pi / k_c.
      - Schnakenberg (1979) kinetics du/dt = a - u + u^2 v, dv/dt = b - u^2 v.
      - 'Grande (1982) redescribes Diplomystus dentatus from the Fossil Butte Member: dorsal scutes usually 22-36,
        maximum length about 65 cm, ellimmichthyid rather than a clupeid.'
      - Kondo & Asai (1995) and Nakamasu et al. (2009) show teleost skin can select a Turing pigment wavelength.
      - Smith, Carroll & Singer (2008) reconstruct the Eocene Green River lake system. Descouens' CC BY-SA 4.0 photograph
        is a Fossil Lake specimen with caption size 48 cm.
      reconstructed_in_script:
      - a=0.128, b=0.764, D_v/D_u=9.17, with D_u solved so the onset wavelength is 184.3 µm. Neumann explicit Euler
        on a flank window. These constants belong to slot 3170, not to the 7.56 mm sibling.
      - Discrete-Laplacian growth rates versus the analytic eigenvalue (Pearson r = 1.000, RMSE = 0.00033) and a
        diffusivity sweep of expressed wavelength (Pearson r = 0.997).
      - Equal-diffusion ablation (linearised std ratio 0.031) and a 20 µm predecessor mode with negative growth
        rate.
      - 'Segmentation of the Descouens photograph: aspect ratio, circularity, and a high-pass major-axis spacing
        used as an organ-scale contrast to 0.1843 mm.'
      transfer_boundary:
      - Pigment kinetics are transferred from the teleost Turing literature onto a Diplomystus flank. The 184.3
        µm value is the catalogued detail tier, not a melanophore count on the slab.
      - 51.5 Ma is the Ypresian chronoseries datum. The series contains one Diplomystus age (1/1); the predecessor
        and successor compared here are scales, not other chronospecies.
      does_not_claim:
      - That the fossil photograph resolves 184 µm ocelli, or that a, b, and D were measured in Diplomystus tissue.
      - That dorsal scute counts (22-36) are the same pattern as the detail-tier wave.
      - A new radiometric date for Fossil Lake.
