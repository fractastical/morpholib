    claim_boundary:
      reported_in_source:
      - 'Manukyan et al. (2017): skin thickness at inter-scale borders is reduced to P = h_border/h_interior ~ 0.17;
        a Kondo-Asai reaction-diffusion system on this geometry homogenises within scales and reduces to a hexagonal
        outer-totalistic cellular automaton whose adult neighbour histogram peaks at n_g = 3 (Figs. 2-4)'
      - 'Fofonjka & Milinkovitch (2021): reaction-diffusion in a growing 3D skin-scale domain with thin inter-scale
        borders generates the discrete cellular automaton'
      - 'Turing (1952): diffusion-driven instability requires tr J < 0, det J > 0, d f_u + g_v > 2 sqrt(d det J)'
      reconstructed_in_script:
      - A genuine 3D finite-volume voxel reaction-diffusion solver on a stepped-thickness skin volume (12 interior
        voxels, dz = 0.2 px, h_border = round(P*12)) with zero-flux surfaces and an implicit vertical solve; its
        depth-averaged thin-film 2D reduction (1/h) div(h D grad u) with min(h_i, h_j) D face conductances; a leak-proof
        hexagonal scale geometry; Turing linear stability (d_c, k_c, lambda_c, unstable band) for the script kinetics
        and for the vendored canonical set; a 5-regime P sweep in 3D and 2D; insulated / equal-diffusion / continuum
        controls; the stochastic hexagonal outer-totalistic CA; chromatic segmentation of 182 dorsal scales on a
        SHA-256-pinned Timon lepidus photograph; 16 measurements and 14 self-test checks
      transfer_boundary:
      - The 3D domain is a stepped voxel skin on a 5 px scale pitch (border area fraction 0.36, no domain growth),
        not the micro-CT-derived finite-element geometry of Fofonjka & Milinkovitch (2021); the reaction kinetics
        (f_u = 0.50, f_v = -0.75, g_u = 0.82, g_v = -0.65, cubic 1.25) are a phenomenological Kondo-Asai-type set,
        not the Methods parameters of Manukyan et al. (2017)
      - The CA transition probabilities and adult histogram targets in ocellated_lizard_ca_reference.json carry
        no digitisation provenance to a specific figure/table; the 'canonical' clipped-linear parameter set in the
        same file is not Turing-unstable at its stated d = 20 (d_c = 23.57) and is not used by the solvers
      - The specimen comparison samples a fixed 13 x 14 hexagonal lattice over the dorsal ROI rather than detecting
        scale centres, so neighbour statistics inherit lattice-registration error
      does_not_claim:
      - Reproduction of the paper's exact PDE parameters, a micro-CT skin mesh, domain growth, derivation of the
        CA flip probabilities from the PDE time series, or a neighbour-histogram match to Manukyan Fig. 3 beyond
        the vendored target vectors
