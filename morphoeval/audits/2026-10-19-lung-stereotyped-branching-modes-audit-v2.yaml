simulations:
  - id: metzger-lung-stereotyped-branching
    name: "Metzger et al. (2008) & Menshykau et al. (2012, 2014) mouse lung stereotyped branching modes (Domain D, Planar P, Orthogonal O) and FGF10-SHH-Ptch1 Turing mode selection"
    organism: "Mus musculus (embryonic E11-E15 mouse bronchial tree)"
    script: 2008-metzger-lung-stereotyped-branching.py
    output: docs/media/lung_stereotyped_branching_modes_comparison.png
    extra_outputs:
