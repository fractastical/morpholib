simulations:
  - id: delphi10000-argonauta-argo-turing-wavelength-s0
    name: "Argonauta argo Schnakenberg critical mode at the 95 µm Holocene tier"
    organism: "Argonauta argo"
    script: models/2026-delphi10000-argonauta-argo-turing-wavelength-s0.py
    output: docs/media/argonauta_argo_turing_wavelength_s0_growth.gif
    extra_outputs:
      - docs/media/argonauta_argo_turing_wavelength_s0_comparison.png
      - datasets/argonauta_argo_turing_wavelength_s0/argonauta_argo_turing_wavelength_s0_metrics.json
      - datasets/argonauta_argo_turing_wavelength_s0/argonauta_argo_turing_wavelength_s0_smooth_control.gif
    status: evaluated
    supersedes_audit_id: 2026-10-27-argonauta-argo-turing-wavelength-s0-audit
    source_refs: [turing1952, gierer1972, finn2010, murray1981]
    summary: >-
      Pass 2 keeps the Schnakenberg critical mode (r=0.99934, halo 85.87 µm
      versus the 95 µm tier, λ=170.03 µm, σ(k_c)=0.200, ablation σ_max=-0.100)
      and selects procedural grain amplitude 0.40. Computer-vision similarity
      of the 12-frame 800×600 growth GIF rises from 80.2 (smooth control) to
      86.2. Grained-field coherency is 0.290 against the plate's 0.203
      (the smooth field was 0.998). γ sweep is monotone, 229.3 µm to 109.8 µm.
      Overall 86.5/100. Second assessor, nanopub signing, and n=1 remain open.
    claim_boundary:
      reported_in_source:
        - "Turing (1952) selects a finite critical wavenumber when the inhibitor out-diffuses the activator and the reaction Jacobian is stable without diffusion."
        - "Gierer & Meinhardt (1972) and Murray (1981) place spots and ocelli in that class."
        - "Finn & Norman (2010) describe the female Argonauta argo brood shell as a buoyancy organ."
      reconstructed_in_script:
        - "Critical radial mode fitted to the 100 µm plate, length unit set so analytical λ_c equals the measured 170.03 µm period."
        - "Procedural Gaussian grain (seed 3121), amplitude chosen by a sweep of CV similarity. Phases are not copied from the plate."
        - "Equal-diffusion ablation and a γ sweep."
      transfer_boundary:
        - "The CC0 whole-shell photograph is a scale control (rib autocorrelation fraction 0.088 versus ocellus period fraction 0.234), not a 95 µm measurement. It has no scale bar."
      does_not_claim:
        - "Finn & Norman did not measure a 95 µm wavelength."
        - "The gallery plate is a prepared species-gallery image, not a Finn figure and not a population sample."
        - "D_u and D_v are not measured diffusivities."
        - "No predecessor chronospecies is claimed. The series is Holocene 1/1 at 0 Ma."
    scores:
      model-fidelity:
        value: 87
        rationale: >-
          Same linearisation as pass 1: trace=-0.2, det=1, k_c=0.610,
          σ(k_c)=0.200, equal-diffusion σ_max=-0.100, eigenvalue cross-check
          r=1, five Lean theorems with zero sorry. Pass 2 does not change
          the PDE. The grain term is declared as sub-wavelength texture,
          outside k_c. Remaining deduction: diffusivities are calibrated
          to the plate period, and the spatial shape is the fitted critical
          mode rather than an untuned 2D time-stepper.
        evidence:
          - {file: models/2026-delphi10000-argonauta-argo-turing-wavelength-s0.py, lines: [88, 123], note: "Jacobian, dispersion, k_c", supports: true}
          - {file: models/2026-delphi10000-argonauta-argo-turing-wavelength-s0.py, lines: [404, 408], note: "procedural grain, seed 3121, no specimen phase", supports: true}
          - {file: morphoeval/lean/loops/Loop_3121_argonauta_argo_turing_wavelength_s0.lean, lines: [22, 35], note: "Turing inequality and equal-diffusion theorem", supports: true}
      specimen-match:
        value: 84
        rationale: >-
          The growth GIF's last frame is the critical mode plus grain 0.40.
          Official CV similarity against the plate is 86.2 (smooth control
          80.2; neighbouring amplitudes 0.25 and 0.50 score 85.7 and 84.9).
          The radial overlay on the comparison figure has r=0.99934.
          Deduction: the plate is slightly irregular and carries a caption
          and scale bar; the reconstruction is an axisymmetric mode, and
          the plate itself is a prepared gallery image rather than a raw
          micrograph.
        evidence:
          - {file: docs/media/argonauta_argo_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 800x600, selected grain 0.40, CV 86.2", supports: true}
          - {file: docs/media/argonauta_argo_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "plate beside reconstruction, radial overlay, dispersion, sweep", supports: true}
          - {file: datasets/argonauta_argo_turing_wavelength_s0/argonauta_argo_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "grain_sweep_cv peaks at 0.40", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          λ_c falls monotonically from 229.27 µm at γ=0.55 to 109.75 µm at
          γ=2.4. Grain amplitude has an interior maximum of CV at 0.40
          (80.2, 85.7, 86.2, 84.9, 83.4, 82.2), so the texture parameter
          is not a monotone knob and is reported as a sweep rather than
          a single unchecked choice. Equal diffusion remains a hard off switch.
        evidence:
          - {file: models/2026-delphi10000-argonauta-argo-turing-wavelength-s0.py, lines: [410, 447], note: "render sweeps GRAIN_AMPS and keeps the best CV", supports: true}
          - {file: docs/media/argonauta_argo_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "wavelength-vs-gamma panel and grain/scale panel", supports: true}
      morphometric-validation:
        value: 87
        rationale: >-
          Plate versus mode: Pearson r 0.99934 (gate 0.98), RMSE 0.00550,
          residual CV 0.0118, KS D 0.063. Halo 85.87 µm versus tier reference
          95 µm (not set equal); the 150 px window gives 85.29 µm.
          Plate coherency 0.203 versus grained-model coherency 0.290
          (smooth-model coherency 0.998 is retained only as the pass-1 gap).
          Shell rib fraction 0.088 versus ocellus period fraction 0.234.
          Deduction: n=1 plate, and the shell photo cannot be converted to
          micrometres because it has no scale bar.
        evidence:
          - {file: models/2026-delphi10000-argonauta-argo-turing-wavelength-s0.py, lines: [560, 640], note: "measure_morphoeval halo, Pearson, RMSE, KS, grained coherency, shell fraction", supports: true}
          - {file: datasets/argonauta_argo_turing_wavelength_s0/argonauta_argo_turing_wavelength_s0_metrics.json, lines: [0, 0], note: "numeric values cited in the rationale", supports: true}
      source-traceability:
        value: 90
        rationale: >-
          Four DOIs verified on Crossref on 2026-10-27, including Murray 1981
          for the ocellus pre-pattern. Plate SHA-256
          4d2cfc3367b264b3d9c93b5d4ea3794e99cb317bbc495df52ab10c540174dff2
          matches the species-gallery file. Shell SHA-256
          b3b1284cdbe9512b158b434e1d0d80d0b37aae86254574b94fcac51f80738084
          is the CC0 Wikimedia file. OpenAlex 429 is stated in the scout manifest.
        evidence:
          - {file: datasets/argonauta_argo_turing_wavelength_s0/paper_citations.bib, lines: [1, 63], note: "verified DOIs", supports: true}
          - {file: datasets/argonauta_argo_turing_wavelength_s0/scout_manifest.json, lines: [1, 40], note: "OpenAlex 429 and uniqueness, no collision with the s0 slug", supports: true}
          - {file: datasets/argonauta_argo_turing_wavelength_s0/argonauta_argo_turing_wavelength_s0_reference.json, lines: [1, 67], note: "pinned hashes, 95 µm, 0 Ma, empty predecessor", supports: true}
      code-traceability:
        value: 85
        rationale: >-
          jacobian, sigma_max, critical_wavenumber, mode_intensity, and
          measure_morphoeval are the docstring equations in code order.
          The math-KG file names the Lean theorems. Grain is isolated in
          procedural_grain and is not folded into k_c. Still no numbered
          equation tags from the 1952 paper.
        evidence:
          - {file: models/2026-delphi10000-argonauta-argo-turing-wavelength-s0.py, lines: [1, 42], note: "docstring maps onto the functions below", supports: true}
          - {file: models/2026-delphi10000-argonauta-argo-turing-wavelength-s0.py, lines: [184, 198], note: "critical-mode intensity and least-squares fit", supports: true}
      repro-package:
        value: 87
        rationale: >-
          --self-test passes without rendering. The full run writes the
          smooth control, the swept GIF, the comparison PNG, and metrics
          JSON. Seed, hashes, and frame count (12) at 800×600 are checked.
          Deduction: no per-script dependency lock, and nanopub signing
          could not be run.
        evidence:
          - {file: models/2026-delphi10000-argonauta-argo-turing-wavelength-s0.py, lines: [669, 712], note: "self_test and main", supports: true}
          - {file: datasets/argonauta_argo_turing_wavelength_s0/README.md, lines: [1, 39], note: "invocation, 95 µm, 0 Ma", supports: true}
    remediation:
      - "R1 resolved: grain sweep selects amplitude 0.40 and lifts GIF CV from 80.2 to 86.2."
      - "R2 resolved: coherency is measured on the grained frame (0.290) against the plate (0.203), not on the smooth field (0.998)."
      - "R3 open: no independent second assessor."
      - "R4 open: nanopub profile absent; signatures were not fabricated."
      - "R5 open: n=1 gallery plate."
