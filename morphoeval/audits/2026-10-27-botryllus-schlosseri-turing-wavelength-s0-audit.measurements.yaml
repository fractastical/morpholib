      reported_in_source:
      - 'Turing 1952: diffusion-driven instability at a finite critical wavenumber when two morphogens diffuse at
        different rates.'
      - 'Schnakenberg 1979: the mass-action system f = a - u + u^2 v, g = b - u^2 v.'
      - 'Sorrentino, Manni, Lane and Burighel 2000: ascidian larvae carry a cerebral vesicle with sensory organs,
        including an ocellus.'
      - 'Cloney 1982: review of ascidian larval metamorphosis, including colonial botryllids.'
      reconstructed_in_script:
      - Slot-3136 parameters a=0.097, b=1.246, γ=1.37 chosen so the onset formula returns λ=3.872e-5 m on a 7-wavelength
        periodic window.
      - Nonlinear spectral integration, γ sweep, equal-diffusion ablation, specimen segmentation, KS orientation
        test, and seed-ensemble CV.
      transfer_boundary:
      - Kondo and Asai 1995 established a reaction-diffusion wavelength for Pomacanthus pigment stripes. That measurement
        is not transferred as a Botryllus datum.
      - The 39 µm length is the MorphoEval detail-tier assignment, not a published caliper on the Parent 1991 photograph.
      does_not_claim:
      - Does not claim that Botryllus star systems are produced by this PDE.
      - Does not claim the colony photograph was taken at 39 µm.
      - Does not claim a second independent assessor scored this audit.
