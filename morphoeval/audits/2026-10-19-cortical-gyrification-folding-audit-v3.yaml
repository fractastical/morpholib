simulations:
  - id: richman-cortical-gyrification-buckling
    name: "Richman et al. (1975) & Tallinen et al. (2014, 2016) neo-Hookean constrained cortical expansion and sulcal creasing instability, with a Pass 3 3D hemispheric Swift-Hohenberg surface surrogate"
    organism: "Mammalian cerebral cortex & subcortical white matter (Homo sapiens, Pan troglodytes, Macaca mulatta, Tursiops truncatus, Felis catus, Mus musculus)"
    script: 1975-richman-cortical-gyrification-buckling.py
    output: docs/media/cortical_gyrification_folding_comparison.png
    extra_outputs:
      - docs/media/cortical_gyrification_folding_surface_3d.png
      - docs/media/cortical_gyrification_folding_growth.gif
    domain: morphogenesis
    status: evaluated
    source_refs: [richman1975, tallinen2014, tallinen2016, mota2015, zilles1988, stoop2015, fischl2000, cross1993]
    supersedes_audit_id: 2026-10-19-cortical-gyrification-folding-audit-v2
    claim_boundary:
      reported_in_source:
        - "Richman et al. (1975): a stiff cortical plate growing on a softer subcortical foundation buckles with wavelength lambda = 2 pi h (mu_c / 3 mu_s)^(1/3), predicting fine folds for thin (microgyric) cortex and broad folds for thick cortex"
        - "Tallinen et al. (2014, 2016): multiplicative tangential growth F = F_e G of a neo-Hookean cortex above a critical excess g_c produces cusped sulci; a 3D gel-brain and a tetrahedral FEM on a GW22 MRI template reproduce fetal gyrification GW22-GW34 with GI rising to about 2.5"
        - "Mota & Herculano-Houzel (2015): cortical folding scales universally with surface area and thickness across mammals"
        - "Zilles et al. (1988): human whole-hemisphere coronal gyrification index 2.56 +/- 0.08"
        - "Stoop et al. (2015): a stiff film on a soft curved substrate follows a generalized Swift-Hohenberg equation whose curvature-induced quadratic term selects hexagonal dimples at low overstress and labyrinths at high overstress"
        - "Fischl & Dale (2000): regional human cortical thickness varies from about 1 mm to 4.5 mm (mean about 2.5 mm) across the hemisphere"
      reconstructed_in_script:
        - "Laws 1-3 (growth excess, cube-root wavelength, GI = 1 + 2 N d / P_hull) as closed-form functions; a 2D coronal shell relaxation (L-BFGS-B) toward a prescribed cusp profile with sulcus count and GI target set from the formula; 11-species and 4-condition sweeps; segmentation of one coronal specimen image"
        - "Pass 3: generalized Swift-Hohenberg relaxation on an ellipsoidal hemisphere surface (cotangent Laplace-Beltrami, semi-implicit Euler, Lyapunov energy), regional k_c(x) from a linear thickness gradient, raster skeleton Y-junction counting, marching-triangles iso-contour fundus length, 3D crease-wall GI with depth imported from the 2D solver, 4-point thickness-gradient sweep"
      transfer_boundary:
        - "The 11-species lambda_obs values in the reference JSON are generated from the Richman formula (4.3633 h), so cross-species wavelength agreement (r = 1.0000, alpha = 0.9993, lambda/h = 4.3642) is formula-vs-formula, not model-vs-measurement"
        - "The 2D coronal solver's sulcus count, GI target and cusp profile are prescribed before minimisation; L-BFGS-B removes injected noise rather than selecting a buckling mode, so GI_sim, lambda_sim and sulcus counts equal their targets by construction"
        - "The 3D surrogate's preferred wavenumber k_c(x) is imposed by the GSH operator; lambda_3D = 11.41 vs 11.33 and the gradient slope 1.006 are consistency checks of the nonlinear planform, and eps_scale = 0.5 / g2_curvature_coeff = 0.35 are tuning constants chosen to place GW26 in the dimple phase and GW38 in the labyrinth phase"
        - "The ellipsoid (1.30 R, 0.70 R, 0.95 R) is not an MRI template; Y-junction density has only the honeycomb upper bound 2.31 per lambda^2 as reference; the percolation ratio has only a > 1 lower bound"
      does_not_claim:
        - "A volumetric tetrahedral neo-Hookean FEM, emergent sulcal depth or GI amplitude in 3D, gyral-crown vs fundus thickness differentiation, MRI-template geometry, a Floquet/linear-stability derivation of g_c, or validation of Y-junction density against measured fetal sulcal graphs"
    summary: >-
      Pass 3 (v3) evaluation of `1975-richman-cortical-gyrification-buckling.py` (overall weighted score 80.2/100,
      DOWN from 93.1 in v2). The one v2 remediation item (3D tetrahedral FEM on MRI templates) is closed in an
      honestly labelled reduced form: a generalized Swift-Hohenberg film-on-curved-substrate planform on a 3D
      ellipsoidal hemisphere (10 242-node cotangent Laplace-Beltrami) that produces emergent sulcal Y-junctions
      (0 / 21 / 122 at GW22 / GW26 / GW38), a dimple -> labyrinth percolation transition, a 3D crease-wall GI of
      2.604 (obs 2.56, depth imported from the 2D solver) and an emergent regional wavelength that tracks a 1.5x
      anterior-posterior thickness gradient (slope 1.006). The 3 new Lean theorems verify (6 total, 0 sorrys),
      the self-test passes 12/12 in 13 s and the 3D solver is bitwise deterministic. The score nevertheless falls
      because this round's re-read found that the v2 headline validations are circular: the reference JSON's
      observed wavelengths are 4.3633 h by construction, and the 2D "neo-Hookean solver" relaxes toward a
      prescribed profile whose sulcus count and GI are computed from the formula and unsourced fitted constants
      (1.603, 0.88, 0.22) before minimisation. Six of the 15 measurements therefore report targets or
      formula-vs-formula agreement, two of the new 3D measurements are consistency checks (k_c imposed), and two
      have only mathematical bounds as references. These are now the Pass 4 items.
    scores:
      model-fidelity:
        value: 78
        rationale: >-
          Laws 1-3 (growth excess Delta_g = max(0, g - g_c), lambda = 2 pi h (mu_c / 3 mu_s)^(1/3),
          GI = 1 + 2 N d / P_hull; L162-189) are Richman's and Zilles's and are machine-checked. The Pass 3 GSH
          surrogate (L515-576) is a recognised reduced model for film-on-curved-substrate wrinkling (Stoop 2015),
          its Lyapunov energy (L506-512) decreases in every supercritical stage, its uniform mode is damped and
          its subcritical null is exact; the cotangent Laplace-Beltrami operator passes kernel, area and l = 1
          eigenvalue checks (self-test #9). Deductions: the 2D coronal "neo-Hookean" solver is not a buckling
          model — n_sulci_target = round(P_hull / lambda_theory) (L253), gi_target = 1 + 1.603 dg^0.88
          thinness_boost (L266-267) and the cusp profile u_eq (L272-276) are prescribed, and the energy (L290-314)
          penalises deviation from u_eq, so L-BFGS-B denoises a target rather than selecting a mode (-10); the 3D
          surrogate imposes k_c(x) and imports depth from the 2D solver (L735-736), so neither wavelength nor
          amplitude is emergent in 3D and the requested volumetric FEM is absent (-6); the Lissencephaly control
          has g = 1.14 < g_c so h = 6.5 mm is never exercised — Richman's thick-cortex prediction (longer
          wavelength) is not tested (-3); eps_scale and g2_curvature_coeff are unsourced (-3); the honesty note
          (L376-388) and the Lean coverage of all 6 laws prevent a larger deduction.
        evidence:
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [162, 189], note: "Laws 1-3: growth excess, cube-root wavelength, Gyrification Index as closed-form functions", supports: true}
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [253, 276], note: "2D solver prescribes n_sulci_target from P_hull/lambda_theory, gi_target from unsourced constants 1.603/0.88/0.22 and a cusp profile u_eq before minimisation", supports: false}
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [290, 314], note: "Energy is a penalty on (u - u_eq) plus bending/slope differences from u_eq: L-BFGS-B relaxes toward the prescribed profile", supports: false}
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [515, 576], note: "Generalized Swift-Hohenberg relaxation on the ellipsoid surface with imposed k_c(x), Lyapunov energy, semi-implicit SuperLU step, exact subcritical null", supports: true}
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [376, 388], note: "Honesty note: not a tetrahedral FEM, depth imported, residual carried to Pass 4", supports: true}
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [735, 736], note: "3D crease-wall GI uses mean_sulcal_depth_mm from the 2D shell of the same stage — depth is not emergent in 3D", supports: false}
          - {file: morphoeval/lean/loops/Loop_061_cortical_gyrification_folding.lean, lines: [99, 159], note: "3 new Pass 3 theorems (GSH fastest mode, regional wavelength tracks thickness, 3D crease-wall GI) alongside the 3 Pass 2 theorems; 0 sorrys, lean exits 0", supports: true}
      specimen-match:
        value: 82
        rationale: >-
          The SHA-256-locked coronal specimen is segmented into gray ribbon, white core, hull and 52 sulcal
          troughs (L964-1058; GI_specimen 2.8115, CV 0.32) and shown in Panel E; the new 3D figure
          (`render_surface_3d_figure`, L1352-1482) shows a GW26 dimple field becoming a GW38 labyrinth with
          Y-junctions on an ellipsoidal hemisphere, which is the qualitative Stoop/Tallinen picture, and GI_3D
          2.604 lies within 2% of Zilles's 2.56. Deductions: the specimen is a single coronal section compared
          with a whole-hemisphere mean (-3); P_pial is approximated as P_hull + 2 sum(depths) from a distance
          transform rather than traced (L1025-1026), and segmentation thresholds (0.86, 0.08, 14 px, 52nd and
          76th percentiles, 62 px band) are untraced tuning constants with a hard-coded fallback spacing
          [34, 36, 35] (L991-1018, L1034) (-5); the 3D geometry is an ad-hoc ellipsoid, not an MRI template, and
          no fetal MRI/sulcal-graph image is compared against the 3D planform (-6); the 11-species GI match
          (r = 0.9985) rests on the prescribed 2D solver (-3).
        evidence:
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [964, 1058], note: "Coronal specimen segmentation: tissue mask, convex hull, white-matter core, DoG sulcal trough detection, GI_specimen", supports: true}
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [991, 1034], note: "Untraced thresholds 0.86/0.08/14 px/52nd/76th percentile/62 px band and fallback spacings [34, 36, 35]; P_pial approximated from distance-transform depths", supports: false}
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [1352, 1482], note: "3D surface figure: GW26 dimples -> GW38 labyrinth with Y-junction overlay, regional-gradient panel", supports: true}
          - {file: docs/media/cortical_gyrification_folding_comparison.png, lines: [0, 0], note: "6-panel synthesis figure (v3 suptitle) incl. specimen Panel E; Panels B/F overlay lambda_sim on formula-generated lambda_obs", supports: true}
          - {file: docs/media/cortical_gyrification_folding_surface_3d.png, lines: [0, 0], note: "New Pass 3 figure: 3D hemispheric GSH planform at GW22/26/38, Y-junction skeleton, thickness-gradient sweep", supports: true}
          - {file: docs/media/cortical_gyrification_folding_growth.gif, lines: [0, 0], note: "Growth GIF regenerated; content unchanged from Pass 2 (2D coronal only)", supports: true}
      parameter-expressivity:
        value: 86
        rationale: >-
          Spans 5 fetal stages, 11 species, 4 pathology/ablation conditions (L805-958) and, new in Pass 3, a
