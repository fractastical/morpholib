# MorphoEval audit — Richman et al. (1975) Science & Tallinen et al. (2014, 2016) Cortical Gyrification Folding, 2026-10-19 (v3)
#
# Pass 3 re-score of `1975-richman-cortical-gyrification-buckling.py` (1896 lines; was 1185 at v2) and
# `datasets/cortical_gyrification_folding/` after the remediation of the single open v2 item in the instrumented
# loop `morphoeval/runs/2026-10-19-cortical-gyrification-folding-loop-pass3`, superseding
# `2026-10-19-cortical-gyrification-folding-audit-v2` (93.1).
#   - Primary assessor: Claude Fable 5.1 (Phase B audit subagent, slot-061 Pass 3)
#
# What Pass 3 changed (the one v2 remediation item, closed in reduced and explicitly labelled form):
#   1. Section 3b (L371-802): a 3D hemispheric surface buckling surrogate — generalized Swift-Hohenberg
#      film-on-curved-substrate equation (Stoop et al. 2015) solved on the 2D surface of a triaxial ellipsoidal
#      hemisphere (level-5 icosphere, 10 242 nodes) with a cotangent Laplace-Beltrami operator
#      (`relax_surface_swift_hohenberg` L515-576). It resolves 3D sulcal Y-junctions (`count_sulcal_y_junctions`
#      L610-669: 0 at GW22, 21 at GW26 dimple phase, 122 at GW38 labyrinth), the dimple -> labyrinth percolation
#      transition, a 3D crease-wall GI (`displace_surface_by_sulcal_depth` L691-714: 2.604 vs 2.56 obs) and an
#      anterior-posterior cortical-thickness-gradient sweep (`evaluate_regional_thickness_gradient_sweep` L760-802:
#      emergent lambda_ant/lambda_post vs h_ant/h_post slope 1.006, r = 1.0000).
#   2. 3 new Lean theorems (`swift_hohenberg_fastest_mode`, `regional_wavelength_tracks_thickness`,
#      `gyrification_index_3d_crease_wall`; 6 total, 0 sorrys), 6 new measurements (15 total), self-test 8 -> 12
#      checks, new SHA-256-pinned `surface_sh_3d_reference.json`, bib +3 (Stoop 2015, Fischl & Dale 2000,
#      Cross & Hohenberg 1993), new figure `docs/media/cortical_gyrification_folding_surface_3d.png`.
#   The script states plainly (L376-388, L1690, L1700, L1730) that this is NOT the requested tetrahedral neo-Hookean
#   FEM on MRI templates: sulcal depth is imported from the 2D coronal solver, only the planform is emergent.
#
# Why the overall score FALLS from 93.1 to 80.2 despite closing the item: re-reading the whole script against the
# reference JSON for this round exposed two structural defects that v1/v2 did not penalise —
#   (a) every `lambda_obs_mm` in `cortical_gyrification_folding_reference.json` equals 4.3633 * h exactly, so the
#       headline 11-species r = 1.0000 / alpha = 0.9993 / lambda/h = 4.3642 results validate the Richman formula
#       against itself; and
#   (b) the 2D "L-BFGS-B neo-Hookean solver" relaxes a noisy copy of a PRESCRIBED cusp profile u_eq whose sulcus
#       count and GI are set from the formula and from unsourced fitted constants (1.603, 0.88, 0.22) before any
#       energy is minimised, so GI_sim 2.5597, lambda_sim 11.20 and the 28/85 sulcus counts are targets, not
#       emergent results.
# Both are now carried as the top Pass 4 remediation items. The Pass 3 3D surrogate is credited for honesty and
# for genuinely emergent planform topology, but its k_c(x) is imposed, so its wavelength agreement is a consistency
# check, not validation. Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line
# numbers refer to the uncommitted working tree at HEAD 45670cb8 (Phase A edits not yet committed).

