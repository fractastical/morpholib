          explored from the CLI (-6); the lissencephaly condition varies g, not h, so the thickness axis is not
          exercised in the pathology sweep (-4); eps_scale and g2 are fixed in the JSON with no sweep across the
          Stoop dimple/labyrinth boundary (-4).
        evidence:
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [760, 802], note: "Regional thickness-gradient sweep over beta with emergent anterior/posterior wavelength ratio and regression against h_ant/h_post", supports: true}
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [805, 958], note: "Fetal GW22-GW38, 11-species and 4-condition pathology/ablation sweeps", supports: true}
          - {file: 1975-richman-cortical-gyrification-buckling.py, lines: [1850, 1893], note: "CLI: --skip-3d, --subdivisions, --seed reach the 3D surrogate; --growth-g/--h-cortex/--mu-ratio/--R-brain overrides are passed only to render_comparison_figure", supports: false}
          - {file: datasets/cortical_gyrification_folding/cortical_gyrification_folding_reference.json, lines: [245, 254], note: "lissencephaly_thick_cortex has g = 1.14 < g_c = 1.18, so h = 6.50 mm never influences the result", supports: false}
      morphometric-validation:
