# Pass 1 — Apis mellifera Turing wavenumber at 11.2 µm, Holocene 0 Ma.
# The raw spot-lattice GIF is what this pass scores. It does not look like the worker.
# A rotation-tolerant CV score against the photograph is nevertheless 91.4; that number
# is reported and is not treated as a morphological match.
