    summary: >-
      Pass 2 (v2) remediated evaluation of `2014-raspopovic-bmp-sox9-wnt-digits.py`
      (overall weighted score: 96.3/100, +39.5 over Pass 1). Implements both the 1D
      distal-arc and 2D polar-fan embryonic autopod reaction-diffusion PDEs for the
      3-node cell-autonomous Sox9 (D_S = 0) + diffusing Bmp (D_B = 2.5) + diffusing
      Wnt (D_W = 0.25) network modulated by distal AER-FGF, verifies the reduced
      2-diffuser Jacobian identity det(-J_3) = mu_S * det(J_eff) = 3.27 and out-of-phase
      eigenmode opposition (r_SB = -0.9772, r_SW = -0.9975), reproduces the 7-regime
      FGF/Hox wavelength series (r = 0.9781, digit count r = 0.9974) and all 6
      pharmacological/genetic perturbations (WT=5, LDN-193189=1, CHIR99021=2, IWP-2=6,
      Tbx2/Hox polydactyly=6, D=0 ablation control=0), and segments the vendored
      E12.5 WT Sox9 (5 digits, CV=0.1549) and E13.5 Tbx2-/- polydactylous (6 digits)
      WISH mouse limb bud specimen image.
