    claim_boundary:
      reported_in_source:
      - Turing (1952), Schnakenberg (1979) and Murray (1981) supply the instability, the kinetics and the coat-marking
        wavelength idea.
      - oca2 and mc1r, not a measured 666 nm mode, account for cavefish pigment loss (Protas et al. 2006; Gross
        et al. 2009; McCauley, Hixon and Jeffery 2004).
      - Yamamoto, Stock and Jeffery (2004) and Yoshizawa et al. (2010) are the sources for eye degeneration and
        neuromast expansion. Neither is a Turing-wavelength result.
      reconstructed_in_script:
      - Metres per pixel are set so the fastest linear mode equals 6.656e-7 m. That length is the loop card, not
        a cavefish measurement.
      - Pass 2 adds a six-point diffusion-ratio sweep, an equal-diffusivity ablation, and a flank-versus-patch KS
        statistic. Pearson r, RMSE and the 660.7 nm nonlinear peak are unchanged from pass 1.
      transfer_boundary:
      - The GIF still composites a subcellular patch onto a whole-body photograph. High computer-vision similarity
        is dominated by the shared silhouette. It does not show that the camera resolved 666 nm.
      does_not_claim:
      - Does not claim optic-cup degeneration or neuromast expansion are produced by k_c.
      - Does not claim Schnakenberg parameters were identified in Astyanax tissue.
      - Does not claim a fossil predecessor. The chronoseries is the single extant cave morph at 0 Ma. The 24 µm
        sibling is a scale comparison, ratio 36.33.
