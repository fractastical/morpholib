    claim_boundary:
      reported_in_source:
      - Fig. 388 Archaeopteryx pelvis in Cartesian coordinates; Fig. 389 Apatornis pelvis in a transformed grid
        (p. 757)
      - three intermediate and equidistant coordinate systems interpolated between them (p. 759, Fig. 390)
      - a pelvis outline inscribed in each interpolated system (Figs. 391-392) and the five-form series (Fig. 393)
      - the intermediates are 'hypothetical types' / 'transitional stages' (pp. 757, 759)
      reconstructed_in_script:
      - the grid phi as a thin-plate spline on automatically detected landmarks + arc-length semilandmarks (Fig.
