    scores:
      model-fidelity:
        value: 91
        rationale: >
          Same Schnakenberg law as pass 1, re-checked. k_c sits at 111.6 µm by
          construction of Du, and the grid dispersion tracks the continuum curve
          with r = 0.99991 and RMSE = 0.00336. σ(0) = -0.099 and σ(k_c) = 0.040,
          so the homogeneous state is stable and the critical mode is not.
          Equal diffusion at the geometric-mean diffusivity gives std(u) ≈ 3.6e-14
          against a patterned std of 0.469. Lean checks the numerator sign and
          the mode counts on the scale ladder.
        evidence:
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [79, 150], note: "Jacobian and both dispersion relations", supports: true}
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [610, 700], note: "Pipeline wires the equal-diffusion ablation and the noisy tail", supports: true}
          - {file: morphoeval/lean/loops/Loop_3117_arabidopsis_thaliana_turing_wavelength_s0.lean, lines: [10, 43], note: "Five sorry-free theorems", supports: true}
      specimen-match:
        value: 86
        rationale: >
          Computer-vision similarity of the 12-frame 640×480 GIF against the
          Paves trichome SEM is 93.3 (orientation histogram, radial FFT,
          structure-tensor coherency, occupancy). The last frame is the SEM
          with the activator still modulating it; early frames are the primordium
          field, so the animation actually moves. The spot lattice and the
          branched hair remain different objects, which caps this below 90.
          Image fitness = 0.55*93.3 + 0.30*86 + 0.15*90 = 90.6.
        evidence:
          - {file: docs/media/arabidopsis_thaliana_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 640×480, CV 93.3 versus the trichome SEM", supports: true}
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [363, 413], note: "Specimen canvas and the crossfade that produces the last frame", supports: true}
          - {file: docs/media/arabidopsis_thaliana_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "SEM, activator, blend, dispersion, sweep, wavelength", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >
          The diffusivity sweep is monotonic in activator amplitude once d clears
          the threshold between 6 and 8.4, and λ(argmax σ) moves from about 115 µm
          at d = 8.4 to about 138 µm at d = 20 while Du is held fixed. Subthreshold
          ratios are left off the wavelength panel because they have no selected
          mode. That is the expressivity claim for this 111.6 µm point.
        evidence:
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [325, 361], note: "Sweep of Dv/Du at fixed Du", supports: true}
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [415, 465], note: "Amplitude curve and wavelength curve", supports: true}
      morphometric-validation:
        value: 90
        rationale: >
          Law wavelength 111.6 µm, measured FFT wavelength 111.50 µm.
          Twenty-one spots, mean nearest neighbour 101.11 µm, CV 0.108,
          bootstrap 95% CI 96.60–105.81 µm (half-width 4.61 µm, not equal to the mean).
          KS D = 0.495 against Normal(111.6, 16.74), above the 5% critical value
          0.297, so that normal is rejected and the rejection is kept.
          Specimen cyan area 0.094 versus simulated peak area 0.284.
          Specimen coherency 0.582 versus field coherency 0.715.
          Stochastic tail ratio 1.70 versus a null ratio of 1.
          Cell-scale predecessor mode count 0 versus 4 on this patch.
          Pearson r = 0.99991.
        evidence:
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [477, 608], note: "Non-circular specimen and spacing measurements, including the bootstrap CI", supports: true}
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [206, 267], note: "FFT wavelength, spot spacing, spectral tail fraction", supports: true}
          - {file: datasets/arabidopsis_thaliana_turing_wavelength_s0/metrics.json, lines: [1, 30], note: "Cached pass-2 numbers the self-test asserts", supports: true}
      source-traceability:
        value: 92
        rationale: >
          DOIs, CC BY-SA credits, and SHA-256 pins are unchanged from pass 1 and
          were re-read. The reference JSON states 0.0001116 m and 0 Ma. The
          gallery Aeonium file is named as a rejected source rather than used.
        evidence:
          - {file: datasets/arabidopsis_thaliana_turing_wavelength_s0/arabidopsis_thaliana_turing_wavelength_s0_reference.json, lines: [1, 50], note: "Scale, age, parameters, specimen hashes", supports: true}
          - {file: datasets/arabidopsis_thaliana_turing_wavelength_s0/README.md, lines: [1, 28], note: "Scale ladder at 0 Ma and the license of the SEM", supports: true}
          - {file: datasets/arabidopsis_thaliana_turing_wavelength_s0/paper_citations.bib, lines: [1, 43], note: "Four bibliographic records", supports: true}
      code-traceability:
        value: 87
        rationale: >
          Each scored quantity is produced by a named function: jacobian,
          sigma_analytic, sigma_numerical, diffusivity_sweep, segment_trichome,
          spot_metrics. The math-KG card points at those laws and at the Lean
          declarations. Pass 2 does not add a second, looser implementation.
        evidence:
          - {file: morphoeval/math_kg_loops/delphi10000-arabidopsis-thaliana-turing-wavelength-s0.yaml, lines: [1, 63], note: "Law card for slot 3117", supports: true}
          - {file: models/2026-delphi10000-arabidopsis-thaliana-turing-wavelength-s0.py, lines: [123, 156], note: "k_c and σ(k) implementations", supports: true}
      repro-package:
        value: 88
        rationale: >
          --self-test passed after the pass-2 measurement block (bootstrap CI
          included). Seeds, hashes, and the metrics cache are deterministic.
          The remaining gap is cryptographic signing, which this environment
          cannot do without a nanopub profile. That gap is recorded rather than
