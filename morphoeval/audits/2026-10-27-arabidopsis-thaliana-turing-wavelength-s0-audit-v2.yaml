    claim_boundary:
      reported_in_source:
        - "Turing 1952 gives k_c from the determinant of J - k^2 D."
        - "Bouyer 2008 shows TTG1 is trapped by GL3 and depleted around trichomes."
        - "Di Patti 2023 reports fat-tailed trichome power spectra."
        - "Balkunde 2020 constrains an activator-inhibitor plus activator-depletion network with weak ttg1 alleles."
      reconstructed_in_script:
        - "Two-component Schnakenberg kinetics with a=0.05, b=1, Dv/Du=8.4, λ_c=111.6 µm."
        - "Periodic 446.4 µm patch, 128² spectral IMEX integrator, seed 3117."
        - "Tail ratio 1.70 between a noisy run and the deterministic run."
        - "Bootstrap 95% CI on nearest-neighbour spacing, 96.60–105.81 µm."
      transfer_boundary:
        - "The catalog wavelength 111.6 µm is the assigned scale of this slot. It is not a spacing printed in Bouyer 2008 or Di Patti 2023."
        - "The fat-tail comparison is a high-k power ratio, not a digitised copy of the Di Patti spectrum."
        - "Integer Lean witnesses use the sign pattern of the Jacobian, not the floating-point entries."
      does_not_claim:
        - "The three branches of the Paves trichome are not a prediction of the PDE."
        - "The model is not the full Balkunde gene network and not the Di Patti birth-death master equation."
        - "The Boutet epidermis dominant mode stays in pixels (480 px). It is not a micrometre wavelength."
        - "datasets/species_gallery Arabidopsis_thaliana.jpg is Aeonium tabuliforme and is not a specimen for this loop."
        - "Passing image fitness does not mean the spot lattice reproduces trichome branch geometry."
    remediation:
      - "Nanopub signing is still blocked: ~/.nanopub/profile.yml is absent. Unsigned TriG is what this pass publishes locally."
    needs:
      - id: sign-3117
        need_type: provenance_lock
        target_dimension: repro-package
        description: "Sign the pass-2 nanopubs once a nanopub profile exists."
