# MorphoEval audit — Wolpert (1969) French Flag Positional Information, Tickle-Wolpert (1975) ZPA Duplication,
# Ben-Zvi-Barkai (2010) Scaling & (Pass 3) 2D AER-FGF / ZPA-Shh Limb Bud Paddle, 2026-10-19 (v3)
#
# Pass 3 re-score of `1969-wolpert-french-flag-morphogen.py` (1752 lines; 11 self-test checks; 16 measurements)
# after the remediation of the single open v2 finding in the instrumented loop
# `morphoeval/runs/2026-10-19-french-flag-morphogen-loop-pass3`, superseding
# `2026-10-19-french-flag-morphogen-audit-v2` (91.1 consensus).
#   - Primary assessor: Claude Fable 5.1 (same agent that built the remediation; scores are deliberately
#     conservative and every evidence line was re-read against the file at commit 469bf3c)
#   - Second assessor block retained from v2 for continuity of the dual-assessor protocol; no fresh blinded
#     second score was obtained in this round (see `checkpoint.note`).
#
# What Pass 3 changed (closing the v2 remediation item "extend the 1D ZPA solver to a 2D PD x AP paddle
# coupling AER FGF8 outgrowth with posterior ZPA Shh"):
#   1. New Section 3b (L443-799): explicit finite-difference solver on a paddle-shaped mask (dx = 12.5 um,
#      W = 500 um, elliptical 150 um cap) for F (AER FGF) and S (ZPA Shh) with the Laufer (1994) /
#      Niswander (1994) feedback (Shh production needs FGF; Shh boosts posterior AER FGF), AER-driven
#      distal apposition growth dL/dt = v_max <F>_PZ/(<F>_PZ + K_g) (progress-zone model), zero-flux
#      boundaries, and a verification mode in which a non-growing rectangle reproduces the 1D cosh steady
#      state (RMSE 2.4e-3, zero cross-column spread).
#   2. Empirical comparisons added: Tickle (1981) graft dose series (+0/+1/+2/+3 digits at graft strength
#      0/0.10/0.35/1.0 -> 4/4), Saunders (1948)/Summerbell (1974) AER excision at HH18/20/22/24/26
#      (stylopod/zeugopod/zeugopod/autopod/autopod -> 5/5, Spearman rho = 1.0), Niswander (1994) Shh
#      collapse after AER removal (<= 0.06 % of the pre-excision peak after 3 h), Laufer (1994) posterior
#      AER FGF asymmetry (P/A = 1.56 in WT, 1.00 with a symmetric graft).
#   3. Pass 2 defect fixed: the 1D attenuated graft produced the non-biological sequence 4-3-2-3 via an ad
#      hoc half-domain split; a morphogen-valley digit reader (`extract_digit_sequence`, L347-378) shared by
#      the 1D and 2D readouts now yields Tickle's 4-3-2-2-3 and a new weak-graft regime 4-3-2-2.
#   4. Dataset: `limb_bud_2d_aer_zpa_reference.json` (SHA-256 locked, ordinal references with caveats), 7
#      new BibTeX entries (DOIs/PMIDs verified against Crossref / PubMed), README updated.
#   5. Lean 4: 7 new theorems (0 sorry) in Loop_011 (2D stencil balance and 1D reduction, Shh-FGF
#      quiescence, truncation monotonicity, segment order, dose monotonicity); 4 new laws registered.
#   6. Figure: 6 -> 9 panels (G: 2D WT paddle, H: graft dose series, I: AER excision truncation); new GIF
#      `french_flag_morphogen_limb2d.gif`; CLI --limb-vmax / --limb-feedback-gain / --limb-lambda-shh /
#      --limb-hours; self-test 7 -> 11 checks; default render 17 s.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities). Line numbers refer to the files at commit 469bf3c. The overall score moves 91.1 -> 90.3:
# the v2 item is closed, but the new 2D layer exposes a next layer of defects (tuned, unsourced Michaelis
# constants; a 5x compressed developmental clock; a prescribed rather than emergent paddle geometry with
# fixed AP width; ordinal rather than quantitative truncation references; and a specimen that is still a
# whole-egg photograph rather than a limb bud), which the v2 scores for specimen-match and model-fidelity
# had not priced in.

