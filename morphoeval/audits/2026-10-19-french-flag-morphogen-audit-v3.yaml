          - {file: datasets/french_flag_morphogen/paper_citations.bib, lines: [56, 133], note: "7 Pass 3 BibTeX entries with DOIs verified via Crossref (titles, volumes, pages) and PMID 4463222", supports: true}
          - {file: datasets/french_flag_morphogen/README.md, lines: [25, 31], note: "Item 5 documents the new table, its SHA-256 and the caveat that the stage clock is approximate", supports: true}
      code-traceability:
        value: 92
        rationale: >-
          The module docstring maps each solver to its source and Lean theorem (L1-67, Pass 3 block L48-66);
