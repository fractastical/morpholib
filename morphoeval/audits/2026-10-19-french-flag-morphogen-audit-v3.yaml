        evidence:
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [1459, 1540], note: "8 Pass 3 measurements with reference_value / reference_source / note", supports: true}
          - {file: datasets/french_flag_morphogen/limb_bud_2d_aer_zpa_reference.json, lines: [1, 103], note: "Ordinal references with explicit caveats (stage->segment, dose classes, feedback null baselines)", supports: true}
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [1511, 1530], note: "Shh-loss and P/A measurements use reference 0 and 1.0 baselines — ordinal, not quantitative (deduction)", supports: false}
