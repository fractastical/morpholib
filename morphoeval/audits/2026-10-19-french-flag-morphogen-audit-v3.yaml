simulations:
  - id: wolpert-french-flag-morphogen
    name: "Wolpert (1969) French Flag positional information, Tickle-Wolpert (1975) chick limb ZPA digit duplication, Ben-Zvi-Barkai (2010) scaling & 2D AER-FGF / ZPA-Shh limb bud paddle"
    organism: "Chick embryo (Gallus gallus domesticus) wing bud & embryonic blastoderm"
    script: 1969-wolpert-french-flag-morphogen.py
    output: docs/media/french_flag_morphogen_comparison.png
    extra_outputs:
      - docs/media/french_flag_morphogen_growth.gif
      - docs/media/french_flag_morphogen_limb2d.gif
    status: evaluated
    source_refs:
      - wolpert1969
      - crick1970
      - tickle1975
      - riddle1993
      - benzvi2010
      - saunders1948
      - summerbell1973
      - summerbell1974
      - tickle1981
      - laufer1994
      - niswander1994
      - crossley1996
    supersedes_audit_id: 2026-10-19-french-flag-morphogen-audit-v2
    claim_boundary:
      reported_in_source:
        - "Wolpert (1969): positional information read from a monotone morphogen gradient against thresholds gives size-invariant French-Flag proportions under linear source-sink diffusion; Crick (1970): synthesis-diffusion-degradation gives lambda = sqrt(D/k) and the positional-error law sigma_x = sigma_c / |dc/dx|"
        - "Tickle, Summerbell & Wolpert (1975) and Tickle (1981): a posterior ZPA specifies wing digits 2-3-4; an anterior graft gives the mirror duplication 4-3-2-2-3-4, and the digit specified next to a weaker graft advances 2 -> 3 -> 4 with polarizing-cell number; Riddle et al. (1993): Shh mediates ZPA activity"
        - "Saunders (1948) and Summerbell (1974): AER removal arrests outgrowth and truncates the limb at a level that is progressively more distal the later the excision; Summerbell, Lewis & Wolpert (1973): proximo-distal values are laid down by time spent in the distal progress zone"
        - "Laufer et al. (1994) and Niswander et al. (1994): Shh in the ZPA and Fgf4 in the posterior AER maintain each other (Shh lost after AER removal, rescued by FGF4 bead; ectopic anterior Fgf4 after a ZPA graft); Crossley et al. (1996): Fgf8 is expressed along the whole ridge"
        - "Ben-Zvi & Barkai (2010): an expander produced where morphogen is low scales the decay length with domain size"
      reconstructed_in_script:
        - "1D linear source-sink and SDD solvers (analytic + explicit PDE, RMSE 7.6e-6), 6-stage growth-scaling sweep with expansion-repression, 5-regime 1D ZPA suite (wild type, full / attenuated / weak anterior graft, ablation) read by a morphogen-valley digit rule, 400-trial Monte Carlo positional-error test, radial segmentation of the vendored 72 h embryo photograph"
        - "Pass 3: explicit 2D finite-difference solver for FGF and Shh on a growing paddle mask (dx = 12.5 um) with zero-flux boundaries, Michaelis-form Shh<->FGF feedback, AER-driven distal apposition growth, graft dose series, AER excision at five stages, ZPA ablation, a rectangle verification against the 1D cosh steady state, 8 new reference-anchored measurements and 7 new Lean 4 theorems"
      transfer_boundary:
        - "The 2D model is a reduced phenomenological coupling: the production rates s_F, s_S, feedback gain g_S and half-saturations K_S, K_FS, K_g are tuned so that wild-type FGF ~ 1 and L_final ~ 660 um, not taken from any paper; the developmental clock is compressed (12 h of model time spans HH18 -> HH28, ~5x faster than in ovo) while keeping tau_relax << tau_growth"
        - "The paddle geometry is prescribed (fixed AP width 500 um, elliptical 150 um cap); the AER is the distal-facing rim row and the ZPA is the posterior-margin mesenchyme within 120 um of the rim by construction, so their positions are inputs, not emergent; new lattice rows appear with zero concentration (no proliferation field)"
        - "Digit identity is read from the instantaneous distal Shh concentration against the Pass 2 thresholds normalised to the wild-type peak; the proximo-distal segment is read from the truncation fraction of the wild-type length via a 1/3-2/3 trisection, and the Saunders / Summerbell comparison is to an ordinal stage -> segment summary (+/- 1 stage between studies), not to digitised truncation data"
        - "The specimen is a whole-egg 72 h embryo photograph whose radial area-vasculosa profile is used as a proxy gradient; no limb bud image or Shh / Fgf in situ is compared with the 2D output"
      does_not_claim:
        - "Digit condensation or Turing-type periodicity, temporal integration of Shh exposure (Harfe 2004), a dorsoventral axis or 3D geometry, measured growth curves of the chick wing bud, quantitative Fgf4 / Shh expression levels, or a mechanistic derivation of AER and ZPA position"
    summary: >-
      Pass 3 (v3) evaluation of `1969-wolpert-french-flag-morphogen.py` (90.3/100; v2 91.1, v1 41.2). The
      single v2 remediation item is closed: Section 3b adds a 2D proximo-distal x anteroposterior paddle on
      which AER FGF (`dF/dt = D lap F - k_F F + s_F AER (1 + g_S S/(S+K_S))`) drives distal apposition
      growth (`dL/dt = v_max <F>_PZ/(<F>_PZ+K_g)`) and ZPA Shh production requires FGF
      (`dS/dt = D lap S - k_S S + s_S [ZPA] F/(F+K_FS)`). The 2D readouts reproduce Tickle (1975/1981)
      4-3-2 and 4-3-2-2-3-4 with a 4/4 dose series, Saunders (1948) / Summerbell (1974) stage-dependent
      truncation 5/5 (rho = 1.0, mean post-excision overshoot 15 um), Niswander (1994) Shh collapse after AER
      removal (<= 0.06 %) and Laufer (1994) posterior AER FGF asymmetry (1.56 -> 1.00 with a symmetric
      graft); the stencil is verified against the 1D cosh solution (RMSE 2.4e-3). A Pass 2 defect was fixed
      (attenuated graft 4-3-2-3 -> 4-3-2-2-3 via a morphogen-valley digit reader). The scores are held
      slightly below v2 because the new layer is a tuned, time-compressed, geometrically prescribed reduction
      validated against ordinal references, and the specimen is still not a limb bud; these are listed as
      the Pass 4 remediation items.
    scores:
      model-fidelity:
        value: 92
        rationale: >-
          Everything scored in v2 is intact (linear source-sink L148-152, analytic and PDE SDD L155-238 with
          RMSE 7.6e-6, expansion-repression scaling L268-340, Crick positional-error law L805-838). Pass 3
          adds the requested 2D PD x AP coupling: zero-flux masked 5-point stencil (L547-555), Shh<->FGF
          feedback and AER-driven growth (L624-639) and a rectangle verification that reproduces the 1D cosh
          steady state to 2.4e-3 with zero cross-column spread (L696-718), backed by `sdd_2d_steady_state_balance`,
          `sdd_2d_reduces_to_1d_interior`, `shh_fgf_feedback_aer_ablation_quiescence` and
          `aer_excision_truncation_monotone` in Lean. The 1D attenuated-graft defect of v2 (4-3-2-3, an ad hoc
          split keyed on c_ant >= 0.8) is replaced by one valley rule (L347-378) that yields Tickle's
          sequence. Deductions: the 2D production rates, feedback gain and the three half-saturations are
          tuned so that FGF ~ 1 and L_final ~ 660 um rather than taken from any source (L472-494) (-3); the
          developmental clock is compressed 5x (T_s = 12 h for HH18 -> HH28, L488-489, L467-470) (-2); AER and
          ZPA positions are geometric inputs and new rows are born at zero concentration, so there is no
          proliferation field and the ZPA 'follows the tip' by construction (L501-544) (-2); digit identity is
          instantaneous concentration, not exposure (L728-731) (-1).
        evidence:
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [547, 555], note: "Zero-flux masked 5-point Laplacian used for both species", supports: true}
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [614, 639], note: "Explicit update: FGF source with Shh boost, Shh source gated by F/(F+K_FS), progress-zone growth law, mask rebuilt as L crosses a grid line", supports: true}
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [696, 718], note: "Rectangle + clamped AER verification against cosh(y/lambda_F)/cosh(L/lambda_F); RMSE 2.4e-3, column spread 0", supports: true}
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [347, 378], note: "Morphogen-valley digit reader shared by the 1D (L381-441) and 2D readouts; replaces the v2 half split", supports: true}
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [472, 494], note: "LIMB2D_DEFAULTS: s_F, s_S, g_S, K_S, K_FS, K_g, v_max are tuned constants without a literature source (deduction)", supports: false}
          - {file: morphoeval/lean/loops/Loop_011_french_flag_morphogen.lean, lines: [137, 228], note: "7 new machine-checked theorems for the 2D stencil, feedback quiescence, truncation monotonicity, segment order and dose monotonicity (lean exit 0, 0 sorry)", supports: true}
      specimen-match:
        value: 86
        rationale: >-
          The SHA-256-locked 72 h embryo photograph is still segmented and overlaid with concentric French-Flag
          rings (Panels E-F, L844-929; r = 0.9963), and the digit-count comparisons with Tickle's wings remain
          exact in 1D and now in 2D (Panels C, G, H). The new 2D output is a recognisable limb bud paddle with
          a posterior-distal Shh domain and a ridge-wide FGF field, and the GIF shows wild type, a duplicated
          bud and an AER-excised stump side by side. Deductions, now priced in more strictly than in v2: the
          specimen is a whole-egg photo whose area vasculosa is a proxy, not a morphogen gradient, and it is
          not a limb bud, so nothing in Panels G-I is compared with a real wing bud image, an Shh / Fgf in situ
          or Saunders' or Summerbell's own figures (-8); the paddle outline is a prescribed mask with fixed AP
          width, so its shape cannot be credited as a morphological match (-4); the anterior-graft bud grows
          longer (687 um, HH29) rather than broader, unlike duplicated wings (-2).
        evidence:
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [844, 929], note: "Specimen ROI, organizer detection, radial SDD fit (r = 0.9963) and ring radii — unchanged from v2", supports: true}
          - {file: docs/media/french_flag_morphogen_comparison.png, lines: [0, 0], note: "Panels E-F specimen overlay; Panel G 2D paddle with Shh field, FGF contours, AER/ZPA and 4-3-2 digit bar; Panel H dose series; Panel I truncation", supports: true}
          - {file: docs/media/french_flag_morphogen_limb2d.gif, lines: [0, 0], note: "13 frames: wild type, anterior graft (grows to 687 um) and AER excised at HH22 (stump at 387 um)", supports: true}
          - {file: docs/media/french_flag_morphogen_growth.gif, lines: [0, 0], note: "18-frame HH18->HH28 growth animation (unscaled SDD vs expansion-repression French Flag), regenerated unchanged in content from v2", supports: true}
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [501, 544], note: "Paddle geometry is prescribed (W = 500 um fixed, elliptical cap); no limb-bud image is compared with it (deduction)", supports: false}
      parameter-expressivity:
        value: 91
        rationale: >-
          v2 sweeps retained (6 growth stages L268-340, 5 Monte Carlo thresholds L805-838, now 5 1D ZPA regimes
          L381-441). Pass 3 adds two monotone sweeps that visibly control the predicted feature: graft strength
          0 / 0.10 / 0.35 / 1.0 adds 0 / 1 / 2 / 3 digits (Panel H) and AER excision stage HH18 -> HH26 moves
          the truncation from stylopod to autopod with rho = 1.0 (Panel I); `--limb-vmax`, `--limb-feedback-gain`,
          `--limb-lambda-shh` and `--limb-hours` expose the 2D parameters (L1721-1724) and are wired into
          render_outputs (L1730-1745). Deductions: the feedback gain g_S and the half-saturations are not swept
          or shown, so the figure does not demonstrate what the Shh -> Fgf4 loop changes beyond the single P/A
          ratio (-5); the AP width and ZPA geometry are not parameters (-4).
        evidence:
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [733, 750], note: "Graft dose loop over 0.10 / 0.35 / 1.0 with extra-digit count and P/A FGF ratio", supports: true}
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [753, 774], note: "AER excision sweep over HH18..HH26, truncation fraction, segment, Spearman rho and strict monotonicity", supports: true}
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [1721, 1724], note: "CLI: --limb-vmax, --limb-feedback-gain, --limb-lambda-shh, --limb-hours", supports: true}
          - {file: 1969-wolpert-french-flag-morphogen.py, lines: [1240, 1261], note: "Panel H renders the dose series; no panel sweeps g_S or the K constants (deduction)", supports: false}
      morphometric-validation:
        value: 90
        rationale: >-
          `measure_morphoeval()` (L1431-1627) now returns 16 reference-anchored measurements: the 8 v2 metrics
          plus 2D wild-type digit count 3/3, 2D full-graft count 6/6, Tickle (1981) dose matches 4/4,
          Saunders/Summerbell segment matches 5/5, truncation-stage rho 1.0/1.0, Shh remaining after AER
          removal 5.7e-4 (ref 0), wild-type AER FGF P/A 1.56 (ref 1.0 null) and the 2D-vs-cosh RMSE 2.4e-3
          (ref 0). Deductions: four of the new references are ordinal or null baselines (segment table with a
          +/- 1-stage caveat, dose levels chosen to span the classes, reference 0 for Shh loss, reference 1.0
          for an asymmetry that is only qualitatively > 1), so they test ordering rather than magnitude (-6);
