# MorphoEval audit — Saadaoui et al. (2020), Serra et al. (2023) & Rozbicki et al. (2015) Avian Gastrulation Tensile Ring, Polonaise Twin-Vortex Flow & Primitive Streak Attractor, 2026-10-20 (v3)
#
# Pass 3 (remediation round) re-score of `2022-serra-gastrulation-streak-attractor.py` (Slot 050) after Phase A of
# `2026-10-19-gastrulation-streak-attractor-loop-pass3` closed both Pass 2 remediation items, superseding
# `2026-10-19-gastrulation-streak-attractor-audit-v2` (92.6).
#
# What Pass 3 changed:
#   1. Explicit Wnt8c / Nodal / FGF8 reaction-diffusion cascade (implicit spectral diffusion-decay, semi-Lagrangian
#      advection by the physical flow) upstream of a pMLC activation field P = rho_ROCK H(a_ALK N)(0.35 + 0.65 H(a_FGFR F))
#      that sources ring myosin; SU5402 / SB431542 / Y-27632 / ectopic Vg1 are now receptor-level perturbations.
#   2. Reduced 2.5D apical-basal column model per grid point (apical area a, basal area b, constant-volume height
#      h = 2h0/(a+b), wedging index, basement-membrane integrity B, ingression rate I) whose I feeds an irrotational
#      planar sink (nabla.v = -I) that replaces the Pass 2 prescribed Gaussian midline sink. Not a 3D FEM.
#   3. Transport switched from CFL-violating forward Euler to semi-Lagrangian in physical units; exported velocities
#      are the emergent flow in um/min under ONE global calibration constant fixed on wild type; the 15x15 morphospace
#      now runs 225 coupled simulations; the GIF shows recorded simulated states.
#   4. Two new Lean 4 theorems (ligand_cascade_posterior_myosin_asymmetry, apical_basal_wedging_ingression_sink),
#      a SHA-256-pinned ligand_emt_reference.json, 7 new field-derived measurements (14 total), 4 new bib entries.
#
# Why the score goes DOWN (92.6 -> 67.3): the remediation exposed that the Pass 2 headline numbers were circular.
# The four readouts the v2 audit scored (AP/ML 4.25, peak speed 2.40 um/min, 5-regime r = 1.0000, SU5402 AP/ML 1.00)
# are piecewise-analytic lookup functions of the regime parameters (lines 812-843) and reproduce the reference table
# by construction; the Polonaise flow is ~82 % prescribed streamfunction (lines 649-667, STOKES_ACTIVE_WEIGHT = 0.18);
# and the honest field-derived EMT zone is a posterior crescent (WT AP/ML 0.59 vs 4.25) whose 5-regime aspect rank
# correlation with the reference is -0.20. The Pass 3 code reports all of this honestly (`measured_*` keys, NOTE
# flags, Panel I), which is credited; the scores below are for what the model actually does, not for what the
# retained lookups print. Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale.
# Line numbers refer to the working-tree files at checkpoint 028758bc plus the uncommitted Pass 3 edits
# (script 1855 lines, Lean file 325 lines).

