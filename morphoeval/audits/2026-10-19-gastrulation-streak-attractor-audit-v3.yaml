simulations:
  - id: serra-gastrulation-streak-attractor
    name: "Saadaoui et al. (2020), Serra et al. (2023) & Rozbicki et al. (2015) avian gastrulation tensile ring, Polonaise twin-vortex flow & primitive streak attractor"
    organism: "Gallus gallus (chick epiblast disc Stage EGK XII to HH3+ primitive streak formation)"
    script: 2022-serra-gastrulation-streak-attractor.py
    output: docs/media/gastrulation_streak_attractor_comparison.png
    extra_outputs:
      - docs/media/gastrulation_streak_attractor_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-gastrulation-streak-attractor-audit-v2
    claim_boundary:
      reported_in_source:
        - "Saadaoui, Rocancourt, Roussel, Corson & Gros (2020) Science 367:453-458 viscous epiblast Stokes model eta*nabla^2 v + eta_b*nabla(nabla.v) = -nabla.(m Q) showing that a posterior-graded marginal Myosin-II tensile ring m(theta) = m_0 + delta_m cos(theta) and apical mesendoderm ingression drive counter-rotating Polonaise twin vortices and midline primitive streak elongation"
        - "Serra et al. (2023) mechanochemical active nematic feedback (Dm/Dt and DQ_{ij}/Dt) and Finite-Time Lyapunov Exponent (FTLE) Dynamic Morphogenetic Skeleton demonstrating transition from a wild-type linear streak to a circular ring under FGF receptor inhibition (SU5402) or twin streaks under ectopic Vg1/Wnt induction"
        - "Yu et al. (2009) Fgf8 source-sink gradient with D = 53 um^2/s; Muller et al. (2012) Nodal D = 3.2 um^2/s, t1/2 = 95 min; Nakaya et al. (2008) streak-restricted basement-membrane breakdown during EMT; Voiculescu et al. (2014) SB431542 Nodal/ALK block abolishes ingression"
      reconstructed_in_script:
        - "64x64 coupled 2D spectral viscous epiblast Stokes solver (Green's function L2 error = 5.97e-16) whose solution enters the planar flow with weight STOKES_ACTIVE_WEIGHT = 0.18 on top of a prescribed dipole + quadrupole Polonaise streamfunction and isotropic ring contraction, plus an irrotational sink driven by the EMT column ingression rate; active nematic Myosin-II cable advection-alignment PDE; Cauchy-Green FTLE ridge integration; semi-Lagrangian transport in physical units"
        - "Explicit Wnt8c (posterior marginal source) -> committed streak-cell density -> Nodal (autoactivating) -> FGF8 reaction-diffusion cascade with implicit spectral diffusion-decay and Hill-type pMLC activation P = rho_ROCK H(a_ALK N)(0.35 + 0.65 H(a_FGFR F)) sourcing ring myosin; decay lengths verified against sqrt(D/k) (FGF8 0.8 %, Nodal 1.4 %); receptor-level SU5402 (a_FGFR = 0), SB431542 (a_ALK = 0), Y-27632 (rho_ROCK), ectopic Vg1/Wnt (anterior source) regimes"
        - "Reduced 2.5D apical-basal column per grid point: apical area a (ROCK/pMLC-driven constriction), basal area b = 1 + chi_b (1 - a) B, constant-volume height h = 2 h0/(a + b), wedging index (b - a)/(b + a), basement-membrane integrity B decaying under Nodal/FGF gating, ingression rate I = k_ing Wdg (1 - B) feeding the planar sink (nabla.v = -I); field-derived readouts: streak thickening 1.26x, BM-broken area fraction 0.17, ingressed fraction 0.20, EMT-zone AP/ML 0.59, emergent ring asymmetry 0.63, peak speed 2.14 um/min (WT)"
        - "15x15 (delta_m x beta_m) morphospace from 225 coupled 40x40 simulations; automated CV segmentation of HH1 Koller's sickle, HH2 condensation, HH3+ streak, area pellucida/opaca ratio (0.6250) and PIV bilateral symmetry (0.9705) on chick_primitive_streak_specimen.jpg"
      transfer_boundary:
        - "2D planar circular epiblast continuum sheet of radius R = 1.15 mm with a single global velocity calibration constant U_CAL_MM_PER_H = 0.061 fixed on the wild-type regime (so the WT peak speed is calibrated, the other four regimes' speeds are emergent: Spearman rho = 0.90, Pearson r = 0.927 vs the Saadaoui/Serra table)"
        - "The coupled model forms a thickened, ingressing posterior crescent and does NOT elongate it into a midline streak within 8 h (WT EMT-zone AP/ML 0.59 vs reference 4.25; 5-regime aspect Spearman rho = -0.20): mediolateral intercalation (Rozbicki 2015) is absent and the active-nematic Stokes contribution is down-weighted to 0.18 to keep speeds physical"
        - "The four Pass 2 readouts streak_ap_ml_aspect_ratio / streak_length_mm / peak_polonaise_speed_um_min / ftle_ridge_anisotropy are retained as prescribed piecewise-analytic lookups of the regime parameters and reproduce the reference table by construction (r = 1); they are flagged in the code and are NOT evidence of model performance"
        - "Ligand kinetics for Wnt8c (D, half-life), FGF8 half-life, the column parameters (k_con, m_c, k_rel, chi_b, k_bm, k_ing, a_min, h0 = 25 um), source amplitudes and Hill constants are ASSUMED or DERIVED (marked as such in ligand_emt_reference.json); reference values 1.33 (thickening) and 0.08 (BM-broken fraction) are derived, not measured"
      does_not_claim:
        - "3D finite-element epithelial mechanics, out-of-plane bending, bottle-cell mechanics or individual mesenchymal migration after ingression (the column model is a per-point 2.5D reduction)"
        - "Mediolateral cell intercalation or any mechanism that converts the posterior crescent into a 4:1 midline streak"
        - "Independent verification of the Serra et al. (2023) venue/DOI or of the four new ligand/EMT DOIs (all recorded as unverified offline)"
    source_refs:
      - saadaoui2020
      - serra2023
      - rozbicki2015
      - vasiev2010
      - yu2009
      - muller2012
      - nakaya2008
      - voiculescu2014
    summary: >-
      Pass 3 re-score of `2022-serra-gastrulation-streak-attractor.py` (67.3/100, down from 92.6 in Pass 2). Both
      Pass 2 remediation items were closed in code: an explicit Wnt8c -> Nodal -> FGF8 reaction-diffusion cascade with
      implicit spectral diffusion-decay and semi-Lagrangian advection now sources ring myosin through a pMLC activation
      field (`step_ligand_fields`, `myosin_phosphorylation_field`), with decay lengths verified against
      $\lambda = \sqrt{D/k}$ (FGF8 0.8 %, Nodal 1.4 %), and a reduced 2.5D apical-basal column model
      (`step_apical_basal_column`: apical constriction, basal expansion, constant-volume thickening
      $h = 2h_0/(a+b)$, basement-membrane decay, ingression rate $I$) feeds an irrotational sink
      $\nabla\cdot\mathbf{v} = -I$ into the planar flow (`solve_ingression_sink_velocity`). Perturbations are now
      receptor-level: SU5402 gives a uniform ring (asymmetry 0.00), SB431542 and Y-27632 give zero ingression, ectopic
      Vg1 gives a bipolar ring, and the emergent 5-regime peak speeds rank-correlate with Saadaoui/Serra at
      $\rho = 0.90$ under one WT-fixed calibration constant. Five Lean 4 theorems compile with 0 sorrys. The
      remediation, however, exposed that the v2 headline numbers (AP/ML 4.25, 2.40 um/min, $r = 1.0000$, SU5402 1.00)
      are prescribed lookups of the regime parameters, that about 82 % of the Polonaise flow is a hand-written
      streamfunction rather than the Stokes solution, and that the honest field-derived EMT zone is a posterior
      crescent (WT AP/ML 0.59 vs 4.25; 5-regime aspect $\rho = -0.20$) because mediolateral intercalation is absent.
      The code now discloses all of this (NOTE flags, `measured_*` keys, Panel I), which is credited; the scores
      reflect what the coupled model actually produces.
    scores:
      model-fidelity:
        value: 68
        rationale: >-
          Credited: the spectral Stokes operator eta lap v + eta_b grad(div v) = -div(m Q) is correct (Green's function
          error 5.97e-16); the active nematic Dm/Dt, DQ/Dt equations with strain-rate alignment and corotation are
          implemented; transport is now unconditionally stable semi-Lagrangian in mm/h (+); the new Wnt8c/Nodal/FGF8
          cascade uses implicit spectral diffusion-decay with sourced diffusivities and verified decay lengths (+); the
          column model gives a constant-volume wedging/thickening law with ROCK-, Nodal- and FGF-gated BM breakdown
          whose ingression rate closes the loop into the planar divergence (+); the ligand->pMLC->ring asymmetry
          chain and the wedging->sink chain are each backed by a Lean theorem. Deductions: the planar flow is dominated
          by a prescribed dipole + quadrupole streamfunction and an isotropic ring-contraction term, with the Stokes
          solution entering at weight 0.18 (-12) — the Green's-function test validates the solver, not the model flow,
          and Theorem 1's circulation conservation is a symmetry of the prescribed psi; the coupled model does not form
          a streak (WT EMT-zone AP/ML 0.59 vs 4.25) because mediolateral intercalation is absent and the nematic
          feedback is too weak to elongate the crescent at physical speeds (-10); the four prescribed lookup readouts
          are still computed and exported alongside the honest ones (-4); ALPHA_M_HR is set to 0.10 against the
          vendored 0.45 without changing the JSON (-3); the column model is a per-point 2.5D reduction, not the
          requested 3D coupling, and the ligand fields are clipped by soft_wall each substep as a crude absorbing
          boundary while Wnt8c's 72 um decay length is below the 40 um grid's resolving power (-3).
