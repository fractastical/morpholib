# MorphoEval audit — Sheth et al. (2012) Science Distal Hox/Gli3 Dose Modulation of Turing Digit Wavelength & Polydactyly, 2026-10-19 (v3)
#
# Pass 3 post-remediation evaluation of `2012-sheth-hox-turing-polydactyly.py` (v3, 1619 lines; 14 self-test
# checks; 15 measurements) after closing the single open Pass 2 remediation item in the instrumented loop
# `morphoeval/runs/2026-10-19-hox-turing-polydactyly-loop-pass3`, superseding
# `2026-10-19-hox-turing-polydactyly-audit-v2` (92.1).
#
# What Pass 3 changed:
#   1. `integrate_sheth_growing_fan_limb_pde` (L512-703): the fan sector r in [r_prox, R(t)] now grows through an
#      AER-FGF8 mitogen field M = A(t) exp(-(R-r)/l_F) with prescribed kinematic area dilation g = g_max M, radial
#      tissue velocity from mass conservation, rim outgrowth dR/dt = v(R,t), Lagrangian material tracers (the
#      deforming tissue mesh), and the Sheth et al. (2012) reaction-diffusion system in ALE form with the Crampin,
#      Gaffney & Maini (1999) dilution term -(div v) u, advection relative to the mesh, implicit angular DCT-II
#      modes on the physical arc Theta r(t) and backward-Euler radial diffusion. g_max is calibrated by Brent root
#      find so the WT arc reaches 2500 um (L457-488).
#   2. `run_aer_growth_sweep` (L706-730) and `run_aer_ablation_series` (L733-752): g_max sweep (5 x 2 genotypes) and
#      AER ablation at t_abl in {0.6, 1.2, 1.8} (Summerbell 1974 ordering) tested against the quasi-static law
#      N = L(T)/lambda(H).
#   3. New Panels I-L (L1102-1179), a 2x8 growth-mesh time-lapse PNG (L1181-1239) and 8 growth frames appended to the
#      GIF (L1241-1264); 7 new measurements (L1315-1386); 6 new self-test checks (L1526-1571); CLI --g-max,
#      --aer-ablation-time, --growth-only (L1591-1593).
#   4. Lean 4 Theorems 4-5 (`sheth_growing_autopod_digit_number_law`, `sheth_growth_dilution_turing_threshold`,
#      Loop_015_hox_turing_polydactyly.lean L117-174, 0 sorrys) registered in the math KG YAML; new pinned dataset
#      table `pass3_aer_growth_reference.json` and 4 verified DOIs appended to `paper_citations.bib` (re-pinned).
#
# What the remediation exposed (scored down where it matters):
#   - The noise-only growing fan yields N_grow = 3.5 digit wavelengths for WT (law 5.0) and 13.0 for the triple null
#     (law 14.0): a growth-induced wavelength lag. The Pass 2 fixed-width fan and 1D arc reach exactly 5 / 14 only
#     because they SEED the target cosine mode (L284, L375-376); the "exact integer mode lock" credited in v2 is
#     therefore partly an initial-condition artefact.
#   - Growth is kinematic (prescribed dilation; no constitutive law or stress balance) and digit-ray orientation is
#     imposed by PD/AP diffusion anisotropy (eps_r = 0.05, L631), not derived from the Fgf/Wnt gradient.
#   - g_u(H) = 200 f_u + 25 k_c^4 - 4.5 |tr J_kc| (L183) and k_c(H) = 14 - 9H (L179) are closure ansaetze that pin
#     sigma_max ~ 4.5 and interpolate the allelic series; neither is a parameter of Sheth et al.'s supplement.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the files
# at commit 58b898c (working tree of the Pass 3 loop).

