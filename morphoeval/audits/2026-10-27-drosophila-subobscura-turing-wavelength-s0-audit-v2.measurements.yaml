    claim_boundary:
      reported_in_source:
      - Huey et al. (2000) and Gilchrist et al. (2001, 2004) measured latitudinal wing-size clines in introduced
        D. subobscura. They did not report a pigment wavelength.
      - Turing (1952) selects a finite critical wavenumber. The Schnakenberg reaction and its use in spatial patterning
        are from Schnakenberg (1979) and Maini, Painter and Chau (1997).
      reconstructed_in_script:
      - k_c for a=0.085, b=1.06, Du=0.041, Dv=0.530, scaled so λ_c = 2.97e-6 m. The nonlinear spot field, the Du
        sweep, the equal-diffusion ablation, and the specimen-masked render are reconstructions.
      - Chronospecies contrast uses the predecessor wavelength 8.256e-5 m and the successor wavelength 9.845e-5
        m as comparison lengths only. Their kinetics are not copied.
      transfer_boundary:
      - A 14% modulation inside the photographic mask makes the GIF resemble the fly because the photograph is in
        the frame. It does not mean the reaction-diffusion field generated the wing veins, the eye, or the collage
        layout.
      - The comparison applies only at this detail scale and age. It does not re-score the 124 µm primordium slot
        for the same species.
      does_not_claim:
      - Does not claim Huey et al. (2000) measured a 3.0 µm Turing wavelength.
      - Does not claim the spot lattice is a histological section of subobscura pigment granules.
      - Does not claim nanopublications were signed. No ~/.nanopub/profile.yml was present.
