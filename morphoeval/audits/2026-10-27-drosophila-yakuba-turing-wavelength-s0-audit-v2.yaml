simulations:
  - id: delphi10000-drosophila-yakuba-turing-wavelength-s0
    name: "Schnakenberg Turing wavelength at 2.157 µm on the D. yakuba abdominal cuticle (Holocene, 0 Ma)"
    organism: "Drosophila yakuba"
    domain: morphogenesis
    script: models/2026-delphi10000-drosophila-yakuba-turing-wavelength-s0.py
    output: docs/media/drosophila_yakuba_turing_wavelength_s0_comparison.png
    also:
      - datasets/drosophila_yakuba_turing_wavelength_s0/drosophila_yakuba_turing_wavelength_s0_reference.json
      - morphoeval/lean/loops/Loop_3212_drosophila_yakuba_turing_wavelength_s0.lean
    status: evaluated
    supersedes_audit_id: 2026-10-27-drosophila-yakuba-turing-wavelength-s0-audit
    source_refs: [carbone2005, llopart2002, wittkopp2002, turing1952, schnakenberg1979]
    provenance:
      artifact_sha256: 012a50ed1719b0b98fa95bbf04722cbf783e8f81f6c0fb6e8516a2e59886f126
      input_dataset_sha256:
        drosophila_yakuba_specimen.jpg: 71ea43a85af083570030dd876e45722183277abb05367528efa01e838a3c3ac8
    claim_boundary:
      reported_in_source:
        - "Turing (1952) selects a finite wavenumber. Schnakenberg (1979) supplies the kinetics. Carbone et al. (2005), Llopart et al. (2002) and Wittkopp et al. (2002) supply the yakuba pigmentation biology and the Yellow/Ebony antagonism."
      reconstructed_in_script:
        - "Discrete dispersion test (r = 0.995), equal-diffusion ablation (σ* = −0.102), monotone D_v sweep, and a spiral Schnakenberg integration whose FFT ring is the reported wavelength."
        - "Radial arm-to-arm periods replace the pass-1 bead nearest-neighbour distance. The bead KS (0.592) is kept only as ks_pass1_nearest_neighbour."
      transfer_boundary:
        - "Periodic boundaries still bead the spiral where it meets the opposite edge. Ratio statistics cross to the specimen; pixel bin indices do not, because the specimen is 800×600 and the GIF is 640×480."
      does_not_claim:
        - "Does not claim a measured 2.2 µm granule spacing in Carbone et al. The 2.157 µm figure is the selected wavelength of this reconstruction."
        - "Does not claim the gallery JPEG is a light micrograph of yakuba cuticle. It is the project species-gallery canonical asset, SHA-256 pinned."
        - "No successor chronospecies. The only comparison is to D. willistoni at 86 µm (ratio 40.01)."
    summary: >
      Pass 2 closes both pass-1 remediation items. The reported nonlinear wavelength
      is the isotropic FFT ring, 1.993 µm, against the linear λ* of 2.157 µm (about 8%
      short, not set equal). Radial arm spacing averages 12.25 lattice px against
      λ* = 12.91 px, KS = 0.328, down from the bead-spacing KS of 0.592. Dispersion
      r remains 0.995. CV similarity of the 12-frame 640×480 GIF against the specimen
      is 86.8. Overall clears the pass-2 gate. A no-flux boundary would remove the
      edge beads; that is not required to state the wavelength.
    remediation: []
    scores:
      model-fidelity:
        value: 91
        rationale: >
          Unchanged Schnakenberg core: trace −0.2, determinant 1, cross term 15,
          discriminant positive, equal diffusion stable. Linearised PDE versus the
          discrete dispersion gives r = 0.99525 and RMSE 0.0394 over 22 modes.
          The pass-2 wavelength estimator does not alter the PDE.
        evidence:
          - file: models/2026-delphi10000-drosophila-yakuba-turing-wavelength-s0.py
            lines: [87, 176]
            note: "σ(k), discrete eigenvalue, and the eigenvector growth test."
          - file: models/2026-delphi10000-drosophila-yakuba-turing-wavelength-s0.py
            lines: [216, 220]
            note: "Equal-diffusion ablation σ*."
          - file: morphoeval/lean/loops/Loop_3212_drosophila_yakuba_turing_wavelength_s0.lean
            lines: [16, 42]
            note: "Five theorems, zero sorry, including the willistoni ratio."
      parameter-expressivity:
        value: 90
        rationale: >
          Raising D_v from 10 to 40 lengthens λ* monotonically (1.86, 2.00, 2.16,
          2.32, 2.50 µm). The reference row D_v = 20 is the 2.157 µm phenomenon.
          Spiral arm count is fixed at 3 so the sweep is not confounded with it.
        evidence:
          - file: models/2026-delphi10000-drosophila-yakuba-turing-wavelength-s0.py
            lines: [222, 243]
            note: "parameter_sweep and sweep_is_monotonic."
          - file: docs/media/drosophila_yakuba_turing_wavelength_s0_comparison.png
            lines: [0, 0]
            note: "Sweep panel."
      specimen-match:
        value: 86
        rationale: >
          Last-frame CV similarity against the vendored specimen is 86.8
          (12-bin orientation, 24-bin radial FFT, structure-tensor coherency,
          occupancy; 640×480, 12 frames, frame difference 0.20). Both images are
          tan spirals. The specimen's radial peak bin is 5 and the GIF's is 7;
          those are not copied onto each other. Score stays below 90 because the
          specimen is the gallery asset, with a caption bar the simulation does not copy.
        evidence:
          - file: docs/media/drosophila_yakuba_turing_wavelength_s0_growth.gif
            lines: [0, 0]
            note: "Animation scored by verify_image_fitness.compute_sim_vs_specimen_cv_similarity."
          - file: models/2026-delphi10000-drosophila-yakuba-turing-wavelength-s0.py
            lines: [392, 407]
            note: "Otsu segmentation and radial peak of the specimen."
          - file: datasets/drosophila_yakuba_turing_wavelength_s0/drosophila_yakuba_specimen.jpg
            lines: [0, 0]
            note: "Pinned specimen, SHA-256 71ea43a8…"
      morphometric-validation:
        value: 88
        rationale: >
          Pearson r = 0.995 and RMSE = 0.039 on the dispersion. FFT wavelength
          1.993e-06 m versus λ* 2.157e-06 m (not equal). Radial-period KS = 0.328
          versus an ideal of 0; pass-1 bead KS was 0.592. Specimen dark-band
          fraction 0.121 versus a neutral prior of 0.5. Ablation σ* = −0.102
          versus the marginal value 0. The residual KS is the periodic boundary
          distorting rays that hit the edge.
        evidence:
          - file: models/2026-delphi10000-drosophila-yakuba-turing-wavelength-s0.py
            lines: [276, 354]
            note: "Radial ray spacings, isotropic FFT wavelength, KS."
          - file: models/2026-delphi10000-drosophila-yakuba-turing-wavelength-s0.py
            lines: [648, 760]
            note: "measure_morphoeval rows; specimen values are read from pixels and differ from their references."
          - file: datasets/drosophila_yakuba_turing_wavelength_s0/drosophila_yakuba_turing_wavelength_s0_metrics.json
            lines: [67, 80]
            note: "KS 0.328, FFT wavelength 11.92 px, measured 1.993 µm."
      source-traceability:
