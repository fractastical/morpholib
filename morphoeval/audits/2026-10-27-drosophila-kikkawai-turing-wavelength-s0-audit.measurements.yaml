    claim_boundary:
      reported_in_source:
      - Turing (1952) showed a reaction-diffusion system can be unstable at a finite wavenumber. Schnakenberg (1979)
        supplied the activator-substrate kinetics used here.
      - Gibert, Moreteau & David (1999) showed abdominal pigmentation in D. kikkawai depends on a major gene interacting
        with sex, segment, and temperature. Yassin et al. (2016) identified pdm3 as a hotspot for female-limited
        colour dimorphism in Drosophila.
      reconstructed_in_script:
      - The 2.343 µm length is the MorphoEval detail-tier assignment for slot 3190, realised as the Schnakenberg
        growth-rate peak at Du=0.020, Dv=1.364, a=0.070, b=0.940.
      - Predecessor D. hydei (Dv=4.470, λ≈3.056 µm) and successor D. mauritiana (Dv=0.413, λ≈1.820 µm) differ only
        in inhibitor range. The light/dark major-gene axis is reconstructed as b=0.710 versus b=1.180.
      transfer_boundary:
      - The ordering is a property of this dispersion relation at 0 Ma. It is not a measured fossil or morphometric
        series, and it does not transfer to the 93 µm tergite-band slot.
      does_not_claim:
      - Does not claim Gibert et al. or Yassin et al. measured a 2.3 µm pigment wavelength.
      - Does not claim the gallery plate is a light micrograph of that carrier. Commons returned no D. kikkawai
        photograph on 2026-10-27.
      - Does not claim the saturated hero field's FFT peak (2.182 µm) already equals the linear prediction. That
        gap is remediation R1.
