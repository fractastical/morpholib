    claim_boundary:
      reported_in_source:
      - 'Turing 1952: instability at a finite critical wavenumber k_c.'
      - 'Schnakenberg 1979: the activator-inhibitor rate laws used here.'
      - 'Foster and Smyth 1980: quarter-wave spacing d = lambda_light / (4 n), about 93 nm for 540 nm light at n=1.45,
        the successor scale.'
      - 'Dieckmann 2003: carotenoid granules form the eyespot under the plasma membrane.'
      - The Dartmouth SEM labels a 10 um scale bar. This pass measures 4.72 um bright-caps on three isolated cells.
      reconstructed_in_script:
      - k_c and k_max, with the unit chosen so lambda(k_max)=10.32 nm = 1.032e-8 m at age 0 Ma.
      - Dv sweep, Dv=Du negative control (sigma_max=-0.089), and ablation of u^2 v (sigma_max=-1.00).
      - Segmentation of the SEM and modulation of those cell bodies by the activator field.
      transfer_boundary:
      - At 10 nm the continuum limit is a modeling choice. Diffusion constants are scaled so the selected wavelength
        matches the assigned detail scale; they are not measured cytoplasmic diffusivities.
      - No fossil Chlamydomonas chronospecies is in this 1/1 series. The comparison is monomer 3.2 nm versus this
        stripe versus the quarter-wave spacing.
      does_not_claim:
      - Does not claim a published electron-micrograph measurement of exactly 10.32 nm.
      - Does not claim the SEM resolves that stripe. Orientation and radial spectra match because the frame keeps
        the real cell outlines.
      - Does not claim EYE2/EYE3 are dispensable.
      - Does not claim the 4.72 um bright-cap equals the 10 um nominal vegetative length.
