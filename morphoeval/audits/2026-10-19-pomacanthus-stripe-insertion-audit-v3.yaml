# MorphoEval audit — Kondo & Asai (1995) Pomacanthus Stripe Insertion & Y-Branch Unzipping, 2026-10-20 (v3)
#
# Pass 3 remediation re-score of `1995-kondo-pomacanthus-stripe-insertion.py` (Slot 004) in the
# instrumented loop `morphoeval/runs/2026-10-19-pomacanthus-stripe-insertion-loop-pass3`, superseding
# `2026-10-19-pomacanthus-stripe-insertion-audit-v2` (92.0).  Both open v2 remediation items were closed:
#   1. Curvilinear C-shaped solver: `simulate_curvilinear_c_shaped_arc_insertion` integrates the Kondo-Asai
#      PDE on a posterior-centred polar sector rho in [0.25, 1], theta in [-100, 100] deg with the
#      (1/rho) d/drho curvature term, zero-flux edges and a growing outer radius R(t) = R_0 s(t)
#      (IMEX sparse-LU).  3 equilibrated concentric arcs (radial spacing = lambda_c +/- 1.06 %, angular
#      coherence 1.000) insert to 6 arcs on all five angular transects by s = 2.6, with the mid-trough
#      inhibitor I_mid(s) strictly decreasing (Spearman -1.00) until insertion fires at s* = 2.18
#      (I_mid = 0.742 vs the zero-activator threshold c_3/|c_2| = 0.625).  The geometry is anchored on
#      the specimen by `fit_specimen_concentric_arcs` (structure-tensor concentric-centre fit: centre
#      (262, 217) px, 8 arcs, radial spacing 2.62 mm vs the oblique row-wise 3.80 mm).
#   2. Discrete iridophore/melanophore agents: `simulate_pigment_cell_agent_coupling` couples a 128-cell
#      fate lattice (threshold A_thr = A*, short-range exclusion + long-range support contact rules after
#      Nakamasu et al. 2009) to the fields through bounded feedback on c_3/c_5; fate concordance 0.93-0.97,
#      6 agent stripes = 6 field stripes for every kappa in {0, 0.005, 0.01, 0.02}; stripe amplitude gain
#      +3.6 / +8.1 / +11.7 % vs the uncoupled control.
#   Two new Lean 4 theorems (0 sorrys, `lean` verified): `kondo_asai_1995_curvilinear_mid_trough_threshold_partition`
#   and `kondo_asai_1995_pigment_agent_fate_partition_and_bounded_feedback`.  Self-test extended from 5 to 9
#   `measure_morphoeval()` measurements; runtime 9.4 s (self-test) / 10.5 s (PNG + GIF).
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not calibrated
# probabilities).  Line numbers refer to the files at commit d58a084 (working tree, Pass 3 state).
# Overall 93.1 (up from 92.0).  The remaining defects are structural, not presentational: the polar
# sector is not the specimen's body outline, the insertion threshold law is only a sufficient (A = 0)
# condition that under-predicts the effective threshold by ~19 %, the agent layer is 1D on a periodic
# domain (wavelength quantised) with uncited rule probabilities, and arc insertion still needs injected
# background fluctuations.  They are listed under `remediation` for Pass 4.

