  publisher_orcid: "https://orcid.org/0009-0007-4948-9192"
  assessor:
    id: grok-4.7
    label: "Grok 4.7 (builder-assessor; second assessor not run)"
  domain: morphogenesis
  checkpoint:
    repository: https://github.com/fractastical/morpholib
    commit: PENDING_COMMIT
    environment:
      python: "3.12.3"
      numpy: "2.x"
      note: "Cloud agent VM; no project venv. Cryptographic nanopub signing unavailable (~/.nanopub/profile.yml absent)."
