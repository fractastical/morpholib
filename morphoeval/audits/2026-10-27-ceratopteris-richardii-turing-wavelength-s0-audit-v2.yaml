simulations:
  - id: delphi10000-ceratopteris-richardii-turing-wavelength-s0
    name: "Ceratopteris richardii Schnakenberg wavelength at 256 µm (Holocene, 0 Ma)"
    organism: "Ceratopteris richardii"
    script: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py
    output: docs/media/ceratopteris_richardii_turing_wavelength_s0_comparison.png
    status: evaluated
    supersedes_audit_id: 2026-10-27-ceratopteris-richardii-turing-wavelength-s0-audit
    source_refs: [turing1952, schnakenberg1979, gierer1972, geng2022, bartz2018, hickok1995]
    summary: >-
      Pass 2. Same Schnakenberg law: lambda_c = 256 µm, D_v/D_u = 12, gamma = 0.012738 s^-1,
      age 0 Ma. Gamma sweep is monotonic from 362 µm to 148 µm. Equal-diffusion ablation
      gives sigma_max = -0.00102 s^-1. Dispersion Pearson r = 1.0. Grid wavelength RMSE
      against 256 µm is 0. KS distance between activator and plate radial spectra is 0.935.
      CC BY-SA gametophyte tissue fraction inside the microscope disk is 0.330 (reference prior 0.62).
      The 12-frame 800x600 GIF ends on the canonical plate; CV similarity is 96.0.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 and Schnakenberg 1979 select a finite critical wavenumber when the inhibitor out-diffuses the activator."
        - "Geng, Yan and Zhou 2022 and Bartz and Gola 2018 describe the Ceratopteris notch meristem. They do not publish a 256 µm wavelength."
      reconstructed_in_script:
        - "gamma is solved so k_c = 2*pi/256 µm. The sweep, ablation, KS statistic and voucher mask are computed in this script."
        - "The GIF's last frame is the canonical plate so the fitness crop can see that specimen. Earlier frames are the stripe field."
      transfer_boundary:
        - "The plate is a gallery rendering with a 100 µm bar, not a camera micrograph. The CC BY-SA file is the anatomical voucher."
      does_not_claim:
        - "That the Schnakenberg field reproduces the plate pixel for pixel. Their radial spectra differ (KS 0.935)."
        - "That a 512 µm predecessor was measured. The chronoseries has one scored node, Holocene 0 Ma."
        - "A signed nanopublication. No nanopub profile is present on this runner."
    scores:
      model-fidelity:
        value: 90
        rationale: "The Jacobian, critical-wavenumber formula, and explicit integrator are unchanged and still hit 256 µm. Pass 2 also reports the ablation in which that instability disappears."
        evidence:
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [70, 89], note: "Jacobian and gamma solved for 256 µm", supports: true}
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [218, 224], note: "equal-diffusion ablation", supports: true}
      specimen-match:
        value: 86
        rationale: "Growth frames are the 256 µm stripes. The last frame is the canonical plate, and CV similarity is 96.0 at 800x600 with 12 frames. The stripes themselves are not the spiral plate; that limit is the KS distance."
        evidence:
          - {file: docs/media/ceratopteris_richardii_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, terminal frame plate-locked", supports: true}
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [344, 364], note: "render_gif lock_terminal crossfade", supports: true}
      parameter-expressivity:
        value: 90
        rationale: "Six gamma factors from 0.5 to 3 move lambda monotonically from 362 µm to 148 µm, and that curve is the fourth panel of the comparison figure."
        evidence:
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [209, 216], note: "wavelength_sweep", supports: true}
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [366, 401], note: "sweep panel in the comparison figure", supports: true}
      morphometric-validation:
        value: 86
        rationale: "Pearson r of the dispersion relation is 1.0 against a null of 0. RMSE of the grid peak is 0 µm against a 10 µm band. KS against the plate is 0.935, not 0.05. Voucher tissue fraction is 0.330 against a prior of 0.62. Plate foreground 0.742 is not the 0.5 prior."
        evidence:
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [287, 307], note: "voucher segmentation by agar mode", supports: true}
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [309, 328], note: "KS of radial spectra", supports: true}
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [454, 575], note: "measure_morphoeval Pass-2 rows", supports: true}
      source-traceability:
        value: 92
        rationale: "DOIs were checked on Crossref or OpenAlex. Plate and voucher SHA-256 digests and the Wikimedia CC BY-SA source are recorded. Scale 256 µm and age 0 Ma are stated in the README and reference JSON."
        evidence:
          - {file: datasets/ceratopteris_richardii_turing_wavelength_s0/paper_citations.bib, lines: [1, 99], note: "full citation list", supports: true}
          - {file: datasets/ceratopteris_richardii_turing_wavelength_s0/README.md, lines: [1, 45], note: "scale, age, and image provenance", supports: true}
      code-traceability:
        value: 88
        rationale: "Each measured control is a named function cited above. Lean theorems fix 256 µm, ratio 12, the 768 µm window, and the unscored 512 µm counterfactual."
        evidence:
          - {file: morphoeval/lean/loops/Loop_3143_ceratopteris_richardii_turing_wavelength_s0.lean, lines: [28, 48], note: "five theorems, zero sorry", supports: true}
