simulations:
  - id: lewis-her1-her7-delayed-oscillator
    name: "Lewis (2003) zebrafish her1/her7 autoinhibitory delay differential oscillator and DeltaC-Notch synchronization"
    organism: "Danio rerio (zebrafish presomitic mesoderm & paraxial somites)"
    script: 2003-lewis-her1-her7-delayed-oscillator.py
    output: docs/media/her1_her7_delayed_oscillator_comparison.png
    extra_outputs:
      - docs/media/her1_her7_delayed_oscillator_growth.gif
    status: evaluated
    source_refs:
      - lewis2003
      - giudicelli2007
      - herrgen2010
      - schroter2012
    summary: >-
      Pass 1 baseline assessment of `2003-lewis-her1-her7-delayed-oscillator.py` (58.9/100).
      The initial baseline captures the single-cell her1/her7 delay differential equations
      dp/dt = a m(t - T_p) - b p(t) and dm/dt = k / (1 + (p(t - T_m)/p_0)^n) - c m(t) with
      oscillation period T_osc ~ 30 min at 28 C, but requires exact characteristic-equation
      Hopf bifurcation threshold calculation (T_crit = 7.54 min), verification of total delay
      invariance T_tot = T_m + T_p, explicit modeling of Notch mutant (bea/des/aei) stochastic
      desynchronization after the first 5-7 anterior somites alongside intron-deletion and
      cycloheximide ablation controls, and bilateral dorsal somite segmentation against the
      vendored vertebrate embryo SEM specimen (`zebrafish_somites_specimen.jpg`).
    scores:
      model-fidelity:
        value: 62
        rationale: >-
          Implements Lewis's (2003) single-cell her1/her7 autoinhibitory DDEs and Box 1
          period rule T_osc = 2*(T_m + T_p + ln(2)/b + ln(2)/c) (L115-260), but Pass 1 lacks
          the exact characteristic-root Hopf threshold T_crit, verification of delay-split
          invariance (T_m - delta, T_p + delta), and the 32-cell stochastic DeltaC-Notch
          phase-locking simulator reproducing the 6 intact anterior somites of bea/des/aei.
        evidence:
          - {file: 2003-lewis-her1-her7-delayed-oscillator.py, lines: [115, 255], note: "Single-cell her1/her7 DDE solver and analytical Hopf locus", supports: true}
          - {file: 2003-lewis-her1-her7-delayed-oscillator.py, lines: [305, 395], note: "Multicellular DeltaC-Notch PSM synchronization vs bea/des/aei desynchronization simulator", supports: false}
      specimen-match:
        value: 53
        rationale: >-
          Vendors `datasets/her1_her7_delayed_oscillator/zebrafish_somites_specimen.jpg` (CC BY 4.0
          dorsal SEM of vertebrate neural tube and bilateral somites), but Pass 1 lacks automated
          bilateral DoG peak/cleft extraction and phase-aligned waveform correlation against the
          her1/her7 clock-gated somite wave.
        evidence:
          - {file: 2003-lewis-her1-her7-delayed-oscillator.py, lines: [400, 475], note: "Specimen segmentation routine on zebrafish_somites_specimen.jpg", supports: false}
          - {file: docs/media/her1_her7_delayed_oscillator_comparison.png, lines: [0, 0], note: "Comparison figure with dorsal SEM somite overlay", supports: true}
      parameter-expressivity:
        value: 58
        rationale: >-
          Covers wild-type Danio rerio PSM parameters at 28 C (a=4.5, b=c=0.23 min^-1, k=33, p0=40,
          n=2), but needs all 5 experimental regimes (WT coupled her1/her7, pure her7 fast loop,
          pure her1 slow loop, DeltaC-Notch collective delay slowing, and intron-deletion / CHX
          ablation) plus a 2D Hopf bifurcation & period morphospace T_osc(T_m + T_p, b).
        evidence:
          - {file: 2003-lewis-her1-her7-delayed-oscillator.py, lines: [260, 300], note: "5-regime Lewis (2003) / Giudicelli (2007) / Herrgen (2010) evaluator", supports: false}
      morphometric-validation:
        value: 55
        rationale: >-
          Measures wild-type oscillation period T_osc = 30.01 min, but Pass 1 requires full
          5-regime Pearson correlation r and RMSE, Kuramoto synchronization order parameter R_sync
          comparison between WT and bea/des/aei, and bilateral specimen spacing CV.
        evidence:
          - {file: 2003-lewis-her1-her7-delayed-oscillator.py, lines: [480, 560], note: "MorphoEval measurement hook measure_morphoeval()", supports: false}
      source-traceability:
        value: 66
        rationale: >-
          Vendors `scout_manifest.json`, `her1_her7_delayed_oscillator_reference.json`,
          `paper_citations.bib`, and `zebrafish_somites_specimen.jpg` with SHA-256 digests,
          linking Lewis (2003) Current Biology, Giudicelli et al. (2007) PLoS Biology, and
          Herrgen et al. (2010) Current Biology.
        evidence:
          - {file: 2003-lewis-her1-her7-delayed-oscillator.py, lines: [75, 110], note: "SHA-256 cryptographic verification of vendored dataset files", supports: true}
      code-traceability:
        value: 60
        rationale: >-
          Links functions to Lewis (2003) Eqs. 1-2, Box 1, Figs. 2-6, and Lean 4 theorems in
          `morphoeval/lean/loops/Loop_022_her1_her7_delayed_oscillator.lean`.
        evidence:
          - {file: 2003-lewis-her1-her7-delayed-oscillator.py, lines: [1, 58], note: "Module docstring mapping equations to Lewis (2003) and Lean 4 theorems", supports: true}
      repro-package:
        value: 62
        rationale: >-
          Includes `--self-test` and deterministic seed=2003, requiring full verification of
          total delay invariance (T_m - delta, T_p + delta), subcritical intron-deletion damping,
          cycloheximide translation block (a=0), and Notch mutant 6-somite anterior preservation
          in Pass 2.
        evidence:
          - {file: 2003-lewis-her1-her7-delayed-oscillator.py, lines: [780, 845], note: "Self-test suite with bitwise determinism and delay/coupling assertions", supports: true}
    remediation:
      - "Compute exact characteristic-equation Hopf bifurcation delay T_crit = 7.54 min and verify numerical DDE period invariance under redistributing delay (T_m - delta, T_p + delta) alongside subcritical (T_tot = 2.0 min < T_crit) and cycloheximide (a = 0) negative controls."
      - "Simulate a 32-cell stochastic PSM oscillator ensemble demonstrating wild-type DeltaC-Notch phase locking (R_sync > 0.95) vs bea/des/aei mutant desynchronization after 6 intact anterior somites."
      - "Add bilateral dorsal somite row DoG peak & inter-somitic cleft segmentation on `datasets/her1_her7_delayed_oscillator/zebrafish_somites_specimen.jpg` with phase-aligned Pearson r correlation."
