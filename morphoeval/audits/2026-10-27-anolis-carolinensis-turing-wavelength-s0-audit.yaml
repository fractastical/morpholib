simulations:
  - id: delphi10000-anolis-carolinensis-turing-wavelength-s0
    name: "Anolis carolinensis Schnakenberg wavelength at 101.1 µm (Holocene, 0 Ma)"
    organism: "Anolis carolinensis (green anole)"
    script: models/2026-delphi10000-anolis-carolinensis-turing-wavelength-s0.py
    output: docs/media/anolis_carolinensis_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, alexander1969, taylor1970, fofonjka2021]
    summary: >-
      Pass 1. Schnakenberg kinetics with (a, b) = (0.055, 0.945) and D_v/D_u = 8.2
      place the onset wavelength at 101.1 µm on an 808.8 µm periodic dermal patch
      (Holocene, 0 Ma, tier 5 detail). The nonlinear FFT peak is 99.82 µm.
      A six-point sweep from 72 to 168 µm returns Pearson r = 1.0 because the
      residual is a proportional factor near 0.971, with RMSE 3.45 µm. That
      residual is not yet treated as the fit error in this score. The GIF is a
      512 px, 12-frame growth of dark melanin spots on a green field. It is not
      a portrait of the Commons specimen. Overall on this reading is 79.6.
    claim_boundary:
      reported_in_source:
        - "Turing 1952: diffusion-driven instability and a critical wavenumber."
        - "Schnakenberg 1979: du/dt = a - u + u^2 v, dv/dt = b - u^2 v."
        - "Alexander & Fahrenbach 1969: xanthophore, iridophore and basal melanophore layers in A. carolinensis; melanin in the processes turns the skin from green toward brown."
        - "Taylor & Hadley 1970: physiological melanosome migration, not a new wavelength, is the colour-change mechanism inside one melanophore."
      reconstructed_in_script:
        - "D_u and D_v are chosen so k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v) equals (2π/101.1 µm)^2."
        - "Eight wavelengths on an 808.8 µm patch; a 40 µm cellular predecessor holds zero critical modes."
      transfer_boundary:
        - "Fofonjka & Milinkovitch 2021 (Timon scale borders quantising RD into a cellular automaton) is the organ-scale successor, not this intra-scale 101.1 µm patch."
      does_not_claim:
        - "That Alexander & Fahrenbach measured 101.1 µm as a Turing wavelength."
        - "That the rendered spot field is a photograph of the animal."
        - "A fossil chronospecies. The series is Holocene only (1/1, 0 Ma)."
    scores:
      model-fidelity:
        value: 84
        rationale: "The script integrates the Schnakenberg pair with exact Fourier diffusion and the standard onset formula. trace J = -0.11, det J = 1, and λ_c is 101.1 µm by construction. Rate constants are not taken from an anole experiment, so this is not a full fidelity credit."
        evidence:
          - {file: models/2026-delphi10000-anolis-carolinensis-turing-wavelength-s0.py, lines: [92, 118], note: "jacobian and critical_k2 / diffusivities_for_wavelength", supports: true}
          - {file: models/2026-delphi10000-anolis-carolinensis-turing-wavelength-s0.py, lines: [135, 171], note: "periodic spectral Schnakenberg step", supports: true}
      specimen-match:
        value: 70
        rationale: "The comparison figure places the Commons male beside a green field of dark spots. The spots are the right motif for melanophore territories, but the photograph is a whole animal on a leaf and the field is an 0.81 mm patch. Pass 1 does not yet use the GIF-versus-photo computer-vision score."
        evidence:
          - {file: docs/media/anolis_carolinensis_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "specimen beside the 101.1 µm field", supports: true}
          - {file: models/2026-delphi10000-anolis-carolinensis-turing-wavelength-s0.py, lines: [308, 333], note: "luminance-monotonic green-to-melanin colorize and 12-frame GIF", supports: true}
      parameter-expressivity:
        value: 80
        rationale: "Target wavelength rescales D_u at fixed ratio 8.2 and the measured peak moves with it. Pass 1 has not yet accepted the sweep as a scored monotonic law because the 0.971 factor was unread."
        evidence:
          - {file: models/2026-delphi10000-anolis-carolinensis-turing-wavelength-s0.py, lines: [261, 290], note: "wavelength_sweep over 72–168 µm", supports: true}
      morphometric-validation:
        value: 78
        rationale: "Hero peak 99.82 µm versus 101.1 µm, ablation ratio about 1220, Neumann peak 103.96 µm, dispersion r = 0.994. Pearson r = 1.0 on the sweep is the linearity of a proportional bias, not a zero-error claim. RMSE 3.45 µm is computed and not yet the headline error."
        evidence:
          - {file: models/2026-delphi10000-anolis-carolinensis-turing-wavelength-s0.py, lines: [204, 230], note: "dominant_wavelength_um radial FFT peak", supports: true}
          - {file: models/2026-delphi10000-anolis-carolinensis-turing-wavelength-s0.py, lines: [396, 470], note: "measurement list with references that differ from the values", supports: true}
      source-traceability:
        value: 90
        rationale: "Crossref-checked DOIs, a SHA-256 of the vendored public-domain photograph (Danny S., 2011, Commons file Anolis_carolinensis-032.jpg), and an explicit statement that 101.1 µm is the assigned scale."
        evidence:
          - {file: datasets/anolis_carolinensis_turing_wavelength_s0/paper_citations.bib, lines: [1, 55], note: "Turing, Schnakenberg, Alexander, Taylor, Fofonjka", supports: true}
          - {file: datasets/anolis_carolinensis_turing_wavelength_s0/anolis_carolinensis_turing_wavelength_s0_reference.json, lines: [1, 40], note: "scale 0.0001011 m, age 0 Ma, specimen SHA-256", supports: true}
      code-traceability:
        value: 82
        rationale: "Module docstring names the kinetics, the Jacobian and k_c. Lean theorems pin trace, determinant, discriminant and the empty cellular predecessor. Turing's section numbers are not cited line by line."
        evidence:
          - {file: models/2026-delphi10000-anolis-carolinensis-turing-wavelength-s0.py, lines: [1, 48], note: "equation map in the module docstring", supports: true}
          - {file: morphoeval/lean/loops/Loop_3112_anolis_carolinensis_turing_wavelength_s0.lean, lines: [26, 56], note: "stability, discriminant, mode counts; no sorry", supports: true}
      repro-package:
        value: 84
        rationale: "Seed 3112, --self-test (sweep r > 0.98, ablation ratio > 5, wavelength within 8%), and a metrics cache. Nanopub signing is unavailable on this machine."
        evidence:
          - {file: models/2026-delphi10000-anolis-carolinensis-turing-wavelength-s0.py, lines: [544, 569], note: "self_test assertions", supports: true}
          - {file: models/2026-delphi10000-anolis-carolinensis-turing-wavelength-s0.py, lines: [70, 80], note: "pinned a, b, ratio, λ, seed", supports: true}
    remediation:
      - id: R1
        item: "Treat RMSE 3.45 µm and the factor measured/analytical ≈ 0.971 as the fit residual. Do not let Pearson r = 1.0 stand in for a zero-error claim."
      - id: R2
        item: "Score the 12-frame 512 px GIF against the Commons specimen with the fitness-test orientation, radial-FFT and coherency similarity, and record it."
      - id: R3
        item: "The ablation panel must show the raw amplitude ratio, not a clipped bar."
      - id: R4
        item: "No ~/.nanopub/profile.yml on this runner, so the nanopubs cannot be signed. Record that; do not invent a signature."
      - id: R5
