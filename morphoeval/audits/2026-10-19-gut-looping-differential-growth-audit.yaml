# MorphoEval audit — Savin et al. (2011) Nature Vertebrate Gut Looping via Differential Growth, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2011-savin-gut-looping-differential-growth.py` (267 lines)
# prior to Step 12 remediation in `2026-10-19-gut-looping-differential-growth-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.4 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `generate_parametric_gut_curve` (L46-65) uses a synthetic sinusoidal ansatz rather
#      than minimizing the discrete Kirchhoff elastic rod + stretched neo-Hookean dorsal
#      mesentery sheet energy functional E({r_i}) = E_axial + E_bend + E_mesentery + E_steric.
#   2. `evaluate_chick_stages` (L68-92) evaluates only the 5 Chick (Gallus gallus, E8-E16)
#      stages and omits Savin et al.'s (2011) Fig. 4 cross-species collapse across Zebra
#      finch (Taeniopygia guttata), Quail (Coturnix japonica), Chick (Gallus gallus), and
#      Mouse (Mus musculus), as well as Nerurkar et al.'s (2017) PNAS BMP2/Noggin signaling
#      perturbations and the surgical mesentery ablation (epsilon = 0) negative control.
#   3. The vendored biological specimen `datasets/gut_looping_differential_growth/intestine_mesentery_specimen.jpg`
#      is not loaded, segmented, or displayed in `gut_looping_differential_growth_comparison.png`.
#   4. Runtime SHA-256 verification of dataset assets and CLI parameter overrides
#      (`--epsilon`, `--E-ratio`, `--R-t`, `--h-m`, `--seed`) are missing.

