simulations:
  - id: thompson1917-t1917-023
    name: "Thompson (1917) T1917-023 — calcospherites grow by radial deposition about a centre (Harting 1872 artificial CaCO3 concretions in egg albumen)"
    organism: "Harting calcospherites (CaCO3 in egg albumen); natural analogues: plaice otoliths (Fig. 209), Jurassic ooids, silver-chromate Liesegang rings"
    script: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py
    output: docs/media/t1917_023_on_concretions_spicules_and_sp_comparison.png
    extra_outputs:
      - docs/media/t1917_023_on_concretions_spicules_and_sp_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Thompson (1917) pp. 421-422: Harting's CaCO3 precipitated in albumen forms 'large rounded concretions, with a more or less distinct central nucleus, and with a surrounding structure at once radiate and concentric'"
        - "p. 422: crowded calcospherites 'assume polyhedral, or often regularly hexagonal, outlines'; p. 426: pairs look like 'contiguous soap-bubbles'"
        - "p. 424: with scanty albumin / scanty supply the globules become rough 'by an outgrowth of spinous or digitiform projections'"
        - "p. 427: Liesegang zones 'stand farther and farther apart, in logarithmic ratio, as they recede from the centre', offered as the cause of the concentric striation"
      reconstructed_in_script:
        - "E1/E2 interface- vs diffusion-limited radial growth tables (constant vs outward-thinning lamellae)"
        - "E3 Euclidean distance-transform front from a square nucleus: asphericity decays as R^-0.97"
        - "E4 60-centre equal-rate Voronoi mosaic: mean 5.78 neighbours, area CV 0.561"
        - "E5 radial Keller-Rubinow/Ostwald supersaturation precipitation in 2-D (P = 1.220, 11 bands) and 3-D (7 bands)"
        - "E6 dielectric-breakdown clusters at eta = 0 (Eden) and eta = 1 (DLA, mass-radius exponent 1.63)"
      transfer_boundary:
        - "2-D sections of 3-D spherites; synthetic spherite texture is illustrative only"
        - "ooids and silver-chromate rings are modern analogues, not Harting's albumen spherites"
      does_not_claim:
        - "any quantitative match to the digitised 1917 plates (no segmentation performed in v1)"
        - "crystallographic (calcite vs vaterite vs aragonite) control of fibre texture"
    source_refs:
      - thompson1917
      - harting1872
      - kanniah1984
      - antal1998
      - mullins1963
      - niemeyer1984
      - wittensander1981
      - mercedesmartin2016
    summary: >-
      Pass 1 (v1) baseline. The script implements the five Lean-backed geometric laws
      (constant lamella, parabolic thinning, asphericity decay, Voronoi impingement, geometric
      Liesegang spacing) and a dielectric-breakdown supply model, verifies the SHA-256 of all five
      vendored plates/specimens, and renders the plates beside the model panels. Simulation-side
      numbers are close to their analytic/literature references (asphericity exponent -0.97 vs -1,
      Voronoi neighbours 5.78 vs 6, Liesegang P = 1.22 inside the 1.05-1.4 Jablczynski range), but
      the plates and the two analogue specimens are displayed, not measured: no segmentation,
      no fit statistics, no negative/ablation controls, and only two points of the eta sweep.
      The claim is therefore not yet tested against Thompson's own figures.
    scores:
      model-fidelity:
        value: 66
        rationale: >-
          E1-E5 are implemented as stated in the reference JSON and match the Lean theorems
          (`radial_growth_laws` L110-121, `simulate_front_rounding` L125-153, `simulate_voronoi_impingement`
          L157-180, `simulate_liesegang_radial` L184-232, `simulate_dbm_cluster` L236-288). The
          Liesegang solver is the Ostwald supersaturation form with explicit nucleation / growth
          thresholds and d-dimensional radial Laplacian. However the sphericity-stability law is only
          exercised for uniform (isotropic) deposition; the anisotropic crystalline alternative that
          Thompson contrasts (calcium oxalate stays crystalline, p. 434) is not implemented, and the
          Mullins-Sekerka regime boundary is not swept.
        evidence:
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [110, 153], note: "E1/E2 growth-law tables and E3 distance-transform front rounding (decay exponent -0.97)", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [184, 232], note: "E5 d-dimensional radial supersaturation precipitation with nucleation threshold K_ss and growth threshold K_sp", supports: true}
          - {file: morphoeval/lean/loops/Thompson1917_T1917_023.lean, lines: [32, 195], note: "11 machine-checked theorems for laws 1-5 (Lean 4.35.0, 0 sorry)", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [66, 72], note: "no anisotropic-deposition alternative and no threshold-free Liesegang control in PARAMS", supports: false}
      specimen-match:
        value: 42
        rationale: >-
          The five vendored files are SHA-256-verified (`verify_dataset_integrity` L88-99) and the
          Thompson plates (Figs. 195, 196, 197, 208) are cropped and rendered side by side with the
          model panels (`render_comparison_png` L363-405), so the qualitative correspondence
          (nucleus + radial fibres + concentric bands; polygonal mosaic when crowded) is visible.
          Nothing is measured on the plates, the Carmel ooid and Liesegang specimens are vendored but
          not shown or analysed, and the synthetic spherite texture (`_spherite_texture` L346-360)
          is a drawing, not a model output.
        evidence:
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [363, 405], note: "plates vs model 2x4 comparison figure", supports: true}
          - {file: docs/media/t1917_023_on_concretions_spicules_and_sp_comparison.png, lines: [0, 0], note: "rendered Pass 1 comparison", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [346, 360], note: "synthetic spherite texture is illustrative, not derived from the growth model", supports: false}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [102, 106], note: "load_plate crops exist but no segmentation of spherites, ooids or Liesegang rings", supports: false}
      parameter-expressivity:
        value: 48
        rationale: >-
          Only two eta values (0 and 1) are run (`PARAMS['dbm']['etas']` L71), a single Liesegang
          (a0, b0) pair per dimension (L68-69, L297-298), and a single seed geometry for E3. The
          regimes listed in the reference JSON (eta = 0, 0.5, 1, 1.5, 2; b0 = 0.05, 0.1, 0.2) are not
          swept, so monotonic control of form by supply exponent and by electrolyte ratio is asserted,
          not demonstrated. There are no CLI overrides for model parameters.
        evidence:
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [64, 72], note: "PARAMS: etas = [0.0, 1.0] only; single Liesegang b0", supports: false}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [462, 480], note: "CLI exposes only --self-test / --quick / --no-gif", supports: false}
      morphometric-validation:
        value: 45
        rationale: >-
          `measure_morphoeval` (L308-342) returns 8 metrics, 6 with literature/analytic reference
          values (asphericity exponent, lamella CV, Voronoi neighbours and area CV, Jablczynski P,
          DLA exponent). All are simulation-side; none is measured on a specimen, and there is no
          r / RMSE / KS / CV statistic comparing model to plate.
        evidence:
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [308, 342], note: "8 simulation-side metrics, 6 with reference values", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [308, 342], note: "no specimen-derived measurement and no goodness-of-fit statistic", supports: false}
      source-traceability:
        value: 80
        rationale: >-
          `datasets/thompson_1917/t1917-023/` holds the scout manifest (IA SHA-1/SHA-256 digests,
          leaf-to-page rule, OCR quotes with page numbers), the reference JSON with every vendored
          file's SHA-256, a 21-entry BibTeX, and the Commons licence/author records for both
          analogue specimens; the script verifies the digests at runtime. Harting (1872) itself is
          cited through Thompson, not fetched.
        evidence:
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [88, 99], note: "runtime SHA-256 verification of all 5 vendored files", supports: true}
          - {file: datasets/thompson_1917/t1917-023/scout_manifest.json, lines: [1, 120], note: "IA item digests, leaf/page mapping, 7 OCR quotes, Commons provenance", supports: true}
      code-traceability:
        value: 70
        rationale: >-
          Module docstring (L1-33) and section headers map E1-E6 to Thompson page numbers and to the
          Lean module; function docstrings cite Zener / Mullins-Sekerka, Keller-Rubinow/Ostwald,
          Niemeyer et al. Figure numbers (195-197, 208) are pinned to pixel boxes (L55-61) but the
          link from each measured number back to a specific Thompson sentence is not yet explicit.
        evidence:
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [1, 33], note: "equation-to-page and Lean traceability in module docstring", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [55, 61], note: "plate crops pinned to IA page pixel coordinates", supports: true}
      repro-package:
        value: 64
        rationale: >-
          Deterministic seeds (SEED = 1917; per-eta RNG), 8-check `run_self_test` (L436-459) passing
          in 2.3 s, full render in 6.4 s, documented invocation, `--quick` mode. Dependencies are the
          repo's requirements.txt but versions are not pinned in the script, and no result.json /
          verdict artefact is written.
        evidence:
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [436, 459], note: "8-check deterministic self-test", supports: true}
          - {file: thompson/claims/t1917-023_on-concretions-spicules-and-spicular-skeletons.py, lines: [462, 480], note: "no --write-result / verdict artefact in v1", supports: false}
    remediation:
      - "Segment Thompson's plates: boundary-radius CV and radial-fibre alignment of the Fig. 196 spherite, nucleus detection + radial alignment in Fig. 195, cell neighbour count / area CV of the Fig. 197 mosaic, ring radii of Fig. 208."
      - "Analyse the two analogue specimens: ellipse fit, concentric ring count and radial-fibre alignment of the Carmel ooids; ring radii of the silver-chromate Liesegang specimen with geometric-vs-arithmetic spacing fits (r, RMSE) and Jablczynski P."
      - "Run the full eta sweep (0, 0.5, 1, 1.5, 2) and the Liesegang b0 sweep (0.05, 0.1, 0.2) to show monotone control of solidity / exponent and of P."
      - "Add negative / ablation controls: anisotropic (chessboard-metric) deposition that does not round off; threshold-free (K_ss = K_sp) precipitation that gives a continuous deposit instead of bands."
      - "Add goodness-of-fit statistics (Pearson r, RMSE, two-sample KS, CV) between simulated and specimen distributions, expose CLI parameter overrides, and write datasets/thompson_1917/t1917-023/result.json with the claim verdict."
