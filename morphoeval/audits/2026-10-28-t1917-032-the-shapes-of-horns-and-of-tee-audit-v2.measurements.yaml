    claim_boundary:
      reported_in_source:
      - 'Thompson pp. 619, 633-634: constant growth-rate ratio across the basal zone yields a logarithmic spiral;
        tooth, tusk, beak, claw all follow it; elephant tusk tip ~ spiral pole; long tusks (mammoth, Babirussa)
        are curves of double curvature'
      - 'Thompson pp. 621-623 + Fig. 321: St Venant torsion warps non-circular prisms into anticlastic surfaces
        whose contour lines explain the sinuous growth lines of trihedral horns'
      reconstructed_in_script:
      - Algebraic accretion law κ = (v_max − v_min)/(w v̄) = Δ/w and its gnomonic closure tan ψ = Δ/c_s (arc-length
        taper) ⇔ sin ψ = Δ/c_r (E4-E5), verified against the integrated ODE (r = 1.000)
      - Screw-accretion frame update Ω = κ b + τ n generating circle / log spiral / helix / helico-spiral (E6),
        fitted in 3-D to the projected specimen centreline
      - Kiladze chord ratio tan α = π/(2 tan φ) conversion from a locally measured groove inclination (E7)
      transfer_boundary:
      - The narwhal tusk is a labelled analogue for the torsion component; Thompson's 1917 chapter never names the
        narwhal
      - A single 2-D museum photograph projects a 3-D helico-spiral tusk; the 3-D fit recovers view angles but the
        broken root inflates w(s) and the tip hook is foreshortened
      does_not_claim:
      - 'No growth-rate (v_max, v_min) or CT data: λ = 0.862 and Δ = 0.148 are inferred from the fitted geometry,
        not measured'
      - No handedness determination from the narwhal photograph (tip orientation unknown); along-shaft tan α trend
        is confounded by camera obliquity and not scored
