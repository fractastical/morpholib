simulations:
  - id: hubaud-yap-excitable-segmentation
    name: "Hubaud, Regev, Mahadevan & Pourquié (2017) excitable FitzHugh-Nagumo segmentation clock gated by YAP mechanotransduction, with FGF/Wnt clock-and-wavefront arrest and stiffness-LATS-YAP kinetics (Pass 3)"
    organism: "Mus musculus (mouse E9.5-E10.5 presomitic mesoderm LuVeLu Lfng-Venus / Hes7 excitable oscillator)"
    script: 2016-hubaud-yap-excitable-segmentation.py
    output: docs/media/yap_excitable_segmentation_comparison.png
    extra_outputs:
      - docs/media/yap_excitable_segmentation_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-yap-excitable-segmentation-audit-v2
    claim_boundary:
      reported_in_source:
        - "Hubaud, Regev, Mahadevan & Pourquie (2017) Cell 171:668-682 FitzHugh-Nagumo excitable oscillator model of primary mouse presomitic mesoderm (PSM) cells gated by nuclear YAP mechanotransduction"
        - "Quiescent excitable state in isolated spread fibronectin PSM cells (high nuclear YAP) rescued into ~140 min autonomous LuVeLu oscillations by Latrunculin A, Y-27632 (Rockout), or Yap1 inhibition, and blocked by constitutively active Yap5SA"
        - "Cooke & Zeeman (1976) clock-and-wavefront law S = v_wf T; Dubrulle, McGrew & Pourquie (2001) posterior-high fgf8 mRNA gradient regressing with axis elongation and positioning the determination front; Dupont et al. (2011) YAP/TAZ cytoplasmic on ~0.7 kPa and nuclear on ~40 kPa fibronectin hydrogels under Rho/F-actin control; Wada et al. (2011) stress fibres inhibit LATS1/2"
      reconstructed_in_script:
        - "Analytical cubic nullcline continuation, Jacobian spectrum, and supercritical Hopf bifurcation diagram across Y_nuc in [0, 1] (|u_H| = 0.9675, Y_crit = 0.6109)"
        - "RK4 single-cell & ensemble simulations across all 6 Hubaud et al. (2017) perturbation regimes (Pearson r = 0.9976, RMSE = 0.0469) plus subthreshold vs suprathreshold single-pulse excitability"
        - "2D reaction-diffusion mPSM target-wave PDE solver with Yap5SA constitutive block control and bilateral somite DoG peak segmentation on mouse_psm_somites_specimen.jpg (47.14 px mean spacing, CV = 0.2010)"
        - "[Pass 3] 1D anteroposterior excitable chain with juxtacrine Dll1-Notch coupling and a regressing Fgf8/Wnt gradient: arrest front g(F) = g_crit, frozen-phase Mesp2-like switch, 8 stripes with S = 101.7 um vs v_wf T = 102.0 um (CV 0.024), 0 um anterior pulse leak at gamma_F = 1.6 (802 um at 0.8), v_wf / lambda_F / gamma_F sweeps and uniform-FGF ablation (0 stripes)"
        - "[Pass 3] Stiffness -> F-actin tension -> LATS1/2 -> three-state YAP kinetics cascade fitted to the five wild-type regimes (RMSE 0.054), E_crit = 12.6 kPa, dynamic Latrunculin A rescue (onset 30.8 min, period 142.5 min), and a 48-cell Dll1-Notch ring synchrony sweep (Kuramoto R 0.27 -> 0.80)"
      transfer_boundary:
        - "Fast-slow 2-variable FitzHugh-Nagumo phenomenological reduction of the Notch/FGF/Wnt/YAP mouse PSM segmentation clock compared with a dorsal chick-embryo somite SEM (Wikimedia 'Aves_Neural_tube_and_somites_in_chick_embryo.jpg', filed as mouse_psm_somites_specimen.jpg) whose px spacing has no um calibration"
        - "The FGF/Wnt gate acts additively on I_eff (gamma_F (g(F) - 1)) and the determination front is defined by the Hopf margin, which is a reduced reading of Hubaud et al. (2017) Fig. 7 and of the clock-and-wavefront literature, not an equation published in the source paper; the chain is 1D with no cell flow, convergent extension or mediolateral extent"
        - "The YAP cascade is a lumped ODE keeping both a LATS-dependent branch (Wada 2011) and a LATS-independent tension-driven import branch; Dupont et al. (2011) reported the stiffness response as largely LATS-independent, and the E_50 = 10 kPa, A_50 = 500 um^2, m = 3, k_exp, k_PP, tau_actin constants are modelling choices, not measured values"
      does_not_claim:
        - "Explicit molecular transcriptional-translational delay equations for Hes7/Lfng/Axin2, a PSM-wide period/phase gradient (Lauschke 2013 kinematic waves are only reproduced within ~50 um of the front), 3D focal-adhesion traction force microscopy, or the mouse somite AP length beyond an order-of-magnitude anchor (~100 um, Gomez et al. 2008)"
    source_refs:
      - hubaud2017
      - fitzhugh1961
      - lauschke2013
      - dupont2011
      - cooke1976
      - dubrulle2001
      - wada2011
      - gomez2008
    summary: >-
      Pass 3 post-remediation evaluation of `2016-hubaud-yap-excitable-segmentation.py` (91.8/100, v2 91.7).
      Both v2 remediation items are closed: the excitable FHN core is now coupled along a 1D anteroposterior axis
      to an explicit regressing Fgf8/Wnt gradient through a Hill gate on I_eff, so that the clock arrests at a
      moving determination front and freezes a Mesp2-like stripe pattern whose spacing (101.7 um) matches the
      Cooke-Zeeman law v_wf T (102.0 um) across a 5-point v_wf sweep (slope 144.8 min vs T 145.7 min, r 0.99998),
      with lambda_F controlling PSM length (407-735 um) but not S, gamma_F controlling whether excitable pulses
      leak anteriorly (802 um at 0.8, 0 um at the default 1.6) and uniform FGF abolishing the stripes; and
      nuclear YAP is now produced by a substrate-stiffness -> F-actin -> LATS1/2 -> YAP phosphorylation / import
      cascade calibrated on the five wild-type regimes (RMSE 0.054), predicting E_crit = 12.6 kPa inside the Dupont
      (2011) 0.7-40 kPa bracket and a dynamic Latrunculin A ignition 30.8 min after F-actin loss, while J_Dll1
      became an explicit juxtacrine Dll1-Notch coupling that synchronises a heterogeneous ring (R 0.27 -> 0.80).
      Three new Lean 4 theorems (Theorems 4-6) back the new mathematics (6 total, 0 sorrys). The round also
      surfaced the next layer of defects: the 200-cell ensemble in the 6-regime benchmark is decorative (the
      predicted fraction is a hand-tuned logistic of I_eff), the vendored specimen is a chick embryo SEM filed as
      mouse with no um scale, the FGF gate and several mechanical constants are uncited modelling choices, the
      cascade cannot reproduce the non-monotonic Y-27632 vs high-density pair, and the PSM clock has no phase
      gradient outside ~50 um of the front.
    scores:
      model-fidelity:
        value: 93
        rationale: >-
          The published FHN fast-slow core, YAP gate and 2D excitable PDE are unchanged and verified (Laws 1-3,
          L171-604). Pass 3 adds the two missing mechanisms the v2 audit asked for and proves their governing
          identities in Lean (Theorems 4-6): the regressing exponential Fgf8 gradient (Dubrulle 2001) gating I_eff
          with an arrest criterion that reproduces S = v_wf T to 0.3% and the analytic front offset to 0.4%
          (L707-886), and a three-state YAP import/export/phosphorylation cycle whose monotonicity in tension and
          LATS is proved cross-multiplied (L954-1139). Deductions: the FGF gate gamma_F (g(F) - 1) is additive and
          phenomenological rather than an Fgf8/Wnt3a/Hes7 circuit, and gamma_F had to be raised from 0.8 to 1.6
          for the excitable waves to actually arrest at the front, which is a tuned rather than derived number
          (-3); the 6-regime benchmark's 200-cell ensemble (L447-453) is computed but never used - the predicted
          oscillating fraction is a logistic of the deterministic I_eff with a hand-set margin 0.115 and width
          0.125 (L451-456), so the r = 0.9976 reflects two fitted constants rather than ensemble dynamics (-3);
          the cascade keeps a LATS branch that Dupont (2011) found largely dispensable for the stiffness response
          (disclosed, -1).
        evidence:
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [171, 284], note: "FHN cubic nullcline, YAP-gated I_eff, equilibrium solver and analytical Hopf thresholds (Laws 1-3), unchanged from v2", supports: true}
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [707, 748], note: "Pass 3: Fgf8 gradient F(x,t), Hill gate g(F), FGF-gated current I_eff = I_basal + J + gamma_F (g - 1) - gamma_YAP Y_nuc and g_crit from the Hopf margin (Law 5)", supports: true}
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [750, 886], note: "Pass 3: 1D chain with juxtacrine J_i, Laplacian coupling, arrest bookkeeping (u_arrest, Mesp2 switch L821-840), stripe/PSM-length morphometrics and anterior-wave-penetration metric (L849-858)", supports: true}
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [968, 1031], note: "Pass 3: tension index T(E, A, rho_actin, c_ROCK), LATS activity, steady-state Y_n = r_n/(1 + r_n + r_p) and least-squares calibration on the five WT regimes (Law 6)", supports: true}
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [1059, 1139], note: "Pass 3: dynamic three-state YAP ODE coupled to the FHN cell for the Latrunculin A rescue (onset latency, period)", supports: true}
          - {file: morphoeval/lean/loops/Loop_027_yap_excitable_segmentation.lean, lines: [110, 199], note: "Theorems 4-6 (clock-wavefront spacing, FGF arrest criterion + front speed independent of lambda_F, YAP nuclear-fraction monotonicity), 0 sorrys, verified with lean 4.35.0", supports: true}
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [447, 456], note: "Defect: 200-cell ensemble osc_mask is computed but pred_frac is a hand-tuned logistic of the deterministic I_eff (margin 0.115, width 0.125); the ensemble only feeds a reporting field", supports: false}
      specimen-match:
        value: 88
        rationale: >-
          Panel F still segments both bilateral somite rows of the vendored SEM (8 + 8 somites, 47.14 px, CV
          0.201) and Panels G/H now place a generated discrete stripe pattern (8 stripes, S = 101.7 um, CV 0.024)
          beside it, with the Mesp2-like switch strip, the determination front and the tail bud drawn on the
          kymograph, so the figure finally shows somite-like periodic clefts emerging from the clock rather than
          only waves. Deductions: the specimen is a chick embryo SEM (source URL 'Aves_Neural_tube_and_somites_in_
          chick_embryo.jpg', reference JSON L55) filed as mouse_psm_somites_specimen.jpg, and the v2 audit's
          'vertebrate' wording hid this - the organism match is a transfer, not a mouse specimen (-6); the specimen
          spacing is in px with no um calibration, so the 100 um model stripes and the 47 px somites cannot be
          compared on one scale (-3); the model stripe CV (0.024) is an order of magnitude below the specimen CV
          (0.201) and the figure does not comment on it (-2); the 1D stripes have no mediolateral shape to compare
          with the rounded somite blocks (-1).
        evidence:
          - {file: docs/media/yap_excitable_segmentation_comparison.png, lines: [0, 0], note: "9-panel figure: A-F as v2 plus G (1D kymograph with front, tail bud, Mesp2 strip and stripe edges), H (Cooke-Zeeman sweep, lambda_F / gamma_F annotations, ablation marker, 100 um anchor), I (Y_nuc(E_sub) with Dupont soft/stiff bands, regime points, LatA and synchrony insets)", supports: true}
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [1651, 1684], note: "Panel G renders the stripe pattern and determination front from the same simulate_ap_wavefront_arrest result used by the measurements", supports: true}
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [1173, 1214], note: "Bilateral dorsal somite DoG peak & cleft segmentation on the specimen (unchanged from v2)", supports: true}
          - {file: datasets/yap_excitable_segmentation/yap_excitable_segmentation_reference.json, lines: [50, 58], note: "Defect: specimen source URL identifies a chick embryo SEM, filed under a 'mouse_psm' filename with no um/px scale", supports: false}
      parameter-expressivity:
        value: 95
        rationale: >-
          Every new morphospace parameter is swept and behaves monotonically as claimed: v_wf -> S linearly
          (5 points, slope 144.8 min = T, r 0.99998), lambda_F -> PSM length (407 / 571 / 735 um vs analytic 410 /
          574 / 737) with S unchanged, gamma_F -> anterior pulse leak (802 um at 0.8, 0 um at >= 1.2), uniform
          FGF -> 0 stripes, E_sub -> Y_nuc monotone with E_crit inside the Dupont bracket, J_max -> Kuramoto R
          (0.27 -> 0.80, Spearman 0.94), plus the v2 Y_nuc bifurcation sweep and 6-regime suite. New CLI flags
          --v-wf, --lambda-F and --E-sub expose the two mechanisms. Deductions: the J_max -> R relation is not
