          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [1033, 1057], note: "160-point stiffness sweep and log-interpolated E_crit", supports: true}
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [687, 701], note: "J_max coupling sweep with Spearman rank correlation of the final order parameter", supports: true}
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [2018, 2042], note: "CLI: --v-wf / --lambda-F one-off wavefront run and --E-sub cascade prediction", supports: true}
      morphometric-validation:
        value: 93
        rationale: >-
          `measure_morphoeval()` (L1218-1352) now returns 11 reference-anchored measurements: the five v2 ones
