# MorphoEval audit — Hubaud, Regev, Mahadevan & Pourquié (2017) YAP-Gated Excitable Segmentation Clock, 2026-10-19 (v3)
#
# Pass 3 re-score of `2016-hubaud-yap-excitable-segmentation.py` (Slot 027) after remediating BOTH open
# items of the v2 audit in the instrumented loop `morphoeval/runs/2026-10-19-yap-excitable-segmentation-loop-pass3`,
# superseding `2026-10-19-yap-excitable-segmentation-audit-v2` (91.7).
#
# What Pass 3 changed (v2 `remediation` items 1-2):
#   1. Section 4c (L704-952): a 1D anteroposterior PSM chain of excitable FHN cells is coupled to an explicit
#      regressing Fgf8/Wnt gradient F(x,t) = min(1, exp(-(x_tb(t) - x)/lambda_F)) through a Hill gate g(F) that
#      enters I_eff additively (gamma_F (g - 1)); cells arrest where gamma_F (1 - g) exceeds the Hopf margin, the
#      frozen phase u_arrest(x) is thresholded into a Mesp2-like switch, and 8 discrete stripes emerge with spacing
#      S = 101.7 um vs the Cooke-Zeeman prediction v_wf T = 102.0 um (CV 0.024). With gamma_F = 1.6 the anterior
#      cells are non-excitable and the pulses truly arrest at the front (0 um leak), the gamma_F = 0.8 control leaks
#      802 um. Sweeps: v_wf (slope dS/dv = 144.8 min vs T = 145.7 min, r = 0.99998), lambda_F (PSM length 407 ->
#      735 um while S is unchanged), gamma_F, and a uniform-FGF ablation (0 stripes).
#   2. Section 4d (L954-1139): substrate stiffness -> F-actin tension T(E, A, rho_actin, c_ROCK) -> LATS1/2 L(T)
#      -> three-state YAP (Y_n, Y_p, Y_c) import/export/phosphorylation kinetics -> Y_nuc, calibrated by
#      least-squares on the five wild-type regimes (RMSE 0.054), predicting E_crit = 12.6 kPa inside the Dupont
#      (2011) 0.7-40 kPa bracket, and a dynamic Latrunculin A rescue (Y_nuc 0.816 -> 0.179, onset 30.8 min,
#      period 142.5 min). Section 4b (L607-701): J_Dll1 is now an explicit juxtacrine Dll1-Notch coupling
#      J_i = J_max mean_j sigma(u_j); a 48-cell ring sweep raises Kuramoto R from 0.27 (J = 0) to 0.80 (J = 0.3).
#   3. Three new Lean 4 theorems (Loop_027 Theorems 4-6, 0 sorrys, verified with `lean`), six equations in the
#      math KG, reference JSON extended with both mechanisms and four new DOIs (Cooke & Zeeman 1976, Dubrulle 2001,
#      Wada 2011, Gomez 2008), self-test extended (11 measurements), 9-panel figure and 3-panel GIF.
#
# Scores below are criterion-referenced scores on the rubric's 0-100 scale (not calibrated probabilities), scored
# only on evidence verified against the files at commit d58a084 (line numbers refer to that state of the working
# tree). Overall 91.8 (v2 91.7): the remediation items are closed and formally backed, but the round also exposed
# defects that pull in the other direction (decorative 200-cell ensemble in the 6-regime benchmark, chick specimen
# filed as mouse without a um scale, phenomenological FGF gate and uncited mechanical constants, no PSM-wide phase
# gradient), listed under `remediation` for Pass 4.

