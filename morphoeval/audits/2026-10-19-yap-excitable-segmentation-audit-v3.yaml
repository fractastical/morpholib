        evidence:
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [1290, 1352], note: "Six Pass 3 measurements with reference values, units, sweep/ablation notes (stripe spacing, Cooke-Zeeman slope, cascade RMSE, E_crit, LatA onset, Kuramoto R)", supports: true}
          - {file: 2016-hubaud-yap-excitable-segmentation.py, lines: [1225, 1289], note: "Five v2 measurements (Hopf threshold, Y_crit, LatA period, 6-regime r, specimen spacing) retained unchanged", supports: true}
          - {file: datasets/yap_excitable_segmentation/yap_excitable_segmentation_reference.json, lines: [204, 210], note: "Empirical anchors for the wavefront module: ~100 um mouse somite (Gomez 2008), 142 min clock, implied v_wf 0.704 um/min", supports: true}
