# MorphoEval audit — Nijhout (1990) Proc. R. Soc. B & Brakefield et al. (1996) Nature Butterfly Wing-Vein Focus Determination & Concentric Eyespot Rings, 2026-10-19 (v1)
#
# Dual-agent Pass 1 assessment of `2001-nijhout-butterfly-eyespot-focus-rings.py` (v1, 149 lines)
# prior to Step 12 closed-loop remediation (`2026-10-19-butterfly-eyespot-focus-rings-loop`):
#   - Primary assessor: Gemini 4 Argon — 54.0 / 100
#   - Independent second assessor rubric check — 49.0 / 100
#   - Pass 1 consensus score: 51.5 / 100
#
# Concrete Pass 1 weaknesses flagged for Step 12 remediation:
#   1. Evaluates only a 1D analytical exponential curve c(r) = c0 * exp(-r/lambda) and a static
#      2D circular disc sketch (L23-50): omits Stage-1 2D Meinhardt activator-inhibitor
#      reaction-diffusion inside a longitudinal wing-vein-bounded cell compartment [0, L_x] x [-W_y/2, W_y/2]
#      that destabilizes the midline ridge into a discrete focal organizer at (x_f, 0) (Nijhout 1990),
#      omits Stage-2 2D finite-difference PDE relaxation of dc/dt = D nabla^2 c - k c + S_0 delta(x - x_focus),
#      and omits twin-focus hourglass fusion (Beldade et al. 2002) and pupal cautery timing series.
#   2. Zero biological specimen comparison (`specimen-match: 24`): the vendored CC BY-SA 4.0
#      *Bicyclus anynana* ventral wing eyespot photograph (`datasets/butterfly_eyespot_focus_rings/bicyclus_anynana_eyespot_specimen.jpg`)
#      is not loaded, SHA-256-verified, or radially segmented in v1.
#   3. Omits multi-regime comparison across Wet-Season Wild-Type (c0=1.0), Dry-Season Ecdysone
#      Polyphenism (c0=0.42), *Goldeneye* Spalt-threshold mutant (theta_black=0.44), Twin-Focus
#      Hourglass Fusion (d_12=1.50 mm < 2*R_gold), and Early Pupal Focal Microcautery Ablation (c0=0.05).
#   4. Hardcodes fixed parameters without CLI overrides (`--c0`, `--lambda-mm`, `--theta-black`,
#      `--theta-gold`, `--d12`, `--seed`).

