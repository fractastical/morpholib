          - {file: models/2026-delphi10000-gallus-gallus-turing-wavelength-s0.py, lines: [139, 160], note: "contiguous scale-bar measurement", supports: true}
          - {file: models/2026-delphi10000-gallus-gallus-turing-wavelength-s0.py, lines: [560, 653], note: "measure_morphoeval non-circular specimen metrics", supports: true}
      source-traceability:
