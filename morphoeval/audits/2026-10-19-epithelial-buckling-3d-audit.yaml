# MorphoEval audit — Hannezo, Prost & Joanny (2014) PNAS & Krajnc & Ziherl (2015) PRE 3D Epithelial Sheet Morphology & Apico-Basal Buckling, 2026-10-19 (v1)
#
# Pass 1 (v1) evaluation of `2016-hannezo-epithelial-buckling-3d.py` (226 lines)
# prior to Step 12 remediation in `2026-10-19-epithelial-buckling-3d-loop`:
#   - Primary assessor: Gemini 4 Argon — 56.4 / 100
#
# Key findings driving Step 12 (Pass 2) remediation:
#   1. `generate_cosine_buckled_profile` (L74-82) uses a closed-form 1D cosine ansatz
#      rather than numerically minimizing the coupled 3D epithelial cell + substrate
#      bending energy functional via L-BFGS-B across the full 2D phase diagram in
#      (Gamma_l / Gamma_a, K_sub) spanning flat squamous, flat cuboidal, flat columnar,
#      buckled mucosal folds, and closed spherical acini.
#   2. `evaluate_baseline_tissues` (L85-107) evaluates only the 8 Mus musculus rows and
#      omits the Drosophila melanogaster wing-disc and follicular epithelial rows (12 total),
#      as well as the 5 perturbation controls (E-cadherin knockdown flattening, apical
#      Myosin-II hyperactivation folding, basal tension hyperactivation curvature inversion,
#      and soft-substrate spherical acinus formation).
#   3. The vendored CC0 histology specimen `datasets/epithelial_buckling_3d/epithelial_sheet_buckling_specimen.jpg`
#      is not loaded, segmented, or analyzed for epithelial layer height h_0, lateral cell
#      width d_0, aspect ratio h_0/d_0, or fold wavelength lambda_c.
#   4. Runtime SHA-256 verification of dataset assets and CLI parameter overrides
#      (`--gamma-a`, `--gamma-b`, `--gamma-l`, `--k-sub`, `--seed`) are missing.

