          - {file: datasets/drosophila_ventral_furrow/ap_shell_stokes_reference.json, lines: [1, 80], note: "Parameter table with per-source doi_verified_offline flags and approximate-value notes", supports: true}
          - {file: datasets/drosophila_ventral_furrow/paper_citations.bib, lines: [45, 83], note: "Pass 3 BibTeX additions with usage notes; DOIs not re-verified offline", supports: false}
