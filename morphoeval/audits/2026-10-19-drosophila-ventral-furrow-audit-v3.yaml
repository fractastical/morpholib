# MorphoEval audit — Conte et al. (2012), Martin et al. (2009) & He et al. (2014) Drosophila Ventral Furrow Invagination Biomechanics, 2026-10-19 (v3)
#
# Pass 3 remediation-round evaluation of `2012-he-drosophila-ventral-furrow.py` (Slot 046,
# `slot-046-drosophila-ventral-furrow`) superseding `2026-10-19-drosophila-ventral-furrow-audit-v2` (92.0)
# in the instrumented loop `morphoeval/runs/2026-10-19-drosophila-ventral-furrow-loop-pass3`.
#
# What Pass 3 changed (both open v2 remediation items):
#   1. v2 item 1 ("couple the 2D transverse ring to longitudinal AP curvature and germband-extension stresses in a
#      3D shell mesh") -> `ellipsoidal_shell_curvatures`, `solve_ap_coupled_furrow_profile`, `couple_ring_to_ap_shell`,
#      `sweep_ap_shell_parameters` (L627-852): a Donnell/Winkler elastic line  ell_B^4 D'''' - ell_N^2 D'' + k_rel(z) D
#      = D_2D(t) chi_meso(z) along the AP axis of the prolate ellipsoid (a = 250 um, b = 83.2 um) with exact meridional and
#      hoop curvatures (k_pole/k_eq = 13x), driven by the 2D ring depth at every snapshot with a germband-extension
#      tension ramp, swept into a 65 x 81 (theta x z) shell mesh (Panel G) and swept over ell_N and a/b (Panel H).
#      CLOSED AS A REDUCED MODEL: this is a 1D elastic line + kinematic circumferential sweep, NOT a 3D FE shell.
#   2. v2 item 2 ("explicitly resolve intracellular Stokes flow fields around moving nuclei during the early
#      lengthening phase") -> `solve_intracellular_stokes_flow`, `analyze_phase1_nuclear_hydrodynamics` (L855-1083):
#      a variable-viscosity Stokes solve in stream-function form (4 d_xy[mu psi_xy] + (d_xx - d_yy)[mu(psi_xx - psi_yy)]
#      = 0) on a 35 x 192 grid inside the WT mesoderm cell at the instant of maximal Phase-I lengthening rate, with
#      incompressible-trapezoid boundary kinematics (exact flux closure 5.6e-17), the nucleus as a 50x-viscosity
#      inclusion (rigid-body CV 0.004), an exact-solution verification (L2 8.1e-13) and a Phase-I nuclear trajectory
#      (Panel I). CLOSED WITH LIMITATIONS: fixed rectangular domain, no cortical stress BC, no neighbour coupling.
#   3. Two new machine-checked Lean 4 theorems (0 sorrys): `ap_tension_and_curvature_stiffening_reduce_furrow_depth`
#      and `affine_lengthening_flow_divergence_free_and_basalward`; registered in the math KG loop file.
#   4. New SHA-256-pinned parameter table `datasets/drosophila_ventral_furrow/ap_shell_stokes_reference.json`
#      (+3 citations with explicit `doi_verified_offline: false` flags), 5 new `measure_morphoeval()` entries (7 -> 12),
#      self-test 4 -> 6 blocks (+21 asserts), 6-panel -> 9-panel figure. GIF regenerates byte-identically to v2.
#
# What Pass 3 EXPOSED (score goes DOWN on two dimensions despite the new mechanisms):
#   The 2D ring "simulation" prescribes its own targets. In `simulate_ventral_furrow_regime` the regime block
#   (L332-369) hard-codes `target_ap_um`, `target_h_um`, `target_depth_um` equal to the empirical reference values, the
#   furrow depth is an interpolant `depth_um = target_depth_um * min(1, 0.35 constr_frac + 0.65 prog^1.28)` (L455-458)
#   pinned to the target at the last step, and `h_mean = target_h_um` is forced at the last step (L443-445). The
#   6-regime Pearson r = 1.0000 / RMSE = 0.000 um that v2 credited under model-fidelity and morphometric-validation is
#   therefore circular: depth and height are not emergent from the viscous-vertex mechanics, only the apical-width
#   pulse ODE is integrated. The new AP shell and Stokes layers are genuine boundary-value solves, but they are driven
#   by that prescribed depth. This is the top Pass 4 item.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale (not probabilities).
# Line numbers refer to the files at commit 7e4f207 as modified in this working tree (verified against the current
# file at audit time; the script is 1962 lines, the Lean file 243 lines).

