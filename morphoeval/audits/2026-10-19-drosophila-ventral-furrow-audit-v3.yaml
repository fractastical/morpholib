        value: 86
        rationale: >-
          `measure_morphoeval()` now returns 12 measurements (L1196-1416). New in Pass 3: D_3D(0.5 EL) =
          39.92 um vs 41.0 ref (coupling ratio 0.974), furrow half-depth extent 0.590 EL vs ~0.65 ref,
