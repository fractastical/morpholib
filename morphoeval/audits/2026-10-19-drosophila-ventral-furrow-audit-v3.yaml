          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [1651, 1679], note: "Panel G: theta x z shell mesh surface coloured by inward displacement, ventral view", supports: true}
          - {file: docs/media/drosophila_ventral_furrow_comparison.png, lines: [0, 0], note: "9-panel figure: Panels A-F as in v2 plus G (3D shell), H (AP profile sweeps), I (Stokes flow with nucleus); specimen boxes and morphometrics visible in Panel F", supports: true}
      parameter-expressivity:
        value: 93
        rationale: >-
          The 6-regime evaluator and the 15x15 (r_twist x sigma_synergy) morphospace are retained, and Pass 3
          adds two genuine physical sweep axes with monotone, theorem-backed behaviour: germband-extension
          tension ell_N in {0, 25, ..., 150} um reduces D(0.5 EL) monotonically from 41.0 to 21.9 um
