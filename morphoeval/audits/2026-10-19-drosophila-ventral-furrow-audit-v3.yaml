          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [1910, 1935], note: "Stokes determinism asserted across two independent WT simulations", supports: true}
          - {file: docs/media/drosophila_ventral_furrow_growth.gif, lines: [0, 0], note: "24-frame GIF byte-identical to the v2 artifact (unchanged code path)", supports: true}
    remediation:
      - >-
        2012-he-drosophila-ventral-furrow.py:332-369, 443-445, 455-458 — the ring depth and cell height are
        target-pinned interpolants (`target_depth_um`, `target_h_um` equal to the reference values; `depth_um =
        target_depth_um * min(1, ...)` and forced at the last step). Replace with an actual force balance on the
        64-cell ring (apical/basal/lateral line tensions gamma_ap, gamma_ba, gamma_lat + vitelline contact +
        yolk pressure, overdamped vertex dynamics) so that D_furrow and h emerge, and re-score the 6-regime
        comparison as a prediction rather than a calibration check.
      - >-
        2012-he-drosophila-ventral-furrow.py:646-719 and 721-793 — the AP coupling is one-way (ring -> line) and
        kinematic in theta: D(z) is swept with a fixed Gaussian pocket shape and there is no membrane/bending
        stress feedback from the AP profile onto the ring. Upgrade to a two-way coupled thin-shell (Koiter or
        Donnell) solve on the theta x z mesh with the active apical tension as a surface load, or at minimum
        make the pocket width a function of D(z).
      - >-
        datasets/drosophila_ventral_furrow/ap_shell_stokes_reference.json:54-62 — ell_B = 22 um and the WT ell_N
