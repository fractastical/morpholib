          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [1249, 1264], note: "6-regime Pearson r measurement is computed against the same reference values the regimes are pinned to", supports: false}
          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [1005, 1083], note: "Phase-I hydrodynamics: tracer ratio, rigid-body CV, perturbation magnitude, nuclear trajectory vs lengthening", supports: true}
