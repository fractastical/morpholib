simulations:
  - id: he-drosophila-ventral-furrow
    name: "Conte et al. (2012), Martin et al. (2009) & He et al. (2014) Drosophila ventral furrow invagination biomechanics"
    organism: "Drosophila melanogaster (gastrulating cellular blastoderm embryo)"
    script: 2012-he-drosophila-ventral-furrow.py
    output: docs/media/drosophila_ventral_furrow_comparison.png
    extra_outputs:
      - docs/media/drosophila_ventral_furrow_growth.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-drosophila-ventral-furrow-audit-v2
    claim_boundary:
      reported_in_source:
        - "Conte, Munoz, Baum & Miodownik (2012) PLoS ONE 7(11):e49973 incompressible finite-element cross-sectional decomposition showing apical constriction alone produces only a shallow groove (16.5 um) with over-elongated cells (48.1 um), whereas synergy with basal relaxation, lateral shortening, and ectodermal pushing drives full invagination (41.0 um)"
        - "Martin, Kaschube & Wieschaus (2009) Nature 457:495-499 Twist-stabilized ratcheted Myosin-II pulses (T_pulse = 82 s) vs unratcheted relaxation recoil; He et al. (2014) Nature 508:392-396 apically driven hydrodynamic cytoplasmic flow that carries nuclei basally as passive tracers during cell lengthening"
        - "Sweeton et al. (1991) / Leptin & Grunewald (1990): the ventral furrow spans roughly the mesoderm primordium (~0.15-0.80 EL) and germband extension begins as the furrow closes (approximate, not digitised here)"
      reconstructed_in_script:
        - "64-cell 2D incompressible trapezoidal blastoderm ring enclosed by the vitelline membrane (R_vit = 83.2 um, A_0 = 262.4 um^2), RK2 integration of the ratcheted Myosin-II apical-width pulse ODE, 6-regime benchmark and 15x15 (r_twist x sigma_synergy) morphospace; NOTE: regime depth and cell height are target-pinned interpolants, not emergent mechanics"
        - "[Pass 3] Reduced 3D AP shell: Donnell/Winkler elastic line ell_B^4 D'''' - ell_N^2 D'' + k_rel(z) D = D_2D(t) chi_meso(z) on the prolate ellipsoid (exact kappa_z, kappa_theta; k_pole/k_eq = 13x), driven by the ring depth at each snapshot with a germband-extension tension ramp, swept into a 65x81 theta x z shell mesh; sweeps over ell_N (0-150 um, ablation ratio 0.53, monotone) and a/b (1.5-4.0)"
        - "[Pass 3] Variable-viscosity Stokes flow (stream-function form, 35x192 grid, 6,110 unknowns) inside the Phase-I lengthening mesoderm cell with incompressible-trapezoid boundary kinematics, a 50x-viscosity nucleus (v_nuc/v_cyto = 0.983, rigid-body CV 0.004), exact affine verification (L2 8.1e-13) and a Phase-I nuclear trajectory (4.5 um basal displacement over 16.2 um lengthening)"
        - "Automated 4-stage confocal cross-section segmentation and ventral apical Myosin-II red enrichment analysis on drosophila_ventral_furrow_specimen.jpg (DV/ML = 1.0496 -> 0.9217, MyoII enrichment = 1.63x, trajectory r = 0.9993)"
      transfer_boundary:
        - "The AP coupling is a 1D elastic line with a curvature-weighted Winkler foundation and a kinematic circumferential sweep; ell_B = 22 um and the WT ell_N ramp to 30 um are model assumptions not measured in any cited paper, and N_GB is not calibrated to Lye et al. (2015) ablation recoil"
        - "The Stokes solve is 2D on a fixed rectangle frozen at t = 1.8 min with velocity (not stress) boundary data; nucleus size/position are order-of-magnitude values; the He et al. (2014) comparison is the qualitative passive-tracer ratio ~1, not a digitised velocity field"
        - "The 2D ring depth that drives both new layers is pinned to the Conte (2012) / Martin (2009) reference values at the last step, so the 6-regime r = 1.0000 is a consistency check of the calibration, not an independent prediction"
      does_not_claim:
        - "A 3D finite-element shell with coupled membrane/bending stresses, a moving-boundary (ALE) or 3D Stokes solve with cortical actomyosin stress boundary conditions, emergent (un-pinned) invagination depth from the viscous-vertex mechanics, or subcellular Rho1/Rok reaction-diffusion signaling"
    source_refs:
      - conte2012
      - martin2009
      - he2014
      - polyakov2014
      - sweeton1991
      - leptin1990
      - lye2015
    summary: >-
      Pass 3 remediation-round evaluation of `2012-he-drosophila-ventral-furrow.py` (89.9/100, down from
      92.0 in Pass 2). Both v2 remediation items were closed with honest reduced models: a Donnell/Winkler
      AP shell line equation on the prolate-ellipsoidal blastoderm (exact meridional/hoop curvatures,
      $k_{\mathrm{pole}}/k_{\mathrm{eq}} = 13\times$, germband-extension tension $\ell_N$ ramp) driven by the
      2D ring depth and swept into a 5,265-node $\theta \times z$ shell mesh
      ($D_{3D}(0.5\,EL) = 39.92\ \mu\text{m}$ vs $D_{2D} = 41.0$, half-depth extent $0.590$ EL vs $\approx 0.65$,
      $\ell_N$ ablation ratio $0.534$, monotone), and a variable-viscosity Stokes solve in stream-function form
      inside the Phase-I lengthening cell with a $50\times$-viscosity nucleus
      ($v_{\mathrm{nuc}}/v_{\mathrm{cyto}} = 0.983$ vs He et al. 2014 $\approx 1$, affine verification
      $L_2 = 8.1\times10^{-13}$, flux closure $5.6\times10^{-17}$), each pinned by a new machine-checked Lean 4
      theorem (5 total, 0 sorrys). The round also exposed that the 2D ring depth and cell height are
      target-pinned interpolants (L332-369, L443-445, L455-458), making the Pass 2 6-regime $r = 1.0000$
      circular; model-fidelity and morphometric-validation are therefore scored lower than in v2 and the
      un-pinning of the ring mechanics is the top Pass 4 item.
    scores:
      model-fidelity:
        value: 87
        rationale: >-
          Credited: exact incompressible wedge geometry and RK2 ratcheted-pulse ODE (L153-249), the new AP
          shell line equation with exact ellipsoid curvatures, simply supported poles and a verified
          second-order stencil (L627-719; uncoupled run recovers the 2D depth to 0.1% at 50% EL), the new
          variable-viscosity Stokes operator derived by taking the curl of div(sigma) = 0 with exact
          boundary-flux closure and an exact-solution check to 1e-12 (L855-1003), and 5 Lean theorems
          (0 sorrys) pinning Theorems 1-5. Deductions: the regime depth and cell height in the 2D ring are
          prescribed interpolants pinned to the reference values at the last step (L332-369, L443-445,
          L455-458) rather than solved from the viscous-vertex force balance, so the Conte (2012) decomposition
          is reproduced by construction (-7, newly exposed); the AP coupling is a 1D line + kinematic sweep,
          not a 3D FE shell, and ell_B / ell_N are free parameters (-3); the Stokes domain is a fixed rectangle
          with velocity BCs rather than a moving trapezoid with cortical stress BCs (-3).
        evidence:
          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [153, 249], note: "Incompressible wedge geometry, basal width inversion, and RK2 ratcheted pulse ODE convergence (unchanged, verified)", supports: true}
          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [332, 369], note: "Regime block hard-codes target_ap_um / target_h_um / target_depth_um equal to the empirical reference values", supports: false}
          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [443, 458], note: "h_mean = target_h_um and depth_um = target_depth_um forced at the last step; depth is an interpolant of constr_frac and prog, not a mechanical solve", supports: false}
          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [627, 719], note: "Exact ellipsoid principal curvatures and the Donnell/Winkler AP line equation solver with ghost-node simply supported poles", supports: true}
          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [855, 1003], note: "Variable-viscosity Stokes stream-function operator, boundary flux line integral, two-layer Dirichlet closure, sparse direct solve, divergence and affine checks", supports: true}
          - {file: morphoeval/lean/loops/Loop_046_drosophila_ventral_furrow.lean, lines: [145, 242], note: "Theorems 4-5 (modal stiffness monotonicity; discrete divergence-free basal-ward affine flow), 0 sorrys, verified with lean", supports: true}
      specimen-match:
        value: 91
        rationale: >-
          Unchanged from v2 for the confocal layer: the CC BY 4.0 4-stage transverse micrograph is vendored,
