          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [1680, 1706], note: "Panel H renders the ell_N family of AP profiles, the WT coupled run, the mesoderm load and k_rel(z)", supports: true}
          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [578, 624], note: "15x15 morphospace is an analytic surrogate (ap_factor, d_val, h_val) rather than ring re-simulation", supports: false}
          - {file: 2012-he-drosophila-ventral-furrow.py, lines: [1889, 1908], note: "Self-test asserts monotone decrease with ell_N, ablation < 0.8, and monotone pole stiffening with a/b", supports: true}
