simulations:
  - id: delphi10000-drosophila-eugracilis-turing-wavelength-s0
    name: "Schnakenberg Turing wavelength at 1.5 µm in Drosophila eugracilis (Pass 1 focal run)"
    organism: "Drosophila eugracilis"
    script: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py
    output: docs/media/drosophila_eugracilis_turing_wavelength_s0_comparison.png
    also:
      - docs/media/drosophila_eugracilis_turing_wavelength_s0_growth.gif
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, murray1981, tanaka2009, yassin2016, ready1976]
    summary: >-
      Pass 1 integrates Schnakenberg kinetics at gamma=1 on a 128^2 periodic grid
      (12 focal wavelengths, 17.820 µm window) and fixes the length unit so the
      analytic lambda_c is 1.485 µm. The saturated field is an ocellar spot lattice
      (activator std 1.26, 93 foci). Analytic lambda 1.485 µm versus FFT lambda
      1.809 µm. Raw Otsu arm fraction on the gallery plate is 0.141 and KS
      luminance distance to the render is 0.343. No gamma sweep, no equal-diffusion
      control, and no series Pearson/RMSE are stored in pass1_metrics.json.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and a critical wavenumber."
        - "Schnakenberg 1979 two-species kinetics."
        - "Tanaka, Barmina and Kopp 2009: sex-comb rows rotate in some Drosophila lineages and are born longitudinal in others."
        - "Ready, Hanson and Benzer 1976: the retina is a periodic neurocrystalline lattice."
      reconstructed_in_script:
        - "Length unit chosen so gamma=1 yields the assigned 1.485e-6 m detail wavelength."
        - "gamma=0.5 for D. erecta and 1.180 µm for D. ficusphila as the chronoseries contrast at this scale."
      transfer_boundary:
        - "The gallery JPEG is a project spiral plate with a 100 µm bar, not an SEM of a D. eugracilis ocellus."
      does_not_claim:
        - "That 1.485 µm was published as a measured eugracilis rhabdomere or sex-comb spacing."
        - "That D. erecta is a stratigraphic ancestor. Position 13/41 is the flattened Holocene chronoseries."
        - "The sibling 101 µm primordium parameters or DOI 10.1016/j.ydbio.2009.04.012, which Crossref assigns to a different paper."
    scores:
      model-fidelity:
        value: 86
        rationale: "Pass 1 implements the Schnakenberg PDE and the Turing wavenumber formula, and the gamma=1 length unit hits 1.485 µm by construction. The nonlinear FFT wavelength (1.809 µm) is not yet reconciled with k_c across a parameter series."
        evidence:
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [79, 111], note: "Jacobian and k_c^2 = (D_v f_u + D_u g_v)/(2 D_u D_v)", supports: true}
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [139, 195], note: "Pseudospectral Schnakenberg used for the focal gamma=1 run", supports: true}
      specimen-match:
        value: 72
        rationale: "The 12-frame 720x540 GIF ends in a brown ocellar lattice rendered with the plate LUT. The plate itself is a spiral, so the geometry does not match even though both fill the frame. The plate is the gallery fallback, not a photograph of the fly."
        evidence:
          - {file: docs/media/drosophila_eugracilis_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 720x540, focal growth from a two-arm seed to spots", supports: true}
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [247, 257], note: "GIF writer resamples each activator frame through the plate LUT", supports: true}
      parameter-expressivity:
        value: 60
        rationale: "The dispersion panel draws three gamma curves, but pass1_metrics.json stores only gamma=1. Monotonic control of the nonlinear wavelength by gamma is not yet measured, and the equal-diffusion control is not in this pass."
        evidence:
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [127, 129], note: "lambda(gamma) = lambda(1)/sqrt(gamma) is defined but not swept in pass 1 output", supports: true}
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [652, 653], note: "pass_id >= 2 gate; pass 1 returns before the sweep", supports: true}
      morphometric-validation:
        value: 66
        rationale: "Single-point comparison only: analytic 1.485 µm versus FFT 1.809 µm, raw Otsu fraction 0.141 (reference fitness-script fraction 0.354), KS 0.343, focus spacing CV 0.294. No Pearson r, RMSE series, or ablation contrast in the pass-1 record."
        evidence:
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [197, 223], note: "Radial FFT wavelength with parabolic peak refinement", supports: true}
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [259, 288], note: "Raw Otsu segmentation of the gallery plate", supports: true}
          - {file: datasets/drosophila_eugracilis_turing_wavelength_s0/pass1_metrics.json, lines: [0, 0], note: "Pass-1 scalars; no pearson_r key", supports: true}
      source-traceability:
        value: 90
        rationale: "Nine Crossref-checked DOIs are in paper_citations.bib. The sibling primordium DOI 10.1016/j.ydbio.2009.04.012 was rejected because Crossref shows it is a mouse germ-cell paper. Wikimedia returned no D. eugracilis bitmap; the gallery fallback and its SHA-256 are recorded."
        evidence:
          - {file: datasets/drosophila_eugracilis_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "Turing, Schnakenberg, Murray, Tanaka 2009 PNAS", supports: true}
          - {file: datasets/drosophila_eugracilis_turing_wavelength_s0/scout_manifest.json, lines: [0, 0], note: "Slot 3184 is outside campaign_100; collision with the s0 slug is false", supports: true}
      code-traceability:
        value: 84
        rationale: "The module docstring and jacobian docstring name Turing 1952, Schnakenberg 1979 and Murray gamma. Lean Loop_3184 has six theorems and no sorry, encoding the 2100 > 1485 > 1180 nm order. Pass 1 does not yet exercise the mode-count comparison on simulated fields."
        evidence:
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [1, 28], note: "Docstring states 1.485e-06 m, 0 Ma, predecessor erecta, successor ficusphila", supports: true}
          - {file: morphoeval/lean/loops/Loop_3184_drosophila_eugracilis_turing_wavelength_s0.lean, lines: [20, 43], note: "Six theorems, zero sorry", supports: true}
      repro-package:
        value: 82
        rationale: "Dataset SHA-256 locks, seed 3184, and --self-test are present. Pass 1 itself does not record the sweep that --self-test checks, and there is no pinned per-script requirements file beyond the repo requirements.txt."
        evidence:
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [64, 77], note: "SHA-256 lock of reference, specimen, bib, scout, README", supports: true}
          - {file: models/2026-delphi10000-drosophila-eugracilis-turing-wavelength-s0.py, lines: [745, 759], note: "CLI --pass and --self-test; GIF frame and size gate", supports: true}
    remediation:
      - id: R1
        item: "Run a gamma sweep spanning D. erecta (0.50), D. eugracilis (1), and D. ficusphila, and record analytic versus FFT wavelength."
      - id: R2
        item: "Add the equal-diffusion negative control D_u = D_v and report final activator std against the Turing run."
      - id: R3
        item: "Replace the grain-dominated raw Otsu perimeter with a blurred arm segmentation and keep value distinct from the reference."
      - id: R4
        item: "Report series goodness-of-fit: Pearson r, RMSE, and the plate-versus-render KS statistic, with value not equal to reference."
