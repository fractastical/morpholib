      reported_in_source:
      - Turing 1952 dispersion relation and a critical wavenumber.
      - Schnakenberg 1979 two-species kinetics.
      - Murray 1981 scale parameter controlling pattern spacing.
      - 'Tanaka, Barmina and Kopp 2009: sex-comb mechanisms differ among Drosophila species, including rotation
        versus longitudinal birth of the row.'
      - 'Yassin et al. 2016: female-limited colour dimorphism has recurred in Drosophila.'
      - 'Ready, Hanson and Benzer 1976: periodic retinal lattice.'
      reconstructed_in_script:
      - Length unit chosen so gamma=1 yields 1.485e-6 m.
      - gamma_erecta=0.5 and lambda_ficusphila=1.180 µm as this scale's chronoseries contrast.
      - Nonlinear FFT wavelength series, equal-diffusion ablation, blurred Otsu mask, KS luminance.
      transfer_boundary:
      - Gallery JPEG is a canonical spiral plate (100 µm bar), not a micrograph of D. eugracilis. Commons had no
        species bitmap on 2026-10-27.
      - Spot-lattice reciprocal wavenumber is not identical to the linear k_c; RMSE 0.701 µm is that bias.
      does_not_claim:
      - A published 1.485 µm measurement on D. eugracilis ocelli or sex-comb teeth.
      - Stratigraphic ancestry of erecta to eugracilis. Both are extant; 13/41 is the catalog chronoseries index.
      - Sibling primordium parameters (101 µm, alpha 1.555) or DOI 10.1016/j.ydbio.2009.04.012.
      - A nanopublication signature. No ~/.nanopub/profile.yml was present.
