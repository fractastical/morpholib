# MorphoEval audit — Uriz et al. (2003) Microsc. Res. Tech. & Aizenberg et al. (2005) Science Sponge Spicule Silicatein Symmetry, Laminated Lattice, Cohesive Bending & Basalia Waveguide, 2026-10-19 (v3)
#
# Pass 3 (remediation round) re-score of `2012-bavestrello-sponge-spicule-hexactin.py` (now 2215 lines, "Pass 3 (v3)")
# after the Phase A remediation in the instrumented loop `morphoeval/runs/2026-10-19-sponge-spicule-hexactin-loop-pass3`,
# superseding `2026-10-19-sponge-spicule-hexactin-audit-v2` (91.6 / 100). Same assessor/second-assessor identities as
# Pass 2 (telemetry run `primary_assessor: gemini-4-argon`, `second_assessor: claude-sonnet-5-5-high`); the Phase B
# scoring pass was executed by a Claude Fable 5.1 subagent working from the Phase A handoff note, `git diff` of the
# script / Lean file / math-KG YAML, a fresh `--self-test` run (12/12 PASS, ~5 s) and `lean` verification (exit 0,
# 0 `sorry`s), with every `lines:` pin re-checked against the files at commit a69596cc.
#
# What Pass 3 changed (both v2 remediation items closed, as honest reduced models):
#   1. Law 5 — 1D Hermite-beam finite-element three-point bending of the N = 25 concentric laminate with a bilinear
#      cohesive-zone organic interlayer (He & Hutchinson deflect-vs-penetrate, Hillerborg l_cz = 27 um, Griffith
#      interface delamination solved by bisection on the FE stiffness), coupled to the 3D silicatein solver through the
#      accreted biosilica cross-section (k_cat sweep -> N in {0, 6, 13, 19, 25}). W_lam / W_mono = 1.714 (25 load drops)
#      vs 1.000 for the fused-interlayer ablation. NOT a 3D cohesive FEM — stated in the section banner and docstrings.
#   2. Law 6 — external helical surface ridges on the cylindrical cage (K_tors(psi) = K_wall + N_r k_r sin^2(2 psi),
#      psi_opt = 45 deg, parallel-axis ovalization gain 1 + N_r A_r / 2 = 2.00 for N_r = 8). Law 7 — basalia step-index
#      waveguide from the Law-3 lamellar radii (NA = 0.2408, V = 6.38 at 550 nm, 6 LP groups / 20 modes vs Gloge 20.3,
#      single-mode cutoff 1.458 um; meridional ray trace 9.45 deg vs analytic 9.49 deg).
#   3. Two new Lean 4 theorems (`cohesive_laminate_progressive_fracture_work_exceeds_monolith`,
#      `euplectella_helical_ridge_shear_projection_and_parallel_axis_gain`), 6 theorems total, 0 `sorry`s; Laws 5-7
#      registered in `morphoeval/math_kg_loops/bavestrello-sponge-spicule-hexactin.yaml` (Law 7 has no Lean theorem).
#   4. New dataset files `cohesive_bending_waveguide_reference.json` (every constant provenance-tagged) and
#      `pass3_citations.bib`; README Pass 3 section; new `sponge_spicule_hexactin_pass3_mechanics.png` and
#      `sponge_spicule_hexactin_bending_fracture.gif`; `measure_morphoeval()` 9 -> 18 entries; self-test 8 -> 12 checks;
#      new CLI flags `--skip-pass3`, `--g-i`, `--n-ridges`.
#
# Why the overall score goes DOWN (91.6 -> 88.6) although both remediation items were closed: the Pass 3 mechanics
# exposed that the Pass 2 validation layer was largely self-referential. The 12-species `theta_obs_deg` and
# `toughness_ratio_obs` columns are Pass 1 recalled numbers that sit on the model laws to r = 1.0000; the Pass 2
# toughness law G_lam / G_mono = 1 + eta N (eta = 0.32) is fitted to that same table and is contradicted ~5x by the
# new cohesive FE mechanics (1.71x vs 8.95x / 9.0x); the specimen reference angles in the JSON equal the script's own
# outputs; and several new Pass 3 measurements are numerical-parity or identity checks (FE vs 48EI/L^3, exact sum vs
# closed form, ray trace vs Snell) or calibrated by construction (k_cat -> N = 25). Six new DOIs and all optical /
# fracture constants are recalled offline and unverified. These are now listed as Pass 4 remediation items.
#
# Scores are uncalibrated criterion-referenced scores on the rubric's 0-100 scale. Line numbers refer to the files at
# commit a69596cc (working tree with the Pass 3 Phase A edits applied).
#
# Metadata note: the Pass 3 dispatch prompt names the seed paper as Uriz, Turon & Becerro (2003) Prog. Mol. Subcell.
# Biol. (10.1007/978-3-642-55486-5_7); the script, dataset, Lean file and both prior audits cite Uriz, Turon, Becerro &
# Agell (2003) Microsc. Res. Tech. 62:279-299 (10.1002/jemt.10395). The telemetry run `init` used the prompt string;
# this audit keeps the Microsc. Res. Tech. paper, which is the one the code actually implements. Neither DOI was
# verified online during Pass 3.

