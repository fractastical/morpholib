          - {file: models/2012-bavestrello-sponge-spicule-hexactin.py, lines: [1041, 1104], note: "Helical ridge cage: K_tors(psi) = K_wall + N_r k_r sin^2(2 psi), specific stiffness with 1/cos psi helix length, parallel-axis I_eff / I_wall = 1 + N_r A_r / 2 (N_r >= 3)", supports: true}
