          - {file: models/2012-bavestrello-sponge-spicule-hexactin.py, lines: [719, 791], note: "Bilinear cohesive traction, G_i = 0.5 T_max delta_c, Hillerborg l_cz, 4x4 Hermite element and 48-element simply-supported FE midspan stiffness", supports: true}
          - {file: models/2012-bavestrello-sponge-spicule-hexactin.py, lines: [799, 949], note: "Progressive failure: outermost-in strength criterion, He-Hutchinson deflect/penetrate, Griffith half-length by bisection on FE stiffness, piecewise-linear P-delta and W = int P d delta; 1D single-crack model, not 3D cohesive FEM (stated in docstring)", supports: true}
