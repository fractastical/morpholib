simulations:
  - id: bavestrello-sponge-spicule-hexactin
    name: "Uriz et al. (2003) & Aizenberg et al. (2005) sponge spicule silicatein axial symmetry, concentric biosilica lamination, Euplectella checkerboard lattice mechanics, cohesive-zone laminate bending, helical cage ridges and basalia waveguiding"
    organism: "Euplectella aspergillum (Hexactinellida) & Tethya aurantia / Pachastrella monilifera (Demospongiae) / Sycon raphanus (Calcarea)"
    script: models/2012-bavestrello-sponge-spicule-hexactin.py
    output: docs/media/sponge_spicule_hexactin_comparison.png
    extra_outputs:
      - docs/media/sponge_spicule_hexactin_growth.gif
      - docs/media/sponge_spicule_hexactin_pass3_mechanics.png
      - docs/media/sponge_spicule_hexactin_bending_fracture.gif
    status: evaluated
    supersedes_audit_id: 2026-10-19-sponge-spicule-hexactin-audit-v2
    source_refs:
      - uriz2003
      - aizenberg2005
      - weaver2007
      - shimizu1998
      - sundar2003
      - aizenberg2004
      - woesz2006
      - hehutchinson1989
      - hillerborg1976
      - gloge1971
    claim_boundary:
      reported_in_source:
        - "Uriz et al. (2003): silicatein axial filaments with crystallographic symmetry template the ray geometry of siliceous spicules (monaxon, triactine, tetractin, hexactin)"
        - "Aizenberg et al. (2005): Euplectella spicules are concentric silica lamellae (thickness ~1.5 um at the centre to ~0.2 um at the periphery) separated by organic interlayers; the cylindrical cage carries alternating diagonal bracing and external helical/oblique ridges; basalia act as optical fibres"
        - "Weaver et al. (2007): laminated spicules fail gracefully under three-point bending through crack deflection at the organic interlayers, unlike monolithic silica rods"
        - "Sundar et al. (2003) / Aizenberg et al. (2004): basalia have a high-index core and lower-index lamellar cladding and guide light (values recalled offline)"
      reconstructed_in_script:
        - "O_h / T_d / D_3h / D_inf_h silicatein ray vectors, a 3D silicic-acid reaction-diffusion accretion solver with k_cat ablation, the h_n = h_1 r_1 / r_n lamellar law, checkerboard diagonal shear stiffness, a 12-species symmetry/toughness table, DoG + gradient-tangent segmentation of the vendored Euplectella photograph; Pass 3: a 48-element Hermite-beam FE three-point-bend of the laminate with a bilinear cohesive interlayer, He-Hutchinson deflection criterion and Griffith delamination, coupled to the 3D solver through the accreted cross-section; helical-ridge torsion / ovalization gain; step-index basalia waveguide with meridional ray tracing and LP-mode counting"
      transfer_boundary:
        - "The FE bending model is 1D (single midspan crack, outermost-in strength criterion, no friction, bridging or shear-lag) on the Law-3 geometry (outer radius 5.83 um, span 233 um), not Weaver et al.'s 3D cohesive-zone specimen geometry (r = 22.5 um in the species table); it predicts W_lam / W_mono = 1.71, not the 8.95 of the table nor the 9.0 of the Pass 2 eta-law"
        - "Ridge count, pitch and area ratio, the cohesive constants (sigma_f, G_s, T_max, delta_c), span/diameter, and the optical-core lamella count are modelling choices tagged `provenance: model`; E = 36 GPa, the He-Hutchinson 0.25 ratio, n_core / n_clad and the Aizenberg lamella thicknesses are `recalled` and unverified"
        - "The 12-species theta_obs_deg / toughness_ratio_obs columns are Pass 1 recalled numbers, not digitised measurements; their r = 1.0000 agreement with the model laws is not independent validation"
      does_not_claim:
        - "A 3D cohesive-zone finite-element reproduction of Weaver et al. (2007) load-displacement curves, measured ridge geometry from the specimen, measured numerical aperture or mode images of real basalia, or independent verification of any Pass 3 DOI or recalled constant"
    summary: >-
      Pass 3 (v3) remediated evaluation of `2012-bavestrello-sponge-spicule-hexactin.py` (weighted
      score 88.6/100, down from 91.6/100 in Pass 2 although both Pass 2 remediation items were
      closed). The script now couples the 3D silicatein diffusion-reaction solver to a 1D
      finite-element cohesive-zone three-point-bending model of the N = 25 laminate
      (`simulate_three_point_bending_cohesive_laminate`, L799-949; `evaluate_coupled_accretion_to_fracture`,
      L968-999): W_lam / W_mono = 1.714 with 25 graceful load drops vs 1.000 for the fused-interlayer
      ablation, Hillerborg l_cz = 27 um, FE parity with 48 EI / L^3 to 1e-9. It extends the cage mechanics
      with external helical ridges (`simulate_helical_ridge_cage_mechanics`, L1041-1104: psi_opt = 45 deg,
      torsion gain 7.93x, ovalization gain 2.00x) and models basalia step-index waveguiding
      (`simulate_basalia_optical_waveguide`, L1112-1203: NA 0.2408, V 6.38, 20 modes vs Gloge 20.3,
      single-mode cutoff 1.458 um), backed by 6 Lean 4 theorems (2 new) with 0 `sorry`s, 12 self-test
      checks and 18 measurements. The score falls because the new mechanics expose that the Pass 2
      validation layer was self-referential: the 12-species table and the 1 + eta N toughness law sit on
      the model to r = 1.0000 by construction, the cohesive FE model disagrees with that law by ~5x, the
      k_cat -> N = 25 mapping is calibrated, four of the nine new measurements are parity/identity checks,
      and all Pass 3 physical constants and six DOIs are recalled offline and unverified.
    scores:
      model-fidelity:
        value: 90
        rationale: >-
          Pass 2 content stands (exact O_h / T_d / D_3h / D_inf_h ray algebra L153-245, 3D reaction-diffusion
          accretion L249-370, lamellar thinning L395-459, checkerboard shear L464-508). Pass 3 adds a
          correctly assembled Hermite-beam FE (L750-791; parity with 48 EI / L^3 to 1e-9), a bilinear cohesive
          law whose integral equals G_i (L719-747), the He-Hutchinson deflection test and a Griffith
          delamination balance solved on the FE stiffness (L799-949), a sin^2(2 psi) netting projection with
          parallel-axis ovalization gain (L1041-1104) and a step-index waveguide with exact ray invariant and
          Bessel-zero LP cutoffs (L1112-1203), all with Lean-checked identities. Deductions: the remediation
          item asked for a 3D cohesive-zone FEM; what was built is a 1D single-crack beam model (-3); the Pass 2
          toughness law 1 + eta N (eta = 0.32, L104) is phenomenological, fitted to the recalled table, and is
          contradicted ~5x by the new mechanics (1.71 vs 9.0) — the script keeps both without reconciling them
          (-4); the bending geometry inherits the Law-3 outer radius 5.83 um instead of the species-table 22.5
          um (-2); Law 4 (cos^2 45 deg = 0.5 per strut, L489) and Law 6 (sin^2(2 psi) normalised to 1 at 45 deg)
          state the diagonal projection with different conventions and the 7.5x checkerboard gain rests on the
          arbitrary K_axial / K_bend = 26 (L106) (-2); the k_cat -> N coupling is a calibrated mass-to-layer
          constant rather than a mechanistic lamella-count law (-2).
