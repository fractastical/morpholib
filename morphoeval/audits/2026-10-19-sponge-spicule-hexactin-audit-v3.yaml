          - {file: morphoeval/lean/loops/Loop_076_sponge_spicule_hexactin.lean, lines: [223, 321], note: "Pass 3 Lean: interlayer_deflects / hillerborg_length / laminate_fracture_work and theorem cohesive_laminate_progressive_fracture_work_exceeds_monolith (L255-L270); ridge_shear_projection sums and theorem euplectella_helical_ridge_shear_projection_and_parallel_axis_gain (L309-L320); lean exit 0, 0 sorrys", supports: true}
