simulations:
  - id: asally-bacillus-biofilm-wrinkling
    name: "Asally et al. (2012) PNAS & Yan et al. (2019) Nature Physics osmotic matrix swelling, localized cell-death delamination, and Föppl–von Kármán radial wrinkle spokes in Bacillus subtilis biofilms"
    organism: "Bacillus subtilis (NCIB 3610 wild-type and matrix/cell-death mutant biofilm macrocolonies)"
    script: 2013-asally-bacillus-biofilm-wrinkling.py
    output: docs/media/bacillus_biofilm_wrinkling_comparison.png
    extra_outputs:
      - docs/media/bacillus_biofilm_wrinkling_growth.gif
    status: evaluated
    source_refs:
      - asally2012
      - yan2019
      - trejo2013
      - seminara2012
    summary: >-
      Pass 1 (v1) baseline evaluation of `2013-asally-bacillus-biofilm-wrinkling.py`
      (overall weighted score: 56.2/100). The v1 script implements the Föppl–von Kármán
      bilayer characteristic wavelength lambda_c = 2*pi*h*(E_bar_f/(3*E_bar_s))^(1/3),
      critical compressive buckling strain epsilon_c = 0.25*(3*E_bar_s/E_bar_f)^(2/3),
      and radial spoke count N_spokes = 2*pi*R_ring/lambda_c across the 7-point agar
      stiffness sweep E_s in [0.5, 10.0] kPa, but uses a closed-form polar cosine ansatz
      instead of relaxing a 2D Föppl–von Kármán + localized cell-death delamination
      energy functional F[w], omits the biofilm thickness sweep h in [40, 140] um,
      Delta eps / Delta tasA matrix-deficient mutant and artificial score-guided spoke
      controls, and does not segment the vendored macrocolony biofilm specimen
      (`bacillus_biofilm_specimen.jpg`).
    scores:
      model-fidelity:
        value: 58
        rationale: >-
          Computes plane-strain moduli E_bar_f and E_bar_s, characteristic Föppl–von Kármán
          wavelength lambda_c = 2*pi*h*(E_bar_f/(3*E_bar_s))^(1/3), critical strain
          epsilon_c, and radial spoke count N_spokes (L34-53), backed by 3 Lean 4 theorems
          in `Loop_094_bacillus_biofilm_wrinkling.lean`. However, `generate_parametric_biofilm_surface`
          (L56-73) uses a hardcoded polar ansatz rather than minimizing a 2D circular
          Föppl–von Kármán + localized cell-death delamination free-energy functional, and
          lacks Delta eps/tasA mutant and artificial cell-death score controls.
        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [34, 53], note: "Exact Föppl-von Kármán bilayer wavelength lambda_c, critical strain epsilon_c, and spoke count N_spokes", supports: true}
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [56, 73], note: "Closed-form polar cosine ansatz instead of 2D Föppl-von Kármán + cell-death delamination energy relaxation", supports: false}
      specimen-match:
        value: 35
        rationale: >-
          Although `datasets/bacillus_biofilm_wrinkling/bacillus_biofilm_specimen.jpg` is
          vendored on disk, the v1 script never loads, segments, or extracts macrocolony
          count and radial spoke ridge profiles from the biological specimen image.
        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [76, 94], note: "Evaluates only 7-point agar stiffness table without loading or segmenting bacillus_biofilm_specimen.jpg", supports: false}
          - {file: docs/media/bacillus_biofilm_wrinkling_comparison.png, lines: [0, 0], note: "4-panel v1 plot lacks biofilm specimen segmentation, mutant controls, and thickness scaling", supports: false}
      parameter-expressivity:
        value: 49
        rationale: >-
          Evaluates 7 agar stiffnesses E_s in [0.5, 10.0] kPa (L76-94), but omits the
          6-point biofilm thickness scaling sweep h in [40, 140] um, omits the 5 genetic
          and mechanical-score controls (WT, Delta eps/tasA mutant, FeCl3 cell-death
          suppression, artificial m=6 and m=8 spoke templates), and exposes no CLI
          parameter overrides.
        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [76, 94], note: "Single 7-point agar sweep without biofilm thickness scaling, mutant controls, or CLI overrides", supports: false}
      morphometric-validation:
        value: 52
        rationale: >-
          `measure_morphoeval()` (L152-181) reports only 4 analytic numbers (standard,
          stiff, and soft agar wavelengths plus spoke count) without Pearson r, p-value,
          RMSE, log-log cube-root scaling slope, thickness scaling correlation, mutant
          negative-control amplitude delta, or specimen image radial spoke morphometrics.
        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [152, 181], note: "Only 4 analytic metrics without statistical tests, mutant controls, or specimen segmentation", supports: false}
      source-traceability:
        value: 74
        rationale: >-
          Vendors `datasets/bacillus_biofilm_wrinkling/` with 4 primary DOIs in
          `paper_citations.bib` (`10.1073/pnas.1212429109`, `10.1038/s41567-018-0392-9`,
          `10.1073/pnas.1217178110`, `10.1073/pnas.1102300108`), `scout_manifest.json`,
          and `bacillus_biofilm_wrinkling_reference.json`, but lacks runtime SHA-256
          verification in `2013-asally-bacillus-biofilm-wrinkling.py`.
        evidence:
          - {file: datasets/bacillus_biofilm_wrinkling/bacillus_biofilm_wrinkling_reference.json, lines: [1, 210], note: "Reference JSON with agar stiffness sweep, thickness sweep, and genetic/mechanical controls", supports: true}
      code-traceability:
        value: 68
        rationale: >-
          Links module docstrings to Asally et al. (2012) PNAS, Yan et al. (2019) Nature
          Physics, and the 3 Lean 4 theorems in `Loop_094_bacillus_biofilm_wrinkling.lean`
          (L1-11), but lacks trace links for 2D Föppl–von Kármán energy relaxation,
          localized cell-death delamination, and artificial score-guided spoke selection.
        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [1, 11], note: "Baseline docstring linking Asally (2012), Yan (2019), and Loop_094 Lean theorems", supports: true}
      repro-package:
        value: 63
        rationale: >-
          Provides `--self-test` (`L184-190`) checking agar sweep length and monotonicity,
          but lacks SHA-256 asset verification, two-run bitwise determinism checks on an
          energy minimizer, and mutant/ablation assertions.
        evidence:
          - {file: 2013-asally-bacillus-biofilm-wrinkling.py, lines: [184, 190], note: "Minimal 3-assertion self_test() without SHA-256 or mutant control checks", supports: false}
    remediation:
      - "Replace the closed-form polar ansatz with a 2D circular colony Föppl–von Kármán + localized cell-death delamination L-BFGS-B free-energy minimizer F[w] that relaxes biofilm height w(x,y) into a central concentric ring and outer radial spokes."
      - "Implement both the 7-point agar stiffness sweep E_s in [0.5, 10.0] kPa (verifying cube-root scaling exponent -1/3) and the 6-point biofilm thickness sweep h in [40, 140] um (verifying linear wavelength and inverse spoke scaling)."
      - "Implement Asally et al. (2012) PNAS Figs. 1-4 genetic and mechanical controls: wild-type NCIB 3610, Delta epsA-O / Delta tasA matrix-deficient flat mutant, FeCl3/D-Leu cell-death-suppressed control, and artificial mechanical-score templates guiding custom spoke counts (m = 6, m = 8)."
      - "Segment the vendored CC BY-SA 3.0 Bacillus subtilis macrocolony specimen (`bacillus_biofilm_specimen.jpg`) to extract isolated macrocolonies, focal colony radial spoke count N_spokes, and angular spoke spacing CV, and enforce runtime SHA-256 verification."
