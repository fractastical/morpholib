simulations:
  - id: tero-physarum-transport-network
    name: "Tero et al. (2010) Science & Tero, Kobayashi & Nakagaki (2007) J. Theor. Biol. adaptive Physarum tube conductivity network, shortest-path phase transition, Murray's cube law, and Tokyo rail Pareto trade-off"
    organism: "Physarum polycephalum (acellular plasmodial slime mold)"
    script: 2010-tero-physarum-transport-network.py
    output: docs/media/physarum_transport_network_comparison.png
    extra_outputs:
      - docs/media/physarum_transport_network_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Tero et al. (2010) Science 327:439-442 & Tero, Kobayashi & Nakagaki (2007) J. Theor. Biol. 244:553-564 Hagen-Poiseuille Kirchhoff flow sum_j (D_ij/L_ij)*(p_i - p_j) = S_i coupled to nonlinear shear-stress tube adaptation dD_ij/dt = f(|Q_ij|) - mu*D_ij"
        - "Two-path parallel competition (L_1 < L_2) exhibiting parallel loop coexistence for gamma < 1, critical shortest-path selection at gamma_c = 1, and winner-takes-all Steiner minimum tree convergence for gamma > 1"
        - "Multi-source Kanto / Tokyo rail Pareto trade-off across gamma in [0.8, 2.4] optimizing normalized Total Length (TL_MST ~ 1.75), Transport Efficiency (MD_MST ~ 0.85), and Fault Tolerance (FT ~ 0.84) at gamma = 1.8, plus Murray's cube law (r_0^3 = r_1^3 + r_2^3) at gamma = 4/3"
      reconstructed_in_script:
        - "Full graph Laplacian Kirchhoff pressure solver (`solve_kirchhoff_potentials`) across N_f = 36 Kanto food sources verifying nodal current conservation (error 3.57e-14 < 1e-11) and edge flux antisymmetry (error < 1e-14)"
        - "8-point gamma phase transition sweep in [0.8, 2.4] reproducing Tero et al. (2010) Fig. 3/4 normalized Total Length TL_MST (Pearson r = 0.99885, RMSE = 0.0363, p = 3.83e-9) and Fault Tolerance FT (Pearson r = 0.99745, RMSE = 0.0245, p = 4.12e-8), matching the Tokyo rail network at gamma = 1.8 (TL_MST = 1.7310 vs ref 1.7500, FT = 0.8089 vs ref 0.8400)"
        - "Two-path competition sweep verifying coexistence at gamma = 0.6 (Q1/I0 = 0.7322), shortest-path selection at gamma = 1.0 and 1.8 (Q1/I0 = 1.0000), gamma = 0.0 ablation control (Q1/I0 = 0.6667, delta = +0.3333), and Murray's cube law (r_1^3 + r_2^3)/r_0^3 = 1.0000 (RMSE = 3.88e-9) at gamma = 4/3"
        - "Computer-vision segmentation of `physarum_polycephalum_specimen.jpg` extracting 33 enclosed anastomosing loops (Betti-1 = 33), 3-tier vein-width hierarchy (51.96% primary trunks, 36.44% secondary, 11.59% tertiary), and degree-3 Y-junction Murray cubic ratio 0.8926 +- 0.2774 (N = 17 junctions)"
      transfer_boundary:
        - "2D planar multi-source Kirchhoff Poiseuille network and EDT medial-axis skeletonization mapped to macroscopic Physarum polycephalum plasmodial veins"
      does_not_claim:
        - "3D actomyosin cortex viscoelastic peristaltic calcium wave mechanics at single-filament molecular resolution"
    source_refs:
      - tero2010
      - tero2007
      - nakagaki2000
      - murray1926
      - bonifaci2012
    summary: >-
      Pass 2 (v2) evaluation of `2010-tero-physarum-transport-network.py` (overall
      weighted score: 93.4/100, up from 53.6/100 in v1). The remediated script solves
      the multi-node Hagen-Poiseuille Kirchhoff linear system across N_f = 36 Kanto food
      sources (conservation error 3.57e-14); reproduces the Tero et al. (2010) Science
      Fig. 3/4 phase transition across gamma in [0.8, 2.4] for normalized Total Length
      TL_MST (Pearson r = 0.99885, RMSE = 0.0363, p = 3.83e-9) and Fault Tolerance FT
      (Pearson r = 0.99745, RMSE = 0.0245, p = 4.12e-8), matching the Tokyo rail network
      and biological Physarum at gamma = 1.8; proves and numerically verifies two-path
      shortest-path selection (Q1/I0 = 1.0000 vs 0.6667 in the gamma=0 ablation control)
      and Murray's cube law (r_1^3 + r_2^3)/r_0^3 = 1.0000 at gamma = 4/3; and segments
      the SHA-256-locked Physarum polycephalum specimen (`physarum_polycephalum_specimen.jpg`,
      Betti-1 = 33 closed loops, Y-junction Murray cubic ratio 0.8926 +- 0.2774).
