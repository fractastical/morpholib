    source_refs: [turing1952, murray1981, epperlein1989, frostmason1996, epperlein1988, erickson1993]
    summary: >-
      Same onset law as Pass 1: Schnakenberg (a, b) = (0.10, 0.90), Dv/Du = 9,
      λ_c = 184.3 µm = 0.0001843 m, Holocene age 0 Ma, eight-wavelength periodic
      patch. The nonlinear run now starts from noise (seed 3107) plus a shallow
      domain-scale source gradient, and the dominant shell that emerges is
      n = 8 (184.3 µm). Band-weighted wavelength is 176.47 µm. Continuum versus
      periodic-shell sweep: Pearson r = 0.9996, RMSE = 2.02 µm. Ratio sweep
      9 → 14 moves the fastest wavelength from 187.2 µm to 212.1 µm. Ablation
      Dv = Du keeps max σ = −0.10. Specimen dark fraction 0.380 versus model
      0.314; coherency 0.485 versus 0.904; luminance KS = 0.302; radial-spectrum
      r = 0.910. Computer-vision similarity of the 12-frame 640 px GIF against
      the micrograph is 87.5. The micrograph still has no scale bar.
    claim_boundary:
      reported_in_source:
        - "Turing 1952 dispersion relation and diffusion-driven instability"
        - "Murray 1981 coat pre-pattern and domain-growth scale argument"
        - "Epperlein & Löfberg 1989 larval Ambystoma mexicanum pigment pattern"
        - "Frost-Mason & Mason 1996 review of axolotl pigmentation"
      reconstructed_in_script:
        - "Schnakenberg parameters with Du set so the onset wavelength is 184.3 µm"
        - "Noise-seeded spectral integration and a shallow source gradient of amplitude 0.12"
        - "Periodic-shell quantization of the continuum wavelength, ratio sweep, and Dv = Du ablation"
        - "Quantile segmentation and structure-tensor coherency of the CC BY-SA micrograph"
      transfer_boundary:
        - "184.3 µm is the slot scale coordinate, not a number measured on the photograph"
        - "The source gradient is a reconstruction that keeps the patch from crystallizing; it is not in the constant-coefficient Turing paper"
        - "Adult ocellus size is a longer scale of this same Holocene species, not a successor chronospecies"
      does_not_claim:
        - "That stellate melanophore geometry is generated by the PDE"
        - "A micrometre scale bar on the Wikimedia micrograph"
        - "A second independent assessor"
    scores:
      model-fidelity:
        value: 89
        rationale: >-
          The homogeneous law is unchanged and checked: trace −0.2, det 1,
          ratio 9 above r_c ≈ 8.568, onset wavenumber fixed at 2π/184.3 µm,
          linear fastest mode 187.19 µm. Pass 2 integrates from noise. The
          shell that wins is n = 8, the onset shell, rather than a mode that
          was planted in the initial condition. A shallow source gradient of
          amplitude 0.12 is an extra term, stated as such. The dispersion
          cusp is the discriminant branch point (vertical tangent where
          disc = 0), drawn on a 900-point grid and labeled.
        evidence:
          - {file: models/2026-delphi10000-ambystoma-mexicanum-turing-wavelength-s0.py, lines: [140, 165], note: "continuous real part of σ(k); cusp at disc = 0", supports: true}
          - {file: models/2026-delphi10000-ambystoma-mexicanum-turing-wavelength-s0.py, lines: [234, 289], note: "noise seed, shallow a(x), spectral step", supports: true}
      specimen-match:
        value: 76
        rationale: >-
          Panel B is now a broken spot-and-labyrinth field in the micrograph's
          circular stop, colored with melanophore and xanthophore means taken
          from the photograph, beside the real dendritic chromatophores.
          It is the same kind of image and no longer a perfect crystal.
          Coherency is still 0.904 against 0.485: the render is smoother and
          more locally aligned than stellate cells, and the blue edge of the
          micrograph is not in the model. Not a pixel copy. GIF-to-specimen
          computer-vision similarity on the last frame is 87.5.
        evidence:
          - {file: docs/media/ambystoma_mexicanum_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Pass 2 side-by-side", supports: true}
          - {file: docs/media/ambystoma_mexicanum_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 640 px growth, last frame scored", supports: true}
          - {file: models/2026-delphi10000-ambystoma-mexicanum-turing-wavelength-s0.py, lines: [328, 368], note: "palette and circular display mask", supports: true}
      parameter-expressivity:
        value: 88
        rationale: >-
          Diffusivity scale s moves the fastest wavelength from about 112 µm
          to about 337 µm, and the periodic shell tracks it (figure C).
          Raising Dv/Du from 9 to 14, with the onset wavenumber held fixed,
          moves the fastest wavelength monotonically from 187.2 µm to 212.1 µm.
          Dv = Du remains stable.
        evidence:
          - {file: models/2026-delphi10000-ambystoma-mexicanum-turing-wavelength-s0.py, lines: [172, 219], note: "wavelength_sweep and ratio_sweep", supports: true}
          - {file: docs/media/ambystoma_mexicanum_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "panels C and D", supports: true}
      morphometric-validation:
        value: 87
        rationale: >-
          Continuum versus periodic-shell Pearson r = 0.999595, RMSE = 2.02 µm,
          residual CV = 0.0089. The reference for r is 1, and the measured
          value is not 1. Linear fastest wavelength 187.19 µm versus onset
          184.3 µm. Noise-selected shell 184.3 µm (n = 8). Band-weighted
          wavelength 176.47 µm, which is not the reference. Specimen dark
          fraction 0.380 versus model 0.314. Specimen coherency 0.485 versus
          model 0.904. Luminance KS = 0.302. Radial-spectrum r = 0.910.
          No specimen number is copied onto its reference, and the photo is
          not given a false micrometre scale.
        evidence:
