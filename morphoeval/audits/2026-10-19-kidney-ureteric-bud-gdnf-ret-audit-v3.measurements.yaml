    claim_boundary:
      reported_in_source:
      - 'Menshykau & Iber (2013): a Schnakenberg-type GDNF-RET receptor-ligand reaction-diffusion system on the
        ureteric epithelium has a homogeneous steady state R* = a + b, G* = b/(a + b)^2 and a Turing instability
        whose fastest mode on the ampulla selects elongation, bifurcation or trifurcation as the tip radius grows'
      - 'Watanabe & Costantini (2004): time-lapse of cultured E11.5 kidneys shows predominantly dichotomous (with
        some trichotomous) ampulla splitting and generation-dependent tip counts and branch angles'
      - 'Basson et al. (2005): Spry1-/- kidneys hyper-branch with supernumerary buds; exogenous GDNF beads induce
        ectopic budding'
      - 'Michos et al. (2004), Qiao et al. (1999), Miyazaki et al. (2000): Grem1-/- fails ureteric outgrowth, Fgf7-/-
        reduces ureteric growth and nephron number, Bmp4+/- shows ectopic budding (qualitative)'
      - 'Menshykau et al. (2012), Metzger et al. (2008): branch-mode selection depends on the local geometry of
        the growing tip; successive lung bifurcation planes rotate ~90 deg (orthogonal bifurcation)'
      reconstructed_in_script:
      - Steady state, dispersion relation, lambda_c and (a, b) phase space; 1D Neumann ampulla-cap IMEX solver with
        band-seeded and noise-seeded initial conditions; 1D Lagrangian moving-boundary necking of the dome; linear
        two-lobe axis selection on an anisotropic dome and a dihedral cascade; 2D self-avoiding ureteric tree coupled
        to GDNF sink, BMP, Gremlin1 and FGF7 Gaussian fields with per-tip stromal gain feeding R_tip -> rho_tip
        -> splitting multiplicity; 7 genetic/bead conditions plus no-sink, equal-diffusion and stromal-ablation
        controls; GFP specimen segmentation and tip counting
      transfer_boundary:
      - The 3D phase-field/ALE item is closed only as a 1D moving boundary on the dome plus a linear axis-selection
        argument; no surface tension, curvature, re-meshing or E13.5-E16.5 calyx stage; the 90 deg dihedral follows
        from an explicit daughter-orientation assumption (daughter_long_axis_parallel=True), not from the dynamics
      - Stromal constants k_B = 3.0, k_G = 4.0, k_F7 = 0.8, BMP baseline 0.5 and the Gaussian field amplitudes/widths
        are model-scale calibrations, not measured rate constants; BMP4 and BMP7 share a single field; ligand fields
        are quasi-static per generation
      - The band-seeded mode staircase [1, 2, 3, 4] is conditioned on its own cosine initial condition; the noise-seeded
        honesty control gives [2, 3, 5, 5]
      does_not_claim:
      - Quantitative reproduction of Grem1-/-, Fgf7-/- or Bmp4+/- tip counts (the reference ratios 0.08/0.70/1.20
        are qualitative encodings); 3D ampulla shape; derivation of bifurcation angles from the PDE (half-angles
        are prescribed per generation); a kidney-specific dihedral distribution; verification offline of the 5 new
        DOIs
