simulations:
  - id: delphi10000-ceratopteris-richardii-turing-wavelength-s0
    name: "Ceratopteris richardii Schnakenberg wavelength at 256 µm (Holocene, 0 Ma)"
    organism: "Ceratopteris richardii"
    script: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py
    output: docs/media/ceratopteris_richardii_turing_wavelength_s0_comparison.png
    status: evaluated
    source_refs: [turing1952, schnakenberg1979, gierer1972, geng2022, bartz2018, hickok1995]
    summary: >-
      Pass 1. Analytical lambda_c = 256 µm at D_u = 8, D_v = 96 (ratio 12),
      gamma = 0.012738 s^-1. Dispersion Pearson r = 1.0 against matrix eigenvalues.
      The integrated field is seeded on the critical mode and its Fourier peak is 256 µm.
      The 12-frame GIF is that stripe field (800x600). Computer-vision similarity to the
      canonical plate is 65.9, short of the image-fitness gate. Plate Otsu foreground
      fraction is 0.742 against a 0.5 prior. Sweep, ablation, voucher segmentation and
      terminal-plate lock are implemented but not exercised (REMEDIATION_PASS = 1).
    claim_boundary:
      reported_in_source:
        - "Turing 1952 and Schnakenberg 1979 select a finite critical wavenumber when the inhibitor out-diffuses the activator."
        - "Geng, Yan and Zhou 2022 and Bartz and Gola 2018 describe the Ceratopteris notch meristem and archegonium positions. They do not publish a 256 µm pigment wavelength."
      reconstructed_in_script:
        - "gamma is solved so k_c = 2*pi/256 µm on a 768 µm periodic window at age 0 Ma."
        - "The rendered activator is initialized on that critical mode plus seed-3143 noise."
      transfer_boundary:
        - "Applying Schnakenberg kinetics to the gallery primordium plate is a scale assignment, not a measurement from the fern papers."
      does_not_claim:
        - "That Ceratopteris pigment was shown experimentally to obey these rate constants."
        - "That a fossil chronospecies at 512 µm was measured. The series has one node, Holocene 0 Ma."
        - "That the Pass-1 GIF matches the plate. CV similarity is 65.9."
    scores:
      model-fidelity:
        value: 88
        rationale: "Schnakenberg steady state, Jacobian, and k_c formula are implemented and gamma is solved for 256 µm. The field is seeded on the critical mode rather than grown from unstructured noise, so spontaneous mode selection is not what the figure shows."
        evidence:
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [63, 89], note: "steady state, Jacobian, gamma_for_wavelength", supports: true}
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [166, 189], note: "critical-mode initial condition and explicit integration", supports: true}
      specimen-match:
        value: 62
        rationale: "The comparison figure places the canonical plate beside green stripes. The GIF never becomes the plate. CV similarity of the last frame to the gallery plate is 65.9."
        evidence:
          - {file: docs/media/ceratopteris_richardii_turing_wavelength_s0_comparison.png, lines: [0, 0], note: "Pass-1 four-panel figure; sweep panel is a placeholder", supports: true}
          - {file: docs/media/ceratopteris_richardii_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12 frames, 800x600, stripe field throughout", supports: true}
      parameter-expressivity:
        value: 74
        rationale: "self_test checks that lambda falls as gamma rises, and that equal diffusion is stable. Those sweeps are not in the rendered figure or the Pass-1 measurement list because REMEDIATION_PASS is 1."
        evidence:
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [209, 224], note: "wavelength_sweep and ablation_sigma defined", supports: true}
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [571, 594], note: "self_test asserts monotonic sweep and ablation", supports: true}
      morphometric-validation:
        value: 76
        rationale: "Dispersion Pearson r is 1.0 against a null of 0. Plate foreground fraction 0.742 and coherency 0.231 are measured, not copied from the reference priors. KS, RMSE, and the gametophyte voucher are not yet in the measurement list."
        evidence:
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [151, 158], note: "dispersion_pearson", supports: true}
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [263, 285], note: "segment_plate Otsu and coherency", supports: true}
      source-traceability:
        value: 90
        rationale: "Crossref-checked DOIs for Turing, Schnakenberg, Gierer-Meinhardt, Geng 2022, Bartz 2018 and Hickok 1995. Plate SHA-256 and the CC BY-SA voucher URL are in the reference JSON."
        evidence:
          - {file: datasets/ceratopteris_richardii_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "Turing, Gierer, Schnakenberg entries", supports: true}
          - {file: datasets/ceratopteris_richardii_turing_wavelength_s0/ceratopteris_richardii_turing_wavelength_s0_reference.json, lines: [1, 40], note: "scale 256 µm, age 0 Ma, specimen digests", supports: true}
      code-traceability:
        value: 86
        rationale: "Module docstring and function docstrings name the Schnakenberg terms and the 256 µm constraint. Lean theorems pin the same integers (256, ratio 12, window 768)."
        evidence:
          - {file: models/2026-delphi10000-ceratopteris-richardii-turing-wavelength-s0.py, lines: [1, 28], note: "scale, age, and equation statement", supports: true}
          - {file: morphoeval/lean/loops/Loop_3143_ceratopteris_richardii_turing_wavelength_s0.lean, lines: [28, 46], note: "five theorems, no sorry", supports: true}
