simulations:
  - id: sumper-diatom-frustule-phase-sep
    name: "Sumper (2002) & Lenoci-Camp (2008) hierarchical Cahn-Hilliard diatom biosilica phase separation"
    organism: "Coscinodiscus wailesii (Centric marine diatom frustule valve pores)"
    script: 2002-sumper-diatom-frustule-phase-sep.py
    output: docs/media/diatom_frustule_phase_sep_comparison.png
    extra_outputs:
      - docs/media/diatom_frustule_phase_sep_growth.gif
    status: evaluated
    source_refs:
      - sumper2002
      - lenoci2008
      - losic2006
      - cahnhilliard1958
    summary: >-
      Pass 1 (v1) baseline evaluation of `2002-sumper-diatom-frustule-phase-sep.py`
      (consensus score 51.6/100). The v1 script integrates the fourth-order Cahn-Hilliard
      PDE d(phi)/dt = M*laplacian(phi^3 - phi - eps^2*laplacian(phi)) via semi-implicit
      Fourier spectral stepping for off-critical droplet (phi0=-0.30) and critical
      bicontinuous (phi0=0.00) regimes, but omits two-stage hierarchical quenching
      (foramen -> cribrum -> cribrella), linear spinodal dispersion sigma(k), outside-spinodal
      negative controls, parameter sweeps across interfacial length epsilon, and computer-vision
      segmentation of the *Coscinodiscus wailesii* SEM specimen micrograph.
    scores:
      model-fidelity:
        value: 58
        rationale: >-
          Integrates the 2D periodic Cahn-Hilliard equation with exact zero-mode Fourier
          mass conservation (L27-57), separating off-critical droplet (phi0=-0.30) and
          critical bicontinuous (phi0=0.00) morphologies. However, v1 simulates only a
          single-scale quench without Lenoci & Camp's (2008) two-stage hierarchical
          solidification inside primary pores, omits the analytical spinodal dispersion
          relation sigma(k) = M*k^2*(1 - 3*phi0^2 - eps^2*k^2), and includes no negative
          control outside the spinodal boundary (|phi0| > 1/sqrt(3)).
        evidence:
          - {file: 2002-sumper-diatom-frustule-phase-sep.py, lines: [27, 57], note: "Single-stage 2D spectral Cahn-Hilliard solver without two-stage hierarchical cribrum quench or spinodal dispersion", supports: false}
      specimen-match:
        value: 22
        rationale: >-
          Renders only a 2-panel synthetic comparison (`diatom_frustule_phase_sep_comparison.png`)
          without loading, SHA-256-verifying, or segmenting the vendored *Coscinodiscus wailesii*
          SEM micrograph (`datasets/diatom_frustule_phase_sep/coscinodiscus_diatom_specimen.jpg`).
        evidence:
          - {file: 2002-sumper-diatom-frustule-phase-sep.py, lines: [85, 110], note: "2-panel synthetic figure with zero biological specimen segmentation", supports: false}
          - {file: docs/media/diatom_frustule_phase_sep_comparison.png, lines: [0, 0], note: "Pass 1 2-panel synthetic plot lacking Coscinodiscus SEM comparison", supports: false}
      parameter-expressivity:
        value: 44
        rationale: >-
          Hardcodes only 2 parameter points (phi0=-0.30 and phi0=0.00 at eps=1.50, L87-88)
          with no CLI overrides for phi0, epsilon, M, N, or steps, and no parameter sweep
          across interfacial length epsilon or mean composition phi0.
        evidence:
          - {file: 2002-sumper-diatom-frustule-phase-sep.py, lines: [87, 89], note: "Hardcoded 2-regime call without parameter sweep or CLI overrides", supports: false}
      morphometric-validation:
        value: 48
        rationale: >-
          Computes integer-binned 2D radial PSD peak `k_bin` and connected-component pore
          count (L60-82), yielding discrete quantization error (lambda* = 19.2 px at k_bin=5
          vs analytical 15.60 px), and omits sub-bin parabolic interpolation, 6-fold hexatic
          bond-orientational order |psi_6|, and empirical SEM pore diameter/pitch comparison.
        evidence:
          - {file: 2002-sumper-diatom-frustule-phase-sep.py, lines: [60, 82], note: "Integer-binned radial PSD peak without sub-bin interpolation or hexatic |psi_6|", supports: false}
      source-traceability:
        value: 62
        rationale: >-
          Reference dataset `datasets/diatom_frustule_phase_sep/diatom_frustule_phase_sep_reference.json`
          and specimen image exist on disk, but the v1 script does not load or verify their
          SHA-256 digests at runtime.
        evidence:
          - {file: 2002-sumper-diatom-frustule-phase-sep.py, lines: [1, 25], note: "No runtime loading or SHA-256 verification of datasets/diatom_frustule_phase_sep/", supports: false}
      code-traceability:
        value: 60
        rationale: >-
          Basic module docstring cites Sumper (2002) and Lenoci & Camp (2008), but functions
          lack explicit equation mappings and references to the Lean 4 theorems in
          `morphoeval/lean/loops/Loop_071_diatom_frustule_phase_sep.lean`.
        evidence:
          - {file: 2002-sumper-diatom-frustule-phase-sep.py, lines: [27, 82], note: "Functions lack explicit paper section/equation and Lean 4 theorem cross-references", supports: false}
      repro-package:
        value: 67
        rationale: >-
          Deterministic RNG (`seed=2002`) and `--self-test` flag are present (L175-192),
          but `--self-test` checks only basic mass conservation and `std > 0.2` without
          testing spinodal dispersion, negative controls, JSON parity, or bitwise two-run
          determinism.
        evidence:
          - {file: 2002-sumper-diatom-frustule-phase-sep.py, lines: [175, 183], note: "Minimal 2-assertion self_test() without determinism or JSON parity checks", supports: false}
    remediation:
      - "Implement Lenoci & Camp (2008) two-stage quenched hierarchical Cahn-Hilliard phase separation (primary foramen walls at eps_1=1.50 followed by secondary cribrum pore quench at eps_2=0.65 inside unsolidified primary pores) plus Sumper (2002) 3-tier scaling (foramen -> cribrum -> cribrella)."
      - "Implement the exact linear spinodal dispersion relation sigma(k) = M*k^2*(1 - 3*phi0^2 - eps^2*k^2), critical wavenumber k_c, and an outside-spinodal negative control (phi0 = -0.65, |phi0| > 1/sqrt(3)) proving homogeneous stability."
      - "Load and SHA-256-verify `datasets/diatom_frustule_phase_sep/diatom_frustule_phase_sep_reference.json` and `coscinodiscus_diatom_specimen.jpg` at runtime, and segment both the primary hexagonal foramen lattice (139 pores, pitch, diameter-to-pitch ratio, hexatic |psi_6|) and secondary cribrum pores (74 pores) from the real *Coscinodiscus wailesii* SEM micrograph."
      - "Upgrade spectral morphometrics to sub-bin parabolic wavenumber interpolation, run a 5-point interfacial-scale parameter sweep across epsilon in {0.75, 1.00, 1.25, 1.50, 1.75}, expose full CLI flags, and render a comprehensive multi-panel synthesis figure and animated hierarchical growth GIF."
