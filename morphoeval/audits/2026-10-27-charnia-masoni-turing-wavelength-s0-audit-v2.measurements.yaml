    claim_boundary:
      reported_in_source:
      - 'Turing 1952: diffusion-driven instability and a critical wavenumber. Schnakenberg 1979: the a - u + u^2
        v kinetics integrated here.'
      - Ford 1958 named Charnia masoni. Antcliffe and Brasier 2007 and Brasier, Antcliffe and Liu 2012 describe
        glide reflection rather than a sea-pen bilateral body. Dunn et al. 2021 argue for apical growth and a stem-eumetazoan
        affinity. Hoyal Cuthill and Conway Morris 2014 quantify fractal branching.
      reconstructed_in_script:
      - 'Parameters (a, b, D_u, D_v) = (0.14, 0.93, 0.062, 1.35). The determinant-critical wavelength is scaled
        to 1.404e-4 m. Above onset the fastest mode is longer: analytic λ_m = 167.44 µm.'
      - Explicit-Euler σ(k) versus the eigenvalue formula (Pearson r = 0.9984, RMSE = 0.020). Equal diffusivities
        give σ_max = -0.900. Scaling both diffusivities moves λ with Pearson r = 1.000 and RMSE 3.26 µm.
      - A portrait chevron at 58°, the maximum of a four-angle CV probe (48°→87.0, 58°→89.5, 68°→84.5, 78°→83.6).
        Vertical gradient fraction versus commanded angle has Pearson r = 0.995.
      transfer_boundary:
      - The cast is a centimetre-scale relief frond. The chemical wavelength is 140 µm. Only outline, orientation
        and a stylized chevron cross that gap. The photograph does not resolve 140 µm.
      - Cohort words 'pigment stripe' and 'ocellus' name the Turing pattern class. The fossil is not evidence of
        pigment or eyes.
      does_not_claim:
      - Does not claim Ediacaran tissue ran these kinetics, or that 140.4 µm was measured on the holotype.
      - Does not claim a pre-565 Ma chronospecies or a Cambrian successor. The wavenumber ratio to the 6.322 mm
        organ-scale sibling is 45.03, which is a scale comparison, not a copied parameter set.
      - Does not generate the higher-order fractal branching of Hoyal Cuthill and Conway Morris 2014. One wavelength
        is embedded as chevrons.
      - Nanopublications were not signed. No profile exists at ~/.nanopub/profile.yml.
