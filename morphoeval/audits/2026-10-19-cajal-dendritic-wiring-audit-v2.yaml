simulations:
  - id: caleo-cajal-dendritic-wiring
    name: "Cuntz et al. (2010) PLoS Comput. Biol. & Cuntz et al. (2007) PNAS Ramón y Cajal minimum-wiring and conduction-delay greedy Steiner dendritic trees + Rall's 3/2 diameter power law"
    organism: "Drosophila melanogaster (Class I-IV da sensory neurons), Homo sapiens & Mus musculus (cerebellar Purkinje cells and cortical pyramidal cells)"
    script: 2007-caleo-cajal-dendritic-wiring.py
    output: docs/media/cajal_dendritic_wiring_comparison.png
    extra_outputs:
      - docs/media/cajal_dendritic_wiring_growth.gif
    status: evaluated
    claim_boundary:
      reported_in_source:
        - "Cuntz, Forstner, Borst & Häusser (2010) PLoS Comput. Biol. 6(8):e1000877 & Cuntz et al. (2007) PNAS 104:13319-13324 greedy Minimum Spanning Tree dendritic growth rule minimizing C(u, v) = ||u - v|| + bf * path(u, root) across balancing factor bf in [0, 1] to balance Ramón y Cajal's (1899) conservation of cytoplasmic wiring length W and conduction time P"
        - "Wen & Chklovskii (2008) J. Neurophysiol. 99:2320-2328 & Cuntz et al. (2010) dimensional wiring scaling laws W propto N^(1/2) A^(1/2) in 2D planar arbors (Purkinje / Drosophila Class IV da) and W propto N^(2/3) V^(1/3) in 3D volumetric arbors (cortical pyramidal)"
        - "Rall (1959) Exp. Neurol. 1:491-527 electrotonic input-conductance impedance-matching power law d_parent^(3/2) = sum_k d_daughter_k^(3/2) with symmetric parent-to-daughter diameter ratio d_p / d_d = 2^(2/3) = 1.5874"
      reconstructed_in_script:
        - "Full Cuntz et al. (2010) greedy MST solver (`grow_cuntz_dendritic_tree`) across 8 balancing factors bf in [0.0, 1.0] on N = 160 synaptic carriers, reproducing normalized wiring cost W(bf)/W(0) (Pearson r = 1.0000, RMSE = 0.0042, p = 1.81e-19) and normalized conduction path P(bf)/P(1) (Pearson r = 0.99969, RMSE = 0.0067, p = 7.18e-11), plus a random spanning tree negative control (10.43x wiring inflation)"
        - "Log-log OLS scaling law verification across N in [25, 320] confirming 2D planar scaling exponent alpha_2D = 0.4797 +- 0.0168 (vs theoretical 0.5000, r = 0.99755, p = 8.96e-6), 3D volumetric scaling exponent alpha_3D = 0.6495 +- 0.0456 (vs theoretical 0.6667, r = 0.99028, p = 1.41e-4), and bf = 1.0 star limit exponent alpha_star = 0.9996"
        - "Bottom-up Rall 3/2 electrotonic diameter assignment verifying (sum d_daughter^(3/2))/d_parent^(3/2) = 1.0000 (RMSE = 1.27e-16 across 40 bifurcations)"
        - "Computer-vision segmentation of Santiago Ramón y Cajal's (1899) human cerebellar Purkinje neuron drawing (`cajal_purkinje_dendritic_arbor_specimen.jpg`, Museo Cajal 328 Madrid) extracting box-counting fractal dimension D_f = 1.7817 +- 0.0248, peak Sholl intersection count = 73 at r = 420.0 px (r/R_max = 0.6176), and 62 primary/secondary bifurcation hubs"
      transfer_boundary:
        - "2D planar fan and 3D cubic Euclidean carrier-point greedy MST arbors with Rall 3/2 passive electrotonic diameter tapering mapped to Cajal's Golgi-stained Purkinje neuron drawing"
      does_not_claim:
        - "Active voltage-gated Ca2+ / Na+ dendritic spike kinetics or activity-dependent filopodial synaptotropic retraction at single-channel resolution"
    source_refs:
      - cuntz2010
      - cuntz2007
      - cuntz2008
      - rall1959
      - wen2008
      - cajal1899
    summary: >-
      Pass 2 (v2) evaluation of `2007-caleo-cajal-dendritic-wiring.py` (overall weighted
      score: 93.8/100, up from 54.1/100 in v1). The remediated script implements the full
      Cuntz et al. (2010) PLoS Comput. Biol. greedy MST algorithm across balancing factor
      bf in [0.0, 1.0], matching the Cajal wiring-vs-conduction-delay Pareto trade-off
      for W(bf)/W(0) (Pearson r = 1.0000, RMSE = 0.0042, p = 1.81e-19) and P(bf)/P(1)
      (Pearson r = 0.99969, RMSE = 0.0067, p = 7.18e-11) while outperforming a random
      spanning tree ablation control by 10.43x; verifies the Wen & Chklovskii (2008) 2D
      planar (alpha_2D = 0.4797 +- 0.0168 vs 0.50) and 3D volumetric (alpha_3D = 0.6495 +-
      0.0456 vs 0.67) scaling laws and Rall's (1959) 3/2 electrotonic impedance-matching
      law (ratio = 1.0000, RMSE = 1.27e-16); and segments Santiago Ramón y Cajal's (1899)
      human cerebellar Purkinje neuron specimen (`cajal_purkinje_dendritic_arbor_specimen.jpg`,
      fractal dimension D_f = 1.7817 +- 0.0248, Sholl peak = 73 intersections, 62 bifurcation hubs).
