    claim_boundary:
      reported_in_source:
      - 'Turing 1952: two-species reaction-diffusion selects a critical wavenumber when the inhibitor out-diffuses
        the activator.'
      - 'Nakamasu et al. 2009: zebrafish melanophores and xanthophores are a short-range activation / long-range
        inhibition pair.'
      - 'Hiscock & Megason 2015: anisotropy orients stripes by removing one axis from the unstable band.'
      - 'Quigley et al. 2004 and Patterson et al. 2014: D. nigrofasciatus is broken-striped or spotted relative
        to D. rerio.'
      reconstructed_in_script:
      - Anisotropic Schnakenberg integration on a 288.96 × 144.48 µm window with Dv_y/Dv_x = 3.85 for D. rerio and
        1.12 for the predecessor.
      - Growth-rate comparison on exact y-DFT modes, anisotropy sweep, equal-diffusion ablation, and three noise
        seeds.
      - Specimen mask segmentation and a bimodal pigment composite of the simulated field.
      transfer_boundary:
      - The 144.48 µm cellular window is magnified onto the adult outline. Adult stripes are not 24.08 µm wide.
      - gamma is calibrated so the dispersion peak lies on the assigned scale.
      does_not_claim:
      - That the gray-brown composite reproduces iridophore iridescence or the eye.
      - That the predecessor was measured at 24.08 µm; the contrast is the anisotropy mechanism at this assigned
        scale.
      - A cryptographic nanopublication signature.
