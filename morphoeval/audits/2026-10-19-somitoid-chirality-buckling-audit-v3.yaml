# MorphoEval audit — Yamanaka et al. (2023), Miao et al. (2023) & Adhyapok et al. (2021) Epithelial Somite Rosette Mechanics, 2026-10-20 (v3)
#
# Pass 3 re-score of `2021-yaman-somitoid-chirality-buckling.py` (Slot 029) after the remediation of both open
# v2 findings in the instrumented loop `morphoeval/runs/2026-10-19-somitoid-chirality-buckling-loop-pass3`,
# superseding `2026-10-19-somitoid-chirality-buckling-audit-v2` (91.7).
#
# What Pass 3 changed (both v2 remediation items):
#   1. v2 item 1 ("3D apical-basal polyhedral scutoid shell / 3D somitecoel lumen pressurization") -> Section 2b
#      (L415-714): a closed 3D shell of N_3D = 96 radial frustum cells on a spherical-Voronoi tessellation of
#      Fibonacci-sphere seeds (48 hex / 30 pent / 18 hept, 282 lateral faces), per-cell volume elasticity,
#      apical/basal/lateral face tensions and an explicit -P V_lumen pressure term, relaxed over 2 N_3D radii
#      (L535-628) and matched to the closed-form Law 4 radial balance (L478-533; |discrete - analytic| < 1e-3),
#      a pressure sweep with saddle-node rupture pressure P_crit (L630-685) and an honest scutoid audit that
#      reports 0 scutoids by construction (L687-714). REDUCED: cells have no tangential DOF, so scutoids / T1s
#      cannot form; this is disclosed in the code, the dataset README and below, and carried to Pass 4.
#   2. v2 item 2 ("couple MESP2/RIPPLY2 wavefront arrest from a live HES7 delayed oscillator into EphA4/ephrinB2
#      and RhoA/ROCK line tensions") -> Section 3b (L824-1121): Lewis (2003) two-variable transcriptional-delay
#      HES7 oscillator time-scaled to the ~5 h human period (Diaz-Cuadros 2020 / Matsuda 2020; L831-910), run in
#      every PSM cell; Cooke-Zeeman wavefront arrest (L912-978); MESP2 gated by the frozen HES7 phase, RIPPLY2
#      boundary fixation, ephrinB2-|EphA4+ boundary rule (L978-987); exponential gamma_ap(x,t) and gamma_het,k(t)
#      ramps (L989-1002) fed live into the 2D vertex solver, the 3D shell law and the cleft model as a
#      stage-resolved S0 -> S-III maturation series (L1065-1112). REDUCED: synchronous clock (no kinematic
#      waves), one-way coupling, hand-chosen v / tau_ROCK / tau_Eph / tau_RIPPLY2.
#   Plus: reference JSON SHA-256 pinned (L145, L180-186), 5 new DOIs, 2 new Lean 4 theorems (5 total, 0 sorrys),
#   10 measurements (L1316-1394 new, L1396-1447 retained), 9-panel PNG + new clock-coupling PNG + live-coupled 3-panel GIF, self-test with
#   6 check groups; PNG/GIF/clock PNG re-render byte-identically (SHA-256 8d411247..., 5d678180..., dc46f670...).
#
# Scores below: overall 89.7, DOWN from 91.7. The remediation widened the model but exposed defects that v2 had
# scored past: 3 of the 5 new measurements reference model-internal values and the HES7-period measurement
# validates its own calibration; the 3D law with the 2D-fitted tensions gives rho_3D = 0.323, not 0.305; the
# vendored specimen rosette_metrics disagree with the script's own segmentation (v2 quoted the JSON's CV 0.2010
# while the script measures 0.2391); and the MESP2/RIPPLY2 logic is a threshold rule set rather than a gene
# network. Scores are uncalibrated criterion-referenced ratings on 0-100 (not probabilities). Line numbers refer
# to the files at the Pass 3 working tree on top of commit d58a084 (uncommitted at audit time, file isolation).

