        value: 90
        rationale: >-
          The 2D vertex energy and its polygon/continuum equilibrium laws (L200-379), the Eph/ephrin cleft barrier
          (L722-748) and the Y-27632 collapse are unchanged and faithful. Pass 3 adds a genuine 3D polyhedral shell
          energy with volume elasticity, three face-tension classes and a -P V_lumen term (L535-628) whose radial
          balance is derived (L478-533) and reproduced numerically to 1e-4, and a Lewis (2003) delayed oscillator
          with his published her1 kernel (a=4.5, b=c=0.23, k=33, p0=40, T_m=12, T_p=2.8 min) uniformly time-scaled
          (L831-883), the Cooke-Zeeman arrest law and an ephrinB2-|EphA4+ boundary rule consistent with Adhyapok
          (2021). Deductions: the shell cells are radial frusta with 2 DOF on a fixed Voronoi tessellation (L564-581, lateral faces L570-572),
          so the "polyhedral scutoid shell" cannot form scutoids or T1s and the audit at L687-714 reports 0 by
          construction (-4); the clock is synchronous (one DDE state copied to 64 cells, L950-971) so kinematic HES7
          waves, Notch coupling and the posterior-anterior period gradient of axioloids are absent (-3); MESP2 /
          RIPPLY2 are a median-threshold and fixed-delay rule set (L975-987), not the TBX6/MESP2/RIPPLY2 network,
          and the tension "coupling" is an imposed exponential ramp of time-since-arrest (L989-1002), one-way (-3);
          the 3D shell is run with the 2D-fitted tensions and lands at rho_3D = 0.323 rather than 0.305 with no
          re-fit (-2); credited +2 for the five machine-checked Lean theorems covering every law.
