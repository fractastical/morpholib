    remediation:
      - >-
        2021-yaman-somitoid-chirality-buckling.py:950-971 — the HES7 oscillator is one DDE state copied to all 64
        PSM cells (synchronous Cooke-Zeeman clock), so the kinematic HES7 waves of axioloids (Yamanaka 2023 Fig. 1;
        Diaz-Cuadros 2020) are absent and the arrested phase depends only on x/v. Add a posterior-anterior period
        gradient (FGF-dependent delay or degradation rate) so waves travel and arrest at wave arrival, and compare
        the wave number per PSM length to the papers' kymographs.
      - >-
        2021-yaman-somitoid-chirality-buckling.py:153-159 and 989-1002 — v = 20 um/h, tau_ROCK = 3 h, tau_Eph = 1.5 h
        and tau_RIPPLY2 = 1 h are hand-chosen and the gamma_ap / gamma_het "coupling" is an imposed exponential of
        time-since-arrest with no feedback. Digitise MET timing (pMLC2 / ZO-1 / F-actin apical enrichment vs somite
        stage) from Yamanaka 2023 Fig. 3 / Extended Data and Miao 2023 Fig. 4, fit tau_ROCK and v, and sweep them.
      - >-
        2021-yaman-somitoid-chirality-buckling.py:535-628 and 687-714 — shell cells are radial frusta with 2 DOF on
        a fixed Voronoi tessellation; scutoids / T1 transitions are impossible, so the "0 scutoids" result is a
        construction. Free the apical and basal Voronoi vertex positions independently (true 3D vertex model) or add
        anisotropic (tubular) curvature so Gomez-Galvez (2018) scutoid formation can be tested rather than assumed.
      - >-
        2021-yaman-somitoid-chirality-buckling.py:1349, 1389 and 1384-1393 — the 3D WT shell gives rho_3D = 0.323
        against the single empirical anchor 0.305 (6% high) with the 2D-fitted tensions and no re-fit, and the
        S0 -> S-III maturation series has no digitised stage data to compare against. Re-fit gamma_ap / gamma_bas for
        the 3D law (or report the fitted values alongside the 2D ones) and digitise stage-resolved somitocoel /
        somite radii from Yamanaka 2023 Figs. 2-3 or Miao 2023 Fig. 4.
      - >-
        2021-yaman-somitoid-chirality-buckling.py:1359-1383 — three of the five Pass 3 measurements reference
        model-internal values (Laplace bound, v T, calibration target) and the HES7-period measurement validates its
        own calibration. Replace at least two with external references (e.g. digitised somitoid segment length from
        Miao 2023 / Sanaki-Matsumiya 2022; HES7 period from a non-calibrated prediction such as the Lewis period
        formula) or label them `derived_from: model-internal` in the measurement schema.
      - >-
