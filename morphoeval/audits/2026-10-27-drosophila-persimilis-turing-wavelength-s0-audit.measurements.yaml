    claim_boundary:
      reported_in_source:
      - 'Noor et al. 2001: chromosomal inversions contribute to reproductive isolation between D. pseudoobscura
        and D. persimilis.'
      - 'Dobzhansky & Spassky 1959: D. paulistorum is a cluster of incipient species.'
      - 'Kambysellis et al. 1995: Hawaiian Drosophila, including the picture-wing radiation that contains D. planitibia,
        diversified by ecological shifts.'
      - 'Turing 1952 and Schnakenberg 1979: a diffusion-driven instability selects a finite critical wavenumber.'
      - 'Ready, Hanson & Benzer 1976: the Drosophila retina is a neurocrystalline lattice, which is the motive for
        a roughly 2 µm period.'
      reconstructed_in_script:
      - Schnakenberg Jacobian, onset wavenumber k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v), and λ = 2π/k_c tuned
        to 2.098 µm at diffusion ratio 20.
      - Allometric map λ = 2.098 µm * (L/2.82 mm)^0.42 using catalog body lengths 2.36, 2.82 and 5.30 mm.
      - Equal-diffusion ablation, five-point Du sweep, five-seed SD, N=64 vs N=96 convergence, and β-endpoint integrations.
      transfer_boundary:
      - 2.098 µm is the assigned tier-3 detail wavelength for this slot, not a measurement printed in Noor et al.
        2001.
      - β = 0.42 is a scale-transfer exponent for subcellular diffusion length, not a regression on pigment periods
        of these three species.
      does_not_claim:
      - Does not claim the species-gallery spiral is a micrograph of 2.1 µm pigment granules.
      - Does not claim broadband noise selects k_c inside 1200 steps.
      - Does not claim the 117 µm primordium slot (2891) parameters.
