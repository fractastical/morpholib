    phenomenon_size_m: 4.315e-05
    scale_tier: 4_cellular_10um
    geological_age_ma: 0.0
    geological_period: Holocene Post-Glacial Lake (Extant)
    fossil_lineage_group: Gasterosteus Pelvic Reduction Chronospecies
    source_refs: [turing1952, schnakenberg1979, kondo1995, nakamasu2009, colosimo2005, miller2007, chan2010, greenwood2011]
    summary: >-
      Pass 1 reproduction of Schnakenberg kinetics on a 32^2 dermal patch whose
      grid spacing makes the linear critical wavelength 43.15 µm (4.315e-05 m)
      at 0 Ma. The marine predecessor's organ-scale bar is 2.4 mm at 0.015 Ma;
      the benthic organ-scale sibling is 2.2 mm. This slot does not reuse those
      parameters. Self-test reported Pearson r = 0.9846, RMSE = 5.97 gray levels,
      KS D = 0.175, nonlinear crest-to-trough 20.24 µm against λ_c/2 = 21.575 µm.
    claim_boundary:
      reported_in_source:
        - "Low-plate Eda alleles and Pitx1 pelvic-enhancer deletion distinguish post-glacial benthic sticklebacks from the complete-plate marine ancestor (Colosimo 2005; Chan 2010)."
        - "Juvenile pigment patterns in threespine sticklebacks are genetically divergent (Greenwood et al. 2011); Kit ligand dosage changes pigmentation (Miller et al. 2007)."
        - "Turing 1952 and Schnakenberg 1979 define k_c. Kondo and Asai 1995 and Nakamasu et al. 2009 show activator-inhibitor chromatophore patterns in other teleosts."
      reconstructed_in_script:
        - "Schnakenberg integration with a=0.1, b=0.9, gamma=0.3, Du=0.55, Dv=12, seed 3234, and dx chosen so linear λ_c = 43.15 µm."
        - "Azimuthal luminance of the canonical detail plate fit by c0 + c1 U(r) + c2 V(r)."
      transfer_boundary:
        - "Zebrafish and angelfish rate constants are not benthic-stickleback measurements."
        - "43 µm is the catalog detail-tier assignment, not a published melanophore count on G. aculeatus."
      does_not_claim:
        - "Does not claim the Commons lateral photograph (Ron Offermans, CC BY-SA 3.0) is a benthic low-plate fish."
        - "Does not claim the gallery detail plate is a raw 43 µm lattice micrograph."
        - "Does not claim the 2.2 mm organ-scale benthic model."
    scores:
      model-fidelity:
        value: 80
        rationale: "The script integrates the Schnakenberg PDE and the four Turing inequalities, and it sets dx so λ_c = 43.15 µm. The chromatophore rates are transferred from other teleosts, and the optical readout uses three fitted gains, so this is not an ab initio stickleback Jacobian."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-benthic-turing-wavelength-s0.py, lines: [114, 147], note: "Jacobian, trace, det, h, discriminant, k_c", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-benthic-turing-wavelength-s0.py, lines: [156, 175], note: "Explicit Schnakenberg step", supports: true}
      specimen-match:
        value: 82
        rationale: "The steady GIF frame scores 92.9 against the canonical detail plate. Pass 1 keeps this dimension at 82 because that plate is a single-focus gallery field with a 100 µm bar, not a counted benthic melanophore lattice, and the Commons lateral photograph is a whole-animal voucher rather than the 43 µm target."
        evidence:
          - {file: docs/media/gasterosteus_aculeatus_benthic_turing_wavelength_s0_growth.gif, lines: [0, 0], note: "12-frame 800x600 growth GIF", supports: true}
          - {file: datasets/gasterosteus_aculeatus_benthic_turing_wavelength_s0/gasterosteus_aculeatus_benthic_turing_wavelength_s0_specimen.jpg, lines: [0, 0], note: "Detail plate, SHA-256 pinned", supports: true}
      parameter-expressivity:
        value: 84
        rationale: "At fixed reference dx, λ_c increases strictly with activator diffusivity Du in {0.25, 0.40, 0.55, 0.80, 1.10}. Equal diffusion (Du = Dv) is not Turing-unstable and has a smaller activator amplitude."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-benthic-turing-wavelength-s0.py, lines: [297, 330], note: "Du sweep and equal-diffusion control", supports: true}
      morphometric-validation:
        value: 80
        rationale: "Azimuthal Pearson r = 0.9846 against the plate, RMSE = 5.97, KS D = 0.175. Nonlinear crest-to-trough is 20.24 µm, not the linear half-wavelength 21.575 µm. The activator-only correlation (0.9155) uses no fitted inhibitor gain and is not equal to 0.9846. Pass 1 leaves this dimension at 80 because the two-field r depends on three fitted readout gains."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-benthic-turing-wavelength-s0.py, lines: [245, 275], note: "Readout fit, activator-only r, KS", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-benthic-turing-wavelength-s0.py, lines: [557, 656], note: "measure_morphoeval metrics with value != reference", supports: true}
      source-traceability:
        value: 90
        rationale: "Eight Crossref-checked DOIs are in paper_citations.bib. The detail plate and the Ron Offermans CC BY-SA 3.0 lateral photograph are SHA-256 pinned. OpenAlex returned no hits for the long query; the papers were confirmed on Crossref."
        evidence:
          - {file: datasets/gasterosteus_aculeatus_benthic_turing_wavelength_s0/paper_citations.bib, lines: [1, 40], note: "Turing, Schnakenberg, Kondo, Nakamasu entries", supports: true}
          - {file: datasets/gasterosteus_aculeatus_benthic_turing_wavelength_s0/gasterosteus_aculeatus_benthic_turing_wavelength_s0_reference.json, lines: [1, 40], note: "Scale 4.315e-05 m and age 0 Ma", supports: true}
      code-traceability:
        value: 82
        rationale: "linear_turing maps onto the dispersion relation in the module docstring. Pass 1 scores traceability at 82 because the optical readout's three gains are a fit, not a line of the Schnakenberg PDE, even though the GIF frames are snapshot profiles."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-benthic-turing-wavelength-s0.py, lines: [1, 24], note: "Module header states scale, age, and predecessor", supports: true}
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-benthic-turing-wavelength-s0.py, lines: [388, 418], note: "GIF frames from PDE snapshots; last frame is the steady fit", supports: true}
      repro-package:
        value: 86
        rationale: "--self-test checks r > 0.98, the Turing inequalities, ablation, the monotone Du sweep, GIF frame count, and resolution. Seed 3234. Pass 1 does not treat the package as fully closed because nanopub signing has no local profile."
        evidence:
          - {file: models/2026-delphi10000-gasterosteus-aculeatus-benthic-turing-wavelength-s0.py, lines: [669, 700], note: "Self-test assertions", supports: true}
          - {file: datasets/gasterosteus_aculeatus_benthic_turing_wavelength_s0/README.md, lines: [1, 40], note: "Invocation and claim limits", supports: true}
    remediation:
      - "Animate the GIF from Schnakenberg snapshots passed through the steady readout, and keep the last frame equal to the fitted profile."
      - "Integrate every amplitude seed for the full 9000 steps and report the coefficient of variation."
      - "Inset the CC BY-SA Commons voucher on the comparison figure and state that it is not the 43 µm target."
      - "Report the activator-only radial correlation with no fitted inhibitor gain, next to the two-field Pearson r."
