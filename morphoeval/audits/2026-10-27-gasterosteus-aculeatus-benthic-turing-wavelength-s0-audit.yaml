simulations:
  - id: delphi10000-gasterosteus-aculeatus-benthic-turing-wavelength-s0
    name: "Benthic stickleback cellular Turing wavelength (43 µm, Holocene 0 Ma)"
    organism: "Gasterosteus aculeatus_benthic"
    script: models/2026-delphi10000-gasterosteus-aculeatus-benthic-turing-wavelength-s0.py
