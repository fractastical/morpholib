    claim_boundary:
      reported_in_source:
      - 'Yamaguchi et al. 2013: periodic Wnt1 expression generates Bombyx larval twin spots.'
      - 'Turing 1952 and Gierer & Meinhardt 1972: a finite wavelength is selected when the inhibitor diffuses farther
        than the activator.'
      reconstructed_in_script:
      - Schnakenberg Jacobian with a = 0.058, b = 0.94, Dv/Du = 18, rescaled so λ_c = 41 µm.
      - Axisymmetric Galerkin sideband fitted to the canonical ocellus card.
      - Predecessor contrast σ(2π/96 µm) < 0 < σ(2π/41 µm) at 0 Ma. No successor chronospecies.
      transfer_boundary:
      - Wnt1 twin spots in the source paper are segment-scale. The 41 µm figure is this slot's cellular detail scale,
        not a length Yamaguchi measured.
      does_not_claim:
      - That 41 µm or 96 µm was measured on a fossil or on Bombyx mandarina.
      - That the Pass-1 ring pitch of 82.14 µm is the card's true pitch. The unit conversion is inverted.
      - A pixel-fitted nonlinear 2D spot field.
