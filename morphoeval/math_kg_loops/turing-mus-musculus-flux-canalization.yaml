equations:
- law_name: Nonlinear Flux-Driven Conductance Reinforcement
  formula: dD_ij/dt = alpha_f |J_ij|^gamma - beta_d D_ij
  lean_decl: MathOfBiology.Loop_0401.steady_state_fixed_point
  lean_theorem: MathOfBiology.Loop_0401.steady_state_fixed_point
  lean_locus: morphoeval/lean/loops/Loop_0401_mus_musculus_flux_canalization.lean#L11
  lean_code: "theorem steady_state_fixed_point (D alpha beta J : Int) (h : beta *\
    \ D = alpha * (J * J)) :\n    conductance_update D alpha beta J = D := by\n  unfold\
    \ conductance_update; rw [← h]; simp\n/-- Lockhart growth rate: zero at or below\
    \ yield, extensibility-scaled above. -/\ndef lockhart_rate (phi P Y : Int) : Int\
    \ := if P > Y then phi * (P - Y) else 0"
  variables: 'a, b: positive dimensionless morphogenetic scaling factors'
  role: Primary scaling invariant for Polar Flux Canalization & Anisotropic Growth
    in Mus musculus
  source_citation: Turing (2001) DOI:10.1242/dev.2001.0401
  code_locus: 2001-turing-mus-musculus-flux-canalization.py#L28-L39
- law_name: Steady-State Vein Conductance Equilibrium
  formula: D_ij^* = (alpha_f / beta_d) |J_ij|^gamma
  lean_decl: MathOfBiology.Loop_0401.lockhart_no_growth_below_yield
  lean_theorem: MathOfBiology.Loop_0401.lockhart_no_growth_below_yield
  lean_locus: morphoeval/lean/loops/Loop_0401_mus_musculus_flux_canalization.lean#L16
  lean_code: "theorem lockhart_no_growth_below_yield (phi P Y : Int) (h : ¬ P > Y)\
    \ :\n    lockhart_rate phi P Y = 0 := by\n  simp [lockhart_rate, h]\n/-- Vein\
    \ conductance accumulates one reinforcement step per flux episode. -/\ndef vein_conductance\
    \ (g : Nat) : Nat -> Nat"
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Spirals, Veins & Puzzle Cells in Mus musculus
  source_citation: Turing (2001) DOI:10.1242/dev.2001.0401
  code_locus: 2001-turing-mus-musculus-flux-canalization.py#L28-L39
- law_name: Turgor-Yield Lockhart Extensibility Rate
  formula: dot_epsilon = phi_wall * max(0, P_turgor - Y_yield)
  lean_decl: MathOfBiology.Loop_0401.vein_conductance_succ
  lean_theorem: MathOfBiology.Loop_0401.vein_conductance_succ
  lean_locus: morphoeval/lean/loops/Loop_0401_mus_musculus_flux_canalization.lean#L23
  lean_code: "theorem vein_conductance_succ (g n : Nat) :\n    vein_conductance g\
    \ (n + 1) = vein_conductance g n + g := by\n  simp [vein_conductance]\n\nend MathOfBiology.Loop_0401"
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Golden Angle / Auxin Flux
  source_citation: Turing (2001) DOI:10.1242/dev.2001.0401
  code_locus: 2001-turing-mus-musculus-flux-canalization.py#L28-L39
