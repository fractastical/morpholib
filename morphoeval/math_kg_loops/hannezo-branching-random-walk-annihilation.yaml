equations:
  - id: hannezo-branching-random-walk-annihilation-1
    law_name: "Hannezo et al. (2017) Topological Binary-Tree Balance & Critical Galton-Watson Branching Law"
    formula: "A_final = 1 + N_branch - N_term = 0  =>  N_term = N_branch + 1,  N_total = 2 N_branch + 1,  q_branch = N_branch / (N_branch + N_term) = N_branch / (2 N_branch + 1) -> 1/2 = q_term"
    lean_decl: "MathOfBiology.Loop_056.active_tips_remaining"
    lean_theorem: "MathOfBiology.Loop_056.hannezo_topological_tree_balance_and_critical_branching"
    lean_locus: "morphoeval/lean/loops/Loop_056_branching_random_walk_annihilation.lean#L46-L73"
    lean_code: |
      def active_tips_remaining (n_branch n_term : Int) : Int := 1 + n_branch - n_term
      def total_tree_segments (n_branch n_term : Int) : Int := n_branch + n_term
      theorem hannezo_topological_tree_balance_and_critical_branching (n_branch : Int) :
          active_tips_remaining n_branch (n_branch + 1) = 0 ∧
          total_tree_segments n_branch (n_branch + 1) = 2 * n_branch + 1 ∧
          2 * n_branch < total_tree_segments n_branch (n_branch + 1) ∧
          active_tips_remaining 33 34 = 0 ∧
          total_tree_segments 33 34 = 67 := by
        simp [active_tips_remaining, total_tree_segments]; omega
    variables: "N_branch: number of dichotomous tip bifurcation events (A -> 2A); N_term: number of tip-duct annihilation/termination events (A + I -> I); q_branch: ensemble branching probability"
    role: "Proves that any finite self-terminating binary ductal tree starting from 1 primary stalk satisfies N_term = N_branch + 1, tuning the tree automatically to a critical Galton-Watson process (q_branch -> 1/2) with universal P(S) ~ S^(-3/2) subtree size scaling"
    source_citation: "Hannezo et al. (2017) Cell 171(1):242-255 Eqs. (1)-(3); Scheele et al. (2017) Nature 542:313-317"
    code_locus: "2017-hannezo-branching-random-walk-annihilation.py#L115-L245"

  - id: hannezo-branching-random-walk-annihilation-2
    law_name: "Hannezo et al. (2017) Mean-Field BARW Travelling-Wave PDE & Homeostatic Duct Density Law"
    formula: "∂_t a = D ∇^2 a - v_0 ∇·(u_p a) + k_b a - k_a a (a + i),  ∂_t i = v_0 a;  a_∞ = 0,  i_∞ = c_0 k_b / k_a ∝ k_b / (v_0 R_a)"
    lean_decl: "MathOfBiology.Loop_056.active_tip_reaction"
    lean_theorem: "MathOfBiology.Loop_056.hannezo_barw_homeostatic_steady_state"
    lean_locus: "morphoeval/lean/loops/Loop_056_branching_random_walk_annihilation.lean#L80-L110"
    lean_code: |
      def active_tip_reaction (kb ka a i : Int) : Int := kb * a - ka * a * (a + i)
      def duct_deposition_rate (v0 a : Int) : Int := v0 * a
      def per_tip_net_growth (kb ka a i : Int) : Int := kb - ka * (a + i)
      theorem hannezo_barw_homeostatic_steady_state (kb ka v0 i_inf : Int) :
          active_tip_reaction kb ka 0 i_inf = 0 ∧
          duct_deposition_rate v0 0 = 0 ∧
          per_tip_net_growth (ka * i_inf) ka 0 i_inf = 0 := by
        simp [active_tip_reaction, duct_deposition_rate, per_tip_net_growth]; omega
    variables: "a(x,t): active proliferative tip density; i(x,t): differentiated inactive duct density; D: tip effective diffusivity; v_0: tip speed; k_b: Poisson bifurcation rate; k_a: tip-duct annihilation kernel"
    role: "Establishes that an invading pulse of active tips a(x,t) self-extinguishes behind the Fisher-KPP wavefront (a_∞ = 0) while depositing a uniform homeostatic plateau of differentiated ducts i_∞ ∝ k_b / k_a"
    source_citation: "Hannezo et al. (2017) Cell 171(1):242-255 STAR Methods Eqs. (4)-(10)"
    code_locus: "2017-hannezo-branching-random-walk-annihilation.py#L250-L365"

  - id: hannezo-branching-random-walk-annihilation-3
    law_name: "Hannezo et al. (2017) & Silberstein & Daniel (1987) Annihilation-Radius Hyper-Branching Density Scaling & Explosion Ablation Law"
    formula: "i_∞(R_a) ∝ k_b / (v_0 R_a)  =>  i_∞(R_a,hypo) < i_∞(R_a,WT) < i_∞(R_a,hyper);  for R_a = 0 (no annihilation): N_active(g) = 2^g -> ∞"
    lean_decl: "MathOfBiology.Loop_056.homeostatic_density_scaled"
    lean_theorem: "MathOfBiology.Loop_056.hannezo_annihilation_radius_scaling_and_explosion_ablation"
    lean_locus: "morphoeval/lean/loops/Loop_056_branching_random_walk_annihilation.lean#L117-L148"
    lean_code: |
      def homeostatic_density_scaled (ra_10 : Nat) : Nat := 10000 / ra_10
      def unarrested_branch_step (n : Nat) : Nat := 2 * n
      def unarrested_gen5 (n : Nat) : Nat :=
        unarrested_branch_step (unarrested_branch_step (unarrested_branch_step (unarrested_branch_step (unarrested_branch_step n))))
      theorem hannezo_annihilation_radius_scaling_and_explosion_ablation (n : Nat) :
          homeostatic_density_scaled 70 < homeostatic_density_scaled 35 ∧
          homeostatic_density_scaled 35 < homeostatic_density_scaled 17 ∧
          unarrested_gen5 n = 32 * n ∧ 0 < unarrested_gen5 1
    variables: "R_a: tip-duct steric/TGF-beta sensing and annihilation radius; g: branching generation; N_active(g): active tip count under R_a = 0 ablation"
    role: "Proves that attenuating TGF-beta signaling (reducing R_a) produces hyper-dense ductal trees while exogenous TGF-beta (increasing R_a) yields sparse hypoplastic trees, whereas complete ablation of annihilation (R_a = 0) destroys self-termination and triggers exponential tip explosion"
    source_citation: "Hannezo et al. (2017) Cell 171(1):242-255 Fig. 4; Silberstein & Daniel (1987) Science 237:291-293"
    code_locus: "2017-hannezo-branching-random-walk-annihilation.py#L370-L535"

  # ---------------------------------------------------------------- Pass 3 ----
  - id: hannezo-branching-random-walk-annihilation-4
    law_name: "Anisotropic ECM Nematic Alignment Order Law for 3D BARW in cylindrical fat-pad / spherical mesenchymal geometries (Bordeu et al. 2023)"
    formula: "du/dt = sigma_theta xi_perp + lambda (f.u)(f - (f.u) u);  S = < (3 cos^2 theta - 1)/2 >_length,  S(iso) = 0,  S(parallel) = 1,  S(perp) = -1/2;  R_s(t) = R_s(0)(1 + gamma t) (inflation)"
    lean_decl: "MathOfBiology.Loop_056.nematic_order_twice"
    lean_theorem: "MathOfBiology.Loop_056.hannezo_nematic_ecm_alignment_order"
    lean_locus: "morphoeval/lean/loops/Loop_056_branching_random_walk_annihilation.lean#L152-L202"
    lean_code: |
      def nematic_order_twice (c : Int) : Int := 3 * c * c - 1
      def nematic_torque (lambda_ fu : Int) : Int := lambda_ * fu
      theorem hannezo_nematic_ecm_alignment_order (c lambda_ fu : Int) :
          nematic_order_twice 1 = 2 ∧ nematic_order_twice (-1) = 2 ∧ nematic_order_twice 0 = -1 ∧
          -1 ≤ nematic_order_twice c ∧ nematic_order_twice c = nematic_order_twice (-c) ∧
          nematic_order_twice 1 + nematic_order_twice 0 + nematic_order_twice 0 = 0 ∧
          nematic_torque 0 fu = 0 ∧ nematic_torque lambda_ 0 = 0 ∧
          nematic_torque lambda_ (-fu) = - nematic_torque lambda_ fu
    variables: "u: unit tip direction; f: ECM fiber axis; lambda: nematic alignment strength (1/time); theta: angle between a ductal segment and f; S: length-weighted nematic order parameter; gamma: capsule inflation rate"
    role: "Specifies the anisotropic-ECM torque of the 3D BARW simulator (nematic, not polar: symmetric under u -> -u, zero for isotropic matrix or perpendicular tips) and the order parameter used to quantify fiber alignment of the ductal network; S rises monotonically with lambda and over-alignment (lambda >= 0.4) collapses the tree by alignment-induced sibling annihilation"
    source_citation: "Bordeu I, Chatzeli L, Simons BD (2023) Nat. Commun. 14:3422 (doi:10.1038/s41467-023-39124-x); Hannezo et al. (2017) Cell STAR Methods"
    code_locus: "2017-hannezo-branching-random-walk-annihilation.py#L801-L1066"

  - id: hannezo-branching-random-walk-annihilation-5
    law_name: "Scheele et al. (2017) Moran Neutral-Drift Martingale for labelled stem cells inside a terminal end bud"
    formula: "P(k -> k+1) = P(k -> k-1) = k (N-k) / N^2;  E[k' | k] = k;  N^2 Var[k' - k | k] = 2 k (N-k) >= 0 (= 0 at k = 0, N)"
    lean_decl: "MathOfBiology.Loop_056.moran_expected_numerator"
    lean_theorem: "MathOfBiology.Loop_056.scheele_moran_neutral_drift_martingale"
    lean_locus: "morphoeval/lean/loops/Loop_056_branching_random_walk_annihilation.lean#L206-L243"
    lean_code: |
      def moran_expected_numerator (n k : Int) : Int :=
        (k + 1) * (k * (n - k)) + (k - 1) * (k * (n - k)) + k * (n * n - 2 * (k * (n - k)))
      def moran_variance_numerator (n k : Int) : Int := 2 * (k * (n - k))
      theorem scheele_moran_neutral_drift_martingale (n k : Int) :
          moran_expected_numerator n k = k * (n * n) ∧
          moran_variance_numerator n 0 = 0 ∧ moran_variance_numerator n n = 0 ∧
          (0 ≤ k → k ≤ n → 0 ≤ moran_variance_numerator n k)
    variables: "N: equipotent stem cells per TEB; k: labelled cells; k': labelled cells after one Moran birth-death step"
    role: "Proves that neutral drift of a labelled clone inside a TEB conserves the expected labelled fraction while generating clonal variance only in mosaic TEBs; this is the reference (f_bar = f_0) against which the duct-length-weighted labelled fraction of the simulated tree is measured"
    source_citation: "Scheele CLGJ et al. (2017) Nature 542:313-317 (doi:10.1038/nature21060); Moran PAP (1958) Math. Proc. Camb. Phil. Soc. 54:60-71; Klein AM, Simons BD (2011) Development 138:3103-3111"
    code_locus: "2017-hannezo-branching-random-walk-annihilation.py#L1068-L1225"

  - id: hannezo-branching-random-walk-annihilation-6
    law_name: "Label Conservation at a TEB Bifurcation (hypergeometric half-split + doubling)"
    formula: "k -> (2 k_1, 2 (k - k_1)),  k_1 ~ Hypergeom(N, k, N/2);  2 k_1 + 2 (k - k_1) = 2 k;  E[2 k_1] = k"
    lean_decl: "MathOfBiology.Loop_056.daughter_labels"
    lean_theorem: "MathOfBiology.Loop_056.scheele_teb_split_label_conservation"
    lean_locus: "morphoeval/lean/loops/Loop_056_branching_random_walk_annihilation.lean#L247-L272"
    lean_code: |
      def daughter_labels (k k1 : Int) : Int × Int := (2 * k1, 2 * (k - k1))
      theorem scheele_teb_split_label_conservation (k k1 h : Int) :
          (daughter_labels k k1).1 + (daughter_labels k k1).2 = 2 * k ∧
          2 * (h * k) = (2 * h) * k
    variables: "k: labelled cells in the parent TEB; k_1: labelled cells in the first half of the split; h = N/2"
    role: "Shows that the A -> 2A bifurcation is label-neutral: the total labelled count doubles with cell number and each daughter is an unbiased copy of the parent, so the martingale of Law 5 extends to the whole BARW tree (clone fate is dictated by the tree's bifurcation/termination statistics, Scheele et al. 2017)"
    source_citation: "Scheele CLGJ et al. (2017) Nature 542:313-317 (doi:10.1038/nature21060)"
    code_locus: "2017-hannezo-branching-random-walk-annihilation.py#L1088-L1157"
