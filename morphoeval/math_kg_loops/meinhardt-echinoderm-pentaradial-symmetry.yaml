sim_id: meinhardt-echinoderm-pentaradial-symmetry
math_family: "Circular-Ring Activator-Inhibitor Mode m=5 Selection (k_m = m / R_ring), Lovén's Law (II, IV, I, III, V) Ocular/Ambulacral Ordering, Duboc Nodal Left-Right Rudiment Multiplicity, Ocular Plate Rule Biserial Plate Addition (Pass 3) & Continuous Nodal/BMP2-4 Hill Dose-Response (Pass 3)"
model_spec:
  model: "Morris (2012) Evol. Dev. + Mooi & David (1998, 2008) Extraxial-Axial Theory / Ocular Plate Rule + Lovén (1874) Ocular/Ambulacral Law + Duboc et al. (2005) Dev. Cell Nodal L-R Asymmetry + Luo & Su (2012) opposing Nodal/BMP + Meinhardt (2008) Circular-Ring Gierer-Meinhardt Reaction-Diffusion"
  governing_pde: "da/dt = (D_a / R_ring(t)^2) d^2a/dtheta^2 + rho_a (a^2 / h - a) + rho_0 G_crescent(theta, t),   dh/dt = (D_h / R_ring(t)^2) d^2h/dtheta^2 + rho_h (a^2 - h)"
  mode_selection_law: "mu_m = (m / R_ring)^2,   m^* = round(2*pi * R_ring / lambda_c) = 5 (Delta_theta = 72 deg) for 2*pi * R_ring / lambda_c in (4.5, 5.5)"
  loven_sequence_law: "Initiation order (II, IV, I, III, V) = (C, A, D, B, E); peristomial enlargement Ib, IIb, IIIa, IVa, Va (ba-ab-ba-ab-ab)"
  nodal_rudiment_law: "N_podia = 5 * (I(Nodal_L = 0) + I(Nodal_R = 0)) in {5 (WT), 10 (Nodal LOF 2x5), 0 (Nodal GOF)}"
  opr_plate_addition_law: "R(t) = R_meta G(t); L(t) = R(t) (phi_per - phi_oc); dh_i = gamma h_i (dR/R) (1 - h_i/h_max,zone); if L - sum h_i >= h_nuc,zone: nucleate plate at the ocular end; 20 columns = 5 x (a,b) ambulacral + 5 x (a,b) interambulacral; ambulacral azimuths = m=5 ring-PDE lobes"
  nodal_dose_response_law: "-lambda_N^2 N'' + N = dose_R S(x - x_src) + dose_L S(x + x_src);  -lambda_B^2 B'' + B = b_stom S_stom(x) + beta_ind Hill(N; K_ind, n);  P_pouch = Hill(B; K_B, n) (1 - Hill(N; K_N, n));  E[podia] = 5 (P_L + P_R)"
  R_ring_um: 75.0
  lambda_c_um: 94.2478
  D_a_um2_per_s: 0.45
  D_h_um2_per_s: 18.0
  seed: 2005
  opr_growth_factor_final: 40.0
  opr_h_nuc_ambulacral_R_meta: 1.0
  opr_h_max_over_h_nuc_ambulacral: 2.0
  opr_h_nuc_interambulacral_over_ambulacral: 1.6
  opr_h_max_over_h_nuc_interambulacral: 3.75
  opr_loven_primordial_enlargement: 1.5
  nodal_decay_length: 0.22
  bmp_decay_length: 0.45
  nodal_repression_K: 0.05
  bmp_activation_K: 0.015
  hill_coefficient: 4
  inputs:
    - datasets/echinoderm_pentaradial_symmetry/echinoderm_pentaradial_symmetry_reference.json
    - datasets/echinoderm_pentaradial_symmetry/echinoderm_pentaradial_test_specimen.jpg
    - datasets/echinoderm_pentaradial_symmetry/scout_manifest.json
    - datasets/echinoderm_pentaradial_symmetry/opr_plate_addition_nodal_dose_reference.json
equations:
  - law_name: "Circular Hydrocoel Ring Laplacian Eigenvalue & Pentaradial Mode m^* = 5 Selection Law"
    formula: "- (1 / R_ring^2) d^2(cos(m theta))/dtheta^2 = (m^2 / R_ring^2) cos(m theta),   m^* = argmax_m sigma(m / R_ring) = 5 (Delta_theta = 72 deg) when 2*pi R_ring / lambda_c in (4.5, 5.5)"
    lean_decl: "MathOfBiology.Loop_075.hydrocoel_turing_growth_score"
    lean_theorem: "MathOfBiology.Loop_075.hydrocoel_ring_pentaradial_mode5_selection"
    lean_locus: "morphoeval/lean/loops/Loop_075_echinoderm_pentaradial_symmetry.lean#L24-L85"
    lean_code: |
      def ring_laplacian_eigen_num (m : Nat) : Nat := m * m
      def hydrocoel_angular_period_deg (m : Nat) : Nat := 360 / m
      theorem hydrocoel_ring_pentaradial_mode5_selection :
          ring_laplacian_eigen_num 5 = 25 ∧
          hydrocoel_angular_period_deg 5 = 72 ∧
          5 * hydrocoel_angular_period_deg 5 = 360 ∧
          hydrocoel_turing_growth_score 5 50 > hydrocoel_turing_growth_score 4 50 ∧
          hydrocoel_turing_growth_score 5 50 > hydrocoel_turing_growth_score 6 50 := by decide
    variables: "m in {3, 4, 5, 6, 7}: azimuthal harmonic mode on closed hydrocoel ring; R_ring: hydrocoel ring radius (um); lambda_c: Turing critical wavelength (um); Delta_theta = 360 deg / m: inter-ambulacral angular spacing"
    role: "Governs spontaneous symmetry breaking of the closed circular left hydrocoel ring into 5 primary podia lobes spaced at 72 deg, while explaining 4-rayed (90 deg) and 6-rayed (60 deg) teratological variants under ring-radius perturbations"
    source_citation: "Meinhardt (2008) Curr. Top. Dev. Biol. 81:1-63; Morris (2012) Evol. Dev. 14(4):313-326"
    code_locus: "2005-meinhardt-echinoderm-pentaradial-symmetry.py#L192-L421"
  - law_name: "Lovén's Law (1874) & Morris (2012) Hydrocoel Crescent Initiation Ordering (II, IV, I, III, V)"
    formula: "Initiation rank r in {1..5} -> Ray (II, IV, I, III, V) = (C, A, D, B, E);   Peristomial biserial dominance: (Ib, IIb, IIIa, IVa, Va) = (ba, ba, ab, ab, ab)"
    lean_decl: "MathOfBiology.Loop_075.loven_initiation_rank_to_ray"
    lean_theorem: "MathOfBiology.Loop_075.loven_law_crescent_ordering_and_asymmetric_biserial_rule"
    lean_locus: "morphoeval/lean/loops/Loop_075_echinoderm_pentaradial_symmetry.lean#L91-L157"
    lean_code: |
      def loven_initiation_rank_to_ray : Nat → Nat
        | 1 => 2 | 2 => 4 | 3 => 1 | 4 => 3 | 5 => 5 | _ => 0
      theorem loven_law_crescent_ordering_and_asymmetric_biserial_rule :
          loven_initiation_rank_to_ray 1 = 2 ∧
          loven_initiation_rank_to_ray 5 = 5 ∧
          (loven_b_column_enlarged 1 + loven_b_column_enlarged 2 +
           loven_b_column_enlarged 3 + loven_b_column_enlarged 4 +
           loven_b_column_enlarged 5) = 2 := by decide
    variables: "r in {1..5}: developmental initiation rank during crescent-to-ring closure; I..V: Lovén ambulacral ray indices; (a, b): counter-clockwise half-ambulacral plate columns"
    role: "Explains how progressive anterior-to-posterior activation along the closing bilateral hydrocoel crescent generates Lovén's invariant asymmetric biserial peristomial plate law across Echinoidea"
    source_citation: "Lovén (1874) K. Sven. Vetensk.-Akad. Handl. 11(7):1-91; Mooi & David (1998) Am. Zool. 38:965-974; Morris (2012) Evol. Dev. 14:313-326"
    code_locus: "2005-meinhardt-echinoderm-pentaradial-symmetry.py#L424-L465"
    code_locus_secondary: "2005-meinhardt-echinoderm-pentaradial-symmetry.py#L263-L323"
  - law_name: "Duboc et al. (2005) Right-Sided Nodal Signaling & Bilateral Twin-Rudiment Multiplicity Law"
    formula: "N_rings = I(Nodal_L = 0) + I(Nodal_R = 0),   N_podia = 5 * N_rings in {5 (WT: Nodal_R = 1), 10 (Nodal LOF: Nodal_L = Nodal_R = 0, twin 2x5 rudiments), 0 (Nodal GOF: Nodal_L = Nodal_R = 1)}"
    lean_decl: "MathOfBiology.Loop_075.total_primary_podia"
    lean_theorem: "MathOfBiology.Loop_075.duboc_nodal_left_right_rudiment_multiplicity"
    lean_locus: "morphoeval/lean/loops/Loop_075_echinoderm_pentaradial_symmetry.lean#L160-L193"
    lean_code: |
      def active_hydrocoel_rings (nodal_left nodal_right : Nat) : Nat :=
        (if nodal_left == 0 then 1 else 0) + (if nodal_right == 0 then 1 else 0)
      def total_primary_podia (m_ring nodal_left nodal_right : Nat) : Nat :=
        m_ring * active_hydrocoel_rings nodal_left nodal_right
      theorem duboc_nodal_left_right_rudiment_multiplicity :
          total_primary_podia 5 0 1 = 5 ∧
          total_primary_podia 5 0 0 = 10 ∧
          total_primary_podia 5 1 1 = 0 := by decide
    variables: "nodal_left, nodal_right in {0, 1}: left/right ectodermal Nodal signaling activity; N_rings: number of functional hydrocoel rings; N_podia: total primary podia lobes"
    role: "Links bilateral pluteus left-right axis specification (right-sided Nodal/BMP2-4 cascade) to asymmetric restriction of pentaradial adult rudiment formation to the left hydrocoel"
    source_citation: "Duboc et al. (2005) Dev. Cell 9(1):147-158"
    code_locus: "2005-meinhardt-echinoderm-pentaradial-symmetry.py#L468-L512"
  - law_name: "Ocular Plate Rule (Mooi & David 1998/2008) Biserial Plate Addition on the Domed Test (Pass 3)"
    formula: "R(t) = R_meta G(t);  L(t) = R(t) (phi_per - phi_oc);  dh_i = gamma h_i (dR/R) (1 - h_i / h_max,zone);  nucleate h_nuc,zone at the ocular end when L - sum_i h_i >= h_nuc,zone;  N_columns = 2 m + 2 m = 20 for m = 5;  position_from_ocular(b) = n - 1 - b;  alternating split (k+1)/2 + k/2 = k"
    lean_decl: "MathOfBiology.Loop_075.opr_position_from_ocular"
    lean_theorem: "MathOfBiology.Loop_075.opr_biserial_plate_addition_law"
    lean_locus: "morphoeval/lean/loops/Loop_075_echinoderm_pentaradial_symmetry.lean#L195-L255"
    lean_code: |
      def opr_meridional_columns (m_rays : Nat) : Nat := 2 * m_rays + 2 * m_rays
      def opr_position_from_ocular (n b : Nat) : Nat := n - 1 - b
      def opr_alternating_count_a (k : Nat) : Nat := (k + 1) / 2
      def opr_alternating_count_b (k : Nat) : Nat := k / 2
      theorem opr_biserial_plate_addition_law :
          opr_meridional_columns 5 = 20 ∧ 2 * 5 = 10 ∧
          (∀ n : Nat, 1 ≤ n → opr_position_from_ocular n (n - 1) = 0) ∧
          (∀ n b₁ b₂ : Nat, b₁ < b₂ → b₂ < n → opr_position_from_ocular n b₂ < opr_position_from_ocular n b₁) ∧
          (∀ k : Nat, opr_alternating_count_a k + opr_alternating_count_b k = k) ∧
          (∀ k : Nat, opr_alternating_count_a k = opr_alternating_count_b k ∨
                      opr_alternating_count_a k = opr_alternating_count_b k + 1) := by
        refine ⟨rfl, rfl, ?_, ?_, ?_, ?_⟩
        · intro n hn; unfold opr_position_from_ocular; omega
        · intro n b₁ b₂ h₁ h₂; unfold opr_position_from_ocular; omega
        · intro k; unfold opr_alternating_count_a opr_alternating_count_b; omega
        · intro k; unfold opr_alternating_count_a opr_alternating_count_b; omega
    variables: "R_meta: test radius at metamorphosis (length unit); G(t): saturating growth factor to 40; phi_oc, phi_per: ocular and peristome colatitudes (22, 150 deg); h_i: meridional plate height; h_nuc, h_max: zone-specific nucleation / terminal plate heights (ambulacral 1.0 / 2.0, interambulacral 1.6 / 6.0 R_meta); b: plate birth index; n: plates per column; k: plates added to a biserial pair"
    role: "Couples the m=5 hydrocoel-ring PDE (ambulacral azimuths) to 3D adult test construction: 20 biserial columns, continuous plate addition at the ocular throughout growth (newest plate always apical), zone-dependent ambulacral vs interambulacral plate counts, and the Lovén-seeded alternating a/b suture, measured against the specimen with the same aboral polar C_5/C_10 pipeline"
    source_citation: "Mooi & David (1998) Am. Zool. 38:965-974; Mooi & David (2008) Annu. Rev. Ecol. Evol. Syst. 39:43-62; Raup (1968) J. Paleontol. 42:50-63; Zachos (2009) J. Theor. Biol. 259:646-657; Lovén (1874)"
    code_locus: "2005-meinhardt-echinoderm-pentaradial-symmetry.py#L542-L694"
    code_locus_secondary: "2005-meinhardt-echinoderm-pentaradial-symmetry.py#L696-L800"
  - law_name: "Continuous Nodal/BMP2-4 Hill Dose-Response across Stomodeum and Right Somatocoel reducing to the Discrete Duboc Law (Pass 3)"
    formula: "-lambda_N^2 N'' + N = dose_R S(x - x_src) + dose_L S(x + x_src);  -lambda_B^2 B'' + B = b_stom S_stom(x) + beta_ind N^n/(K_ind^n + N^n);  P_pouch = B^n/(K_B^n + B^n) * (1 - N^n/(K_N^n + N^n));  E[podia] = 5 (P_L + P_R);  round(P_L) + round(P_R) = N_rings(Law 3) at (0,1), (0,0), (1,1)"
    lean_decl: "MathOfBiology.Loop_075.nodal_hill_competence_permille"
    lean_theorem: "MathOfBiology.Loop_075.nodal_dose_response_hill_reduces_to_discrete_law"
    lean_locus: "morphoeval/lean/loops/Loop_075_echinoderm_pentaradial_symmetry.lean#L257-L296"
    lean_code: |
      def nodal_hill_competence_permille (d K : Nat) : Nat := 1000 * (K * K) / (K * K + d * d)
      def nodal_expected_rings_permille (dL dR K : Nat) : Nat :=
        nodal_hill_competence_permille dL K + nodal_hill_competence_permille dR K
      def nodal_rings_rounded (dL dR K : Nat) : Nat := (nodal_expected_rings_permille dL dR K + 500) / 1000
      theorem nodal_dose_response_hill_reduces_to_discrete_law :
          nodal_hill_competence_permille 0 10 = 1000 ∧
          nodal_hill_competence_permille 10 10 = 500 ∧
          nodal_hill_competence_permille 50 10 > nodal_hill_competence_permille 100 10 ∧
          nodal_rings_rounded 0 100 10 = active_hydrocoel_rings 0 1 ∧
          nodal_rings_rounded 0 0 10 = active_hydrocoel_rings 0 0 ∧
          nodal_rings_rounded 100 100 10 = active_hydrocoel_rings 1 1 := by decide
    variables: "x in [-1, 1]: normalised larval left-right axis (0 = stomodeum, +0.55 = right somatocoel, -0.55 = left hydrocoel pouch); N, B: Nodal and BMP2/4 steady-state concentrations; lambda_N = 0.22, lambda_B = 0.45: decay lengths; K_N = 0.05, K_B = 0.015, n = 4: Hill constants; dose_L, dose_R: left / right Nodal source strengths (1 = WT right); P_L, P_R: pouch hydrocoel competences"
    role: "Replaces the binary Nodal switch of Law 3 by continuous morphogen gradients and a sigmoidal dose-response (EC50 = 0.175 x WT dose for right-pouch derepression), reproducing the WT 1x5, Nodal-morpholino 2x5 and bilateral-GOF 0 phenotypes as the dose extremes"
    source_citation: "Duboc et al. (2005) Dev. Cell 9(1):147-158; Luo & Su (2012) PLoS Biol. 10(10):e1001402"
    code_locus: "2005-meinhardt-echinoderm-pentaradial-symmetry.py#L806-L911"
