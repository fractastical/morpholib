- law_name: Critical Compressive Buckling Strain Threshold
  formula: epsilon_c = (1 / 4) (3 E_s / E_f)^(2/3)
  lean_decl: MathOfBiology.Loop_1762.law2_balance
  lean_theorem: MathOfBiology.Loop_1762.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1762_equus_scotti_elastic_buckling.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Gyri, Villi, Loops & Snap-Shells in Equus scotti
