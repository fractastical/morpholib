  source_citation: Forsten (2000) DOI:10.1017/pal.2000.1762
  code_locus: models/2000-forsten-equus-scotti-elastic-buckling.py#L31-L48
- law_name: Post-Buckling Amplitude Square-Root Scaling
  formula: A_fold = h_f sqrt((epsilon - epsilon_c) / epsilon_c)
