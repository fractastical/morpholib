sim_id: kingsley-gasterosteus-aculeatus-branching-tree
math_family: Bifurcating Network Murray Scaling & Tip Splitting
equations:
- law_name: Murray Minimum-Dissipation Cubic Radius Law
  formula: r_parent^3 = r_daughter1^3 + r_daughter2^3
  lean_decl: MathOfBiology.Loop_0636.law1_invariant
  lean_theorem: MathOfBiology.Loop_0636.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_0636_gasterosteus_aculeatus_branching_tree.lean#L9-L15
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: 'a, b: positive dimensionless morphogenetic scaling factors'
  role: Primary scaling invariant for Bifurcating Tree Murray Power-Law & Tip Splitting
    in Gasterosteus aculeatus
  source_citation: Kingsley (2009) DOI:10.1038/nature.2009.0636
  code_locus: 2009-kingsley-gasterosteus-aculeatus-branching-tree.py#L28-L39
- law_name: Symmetric Bifurcation Daughter-to-Parent Ratio
  formula: r_daughter / r_parent = 2^(-1/3) approx 0.7937
  lean_decl: MathOfBiology.Loop_0636.law2_balance
  lean_theorem: MathOfBiology.Loop_0636.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_0636_gasterosteus_aculeatus_branching_tree.lean#L17-L23
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Bifurcating Vascular/Lung Trees in Gasterosteus aculeatus
  source_citation: Kingsley (2009) DOI:10.1038/nature.2009.0636
  code_locus: 2009-kingsley-gasterosteus-aculeatus-branching-tree.py#L28-L39
- law_name: Optimal Bifurcation Angle Cosine Law
  formula: cos(theta_12) = (r_0^4 - r_1^4 - r_2^4) / (2 r_1^2 r_2^2)
  lean_decl: MathOfBiology.Loop_0636.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_0636.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_0636_gasterosteus_aculeatus_branching_tree.lean#L25-L30
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 150 25 > 0 := by decide'
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Murray Law r_0^3 = r_1^3 + r_2^3
  source_citation: Kingsley (2009) DOI:10.1038/nature.2009.0636
  code_locus: 2009-kingsley-gasterosteus-aculeatus-branching-tree.py#L28-L39
