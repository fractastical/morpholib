sim_id: liang-chiral-seed-pod-opening
math_family: "Non-Euclidean Incompatible Shell Elasticity, Gauss Incompatibility (det b_0 = -κ_0^2 < 0) & Föppl–von Kármán Helicoid-to-Helical-Ribbon Pitchfork Bifurcation"
model_spec:
  model: "Armon, Efrati, Kupferman & Sharon (2011) Science 333:1726-1730 / Efrati, Sharon & Kupferman (2009) JMPS 57:762-775 incompatible shell elasticity in Bauhinia variegata chiral seed pod opening"
  kappa0_cm_inv: 0.42
  h_valve_cm: 0.095
  W_valve_cm: 1.80
  L_valve_cm: 18.0
  nu_poisson: 0.30
  theta_natural_deg: 45.0
  seed: 2011
  # Pass 3 (suture fracture / ballistic ejection coupling; provenance flags in the JSON below)
  Y_modulus_Pa: 4.2e8
  rho_valve_kg_m3: 800.0
  Gamma_c_mean_J_m2: 120.0
  cv_Gamma: 0.15
  a0_flaw_m: 0.002
  tau_dry_h: 72.0
  rayleigh_factor: 0.93
  n_seeds: 6
  m_seed_kg: 4.0e-4
  eta_catapult: 0.5
  inputs:
    - datasets/chiral_seed_pod_opening/chiral_seed_pod_opening_reference.json
    - datasets/chiral_seed_pod_opening/bauhinia_chiral_seed_pod_specimen.jpg
    - datasets/chiral_seed_pod_opening/scout_manifest.json
    - datasets/chiral_seed_pod_opening/paper_citations.bib
    - datasets/chiral_seed_pod_opening/suture_fracture_ballistic_reference.json
equations:
  - law_name: "Incompatible Saddle Target Curvature Tensor & Gauss's Theorema Egregium Incompatibility Law"
    formula: "b_0 = diag(κ_0, -κ_0),  Tr(b_0) = 0,  K_target = det(b_0) = -κ_0^2 < 0 ≠ K(a_0) = 0"
    lean_decl: "MathOfBiology.Loop_065.saddle_target_gaussian_curvature"
    lean_theorem: "MathOfBiology.Loop_065.armon_gauss_saddle_incompatibility"
    lean_locus: "morphoeval/lean/loops/Loop_065_chiral_seed_pod_opening.lean#L27-L46"
    lean_code: |
      def saddle_target_gaussian_curvature (kappa0 : Int) : Int :=
        kappa0 * (-kappa0)
      def saddle_target_trace (kappa0 : Int) : Int :=
        kappa0 + (-kappa0)
      theorem armon_gauss_saddle_incompatibility (kappa0 : Int) :
          saddle_target_trace kappa0 = 0 ∧
          saddle_target_gaussian_curvature kappa0 = -(kappa0 * kappa0) ∧
          (∀ k : Nat, saddle_target_gaussian_curvature ((k : Int) + 1) < 0)
    variables: "κ_0: principal intrinsic shrinkage curvature of orthogonal ±45° sclerenchyma layers (cm^-1); b_0: target second fundamental form; K_target = det(b_0): target Gaussian curvature (cm^-2)"
    role: "Proves that orthogonal ±45° fibrous shrinkage in Bauhinia variegata pod valves prescribes a strictly negative Gaussian curvature det(b_0) = -κ_0^2 < 0 that is geometrically incompatible with the flat reference metric (K = 0) by Gauss's Theorema Egregium"
    source_citation: "Armon, Efrati, Kupferman & Sharon (2011) Science 333(6050):1726-1730; Efrati, Sharon & Kupferman (2009) J. Mech. Phys. Solids 57(4):762-775"
    code_locus: "2007-liang-chiral-seed-pod-opening.py#L130-L235"

  - law_name: "Narrow-Strip Bending-Dominated Pure-Twist Helicoid & Cutting-Angle Chirality Law"
    formula: "w̃ = W √(κ_0 / h) ≤ w̃_c  ⇒  H*(w̃) = 0,  R(w̃, 45°) = 0,  τ(θ) = D sin(2θ),  τ(0°) = τ(90°) = 0"
    lean_decl: "MathOfBiology.Loop_065.narrow_helicoid_torsion"
    lean_theorem: "MathOfBiology.Loop_065.armon_narrow_helicoid_chirality"
    lean_locus: "morphoeval/lean/loops/Loop_065_chiral_seed_pod_opening.lean#L61-L72"
    lean_code: |
      def narrow_helicoid_torsion (kappa0 sin_2theta : Int) : Int :=
        kappa0 * sin_2theta
      theorem armon_narrow_helicoid_chirality (kappa0 sin_2theta : Int) :
          narrow_helicoid_torsion kappa0 1 = kappa0 ∧
          narrow_helicoid_torsion kappa0 0 = 0 ∧
          narrow_helicoid_torsion kappa0 (-sin_2theta) = -narrow_helicoid_torsion kappa0 sin_2theta
    variables: "w̃ = W√(κ_0/h): dimensionless Föppl-von Kármán ribbon width; θ: cutting angle relative to principal curvature axis; τ: centerline geodesic torsion (cm^-1); R: helix radius (cm)"
    role: "Explains why narrow valve strips (w̃ ≤ w̃_c) adopt a minimal-surface pure-twist helicoid (H* = 0, R = 0) with maximum twist at θ = 45° and why cutting at θ = 0° or 90° eliminates chirality (achiral circular ring)"
    source_citation: "Armon, Efrati, Kupferman & Sharon (2011) Science 333(6050):1726-1730 Figs. 2-4"
    code_locus: "2007-liang-chiral-seed-pod-opening.py#L240-L395"

  - law_name: "Supercritical Pitchfork Bifurcation & Wide-Ribbon Cylindrical Helical Curvature Law"
    formula: "w̃_c = (16(1 + ν) / √(1 - ν^2))^(1/4),  H*(w̃) = ±((1 - ν)/2) κ_0 √(1 - (w̃_c / w̃)^4)  (w̃ > w̃_c),  K_∞ = κ_1 κ_2 = 0"
    lean_decl: "MathOfBiology.Loop_065.cylindrical_ribbon_two_H"
    lean_theorem: "MathOfBiology.Loop_065.armon_wide_cylindrical_ribbon_asymptote"
    lean_locus: "morphoeval/lean/loops/Loop_065_chiral_seed_pod_opening.lean#L86-L98"
    lean_code: |
      def cylindrical_ribbon_two_H (one_minus_nu kappa0 : Int) : Int :=
        one_minus_nu * kappa0 + 0
      def cylindrical_ribbon_gaussian_K (one_minus_nu kappa0 : Int) : Int :=
        (one_minus_nu * kappa0) * 0
      theorem armon_wide_cylindrical_ribbon_asymptote (one_minus_nu kappa0 : Int) :
          cylindrical_ribbon_two_H one_minus_nu kappa0 = one_minus_nu * kappa0 ∧
          cylindrical_ribbon_gaussian_K one_minus_nu kappa0 = 0 ∧
          cylindrical_ribbon_two_H (-one_minus_nu) kappa0 = -cylindrical_ribbon_two_H one_minus_nu kappa0
    variables: "w̃_c: critical pitchfork dimensionless width; ν: Poisson ratio; H*(w̃): equilibrium mean curvature (cm^-1); H_∞ = (1-ν)κ_0/2: wide-ribbon asymptotic mean curvature"
    role: "Establishes the supercritical pitchfork bifurcation from a pure-twist helicoid (H = 0, R = 0) to a cylindrical helical ribbon (H → ±(1-ν)κ_0/2, K → 0) when dimensionless valve width exceeds w̃_c"
    source_citation: "Armon, Efrati, Kupferman & Sharon (2011) Science 333(6050):1726-1730 Eq. 1-4; Armon et al. (2014) Soft Matter 10:2733-2740"
    code_locus: "2007-liang-chiral-seed-pod-opening.py#L240-L445"

  - law_name: "Freund Dynamic Mode-I Suture Crack Equation of Motion & Griffith Arrest Law (Pass 3)"
    formula: "G = B_eff (κ_0² − e_final) W / h,  B_eff = Y h³ / (12(1+ν));  da/dt = v = c_R max(0, 1 − Γ_c(a)/G)  ⇔  G v = c_R (G − Γ_c);  arrest when Γ_c ≥ G;  v < c_R"
    lean_decl: "MathOfBiology.Loop_065.freund_scaled_crack_speed"
    lean_theorem: "MathOfBiology.Loop_065.freund_crack_speed_arrest_and_monotonicity"
    lean_locus: "morphoeval/lean/loops/Loop_065_chiral_seed_pod_opening.lean#L126-L149"
    lean_code: |
      def freund_scaled_crack_speed (cR G gamma : Int) : Int :=
        cR * (G - gamma)
      theorem freund_crack_speed_arrest_and_monotonicity (cR G1 G2 gamma : Int) :
          freund_scaled_crack_speed cR gamma gamma = 0 ∧
          (0 < cR → gamma < G1 → 0 < freund_scaled_crack_speed cR G1 gamma) ∧
          (0 ≤ cR → G1 ≤ G2 →
            freund_scaled_crack_speed cR G1 gamma ≤ freund_scaled_crack_speed cR G2 gamma) ∧
          (0 < cR → 0 < gamma → freund_scaled_crack_speed cR G1 gamma < cR * G1)
    variables: "G: suture energy release rate from the quasi-static minimizer (J/m²); Γ_c(a): heterogeneous suture fracture toughness (J/m², provenance=model); c_R = 0.93 √(Y/(2(1+ν)ρ)): Rayleigh wave speed (m/s); v: crack-tip speed (m/s); a: crack position along the suture (m)"
    role: "Couples the stored incompatible-shell bending energy of the closed pod (Pass 2 minimizer) to transient crack propagation along the suture: the crack runs only where released energy exceeds the local toughness, at sub-Rayleigh speed, and arrests (stick-slip, drying-controlled) where Γ_c(a) ≥ G(t)"
    source_citation: "Freund LB (1990) Dynamic Fracture Mechanics, Cambridge University Press, Ch. 7 (doi 10.1017/CBO9780511546761, unverified offline); Efrati, Sharon & Kupferman (2009) JMPS 57:762-775 for B_eff"
    code_locus: "2007-liang-chiral-seed-pod-opening.py#L733-L859"
    code_locus_secondary: "2007-liang-chiral-seed-pod-opening.py#L932-L1160"

  - law_name: "Elastic-Catapult Energy Partition & Ballistic Seed Ejection Law (Pass 3)"
    formula: "ΔU_seg = B_eff (κ_0² − e_final) W l_seg ≥ 0;  KE = η ΔU_seg,  0 ≤ η ≤ 1;  v_seed = √(2 η ΔU_seg / (m_seg/3 + m_seed));  m dv/dt = m g − ½ ρ_air C_d A |v| v"
    lean_decl: "MathOfBiology.Loop_065.released_elastic_energy"
    lean_theorem: "MathOfBiology.Loop_065.elastic_catapult_energy_partition"
    lean_locus: "morphoeval/lean/loops/Loop_065_chiral_seed_pod_opening.lean#L164-L189"
    lean_code: |
      def released_elastic_energy (e_init e_final : Int) : Int :=
        e_init - e_final
      def catapult_kinetic_energy (eta dU : Int) : Int :=
        eta * dU
      theorem elastic_catapult_energy_partition (e_init e_final eta dU1 dU2 : Int) :
          (e_final ≤ e_init → 0 ≤ released_elastic_energy e_init e_final) ∧
          (0 ≤ eta → 0 ≤ dU1 → 0 ≤ catapult_kinetic_energy eta dU1) ∧
          (eta ≤ 1 → 0 ≤ dU1 → catapult_kinetic_energy eta dU1 ≤ dU1) ∧
          released_elastic_energy 0 0 = 0 ∧
          catapult_kinetic_energy eta (dU1 + dU2) =
            catapult_kinetic_energy eta dU1 + catapult_kinetic_energy eta dU2
    variables: "e_init = κ_0²: reduced bending energy of the flat closed valve; e_final: relaxed minimizer energy; ΔU_seg: released energy per seed-bearing valve segment (J); η: catapult efficiency (provenance=model); m_seg/3 + m_seed: effective launched mass (kg); v_seed: launch speed (m/s); C_d, A: seed drag coefficient and area"
    role: "Turns the released non-Euclidean shell energy into a ballistic seed launch speed and drag-limited range; proves energy descent (ΔU ≥ 0), no energy creation (KE ≤ ΔU), vanishing release for the κ_0 = 0 control, and additivity over seed segments"
    source_citation: "Vogel S (2005) J. Biosci. 30:167-175 (doi 10.1007/BF02703696, unverified offline); Hofhuis et al. (2016) Cell 166:222-233 (doi 10.1016/j.cell.2016.05.002, unverified offline) as transfer-boundary launch-speed benchmark; Swaine & Beer (1977) New Phytol. 78:695-708"
    code_locus: "2007-liang-chiral-seed-pod-opening.py#L861-L930"
    code_locus_secondary: "2007-liang-chiral-seed-pod-opening.py#L1779-L1944"
