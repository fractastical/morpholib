- law_name: Helicospiral Aperture Translation Scaling
  formula: z(theta) = T * r_0 * (W^(theta / (2 pi)) - 1)
  lean_decl: MathOfBiology.Loop_1860.law2_balance
  lean_theorem: MathOfBiology.Loop_1860.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1860_archaeopteryx_lithographica_biomineral_accretion.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

