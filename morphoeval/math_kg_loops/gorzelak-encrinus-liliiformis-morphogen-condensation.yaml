- law_name: French-Flag Boundary Position Scaling
  formula: x_theta = lambda_m ln(C_0 / theta_c)
  lean_decl: MathOfBiology.Loop_1361.law2_balance
  lean_theorem: MathOfBiology.Loop_1361.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1361_encrinus_liliiformis_morphogen_condensation.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Skeletal Rays & Joints in Encrinus liliiformis (2.8\
    \ \xB5m)"
  source_citation: Gorzelak (2015) DOI:10.1130/geol.2015.1361
  code_locus: models/2015-gorzelak-encrinus-liliiformis-morphogen-condensation.py#L31-L48
- law_name: Periodic Condensation Wavelength under Cell Traction
  formula: k_cond^2 = (tau_0 n_0 - E_ecm) / (2 mu_b)
