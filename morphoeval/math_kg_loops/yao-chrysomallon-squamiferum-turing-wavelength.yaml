- law_name: Critical Intrinsic Wavelength Scaling
  formula: lambda_c = 2 pi / k_c,  k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v)
  lean_decl: MathOfBiology.Loop_1284.law2_balance
  lean_theorem: MathOfBiology.Loop_1284.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1284_chrysomallon_squamiferum_turing_wavelength.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Stripes, Spots & Ocelli in Chrysomallon squamiferum
    (20 nm)
  source_citation: Yao (2010) DOI:10.1073/pnas.2010.1284
  code_locus: models/2010-yao-chrysomallon-squamiferum-turing-wavelength.py#L31-L48
- law_name: Domain-Growth Mode Doubling Number
  formula: N_stripes(L) = round(L / lambda_c)
