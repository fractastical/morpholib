- law_name: Critical Compressive Buckling Strain Threshold
  formula: epsilon_c = (1 / 4) (3 E_s / E_f)^(2/3)
  lean_decl: MathOfBiology.Loop_1147.law2_balance
  lean_theorem: MathOfBiology.Loop_1147.law2_exact_cancellation
