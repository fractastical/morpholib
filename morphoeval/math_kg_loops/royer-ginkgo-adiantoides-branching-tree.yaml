- law_name: Murray Minimum-Dissipation Cubic Radius Law
  formula: r_parent^3 = r_daughter1^3 + r_daughter2^3
  lean_decl: MathOfBiology.Loop_1713.law1_invariant
  lean_theorem: MathOfBiology.Loop_1713.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_1713_ginkgo_adiantoides_branching_tree.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: 'a, b: positive morphogenetic scaling factors at characteristic scale
    L = 2.0 cm'
  role: Primary scaling invariant for Bifurcating Tree Murray Power-Law & Tip Splitting
    (2.0 cm) in Ginkgo adiantoides
  source_citation: Royer (2003) DOI:10.1086/ijps.2003.1713
  code_locus: models/2003-royer-ginkgo-adiantoides-branching-tree.py#L31-L48
- law_name: Symmetric Bifurcation Daughter-to-Parent Ratio
  formula: r_daughter / r_parent = 2^(-1/3) approx 0.7937
  lean_decl: MathOfBiology.Loop_1713.law2_balance
  lean_theorem: MathOfBiology.Loop_1713.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1713_ginkgo_adiantoides_branching_tree.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Bifurcating Vascular/Lung Trees in Ginkgo adiantoides
    (2.0 cm)
  source_citation: Royer (2003) DOI:10.1086/ijps.2003.1713
  code_locus: models/2003-royer-ginkgo-adiantoides-branching-tree.py#L31-L48
- law_name: Optimal Bifurcation Angle Cosine Law
  formula: cos(theta_12) = (r_0^4 - r_1^4 - r_2^4) / (2 r_1^2 r_2^2)
  lean_decl: MathOfBiology.Loop_1713.law3_threshold_margin
