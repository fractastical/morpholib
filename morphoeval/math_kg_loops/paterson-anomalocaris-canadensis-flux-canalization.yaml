- law_name: Steady-State Vein Conductance Equilibrium
  formula: D_ij^* = (alpha_f / beta_d) |J_ij|^gamma
  lean_decl: MathOfBiology.Loop_1518.law2_balance
  lean_theorem: MathOfBiology.Loop_1518.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1518_anomalocaris_canadensis_flux_canalization.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
