sim_id: nelson-airway-mucosal-creasing
math_family: "Cylindrical Neo-Hookean Bilayer Morphoelastic Buckling, Post-Buckling Period-Doubling & Sulcal Creasing Driving Hagen–Poiseuille Airway Resistance, Coupled to a Dichotomous Bronchial-Tree Impedance Network with Flow–Stretch Feedback"
model_spec:
  model: "Wiggs et al. (1997) J. Appl. Physiol. 83:1814-1821, Li et al. (2011) JMPS 59:758-774, Jin et al. (2011) JAM 78:031009 & Eskandari et al. (2015) J. Theor. Biol. 403:209-218 cylindrical bilayer mucosal buckling, period-doubling, and Poiseuille lumen occlusion"
  R_0_um: 600.0
  c_fold_occlusion: 2.35
  alpha_period_doubling: 0.42
  beta_sulcal_crease: 0.28
  epsilon_crease_universal: 0.35
  n_theta_grid: 360
  seed: 2018
  tree_max_generation: 12
  air_dynamic_viscosity_Pa_s: 1.81e-5
  asm_strain_sigma: 0.10
  venegas_feedback_kappa: 0.2
  ventilation_defect_threshold: 0.5
  inputs:
    - datasets/airway_mucosal_creasing/airway_mucosal_creasing_reference.json
    - datasets/airway_mucosal_creasing/bronchial_tree_impedance_reference.json
    - datasets/airway_mucosal_creasing/pass3_citations.bib
    - datasets/airway_mucosal_creasing/bronchiole_mucosal_rosette_specimen.jpg
    - datasets/airway_mucosal_creasing/scout_manifest.json
    - datasets/airway_mucosal_creasing/paper_citations.bib
equations:
  - law_name: "Cylindrical Bilayer Mucosal Buckling Wavenumber & Inverse Thickness Scaling Law"
    formula: "λ_c = 2π h_m (μ_m / (3 μ_s))^(1/3),  m* = (R_0 / h_m) (3 μ_s / μ_m)^(1/3)  ⇒  h_asthma > h_normal ⟹ m*_asthma < m*_normal"
    lean_decl: "MathOfBiology.Loop_068.scaled_fold_mode_normal"
    lean_theorem: "MathOfBiology.Loop_068.inverse_mucosal_thickness_fold_scaling"
    lean_locus: "morphoeval/lean/loops/Loop_068_airway_mucosal_creasing.lean#L32-L46"
    lean_code: |
      def scaled_fold_mode_normal (c_geom h0 dh : Nat) : Nat :=
        (c_geom + 1) * (h0 + dh + 2)
      def scaled_fold_mode_asthma (c_geom h0 : Nat) : Nat :=
        (c_geom + 1) * (h0 + 1)
      theorem inverse_mucosal_thickness_fold_scaling (c_geom h0 dh : Nat) :
          (h0 + 1) < (h0 + dh + 2) ∧
          scaled_fold_mode_asthma c_geom h0 < scaled_fold_mode_normal c_geom h0 dh
    variables: "R_0: inner luminal radius; h_m: epithelial/basement-membrane mucosal thickness; μ_m, μ_s: mucosal and submucosal shear moduli; m*: circumferential rosette fold number"
    role: "Determines why thin healthy bronchioles buckle into many shallow rosette folds (m* ≈ 14) whereas thickened asthmatic airways buckle into a few deep folds (m* ≈ 5–6)"
    source_citation: "Li, Cao, Feng & Gao (2011) J. Mech. Phys. Solids 59:758-774 Eq. (18); Eskandari, Pfaller & Kuhl (2015) J. Theor. Biol. 403:209-218 Eq. (14)"
    code_locus: "2018-nelson-airway-mucosal-creasing.py#L204-L223"

  - law_name: "Inextensible Mucosal Perimeter Fold-Depth & Lumen-Area Occlusion Law"
    formula: "A_lumen(ε_θ, m) = A_ASM(ε_θ) - A_wall - (P_0^2 Δ_fold(ε_θ)) / (8π m)  ⇒  m_asthma < m_normal ⟹ A_lumen(m_asthma) < A_lumen(m_normal)"
    lean_decl: "MathOfBiology.Loop_068.open_lumen_area_scaled"
    lean_theorem: "MathOfBiology.Loop_068.inextensible_perimeter_lumen_occlusion"
    lean_locus: "morphoeval/lean/loops/Loop_068_airway_mucosal_creasing.lean#L62-L81"
    lean_code: |
      def fold_occlusion_penalty_scaled (k_fold m_other : Nat) : Nat :=
        (k_fold + 1) * m_other
      def open_lumen_area_scaled (a_net k_fold m_self m_other : Nat) : Int :=
        (a_net : Int) - ↑((k_fold + 1) * m_other) + 0 * (m_self : Int)
      theorem inextensible_perimeter_lumen_occlusion (a_net k_fold m0 dm : Nat) :
          fold_occlusion_penalty_scaled k_fold (m0 + 1) <
            fold_occlusion_penalty_scaled k_fold (m0 + dm + 2) ∧
          open_lumen_area_scaled a_net k_fold (m0 + 1) (m0 + dm + 2) <
            open_lumen_area_scaled a_net k_fold (m0 + dm + 2) (m0 + 1)
    variables: "P_0 = 2π R_0: inextensible mucosal perimeter; ε_θ: ASM circumferential shortening strain; m: integer fold mode number; A_lumen: open luminal cross-sectional area"
    role: "Proves that at identical smooth-muscle shortening ε_θ, lower circumferential mode number m forces deeper inward fold intrusion and smaller open luminal area"
    source_citation: "Wiggs, Hrousis, Drazen & Kamm (1997) J. Appl. Physiol. 83:1814-1821 Eqs. (2)-(6); Jin, Auguste, Hayward & Suo (2011) J. Appl. Mech. 78:031009"
    code_locus: "2018-nelson-airway-mucosal-creasing.py#L282-L486"

  - law_name: "Hagen–Poiseuille Quadratic Lumen-Area Airway Resistance Amplification Law"
    formula: "R_flow / R_flow,0 = (A_0 / A_lumen)^2  ⇒  0 < A_asthma < A_normal ⟹ R_flow,asthma > R_flow,normal"
    lean_decl: "MathOfBiology.Loop_068.poiseuille_conductance_sq"
    lean_theorem: "MathOfBiology.Loop_068.poiseuille_quadratic_area_resistance_amplification"
    lean_locus: "morphoeval/lean/loops/Loop_068_airway_mucosal_creasing.lean#L96-L106"
    lean_code: |
      def poiseuille_conductance_sq (a_lumen : Nat) : Nat :=
        a_lumen * a_lumen
      theorem poiseuille_quadratic_area_resistance_amplification (a0 da : Nat) :
          (a0 + 1) < (a0 + da + 2) ∧
          poiseuille_conductance_sq (a0 + 1) < poiseuille_conductance_sq (a0 + da + 2)
    variables: "R_flow: laminar Hagen–Poiseuille airway resistance; A_0 = π R_0^2: relaxed baseline lumen area; A_asthma, A_normal: constricted lumen areas"
    role: "Governs the catastrophic (>15-fold) surge in airflow resistance during asthmatic bronchoconstriction due to period-doubling and deep mucosal creasing"
    source_citation: "Wiggs, Hrousis, Drazen & Kamm (1997) J. Appl. Physiol. 83:1814-1821 Eq. (7)"
    code_locus: "2018-nelson-airway-mucosal-creasing.py#L225-L243"

  - law_name: "Series–Parallel Bifurcation Impedance Homogeneous Scaling Law (Pass 3)"
    formula: "R_i = 8η L_i/(π r_i^4) (A_0/A_lumen,i)^2;  R_sub(i) = R_i + 1/(1/R_sub(2i+1) + 1/R_sub(2i+2))  ⇒  R_i → k R_i ∀i ⟹ R_sub → k R_sub  ⟹  R_tree/R_tree,0 = (A_0/A_lumen)^2 under homogeneous bronchospasm"
    lean_decl: "MathOfBiology.Loop_068.bifurcation_subtree_num"
    lean_theorem: "MathOfBiology.Loop_068.bifurcation_resistance_homogeneous_scaling"
    lean_locus: "morphoeval/lean/loops/Loop_068_airway_mucosal_creasing.lean#L124-L138"
    lean_code: |
      def bifurcation_subtree_num (rp ra rb : Nat) : Nat :=
        rp * (ra + rb) + ra * rb
      def bifurcation_subtree_den (ra rb : Nat) : Nat :=
        ra + rb
      theorem bifurcation_resistance_homogeneous_scaling (k rp ra rb : Nat) :
          bifurcation_subtree_num (k * rp) (k * ra) (k * rb) =
            k * (k * bifurcation_subtree_num rp ra rb) ∧
          bifurcation_subtree_den (k * ra) (k * rb) = k * bifurcation_subtree_den ra rb
    variables: "R_i: Hagen–Poiseuille resistance of branch i (Weibel 1963 model A diameter d_i, length L_i, air viscosity η = 1.81e-5 Pa s); k = (A_0/A_lumen)^2: Law-3 single-airway amplification; R_sub: subtree impedance; R_tree: whole-tree resistance"
    role: "Couples the 1D ring law to the 3D bronchial tree: proves that the exact series–parallel network reduces to the single-airway Poiseuille ratio when constriction is homogeneous, giving the identity check (1.000000 to 1e-9) against which heterogeneous ventilation defects are measured"
    source_citation: "Weibel ER (1963) Morphometry of the Human Lung, Springer (10.1007/978-3-642-87553-3); Wiggs BR, Bosken C, Paré PD, James A, Hogg JC (1992) Am Rev Respir Dis 145:1251-1258 (10.1164/ajrccm/145.6.1251); Macklem PT & Mead J (1967) J Appl Physiol 22:395-401"
    code_locus: "2018-nelson-airway-mucosal-creasing.py#L794-L823"
    code_locus_secondary: "2018-nelson-airway-mucosal-creasing.py#L734-L850"

  - law_name: "Venegas Flow–Stretch Positive-Feedback Monotonicity Law (Pass 3)"
    formula: "ε_i ← clip(ε_i^(0) (1 + κ tanh(1 − Q_i/⟨Q⟩_gen)), 0, ε_max);  Q_low < Q_high ⟹ ε(Q_low) > ε(Q_high)  ⟹ (Laws 1–3) R_i(Q_low) > R_i(Q_high): self-organised ventilation defects (terminal Q < 0.5⟨Q⟩)"
    lean_decl: "MathOfBiology.Loop_068.feedback_strain_scaled"
    lean_theorem: "MathOfBiology.Loop_068.venegas_feedback_strain_monotone"
    lean_locus: "morphoeval/lean/loops/Loop_068_airway_mucosal_creasing.lean#L155-L175"
    lean_code: |
      def feedback_strain_scaled (e0 kappa q_mean q : Nat) : Int :=
        ((e0 + 1 : Nat) : Int) * (((q_mean * (kappa + 1) : Nat) : Int) - (((kappa + 1) * q : Nat) : Int))
      theorem venegas_feedback_strain_monotone (e0 kappa q_mean q0 dq : Nat) :
          (q0 + 1) < (q0 + dq + 2) ∧
          feedback_strain_scaled e0 kappa q_mean (q0 + dq + 2) <
            feedback_strain_scaled e0 kappa q_mean (q0 + 1)
    variables: "ε_i^(0): log-normal (σ = 0.10) baseline ASM shortening of branch i; κ: flow–stretch feedback gain (0.2 default, calibrated on the healthy control); Q_i/⟨Q⟩_gen: tidal stretch relative to the generation mean at fixed tidal volume; ε_max = 0.45"
    role: "Drives heterogeneous ventilation defects during asthmatic bronchospasm: identical ASM heterogeneity yields ~4% defective terminals in the thin-walled Healthy tree but ~35% in the thick-walled Severe-Asthma tree (Venegas 2005 PET: ~20–40%), with whole-tree resistance amplification above the homogeneous lower bound"
    source_citation: "Venegas JG, Winkler T, Musch G, Vidal Melo MF, Layfield D, Tgavalekos N, Fischman AJ, Callahan RJ, Bellardine C, Harris RS (2005) Nature 434:777-782 (10.1038/nature03490)"
    code_locus: "2018-nelson-airway-mucosal-creasing.py#L852-L1009"
    code_locus_secondary: "2018-nelson-airway-mucosal-creasing.py#L1012-L1052"
