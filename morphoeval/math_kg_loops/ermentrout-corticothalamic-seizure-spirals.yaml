sim_id: ermentrout-corticothalamic-seizure-spirals
math_family: 2D Excitatory-Inhibitory Wilson-Cowan / Pinto-Ermentrout Neural Field with Spike-Frequency Adaptation Generating Rotating Spiral Phase Singularities
model_spec:
  model: Huang et al. (2004) J. Neurosci. 24(44):9897-9902, Huang et al. (2010) J. Neurosci. 30(30):10158-10164, Pinto & Ermentrout (2001) SIAM J. Appl. Math. 62(1):206-225 & Townsend et al. (2015) J. Neurosci. 35(11):4657-4662 neocortical spiral wave dynamics and topological phase singularity core reduction
  neural_field_pde: "tau_u * du(x,t)/dt = -u + D_u * nabla^2 u + F(w_ee * (K_e * u)(x,t) - g_a * a(x,t) + I_ext),   tau_a * da(x,t)/dt = -a + u"
  axonal_footprint_and_gain: "K_e(r) = (1 / (2*pi*sigma_e^2)) * exp(-r^2 / (2*sigma_e^2)),   F(z) = 1 / (1 + exp(-beta_f * (z - theta_f)))"
  topological_phase_winding: "W = (1 / (2*pi)) * oint_C nabla phi . dl = +/-1,   A(r) = A_inf * tanh(r / r_core),   sum_i W_i = 0 for wave-break dipole pair"
  spiral_dispersion_law: "lambda_spiral = c_wave / f_rot,   c_wave propto sigma_e * f_rot"
  parameters:
    N_grid: 64
    domain_mm: 6.0
    tau_u_ms: 10.0
    tau_a_ms: 35.0
    D_u_mm2_ms: 0.012
    w_ee: 6.4
    g_a: 4.2
    beta_f: 4.0
    theta_f: 0.45
    I_ext: 0.12
    sigma_e_mm: 0.42
    seed: 2013
  inputs:
    - datasets/corticothalamic_seizure_spirals/corticothalamic_seizure_spirals_reference.json
    - datasets/corticothalamic_seizure_spirals/rat_neocortical_tangential_sheet_specimen.jpg
    - datasets/corticothalamic_seizure_spirals/scout_manifest.json
    - datasets/corticothalamic_seizure_spirals/paper_citations.bib
equations:
  - law_name: "Pinto & Ermentrout (2001) / Huang et al. (2004, 2010) Excitatory-Adaptation Jacobian Trace-Determinant Hopf Instability & CNQX/AMPA Blockade Law"
    formula: "Tr_num(w_eff, tau_u, tau_a) = (w_eff - 1)*tau_a - tau_u > 0,   Det_num(w_eff, g_eff) = g_eff - (w_eff - 1) > 0;   w_eff = 0 ==> Tr_num = -(tau_a + tau_u) < 0"
    lean_decl: "MathOfBiology.Loop_089.hopf_trace_num"
    lean_theorem: "MathOfBiology.Loop_089.wilson_cowan_hopf_trace_determinant"
    lean_locus: "morphoeval/lean/loops/Loop_089_corticothalamic_seizure_spirals.lean#L24-L66"
    lean_code: |
      def hopf_trace_num (w_eff tau_u tau_a : Int) : Int :=
        (w_eff - 1) * tau_a - tau_u
      def hopf_det_num (w_eff g_eff : Int) : Int :=
        g_eff - (w_eff - 1)
      theorem wilson_cowan_hopf_trace_determinant
          (w_eff g_eff tau_u tau_a : Int)
          (h_tu : tau_u > 0)
          (h_ta : tau_a > 0)
          (h_super : (w_eff - 1) * tau_a > tau_u)
          (h_adapt : g_eff > w_eff - 1) :
          hopf_trace_num w_eff tau_u tau_a > 0 ∧
          hopf_det_num w_eff g_eff > 0 ∧
          hopf_trace_num 0 tau_u tau_a = -(tau_a + tau_u) ∧
          hopf_trace_num 0 tau_u tau_a < 0 ∧
          hopf_trace_num 3 10 35 = 60 ∧
          hopf_det_num 3 4 = 2 := by
        refine ⟨?_, ?_, ?_, ?_, by decide, by decide⟩
        · dsimp [hopf_trace_num]; omega
        · dsimp [hopf_det_num]; omega
        · dsimp [hopf_trace_num]; omega
        · dsimp [hopf_trace_num]; omega
    variables: "w_eff = w_ee * F'_0: effective excitatory recurrent gain; g_eff = g_a * F'_0: effective adaptation recovery gain; tau_u, tau_a: excitatory and adaptation time constants"
    role: "Proves that supercritical recurrent excitation coupled to slow adaptation satisfies Tr > 0 and Det > 0 (sustaining 10 Hz neocortical spiral oscillations), whereas CNQX/AMPA glutamatergic blockade (w_eff = 0) yields unconditionally negative trace -(tau_a + tau_u) < 0 and collapses wave activity"
    source_citation: "Pinto & Ermentrout (2001) SIAM J. Appl. Math. 62:206-225; Huang et al. (2004) J. Neurosci. 24:9897-9902; Huang et al. (2010) J. Neurosci. 30:10158-10164"
    code_locus: "2013-ermentrout-corticothalamic-seizure-spirals.py#L80-L165"
  - law_name: "Huang et al. (2004, 2010) Plaquette Topological Phase Winding Quantization, Core Amplitude Null & Wave-Break Dipole Neutrality Law"
    formula: "W = (1/(2*pi)) * oint_C nabla phi . dl in {-1, +1},   W_+ + W_- = (+1) + (-1) = 0,   |W_+| + |W_-| = 2,   A(0) = 0"
    lean_decl: "MathOfBiology.Loop_089.dipole_net_charge"
    lean_theorem: "MathOfBiology.Loop_089.topological_winding_dipole_neutrality"
    lean_locus: "morphoeval/lean/loops/Loop_089_corticothalamic_seizure_spirals.lean#L69-L111"
    lean_code: |
      def plaquette_winding_sum (d1 d2 d3 d4 : Int) : Int :=
        d1 + d2 + d3 + d4
      def dipole_net_charge (w_plus w_minus : Int) : Int :=
        w_plus + w_minus
      def dipole_defect_count (w_plus w_minus : Int) : Nat :=
        w_plus.natAbs + w_minus.natAbs
      def core_amplitude_linear (r A_inf : Int) : Int :=
        r * A_inf
      theorem topological_winding_dipole_neutrality (A_inf r : Int) (h_r : r > 0) (h_a : A_inf > 0) :
          plaquette_winding_sum 1 1 1 1 = 4 ∧
          plaquette_winding_sum (-1) (-1) (-1) (-1) = -4 ∧
          dipole_net_charge 1 (-1) = 0 ∧
          dipole_defect_count 1 (-1) = 2 ∧
          dipole_defect_count 0 0 = 0 ∧
          core_amplitude_linear 0 A_inf = 0 ∧
          core_amplitude_linear r A_inf > 0 := by
        refine ⟨by decide, by decide, by decide, by decide, by decide, ?_, ?_⟩
        · dsimp [core_amplitude_linear]; omega
        · dsimp [core_amplitude_linear]; exact Int.mul_pos h_r h_a
    variables: "d1..d4: quarter-turn phase differences around a 2x2 cortical plaquette; w_plus = +1, w_minus = -1: counter-rotating spiral charges; r: radial distance from singularity core; A_inf: far-field oscillation amplitude"
    role: "Proves topological winding quantization W = +/-1 around a phase singularity, exact net charge neutrality (W_+ + W_- = 0) and defect pair count (2) when nucleated from a broken planar wave front, and vanishing core oscillation amplitude A(0) = 0"
    source_citation: "Huang et al. (2010) J. Neurosci. 30(30):10158-10164 Figs. 2-4; Townsend et al. (2015) J. Neurosci. 35(11):4657-4662"
    code_locus: "2013-ermentrout-corticothalamic-seizure-spirals.py#L168-L260"
  - law_name: "Pinto & Ermentrout (2001) Spiral Wavelength-Speed Dispersion & Horizontal Axonal Footprint Scaling Law"
    formula: "c_wave = lambda_spiral * f_rot = (kappa * sigma_e) * f_rot,   c_wave(2*sigma_e) = 2 * c_wave(sigma_e)"
    lean_decl: "MathOfBiology.Loop_089.spiral_wave_speed"
    lean_theorem: "MathOfBiology.Loop_089.spiral_dispersion_axonal_footprint_scaling"
    lean_locus: "morphoeval/lean/loops/Loop_089_corticothalamic_seizure_spirals.lean#L114-L157"
    lean_code: |
      def spiral_wavelength (sigma_e kappa : Int) : Int :=
        kappa * sigma_e
      def spiral_wave_speed (sigma_e kappa f_rot : Int) : Int :=
        spiral_wavelength sigma_e kappa * f_rot
      theorem spiral_dispersion_axonal_footprint_scaling (sigma_e delta_sigma kappa f_rot : Int) :
          spiral_wave_speed (sigma_e + delta_sigma) kappa f_rot =
            spiral_wave_speed sigma_e kappa f_rot + spiral_wave_speed delta_sigma kappa f_rot ∧
          spiral_wavelength (2 * sigma_e) kappa = 2 * spiral_wavelength sigma_e kappa ∧
          spiral_wave_speed (2 * sigma_e) kappa f_rot = 2 * spiral_wave_speed sigma_e kappa f_rot ∧
          spiral_wave_speed 0 kappa f_rot = 0 ∧
          spiral_wave_speed 4 10 11 = 440 := by
        refine ⟨?_, ?_, ?_, ?_, by decide⟩
        · dsimp [spiral_wave_speed, spiral_wavelength]
          rw [Int.mul_add kappa sigma_e delta_sigma]
          rw [Int.add_mul (kappa * sigma_e) (kappa * delta_sigma) f_rot]
        · dsimp [spiral_wavelength]
          rw [Int.mul_comm kappa (2 * sigma_e), Int.mul_assoc 2 sigma_e kappa, Int.mul_comm sigma_e kappa]
        · dsimp [spiral_wave_speed, spiral_wavelength]
          rw [Int.mul_comm kappa (2 * sigma_e), Int.mul_assoc 2 sigma_e kappa, Int.mul_comm sigma_e kappa, Int.mul_assoc 2 (kappa * sigma_e) f_rot]
        · dsimp [spiral_wave_speed, spiral_wavelength]; omega
    variables: "sigma_e: horizontal intracortical excitatory axonal footprint (mm); kappa: dimensionless spatial dispersion factor; f_rot: spiral rotation frequency (Hz)"
    role: "Proves exact bilinear scaling of radial cortical wave speed c_wave = lambda_spiral * f_rot with horizontal excitatory axonal footprint sigma_e"
    source_citation: "Pinto & Ermentrout (2001) SIAM J. Appl. Math. 62(1):206-225; Huang et al. (2004) J. Neurosci. 24(44):9897-9902"
    code_locus: "2013-ermentrout-corticothalamic-seizure-spirals.py#L263-L355"
