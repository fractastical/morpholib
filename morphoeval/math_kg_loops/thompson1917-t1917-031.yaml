equations:
  - law_name: "Logarithmic-spiral whorl-ratio invariance (E1/E3, gnomonic growth)"
    formula: "rho(theta) = a exp(k theta),  R = rho(theta + 2 pi) / rho(theta) = exp(2 pi k) = exp(2 pi sin(beta) cot(alpha));  discretised rho_n = a R^n"
    lean_decl: "MathOfBiology.Loop_225.rho"
    lean_theorem: "MathOfBiology.Loop_225.lag_ratio_independent_of_position"
    lean_locus: "morphoeval/lean/loops/Thompson1917_T1917_031.lean#L32-L52"
    lean_code: |
      def rho (a R n : Nat) : Nat := a * R ^ n
      theorem whorl_ratio_invariant (a R n : Nat) : rho a R (n + 1) = R * rho a R n
      theorem lag_ratio_independent_of_position (a R n m k : Nat) :
          rho a R (n + m) * rho a R k = rho a R (k + m) * rho a R n
    variables: "a: radius at the tip (theta = 0); R: whorl ratio; n, m, k: whorl indices; alpha: spiral angle; beta: cone semi-angle"
    role: "Thompson's theorem of gnomons (Ch. XI p. 513) applied to the horn: every increment is similar to the whole, so the lag-m radius ratio is position-independent"
    source_citation: "Thompson (1917) On Growth and Form, Ch. XI pp. 508-518, 558; Ch. XIII pp. 616-617"
    code_locus: "thompson/claims/t1917-031_the-shapes-of-horns-and-of-teeth-or-tusks-with-a.py#L85-L118"

  - law_name: "Gnomonic breadth law (E4): horn breadth shares the edge whorl ratio"
    formula: "w(theta) = c rho(theta)  =>  w_{n+1} rho_n = w_n rho_{n+1}  (k_breadth = k_edge)"
    lean_decl: "MathOfBiology.Loop_225.breadth"
    lean_theorem: "MathOfBiology.Loop_225.breadth_shares_whorl_ratio"
    lean_locus: "morphoeval/lean/loops/Thompson1917_T1917_031.lean#L35-L60"
    lean_code: |
      def breadth (c a R n : Nat) : Nat := c * rho a R n
      theorem breadth_shares_whorl_ratio (c a R n : Nat) :
          breadth c a R (n + 1) * rho a R n = breadth c a R n * rho a R (n + 1)
    variables: "c: breadth-to-radius ratio of the generating curve; w_n: breadth across the whorl at whorl n"
    role: "Projection-invariant test of self-similar (gnomonic) growth used in the script: the breadth decay exponent must equal the edge-radius exponent"
    source_citation: "Thompson (1917) Ch. XIII p. 618 ('tapering of the horn due to the growth in its own plane of the generating curve')"
    code_locus: "thompson/claims/t1917-031_the-shapes-of-horns-and-of-teeth-or-tusks-with-a.py#L120-L141"

  - law_name: "Projected pitch of a spiral on a cone (E2) and its non-identifiability from one view"
    formula: "k_proj = sin(beta) cot(alpha);  d k_proj / d beta > 0 for fixed alpha;  (alpha, beta) not recoverable from k_proj alone"
    lean_decl: "MathOfBiology.Loop_225.projected_pitch"
    lean_theorem: "MathOfBiology.Loop_225.alpha_beta_not_identifiable_from_projection"
    lean_locus: "morphoeval/lean/loops/Thompson1917_T1917_031.lean#L81-L101"
    lean_code: |
      def projected_pitch (s c : Int) : Int := s * c
      theorem acute_cone_shrinks_projected_pitch (s₁ s₂ c : Int) (hc : 0 < c) (h : s₁ < s₂) :
          projected_pitch s₁ c < projected_pitch s₂ c
      theorem alpha_beta_not_identifiable_from_projection :
          ∃ s₁ c₁ s₂ c₂ : Int, projected_pitch s₁ c₁ = projected_pitch s₂ c₂ ∧ (s₁ ≠ s₂ ∨ c₁ ≠ c₂)
    variables: "s: scaled sin(beta); c: scaled cot(alpha)"
    role: "Explains why Thompson's own Fig. 320 projects at alpha_proj = 84 deg while he quotes alpha ~ 75 deg: an enveloping cone with beta ~ 22 deg flattens the projected pitch; the real Argali photograph projects at 74.7 deg"
    source_citation: "Thompson (1917) Ch. XI p. 558 (R = e^{2 pi sin beta cot alpha}); Ch. XIII pp. 617-618 (O. poli vs O. ammon differ in the cone)"
    code_locus: "thompson/claims/t1917-031_the-shapes-of-horns-and-of-teeth-or-tusks-with-a.py#L90-L111"

  - law_name: "Unequal basal growth velocities generate curvature (E5)"
    formula: "L_out(n) = n v_out, L_in(n) = n v_in;  L_out v_in = L_in v_out (constant ratio);  v_in < v_out => L_in(n) < L_out(n)"
    lean_decl: "MathOfBiology.Loop_225.edge_length"
    lean_theorem: "MathOfBiology.Loop_225.outer_faster_curves"
    lean_locus: "morphoeval/lean/loops/Thompson1917_T1917_031.lean#L105-L123"
    lean_code: |
      def edge_length (v n : Nat) : Nat := n * v
      theorem edge_ratio_constant (v_out v_in n : Nat) :
          edge_length v_out n * v_in = edge_length v_in n * v_out
      theorem outer_faster_curves (v_out v_in n : Nat) (hn : 0 < n) (h : v_in < v_out) :
          edge_length v_in n < edge_length v_out n
    variables: "v_out, v_in: net longitudinal growth velocities on opposite sides of the basal annulus; n: number of accretion steps"
    role: "Thompson's summary argument (p. 619-620): a constant velocity ratio gives a logarithmic spiral, equal velocities a straight horn, and the sign of the inequality the homonymous/heteronymous handedness"
    source_citation: "Thompson (1917) Ch. XIII pp. 616, 619-620"
    code_locus: "thompson/claims/t1917-031_the-shapes-of-horns-and-of-teeth-or-tusks-with-a.py#L852-L887"

  - law_name: "Ovis ammon trihedral edge ratio 80:74:45 ~ 9:8:5 (E6) and data-pinned Pass 2 outcomes"
    formula: "ratio_cross_error(L_a, L_b, r_a, r_b) = 100 |L_a r_b - L_b r_a| <= 5 L_b r_b  for (L_a, L_b) = (74, 80), (r_a, r_b) = (8, 9);  delta-AIC(circle - log) = 425 (Fig. 320), 666 (Argali);  Argali alpha_proj 74.7 in [73.6, 75.6] vs 75;  Fig. 320 |k_w| = 0.321 vs |k_out| = 0.131"
    lean_decl: "MathOfBiology.Loop_225.ratio_cross_error"
    lean_theorem: "MathOfBiology.Loop_225.trihedral_cross_error_bound"
    lean_locus: "morphoeval/lean/loops/Thompson1917_T1917_031.lean#L128-L162"
    lean_code: |
      def ratio_cross_error (L_a L_b r_a r_b : Nat) : Nat := 100 * (L_a * r_b - L_b * r_a)
      theorem trihedral_cross_error_bound : ratio_cross_error 74 80 8 9 ≤ 5 * (80 * 8)
      theorem log_spiral_beats_nulls : (10 : Int) ≤ 425 ∧ (10 : Int) ≤ 21 ∧ (10 : Int) ≤ 666
      theorem argali_alpha_matches_thompson : 7364 ≤ 7500 ∧ 7500 ≤ 7558 ∧ 7500 - 7472 ≤ 500
      theorem fig320_not_self_similar : 25 * 1310 < 100 * (3206 - 1310)
    variables: "L_a, L_b: measured edge lengths in cm (inner 74, outer 80); r_a, r_b: reduced integers (8, 9); AIC differences and scaled alpha / pitch values from t1917_031_metrics.json"
    role: "Pins Thompson's own measurement (cardboard-triangle experiment, p. 618) and the script's Pass 2 outcomes (model comparison, Argali alpha match, Fig. 320 self-similarity failure) as decidable integer facts"
    source_citation: "Thompson (1917) Ch. XIII p. 618; this loop's t1917_031_metrics.json"
    code_locus: "thompson/claims/t1917-031_the-shapes-of-horns-and-of-teeth-or-tusks-with-a.py#L428-L437"
