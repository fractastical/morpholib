- law_name: Critical Compressive Buckling Strain Threshold
  formula: epsilon_c = (1 / 4) (3 E_s / E_f)^(2/3)
  lean_decl: MathOfBiology.Loop_1187.law2_balance
  lean_theorem: MathOfBiology.Loop_1187.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1187_danio_rerio_mm32_adult_caudal_fin_flank_stripes_elastic_buckling.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
