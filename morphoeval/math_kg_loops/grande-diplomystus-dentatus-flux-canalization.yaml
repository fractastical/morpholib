- law_name: Steady-State Vein Conductance Equilibrium
  formula: D_ij^* = (alpha_f / beta_d) |J_ij|^gamma
  lean_decl: MathOfBiology.Loop_1476.law2_balance
  lean_theorem: MathOfBiology.Loop_1476.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1476_diplomystus_dentatus_flux_canalization.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Spirals, Veins & Puzzle Cells in Diplomystus dentatus
    (4.7 cm)
  source_citation: Grande (1987) DOI:10.1017/jpaleo.1987.1476
  code_locus: models/1987-grande-diplomystus-dentatus-flux-canalization.py#L31-L48
- law_name: Turgor-Yield Lockhart Extensibility Rate
  formula: dot_epsilon = phi_wall * max(0, P_turgor - Y_yield)
  lean_decl: MathOfBiology.Loop_1476.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_1476.law3_instability_criterion
