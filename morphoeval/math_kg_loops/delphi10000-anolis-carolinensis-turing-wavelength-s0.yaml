- law_name: Homogeneous stability of the Schnakenberg fixed point
  formula: trace(J) = f_u + g_v < 0 and det(J) = f_u g_v - f_v g_u > 0 at (a, b) = (0.055, 0.945)
  lean_decl: MathOfBiology.Loop_3112.traceMilli
  lean_theorem: MathOfBiology.Loop_3112.homogeneous_stable_without_diffusion
