  variables: a, b feed rates; u activator; v inhibitor
  role: Stable base state (trace < 0, det > 0) on which diffusion can select a wavelength
  source_citation: Schnakenberg (1979) J. Theor. Biol. 81:389-400 DOI:10.1016/0022-5193(79)90042-0
  code_locus: models/2026-delphi10000-echinarachnius-parma-turing-wavelength-s0.py#L85-L104
- law_name: Turing wavenumber
  formula: sigma(k) = larger eigenvalue of J - k^2 D; lambda = 2 pi / argmax sigma(k)
