  code_locus: models/2026-delphi10000-echinarachnius-parma-turing-wavelength-s0.py#L107-L128
- law_name: Scale-ladder wavelength count
  formula: n(L) = floor(L / 60 µm); n(10)=0, n(480)=8, n(600)=10; age does not enter
  lean_decl: MathOfBiology.Loop_3214.nWavelengths
  lean_theorem: MathOfBiology.Loop_3214.holocene_480um_patch_holds_eight
  lean_locus: morphoeval/lean/loops/Loop_3214_echinarachnius_parma_turing_wavelength_s0.lean#L36-L43
  variables: L patch length in micrometres
  role: What changes at 60 µm versus the 10 µm predecessor tier and the 600 µm successor tier, at 0 Ma
  source_citation: Slot scale ladder; Seilacher (1979) Paleobiology 5:191-221 is the centimetre-scale test, not this wavelength
  code_locus: models/2026-delphi10000-echinarachnius-parma-turing-wavelength-s0.py#L233-L247
- law_name: Equal-diffusion ablation
  formula: turingTraceGap(Du, Du) < 0 when fu < |gv|
  lean_decl: MathOfBiology.Loop_3214.turingTraceGap
  lean_theorem: MathOfBiology.Loop_3214.equal_diffusion_closes_turing
