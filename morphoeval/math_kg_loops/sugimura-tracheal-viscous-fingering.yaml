sim_id: sugimura-tracheal-viscous-fingering
math_family: "Coupled Laplace–Young Transmural Epithelial Wall Stress, Mechanosensitive FGF10/ERK1/2/Etv4 Tip Bifurcation Rate & Synchronized Airway Smooth Muscle (ASM) Peristaltic Calcium Waves"
model_spec:
  model: "Nelson, Gleghorn, Myers, Radisky & Stone (2017) Development 144(23):4328-4335, Kim et al. (2015) Dev. Cell 34(6):668-681 & Unbekandt et al. (2008) Mech. Dev. 125:314-324 microfluidic chest transmural pressure and ASM peristaltic branching morphogenesis"
  delta_P_crit_Pa: 50.0
  K_P_Pa: 140.0
  hill_exponent_n: 2.0
  Gamma_0_per_day: 1.45
  R_bud_um: 60.0
  h_wall_um: 12.0
  f_ASM_0_per_min: 0.08
  f_ASM_max_per_min: 0.62
  K_ASM_Pa: 150.0
  seed: 2015
  # Pass 3 additions
  cavity_semi_axes_normalized_xyz: [0.50, 0.56, 0.34]
  chest_length_scale_um: 1600.0
  j_Cl_proximal_nL_min_um2: 2.0e-7
  j_Cl_distal_nL_min_um2: 1.2e-6
  lung_liquid_viscosity_Pa_s: 1.0e-3
  closed_glottis_plateau_Pa: 250.0
  R_open_over_R_closed: 0.25
  fbm_open_duty_cycle: 0.40
  fbm_period_min: 40.0
  tau_closed_min: 6.0
  inputs:
    - datasets/tracheal_viscous_fingering/tracheal_viscous_fingering_reference.json
    - datasets/tracheal_viscous_fingering/pleural_cavity_valve_reference.json
    - datasets/tracheal_viscous_fingering/embryonic_lung_branching_specimen.jpg
    - datasets/tracheal_viscous_fingering/scout_manifest.json
    - datasets/tracheal_viscous_fingering/paper_citations.bib
equations:
  - law_name: "Nelson et al. (2017) Microfluidic Chest Transmural Pressure Gauge Invariance Law"
    formula: "ΔP(P_lumen, P_pleura) = P_lumen - P_pleura  ⇒  ΔP(P_lumen + c, P_pleura + c) = ΔP(P_lumen, P_pleura)"
    lean_decl: "MathOfBiology.Loop_059.transmural_pressure"
    lean_theorem: "MathOfBiology.Loop_059.nelson_2017_transmural_pressure_gauge_invariance"
    lean_locus: "morphoeval/lean/loops/Loop_059_tracheal_viscous_fingering.lean#L28-L44"
    lean_code: |
      def transmural_pressure (P_lum P_pl : Int) : Int :=
        P_lum - P_pl
      theorem nelson_2017_transmural_pressure_gauge_invariance
          (P_lum P_pl c P : Int) :
          transmural_pressure (P_lum + c) (P_pl + c) =
            transmural_pressure P_lum P_pl ∧
          transmural_pressure P 0 = transmural_pressure 0 (-P) ∧
          transmural_pressure P P = 0
    variables: "P_lumen: luminal airway fluid pressure (Pa); P_pleura: microfluidic chest pleural cavity pressure (Pa); c: common-mode hydrostatic pressure shift (Pa); ΔP: transmural pressure difference (Pa)"
    role: "Establishes that embryonic lung branching rate and ASM peristaltic wave frequency depend strictly on the transmural difference P_lumen - P_pleura and are invariant under common-mode hydrostatic shifts"
    source_citation: "Nelson, Gleghorn, Myers, Radisky & Stone (2017) Development 144(23):4328-4335 Figs. 1-2"
    code_locus: "2015-sugimura-tracheal-viscous-fingering.py#L120-L195"

  - law_name: "Laplace–Young Circumferential Epithelial Wall Stress Monotonicity Law"
    formula: "σ_θ(ΔP, R, h) = (ΔP · R) / h  ⇒  (R > 0 ∧ h > 0 ∧ ΔP_2 > ΔP_1) ⟹ σ_θ(ΔP_2) > σ_θ(ΔP_1)"
    lean_decl: "MathOfBiology.Loop_059.laplace_hoop_stress_scaled"
    lean_theorem: "MathOfBiology.Loop_059.laplace_epithelial_hoop_stress_monotonicity"
    lean_locus: "morphoeval/lean/loops/Loop_059_tracheal_viscous_fingering.lean#L56-L78"
    lean_code: |
      def laplace_hoop_stress_scaled (dP R : Int) : Int :=
        dP * R
      theorem laplace_epithelial_hoop_stress_monotonicity
          (P_lum P_pl c dP1 dP2 R : Int)
          (hR : 0 < R)
          (hdP : dP1 < dP2) :
          laplace_hoop_stress_scaled (transmural_pressure (P_lum + c) (P_pl + c)) R =
            laplace_hoop_stress_scaled (transmural_pressure P_lum P_pl) R ∧
          laplace_hoop_stress_scaled dP2 R - laplace_hoop_stress_scaled dP1 R =
            (dP2 - dP1) * R ∧
          laplace_hoop_stress_scaled dP1 R < laplace_hoop_stress_scaled dP2 R
    variables: "σ_θ: circumferential Laplace hoop tension across distal epithelial wall (Pa); R: distal epithelial bud luminal radius (μm); h: epithelial wall thickness (μm)"
    role: "Connects positive transmural pressure ΔP to circumferential tensile stress in the distal airway epithelium that activates FGF10/ERK1/2/Etv4 tip proliferation"
    source_citation: "Nelson et al. (2017) Development 144:4328-4335; Jaslove & Nelson (2018) Development 145:dev167395"
    code_locus: "2015-sugimura-tracheal-viscous-fingering.py#L140-L215"

  - law_name: "Tracheal Drainage & Nifedipine ASM Blockade Hypoplasia Arrest Law"
    formula: "Γ_branch(ΔP, α_ASM) = Γ_0 α_ASM (ΔP - ΔP_c)_+^n / (K_P^n + (ΔP - ΔP_c)_+^n)  ⇒  (ΔP ≤ ΔP_c ∨ α_ASM = 0) ⟹ Γ_branch = 0"
    lean_decl: "MathOfBiology.Loop_059.branching_rate_numerator"
    lean_theorem: "MathOfBiology.Loop_059.tracheal_drainage_and_nifedipine_hypoplasia_arrest"
    lean_locus: "morphoeval/lean/loops/Loop_059_tracheal_viscous_fingering.lean#L93-L119"
    lean_code: |
      def excess_pressure_pos (dP dP_c : Int) : Int :=
        if dP <= dP_c then 0 else dP - dP_c
      def branching_rate_numerator (alpha_asm dP dP_c : Int) : Int :=
        alpha_asm * (excess_pressure_pos dP dP_c * excess_pressure_pos dP dP_c)
      theorem tracheal_drainage_and_nifedipine_hypoplasia_arrest
          (alpha_asm dP_sub dP_sup dP_c : Int)
          (h_alpha : 0 < alpha_asm)
          (h_sub : dP_sub <= dP_c)
          (h_sup : dP_c < dP_sup) :
          branching_rate_numerator alpha_asm dP_sub dP_c = 0 ∧
          branching_rate_numerator 0 dP_sup dP_c = 0 ∧
          0 < branching_rate_numerator alpha_asm dP_sup dP_c
    variables: "Γ_branch: terminal bud bifurcation rate (day^-1); ΔP_c: critical transmural distension threshold (50 Pa); K_P: half-saturation pressure (140 Pa); α_ASM: airway smooth muscle L-type Ca2+ peristaltic activity factor"
    role: "Explains why either tracheal intubation drainage (ΔP ≤ ΔP_c) or nifedipine Ca2+ channel blockade (α_ASM → 0) arrests embryonic lung branching into hypoplasia"
    source_citation: "Nelson et al. (2017) Development 144:4328-4335 Figs. 3-4; Kim et al. (2015) Dev. Cell 34:668-681; Unbekandt et al. (2008) Mech. Dev. 125:314-324"
    code_locus: "2015-sugimura-tracheal-viscous-fingering.py#L150-L320"

  - law_name: "Poiseuille Airway-Tree Luminal Pressure Accumulation Law (Pass 3)"
    formula: "Q_i = Σ_{j∈subtree(i)} j_Cl(g_j)·2πr_jL_j,  R_i = 8μL_i/(πr_i⁴),  P_node = P_amn + R_larynx Q_tot + Σ_path R_i Q_i  ⇒  (∀ i: R_i Q_i ≥ 0) ⟹ ΔP(tip) ≥ ΔP(trachea)"
    lean_decl: "MathOfBiology.Loop_059.pressure_along_path"
    lean_theorem: "MathOfBiology.Loop_059.poiseuille_tree_pressure_accumulation"
    lean_locus: "morphoeval/lean/loops/Loop_059_tracheal_viscous_fingering.lean#L138-L164"
    lean_code: |
      def pressure_along_path : Int → List Int → Int
        | P, [] => P
        | P, d :: ds => pressure_along_path (P + d) ds
      theorem poiseuille_tree_pressure_accumulation
          (P_trachea P_pleura : Int) (drops : List Int)
          (h_nonneg : ∀ d, d ∈ drops → 0 ≤ d) :
          P_trachea ≤ pressure_along_path P_trachea drops ∧
          P_trachea - P_pleura ≤ pressure_along_path P_trachea drops - P_pleura
    variables: "j_Cl(g): CFTR/NKCC1 chloride-driven secretion per unit epithelial area at generation g (nL/min/μm²); r_i, L_i: segment radius and length (μm); μ: lung-liquid viscosity (Pa·s); R_larynx: laryngeal outflow resistance; P_amn: amniotic pressure"
    role: "Spatially resolves luminal pressure on the 3D bronchial tree with distributed secretion sources; proves the distal tip transmural pressure is never below the tracheal one and that intra-tree drops are non-negative (numerically < 0.01% of ΔP, validating the uniform-ΔP assumption of the 2D solver)"
    source_citation: "Olver & Strang (1974) J. Physiol. 241:327-357 (chloride-driven lung-liquid secretion); Harding, Bocking & Sigger (1986) J. Appl. Physiol. 60:160-165 (upper-airway resistance dominates); Metzger et al. (2008) Nature 453:745-750 (orthogonal bifurcation)"
    code_locus: "2015-sugimura-tracheal-viscous-fingering.py#L365-L628"

  - law_name: "Laryngeal Valve Duty-Cycle Monotonicity Law (Pass 3)"
    formula: "C dP/dt = Q − (P − P_amn)/R_larynx(t),  R_larynx ∈ {R_closed, R_open},  P_open = P_amn + Q R_open < P_closed = P_amn + Q R_closed  ⇒  d₁ < d₂ ⟹ d₂P_open + (D−d₂)P_closed < d₁P_open + (D−d₁)P_closed"
    lean_decl: "MathOfBiology.Loop_059.valve_cycle_integrated_pressure"
    lean_theorem: "MathOfBiology.Loop_059.laryngeal_valve_duty_cycle_monotonicity"
    lean_locus: "morphoeval/lean/loops/Loop_059_tracheal_viscous_fingering.lean#L179-L216"
    lean_code: |
      def valve_steady_pressure (P_amn Q R : Int) : Int :=
        P_amn + Q * R
      def valve_cycle_integrated_pressure (P_open P_closed d D : Int) : Int :=
        d * P_open + (D - d) * P_closed
      theorem laryngeal_valve_duty_cycle_monotonicity
          (P_amn Q R_open R_closed d1 d2 D : Int)
          (hQ : 0 < Q) (hR : R_open < R_closed) (hd : d1 < d2) :
          valve_steady_pressure P_amn Q R_open < valve_steady_pressure P_amn Q R_closed ∧
          valve_cycle_integrated_pressure (valve_steady_pressure P_amn Q R_open)
              (valve_steady_pressure P_amn Q R_closed) d2 D <
            valve_cycle_integrated_pressure (valve_steady_pressure P_amn Q R_open)
              (valve_steady_pressure P_amn Q R_closed) d1 D
    variables: "Q: luminal secretion rate; R_closed / R_open: laryngeal resistance with glottis adducted / during fetal breathing-movement episodes; d: open duty (out of D); P_amn: amniotic pressure; C: lung compliance"
    role: "Explains tracheal occlusion hyperplasia (d = 0 maximises time-integrated ΔP) versus drainage / permanently open larynx hypoplasia (d = 1 minimises it); the Hill nonlinearity of Γ_branch yields a Jensen gap between time-averaged and mean-pressure branching"
    source_citation: "Harding & Hooper (1996) J. Appl. Physiol. 81:209-224; Harding, Bocking & Sigger (1986) J. Appl. Physiol. 60:160-165; Unbekandt et al. (2008) Mech. Dev. 125:314-324; Nelson et al. (2017) Development 144:4328-4335"
    code_locus: "2015-sugimura-tracheal-viscous-fingering.py#L630-L720"
