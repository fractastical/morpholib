equations:
  - law_name: Schnakenberg diffusion-ratio threshold
    formula: "delta * f_u > 1, delta = D_v / D_u = 160, f_u = 0.84"
    lean_decl: MathOfBiology.Loop_3124.law1_threshold
    lean_theorem: MathOfBiology.Loop_3124.law1_diffusion_ratio_exceeds_unity
    lean_locus: morphoeval/lean/loops/Loop_3124_asteroxylon_mackiei_turing_wavelength_s0.lean#L15-L20
    lean_code: |-
      def law1_threshold (delta fu_num fu_den : Int) : Int := delta * fu_num - fu_den
      theorem law1_diffusion_ratio_exceeds_unity : law1_threshold 160 84 100 > 0 := by decide
    variables: "delta=160, f_u=84/100 at the 5.2 µm steady state (u,v)=(1, 0.92)"
    role: Primary Turing condition for wavenumber selection at the detail scale
    source_citation: "Turing 1952 DOI:10.1098/rstb.1952.0012; Schnakenberg 1979 DOI:10.1016/0022-5193(79)90042-0"
    code_locus: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py
  - law_name: Thirty critical wavelengths in the tracheid-file window
    formula: "N = L / lambda_c = 156 µm / 5.2 µm = 30"
    lean_decl: MathOfBiology.Loop_3124.law2_mode_count
    lean_theorem: MathOfBiology.Loop_3124.law2_thirty_critical_modes
    lean_locus: morphoeval/lean/loops/Loop_3124_asteroxylon_mackiei_turing_wavelength_s0.lean#L25-L30
    lean_code: |-
      def law2_mode_count (domain_nm lambda_nm : Int) : Int := domain_nm / lambda_nm
      theorem law2_thirty_critical_modes : law2_mode_count 156000 5200 = 30 := by decide
    variables: "domain 156000 nm, lambda 5200 nm"
    role: Domain mode count that separates this slot from the single-wavelength 283 µm sibling
    source_citation: "Kidston & Lang 1920 DOI:10.1017/s0080456800004506; Kenrick & Crane 1991 DOI:10.1086/337897"
    code_locus: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py
  - law_name: Subcellular wavenumber versus the 283.4 µm enation sibling
    formula: "lambda_enation / lambda_detail = 283400 nm / 5200 nm = 54 > 50"
    lean_decl: MathOfBiology.Loop_3124.law3_scale_ratio
    lean_theorem: MathOfBiology.Loop_3124.law3_subcellular_wavenumber_dominates_enation
    lean_locus: morphoeval/lean/loops/Loop_3124_asteroxylon_mackiei_turing_wavelength_s0.lean#L36-L41
    lean_code: |-
      def law3_scale_ratio (sibling_nm detail_nm : Int) : Int := sibling_nm / detail_nm
      theorem law3_subcellular_wavenumber_dominates_enation : law3_scale_ratio 283400 5200 > 50 := by decide
    variables: "sibling wavelength 283.4 µm, detail wavelength 5.2 µm"
    role: Scale separation inside Asteroxylon chronoseries 1/1 at 407 Ma
    source_citation: "Turing 1952 DOI:10.1098/rstb.1952.0012"
    code_locus: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py
  - law_name: Homogeneous steady state is not an oscillator
    formula: "tr J = f_u + g_v = 0.84 - 1.00 < 0"
    lean_decl: MathOfBiology.Loop_3124.law4_trace
    lean_theorem: MathOfBiology.Loop_3124.law4_homogeneous_trace_negative
    lean_locus: morphoeval/lean/loops/Loop_3124_asteroxylon_mackiei_turing_wavelength_s0.lean#L46-L51
    lean_code: |-
      def law4_trace (fu_hundredths gv_hundredths : Int) : Int := fu_hundredths + gv_hundredths
      theorem law4_homogeneous_trace_negative : law4_trace 84 (-100) < 0 := by decide
    variables: "f_u hundredths 84, g_v hundredths -100"
    role: Patterning requires differential diffusion; the well-mixed state is stable
    source_citation: "Schnakenberg 1979 DOI:10.1016/0022-5193(79)90042-0"
    code_locus: models/2026-delphi10000-asteroxylon-mackiei-turing-wavelength-s0.py
