equations:
- law_name: Schnakenberg diffusion-ratio gate at 2.304 µm
  formula: "delta * f_u + g_v > 0, with delta = Dv/Du = 24, f_u ≈ 0.709, g_v = -1.21"
  lean_decl: MathOfBiology.Loop_3168.law1_diffusion_margin
  lean_theorem: MathOfBiology.Loop_3168.law1_cortical_ratio_exceeds_onset
  lean_locus: morphoeval/lean/loops/Loop_3168_dictyostelium_discoideum_turing_wavelength_s0.lean#L16-L21
  lean_code: 'def law1_diffusion_margin (delta fu_milli gv_milli : Int) : Int := delta * fu_milli + gv_milli

    theorem law1_cortical_ratio_exceeds_onset : law1_diffusion_margin 24 709 (-1210) > 0 := by decide'
  variables: "delta = 24, fu_milli = 709, gv_milli = -1210"
  role: Onset condition for Turing Reaction-Diffusion Wavelength Selection in Dictyostelium discoideum at 2.304 µm
  source_citation: "Turing (1952) DOI:10.1098/rstb.1952.0012; Schnakenberg (1979) DOI:10.1016/0022-5193(79)90042-0"
  code_locus: models/2026-delphi10000-dictyostelium-discoideum-turing-wavelength-s0.py
- law_name: Five cortical modes per vegetative cell
  formula: "N = L / lambda_c = 11520 nm / 2304 nm = 5; molecular predecessor 200 nm admits N = 0"
  lean_decl: MathOfBiology.Loop_3168.law2_mode_count
  lean_theorem: MathOfBiology.Loop_3168.law2_five_modes_in_vegetative_cell
  lean_locus: morphoeval/lean/loops/Loop_3168_dictyostelium_discoideum_turing_wavelength_s0.lean#L24-L33
  lean_code: 'def law2_mode_count (length_nm wavelength_nm : Int) : Int := length_nm / wavelength_nm

    theorem law2_five_modes_in_vegetative_cell : law2_mode_count 11520 2304 = 5 := by decide

    theorem law2_molecular_predecessor_admits_no_mode : law2_mode_count 200 2304 = 0 := by decide'
  variables: "L = 11520 nm, lambda_c = 2304 nm, L_molecular = 200 nm"
  role: Mode count for stripes, spots and ocelli on one Holocene Dictyostelium cell versus the molecular predecessor regime
  source_citation: "Turing (1952) DOI:10.1098/rstb.1952.0012"
  code_locus: models/2026-delphi10000-dictyostelium-discoideum-turing-wavelength-s0.py
- law_name: Aggregation-scale successor is a longer wavelength
  formula: "L_aggregation - lambda_c = 1000000 nm - 2304 nm > 0 at geological age 0 Ma"
  lean_decl: MathOfBiology.Loop_3168.law3_scale_gap
  lean_theorem: MathOfBiology.Loop_3168.law3_aggregation_successor_is_longer
  lean_locus: morphoeval/lean/loops/Loop_3168_dictyostelium_discoideum_turing_wavelength_s0.lean#L37-L42
  lean_code: 'def law3_scale_gap (successor_nm cortical_nm : Int) : Int := successor_nm - cortical_nm

    theorem law3_aggregation_successor_is_longer : law3_scale_gap 1000000 2304 > 0 := by decide'
  variables: "successor_nm = 1000000 (1 mm cAMP-wave order), cortical_nm = 2304"
  role: Critical scale gap for Turing wavenumber k_c between the cortical band and the extracellular cAMP field
  source_citation: "Höfer, Sherratt & Maini (1995) DOI:10.1098/rspb.1995.0037; Sawai, Thomason & Cox (2005) DOI:10.1038/nature03228"
  code_locus: models/2026-delphi10000-dictyostelium-discoideum-turing-wavelength-s0.py
