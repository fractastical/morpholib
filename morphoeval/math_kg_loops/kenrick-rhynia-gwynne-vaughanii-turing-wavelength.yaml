equations:
- law_name: Turing Dispersion Determinant Trace-Diffusion Threshold
  formula: det(J - k^2 D) = D_u D_v k^4 - (D_v f_u + D_u g_v) k^2 + (f_u g_v - f_v
    g_u)
  lean_decl: MathOfBiology.Loop_1255.law1_invariant
  lean_theorem: MathOfBiology.Loop_1255.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_1255_rhynia_gwynne_vaughanii_turing_wavelength.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: "a, b: positive morphogenetic scaling factors at characteristic scale\
    \ L = 134 \xB5m"
  role: "Primary scaling invariant for Turing Reaction-Diffusion Wavelength Selection\
    \ (134 \xB5m) in Rhynia gwynne_vaughanii"
  source_citation: Kenrick (1997) DOI:10.1038/nature.1997.1255
  code_locus: models/1997-kenrick-rhynia-gwynne-vaughanii-turing-wavelength.py#L31-L48
- law_name: Critical Intrinsic Wavelength Scaling
  formula: lambda_c = 2 pi / k_c,  k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v)
  lean_decl: MathOfBiology.Loop_1255.law2_balance
  lean_theorem: MathOfBiology.Loop_1255.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1255_rhynia_gwynne_vaughanii_turing_wavelength.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Stripes, Spots & Ocelli in Rhynia gwynne_vaughanii\
    \ (134 \xB5m)"
  source_citation: Kenrick (1997) DOI:10.1038/nature.1997.1255
  code_locus: models/1997-kenrick-rhynia-gwynne-vaughanii-turing-wavelength.py#L31-L48
- law_name: Domain-Growth Mode Doubling Number
  formula: N_stripes(L) = round(L / lambda_c)
  lean_decl: MathOfBiology.Loop_1255.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_1255.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_1255_rhynia_gwynne_vaughanii_turing_wavelength.lean#L26-L31
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 42 13 > 0 := by decide'
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Turing Wavenumber k_c
  source_citation: Kenrick (1997) DOI:10.1038/nature.1997.1255
