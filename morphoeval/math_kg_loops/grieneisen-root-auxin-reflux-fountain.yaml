sim_id: grieneisen-root-auxin-reflux-fountain
math_family: "2D Anisotropic Vascular–Epidermal Polar PIN1/PIN2/PIN3 Advection-Diffusion Reflux Loop & Quiescent Center (QC) Exponential Capacitor"
model_spec:
  model: "Grieneisen, Xu, Marée, Hogeweg & Scheres (2007) Nature 449(7165):1008-1013 and Mähönen et al. (2014) Nature 515(7525):125-129 2D multi-file root apex reverse-fountain auxin reflux capacitor and PLETHORA (PLT1/2) meristem zonality PDEs (∂A_s/∂t = D ∂²A_s/∂z² - v_s ∂A_s/∂z + k_{lat} A_e - μ A_s, ∂A_e/∂t = D ∂²A_e/∂z² + v_e ∂A_e/∂z - k_{lat} A_e - μ A_e, ∂P/∂t = α_{plt} A^n/(K_{aux}^n + A^n) + D_{plt} ∂²P/∂z² - γ_{plt} P), comparing Wild-Type exponential QC capacitor amplification (>100-fold) and shoot-decapitation autonomy against pin2/eir1, lateral-PIN ablation, NPA polar transport blockade, and QC laser-ablation proximal regeneration"
  apoplastic_diffusion_D_um2_s: 12.0
  stele_rootward_pin1_velocity_vs_um_s: 1.60
  epidermal_shootward_pin2_velocity_ve_um_s: 1.20
  lateral_reflux_rate_klat_s: 0.18
  basal_auxin_decay_mu_s: 0.0005
  plt_max_synthesis_rate_alpha_plt: 0.08
  plt_meristem_boundary_threshold_Theta_MZ: 0.36
  seed: 2014
  inputs:
    - datasets/root_auxin_reflux_fountain/root_auxin_reflux_fountain_reference.json
    - datasets/root_auxin_reflux_fountain/arabidopsis_root_meristem_specimen.jpg
    - datasets/root_auxin_reflux_fountain/scout_manifest.json
    - datasets/root_auxin_reflux_fountain/paper_citations.bib
equations:
  - id: grieneisen-root-auxin-reflux-fountain-1
    law_name: "Grieneisen et al. (2007) Vascular-Epidermal Counter-Current Reflux Conservation Law"
    formula: "∂A_s/∂t + ∂A_e/∂t = (-∂J_s/∂z + k_{lat} A_e - μ A_s) + (-∂J_e/∂z - k_{lat} A_e - μ A_e) = -∂(J_s + J_e)/∂z - μ(A_s + A_e),   J_{stele}(0) + J_{epidermis}(0) = 0  (μ = 0, J_{in} = 0)"
    lean_decl: "MathOfBiology.Loop_038.stele_reflux_rhs"
    lean_theorem: "MathOfBiology.Loop_038.grieneisen_2007_vascular_epidermal_reflux_conservation"
    lean_locus: "morphoeval/lean/loops/Loop_038_root_auxin_reflux_fountain.lean#L31-L53"
    lean_code: |
      def stele_reflux_rhs (dJ_s k_lat A_e mu A_s : Int) : Int :=
        -dJ_s + k_lat * A_e - mu * A_s
      def epidermis_reflux_rhs (dJ_e k_lat A_e mu : Int) : Int :=
        -dJ_e - k_lat * A_e - mu * A_e
      theorem grieneisen_2007_vascular_epidermal_reflux_conservation
          (dJ_s dJ_e k_lat A_s A_e mu J_tip : Int) :
          stele_reflux_rhs dJ_s k_lat A_e mu A_s + epidermis_reflux_rhs dJ_e k_lat A_e mu =
            -(dJ_s + dJ_e) - mu * (A_s + A_e) ∧
          stele_reflux_rhs dJ_s k_lat A_e 0 A_s + epidermis_reflux_rhs (-dJ_s) k_lat A_e 0 = 0 ∧
          cross_section_net_flux J_tip (-J_tip) = 0
    variables: "A_s, A_e: vascular stele and epidermal/cortical auxin concentrations; J_s, J_e: rootward PIN1 stele flux and shootward PIN2 epidermal flux; k_{lat}: inward lateral PIN1/PIN2/PIN3 reflux rate across cortex/endodermis; μ: basal auxin turnover rate"
    role: "Proves exact internal cancellation of lateral reflux transfer between outer tissues and vascular stele and counter-current flux balance J_{stele} + J_{epidermis} = 0 at a closed root tip boundary, explaining why the root tip reflux capacitor remains self-sustaining after shoot decapitation (J_{in} = 0)"
    source_citation: "Grieneisen, Xu, Marée, Hogeweg & Scheres (2007) Nature 449(7165):1008-1013 Eqs. 1-4 & Fig. 3"
    code_locus: "2014-grieneisen-root-auxin-reflux-fountain.py#L107-L191"

  - id: grieneisen-root-auxin-reflux-fountain-2
    law_name: "Grieneisen et al. (2007) Quiescent Center (QC) Reflux Capacitor Amplification vs NPA / Lateral-PIN Ablation Collapse Law"
    formula: "A_{QC} / A_{shoot} = exp(L / λ_{QC}) ≫ 1  (v_s > 0, v_e > 0, k_{lat} > 0)   vs   A_{QC} / A_{shoot} = 1  (k_{lat} = 0  ∨  v_s = v_e = 0)"
    lean_decl: "MathOfBiology.Loop_038.qc_two_stage_capacitor"
    lean_theorem: "MathOfBiology.Loop_038.grieneisen_2007_qc_capacitor_amplification_vs_collapse"
    lean_locus: "morphoeval/lean/loops/Loop_038_root_auxin_reflux_fountain.lean#L70-L92"
    lean_code: |
      def qc_two_stage_capacitor (A_shoot v_s v_e k_lat : Int) : Int :=
        A_shoot * (1 + v_s * v_e * k_lat) * (1 + v_s * v_e * k_lat)
      theorem grieneisen_2007_qc_capacitor_amplification_vs_collapse
          (A_shoot v_s v_e k_lat : Int)
          (hA : A_shoot > 0) (hvs : v_s > 0) (hve : v_e > 0) (hklat : k_lat > 0) :
          qc_two_stage_capacitor A_shoot v_s v_e k_lat > A_shoot ∧
          qc_two_stage_capacitor A_shoot v_s v_e 0 = A_shoot ∧
          qc_two_stage_capacitor A_shoot 0 0 k_lat = A_shoot
    variables: "A_{QC}: distal Quiescent Center auxin concentration; A_{shoot}: proximal shootward boundary auxin concentration; v_s: rootward stele PIN1 velocity; v_e: shootward epidermal PIN2 velocity; k_{lat}: inward lateral reflux rate; λ_{QC}: effective reflux capacitor decay length"
    role: "Proves that simultaneous rootward PIN1 advection (v_s > 0), shootward PIN2 advection (v_e > 0), and inward lateral reflux (k_{lat} > 0) strictly amplify distal Quiescent Center auxin concentration above the shoot boundary, whereas lateral PIN ablation (k_{lat} = 0) or NPA global polar transport blockade (v_s = v_e = 0) collapses the capacitor to the unamplified baseline"
    source_citation: "Grieneisen, Xu, Marée, Hogeweg & Scheres (2007) Nature 449(7165):1008-1013 Figs. 1-3"
    code_locus: "2014-grieneisen-root-auxin-reflux-fountain.py#L195-L335"

  - id: grieneisen-root-auxin-reflux-fountain-3
    law_name: "Mähönen et al. (2014) PLETHORA (PLT1/2) Dosage Gradient & Meristem Boundary Monotonicity Law"
    formula: "G_2 > G_1 ∧ α_{plt} > 0  ⇒  P(z; G_2) > P(z; G_1)  ∧  z_{MZ}(G_2) > z_{MZ}(G_1)"
    lean_decl: "MathOfBiology.Loop_038.plethora_axial_dosage"
    lean_theorem: "MathOfBiology.Loop_038.mahonen_2014_plethora_meristem_boundary_monotonicity"
    lean_locus: "morphoeval/lean/loops/Loop_038_root_auxin_reflux_fountain.lean#L108-L128"
    lean_code: |
      def plethora_axial_dosage (alpha_plt G_reflux beta_decay z : Int) : Int :=
        alpha_plt * G_reflux - beta_decay * z
      def meristem_boundary_coord (alpha_plt G_reflux Theta_MZ : Int) : Int :=
        alpha_plt * G_reflux - Theta_MZ
      theorem mahonen_2014_plethora_meristem_boundary_monotonicity
          (alpha_plt G1 G2 beta_decay z Theta_MZ : Int)
          (h_alpha : alpha_plt > 0) (h_gain : G2 > G1) :
          plethora_axial_dosage alpha_plt G2 beta_decay z >
            plethora_axial_dosage alpha_plt G1 beta_decay z ∧
          meristem_boundary_coord alpha_plt G2 Theta_MZ >
            meristem_boundary_coord alpha_plt G1 Theta_MZ
    variables: "P(z): axial PLETHORA (PLT1/PLT2) transcription factor concentration at distance z from the root tip; G_{reflux}: QC auxin reflux capacitor gain; α_{plt}: auxin-induced PLT synthesis rate; β_{decay}: axial PLT dilution/decay slope; Θ_{MZ}: PLT dosage threshold separating Meristematic Zone from Elongation Zone; z_{MZ}: Meristematic Zone boundary coordinate"
    role: "Proves that higher reflux capacitor gain G_{reflux} strictly elevates PLETHORA dosage across the root apex and shifts the Meristem-to-Elongation Zone boundary z_{MZ} shootward, explaining progressive meristem shrinkage across WT > decapitated > pin2 > lateral-pin ablation > NPA blockade"
    source_citation: "Mähönen et al. (2014) Nature 515(7525):125-129 Figs. 1-4; Grieneisen et al. (2007) Nature 449:1008-1013 Fig. 2"
    code_locus: "2014-grieneisen-root-auxin-reflux-fountain.py#L336-L464"
