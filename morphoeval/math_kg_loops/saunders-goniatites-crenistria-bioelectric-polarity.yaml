- law_name: Voltage-Gated Gap-Junction Boltzmann Conductance
  formula: G_ij = G_max / (1 + exp(((V_i - V_j)^2 - V_0^2) / V_T^2))
  lean_decl: MathOfBiology.Loop_1955.law2_balance
  lean_theorem: MathOfBiology.Loop_1955.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1955_goniatites_crenistria_bioelectric_polarity.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Target Polarity & Neural Maps in Goniatites crenistria\
    \ (16 \xB5m)"
  source_citation: Saunders (2002) DOI:10.1126/science
  code_locus: models/2002-saunders-goniatites-crenistria-bioelectric-polarity.py#L31-L48
- law_name: Bistable Depolarized/Hyperpolarized Attractor Separation
  formula: Delta_V_attractor = |V_depol^* - V_hyper^*| > V_threshold
  lean_decl: MathOfBiology.Loop_1955.law3_threshold_margin
