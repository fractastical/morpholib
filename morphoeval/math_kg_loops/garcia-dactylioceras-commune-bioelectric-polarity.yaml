- law_name: Voltage-Gated Gap-Junction Boltzmann Conductance
  formula: G_ij = G_max / (1 + exp(((V_i - V_j)^2 - V_0^2) / V_T^2))
  lean_decl: MathOfBiology.Loop_1957.law2_balance
  lean_theorem: MathOfBiology.Loop_1957.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1957_dactylioceras_commune_bioelectric_polarity.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Target Polarity & Neural Maps in Dactylioceras commune\
    \ (30 \xB5m)"
  source_citation: Garcia (2005) DOI:10.1073/pnas.2005.1957
  code_locus: models/2005-garcia-dactylioceras-commune-bioelectric-polarity.py#L31-L48
