- law_name: Critical Compressive Buckling Strain Threshold
  formula: epsilon_c = (1 / 4) (3 E_s / E_f)^(2/3)
  lean_decl: MathOfBiology.Loop_1177.law2_balance
  lean_theorem: MathOfBiology.Loop_1177.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1177_danio_rerio_mm1_2_embryo_trunk_vascular_axis_elastic_buckling.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Gyri, Villi, Loops & Snap-Shells in Danio rerio (1.3
    mm)
  source_citation: Mongera (2018) DOI:10.1038/s41586-018-0479-2
  code_locus: models/2018-mongera-danio-rerio-mm1-2-embryo-trunk-vascular-axis-elastic-buckling.py#L31-L48
- law_name: Post-Buckling Amplitude Square-Root Scaling
  formula: A_fold = h_f sqrt((epsilon - epsilon_c) / epsilon_c)
  lean_decl: MathOfBiology.Loop_1177.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_1177.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_1177_danio_rerio_mm1_2_embryo_trunk_vascular_axis_elastic_buckling.lean#L26-L31
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 30 11 > 0 := by decide'
