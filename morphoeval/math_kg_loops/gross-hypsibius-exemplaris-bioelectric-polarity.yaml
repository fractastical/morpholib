- law_name: Membrane Voltage Gap-Junction Reaction-Diffusion Balance
  formula: C_m dV_i/dt = -I_ion(V_i) + sum_j G_ij(V_i, V_j) (V_j - V_i)
  lean_decl: MathOfBiology.Loop_2001.law1_invariant
  lean_theorem: MathOfBiology.Loop_2001.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_2001_hypsibius_exemplaris_bioelectric_polarity.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: 'a, b: positive morphogenetic scaling factors at characteristic scale
    L = 171 nm'
  role: Primary scaling invariant for Gap-Junction Bioelectric Bistability & Target
