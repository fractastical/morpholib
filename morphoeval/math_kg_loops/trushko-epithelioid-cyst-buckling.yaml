sim_id: trushko-epithelioid-cyst-buckling
math_family: "Föppl–von Kármán & Zoelly Spherical Shell Buckling of Proliferating Epithelial Monolayers Under Elastic Alginate Confinement"
model_spec:
  model: "Trushko et al. (2020) Dev. Cell 54(5):655-668, Hannezo et al. (2014) PNAS 111(1):27-32 & Zoelly (1915) spherical shell buckling + vertex-elastic ring monolayer growing inside an alginate microcapsule"
  R_0_default_um: 100.0
  h_default_um: 10.5
  E_epi_default_kPa: 18.5
  nu_epi: 0.45
  E_alg_default_kPa: 5.0
  H_alg_default_um: 25.0
  tau_d_hours: 18.0
  c_delta_invagination: 0.88
  n_ring_vertices: 180
  seed: 2019
  inputs:
    - datasets/epithelioid_cyst_buckling/epithelioid_cyst_buckling_reference.json
    - datasets/epithelioid_cyst_buckling/epithelioid_cyst_specimen.jpg
    - datasets/epithelioid_cyst_buckling/scout_manifest.json
    - datasets/epithelioid_cyst_buckling/paper_citations.bib
equations:
  - law_name: "Zoelly / Föppl–von Kármán Spherical Shell Critical Buckling Pressure Scaling Law"
    formula: "P_c = (2 E_epi / √(3(1 - ν^2))) (h / R_0)^2  ⇒  P_c(2h, R_0) = 4 P_c(h, R_0)  ∧  P_c(h, 2R_0) = (1/4) P_c(h, R_0)"
    lean_decl: "MathOfBiology.Loop_069.zoelly_pressure_scaled"
    lean_theorem: "MathOfBiology.Loop_069.zoelly_quadratic_shell_buckling_scaling"
    lean_locus: "morphoeval/lean/loops/Loop_069_epithelioid_cyst_buckling.lean#L27-L58"
    lean_code: |
      def zoelly_pressure_scaled (c_e h : Nat) : Nat :=
        c_e * (h * h)
      def zoelly_radius_doubling_lhs (c_e r : Nat) : Nat :=
        c_e * ((2 * r) * (2 * r))
      def zoelly_radius_doubling_rhs (c_e r : Nat) : Nat :=
        4 * (c_e * (r * r))
      theorem zoelly_quadratic_shell_buckling_scaling (c_e h r : Nat) :
          zoelly_pressure_scaled c_e (2 * h) = 4 * zoelly_pressure_scaled c_e h ∧
          zoelly_radius_doubling_lhs c_e r = zoelly_radius_doubling_rhs c_e r ∧
          zoelly_pressure_scaled 1 2 = 4 * zoelly_pressure_scaled 1 1
    variables: "P_c: critical buckling pressure (kPa); E_epi: epithelial monolayer Young's modulus (kPa); ν: Poisson ratio; h: epithelial monolayer thickness (μm); R_0: spherical alginate capsule inner radius (μm)"
    role: "Predicts the quadratic thickness-to-radius scaling P_c ∝ (h/R_0)^2 of critical inward invagination pressure across MDCK and Caco-2 epithelial cysts"
    source_citation: "Trushko et al. (2020) Dev. Cell 54(5):655-668 Figs. 3-4 & STAR Methods; Zoelly (1915) ETH Zürich"
    code_locus: "2019-trushko-epithelioid-cyst-buckling.py#L145-L215"

  - law_name: "Proliferative Confluent Laplace Stress Accumulation & Alginate Confinement Threshold Law"
    formula: "P_alg(g) = K_alg (g - 1) > 0  for g > 1;  buckling onset at g > g_c = 1 + P_c / K_alg  (t_b = t_c + τ_d log_2(g_c))"
    lean_decl: "MathOfBiology.Loop_069.laplace_confinement_stress"
    lean_theorem: "MathOfBiology.Loop_069.proliferative_confinement_buckling_threshold"
    lean_locus: "morphoeval/lean/loops/Loop_069_epithelioid_cyst_buckling.lean#L78-L94"
    lean_code: |
      def laplace_confinement_stress (e_alg g g0 : Nat) : Nat :=
        e_alg * (g - g0)
      theorem proliferative_confinement_buckling_threshold (e0 g0 gc dg : Nat) :
          laplace_confinement_stress (e0 + 1) g0 g0 = 0 ∧
          laplace_confinement_stress 0 (g0 + dg + 1) g0 = 0 ∧
          laplace_confinement_stress (e0 + 1) (g0 + dg + 1) g0 > 0 ∧
          laplace_confinement_stress (e0 + 1) (gc + dg + 1) gc > 0
    variables: "g(t) = 2^((t - t_c)/τ_d): post-confluence proliferative growth stretch; K_alg = 2 E_alg H_alg / ((1 - ν_alg) R_0): spherical capsule radial stiffness; g_c: critical buckling stretch"
    role: "Explains why unconfined or ultra-soft alginate capsules (E_alg ≪ E_crit, P_alg < P_c) remain spherical without buckling whereas stiff capsules (E_alg ∈ [2, 10] kPa) buckle at time t_b"
    source_citation: "Trushko et al. (2020) Dev. Cell 54(5):655-668 Figs. 1-3 & pp. 657-661"
    code_locus: "2019-trushko-epithelioid-cyst-buckling.py#L175-L265"

  - law_name: "Inward Invagination Volume Conservation & Blebbistatin Actomyosin Contractility Shift Law"
    formula: "V_lumen + V_fold = V_caps;  δ(g)/R_0 = c_δ √(g - g_c) (1 + β_myo Γ_myo)  ⇒  Γ_blebb < Γ_WT ⟹ δ_blebb < δ_WT"
    lean_decl: "MathOfBiology.Loop_069.active_invagination_depth_scaled"
    lean_theorem: "MathOfBiology.Loop_069.invagination_volume_conservation_and_blebbistatin_shift"
    lean_locus: "morphoeval/lean/loops/Loop_069_epithelioid_cyst_buckling.lean#L108-L127"
    lean_code: |
      def invaginated_lumen_volume (v_caps v_fold : Int) : Int :=
        v_caps - v_fold
      def active_invagination_depth_scaled (delta_base c0 gamma_myo : Nat) : Nat :=
        (delta_base + 1) * (c0 + gamma_myo + 1)
      theorem invagination_volume_conservation_and_blebbistatin_shift
          (v_caps v_fold : Int) (delta_base c0 g0 d_myo : Nat) :
          invaginated_lumen_volume v_caps v_fold + v_fold = v_caps ∧
          active_invagination_depth_scaled delta_base c0 g0 <
            active_invagination_depth_scaled delta_base c0 (g0 + d_myo + 1)
    variables: "V_caps, V_lumen, V_fold: capsule, lumen, and invaginated cap volumes; δ/R_0: normalized inward fold depth; Γ_myo: active myosin-II contractility (reduced by Blebbistatin / Y-27632)"
    role: "Proves capsule volume partitioning during inward invagination and predicts the experimentally observed attenuation of fold depth and buckling pressure under Blebbistatin myosin-II inhibition"
    source_citation: "Trushko et al. (2020) Dev. Cell 54(5):655-668 Figs. 5-6; Hannezo, Prost & Joanny (2014) PNAS 111(1):27-32"
    code_locus: "2019-trushko-epithelioid-cyst-buckling.py#L215-L380"
