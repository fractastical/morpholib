sim_id: graner-cellular-potts-cell-sorting
math_family: Glazier-Graner-Hogeweg Extended Large-Q Cellular Potts Model (CPM)
equations:
  - law_name: Graner & Glazier (1992) Cellular Potts Surface Tension Relations & Equal-Adhesion Null Identity
    formula: "γ_{LD} = J_{LD} - (J_{LL} + J_{DD})/2,  γ_{αM} = J_{αM} - J_{αα}/2;  J_{LL} = J_{DD} = J_{LD} ⇒ γ_{LD} = 0"
    lean_decl: MathOfBiology.Loop_042.two_gamma_LD
    lean_theorem: MathOfBiology.Loop_042.cpm_equal_adhesion_null_tension
    lean_locus: morphoeval/lean/loops/Loop_042_cellular_potts_cell_sorting.lean#L17-L42
    lean_code: |-
      def two_gamma_LD (J_LL J_DD J_LD : Int) : Int :=
        2 * J_LD - (J_LL + J_DD)
      theorem cpm_equal_adhesion_null_tension (J J_M : Int) :
          two_gamma_LD J J J = 0 ∧ two_spreading_diff J J J_M J_M = 0
    variables: "J_{LL}, J_{DD}, J_{LD}: homotypic and heterotypic Potts bond energies; J_{LM}, J_{DM}: cell-medium bond energies; γ_{LD}: heterotypic surface tension"
    role: "Maps microscopic lattice bond energies J(τ, τ') to macroscopic tissue interfacial tensions and proves that equal adhesion zeroes the sorting force"
    source_citation: "Graner & Glazier (1992) Phys. Rev. Lett. 69(13):2013-2016 Eqs. (2)-(3); Glazier & Graner (1993) Phys. Rev. E 47(3):2128-2154 Eqs. (3)-(5)"
    code_locus: "1992-graner-cellular-potts-cell-sorting.py#L109-L154"
  - law_name: Graner & Glazier (1992) / Glazier & Graner (1993) Four Canonical Phase Regimes (Complete Engulfment, Partial Lens, Checkerboard, Dissociation)
    formula: "Complete engulfment: 0 < γ_{LD} < γ_{DM} - γ_{LM};  Partial lens: γ_{LD} > |γ_{LM} - γ_{DM}| > 0;  Checkerboard: γ_{LD} < 0;  Dissociation: γ_{αM} < 0"
    lean_decl: MathOfBiology.Loop_042.two_spreading_diff
    lean_theorem: MathOfBiology.Loop_042.graner_glazier_four_phase_regimes
    lean_locus: morphoeval/lean/loops/Loop_042_cellular_potts_cell_sorting.lean#L44-L68
    lean_code: |-
      theorem graner_glazier_four_phase_regimes :
          two_gamma_LD 14 2 11 = 6 ∧
          two_spreading_diff 14 2 16 16 = 12 ∧
          (0 < two_gamma_LD 14 2 11 ∧ two_gamma_LD 14 2 11 < two_spreading_diff 14 2 16 16) ∧
          two_gamma_LD 14 2 16 > two_spreading_diff 14 2 16 16 ∧
          two_gamma_LD 14 14 4 < 0 ∧
          two_gamma_M 14 2 < 0
    variables: "γ_{LD}: light-dark interfacial tension; γ_{LM}, γ_{DM}: light-medium and dark-medium surface tensions"
    role: "Classifies Cellular Potts cell aggregates into concentric engulfment sorting, partial lens doublets, checkerboard mixing, and cell dissociation"
    source_citation: "Graner & Glazier (1992) Phys. Rev. Lett. 69(13):2013-2016 p. 2014; Glazier & Graner (1993) Phys. Rev. E 47(3):2128-2154 Table I"
    code_locus: "1992-graner-cellular-potts-cell-sorting.py#L362-L627"
  - law_name: Cellular Potts Hamiltonian Quadratic Volume Elasticity & Single-Spin Copy Restoring Barrier
    formula: "H = ∑_{⟨i,j⟩} J(τ(σ_i), τ(σ_j))(1 - δ_{σ_i,σ_j}) + λ ∑_{σ>0} (v_σ - V_t)^2;  ΔE_{vol}^±(V_t) = +λ"
    lean_decl: MathOfBiology.Loop_042.cpm_volume_energy
    lean_theorem: MathOfBiology.Loop_042.cpm_volume_elasticity_restoring_identity
    lean_locus: morphoeval/lean/loops/Loop_042_cellular_potts_cell_sorting.lean#L70-L99
    lean_code: |-
      def cpm_volume_energy (lam v Vt : Int) : Int :=
        lam * (v - Vt) * (v - Vt)
      theorem cpm_volume_elasticity_restoring_identity (lam Vt : Int) :
          cpm_volume_energy lam Vt Vt = 0 ∧
          cpm_delta_vol_gain lam Vt Vt = lam ∧
          cpm_delta_vol_loss lam Vt Vt = lam
    variables: "H: Cellular Potts Hamiltonian; σ_i: cell spin ID at site i; v_σ: cell volume (area in 2D); V_t: target volume; λ: volume elasticity Lagrange multiplier"
    role: "Maintains finite deformable cell volumes under Metropolis boundary copy updates and establishes the single-pixel lattice pinning barrier ±λ at v = V_t"
    source_citation: "Graner & Glazier (1992) Phys. Rev. Lett. 69(13):2013-2016 Eq. (1); Glazier & Graner (1993) Phys. Rev. E 47(3):2128-2154 Eq. (1) & Section III.B"
    code_locus: "1992-graner-cellular-potts-cell-sorting.py#L502-L588"
  # ---- Pass 3 (2026-10-19 v3 remediation): Ouchi et al. (2003) perimeter / cortical tension extension ----
  - law_name: 8-Neighbour Bond-Count Perimeter of a Square Cellular Potts Cell & Compact-Square Target Perimeter P_t
    formula: "p(s × s) = 4·5 + 4(s − 2)·3 = 12 s − 4;  P_t(V_t = 16, 4 × 4) = 44;  p(s+1) − p(s) = 12"
    lean_decl: MathOfBiology.Loop_042.square_block_perimeter_8nbr
    lean_theorem: MathOfBiology.Loop_042.cpm_square_block_target_perimeter
    lean_locus: morphoeval/lean/loops/Loop_042_cellular_potts_cell_sorting.lean#L107-L125
    lean_code: |-
      def square_block_perimeter_8nbr (s : Int) : Int :=
        12 * s - 4
      theorem cpm_square_block_target_perimeter :
          square_block_perimeter_8nbr 3 = 32 ∧
          square_block_perimeter_8nbr 4 = 44 ∧
          square_block_perimeter_8nbr 5 = 56 ∧
          (∀ s : Int, square_block_perimeter_8nbr (s + 1) - square_block_perimeter_8nbr s = 12)
    variables: "s: side of the square lattice block; p: 8-neighbour bond-count perimeter (number of (site ∈ σ, 8-neighbour ∉ σ) pairs); P_t: target perimeter"
    role: "Fixes the default target perimeter of the Ouchi et al. (2003) cortical tension term so that lambda_P > 0 leaves the compact 4 × 4 initial cell energetically neutral; the P_t sweep {32, 38, 44, 50, 56} spans the 3 × 3 to 5 × 5 squares"
    source_citation: "Ouchi NB, Glazier JA, Rieu JP, Upadhyaya A, Sawada Y (2003) Physica A 329(3-4):451-458 Eq. (2) (perimeter constraint); perimeter counting convention from Glazier & Graner (1993) Phys. Rev. E 47:2128 Section II (fourth-nearest-neighbour / 8-site interaction range)"
    code_locus: "1992-graner-cellular-potts-cell-sorting.py#L164-L196"
  - law_name: Ouchi et al. (2003) Perimeter / Cortical Tension Elasticity Term & Single-Copy Perimeter Change Parity
    formula: "H_P = λ_P ∑_{σ>0} (p_σ − P_t)^2;  ΔE_P(p, k) = λ_P k (2 (p − P_t) + k);  Δp_old = 2 n_same − 8, Δp_new = 8 − 2 n_same (even, |Δp| ≤ 8);  ΔE_P(P_t, ±2) = 4 λ_P, ΔE_P(P_t, 8) = 64 λ_P"
    lean_decl: MathOfBiology.Loop_042.cpm_perimeter_energy
    lean_theorem: MathOfBiology.Loop_042.cpm_perimeter_elasticity_restoring_identity
    lean_locus: morphoeval/lean/loops/Loop_042_cellular_potts_cell_sorting.lean#L126-L178
    lean_code: |-
      def cpm_perimeter_energy (lamP p Pt : Int) : Int :=
        lamP * ((p - Pt) * (p - Pt))
      def cpm_copy_perimeter_change_old (n : Int) : Int := 2 * n - 8
      theorem cpm_perimeter_elasticity_restoring_identity (lamP Pt : Int) :
          cpm_perimeter_energy lamP Pt Pt = 0 ∧
          (∀ n : Int, 0 ≤ n → n ≤ 8 →
            (∃ m : Int, cpm_copy_perimeter_change_old n = 2 * m) ∧
            cpm_copy_perimeter_change_old n = - cpm_copy_perimeter_change_new n ∧
            -8 ≤ cpm_copy_perimeter_change_old n ∧ cpm_copy_perimeter_change_old n ≤ 8) ∧
          cpm_delta_perim lamP Pt Pt 2 = 4 * lamP ∧
          cpm_delta_perim lamP Pt Pt (-2) = 4 * lamP ∧
          cpm_delta_perim lamP Pt Pt 8 = 64 * lamP
    variables: "λ_P: cortical tension (perimeter elasticity) multiplier; p_σ: cell perimeter in 8-neighbour bonds; P_t: target perimeter; n_same: number of the copied site's 8 neighbours belonging to the leaving/joining cell; k: perimeter change"
    role: "Adds explicit cortical tension to the Graner & Glazier (1992) Hamiltonian; the parity identities are the incremental perimeter bookkeeping used in every Metropolis copy attempt (self-test check 9 verifies zero drift against a full recount), and the 64 λ_P isolated-pixel cost is the energetic barrier against cell fragmentation"
    source_citation: "Ouchi NB, Glazier JA, Rieu JP, Upadhyaya A, Sawada Y (2003) Physica A 329(3-4):451-458 Eq. (2); Farhadifar R et al. (2007) Curr. Biol. 17(24):2095-2104 Eq. (1) (vertex-model perimeter term)"
    code_locus: "1992-graner-cellular-potts-cell-sorting.py#L560-L588"
  - law_name: Cortical Tension Monotonicity Above the Target Perimeter (Effective Line Tension Against Ragged Boundaries)
    formula: "λ_P ≥ 0 ∧ p ≥ P_t ∧ k ≥ 0 ⇒ E_P(p, P_t) ≤ E_P(p + k, P_t)"
    lean_decl: MathOfBiology.Loop_042.cpm_delta_perim
    lean_theorem: MathOfBiology.Loop_042.cpm_cortical_tension_monotone_above_target
    lean_locus: morphoeval/lean/loops/Loop_042_cellular_potts_cell_sorting.lean#L180-L193
    lean_code: |-
      theorem cpm_cortical_tension_monotone_above_target
          (lamP p Pt k : Int) (hlam : 0 ≤ lamP) (hp : Pt ≤ p) (hk : 0 ≤ k) :
          cpm_perimeter_energy lamP p Pt ≤ cpm_perimeter_energy lamP (p + k) Pt
    variables: "λ_P: cortical tension multiplier; p: current cell perimeter; P_t: target perimeter; k: perimeter increase"
    role: "Proves the perimeter term is an effective cortical line tension: every perimeter increase of an already-over-target cell is energetically non-favourable, which is why RMS(p_σ − P_t) decreases monotonically with λ_P in the C2 sweep (14.05 → 1.06 bonds) and fragmentation drops (0.217 → 0.083)"
    source_citation: "Ouchi NB, Glazier JA, Rieu JP, Upadhyaya A, Sawada Y (2003) Physica A 329(3-4):451-458 Section 2; Glazier & Graner (1993) Phys. Rev. E 47:2128 Section III.B (thermal boundary roughening the term counteracts)"
    code_locus: "1992-graner-cellular-potts-cell-sorting.py#L702-L784"
