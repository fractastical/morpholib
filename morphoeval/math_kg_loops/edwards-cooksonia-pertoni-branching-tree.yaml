- law_name: Symmetric Bifurcation Daughter-to-Parent Ratio
  formula: r_daughter / r_parent = 2^(-1/3) approx 0.7937
  lean_decl: MathOfBiology.Loop_1704.law2_balance
  lean_theorem: MathOfBiology.Loop_1704.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1704_cooksonia_pertoni_branching_tree.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

