    role: Uniform rhopalial ectoderm is stable in the absence of diffusion
    source_citation: "Schnakenberg 1979 doi:10.1016/0022-5193(79)90042-0; Turing 1952 doi:10.1098/rstb.1952.0012"
    code_locus: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py
  - law_name: Turing wavenumber at the 201 µm Holocene node
    formula: "k_c = (det J / (D_u D_v))^(1/4), lambda_c = 2*pi/k_c, lambda_c * ell = 0.0002006 m"
    lean_decl: MathOfBiology.Loop_3129.detScaled
    lean_theorem: MathOfBiology.Loop_3129.turing_wavenumber_is_unstable
    lean_locus: morphoeval/lean/loops/Loop_3129_aurelia_aurita_turing_wavelength_s0.lean#L25-L29
    variables: "D_u=1, D_v=20, detScaled=100; discriminant 22500 > 8000"
    role: Selects the ocellus-detail wavelength and no other chronospecies in this 1-node series
    source_citation: "Turing 1952 doi:10.1098/rstb.1952.0012"
    code_locus: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py
  - law_name: Equal-diffusion ablation at 0 Ma
    formula: "D_u = D_v = 1 fails (D_v f_u + D_u g_v)^2 > 4 D_u D_v det J"
    lean_decl: MathOfBiology.Loop_3129.detScaled
    lean_theorem: MathOfBiology.Loop_3129.equal_diffusion_suppresses_the_mode
    lean_locus: morphoeval/lean/loops/Loop_3129_aurelia_aurita_turing_wavelength_s0.lean#L31-L35
    variables: "Same Jacobian, D_v reset from 20 to 1"
    role: Negative control. The predecessor/successor chronospecies do not exist; this is the within-node comparison.
    source_citation: "Turing 1952 doi:10.1098/rstb.1952.0012"
    code_locus: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py
  - law_name: Eight rhopalia are not the 201 µm mode count
    formula: "n_rhopalia = 8, distinct from the tier label 201"
    lean_decl: MathOfBiology.Loop_3129.eight_rhopalia
    lean_theorem: MathOfBiology.Loop_3129.eight_rhopalia
    lean_locus: morphoeval/lean/loops/Loop_3129_aurelia_aurita_turing_wavelength_s0.lean#L48-L51
    variables: "anatomical count versus micrometre label"
    role: Stops the detail-scale wavelength from being read as the spacing of the eight rhopalia
    source_citation: "Nakanishi, Hartenstein & Jacobs 2009 doi:10.1007/s00427-009-0291-y; Helm 2018 doi:10.1111/brv.12393"
    code_locus: models/2026-delphi10000-aurelia-aurita-turing-wavelength-s0.py
