equations:
  - law_name: Schnakenberg Jacobian trace and determinant
    formula: "tr J = f_u + g_v = -0.2 < 0 and det J = f_u g_v - f_v g_u = 1 > 0 at (a,b,gamma)=(0.10,0.90,1)"
    lean_decl: MathOfBiology.Loop_3129.traceScaled
    lean_theorem: MathOfBiology.Loop_3129.homogeneous_state_is_stable
