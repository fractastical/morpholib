- law_name: Symmetric Bifurcation Daughter-to-Parent Ratio
  formula: r_daughter / r_parent = 2^(-1/3) approx 0.7937
  lean_decl: MathOfBiology.Loop_1738.law2_balance
  lean_theorem: MathOfBiology.Loop_1738.law2_exact_cancellation
