- law_name: Kuramoto-Delta-Notch Synchronization Rate
  formula: d(delta_phi)/dt = -(K_c - omega_tau) sin(delta_phi)
  lean_decl: MathOfBiology.Loop_1402.law2_balance
  lean_theorem: MathOfBiology.Loop_1402.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1402_equus_scotti_clock_wavefront.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
