sim_id: hentschel-tgfb-fibronectin-limb
math_family: Multiscale Reactor-Mechanochemical Limb
model_spec:
  model: "Hentschel, Glimm, Glazier & Newman (2004) Proc. R. Soc. B / Kiskowski et al. (2004) Dev. Biol. multiscale TGF-beta / FGF-inhibitor reaction-diffusion and fibronectin haptotaxis PDE in developing Gallus gallus limb bud"
  Da: 0.5
  Di: 50.0
  diffusivity_ratio_d: 100.0
  fi: -1.0
  gi: -200.0
  k_F: 1.8
  gamma_F: 0.65
  D_R: 0.12
  chi_F: 0.85
  r_R: 0.45
  K_a: 0.60
  L_AP_um: 1150.0
  fa_stages: [3.0, 6.0, 11.0, 18.0]
  seed: 2004
  inputs:
    - datasets/tgfb_fibronectin_limb/tgfb_fibronectin_limb_reference.json
    - datasets/tgfb_fibronectin_limb/chick_limb_chondrogenesis_specimen.jpg
    - datasets/tgfb_fibronectin_limb/scout_manifest.json
equations:
  - law_name: "Equal-Diffusion (D_a = D_i) & Anti-Fibronectin No-Haptotaxis (chi_F = 0) Negative Controls"
    formula: "tr(J_0) < 0 ∧ det(J_0) > 0 ∧ D_a = D_i = D ≥ 1 ∧ χ_F = 0 ⟹ ∀ q = k^2 ≥ 0, tr(J_k) < 0 ∧ det(J_k) > 0 ∧ σ_R(q; χ_F=0) = -D_R q - r_R < 0"
    lean_decl: "MathOfBiology.Loop_014.sigma_R_no_hapto"
    lean_theorem: "MathOfBiology.Loop_014.hentschel_tgfb_inhibitor_haptotaxis_stability_controls"
    lean_locus: "morphoeval/lean/loops/Loop_014_tgfb_fibronectin_limb.lean#L21-L55"
    lean_code: |
      def tgfb_modal_trace_eq_diff (tr_J0 Dq : Int) : Int := tr_J0 - 2 * Dq
      def tgfb_modal_det_eq_diff (det_J0 neg_tr_Dq Dq_sq : Int) : Int :=
        det_J0 + neg_tr_Dq + Dq_sq
      def sigma_R_no_hapto (D_R_q r_R : Int) : Int := -D_R_q - r_R
      theorem hentschel_tgfb_inhibitor_haptotaxis_stability_controls
          (tr_J0 det_J0 Dq neg_tr_Dq Dq_sq D_R_q r_R : Int)
          (htr : tr_J0 < 0) (hdet : det_J0 > 0)
          (hDq : Dq ≥ 0) (hterm : neg_tr_Dq ≥ 0) (hsq : Dq_sq ≥ 0)
          (hDR : D_R_q ≥ 0) (hr : r_R > 0) :
          tgfb_modal_trace_eq_diff tr_J0 Dq < 0 ∧
          tgfb_modal_det_eq_diff det_J0 neg_tr_Dq Dq_sq > 0 ∧
          sigma_R_no_hapto D_R_q r_R < 0 := by
        unfold tgfb_modal_trace_eq_diff tgfb_modal_det_eq_diff sigma_R_no_hapto; omega
    variables: "c_a: activator TGF-beta concentration; c_i: FGF-dependent inhibitor concentration; R: mesenchymal cell density; χ_F: fibronectin haptotactic sensitivity; D_R: cell random motility"
    role: "Proves that equal morphogen diffusivities abolish the TGF-beta chemical prepattern and that blocking fibronectin haptotaxis (χ_F = 0, e.g. anti-fibronectin antibody or RGD peptide) abolishes mesenchymal cell condensation"
    source_citation: "Hentschel, Glimm, Glazier & Newman (2004) Proc. R. Soc. B 271(1549):1713-1722 Eqs. (2.1)-(3.6); Kiskowski et al. (2004) Dev. Biol. 271(2):372-387"
    code_locus: "2004-hentschel-tgfb-fibronectin-limb.py#L120-L225"
  - law_name: "AER-FGF Zonation & Proximodistal 1 -> 2 -> 3 -> 4 Skeletal Mode Transition"
    formula: "∂_t c_a = f_a(c_FGF) c_a + f_i c_i - c_a^3 + D_a ∇^2 c_a;  m^2(f_a) = (D_i f_a + D_a g_i) / (2 D_a D_i) = f_a - 2 ∈ {1^2, 2^2, 3^2, 4^2}"
    lean_decl: "MathOfBiology.Loop_014.hentschel_mode_sq"
    lean_theorem: "MathOfBiology.Loop_014.hentschel_fgf_zonation_proximodistal_mode_transition"
    lean_locus: "morphoeval/lean/loops/Loop_014_tgfb_fibronectin_limb.lean#L62-L96"
    lean_code: |
      def hentschel_trace_J0 (fa : Int) : Int := fa - 200
      def hentschel_mode_sq (fa : Int) : Int := fa - 2
      theorem hentschel_fgf_zonation_proximodistal_mode_transition (fa1 fa2 : Int)
          (h12 : fa1 < fa2) (h2 : fa2 < 200) :
          hentschel_mode_sq fa1 < hentschel_mode_sq fa2 ∧
          hentschel_trace_J0 fa2 < 0 ∧
          hentschel_mode_sq 3 = 1 * 1 ∧
          hentschel_mode_sq 6 = 2 * 2 ∧
          hentschel_mode_sq 11 = 3 * 3 ∧
          hentschel_mode_sq 18 = 4 * 4 := by
        unfold hentschel_mode_sq hentschel_trace_J0; omega
    variables: "c_FGF(z): distal AER fibroblast growth factor concentration; f_a(c_FGF) ∈ {3, 6, 11, 18}: FGF-modulated TGF-beta self-activation rate; m ∈ {1, 2, 3, 4}: anteroposterior skeletal condensation count"
    role: "Proves that proximodistal AER-FGF zonation monotonically increases the unstable anteroposterior wavenumber across stylopod (m=1 humerus), zeugopod (m=2 radius+ulna), chick wing autopod (m=3 digits II-IV), and hindlimb/exogenous-TGF-beta autopod (m=4 digits I-IV)"
    source_citation: "Hentschel, Glimm, Glazier & Newman (2004) Proc. R. Soc. B 271(1549):1713-1722 Eqs. (3.1)-(3.12) & Figs. 2-4"
    code_locus: "2004-hentschel-tgfb-fibronectin-limb.py#L230-L390"
  - law_name: "Fibronectin Haptotactic Positive-Feedback Amplification & Micromass Spot/Stripe Morphospace"
    formula: "∂_t F = k_F c_a^+ R_2 - γ_F F,  ∂_t R = D_R ∇^2 R - χ_F ∇·(R ∇F) + r_R R(1 - R);  J_hapto(q) = (χ_F S_F - D_R) q > 0 for χ_F S_F > D_R"
    lean_decl: "MathOfBiology.Loop_014.hapto_net_flux"
    lean_theorem: "MathOfBiology.Loop_014.hentschel_kiskowski_fibronectin_haptotaxis_amplification"
    lean_locus: "morphoeval/lean/loops/Loop_014_tgfb_fibronectin_limb.lean#L103-L130"
    lean_code: |
      def hapto_net_flux (chi_F_SF D_R q : Int) : Int := (chi_F_SF - D_R) * q
      theorem hentschel_kiskowski_fibronectin_haptotaxis_amplification
          (chi_F_SF D_R q : Int)
          (hchi : chi_F_SF > D_R) (hDR : D_R ≥ 0) (hq : q ≥ 1) :
          hapto_net_flux chi_F_SF D_R q > 0 ∧
          hapto_net_flux 0 D_R q ≤ 0 ∧
          hapto_net_flux chi_F_SF D_R q > hapto_net_flux 0 D_R q := by
        unfold hapto_net_flux
        have hdiff : chi_F_SF - D_R ≥ 1 := by omega
        have hpos : (chi_F_SF - D_R) * q ≥ 1 * 1 := Int.mul_le_mul hdiff hq (by omega) (by omega)
        have hneg : (0 - D_R) * q ≤ 0 := Int.mul_nonpos_of_nonpos_of_nonneg (by omega) (by omega)
        omega
    variables: "F(x,z,t): extracellular matrix fibronectin concentration; R_2(c_a,R): FGF/TGF-beta-differentiated prechondrogenic cell density; χ_F S_F: effective haptotactic sensitivity"
    role: "Proves that positive feedback between TGF-beta-stimulated fibronectin secretion and upward mesenchymal haptotaxis amplifies prechondrogenic cell condensations above random cell diffusion and governs the 2D micromass nodular-spot vs labyrinthine-stripe morphospace"
    source_citation: "Hentschel et al. (2004) Proc. R. Soc. B 271:1713-1722 Eqs. (2.4)-(2.9); Kiskowski et al. (2004) Dev. Biol. 271:372-387; Miura & Shiota (2000) Dev. Dyn. 217:241-249"
    code_locus: "2004-hentschel-tgfb-fibronectin-limb.py#L395-L530"
