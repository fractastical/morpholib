- law_name: French-Flag Boundary Position Scaling
  formula: x_theta = lambda_m ln(C_0 / theta_c)
  lean_decl: MathOfBiology.Loop_1327.law2_balance
  lean_theorem: MathOfBiology.Loop_1327.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1327_dactylioceras_commune_morphogen_condensation.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

