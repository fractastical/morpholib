math_family: "3D Recursive Dichotomous Tree Vector Rotation, Effective Canopy Leaf Area Optimization & Leonardo da Vinci Pipe-Model Area Conservation"
model_spec:
  model: "Honda (1971) 3D vector-rotation dichotomous tree morphogenesis (theta_1, theta_2, r_1, r_2, alpha) + Honda & Fisher (1978) effective leaf area optimization (max A_eff / A_total in Cornus controversa & Terminalia catappa) + Shinozaki (1964) / Eloy (2011) Leonardo da Vinci pipe-model cross-sectional area conservation (d_0^2 = d_1^2 + d_2^2)"
  contraction_ratio_r1: 0.90
  contraction_ratio_r2: 0.70
  cornus_theta1_deg: 26.0
  cornus_theta2_deg: 56.0
  terminalia_theta1_deg: 30.0
  terminalia_theta2_deg: 60.0
  phyllotactic_roll_alpha_deg: 137.5
  leonardo_pipe_exponent_Delta: 2.0
  tree_branching_orders: 6
  seed: 1978
  inputs:
    - datasets/dichotomous_tree_branching/dichotomous_tree_branching_reference.json
    - datasets/dichotomous_tree_branching/cornus_controversa_tiered_crown_specimen.jpg
equations:
  - law_name: "Honda (1971) Binary Dichotomous Tip Doubling & Total Internode Geometric Sum"
    formula: "N_tips(k+1) = 2 N_tips(k) = 2^{k+1},   N_total(k) = ∑_{j=0}^k 2^j = 2^{k+1} - 1"
    lean_decl: "MathOfBiology.Loop_051.honda_tips"
    lean_theorem: "MathOfBiology.Loop_051.honda_1971_dichotomous_tip_and_internode_identity"
    lean_locus: "morphoeval/lean/loops/Loop_051_dichotomous_tree_branching.lean#L25-L45"
    lean_code: |
      def honda_tips : Nat → Nat
        | 0 => 1
        | k + 1 => 2 * honda_tips k
      def honda_total_internodes : Nat → Nat
        | 0 => 1
        | k + 1 => honda_total_internodes k + honda_tips (k + 1)
      theorem honda_1971_dichotomous_tip_and_internode_identity (k : Nat) :
          honda_tips (k + 1) = 2 * honda_tips k ∧
          honda_total_internodes k + 1 = 2 * honda_tips k := by
        refine ⟨rfl, ?_⟩
        induction k with
        | zero => rfl
        | succ n ih => dsimp [honda_total_internodes, honda_tips]; omega
    variables: "k: branching generation order (0 = trunk); N_tips(k): number of terminal leaf-bearing twigs at order k; N_total(k): cumulative woody internodes across orders 0..k"
    role: "Governs exponential expansion of terminal leaf-cluster tips and total woody internode count across recursive dichotomous branching generations"
    source_citation: "Honda (1971) J. Theor. Biol. 31(2):331-338"
    code_locus: "1976-honda-dichotomous-tree-branching.py#L91-L250"
  - law_name: "Leonardo da Vinci / Shinozaki (1964) / Eloy (2011) Pipe-Model Cross-Sectional Area Invariance"
    formula: "d_parent^Δ = d_1^Δ + d_2^Δ  (Δ = 2) ⟹ ∑_{i=1}^{2^k} d_{k,i}^2 = d_trunk^2"
    lean_decl: "MathOfBiology.Loop_051.pipe_area_sq"
    lean_theorem: "MathOfBiology.Loop_051.leonardo_shinozaki_pipe_area_invariance"
    lean_locus: "morphoeval/lean/loops/Loop_051_dichotomous_tree_branching.lean#L59-L72"
    lean_code: |
      def pipe_area_sq (d : Int) : Int := d * d
      theorem leonardo_shinozaki_pipe_area_invariance
          (a0 a1 a2 a11 a12 a21 a22 d : Int)
          (h_gen1 : a0 = a1 + a2) (h_left : a1 = a11 + a12) (h_right : a2 = a21 + a22) :
          a11 + a12 + a21 + a22 = a0 ∧
          pipe_area_sq d + pipe_area_sq d = 2 * pipe_area_sq d := by
        refine ⟨?_, ?_⟩
        · omega
        · dsimp [pipe_area_sq]; omega
    variables: "d_parent: mother internode diameter; d_1, d_2: daughter branch diameters; Δ ≈ 2.0: Leonardo/Shinozaki sapwood area exponent"
    role: "Conserves total vascular sapwood cross-sectional area across every dichotomous fork and insures uniform wind-induced bending stress across self-similar tree crowns"
    source_citation: "Shinozaki et al. (1964) Jpn. J. Ecol. 14(3):97-105; Eloy (2011) Phys. Rev. Lett. 107(25):258101"
    code_locus: "1976-honda-dichotomous-tree-branching.py#L112-L222"
  - law_name: "Honda & Fisher (1978) Daughter Divergence Angle Separation & Self-Shading Avoidance Law"
    formula: "(θ_1, θ_2)^* = argmax_{(θ_1, θ_2)} A_eff(θ_1, θ_2) / A_total,   A_eff(0, 0) ≪ A_eff(θ_1^*, θ_2^*)"
    lean_decl: "MathOfBiology.Loop_051.sister_tip_transverse_sep"
    lean_theorem: "MathOfBiology.Loop_051.honda_fisher_1978_divergence_avoids_self_shading"
    lean_locus: "morphoeval/lean/loops/Loop_051_dichotomous_tree_branching.lean#L90-L127"
    lean_code: |
      def sister_tip_transverse_sep (L1 L2 sin_theta1 sin_theta2 : Int) : Int :=
        L1 * sin_theta1 + L2 * sin_theta2
      def sister_pair_effective_area (A_cluster c_sep sep : Int) : Int :=
        A_cluster + c_sep * sep
      theorem honda_fisher_1978_divergence_avoids_self_shading
          (L1 L2 sin_theta1 sin_theta2 A_cluster c_sep : Int)
          (hL1 : 0 < L1) (hL2 : 0 < L2) (ht1 : 0 < sin_theta1) (ht2 : 0 < sin_theta2)
          (hA : 0 < A_cluster) (hc : 0 < c_sep) :
          sister_tip_transverse_sep L1 L2 0 0 = 0 ∧
          0 < sister_tip_transverse_sep L1 L2 sin_theta1 sin_theta2 := by
        refine ⟨by dsimp [sister_tip_transverse_sep]; omega, ?_⟩
        dsimp [sister_tip_transverse_sep]
        have h1 : 0 < L1 * sin_theta1 := Int.mul_pos hL1 ht1
        have h2 : 0 < L2 * sin_theta2 := Int.mul_pos hL2 ht2
        omega
    variables: "θ_1, θ_2: sister branch divergence angles from parent internode axis; L_1 = r_1 L_0, L_2 = r_2 L_0: sister internode lengths; A_eff / A_total: projected non-overlapping effective leaf area ratio"
    role: "Proves that non-zero asymmetric daughter divergence angles (θ_1 ≈ 26-30°, θ_2 ≈ 56-60° in Cornus controversa and Terminalia catappa) prevent terminal leaf-cluster superposition and maximize light interception"
    source_citation: "Honda & Fisher (1978) Science 199(4331):888-890; Fisher & Honda (1979) Am. J. Bot. 66(6):633-644"
    code_locus: "1976-honda-dichotomous-tree-branching.py#L256-L430"
