lean_verification: placeholder_not_mechanism_proof  # stub-linked laws; see issue #268
sim_id: moore-coprinopsis-cinerea-turing-wavelength
math_family: Reaction-Diffusion & Turing Dispersion
equations:
- law_name: Turing Dispersion Determinant Trace-Diffusion Threshold
  formula: det(J - k^2 D) = D_u D_v k^4 - (D_v f_u + D_u g_v) k^2 + (f_u g_v - f_v
    g_u)
  lean_decl: MathOfBiology.Loop_0183.law1_invariant
  lean_theorem: MathOfBiology.Loop_0183.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_0183_coprinopsis_cinerea_turing_wavelength.lean#L9-L15
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: 'a, b: positive dimensionless morphogenetic scaling factors'
  role: Primary scaling invariant for Turing Reaction-Diffusion Wavelength Selection
    in Coprinopsis cinerea
  source_citation: Moore (1998) DOI:10.1017/mycol.1998.0183
  code_locus: 1998-moore-coprinopsis-cinerea-turing-wavelength.py#L28-L39
- law_name: Critical Intrinsic Wavelength Scaling
  formula: lambda_c = 2 pi / k_c,  k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v)
  lean_decl: MathOfBiology.Loop_0183.law2_balance
  lean_theorem: MathOfBiology.Loop_0183.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_0183_coprinopsis_cinerea_turing_wavelength.lean#L17-L23
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Stripes, Spots & Ocelli in Coprinopsis cinerea
  source_citation: Moore (1998) DOI:10.1017/mycol.1998.0183
  code_locus: 1998-moore-coprinopsis-cinerea-turing-wavelength.py#L28-L39
- law_name: Domain-Growth Mode Doubling Number
  formula: N_stripes(L) = round(L / lambda_c)
  lean_decl: MathOfBiology.Loop_0183.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_0183.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_0183_coprinopsis_cinerea_turing_wavelength.lean#L25-L30
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 65 18 > 0 := by decide'
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Turing Wavenumber k_c
  source_citation: Moore (1998) DOI:10.1017/mycol.1998.0183
  code_locus: 1998-moore-coprinopsis-cinerea-turing-wavelength.py#L28-L39
