model_spec:
  model: "Bentley, Gerhardt & Bates (2008) PLoS Comput. Biol. 4(3):e1000052, Hellström et al. (2007) Nature 445:776-780 & Jakobsson et al. (2010) Nat. Cell Biol. 12:943-953 VEGF–VEGFR2–Dll4–Notch1 Angiogenic Tip/Stalk Selection"
