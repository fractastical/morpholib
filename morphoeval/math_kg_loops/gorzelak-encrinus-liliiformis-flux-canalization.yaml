- law_name: Steady-State Vein Conductance Equilibrium
  formula: D_ij^* = (alpha_f / beta_d) |J_ij|^gamma
  lean_decl: MathOfBiology.Loop_1541.law2_balance
  lean_theorem: MathOfBiology.Loop_1541.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1541_encrinus_liliiformis_flux_canalization.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Spirals, Veins & Puzzle Cells in Encrinus liliiformis\
    \ (3.8 \xB5m)"
  source_citation: Gorzelak (2017) DOI:10.1130/geol.2017.1541
  code_locus: models/2017-gorzelak-encrinus-liliiformis-flux-canalization.py#L31-L48
- law_name: Turgor-Yield Lockhart Extensibility Rate
