- law_name: Murray Minimum-Dissipation Cubic Radius Law
  formula: r_parent^3 = r_daughter1^3 + r_daughter2^3
  lean_decl: MathOfBiology.Loop_1721.law1_invariant
  lean_theorem: MathOfBiology.Loop_1721.law1_positive_scaling
