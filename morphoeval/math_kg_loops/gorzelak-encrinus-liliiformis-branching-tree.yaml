- law_name: Symmetric Bifurcation Daughter-to-Parent Ratio
  formula: r_daughter / r_parent = 2^(-1/3) approx 0.7937
  lean_decl: MathOfBiology.Loop_1721.law2_balance
  lean_theorem: MathOfBiology.Loop_1721.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1721_encrinus_liliiformis_branching_tree.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Bifurcating Vascular/Lung Trees in Encrinus liliiformis\
    \ (5.4 \xB5m)"
  source_citation: Gorzelak (2014) DOI:10.1130/geol.2014.1721
  code_locus: models/2014-gorzelak-encrinus-liliiformis-branching-tree.py#L31-L48
- law_name: Optimal Bifurcation Angle Cosine Law
  formula: cos(theta_12) = (r_0^4 - r_1^4 - r_2^4) / (2 r_1^2 r_2^2)
  lean_decl: MathOfBiology.Loop_1721.law3_threshold_margin
