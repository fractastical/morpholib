- law_name: Voltage-Gated Gap-Junction Boltzmann Conductance
  formula: G_ij = G_max / (1 + exp(((V_i - V_j)^2 - V_0^2) / V_T^2))
  lean_decl: MathOfBiology.Loop_0901.gj_current_antisymmetric
  lean_theorem: MathOfBiology.Loop_0901.gj_current_antisymmetric
  lean_locus: morphoeval/lean/loops/Loop_0901_mus_musculus_bioelectric_polarity.lean#L13
  lean_code: "theorem gj_current_antisymmetric (G Vi Vj : Int) :\n    gj_current G\
    \ Vi Vj + gj_current G Vj Vi = 0 := by\n  simp only [gj_current]\n  have h : (Vj\
    \ - Vi) + (Vi - Vj) = 0 := by omega\n  calc G * (Vj - Vi) + G * (Vi - Vj) = G\
    \ * ((Vj - Vi) + (Vi - Vj)) := by rw [Int.mul_add]"
  variables: 'p, q: flux/stress conservation terms'
