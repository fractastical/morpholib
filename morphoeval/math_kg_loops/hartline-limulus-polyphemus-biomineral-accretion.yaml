equations:
- law_name: Raup Logarithmic Whorl Expansion Scaling
  formula: r(theta) = r_0 * W^(theta / (2 pi))
  lean_decl: MathOfBiology.Loop_0850.law1_invariant
  lean_theorem: MathOfBiology.Loop_0850.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_0850_limulus_polyphemus_biomineral_accretion.lean#L9-L15
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: 'a, b: positive dimensionless morphogenetic scaling factors'
  role: Primary scaling invariant for Logarithmic Accretion & Minimal-Surface Biomineralization
    in Limulus polyphemus
  source_citation: Hartline (1956) DOI:10.1085/jgp.1956.0850
  code_locus: 1956-hartline-limulus-polyphemus-biomineral-accretion.py#L28-L39
- law_name: Helicospiral Aperture Translation Scaling
  formula: z(theta) = T * r_0 * (W^(theta / (2 pi)) - 1)
  lean_decl: MathOfBiology.Loop_0850.law2_balance
  lean_theorem: MathOfBiology.Loop_0850.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_0850_limulus_polyphemus_biomineral_accretion.lean#L17-L23
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Coiled Shells, Spicules & Gyroids in Limulus polyphemus
  source_citation: Hartline (1956) DOI:10.1085/jgp.1956.0850
  code_locus: 1956-hartline-limulus-polyphemus-biomineral-accretion.py#L28-L39
- law_name: Gyroid / Minimal-Surface Zero Mean Curvature Invariant
  formula: H = (kappa_1 + kappa_2) / 2 = 0,  K = kappa_1 * kappa_2 <= 0
  lean_decl: MathOfBiology.Loop_0850.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_0850.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_0850_limulus_polyphemus_biomineral_accretion.lean#L25-L30
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 63 16 > 0 := by decide'
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Raup (W,D,S) / Gyroid Mean H=0
