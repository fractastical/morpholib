  - law_name: Homogeneous Schnakenberg steady state is stable
    formula: "trace(J) = f_u + g_v < 0 and det(J) = u0^2 > 0 at u0 = a + b"
    variables: "a = 0.05; b = 1; f_u = 0.9048; g_v = -1.1025; trace = -0.1977; det = 1.1025"
    lean_decl: MathOfBiology.Loop_3174.fu
    lean_theorem: MathOfBiology.Loop_3174.homogeneous_steady_state_stable
    lean_locus: morphoeval/lean/loops/Loop_3174_drosophila_affinis_turing_wavelength_s0.lean
    source_citation: "Schnakenberg 1979 DOI:10.1016/0022-5193(79)90042-0"
    role: Stability without diffusion, required before a diffusion-driven instability is meaningful
  - law_name: Turing wavenumber at 2.444 µm
    formula: "k_c^2 = (Dv f_u + Du g_v) / (2 Du Dv), lambda_c = 2 pi / k_c = 2.444 µm, with Dv/Du = 10"
    variables: "Du = 0.05101 µm^2/time after fastest-mode calibration; Dv = 0.5101; ratio = 10"
    lean_decl: MathOfBiology.Loop_3174.rdTrace
    lean_theorem: MathOfBiology.Loop_3174.diffusion_driven_instability_at_detail_scale
    lean_locus: morphoeval/lean/loops/Loop_3174_drosophila_affinis_turing_wavelength_s0.lean
    source_citation: "Turing 1952 DOI:10.1098/rstb.1952.0012"
    role: Critical wavenumber selecting the detail-tier pigment spacing
  - law_name: Equal-diffusivity ablation
    formula: "Dv = Du implies Dv f_u + Du g_v < 0, so the Turing condition fails"
