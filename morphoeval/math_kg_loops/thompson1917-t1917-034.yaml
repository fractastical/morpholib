sim_id: thompson1917-t1917-034
math_family: "Geometric: Preston (1953) four-parameter ovoid family of meridian curves for egg solids of revolution, closed by Thompson's (1917) envelope equation p_n + T(1/r + 1/r') = P"
claim_id: T1917-034
claim: "Birds' (and other hard-shelled) eggs are solids of revolution whose meridian curves form a definite, species-varying family of ovoids, comparable geometrically across species."
source_citation: "Thompson, D.W. (1917) On Growth and Form, Ch. XV, pp. 652-669 (egg section pp. 652-660)"
model_spec:
  model: "Thompson (1917) Ch. XV egg as a solid of revolution; meridian half-breadth y(x) = (c0 + c1 x + c2 x^2 + c3 x^3) sqrt(1 - x^2) on x in [-1, 1] (Preston 1953; Biggins, Thompson & Birkhead 2018); pole radius R = p(+/-1)^2; exact volume 315 V / (4 pi (L/2)^3) = 105 c0^2 + 21 (c1^2 + 2 c0 c2) + 9 (c2^2 + 2 c1 c3) + 5 c3^2; Thompson envelope equation p_n + T (1/r + 1/r') = P used as pole / equator curvature constraints"
  normalisation: "half-length = 1, axis of revolution = x, pointed pole at x = +1 when c1 < 0"
  sphere: [1.0, 0.0, 0.0, 0.0]
  guillemot_C126: [0.488075531842314, -0.245742250245919, 0.0390909091739383, 0.120514800019538]
  shape_indices: ["Elongation = 1 / max_x y(x)", "Pointedness = (1 - x*) / 2", "PolarAsymmetry = max(p(-1)^2 / p(1)^2, p(1)^2 / p(-1)^2)"]
  datasets: ["dryad.8kv2b20 (1389 eggs, 30 species)", "dryad.q8rp3 (181 species, 30 orders)"]
  seed: 1917
  inputs:
    - datasets/thompson_1917/t1917-034/t1917_034_on_the_shapes_of_eggs_and_of_c_reference.json
    - datasets/thompson_1917/t1917-034/biggins2018_data_for_comparing_indices.csv
    - datasets/thompson_1917/t1917-034/biggins2018_range_of_egg_shapes.csv
    - datasets/thompson_1917/t1917-034/biggins2018_comparison_of_fits.csv
    - datasets/thompson_1917/t1917-034/deeming2018_jab_egg_shape_composition.csv
    - datasets/thompson_1917/t1917-034/biggins2018_C126_uria_aalge_silhouette.jpg
    - datasets/thompson_1917/t1917-034/mwnh_0481_uria_aalge_eggs.jpg
    - datasets/thompson_1917/t1917-034/mwnh_0308_vanellus_vanellus_eggs.jpg
    - datasets/thompson_1917/t1917-034/mwnh_0646_strix_aluco_egg.jpg
    - datasets/thompson_1917/t1917-034/mwnh_1921_podiceps_cristatus_eggs.jpg
    - datasets/thompson_1917/t1917-034/scout_manifest.json
    - datasets/thompson_1917/t1917-034/paper_citations.bib
equations:
  - law_name: "Preston Ovoid Meridian: Pole Radii, Symmetric-Ends Criterion and Reflection Invariance of Polar Asymmetry"
    formula: "y(x) = p(x) sqrt(1 - x^2),  p(x) = c0 + c1 x + c2 x^2 + c3 x^3;  R_pole = p(±1)^2;  p(1) - p(-1) = 2 (c1 + c3);  c1 + c3 = 0 ⇒ R_+ = R_-;  R(c0, -c1, c2, -c3; +1) = R(c0, c1, c2, c3; -1);  p ≡ 1 ⇒ y^2 + x^2 = 1"
    lean_decl: "MathOfBiology.Loop_228.prestonPoly"
    lean_theorem: "MathOfBiology.Loop_228.preston_pole_asymmetry_criterion"
    lean_locus: "morphoeval/lean/loops/Thompson1917_T1917_034.lean#L40-L66"
    lean_code: |
      def prestonPoly (c0 c1 c2 c3 x : Int) : Int :=
        c0 + c1 * x + c2 * (x * x) + c3 * (x * x * x)
      def prestonHalfBreadthSq (c0 c1 c2 c3 x : Int) : Int :=
        prestonPoly c0 c1 c2 c3 x * prestonPoly c0 c1 c2 c3 x * (1 - x * x)
      def poleRadius (c0 c1 c2 c3 s : Int) : Int :=
        prestonPoly c0 c1 c2 c3 s * prestonPoly c0 c1 c2 c3 s
      theorem preston_pole_asymmetry_criterion (c0 c1 c2 c3 x : Int) :
          prestonPoly c0 c1 c2 c3 1 - prestonPoly c0 c1 c2 c3 (-1) = 2 * (c1 + c3) ∧
          (c1 + c3 = 0 → poleRadius c0 c1 c2 c3 1 = poleRadius c0 c1 c2 c3 (-1)) ∧
          poleRadius c0 (-c1) c2 (-c3) 1 = poleRadius c0 c1 c2 c3 (-1) ∧
          prestonPoly 1 0 0 0 x = 1 ∧
          prestonHalfBreadthSq 1 0 0 0 x + x * x = 1
    variables: "x: normalised axial coordinate on [-1, 1] (half-length = 1); y: normalised half-breadth; c0, c1, c2, c3: Preston (1953) coefficients (c0 breadth, c1 / c3 odd asymmetry and pointedness terms, c2 even cylindricity term); R_pole = p(±1)^2: osculating-circle radius at each pole; s = ±1: pole selector"
    role: "Defines Thompson's 'definite family' of meridian curves and derives the closed-form polar-asymmetry index PA = max(R_-/R_+, R_+/R_-) that reproduces Biggins et al.'s numerically searched index on all 1389 eggs (Pearson r = 0.99997); the symmetric-ends criterion c1 + c3 = 0 formalises Thompson's grebe / pelican / cormorant class and the sphere member formalises his owl / tortoise class"
    source_citation: "Thompson (1917) p. 652; Preston (1953) Auk 70:160-182; Biggins, Thompson & Birkhead (2018) Ecol. Evol. 8:9728-9738 Eq. (1)"
    code_locus: "thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py#L46-L70"

  - law_name: "Exact Volume of the Preston Solid of Revolution: Sphere Normalisation, Ellipsoid Breadth-Squared Scaling and End-for-End Reflection Invariance"
    formula: "315 V / (4 π (L/2)^3) = 105 c0^2 + 21 (c1^2 + 2 c0 c2) + 9 (c2^2 + 2 c1 c3) + 5 c3^2;  sphere (c0 = 1) ⇒ 105 ⇒ V = 4π/3;  V(2 c0, 0, 0, 0) = 4 V(c0, 0, 0, 0);  V(c0, -c1, c2, -c3) = V(c0, c1, c2, c3)"
    lean_decl: "MathOfBiology.Loop_228.prestonVolume315"
    lean_theorem: "MathOfBiology.Loop_228.preston_volume_sphere_ellipsoid_reflection"
    lean_locus: "morphoeval/lean/loops/Thompson1917_T1917_034.lean#L82-L92"
    lean_code: |
      def prestonVolume315 (c0 c1 c2 c3 : Int) : Int :=
        105 * (c0 * c0) + 21 * (c1 * c1 + 2 * (c0 * c2)) + 9 * (c2 * c2 + 2 * (c1 * c3)) + 5 * (c3 * c3)
      theorem preston_volume_sphere_ellipsoid_reflection (c0 c1 c2 c3 : Int) :
          prestonVolume315 1 0 0 0 = 105 ∧
          prestonVolume315 (2 * c0) 0 0 0 = 4 * prestonVolume315 c0 0 0 0 ∧
          prestonVolume315 c0 (-c1) c2 (-c3) = prestonVolume315 c0 c1 c2 c3
    variables: "V: egg volume; L: egg length (mm); c0..c3: Preston coefficients; the integral ∫_{-1}^{1} p(x)^2 (1 - x^2) dx evaluated exactly term by term (∫ x^{2k}(1 - x^2) dx = 4 / ((2k+1)(2k+3)))"
    role: "Makes the 'solid of revolution' part of the claim quantitative: the volume functional of the meridian family in closed form (checked numerically in the script's self-test against trapezoidal integration to 1e-3 on the guillemot C126) and its invariance under reversing which pole is pointed"
    source_citation: "Thompson (1917) p. 652 ('simple solids of revolution'); Biggins et al. (2018) volume computation in Analysis.R (volcc)"
    code_locus: "thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py#L72-L81"

  - law_name: "Thompson Envelope Equation p_n + T(1/r + 1/r') = P at the Poles: Sphere under Uniform Pressure and Pole-Tension Proportional to Pole Radius"
    formula: "pn r r' + T (r + r') - P r r' = 0;  at a pole r = r' = R with pn = 0:  T (R + R) - P R^2 = 0 ⇒ P R = 2 T;  0 < P ∧ Rp < Rb ⇒ P Rp < P Rb (blunt pole carries the larger tension)"
    lean_decl: "MathOfBiology.Loop_228.laplaceResidual"
    lean_theorem: "MathOfBiology.Loop_228.thompson_envelope_pole_equilibrium"
    lean_locus: "morphoeval/lean/loops/Thompson1917_T1917_034.lean#L112-L133"
    lean_code: |
      def laplaceResidual (pn T r r' P : Int) : Int :=
        pn * (r * r') + T * (r + r') - P * (r * r')
      def poleTwiceTension (P R : Int) : Int :=
        P * R
      theorem thompson_envelope_pole_equilibrium (T R P Rb Rp : Int)
          (hR : R ≠ 0) (hP : 0 < P) (hRb : Rp < Rb) :
          laplaceResidual 0 T R R P = T * (R + R) - P * (R * R) ∧
          (laplaceResidual 0 T R R P = 0 → P * R = 2 * T) ∧
          poleTwiceTension P Rp < poleTwiceTension P Rb
    variables: "pn: normal component of external (oviduct) pressure; T: membrane tension; r, r': principal radii of curvature; P: internal fluid pressure; R: common pole radius; Rb, Rp: blunt and pointed pole radii"
    role: "Formalises Thompson's p. 658 'equation of all eggs in the universe' in cleared-denominator form, derives the sphere for uniform pressure (p. 659) and shows that under his own pole assumption (pn = 0, one P) the tension is proportional to the pole radius, so his side-remark that T is greatest at the small end has the sign reversed - recorded in the audit as a mixed detail orthogonal to the shape-family claim"
    source_citation: "Thompson (1917) pp. 658-659; Thompson (1908) Nature 78:111-113"
    code_locus: "thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py#L56-L70"

  - law_name: "Thompson Cone-Ended-Cylinder Equilibrium p cos²θ = p' cos²θ': Lower External Pressure at the Tapered End"
    formula: "p a = p' a' with a = N cos^2(θ), a' = N cos^2(θ');  0 ≤ a ∧ 0 < p' ∧ a' < a ⇒ p < p'"
    lean_decl: "MathOfBiology.Loop_228.coneBalance"
    lean_theorem: "MathOfBiology.Loop_228.thompson_cone_equilibrium_tapered_end_low_pressure"
    lean_locus: "morphoeval/lean/loops/Thompson1917_T1917_034.lean#L147-L161"
    lean_code: |
      def coneBalance (p a p' a' : Int) : Prop :=
        p * a = p' * a'
      theorem thompson_cone_equilibrium_tapered_end_low_pressure (p a p' a' : Int)
          (hbal : coneBalance p a p' a') (ha : 0 ≤ a) (hp' : 0 < p') (hlt : a' < a) :
          p < p'
    variables: "p, p': radial pressures at the two conical ends; θ, θ': cone semi-angles (θ small at the tapered end); a, a': integer-scaled cos^2 of the semi-angles (N a common scale); the tapered end has the larger cos^2"
    role: "Thompson's p. 657 force balance for the guillemot-type conical egg in the oviduct; proves the direction he states ('at the more tapered end where θ is small p is small'), which underlies his claim that the pointed form favours blunt-end-first transport (p. 658)"
    source_citation: "Thompson (1917) pp. 657-658"
    code_locus: "thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py#L56-L70"

  - law_name: "Prolate-Never-Oblate: Elongation ≥ 1 and Mid-Point Maximum Breadth of the Ellipsoid Member"
    formula: "B = 2 c0 k,  L = 2 k;  c0 ≤ 1 ∧ 0 ≤ k ⇒ B ≤ L;  c0^2 (1 - x^2) ≤ c0^2 for x^2 ≥ 0;  y(0)^2 = c0^2"
    lean_decl: "MathOfBiology.Loop_228.ellipsoidBreadth"
    lean_theorem: "MathOfBiology.Loop_228.thompson_prolate_never_oblate_ellipsoid"
    lean_locus: "morphoeval/lean/loops/Thompson1917_T1917_034.lean#L173-L191"
    lean_code: |
      def ellipsoidBreadth (c0 k : Int) : Int :=
        2 * (c0 * k)
      def ellipsoidLength (k : Int) : Int :=
        2 * k
      theorem thompson_prolate_never_oblate_ellipsoid (c0 k x : Int)
          (hc : c0 ≤ 1) (hk : 0 ≤ k) (hx : 0 ≤ x * x) (hc0 : 0 ≤ c0 * c0) :
          ellipsoidBreadth c0 k ≤ ellipsoidLength k ∧
          prestonHalfBreadthSq c0 0 0 0 x ≤ c0 * c0 ∧
          prestonHalfBreadthSq c0 0 0 0 0 = c0 * c0
    variables: "B: maximum breadth; L: length; k: half-length scale (pixels or mm); c0: ellipsoid breadth coefficient (Elongation E = L/B = 1/c0); x: normalised axial coordinate"
    role: "Formalises Thompson's p. 652 statement that the egg 'is a prolate, but never an oblate, spheroid' for the ellipsoid member of the family; the script tests it empirically as min Elongation = 1.035 over 1399 eggs"
    source_citation: "Thompson (1917) p. 652"
    code_locus: "thompson/claims/t1917-034_on-the-shapes-of-eggs-and-of-certain-other-hollo.py#L56-L70"
