- law_name: Dimensionless Target Shape Index Rigidity Threshold
  formula: p_0 = P_0 / sqrt(A_0),  p_0^* = 3.813 (fluid-to-solid jamming)
  lean_decl: MathOfBiology.Loop_0560.law2_balance
  lean_theorem: MathOfBiology.Loop_0560.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_0560_echinarachnius_parma_vertex_packing.lean#L17-L23
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Polygonal Packing & Furrows in Echinarachnius parma
  source_citation: Seilacher (1983) DOI:10.1127/njg.1983.0560
  code_locus: 1983-seilacher-echinarachnius-parma-vertex-packing.py#L28-L39
- law_name: Lewis Linear Area-to-Side Scaling Law
  formula: <A_n> / <A> = (n - 2) / 4
