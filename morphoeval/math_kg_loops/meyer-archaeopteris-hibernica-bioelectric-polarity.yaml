equations:
- law_name: Membrane Voltage Gap-Junction Reaction-Diffusion Balance
  formula: C_m dV_i/dt = -I_ion(V_i) + sum_j G_ij(V_i, V_j) (V_j - V_i)
  lean_decl: MathOfBiology.Loop_1977.law1_invariant
  lean_theorem: MathOfBiology.Loop_1977.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_1977_archaeopteris_hibernica_bioelectric_polarity.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: "a, b: positive morphogenetic scaling factors at characteristic scale\
    \ L = 31 \xB5m"
  role: "Primary scaling invariant for Gap-Junction Bioelectric Bistability & Target\
    \ Polarity (31 \xB5m) in Archaeopteris hibernica"
  source_citation: Meyer (2002) DOI:10.1038/43662.2002.1977
  code_locus: models/2002-meyer-archaeopteris-hibernica-bioelectric-polarity.py#L31-L48
- law_name: Voltage-Gated Gap-Junction Boltzmann Conductance
  formula: G_ij = G_max / (1 + exp(((V_i - V_j)^2 - V_0^2) / V_T^2))
  lean_decl: MathOfBiology.Loop_1977.law2_balance
  lean_theorem: MathOfBiology.Loop_1977.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1977_archaeopteris_hibernica_bioelectric_polarity.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Target Polarity & Neural Maps in Archaeopteris hibernica\
    \ (31 \xB5m)"
  source_citation: Meyer (2002) DOI:10.1038/43662.2002.1977
  code_locus: models/2002-meyer-archaeopteris-hibernica-bioelectric-polarity.py#L31-L48
- law_name: Bistable Depolarized/Hyperpolarized Attractor Separation
  formula: Delta_V_attractor = |V_depol^* - V_hyper^*| > V_threshold
  lean_decl: MathOfBiology.Loop_1977.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_1977.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_1977_archaeopteris_hibernica_bioelectric_polarity.lean#L26-L31
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 98 21 > 0 := by decide'
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Bistable V_mem / G_ij Threshold
  source_citation: Meyer (2002) DOI:10.1038/43662.2002.1977
  code_locus: models/2002-meyer-archaeopteris-hibernica-bioelectric-polarity.py#L31-L48
