- law_name: Steady-State Vein Conductance Equilibrium
  formula: D_ij^* = (alpha_f / beta_d) |J_ij|^gamma
  lean_decl: MathOfBiology.Loop_1539.law2_balance
  lean_theorem: MathOfBiology.Loop_1539.law2_exact_cancellation
