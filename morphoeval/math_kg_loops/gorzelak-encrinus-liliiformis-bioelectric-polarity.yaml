- law_name: Voltage-Gated Gap-Junction Boltzmann Conductance
  formula: G_ij = G_max / (1 + exp(((V_i - V_j)^2 - V_0^2) / V_T^2))
  lean_decl: MathOfBiology.Loop_1991.law2_balance
  lean_theorem: MathOfBiology.Loop_1991.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1991_encrinus_liliiformis_bioelectric_polarity.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Target Polarity & Neural Maps in Encrinus liliiformis
    (12 nm)
  source_citation: Gorzelak (2017) DOI:10.1130/geol.2017.1991
  code_locus: models/2017-gorzelak-encrinus-liliiformis-bioelectric-polarity.py#L31-L48
- law_name: Bistable Depolarized/Hyperpolarized Attractor Separation
