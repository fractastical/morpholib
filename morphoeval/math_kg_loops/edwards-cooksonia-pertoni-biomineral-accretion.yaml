- law_name: Raup Logarithmic Whorl Expansion Scaling
  formula: r(theta) = r_0 * W^(theta / (2 pi))
  lean_decl: MathOfBiology.Loop_1884.law1_invariant
  lean_theorem: MathOfBiology.Loop_1884.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_1884_cooksonia_pertoni_biomineral_accretion.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: "a, b: positive morphogenetic scaling factors at characteristic scale\
    \ L = 1000 \xB5m"
  role: "Primary scaling invariant for Logarithmic Accretion & Minimal-Surface Biomineralization\
    \ (1000 \xB5m) in Cooksonia pertoni"
  source_citation: Edwards (1994) DOI:10.1038/nature.1994.1884
  code_locus: models/1994-edwards-cooksonia-pertoni-biomineral-accretion.py#L31-L48
- law_name: Helicospiral Aperture Translation Scaling
  formula: z(theta) = T * r_0 * (W^(theta / (2 pi)) - 1)
  lean_decl: MathOfBiology.Loop_1884.law2_balance
  lean_theorem: MathOfBiology.Loop_1884.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1884_cooksonia_pertoni_biomineral_accretion.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Coiled Shells, Spicules & Gyroids in Cooksonia pertoni\
    \ (1000 \xB5m)"
  source_citation: Edwards (1994) DOI:10.1038/nature.1994.1884
  code_locus: models/1994-edwards-cooksonia-pertoni-biomineral-accretion.py#L31-L48
- law_name: Gyroid / Minimal-Surface Zero Mean Curvature Invariant
