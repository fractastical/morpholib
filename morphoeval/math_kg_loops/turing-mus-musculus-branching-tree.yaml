- law_name: Murray Minimum-Dissipation Cubic Radius Law
  formula: r_parent^3 = r_daughter1^3 + r_daughter2^3
  lean_decl: MathOfBiology.Loop_0601.murray_symmetric
  lean_theorem: MathOfBiology.Loop_0601.murray_symmetric
  lean_locus: morphoeval/lean/loops/Loop_0601_mus_musculus_branching_tree.lean#L11
  lean_code: "theorem murray_symmetric (r : Nat) : murray_cube_sum r r = 2 * (r *\
    \ r * r) := by\n  simp [murray_cube_sum, Nat.two_mul]\n/-- Parent cube exceeds\
    \ either daughter cube (positive radii): cube monotonicity core step. -/\ntheorem\
    \ murray_parent_exceeds_daughter (r1 r2 : Nat) :\n    murray_cube_sum r1 r2 ≥\
    \ r1 * r1 * r1 := by"
  variables: 'a, b: positive dimensionless morphogenetic scaling factors'
  role: Primary scaling invariant for Bifurcating Tree Murray Power-Law & Tip Splitting
    in Mus musculus
  source_citation: Turing (2003) DOI:10.1242/dev.2003.0601
  code_locus: 2003-turing-mus-musculus-branching-tree.py#L28-L39
- law_name: Symmetric Bifurcation Daughter-to-Parent Ratio
  formula: r_daughter / r_parent = 2^(-1/3) approx 0.7937
  lean_decl: MathOfBiology.Loop_0601.murray_parent_exceeds_daughter
  lean_theorem: MathOfBiology.Loop_0601.murray_parent_exceeds_daughter
  lean_locus: morphoeval/lean/loops/Loop_0601_mus_musculus_branching_tree.lean#L14
  lean_code: "theorem murray_parent_exceeds_daughter (r1 r2 : Nat) :\n    murray_cube_sum\
    \ r1 r2 ≥ r1 * r1 * r1 := by\n  simp [murray_cube_sum]\n/-- Bifurcation generations:\
    \ total vessel count doubles per generation. -/\ndef vessels : Nat -> Nat"
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Bifurcating Vascular/Lung Trees in Mus musculus
  source_citation: Turing (2003) DOI:10.1242/dev.2003.0601
  code_locus: 2003-turing-mus-musculus-branching-tree.py#L28-L39
- law_name: Optimal Bifurcation Angle Cosine Law
  formula: cos(theta_12) = (r_0^4 - r_1^4 - r_2^4) / (2 r_1^2 r_2^2)
  lean_decl: MathOfBiology.Loop_0601.vessels_succ
  lean_theorem: MathOfBiology.Loop_0601.vessels_succ
  lean_locus: morphoeval/lean/loops/Loop_0601_mus_musculus_branching_tree.lean#L21
  lean_code: "theorem vessels_succ (g : Nat) : vessels (g + 1) = 2 * vessels g :=\
    \ by\n  simp [vessels]\n\nend MathOfBiology.Loop_0601"
