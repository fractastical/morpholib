- law_name: Critical Compressive Buckling Strain Threshold
  formula: epsilon_c = (1 / 4) (3 E_s / E_f)^(2/3)
  lean_decl: MathOfBiology.Loop_1756.law2_balance
  lean_theorem: MathOfBiology.Loop_1756.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1756_ichthyostega_stensioei_elastic_buckling.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Gyri, Villi, Loops & Snap-Shells in Ichthyostega
    stensioei (3.0 cm)
  source_citation: Ahlberg (2006) DOI:10.1038/nature03893
  code_locus: models/2006-ahlberg-ichthyostega-stensioei-elastic-buckling.py#L31-L48
- law_name: Post-Buckling Amplitude Square-Root Scaling
  formula: A_fold = h_f sqrt((epsilon - epsilon_c) / epsilon_c)
  lean_decl: MathOfBiology.Loop_1756.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_1756.law3_instability_criterion
