- law_name: Helicospiral Aperture Translation Scaling
  formula: z(theta) = T * r_0 * (W^(theta / (2 pi)) - 1)
  lean_decl: MathOfBiology.Loop_1835.law2_balance
  lean_theorem: MathOfBiology.Loop_1835.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1835_knightia_eocaena_biomineral_accretion.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Coiled Shells, Spicules & Gyroids in Knightia eocaena
