- law_name: Turing Dispersion Determinant Trace-Diffusion Threshold
  formula: det(J - k^2 D) = D_u D_v k^4 - (D_v f_u + D_u g_v) k^2 + (f_u g_v - f_v
    g_u)
  lean_decl: MathOfBiology.Loop_0101.mode_det_ge_det0
  lean_theorem: MathOfBiology.Loop_0101.mode_det_ge_det0
  lean_locus: morphoeval/lean/loops/Loop_0101_mus_musculus_turing_wavelength.lean#L11
  lean_code: "theorem mode_det_ge_det0 (dq a detJ0 : Nat) : mode_det dq a detJ0 ≥\
    \ detJ0 := by\n  simp [mode_det]\n/-- Negated mode trace grows by a constant step\
    \ per Fourier mode (affine in k^2). -/\ndef neg_mode_trace (base step : Nat) :\
    \ Nat -> Nat\n  | 0 => base"
  variables: 'a, b: positive dimensionless morphogenetic scaling factors'
  role: Primary scaling invariant for Turing Reaction-Diffusion Wavelength Selection
    in Mus musculus
  source_citation: Turing (1998) DOI:10.1242/dev.1998.0101
  code_locus: 1998-turing-mus-musculus-turing-wavelength.py#L28-L39
- law_name: Critical Intrinsic Wavelength Scaling
  formula: lambda_c = 2 pi / k_c,  k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v)
  lean_decl: MathOfBiology.Loop_0101.neg_trace_succ
  lean_theorem: MathOfBiology.Loop_0101.neg_trace_succ
  lean_locus: morphoeval/lean/loops/Loop_0101_mus_musculus_turing_wavelength.lean#L17
  lean_code: "theorem neg_trace_succ (base step q : Nat) :\n    neg_mode_trace base\
    \ step (q + 1) = neg_mode_trace base step q + step := by\n  simp [neg_mode_trace]\n\
    /-- Domain-growth mode count: n stripes of wavelength lam tile n * lam. -/\ndef\
    \ stripe_total (n lam : Nat) : Nat := n * lam"
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Stripes, Spots & Ocelli in Mus musculus
  source_citation: Turing (1998) DOI:10.1242/dev.1998.0101
  code_locus: 1998-turing-mus-musculus-turing-wavelength.py#L28-L39
- law_name: Domain-Growth Mode Doubling Number
  formula: N_stripes(L) = round(L / lambda_c)
  lean_decl: MathOfBiology.Loop_0101.stripe_total_succ
  lean_theorem: MathOfBiology.Loop_0101.stripe_total_succ
  lean_locus: morphoeval/lean/loops/Loop_0101_mus_musculus_turing_wavelength.lean#L22
  lean_code: "theorem stripe_total_succ (n lam : Nat) :\n    stripe_total (n + 1)\
    \ lam = stripe_total n lam + lam := by\n  simp [stripe_total, Nat.add_mul]\n\n\
    end MathOfBiology.Loop_0101"
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Turing Wavenumber k_c
  source_citation: Turing (1998) DOI:10.1242/dev.1998.0101
  code_locus: 1998-turing-mus-musculus-turing-wavelength.py#L28-L39
