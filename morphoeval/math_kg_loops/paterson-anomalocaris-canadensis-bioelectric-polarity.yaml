  source_citation: Paterson (2014) DOI:10.1038/nature10689
  code_locus: models/2014-paterson-anomalocaris-canadensis-bioelectric-polarity.py#L31-L48
- law_name: Bistable Depolarized/Hyperpolarized Attractor Separation
