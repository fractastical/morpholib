sim_id: coccolith-emiliania-calcite-rosette
math_family: "Young et al. (1992) V/R Bimodal Calcite Crystallographic Nucleation Ring (N_total = 2*N_seg, c_V . c_R = 0), Linear Proto-Coccolith Circumference Scaling & Jaya et al. (2016) Spherical Coccosphere Euler Interlocking Packing"
model_spec:
  model: "Young et al. (1992) Nature V/R Bimodal Calcite Nucleation Ring + Didymus et al. (1993) Proc. R. Soc. B Stage-Specific T-Element Anisotropic Calcite {10-14} Growth + Jaya et al. (2016) Nat. Commun. Interlocking Coccosphere Shell Mechanics + Walker et al. (2018) Ocean Acidification & CAP Control"
  governing_pde: "theta_k = 2*pi*k/N_seg (k=0..N_seg-1), c_V = (0,0,1), c_R(theta_k) = (cos theta_k, sin theta_k, 0), R_tube(N_seg) = N_seg * w_0 / (2*pi), L_d(N_seg) = N_seg * w_0 / pi + 2*L_spoke"
  vr_orthogonality_law: "N_total = 2 * N_seg (alternating V-unit and R-unit crystal nuclei around elliptical baseplate rim) and c_V . c_R(theta_k) = 0 (exact 90 deg crystallographic orthogonality)"
  scaling_law: "C_ring(N_seg) = N_seg * w_0  =>  d(L_d)/d(N_seg) = w_0 / pi > 0 (linear segment-count to coccolith distal shield length scaling across morphotypes C, R, A, B/C, B)"
  coccosphere_packing_law: "V - E + F = 2 on S^2 with trivalent contact graph 3*V = 2*E  =>  V = 2*(N_cocc - 2), E = 3*(N_cocc - 2) for F = N_cocc in [12, 24]"
  n_seg_default: 32
  w_0_um: 0.145
  l_spoke_um: 1.0114
  omega_calcite: 4.2
  seed: 2022
  inputs:
    - datasets/emiliania_calcite_rosette/emiliania_calcite_rosette_reference.json
    - datasets/emiliania_calcite_rosette/emiliania_huxleyi_coccolith_specimen.jpg
    - datasets/emiliania_calcite_rosette/scout_manifest.json
equations:
  - law_name: "Young et al. (1992) V/R Alternating Crystal Ring Parity & Orthogonal c-Axes Law"
    formula: "N_total = 2 * N_seg (N_V = N_R = N_seg, N_total mod 2 = 0)  and  c_V . c_R(theta_k) = (0,0,1) . (cos theta_k, sin theta_k, 0) = 0"
    lean_decl: "MathOfBiology.Loop_080.vr_total_nuclei"
    lean_theorem: "MathOfBiology.Loop_080.vr_crystal_ring_parity_and_orthogonal_c_axes"
    lean_locus: "morphoeval/lean/loops/Loop_080_emiliania_calcite_rosette.lean#L27-L87"
    lean_code: |
      def vr_total_nuclei (n_seg : Nat) : Nat := 2 * n_seg
      def v_unit_c_axis (cz : Int) : Vec3Int := { x := 0, y := 0, z := cz }
      def r_unit_c_axis (rx ry : Int) : Vec3Int := { x := rx, y := ry, z := 0 }
      theorem vr_crystal_ring_parity_and_orthogonal_c_axes :
          vr_total_nuclei 32 = 64 ∧ (vr_total_nuclei 32) % 2 = 0 ∧
          vec3_dot (v_unit_c_axis 1) (r_unit_c_axis 3 4) = 0 := by decide
    variables: "N_seg: radial coccolith shield segment count; N_total = 2*N_seg: alternating V and R calcite crystal nuclei on the proto-coccolith ring; c_V, c_R: calcite [0001] crystallographic c-axis vectors"
    role: "Establishes that the proto-coccolith ring nucleates exactly 2*N_seg alternating V-unit (vertical c-axis) and R-unit (radial c-axis) calcite crystals whose c-axes are strictly orthogonal (90 deg) around the entire baseplate periphery"
    source_citation: "Young et al. (1992) Nature 356:516-518; Didymus et al. (1993) Proc. R. Soc. B 252:259-264"
    code_locus: "2022-coccolith-emiliania-calcite-rosette.py#L130-L245"
  - law_name: "Linear Proto-Coccolith Ring Circumference & Distal Shield Length Scaling Law"
    formula: "C_ring(N_seg) = N_seg * w_0  =>  R_tube = (N_seg * w_0)/(2*pi)  and  L_d(N_seg) = (N_seg * w_0)/pi + 2*L_spoke"
    lean_decl: "MathOfBiology.Loop_080.distal_shield_scaled_nm"
    lean_theorem: "MathOfBiology.Loop_080.proto_coccolith_circumference_and_distal_shield_linear_scaling"
    lean_locus: "morphoeval/lean/loops/Loop_080_emiliania_calcite_rosette.lean#L93-L133"
    lean_code: |
      def proto_ring_circumference_nm (n_seg w_nm : Nat) : Nat := n_seg * w_nm
      def distal_shield_scaled_nm (n_seg w_nm two_pi_l_spoke_nm : Nat) : Nat :=
        proto_ring_circumference_nm n_seg w_nm + two_pi_l_spoke_nm
      theorem proto_coccolith_circumference_and_distal_shield_linear_scaling :
          proto_ring_circumference_nm 33 145 - proto_ring_circumference_nm 32 145 = 145 ∧
          distal_shield_scaled_nm 26 145 6355 < distal_shield_scaled_nm 32 145 6355 ∧
          distal_shield_scaled_nm 32 145 6355 < distal_shield_scaled_nm 38 145 6355 := by decide
    variables: "N_seg: radial segment number; w_0 = 0.145 um: conserved R/V crystal pair nucleation pitch; R_tube: central tube radius; L_d: distal shield major axis length"
    role: "Proves that conserved crystal nucleation spacing w_0 on the organic baseplate rim forces proto-coccolith ring circumference and distal shield diameter L_d to scale linearly with segment count N_seg across morphotypes C, R, A, B/C, and B"
    source_citation: "Young et al. (1992) Nature 356:516-518; Didymus et al. (1993) Proc. R. Soc. B 252:259-264"
    code_locus: "2022-coccolith-emiliania-calcite-rosette.py#L248-L355"
  - law_name: "Spherical Euler Polyhedral Packing & Trivalent Interlocking Coccosphere Law"
    formula: "V - E + F = 2 on S^2 with 3*V = 2*E  =>  V = 2*(N_cocc - 2), E = 3*(N_cocc - 2) for F = N_cocc in [12, 24]"
    lean_decl: "MathOfBiology.Loop_080.coccosphere_euler_characteristic"
    lean_theorem: "MathOfBiology.Loop_080.coccosphere_euler_polyhedral_packing_and_trivalent_interlock"
    lean_locus: "morphoeval/lean/loops/Loop_080_emiliania_calcite_rosette.lean#L139-L185"
    lean_code: |
      def coccosphere_vertices (f_cocc : Int) : Int := 2 * (f_cocc - 2)
      def coccosphere_edges (f_cocc : Int) : Int := 3 * (f_cocc - 2)
      def coccosphere_euler_characteristic (f_cocc : Int) : Int :=
        coccosphere_vertices f_cocc - coccosphere_edges f_cocc + f_cocc
      theorem coccosphere_euler_polyhedral_packing_and_trivalent_interlock :
          coccosphere_euler_characteristic 16 = 2 ∧
          3 * coccosphere_vertices 16 = 2 * coccosphere_edges 16 ∧
          coccosphere_edges 16 = 42 := by decide
    variables: "F = N_cocc: number of interlocking coccolith shields tiling the coccosphere; V: triple-coccolith junction vertices; E: pairwise overlapping suture edges; chi = 2: spherical Euler characteristic"
    role: "Governs the 3D topological closure and load-sharing overlap edge count E = 3*(N_cocc - 2) of interlocking spherical coccospheres under compressive loading"
    source_citation: "Jaya et al. (2016) Nat. Commun. 7:11904; Walker et al. (2018) Nat. Commun. 9:1-12"
    code_locus: "2022-coccolith-emiliania-calcite-rosette.py#L358-L455"
  - law_name: "CAP-Polysaccharide T-Shaped Hammer-Head Expansion vs Ocean Acidification Truncation Law"
    formula: "w_head(Omega_calcite, c_CAP) = w_spoke * (1 + alpha_T * c_CAP * max(Omega_calcite - 1, 0))  =>  w_head = w_spoke when Omega_calcite <= 1 or c_CAP = 0"
    lean_decl: "MathOfBiology.Loop_080.hammer_head_width_scaled"
    lean_theorem: "MathOfBiology.Loop_080.cap_polysaccharide_hammer_expansion_and_acidification_truncation"
    lean_locus: "morphoeval/lean/loops/Loop_080_emiliania_calcite_rosette.lean#L191-L231"
    lean_code: |
      def calcite_supersat_excess (omega_scaled : Nat) : Nat :=
        if omega_scaled > 100 then omega_scaled - 100 else 0
      def hammer_head_width_scaled (w_spoke cap_pct omega_scaled : Nat) : Nat :=
        w_spoke * 100 + (w_spoke * cap_pct * calcite_supersat_excess omega_scaled) / 100
      theorem cap_polysaccharide_hammer_expansion_and_acidification_truncation :
          hammer_head_width_scaled 100 28 75 = 10000 ∧
          hammer_head_width_scaled 100 0 420 = 10000 ∧
          hammer_head_width_scaled 100 28 420 > hammer_head_width_scaled 100 28 75 := by decide
    variables: "w_spoke: radial spoke shaft width; w_head: outer T-shaped hammer-head tangential width; Omega_calcite: seawater/vesicle calcite saturation state; c_CAP: coccolith-associated polysaccharide activity"
    role: "Explains why ocean acidification (Omega_calcite < 1) or loss of acidic CAP polysaccharides truncates distal T-shaped hammer heads and destroys inter-spoke rim interlocking"
    source_citation: "Didymus et al. (1993) Proc. R. Soc. B 252:259-264; Jaya et al. (2016) Nat. Commun. 7:11904; Walker et al. (2018) Nat. Commun. 9:1-12"
    code_locus: "2022-coccolith-emiliania-calcite-rosette.py#L458-L535"
