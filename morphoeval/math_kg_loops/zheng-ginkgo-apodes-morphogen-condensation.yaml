- law_name: Exponential Morphogen Decay Length
  formula: C(x) = C_0 exp(-x / lambda_m),  lambda_m = sqrt(D_m / k_deg)
  lean_decl: MathOfBiology.Loop_1352.law1_invariant
  lean_theorem: MathOfBiology.Loop_1352.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_1352_ginkgo_apodes_morphogen_condensation.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: 'a, b: positive morphogenetic scaling factors at characteristic scale
    L = 7.9 mm'
  role: Primary scaling invariant for Morphogen Gradient Positional Condensation (7.9
    mm) in Ginkgo apodes
  source_citation: Zheng (2004) DOI:10.1038/nature.2004.1352
  code_locus: models/2004-zheng-ginkgo-apodes-morphogen-condensation.py#L31-L48
- law_name: French-Flag Boundary Position Scaling
  formula: x_theta = lambda_m ln(C_0 / theta_c)
  lean_decl: MathOfBiology.Loop_1352.law2_balance
  lean_theorem: MathOfBiology.Loop_1352.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1352_ginkgo_apodes_morphogen_condensation.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Skeletal Rays & Joints in Ginkgo apodes (7.9 mm)
  source_citation: Zheng (2004) DOI:10.1038/nature.2004.1352
  code_locus: models/2004-zheng-ginkgo-apodes-morphogen-condensation.py#L31-L48
- law_name: Periodic Condensation Wavelength under Cell Traction
  formula: k_cond^2 = (tau_0 n_0 - E_ecm) / (2 mu_b)
  lean_decl: MathOfBiology.Loop_1352.law3_threshold_margin
