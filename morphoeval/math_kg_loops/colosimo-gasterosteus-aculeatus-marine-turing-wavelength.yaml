- law_name: Critical Intrinsic Wavelength Scaling
  formula: lambda_c = 2 pi / k_c,  k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v)
  lean_decl: MathOfBiology.Loop_1210.law2_balance
  lean_theorem: MathOfBiology.Loop_1210.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1210_gasterosteus_aculeatus_marine_turing_wavelength.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Stripes, Spots & Ocelli in Gasterosteus aculeatus_marine
    (2.4 mm)
  source_citation: Colosimo (2005) DOI:10.1126/science
  code_locus: models/2005-colosimo-gasterosteus-aculeatus-marine-turing-wavelength.py#L31-L48
- law_name: Domain-Growth Mode Doubling Number
  formula: N_stripes(L) = round(L / lambda_c)
  lean_decl: MathOfBiology.Loop_1210.law3_threshold_margin
