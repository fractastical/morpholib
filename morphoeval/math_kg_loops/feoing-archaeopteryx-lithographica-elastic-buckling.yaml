- law_name: Bilayer Cube-Root Wrinkling Wavelength Law
  formula: lambda_w = 2 pi h_f (E_f / (3 E_s))^(1/3)
  lean_decl: MathOfBiology.Loop_1770.law1_invariant
  lean_theorem: MathOfBiology.Loop_1770.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_1770_archaeopteryx_lithographica_elastic_buckling.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: 'a, b: positive morphogenetic scaling factors at characteristic scale
    L = 1.6 cm'
  role: Primary scaling invariant for Differential Growth Elastic Bilayer Buckling
    (1.6 cm) in Archaeopteryx lithographica
  source_citation: Feoing (2013) DOI:10.1038/ncomms.2013.1770
  code_locus: models/2013-feoing-archaeopteryx-lithographica-elastic-buckling.py#L31-L48
- law_name: Critical Compressive Buckling Strain Threshold
  formula: epsilon_c = (1 / 4) (3 E_s / E_f)^(2/3)
  lean_decl: MathOfBiology.Loop_1770.law2_balance
  lean_theorem: MathOfBiology.Loop_1770.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1770_archaeopteryx_lithographica_elastic_buckling.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Gyri, Villi, Loops & Snap-Shells in Archaeopteryx
    lithographica (1.6 cm)
  source_citation: Feoing (2013) DOI:10.1038/ncomms.2013.1770
  code_locus: models/2013-feoing-archaeopteryx-lithographica-elastic-buckling.py#L31-L48
- law_name: Post-Buckling Amplitude Square-Root Scaling
  formula: A_fold = h_f sqrt((epsilon - epsilon_c) / epsilon_c)
  lean_decl: MathOfBiology.Loop_1770.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_1770.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_1770_archaeopteryx_lithographica_elastic_buckling.lean#L26-L31
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 160 26 > 0 := by decide'
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Wrinkling lambda ~ h(E_f/E_s)^1/3
  source_citation: Feoing (2013) DOI:10.1038/ncomms.2013.1770
