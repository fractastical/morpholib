  source_citation: Klug (2005) DOI:10.1111/let.2005.1326
  code_locus: models/2005-klug-ceratites-nodosus-morphogen-condensation.py#L31-L48
- law_name: Periodic Condensation Wavelength under Cell Traction
  formula: k_cond^2 = (tau_0 n_0 - E_ecm) / (2 mu_b)
