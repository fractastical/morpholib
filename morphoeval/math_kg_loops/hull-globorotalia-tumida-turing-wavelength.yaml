  source_citation: Hull (2011) DOI:10.1038/nature.2011.1268
  code_locus: models/2011-hull-globorotalia-tumida-turing-wavelength.py#L31-L48
- law_name: Domain-Growth Mode Doubling Number
  formula: N_stripes(L) = round(L / lambda_c)
