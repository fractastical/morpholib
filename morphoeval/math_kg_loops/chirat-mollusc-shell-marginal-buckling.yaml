sim_id: chirat-mollusc-shell-marginal-buckling
math_family: "Fourth-Order Nonlinear Winkler-Beam Elastic Mantle Buckling & Accretionary Shell Kinematics"
model_spec:
  model: "Chirat, Moulton & Goriely (2013) PNAS nonlinear Winkler-beam mantle-margin buckling + Erlich et al. (2016) J. R. Soc. Interface antimarginal vs orthomarginal rib morphospace"
  governing_ode: "E * I * d^4w/ds^4 + P * d^2w/ds^2 + k * w + kappa_3 * w^3 = 0"
  critical_load_formula: "P_c = 2 * sqrt(E * I * k)"
  wavelength_formula: "lambda_c = 2 * pi * (E * I / k)^(1/4)"
  EI_mN_mm2: 1.085
  k_mN_per_mm2: 0.285
  kappa_3_mN_per_mm4: 1.250
  P_over_Pc_wildtype: 1.450
  seed: 2013
  pass3_spine_W_mm: 6.0
  pass3_spine_thickness_mm: 0.35
  pass3_damage_half_angle_deg: 5.0
  pass3_repair_k_ratio: 1.15
  pass3_heal_length_mm: 7.0
  inputs:
    - datasets/mollusc_shell_marginal_buckling/mollusc_shell_marginal_buckling_reference.json
    - datasets/mollusc_shell_marginal_buckling/ribbed_bivalve_shell_specimen.jpg
    - datasets/mollusc_shell_marginal_buckling/scout_manifest.json
    - datasets/mollusc_shell_marginal_buckling/pass3_spine_closure_damage_repair_reference.json
equations:
  - law_name: "Chirat, Moulton & Goriely (2013) Fourth-Order Winkler-Beam Mantle Buckling & Critical Load Law"
    formula: "E I ∂_s^4 w + P ∂_s^2 w + k w + κ_3 w^3 = 0,   P_c = 2√(E I k),   λ_c = 2π (E I / k)^{1/4}"
    lean_decl: "MathOfBiology.Loop_072.winkler_modal_stiffness"
    lean_theorem: "MathOfBiology.Loop_072.chirat_critical_buckling_dispersion_onset"
    lean_locus: "morphoeval/lean/loops/Loop_072_mollusc_shell_marginal_buckling.lean#L21-L51"
    lean_code: |
      def chirat_critical_load (b c : Int) : Int := 2 * b * c
      def winkler_modal_stiffness (b c P Q : Int) : Int :=
        (b * b) * (Q * Q) - P * Q + (c * c)
      theorem chirat_critical_buckling_dispersion_onset :
          winkler_modal_stiffness 1 2 (chirat_critical_load 1 2) 2 = 0 ∧
          winkler_modal_stiffness 1 2 0 2 = 8 := by decide
    variables: "w(s): transverse mantle-margin deflection; E I: mantle flexural rigidity; k: calcified shell foundation stiffness; P: compressive growth thrust; q_c = (k/(E I))^{1/4}: critical wavenumber"
    role: "Establishes the exact mechanical instability threshold P_c = 2√(E I k) and selects the intrinsic antimarginal rib wavelength λ_c = 2π(E I / k)^{1/4} along the generative shell margin"
    source_citation: "Chirat, Moulton & Goriely (2013) PNAS 110(15):6015-6020 Eqs. (1)-(4) & SI Sec. S1"
    code_locus: "2013-chirat-mollusc-shell-marginal-buckling.py#L164-L185"
    code_locus_secondary: "2013-chirat-mollusc-shell-marginal-buckling.py#L221-L359"
  - law_name: "Nonlinear Cubic Foundation Supercritical Pitchfork Rib-Amplitude Law"
    formula: "(P - P_c) q_c^2 A - (3/4) κ_3 A^3 = 0 ⟹ A_eq(P) = √(4 q_c^2 (P - P_c) / (3 κ_3))"
    lean_decl: "MathOfBiology.Loop_072.pitchfork_rib_residual"
    lean_theorem: "MathOfBiology.Loop_072.chirat_supercritical_pitchfork_bifurcation"
    lean_locus: "morphoeval/lean/loops/Loop_072_mollusc_shell_marginal_buckling.lean#L67-L84"
    lean_code: |
      def pitchfork_rib_residual (dP_q2 kappa_eff A : Int) : Int :=
        A * (dP_q2 - kappa_eff * A * A)
      theorem chirat_supercritical_pitchfork_bifurcation (dP_q2 kappa_eff : Int) :
          pitchfork_rib_residual dP_q2 kappa_eff 0 = 0 ∧
          pitchfork_rib_residual 12 3 2 = 0 ∧
          pitchfork_rib_residual 12 3 (-2) = 0 := by simp [pitchfork_rib_residual]
    variables: "A_eq: saturated post-buckling rib amplitude; κ_3: nonlinear cubic foundation stiffening; P - P_c: supercritical compressive thrust excess"
    role: "Governs the continuous saturation of antimarginal rib and spine amplitude above P_c while guaranteeing a flat unbuckled shell valve (A = 0) for P ≤ P_c"
    source_citation: "Chirat, Moulton & Goriely (2013) PNAS 110(15):6015-6020 SI Sec. S2; Erlich et al. (2016) J. R. Soc. Interface 13:20160592 Sec. 2.2"
    code_locus: "2013-chirat-mollusc-shell-marginal-buckling.py#L187-L202"
    code_locus_secondary: "2013-chirat-mollusc-shell-marginal-buckling.py#L1142-L1179"
  - law_name: "Erlich et al. (2016) Isometric Constant-Rib vs Intercalating Antimarginal Scaling Law"
    formula: "N_ribs(R) = (Φ_0 R) / λ_c(R) = (Φ_0 R / (2π)) (k / (E I))^{1/4}"
    lean_decl: "MathOfBiology.Loop_072.isometric_rib_count_invariant"
    lean_theorem: "MathOfBiology.Loop_072.erlich_antimarginal_rib_scaling_laws"
    lean_locus: "morphoeval/lean/loops/Loop_072_mollusc_shell_marginal_buckling.lean#L90-L112"
    lean_code: |
      def isometric_rib_count_invariant (m L0 lam0 : Nat) : Nat := (m * L0) * lam0
      def intercalating_rib_capacity (m n0 : Nat) : Nat := m * n0
      theorem erlich_antimarginal_rib_scaling_laws (m L0 lam0 n0 : Nat) :
          isometric_rib_count_invariant m L0 lam0 = L0 * (m * lam0) ∧
          intercalating_rib_capacity 2 14 = 28 := by
        simp [isometric_rib_count_invariant, intercalating_rib_capacity, Nat.mul_left_comm, Nat.mul_comm]
    variables: "R: shell marginal radius from umbo; Φ_0: valve fan angle; L(R) = Φ_0 R: generative margin arc length; N_ribs: total number of radial costae"
    role: "Distinguishes constant-rib-number isometric bivalve shells (e.g. Pecten jacobaeus with N_ribs = 14) from secondary rib-intercalating multicostate shells (e.g. Chlamys, Spirifer)"
    source_citation: "Erlich, Moulton, Goriely & Chirat (2016) J. R. Soc. Interface 13(123):20160592 Sec. 3 & Fig. 4"
    code_locus: "2013-chirat-mollusc-shell-marginal-buckling.py#L364-L492"
    code_locus_secondary: "2013-chirat-mollusc-shell-marginal-buckling.py#L1073-L1139"
  - law_name: "Pass 3 — Heterogeneous-Foundation Winkler Beam: Predator Chip, Mantle Repair Callus & In-Register Rib Regrowth"
    formula: "E I ∂_s^4 w + P ∂_s^2 w + k(s) w + κ_3 w^3 = 0,   k(s) = k [1 + (ρ − 1) χ_sector(s) e^{−(r − r_d)/l_heal}],   P_c,loc = 2√(E I k(s)) = √ρ · P_c,   N_adult = N − n_removed + n_regrown"
    lean_decl: "MathOfBiology.Loop_072.repaired_rib_count"
    lean_theorem: "MathOfBiology.Loop_072.chirat_repair_callus_raises_critical_load"
    lean_theorem_secondary: "MathOfBiology.Loop_072.erlich_repair_in_register_rib_count"
    lean_locus: "morphoeval/lean/loops/Loop_072_mollusc_shell_marginal_buckling.lean#L117-L148"
    lean_code: |
      theorem chirat_repair_callus_raises_critical_load (b c c' : Int)
          (hb : 0 ≤ b) (hc : c ≤ c') :
          chirat_critical_load b c ≤ chirat_critical_load b c' := by
        unfold chirat_critical_load
        have h2b : 0 ≤ 2 * b := by omega
        exact Int.mul_le_mul_of_nonneg_left hc h2b
      def repaired_rib_count (n r g : Nat) : Nat := n - r + g
      theorem erlich_repair_in_register_rib_count (n r : Nat) (h : r ≤ n) :
          repaired_rib_count n r r = n ∧ repaired_rib_count n r (r + 1) = n + 1 ∧
          repaired_rib_count 14 1 1 = 14 ∧ repaired_rib_count 14 2 3 = 15
    variables: "k(s): heterogeneous foundation stiffness; ρ = k_repair / k: repair callus stiffness ratio; χ_sector: indicator of the chipped margin sector; r_d: damage radius; l_heal: callus decay (healing) length; w_init(r_i) = w_eq(r_{i−1}) A_eq(r_i)/A_eq(r_{i−1}): template memory between accretionary stations"
    role: "Models predator-induced marginal shell damage and localized mantle repair along the accretionary trajectory: the callus raises the local critical load (transient rib suppression in the scar), ribs re-form in register for small chips (adult N = 14, registry error 0 λ, scar index 0.03), while chips wider than ~1.5–2 λ_c or stiff calluses (ρ ≥ 1.3) nucleate a rib-intercalation defect (phase diagram)"
    source_citation: "Chirat, Moulton & Goriely (2013) PNAS 110(15):6015-6020 (mechanical template of the previous margin); Vermeij (1987) Evolution and Escalation, Princeton Univ. Press (durophagous predation and repair scars)"
    code_locus: "2013-chirat-mollusc-shell-marginal-buckling.py#L748-L1035"
    code_locus_secondary: "2013-chirat-mollusc-shell-marginal-buckling.py#L221-L359"
  - law_name: "Pass 3 — Reduced Hollow-Spine Cross-Section Elastica with Self-Contact Closure"
    formula: "U[θ] = ½ E I Σ (Δθ_i/Δs)^2 Δs + ½ μ_c (θ_0^2 + θ_M^2) + ½ μ_e (|x_M − W|^2 + y_M^2) + ¼ μ_k Σ_{|i−j|>M/5} (t − d_ij)_+^2,   L = W (1 + ε),   closed ⟺ gap_neck ≤ t,   A_lin = (2/π)√(W (L − W))"
    lean_decl: "MathOfBiology.Loop_072.spine_closed"
    lean_theorem: "MathOfBiology.Loop_072.chirat_spine_self_contact_closure_monotone"
    lean_locus: "morphoeval/lean/loops/Loop_072_mollusc_shell_marginal_buckling.lean#L150-L167"
    lean_code: |
      def spine_closed (gap t : Nat) : Prop := gap ≤ t
      theorem chirat_spine_self_contact_closure_monotone (gap gap' t : Nat) :
          (spine_closed gap t → gap' ≤ gap → spine_closed gap' t) ∧
          spine_closed 2 2 ∧ ¬ spine_closed 4 2 := by
        refine ⟨fun hc h => Nat.le_trans h hc, Nat.le_refl 2, ?_⟩
        simp [spine_closed]
    variables: "θ_i: tangent angles of the planar inextensible elastica segments; W: clamped base width of the spine fold at the calcified margin; ε = (L − W)/W: mantle growth excess; t: shell wall thickness; d_ij: distance between non-adjacent material points; gap_neck: minimum inter-flank distance"
    role: "Reduced 2D stand-in for the 3D finite-strain morphoelastic shell FEM (Rudraraju et al. 2019): resolves the self-contact closure of a hollow tubular Murex spine (ε_close ≈ 4.8–5.0 for W = 6 mm, t = 0.35 mm; H/W ≈ 2.3–2.4 at closure), validated against the clamped-mode small-strain amplitude law (r > 0.9999, 2.6 % mean error) and a mesh-convergence reference at M = 224; the full 3D FEM remains a Pass 4 residual"
    source_citation: "Chirat, Moulton & Goriely (2013) PNAS 110(15):6015-6020 Fig. 4 (spine as a folded mantle margin); Moulton, Goriely & Chirat (2012) J. Theor. Biol. 311:69-79 (Kirchhoff-rod / elastica reduction of the mantle edge); Rudraraju et al. (2019) PLoS Comput. Biol. 15(7):e1007213 (3D morphoelastic FEM — residual)"
    code_locus: "2013-chirat-mollusc-shell-marginal-buckling.py#L511-L743"
    code_locus_secondary: "2013-chirat-mollusc-shell-marginal-buckling.py#L1896-L1977"
