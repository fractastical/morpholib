- law_name: Symmetric Bifurcation Daughter-to-Parent Ratio
  formula: r_daughter / r_parent = 2^(-1/3) approx 0.7937
  lean_decl: MathOfBiology.Loop_1690.law2_balance
  lean_theorem: MathOfBiology.Loop_1690.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1690_nipponites_mirabilis_branching_tree.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Bifurcating Vascular/Lung Trees in Nipponites mirabilis
