  source_citation: Okamoto (1988) DOI:10.1017/pal.1988.1690
  code_locus: models/1988-okamoto-nipponites-mirabilis-branching-tree.py#L31-L48
- law_name: Optimal Bifurcation Angle Cosine Law
  formula: cos(theta_12) = (r_0^4 - r_1^4 - r_2^4) / (2 r_1^2 r_2^2)
