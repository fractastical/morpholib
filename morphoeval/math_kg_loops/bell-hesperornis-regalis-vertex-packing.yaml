  role: "Conservation balance for Polygonal Packing & Furrows in Hesperornis regalis\
    \ (492 \xB5m)"
  source_citation: Bell (2019) DOI:10.1080/jvp.2019.1593
  code_locus: models/2019-bell-hesperornis-regalis-vertex-packing.py#L31-L48
- law_name: Lewis Linear Area-to-Side Scaling Law
