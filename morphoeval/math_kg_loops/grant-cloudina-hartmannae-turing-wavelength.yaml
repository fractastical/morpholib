- law_name: Critical Intrinsic Wavelength Scaling
  formula: lambda_c = 2 pi / k_c,  k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v)
  lean_decl: MathOfBiology.Loop_1252.law2_balance
  lean_theorem: MathOfBiology.Loop_1252.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1252_cloudina_hartmannae_turing_wavelength.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Stripes, Spots & Ocelli in Cloudina hartmannae (104\
    \ \xB5m)"
  source_citation: Grant (1990) DOI:10.2475/ajs.1990.1252
  code_locus: models/1990-grant-cloudina-hartmannae-turing-wavelength.py#L31-L48
- law_name: Domain-Growth Mode Doubling Number
  formula: N_stripes(L) = round(L / lambda_c)
