sim_id: shyer-intestinal-villi-buckling
math_family: "Föppl–von Kármán / Neo-Hookean Sequential Smooth-Muscle Mucosal Buckling (Ridges -> Zigzags -> Hexagonal Villi & Crypts)"
model_spec:
  model: "Hannezo, Prost & Joanny (2011) PRL 107:078104 & Shyer et al. (2013) Science 342:212-218 sequential smooth-muscle-constrained mucosal buckling into ridges, zigzags, and hexagonal villi"
  nu_poisson: 0.45
  epsilon_c1: 0.14
  epsilon_c2: 0.18
  alpha_3_villus: 1.35
  alpha_4_saturation: 2.40
  grid_size_N: 64
  seed: 2013
  # Pass 3 (v3) additions
  ring_fem_elements: 48
  c_lambda_tube_prefactor: 0.5513
  c_lambda_tube_prestrain_prefactor: 0.5929
  shh_bmp_cubic_gain: 0.60
  elbow_dome_gain: 1.0
  shh_cluster_quantile: 0.82
  shh_trust_fraction: 0.30
  inputs:
    - datasets/epithelial_buckling_crypt_villus/epithelial_buckling_crypt_villus_reference.json
    - datasets/epithelial_buckling_crypt_villus/intestinal_villi_crypts_specimen.jpg
    - datasets/epithelial_buckling_crypt_villus/scout_manifest.json
    - datasets/epithelial_buckling_crypt_villus/paper_citations.bib
    - datasets/epithelial_buckling_crypt_villus/tubular_shh_bmp_reference.json
    - datasets/epithelial_buckling_crypt_villus/pass3_citations.bib
equations:
  - law_name: "Hannezo–Shyer Mucosal Plate-on-Foundation Quartic Wavenumber Stationarity Law"
    formula: "N_c(q) = B_e q^2 + K_s / q^2  ⇒  ∂N_c/∂(q^2) = 0  ⇔  B_e q_*^4 = K_s,  λ_* = 2π (B_e / K_s)^(1/4),  N_c = 2√(B_e K_s)"
    lean_decl: "MathOfBiology.Loop_063.mucosal_wavenumber_residual"
    lean_theorem: "MathOfBiology.Loop_063.hannezo_shyer_wavenumber_stationarity"
    lean_locus: "morphoeval/lean/loops/Loop_063_epithelial_buckling_crypt_villus.lean#L29-L41"
    lean_code: |
      def mucosal_wavenumber_residual (q B_e K_s : Int) : Int :=
        B_e * (q * q * q * q) - K_s
      def mucosal_critical_load_scaled (q B_e K_s : Int) : Int :=
        B_e * (q * q * q * q) + K_s
      theorem hannezo_shyer_wavenumber_stationarity (q B_e : Int) :
          mucosal_wavenumber_residual q B_e (B_e * (q * q * q * q)) = 0 ∧
          mucosal_critical_load_scaled q B_e (B_e * (q * q * q * q)) = 2 * (B_e * (q * q * q * q))
    variables: "B_e = E_e h_e^3 / (12(1 - ν^2)): mucosal bending rigidity; K_s = E_s / H_s: mesenchymal Winkler foundation stiffness; q_*: critical buckling wavenumber; λ_*: characteristic mucosal folding wavelength"
    role: "Determines the characteristic buckling wavelength λ_* and critical compressive threshold N_c across embryonic stages (E8-E18) and vertebrate species (chick, quail, mouse)"
    source_citation: "Hannezo, Prost & Joanny (2011) Phys. Rev. Lett. 107:078104 Eqs. (8)-(10); Shyer et al. (2013) Science 342:212-218 p. 214 & Supplementary Text"
    code_locus: "2013-shyer-intestinal-villi-buckling.py#L202-L237"

  - law_name: "Shyer et al. (2013) Sequential Smooth-Muscle Buckling & FK506 Ablation Hierarchy"
    formula: "Regime(Δε_x, Δε_y, α_3) = 0 (smooth, Δε_x ≤ 0) < 1 (1D ridges, Δε_x > 0, Δε_y ≤ 0) < 2 (2D zigzags, Δε_x > 0, Δε_y > 0, α_3 ≤ 0) < 3 (hexagonal villi, Δε_x > 0, Δε_y > 0, α_3 > 0)"
    lean_decl: "MathOfBiology.Loop_063.shyer_buckling_regime"
    lean_theorem: "MathOfBiology.Loop_063.shyer_sequential_buckling_and_fk506_arrest"
    lean_locus: "morphoeval/lean/loops/Loop_063_epithelial_buckling_crypt_villus.lean#L60-L74"
    lean_code: |
      def shyer_buckling_regime (dex dey alpha3 : Nat) : Nat :=
        if dex == 0 then 0
        else if dey == 0 then 1
        else if alpha3 == 0 then 2
        else 3
      theorem shyer_sequential_buckling_and_fk506_arrest (ex ey a3 : Nat) :
          shyer_buckling_regime 0 0 0 = 0 ∧
          shyer_buckling_regime (ex + 1) 0 0 = 1 ∧
          shyer_buckling_regime (ex + 1) (ey + 1) 0 = 2 ∧
          shyer_buckling_regime (ex + 1) (ey + 1) (a3 + 1) = 3
    variables: "Δε_x = ε_x - ε_{c,1}: circumferential smooth-muscle strain excess; Δε_y = ε_y - ε_{c,2}: longitudinal smooth-muscle strain excess; α_3: apicobasal lumen-stroma cubic asymmetry"
    role: "Governs the sequential E6 -> E8/E10 -> E13/E14 -> E16 morphological cascade and predicts the exact arrest phenotype under stage-specific FK506 smooth-muscle inhibition or surgical slitting"
    source_citation: "Shyer et al. (2013) Science 342:212-218 Figs. 1-4"
    code_locus: "2013-shyer-intestinal-villi-buckling.py#L239-L254"
    code_locus_secondary: "2013-shyer-intestinal-villi-buckling.py#L1056-L1098"

  - law_name: "Hexagonal Villi Triad Wavevector Closure & Cubic Asymmetry Selection Law"
    formula: "q_1 + q_2 + q_3 = (2k, 0) + (-k, m) + (-k, -m) = (0, 0),  |q_i| = q_*,  ΔF_cubic = -(α_3 / 6) ∫ w^3 dx dy < 0"
    lean_decl: "MathOfBiology.Loop_063.hexagonal_triad_sum_x"
    lean_theorem: "MathOfBiology.Loop_063.hexagonal_villi_triad_closure"
    lean_locus: "morphoeval/lean/loops/Loop_063_epithelial_buckling_crypt_villus.lean#L86-L100"
    lean_code: |
      def hexagonal_triad_sum_x (k : Int) : Int := (2 * k) + (-k) + (-k)
      def hexagonal_triad_sum_y (m : Int) : Int := 0 + m + (-m)
      def hexagonal_cubic_gain (alpha3 A : Nat) : Nat := alpha3 * (A * A * A)
      theorem hexagonal_villi_triad_closure (k m : Int) (a3 amp : Nat) :
          hexagonal_triad_sum_x k = 0 ∧
          hexagonal_triad_sum_y m = 0 ∧
          hexagonal_cubic_gain (a3 + 1) (amp + 1) > 0
    variables: "q_1, q_2, q_3: resonant hexagonal wavevector triad at 120° separation; α_3: apicobasal asymmetry coefficient; A: hexagonal mode amplitude"
    role: "Explains why biaxial compression combined with apicobasal polarity/stiffness asymmetry stabilizes a 6-fold hexagonal array of protruding villi and basal crypt invaginations"
    source_citation: "Hannezo, Prost & Joanny (2011) Phys. Rev. Lett. 107:078104 p. 3; Shyer et al. (2013) Science 342:212-218 Fig. 4"
    code_locus: "2013-shyer-intestinal-villi-buckling.py#L675-L689"

  - law_name: "Tubular Circumferential Mode Quantisation on the Gut Tube (Pass 3 reduced 3D coupling)"
    formula: "K_eff = (E_s/H_s) · f_curv · f_pre,  f_curv = K_tube/K_slab (axisymmetric ring FEM = Lamé u = A r + B/r),  λ_tube = c_tube · 2π (B_e/K_eff)^(1/4),  n = round(2πR/λ_tube),  n · λ_n + (2πR mod n) = 2πR,  γ_Donnell = (E_e h_e / R²) / K_eff"
    lean_decl: "MathOfBiology.Loop_063.tubular_quantized_wavelength"
    lean_theorem: "MathOfBiology.Loop_063.tubular_mode_quantization"
    lean_locus: "morphoeval/lean/loops/Loop_063_epithelial_buckling_crypt_villus.lean#L114-L119"
    lean_code: |
      def tubular_quantized_wavelength (C n : Nat) : Nat := C / n
      theorem tubular_mode_quantization (C n : Nat) (h : 0 < n) :
          n * tubular_quantized_wavelength C n + C % n = C ∧ C % n < n
    variables: "C = 2πR_lumen: tube circumference; n: integer number of circumferential ridges / villus columns; λ_n = C/n: quantised wavelength; K_tube: ring-FEM radial stiffness of the mesenchymal annulus with rigid smooth-muscle outer wall; K_slab = M_s/H_s: curvature-free confined-slab limit; f_pre = E_tan(ε_x)/E_s neo-Hookean tangent factor (optional)"
    role: "Replaces the flat Winkler bed by the stiffness of the 3D tubular mesenchyme (Lamé-verified ring FEM), quantises the circumferential mode count on the tube (reproduces the observed 10/12/16/19/25 ridge counts to within 0.2 on average), and gauges the validity of the flat FvK reduction via the Donnell ratio (γ = 0.65 at E8 → 0.07 at E16)"
    source_citation: "Shyer et al. (2013) Science 342:212-218 Fig. 1 (lumen radius, ridge counts); Timoshenko & Goodier (1970) Theory of Elasticity §28 (Lamé thick cylinder); Donnell (1933) NACA Rep. 479"
    code_locus: "2013-shyer-intestinal-villi-buckling.py#L261-L419"
    code_locus_secondary: "2013-shyer-intestinal-villi-buckling.py#L965-L1053"

  - law_name: "Shh/BMP Mesenchymal-Cluster Localised Cubic Gain & Elbow Villus Nucleation (Pass 3)"
    formula: "Shh = G_σ ∗ [ (−∇²w)₊ (1 + ζ λ |κ_c|) ],  C = 1[Shh > q₀.₈₂],  α₃(x,y) = α₃ + g · C(x,y),  [L_op² + h_loc] δw = (g C / 2) w²  ⇒  α₃(C=1) w³ ≥ α₃(C=0) w³;  Regime(Δε_x>0, Δε_y>0, α₃+g·1) = 3 while Regime(Δε_x>0, Δε_y>0, α₃+g·0) = 2"
    lean_decl: "MathOfBiology.Loop_063.shh_bmp_local_cubic_gain"
    lean_theorem: "MathOfBiology.Loop_063.shh_bmp_elbow_localization"
    lean_theorem_secondary: "MathOfBiology.Loop_063.shh_bmp_elbow_villus_nucleation"
    lean_locus: "morphoeval/lean/loops/Loop_063_epithelial_buckling_crypt_villus.lean#L134-L149"
    lean_code: |
      def shh_bmp_local_cubic_gain (alpha3 g C : Nat) : Nat := alpha3 + g * C
      theorem shh_bmp_elbow_localization (alpha3 g w : Nat) :
          shh_bmp_local_cubic_gain alpha3 g 0 = alpha3 ∧
          shh_bmp_local_cubic_gain alpha3 g 1 = alpha3 + g ∧
          shh_bmp_local_cubic_gain alpha3 g 0 * (w * w * w) ≤ shh_bmp_local_cubic_gain alpha3 g 1 * (w * w * w)
      theorem shh_bmp_elbow_villus_nucleation (ex ey g : Nat) :
          shyer_buckling_regime (ex + 1) (ey + 1) (shh_bmp_local_cubic_gain 0 (g + 1) 0) = 2 ∧
          shyer_buckling_regime (ex + 1) (ey + 1) (shh_bmp_local_cubic_gain 0 (g + 1) 1) = 3
    variables: "w: mucosal height field; −∇²w: mean curvature (convex toward lumen on crests); κ_c = div(∇w/|∇w|): crest-contour turning curvature (proxy for the 3D dome curvature of zigzag elbows); σ = 0.16 λ: Shh diffusion length; C ∈ [0,1]: Hh-responsive mesenchymal cluster indicator (= BMP field); g = 0.60: cluster cubic gain; h_loc: mean local FvK Hessian"
    role: "Localises Shh/BMP mesenchymal cluster signaling at zigzag elbows (E13/E14 elbow enrichment 1.38–1.42×) and villus tips (E16: 1.19 clusters per villus, 83 % of cluster mass on tips), and couples it back into the FvK energy through a spatially localised apicobasal cubic gain whose linear response bulges the elbows toward the lumen (5.9 μm at E14 vs 0 in the no-signaling ablation)"
    source_citation: "Walton et al. (2012) PNAS 109:15817-15822; Shyer, Huycke, Lee, Mahadevan & Tabin (2015) Cell 161:569-580; Walton et al. (2016) Development 143:427-436; Shyer et al. (2013) Science 342:212-218 Fig. 4"
    code_locus: "2013-shyer-intestinal-villi-buckling.py#L422-L514"
    code_locus_secondary: "2013-shyer-intestinal-villi-buckling.py#L734-L793"
