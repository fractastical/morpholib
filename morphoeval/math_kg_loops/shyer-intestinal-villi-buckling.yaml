sim_id: shyer-intestinal-villi-buckling
math_family: "Föppl–von Kármán / Neo-Hookean Sequential Smooth-Muscle Mucosal Buckling (Ridges -> Zigzags -> Hexagonal Villi & Crypts)"
model_spec:
  model: "Hannezo, Prost & Joanny (2011) PRL 107:078104 & Shyer et al. (2013) Science 342:212-218 sequential smooth-muscle-constrained mucosal buckling into ridges, zigzags, and hexagonal villi"
  nu_poisson: 0.45
  epsilon_c1: 0.14
  epsilon_c2: 0.18
  alpha_3_villus: 1.35
  alpha_4_saturation: 2.40
  grid_size_N: 64
  seed: 2013
  inputs:
    - datasets/epithelial_buckling_crypt_villus/epithelial_buckling_crypt_villus_reference.json
    - datasets/epithelial_buckling_crypt_villus/intestinal_villi_crypts_specimen.jpg
    - datasets/epithelial_buckling_crypt_villus/scout_manifest.json
    - datasets/epithelial_buckling_crypt_villus/paper_citations.bib
equations:
  - law_name: "Hannezo–Shyer Mucosal Plate-on-Foundation Quartic Wavenumber Stationarity Law"
    formula: "N_c(q) = B_e q^2 + K_s / q^2  ⇒  ∂N_c/∂(q^2) = 0  ⇔  B_e q_*^4 = K_s,  λ_* = 2π (B_e / K_s)^(1/4),  N_c = 2√(B_e K_s)"
    lean_decl: "MathOfBiology.Loop_063.mucosal_wavenumber_residual"
    lean_theorem: "MathOfBiology.Loop_063.hannezo_shyer_wavenumber_stationarity"
    lean_locus: "morphoeval/lean/loops/Loop_063_epithelial_buckling_crypt_villus.lean#L27-L40"
    lean_code: |
      def mucosal_wavenumber_residual (q B_e K_s : Int) : Int :=
        B_e * (q * q * q * q) - K_s
      def mucosal_critical_load_scaled (q B_e K_s : Int) : Int :=
        B_e * (q * q * q * q) + K_s
      theorem hannezo_shyer_wavenumber_stationarity (q B_e : Int) :
          mucosal_wavenumber_residual q B_e (B_e * (q * q * q * q)) = 0 ∧
          mucosal_critical_load_scaled q B_e (B_e * (q * q * q * q)) = 2 * (B_e * (q * q * q * q))
    variables: "B_e = E_e h_e^3 / (12(1 - ν^2)): mucosal bending rigidity; K_s = E_s / H_s: mesenchymal Winkler foundation stiffness; q_*: critical buckling wavenumber; λ_*: characteristic mucosal folding wavelength"
    role: "Determines the characteristic buckling wavelength λ_* and critical compressive threshold N_c across embryonic stages (E8-E18) and vertebrate species (chick, quail, mouse)"
    source_citation: "Hannezo, Prost & Joanny (2011) Phys. Rev. Lett. 107:078104 Eqs. (8)-(10); Shyer et al. (2013) Science 342:212-218 p. 214 & Supplementary Text"
    code_locus: "2013-shyer-intestinal-villi-buckling.py#L115-L185"

  - law_name: "Shyer et al. (2013) Sequential Smooth-Muscle Buckling & FK506 Ablation Hierarchy"
    formula: "Regime(Δε_x, Δε_y, α_3) = 0 (smooth, Δε_x ≤ 0) < 1 (1D ridges, Δε_x > 0, Δε_y ≤ 0) < 2 (2D zigzags, Δε_x > 0, Δε_y > 0, α_3 ≤ 0) < 3 (hexagonal villi, Δε_x > 0, Δε_y > 0, α_3 > 0)"
    lean_decl: "MathOfBiology.Loop_063.shyer_buckling_regime"
    lean_theorem: "MathOfBiology.Loop_063.shyer_sequential_buckling_and_fk506_arrest"
    lean_locus: "morphoeval/lean/loops/Loop_063_epithelial_buckling_crypt_villus.lean#L59-L74"
    lean_code: |
      def shyer_buckling_regime (dex dey alpha3 : Nat) : Nat :=
        if dex == 0 then 0
        else if dey == 0 then 1
        else if alpha3 == 0 then 2
        else 3
      theorem shyer_sequential_buckling_and_fk506_arrest (ex ey a3 : Nat) :
          shyer_buckling_regime 0 0 0 = 0 ∧
          shyer_buckling_regime (ex + 1) 0 0 = 1 ∧
          shyer_buckling_regime (ex + 1) (ey + 1) 0 = 2 ∧
          shyer_buckling_regime (ex + 1) (ey + 1) (a3 + 1) = 3
    variables: "Δε_x = ε_x - ε_{c,1}: circumferential smooth-muscle strain excess; Δε_y = ε_y - ε_{c,2}: longitudinal smooth-muscle strain excess; α_3: apicobasal lumen-stroma cubic asymmetry"
    role: "Governs the sequential E6 -> E8/E10 -> E13/E14 -> E16 morphological cascade and predicts the exact arrest phenotype under stage-specific FK506 smooth-muscle inhibition or surgical slitting"
    source_citation: "Shyer et al. (2013) Science 342:212-218 Figs. 1-4"
    code_locus: "2013-shyer-intestinal-villi-buckling.py#L190-L330"

  - law_name: "Hexagonal Villi Triad Wavevector Closure & Cubic Asymmetry Selection Law"
    formula: "q_1 + q_2 + q_3 = (2k, 0) + (-k, m) + (-k, -m) = (0, 0),  |q_i| = q_*,  ΔF_cubic = -(α_3 / 6) ∫ w^3 dx dy < 0"
    lean_decl: "MathOfBiology.Loop_063.hexagonal_triad_sum_x"
    lean_theorem: "MathOfBiology.Loop_063.hexagonal_villi_triad_closure"
    lean_locus: "morphoeval/lean/loops/Loop_063_epithelial_buckling_crypt_villus.lean#L84-L100"
    lean_code: |
      def hexagonal_triad_sum_x (k : Int) : Int := (2 * k) + (-k) + (-k)
      def hexagonal_triad_sum_y (m : Int) : Int := 0 + m + (-m)
      def hexagonal_cubic_gain (alpha3 A : Nat) : Nat := alpha3 * (A * A * A)
      theorem hexagonal_villi_triad_closure (k m : Int) (a3 amp : Nat) :
          hexagonal_triad_sum_x k = 0 ∧
          hexagonal_triad_sum_y m = 0 ∧
          hexagonal_cubic_gain (a3 + 1) (amp + 1) > 0
    variables: "q_1, q_2, q_3: resonant hexagonal wavevector triad at 120° separation; α_3: apicobasal asymmetry coefficient; A: hexagonal mode amplitude"
    role: "Explains why biaxial compression combined with apicobasal polarity/stiffness asymmetry stabilizes a 6-fold hexagonal array of protruding villi and basal crypt invaginations"
    source_citation: "Hannezo, Prost & Joanny (2011) Phys. Rev. Lett. 107:078104 p. 3; Shyer et al. (2013) Science 342:212-218 Fig. 4"
    code_locus: "2013-shyer-intestinal-villi-buckling.py#L220-L315"
