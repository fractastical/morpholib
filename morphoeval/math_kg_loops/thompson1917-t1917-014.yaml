model_spec:
  model: "Thompson (1917) Ch. V pp. 216-263: Laplace pressure p = T(1/R1 + 1/R2) makes a uniformly tensed cell surface a CMC surface; Plateau's six surfaces of revolution; Delaunay (1841) roulettes; Lagena = unduloid or unduloid + sphere portion"
  computable_form: "Kenmotsu (1980) arc-length parametrisation r(s) = sqrt(1 + B^2 + 2B sin 2Hs)/(2H), dz/ds = (1 + B sin 2Hs)/sqrt(...)"
  composite_models:
    delaunay_flask_E7: "sphere(R) C1-joined at r_j^2 = R(1-B^2)/(4H(1-RH)) to unduloid(H, B), neck C1-joined to cylinder of length L_neck; parameters (R, B, t, L_neck, z0)"
    delaunay_bead_E8: "single unduloid bulge-to-neck window continued by its neck cylinder; parameters (H, B, z_c)"
  controls:
    null_model: "ellipsoid (smooth surface of revolution that is NOT CMC)"
    free_form: "degree-6 polynomial in r^2 (upper bound of attainable fit)"
    negative_control: "polythalamous tests (Globobulimina 64a, Quinqueloculina 66a) from the same plate"
    ablation: "sphere + cylinder flask with the unduloid shoulder removed (C0 join)"
    statistics: "nRMSE, Pearson r, two-sample KS statistic, 2-fold cross-validated nRMSE"
  decision_rule: "Delaunay-compatible iff best catalogue fit nRMSE <= min(max(0.06, 1.5 x free-form nRMSE), 0.10) and bilateral asymmetry <= 0.12 (Pass 2); Pass 1 used the fixed 0.06 gate"
  seed: deterministic (no RNG)
