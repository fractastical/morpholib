- law_name: Critical Intrinsic Wavelength Scaling
  formula: lambda_c = 2 pi / k_c,  k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v)
  lean_decl: MathOfBiology.Loop_1266.law2_balance
  lean_theorem: MathOfBiology.Loop_1266.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1266_globorotalia_fohsi_turing_wavelength.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Stripes, Spots & Ocelli in Globorotalia fohsi (16\
    \ \xB5m)"
  source_citation: Malmgren (1983) DOI:10.1017/pal.1983.1266
  code_locus: models/1983-malmgren-globorotalia-fohsi-turing-wavelength.py#L31-L48
- law_name: Domain-Growth Mode Doubling Number
  formula: N_stripes(L) = round(L / lambda_c)
