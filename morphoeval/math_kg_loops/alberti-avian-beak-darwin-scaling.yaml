sim_id: alberti-avian-beak-darwin-scaling
math_family: "Campas-Brenner Affine Scaling-and-Shear Group & Orthogonal Bmp4-Calmodulin Beak Morphospace"
model_spec:
  model: "Campas et al. (2010) PNAS 107(8):3356-3360 affine scaling-and-shear transformation + Abzhanov et al. (2004, 2006) Science/Nature Bmp4-Calmodulin beak morphogenesis"
  n_power: 1.85
  a_0: 0.52
  c_2: 0.14
  alpha_B: 0.78
  alpha_C: 0.68
  seed: 2010
  pass3_fem:
    element: "Q4 bilinear plane stress, 2x2 Gauss, thickness = W_mm"
    default_mesh: [90, 18]
    E_bone_cortical_MPa: 7000.0
    bvtv_default: 0.55
    gibson_ashby_exponent: 2.0
    E_keratin_MPa: 1500.0
    keratin_thickness_mm: 0.35
    nu: 0.30
    seed_contact_width_mm: 1.2
    load_cases: {tip_biting_x_over_L: 0.08, base_biting_x_over_L: 0.70, oblique_angle_deg: 30.0}
  inputs:
    - datasets/avian_beak_darwin_scaling/avian_beak_darwin_scaling_reference.json
    - datasets/avian_beak_darwin_scaling/darwin_finches_specimen.jpg
    - datasets/avian_beak_darwin_scaling/scout_manifest.json
    - datasets/avian_beak_darwin_scaling/paper_citations.bib
    - datasets/avian_beak_darwin_scaling/beak_fem_fracture_reference.json
    - datasets/avian_beak_darwin_scaling/pass3_citations.bib
equations:
  - law_name: "Campas-Brenner Affine Scaling-and-Shear Group Determinant & Power-Law Invariance"
    formula: "M(s_L, s_D, γ) = [[1, γ], [0, 1]] [[s_L, 0], [0, s_D]] = [[s_L, γ s_D], [0, s_D]],  det M = s_L s_D > 0;  γ = 0 ⇒ s_L^2 y = s_D a x^2"
    lean_decl: "MathOfBiology.Loop_070.affine_shear_scaling_det"
    lean_theorem: "MathOfBiology.Loop_070.campas_affine_shear_scaling_invariance"
    lean_locus: "morphoeval/lean/loops/Loop_070_avian_beak_darwin_scaling.lean#L24-L41"
    lean_code: |
      def affine_shear_scaling_det (s_L s_D gamma : Int) : Int :=
        s_L * s_D - (gamma * s_D) * 0
      theorem campas_affine_shear_scaling_invariance (s_L s_D gamma a x0 : Int) :
          affine_shear_scaling_det s_L s_D gamma = s_L * s_D ∧
          pure_scaling_parabola_residual s_L s_D a x0 = 0 ∧
          ∀ dL : Nat, affine_shear_scaling_det (Int.ofNat (dL + 1)) 1 gamma = Int.ofNat (dL + 1)
    variables: "s_L: beak length scaling factor; s_D: beak depth scaling factor; γ: dorsoventral shear parameter; (x_0, y_0): canonical beak culmen coordinates"
    role: "Establishes invertibility of the 3-parameter affine group collapsing all 6 Geospiza species under pure scaling (γ = 0) and all 14 Darwin's finch species under scaling + shear (s_L, s_D, γ)"
    source_citation: "Campas et al. (2010) PNAS 107(8):3356-3360 Eqs. (1)-(3) & Figs. 1-3"
    code_locus: "2021-alberti-avian-beak-darwin-scaling.py#L154-L371"

  - law_name: "Abzhanov et al. (2004, 2006) Orthogonal Bmp4-Calmodulin Morphogenetic Coordinate Decoupling"
    formula: "s_D(b) = d_0 + α_B b,  s_L(c) = l_0 + α_C c  ⇒  ∂(D/L)/∂b > 0,  ∂(D/L)/∂c < 0"
    lean_decl: "MathOfBiology.Loop_070.bmp4_depth_scale"
    lean_theorem: "MathOfBiology.Loop_070.abzhanov_bmp4_calmodulin_orthogonal_decoupling"
    lean_locus: "morphoeval/lean/loops/Loop_070_avian_beak_darwin_scaling.lean#L54-L66"
    lean_code: |
      def bmp4_depth_scale (d0 alpha_B b : Int) : Int :=
        d0 + alpha_B * b
      def cam_length_scale (l0 alpha_C c : Int) : Int :=
        l0 + alpha_C * c
      theorem abzhanov_bmp4_calmodulin_orthogonal_decoupling (d0 l0 b c : Int) (db dc : Nat) :
          bmp4_depth_scale d0 1 (b + Int.ofNat (db + 1)) - bmp4_depth_scale d0 1 b = Int.ofNat (db + 1) ∧
          cam_length_scale l0 1 (c + Int.ofNat (dc + 1)) - cam_length_scale l0 1 c = Int.ofNat (dc + 1)
    variables: "b: mesenchymal Bmp4 expression index; c: distal Calmodulin (CaM) expression index; α_B, α_C: morphogenetic coupling sensitivities"
    role: "Decouples evolutionary variation along the crushing depth/width axis (Bmp4 -> Geospiza magnirostris) from variation along the probing elongation axis (Calmodulin -> Geospiza scandens / Certhidea olivacea)"
    source_citation: "Abzhanov et al. (2004) Science 305:1462-1465 Figs. 2-4; Abzhanov et al. (2006) Nature 442:563-567 Figs. 2-4"
    code_locus: "2021-alberti-avian-beak-darwin-scaling.py#L377-L461"

  - law_name: "Cantilever Beak Bending Resistance & Bite-Force Quartic Bmp4 Scaling Law"
    formula: "I_beam = W D^3 / (12 L);  B_crush(2W, 2D) = 16 W D^3 = 16 B_crush(W, D)"
    lean_decl: "MathOfBiology.Loop_070.beak_bending_numerator"
    lean_theorem: "MathOfBiology.Loop_070.campas_beak_bending_quartic_bmp4_gain"
    lean_locus: "morphoeval/lean/loops/Loop_070_avian_beak_darwin_scaling.lean#L77-L87"
    lean_code: |
      def beak_bending_numerator (W D : Int) : Int :=
        W * (D * D * D)
      theorem campas_beak_bending_quartic_bmp4_gain (W D : Int) :
          beak_bending_numerator (2 * W) (2 * D) = 16 * beak_bending_numerator W D ∧
          beak_bending_numerator 2 2 = 16 * beak_bending_numerator 1 1 ∧
          beak_bending_numerator 2 3 = 54
    variables: "W: beak width (mm); D: beak depth (mm); L: beak length (mm); I_beam: cantilever bending stiffness index (mm^3)"
    role: "Explains the 22-fold mechanical bite-force advantage of high-Bmp4 deep/wide crushing beaks (Geospiza magnirostris) over high-CaM elongated probing beaks"
    source_citation: "Campas et al. (2010) PNAS 107:3356-3360; Fritz et al. (2014) J. R. Soc. Interface 11:20140284"
    code_locus: "2021-alberti-avian-beak-darwin-scaling.py#L377-L461"
    code_locus_secondary: "2021-alberti-avian-beak-darwin-scaling.py#L300-L306"

  - law_name: "Soons et al. (2010, 2015) Cantilever Peak Bending Stress — Quadratic Depth Shielding (Pass 3 FEM anchor)"
    formula: "σ_root = 6 F a / (W D^2),  a = L − x_load;  S(W, 2D) = 4 S(W, D) with S = W D^2;  W D^3 = D · S(W, D);  6 F (2a) = 2 · 6 F a"
    lean_decl: "MathOfBiology.Loop_070.cantilever_stress_denominator"
    lean_theorem: "MathOfBiology.Loop_070.soons_cantilever_peak_stress_depth_quadratic_shielding"
    lean_locus: "morphoeval/lean/loops/Loop_070_avian_beak_darwin_scaling.lean#L109-L124"
    lean_code: |
      def cantilever_stress_denominator (W D : Int) : Int :=
        W * (D * D)
      def cantilever_stress_numerator (F a : Int) : Int :=
        6 * F * a
      theorem soons_cantilever_peak_stress_depth_quadratic_shielding (W D F a : Int) :
          cantilever_stress_denominator W (2 * D) = 4 * cantilever_stress_denominator W D ∧
          beak_bending_numerator W D = D * cantilever_stress_denominator W D ∧
          cantilever_stress_numerator F (2 * a) = 2 * cantilever_stress_numerator F a ∧
          cantilever_stress_denominator 1 2 = 4
    variables: "F: seed-reaction bite force (N); a = L − x_load: lever arm from the seed contact to the clamped base (mm); W: beak width (mm); D: beak depth (mm); σ_root: Euler–Bernoulli peak bending stress (MPa)"
    role: "Closed-form anchor of the Pass 3 two-material plane-stress Q4 finite-element fracture solver: verified against FEM on a rectangular cantilever (σ ratio 0.9925, Timoshenko deflection ratio 0.9905) and, in tapered form max_x 6 F (x − x_load)/(W D(x)^2), reproduces the 14-species FEM tip-biting structural peak (log-log slope 0.971, r = 0.9986); explains the Soons (2010) stress homeostasis CV(σ)/CV(F) = 0.43 and the Soons (2015) tip-vs-base load asymmetry"
    source_citation: "Soons et al. (2010) Phil. Trans. R. Soc. B 365:1093-1098; Soons et al. (2015) PLoS ONE 10:e0129479; Herrel et al. (2005) J. Evol. Biol. 18:669-675 (bite forces)"
    code_locus: "2021-alberti-avian-beak-darwin-scaling.py#L785-L1064"
    code_locus_secondary: "2021-alberti-avian-beak-darwin-scaling.py#L1067-L1151"

  - law_name: "Gibson–Ashby Trabecular Modulus & Keratin Rhamphotheca Isostrain Load Sharing (Pass 3 two-material model)"
    formula: "E_trab = E_s (ρ/ρ_s)^2  ⇒  G(E_s, 2p) = 4 G(E_s, p) with G = E_s p^2;   E_k t_k > 0  ⇒  E_b t_b < E_k t_k + E_b t_b"
    lean_decl: "MathOfBiology.Loop_070.gibson_ashby_modulus_numerator"
    lean_theorem: "MathOfBiology.Loop_070.gibson_ashby_keratin_isostrain_shielding"
    lean_locus: "morphoeval/lean/loops/Loop_070_avian_beak_darwin_scaling.lean#L139-L153"
    lean_code: |
      def gibson_ashby_modulus_numerator (E_s p : Int) : Int :=
        E_s * (p * p)
      def composite_section_stiffness (Ek tk Eb tb : Int) : Int :=
        Ek * tk + Eb * tb
      theorem gibson_ashby_keratin_isostrain_shielding (E_s p Ek tk Eb tb : Int)
          (h : 0 < Ek * tk) :
          gibson_ashby_modulus_numerator E_s (2 * p) = 4 * gibson_ashby_modulus_numerator E_s p ∧
          Eb * tb < composite_section_stiffness Ek tk Eb tb ∧
          gibson_ashby_modulus_numerator 7000 1 = 4 * gibson_ashby_modulus_numerator 1750 1
    variables: "E_s: solid cortical bone modulus (7000 MPa); ρ/ρ_s = p/q: trabecular bone volume fraction BV/TV; E_k, t_k: keratin rhamphotheca modulus (1500 MPa) and thickness (0.35 mm); E_b, t_b: bone core modulus and depth"
    role: "Material laws of the two-material FEM: homogenises the micro-CT trabecular core (BV/TV sweep 0.25–1.0: core modulus 437–7000 MPa, keratin peak stress ratio 4.2x, tip compliance monotone) and states the isostrain null for keratin shielding; the FEM keratin→bone substitution shows shielding is a stiffness-ratio effect (−3.6% at E_k/E_core = 0.71, +11.6% at 6.6)"
    source_citation: "Gibson & Ashby (1997) Cellular Solids 2nd ed.; Soons et al. (2012) J. R. Soc. Interface 9:1787-1796; Seki et al. (2005) Acta Materialia 53:5281-5296"
    code_locus: "2021-alberti-avian-beak-darwin-scaling.py#L636-L641"
    code_locus_secondary: "2021-alberti-avian-beak-darwin-scaling.py#L1174-L1212"
