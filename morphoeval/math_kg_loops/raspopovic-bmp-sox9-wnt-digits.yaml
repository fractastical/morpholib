sim_id: raspopovic-bmp-sox9-wnt-digits
math_family: "Three-Node Receptor-Ligand Digit Network (Immobile Transcription Factor Sox9 + Diffusing Bmp & Wnt)"
model_spec:
  model: "Raspopovic et al. (2014) Science 345:566-570 3-node Bmp-Sox9-Wnt Turing digit network modulated by distal AER-FGF and Hoxd gradients"
  mu_S: 1.0
  mu_B: 1.2
  mu_W: 1.5
  k_sb: 2.5
  k_sw: 2.2
  k_bs: 1.8
  k_ws: 2.0
  D_S: 0.0
  D_B: 2.5
  D_W: 0.25
  seed: 2014
  inputs:
    - datasets/bmp_sox9_wnt_digits/bmp_sox9_wnt_digits_reference.json
    - datasets/bmp_sox9_wnt_digits/sox9_limb_digits_specimen.jpg
    - datasets/bmp_sox9_wnt_digits/scout_manifest.json
    - datasets/bmp_sox9_wnt_digits/paper_citations.bib
    - datasets/bmp_sox9_wnt_digits/limb_bud_outgrowth_fem_reference.json
    - datasets/bmp_sox9_wnt_digits/paper_citations_pass3.bib
  pass3_fem:
    element: "P1 linear triangle, lumped mass, implicit diffusion, explicit reaction, conservative ALE update"
    mesh: "nr=26 x ntheta=96 polar fan (2496 nodes, 4750 triangles), r_prox=4.2, R0=5.0 -> R1=8.4, theta_max=0.38*pi"
    growth_law: "R(t) = min(R1, R0 exp(g t)), g=0.015, T=60, dt=0.02"
    fgf_mode: "scaled (D ∝ (r/R(t))^2); alternatives material, none"
equations:
  - law_name: "Raspopovic et al. (2014) Reduced 2-Diffuser Jacobian Determinant Cancellation & Indirect Self-Activation Law"
    formula: "J_eff = [[-μ_B - k_bs k_sb / μ_S, +k_bs k_sw / μ_S], [-k_ws k_sb / μ_S, +k_ws k_sw / μ_S - μ_W]];  det(-J_3) = μ_S det(J_eff) = μ_S μ_B μ_W + k_bs k_sb μ_W - k_ws k_sw μ_B"
    lean_decl: "MathOfBiology.Loop_016.jeff_det_expanded"
    lean_theorem: "MathOfBiology.Loop_016.raspopovic_reduced_jacobian_det_cancellation"
    lean_locus: "morphoeval/lean/loops/Loop_016_bmp_sox9_wnt_digits.lean#L27-L44"
    lean_code: |
      def jeff_det_expanded (mu_B mu_W k_sb k_sw k_bs k_ws : Int) : Int :=
        (-mu_B - k_bs * k_sb) * (k_ws * k_sw - mu_W) - (k_bs * k_sw) * (-k_ws * k_sb)
      def jeff_det_reduced (mu_B mu_W k_sb k_sw k_bs k_ws : Int) : Int :=
        mu_B * mu_W + k_bs * k_sb * mu_W - k_ws * k_sw * mu_B
      theorem raspopovic_reduced_jacobian_det_cancellation (mu_W : Int) (h_loop : k_ws_sw ≥ mu_W + 1) :
          jeff_det_expanded 120 150 25 22 18 20 = jeff_det_reduced 120 150 25 22 18 20 ∧
          jeff_det_reduced 120 150 25 22 18 20 = 32700 ∧
          jeff_ww_entry 150 22 20 = 290 ∧
          (k_ws_sw - mu_W ≥ 1)
    variables: "S: cell-autonomous Sox9 transcription factor (D_S = 0); B: diffusible Bmp ligand; W: diffusible Wnt ligand; k_sb, k_sw, k_bs, k_ws: regulatory coupling rates"
    role: "Proves that eliminating the immobile transcription factor Sox9 yields an effective 2-diffuser Jacobian where double-negative Sox9-Wnt mutual inhibition generates positive effective self-activation J_WW > 0 without direct Bmp or Wnt self-activation"
    source_citation: "Raspopovic et al. (2014) Science 345:566-570 Fig. 2E & Supplementary Materials Sec. 1.2; Marcon et al. (2016) eLife 5:e14022"
    code_locus: "2014-raspopovic-bmp-sox9-wnt-digits.py#L125-L215"

  - law_name: "Raspopovic et al. (2014) Diffusion-Driven Turing Dispersion Sign Inversion Law"
    formula: "Δ_eff(q^2) = (D_B q^2 - J_BB)(D_W q^2 - J_WW) - J_BW J_WB;  Δ_eff(0) > 0,  Δ_eff(q_c^2) < 0  ⇒  σ_max(q_c) > 0"
    lean_decl: "MathOfBiology.Loop_016.turing_disp_det"
    lean_theorem: "MathOfBiology.Loop_016.raspopovic_turing_dispersion_sign_inversion"
    lean_locus: "morphoeval/lean/loops/Loop_016_bmp_sox9_wnt_digits.lean#L59-L70"
    lean_code: |
      def turing_disp_det (J_BB J_BW J_WB J_WW D_B D_W q2 : Int) : Int :=
        (D_B * q2 - J_BB) * (D_W * q2 - J_WW) - J_BW * J_WB
      theorem raspopovic_turing_dispersion_sign_inversion (q2 : Int) :
          (-570 + 290 : Int) = -280 ∧
          turing_disp_det (-570) 396 (-500) 290 250 25 0 = 32700 ∧
          turing_disp_det (-570) 396 (-500) 290 250 25 4 = -100300 ∧
          turing_disp_det (-570) 396 (-500) 290 0 0 q2 = 32700
    variables: "q: spatial wavenumber; D_B, D_W: Bmp and Wnt diffusion coefficients; σ_max(q): dominant dispersion growth rate; λ_c = 2π / q_c: intrinsic digit spacing wavelength"
    role: "Establishes diffusion-driven symmetry breaking from a linearly stable homogeneous state (tr(J_eff) < 0, det(J_eff) > 0) and determines the distal FGF-modulated digit wavelength λ(F)"
    source_citation: "Raspopovic et al. (2014) Science 345:566-570 Fig. 2E, Fig. 4A-D & Supplementary Eqs. S1-S6"
    code_locus: "2014-raspopovic-bmp-sox9-wnt-digits.py#L165-L260"

  - law_name: "Raspopovic et al. (2014) Out-of-Phase Digit-Interdigit Eigenmode Opposition Law"
    formula: "δB / δS = -k_bs / (μ_B + D_B q^2 + σ) < 0,  δW / δS = -k_ws / (μ_W + D_W q^2 + σ) < 0  ⇒  corr(Sox9, Bmp) ≈ -1, corr(Sox9, Wnt) ≈ -1"
    lean_decl: "MathOfBiology.Loop_016.sox9_ligand_phase_product"
    lean_theorem: "MathOfBiology.Loop_016.raspopovic_out_of_phase_eigenmode_opposition"
    lean_locus: "morphoeval/lean/loops/Loop_016_bmp_sox9_wnt_digits.lean#L84-L96"
    lean_code: |
      def sox9_ligand_phase_product (k_rep : Int) (dS_sq : Int) : Int :=
        -k_rep * dS_sq
      theorem raspopovic_out_of_phase_eigenmode_opposition (dS_sq : Int) (hd : dS_sq ≥ 1) :
          sox9_ligand_phase_product 1 dS_sq ≤ -1 ∧
          sox9_ligand_phase_product 18 100 = -1800 ∧
          sox9_ligand_phase_product 20 100 = -2000 ∧
          ((-18 * 10 : Int) * (-20 * 10 : Int)) = 36000
    variables: "δS, δB, δW: spatial Turing eigenmode amplitudes of Sox9, Bmp, and Wnt; γ_B, γ_W: effective wavenumber clearance rates"
    role: "Proves why Sox9 pre-cartilage digit condensations form strictly out of phase (180° anti-correlated) with both Bmp and Wnt interdigital signaling domains, while Bmp and Wnt co-localize in the interdigits"
    source_citation: "Raspopovic et al. (2014) Science 345:566-570 Fig. 2E-F & p. 567"
    code_locus: "2014-raspopovic-bmp-sox9-wnt-digits.py#L220-L340"

  # ---------------------------------------------------------------------------
  # Pass 3 (moving-boundary P1 finite-element limb-bud outgrowth mesh) — Laws 4-6
  # ---------------------------------------------------------------------------
  - law_name: "Crampin-Gaffney-Maini (1999) Growth-Dilution Shift of the Raspopovic Turing Dispersion Relation"
    formula: "Lagrangian growth with div(u) = ρ ≥ 0 adds -ρ c to every species: J_eff -> J_eff - ρ I;  Δ_ρ(q^2) = (D_B q^2 + ρ - J_BB)(D_W q^2 + ρ - J_WW) - J_BW J_WB ≥ Δ_0(q^2),  tr(J_eff) - 2ρ < 0;  Δ_0(4) = -1.003 < 0 but Δ_1.0(4) = +0.477 > 0  ⇒  σ_eff = σ(q) - ρ, patterning iff ρ < σ_max = 0.2608"
    lean_decl: "MathOfBiology.Loop_016.turing_disp_det_dilution"
    lean_theorem: "MathOfBiology.Loop_016.raspopovic_growth_dilution_stabilises_turing_mode"
    lean_locus: "morphoeval/lean/loops/Loop_016_bmp_sox9_wnt_digits.lean#L120-L133"
    lean_code: |
      def turing_disp_det_dilution (J_BB J_BW J_WB J_WW D_B D_W q2 rho : Int) : Int :=
        (D_B * q2 + rho - J_BB) * (D_W * q2 + rho - J_WW) - J_BW * J_WB
      theorem raspopovic_growth_dilution_stabilises_turing_mode (rho : Int) (h_rho : 0 ≤ rho) :
          turing_disp_det_dilution (-570) 396 (-500) 290 250 25 4 0 = -100300 ∧
          turing_disp_det_dilution (-570) 396 (-500) 290 250 25 4 100 = 47700 ∧
          turing_disp_det_dilution (-570) 396 (-500) 290 250 25 4 rho ≥
            turing_disp_det_dilution (-570) 396 (-500) 290 250 25 4 0 ∧
          (-570 + 290 : Int) - 2 * rho ≤ -280
    variables: "ρ = div(u): dilution rate of the growing Lagrangian domain; Δ_ρ(q^2): dispersion determinant with dilution; σ_eff(ρ) = σ(q) - ρ: effective Turing growth rate"
    role: "Fixes how fast the limb bud may grow out while the Bmp-Sox9-Wnt network still patterns: the discrete lumped-mass update M(t+dt) c(t+dt) = M(t)[c + dt f(c)] on the moving FEM mesh realises exp(-ρ dt) exactly, and the measured 1D dilution sweep gives slope -1.000 and threshold ρ_c = 0.265 vs σ_max = 0.2608"
    source_citation: "Crampin EJ, Gaffney EA, Maini PK (1999) Bull Math Biol 61:1093-1120 (doi:10.1006/bulm.1999.0131) Eq. (2.4); Raspopovic et al. (2014) Science 345:566-570 Fig. 4 growing-domain simulations"
    code_locus: "2014-raspopovic-bmp-sox9-wnt-digits.py#L781-L957"
    code_locus_secondary: "2014-raspopovic-bmp-sox9-wnt-digits.py#L1033-L1085 (evaluate_growth_dilution_sweep); conservative ALE update at #L883-L886 inside simulate_growing_limb_bud_fem"

  - law_name: "Sequential Digit Addition — Admissible Sox9 Ray Count is Monotone in the Distal Arc Length"
    formula: "N_rays(L_arc) = ⌊L_arc / λ_AER⌋;  L_1 ≤ L_2  ⇒  N(L_1) ≤ N(L_2);  λ_AER = 4: L = 12, 16, 20, 24 ⇒ N = 3, 4, 5, 6"
    lean_decl: "MathOfBiology.Loop_016.admissible_ray_count"
    lean_theorem: "MathOfBiology.Loop_016.raspopovic_ray_count_monotone_in_arc_length"
    lean_locus: "morphoeval/lean/loops/Loop_016_bmp_sox9_wnt_digits.lean#L146-L152"
    lean_code: |
      def admissible_ray_count (L lam_aer : Nat) : Nat := L / lam_aer
      theorem raspopovic_ray_count_monotone_in_arc_length (L1 L2 lam_aer : Nat) (h : L1 ≤ L2) :
          admissible_ray_count L1 lam_aer ≤ admissible_ray_count L2 lam_aer ∧
          admissible_ray_count 12 4 = 3 ∧ admissible_ray_count 16 4 = 4 ∧
          admissible_ray_count 20 4 = 5 ∧ admissible_ray_count 24 4 = 6
    variables: "L_arc = 2 θ_max R(t): distal handplate arc length at the AER; λ_AER: Turing wavelength at the AER; N_rays: number of Sox9 rays that fit along the arc"
    role: "Discrete law behind the 3 -> 4 -> 5 sequential ray addition observed on the moving-boundary mesh and the final-arc sweep (slope dN/dL = 0.225 vs 1/λ = 0.250, Spearman ρ = 0.97); the Sheth et al. (2012) digit-number-vs-width observation"
    source_citation: "Sheth et al. (2012) Science 338:1476-1480; Raspopovic et al. (2014) Science Fig. 4; Crampin et al. (1999) mode insertion on growing domains"
    code_locus: "2014-raspopovic-bmp-sox9-wnt-digits.py#L1088-L1120"
    code_locus_secondary: "2014-raspopovic-bmp-sox9-wnt-digits.py#L915-L923 (addition_events in simulate_growing_limb_bud_fem)"

  - law_name: "AER-Anchored Wavelength Modulation Keeps Radial Sox9 Rays Unbranched (Self-Similar Ray Count)"
    formula: "λ(r, t) = λ_AER · r / R(t)  (D ∝ (r/R(t))^2, σ_max invariant)  ⇒  2θ r / λ(r) = 2θ R / λ_AER independent of r;  cross-multiplied: (2θ r)(λ_AER R) = (2θ R)(λ_AER r)"
    lean_decl: "MathOfBiology.Loop_016.raspopovic_scaled_gradient_ray_count_invariant"
    lean_theorem: "MathOfBiology.Loop_016.raspopovic_scaled_gradient_ray_count_invariant"
    lean_locus: "morphoeval/lean/loops/Loop_016_bmp_sox9_wnt_digits.lean#L166-L168"
    lean_code: |
      theorem raspopovic_scaled_gradient_ray_count_invariant (theta2 r R lam_aer : Int) :
          (theta2 * r) * (lam_aer * R) = (theta2 * R) * (lam_aer * r) := by
        ac_rfl
    variables: "θ: fan half-angle; r: radial (proximodistal) position; R(t): current AER radius; λ_AER: wavelength at the AER"
    role: "Explains why the distal FGF / Hoxd gradient of Raspopovic et al. (2014) Fig. 4 keeps the digit rays unbranched on the widening autopod: with the gradient (fgf_mode=scaled) the FEM bifurcation range is 0 in 3/3 seeds, without it (fgf_mode=none) rays merge/split (range up to 2)"
    source_citation: "Raspopovic et al. (2014) Science 345:566-570 Fig. 4A-D & p. 569; Sheth et al. (2012) Science 338:1476-1480"
    code_locus: "2014-raspopovic-bmp-sox9-wnt-digits.py#L850-L856"
    code_locus_secondary: "2014-raspopovic-bmp-sox9-wnt-digits.py#L1123-L1139 (evaluate_fgf_modulation_ablation)"
