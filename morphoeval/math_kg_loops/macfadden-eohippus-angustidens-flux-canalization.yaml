equations:
- law_name: Nonlinear Flux-Driven Conductance Reinforcement
  formula: dD_ij/dt = alpha_f |J_ij|^gamma - beta_d D_ij
  lean_decl: MathOfBiology.Loop_1488.law1_invariant
  lean_theorem: MathOfBiology.Loop_1488.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_1488_eohippus_angustidens_flux_canalization.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: 'a, b: positive morphogenetic scaling factors at characteristic scale
    L = 2.1 cm'
  role: Primary scaling invariant for Polar Flux Canalization & Anisotropic Growth
    (2.1 cm) in Eohippus angustidens
  source_citation: Macfadden (1995) DOI:10.1017/cbo.1995.1488
  code_locus: models/1995-macfadden-eohippus-angustidens-flux-canalization.py#L31-L48
- law_name: Steady-State Vein Conductance Equilibrium
  formula: D_ij^* = (alpha_f / beta_d) |J_ij|^gamma
  lean_decl: MathOfBiology.Loop_1488.law2_balance
  lean_theorem: MathOfBiology.Loop_1488.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1488_eohippus_angustidens_flux_canalization.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Spirals, Veins & Puzzle Cells in Eohippus angustidens
    (2.1 cm)
  source_citation: Macfadden (1995) DOI:10.1017/cbo.1995.1488
  code_locus: models/1995-macfadden-eohippus-angustidens-flux-canalization.py#L31-L48
- law_name: Turgor-Yield Lockhart Extensibility Rate
  formula: dot_epsilon = phi_wall * max(0, P_turgor - Y_yield)
  lean_decl: MathOfBiology.Loop_1488.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_1488.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_1488_eohippus_angustidens_flux_canalization.lean#L26-L31
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 72 17 > 0 := by decide'
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Golden Angle / Auxin Flux
  source_citation: Macfadden (1995) DOI:10.1017/cbo.1995.1488
