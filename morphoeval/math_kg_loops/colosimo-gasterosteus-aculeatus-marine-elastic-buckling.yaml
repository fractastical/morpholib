- law_name: Critical Compressive Buckling Strain Threshold
  formula: epsilon_c = (1 / 4) (3 E_s / E_f)^(2/3)
  lean_decl: MathOfBiology.Loop_1750.law2_balance
  lean_theorem: MathOfBiology.Loop_1750.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1750_gasterosteus_aculeatus_marine_elastic_buckling.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

