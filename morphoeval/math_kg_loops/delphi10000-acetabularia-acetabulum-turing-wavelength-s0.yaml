    variables: "f_u = B-1, g_v = -A^2, A=2, B=2.9"
    role: The unpatterned apex (the developmental predecessor of this scale) is linearly stable.
    source_citation: "Turing 1952 doi:10.1098/rstb.1952.0012; Brusselator steady state as used by Holloway & Harrison 2007 doi:10.1093/aob/mcm295"
    code_locus: models/2026-delphi10000-acetabularia-acetabulum-turing-wavelength-s0.py#L96-L110
  - law_name: Turing wavenumber k_c
    formula: "k_c^2 = (D_v f_u + D_u g_v) / (2 D_u D_v), lambda_c = 2 pi / k_c"
    lean_decl: MathOfBiology.Loop_3103.cross_term_nominal
    lean_theorem: MathOfBiology.Loop_3103.turing_discriminant_nominal
    lean_locus: morphoeval/lean/loops/Loop_3103_acetabularia_acetabulum_turing_wavelength_s0.lean#L22-L34
    variables: "D_u = 10.20 µm^2/s, D_v = 122.4 µm^2/s, onset lambda = 22.67 µm, fastest mode = 25.43 µm"
    role: Wavelength selection at the 25.28 µm detail scale of the cap wall.
    source_citation: "Turing 1952 doi:10.1098/rstb.1952.0012"
    code_locus: models/2026-delphi10000-acetabularia-acetabulum-turing-wavelength-s0.py#L112-L132
  - law_name: Equal-diffusion ablation
    formula: "D_u = D_v implies D_v f_u + D_u g_v < 0, so det(k) stays positive"
    lean_decl: MathOfBiology.Loop_3103.cross_term_equal_diffusion
    lean_theorem: MathOfBiology.Loop_3103.ablation_equal_diffusion_no_turing_band
