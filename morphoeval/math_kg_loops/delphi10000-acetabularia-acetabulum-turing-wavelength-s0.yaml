    variables: "D_u = D_v = 10.20 µm^2/s"
    role: Negative control. Noise decays. No pigment ridges.
    source_citation: "Turing 1952 doi:10.1098/rstb.1952.0012"
    code_locus: models/2026-delphi10000-acetabularia-acetabulum-turing-wavelength-s0.py#L381-L386
  - law_name: Mode count on the detail patch
    formula: "N = L / lambda_c = 8 on a 202.24 µm patch; 11 tiles give 88 ridges on a cap of radius 354 µm"
    lean_decl: MathOfBiology.Loop_3103.mode_count
    lean_theorem: MathOfBiology.Loop_3103.eight_ridges_on_detail_patch
    lean_locus: morphoeval/lean/loops/Loop_3103_acetabularia_acetabulum_turing_wavelength_s0.lean#L49-L53
    variables: "L = 8 * 25.28 µm, age = 0 Ma, no successor chronospecies"
