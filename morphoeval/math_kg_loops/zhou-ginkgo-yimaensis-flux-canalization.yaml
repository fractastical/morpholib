  source_citation: Zhou (2012) DOI:10.1098/rstb.2012.1531
  code_locus: models/2012-zhou-ginkgo-yimaensis-flux-canalization.py#L31-L48
- law_name: Turgor-Yield Lockhart Extensibility Rate
  formula: dot_epsilon = phi_wall * max(0, P_turgor - Y_yield)
