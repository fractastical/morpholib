math_family: Iterative Repulsive Energy Phyllotaxis
model_spec:
  model: "Douady & Couder (1992) Phys. Rev. Lett. 68:2098 & (1996) J. Theor. Biol. 178:255 iterative magnetic-dipole repulsion phyllotaxis E(phi) = sum_k d_k(phi, phi_{n-k})^(-3) with plastochron ratio G = V*T/R_0"
  dipole_exponent_gamma: 3.0
  golden_angle_deg: 137.50776405003785
  lucas_angle_deg: 99.50155280998114
  pitchfork_G_c1_exponential_2drop: 0.77348399
  pitchfork_G_c1_exponential_full: 0.77253817
