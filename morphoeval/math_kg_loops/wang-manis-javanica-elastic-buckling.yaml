- law_name: Critical Compressive Buckling Strain Threshold
  formula: epsilon_c = (1 / 4) (3 E_s / E_f)^(2/3)
  lean_decl: MathOfBiology.Loop_1815.law2_balance
  lean_theorem: MathOfBiology.Loop_1815.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1815_manis_javanica_elastic_buckling.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Gyri, Villi, Loops & Snap-Shells in Manis javanica
    (7.8 mm)
  source_citation: Wang (2017) DOI:10.1016/actbio.2017.1815
  code_locus: models/2017-wang-manis-javanica-elastic-buckling.py#L31-L48
- law_name: Post-Buckling Amplitude Square-Root Scaling
  formula: A_fold = h_f sqrt((epsilon - epsilon_c) / epsilon_c)
