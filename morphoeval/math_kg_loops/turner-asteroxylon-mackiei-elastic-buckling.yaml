equations:
- law_name: Bilayer Cube-Root Wrinkling Wavelength Law
  formula: lambda_w = 2 pi h_f (E_f / (3 E_s))^(1/3)
  lean_decl: MathOfBiology.Loop_1796.law1_invariant
  lean_theorem: MathOfBiology.Loop_1796.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_1796_asteroxylon_mackiei_elastic_buckling.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: 'a, b: positive morphogenetic scaling factors at characteristic scale
    L = 1.6 mm'
  role: Primary scaling invariant for Differential Growth Elastic Bilayer Buckling
    (1.6 mm) in Asteroxylon mackiei
  source_citation: Turner (2024) DOI:10.1126/science
  code_locus: models/2024-turner-asteroxylon-mackiei-elastic-buckling.py#L31-L48
- law_name: Critical Compressive Buckling Strain Threshold
  formula: epsilon_c = (1 / 4) (3 E_s / E_f)^(2/3)
  lean_decl: MathOfBiology.Loop_1796.law2_balance
  lean_theorem: MathOfBiology.Loop_1796.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1796_asteroxylon_mackiei_elastic_buckling.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Gyri, Villi, Loops & Snap-Shells in Asteroxylon mackiei
    (1.6 mm)
  source_citation: Turner (2024) DOI:10.1126/science
  code_locus: models/2024-turner-asteroxylon-mackiei-elastic-buckling.py#L31-L48
- law_name: Post-Buckling Amplitude Square-Root Scaling
  formula: A_fold = h_f sqrt((epsilon - epsilon_c) / epsilon_c)
  lean_decl: MathOfBiology.Loop_1796.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_1796.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_1796_asteroxylon_mackiei_elastic_buckling.lean#L26-L31
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 72 17 > 0 := by decide'
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Wrinkling lambda ~ h(E_f/E_s)^1/3
  source_citation: Turner (2024) DOI:10.1126/science
  code_locus: models/2024-turner-asteroxylon-mackiei-elastic-buckling.py#L31-L48
