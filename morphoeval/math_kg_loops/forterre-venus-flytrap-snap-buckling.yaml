sim_id: forterre-venus-flytrap-snap-buckling
math_family: "Doubly-Curved Shallow Shell Elastic Energy & Saddle-Node Cusp Catastrophe Controlled by Dimensionless Geometric Coupling α = L^4 κ_init^2 / h^2"
model_spec:
  model: "Forterre, Skotheim, Dumais & Mahadevan (2005) Nature 433:421-425 / Skotheim & Mahadevan (2005) Science 308:1308-1310 doubly-curved shallow shell snap-buckling in Dionaea muscipula"
  L_lobe_cm: 1.15
  h_lobe_cm: 0.045
  kappa_init_cm_inv: 0.187
  alpha_adult: 3.00
  nu_poisson: 0.28
  c_stretch: 1.60
  alpha_c: 0.80
  seed: 2005
  # Pass 3 (Section 3b) electro-mechanical coupling constants (modelling choices unless noted)
  ap_diffusivity_cm2_s: 1.5
  ap_tau_v_s: 0.005
  ap_tau_w_s: 0.5
  ap_threshold_a: 0.10
  ap_gamma: 0.5
  ap_beta_w: 0.10
  nagumo_front_speed_cm_s: 9.798
  trigger_hair_F_half_uN: 2.9
  trigger_hair_F_slope_uN: 0.6
  trigger_hair_footprint_cm: 0.15
  ca_increment_per_ap: 0.65
  ca_decay_tau_s: 40.0
  two_touch_memory_window_s: 24.76
  fem_mesh_h_cm: 0.03
  fem_dt_s: 0.0005
  inputs:
    - datasets/venus_flytrap_snap_buckling/venus_flytrap_snap_buckling_reference.json
    - datasets/venus_flytrap_snap_buckling/dionaea_muscipula_trap_lobe_specimen.jpg
    - datasets/venus_flytrap_snap_buckling/scout_manifest.json
    - datasets/venus_flytrap_snap_buckling/paper_citations.bib
    - datasets/venus_flytrap_snap_buckling/trigger_hair_ap_reference.json
equations:
  - law_name: "Gauss Curvature Stretching Penalty & Bistable Convex/Concave Wells Law"
    formula: "U_stretch(κ_x, κ_y) = c_stretch α (κ_x κ_y - κ_init^2)^2;  U_stretch(±κ_init, ±κ_init) = 0,  U_stretch(0, κ_y) = c_stretch α κ_init^4 > 0"
    lean_decl: "MathOfBiology.Loop_066.gauss_stretching_penalty"
    lean_theorem: "MathOfBiology.Loop_066.forterre_gauss_stretching_bistable_wells"
    lean_locus: "morphoeval/lean/loops/Loop_066_venus_flytrap_snap_buckling.lean#L30-L52"
    lean_code: |
      def gauss_stretching_penalty (kx ky k_init : Int) : Int :=
        (kx * ky - k_init * k_init) * (kx * ky - k_init * k_init)
      theorem forterre_gauss_stretching_bistable_wells (ky k_init : Int) :
          gauss_stretching_penalty k_init k_init k_init = 0 ∧
          gauss_stretching_penalty (-k_init) (-k_init) k_init = 0 ∧
          (∀ k : Nat, 0 < gauss_stretching_penalty 0 ky ((k : Int) + 1))
    variables: "κ_x, κ_y: principal shell curvatures perpendicular and parallel to the midrib (cm^-1); κ_init: initial open shell curvature (cm^-1); K_0 = κ_init^2: initial Gaussian curvature (cm^-2)"
    role: "Proves via Gauss's Theorema Egregium that both the open convex state (+κ_init, +κ_init) and the closed inverted concave state (-κ_init, -κ_init) have zero Gaussian stretching penalty, separated by a strictly positive stretching energy barrier at the flat pass (κ_x = 0)"
    source_citation: "Forterre, Skotheim, Dumais & Mahadevan (2005) Nature 433(7024):421-425 Eq. 1-3"
    code_locus: "2005-forterre-venus-flytrap-snap-buckling.py#L231-L281"

  - law_name: "Cusp Catastrophe Critical Coupling Threshold & Saddle-Node Snap-Through Law"
    formula: "α_c = (1 + ν) / (c_stretch κ_init^2);  α < α_c ⇒ monostable continuous bending;  α > α_c ⇒ bistable snap-through with |κ_x0,fold(α)| ∝ (α - α_c)^(3/2)"
    lean_decl: "MathOfBiology.Loop_066.flat_pass_stiffness"
    lean_theorem: "MathOfBiology.Loop_066.forterre_cusp_catastrophe_threshold"
    lean_locus: "morphoeval/lean/loops/Loop_066_venus_flytrap_snap_buckling.lean#L68-L82"
    lean_code: |
      def flat_pass_stiffness (alpha alpha_c : Int) : Int :=
        alpha_c - alpha
      theorem forterre_cusp_catastrophe_threshold (alpha alpha_c : Int) :
          (alpha < alpha_c ↔ 0 < flat_pass_stiffness alpha alpha_c) ∧
          flat_pass_stiffness alpha_c alpha_c = 0 ∧
          (alpha_c < alpha ↔ flat_pass_stiffness alpha alpha_c < 0)
    variables: "α: dimensionless geometric stretching-bending coupling; α_c: critical cusp catastrophe threshold (0.80); ν: Poisson ratio (0.28); κ_x0,fold(α): saddle-node fold threshold curvature"
    role: "Establishes the cusp catastrophe threshold α_c separating smooth monostable bending in subcritical leaves (α < α_c) from rapid 100 ms saddle-node snap-buckling in supercritical adult traps (α > α_c)"
    source_citation: "Forterre, Skotheim, Dumais & Mahadevan (2005) Nature 433(7024):421-425 Fig. 3b & Eq. 2-3; Skotheim & Mahadevan (2005) Science 308:1308-1310"
    code_locus: "2005-forterre-venus-flytrap-snap-buckling.py#L218-L451"

  - law_name: "Quartic Leaf-Size Scaling of Geometric Coupling α = L^4 κ_init^2 / h^2 & Surgical Ablation Law"
    formula: "α(L) = L^4 κ_init^2 / h^2,  α(2L) = 16 α(L),  α(L_eff = L/3) = α(L)/81 < α_c"
    lean_decl: "MathOfBiology.Loop_066.alpha_quartic_numerator"
    lean_theorem: "MathOfBiology.Loop_066.forterre_quartic_alpha_size_scaling"
    lean_locus: "morphoeval/lean/loops/Loop_066_venus_flytrap_snap_buckling.lean#L96-L111"
    lean_code: |
      def alpha_quartic_numerator (L_sq_sq k_init_sq : Int) : Int :=
        L_sq_sq * k_init_sq
      theorem forterre_quartic_alpha_size_scaling (L_sq_sq k_init_sq : Int) :
          alpha_quartic_numerator 0 k_init_sq = 0 ∧
          alpha_quartic_numerator (16 * L_sq_sq) k_init_sq = 16 * alpha_quartic_numerator L_sq_sq k_init_sq ∧
          (∀ k : Nat, 0 < alpha_quartic_numerator ((k : Int) + 1) 1)
    variables: "L: characteristic trap lobe half-size (cm); h: leaf thickness (cm); κ_init: initial open shell curvature (cm^-1); α: dimensionless geometric coupling parameter"
    role: "Explains why doubling leaf size L amplifies α 16-fold to drive adult traps into the bistable snap regime, while surgical curvature-relief strip cutting (L_eff = L/3) reduces α 81-fold below α_c and abolishes snapping"
    source_citation: "Forterre, Skotheim, Dumais & Mahadevan (2005) Nature 433(7024):421-425 p. 422-424; Sachse et al. (2020) PNAS 117:16035-16042"
    code_locus: "2005-forterre-venus-flytrap-snap-buckling.py#L178-L193"
    code_locus_secondary: "2005-forterre-venus-flytrap-snap-buckling.py#L605-L652"

  - law_name: "Trigger-Hair Mechanotransduction, P1-FEM Action Potential Propagation & Two-Touch Ca2+ Counting Law (Pass 3)"
    formula: "P_open(F) = 1/(1+exp(-(F-F_half)/F_slope));  dV/dt = D ∇²V + [V(V-a)(1-V) - β_w w]/τ_v,  dw/dt = (V - γ w)/τ_w  (P1 FEM, IMEX);  c = sqrt(2D/τ_v)(1/2 - a);  Ca_i(t) = Σ_k c_Ca e^{-(t - t_k - T_act,k(i))/τ_Ca};  Δ_max = τ_Ca ln(c_Ca/(1-c_Ca))"
    lean_decl: "MathOfBiology.Loop_066.ca_after_second"
    lean_theorem: "MathOfBiology.Loop_066.forterre_two_touch_calcium_counting"
    lean_locus: "morphoeval/lean/loops/Loop_066_venus_flytrap_snap_buckling.lean#L130-L150"
    lean_code: |
      def ca_after_second (c r : Int) : Int :=
        c + r
      theorem forterre_two_touch_calcium_counting (c θ : Int) :
          (c < θ → ca_after_second c 0 < θ) ∧
          (θ ≤ c + c → θ ≤ ca_after_second c c) ∧
          (∀ r₁ r₂ : Int, r₁ ≤ r₂ → ca_after_second c r₁ ≤ ca_after_second c r₂) ∧
          (∀ r : Int, 0 ≤ r → r ≤ c → ca_after_second c r ≤ c + c)
    variables: "F: trigger-hair bending force (µN); P_open: FLYC1 stretch-activated open probability; V, w: normalised membrane potential and recovery variable; D: electrotonic diffusivity (cm²/s); τ_v, τ_w: fast/slow time constants (s); a: excitation threshold; c: planar front speed (cm/s); T_act,k(i): FEM arrival time of AP k at node i; c_Ca: Ca2+ increment per AP (threshold units); τ_Ca: Ca2+ decay time (s); Δ_max: two-touch memory window (s)"
    role: "Replaces the Pass 2 prescribed trigger at t = 0 with a spatially resolved finite-element action potential initiated by a mechanosensitive trigger hair; the per-node Ca2+ counter reproduces the Dionaea rule that a single AP never closes the trap while two APs within the memory window do (single-touch negative control, 8-interval memory sweep bracketing the analytic window, sqrt(D) velocity scaling and h-refinement validations)"
    source_citation: "Hedrich & Neher (2018) Trends Plant Sci 23:220-234; Böhm et al. (2016) Curr Biol 26:286-295; Suda et al. (2020) Nat Plants 6:1219-1224; Scherzer et al. (2019) Nat Plants 5:670-675; Procko et al. (2021) eLife 10:e64250; Hodick & Sievers (1988) Planta 174:8-18; McKean (1970) Adv Math 4:209-223"
    code_locus: "2005-forterre-venus-flytrap-snap-buckling.py#L703-L931"
    code_locus_secondary: "2005-forterre-venus-flytrap-snap-buckling.py#L932-L1100"

  - law_name: "Ca2+-Gated Active Rest Curvature Electro-Mechanical Coupling Law (Pass 3)"
    formula: "A(t) = Σ_i M_i [Ca_i(t) ≥ 1] / Σ_i M_i;  dκ_x0/dt = (k_init + (kx0_final - k_init) A(t) - κ_x0)/τ_a;  m_eff κ_x'' + ζ κ_x' = -∂U/∂κ_x,  m_eff κ_y'' + ζ κ_y' = -∂U/∂κ_y"
    lean_decl: "MathOfBiology.Loop_066.gated_target_num"
    lean_theorem: "MathOfBiology.Loop_066.forterre_calcium_gated_rest_curvature"
    lean_locus: "morphoeval/lean/loops/Loop_066_venus_flytrap_snap_buckling.lean#L166-L184"
    lean_code: |
      def gated_target_num (k kf a n : Int) : Int :=
        k * n + (kf - k) * a
      theorem forterre_calcium_gated_rest_curvature (k kf n : Int) :
          gated_target_num k kf 0 n = k * n ∧
          gated_target_num k kf n n = kf * n ∧
          (kf < k → ∀ a₁ a₂ : Int, a₁ ≤ a₂ → gated_target_num k kf a₂ n ≤ gated_target_num k kf a₁ n)
    variables: "A(t): lumped-mass fraction of Ca2+-activated lobe area; M_i: P1 lumped mass of node i; κ_x0: active rest curvature (turgor-driven); k_init, kx0_final: open and closed rest-curvature targets; τ_a: turgor relaxation time (0.18 s); m_eff, ζ: effective inertia and damping of the Pass 2 shell solver"
    role: "Closes the electro-mechanical loop: no AP-activated motor area keeps κ_x0 pinned at k_init (trap stays open), whole-lobe activation drives the closed target and the snap through the saddle-node fold, and the target is monotone in A; the closure latency after the second touch (~0.35 s) emerges from FEM propagation + Ca2+ gating + shell dynamics"
    source_citation: "Forterre, Skotheim, Dumais & Mahadevan (2005) Nature 433:421-425; Volkov et al. (2008) Plant Physiol 146:694-702; Suda et al. (2020) Nat Plants 6:1219-1224"
    code_locus: "2005-forterre-venus-flytrap-snap-buckling.py#L993-L1067"
    code_locus_secondary: "2005-forterre-venus-flytrap-snap-buckling.py#L1068-L1100"
