sim_id: forterre-venus-flytrap-snap-buckling
math_family: "Doubly-Curved Shallow Shell Elastic Energy & Saddle-Node Cusp Catastrophe Controlled by Dimensionless Geometric Coupling α = L^4 κ_init^2 / h^2"
model_spec:
  model: "Forterre, Skotheim, Dumais & Mahadevan (2005) Nature 433:421-425 / Skotheim & Mahadevan (2005) Science 308:1308-1310 doubly-curved shallow shell snap-buckling in Dionaea muscipula"
  L_lobe_cm: 1.15
  h_lobe_cm: 0.045
  kappa_init_cm_inv: 0.187
  alpha_adult: 3.00
  nu_poisson: 0.28
  c_stretch: 1.60
  alpha_c: 0.80
  seed: 2005
  inputs:
    - datasets/venus_flytrap_snap_buckling/venus_flytrap_snap_buckling_reference.json
    - datasets/venus_flytrap_snap_buckling/dionaea_muscipula_trap_lobe_specimen.jpg
    - datasets/venus_flytrap_snap_buckling/scout_manifest.json
    - datasets/venus_flytrap_snap_buckling/paper_citations.bib
equations:
  - law_name: "Gauss Curvature Stretching Penalty & Bistable Convex/Concave Wells Law"
    formula: "U_stretch(κ_x, κ_y) = c_stretch α (κ_x κ_y - κ_init^2)^2;  U_stretch(±κ_init, ±κ_init) = 0,  U_stretch(0, κ_y) = c_stretch α κ_init^4 > 0"
    lean_decl: "MathOfBiology.Loop_066.gauss_stretching_penalty"
    lean_theorem: "MathOfBiology.Loop_066.forterre_gauss_stretching_bistable_wells"
    lean_locus: "morphoeval/lean/loops/Loop_066_venus_flytrap_snap_buckling.lean#L30-L52"
    lean_code: |
      def gauss_stretching_penalty (kx ky k_init : Int) : Int :=
        (kx * ky - k_init * k_init) * (kx * ky - k_init * k_init)
      theorem forterre_gauss_stretching_bistable_wells (ky k_init : Int) :
          gauss_stretching_penalty k_init k_init k_init = 0 ∧
          gauss_stretching_penalty (-k_init) (-k_init) k_init = 0 ∧
          (∀ k : Nat, 0 < gauss_stretching_penalty 0 ky ((k : Int) + 1))
    variables: "κ_x, κ_y: principal shell curvatures perpendicular and parallel to the midrib (cm^-1); κ_init: initial open shell curvature (cm^-1); K_0 = κ_init^2: initial Gaussian curvature (cm^-2)"
    role: "Proves via Gauss's Theorema Egregium that both the open convex state (+κ_init, +κ_init) and the closed inverted concave state (-κ_init, -κ_init) have zero Gaussian stretching penalty, separated by a strictly positive stretching energy barrier at the flat pass (κ_x = 0)"
    source_citation: "Forterre, Skotheim, Dumais & Mahadevan (2005) Nature 433(7024):421-425 Eq. 1-3"
    code_locus: "2005-forterre-venus-flytrap-snap-buckling.py#L140-L245"

  - law_name: "Cusp Catastrophe Critical Coupling Threshold & Saddle-Node Snap-Through Law"
    formula: "α_c = (1 + ν) / (c_stretch κ_init^2);  α < α_c ⇒ monostable continuous bending;  α > α_c ⇒ bistable snap-through with |κ_x0,fold(α)| ∝ (α - α_c)^(3/2)"
    lean_decl: "MathOfBiology.Loop_066.flat_pass_stiffness"
    lean_theorem: "MathOfBiology.Loop_066.forterre_cusp_catastrophe_threshold"
    lean_locus: "morphoeval/lean/loops/Loop_066_venus_flytrap_snap_buckling.lean#L68-L82"
    lean_code: |
      def flat_pass_stiffness (alpha alpha_c : Int) : Int :=
        alpha_c - alpha
      theorem forterre_cusp_catastrophe_threshold (alpha alpha_c : Int) :
          (alpha < alpha_c ↔ 0 < flat_pass_stiffness alpha alpha_c) ∧
          flat_pass_stiffness alpha_c alpha_c = 0 ∧
          (alpha_c < alpha ↔ flat_pass_stiffness alpha alpha_c < 0)
    variables: "α: dimensionless geometric stretching-bending coupling; α_c: critical cusp catastrophe threshold (0.80); ν: Poisson ratio (0.28); κ_x0,fold(α): saddle-node fold threshold curvature"
    role: "Establishes the cusp catastrophe threshold α_c separating smooth monostable bending in subcritical leaves (α < α_c) from rapid 100 ms saddle-node snap-buckling in supercritical adult traps (α > α_c)"
    source_citation: "Forterre, Skotheim, Dumais & Mahadevan (2005) Nature 433(7024):421-425 Fig. 3b & Eq. 2-3; Skotheim & Mahadevan (2005) Science 308:1308-1310"
    code_locus: "2005-forterre-venus-flytrap-snap-buckling.py#L250-L395"

  - law_name: "Quartic Leaf-Size Scaling of Geometric Coupling α = L^4 κ_init^2 / h^2 & Surgical Ablation Law"
    formula: "α(L) = L^4 κ_init^2 / h^2,  α(2L) = 16 α(L),  α(L_eff = L/3) = α(L)/81 < α_c"
    lean_decl: "MathOfBiology.Loop_066.alpha_quartic_numerator"
    lean_theorem: "MathOfBiology.Loop_066.forterre_quartic_alpha_size_scaling"
    lean_locus: "morphoeval/lean/loops/Loop_066_venus_flytrap_snap_buckling.lean#L96-L111"
    lean_code: |
      def alpha_quartic_numerator (L_sq_sq k_init_sq : Int) : Int :=
        L_sq_sq * k_init_sq
      theorem forterre_quartic_alpha_size_scaling (L_sq_sq k_init_sq : Int) :
          alpha_quartic_numerator 0 k_init_sq = 0 ∧
          alpha_quartic_numerator (16 * L_sq_sq) k_init_sq = 16 * alpha_quartic_numerator L_sq_sq k_init_sq ∧
          (∀ k : Nat, 0 < alpha_quartic_numerator ((k : Int) + 1) 1)
    variables: "L: characteristic trap lobe half-size (cm); h: leaf thickness (cm); κ_init: initial open shell curvature (cm^-1); α: dimensionless geometric coupling parameter"
    role: "Explains why doubling leaf size L amplifies α 16-fold to drive adult traps into the bistable snap regime, while surgical curvature-relief strip cutting (L_eff = L/3) reduces α 81-fold below α_c and abolishes snapping"
    source_citation: "Forterre, Skotheim, Dumais & Mahadevan (2005) Nature 433(7024):421-425 p. 422-424; Sachse et al. (2020) PNAS 117:16035-16042"
    code_locus: "2005-forterre-venus-flytrap-snap-buckling.py#L400-L545"
