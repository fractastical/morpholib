equations:
  - law_name: Gnomonic self-similarity of the tusk logarithmic spiral
    formula: "r_n = r0 * W^n  (W = exp(2 pi cot psi));  r_(n+1) = W r_n;  r_(m+n) r0 = r_m r_n"
    lean_decl: MathOfBiology.Loop_226.gnomon_radius
    lean_theorem: MathOfBiology.Loop_226.gnomon_radius_self_similar
    lean_locus: morphoeval/lean/loops/Thompson1917_T1917_032.lean#L31-L56
    lean_code: |
      def gnomon_radius (r0 W n : Nat) : Nat := r0 * W ^ n
      theorem gnomon_radius_succ (r0 W n : Nat) :
          gnomon_radius r0 W (n + 1) = W * gnomon_radius r0 W n := by
        unfold gnomon_radius
        rw [Nat.pow_succ]
        ac_rfl
      theorem gnomon_radius_self_similar (r0 W m n : Nat) :
          gnomon_radius r0 W (m + n) * r0 = gnomon_radius r0 W m * gnomon_radius r0 W n := by
        unfold gnomon_radius
        rw [Nat.pow_add]
        ac_rfl
    variables: "r0: radius vector at the tip/pole station; W: whorl expansion per revolution; n, m: whorl indices; r_n: radius after n whorls"
    role: "Thompson p. 633-634: the elongated tooth keeps the selfsame curvature law as it grows; each whorl is a magnified copy (gnomon) of the last; the Archimedean alternative fails this functional equation"
    source_citation: "Thompson (1917) Ch. XI equiangular spiral, Ch. XIII pp. 616-617, 633-634; Raup (1966) J. Paleont. 40:1178"
    code_locus: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py#L112-L131
  - law_name: Differential-accretion bending law (curvature falls with gnomonic width)
    formula: "bend_moment = vmax - vmin;  kappa * w = Delta;  w' = W * w, W > 1  =>  kappa' < kappa;  W = 1 => kappa' = kappa (circle)"
    lean_decl: MathOfBiology.Loop_226.bend_moment
    lean_theorem: MathOfBiology.Loop_226.accretion_curvature_falls_with_width
    lean_locus: morphoeval/lean/loops/Thompson1917_T1917_032.lean#L64-L115
    lean_code: |
      def bend_moment (vmax vmin : Int) : Int := vmax - vmin
      theorem bend_moment_swap_mirror (a b : Int) : bend_moment b a = - bend_moment a b := by
        unfold bend_moment
        omega
      theorem accretion_curvature_falls_with_width
          (kappa kappa' w W : Int) (hw : 0 < w) (hk : 0 < kappa) (hW : 1 < W)
          (hlaw : kappa' * (W * w) = kappa * w) : kappa' < kappa := by
        apply Int.not_le.mp
        intro hge
        have hWw_pos : 0 < W * w := Int.mul_pos (by omega) hw
        have h1 : kappa * (W * w) ≤ kappa' * (W * w) :=
          Int.mul_le_mul_of_nonneg_right hge (Int.le_of_lt hWw_pos)
        have hw_lt : w < W * w := by
          have : 1 * w < W * w := Int.mul_lt_mul_of_pos_right hW hw
          omega
        have h2 : kappa * w < kappa * (W * w) := Int.mul_lt_mul_of_pos_left hw_lt hk
        omega
    variables: "vmax, vmin: longitudinal growth rates on the convex (a) and concave (b) sides of the basal growth zone; kappa, kappa': curvature at two stations; w: section width; W: gnomonic width ratio between the stations; Delta: fixed growth-rate contrast"
    role: "Thompson p. 619 and p. 633: equal rates grow straight, unequal rates curve towards the slower side, mirror image when the sides are exchanged; a widening (tapered) tusk must be most curved at its tip and gentlest at its root, while a constant-section rodent incisor is a circular arc"
    source_citation: "Thompson (1917) Ch. XIII pp. 612, 619, 633-634"
    code_locus: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py#L136-L181
  - law_name: St Venant torsion curves of the twisted triangular prism
    formula: "tri_warp(x, y) = 3 x^2 y - y^3 (u_z up to tau/2a);  tri_warp(x, -y) = -tri_warp(x, y);  tri_warp(-x, y) = tri_warp(x, y);  tri_warp(x, 0) = 0;  ellipse_warp(a, b, x, y) = (b^2 - a^2) x y, ellipse_warp(a, a, x, y) = 0"
    lean_decl: MathOfBiology.Loop_226.tri_warp
    lean_theorem: MathOfBiology.Loop_226.tri_warp_anticlastic
    lean_locus: morphoeval/lean/loops/Thompson1917_T1917_032.lean#L122-L162
    lean_code: |
      def tri_warp (x y : Int) : Int := 3 * x * x * y - y * y * y
      theorem tri_warp_anticlastic (x y : Int) : tri_warp x (-y) = - tri_warp x y := by
        unfold tri_warp
        simp only [Int.mul_neg, Int.neg_mul, Int.neg_neg, Int.sub_neg, Int.neg_sub]
        omega
      theorem tri_warp_mirror (x y : Int) : tri_warp (-x) y = tri_warp x y := by
        unfold tri_warp
        simp only [Int.mul_neg, Int.neg_mul, Int.neg_neg]
      def ellipse_warp (a b x y : Int) : Int := (b * b - a * a) * x * y
      theorem ellipse_warp_circle_vanishes (a x y : Int) : ellipse_warp a a x y = 0 := by
        unfold ellipse_warp
        simp
    variables: "x, y: section coordinates with the centroid at the origin and the vertex X on +x (Thompson Fig. 321); a, b: semi-axes of the elliptic section; u_z: axial warping displacement; tau: twist rate"
    role: "Thompson pp. 621-623: a circular cylinder twists without warping, any other prism warps each section into an anticlastic surface whose contours (St Venant's torsion curves) make each face half convex / half concave; the Python script reproduces the six alternating sectors and overlays Fig. 321"
    source_citation: "St Venant (1856) Mem. Savants Etrangers 14:233-560; Thompson (1917) Fig. 321 p. 623"
    code_locus: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py#L186-L223
  - law_name: Uniform-torsion helix of the surface fibres
    formula: "helix_slope = tan(phi) = rho * tau;  pitch = 2 pi / tau;  Kiladze tan(alpha) = pi / (tau d);  rho1 < rho2, tau > 0 => helix_slope(rho1) < helix_slope(rho2);  sign(helix_slope) = sign(tau)"
    lean_decl: MathOfBiology.Loop_226.helix_slope
    lean_theorem: MathOfBiology.Loop_226.helix_slope_monotone_in_radius
    lean_locus: morphoeval/lean/loops/Thompson1917_T1917_032.lean#L171-L210
    lean_code: |
      def helix_slope (rho tau : Int) : Int := rho * tau
      theorem helix_slope_monotone_in_radius (rho1 rho2 tau : Int) (h : rho1 < rho2) (ht : 0 < tau) :
          helix_slope rho1 tau < helix_slope rho2 tau := by
        unfold helix_slope
        exact Int.mul_lt_mul_of_pos_right h ht
      theorem helix_slope_handedness_flip (rho tau : Int) : helix_slope rho (-tau) = - helix_slope rho tau := by
        unfold helix_slope
        exact Int.mul_neg rho tau
    variables: "rho, rho1, rho2: radial distance of a surface fibre from the tusk axis; tau: uniform twist rate (sign = handedness); phi: fibre inclination from the axis; d: tusk diameter; alpha: Kiladze & Chernova spiral-arc inclination"
    role: "Thompson pp. 617-622 torsion note applied to the twisted tusk: under uniform twist every groove is a helix whose inclination grows with radius and whose handedness is fixed by tau alone (sinistral in all narwhal tusks); the script measures the groove angle on the narwhal specimen and compares with Kiladze & Chernova (2018)"
    source_citation: "St Venant (1856); Kiladze & Chernova (2018) Data in Brief 21:1200, doi:10.1016/j.dib.2018.09.029; Kingsley & Ramsay (1988) Arctic 41:236"
    code_locus: thompson/claims/t1917-032_the-shapes-of-horns-and-of-teeth-or-tusks.py#L228-L242
