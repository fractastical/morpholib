sim_id: sumper-diatom-frustule-phase-sep
math_family: "Fourth-Order Cahn-Hilliard Spinodal Phase Separation PDE & Hierarchical Hexagonal Packing"
model_spec:
  model: "Sumper (2002) Science LCPA phase separation + Lenoci & Camp (2008) Langmuir hierarchical Cahn-Hilliard biosilica PDE"
  governing_pde: "d(phi)/dt = M * laplacian(phi^3 - phi - epsilon^2 * laplacian(phi))"
  dispersion_relation: "sigma(k) = M * k^2 * (1 - 3*phi0^2 - epsilon^2 * k^2)"
  grid_resolution: [128, 128]
  M: 1.0
  phi0_droplet: -0.30
  epsilon_primary: 1.50
  epsilon_secondary: 0.65
  seed: 2002
  pass3_directional_quench:
    quench_field: "a(r,t) = tanh((R0 + v_front * t - r) / w)   (a=+1 behind the centrifugal front, -1 ahead)"
    solidification_front: "R_s(t) = R(t) - lag, lag = 1.0 * lambda_c; frozen pixels have zero mobility, mass re-projected onto mobile region"
    grid_resolution: [160, 160]
    phi0_rib_layer: 0.0
    epsilon: 1.0
    v_front_default: 0.10
    v_front_sweep: [0.05, 0.10, 0.20, 0.40, 0.80]
  pass3_three_stage_single_domain:
    grid_resolution: [512, 512]
    nm_per_px: 12.5
    target_pitches_nm: [1850.0, 380.0, 75.0]
    epsilon_tiers: "eps_k = a_k_px * sqrt(1 - 3 phi0_k^2) / (2 pi sqrt 2)  (inverted from lambda_c)"
    phi0_tiers: [-0.30, -0.26, -0.26]
    confinement: "tier k runs in the same domain with tier k-1 silica walls frozen (zero mobility, neutral wall value)"
  inputs:
    - datasets/diatom_frustule_phase_sep/diatom_frustule_phase_sep_reference.json
    - datasets/diatom_frustule_phase_sep/coscinodiscus_diatom_specimen.jpg
    - datasets/diatom_frustule_phase_sep/scout_manifest.json
equations:
  - law_name: "Cahn-Hilliard (1958) / Lenoci & Camp (2008) Double-Well Chemical Potential & Binodal Phase Equilibria"
    formula: "μ(φ) = φ^3 - φ - ε^2 ∇^2 φ,   μ_bulk(±1) = 0,   μ_bulk(-φ) = -μ_bulk(φ)"
    lean_decl: "MathOfBiology.Loop_071.cahn_hilliard_bulk_mu"
    lean_theorem: "MathOfBiology.Loop_071.cahn_hilliard_binodal_equilibria"
    lean_locus: "morphoeval/lean/loops/Loop_071_diatom_frustule_phase_sep.lean#L21-L39"
    lean_code: |
      def cahn_hilliard_bulk_mu (phi : Int) : Int := phi * phi * phi - phi
      theorem cahn_hilliard_binodal_equilibria :
          cahn_hilliard_bulk_mu 1 = 0 ∧
          cahn_hilliard_bulk_mu (-1) = 0 ∧
          cahn_hilliard_bulk_mu 0 = 0 := by decide
    variables: "φ(x,y,t) ∈ [-1, 1]: order parameter (+1 silica wall, -1 LCPA droplet pore); ε: interfacial thickness parameter"
    role: "Defines the bistable double-well free energy driving spontaneous demixing of LCPA microdroplets from precipitating biosilica within the diatom SDV"
    source_citation: "Lenoci & Camp (2008) Langmuir 24(1):217-223 Eqs. (1)-(3); Cahn & Hilliard (1958) J. Chem. Phys. 28:258"
    code_locus: "2002-sumper-diatom-frustule-phase-sep.py#L178-L243"
  - law_name: "Fourth-Order Cahn-Hilliard Spinodal Dispersion & Wavelength Selection Law"
    formula: "∂_t φ = M ∇^2(φ^3 - φ - ε^2 ∇^2 φ) ⟹ σ(k) = M k^2 (1 - 3 φ_0^2 - ε^2 k^2),  k_c = √((1 - 3 φ_0^2)/(2 ε^2)),  λ_c = 2π / k_c"
    lean_decl: "MathOfBiology.Loop_071.cahn_hilliard_dispersion"
    lean_theorem: "MathOfBiology.Loop_071.cahn_hilliard_spinodal_band_selection"
    lean_locus: "morphoeval/lean/loops/Loop_071_diatom_frustule_phase_sep.lean#L48-L69"
    lean_code: |
      def cahn_hilliard_dispersion (M alpha eps_sq q : Int) : Int :=
        M * q * (alpha - eps_sq * q)
      theorem cahn_hilliard_mass_conservation_zero_mode (M alpha eps_sq : Int) :
          cahn_hilliard_dispersion M alpha eps_sq 0 = 0 := by simp [cahn_hilliard_dispersion]
      theorem cahn_hilliard_spinodal_band_selection :
          cahn_hilliard_dispersion 1 4 1 2 = 4 ∧
          cahn_hilliard_dispersion 1 4 1 4 = 0 ∧
          cahn_hilliard_dispersion 1 (-2) 1 1 = -3 := by decide
    variables: "M: mobility; φ_0: mean composition; α = 1 - 3 φ_0^2: spinodal instability drive; q = k^2: squared wavenumber; k_c: fastest-growing wavenumber"
    role: "Selects the characteristic pore spacing λ_c = 2π/k_c inside the spinodal (|φ_0| < 1/√3) while guaranteeing exact mass conservation (σ(0)=0) and stability outside the spinodal"
    source_citation: "Lenoci & Camp (2008) Langmuir 24(1):217-223 Section 2; Sumper (2002) Science 295:2430"
    code_locus: "2002-sumper-diatom-frustule-phase-sep.py#L124-L171"
    code_locus_secondary: "2002-sumper-diatom-frustule-phase-sep.py#L837-L878"
  - law_name: "Sumper (2002) Hierarchical LCPA Droplet Subdivision & Centered Hexagonal Packing Law"
    formula: "d_m = d_1 ρ^{m-1},   a_m = a_1 ρ^{m-1},   H(R) = 1 + 3 R (R + 1) ∈ {1, 7, 19, 37, ...}"
    lean_decl: "MathOfBiology.Loop_071.centered_hexagonal_droplets"
    lean_theorem: "MathOfBiology.Loop_071.sumper_2002_hierarchical_hex_packing"
    lean_locus: "morphoeval/lean/loops/Loop_071_diatom_frustule_phase_sep.lean#L78-L96"
    lean_code: |
      def centered_hexagonal_droplets (R : Nat) : Nat := 1 + 3 * R * (R + 1)
      theorem sumper_2002_hierarchical_hex_packing (s0 ratio : Nat) :
          sumper_tier_scale s0 ratio 2 = ratio * (ratio * s0) ∧
          centered_hexagonal_droplets 1 = 7 ∧
          centered_hexagonal_droplets 2 = 19 := by
        simp [sumper_tier_scale, centered_hexagonal_droplets]
    variables: "m ∈ {1, 2, 3}: hierarchical tier (foramen, cribrum, cribrella); ρ ≈ 0.18: inter-tier scale ratio; R: hexagonal ring number"
    role: "Explains the self-similar hierarchical nesting of 7 to 19 secondary cribrum pores inside each primary hexagonal areola and tertiary cribrella sieve pores in Coscinodiscus"
    source_citation: "Sumper (2002) Science 295(5564):2430-2433 Figs. 1-4; Losic et al. (2006) J. Nanosci. Nanotechnol. 6:982"
    code_locus: "2002-sumper-diatom-frustule-phase-sep.py#L244-L331"
    code_locus_secondary: "2002-sumper-diatom-frustule-phase-sep.py#L600-L724"
  - law_name: "Furukawa (1992) Directional (Centrifugal) Quench: Stability Ahead of the Advancing Front"
    formula: "a(r,t) = tanh((R0 + v t - r)/w);  ahead of the front a = -1:  σ(k) = M k^2 (-1 - ε^2 k^2) < 0  ∀ k ≠ 0;  behind it a = +1 (spinodal)"
    lean_decl: "MathOfBiology.Loop_071.cahn_hilliard_dispersion"
    lean_theorem: "MathOfBiology.Loop_071.directional_quench_stable_ahead_of_front"
    lean_locus: "morphoeval/lean/loops/Loop_071_diatom_frustule_phase_sep.lean#L105-L118"
    lean_code: |
      theorem directional_quench_stable_ahead_of_front
          (M eps_sq q : Int) (hM : 0 < M) (hq : 0 < q) (he : 0 ≤ eps_sq) :
          cahn_hilliard_dispersion M (-1) eps_sq q < 0 := by
        unfold cahn_hilliard_dispersion
        have hMq : 0 < M * q := Int.mul_pos hM hq
        have heq : 0 ≤ eps_sq * q := Int.mul_nonneg he (Int.le_of_lt hq)
        have hneg : -1 - eps_sq * q < 0 := by omega
        have := Int.mul_lt_mul_of_pos_left hneg hMq
        simpa using this
    variables: "R0: initial quench radius; v: centrifugal front speed (px/time); w: front width; a(r,t) ∈ [-1, 1]: local quench drive; q = k^2"
    role: "Couples the Cahn-Hilliard equation to the radially advancing silica-precipitation front: the mixture is linearly stable until the front passes, after which demixing proceeds; slow fronts (Pe = v/(λ_c σ_max) ≲ 0.1) select radial, bifurcating costae lamellae, fast fronts concentric lamellae"
    source_citation: "Furukawa H (1992) Physica A 180:128-155; Schmid & Volcani (1983) J. Phycol. 19:387 (centrifugal valve silicification); Sumper (2002) Science 295:2430"
    code_locus: "2002-sumper-diatom-frustule-phase-sep.py#L405-L538"
    code_locus_secondary: "2002-sumper-diatom-frustule-phase-sep.py#L540-L580"
  - law_name: "Lagging Silica-Precipitation Front: Frozen Region Inside the Quenched Disc & Irreversible Solidification"
    formula: "R(t) = R0 + v t,  R_s(t) = R(t) - lag;  0 < lag ∧ 0 < R_s(t1) ⟹ R_s(t1) < R(t1);  t1 ≤ t2 ⟹ R(t1) ≤ R(t2) ∧ R_s(t1) ≤ R_s(t2)"
    lean_decl: "MathOfBiology.Loop_071.solidification_radius"
    lean_theorem: "MathOfBiology.Loop_071.frozen_front_monotone_irreversible"
    lean_locus: "morphoeval/lean/loops/Loop_071_diatom_frustule_phase_sep.lean#L120-L144"
    lean_code: |
      def quench_front_radius (R0 v t : Nat) : Nat := R0 + v * t
      def solidification_radius (R0 v lag t : Nat) : Nat := quench_front_radius R0 v t - lag
      theorem frozen_front_monotone_irreversible (R0 v lag t1 t2 : Nat)
          (hlag : 0 < lag) (hsolid : 0 < solidification_radius R0 v lag t1) (ht : t1 ≤ t2) :
          solidification_radius R0 v lag t1 < quench_front_radius R0 v t1 ∧
          quench_front_radius R0 v t1 ≤ quench_front_radius R0 v t2 ∧
          solidification_radius R0 v lag t1 ≤ solidification_radius R0 v lag t2 := by
        unfold solidification_radius quench_front_radius at *
        have hv : v * t1 ≤ v * t2 := Nat.mul_le_mul_left v ht
        omega
    variables: "lag = 1.0 λ_c: distance between quench and precipitation fronts; frozen pixels: zero mobility, value held, leaked mass re-projected onto mobile pixels (exact total conservation)"
    role: "Guarantees the model never freezes un-quenched mixture and that silica precipitation is irreversible; the same frozen-wall mechanism confines tiers 2-3 of the explicit 3-stage 512x512 single-domain quench to the unsolidified chambers of the previous tier"
    source_citation: "Sumper (2002) Science 295:2430 (sequential LCPA droplet subdivision with intervening silica precipitation); Lenoci & Camp (2008) Langmuir 24:217 Sec. 3.3"
    code_locus: "2002-sumper-diatom-frustule-phase-sep.py#L600-L724"
    code_locus_secondary: "2002-sumper-diatom-frustule-phase-sep.py#L178-L243"
