- law_name: Voltage-Gated Gap-Junction Boltzmann Conductance
  formula: G_ij = G_max / (1 + exp(((V_i - V_j)^2 - V_0^2) / V_T^2))
  lean_decl: MathOfBiology.Loop_1999.law2_balance
  lean_theorem: MathOfBiology.Loop_1999.law2_exact_cancellation
