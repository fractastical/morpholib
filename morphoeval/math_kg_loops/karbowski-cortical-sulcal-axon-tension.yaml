sim_id: karbowski-cortical-sulcal-axon-tension
math_family: "Viscoelastic Cortico-Cortical Axonal Tension Mechanics, Laminar Volume Conservation & Universal Gyrification Scaling"
model_spec:
  model: "Van Essen (1997) Nature 385:313-318, Hilgetag & Barbas (2006) PLoS Comput. Biol. 2:e22 & Mota & Herculano-Houzel (2015) Science 349:74-77 cortico-cortical axonal tension and cortical folding"
  axon_stiffness_k_a: 1.35
  bending_modulus_B_c: 2.40
  towed_growth_rate_gamma_a: 0.085
  mhh_universal_exponent_alpha: 1.25
  seed: 1997
  inputs:
    - datasets/cortical_sulcal_axon_tension/cortical_sulcal_axon_tension_reference.json
    - datasets/cortical_sulcal_axon_tension/coronal_cortex_axon_tracts_specimen.jpg
    - datasets/cortical_sulcal_axon_tension/scout_manifest.json
    - datasets/cortical_sulcal_axon_tension/paper_citations.bib
equations:
  - law_name: "Van Essen (1997) Cortico-Cortical Axonal Tension & Chord-vs-Arc Gyral Wiring Economy"
    formula: "F_axon = sum_{i<j} k_a C_{ij} (||x_i - x_j|| - L_{0,ij})_+ + E_bend(κ);  ΔV_wire = C_{ij} (d_arc - d_chord) > 0 for C_strong > C_weak"
    lean_decl: "MathOfBiology.Loop_090.wiring_volume_saving"
    lean_theorem: "MathOfBiology.Loop_090.van_essen_gyral_wiring_economy"
    lean_locus: "morphoeval/lean/loops/Loop_090_cortical_sulcal_axon_tension.lean#L36-L49"
    lean_code: |
      def wiring_volume_saving (C d_arc d_chord : Int) : Int :=
        C * d_arc - C * d_chord
      theorem van_essen_gyral_wiring_economy (C_strong C_weak d_chord delta : Int) :
          wiring_volume_saving C_strong d_chord d_chord = 0 ∧
          wiring_volume_saving C_strong (d_chord + delta) d_chord -
            wiring_volume_saving C_weak (d_chord + delta) d_chord =
            (C_strong - C_weak) * delta
    variables: "C_{ij}: cortico-cortical axonal connectivity density; d_arc: unfolded geodesic surface arc distance (mm); d_chord: 3D Euclidean trans-gyral chord distance (mm); k_a: axonal spring constant"
    role: "Establishes that viscoelastic tension along dense cortico-cortical white-matter tracts pulls strongly connected areas together across outward gyral crowns to minimize 3D wiring volume while weakly connected zones fold inward as sulcal fundi"
    source_citation: "Van Essen (1997) Nature 385:313-318 Fig. 1-3; Toro & Burnod (2005) Cerebral Cortex 15:1900-1913; Karbowski (2001) Phys. Rev. Lett. 86:3674"
    code_locus: "2020-karbowski-cortical-sulcal-axon-tension.py#L144-L516"

  - law_name: "Hilgetag & Barbas (2006) Isometric Laminar Volume Conservation & Gyral-vs-Sulcal Thickness Dichotomy"
    formula: "V_col = A_surf * h = A_0 * h_0  ⇒  h_gyrus = h_0 / λ_{t,gyrus} > h_wall = h_0 > h_fundus = h_0 / λ_{t,fundus}"
    lean_decl: "MathOfBiology.Loop_090.laminar_volume_residual"
    lean_theorem: "MathOfBiology.Loop_090.hilgetag_barbas_laminar_thickness_dichotomy"
    lean_locus: "morphoeval/lean/loops/Loop_090_cortical_sulcal_axon_tension.lean#L63-L73"
    lean_code: |
      def laminar_volume_residual (A_surf h A_ref h_ref : Int) : Int :=
        A_surf * h - A_ref * h_ref
      theorem hilgetag_barbas_laminar_thickness_dichotomy (A_0 h_0 k m d : Int) :
          laminar_volume_residual (k * A_0) (m * h_0) (m * A_0) (k * h_0) = 0 ∧
          (k + d) * h_0 - k * h_0 = d * h_0
    variables: "V_col: cortical column volume; A_surf: local tangential surface area; h: radial cortical thickness (mm); λ_t: tangential strain factor (λ_{t,gyrus} = 0.78 < 1 < λ_{t,fundus} = 1.26)"
    role: "Proves that isometric volume conservation under gyral tangential compression and sulcal tangential stretching produces systematically thicker gyral crowns and thinner sulcal fundi (h_gyrus / h_fundus ≈ 1.62)"
    source_citation: "Hilgetag & Barbas (2006) PLoS Comput. Biol. 2(3):e22 Eq. 1-4 & Fig. 2-6"
    code_locus: "2020-karbowski-cortical-sulcal-axon-tension.py#L156-L561"

  - law_name: "Mota & Herculano-Houzel (2015) Universal Mammalian Cortical Folding Power Law"
    formula: "A_T sqrt(h) = k A_E^(5/4)  ⇔  A_T^4 h^2 = k^4 A_E^5,  with GI = A_T / A_E = k h^(-1/2) A_E^(1/4) ≥ 1.0"
    lean_decl: "MathOfBiology.Loop_090.mota_herculano_houzel_residual"
    lean_theorem: "MathOfBiology.Loop_090.mota_herculano_houzel_universal_scaling"
    lean_locus: "morphoeval/lean/loops/Loop_090_cortical_sulcal_axon_tension.lean#L85-L99"
    lean_code: |
      def mota_herculano_houzel_residual (A_T_pow4 h_pow2 k_pow4 A_E_pow5 : Int) : Int :=
        A_T_pow4 * h_pow2 - k_pow4 * A_E_pow5
      def gyrification_area_excess (A_T A_E : Int) : Int :=
        A_T - A_E
      theorem mota_herculano_houzel_universal_scaling (A_E h_pow2 k_pow4 : Int) :
          gyrification_area_excess A_E A_E = 0 ∧
          mota_herculano_houzel_residual (k_pow4 * A_E) h_pow2 k_pow4 (A_E * h_pow2) = 0 ∧
          mota_herculano_houzel_residual (16 * k_pow4 * A_E) h_pow2 k_pow4 (16 * A_E * h_pow2) = 0
    variables: "A_T: total pial cortical surface area (mm^2); A_E: exposed convex-hull surface area (mm^2); h: mean cortical gray-matter thickness (mm); k: dimensionless axonal-tension folding constant; GI: 3D gyrification index"
    role: "Unifies mammalian cortical folding across 12 species spanning lissencephalic rodents to gyrencephalic primates and cetaceans with universal log-log slope α = 5/4 = 1.25"
    source_citation: "Mota & Herculano-Houzel (2015) Science 349(6243):74-77 Eq. 3-5 & Fig. 2-3"
    code_locus: "2020-karbowski-cortical-sulcal-axon-tension.py#L168-L633"
