- law_name: Critical Compressive Buckling Strain Threshold
  formula: epsilon_c = (1 / 4) (3 E_s / E_f)^(2/3)
  lean_decl: MathOfBiology.Loop_1818.law2_balance
  lean_theorem: MathOfBiology.Loop_1818.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1818_varanus_komodoensis_elastic_buckling.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Gyri, Villi, Loops & Snap-Shells in Varanus komodoensis\
    \ (524 \xB5m)"
  source_citation: Maisano (2020) DOI:10.1002/ar.2020.1818
  code_locus: models/2020-maisano-varanus-komodoensis-elastic-buckling.py#L31-L48
- law_name: Post-Buckling Amplitude Square-Root Scaling
  formula: A_fold = h_f sqrt((epsilon - epsilon_c) / epsilon_c)
  lean_decl: MathOfBiology.Loop_1818.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_1818.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_1818_varanus_komodoensis_elastic_buckling.lean#L26-L31
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 81 18 > 0 := by decide'
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for Wrinkling lambda ~ h(E_f/E_s)^1/3
