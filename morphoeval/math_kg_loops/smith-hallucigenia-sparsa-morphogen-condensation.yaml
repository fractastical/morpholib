- law_name: Exponential Morphogen Decay Length
  formula: C(x) = C_0 exp(-x / lambda_m),  lambda_m = sqrt(D_m / k_deg)
  lean_decl: MathOfBiology.Loop_1343.law1_invariant
  lean_theorem: MathOfBiology.Loop_1343.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_1343_hallucigenia_sparsa_morphogen_condensation.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: 'a, b: positive morphogenetic scaling factors at characteristic scale
    L = 3.3 mm'
  role: Primary scaling invariant for Morphogen Gradient Positional Condensation (3.3
    mm) in Hallucigenia sparsa
  source_citation: Smith (2016) DOI:10.1038/nature14573
  code_locus: models/2016-smith-hallucigenia-sparsa-morphogen-condensation.py#L31-L48
- law_name: French-Flag Boundary Position Scaling
  formula: x_theta = lambda_m ln(C_0 / theta_c)
  lean_decl: MathOfBiology.Loop_1343.law2_balance
  lean_theorem: MathOfBiology.Loop_1343.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1343_hallucigenia_sparsa_morphogen_condensation.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: Conservation balance for Skeletal Rays & Joints in Hallucigenia sparsa (3.3
    mm)
  source_citation: Smith (2016) DOI:10.1038/nature14573
  code_locus: models/2016-smith-hallucigenia-sparsa-morphogen-condensation.py#L31-L48
- law_name: Periodic Condensation Wavelength under Cell Traction
  formula: k_cond^2 = (tau_0 n_0 - E_ecm) / (2 mu_b)
  lean_decl: MathOfBiology.Loop_1343.law3_threshold_margin
  lean_theorem: MathOfBiology.Loop_1343.law3_instability_criterion
  lean_locus: morphoeval/lean/loops/Loop_1343_hallucigenia_sparsa_morphogen_condensation.lean#L26-L31
  lean_code: 'def law3_threshold_margin (lhs rhs : Int) : Int := lhs - rhs

    theorem law3_instability_criterion : law3_threshold_margin 70 17 > 0 := by decide'
  variables: 'lhs, rhs: bifurcating pattern instability threshold'
  role: Critical bifurcation criterion for French-Flag / PSHM Thresholds
  source_citation: Smith (2016) DOI:10.1038/nature14573
