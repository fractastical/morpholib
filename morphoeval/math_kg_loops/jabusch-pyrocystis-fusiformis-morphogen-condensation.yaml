- law_name: French-Flag Boundary Position Scaling
  formula: x_theta = lambda_m ln(C_0 / theta_c)
  lean_decl: MathOfBiology.Loop_1380.law2_balance
  lean_theorem: MathOfBiology.Loop_1380.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1380_pyrocystis_fusiformis_morphogen_condensation.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Skeletal Rays & Joints in Pyrocystis fusiformis\
