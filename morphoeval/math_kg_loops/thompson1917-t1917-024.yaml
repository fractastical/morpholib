equations:
- law_name: Plateau Equiangular Junction (Thompson P1, Fig. 214 F)
  formula: "gamma_1 = gamma_2 = gamma_3 = g  =>  cos theta_i = (g^2 - g^2 - g^2)/(2 g^2) = -1/2  =>  theta_i = 120 deg"
  lean_decl: MathOfBiology.Loop_219.cosNum
  lean_theorem: MathOfBiology.Loop_219.plateau_equiangular_junction
  lean_locus: morphoeval/lean/loops/Thompson1917_T1917_024.lean#L48-L66
  lean_code: |
    def cosNum (g1 g2 g3 : Int) : Int := g1 * g1 - g2 * g2 - g3 * g3
    def cosDen (g2 g3 : Int) : Int := 2 * (g2 * g3)
    theorem plateau_equiangular_junction (g : Int) (hg : 0 < g) :
        2 * cosNum g g g + cosDen g g = 0 ∧ 0 < cosDen g g
  variables: "g: common specific tension of the three cell interfaces; cosNum/cosDen: law-of-cosines numerator/denominator (E3)"
  role: "Primary geometric prediction: a deposit in the partitions of three equal-tension cells is an equiangular triradiate"
  source_citation: "Thompson (1917) On Growth and Form p. 445; Plateau (1873)"
  code_locus: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py#neumann_angles
- law_name: Sagittal Two-Equal-One-Unequal Symmetry (Thompson P2, Fig. 214 A, C)
  formula: "gamma_cc = c, gamma_cm = m (x2)  =>  cos theta_2 = cos theta_3 = -c/(2m); cos theta_1 = (c^2 - 2m^2)/(2m^2)"
  lean_decl: MathOfBiology.Loop_219.cosDen
  lean_theorem: MathOfBiology.Loop_219.sagittal_paired_angles_equal
  lean_locus: morphoeval/lean/loops/Thompson1917_T1917_024.lean#L74-L80
  lean_code: |
    theorem sagittal_paired_angles_equal (c m : Int) :
        cosNum m c m = cosNum m m c ∧ cosDen c m = cosDen m c
  variables: "c: cell-cell partition tension; m: cell-medium surface tension"
  role: "Symmetry constraint tested on the SEM plate: the two angles flanking the cell-cell ray are equal"
  source_citation: "Thompson (1917) pp. 445-446"
  code_locus: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py#sagittal_angles
- law_name: Equiangularity Iff Equal Specific Tensions (Thompson E6)
  formula: "cosNum(c,m,m) cosDen(c,m) - cosNum(m,c,m) cosDen(m,m) = 2 c m (c - m)(c + 2m);  theta_unpaired = theta_pair  <=>  c = m"
  lean_decl: MathOfBiology.Loop_219.sagittal_cosine_difference_factorisation
  lean_theorem: MathOfBiology.Loop_219.sagittal_equiangular_iff_equal_tensions
  lean_locus: morphoeval/lean/loops/Thompson1917_T1917_024.lean#L87-L138
  lean_code: |
    theorem sagittal_cosine_difference_factorisation (c m : Int) :
        cosNum c m m * cosDen c m - cosNum m c m * cosDen m m
          = 2 * ((c * m) * ((c - m) * (c + 2 * m)))
    theorem sagittal_equiangular_iff_equal_tensions (c m : Int) (hc : 0 < c) (hm : 0 < m) :
        cosNum c m m * cosDen c m = cosNum m c m * cosDen m m ↔ c = m
  variables: "c, m > 0 integer tensions (scale-free)"
  role: "Thompson's 'modified by any inequality in the specific tensions' made exact and bidirectional"
  source_citation: "Thompson (1917) p. 445"
  code_locus: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py#tension_ratio_from_angles
- law_name: Sagittal Ordering, Monotone Closing and the T-Shaped Limit (Thompson E5a, p. 443)
  formula: "0 < c < m  =>  theta_unpaired > theta_pair;  d cos(theta_unpaired)/dc > 0;  c = 0 -> cos = -1 (180 deg);  c = 2m -> cos = +1"
  lean_decl: MathOfBiology.Loop_219.cosNum
  lean_theorem: MathOfBiology.Loop_219.sagittal_unpaired_angle_ordering_and_T_limit
  lean_locus: morphoeval/lean/loops/Thompson1917_T1917_024.lean#L150-L185
  lean_code: |
    theorem sagittal_unpaired_angle_ordering_and_T_limit (c c' m : Int)
        (hc : 0 < c) (hcm : c < m) (hcc' : c < c') :
        cosNum c m m * cosDen c m < cosNum m c m * cosDen m m
        ∧ cosNum c m m < cosNum c' m m
        ∧ cosNum 0 m m = -(cosDen m m)
        ∧ cosNum (2 * m) m m = cosDen m m
  variables: "c < c': two cell-cell tensions; m: cell-medium tension"
  role: "Falsifiable sign prediction F4 (unpaired angle >= paired angle in sagittal spicules) and the 'two rays nearly in a straight line, at right angles to the third' limit"
  source_citation: "Thompson (1917) p. 443, pp. 445-446"
  code_locus: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py#sagittal_angles
- law_name: Tetrahedral and Orthogonal Ray Systems (Thompson P3, Fig. 214 E; hexactine limit)
  formula: "sum_i t_i = 0 for the 4 cube body diagonals, t_i . t_j = -1 on |t|^2 = 3 (cos = -1/3, 109.47 deg); 6 axial rays: adjacent t_i . t_j = 0 (90 deg)"
  lean_decl: MathOfBiology.Loop_219.V3.dot
  lean_theorem: MathOfBiology.Loop_219.tetrahedral_and_orthogonal_ray_systems
  lean_locus: morphoeval/lean/loops/Thompson1917_T1917_024.lean#L187-L231
  lean_code: |
    theorem tetrahedral_and_orthogonal_ray_systems :
        (tet1.add tet2).add (tet3.add tet4) = V3.zero
        ∧ tet1.dot tet1 = 3 ∧ tet1.dot tet2 = -1 ∧ ... ∧ tet3.dot tet4 = -1
        ∧ ((ex.add ey).add ez).add ((nex.add ney).add nez) = V3.zero
        ∧ ex.dot ey = 0 ∧ ex.dot ez = 0 ∧ ey.dot ez = 0 ∧ ex.dot nex = -1 ∧ ... := by decide
  variables: "tet1..tet4: integer body-diagonal ray vectors; ex..nez: axial ray vectors"
  role: "Four-cell (tetractine) and six-ray (hexactine, Carduispongia) limiting cases; P3 is UNTESTABLE on the 2D plate and is carried by proof only"
  source_citation: "Thompson (1917) p. 446; Nadhira et al. (2019) doi:10.1098/rsos.190911"
  code_locus: thompson/claims/t1917-024_on-concretions-spicules-and-spicular-skeletons.py#polyhedral_ray_angles
