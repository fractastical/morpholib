    lean_theorem: MathOfBiology.Loop_3213.homogeneous_trace_negative
    lean_locus: morphoeval/lean/loops/Loop_3213_dugesia_japonica_turing_wavelength_s0.lean#L21-L23
    variables: "trace of the saturated Jacobian at (u0, v0)"
