    lean_theorem: MathOfBiology.Loop_3213.slot3213_diffusion_gap_positive
    lean_locus: morphoeval/lean/loops/Loop_3213_dugesia_japonica_turing_wavelength_s0.lean#L17-L19
    variables: "r = 48, f_u milli-rate 468, inhibitor removal milli-rate 1598"
    role: Necessary condition for a 6.912 µm unstable band in Holocene Dugesia japonica pigment kinetics
    source_citation: "Schnakenberg 1979 doi:10.1016/0022-5193(79)90042-0; Turing 1952 doi:10.1098/rstb.1952.0012"
    code_locus: models/2026-delphi10000-dugesia-japonica-turing-wavelength-s0.py#L139-L156
  - law_name: Homogeneous steady state is stable without diffusion
    formula: "f_u + g_v < 0, integer shadow 468 - 1598 < 0"
