- law_name: Dimensionless Target Shape Index Rigidity Threshold
  formula: p_0 = P_0 / sqrt(A_0),  p_0^* = 3.813 (fluid-to-solid jamming)
  lean_decl: MathOfBiology.Loop_1635.law2_balance
  lean_theorem: MathOfBiology.Loop_1635.law2_exact_cancellation
  lean_locus: morphoeval/lean/loops/Loop_1635_manis_javanica_vertex_packing.lean#L18-L24
  lean_code: 'def law2_balance (p q : Int) : Int := p + q - q

    theorem law2_exact_cancellation (p q : Int) : law2_balance p q = p := by dsimp
    [law2_balance]; omega'
  variables: 'p, q: flux/stress conservation terms'
  role: "Conservation balance for Polygonal Packing & Furrows in Manis javanica (88\
    \ \xB5m)"
  source_citation: Wang (2020) DOI:10.1016/actbio.2020.1635
  code_locus: models/2020-wang-manis-javanica-vertex-packing.py#L31-L48
- law_name: Lewis Linear Area-to-Side Scaling Law
  formula: <A_n> / <A> = (n - 2) / 4
