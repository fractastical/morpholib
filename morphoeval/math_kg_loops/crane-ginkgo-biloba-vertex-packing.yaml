- law_name: 2D Vertex Mechanical Energy Functional
  formula: E_vertex = (K_A / 2) (A - A_0)^2 + (K_P / 2) (P - P_0)^2
  lean_decl: MathOfBiology.Loop_1624.law1_invariant
  lean_theorem: MathOfBiology.Loop_1624.law1_positive_scaling
  lean_locus: morphoeval/lean/loops/Loop_1624_ginkgo_biloba_vertex_packing.lean#L10-L16
  lean_code: 'def law1_invariant (a b : Int) : Int := a * b

    theorem law1_positive_scaling (a b : Int) (ha : 0 < a) (hb : 0 < b) : 0 < law1_invariant
    a b := by dsimp [law1_invariant]; exact Int.mul_pos ha hb'
  variables: "a, b: positive morphogenetic scaling factors at characteristic scale\
    \ L = 123 \xB5m"
  role: "Primary scaling invariant for Epithelial Vertex Energy & Topological Packing\
    \ (123 \xB5m) in Ginkgo biloba"
  source_citation: Crane (2017) DOI:10.2307/yale.2017.1624
