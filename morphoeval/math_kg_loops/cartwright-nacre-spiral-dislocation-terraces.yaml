sim_id: cartwright-nacre-spiral-dislocation-terraces
math_family: "Burton-Cabrera-Frank (BCF) Screw-Dislocation Eikonal Step-Flow & Chiral Defect Pair Dynamics"
model_spec:
  model: "Cartwright & Checa (2007) J. R. Soc. Interface + Cartwright et al. (2009) PNAS Burton-Cabrera-Frank screw-dislocation spiral and Frank-Read target terrace dynamics in molluscan nacre"
  step_velocity_law: "v_n(kappa) = v_inf * (1 - r_c * kappa),   v(r) = v_inf * (1 - r_c / r)"
  archimedean_pitch_law: "lambda_0 = (2 * pi / omega_0) * r_c ≈ 18.9848 * r_c ≈ 19 * r_c"
  angular_frequency_law: "omega = omega_0 * (v_inf / r_c) ≈ 0.3310 * (v_inf / r_c)"
  v_inf_um_per_hr: 1.25
  r_c_um: 0.42
  h_0_um: 0.50
  seed: 2007
  inputs:
    - datasets/nacre_spiral_dislocation_terraces/nacre_spiral_dislocation_terraces_reference.json
    - datasets/nacre_spiral_dislocation_terraces/nacre_aragonite_tablets_specimen.jpg
    - datasets/nacre_spiral_dislocation_terraces/scout_manifest.json
equations:
  - law_name: "Burton-Cabrera-Frank (1951) & Cartwright-Checa (2007) Gibbs-Thomson Curved Terrace Step Velocity Law"
    formula: "v_n(κ) = v_∞ (1 - r_c κ),   v(r) = v_∞ (1 - r_c / r)   (r ≥ r_c)"
    lean_decl: "MathOfBiology.Loop_073.gibbs_thomson_velocity_num"
    lean_theorem: "MathOfBiology.Loop_073.bcf_gibbs_thomson_critical_arrest"
    lean_locus: "morphoeval/lean/loops/Loop_073_nacre_spiral_dislocation_terraces.lean#L24-L48"
    lean_code: |
      def gibbs_thomson_velocity_num (v_inf r r_c : Int) : Int :=
        v_inf * (r - r_c)
      theorem bcf_gibbs_thomson_critical_arrest (v_inf r_c : Int) :
          gibbs_thomson_velocity_num v_inf r_c r_c = 0 ∧
          gibbs_thomson_velocity_num 5 6 4 = 10 := by
        simp [gibbs_thomson_velocity_num]
    variables: "v_n: normal aragonite terrace step velocity; v_∞: planar straight-step velocity; r_c: critical Gibbs-Thomson nucleation radius; r = 1/κ: local terrace curvature radius"
    role: "Arrests mineral terrace propagation at the critical curvature radius r = r_c and drives outer terrace turns faster than inner turns until a steady rotating spiral forms"
    source_citation: "Burton, Cabrera & Frank (1951) Phil. Trans. R. Soc. A 243:299-358 Eq. (18); Cartwright & Checa (2007) J. R. Soc. Interface 4:491-504 Sec. 2"
    code_locus: "2007-cartwright-nacre-spiral-dislocation-terraces.py#L130-L240"
  - law_name: "BCF Archimedean Spiral Terrace Pitch & Vertical Nacre Accretion Scaling Law"
    formula: "λ_0 = (2π / ω_0) r_c ≈ 18.9848 r_c ≈ 19 r_c,   ω = ω_0 (v_∞ / r_c),   V_z = h_0 v_∞ / λ_0"
    lean_decl: "MathOfBiology.Loop_073.bcf_archimedean_pitch"
    lean_theorem: "MathOfBiology.Loop_073.bcf_archimedean_terrace_pitch_scaling"
    lean_locus: "morphoeval/lean/loops/Loop_073_nacre_spiral_dislocation_terraces.lean#L54-L78"
    lean_code: |
      def bcf_archimedean_pitch (r_c : Nat) : Nat := 19 * r_c
      def nacre_vertical_growth_invariant (h_0 v_inf : Nat) : Nat := h_0 * v_inf
      theorem bcf_archimedean_terrace_pitch_scaling (k r_c h_0 v_inf : Nat) :
          bcf_archimedean_pitch (r_c * k) = bcf_archimedean_pitch r_c * k ∧
          nacre_vertical_growth_invariant h_0 v_inf = v_inf * h_0 := by
        simp [bcf_archimedean_pitch, nacre_vertical_growth_invariant, Nat.mul_assoc, Nat.mul_comm]
    variables: "λ_0: asymptotic Archimedean inter-step terrace spacing; ω_0 ≈ 0.3310: BCF dimensionless eigenvalue; h_0 ≈ 0.50 µm: inter-lamellar chitin-protein mortar spacing; V_z: vertical column/sheet growth rate"
    role: "Determines the universal ratio λ_0 / r_c ≈ 19 separating tightly wound gastropod tower nacre (Haliotis, Gibbula) from broad bivalve terraced sheet nacre (Pteria, Pinctada)"
    source_citation: "Cartwright & Checa (2007) J. R. Soc. Interface 4:491-504 Sec. 2-3; Burton, Cabrera & Frank (1951) Phil. Trans. R. Soc. A 243:299-358"
    code_locus: "2007-cartwright-nacre-spiral-dislocation-terraces.py#L140-L330"
  - law_name: "Cartwright et al. (2009) Chiral Dislocation Dipole & Frank-Read Target Terrace Law"
    formula: "b_net = b_1 + b_2: (+b, -b) ⇒ b_net = 0 (closed target rings for d > 2 r_c; annihilation for d ≤ 2 r_c); (+b, +b) ⇒ b_net = 2b (double spiral)"
    lean_decl: "MathOfBiology.Loop_073.net_burgers_charge"
    lean_theorem: "MathOfBiology.Loop_073.cartwright_frank_read_topological_burgers_algebra"
    lean_locus: "morphoeval/lean/loops/Loop_073_nacre_spiral_dislocation_terraces.lean#L84-L108"
    lean_code: |
      def net_burgers_charge (b_1 b_2 : Int) : Int := b_1 + b_2
      def frank_read_nucleation_excess (d r_c : Int) : Int := d - 2 * r_c
      theorem cartwright_frank_read_topological_burgers_algebra (b : Int) :
          net_burgers_charge b (-b) = 0 ∧
          net_burgers_charge b b = 2 * b ∧
          frank_read_nucleation_excess 8 4 = 0 := by
        dsimp [net_burgers_charge, frank_read_nucleation_excess]; omega
    variables: "b_1, b_2 ∈ {±1}: screw dislocation Burgers chiralities; d: inter-core separation; 2 r_c: critical Frank-Read pinch-off diameter"
    role: "Explains how opposite-chirality screw-dislocation dipoles (+b, -b) act as biological Frank-Read sources emitting closed concentric target terraces in bivalve sheet nacre when d > 2 r_c while pinching off below 2 r_c"
    source_citation: "Cartwright, Checa, Escribano & Sainz-Díaz (2009) PNAS 106(26):10499-10504 Figs. 1-4; Cartwright & Checa (2007) J. R. Soc. Interface 4:491-504"
    code_locus: "2007-cartwright-nacre-spiral-dislocation-terraces.py#L245-L450"
  # ---------------------------------------------------------------- Pass 3 (v3) additions
  - law_name: "Aragonite {110} Cyclic Twinning & [100]/[010] Step-Velocity Anisotropy of the BCF Spiral Core (Pass 3)"
    formula: "A_single(θ) = 1 + e_2 cos 2(θ−θ_0) + e_6 cos 6(θ−θ_0),  e_2 = (v_100/v_010 − 1)/(v_100/v_010 + 1),  v_100/v_010 = a√3/b = 1.0785;  A_twin(θ) = (1/3) Σ_{j=0..2} A_single(θ − jτ),  τ = 2 atan(a/b) = 63.82°,  misfit 3τ − 180° = 11.46°;  f_m = |Σ_j e^{i m j τ}|/3  (f_2 = 0.074, f_6 = 0.947)"
    lean_decl: "MathOfBiology.Loop_073.cyclic_twin_misfit_tenths"
    lean_theorem: "MathOfBiology.Loop_073.aragonite_cyclic_twin_angular_misfit"
    lean_locus: "morphoeval/lean/loops/Loop_073_nacre_spiral_dislocation_terraces.lean#L113-L133"
    lean_code: |
      def cyclic_twin_misfit_tenths (tau : Int) : Int := 3 * tau - 1800
      theorem aragonite_cyclic_twin_angular_misfit (tau d : Int) :
          cyclic_twin_misfit_tenths 600 = 0 ∧
          cyclic_twin_misfit_tenths 638 = 114 ∧
          cyclic_twin_misfit_tenths (tau + d) - cyclic_twin_misfit_tenths tau = 3 * d := by
        dsimp [cyclic_twin_misfit_tenths]; omega
    variables: "a = 4.9611 Å, b = 7.9672 Å: orthorhombic Pmcn aragonite lattice (De Villiers 1971); τ: {110} twin angle; e_2, e_6: 2-fold (orthorhombic) and 6-fold (pseudo-hexagonal facet) kinetic anisotropy amplitudes; f_m: twin-averaging suppression factor of the m-th harmonic"
    role: "Polygonizes the spiral core: cyclic twinning suppresses the orthorhombic 2-fold elongation of the terrace contour to 7.4 % while retaining 94.7 % of the pseudo-hexagonal 6-fold polygonization of aragonite nacre tablets"
    source_citation: "De Villiers JPR (1971) Am. Mineral. 56:758-767; Cartwright & Checa (2007) J. R. Soc. Interface 4:491-504 (pseudo-hexagonal aragonite tablets); Burton, Cabrera & Frank (1951) Sec. 9 (anisotropic spiral)"
    code_locus: "2007-cartwright-nacre-spiral-dislocation-terraces.py#L524-L643"
    code_locus_secondary: "2007-cartwright-nacre-spiral-dislocation-terraces.py#L255-L262"
  - law_name: "Kinematic Wulff Anisotropic Terrace Pitch λ(θ) = λ_0 A(θ) (Pass 3)"
    formula: "λ(θ) ω = 2π v(θ) = 2π v_∞ A(θ);  λ_100 / λ_010 = v_100 / v_010;  eikonal travel T(r)/A(θ) with T(r) = k_0 (r − r_c) + (ω r_c / v_∞) ln(r / r_c)"
    lean_decl: "MathOfBiology.Loop_073.anisotropic_pitch_num"
    lean_theorem: "MathOfBiology.Loop_073.anisotropic_terrace_pitch_linear_in_step_speed"
    lean_locus: "morphoeval/lean/loops/Loop_073_nacre_spiral_dislocation_terraces.lean#L135-L153"
    lean_code: |
      def anisotropic_pitch_num (v_theta : Nat) : Nat := 2 * v_theta
      theorem anisotropic_terrace_pitch_linear_in_step_speed (a v v₁ v₂ : Nat) :
          anisotropic_pitch_num (a * v) = a * anisotropic_pitch_num v ∧
          anisotropic_pitch_num (v₁ + v₂) = anisotropic_pitch_num v₁ + anisotropic_pitch_num v₂ := by
        dsimp [anisotropic_pitch_num]; constructor
        · rw [Nat.mul_left_comm]
        · rw [Nat.mul_add]
    variables: "λ(θ): direction-dependent inter-terrace pitch; A(θ) = v(θ)/v_∞: step-speed anisotropy factor; T(r): Cabrera-Levine radial travel"
    role: "Converts direction-dependent step speed into a direction-dependent spiral pitch, so the terrace contour r_n(θ) = T⁻¹(A(θ)·2πn) is a polygon whose Fourier harmonics measure the crystallographic anisotropy"
    source_citation: "Burton, Cabrera & Frank (1951) Phil. Trans. R. Soc. A 243:299-358; Cartwright et al. (2012) Phil. Trans. R. Soc. A 370:2866-2885"
    code_locus: "2007-cartwright-nacre-spiral-dislocation-terraces.py#L561-L602"
  - law_name: "Driven Allen-Cahn Chitin Inter-Lamellar Membrane Perforation & Mineral-Bridge Stacking (Pass 3)"
    formula: "∂φ/∂t = M [ε² ∇²φ − W'(φ) + β (S_k − S_0) g'(φ)],  W = φ²(1−φ)²,  g = φ²(3−2φ);  spinodal S_crit = S_0 + 1/(3β) = 0.683;  S_k = F_k · max(A_g e^{−|x−c_{k−1}|²/2σ²}, P_k),  F_k = [level(x,y) ≥ k] ∧ |x − c_{k−1}| ≤ D_tab/2,  A_g = min(1, (0.1 D_tab/σ)²);  stacking offset |c_k − c_{k−1}| / D_tab"
    lean_decl: "MathOfBiology.Loop_073.membrane_double_well"
    lean_theorem: "MathOfBiology.Loop_073.chitin_membrane_perforation_bistability"
    lean_locus: "morphoeval/lean/loops/Loop_073_nacre_spiral_dislocation_terraces.lean#L155-L181"
    lean_code: |
      def membrane_double_well (q : Int) : Int := q ^ 2 * (2 - q) ^ 2
      def membrane_double_well_deriv (q : Int) : Int := 4 * q * (2 - q) * (1 - q)
      theorem chitin_membrane_perforation_bistability :
          membrane_double_well 0 = 0 ∧ membrane_double_well 2 = 0 ∧ membrane_double_well 1 = 1 ∧
          membrane_double_well_deriv 0 = 0 ∧ membrane_double_well_deriv 2 = 0 ∧
          membrane_double_well_deriv 1 = 0 := by decide
    variables: "φ_k ∈ [0,1]: perforation phase field of chitin membrane k (0 intact, 1 perforated); S_k: drive from mineral-bridge localisation (σ) and random pores (P_k) gated by the eikonal terrace footprint F_k; c_k: mineral-bridge site of sheet k; D_tab: tablet diameter"
    role: "Couples the 2D eikonal terrace solver to a stacked-sheet 3D membrane model: bistability lets a bridge site be inherited sheet-to-sheet, so columnar gastropod nacre (σ ≈ 0.1 D_tab → offset 0) and brick-wall bivalve sheet nacre (σ ≳ 0.12 D_tab → pore-random offset ≈ 0.2-0.3 D_tab) emerge from one parameter"
    source_citation: "Cartwright & Checa (2007) J. R. Soc. Interface 4:491-504 Sec. 4; Schäffer et al. (1997) Chem. Mater. 9:1731-1740; Checa, Cartwright & Willinger (2011) J. Struct. Biol. 176:330-339"
    code_locus: "2007-cartwright-nacre-spiral-dislocation-terraces.py#L645-L885"
