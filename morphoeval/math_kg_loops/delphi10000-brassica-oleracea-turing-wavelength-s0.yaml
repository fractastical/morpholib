    role: What changes relative to the nominal primordium tier (same chronospecies, coarser scale)
    source_citation: Slot scale definition; wavelength law as in Turing 1952
    code_locus: models/2026-delphi10000-brassica-oleracea-turing-wavelength-s0.py#L77-L86
  - law_name: Cell-scale successor is outside the selected wave
    formula: lambda_detail / lambda_cell = 172/15 = 11; sigma(k_15µm) < 0
    lean_decl: MathOfBiology.Loop_3137.cell_successor_is_not_the_selected_wave
    lean_theorem: MathOfBiology.Loop_3137.cell_successor_is_not_the_selected_wave
