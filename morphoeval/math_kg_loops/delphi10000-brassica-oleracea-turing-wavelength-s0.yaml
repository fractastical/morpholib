    lean_decl: MathOfBiology.Loop_3137.detail_patch_holds_24_waves
    lean_theorem: MathOfBiology.Loop_3137.detail_patch_holds_24_waves
    lean_locus: morphoeval/lean/loops/Loop_3137_brassica_oleracea_turing_wavelength_s0.lean#L17-L19
    variables: k, D_u, D_v, Jacobian entries at the Schnakenberg steady state
    role: Selected wavenumber at 172 µm on a 4128 µm patch (24 waves)
    source_citation: Turing 1952 DOI:10.1098/rstb.1952.0012; Schnakenberg 1979 DOI:10.1016/0022-5193(79)90042-0
    code_locus: models/2026-delphi10000-brassica-oleracea-turing-wavelength-s0.py#L112-L130
  - law_name: Nominal-tier versus detail-variant peak count
    formula: N = floor(4128 µm / lambda); N(100 µm) = 41 > N(172 µm) = 24
    lean_decl: MathOfBiology.Loop_3137.nominal_tier_packs_more_peaks
    lean_theorem: MathOfBiology.Loop_3137.nominal_tier_packs_more_peaks
    lean_locus: morphoeval/lean/loops/Loop_3137_brassica_oleracea_turing_wavelength_s0.lean#L22-L24
