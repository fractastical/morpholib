# MorphoEval — faithfulness rubric for the morphology simulations in this repo.
#
# Sibling of BioEval / NeuroEval (Zenodo): a versioned, weighted rubric whose
# dimensions are scored 0-100 per evaluated item, with an Overall score that is
# the weighted mean.  Where the siblings score *papers* for transparency and
# information-theoretic rigor, MorphoEval scores *our own simulation scripts* for
# faithfulness to the biology and to the source model, so each script can be
# checkpointed and re-scored after changes.
#
# Two top-level groups, decomposed into three orthogonal sub-axes:
#   faithfulness (weight 70), split into:
#     * model-implementation (weight 30: model-fidelity 20 + parameter-expressivity 10)
#       — does the code implement and exercise the published mathematical/formal model?
#     * biological-validation (weight 40: specimen-match 25 + morphometric-validation 15)
#       — does the output visually and quantitatively match biological specimens?
#   reproducibility (weight 30: source-traceability 10 + code-traceability 8 + repro-package 12)
#     — can someone else re-run it and trace code and data to their sources?
# Separating model-implementation from biological-validation is essential: a
# script can faithfully implement a scientifically inadequate model, and
# matching a static silhouette or cartoon does not validate a generative
# developmental mechanism.
#
# Score semantics (uncalibrated rubric scores, NOT probabilities):
#   Scores on [0, 100] are criterion-referenced ordinal/interval ratings, not
#   calibrated frequentist or Bayesian probabilities.  A score of 76 does not
#   mean a 76% probability that the reproduction is faithful.  When serialized
#   into the governed ProbKnow rubric-assessment template (RAOAK6Fe), value / 100
#   is written to pk:hasScore (ontology >= 1.2), which is defined as an
#   uncalibrated score on the unit interval and is never pk:hasProbability
#   (project-delphi-ontology #12).  The claim's pk:weightOfEvidence = overall / 100
#   is the same rescaling and may be omitted via
#   `build_morphoeval_kg.py --omit-probability`.
#
# Scoring rule and N/A handling:
#   Score what the evidence supports; do not credit unverifiable claims and do
#   not invent gaps.  When a dimension is genuinely not applicable (flagged
#   `not_applicable: true`), substituting `neutral_baseline: 50` shrinks the
#   weighted mean toward 50: s_padded = (1 - alpha) * s_app + 50 * alpha, which
#   penalises scripts with s_app > 50 and rewards scripts with s_app < 50.
#   Only weight renormalisation over applicable dimensions (s_app) is
#   mathematically neutral; downstream reports therefore report both the
#   renormalised applicable-only mean (s_app) and the baseline-50 padded score.
#
# Philosophical note — Single-Species Specimen Simulations vs. Substrate-Independent
# Formal Law Syntheses (see docs/BIOLOGICAL_LAW_CRITERIA.md §6):
#   MorphoEval's biological-validation sub-axis (weight 40: specimen-match 25 +
#   morphometric-validation 15) embodies an empirical-specimen standard: a model is
#   judged by how closely its output matches a real organism's anatomy and published
#   wet-lab measurements.  When MorphoEval is applied to a cross-substrate theoretical
#   or mathematical synthesis (e.g. `levin-youtube-channel-math`, which formalises
#   a priori T1 mathematical theorems and T2/T4 substrate-independent biophysical
#   invariants across multiple systems without a single anatomical specimen), a genuine
#   philosophical tension arises between Empirical Specimen Particularism (Mayr 1982;
#   Beatty 1995) and Substrate-Independent Platonic Formalism (Thompson 1917; Sober
#   1997; Levin 2022/2025).  In such audits, referees may score `specimen-match`
#   directly (yielding a lower overall score that reflects the absence of direct
#   wet-lab specimen overlays, e.g. 63.5/100) while downstream reports simultaneously
#   record the applicable-only model/reproducibility score (e.g. 76.6/100) alongside
#   the orthogonal O1/O2, T1–T4, and C1–C6 epistemic badges.

id: morphoeval
name: MorphoEval simulation-faithfulness rubric
version: 0.1.0
scale: {min: 0, max: 100, neutral_baseline: 50}
# Expressed in the ProbKnow ontology (no rubric-specific namespace), shaped by the
# ProbKnow Space's governed templates (https://w3id.org/spaces/probknow):
#   rubric    -> pkr:concept/morphoeval-rubric-<version>  a pk:Concept (rubric template)
#   dimension -> pkr:concept/morphoeval-<version>-<id>    a pk:Concept
#   score     -> pkr:assessment/morphoeval-<sim>-<id> a pk:LLMClaimAssessment
#                (rubric-assessment template): <claim> pk:hasAssessment <it>,
#                dct:subject the dimension concept, pk:assessmentType
#                "morphoeval/<version>/<id>", pk:hasScore = value / scale.max
#                (uncalibrated rubric score on [0, 1]), pk:hasVerdict band,
#                pk:hasEvidence -> pk:EvidenceItem per evidence entry / measurement
#   overall   -> the same, with the rubric itself as dct:subject; the pk:Claim
#                carries pk:weightOfEvidence = overall / max
ontology: https://w3id.org/probknow/ontology/

# Provenance & Claim-Boundary extensions (schema in morphoeval/schema.yaml;
# adapted from MesmerPrism/rusty-manifold-provenance & rusty-manifold-audit):
#   - spec_fingerprint: SHA-256 of canonical JSON model parameters, grid/mesh
#     resolution, and RNG seed (invariant to Matplotlib/Pillow rendering changes)
#   - artifact_sha256: byte-level SHA-256 of rendered PNG/GIF/CSV artifacts
#   - input_dataset_sha256: verified SHA-256 digests of upstream dataset fixtures
#   - supersedes / supersedes_audit_id: fail-closed acyclic audit version chain
#   - claim_boundary: structured 4-tier boundary (reported_in_source,
#     reconstructed_in_script, transfer_boundary, does_not_claim)
provenance_schema:
  spec_fingerprint_format: "sha256_hex_64"
  artifact_sha256_format: "sha256_hex_64"
  input_dataset_sha256_format: "map<filename, sha256_hex_64>"
  supersession_chain_policy: "fail_closed_acyclic"
  claim_boundary_tiers:
    - reported_in_source
    - reconstructed_in_script
    - transfer_boundary
    - does_not_claim

dimensions:
  - id: model-fidelity
    group: faithfulness
    sub_group: model-implementation
    weight: 20
    name: Model fidelity to source
    question: >-
      Does the code implement the equations / algorithm of the cited source
      model as published (not a loose analogue), with parameters defined the
      way the source defines them?

  - id: specimen-match
    group: faithfulness
    sub_group: biological-validation
    weight: 25
    name: Morphological realism / specimen match
    question: >-
      Does the rendered output resemble real specimens of the organism and/or
      the source authors' own figures, judged side by side?  Distinct
      morphologies must be visually distinct.

  - id: parameter-expressivity
    group: faithfulness
    sub_group: model-implementation
    weight: 10
    name: Parameter expressivity
    question: >-
      Does each morphospace parameter visibly and monotonically control the
      feature of form it is supposed to control across its stated range?

  - id: morphometric-validation
    group: faithfulness
    sub_group: biological-validation
    weight: 15
    name: Morphometric validation
    question: >-
      Are quantitative morphometrics computed on the output and compared
      against values measured on real specimens or reported in the literature?

  - id: source-traceability
    group: reproducibility
    sub_group: reproducibility
    weight: 10
    name: Source and data traceability
    question: >-
      Are the source paper (DOI/PMID), code repository and any input data
      resolvable identifiers, and is input provenance recorded?

  - id: code-traceability
    group: reproducibility
    sub_group: reproducibility
    weight: 8
    name: Code-to-model traceability
    question: >-
      Can each modelling step in the code be traced to a specific equation,
      section or figure of the source?

  - id: repro-package
    group: reproducibility
    sub_group: reproducibility
    weight: 12
    name: Reproducibility package
    question: >-
      Pinned dependencies, deterministic seeds, documented invocation, and a
      known-good environment; environment-induced result corruption counts
      against this dimension.
